name: Refresh Daily News

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "0 1 * * *" # 10:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: true

jobs:
  refresh-news:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and filter today's news
        run: python scripts/update_news.py

      - name: Show published news counts
        run: |
          python - <<'PY'
          import json
          data = json.load(open("news.json", encoding="utf-8"))
          print("Date:", data["date"])
          print("Total:", data["total"])
          for day_key, day in data["days"].items():
              print(f'{day["label"]}: {day["total"]}')
              for name, rows in day["categories"].items():
                  print(f"  {name}: {len(rows)}")
          PY

      - name: Commit refreshed news data for fallback access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh today's news data"
            git push
          fi

