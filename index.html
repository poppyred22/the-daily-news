window.NEWS_DATA = {"date":"2026-11-24","generatedAt":"2026-11-24T11:07:47.628227+09:00","total":150,"days":{"today":{"date":"2026-11-24","weekday":"화요일","label":"오늘 · 11월 24일 화요일","total":50,"categories":{"사건 사고":[{"title":"추락하는 이카로스의 날개, 파닥이는 샤갈의 색채","link":"https://n.news.naver.com/mnews/article/018/0006414620","naverLink":"https://n.news.naver.com/mnews/article/018/0006414620","pubDate":"2026-11-24T11:06:08.208811+09:00","author":"네이버뉴스","description":"퐁피두센터 한화 '샤갈, 너머의 여정' 24일 개막 1908년 초기부터 1970년대 만년까지 망라 격변시대 맞물린 일생 좇은 예술세계 조명 사랑·환희 담은 파리시절의 걸작 퍼레이드 전쟁·망명 등 고통 옮긴 검고 탁한 작품들도 회화·조각·도자 65점…국내 첫 공개 61점 서울 영등포구 여의도 퐁피두센터 한화 ‘샤갈, 너머의 여정’ 전경. 앞쪽으로 마르크 샤갈의 회화 ‘에펠탑의 신랑 신부’(1938∼1939, 150×136.5㎝)가 걸렸다. 1933년 그린 ‘에펠탑’과 ‘수탉 위의 연인’ 두 변주작의 모티프를 결합한 작품이다. 서사의 흐름으로 볼 때 1915년 아내 벨라 로젠펠트와 치른 유대식 결혼, 프랑스에서의 현재, 미래의 알 수 없는 여정 등이 읽힌다. 후대는 불붙은 촛대를 든 천사가 마을로 떨어지는 부분으로 샤갈이 유럽 유대인의 비극을 두려워하는 ‘불안한 행복’을 드러내려 했다고 해석한다(사진=오현주 문화전문기자). [오현주 문화전문기자] “화가는 결코 예술작품과 관람객 사이에 끼어들어서는 안 된다. 작가가 자신의 작품을 설명하면 오히려 작품을 제한한다. 작가 사후에 어떤 관점이 생겨나는 편이 낫다. 화가의 말은 시야를 가릴 뿐이다.” 1944년 마르크 샤갈(1887∼1985)이 ‘드문’ 인터뷰를 했다. 짐작컨대 누군가 앞에 앉아 질문을 받고 대답하는 형식은 처음이었을 거다. 샤갈의 말을 어렵게 끌어낸 이는 큐레이터 제임스 존슨 스위니. 이 내용은 스위니가 기획해 2년 뒤 미국 뉴욕현대미술관(MoMA)에서 개막한 ‘샤갈 회고전’의 도록에 실렸다. ‘자신의 작품에 대해 말을 아끼고 글을 꺼렸다’는 샤갈의 상황은 스위니의 후기에서 얻어낸 사실이다. 퐁피두센터 한화 ‘샤갈, 너머의 여정’ 전경. 앞쪽으로 마르크 샤갈의 ‘포도주잔을 든 이중 초상화’(1917∼1918, 235×137㎝)이 걸렸다. 1915년 벨라 로젠펠트와 결혼한 샤갈이 이듬해 딸 이다의 탄생으로 이어진 절정의 행복감을 드러낸 대작 중 하나다. 러시아 혁명기 부부가 함께 품었던 희망과 기쁨을 열정적이고 자유분방하게 표현했다(사진=오현주 문화전문기자).","category":"사건 사고"},{"title":"'김치 싸대기' 맞던 젠슨 황…11일 만에 영웅 부활 '밈 폭발' [영상]","link":"https://n.news.naver.com/mnews/article/015/0005357447","naverLink":"https://n.news.naver.com/mnews/article/015/0005357447","pubDate":"2026-11-24T11:06:07.507939+09:00","author":"네이버뉴스","description":"젠슨 황 엔비디아 CEO 복귀 소식에 AI 밈 화제…조롱에서 영웅으로 부활 위축된 투자심리에 환호하는 분위기 출처=SNS 젠슨 황 엔비디아 최고경영자(CEO)가 화려한 폭죽과 함께 공연장 무대 위로 솟아오른다. 관중석에선 리사 수 AMD CEO와 샘 올트먼 오픈AI CEO가 열광한다. 선글라스를 벗은 황 CEO가 화려한 몸짓을 선보이자 팀 쿡 애플 CEO도 환호한다. '팝의 황제' 마이클 잭슨의 공연 영상에 글로벌 빅테크 수장들의 모습을 인공지능(AI)으로 합성한 영상이다. 불륜 스캔들로 물러났던 황 CEO가 11일 만에 전격 복귀하면서 전 세계 온라인 커뮤니티와 사회관계망서비스(SNS)에 각종 AI 밈(meme·인터넷 유행 콘텐츠)이 쏟아지고 있다. 사생활 논란으로 한때 조롱의 대상이 됐던 그가 AI 영상 속에서 영웅으로 부활한 것이다. 24일 엑스(X·옛 트위터) 등에는 황 CEO의 복귀를 소재로 한 패러디 영상이 잇따라 올라오고 있다. 마이클 잭슨과 황 CEO를 합성한 영상부터 할리우드 영화, 프로레슬링, 스포츠 경기 등의 명장면을 활용한 영상까지 종류도 다양하다. 출처=SNS","category":"사건 사고"},{"title":"아이젠코트 \"이란 공격할 즉각적 이유 없다\"…네타냐후와 정면충돌","link":"https://n.news.naver.com/mnews/article/018/0006414631","naverLink":"https://n.news.naver.com/mnews/article/018/0006414631","pubDate":"2026-11-24T11:06:07.507885+09:00","author":"네이버뉴스","description":"아이젠코트 \"차기정부 구성 전 이란의 직접적 위협 없어\" 네타냐후 \"위협 축소하는 건 정치적 계산\", 거국내각 압박 야샤르·리쿠드 3차 연정 협상…돌파구 없이 평행선 시한은 내달 6일…연정 실패시 '소수 비상정부' 카드도 [이데일리 김정유 기자] 이스라엘 차기 정부 구성 임무를 맡은 가디 아이젠코트 전 군참모총장이 이란을 당장 공격할 이유가 없다며 베냐민 네타냐후 과도정부 총리와 정면으로 맞섰다. 최근 연정 협상이 공전하면서 아이젠코트 진영이 소수 정부 구성까지 검토하고 있다는 분석도 나온다. 베냐민 네타냐후 이스라엘 총리(왼쪽)와 가디 아이젠코트 전 이스라엘군 참모총장. (사진=로이터) 23일(현지시간) AFP통신 보도에 따르면 아이젠코트는 이날 예루살렘 크네세트(의회)에서 열린 기자회견에서 “이란은 이스라엘에 가장 심각한 위협”이라면서도 “다만, 현 시점에서 정부 구성 전에 행동이 필요할 만큼 직접적이고 즉각적인 위협은 보이지 않는다”고 말했다. 이란 공격 문제를 차기 정부 출범 이후로 넘기겠다는 의미로 풀이된다. 이에 네타냐후 총리는 즉각 반박했다. 그는 TV연설에서 “우리를 둘러싼 거대한 위협 앞에서 단결이 필요하다”고 “우리를 둘러싼 중대한 위협을 경시하거나 축소하는 건 정치적 이유 때문”이라고 비판했다. 아이젠코트의 발언을 정치적으로 몰아세운 것이다. 두 사람의 설전은 이날 오후 양측의 3차 연정 협상을 몇 시간 앞두고 나왔다. 아이젠코트의 중도 성향 야샤르당과 네타냐후의 우파 리쿠드당 대표단은 전날인 22일에도 4시간 동안 만나 서로의 입장을 밝혔지만 돌파구를 찾지 못했다. 앞서 야샤르당은 21일 이번 협상과 관련해 “가능한 한 가장 폭넓은 정부를 구성하려는 진정한 의지”라고 밝히고 있지만, 리쿠드당은 거국내각 참여 조건으로 네타냐후를 겨냥한 모든 인신공격과 정치적 보이콧 중단을 내걸고 있는 상황이다. 아이젠코트는 다음 달 6일까지 정부를 구성해야 한다. 시한은 14일 연장할 수 있다. 지난 달 총선에서 양 진영 모두 과반을 확보하지 못해서다. 아이젠코트 진영은 48석으로 과반인 61석에 못 미친다. 61석을 채우지 못하면 소수 정부를 구성할 수도 있다. 진영 내부에선 초정통파 정당, 아랍계 정당, 리쿠드당 중 누구와 손잡을지를 두고 의견이 엇갈린다. 반발도 거세다. 아이젠코트 진영의 좌파 성향 민주당을 이끄는 야이르 골란 대표는 이날 의회에서 “네타냐후와의 어떤 거국내각에도 동의하지 않을 것”이라","category":"사건 사고"},{"title":"사임 11일만 경영 일선 복귀…엔비디아 33%↑ '주가 폭발'","link":"https://n.news.naver.com/mnews/article/215/0001273701","naverLink":"https://n.news.naver.com/mnews/article/215/0001273701","pubDate":"2026-11-24T11:06:07.507877+09:00","author":"네이버뉴스","description":"젠슨 황이 엔비디아 최고경영자(CEO)로 복귀하면서 뉴욕증시가 23일(현지시간) 폭등세를 기록하고 있다. 기술주 중심의 나스닥 종합지수는 이날 전 거래일 대비 7.30% 오른 24,269.75에 거래를 시작한 뒤 오후 3시 20분 기 전 거래일 대비 1,501.87 포인트(6.64%) 급등한 24,119.60를 나타냈다. 같은 시간 스탠더드앤드푸어스(S&P)500지수는 322.19 포인트(4.66%) 상승한 7,232.58을, 다우존스30산업평균지수는 1,547.05 포인트(3.21%) 오른 49,694.38를 각각 나타냈다. 엔비디아 주가도 전 거래일 종가 대비 약 33% 오른 167.08달러에 거래를 시작한 뒤 30%가 넘는 급등세를 이어가고 있다. 엔비디아 주가는 이날 장중 171.50달러까지 치솟으며 전장 대비 36% 넘게 오르기도 했다. 이날 오전 9시께 황 CEO의 복귀 소식이 전해진 뒤 정규장 개장 전 거래에서부터 엔비디아 주가와 미국 주가지수 선물이 일제히 올랐다. 앞서 미국 주가지수 선물은 지난주 급락에 따른 반발 매수세로 2% 넘는 상승 출발을 예고하고 있었으나 복귀 발표 이후 상승폭이 더욱 확대됐다. 숀 맥콰이어 세쿼이아캐피털 파트너는 황 CEO 복귀 이후 미국 증시가 반등한 것을 언급했고 스티브 소스닉 인터랙티브 브로커스 최고전략 책임자는 \"젠슨 황이 해고되기에는 너무 큰 인물이었다는 보여줬다\"고 해석했다. 황 CEO의 복귀에도 AI산업을 둘러싼 불확실성이 완전히 해소된 것은 아니다. 엔비디아 이사회는 황CEO의 복귀를 결정하면서도 그가 외국 정보기관의 표적이 됐는지에 관한 독립조사는 계속 진행할 계획이다. 다만 월가에서는 기업들의 견조한 실적을 근거로 AI 투자 확대 기조가 근본적으로 훼손되지는 않았다는 평가도 나온다. 바클레이스의 아제이 라자디아크샤와 암루트 나시카르는 보고서에서 \"최근 몇 주간의 혼란으로 시장이 심각한 타격을 입었지만, 기저의 경기 순환이 무너졌다고 보지는 않는다\"고 밝혔다.","category":"사건 사고"},{"title":"[무면허 셜록]③기다림에 지친 유족, 수사 과부하에 지친 경찰…'탐정' 왜 지금인가","link":"https://n.news.naver.com/mnews/article/277/0005846937","naverLink":"https://n.news.naver.com/mnews/article/277/0005846937","pubDate":"2026-11-24T11:06:07.168571+09:00","author":"네이버뉴스","description":"수사관 1인당 접수사건 5년 새 23.4%↑ 고소 전 사실확인·증거보존 보완 역할 관계성 범죄 활용 가능성…감독은 과제 편집자주 '탐정' 명칭 사용이 허용된 지 6년이 지났다. 이제는 간판만 걸면 누구나 탐정이라 불릴 수 있지만, 탐정업을 관리·감독하는 법과 제도는 여전히 미비한 실정이다. 그 사이 불법 위치추적과 사생활 침해 등 위법 행위가 탐정이라는 이름 아래 음성적으로 확산됐다. 탐정이 불법 탐정을 추적하고, 업계마저 \"제도를 만들어 관리해 달라\"고 요구하는 아이러니한 상황도 벌어지고 있다. 형사사법체계 개편 이후 수사 지연이 잦아지고 민사 분쟁이 복잡해지면서 탐정을 찾는 시민들은 늘고 있다. 국내 탐정업이 안고 있는 빛과 그림자를 살펴보고, 시민 피해를 막기 위한 제도화의 방향을 짚어본다. \"그날 우리 딸에게 무슨 일이 있었던 건지 알고 싶어요.\" 지난 9월 사무실을 찾아와 호소하던 정순민씨(가명·54)의 애타는 목소리가 지금도 탐정 A씨의 귓가에 남아 있다. A씨는 경찰 경력 19년, 탐정 경력 17년의 베테랑 탐정이다. 스물 세살 딸이 남해안으로 여행을 떠났다가 숙박업소에서 추락해 숨졌다는 사연이었다. 당시 현장에는 딸의 고등학교 동창도 함께 있었다고 했다. 경찰의 부검 결과는 '타살 혐의점 없음'이었다. \"혹시 누군가 딸을 밀었던 건 아닐까요.\" 정씨는 현장의 의문점과 동창의 행적을 밝혀달라며 A씨에게 매달렸다. 딸의 죽음을 둘러싼 의문을 풀 수만 있다면 무엇이든 해보겠다는 절박함이었다. 지난 9월 경찰 경력 19년, 탐정 경력 17년의 베테랑 탐정이 사무실에서 의뢰인과 상담하고 있는 모습. 취재원 보호를 위해 탐정의 얼굴을 인공지능(AI) 기술로 일러스트 처리하고 배경 일부를 재구성했다. 사진은 기사 속 사건과 무관하다. 경찰은 누군가 고의로 밀었다는 정황이나 외부 물리력이 작용했다는 객관적 증거가 없다고 선을 그었다. 정씨는 경찰로부터 조만간 사건을 불송치로 종결할 것으로 보인다는 연락도 받았다고 했다. A씨도 난감하긴 마찬가지였다. 딸의 휴대전화 포렌식부터 함께 있었던 동창의 행적 확인, 현장 탐문까지 의뢰인의 궁금증을 풀어줄 수 있는 일이라면 무엇이든 해보고 싶었다. 그렇다고 몰래 위치를 추적하거나 통신 내역을 빼낼 수는 없다. 한 발만 잘못 내디디면 A씨가 처벌받을 수 있어서다. ◆사건은 밀려드는데 수사관 떠난다…커지는 수사 부담 10년 넘게 제자리걸음을 해온 탐정법 논의가 최근 검찰청 폐","category":"사건 사고"},{"title":"양천구 목동 홍익병원 인근 고층건물 불…소방 차량 29대·94명 투입","link":"https://n.news.naver.com/mnews/article/003/0014341576","naverLink":"https://n.news.naver.com/mnews/article/003/0014341576","pubDate":"2026-11-24T11:06:07.168569+09:00","author":"네이버뉴스","description":"오전 10시9분 완진…목동로 3개차로 통제 [서울=뉴시스]신항섭 기자 = 서울 양천구 목동 홍익병원 인근 고층건물에서 불이 소방당국이 진화 작업 끝에 완진했다. 24일 소방당국에 따르면 이날 오전 9시7분께 서울 양천구 신정동 목동로 229 홍익병원 인근 고층건물에서 화재가 발생했다. 소방당국은 긴급지원단을 가동하고 차량 29대, 인원 94명을 출동했다. 오전 10시9분께 완진됐다. 이 관계자는 소방 인력만 집계한 수치여서 경찰 등을 포함한 전체 인원은 변동될 수 있다고 설명했다. 서울시 교통정보시스템(TOPIS)에 따르면 화재 진압 작업으로 목동로 홍익병원 앞에서 목동역 방면 하위 3개 차로가 통제됐다. 소방당국은 대피 인원과 인명피해 여부를 확인 중이다. 정확한 화재 원인도 조사할 방침이다.","category":"사건 사고"},{"title":"80대가 몰던 승용차, 전봇대 충돌…동승자 숨져","link":"https://n.news.naver.com/mnews/article/020/0003764690","naverLink":"https://n.news.naver.com/mnews/article/020/0003764690","pubDate":"2026-11-24T11:06:07.168566+09:00","author":"네이버뉴스","description":"80대가 몰던 승용차, 전봇대 충돌…동승자 숨져. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"경찰, ‘정치자금법 위반’ 전광훈 목사 구속영장 신청","link":"https://n.news.naver.com/mnews/article/032/0003484625","naverLink":"https://n.news.naver.com/mnews/article/032/0003484625","pubDate":"2026-11-24T11:06:07.168545+09:00","author":"네이버뉴스","description":"경찰, ‘정치자금법 위반’ 전광훈 목사 구속영장 신청. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"초등생 유인해 술 먹이고 성폭행…강남 유명 학원장 구속","link":"https://n.news.naver.com/mnews/article/215/0001273747","naverLink":"https://n.news.naver.com/mnews/article/215/0001273747","pubDate":"2026-11-24T11:06:07.168540+09:00","author":"네이버뉴스","description":"사진=연합뉴스 채팅 앱을 통해 알게 된 초등학생을 숙박업소로 유인해 성폭행한 혐의로 서울 강남의 유명 학원 원장이 구속됐다. 서울 서초경찰서는 간음목적유인·미성년자 의제강간·아동복지법 위반(성학대)·실종아동법 위반 혐의를 받는 30대 남성 A씨에 대한 구속영장을 최근 발부받았다고 24일 밝혔다. A씨는 지난 17일 오전 2시께 서울 서초구의 한 공유숙박업체 숙소에서 초등학생에게 술을 마시게 한 뒤 성폭행한 혐의를 받는다. 피해 학생의 부모로부터 자녀가 가출한 뒤 연락이 끊겼다는 실종 신고를 접수한 경찰은 위치 추적을 통해 해당 숙소를 찾아간 뒤 강제로 문을 열고 진입해 A씨를 붙잡았다. 강남구 소재 학원 원장인 A씨는 범행 일주일 전부터 채팅 앱을 통해 피해 학생과 대화를 주고받은 것으로 파악됐다. 경찰은 A씨가 가출을 돕겠다며 직접 택시를 호출해 피해 학생을 숙소로 불러낸 뒤 성범죄를 저지른 정황이 있다고 보고 같은 날 구속영장을 신청했다. A씨는 경찰 조사에서 혐의를 부인한 것으로 전해졌다. 경찰은 구체적인 범행 경위 등을 추가로 조사한 뒤 조만간 A씨를 공소청에 송치할 예정이다.","category":"사건 사고"},{"title":"'음주운전' 고경표, 1시간 40분 경찰 조사…\"무책임한 모습 죄송\"","link":"https://n.news.naver.com/mnews/article/079/0004213003","naverLink":"https://n.news.naver.com/mnews/article/079/0004213003","pubDate":"2026-11-24T11:06:07.168479+09:00","author":"네이버뉴스","description":"'음주운전' 고경표, 1시간 40분 경찰 조사…\"무책임한 모습 죄송\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"원스토어 노조, 부산 이전 반발…\"조합원 99% 반대\"","link":"https://n.news.naver.com/mnews/article/018/0006414480","naverLink":"https://n.news.naver.com/mnews/article/018/0006414480","pubDate":"2026-11-24T11:06:07.880046+09:00","author":"네이버뉴스","description":"이전 발표 직후 조합원 설문조사…응답자 99% 반대 노조 \"구성원 협의 없이 결정…사전 통보조차 없어\" 고용안정협약 준수 및 특별단체교섭 요구 [이데일리 안유리 기자] 장현국 원 대표(구 넥써쓰(205500))가 본사의 부산 이전을 발표한 가운데 회사 구성원들이 반대에 나섰다. 원스토어 노동조합은 조합원 설문조사에서 응답자의 99%가 부산 이전에 반대했다며 이전 추진 중단과 고용 보장을 위한 단체교섭을 요구했다. 장현국 원(ONE) 대표가 19일 부산 시립미술관에서 '지스타 2026' 기자간담회에서 부산 이전 소식을 발표하고 있다. (사진=안유리 기자) 원스토어 노동조합은 24일 입장문을 통해 “원스토어 노동조합은 구성원과의 협의 없이 결정한 본사 부산 이전에 반대한다”며 “노동조합이 이전 발표 직후 전체 조합원을 대상으로 실시한 설문조사에서 응답자의 99%가 부산 이전에 반대했다”고 밝혔다. 앞서 장 대표는 지난 19일 부산 벡스코에서 열린 ‘지스타 2026’ 기자간담회에서 원스토어 본사를 과천에서 부산으로 이전한다는 계획을 발표했다. 노조는 “경영진은 노조와 한 차례도 협의하지 않고 이전을 결정했으며, 직원들에게는 사전 통보조차 하지 않았다”며 “사내 공지는 장 대표가 언론에 이전 결정을 밝힌 뒤에야 올라왔다. 노동조합의 단체교섭 요구에도 회사는 어떤 공식 답변도 하지 않고 있다”고 주장했다. 장 대표가 제시한 주거·금융 지원책에 대해서도 실효성에 의문을 제기했다. 노조는 “배우자의 직장이나 가족 돌봄 때문에 생활 기반을 옮길 수 없는 직원은 부산에 거처가 생겨도 이전 근무가 불가능하다”며 “계속 일하겠다는 직원에게 부산 근무만을 강요해 결국 퇴직으로 내몬다면, 이는 사실상의 구조조정”이라고 지적했다. 앞서 장 대표는 지난 기자간담회에서 내부 구성원의 불만이 없냐는 질문에 “가능한 한 이탈자 없이 모두 부산으로 올 수 있는 방안으로 추진하겠다”며 “직원들의 상황에 맞춰 주거 제공이나 이전 비용에 대한 금융 지원 등을 검토하겠다”고 말한 바 있다. 노조는 지난 6월 대주주 변경 이후 노사가 체결한 고용안정협약도 언급했다. 해당 협약에 따라 회사가 근로조건을 불이익하게 변경할 경우 노조와 사전에 합의해야 한다는 설명이다. 노조는 “회사는 지난 11월 1일 노동조합의 반대에도 장기근속휴가 제도를 일방적으로 폐지했다. 그리고 불과 3주 만에 근무지를 부산으로 옮기겠다고 발표했다”며 “생활 기반이 있는 수도권에서 부","category":"사회"},{"title":"젠슨 황, 불명예 사임 11일 만에 복귀... 민주당 '반발'","link":"https://n.news.naver.com/mnews/article/047/0002536989","naverLink":"https://n.news.naver.com/mnews/article/047/0002536989","pubDate":"2026-11-24T11:06:07.507935+09:00","author":"네이버뉴스","description":"엔비디아 이사회, 만장일치 의결... 젠슨 황 \"복귀하게돼 영광\" ▲ 2026년 6월 16일, 텍사스주 셔먼에서 코히어런트(Coherent)의 제조 시설 확장 착공식이 시작되기를 기다리고 있는 엔비디아(Nvidia)의 젠슨 황(Jensen Huang) 사장 겸 최고경영자(CEO). ⓒ AP/연합뉴스 엔비디아의 공동 창업자 젠슨 황이 최고경영자(CEO)로 전격 복귀했다. 사임한 지 불과 11일 만이다. 엔비디아는 23일(현지시각) 이사회에서 젠슨 황을 CEO 및 이사회 이사로 복귀시키는 안건을 만장일치로 의결했다고 발표했다. 이는 즉시 효력이 발생한다. 엔비디아는 \"젠슨 황과 일련의 논의 및 회의를 진행한 결과 그의 솔직함과 엔비디아를 이끌 능력에 만족하게 됐다\"라며 \"미국 정부 고위 관계자들의 의견을 수렴한 결과 젠슨 황이 국가 안보에 위협이 되지 않는다는 확신을 갖게 되었다\"라고 밝혔다. 하비 존스 엔비디아 이사회 의장은 젠슨 황의 복귀가 회사의 주주와 임직원, 협력사 및 고객에게 최선의 이익이라고 강조했다. 불명예 사임 11일 만에 이뤄진 반전 젠슨 황은 성명을 통해 \"새로운 산업혁명이 시작되는 시점에 엔비디아로 복귀해 세계에서 가장 중요한 기술 기업을 이끌게 돼 영광\"이라며 \"최대한 겸손한 마음과 새로운 헌신으로 CEO를 맡게 됐다\"라고 밝혔다. 또한 \"이 과정에서 엔비디아 이사회가 보여준 신뢰와 숙고에 감사하다\"라며 \"특히 혼란스러운 시기에 이사회 의장으로서 리더십을 발휘한 존스 의장과 콜레트 크레스 임시 CEO 및 경영진에 감사하다\"라고 말했다. 크레스는 최고재무책임자(CFO)로 복귀한다. 그러면서 \"엔비디아의 직원, 주주, 업계 전반의 지도자들, 그리고 전 세계 협력사들의 아낌없는 지지에 깊이 감사하다\"라며 \"무엇보다 가족의 사랑과 지지에 감사하다. 하루빨리 업무에 복귀하고 싶다\"라고 강조했다. 젠슨 황의 복귀는 지난 12일 사임 이후 열흘 남짓 만에 이뤄진 극적인 반전이다. 1993년 엔비디아를 공동 창업한 그는 AI 반도체 시장의 선두 기업으로 키워냈다. 한때 엔비디아는 애플을 넘어 시가총액 1위에 오르기도 했다. 하지만 미국 정보당국이 중국 스파이로 지목한 싱가포르 기업 메가스피드의 전직 임원 앨리스 황과 불륜 관계였던 것으로 드러났고, 이 때문에 엔비디아의 최신 반도체가 중국으로 불법 반출됐다는 의혹이 불거졌다. 엔비디아 직원과 투자자들은 회사의 '상징'과도 다름없는 젠슨 황의 복귀를 요청했다","category":"사회"},{"title":"\"수천만원 내면 나와 하룻밤\" 속옷·머리카락까지 판 '60만' 여성 유튜버","link":"https://n.news.naver.com/mnews/article/421/0009306635","naverLink":"https://n.news.naver.com/mnews/article/421/0009306635","pubDate":"2026-11-24T11:06:07.168564+09:00","author":"네이버뉴스","description":"MBC '스트레이트' (서울=뉴스1) 신초롱 기자 = 경남 하동 지리산 자락에 자리 잡은 마음 수련원 '영체마을'과 지도자 이혜라 씨가 수행자들을 상대로 금전적 착취와 집단 폭행, 성추행 등을 자행했다는 의혹이 불거져 파장이 일고 있다. 22일 방송된 MBC '스트레이트'는 영체마을의 운영 실태와 이곳에서 수행했던 이들의 피해 증언을 공개했다. 이 씨는 스스로를 신령스러운 몸을 뜻하는 '영체님'이라 칭하며 사람들의 내면과 무의식을 치유할 수 있는 절대적인 능력을 갖췄다고 주장해 왔다. 수행자들을 '아가', 자신을 '엄마'라고 부르며 신뢰를 쌓았다. 과거 영상에서는 \"제 내면의 신성, 그 하나님이 바로 저라는 걸 확실히 알고 그때부터 제 능력이 나오기 시작했다\"고 말하기도 했다. 문제는 치유를 명목으로 운영되는 각종 프로그램의 비용이었다. 무의식 속 열등감과 수치심을 없애준다는 역할극은 한 번에 100만 원대, 조상의 한을 풀어준다는 천도재는 수백만 원에 달했다. 심지어 이 씨와 같은 방에서 하룻밤을 보내면 몸과 마음의 병이 치유된다는 프로그램에는 수천만 원에서 억대에 달하는 비용이 책정된 것으로 전해졌다. 이 씨는 자신이 그린 그림에도 특별한 치유 에너지가 담겨 있다며 한 점에 수천만 원에 달하는 가격을 매겼다. 경제적 여유가 없는 수행자들을 위해 최장 24개월 무이자 할부가 가능한 이른바 '영체카드'까지 마련했다. 자신의 머리카락을 250만~350만 원, 입었던 속옷을 30만 원 등에 판매했다. 이를 소유하는 것만으로 두려움과 수치심을 없앨 수 있다고 주장했다. 영체마을의 재무제표 등을 분석한 결과 지난해 말 기준 자산은 약 98억 6000만 원에 달했으며 당기순이익도 매년 10억 원을 넘어선 것으로 나타났다. 거액의 재산을 잃었다는 수행자들의 증언도 이어졌다. 주식 투자로 100억 원 넘는 수익을 올렸다는 박 모 씨는 투자 과정에서 쌓인 스트레스를 해소하기 위해 2013년 영체마을을 찾았다가 부인과 함께 수행에 깊이 빠져들었다. MBC '스트레이트'","category":"사회"},{"title":"\"턱 대봐\" 강아지 훈련하듯 학생 대하고 외모 비하…전직 교사 벌금형","link":"https://n.news.naver.com/mnews/article/008/0005445491","naverLink":"https://n.news.naver.com/mnews/article/008/0005445491","pubDate":"2026-11-24T11:06:07.168559+09:00","author":"네이버뉴스","description":"강아지를 훈련하듯 학생들에게 턱을 대도록 하고 외모 비하 발언을 한 40대 전직 교사가 벌금형을 선고받았다. 기사 이해를 돕기 위해 AI(인공지능)가 생성한 이미지./사진=챗GPT 강아지를 훈련하듯 학생들에게 턱을 대도록 하고 외모 비하 발언을 한 40대 전직 교사가 벌금형을 선고받았다. 24일 법조계에 따르면 대구지법 형사12부(부장판사 정한근)는 아동학대 범죄의 처벌 등에 관한 특례법 위반(아동복지시설 종사자 등의 아동학대 가중처벌) 혐의로 기소된 A씨(41)에게 벌금 300만원을 선고했다. 아동학대 치료 프로그램 40시간 이수와 아동 관련 기관에 1년간 취업제한도 명령했다. A씨는 2023년에 점심시간 고등학교 도서관에서 책을 고르던 1학년 여학생 2명을 정서적 학대를 한 혐의로 재판에 넘겨졌다. 당시 A씨는 학생들에게 손바닥을 내밀며 턱을 대라는 시늉을 했다. 한 학생이 마지못해 턱을 대자 엄지와 검지로 원을 만들어 코를 대도록 한 것으로 조사됐다. A씨는 교실에서 두 학생의 피부색을 비교하며 한 학생의 이마와 팔, 손등을 만지고 다른 학생에게는 바닥에 떨어진 사탕을 주워 먹으라고 한 것으로도 알려졌다. 수업 중에 반 친구들 앞에서 또 다른 학생에게 \"음침하게 생겼다. 사회 부적응자 같다\"고 말하고, 도서관에 책을 빌리러 온 해당 학생에게 \"넌 사람 죽일 것 같은 눈빛을 하고 있냐\"고 말한 혐의로도 기소됐다. 재판부는 \"피고인이 피해자들의 정신 건강과 발달에 악영향을 미친 범행으로 죄책이 가볍다고 할 수 없다\"고 지적했다. 다만 \"피고인이 피해자들에게 고통을 주기 위해 악의적으로 범행했다고는 보이지 않는다. 교사 입장에서 친하게 지내려고 했으나 관계 형성이 서툴러 적정한 선을 넘어 피해자들이 불쾌하게 느끼는 언행을 한 것으로 보인다\"며 \"피해자들에 한 언행 정도가 정서적 학대 행위로서 중하다고 보긴 어려운 점 등을 참작했다\"고 판시했다.","category":"사회"},{"title":"중고교 시험도 교복 대신 단추 없는 옷…부정 적발시 최대 퇴학","link":"https://n.news.naver.com/mnews/article/025/0003567480","naverLink":"https://n.news.naver.com/mnews/article/025/0003567480","pubDate":"2026-11-24T11:06:07.168555+09:00","author":"네이버뉴스","description":"24일 2학기 기말고사가 치러지는 강원 춘천시 한 고등학교에서 선생님이 금속탐지기를 이용해 시험 감독을 하고 있다. 강원교육청은 스마트기기와 인공지능(AI)을 통한 부정행위 우려를 해소하고자 도내 모든 고등학교에 금속탐지기를 배포하는 등 시험 감독 강화에 나섰다. 연합뉴스 인공지능(AI) 등 첨단 스마트기기를 이용한 부정행위 우려가 중·고교 내신시험까지 확산하자, 정부가 2학기 기말고사부터 대학수학능력시험(수능)과 동일한 수준의 시험장 관리·감독 강화에 나섰다. 각 학교에 금속탐지기로 전자기기 소지 여부를 전수 검사하고 교복 대신 단추 없는 일상복을 입도록 권고한다. 부정행위가 적발됐을 때 학교마다 학칙 등에 따라 징계는 최대 퇴학까지 가능하도록 강화한다. 교육부는 이런 내용을 골자로 하는 ‘중등학교 내신평가 스마트기기 활용 부정행위 대응 방안’을 24일 국무회의에서 밝혔다. 교육부의 대책은 학교 시험장 관리 감독을 강화해 스마트기기를 활용한 부정행위 시도를 차단하는 데 방점을 뒀다. 이에 따라 학생들은 시험 전 휴대전화를 포함한 모든 전자기기를 제출하고 금속탐지기 검사를 받아야 한다. 기존에는 대부분 학교에서 휴대전화는 시험 전 제출토록 했으나 블루투스이어폰 등 다른 전자기기는 별도로 제출하지 않았던 것으로 교육부는 파악하고 있다. 수능과 마찬가지로 초소형 카메라 사용을 차단하기 위한 방안을 마련했다. 이를 위해 단추가 달린 교복이 아닌 일상복 착용을 권고한다. 감독관은 매 교시마다 안경 및 복장을 검사하고 복장 중 단추가 있는 경우에는 스티커를 부착해 상태를 확인한다. 또한 학교는 수능처럼 모든 학생에게 컴퓨터용 사인펜과 볼펜 등 필기구를 제공하고 학생은 흑색연필만 휴대할 수 있다. 시험 당일 학교 와이파이를 차단해 AI 서비스 접속도 막는다. 복도 감독관은 지속적으로 휴대전화 애플리케이션(앱)을 활용해 와이파이나 블루투스 등 통신신호를 확인해 기록하고 이상통신이 감지되면 시험 종료 후 금속탐지기를 활용해 해당 시험실을 전수 점검한다. 김영희 디자이너","category":"사회"},{"title":"[속보] 기말고사 때 교복 대신 체육복... 금속탐지기 검사도 받는다","link":"https://n.news.naver.com/mnews/article/469/0000967369","naverLink":"https://n.news.naver.com/mnews/article/469/0000967369","pubDate":"2026-11-24T11:06:07.168551+09:00","author":"네이버뉴스","description":"기말고사도 수능처럼 감독 철저히 금속탐지기 사전 동의도 받기로 스마트기기 적발 땐 당일 전 과목 0점 24일 2학기 기말고사가 치러지는 강원 춘천시 한 고등학교에서 선생님이 금속탐지기를 이용해 시험 감독을 하고 있다. 강원교육청은 스마트기기와 인공지능(AI)을 통한 부정행위 우려를 해소하고자 도내 모든 고등학교에 금속탐지기를 배포하는 등 시험 감독 강화에 나섰다. 춘천=연합뉴스 올 2학기 고교 기말고사부터 학생들은 시험실 입실 전 금속탐지기 검사를 받는다. 초소형 카메라 반입을 막기 위해 시험 당일에는 교복 대신 단추 없는 체육복이나 일상복을 입도록 권고된다. 인공지능(AI) 스마트기기를 활용한 부정행위가 잇따르자 교육부가 내신시험의 관리·감독을 수능 수준으로 강화하기로 한 데 따른 조치다. 교육부는 24일 국무회의에서 이 같은 내용의 '중등학교 내신평가 스마트기기 활용 부정행위 대응 방안'을 보고했다. AI 기능이 탑재된 스마트기기를 이용한 부정행위가 내신시험에서도 확인되면서 시험 관리를 대학수학능력시험(수능) 수준으로 강화한다는 취지다. 새 대책은 올 2학기 고교 기말고사부터 우선 적용하고, 중학교도 이를 참고해 관리·감독을 강화한다. 우선 시험이 시작되기 전 학교는 휴대폰 등 모든 전자기기를 제출받아 고사본부에 보관한다. 학생들의 가방은 시험실에서 거리가 있는 강당 등 별도 장소에 두기로 했다. 학생들은 자신의 교실이 아닌 다른 교실에서 시험을 치르고 책상 서랍과 사물함도 모두 비워야 한다. 눈에 띄는 조치는 시험 전 실시하기로 한 금속탐지기 전수 검사다. 다만 학교는 이를 위해 학생과 학부모의 사전 동의를 받기로 했다. 만약 동의하지 않는다면 육안 검사 등 감독이 더 강화될 수 있다는 점도 미리 고지한다. 모든 학생을 입실 전에 검사하며 필요하면 시험 직후에도 점검할 계획이다. 복장도 학교 체육복이나 라운드티 등 일상복이 권고된다. 단추가 있는 옷을 입고 올 경우, 단춧구멍을 스티커로 막아야 한다. 컴퓨터용 사인펜과 볼펜은 학교가 일괄 지급하고 개인 필기구는 흑색 연필만 허용한다. 통신을 이용한 부정행위에도 대비한다. 학교 와이파이는 시험 당일 차단되고 복도 감독관은 휴대폰 애플리케이션을 통해 와이파이와 블루투스 신호를 계속 확인하기로 했다. 이상 신호가 감지될 경우, 시험 종료 후 해당 시험실 학생 전원을 금속탐지기로 검사한다. 제재 수위도 높아진다. 지금까지 징계 수위는 각 학교가 정해 왔다. 앞으로","category":"사회"},{"title":"[속보] 국가 시험 때 감독관 보디캠 차고, 탐지기로 꺼진 폰 잡는다","link":"https://n.news.naver.com/mnews/article/469/0000967370","naverLink":"https://n.news.naver.com/mnews/article/469/0000967370","pubDate":"2026-11-24T11:06:07.168549+09:00","author":"네이버뉴스","description":"[속보] 국가 시험 때 감독관 보디캠 차고, 탐지기로 꺼진 폰 잡는다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"한차례 국무회의 불참했던 김지용 중수청장, 2주 만에 배석","link":"https://n.news.naver.com/mnews/article/001/0016459998","naverLink":"https://n.news.naver.com/mnews/article/001/0016459998","pubDate":"2026-11-24T11:06:07.168547+09:00","author":"네이버뉴스","description":"지난주 韓총리 주재 국무회의 불참했으나 이날 참석 재개 인사하는 윤호중 행안장관과 김종철 경찰청장 (서울=연합뉴스) 신준희 기자 = 윤호중 행정안전부 장관과 김종철 경찰청장이 24일 이재명 대통령 주재로 청와대에서 열리는 국무회의 시작 전 인사를 하고 있다. 왼쪽은 김지용 중수청장. 2026.11.24 [청와대통신사진기자단] hama@yna.co.kr (서울=연합뉴스) 이승연 기자 = 김지용 중대범죄수사청(중수청)장이 2주 만에 국무회의에 배석했다. 김 청장은 24일 오전 청와대에서 열린 이재명 대통령 주재 국무회의에 참석했다. 중수청장 취임 후 지난 17일 처음으로 국무회의에 불참했으나 이날 자리를 다시 지켰다. 당시 김 청장이 불참한 국무회의는 대통령이 아닌 한명숙 총리가 주재했다. 김지용 청장은 이날까지 국무회의에 총 5차례 참석했다. 지난달 20일, 27일과 이달 3일, 10일 국무회의에 네 차례 연속 참석한 바 있다. 지난 20일 임명안이 재가돼 전날 취임식을 가진 김종철 신임 경찰청장도 이날 참석했다. 김 청장은 지난주까지 청장 대행 신분으로 국무회의에 배석해왔다. 그간 수사기관 수장은 국무회의에 배석하지 않는 것이 관례였으나, 이 대통령이 지난해 12월 국무회의에서 부처 소속 외청도 국무회의에 참석할 것을 지시하면서 관례가 깨졌다. 국민의힘 등 야권에서는 수사·공소기관의 독립성이 훼손될 수 있다며 이들의 국무회의 배석이 부적절하다고 비판했다. 청와대는 중수청장 등의 국무회의 참석이 문제없다는 입장이다. winkite@yna.co.kr","category":"사회"},{"title":"\"추워서 불 켰다?\"…서울역서 라이터 여러 개에 불붙이던 남성, 시민들이 막았다","link":"https://n.news.naver.com/mnews/article/003/0014341610","naverLink":"https://n.news.naver.com/mnews/article/003/0014341610","pubDate":"2026-11-24T11:06:07.168538+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 서울역에서 한 남성이 라이터 3개를 움켜쥔 채 다른 라이터로 밑부분에 불을 붙이는 모습을 재연한 사진. (사진출처: 스레드 캡처)2026.11.24. [서울=뉴시스]김혜경 기자 = 서울역 한복판에서 한 남성이 라이터 여러 개를 한 손에 쥔 채 다른 라이터로 밑부분에 불을 붙이다 시민들의 제지를 받고 경찰에 체포됐다는 목격담이 전해졌다. 지난 23일 소셜네트워크서비스(SNS) 스레드에는 서울역에서 한 남성이 라이터 여러 개에 불을 붙이려다 시민들의 제지를 받고 경찰에 체포됐다는 내용의 글이 올라왔다. 작성자 A씨는 이날 오후 2시께 서울역 한정선 매장 인근에서 방화로 의심되는 행동을 하는 남성을 목격했다고 밝혔다. A씨는 \"사람들이 오가는 서울역 한복판에서 방화 시도를 목격했다\"며 \"아직도 생각하면 손이 너무 떨린다\"고 당시 상황을 전했다. A씨에 따르면 당시 남성은 한 손에 라이터 3개를 움켜쥔 채 다른 손에 든 네 번째 라이터로 이들 라이터의 밑부분에 불을 붙이고 있었다. 이를 목격한 A씨는 즉시 남성에게 다가가 \"뭐 하는 짓이냐\"며 행동을 제지하고 주변 사람들에게 경찰에 신고해 달라고 요청했다. 그러나 갑작스러운 상황에 주변 사람들이 당황한 듯 별다른 반응을 보이지 않자, A씨는 지나가던 중년 남성 2명에게 도움을 청했다. 두 남성은 곧바로 경찰에 신고한 뒤 경찰이 도착할 때까지 A씨와 함께 해당 남성을 붙잡고 현장을 지켰다. 이 과정에서 남성은 \"저 그냥 갈게요\", \"그냥 간다고요\", \"추워서 불 켰어요\"라고 말하며 현장을 벗어나려 했다는 것이 A씨의 설명이다. A씨는 \"춥다고 라이터로 라이터에 불을 붙이는 게 말이 되느냐\"며 황당함을 드러냈다. A씨가 공개한 재연 이미지에는 한 손에 라이터 3개를 움켜쥔 채 다른 손에 든 네 번째 라이터로 이들 라이터의 밑부분에 불을 붙이는 모습이 담겼다. 가스라이터는 외부 불꽃으로 가열할 경우 내부 가스가 누출되거나 용기가 파손되면서 화재로 이어질 위험이 있다. [서울=뉴시스]지난 23일 서울역에서 회색 후드 점퍼를 입은 남성이 한 손에 라이터 여러 개를 움켜쥔 채 시민들에게 한쪽 팔을 붙잡혀 있는 모습. (영상출처: 스레드) 2026.11.24.","category":"사회"},{"title":"한의원에서도 '엑스레이' 찍게 될까…오늘 국회 심사","link":"https://n.news.naver.com/mnews/article/448/0000653021","naverLink":"https://n.news.naver.com/mnews/article/448/0000653021","pubDate":"2026-11-24T11:06:07.168533+09:00","author":"네이버뉴스","description":"윤성찬 대한한의사협회 회장(왼쪽) 이태연 대한의사협회 부회장(오른쪽) / 대한한의사협회, 대한의사협회 제공 한의사의 엑스레이(X-ray) 활용을 가능하게 하는 '의료법 개정안'이 24일 국회 소위 심사를 앞두고 있다. 대한한의사협회는 이날 여의도 국회의사당 앞에서 '한의사 엑스레이 사용 입법 촉구 기자회견'을 열고 \"한의사의 엑스레이 사용은 대한민국 보건의료의 발전을 앞당기기 위한 사회의 시대적 요구\"라고 주장했다. 그러면서 \"10년 가까이 이어진 소모적 논쟁을 끝내고 대한민국 보건의료 제도가 새로운 시대로 나아가기 위한 과제\"라고 했다. 국회 보건복지위원회는 이날 법안심사제1소위원회를 열고 더불어민주당 서영석 의원이 대표발의한 의료법 개정안을 심사할 예정이다. 개정안은 한의사도 진단용 방사선 발생장치의 안전관리책임자를 맡을 수 있도록 해 엑스레이 설치와 사용을 가로막는 제도적 장벽을 없애자는 취지다. 윤성찬 한의협 회장은 \"한의원에서 진료받기를 원하는 환자가 골절 여부를 확인하기 위해 다른 의료기관을 방문해 촬영하고 다시 한의원으로 돌아와야 하는 불편을 언제까지 감수해야 하느냐\"고 지적했다. 그러면서 \"한의사의 엑스레이 활용은 한의계만의 숙원이 아니라 대한민국 보건의료 발전을 앞당기기 위한 시대적 요구\"라며 \"의료기술의 발전은 국민을 위해 존재하고 의료제도의 변화 역시 국민을 위해 이뤄져야 한다. 이제 남은 것은 국회의 결단\"이라고 촉구했다. 반면 의사단체는 법안에 강력히 반대하고 있다. 대한의사협회도 이날 오전 여의도 국회의사당 앞에서 '한의사 X-ray 불법 허용 의료법 개정안 저지 궐기대회'를 열고 법안에 반대하고 나섰다. 대한의사협회 이태연 부회장은 \"X-ray는 단순히 기계를 작동해 사진 찍는 일이 아니다. 촬영 필요성을 판단하고, 영상을 정확히 해석해 진단과 치료로 연결하는 전문적인 의료행위\"라며 \"그만큼 환자의 안전과 정확한 진단이 걸려있기 때문에 30년 동안 X-ray를 봐온 저조차 한 순간도 긴장을 늦출 수 없다\"고 강조했다. 그러면서 \"충분한 교육과 안전관리, 명확한 책임 기준 없이 사용 주체부터 넓히는 것은 환자 안전을 위협할 수 있다\"며 \"법원 판결 취지를 왜곡해 입법을 밀어붙여서도 안된다. 국민 건강을 위해, 한의사 X-ray 허용 의료법 개정안을 즉각 철회하라\"고 촉구했다.","category":"사회"}],"생활·문화":[{"title":"20년 웹툰작가 '천리마마트' 김규삼 “찌질해 보이던 사람이 더 용감할 수도 있잖아요”","link":"https://n.news.naver.com/mnews/article/015/0005357412","naverLink":"https://n.news.naver.com/mnews/article/015/0005357412","pubDate":"2026-11-24T11:06:08.208874+09:00","author":"네이버뉴스","description":"네이버웹툰 연재 20주년 맞은 김규삼 작가 코미디와 공포는 한 끗 차이 영웅보다 평범한 인간의 용기에 주목 AI와 유튜브 적극 활용…댓글은 또 하나의 컨텐츠 1997년 아시아 외환위기 무렵, 군에서 제대한 김규삼 작가는 동네 뒷산에서 낯선 광경을 목격했다. 양복을 입고 서류가방을 든 남성들이 벤치에 멍하니 앉아 있었다. 구조조정으로 일자리를 잃었지만 가족에게 차마 알리지 못해 출근하는 척 집을 나온 직장인들이었다. 김 작가는 “그때부터 샐러리맨이라는 존재를 많이 생각했다”며 “평생 회사에 뼈를 묻겠다는 생각이 무너지는 시기였다”고 회상했다. 김규삼 작가가 20일 서울 용산구에 있는 자신의 사무실에서 인터뷰하고 있다. / 네이버웹툰 제공 이때의 기억은 훗날 그의 대표작인 웹툰 ＜쌉니다 천리마마트＞의 출발점이 됐다. 처음부터 옴니버스식의 코미디를 구상한 것은 아니었다. 정복동은 악랄한 마트 사장, 문석구는 그보다 더 혹독하게 직원들을 부리는 관리자로 설정했다. 현실적인 사회고발물로 이야기를 풀어가다 재미가 없다는 생각에 방향을 틀었다. 회사를 망치려고 벌인 일이 오히려 매출을 올리는 판타지 코미디로 바꾼 것이다. 황당한 사건이 이어지는 이야기 속에는 안정적인 직장의 소중함과 그곳을 지키려는 사람들의 사연을 담았다. 김 작가는 최근 한국경제신문과의 인터뷰에서 ＜천리마마트＞ 1부를 “가장 후회가 적은 작품”으로 꼽았다. 그가 작품에 등장시키는 인물들은 대개 주변에서 볼 법한 평범한 사람들이다. 저마다의 아픔을 안고 살아간다. ＜천리마마트＞의 가수 조민달이 대표적이다. 마릴린 맨슨을 연상시키는 악마 분장을 한 조민달은 마트 고객들에게 조롱받지만 아내와 자녀를 둔 가장으로서 마트 공연 때마다 혼신을 다한다. 김 작가는 “사람은 어떤 때는 정의롭고 어떤 때는 비겁하지 않느냐”며 “찌질해 보이던 사람이 어떤 때는 더 용감할 수 있다”고 했다. ＜천리마마트＞를 준비하면서 실제 마트 직원 모집 공고에 지원한 적도 있다. 면접 연락조차 받지 못했다는 이야기를 하면서 웃었다.","category":"생활·문화"},{"title":"침침하고 뻑뻑한 눈…하루 5분 눈 운동으로 피로 풀기","link":"https://n.news.naver.com/mnews/article/296/0000107727","naverLink":"https://n.news.naver.com/mnews/article/296/0000107727","pubDate":"2026-11-24T11:06:08.208867+09:00","author":"네이버뉴스","description":"눈 운동, 눈의 피로 줄이고, 초점 조절 능력 향상시키는 데 도움 눈을 지나치게 사용해 침침하거나 뻑뻑할 때 눈 굴리기나 초점 바꾸기 등을 통해 피로를 푸는 방법이 있다. 사진=게티이미지뱅크 눈을 지나치게 많이 사용하면 눈이 피로해진다. 장시간 컴퓨터로 작업하거나 운전하고 나면 눈이 침침하고 빡빡해지는 느낌을 받는 이유다. 대부분 일시적 현상이므로 눈을 쉬게 해주면 자연스럽게 사라진다. 눈의 피로를 가져오는 요인은 여러 가지이다. 너무 밝거나 어두운 곳에서 눈을 사용하면 눈동자에 부담을 준다. 고정된 물체를 응시하는 것도 초점을 맞추는 눈 근육에 피로를 유발한 수 있다. 하나의 사물을 오래 주시하면 눈을 덜 깜박이게 된다. 이렇게 되면 눈의 건조와 통증을 유발할 수 있다. 소중한 눈의 건강을 지키기 위해서는 평소 꾸준한 관리가 필요하다. 미국 건강·의료 매체 '웹엠디(WebMD)' 등의 자료를 토대로 눈의 피로와 통증을 완화시킬 수 있는 운동법을 알아봤다. 눈 깜박이기 =피로 개선을 위한 가장 빠른 방법은 눈이 스스로 회복되도록 돕는 것이다. 오랫동안 한 가지만 응시해 눈이 건조하다면 눈을 깜박거리고 하품을 해본다. 이런 동작은 눈물을 만들어내도록 자극해 눈을 촉촉하게 만들 수 있다. 눈을 빠르게 깜박거리는 것은 눈물을 눈 전체에 퍼지게 만들어 통증을 줄여줄 수 있다. 눈 굴리기 =요가에서 '회전하면서 보기'라고 알려진 눈 굴리는 운동은 근육의 긴장을 풀어주는데 도움이 된다. 눈을 한 방향으로 부드럽게 한 바퀴 돌려 원위치로 돌아온다. 눈 주변과 눈 뒤 근육의 긴장과 통증을 덜어주는 동작. 매 시간 3~5회 정도 반복한다. 초점 바꾸기 =초점 변경 연습을 하면 눈의 긴장과 고통을 줄일 수 있다. 눈이 피로한 작업을 한 뒤 다음과 같은 과정을 3회 반복하면 된다. 1단계는 손가락을 코앞에 가까이 두고 초점을 맞춘 다음, 천천히 손가락을 멀어지게 한다. 2단계는 팔을 끝까지 뻗은 뒤, 손가락 너머 먼 곳의 물체를 바라본다. 그 물체에 몇 초 동안 초점을 맞춘 뒤 다시 손가락을 쳐다본다. 3단계는 손가락이 코에 닿을 때까지 얼굴 쪽으로 이동하면서 손가락에 계속 초점을 맞춘다. 뒤이어 방의 반대쪽에 있는 물체를 응시하고 몇 초 동안 초점을 맞춘다. 손바닥으로 눈 감싸기 =두 가지 효과를 볼 수 있다. 첫째, 눈을 잠시 감는 것 자체가 피로 회복에 도움을 준다. 둘째, 눈의 혈류 순환을 개선해 회복 속도를 앞당긴다. 손","category":"생활·문화"},{"title":"비만이 무릎 관절염 부른다…체중 관리·근력 운동 병행해야","link":"https://n.news.naver.com/mnews/article/022/0004177633","naverLink":"https://n.news.naver.com/mnews/article/022/0004177633","pubDate":"2026-11-24T11:06:08.208820+09:00","author":"네이버뉴스","description":"비만은 관절에 가해지는 부담을 키워 골관절염 등 근골격계 질환의 위험을 높이기 때문에 적정 체중을 유지하는 한편, 통증 정도에 맞는 운동으로 관절 주변 근육을 강화하는 등 꾸준한 관리가 필요하다. 게티이미지뱅크 비만은 관절에 가해지는 부담을 키워 골관절염 등 근골격계 질환의 위험을 높이는 주요 요인으로 꼽힌다. 특히 체중 부하가 큰 무릎과 엉덩이 관절은 체중이 늘수록 압박을 많이 받아 연골 손상과 관절 퇴행이 빨라질 수 있다. 따라서 관절 건강을 지키려면 적정 체중을 유지하는 한편, 통증 정도에 맞는 운동으로 관절 주변 근육을 강화하는 등 꾸준한 관리가 필요하다는 게 전문가의 설명이다. ◆ 체중 늘수록 무릎 관절 부담 커져…고도비만 여성 관절염 위험 4배 23일 의료계에 따르면 비만은 체중 증가로 관절에 가해지는 물리적 하중을 높일 뿐 아니라 척추와 관절의 구조적 배열에도 영향을 줄 수 있다. 특히 신체 하중을 많이 견뎌야 하는 무릎과 엉덩이 관절은 체중이 증가할수록 부담이 커진다. 관절 주변 근육과 힘줄에도 무리가 가면서 관절 손상과 퇴행이 촉진될 수 있다. 무릎은 체중에 따른 하중을 직접적으로 받는 부위인 만큼 비만과 관절염의 연관성이 큰 관절로 꼽힌다. 물론 체중만으로 관절염 발생 여부를 단정할 수는 없다. 하지만 과체중과 비만은 관절에 지속적인 부담을 주는 요인인 만큼 적정 체중을 유지하는 것이 관절 건강 관리의 기본이다. 무릎 연골은 한 번 손상되면 이전 상태로 회복하기 어려워 평소 체중과 생활습관을 관리하는 것이 중요하다. 무릎은 체중에 따른 하중을 직접적으로 받는 부위인 만큼 비만과 관절염의 연관성이 큰 관절로 꼽힌다. 게티이미지뱅크","category":"생활·문화"},{"title":"쌀이 남으면 며느리를 나무랐다는 집…한 해 끝에 찾는 구례 운조루 [여행+]","link":"https://n.news.naver.com/mnews/article/022/0004177643","naverLink":"https://n.news.naver.com/mnews/article/022/0004177643","pubDate":"2026-11-24T11:06:08.208805+09:00","author":"네이버뉴스","description":"1776년 지은 국가민속문화유산 전남 구례 운조루 고택 쌀독과 낮은 굴뚝에 담긴 나눔 이야기 운조루 유물전시관, 류씨 집안이 대대로 지켜 온 유물 150여 점 전 눈 덮인 구례 운조루 고택을 위에서 내려다본 모습. 기와지붕에 둘러싸인 마당에 장독들이 모여 있다. 사진=한국관광공사(이상일) 제공 한 해를 마무리하며 가족과 나눔의 의미를 되새겨 볼 만한 옛집이 지리산 자락에 있다. 전남 구례 토지면 오미리의 운조루 고택이다. 1776년 지어져 올해로 250년이 된 이 집에는 ‘타인능해(他人能解)’라고 적힌 쌀독이 전해진다. 누구든 마개를 열어 쌀을 퍼 갈 수 있다는 뜻이다. 또 고택 가까이에는 이 집안이 대대로 지켜 온 유물 150여 점을 모은 운조루 유물전시관이 있다. 80년 동안 하루도 거르지 않고 쓴 일기를 남긴 집안의 내력을 이곳에서 이어 볼 수 있다. 24일 구례군과 운조루 측 등에 따르면 운조루는 조선 영조 52년(1776년) 삼수부사를 지낸 류이주가 세운 집이다. 이 집은 1968년 국가민속문화유산으로 지정됐다. ◆ 주인과 마주치지 않고 퍼 가는 쌀독 운조루 측은 이 쌀독을 쌀 두 가마니 반이 들어가는 원통형 나무 독으로 소개한다. 끼니를 잇기 어려운 이웃이 와서 쌀을 가져갈 수 있도록 하고, 마개에 ‘다른 사람도 능히 열 수 있다’는 뜻의 네 글자를 적었다. 쌀독은 쌀을 가져가는 사람이 주인과 마주쳐 아쉬운 소리를 하지 않아도 되는 자리에 놓였다고 전해진다. 쌀독에 쌀이 남아 있으면 손님 대접이 소홀했던 것 아니냐며 되레 며느리를 나무랐다는 이야기도 내려온다. 안타깝게도 이 나눔은 일제강점기에 멈췄다. 종가 며느리 곽영숙씨는 지난 2019년 국립민속박물관 웹진 인터뷰에서 “오래도록 원래의 뜻대로 ‘나눔의 쌀독’ 역할을 하다가 일제강점기 때 그 역할이 멈췄다”고 말했다. 공출로 쌀을 거듭 빼앗겨 쌀독을 채워 둘 수 없었다는 것이다. 구례 운조루 고택의 부엌. 아궁이 위에 솥이 걸려 있고 안쪽 선반에 항아리들이 놓여 있다. 사진=한국관광공사 제공","category":"생활·문화"},{"title":"\"내일 아침 우산 챙기세요\"…전국 곳곳 비나 눈[내일날씨]","link":"https://n.news.naver.com/mnews/article/018/0006414312","naverLink":"https://n.news.naver.com/mnews/article/018/0006414312","pubDate":"2026-11-24T11:06:08.208777+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"우리 집에 나 말고 누가 살까…실내서 발견된 생물 봤더니","link":"https://n.news.naver.com/mnews/article/092/0002446568","naverLink":"https://n.news.naver.com/mnews/article/092/0002446568","pubDate":"2026-11-24T11:06:07.880053+09:00","author":"네이버뉴스","description":"미국·캐나다 실내 생물 2만3782건 분석…무당벌레·거미·지네부터 차고 속 악어까지 우리가 매일 생활하는 집 안에는 생각보다 다양한 생물이 함께 살고 있다. 눈에 잘 띄지 않는 거미와 지네부터 무당벌레, 딱정벌레까지 종류도 다양하다. 최근 미국과 캐나다의 실내 공간을 조사한 연구에서는 약 2100종의 생물이 확인됐다. 심지어 한 가정집 차고에서는 악어가 발견되기도 했다. 최근 과학전문매체 피즈닷오알지(Phys.org)에 따르면 미국 노스캐롤라이나주립대학교 등 국제 공동연구진은 미국과 캐나다의 주택과 사무실 등 실내 공간에서 발견된 생물을 조사한 결과를 국제학술지 '에콜로지'에 발표했다. 연구진은 시민과학 프로젝트 '네버 홈 얼론(Never Home Alone)'을 통해 수집한 생물 관찰 기록 2만3782건을 분석했다. 이번 연구는 약 3000명이 1996년 5월부터 2024년 4월까지 촬영한 사진과 관찰 정보를 바탕으로 진행됐다. 미국과 캐나다의 주택과 사무실 등 실내 공간에서 거미와 지네, 딱정벌레 등 약 2100종의 생물이 관찰됐다는 연구 결과가 나왔다. (사진=클립아트코리아) 참가자들은 생물 관찰 플랫폼 '아이내추럴리스트'에 집이나 사무실, 학교 등 실내에서 발견한 생물의 사진과 영상을 올렸다. 반려동물과 화분에 심어 기르는 식물은 조사 대상에서 제외했다. 연구진은 수집된 자료 가운데 미국과 캐나다에서 관찰된 기록을 선별하고, 곤충과 거미 등을 전문적으로 연구하는 분류학자들의 검토를 거쳐 생물의 종류를 확인했다. 그 결과 실내 공간에서 약 2100종의 생물이 관찰됐다. 전체 관찰 기록의 약 95%는 곤충과 거미 등 절지동물이 차지했다. 곤충이 약 60%, 거미류가 약 30%였으며 파충류와 포유류 등 척삭동물도 약 4%를 차지했다. 가장 자주 발견된 생물은 아시아무당벌레였다. 이어 갈색날개노린재, 집지네, 카펫벌레, 긴다리집거미 등이 많이 관찰됐다. 특히 집지네는 전체 조사에서 세 번째로 자주 발견된 생물이었다. 집 안에서 흔히 마주칠 수 있는 생물이지만, 연구진은 이들의 생태에 관해서는 아직 충분한 연구가 이뤄지지 않았다고 설명했다. 거미도 예상보다 다양한 종류가 확인됐다. 연구진은 빗살거미과에 속하는 거미의 관찰 기록만 1000건 이상 수집했다. 일부 거미는 집 안에서 해충을 잡아먹는 역할을 하기도 했다. 실제로 참가자들이 제출한 관찰 자료에는 깡충거미가 파리를 사냥하는 모습도 포함됐다. 뜻밖의 생물도","category":"생활·문화"},{"title":"한국인 DNA 1만명 분석했더니\"…기존에 없던 유전변이 988만개 발견 [헬스LAB]","link":"https://n.news.naver.com/mnews/article/014/0005608630","naverLink":"https://n.news.naver.com/mnews/article/014/0005608630","pubDate":"2026-11-24T11:06:07.880051+09:00","author":"네이버뉴스","description":"서울 지하철역에서 이동하고 있는 시민들의 모습. 뉴스1 [파이낸셜뉴스] 한국인 1만여명의 유전체(DNA) 정보를 분석한 결과, 국제 데이터베이스에 등록되지 않은 유전변이 988만개가 확인됐다. 국내외 30여개 기관이 20년간 축적한 연구 성과로, 한국인에게 나타나는 유전적 특성을 보다 정밀하게 파악할 수 있는 기반이 마련됐다. 특히 개인의 유전적 차이가 생체 나이 측정에도 영향을 미칠 수 있다는 사실이 확인되면서 질병 진단과 노화 연구의 정확도를 높이는 데 활용될 것으로 기대된다. 울산과학기술원(UNIST) 게놈센터(KOGIC)가 24일 한국인 1만239명의 전장게놈 해독 데이터에 분자정보와 건강정보를 연결한 대규모 집단 참조데이터 'Korea10K(코리아10K)'를 구축했다고 밝혔다. 이 자료 분석 결과는 지난 20일 국제학술지 '게놈 바이올로지(Genome Biology)'에 공개됐다. 지난 2021년 울산시와 UNIST가 한국인 1만 명의 게놈 해독 완료를 선언한지 5년 만의 성과다. UNIST는 한국생명공학연구원 국가생명연구자원정보센터(KOBIC), 에이징랩(주), 울산대학교병원, 한국표준과학연구원 국가참조표준센터, 미국 하버드 의대 등과 함께 한국인의 유전변이 분포를 담은 대규모 집단 참조데이터를 구축하고, 이를 바탕으로 개인과 인구집단의 유전적 차이가 생체 나이 측정에 영향을 줄 수 있다는 점을 확인했다. 센터에 따르면 참조데이터는 개인의 유전정보를 해석할 때 비교 기준으로 삼는 자료다. 사람마다 나타나는 DNA 서열의 차이를 '유전변이'라고 하는데, 환자에게서 발견한 변이가 질병과 관련이 있는지 판단하려면 먼저 그 변이가 얼마나 흔한지 알아야 한다. Korea10K는 이러한 판단에 필요한 한국인 유전변이의 종류와 빈도 정보를 제공하는 자료다. 유전변이 6122만 개가 담겨 있으며 이 중 988만 개(16.1%)는 국제 유전변이 데이터베이스인 'dbSNP'에 등록되지 않은 변이였다. 새로 찾은 변이의 48.5%는 한두 명에게서만 발견됐다. 분석 대상을 1만 명 규모로 늘리면서 소수에게만 있는 희귀 변이까지 폭넓게 찾아낸 것이다. 이 자료를 바탕으로 더 정확한 '참조 패널'을 만들 수 있었다. 유전자검사에서는 비용을 줄이기 위해 DNA의 일부 위치만 검사한 뒤 나머지 위치의 유전정보를 추정하기도 한다. 참조 패널은 이때 비교 기준으로 쓰는 자료다. 유전변이가 생체 나이 측정에 영향을 줄 수 있다는 점도","category":"생활·문화"},{"title":"\"5만원이 아까워서?\" 입 꾹 닫은 고경표...심야 대리요금 따져보니","link":"https://n.news.naver.com/mnews/article/243/0000106102","naverLink":"https://n.news.naver.com/mnews/article/243/0000106102","pubDate":"2026-11-24T11:06:07.879986+09:00","author":"네이버뉴스","description":"포토라인 선 고경표, '대리운전 질문'엔 즉답 피해 대리비 상승 기세지만...서울 시내 심야 이동도 3만원 안팎 '음주운전 혐의' 배우 고경표 경찰 출석. [사진 연합뉴스] 만취 상태로 운전대를 잡았다가 청소차를 들이받고 환경미화원을 다치게 한 배우 고경표가 사고 발생 9일 만에 경찰에 출석했다. 고개를 숙이며 혐의를 인정하는 태도를 보였지만 정작 대리운전을 부르지 않은 이유에 대해서는 입을 닫으면서, 온라인을 중심으로 비판 여론이 한층 거세지고 있다. 지난 23일 오후 도로교통법상 음주운전 등 혐의 피의자 신분으로 서울 마포경찰서에 출석했다. 조사에 앞서 경찰서 앞 포토라인에 선 그는 부르튼 입술로 연신 \"죄송하다\"며 90도로 고개를 숙였다. 이어 \"그동안 여러분께 많은 사랑과 관심을 받았는데, 이런 식으로 돌려드리는 것에 대해 정말 무책임한 모습이었고 죄송하다는 말밖에 할 수 있는 것이 없다\"고 밝혔다. 취재진이 \"어떤 부분을 소명할 예정이냐\"라고 묻자 고경표는 \"따로 소명할 것은 없다. 제가 저지른 잘못에 대해서 말씀드릴 생각이다\"라고 답하며 사실상 혐의를 인정했다. 그러나 \"대리운전은 왜 안 불렀느냐\"라는 질문이 나오자 한참을 말을 잇지 못하다가 이내 \"제가 경찰 조사 때 말씀드리도록 하겠다\"라며 즉답을 피했다. 고경표는 앞서 지난 14일 오전 3시 30분께 서울 마포구 동교동 일대에서 술을 마신 채 홀로 자신의 승용차를 몰다 작업 중이던 청소차를 들이받은 혐의를 받는다. 사고 당시 그의 혈중알코올농도는 면허 취소 기준(0.08% 이상)을 웃도는 수준이었던 것으로 알려졌다. 사건이 알려지자 대중의 질문은 자연스레 '왜 대리운전을 부르지 않았는가'로 쏠렸다. 고수익을 올리는 유명 배우가 대리운전 비용조차 아껴 위험천만한 음주운전을 감행했느냐는 탄식과 질타가 쏟아지면서다. 그렇다면 대리운전 이용료는 얼마일까. 24일 기준 민간 대리운전 어플리케이션 업계 실거래가(카카오모빌리티 등)에 따르면 수도권 일반 호출은 기본 1만2000~1만5000원 선에서 출발해 서울 시내(10km 이내) 이동 시 평균 2만원, 경기 외곽(18km 초과) 이동 시 3만~4만원 안팎에 형성돼 있다. 법인대리운전 실거래 중간값 기준 역시 10km 이하 단거리가 2만5000원(주요 분포 2만~3만원)이며 10~20km는 3만원, 20~30km는 4만원, 40~60km는 5만원, 80~100km는 8만원 수준이다. 여기에 우천·피크타임 할","category":"생활·문화"},{"title":"KT, 구글 AI·휴대폰 보험 결합 요금제 출시…월 12만원","link":"https://n.news.naver.com/mnews/article/008/0005445403","naverLink":"https://n.news.naver.com/mnews/article/008/0005445403","pubDate":"2026-11-24T11:06:07.879968+09:00","author":"네이버뉴스","description":"서울 광화문 KT 사옥 모습/사진=뉴스1 KT가 생성형 AI(인공지능) 서비스와 휴대폰 보험 할인 혜택을 결합한 요금제를 선보인다. 기존 초이스 요금제 가입자의 해외 데이터 로밍 속도도 최대 4배 높였다. KT는 '초이스 더블 Google AI Plus+폰케어'를 출시했다고 24일 밝혔다. 월 정액 12만원으로 구글 AI 플러스(400GB)와 단말 보험 '365 폰케어' 할인 혜택을 동시에 제공한다. VVIP 멤버십과 스마트기기 할인 등 기존 초이스 더블의 기본 혜택도 유지된다. 구글 AI 플러스는 제미나이 기반 문서 작성·검색·번역·학습 기능과 400GB 클라우드 저장공간을 제공한다. '나노 바나나 프로'를 활용한 이미지 생성·편집과 자료 요약·정리 기능도 이용할 수 있다. 클라우드 저장공간은 최대 5명의 가족 구성원과 공유할 수 있다. 월 4400원을 추가하면 구글 AI 플러스(2TB), 월 2만1500원을 추가하면 구글 AI 프로(5TB)로 업그레이드할 수 있다. 365 폰케어는 스마트폰 분실·도난·파손과 추가 단말기 파손 등을 보장하고 휴대폰 교체·수리 대행을 지원하는 서비스다. 신규 요금제 가입자는 보험 상품과 단말 기종에 따라 월 최대 5500원의 보험료 할인을 받을 수 있다. KT는 이달 1일부터 초이스 요금제의 기본 데이터 로밍 속도도 상향했다. 초이스90·110·더블 가입자는 기존 100Kbps에서 4배 빨라진 최대 400Kbps 속도로 데이터를 무제한 이용할 수 있다. 초이스130 가입자는 하루 3GB까지 최대 1Mbps로 이용하고 이를 초과하면 최대 400Kbps 속도로 데이터를 쓸 수 있다고 회사 측은 전했다.","category":"생활·문화"},{"title":"불끈 치켜든 주먹에 빨간 브래지어…트럼프가 올린 젠슨 황 '복귀 축하' 사진","link":"https://n.news.naver.com/mnews/article/088/0001041915","naverLink":"https://n.news.naver.com/mnews/article/088/0001041915","pubDate":"2026-11-24T11:06:07.507927+09:00","author":"네이버뉴스","description":"중국 스파이 의혹 여성과 불륜설에 CEO 사임…11일 만 복귀 엔비디아 이사회 만장일치 복귀 결정…주가 하루 만에 31% 급등 도널드 트럼프 미국 대통령이 젠슨 황 엔비디아 CEO 복귀를 축하하며 자신의 소셜미디어에 올린 사진. 트루스소셜 도널드 트럼프 미국 대통령이 불륜 의혹으로 물러났다가 11일 만에 복귀한 젠슨 황 엔비디아 최고경영자(CEO)를 축하하며 파격적인 합성사진을 소셜미디어에 올렸다. 트럼프 대통령은 23일(현지 시각) 자신의 소셜미디어 트루스소셜에 황 CEO가 피 묻은 얼굴로 빨간색 브래지어를 높이 치켜든 사진 한 장을 게시했다. 배경에는 황 CEO를 둘러싼 경호원들과 함께 배경으로 엔비디아 로고가 새겨진 깃발이 등장한다. 해당 사진은 트럼프 대통령이 2024년 7월 미국 펜실베이니아주 버틀러에서 유세 도중 총격을 당한 직후 주먹을 치켜들었던 장면을 패러디한 것이다. 원본 사진 속 트럼프 대통령의 얼굴을 황 CEO로 바꾸고, 성조기 대신 엔비디아 깃발을 넣었다. 트럼프 대통령의 주먹에 빨간색 브래지어를 합성한 점도 눈에 띈다. 사진 속 브래지어는 최근 황 CEO를 둘러싸고 불거진 불륜 의혹을 풍자한 것으로 풀이된다. 트럼프 대통령은 사진을 올리면서 별도의 설명은 덧붙이지 않았다. 앞서 황 CEO는 최근 중국 정보기관과 연계된 것으로 의심받는 여성과의 혼외 관계 의혹에 휩싸인 바 있다. 상대는 싱가포르에 본사를 둔 클라우드 컴퓨팅 기업 메가스피드의 전직 임원 앨리스 황으로, 메가스피드는 미국의 대중국 반도체 수출 통제를 우회해 첨단 인공지능(AI) 칩을 중국 기업에 공급했다는 의혹으로 미국 당국의 조사를 받아왔다. 이후 황 CEO가 앨리스 황 외에 자신에게 직접 보고하는 여성 임원과도 혼외 관계를 맺었다는 의혹이 추가로 제기되면서 논란이 커졌다. 2024년 7월 14일 미국 펜실베이니아 버틀러 유세에서 총격을 당한 트럼프 전 대통령이 단상에서 내려오며 주먹을 머리 위로 쥐어 보이고 있다. 이 사진은 2021년 퓰리처상을 받은 에번 부치 AP 기자가 촬영했다. 연합뉴스","category":"생활·문화"}],"세계":[{"title":"카모 분쟁에 주주 반대까지…인적분할 앞둔 카카오 ‘내우외환’","link":"https://n.news.naver.com/mnews/article/016/0002727510","naverLink":"https://n.news.naver.com/mnews/article/016/0002727510","pubDate":"2026-11-24T11:06:07.880007+09:00","author":"네이버뉴스","description":"카모 분쟁에 주주 반대까지…인적분할 앞둔 카카오 ‘내우외환’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"美공화당도 이란전 예산 차단 검토…셧다운 방지 협상 카드","link":"https://n.news.naver.com/mnews/article/001/0016459616","naverLink":"https://n.news.naver.com/mnews/article/001/0016459616","pubDate":"2026-11-24T11:06:07.507960+09:00","author":"네이버뉴스","description":"민주당과 논의 가능성…국방부 탄약 보충 예산은 별도 지원 미국 워싱턴 DC의 연방의회 [로이터=연합뉴스 자료사진] (서울=연합뉴스) 고일환 기자 = 미국 공화당이 연방정부의 셧다운(일시적 업무정지)을 막기 위해 이란전쟁 예산을 차단하는 방안을 민주당과의 협상 카드로 검토하고 있다. 23일(현지시간) 워싱턴포스트(WP)에 따르면 상원 세출위원장을 맡고 있는 수전 콜린스(공화·메인) 의원은 민주당과의 협상 방안에 대해 도널드 트럼프 행정부가 이란전쟁을 계속하는 데 사용할 자금을 차단하는 방안을 검토하고 있다고 밝혔다. 이란전쟁 자금은 차단하더라도 국방부의 고갈된 탄약 재고를 보충하기 위한 예산은 지원하겠다는 것이 콜린스 의원의 구상이다. 다만 콜린스 의원은 공화당 상원 의원 중 얼마나 많은 사람이 동의할지는 불확실하다고 덧붙였다. 상원에서 공화당을 이끄는 존 튠 원내대표도 협상 가능성을 열어뒀다. 튠 원내대표는 \"정부 운영을 계속하고 군과 국가안보에 필요한 요구를 충족할 수 있는 방안이라면 무엇이든 열려 있다\"고 말했다. 미 의회는 오는 12월 11일까지 연방정부 예산에 합의해야 한다. 시한을 넘길 경우 트럼프 대통령의 두 번째 임기 들어 네 번째 셧다운이 발생하게 된다. 국방예산은 여야 협상의 핵심 쟁점이다. 트럼프 대통령은 국방부 예산의 대폭 증액을 요구하고 있지만 민주당과 일부 공화당 의원들은 이에 반대하고 있다. 특히 지난 중간선거에서 의회 다수당을 차지한 민주당은 정부 예산안에 이란전쟁 자금 지원을 중단하는 조항을 포함해야 한다고 주장하고 있다. 트럼프 대통령이 이란전쟁과 관련해 의회의 승인을 받지 않는 한 공격적인 군사활동에 예산을 사용할 수 없도록 하겠다는 것이다. 다만 적의 공격으로부터 미군을 방어하거나 미국 민간인을 대피시키는 데 필요한 예산은 사용할 수 있도록 했다. 민주당은 이와 별도로 국방부의 부족한 탄약 재고를 보충하는 데 필요한 예산을 지원하는 방안도 공화당과 논의하고 있다. 민주당의 팀 케인(버지니아) 의원은 \"탄약 재고 보충 예산이 곧 필요하다는 점에는 양당에서 상당한 공감대가 있다\"고 말했다. 양당 지도부가 이 같은 협상안에 합의하더라도 공화당 내에서 전폭적인 지지를 받을 수 있을지는 미지수다. 특히 의회를 통과하더라도 트럼프 대통령이 이 같은 법안에 서명하지 않을 것이라는 전망도 제기된다. 한편 미 의회는 베트남전쟁 당시에도 예산 통제를 통해 전쟁 수행에 제동을 건 전례가 있다. 도","category":"세계"},{"title":"'닷새' 올트먼·12년 걸린 잡스…쫓겨난 빅테크 창업자의 귀환 역사","link":"https://n.news.naver.com/mnews/article/421/0009306294","naverLink":"https://n.news.naver.com/mnews/article/421/0009306294","pubDate":"2026-11-24T11:06:07.507958+09:00","author":"네이버뉴스","description":"'닷새' 올트먼·12년 걸린 잡스…쫓겨난 빅테크 창업자의 귀환 역사. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"복귀 첫 날 젠슨 황, 뭐라고 했나?…\"두번째엔 더 나은 CEO 될 것\"","link":"https://n.news.naver.com/mnews/article/055/0001405334","naverLink":"https://n.news.naver.com/mnews/article/055/0001405334","pubDate":"2026-11-24T11:06:07.507954+09:00","author":"네이버뉴스","description":"▲ 엔비디아 본사에서 복귀 인사를 하는 젠슨 황 젠슨 황 엔비디아 최고경영자(CEO)가 복귀 첫날 본사를 찾아가 직원들에게 사과와 감사의 뜻을 표했습니다. 뉴욕타임스(NYT)와 각종 SNS에 게시된 영상에 따르면 황 CEO는 현지시간 23일 캘리포니아주 샌타클래라 본사 로비에서 고개를 숙이며 자신을 맞이해 준 직원들에게 \"이 모든 일들을 겪게 해 미안하다\"며 \"두 번째 기회를 줘서 감사하고, 두 번째에는 더 나은 CEO가 되겠다\"고 말했습니다. 그는 가슴에 손을 얹고 직원들을 돌아보는가 하면 \"정말 끔찍한 실수를 저질렀고 다시 일어서기 위해 노력할 것\"이라고 덧붙였습니다. 또 \"오늘이 제 첫 출근일\"이라며 \"컴퓨터가 없어서 IT 부서에서 새 컴퓨터를 받아야 한다\"고 가벼운 농담을 던지기도 했습니다. 황 CEO는 그의 트레이드마크인 검은색 가죽 재킷 대신 차분한 남색 워크자켓을 걸쳤고 운동화 차림으로 회사를 찾았습니다. 임직원들은 1∼3층 난간과 계단에 줄지어 서서 황 CEO의 복귀를 환영했습니다. 일부는 손뼉을 쳤고, 환호성이 이어졌습니다. \"젠슨\"이라며 이름을 연호하거나 \"환영한다\", \"사랑한다\"고 말하는 사람들도 있었습니다. 한 직원이 \"이제 일하러 갑시다\"라고 외치는 모습도 영상에 담겼습니다. 젠슨 황 복귀에 환호하는 직원들","category":"세계"},{"title":"트럼프 업고 돌아온 젠슨 황, 해고 불가 절대권력 됐다","link":"https://n.news.naver.com/mnews/article/020/0003764665","naverLink":"https://n.news.naver.com/mnews/article/020/0003764665","pubDate":"2026-11-24T11:06:07.507952+09:00","author":"네이버뉴스","description":"트럼프, 엔비디아 이사회 ‘그림자 의장’ 역할 백악관 보증으로 국가 안보 리스크 덮어 젠슨 황 엔비디아 최고경영자(CEO) AP/ 뉴시스 불륜 스캔들과 중국 스파이 연루 의혹으로 사임했던 젠슨 황 엔비디아 최고경영자(CEO)의 전격 복귀가 단기적으로는 뉴욕 증시를 끌어올렸지만, 장기적으로는 엔비디아와 인공지능(AI) 생태계 전반에 복합적인 악재로 작용할 것이라는 월가의 분석이 나왔다. 미국 월스트리트저널(WSJ)는 23일(현지 시간) 황 CEO 복귀 당일 엔비디아 주가가 31% 폭등해 시가총액 1조 달러가 불어나고 나스닥 지수가 7% 급등했음에도, 이번 반등이 폭락장 속 일시적 반등인 ‘데드 캣 바운스’에 그칠 수 있다고 지적했다. 백악관의 보증으로 국가 안보 리스크를 덮고 조직 혼란을 피한 것은 단기 호재에 불과하며, 오히려 황 CEO의 귀환이 근본적인 구조적 난제들을 고착화한다는 것이다. WSJ는 가장 먼저 무너진 기업 지배구조를 문제 삼았다. 도널드 트럼프 미국 대통령이 사실상 엔비디아 이사회의 ‘그림자 의장’ 역할을 하며 복귀를 압박하자, 불과 지난주까지 복직 불가 입장을 밝혔던 하비 존스 이사회 의장은 입장을 뒤집었다. 이로써 엔비디아 이사회의 독립성과 윤리강령은 무의미해졌으며, 황 CEO가 해고할 수 없는 실질적 지배자라는 사실만 드러났다고 꼬집었다. 미국 의회의 전방위 조사 압박 역시 해소되지 않았다고 WSJ는 분석했다. 백악관이 황 CEO에게 면죄부를 줬더라도 미국 민주·공화 양당의 대중국 강경파들은 엔비디아 칩의 중국 유입 경위와 황 CEO의 스캔들에 대한 의회 조사를 계속 밀어붙일 가능성이 크다. 만약 조사 과정에서 새로운 문제가 드러날 경우, 엔비디아는 이제 ‘전직 CEO 개인의 일탈’이라며 책임을 떠넘길 명분마저 잃게 됐다. 아울러 고객사 및 자사 임원과의 불륜이라는 명백한 이해충돌 행위가 주가 부양이라는 명분 아래 묵인되면서, 기업 스캔들에 무뎌진 중도층마저 반감을 품게 됐다고 전했다. 통제받지 않는 자본주의와 실리콘밸리 빅테크를 비판하는 세력에게 ‘가죽 재킷을 입은 CEO’라는 강력한 공격 소재를 쥐여준 셈이 됐다고 지적했다.","category":"세계"},{"title":"\"보스 돌아왔다\" 젠슨황 '와락'…박수·환호 쏟아진 엔비디아 본사[영상]","link":"https://n.news.naver.com/mnews/article/008/0005445407","naverLink":"https://n.news.naver.com/mnews/article/008/0005445407","pubDate":"2026-11-24T11:06:07.507949+09:00","author":"네이버뉴스","description":"\"보스 돌아왔다\" 젠슨황 '와락'…박수·환호 쏟아진 엔비디아 본사[영상]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"미국 공화당도 ‘셧다운 방지’ 위해 이란전 예산 차단 검토","link":"https://n.news.naver.com/mnews/article/056/0012299858","naverLink":"https://n.news.naver.com/mnews/article/056/0012299858","pubDate":"2026-11-24T11:06:07.507947+09:00","author":"네이버뉴스","description":"미국 공화당이 연방정부의 셧다운(일시적 업무정지)을 막기 위해 이란 전쟁 예산을 차단하는 방안을 민주당과의 협상 카드로 검토하고 있습니다. 현지 시각 23일 워싱턴포스트(WP)에 따르면 상원 세출위원장을 맡고 있는 수전 콜린스(공화·메인) 의원은 민주당과의 협상을 위해 도널드 트럼프 행정부가 이란 전쟁을 계속하는 데 사용할 자금을 차단하는 방안을 검토하고 있다고 밝혔습니다. 이란 전쟁 자금은 차단하더라도 국방부의 고갈된 탄약 재고를 보충하기 위한 예산은 지원하겠다는 것이 콜린스 의원의 구상입니다. 다만 콜린스 의원은 공화당 상원 의원 중 얼마나 많은 사람이 동의할지는 불확실하다고 덧붙였습니다. 상원에서 공화당을 이끄는 존 튠 원내대표도 협상 가능성을 열어뒀습니다. 튠 원내대표는 “정부 운영을 계속하고 군과 국가안보에 필요한 요구를 충족할 수 있는 방안이라면 무엇이든 열려 있다”고 말했습니다. 미 의회는 오는 12월 11일까지 연방정부 예산에 합의해야 하지만 시한을 넘길 경우 트럼프 대통령의 두 번째 임기 들어 네 번째 셧다운이 발생하게 됩니다. 트럼프 대통령은 국방부 예산의 대폭 증액을 요구하고 있지만 민주당과 일부 공화당 의원들은 이에 반대하고 있습니다. 특히 지난 중간선거에서 의회 다수당을 차지한 민주당은 정부 예산안에 이란 전쟁 자금 지원을 중단하는 조항을 포함해야 한다고 주장하고 있습니다. 트럼프 대통령이 이란 전쟁과 관련해 의회의 승인을 받지 않는 한 공격적인 군사 활동에 예산을 사용할 수 없도록 하겠다는 것입니다. 다만 적의 공격으로부터 미군을 방어하거나 미국 민간인을 대피시키는 데 필요한 예산은 사용할 수 있도록 했습니다. 민주당은 이와 별도로 국방부의 부족한 탄약 재고를 보충하는 데 필요한 예산을 지원하는 방안도 공화당과 논의하고 있습니다. 민주당의 팀 케인(버지니아) 의원은 “탄약 재고 보충 예산이 곧 필요하다는 점에는 양당에서 상당한 공감대가 있다”고 말했습니다. 양당 지도부가 이 같은 협상안에 합의하더라도 공화당 내에서 전폭적인 지지를 받을 수 있을지는 미지수입니다. 특히 의회를 통과하더라도 트럼프 대통령이 이 같은 법안에 서명하지 않을 것이라는 전망도 제기됩니다. [사진 출처 : AFP=연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주","category":"세계"},{"title":"\"경영진엔 사후 통보\"⋯엔비디아 이사회, 젠슨황 복귀 다급하게 결정","link":"https://n.news.naver.com/mnews/article/031/0001077740","naverLink":"https://n.news.naver.com/mnews/article/031/0001077740","pubDate":"2026-11-24T11:06:07.507945+09:00","author":"네이버뉴스","description":"22일 오후 몇 시간 논의 끝에 만장일치로 방침 뒤집어 트럼프 압박에 기존 방침 뒤집어 이사회 독립성 논란도 엔비디아 이사회가 경영진과 협의 없이 젠슨 황 최고경영자(CEO)의 복귀를 결정한 것으로 알려졌다. 트럼프 대통령의 압박에 기존 방침을 뒤집으면서 이사회 독립성 논란이 일고 있다. 엔비디아. [사진=REUTERS/연합뉴스] 23일(현지시간) 블룸버그통신에 따르면 엔비디아 이사회는 전날 오후 몇 시간 동안 논의한 끝에 황 CEO의 복귀를 만장일치로 결정했다. 복귀 결정은 즉시 발효됐다. 이 과정에서 콜레트 크레스 임시 CEO를 비롯한 고위 경영진은 논의에서 제외됐다. 이들은 이사회가 결정을 내린 뒤 복귀 사실을 통보받은 것으로 전해졌다. 이사회는 황 CEO의 복귀 가능성을 일축했었다. 하비 존스 이사회 의장은 지난 17일 실적 발표에서 \"황 CEO를 복귀시킬 계획이 없다\"고 말했다. 크레스 임시 CEO도 이튿날 전사회의에서 기존 사업 전략을 유지하겠다고 설명했다. 이후 트럼프 대통령이 황 CEO의 복귀를 요구하면서 이사회 입장이 바뀐 것으로 알려졌다. 엔비디아는 미국 정부 고위 관계자들의 의견을 검토한 결과, 황 CEO의 복귀가 국가안보에 위험을 초래하지 않을 것으로 판단했다고 발표했다. 이번 결정으로 이사회의 독립성에도 의문이 제기됐다. CEO 선임은 이사회 권한이지만, 관련 조사가 끝나지 않은 상태에서 정부 압박에 따라 기존 방침을 뒤집었다는 점이 논란의 핵심이다. 황 CEO 개인에 대한 높은 의존도도 드러났다. 로이터통신에 따르면 황 CEO 사임 이후 일부 중국 고객이 엔비디아 반도체 주문을 취소하거나 보류했다. 경영진 교체가 사업 전반에 영향을 미친 것이다. 제임스 세인트오빈 오션파크자산운용 최고투자책임자(CIO)는 \"젠슨의 복귀가 전혀 예상 밖은 아니지만, 미국 기업 지배구조의 현주소에 우려스러운 메시지를 던진다\"고 평가했다. 황 CEO는 이날 캘리포니아주 샌타클래라 본사에서 직원들에게 \"두 번째 기회를 줘서 감사하다. 이번에는 더 나은 CEO가 되겠다\"고 말했다. 엔비디아 주가는 복귀 소식에 장중 37% 가까이 급등했다. 이사회는 황 CEO의 복귀와 별개로 외국 정보기관의 접근 의혹에 대한 독립조사를 계속할 방침이다. 국가안보와 수출통제 문제를 감독할 별도 위원회도 구성했다.","category":"세계"},{"title":"\"우크라 전장서 러 군인 1천명 이상 스스로 생 마감\"","link":"https://n.news.naver.com/mnews/article/001/0016459687","naverLink":"https://n.news.naver.com/mnews/article/001/0016459687","pubDate":"2026-11-24T11:06:07.507943+09:00","author":"네이버뉴스","description":"우크라이나 자포리자 전선의 러시아군 [타스 연합뉴스 자료사진 및 DB 금지] (서울=연합뉴스) 김동호 기자 = 우크라이나 전장에서 숨진 러시아 군인 가운데 1천명 이상이 자살자라고 영국 일간 가디언이 23일(현지시간) 보도했다. 최근 벨라루스 반정부 해커단체 '키베르파르티자니 BY'(Cyberpartisans BY)와 우크라이나 해커 단체 '사일런트 크로'(Silent Crow)가 해킹으로 빼낸 러시아 통계청의 사망증명서 약 1천100만건을 가디언이 분석한 결과다. 가디언에 따르면 2022년 2월 러시아가 우크라이나를 전면 침공한 이후 최근까지 1천87명의 러시아군이 스스로 목숨을 끊은 것으로 파악됐다. 이들 가운데 최소 614건이 우크라이나 내 점령지나 벨고로드, 브랸스크 등 러시아 접경지에서 발생했다. 우크라이나 전선에서 멀리 떨어진 곳에서 스스로 생을 마감한 이들도 108명에 달했다. 사망 지역이 명시되지 않은 경우는 113건이었다. 자살한 러시아 군인의 절반 이상이 총기를 사용했고 장소는 군 주둔지, 진지, 훈련소, 개인 주거지 등으로 다양했다. 전쟁 지역의 자살자 43명의 연령대는 18∼19세였다. 전체 자살 건수를 연도별로 보면 전쟁 첫해인 2022년 50여건에서 2024년 200여건으로 폭등했고 2025년 365건으로 정점을 찍었다. 올해 들어서도 이미 300건에 육박하는 자살이 기록됐다고 가디언은 짚었다. 한 러시아군 지휘관이 남긴 기록에 따르면 2024년 10월 우크라이나 내 점령지 도네츠크 지역의 러시아군 지휘소의 경비 임무를 맡았던 한 부사관은 아내에게 전화로 \"여기 상황이 끔찍해, 돌아가서 자세히 말해줄게\"라고 말했지만 5주 뒤 본인의 생일을 보낸 뒤 지휘소 부근 숲속에서 스스로 목숨을 끊었다. 러시아 통계청 자료에 따르면 자살 외에 '의도 불명의 총기 발사'로 사망한 이도 885명이 기록됐는데, 이는 자살을 은폐하는 분류일 수 있다고 가디언은 지적했다. 징집 대상인 러시아인을 돕는 현지 비정부기구 이디테레솜의 이반 추빌라예프 대변인은 전장에 우크라이나군 드론이 접근하거나 할 경우 실제 자살자가 전사자로 기록될 가능성이 높다고 말했다. 실제로 2023년 7월 세르게이 사베노크 중령의 부인은 남편이 자살했다고 통보받았지만 유출된 러시아 통계청 자료에는 그의 이름이 나타나지 않는다고 가디언은 지적했다. 헤르손 전선의 러시아군 [타스 연합뉴스. 재판매 및 DB 금지]","category":"세계"},{"title":"회생신청 기각된 외식업체 놀부…법원 \"경제적 타당성 의문\"","link":"https://n.news.naver.com/mnews/article/001/0016459730","naverLink":"https://n.news.naver.com/mnews/article/001/0016459730","pubDate":"2026-11-24T11:06:07.168486+09:00","author":"네이버뉴스","description":"회생신청 기각된 외식업체 놀부…법원 \"경제적 타당성 의문\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"구글 의장의 조언...“한국 AI, 전력·규제가 관건”","link":"https://n.news.naver.com/mnews/article/009/0005768012","naverLink":"https://n.news.naver.com/mnews/article/009/0005768012","pubDate":"2026-11-24T11:06:08.208853+09:00","author":"네이버뉴스","description":"스탠퍼드서 한국 AI 예산·전력·규제 논의 ASIF, 거장 인맥 업고 협력사 AI 전환 빅테크 데이터센터 부지 경쟁 속 한국 주목 존 헤네시 알파벳 이사회 의장이 11월 17일(현지시간) 미국 스탠퍼드대에서 한국의 AI 산업과 인프라를 주제로 대담했다. 미국 ASI 파운드리(ASI Foundry, Inc.)가 연 ‘ASI 시티 포럼(ASI City Forum)’에서 헤네시 의장은 지미 리 ASI 파운드리 회장과 글로벌 AI 투자 흐름, 한국과의 협력 기회를 놓고 이야기를 나눴다. 구글 모회사의 이사회를 이끄는 사람이 한국의 데이터센터 규제와 AI 예산을 놓고 공개 석상에서 의견을 나눈 건 드문 일이다. 헤네시·지미 리 대담서 한국 AI 예산·규제·전력 다뤄 헤네시 알파벳 의장(연단 좌측)은 지미 리 ASI 파운드리 회장과 글로벌 AI 투자 흐름, 한국과의 협력 기회를 놓고 이야기를 나눴다.(에이에스아이에프) 헤네시 의장은 컴퓨터 과학자다. 지금 스마트폰과 서버에 들어가는 칩 상당수가 따르는 RISC 설계 방식을 데이비드 패터슨 교수와 함께 만들어 2017년 튜링상을 받았다. 2000년부터 16년 동안 스탠퍼드대 총장을 지냈고 2018년부터 알파벳 이사회 의장을 맡고 있다. 지미 리 회장은 미국 메릴랜드주 장관을 지냈다. 두 사람은 AI가 도시와 산업을 바꾸려면 무엇이 필요한지를 기술과 정책 양쪽에서 짚었다. 이날 다룬 주제는 세 가지다. AI·데이터센터 투자가 지금 어디에 몰리고 앞으로 어디로 갈지, 한국이 데이터센터 규제를 어떻게 풀고 AI 예산을 어떻게 늘릴지, 한국·대만·싱가포르·말레이시아 같은 아시아 나라들이 어떤 역할을 맡을지다. 한국 이야기는 예산에서 시작했다. 정부는 2027년 예산안에서 반도체·피지컬 AI·AI 데이터센터 등 AI 분야에 올해의 약 두 배를 배정했다. 참석자들은 이 돈이 성과로 이어지려면 전력을 어디서 끌어올지, 데이터센터를 채울 산업 수요가 있는지, 기술을 현장에 어떻게 적용할지, 해외와 어떻게 손잡을지를 함께 따져야 한다고 봤다. 차에 기름은 가득 채웠으니 이제 도로가 닦였는지, 운전할 사람이 있는지 살펴보자는 얘기다. 이어 마이클 레펙 스탠퍼드대 교수가 지미 리 회장과 AI 시대 도시와 산업의 지속가능성을 주제로 대담했다. 마지막으로 미국 반도체 설계 AI 기업 볼타이(Voltai)의 라비브 타즈워 라흐만 사장이 차세대 AI 팩토리를 짓고 돌리는 데 필요한 연산 능력과 에너지","category":"IT 과학"},{"title":"중국산 로봇, 일하다가 자꾸 망가진다…투입 속도조절 나선 中 자동차업계","link":"https://n.news.naver.com/mnews/article/009/0005768059","naverLink":"https://n.news.naver.com/mnews/article/009/0005768059","pubDate":"2026-11-24T11:06:08.208808+09:00","author":"네이버뉴스","description":"휴머노이드 ‘아이언’ 개발한 샤오펑, 현장투입 계획 보류 “로봇손 작업 중 쉽게 파손” 막대한 R&D 비용도 부담돼 BYD·리오토·지리차 등도 단순 작업 위주로 목표 변경 중국 지리자동차의 프리미엄 전기차 브랜드 ‘지커’의 생산라인에 투입된 유비테크의 휴머노이드 로봇 ‘워커S1’. [시나재경] 중국의 주요 자동차 제조사들이 생산라인에 사람을 대신해 휴머노이드 로봇을 투입하겠다던 기존 사업 목표를 잇따라 하향 조정하고 있다. 휴머노이드 로봇의 낮은 작업 효율성과 내구성, 막대한 연구개발(R&D) 비용 등에 직면하면서 단순 작업 위주로 사업 방향을 전환한 것이다. 24일 중국 차이신에 따르면, 최근 중국 전기차 업체 샤오펑은 자사 휴머노이드 로봇 ‘아이언’을 자동차 공장에 투입하기 위해 1년 넘게 노력했지만 경제성이 부족하다는 결론을 내렸다. 이와 관련해 샤오펑의 허샤오펑 회장은 로봇의 손이 가장 비싼 부품인 동시에 실제 공장 작업 과정에서 쉽게 마모되고 파손돼 대규모 도입이 적절치 않다고 지적했다. 중국의 또 다른 전기차 업체인 리오토(중국명 리샹)도 휴머노이드 로봇 프로젝트의 우선순위를 낮추고 자율주행 기술 개발에 집중하고 있는 것으로 알려졌다. 특히 휴머노이드 로봇은 기존 산업용 로봇과 비교해 가격 경쟁력이나 내구성 측면에서 크게 떨어진다. 이에 대해 저우쥔 지리자동차 제조공정센터 스마트제조부문 책임자는 차이신에 “270㎏의 중량을 들어 올릴 수 있는 대형 산업용 로봇의 가격은 휴머노이드 로봇의 일부에 불과하다”고 전했다. 이어 “(산업용 로봇의) 평균 고장 간격은 8만~10만 시간에 달한다”며 유연성이 부족하다는 점만 빼면 산업용 로봇이 휴머노이드 로봇보다 더 효율적이라고 설명했다. 막대한 R&D 비용도 부담으로 작용하고 있다. 애초 샤오펑은 10년간 100억위안(약 2조원)을 투입해 로봇을 개발할 계획이었으나, 추후 실제 투입할 수 있는 로봇을 개발하려면 최소 500억위안(약 10조원)이 필요하다고 밝혔다. 이는 초기 예상 투자액의 5배에 달하는 규모다. 그동안 중국 주요 자동차 제조사들은 자율주행 기술과의 기술적 유사성을 내세워 휴머노이드 로봇 사업에 잇따라 뛰어들었다. 하지만 자율주행차와 달리 휴머노이드 로봇은 복잡한 3차원 공간에서 움직여야 하는 데다, 학습 데이터가 부족하고 핵심 부품의 내구성도 기술적 병목으로 작용하고 있다. 리페이건 중국공정원 원사는 “용접 과정에서 발생하는 불꽃, 컨베이어벨트의","category":"IT 과학"},{"title":"“순수 자연저능으로 풀었습니다”… 밈이 된 ‘딸깍’까지, AI시대 웃픈 유행어","link":"https://n.news.naver.com/mnews/article/023/0004011362","naverLink":"https://n.news.naver.com/mnews/article/023/0004011362","pubDate":"2026-11-24T11:06:07.880055+09:00","author":"네이버뉴스","description":"[비즈톡] 3줄 요약 ㆍ '딸깍' 33만 5000건 집계 기준 언급량 1위 ㆍ '환각'·'증류' 등 익숙한 단어의 새 뜻 ㆍ 올해의 단어 '휴먼'과 인간 프리미엄 현상 일러스트=조선디자인랩·Midjourney “순수 ‘자연저능’으로 문제를 풀어봤습니다” 최근 소셜미디어에선 AI 도움 없이 제 머리로 문제를 풀었다는 말을 이렇게도 합니다. ‘인공지능’의 ‘인공’을 ‘자연’으로, ‘지능’을 ‘저능’으로 바꾼 말장난입니다. 세무사 시험 수석 합격자가 AI를 썼다고 자백한 뒤로, 수험가에선 이례적인 고득점을 두고 누구 솜씨인지부터 묻는 일까지 생겼습니다. 척척 답을 내놓는 기계가 ‘인공지능’이라면, 답 하나 고르려고 한참을 끙끙대는 사람은 ‘자연저능’이라는 겁니다. 올해 들어 가장 많이 쓰인 ‘밈(meme·온라인에서 많이 쓰이는 유행어나 표현)’으론 ‘딸깍’이 꼽혔습니다. 마우스 버튼을 누르는 소리로, 게임에서 클릭 한 번으로 손쉽게 성과를 낼 때 쓰던 표현인데, 보고서 초안 한 편도, 발표 자료에 넣을 삽화 한 장도 AI로 뚝딱 만드는 상황에 쓰는 말입니다. 트렌드 분석 플랫폼 ‘퀘타아이’에서 올해 10월 20일까지 인스타그램·유튜브·X 등 언급량을 합산한 결과 ‘딸깍’은 33만 5000건으로 집계 기준 언급량 1위였습니다. “와… 너 진짜 핵심을 찔렀어.” 챗GPT를 써본 사람이라면 귀에 익은 말입니다. 가벼운 질문에도 칭찬부터 건네는 특유의 말투죠. 이제는 친구가 뻔한 얘기를 해도 짐짓 감탄하며 이렇게 받아칩니다. 사람처럼 말하라고 AI를 가르쳐 놨더니, 이제는 사람끼리 챗GPT 성대모사를 하는 셈입니다. AI가 일상에 스며들면서 익숙한 단어에도 새 뜻이 붙고 있습니다. 미국 뉴욕타임스(NYT)도 지난 18일 ‘AI는 우리가 말하는 방식을 바꿨다’며 AI 시대를 이해할 단어 30개를 소개했습니다. 눈에 띄는 건 이미 안다고 생각했던 단어들입니다. 사람이 헛것을 볼 때 쓰던 ‘환각’은 챗봇이 있지도 않은 논문을 지어낼 때도 씁니다. 술을 빚을 때 듣던 ‘증류’는 성능 좋은 AI의 답을 본보기 삼아 다른 AI를 가르치는 기술을 가리킵니다. 영국 케임브리지 사전이 고른 올해의 단어는 오히려 가장 익숙한 단어 ‘휴먼(human·인간의)’입니다. 예전엔 글 한 편에 ‘사람이 썼다(human-written)’고 붙이면 하나마나 한 소리였습니다. 이제는 그 한마디가 독자가 그 글을 골라 읽는 이유가 되기도 합니다. 사전 측은","category":"IT 과학"},{"title":"AI 투자 속도 조절 나선 엔비디아…젠슨 황 복귀로 달라질까","link":"https://n.news.naver.com/mnews/article/092/0002446571","naverLink":"https://n.news.naver.com/mnews/article/092/0002446571","pubDate":"2026-11-24T11:06:07.880040+09:00","author":"네이버뉴스","description":"젠슨 황 공백기 투자 심사 강화 방침 발표…오픈AI 등 주요 AI 기업 자금 지원 향방 관심 인공지능(AI) 기업에 대한 투자 심사를 강화하겠다고 밝힌 엔비디아에 젠슨 황이 돌아왔다. 황이 최고경영자(CEO) 자리를 비운 사이 나온 방침인 만큼, 오픈AI 등 주요 AI 기업에 대한 자금 지원 전략도 달라질 수 있다는 관측이 나온다. 24일 엔비디아에 따르면 회사 이사회는 젠슨 황의 사장 겸 최고경영자(CEO)와 이사회 이사 복귀를 만장일치로 의결했다. 지난 12일 사임한 지 11일 만이다. 임시 CEO를 맡았던 콜레트 크레스 최고재무책임자(CFO)는 기존 직무로 돌아간다. 황 CEO는 \"새로운 산업혁명이 시작되는 시점에 세계에서 가장 중요한 기술 기업 중 하나인 엔비디아로 돌아와 회사를 이끌게 돼 영광\"이라며 \"겸허한 자세와 새로운 각오로 책임을 다하겠다\"고 말했다. 엔비디아 이사회는 젠슨 황의 사장 겸 CEO와 이사회 이사 복귀를 만장일치로 의결했다. (사진=지디넷코리아) 엔비디아는 황이 자리를 비운 동안 AI 기업 투자에 더 엄격한 기준을 적용하겠다는 방침을 공개했다. 크레스 CFO는 지난 17일 실적 발표에서 신규 투자와 자금 지원, 금융 보증을 면밀히 심사하고 지원 대상도 신중하게 선정하겠다고 밝혔다. 크레스 CFO는 \"시장이 성숙하고 새로운 자금 조달 경로가 생기면서 향후 투자와 약정, 보증을 엄격하게 평가하고 있다\"고 말했다. 엔비디아는 그동안 AI 반도체를 판매하는 데 그치지 않고 고객사에 투자하거나 데이터센터 건설에 필요한 자금 조달을 지원해 왔다. AI 기업이 대규모 연산시설을 구축하도록 돕고, 해당 시설에 엔비디아 반도체를 공급하는 방식이다. 대표 사례는 오픈AI다. 엔비디아는 지난 8월 미국 오하이오주 데이터센터 사업에 최대 1050억 달러(약 141조원) 규모 금융 보증을 제공하기로 했다. 소프트뱅크 계열 SB에너지가 개발하는 시설로, 오픈AI는 이곳을 20년간 임차해 엔비디아 AI 연산장비를 사용할 예정이다. 엔비디아가 오픈AI에 1050억 달러를 직접 투자하는 것은 아니다. 데이터센터 건설과 임대 계약에 필요한 자금 조달을 보증하는 방식이다. 보증은 시설이 완공돼 가동을 시작하면 단계별로 효력이 발생한다. 크레스 CFO가 밝힌 투자 심사 강화 방침은 기존 계약을 철회한다는 의미는 아니다. 그는 실적 발표 당시 금융 보증 관련 조건을 새롭게 변경한 건 아니며 향후 지원 대상을 보다 신중하","category":"IT 과학"},{"title":"한국인 1만명 유전자 지도 완성…질병·노화 연구의 새 기준[과학을읽다]","link":"https://n.news.naver.com/mnews/article/277/0005846791","naverLink":"https://n.news.naver.com/mnews/article/277/0005846791","pubDate":"2026-11-24T11:06:07.880032+09:00","author":"네이버뉴스","description":"기존 국제 DB에 없는 유전변이 988만개 확인…희귀 변이 연구 기반 확대 유전적 차이가 생체 나이 측정에도 영향…한국인 맞춤형 정밀의료 기대 같은 질병에 걸려도 사람마다 증상과 진행 속도는 다르다. 같은 나이인데도 신체의 노화 정도가 다른 이유 역시 유전적 차이와 관련이 있다. 이러한 차이를 이해하려면 개인의 유전정보뿐 아니라 수많은 사람의 유전정보를 비교할 수 있는 기준이 필요하다. 한국인 1만여명의 유전체(게놈)를 분석해 구축한 대규모 유전정보 지도가 주목받는 이유다. 이번 연구에서는 기존 국제 데이터베이스에 등록되지 않은 유전변이 988만개가 확인됐다. 개인의 유전적 차이가 생체 나이 측정 결과에도 영향을 줄 수 있다는 사실도 밝혀졌다. 한국인의 유전적 특성을 반영한 질병 연구와 노화 분석의 정확도를 높일 수 있는 기반이 마련된 셈이다. 한국인 1만 명의 게놈에 분자·건강정보를 연결한 Korea10K. 연구팀 제공 울산과학기술원(UNIST)은 게놈센터(KOGIC)를 중심으로 한국생명공학연구원, 울산대학교병원, 한국표준과학연구원, 미국 하버드 의대 등이 참여한 공동연구팀이 한국인 1만239명의 전장게놈과 건강정보 등을 연결한 대규모 참조데이터 '코리아10K(Korea10K)'를 구축했다고 24일 밝혔다. 연구 결과는 지난 20일 국제학술지 '게놈 바이올로지(Genome Biology)'에 게재됐다. 한국인 희귀 유전변이까지 확보…정밀의료 기반 확대 사람의 DNA는 대부분 동일하지만 일부 염기서열에는 차이가 있다. 이를 유전변이라고 한다. 특정 유전변이가 질병과 관련이 있는지 판단하려면 먼저 건강한 사람을 포함한 인구집단에서 해당 변이가 얼마나 흔하게 나타나는지 확인해야 한다. 예를 들어 환자에게서 발견된 유전변이가 일반인에게도 흔하게 나타난다면 질병의 직접적인 원인일 가능성을 판단할 때 이를 고려해야 한다. 반대로 매우 드물게 나타나는 변이라면 추가 분석이 필요하다. 다만 희귀하다는 이유만으로 질병을 일으키는 변이라고 단정할 수는 없다. 이처럼 유전정보를 해석할 때 비교 기준으로 활용하는 자료가 참조데이터다. 기존 국제 유전정보 데이터베이스는 다양한 인구집단의 자료를 포함하고 있지만, 한국인의 유전적 특성을 충분히 반영한 대규모 자료를 확보하는 일도 중요하다. 연구팀은 한국인 1만239명의 게놈에서 모두 6122만개의 유전변이를 확인했다. 이 가운데 988만개(16.1%)는 국제 유전변이 데이터베이스인 '","category":"IT 과학"},{"title":"삼성전자, 임원 131명 승진… HBM·AI·로봇 기술 인재 발탁","link":"https://n.news.naver.com/mnews/article/366/0001206838","naverLink":"https://n.news.naver.com/mnews/article/366/0001206838","pubDate":"2026-11-24T11:06:07.880030+09:00","author":"네이버뉴스","description":"부사장 39명·상무 78명 등 총 131명 승진… 지난해 161명보다 18.6% 감소 HBM4·차세대 D램 개발 인재 중용… 파운드리 기술·고객 확보 인력 발탁 로봇·AI 등 미래사업 기술 인재 승진… 여성 신임 승진자 11명 ‘역대 최다’ 서울 서초구 삼성전자 서초 사옥./뉴스1 삼성전자가 올해 정기 임원인사에서 지난해보다 30명 줄어든 131명을 승진시켰다. 전체 승진 규모는 축소했지만 역대 최대 실적을 낸 반도체 부문에서는 승진자를 늘렸다. 고대역폭메모리(HBM)와 차세대 D램 개발에 기여한 기술 인재를 중용하고, 인공지능(AI)·로봇·파운드리(반도체 위탁생산) 등 미래사업 분야에서도 핵심 인력을 발탁했다. 삼성전자는 부사장 39명, 상무 78명, 펠로우(Fellow) 2명, 마스터(Master) 12명 등 총 131명 규모의 ‘2027년 정기 임원인사’를 실시했다고 24일 밝혔다. 전체 승진 규모는 전년 대비 18.6% 감소했다. 직급별로는 부사장이 12명, 상무가 15명, 마스터가 4명 줄었고 펠로우는 1명 늘었다. 사업 부문별로는 완제품 사업을 담당하는 디바이스경험(DX)부문에서 61명, 반도체를 담당하는 디바이스솔루션(DS)부문에서 70명이 승진했다. 지난해 DX부문 92명, DS부문 69명과 비교하면 DX부문 승진자는 31명 줄었지만 DS부문은 1명 늘었다. 전체 승진자에서 DS부문이 차지하는 비중도 지난해 42.9%에서 올해 53.4%로 높아졌다. 삼성전자 측은 “AI 수요 확대에 대응해 역대 최대 실적을 이끈 반도체 핵심 인재를 중용하며 ‘성과 있는 곳에 보상 있다’는 성과주의 인사 원칙을 재확인했다”고 전했다. 삼성전자의 6세대 고대역폭메모리(HBM)인 HBM4./삼성전자","category":"IT 과학"},{"title":"홍보비 2兆 썼지만…통신 3사, 제자리 점유율에 AI ‘가속도’","link":"https://n.news.naver.com/mnews/article/016/0002727482","naverLink":"https://n.news.naver.com/mnews/article/016/0002727482","pubDate":"2026-11-24T11:06:07.880027+09:00","author":"네이버뉴스","description":"SKT 39%·KT 23%·LGU+ 19% 점유율 요지부동 설비투자는 ‘4조’ 육박…AI 수요 대응 본격 움직임 “AI 시대, 토큰 효율성 필수…통신사 경쟁 새 국면” 서울 도심 내 이동통신사 대리점 모습. [헤럴드DB] [헤럴드경제=고재우 기자] 지난해부터 올해 초까지 위약금 면제에 따른 번호이동이 잦아들면서 통신 3사의 가입자 유치 경쟁도 힘을 잃고 있다. 올해 3분기에만 마케팅 비용으로 ‘2조원’을 쏟아부었으나, 이동통신(MNO) 점유율은 요지부동이다. 이에 통신 3사는 인공지능(AI) 기업으로의 전환을 가속하는 모양새다. 최근에는 AI 인프라를 넘어 기업 고객의 AI 비용을 줄이기 위한 토큰 사업에 뛰어들었다. 정부도 통신 3사의 AI 기업 전환을 적극적으로 주문하고 있다. 24일 업계에 따르면 통신 8월 기준 3사의 이동통신(MNO) 점유율은 SK텔레콤 39.10%, KT 23.22%, LG유플러스 19.51% 등으로 집계됐다. 지난해부터 올해 초까지 이어진 위약금 면제 기간에 통신 3사는 가입자 유치를 위해 사활을 걸었다. 하지만 SK텔레콤의 MNO 점유율 40% 달성도, LG유플러스의 20%대 첫 진입도 없었다. 이동통신단말장치 유통구조 개선에 관한 법률(단통법) 폐지와 갤럭시 Z 폴드8, 아이폰 듀오 출시로 인한 가입자 유치 효과도 미미했다. 통신 3사가 올해 3분기에만 2조원이 넘는 돈을 쏟아부었으나 점유율 고착화를 막지 못했다는 의미다. 통신 3사는 AI 사업 전환에 눈을 돌렸다. 실제로 올해 3분기까지 통신 3사의 누적 설비투자액(CAPEX)은 3조8266억원으로 전년 동기 대비 13.7% 증가했다. 구체적으로 LG유플러스 1조3648억원, KT 1조2282억원, SK텔레콤(SK하이퍼 포함) 1조2336억원 등이다.","category":"IT 과학"},{"title":"AI 반도체 섞어 비용 낮춘다…통신사 ‘칩믹스’ 전략은 [IT클로즈업]","link":"https://n.news.naver.com/mnews/article/138/0002249651","naverLink":"https://n.news.naver.com/mnews/article/138/0002249651","pubDate":"2026-11-24T11:06:07.880025+09:00","author":"네이버뉴스","description":"정석근 SK텔레콤 CTO 겸 AI CIC장이 ‘소버린 AI 인프라’ 주제로 브리핑을 하고 있는 모습. [사진=SK텔레콤] [디지털데일리 정혜승기자] \"100쪽짜리 보고서를 세 줄로 요약해줘.\" \"인공지능(AI) 소재로 장편 소설을 써줘.\" 같은 생성형 AI에 던진 주문이어도 AI 반도체가 하는 일은 다르다. 전자는 긴 입력을 처리하는 데, 후자는 답변을 길게 생성하는 데 더 많은 자원이 필요하다. 24일 업계에 따르면 국내 이동통신사가 최근 '칩믹스'에 주목하고 있다. AI 추론을 작업 단계별로 나누고, 각 단계에 맞는 그래픽처리장치(GPU)와 신경망처리장치(NPU)를 조합하는 식이다. 이는 AI 추론이 두 단계로 나뉘는 데서 출발했다. 대형언어모델(LLM)의 추론은 '프리필(Prefill)'과 '디코드(Decode)'로 나뉜다. 프리필은 질문과 첨부 자료 등 입력을 처리하는 단계다. 많은 입력 토큰을 병렬로 계산할 수 있어 연산 처리 능력이 중요하다. 이때 계산한 일부 결과는 이후 답변 생성에 재사용하기 위해 'KV 캐시'로 저장한다. 디코드는 답변을 토큰 단위로 이어가는 단계다. AI의 학습 결과물인 가중치와 KV 캐시를 반복해서 읽어야 한다. 디코드 단계에서는 메모리에서 필요한 데이터를 가져오는 속도가 처리 성능을 좌우한다. 즉 프리필에는 대규모 병렬 연산에 강한 GPU가 적합하다. 디코드에는 빠른 메모리 접근과 전력 효율을 갖춘 GPU나 추론 특화 NPU 등을 활용할 수 있다. 다만 칩의 종류만으로 역할이 정해지는 것은 아니다. 제품별 연산·메모리 성능과 비용, 작업 내용도 따져야 한다. ◆ 칩 조합부터 서비스 운영…통신사, 추론 인프라 경쟁 국내 통신사도 칩믹스 사업에 나섰다. 작업마다 맞는 반도체를 조합해 기업이 쓸 수 있는 AI 서비스로 연결하는 역할을 노린다. 칩 확보에 그치지 않고 모델을 안정적으로 운영하겠다는 것이다. SK텔레콤은 지난 9일 엔비디아·리벨리온과 업무협약을 맺었다. GPU·NPU 통합 시스템을 개발·검증하기 위해서다. 여기서 엔비디아 GPU가 프리필을 맡는다. 리벨리온이 개발 중인 NPU '리벨 R200'은 디코드를 담당한다. 두 반도체는 엔비디아의 고속 연결 기술 'NV링크 퓨전'과 서버 랙 규격 'MGX'로 묶는다. SK텔레콤의 몫은 운영이다. 데이터센터 구축·운영 경험을 바탕으로 이 통합 시스템을 도입한다. 성능과 안정성을 실증하고 상용화 가능성을 검토한다. 정석근 SK텔레","category":"IT 과학"},{"title":"\"불황보다 무섭다\" 취준생들 '한숨'…AI에 가로막혔다","link":"https://n.news.naver.com/mnews/article/015/0005357449","naverLink":"https://n.news.naver.com/mnews/article/015/0005357449","pubDate":"2026-11-24T11:06:07.880003+09:00","author":"네이버뉴스","description":"진학사 캐치, 구직자 1330명 조사 구직자들 \"AI로 인력 수요 줄어\" 'AI 면접' 등 새로운 전형 부담 사진=챗GPT 생성 이미지 올 하반기 취업에 도전한 구직자 4명 중 3명이 취업난을 체감한 것으로 나타났다. 특히 채용공고가 줄어든 원인으로 인공지능(AI) 도입을 지목하는 구직자도 크게 늘었다. AI가 기업의 인력 수요를 줄이고 있다는 인식이 확산하고 있다는 관측이다. 채용 과정에 도입된 AI 면접 등 새로운 전형 방식도 부담으로 작용하고 있다. 24일 채용 플랫폼 진학사 캐치에 따르면 하반기 채용에 지원한 구직자 770명 중 75%는 '취업이 어려웠다'고 답했다. 이번 조사는 지난 3~10일 캐치 회원 1330명을 대상으로 온라인을 통해 진행됐다. '역대급으로 어려웠다'는 응답은 43%로 가장 많았다. '작년보다 어려웠다'는 응답도 32%에 달했다. 반면 '작년과 비슷했다'는 24%, '역대급으로 원활했다'는 1%에 그쳤다. 구직자들이 취업난을 체감하는 이유는 채용공고가 감소했다고 느껴서다. 하반기 실제 지원자 가운데 70%가 지난해보다 채용공고가 줄었다고 답했다. 이 중 38%는 '확실히 줄었다', 32%는 '다소 줄어든 것 같다'고 평가했다. 구직자들이 생각하는 채용공고 감소 원인으로는 AI가 지목됐다. 채용공고가 줄었다고 느낀 538명에게 이유를 복수응답으로 묻자 59%(복수응답)가 'AI 도입으로 인력 수요 자체가 줄어서'라고 답했다. 이는 올 상반기 조사 당시(23%)보다 36%포인트 확대된 수치다. AI를 채용감소 원인으로 지목한 비율이 약 2.6배로 늘어난 셈이다. 반대로 '경기 침체·기업 실적 악화'를 원인으로 꼽은 비중은 상반기 38%에서 하반기 17%로 21%포인트 낮아졌다. 상반기에는 경기 침체가 가장 많이 지목됐지만 하반기엔 AI가 상위에 올랐다. 경력직 중심 채용으로 신입 공고가 줄었다는 응답도 37%에 달했다. 정규직 대신 외주·프리랜서·계약직으로 대체하고 있다는 답변은 14%, 특정 직무나 산업에 채용이 집중됐다는 응답은 8%를 기록했다. AI는 취업 준비 과정에서 부담을 키우는 요인으로도 꼽혔다. 하반기 지원자 770명에게 취업 준비 중 어려운 점을 물은 결과 'AI 면접 등 새로운 전형 방식 대응'이 41%로 1위를 차지했다. '너무 높은 합격 기준'이 38%로 뒤를 이었고 '심리적 압박감·번아웃'도 23%에 달했다. 자격증·어학·경험 등 이른바 스펙을 준비하는 데 부담","category":"IT 과학"},{"title":"삼성전자, 차세대 HBM·D램 개발 주역 대거 승진…AI·로봇 등 신사업 리더도 전진배치","link":"https://n.news.naver.com/mnews/article/366/0001206871","naverLink":"https://n.news.naver.com/mnews/article/366/0001206871","pubDate":"2026-11-24T11:06:07.880001+09:00","author":"네이버뉴스","description":"승진 131명, 지난해보다 30명 축소… 사상 최대 실적에도 ‘선별’ “DS 70명·DX 61명”… 전체 승진자 중 반도체 비중 53% 여성 신임 승진자 11명, 역대 최다 삼성전자 서초사옥 전경. /뉴스1 삼성전자가 반도체 사업 성과에 보상하는 성과주의 원칙을 재확인하는 한편 파운드리(반도체 위탁생산)·로봇·인공지능(AI) 분야 기술 리더를 대거 발탁했다. 사상 최대 실적에도 전체 승진 규모는 지난해보다 줄여 선별 기조를 분명히 했다. 삼성전자는 24일 부사장 39명, 상무 78명, 펠로우 2명, 마스터 12명 등 총 131명을 승진시키는 2027년 정기 임원인사를 단행했다고 밝혔다. 지난해 161명(부사장 51명, 상무 93명, 펠로우 1명, 마스터 16명)보다 30명 적은 규모다. 지난해 5년 만에 늘었던 승진자 수가 한 해 만에 다시 줄었다. 영업이익 107조 이끈 DS부문… HBM4 양산 주역 부사장 발탁 우선 역대 최고 실적을 이어가고 있는 반도체 부문에 대해서는 성과주의 기조의 인사 기조를 다시 확인했다. 앞서 삼성전자 반도체를 담당하는 디바이스솔루션(DS)부문은 3분기 영업이익이 106조5000억원을 기록한 바 있다. 영업이익률은 72%에 달했다. 반면 디바이스경험(DX)부문은 영업손실 8000억원으로 2개 분기 연속 적자를 냈다. DS부문 실적을 견인한 것은 고대역폭메모리(HBM4)와 최첨단 D램이다. 특히 삼성전자는 올해 업계 최초로 HBM4 양산 출하에 들어갔고, 엔비디아의 차세대 AI 가속기 ‘베라 루빈’ 공급을 위한 최종 품질 검증을 통과한 것으로 알려졌다. AMD와도 3월 양해각서(MOU)를 맺고 차세대 AI 가속기 ‘MI455X’용 HBM4 주공급사로 이름을 올렸다. 이런 성과는 인사에도 반영됐다. 하경수 DRAM설계2그룹장은 업계 최고 성능의 HBM4 개발과 세계 최초 양산 공급을 이끈 공로로 부사장에 올랐다. 박태훈 D램 YE팀장은 수율 극대화와 HBM4 양산성 확보에 기여했다는 평가를 받았다. 김명오 D램설계1그룹 부사장, 박진표 D램설계2그룹 부사장 등도 승진했다. 파운드리·로봇·AI 분야도 발탁 승진…수주·기술 성과에 보상 파운드리사업부는 적자에도 불구하고 수주 규모가 늘고 있고 흑자전환에 가까워졌다는 점에 포커스를 맞춰 승진 인사를 단행한 것으로 보인다. 송태중 Technology Planning2팀장, 이호 PA2팀장, 류효겸 IP개발팀장이 부사장으로 승진했다. 송태중 부","category":"IT 과학"}]},"popular":[{"title":"'가죽 재킷' 벗은 젠슨 황 “더 나은 CEO가 되겠다”","link":"https://n.news.naver.com/article/422/0000929253?ntype=RANKING","pubDate":"2026-11-24T11:06:10.936427+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"딸 순산 기원하며 통장에 '차곡차곡'…\"만 원의 사랑 고백\"","link":"https://n.news.naver.com/article/422/0000929193?ntype=RANKING","pubDate":"2026-11-24T11:06:10.936454+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스
