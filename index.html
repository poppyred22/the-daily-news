 Arch Cemetery","link":"https://n.news.naver.com/mnews/article/077/0007244781","naverLink":"https://n.news.naver.com/mnews/article/077/0007244781","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"APTOPIX Trump Triumphal Arch Cemetery Bart Collart poses for a photograph by the grave of his son, Marine Cpl. Spencer R. Collart, who died in a 2023 Osprey helicopter crash, Wednesday, Nov. 18, 2026, in Section 52 of Arlington National Cemetery in Arlington, Va. (AP Photo/Julia Demaree Nikhinson)","category":"세계"},{"title":"후티 반군, 사우디 금융센터 등 '민간 시설'에 보복 예고","link":"https://n.news.naver.com/mnews/article/055/0001404662","naverLink":"https://n.news.naver.com/mnews/article/055/0001404662","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"▲ 후티 반군의 공격으로 파손된 사우디 수도 리야드의 PIF 타워 예멘의 친이란 반군 후티가 사우디아라비아 수도 리야드의 핵심 금융 시설을 비롯한 민간 시설에 대한 공세를 예고했습니다. 후티는 현지 시간 20일 성명을 통해 사우디 측이 예멘 사다와 모카 발전소를 겨냥해 공격을 가한 데 대한 보복 조치로 사우디 슈카이크 발전소가 자신들의 정당한 타격 목표가 될 것이라고 천명했습니다. 후티는 그러면서 이곳에서 일하는 모든 노동자와 직원에게 즉각 대피할 것을 경고하고 민간인의 접근 금지를 당부했습니다. 후티는 이어 \"적국 사우디의 수도 리야드에 위치한 킹 압둘라 금융지구(KAFD) 내 금융센터도 우리 군의 군사 표적\"이라며 \"이 시설의 모든 직원과 노동자, 민간인은 즉시 멀리 떨어지라\"고 촉구했습니다. 앞서 후티는 전날에도 이 금융지구에 있는 80층 높이의 사우디 국부펀드(PIF) 타워를 공격해 파손한 바 있습니다. 홍해 연안 항구를 둘러싼 맞대응 위협도 이어졌습니다. 후티는 \"적이 예멘 호데이다 항구 폭격 위협을 실행에 옮길 경우, 제다 등 홍해 연안의 모든 사우디 항구가 우리 군의 표적이 될 것\"이라고 공언했습니다. 후티는 항구 인근에서 일하는 노동자 체류자에게 현장에서 벗어날 것을 경고하는 한편, 모든 해운사에도 해당 항구에서 선박을 즉시 철수시키라고 요구했습니다. 항공사들을 향한 운항 경고도 덧붙였습니다. 후티는 \"메카와 메디나 상공의 신성한 영공을 제외한 사우디 영공은 향후 몇 시간 동안 우리 군사작전의 무대가 될 것\"이라며 \"사우디 영공은 안전하지 않다\"고 경고했습니다. 앞서 사우디가 주도하는 연합군은 이날 예멘의 주요 항구인 호데이다 항구 내 민간인들에게 대피를 경고했습니다. 투르키 알말키 연합군 대변인은 엑스(X)를 통해 \"동맹군 합동사령부는 민간인들의 안전을 위해 호데이다 항구에서 대피할 것을 요청한다\"고 밝혔습니다. (사진=연합뉴스)","category":"세계"},{"title":"FINLAND FIGURE SKATING","link":"https://n.news.naver.com/mnews/article/091/0010374430","naverLink":"https://n.news.naver.com/mnews/article/091/0010374430","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"ISU Figure Skating Grand Prix Finlandia Yuseong Kim of South Korea performs during the Women Short Program of the ISU Grand Prix event Finlandia Trophy in Helsinki, Finland, 20 November 2026. EPA/KIMMO BRANDT","category":"세계"},{"title":"푸틴, 미중러 회담 직후 키이우 교량 공격…\"역대 최대 규모\"","link":"https://n.news.naver.com/mnews/article/055/0001404661","naverLink":"https://n.news.naver.com/mnews/article/055/0001404661","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"▲ 우크라이나 공격을 받은 크림대교 블라디미르 푸틴 러시아 대통령이 중국에서 사상 첫 미국·중국·러시아 3자 정상회담을 한 직후부터 우크라이나에 대한 공격을 강화하고 있습니다. 로이터 통신에 따르면 우크라이나 수도 키이우의 비탈리 클리치코 시장은 회담 이튿날인 현지 시간 20일 키이우의 드니프로강을 가로지르는 교량 3곳이 러시아 탄도미사일 공격으로 피해를 봤다고 텔레그램을 통해 밝혔습니다. AFP통신도 이날 러시아군이 미사일과 드론을 이용해 키이우 교량 3곳을 타격해 2곳이 피해를 봤다고 전했습니다. 이 때문에 강 우안에서 좌안으로 차량 통행이 통제되고 있습니다. 키이우에는 400만 명의 시민이 살고 있는데 드니프로강 동·서안을 잇는 다리는 8개에 불과합니다 푸틴 대통령은 전날 기자회견에서 3국 정상회의 직전 감행된 우크라이나의 크름대교 공격을 언급하며 \"우리의 보복 조치가 훨씬 더 고통스러울 것\"이라며 응징을 예고했습니다. 앞서 우크라이나군은 지난 16∼17일 미사일과 드론으로 크름대교를 공격했습니다. 크름대교는 2014년 러시아가 우크라이나 영토인 크름반도를 강제 병합한 이후 2018년 푸틴 대통령이 직접 개통한 다리로 양국 갈등의 상징으로 여겨집니다. 크름반도 해안에서 촬영된 사진을 보면 우크라이나의 공격으로 교량의 안정성을 담보하는 아치뿐 아니라 아스팔트 도로 약 200ｍ가 바다로 무너져 내렸습니다. 이날 우크라이나 원자력발전을 위한 변전소와 송전선 등도 목표가 됐습니다. 우크라이나군은 러시아가 밤새 400대 이상의 공격용 드론과 27발의 탄도미사일을 포함해 110발 이상의 미사일을 발사했다고 밝혔습니다. 볼로디미르 젤렌스키 우크라이나 대통령은 소셜미디어에 \"이번 공격은 역대 최대 규모 공격 중 하나였다\"고 썼습니다. 그러면서 전날 중국 선전에서 열린 미·중·러 정상회담을 언급하며 \"어떻게든 세계질서를 다시 그리려던 푸틴의 시도가 사실상 실패했다\"고 평가했습니다. 3자 정상회담 당일에도 러시아의 공습으로 1명이 숨지고 최소 4명이 다쳤습니다. 키이우 북부 오볼론스키에서는 러시아군 공격으로 건물에서 화재가 발생했으며 동북부 하르키우에서도 러시아군의 드론 공격으로 병원이 피해를 봤습니다. 키이우 시내에 있는 오스트리아·네덜란드 대사관도 공습으로 건물 일부가 부서졌지만 인명 피해는 없는 것으로 확인됐습니다. 톰 베렌드선 네덜란드 외교장관은 직후 \"이번 사건을 용납할 수 없다\"며 러시아 측에 강하게 항의했습니다","category":"세계"},{"title":"The Stream","link":"https://n.news.naver.com/mnews/article/077/0007244780","naverLink":"https://n.news.naver.com/mnews/article/077/0007244780","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"The Stream This combination of images shows promotional art for, from left, \"Bad Monkey,\" \"P-Valley,\" and \"Pride and Prejudice.\" (Apple TV/Starz/Netflix via AP) AP PROVIDES ACCESS TO THIS THIRD PARTY PHOTO SOLELY TO ILLUSTRATE NEWS REPORTING OR COMMENTARY ON FACTS DEPICTED IN IMAGE; MUST BE USED WITHIN 14 DAYS FROM TRANSMISSION; NO ARCHIVING; NO LICENSING; MANDATORY CREDIT","category":"세계"},{"title":"APTOPIX Israel Palestinians West Bank","link":"https://n.news.naver.com/mnews/article/077/0007244779","naverLink":"https://n.news.naver.com/mnews/article/077/0007244779","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"APTOPIX Israel Palestinians West Bank A Palestinian youth walks carrying a sack of harvested olives in the West Bank village of Abu Falah, Friday, Nov. 20, 2026, in the presence of the members of Israeli security forces. (AP Photo/Leo Correa)","category":"세계"}],"IT 과학":[{"title":"\"성실히 공부한 노력 의미 있을지\"…AI 부정행위 적발에 수험생들 허탈","link":"https://n.news.naver.com/mnews/article/088/0001041507","naverLink":"https://n.news.naver.com/mnews/article/088/0001041507","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"교육부 집계 결과 스마트기기 부정행위 총 111건 수험생들 '늑장·땜질 대책에 대한 정부 책임 물어 2027학년도 대학수학능력시험(수능)이 치러진 지난 19일 서울 영등포구 여의도여자고등학교에서 한 수험생이 단추에 스티커를 부착하고 있다. 연합뉴스 \"지금껏 성실하게 공부해 온 노력이 의미가 있나 싶은 생각이 들었어요.\" 정부가 2027학년도 대학수학능력시험(수능)에서 인공지능(AI) 부정행위를 차단하기 위해 전날까지 대책을 내놨지만 스마트기기를 원천 차단하지 못한 것으로 나타났다. 시험의 공정성 회복을 위해 보다 근본적인 대책을 세워야 한다는 지적이 나온다. 이날 교육부에 따르면 올해 수능에서 스마트기기 등 전자기기 관련 부정행위는 총 111건 적발됐다. 위급재난문자 발송에 따른 스마트기기 적발은 54건으로, 발송 단계별로 보면 1차 31건, 2차 11건, 3차 12건이다. 대구와 경북은 각 2건씩 적발됐다. 위급재난문자 발송이 아닌 다른 방법(와이파이 신호탐지 등)으로 적발된 스마트기기는 52건이다. 시험 도중 스마트기기를 활용하다 적발된 경우는 5건이다. 스마트안경 사용 1건(충남), 소형카메라·무선이어폰 사용 1건(경기), 스마트폰으로 문제 촬영 1건(서울)이다. 나머지 2건은 화장실에서 스마트폰을 사용한 경우(서울·경기)다. 최근 인공지능(AI) 부정행위 논란 속에서 시험을 치른 이들은 시험이 끝난 후에도 허탈한 심정을 내비치고 있다. 지역 고3 이승하 양은 \"적발되지 않은 부정행위자가 있을 것 같다는 생각에 불안하고 억울한 감정이 든다\"며 \"학생들의 노력이 헛되지 않도록 정부가 시험의 공정성을 보장해 줄 수 있어야 한다\"고 토로했다. 또 다른 고3 여나경 양도 \"수능 치러 가기 전날까지 규정이 계속 바뀌어서 신경이 많이 쓰였다\"며 \"평소 쓰던 필기구를 쓰지 못하게 되고 고사장에서 나눠준 수정테이프가 자꾸 떨어져서 불편함이 있었다\"고 말했다. 수능 부정행위 '늑장·땜질 대책'에 대한 정부 책임을 묻는 목소리도 커지고 있다. 고등학생과 대학생 등을 중심으로 결성된 '2027 수능 대책 요구 연대'는 다음 달 초 집회와 성명문 발표를 예고했다. 고3 주축의 '수험생 연대'도 전국 24개 시험장에서 점검 방식이 제각각이었던 사례를 제보하며 교육부 장관 사퇴와 보안 검색 강화를 촉구했다. 박남기 광주교대 명예교수는 \"짧은 시간 안에 대응하느라 정부 차원에서도 감독관 차원에서도 미흡하고 충분하지 않은 면이 있었다","category":"IT 과학"},{"title":"AI데이터센터 전력심사 간소화…초대형 사업은 우선 심사[AI픽]","link":"https://n.news.naver.com/mnews/article/001/0016454205","naverLink":"https://n.news.naver.com/mnews/article/001/0016454205","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"비수도권 50MW 이하 평가 면제…특구 내 비기술 평가도 제외 GW급 메가프로젝트에 패스트트랙…전력망 심사 대기기간 단축 AIDC 얼라이언스 출범 (서울=연합뉴스) 강민지 기자 = 배경훈 부총리 겸 과학기술정보통신부 장관 등이 29일 서울 중구 롯데호텔에서 열린 'AIDC 얼라이언스 출범식'에서 기념촬영을 하고 있다. 2026.7.29 mjkang@yna.co.kr (서울=연합뉴스) 권하영 기자 = 정부가 인공지능 데이터센터(AIDC)의 신속한 구축을 위해 전력망 심사 절차를 간소화하고, 기가와트(GW)급 이상 메가프로젝트 사업에는 평가를 우선 처리하는 '패스트트랙'을 도입한다. 과학기술정보통신부와 기후에너지환경부는 AIDC의 신속한 구축을 지원하기 위해 이 같은 내용의 전력계통영향평가 제도 개선을 추진한다고 20일 밝혔다. 전력계통영향평가는 대규모 전력 사용 시설이 지역 전력망에 미치는 영향을 사전에 검토하는 제도다. 정부는 이날 비수도권에 신축·증축·전환되는 AIDC 중 계약전력 50MW 이하 시설의 평가를 면제하는 내용의 'AIDC 특별법' 시행령을 입법예고했다. 당초 면제 기준을 100MW로 높이는 방안도 검토했으나, 이 경우에도 메가프로젝트 기가와트(GW)급 AIDC는 대부분 면제 대상에서 제외된다는 점, 사업자가 주로 비기술 평가 준비에 시간을 많이 소모한다는 점 등을 고려했다. 이에 따라 AIDC 특별법에 따른 특구 내 데이터센터는 규모와 관계없이 비기술적 평가를 면제하고 기술적 평가만 실시한다. 기후부는 관련 고시를 개정해 평가 절차를 간소화할 계획이다. 메가프로젝트에 해당하거나 AIDC 특별법에 따른 인허가 일괄처리를 신청한 데이터센터는 전력계통영향평가를 우선 처리하는 패스트트랙을 마련한다. 기후부는 현재 마련 중인 전력계통영향평가 매뉴얼에 우선 평가 규정을 명시해 사업자들의 계통 평가 대기기간을 줄이고 착공 일정 단축을 지원할 방침이다. kwonhy@yna.co.kr","category":"IT 과학"},{"title":"구리값 7개월 만에 최저인데 “마냥 좋아할 일 아니다”…AI 업계에 경고등, 왜","link":"https://n.news.naver.com/mnews/article/011/0004684372","naverLink":"https://n.news.naver.com/mnews/article/011/0004684372","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"기사와 무관한 사진. 페루의 한 구리 광산. AFP=연합뉴스 인공지능(AI) 투자 열풍에 대한 의구심이 커지면서 구리 가격이 7개월 만에 최저치로 떨어졌다. 하지만 구리값 하락으로 새 광산 개발이 늦어지면 AI 데이터센터를 짓는 비용이 오히려 늘어날 수 있다는 경고가 나왔다. 18일(현지시간) 미국 마켓워치에 따르면 이날 미국 구리 선물은 파운드당 5.6595달러로 마감해 7개월 만에 가장 낮은 수준을 기록했다. 금융정보업체 팩트셋에 따르면 이달 들어 이날까지 구리 선물은 12.6%, 필라델피아 반도체지수는 10.4% 떨어졌다. 마켓워치는 빅테크가 데이터센터에 쏟아붓는 돈만큼 매출을 낼 수 있을지 투자자들의 의구심이 커졌다고 전했다. 반도체주 매도세가 번지면서, 데이터센터가 늘면 전선용 구리 수요도 커질 것이란 기대 역시 약해졌다. 월스트리트저널(WSJ)은 달러 강세와 중국의 산업용 구리 수요 둔화 우려도 이날 구릿값을 끌어내린 요인으로 꼽았다. 다만 실제 데이터센터 수요가 식을 조짐이 아직 없다는 게 마켓워치의 설명이다. 골드만삭스는 내년 AI 인프라 구축을 위한 신규 차입액이 1조 달러(약 1331조 원)에 육박할 것으로 내다봤다. 대형 클라우드 기업 5곳이 직접 빌릴 약 4400억 달러와 개별 사업 단위로 조달할 약 5450억 달러를 합친 규모다. 남미에서 구리와 금을 탐사하는 코퍼니코메탈스의 아이번 베벡 최고경영자(CEO)는 2030년이면 데이터센터 자체에 쓰이는 구리가 세계 구리 수요의 약 3%를 차지할 것으로 추산했다. 데이터센터에 전기를 대는 시설까지 포함하면 10년 안에 그 비중이 16~18%까지 커질 수 있다고 봤다. 문제는 광산에서 구리 생산을 늘리기가 갈수록 어려워지고 있다는 점이다. 마켓워치에 따르면 2015년 이후 새로 발견되는 구리 매장지는 크게 줄었고, 이미 찾은 매장지를 개발하는 비용도 전보다 늘었다. S&P글로벌은 지난달 보고서에서 구리를 찾기 위한 평균 시추 깊이가 약 600m로, 2010년보다 50% 가까이 깊어졌다고 분석했다. 베벡 CEO는 구리값이 계속 하락하거나 가격이 크게 출렁이면 광산업체들이 탐사와 증산에 필요한 자금을 꾸준히 마련하기 어렵다고 지적했다. 그사이 데이터센터 건설이 계속돼 공급이 수요를 따라가지 못하면 데이터센터를 짓는 기업들은 배선과 전력 설비에 들어갈 구리를 더 비싸게 사야 할 수 있다는 것이다.","category":"IT 과학"},{"title":"'미트 수석'도 AI 커닝 의혹 제기되자…\"1년 아닌 6년 준비\" 성적표 공개","link":"https://n.news.naver.com/mnews/article/053/0000063219","naverLink":"https://n.news.naver.com/mnews/article/053/0000063219","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"유튜브서 알려진 준비 기간·학력 두고 의혹 확산 과거 시험지·성적표 공개하며 \"억측엔 법적 대응\" 미트 수석 합격자 최모씨. photo 온라인 커뮤니티 세무사 시험 수석 합격자의 인공지능(AI) 부정행위 자백에 이어 법학적성시험(LEET·리트) 만점자까지 부정행위 의혹에 휩싸인 가운데, 의·치의학교육입문검사(MDEET·미트) 수석 합격자로 알려진 최모(33)씨가 자신을 둘러싼 AI 부정행위 의혹을 전면 부인했다. 온라인에서 '미트냥이'로 알려진 최씨는 20일 네이버 카페 '의편사'에 입장문을 올리고 \"최근 저와 관련된 AI 부정행위 루머는 사실이 아니다\"라고 밝혔다. 의혹을 해명하기 위해 과거 시험지와 성적표 등도 공개했다. 최씨는 최근 전문직 시험 고득점자들의 부정행위 논란이 확산하는 과정에서 의혹의 대상이 됐다. 과거 유튜브 영상에서 미트 준비 기간이 1년으로 소개된 점과 협성대 중퇴 후 학점은행제로 학위를 취득한 이력 등이 온라인에서 거론됐다. 이에 최씨는 실제 치의학전문대학원 입시를 준비한 기간은 6년이라고 해명했다. 그는 \"이번 루머는 1년으로 알려진 미트 준비 기간과 출신 학교에서 시작됐다고 생각한다\"며 \"유튜브 촬영 당시 의사소통 과정에서 오해가 있었고, 선생님은 자신의 강의를 들었던 1년을 준비 기간으로 생각하셨다\"고 설명했다. 최씨에 따르면 그는 2013년 협성대에 입학해 2016년 자퇴한 뒤 학점은행제를 통해 2019년 학위를 취득했다. 같은 해 연세대 일반대학원에 진학했으나 휴학하고 치의학전문대학원 입시에 도전했다. 최모씨가 공개한 미트 시험지. photo 온라인 커뮤니티","category":"IT 과학"},{"title":"주말부터 논술·면접 줄줄이...'AI 커닝' 대응 분주","link":"https://n.news.naver.com/mnews/article/052/0002435919","naverLink":"https://n.news.naver.com/mnews/article/052/0002435919","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"수능이 끝나고 이번 주말부터 논술·면접 등 전형을 치르는 대학들은 AI 활용 부정행위를 막기 위한 각종 대책 마련에 나섰습니다. 내일(21일)과 모레 이틀 동안 고려대와 서강대, 성균관대 등 14개 대학이 논술 시험을 치릅니다. 고려대는 AI 안경 등 통신기기 검사를 강화하고 성균관대는 학교가 제공하는 필기구만 쓰게 하는 등의 지침을 마련했습니다. 경희대는 논술시험 때 일회용 앞치마를 두르도록 할 방침이고, 이달 말 수시 면접과 구술고사를 진행하는 서울대는 면접용 가운을 응시생에게 입혀 초소형 카메라 등의 촬영을 방지할 계획입니다. 오늘(20일) 전국 56개 대학 입학 관리자들은 교육부 요청으로 열린 긴급 화상 회의에서 AI 커닝 방지 대응책을 공유하기도 했습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"IT 과학"},{"title":"올해 수능 킬러문항? AI에게 물어보았다","link":"https://n.news.naver.com/mnews/article/033/0000053522","naverLink":"https://n.news.naver.com/mnews/article/033/0000053522","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"‘사람의 도리를 무너뜨리다’와 뜻이 가장 가까운 것은?…챗GPT의 선택은 ①번 “한국인도 모르겠다” 온라인서 정답 논쟁…AI는 어떻게 문제를 풀었을까 2026년 11월 19일 치러진 2027학년도 대학수학능력시험 국어영역 9번 문항. ‘무너뜨리다’의 문맥상 의미를 묻는 문제로, 온라인 커뮤니티에서 ‘한국인도 풀기 어려운 한국어 문제’라며 화제가 됐다. 챗GPT에 같은 문제를 제시한 결과 정답인 ①번을 선택했다. 온라인 커뮤니티 캡처. 2027학년도 대학수학능력시험이 치러진 다음 날인 11월 20일, 온라인 커뮤니티에 국어 시험문제 하나가 올라왔다. 문제를 소개한 게시물에는 다음과 같은 농담이 붙어 있었다. 외국인: 한국어 왜 이리 어려워 한국인: 나도 몰라 시○ 문제는 올해 수능 국어영역 9번이다. 11월 19일 치러진 실제 시험에 출제된 문항이다. 한국교육과정평가원이 공개한 문제지에도 동일한 내용이 실려 있다. 문제가 묻는 것은 ‘무너뜨리다’라는 단어의 의미다. 지문은 조선 후기 유학자 한원진의 불교 비판을 다룬다. 한원진은 불교에서 내세우는 깨달음이 선악의 분별을 뒷받침하지 못해 사람의 도리를 무너뜨릴 것이라고 주장했다. 시험에서는 이 문장에 쓰인 ‘무너뜨리다’와 의미가 가장 가까운 용례를 다섯 개의 보기에서 고르라고 했다. 불합리한 차별을 무너뜨리는 ①번, 상대의 기세를 무너뜨리는 ②번, 성벽을 무너뜨리는 ③번, 쌓인 책을 무너뜨리는 ④번, 전년도 우승자를 무너뜨리는 ⑤번이 제시됐다. 한국어를 모국어로 사용하는 사람도 잠시 고민하게 되는 문제다. 다섯 문장 모두 일상에서 자연스럽게 사용되는 표현이기 때문이다. 20일 이토랜드에는 ‘이거 답 뭔가요 전 모름 2027 수능 문제’라는 제목으로 같은 문제가 올라왔다. 댓글에서는 ①번을 선택한 사람이 많았다. 한 이용자는 “제도나 가치관 같은 추상적인 대상을 무너뜨린다는 의미이므로 ①번”이라고 설명했다. 다른 이용자는 ②번을 선택했고, “①번이 맞는 것 같지만 마음은 ②번으로 기운다”는 반응도 있었다. AI를 이용해 정답을 확인한 사람도 있었다. 한 이용자는 “구글의 AI인 제미나이에 문제를 물어봤더니 1초도 걸리지 않아 ①번이라는 답과 설명이 나왔다”고 전했다. 다른 댓글에는 각 선택지의 의미를 분석한 장문의 풀이가 올라왔다. AI가 작성한 답변처럼 보이지만 실제 사용 여부는 알 수 없다. 그렇다면 챗GPT는 어떨까. 실제로 문제 캡처를 보여주고 답을 물었다.","category":"IT 과학"},{"title":"뉴욕증시, AI주 약세 속 혼조 출발…나스닥 1.49%↓","link":"https://n.news.naver.com/mnews/article/003/0014336864","naverLink":"https://n.news.naver.com/mnews/article/003/0014336864","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[뉴욕=AP/뉴시스] 2022년 9월23일 미국 뉴욕증권거래소(NYSE) 건물 밖에 성조기가 펄럭이고 있다. 2022.09.23. *재판매 및 DB 금지 [서울=뉴시스] 권성근 기자 = 뉴욕증시 3대 지수는 20일(현지 시간) 인공지능(AI) 관련주 부진이 이어지는 가운데 혼조세로 장을 출발했다. 투자자들이 AI 관련주를 매도하고 있는 가운데 앤트로픽 주가는 개장 전 거래에서 한 때 14%까지 하락했으나 이후 일부 손실을 만회했다. 이날 뉴욕증권거래소(NYSE)에서 우량주 중심의 다우존스 30 산업평균지수는 오전 9시 35분(미 동부 시간) 기준 전장 대비 90.39포인트(0.18%) 상승한 4만9187.45를 기록했다. 반면 대형주 위주인 스탠더드 앤드 푸어스(S&P) 500 지수는 40.13포인트(0.56%) 내린 7135.70에 거래 중이다. 기술주 중심의 나스닥 지수는 355.07포인트(1.49%) 떨어진 2만3524.13을 나타냈다. 전날 뉴욕증시는 앤트로픽 상장에도 AI 업종 부진에 3대 지수 모두 2% 넘게 하락 마감했다.","category":"IT 과학"},{"title":"China Daily Life","link":"https://n.news.naver.com/mnews/article/077/0007244773","naverLink":"https://n.news.naver.com/mnews/article/077/0007244773","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"China Daily Life A chef cuts meat at a restaurant as a woman walks past in the rain in Nantou ancient city in Shenzhen, China, Friday, Nov. 20, 2026. (AP Photo/Anupam Nath)","category":"IT 과학"},{"title":"[단독]내년 수능부터 시험지에 ‘AI 방지 워터마크’ 추진","link":"https://n.news.naver.com/mnews/article/020/0003764052","naverLink":"https://n.news.naver.com/mnews/article/020/0003764052","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"서울 시내 한 안경점에서 판매중인 스마트 안경의 모습. 뉴스1 정부가 내년 대학수학능력시험부터 ‘인공지능(AI) 커닝’을 막기 위해 시험지에 육안으로 식별되지 않는 워터마크를 넣는 방안을 추진한다. 올해 수능뿐 아니라 과거 수능이라도 부정행위가 의심되는 신고가 접수되면 선별해 파헤칠 방침이다. 정부가 20일 한성숙 국무총리 주재로 연 수능 부정행위 대응 태스크포스(TF) 첫 회의에선 수능 시험지에 워터마크를 넣는 것을 추진하는 방안이 논의됐다. 사람은 볼 수 없지만 AI는 인식할 수 있는 형태로 시험지에 ‘이 문제는 풀지 말라’는 메시지를 담은 워터마크를 넣어 AI를 이용한 부정행위를 선제적으로 차단하겠다는 것. 수험생이 몸에 숨긴 초소형카메라로 시험지를 비춰도 AI가 워터마크에 적힌 글귀까지 함께 인식해 자동으로 문제를 풀지 않도록 하는 방식이다. 시험지에 워터마크를 넣는 구상은 AI 빅테크 기업의 데이터 협조 여부에 기대야 하는 방식을 넘어 선제적으로 AI 컨닝을 원천 차단하자는 취지다. 정부는 AI를 만든 빅테크 기업들의 한국지사를 통해 미국 본사에 이번 수능시간대에 한국에서 시험 문제를 촬영해 AI에게 풀이를 맡긴 데이터를 제공해달라고 요청한다는 방침이다. 부정 수험생을 적발하면 국제형사사법공조 절차에 따라 주로 미국 기업인 AI 빅테크 기업에 데이터를 제공해달라고 협조 요청한다는 구상이지만, 사생활 침해에 민감한 미국 정서상 특정인이 식별되는 데이터를 온전히 제공받기 어려울 수 있다는 우려도 적지 않은 상황이다. 또한 정부는 올해 이전에 치러진 수능에 대해서도 부정행위 의혹이 접수된 신고를 중심으로 수사하겠다는 방침을 정했다. 최대 1억 원의 포상금이 걸린 수능 부정행위 의심사례 신고·제보 과정에서 접수된 사례 중 신빙성 있는 것을 선별해 들여다보겠다는 것. 특히 작년 수능의 경우 한 총리가 시험지 보존을 지시한 만큼 증거도 남아있는 상태다. 정부 당국자는 “시험지가 남아있지 않은 재작년 이전 시험도 일단 신빙성 있는 신고가 접수되면 수사해 부정행위를 발본색원하겠다는 의지”라고 말했다.","category":"IT 과학"},{"title":"‘AI 렌즈’도 등장 “안경 벗어도 못 잡겠네”…눈 뜨면 화면이 ‘띠링’ 1mm도 안 되는 기술","link":"https://n.news.naver.com/mnews/article/011/0004684534","naverLink":"https://n.news.naver.com/mnews/article/011/0004684534","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"‘AI 렌즈’도 등장 “안경 벗어도 못 잡겠네”…눈 뜨면 화면이 ‘띠링’ 1mm도 안 되는 기술. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-19","weekday":"목요일","label":"보관 · 11월 19일 목요일","total":50,"categories":{"사건 사고":[{"title":"서울 관악구 봉천동 공동주택 불‥3명 부상·10여 명 대피","link":"https://n.news.naver.com/mnews/article/214/0001536799","naverLink":"https://n.news.naver.com/mnews/article/214/0001536799","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"[사진출처 : 서울관악소방서] 어제(19일) 저녁 7시 25분쯤, 서울 관악구 봉천동의 한 공동주택 지하 2층에서 불이 났습니다. 이 불로 3명이 다쳐 병원으로 옮겨졌고, 건물에 있던 11명이 소방에 구조됐으며, 5명이 스스로 대피했습니다. 또 불이 난 주택의 주민 등 이재민 3명이 인근 숙박시설에서 묵게 됐습니다. 소방당국은 1시간 만인 저녁 8시 반쯤 불을 완전히 끄고, 정확한 화재 원인과 피해 규모를 조사하고 있습니다.","category":"사건 사고"},{"title":"프로배구 보던 남성 쓰러져…병원 이송했지만 사망","link":"https://n.news.naver.com/mnews/article/422/0000927999","naverLink":"https://n.news.naver.com/mnews/article/422/0000927999","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"프로배구 보던 남성 쓰러져…병원 이송했지만 사망. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"재난문자 피하는 ‘탈옥’ 있었을 수도? 수능 부정행위 98건 적발","link":"https://n.news.naver.com/mnews/article/005/0001886330","naverLink":"https://n.news.naver.com/mnews/article/005/0001886330","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"강경 대응 예고에도 위반 속출 세 번째 재난문자서도 7명 추가 적발 휴대전화 껐다 켜며 단속 피했거나 운영체제 제한 해제 ‘탈옥’ 가능성도 2027학년도 대학수학능력시험을 이틀 앞둔 17일 스마트안경 너머로 서울 시내의 한 수능 시험장 학교 모습이 보이고 있다. 뉴시스 정부가 인공지능(AI)을 활용한 부정행위를 막기 위해 강도 높은 대책을 시행한 19일 대학수학능력시험에서 다양한 부정행위 의심 사례가 적발됐다. 휴대전화를 신발에 숨기거나 소형 카메라·무선 이어폰을 소지하고, 스마트 안경을 사용한 수험생 등이 적발된 것이다. 특히 시험장에 몰래 반입한 휴대전화를 찾아내기 위해 위급재난문자를 세 차례 발송했지만 마지막 문자에서도 7명이 추가 적발됐다. 일부 수험생이 휴대전화 전원을 껐다 켜는 등의 방법으로 단속을 피하려 했을 가능성이 제기된다. 19일 교육부에 따르면 이날 수능에서 부정행위로 적발된 사례는 총 98건이다. 정부는 시험 전 스마트 기기를 이용한 부정행위가 확인되면 고발·수사 의뢰하고 향후 10년간 수능 응시 자격을 제한하는 방안을 추진하겠다고 예고했다. 강력한 처벌 방침에도 규정 위반 사례가 100건 가까이 나온 것이다. 이 가운데 스마트 기기 활용 등 중대한 부정행위로 분류된 사례는 5건이다. AI 안경 사용, 소형 카메라·무선 이어폰 소지, 휴대전화로 문제지 촬영, 화장실에서 휴대전화 사용 2건 등이다. 교육부는 이들 5건에 대해 더욱 엄중한 책임을 묻겠다는 방침이다. 적발된 98명 모두 부정행위심의위원회 심의를 거쳐 최종 처분이 결정된다.","category":"사건 사고"},{"title":"승려 출신 50대 수능 응시생 스마트폰서 재난경보…응시 기회 박탈","link":"https://n.news.naver.com/mnews/article/081/0003701315","naverLink":"https://n.news.naver.com/mnews/article/081/0003701315","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"제출 안 하고 복도 가방에 보관했다가 퇴실 조치 대학수능시험 - 한 수험생이 지난해 11월 2026학년도 대학수학능력시험(수능)에 응시하고 있다. 사진공동취재단 2027학년도 대학수학능력시험에 도전한 중년 수험생이 스마트폰을 제출하지 않았다가 응시 기회를 박탈당했다. 19일 교육 당국에 따르면 이날 오전 8시 30분쯤 전남광주 구례군 한 시험장에서 1교시 시작을 앞두고 수험생 A(51·남)씨의 가방 안에서 커닝 방지 위급재난 문자 알림음이 울렸다. A씨는 스마트폰을 감독관에게 제출하지 않고 전원도 끄지 않은 채 복도에 내놓은 가방 안에 보관했다. 오랜 기간 승려로 생활했던 A씨는 늦깎이로 올해 수능에 응시했고, 사정을 잘 몰라 스마트폰을 제출하지 않은 것으로 잠정 조사됐다. 당국은 부정행위 고의성이 없다고 봤지만, 원칙을 엄정하게 적용해 A씨를 퇴실 조치했다. 이날 전남광주에서는 서구 모 고등학교에 마련된 시험장에서도 1교시 전 신원 확인 등 준비 절차 도중 아직 전원이 꺼지지 않은 스마트폰에서 재난경보가 울리기도 했다. 해당 기기는 수거가 완료된 상태였고, 재난문자 수신 당시 별도의 보관함에 들어있었다. 전남광주에서는 이번 수능에서 전자기기 사용 등 부정행위는 적발되지 않았다.","category":"사건 사고"},{"title":"서해안고속도로 고창IC 부근서 차량 3대 충돌…눈길 사고 추정","link":"https://n.news.naver.com/mnews/article/001/0016453337","naverLink":"https://n.news.naver.com/mnews/article/001/0016453337","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"서해안고속도로 고창IC 부근서 차량 3대 충돌…눈길 사고 추정. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"[속보] 韓총리 “스마트기기 부정행위자 형사고발…최대 5년 형사처벌”","link":"https://n.news.naver.com/mnews/article/025/0003566753","naverLink":"https://n.news.naver.com/mnews/article/025/0003566753","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"한성숙 국무총리가 지난 18일 서울 종로구 정부서울청사에서 열린 12·29 여객기 참사 피해자 지원 및 희생자 추모위원회 회의에서 발언하고 있다. 연합뉴스 한성숙 국무총리가 20일 “(이번 수능) 시험 현장에서 적발되지 않았던 부정행위도 끝까지 찾아내겠다”고 밝혔다. 한 총리는 이날 오후 정부서울청사에서 열린 ‘수능 부정행위 대응 TF(태스크포스)’ 1차 회의 모두발언에서 이같이 말했다. 한 총리는 “어제 시험 현장에서 전담 감독관이 의심되는 와이파이와 블루투스 신호를 기록하고 저장해뒀다”며 “이 기록을 분석해 부정행위가 의심되는 사례는 수사 의뢰 하도록 하겠다”고 했다. 그는 또 “신고나 제보된 사례가 실제 부정행위로 확인되면 포상금을 지급하는 절차도 차질 없이 준비하고 있다”며 “경찰청을 중심으로 각종 커뮤니티와 SNS 등에 제기되는 부정행위 의혹에 대해서도 진위 여부를 확인하겠다”고 약속했다. 그러면서 “범정부 역량을 총동원해 이번 수능에서 발생한 부정행위를 철저히 적발하고 법과 원칙에 따라 엄정하게 조치하겠다”며 “필요한 경우 부처 간 협력 범위를 확대해 범정부 차원에서 수능 부정행위에 철저히 대응하겠다”고 강조했다. 아울러 “모든 부정 행위자는 예외 없이 엄정 조치하겠다”며 “모든 부정행위자는 올해 수능 시험에서 무효 처리하고 부정행위 심의위원회에서 경중을 확인해 행정·형사적 책임을 추가로 묻겠다”고 설명했다. 이어 “형사 책임도 엄정하게 묻겠다”며 “특히 스마트기기 부정행위자는 형사고발 하겠다. 이 경우 최대 5년의 형사 처벌을 받을 수 있다”고 했다. 그러면서 “부정행위에 활용될 가능성을 인지하고도 관련 스마트기기를 판매한 자도 철저하게 수사하여 관련 법과 규정에 따라 엄정하게 책임을 묻겠다”고 덧붙였다. 한 총리는 “감독관 보호조치는 약속해드린 대로 더욱 강화하겠다”며 “성실하게 감독 업무를 수행한 감독관들이 부당한 민원이나 소송으로 어려움을 겪지 않도록 국가가 책임지고 대응하겠다”고 밝혔다. 이어 “관련 민원은 정부 차원에서 적극 처리하고 법적 분쟁 발생 시 필요한 법률 지원과 배상책임보험도 제공하겠다”고 약속했다. 한 총리는 끝으로 “수능을 비롯한 국가시험 전반을 혁신하겠다”며 “이번 수능에서 드러난 문제점과 현장 의견을 면밀히 분석해 기술적 대응 강화를 포함한 대책 마련에 지금부터 착수하겠다”고 밝혔다.","category":"사건 사고"},{"title":"접근금지 해제 뒤 전 연인 살해 혐의 60대 구속 “증거인멸·도주 우려”","link":"https://n.news.naver.com/mnews/article/025/0003566555","naverLink":"https://n.news.naver.com/mnews/article/025/0003566555","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"과천 재건축 현장서 추락한 70대 작업자 숨져…자재 적재 중 사고(종합)","link":"https://n.news.naver.com/mnews/article/003/0014334466","naverLink":"https://n.news.naver.com/mnews/article/003/0014334466","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"과천 재건축 현장서 추락한 70대 작업자 숨져…자재 적재 중 사고(종합). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"서울 봉천동 주택가서 화재…16명 대피·3명 병원 이송","link":"https://n.news.naver.com/mnews/article/028/0002833122","naverLink":"https://n.news.naver.com/mnews/article/028/0002833122","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"클립아트코리아 서울 관악구 봉천동 주택가에서 화재가 발생해 16명이 대피하고 3명이 병원에 이송됐다. 19일 경찰과 소방 당국에 따르면, 이날 저녁 8시께 서울 관악구 봉천동의 지하 2층, 지상 5층짜리 다세대주택에서 화재가 발생했다. 차량 38대를 동원해 화재 진압에 나선 소방은 30여분 만인 저녁 8시32분께 불을 완전히 껐다. 이날 화재로 세명이 병원으로 옮겨졌다. 한 명은 화상을 입었고, 다른 두 명은 연기를 흡입한 것으로 알려졌다. 11명이 소방 당국에 의해 구조됐고, 5명이 스스로 대피했다. 소방은 정확한 화재 원인을 조사하고 있다.","category":"사건 사고"},{"title":"이진우, 전과 4범...공연음란죄부터 고의사고까지 '민낯'","link":"https://n.news.naver.com/mnews/article/018/0006412804","naverLink":"https://n.news.naver.com/mnews/article/018/0006412804","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"이진우, 전과 4범...공연음란죄부터 고의사고까지 '민낯'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"경남도-두산에너빌리티, 글로벌 SMR 생산거점·지역 원전기업 동반성장 골몰","link":"https://n.news.naver.com/mnews/article/277/0005845341","naverLink":"https://n.news.naver.com/mnews/article/277/0005845341","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"경남도-두산에너빌리티, 글로벌 SMR 생산거점·지역 원전기업 동반성장 골몰. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"경남도장학회, 내년 지역인재 취업·정착 지원 집중 … 11억 1500만원 투입","link":"https://n.news.naver.com/mnews/article/277/0005845340","naverLink":"https://n.news.naver.com/mnews/article/277/0005845340","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"경남도장학회, 내년 지역인재 취업·정착 지원 집중 … 11억 1500만원 투입. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"남양주시 공공의료원 건립 ‘청신호’…정부 예타 신청사업 선정","link":"https://n.news.naver.com/mnews/article/005/0001886324","naverLink":"https://n.news.naver.com/mnews/article/005/0001886324","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"남양주시 경기동북부 공공의료원 AI 생성 조감도. 남양주시 제공 경기 남양주시가 추진하는 경기 동북부 공공의료원 건립사업이 보건복지부의 예비타당성조사 신청사업으로 선정되면서 사업 추진에 탄력이 붙을 전망이다. 남양주시는 경기도가 신청한 공공의료원 건립사업 가운데 남양주 공공의료원이 지난 16일 보건복지부 사전검토를 통과해 예비타당성조사 신청사업으로 선정됐다고 19일 밝혔다. 보건복지부는 오는 20일 기획예산처에 예비타당성조사 대상사업 선정을 신청할 예정이다. 이번 선정은 경기도가 지난 6월 29일 사업을 신청한 이후 건립 필요성과 추진 여건 등을 검토한 결과다. 시는 향후 기획예산처의 예타 대상사업 선정에 대비해 경기도와 협력하며 후속 절차에 대응할 계획이다. 남양주시가 공공의료원 건립에 나선 것은 경기 동북부의 의료 공백을 해소하고 증가하는 의료 수요에 대응하기 위해서다. 남양주·구리·가평·양평으로 구성된 남양주권역은 약 112만명의 생활권을 형성하고 있지만, 경기도 12개 중진료권 가운데 유일하게 지역책임의료기관이 없는 상황이다. 왕숙신도시 등 대규모 개발사업이 완료되면 의료 수요는 약 140만명까지 늘어날 것으로 예상된다. 이에 시는 호평동 백봉지구에 400병상 규모의 경기 동북부 공공의료원 건립을 추진하고 있다. 15개 진료과목과 14개 진료센터를 갖춘 혁신형 공공병원으로 조성해 응급의료와 감염병 대응은 물론 의료·돌봄 통합서비스까지 제공한다는 구상이다. 그동안 최현덕 시장은 중앙정부를 상대로 사업 필요성을 지속적으로 건의해 왔다. 지난 7월에는 기획예산처와 보건복지부 장관을 잇달아 만나 공공의료원 건립의 당위성을 설명하고 조속한 추진을 요청했다. 최 시장은 “이번 선정은 경기 동북부 공공의료원 건립을 위한 의미 있는 진전”이라며 “경기도와 긴밀히 협력해 후속 절차가 원활하게 진행되도록 최선을 다하겠다”고 밝혔다.","category":"사회"},{"title":"수능 1등급 커트라인 \"국어 129~131점, 수학 127~131점\"","link":"https://n.news.naver.com/mnews/article/018/0006412809","naverLink":"https://n.news.naver.com/mnews/article/018/0006412809","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"수능 1등급 커트라인 \"국어 129~131점, 수학 127~131점\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"‘미스터 클린’ 박찬종 전 의원 별세…생전 약속대로 시신 기증","link":"https://n.news.naver.com/mnews/article/056/0012297721","naverLink":"https://n.news.naver.com/mnews/article/056/0012297721","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"‘미스터 클린’ 박찬종 전 의원 별세…생전 약속대로 시신 기증. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[속보]여자프로배구 관람 중 쓰러진 남성 끝내 숨져","link":"https://n.news.naver.com/mnews/article/021/0002834141","naverLink":"https://n.news.naver.com/mnews/article/021/0002834141","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"[속보]여자프로배구 관람 중 쓰러진 남성 끝내 숨져. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"국어 1등급 커트라인 90∼95점, 수학 84∼90점\"","link":"https://n.news.naver.com/mnews/article/422/0000927996","naverLink":"https://n.news.naver.com/mnews/article/422/0000927996","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"'넌 잘할 거야' [연합뉴스 제공] 2027학년도 대학수학능력시험에서 국어영역 1등급 커트라인이 작년 수능 대비 많게는 6점까지 상승한 것으로 추정됐습니다. 오늘(19일) 오후 10시 기준 EBSi와 입시업계에 따르면 국어 1등급 커트라인은 90~95점으로, 지난해 보다 4~6점 상슴한 것으로 분석됐습니다. 선택과목을 무엇을 택했든 작년 수능보다 쉬워 2∼3개를 더 맞혀야 1등급을 받을 수 있다는 겁니다. 수학 영역의 1등급 커트라인은 84∼90점으로 지난해와 비슷한 수준에서 형성될 것으로 보이는데, '미적분'은 작년과 비교했을 때 1등급컷이 오히려 1점 떨어지거나 상승하더라도 1점에 그칠 전망입니다. 영어는 작년 수능보다 쉽고, 올해 9월 모의평가보단 어려웠던 것으로 분석된 가운데 종로학원은 영어 1등급(원점수 90점 이상) 비율을 8.0%로 추정했습니다. 이는 2018년 절대평가 도입 이후 세번째로 높은 수치입니다. 임성호 종로학원 대표는 \"영어의 상위권 변별력이 매우 떨어질 것으로 보인다\"면서 \"국어가 아주 쉽게 출제돼 결국 상위권 경쟁은 수학에서 판가름 날 것으로 관측된다\"고 말했습니다. #수능 #커트라인 #1등급 #국어 #영어 #수학 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사회"},{"title":"'韓 파기환송'에 뿔난 민주 …\"내란에 면죄부, 조희대 탄핵해야\"","link":"https://n.news.naver.com/mnews/article/009/0005766474","naverLink":"https://n.news.naver.com/mnews/article/009/0005766474","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"20일 의총서 탄핵 당론 확정 한덕수 일부무죄 파기환송에 김민석 \"내란 부역 묵과 못해\" 曺 대법원장 임기 7개월 남아 선고전 퇴임하면 각하 가능성 野 \"보복 탄핵은 사법부 탄압\" 19일 김민석 더불어민주당 대표(오른쪽)가 한덕수 전 국무총리에 대한 징역 15년형 판결 파기 환송 관련 비공개 비상 의원총회에 참석하기 위해 이동하고 있다. 연합뉴스 더불어민주당이 조희대 대법원장에 대한 탄핵소추를 공식 추진하고 당론으로 삼기로 했다. 12·3 비상계엄 관련 혐의로 2심에서 징역 15년을 선고받은 한덕수 전 국무총리 사건에서 대법원이 일부 무죄 취지의 파기환송 판결을 내린 데 따른 대응이다. 김민석 민주당 대표는 19일 저녁 국회에서 비공개 비상 의원총회를 마친 뒤 탄핵 추진 방침을 공식화했다. 김 대표는 이번 선고를 \"'내란이 났을 때 한덕수처럼 하라'라는 행위 규범을 온 국민에게 강요한 역사적인 반역\"이라고 비판했다. 이어 \"그간 절제하고 인내해 왔지만 내란 부역을 정당화하려는 역사적 왜곡에 대해서는 도저히 묵과할 수 없다는 판단\"이라며 \"향후 모든 절차와 내용을 당 지도부에 위임하기로 했다\"고 밝혔다. 김 대표는 이후 SNS에 공개한 의총 발언록에서도 전날 추경호 대구시장의 1심 무죄 판결을 거론하며 \"어제 추경호 무죄와 오늘 한덕수 국무회의를 무죄로 만든 것은 본질이 동일하다\"며 \"'내란 임박 시 입 다물어라', '본회의 해제 표결에 참여하지 못하게 해라' 이 두 가지에 대해 무죄 준 것\"이라고 했다. 당 지도부는 이날 밤 긴급 최고위원회의를 열어 조 대법원장 탄핵 추진단 결성 등 후속 절차를 논의했다. 박성준 수석대변인은 최고위 직후 \"추진단에서 탄핵 사유와 일정을 논의할 것\"이라고 말했다. 20일엔 의총을 열어 탄핵 추진을 당론으로 확정할 예정이다. 대법원 선고 이후 열린 비공개 긴급 의총에선 탄핵 추진을 놓고 찬반이 팽팽히 맞선 것으로 전해졌다. 정청래 전 대표 등 강경파 의원들이 김 대표를 향해 \"(탄핵을) 결단해야 한다\"고 요구한 반면, 일부 의원들은 중도층 이탈 우려나 \"조 대법원장이 내란 자체는 명확히 인정했기 때문에 탄핵은 쉽지 않다\"는 신중론을 펴며 이견을 보였다고 한다. 이번 결정은 조 대법원장에 대한 공세 수위를 조절해 온 지도부 기조를 뒤집은 조치다. 민주당은 지난달 국정감사를 계기로 탄핵 논의를 꺼냈다가 국정조사로 선회한 뒤, 이달 초엔 국정조사 요구서 제출마저 미뤘다. 탄핵과 국정조사","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/052/0002435368","naverLink":"https://n.news.naver.com/mnews/article/052/0002435368","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"서울 광화문에서 열린 K-베이커리 페스티벌이 통신 장애로 인해 조기에 마감했습니다. K-베이커리 페스티벌 주최 측은 오늘(19일) 홈페이지를 통해 통신 장애로 인해 행사를 마감한다며 이같이 밝혔습니다. 주최 측은 연결 장비와 커넥터 등에 문제가 생겨 마감 시간을 30분 정도 앞당긴 저녁 7시 반쯤 행사를 조기에 마감했다고 설명했습니다. 앞서 오후 7시쯤 페스티벌 현장에서는 결제 등이 제대로 이뤄지지 않아 현장 대기 줄이 길어지는 불편이 있었던 거로 파악됐습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"“99%가 단추 없는 옷 입고 왔어요”…수능 감독관 전한 뭉클 후기","link":"https://n.news.naver.com/mnews/article/025/0003566557","naverLink":"https://n.news.naver.com/mnews/article/025/0003566557","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"2027학년도 대학수학능력시험일인 16일 서울 중구 이화여자외국어고등학교에서 수능을 마친 수험생이 시험장을 나서며 마중나온 부모님과 기뻐하고 있다. 본문과 직접적인 관련 없는 사진. 김경록 기자 수능 감독을 맡았다는 한 교사가 부정행위 의심을 받지 않으려 조심하는 수험생들의 모습을 전해 공감을 얻고 있다. 단추 없는 옷을 입고 와 작은 쓰레기 하나도 함부로 버리지 못하는 학생들을 보며 오히려 어른들이 불안과 불신을 만든 것 아닌지 돌아봤다는 후기다. 2027학년도 대학수학능력시험이 치러진 19일 소셜네트워크서비스(SNS)에는 ‘오늘 남학생만 있는 고사장 수능 감독 후기’라는 제목의 글이 올라왔다. 글쓴이 A씨는 “올해는 언론에서도 하도 난리라 경험이 꽤 있는데도 어젯밤 잠을 설쳤다”며 “화장실에 갈까 봐 김밥도, 물도, 커피도 최소한으로 먹고 맛있는 점심도 졸릴까 봐 깨작거렸다”고 감독을 앞둔 긴장감을 전했다. 1·3·4교시 두 번째 감독관으로 들어갔다는 그는 “막상 들어간 교실 속 아이들은 너무나 순수했다”고 적었다. A씨는 “혹여나 의심받을까 99%가 단추 없는 옷을 입고 왔고 개인 필기구조차 거의 안 챙겨 왔다”며 “휴대전화에 붙이는 견출지 쓰레기 하나도 어떻게 버려야 하냐고 조심스레 묻길래 직접 수거해 줬다”고 했다. 문제를 다 풀고 답안지 앞에서 두 손을 모아 기도하는 학생과 가방에 네잎클로버 키링을 주렁주렁 달고 온 학생들의 모습도 소개했다. 그는 “세상이 아무리 시끄러워도 정직하고 순수한 아이들이 훨씬 많다”며 “어쩌면 그 불안감과 불신은 어른들이 만든 것일지도 모른다”고 적었다. 이어 “평소엔 애들이라면 지긋지긋했는데 오늘만큼은 남학생들이 참 귀여워서 나도 모르게 한없이 친절해졌다”고 했다. 댓글에는 다른 시험 감독관들의 경험담도 이어졌다. 여학생 고사장을 감독했다는 한 교사는 “단추 있는 옷을 입고 온 수험생이 단 한 명도 없었고, 앞머리 고정핀에 인공눈물까지 다 검사해 달라며 손을 들더라”며 “피어싱까지 자진해서 뺀 학생도 있었다는 동료 교사의 이야기를 들었다”고 전했다. 수험생 자녀를 뒀다는 한 누리꾼은 “단추 없는 옷을 다시 점검하고 에어팟도 직접 받아 챙겼다”며 “연필을 깎아 낙서 없는 새 필통에 넣어 보내고, 온도 표시가 없는 텀블러까지 준비했다”고 밝혔다. 누리꾼들은 “긴장한 아이들이 네잎클로버 키링을 달고 왔을 생각에 마음이 짠하다”, “수험생도 감독관도 모두 고생 많았다”, “정직","category":"사회"}],"생활·문화":[{"title":"與, 운동권 노후 보장 논란 민주유공자법 강행","link":"https://n.news.naver.com/mnews/article/023/0004010712","naverLink":"https://n.news.naver.com/mnews/article/023/0004010712","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"민주화운동 부상자 등에 의료 지원 국회 본회의 상정, 오늘 처리 방침 19일 서울 여의도 국회에서 열린 제439회(정기회) 13차 본회의에서 서일준 국민의힘 의원의 민주유공자 예우에 관한 법률안(민주유공자법)에 반대하는 무제한토론(필리버스터)이 시작되자 더불어민주당 의원들이 회의장을 나가고 있다. /뉴시스 민주유공자 예우에 관한 법률(민주유공자법)이 19일 더불어민주당 주도로 국회 본회의에 상정됐다. 민주유공자법은 민주화운동 사망·행방불명·부상자와 유족·가족에게 의료·양로·요양 등을 지원하는 내용이다. 국민의힘은 “‘운동권 세탁법’이자 ‘운동권 특혜법’”이라며 법안 통과를 막기 위해 필리버스터(무제한 토론)에 돌입했다. 민주당은 국회법에 따라 24시간 뒤인 20일 오후 표결로 토론을 중단시키고 법안을 강행 처리할 방침이다. 이 법은 2024년 5월 민주당 주도로 국회 본회의를 통과했지만, 윤석열 당시 대통령이 거부권을 행사하면서 폐기됐다가 이재명 정부 들어 민주당이 다시 추진한 것이다. 민주당 허영 의원은 이날 법안 제안 설명에서 “이 법은 특혜를 주는 법이 아니라 국가가 뒤늦게 책임을 다하는 법”이라며 “평생 상처를 안고 살아온 분들에게 필요한 치료와 돌봄을 제공하는 것이 어떻게 특혜가 되겠느냐”고 했다. 민주당이 밝힌 민주유공자법의 취지는 “기존에 별도 법률로 예우하고 있는 4·19혁명과 5·18민주화운동 외에 유신반대투쟁, 6월민주항쟁, 부마민주항쟁 등의 민주화운동 과정에서 희생된 사람들도 국가가 예우하자”는 것이다. 국민의힘은 “나이가 60줄에 들어선 운동권을 위한 노후 특혜법으로 전락할 가능성이 크다”며 “국민은 월급을 아껴 노후 대비를 하는데 운동권은 세금으로 노후 무임승차를 하려고 한다”고 반발했다. 특히 유공자 기준 자체가 모호한 점을 문제 삼았다. 실제 이 법에선 민주유공자를 ‘자유민주적 기본질서 확립에 기여한 희생 또는 공헌이 명백히 인정되어 사회적 공감대가 형성된 사람’으로 규정하고 있다. 이에 대해 국민의힘은 ‘희생’ ‘공헌’ ‘사회적 공감대’라는 기준이 불명확하고, 보훈심사위원회의 심의마저 의무 규정이 아닌 임의 규정이어서 유공자가 무한정 증가할 것이라고 주장한다. 방화로 경찰관이 사망한 동의대 사건, 운동 자금 마련을 위해 강도 행각까지 한 남민전(남조선민족해방전선) 사건 등의 관련자까지 민주유공자로 인정될 수 있다는 우려도 나온다. 야권은 “민주당이 이 법을 계기로 서서히 민주유공자를","category":"생활·문화"},{"title":"인천 연수구, 내년도 본예산 9941억 편성… 지출 혁신으로 ‘복지·균형발전’ 집중","link":"https://n.news.naver.com/mnews/article/016/0002725968","naverLink":"https://n.news.naver.com/mnews/article/016/0002725968","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"인천 연수구 [헤럴드경제(인천)=이홍석 기자]인천시 연수구의 내년도 살림살이 규모가 1조원 목전인 9941억원으로 확정했다. 연수구는 올해 본예산(9330억원)보다 6.55%(611억원) 증액된 2027년도 본예산안을 편성해 연수구의회에 제출했다고 19일 밝혔다. 회계별 세부 규모는 ▷일반회계 9328억원 ▷특별회계 256억원 ▷기금 356억원이다. 가장 큰 비중을 차지한 분야는 ‘사회복지’다. 전체 일반회계의 65.63%에 달하는 6122억원(전년 대비 11.2% 증가)을 투입해 구 예산의 3분의 2가량을 민생 안전망 구축에 쏟는다. 이재호 연수구청장은 “긴축과 혁신을 통해 절감한 재원을 구민의 기본적인 삶과 직결된 필수 복지에 최우선으로 배분했다”고 말했다.","category":"생활·문화"},{"title":"​‘꿩 대신 닭인가’… 국가철도망 대국민 의견수렴 불참 비판받은 이기형 김포시장, 총리 만찬 간담회서 교통 대책 건의","link":"https://n.news.naver.com/mnews/article/016/0002725967","naverLink":"https://n.news.naver.com/mnews/article/016/0002725967","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"실무 협상 테이블 비운 뒤 여론 악화하자 타 성격 간담회 참석… 면피성 행보 지적 5호선 연장 등 4대 핵심 과제 전달 ​지역사회, “본질 벗어난 뒤늦은 수습… 책임 있는 실무 대응 시급” 지난 18일 열린 국무총리 주최 ‘주택공급 활성화를 위한 경기도권 지자체장 만찬 간담회’ [국무총리실 제공] [헤럴드경제(김포)=이홍석 기자]최근 핵심 광역교통 현안을 논의하는 국토교통부 주최 국가철도망 구축계획 대국민 의견수렴 행사에 불참해 거센 비판을 받았던 이기형 김포시장이 국무총리 주재 만찬 간담회에 참석해 서울 5호선 연장 등을 건의하고 나섰다. 그러나 정작 국가철도망 세부 노선과 사업을 조율하는 가장 중요한 국가철도망 대국민 의견수렴 행사 자리 외면으로 여론이 악화하자, 대신 다른 성격의 간담회에서 교통현안 건의를 한 것을 두고 지역사회 일각에서는 ‘꿩 대신 닭’ 식의 뒤늦은 면피성 행보라는 지적이 제기되고 있다. 이기형 김포시장은 지난 18일 오후 서울 종로구 일원에서 열린 국무총리 주최 ‘주택공급 활성화를 위한 경기도권 지자체장 만찬 간담회’에 참석해 정부의 신규 공공주택지구 발표에 따른 광역교통 및 자족기능 확보 대책을 건의했다. 이날 간담회는 수도권 주택공급 활성화를 주제로 경기도 내 지자체장들이 함께 모인 자리로, 김포시의 개별 교통 현안을 집중적으로 다루는 대광위 회의와는 성격과 결이 다르다. 이 시장은 이 자리에서 김포시가 향후 90만 대도시로 급팽창할 것으로 예상되는 만큼 특단의 대책이 필요하다며 4대 핵심 과제를 전달했다. 핵심 과제는 ▷서울 5호선 연장(김포아라지구 내 신규역 포함 4개 역 설치·행정절차 지연 방지) 및 통합 차량기지 설치 ▷양촌대교·향산대교 건설 ▷김포한강로~올림픽대로 확장 및 BRT 운행 ▷총사업비 대비 20% 이상의 광역교통개선대책 사업비 편성 등이다. 구체적으로 이 시장은 서울 5호선 연장과 관련해 김포아라지구 내 신규역을 포함한 4개 역을 설치하되 행정 절차 지연을 철저히 방지하고 철도 통합 차량기지가 차질 없이 추진될 수 있도록 정부 차원의 지원을 요청했다. ​도로망 확충을 위해서는 극심한 정체를 빚는 올림픽대로의 과부하를 덜고 교통량을 자유로 등으로 분산하기 위한 양촌대교·향산대교 건설을 건의했다. 또한 한강신도시 IC에서 당산역에 이르는 김포한강로~올림픽대로 구간 확장 및 BRT 전용차로 도입과 함께, 급증하는 교통 수요 대응을 위해 3기 신도시 수준을 넘어서는 총사","category":"생활·문화"},{"title":"'영하 8도' 맹추위 온다…내일 충남·호남 최대 8㎝ 눈","link":"https://n.news.naver.com/mnews/article/215/0001273440","naverLink":"https://n.news.naver.com/mnews/article/215/0001273440","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"전국 대부분 강풍…체감온도 뚝 전북·전남 북부 서해안 등 대설특보 추가 가능성 사진=연합뉴스 내일(21일) 아침 기온이 영하 8도까지 떨어지는 데다 강한 바람까지 겹치면서 맹추위를 보이겠다. 20일 기상청에 따르면 내일은 북서쪽에서 내려온 찬 공기의 영향으로 전국 대부분 지역의 아침 기온이 영하권에 머물겠다. 아침 최저기온은 -8∼3도, 낮 최고기온은 1∼11도로 예보됐다. 주요 도시별 예상 최저·최고기온은 서울·인천·수원 -5도와 2도, 강릉 -2도와 5도, 대전·세종 -4도와 4도, 광주 0도와 7도, 대구 -3도와 6도, 울산 -2도와 7도, 부산 1도와 8도, 제주 7도와 11도다. 여기에 전국 대부분 지역에 시속 55㎞ 이상의 강풍까지 더해지면서 체감 추위는 한층 심할 것으로 보인다. 이번 추위는 일요일인 모레(22일) 아침까지 이어지다가 낮부터 차차 누그러지고, 다음 주에는 평년 기온을 되찾을 전망이다. 내일도 충남권과 전라권, 제주에는 비나 눈이 이어지겠다. 예상 강수량은 서해5도 1㎜ 안팎, 세종·충남·광주·전남 5㎜ 안팎, 전북서부·남동부·울릉도·독도·제주 5∼10㎜ 수준이다. 기온이 낮은 만큼 눈이 1∼8㎝ 쌓이는 곳도 있겠다. 현재 제주산지에는 대설특보가 발효된 상태이며, 전북남부와 전남북부서해안에도 내일 새벽 시간당 1∼3㎝의 강한 눈이 내려 대설특보가 추가로 내려질 가능성이 있다. 눈이 내리는 지역에서는 가시거리가 급격히 짧아지고 쌓인 눈이 얼어붙어 빙판길이 되는 곳이 많을 것으로 보여 보행자와 운전자 모두 교통안전에 각별히 유의해야 한다. 건조특보가 내려진 강원영동과 일부 경북북동부는 대기가 매우 건조하겠고, 서울·경기북동부와 강원영서 등도 건조한 만큼 산불 등 화재 예방에 신경 써야 한다. 내일 미세먼지는 전 권역에서 '좋음' 수준을 보일 전망이다.","category":"생활·문화"},{"title":"동료의 마음건강 내가 지킨다…한수원, 마음건강 안전망 ʻ마인드키퍼ʼ 출범","link":"https://n.news.naver.com/mnews/article/092/0002446127","naverLink":"https://n.news.naver.com/mnews/article/092/0002446127","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"발전소 현장 특성 고려한 동료 중심 심리 지원체계 구축 한수원이 심리적 어려움을 겪는 동료를 도와주는 마음건강 안전망 ‘마인드키퍼’를 본격 출범했다. 한국수력원자력(사장 김회천)은 19일 한수원 방사선보건원에서 지난 9월부터 시범운영해 온 ‘마인드키퍼’ 발대식을 개최했다고 밝혔다. ‘마인드키퍼’는 전문적인 심리 지원체계가 상대적으로 부족한 격오지 발전소 현장 특성을 고려해 마련한 동료 중심의 심리 지원 제도다. 김회천 한국수력원자력 사장(맨 앞줄 왼쪽 여섯 번째)이 19일 동료 중심 심리 지원체계 '마인드키퍼' 발대식에서 참석자들과 파이팅을 외치고 있다. 마인드키퍼는 한수원이 자체 개발한 사내 자살 예방 프로그램 ‘MindCPR’을 통해 심리적 응급처치 교육을 이수하고, 동료들의 마음건강을 지키고자 나선 자원 활동가다. 이들은 현장에서 심리적 어려움을 겪는 동료를 조기에 발견하고, 필요한 경우 전문적인 지원을 받을 수 있도록 연결하는 역할을 한다. 이날 발대식은 마인드키퍼 임명장 수여와 생명존중 선언문 선서 순으로 진행됐다. 김회천 한수원 사장은 마인드키퍼 활동가에게 직접 임명장을 전달하며, 마음의 어려움을 겪는 동료에게 따뜻한 관심과 위로를 건네는 든든한 버팀목이 돼 줄 것을 당부했다. 김회천 한국수력원자력 사장(왼쪽 두 번째)과 강창호 한수원 노조위원장(왼쪽 세 번째)이 생명존중 선언문을 들고 기념촬영을 하고 있다.","category":"생활·문화"},{"title":"명문대 졸업장이 인생을 보장할까…이민진 '아메리칸 학원', 아마존 올해의 책 1위","link":"https://n.news.naver.com/mnews/article/277/0005845337","naverLink":"https://n.news.naver.com/mnews/article/277/0005845337","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"'파친코' 이후 9년 만의 장편…아마존 편집진 종합 1위 선정 서울 대치동서 시드니·캘리포니아로 이어지는 한 가족의 이민사 10년 집필 끝에 던진 질문 \"교육은 우리를 지혜롭게 만드는가\" 가디언·커커스 호평…30일부터 한국 독자 만난다 한국에서 명문대를 졸업하고 대기업에 다니던 아버지가 미국에서는 남의 가게에서 생선을 튀긴다. 자녀들을 좋은 대학에 보내기 위해 쏟아부은 돈과 시간, 부모가 지켜온 학벌과 경력은 낯선 나라에서 가족의 미래를 보장하지 못한다. '파친코'로 세계적인 명성을 얻은 한국계 미국인 소설가 이민진이 신작 '아메리칸 학원'에서 그려낸 삶이다. 한국계 미국인 소설가 이민진의 신작 장편소설 '아메리칸 학원' 한국어판(전 2권). 이 작품은 아마존 도서 편집진이 선정한 '2026년 올해의 책' 종합 1위에 올랐다. 현대문학 출판사 현대문학은 한국의 사교육과 이민자의 삶을 다룬 이 소설이 세계 최대 온라인 서점 아마존의 '2026년 올해의 책(Best Books of 2026)' 종합 1위에 올랐다고 19일 밝혔다. 아마존은 앞서 12일(현지시간) 자체 편집진이 선정한 올해의 책 20권을 발표하며 '아메리칸 학원'을 첫 번째로 꼽았다. 판매량을 기준으로 한 베스트셀러 순위가 아니라, 편집진이 한 해 출간된 책들을 검토해 선정하는 목록이다. 아마존 편집진은 에밀리 세인트존 맨델의 '엑시트 파티', 로버트 콜커의 '사라지는 가족', 타야리 존스의 '킨' 등을 제치고 이민진의 작품에 가장 높은 평가를 내렸다. 세라 겔먼 아마존 도서 편집 총괄 디렉터는 자녀의 미래를 위해 가족들이 무엇을 희생하는지, 교육이 약속하는 미래가 그 대가를 치를 만한 것인지 묻는 이야기라고 선정 이유를 설명했다. '아메리칸 학원'은 1992년 서울 대치동에서 시작한다. 다국적 기업에 다니는 존과 백화점에서 일하는 헬렌 부부에게는 보, DH, 미도 등 세 자녀가 있다. 교육에 아낌없이 투자하며 중산층의 삶을 유지하던 가족은 존의 실직과 1997년 외환위기 등을 거치며 삶의 터전을 옮겨야 한다. 서울에서 호주 시드니로, 다시 미국 캘리포니아로 이동하는 동안 한때 안정적인 직장과 사회적 지위를 가졌던 부모는 생계를 위해 새로운 일을 시작한다. 자녀들이 마주하는 교육의 풍경도 달라진다. 미국에서 학원 강사가 된 장남 보와 뒤이어 학원에서 일하는 미도는 명문학교 입학에 매달리는 학생들을 만난다. 가족의 삶을 지탱하기 위한 교육이 어느새 가","category":"생활·문화"},{"title":"게임·웹툰·웹예능, 양성평등 어떻게 담을까…문체부 26일 포럼","link":"https://n.news.naver.com/mnews/article/277/0005845333","naverLink":"https://n.news.naver.com/mnews/article/277/0005845333","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"국립중앙박물관서 콘텐츠 제작현장 양성평등 정책 논의 한국문화관광연구원, 제작현장 안내서 마련 방향 발표 게임·웹툰·방송 제작자 등 8명 참여…누구나 사전신청 가능 게임과 웹툰, 웹예능 등 문화콘텐츠 제작 과정에서 양성평등을 어떻게 실현할 수 있을지 논의하는 자리가 마련된다. 창작 현장의 특성을 고려한 안내서 마련 방향을 공유하고, 제작자와 연구자, 시민사회가 함께 실천 방안을 모색한다. 오는 26일 서울 국립중앙박물관에서 열리는 '2026 문화체육관광부 양성평등 정책포럼' 포스터. 게임·웹툰·웹예능 등 문화콘텐츠 제작현장의 양성평등 문화 확산을 주제로 제작자와 학계, 시민사회 관계자들이 토론한다. 한국문화관광연구원 문화체육관광부와 한국문화관광연구원은 오는 26일 오후 2시 서울 용산구 국립중앙박물관 교육관에서 '2026 문화체육관광부 양성평등 정책포럼'을 개최한다고 19일 밝혔다. 올해 포럼의 주제는 '문화콘텐츠 제작현장의 양성평등 문화 확산'이다. 게임과 웹툰, 웹예능 등 다양한 콘텐츠 분야를 중심으로 창작 과정에서 고려해야 할 양성평등의 문제를 살펴보고, 현장에 적용할 수 있는 정책적 접근을 논의한다. 첫 발제는 한국문화관광연구원 양성평등정책전략센터 이승희 부연구위원이 맡는다. 이 부연구위원은 '함께 생각하는 콘텐츠 속 양성평등: 제작현장을 위한 안내서 마련 방향'을 주제로 콘텐츠 제작 과정에서 검토할 사항과 안내서의 기본 방향을 소개할 예정이다. 이어지는 종합토론에는 콘텐츠 제작과 유통, 자율규제, 시민사회, 학계 전문가 8명이 참여한다. 한국웹툰산업협회 강서연 이사와 서울YWCA 김예선 활동가, 키즈 유튜브 채널 '유라야 놀자'의 김유진 크리에이터, 한국게임정책자율기구 나현수 사무국장이 현장의 의견을 전한다. 명지대 신혜련 교수와 KBS 시사교양국 유경현 PD, 경희대 조혜영 교수, 세종대 한창완 교수도 토론자로 나선다. 좌장은 한국문화관광연구원 양성평등정책전략센터 조현성 센터장이 맡는다. 이번 포럼은 특정 콘텐츠의 양성평등 수준을 평가하거나 새로운 규제 기준을 확정하는 자리가 아니라, 제작현장에서 참고할 안내서의 방향을 논의하는 행사다. 게임·웹툰·방송 등 서로 다른 제작 환경을 고려한 의견 교환이 이뤄질 예정이다. 포럼은 26일 오후 2시부터 4시까지 국립중앙박물관 교육관 제1강의실에서 열린다. 일반 시민도 사전신청을 통해 참여할 수 있다.","category":"생활·문화"},{"title":"[특별기고] 지역 기독교연합기관, 근∙현대기독교문화유산 발굴과 보존 나서야","link":"https://n.news.naver.com/mnews/article/005/0001886318","naverLink":"https://n.news.naver.com/mnews/article/005/0001886318","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"김철영 목사(한국기독교공공정책협의회 상임대표, 세계성시화운동본부 사무총장) 2012년 4월 연합기관 교단 단체 전문가 학자들이 참여해 한국기독교공공정책협의회가 공식 출범했다. 그해 4월 실시된 제19대 국회의원 총선거에서 한국 기독교 역사에 처음으로 여야 정당에 기독교 10대 정책을 제안했다. 그해 12월 실시된 제18대 대통령선거에서는 대선 후보들에게 10대 정책을 제안했다. 10대 정책 중에는 근대 기독교 문화유산 보전을 위한 지원 방안과 ‘근대기독교문화유산보존법’제정이 포함됐다. 10대 정책을 제안할 당시 문화체육관광부의 종교문화예산 지원에 관한 자료를 입수해 분석한 결과 불교는 전통문화 보존에 관한 법률에 따라 엄청난 예산을 지원받아 문화유산을 체계적으로 발굴하고 보존하고 있었다. 이에 비해 한국 기독교는 너무도 초라했다. 그래서 조국 근대화에 끼친 한국 기독교의 역할을 제대로 평가받으려면 근대 기독교 문화유산 보존이 중요하다고 판단했다. 2013년 2월 공동대표인 전용태 장로, 정책위원장 박명수 교수, 사무총장 김철영 목사는 대통령직인수위원회를 방문해 교육문화위원회 모철민 간사를 만나 정책 제안 내용을 어떻게 구체적으로 추진할 것인지를 협의했다. 모 간사는 청와대 초대 교육문화수석을 역임하면서 기독교공공정책협의회가 제안한 내용에 대하 관심을 갖고 협력해줬다. 문화체육관광부와도 협의를 했다. 그때부터 지역에 근대기독교역사관 건립 사업이 전개됐다. 필자는 문화체육관광부와 국가유산청과 한국 근대현대 기독교문화유산 보존과 역사 정리 작업에 대한 협의를 해왔다. 1974년 한국 기독교 사상 최대의 합숙전도대회인 엑스플로74 대회를 유네스코 세계기록문화유산으로 등재를 하기 위한 작업을 추진하면서 유네스코 한국위원회가 주최한 기록물 등재를 위한 워크숍에 참가해 많은 도전을 받은 바 있다. 또 지역 기독교를 방문하면서 지역마다 발굴하고 정리해 보존할 기독교 문화유산이 많다는 것을 확인할 수 있었다. 한국교회총연합과 한국기독교교회협의회(NCCK)가 정부 지원 사업으로 기독교 역사문화 사업을 진행하고 있지만, 한국교회의 총의를 모아내기에는 부족하다. 이제는 지역별로 근대 기독교 역사문화유산 발굴과 보존 작업이 이뤄져야 한다. 이 일은 크게 두 가지 면에서 필요하다. 첫째는 하나님께서 우리나라와 한국교회에 베푸신 은혜와 은총을 기억하는 것이다. 사사기 2장 10절에 보면 “그 후에 일어난 다른 세대는 여호와를 알지 못하며","category":"생활·문화"},{"title":"안경 만지작 수험생 몸수색하니…스마트안경 커닝 인정","link":"https://n.news.naver.com/mnews/article/028/0002833202","naverLink":"https://n.news.naver.com/mnews/article/028/0002833202","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"2027학년도 대학수학능력시험이 실시된 19일 서울 용산구 용산고등학교에서 한 감독관이 금속탐지기를 들고 있다. 사진공동취재단 충남 천안의 한 대학수학능력시험 시험장에서 스마트안경 착용으로 부정행위 처리된 재수생이 실제 이 안경을 이용해 문제를 풀었다고 인정한 것으로 확인됐다. 20일 충남교육청 말을 들어보면, 고등학교를 졸업한 ㄱ(20)씨는 전날 천안 신당고등학교에서 치러진 수능 2교시 수학 영역 시험 도중 화장실을 두 번 다녀왔다. 또 수학 문제를 풀이 과정 없이 답을 적고 안경을 만지작거리는 모습이 감독관에게 포착됐다. 문제를 다 푼 뒤에는 후드 모자를 뒤집어쓰고 책상에 엎드린 상태에서 안경을 주머니에 넣었다. ㄱ씨는 2교시 종료 후 안경 제출을 요구하는 감독관에게 일반 뿔테 안경을 꺼내줬다. 감독관은 ㄱ씨의 동의를 받아 몸수색을 해 스마트안경을 찾아냈다. 결국 ㄱ씨는 수학 시험에서 스마트안경을 쓴 사실을 감독관에게 인정했다. 다만 국어 시험에선 사용하지 않았다고 한다. 시험장 쪽은 전날 오후 1시56분께 경찰에 신고했다. 충남경찰청 반부패수사대는 같은 날 ㄱ씨를 조사하고 ‘위계에 의한 공무집행방해’ 혐의로 입건했다. 구속영장 신청은 검토하지 않고 있다. 정부는 수능 부정행위자의 응시 자격 제한 기간을 1년에서 10년으로 늘리고, 스마트기기를 이용한 중대한 부정행위는 위계에 의한 공무집행방해 혐의로 고발하거나 수사를 의뢰하겠다고 밝힌 바 있다.","category":"생활·문화"},{"title":"주말까지 영하권 강추위…곳곳 눈·비까지","link":"https://n.news.naver.com/mnews/article/629/0000553832","naverLink":"https://n.news.naver.com/mnews/article/629/0000553832","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"}],"세계":[{"title":"기후총회 새 초안 '화석연료 전환' 빠졌다…적응재원 기준도 공백 [COP31 현장]","link":"https://n.news.naver.com/mnews/article/421/0009300325","naverLink":"https://n.news.naver.com/mnews/article/421/0009300325","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"기후총회 새 초안 '화석연료 전환' 빠졌다…적응재원 기준도 공백 [COP31 현장]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"영남대 화학과 학생들, 에너지·환경 소재 논문 3편 국제 학술지 게재","link":"https://n.news.naver.com/mnews/article/016/0002725965","naverLink":"https://n.news.naver.com/mnews/article/016/0002725965","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"차세대 에너지 및 환경 소재 분야 연구 성과로 국제 저명 학술지에 논문을 발표한 영남대 학생들. 대학원 화학과 박사과정 문호준(왼쪽)학생과 화학과 4학년 이정진 학생.[영남대 제공] [헤럴드경제(경산)=김병진 기자]영남대 화학과 학생들이 차세대 에너지 및 환경 소재 분야 연구 성과를 국제 저명 학술지에 잇따라 발표해 주목받고 있다. 영남대는 대학원 화학과 박사과정 문호준 학생이 리튬이온배터리 양극과 음극 소재 연구로 국제 학술지 ‘어드밴스드 펑셔널 머티리얼즈’와 ‘카본 에너지’에 각각 제1저자 논문을 게재했다고 19일 밝혔다. 또 화학과 4학년 이정진 학생도 태양광을 활용한 수소 생산과 환경오염물질 분해를 위한 광촉매 연구로 ‘에너지 앤드 인바이런멘탈 머티리얼즈’에 제1저자 논문을 발표했다. 문호준 학생은 리튬이온배터리의 에너지 효율과 수명, 급속충전 성능을 높이기 위한 전극 계면 제어 기술 2가지를 개발했다. 특히 흑연 음극에 새로운 이중층 구조를 적용해 리튬이온 확산 속도를 기존보다 10배 이상 높이고 500회 충·방전 후에도 초기 용량의 97.1%를 유지하는 성과를 거뒀다. 이정진 학생은 황화몰리브덴과 황화아연을 결합한 새로운 광촉매를 개발해 태양광 기반 수소 생산 성능을 높였다. 또 고농도 유기염료를 180분 안에 거의 100% 제거하고 50시간 연속운전에서도 안정적인 구조를 유지하는 성과를 확인했다. 특히 이번 연구는 박사과정생과 학부생이 주도하고 협력해 국제 학술지에 논문을 발표했다는 점에서 의미가 크다. 연구를 지도한 강미숙 화학과 교수는 “세 편의 연구는 계면 구조와 전하 이동을 정밀하게 조절해 에너지 저장·변환 효율과 소재 안정성을 높였다는 공통점이 있다”며 “이번 성과는 학생들의 연구 역량과 영남대 화학과의 에너지·환경 소재 분야 연구 경쟁력을 보여주는 사례”라고 말했다.","category":"세계"},{"title":"[알파고의 지식램프] [15] ‘빨리빨리’ 대한민국과 ‘괜찮아’ 이집트 사이의 외교","link":"https://n.news.naver.com/mnews/article/023/0004010637","naverLink":"https://n.news.naver.com/mnews/article/023/0004010637","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"[알파고의 지식램프] [15] ‘빨리빨리’ 대한민국과 ‘괜찮아’ 이집트 사이의 외교. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"시진핑 앞에서 ‘젠슨 황’ 물었다가… 3국 정상회담 취재 막힌 美 기자","link":"https://n.news.naver.com/mnews/article/022/0004176661","naverLink":"https://n.news.naver.com/mnews/article/022/0004176661","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황과 관련한 질문을 던진 미국 기자가 19일(현지시간) 중국 광둥성 선전에서 진행된 미국·중국·러시아 정상의 사상 첫 3자회담 취재를 차단 당했다. 19일(현지시간) 뉴욕타임스(NYT) 등 미국 언론에 따르면 이날 선전 치린산장에서 열린 미·중 정상회담에서 도널드 트럼프 미국 대통령이 모두발언을 마무리할 때쯤 블룸버그TV 소속 앤매리 호던 기자가 큰 소리로 트럼프 대통령에게 질문을 던졌다. 도널드 트럼프 미국 대통령, 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령이 19일(현지시간) 중국 선전에서 첫 정상회담을 가졌다. 선전=AP연합뉴스 기자는 “젠슨 황 엔비디아 전 최고경영자(CEO)가 미국에 충성하지 않았느냐”고 물었다. 트럼프 대통령은 대답하지 않았다. 시진핑 중국 국가주석은 취재진 쪽으로 바라봤다가 다시 시선을 돌렸다. 이때 중국 경호원이 다가와 이 장면을 촬영하던 카메라를 가렸다고 NYT는 전했다. 해당 기자는 이후 열린 트럼프 대통령과 시 주석, 블라디미르 푸틴 러시아 대통령이 참여한 3자 정상회담에서 취재가 불허됐다. NYT는 “TV 기자들 사이에 공유된 정보에 따르면 미국 측이 이 기자의 회담장 입장을 다시 요청했지만, 중국 당국이 이를 거부했다고 백악관 관계자가 말했다”고 전했다. 특히 미·중 정상회담 현장에서 있던 기자들은 질문을 외치는 것이 극도로 무례한 행동이라는 경고를 받았다고 한다. NYT는 미국과 중국의 언론 취재 환경이 달라 이같은 상황이 발생했다고 분석했다. 미국에서는 대통령 행사에서 취재진이 즉석에서 큰 소리로 질문을 외치고, 이에 대통령이 대답한다. 행사가 아닐 때도 대통령이 취재진과 만나 소통하는 경우가 많다. 도널드 트럼프 미국 대통령(왼쪽)과 시진핑 중국 국가주석이 18일(현지시간) 중국 선전국제교류센터에서 열린 아시아태평양경제협력체(APEC) 정상회의 환영만찬에 참석해 기념 촬영을 마친 뒤 대화하고 있다. 선전=연합뉴스","category":"세계"},{"title":"수능 시험장 주변 공공 와이파이, 하루 만에 정상화","link":"https://n.news.naver.com/mnews/article/119/0003157413","naverLink":"https://n.news.naver.com/mnews/article/119/0003157413","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"수능 시험장 주변 공공 와이파이, 하루 만에 정상화. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"[뉴욕개장]앤트로픽 기대감에 나스닥 1% 넘게 상승 출발","link":"https://n.news.naver.com/mnews/article/421/0009300328","naverLink":"https://n.news.naver.com/mnews/article/421/0009300328","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"앤트로픽 로고 일러스트. 2026.6.11 ⓒ 로이터=뉴스1 (서울=뉴스1) 권영미 기자 = 19일(현지시간) 미국 뉴욕 증시에서 나스닥 종합지수가 개장 직후 1% 급등하며 출발했다. 로이터통신에 따르면 다우존스 산업평균지수는 개장과 함께 234.2포인트(0.47%) 상승한 5만432.32를 기록했다. 스탠더드앤드푸어스(S&P) 500 지수는 65.6포인트(0.90%) 상승한 7389.26으로 출발했다. 나스닥지수는 개장 벨이 울림과 동시에 379.2포인트(1.55%) 오른 2만4809.053을 나타냈다. 기술주 중심의 나스닥이 상승 출발한 것은 인공지능(AI) 기업 앤스로픽이 기업공개(IPO) 공모가를 당초 예상 범위보다 높게 책정하면서, 성공적인 증시 데뷔에 대한 기대감이 커지고 AI 관련주에 대한 투자 심리가 강화된 데 따른 것이다.","category":"세계"},{"title":"푸틴 “얄타회담이 무슨 문제”… 3강 중심 ‘선전체제’ 가동하나","link":"https://n.news.naver.com/mnews/article/005/0001886331","naverLink":"https://n.news.naver.com/mnews/article/005/0001886331","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"푸틴 “얄타회담이 무슨 문제”… 3강 중심 ‘선전체제’ 가동하나. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"Anthropic IPO","link":"https://n.news.naver.com/mnews/article/077/0007243908","naverLink":"https://n.news.naver.com/mnews/article/077/0007243908","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"Anthropic IPO Dario Amodei, co-founder and CEO of Anthropic, left, embraces Daniela Amodei, co-founder and president, right, during the opening bell ceremony at Nasdaq MarketSite as part of the Anthropic IPO in New York, Thursday, Nov. 19, 2026. (AP Photo/Seth Wenig)","category":"세계"},{"title":"USA ANTHROPIC STOCK","link":"https://n.news.naver.com/mnews/article/091/0010373545","naverLink":"https://n.news.naver.com/mnews/article/091/0010373545","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"Anthropic stock debuts on Nasdaq market Spectators watch the Nasdaq MarketSite screen as Anthropic AI makes its Nasdaq debut in New York, New York, USA, 19 November 2026. Its initial public offering is priced at 83.00 USD per share, valuing the company at roughly 1.5 trillion USD. EPA/SARAH YENESEL","category":"세계"},{"title":"China APEC","link":"https://n.news.naver.com/mnews/article/077/0007243900","naverLink":"https://n.news.naver.com/mnews/article/077/0007243900","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"China APEC Russian President Vladimir Putin, right center, and Chinese Foreign Minister Wang Yi shake hands during Putin's departure at an airport after the APEC summit in Shenzhen, southern China's Guangdong province, Thursday, Nov. 19, 2026. (Vyacheslav Prokofyev/Sputnik, Kremlin Pool Photo via AP) POOL PHOTO","category":"세계"}],"IT 과학":[{"title":"삼성, 역대급 실적 반도체서만 사장 3명 승진","link":"https://n.news.naver.com/mnews/article/015/0005356498","naverLink":"https://n.news.naver.com/mnews/article/015/0005356498","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"70년대생 '기술통' 전면에 전영현·노태문 '투톱 체제' 유지 반도체·로봇·AI센터 사업 집중 실적 부진한 DX 내부 승진 없어 시스템LSI, 5년 만에 수장 교체 “성과가 있는 곳에 확실한 보상이 따른다는 신상필벌(信賞必罰) 원칙과 기술 인재 중시 기조를 재확인했다.” 20일 삼성전자가 발표한 2027년 정기 사장단 인사를 두고 재계 고위 관계자는 이같이 평가했다. 역대 최대 실적을 경신한 반도체(DS)부문에선 사장 승진자 3명이 한꺼번에 쏟아졌지만 고물가와 메모리 가격 폭등 여파로 실적 부진에 빠진 완제품(DX)부문에선 내부 사장 승진자가 한 명도 나오지 않으며 희비가 엇갈렸다. 이날 단행된 사장단 인사 규모는 승진 3명, 위촉업무 변경 3명 등 총 6명으로 지난해(4명)보다 소폭 늘었다. 승진자 3명 모두 1970년대생 젊은 ‘기술통’으로 DS부문에서 배출됐다. 올해 실적을 이끈 핵심 인사에게 확실한 보상을 준 것이라는 분석이 나온다. ◇메모리·모바일 경쟁력 강화에 ‘방점’ 이번 인사는 전영현 디바이스솔루션(DS)부문장(부회장)과 노태문 디바이스경험(DX)부문장(사장) 중심의 ‘투톱’ 체제를 유지하면서도 두 수장이 각각 겸직하던 메모리, 모바일경험(MX) 사업부장 자리에 핵심 인사를 배치한 것이 특징이다. 부문장이 미래 경쟁력과 전사 시너지를 챙기고, 신임 사업부장이 주력 사업의 경쟁력을 끌어올리도록 한다는 구상이 녹아 있다. 전 부회장은 파운드리(반도체 수탁생산) 수주 확대 등 부문 전반의 미래 경쟁력 확보에 집중한다는 방침이다. 노 사장은 완제품 사업의 원가 경쟁력 강화와 함께 로봇, 인공지능(AI) 데이터센터 등 신수종 사업 준비에 힘을 쏟을 계획이다. 신임 메모리사업부장을 맡은 황상준 사장은 D램 설계팀장과 마케팅팀장, D램 개발실장 등을 거치며 삼성 메모리 기술을 주도한 ‘정통 D램맨’이다. 황 사장은 D램 개발실장을 겸임하며 차세대 고대역폭메모리(HBM) 개발 등 기술 로드맵에 따라 초격차 경쟁력 강화에 ‘올인’할 방침이다. 동시에 빅테크 고객사 확대에 주력할 것으로 보인다. 최원준 신임 MX사업부장(사장)은 퀄컴 출신의 무선 통신·칩셋 전문가다. 갤럭시S 시리즈 흥행과 AI 폰 시장을 주도한 최 사장은 부품 원가 상승 압박을 돌파하고 차세대 AI 스마트폰 경쟁력을 한층 끌어올리는 중책을 맡았다. ◇시스템LSI, 새 수장으로 분위기 쇄신 차세대 기술 경쟁력 확보와 부진한 기존 사업 쇄신을 위한","category":"IT 과학"},{"title":"‘리트 만점자’ 고발 변호사 “AI 부정행위 흔적 끝까지 찾아달라”","link":"https://n.news.naver.com/mnews/article/366/0001206332","naverLink":"https://n.news.naver.com/mnews/article/366/0001206332","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"19일 오전 서울 강남구의 한 스튜디오에서 열린 '리트 만점자' 이진우 씨의 수능 국어 문제풀이 공개 검증 생중계 현장에 장비들이 세팅돼 있다. /뉴스1 법학적성시험(LEET·리트) 만점자 이진우(32)씨의 부정행위 의혹을 경찰에 고발한 변호사가 이씨의 사망에도 인공지능(AI)을 이용한 부정행위 여부를 끝까지 수사해야 한다고 촉구했다. 휴대전화와 노트북 등을 확보해 AI 사용 흔적과 외부 조력자의 존재를 확인해 달라는 것이다. 박은선 변호사는 20일 입장문을 내고 “AI 부정행위의 단서를 찾기 위해 조금만 더 애써달라”며 “수법이 남은 흔적을 어떻게든 찾기 위해 다각도의 노력을 기울여달라”고 밝혔다. 박 변호사는 “이씨 사건을 원칙대로 ‘공소권 없음’으로 조용히 정리하지 말고 수사를 계속해 달라고 호소한 것은 이 사건이 사적 범죄행위 이상의 의미가 있기 때문”이라고 했다. 이어 “다양한 범행 수법을 제대로 파악해내야 대안도 찾고 예방도 할 수 있을 것”이라고 강조했다. 구체적인 수사 방법도 제시했다. 박 변호사는 이씨의 휴대전화와 노트북 등을 유족에게 임의제출받거나 압수수색 영장을 신청해 AI 사용 여부를 확인할 수 있는 구매 기록과 외부 조력자와의 연락 내역 등을 조사해야 한다고 주장했다. 그는 “시험지만 중요한 게 아니라 더 중요한 건 AI”라고 했다. 경찰의 수사 의지에 대해서도 의문을 제기했다. 박 변호사는 담당 수사 부서의 연락처를 받은 뒤 여러 차례 전화했지만 담당자와 통화하지 못했다고 밝혔다. 이날 오후 수사 관계자와 통화했으나 휴대전화와 노트북 확보 여부, 고발인 조사 일정 등에 대해서도 설명을 듣지 못했다고 했다. 박 변호사는 “사안의 중대성을 고려해 실질상 인지 수사로 적극 수사하는 줄 알았는데 아무래도 잘못 생각한 게 아닐까 의심이 생긴다”며 수사가 제대로 진행되고 있는지 우려를 나타냈다. 앞서 박 변호사는 지난 18일 이씨를 위계에 의한 공무집행방해와 사기 혐의로 고발했다. 경찰은 사건을 서울경찰청 광역수사단 금융범죄수사대에 배당했다. 이씨는 19일 숨진 채 발견됐다. 경찰은 이씨의 사망에도 부정행위 의혹의 실체를 확인하기 위해 당분간 수사를 이어가겠다는 방침이다. 다만 이씨가 실제로 AI를 이용해 부정행위를 저질렀는지와 외부 조력자가 있었는지는 확인되지 않았다.","category":"IT 과학"},{"title":"수능 'AI 부정행위' 차단 총력…외신도 韓정부 대응 조명","link":"https://n.news.naver.com/mnews/article/003/0014334468","naverLink":"https://n.news.naver.com/mnews/article/003/0014334468","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"NYT, 전국에 울린 위급재난문자 주목…AP, 감독 인력 8400명 추가 보도 AFP, 공공 와이파이 차단·필기구 제한 소개…TV아사히 \"수험생 부담 커져\" 가디언, 안경 검사 앞두고 렌즈 찾은 수험생 조명…CNN, 중국·대만 사례 소개 [세종=뉴시스] 배훈식 기자 = 주요 외신들은 19일 치러진 2027학년도 대학수학능력시험에서 한국 정부가 인공지능(AI)을 이용한 부정행위 차단에 총력전을 벌였다고 보도했다. 사진은 2027학년도 대학수학능력시험일인 19일 오전 세종시 새롬고등학교(세종특별자치시교육청 29지구 제3시험장) 시험실에 스마트 기기 부정행위 제재 안내문이 붙어있는 모습. 2026.11.19. dahora83@newsis.com [서울=뉴시스] 신효령 기자 = 주요 외신들은 19일 치러진 2027학년도 대학수학능력시험에서 한국 정부가 인공지능(AI)을 이용한 부정행위 차단에 총력전을 벌였다고 보도했다. 당국은 시험장에 제출하지 않은 휴대전화를 찾으려고 전국에 위급재난문자를 보냈다. 시험장에서는 수험생의 안경을 검사하고 옷 단추에 스티커를 붙였다. 미국 뉴욕타임스(NYT)는 자연재해나 전시 상황에 쓰이는 경보음이 수능 당일 오전 8시30분 전국에서 울린 데 주목했다. 첫 위급재난문자는 시험 시작 10분 전에 발송됐고, 이후 두 차례 더 발송됐다. 신문은 지난해에는 영어 시험 난도가 논란이 됐지만, 올해는 AI 도구를 이용한 부정행위 가능성이 시험 관리의 새로운 변수로 떠올랐다고 전했다. AFP통신에 따르면 한국 정부는 시험장 주변 공공 와이파이를 차단하고 개인 필기구 반입을 제한했다. 단추가 달린 옷을 입고 온 수험생에게는 초소형 카메라 사용을 막기 위해 단추 위에 스티커를 붙였다. AP통신은 정부가 감독 인력 8400명을 추가로 투입하는 계획을 소개했다. 안경을 쓴 수험생은 시험 전 안경을 책상 위에 올려 검사를 받도록 했다. 일본 TV아사히는 감독관이 안경을 하나씩 확인하는 등 이례적인 조치가 잇따르면서 수험생들이 예년보다 큰 부담을 안게 됐다고 전했다. 대책이 강화된 계기는 수능 나흘 전 나온 세무사 시험 수석 합격자의 자백이었다. 그는 초소형 카메라와 휴대전화를 이용해 AI가 생성한 답을 받아 시험을 치렀다고 밝혔다. [서울=뉴시스] 김명년 기자 = 주요 외신들은 19일 치러진 2027학년도 대학수학능력시험에서 한국 정부가 인공지능(AI)을 이용한 부정행위 차단에 총력전을 벌였다고 보도했다. 사","category":"IT 과학"},{"title":"영남이공대, 반도체 기업 현장 탐방으로 고교생 취업 경쟁력 강화","link":"https://n.news.naver.com/mnews/article/016/0002725963","naverLink":"https://n.news.naver.com/mnews/article/016/0002725963","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"학생들이 탐방을 마치고 기념사진을 촬영하고 있다.[영남이공대 제공] [헤럴드경제(대구)=김병진 기자]영남이공대는 지난 17일부터 18일까지 1박 2일간 반도체 패키징 전문기업인 스태츠칩팩코리아에서 고등학생 대상 산업체 탐방 프로그램을 운영했다고 19일 밝혔다. 이번 프로그램은 고용노동부 고교생 맞춤형 고용서비스 사업의 일환으로, 반도체 산업에 관심 있는 고등학생들에게 실제 산업 현장을 경험하게 하고 진로 설계와 취업 준비를 지원하기 위해 마련됐다. 참가 학생들은 기업 방문에 앞서 반도체 산업 특성을 반영한 면접 교육과 비즈니스 매너 교육을 받았다. 이어 스태츠칩팩코리아를 방문해 반도체 후공정 산업 특강과 회사 설명회, 재직 선배와의 대화 등에 참여했다. 특히 현직자와의 소통을 통해 전공 지식이 실제 기업 업무에 어떻게 활용되는지 살펴보고 입사 과정과 직장생활에 대한 궁금증을 해소했다. 개인별 취업 상담도 진행해 학생들의 취업 준비 수준을 점검하고 보완 방향을 제시했다. 이번 프로그램은 지난 3월 1차 탐방을 시작으로 총 6차례 진행됐으며 대구·경북 등 39개 고등학교에서 학생과 교사, 학부모 등 378명이 참여했다. 성금길 대학일자리플러스센터장은 “학생들이 실제 산업 현장을 경험하는 것은 진로를 구체화하는 데 중요한 과정”이라며 “앞으로도 지역 산업체와 협력을 강화해 고등학생들에게 실질적인 진로 탐색과 취업 준비 기회를 제공하고 현장 실무형 인재 양성에 힘쓰겠다”고 말했다.","category":"IT 과학"},{"title":"한국만의 문제 아니었다…전 세계 'AI 커닝' 비상","link":"https://n.news.naver.com/mnews/article/018/0006412802","naverLink":"https://n.news.naver.com/mnews/article/018/0006412802","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"중국, 대학입시 기간 AI 문제풀이 기능 차단 일본·대만서 스마트안경 이용한 부정행위 적발 한국도 수능 직전 긴급대책…해외 AI 차단은 난항 CNN \"시험 경쟁 치열한 아시아가 AI 커닝 중심지\" [이데일리 마켓in 지영의 기자] 인공지능(AI)을 활용한 부정행위, 이른바 'AI 커닝' 논란은 한국만의 문제가 아니다. 중국과 일본, 대만 등 시험 경쟁이 치열한 아시아 국가에서는 이미 스마트안경과 AI를 이용한 부정행위가 적발되거나 관련 대책이 시행됐다. 중국은 대학입시 기간 AI의 문제풀이 기능을 제한하는 조치까지 도입한 것으로 파악됐다. 중국은 시험 땐 AI 문제풀이 차단 영국 일간지 가디언 등 외신 보도를 종합하면 중국에서는 지난해 6월 대학입학시험인 '가오카오(高考)' 기간 주요 AI 기업들이 시험 문제를 촬영해 정답을 구하는 기능을 일시적으로 중단했다. 알리바바의 큐원, 바이트댄스의 더우바오, 문샷AI의 키미 등에서 시험 관련 문제풀이 기능이 제한된 것으로 전해졌다. 올해도 비슷한 조치가 시행됐다. 중국 관영 CCTV는 지난 5월 가오카오를 앞두고 주요 AI 플랫폼들이 시험 시간대 문제 촬영과 정답 확인 등 일부 기능을 제한한다고 보도했다. 챗봇 서비스 전체를 중단하는 것이 아니라 시험 문제를 풀어주는 기능만 일시적으로 막는 방식이다. 시험장 단속도 강화했다. 산둥성은 올해 가오카오를 앞두고 5세대 이동통신(5G) 신호 차단 장비 4만275대와 스마트 보안검색대 1528대를 준비했다. 스마트안경이나 스마트워치 등 통신 기능이 있는 기기의 시험장 반입도 금지했다. 중국에서는 부정행위의 경중에 따라 전체 시험 성적을 무효로 하고 1~3년간 응시 자격을 제한할 수 있다. 19일 오전 서울 명동에서 한 외국인 관광객이 수능 부정행위 방지를 위해 울린 '재난안전문자' 알람을 보여주고 있다. (사진=정유진 기자) 이미 2024년부터...일본·대만도 스마트안경 부정행위 적발 일본 IT 전문매체 IT미디어 등 현지 언론에 따르면 일본에서도 지난 2024년 2월 와세다대 입학시험에서 스마트안경을 이용한 부정행위가 적발됐다. 한 수험생이 안경에 달린 카메라로 화학 시험 문제를 촬영해 외부 사람들에게 전송하고 정답을 요청했던 것으로 전해졌다. 대학은 그 수험생의 합격을 인정하지 않았고, 경찰은 업무방해 혐의로 검찰에 송치했다. 이후 일본 대학입시센터는 같은 해 7월 이듬해 대학입학공통테스트에서 스마트안경과 스마트워치 등 착","category":"IT 과학"},{"title":"GERMANY UKRAINE DIPLOMACY","link":"https://n.news.naver.com/mnews/article/091/0010373546","naverLink":"https://n.news.naver.com/mnews/article/091/0010373546","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"GERMANY UKRAINE DIPLOMACY. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"Germany Ukraine War","link":"https://n.news.naver.com/mnews/article/077/0007243905","naverLink":"https://n.news.naver.com/mnews/article/077/0007243905","pubDate":"2026-11-19T12:00:00+09:00","author":"네이버뉴스","description":"Germany Ukraine War Ukrainian President Volodymyr Zelenskyy, from left, German Chancellor Friedrich Merz, and French President Emmanuel Macron attend a plenary session at the summit of the \"Coalition of the Willing\" at the Chancellery in Berlin, Germany, Thursday, Nov. 19, 2026. (Lisi Niesner/Pool Photo via AP) POOL PHOTO","category":"IT 과학"},{"title":"THAILAND SOCCER","link":"https://n.n function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}
$("#today").textContent=compactDate(seoulDateKey(new Date()));
function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(!showPopular&&category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-popular="1" class="'+(showPopular?'active':'')+'">네이버 인기</button><button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
function dateOffsetKey(key,offset){
 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);
 return seoulDateKey(d);
}
function drawDateTabs(){
 const days=window.dailyDays||[];
 const todayKey=seoulDateKey(new Date());
 const yesterdayKey=dateOffsetKey(todayKey,-1);
 const today=days.find(d=>d.date===todayKey);
 const yesterday=days.find(d=>d.date===yesterdayKey);
 const options=[{key:"today",label:"오늘 · "+compactDate(todayKey)},{key:"yesterday",label:compactDate(yesterdayKey)},{key:"all",label:"전체 날짜"}];
 $("#date-tabs").innerHTML=options.map(o=>'<button type="button" data-day="'+o.key+'" class="'+(dayFilter===o.key?'active':'')+'">'+esc(o.label)+'</button>').join('');
}
async function load(){
  const todayKey=seoulDateKey(new Date());
  window.dailyLoading=false;
  const data=window.NEWS_DATA;
  if(!data||!data.days||!data.days.today){
    $("#count").textContent="오늘 뉴스 데이터 준비 중";
    $("#feed").innerHTML='<div class="empty">오늘 뉴스 데이터를 준비하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
