 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":19},{"title":"���� Ÿ�� ���� ��� �������ٰ� 'ȭ��¦'�������� ����","link":"https://n.news.naver.com/article/015/0005351357?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495824+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":20}]},"yesterday":{"date":"2026-11-07","weekday":"토요일","label":"어제 · 11월 7일 토요일","total":50,"categories":{"사건 사고":[{"title":"사람 몰려 경찰 출동…‘남대문 스카프’ 아저씨, 경호원까지 고용했다","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:43:52.138612+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:43:52.138598+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:43:52.138593+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"‘스카프 아저씨’ 결국 경호원까지 고용했다…인파 몰려 안전사고 우려","link":"https://n.news.naver.com/mnews/article/016/0002720169","naverLink":"https://n.news.naver.com/mnews/article/016/0002720169","pubDate":"2026-11-07T10:33:39.816918+09:00","author":"네이버뉴스","description":"‘스카프 아저씨’(좌)의 상점 앞에 몰린 인파[인스타그램] [헤럴드경제=김성훈 기자] 거침없는 입담으로 SNS 스타가 된 서울 남대문시장 ‘스카프 아저씨’가 민간 경호원까지 고용한 것으로 알려졌다. 너무 많은 인파가 몰려들어 안전관리가 필요한 상황이 됐기 때문이다. 6일 연합뉴스TV에 따르면, 남대문 시장에서 스카프를 판매하는 상인 A 씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 배치했다. 방문객이 너무 많이 몰려 발생할 수 있는 안전사고를 예방하고, 시장 내 질서를 유지하기 위해서다. 앞서 A 씨는 너무 많은 인파에 지난달 31일 임시 휴업을 선택했다. 며칠 간의 휴지기를 거쳐 지난 4일 다시 문을 열었지만 상황은 달라지지 않았고, 경찰이 출동하는 소동까지 벌어졌다. 결국 A 씨는 5일 다시 영업을 중단했다. 그는 자신의 SNS인 ‘남대문 다다구리’에 “요즘 생각지도 못한 너무 많은 관심과 사랑을 받고 있어서 솔직히 가슴 한구석에는 엄청난 부담감과 불안함이 있다”고 털어놨다. 구경 인파가 몰려들어 누군가 다치지 않을까 염려를 하면서 “앞으로 생길 일들에 살짝 두려운 마음이 드는 것도 사실이다”라고 했다. 남대문시장 상인회 차원에서도 사고 예방을 위해 촉각을 곤두세우고 있는 상황이다. 스카프 6장을 1만원에 판매하는 A 씨는 최근 온라인상에서 손님들에게 유쾌한 농담을 건네는 모습이 확산되면서 일약 SNS 스타가 됐다. 그는 손님들에게 “돈 쓰지 마. 이거 집에 가면 더 별로야”, “이걸로 땀이나 닦아, 하고 다니지 말고”라며 오히려 구매를 만류한다거나, 매대 가득한 스카프를 들추는 손님에게 “교양 있게 행동하지 마, 뒤집어야 나올 거 아니여~” 등의 입담으로 손님들의 웃음을 자아냈다. 이에 스카프를 사기보다 A 씨의 입담을 직접 듣거나 사진을 찍으려는 사람까지 늘면서 안전 문제와 타 업장 피해까지 발생하는 상황이 빚어지고 있다.","category":"사건 사고"},{"title":"신임 경찰청장 후보에 김종철 청장대행…“엄중한 시기 책임 막중”","link":"https://n.news.naver.com/mnews/article/022/0004173085","naverLink":"https://n.news.naver.com/mnews/article/022/0004173085","pubDate":"2026-11-07T10:26:05.115544+09:00","author":"네이버뉴스","description":"신임 경찰청장 후보에 김종철 청장대행…“엄중한 시기 책임 막중”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"[속보] 김종철 경찰청장 후보자 “막중한 책임 느껴”…경찰위 출석","link":"https://n.news.naver.com/mnews/article/025/0003563343","naverLink":"https://n.news.naver.com/mnews/article/025/0003563343","pubDate":"2026-11-07T10:08:37.041304+09:00","author":"네이버뉴스","description":"김종철 경찰청장 직무대행이 6일 이재명 대통령이 참석한 가운데 청와대에서 열린 한·동티모르 치안협력을 위한 기술약정서 체결식에 참석해 약정서 서명하기 위해 펜을 들고 있다. 청와대통신사진기자단 신임 경찰청장 후보자인 김종철 경찰청 차장은 6일 “엄중한 시기에 경찰청장 후보자로 지명된 것에 막중한 책임을 느낀다”고 밝혔다. 김 후보자는 이날 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하기 전 “경찰에 대한 국민의 기대가 어느 때보다 높고 또 그 이상 우려의 목소리가 크다는 걸 잘 알고 있다”며 이같이 말했다. 이어 “오늘 후보자로서 역량과 자질을 검증받는 만큼 책임 있는 자세로 성실히 임하겠다”고 했다. 경찰위는 이날 임시회의에서 김 후보자의 임명 제청 동의 여부를 심의한다. 경찰청장 인선은 대통령실의 후보자 추천, 경찰위 동의, 행정안전부 장관 제청, 국회 인사청문회, 대통령 임명 순으로 진행된다. 인사청문회를 거치되 국회의 임명 동의는 필요하지 않다. 김 후보자는 1970년 경남 함양에서 태어나 진주 명신고와 한국외국어대 영어과를 졸업했다. 1997년 경찰간부후보생 45기로 경위에 임관했다. 2019년 서울 서초경찰서장을 지냈으며, 2021년 경무관으로 승진해 부산경찰청 자치경찰부장을 맡았다. 같은 해 7월에는 문재인 정부 청와대 국정상황실에서 근무했다. 이후 대구·대전경찰청 공공안전부장, 서울경찰청 생활안전교통부장, 충남경찰청 공공안전부장, 강원경찰청 생활안전부장 등을 역임했다. 지난해 9월 치안감으로 승진해 경남경찰청장을 맡았고, 올해 8월 치안정감 승진자로 내정됐다. 이어 9월 경찰청 차장에 임명돼 청장 직무대행을 맡고 있다.","category":"사건 사고"},{"title":"세 번 만난 일본인 여성 왜 살해했나…30대 남성, 주식 실패에 처지 비관","link":"https://n.news.naver.com/mnews/article/008/0005437859","naverLink":"https://n.news.naver.com/mnews/article/008/0005437859","pubDate":"2026-11-07T00:26:25.047999+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"“암 말기” 구속 피하고 ‘스토킹 살인’ 60대… “대화 중 화나서” 혐의 인정","link":"https://n.news.naver.com/mnews/article/081/0003696787","naverLink":"https://n.news.naver.com/mnews/article/081/0003696787","pubDate":"2026-11-07T00:26:25.047980+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/mnews/article/088/0001038903","naverLink":"https://n.news.naver.com/mnews/article/088/0001038903","pubDate":"2026-11-07T00:26:25.047962+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[그해 오늘]골목서 폭행당한 뒤 끝내 숨져…김창민 감독 사망 1년","link":"https://n.news.naver.com/mnews/article/018/0006405407","naverLink":"https://n.news.naver.com/mnews/article/018/0006405407","pubDate":"2026-11-07T00:26:25.047940+09:00","author":"네이버뉴스","description":"김창민 감독의 사망 사건을 1년 뒤 되짚으며 당시 사건 경과와 관련자들의 책임 문제를 다룬다.\n사건 이후 제기된 의문과 대응 과정을 살펴본다.\n폭력 피해를 줄이기 위한 예방과 신속한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:43:52.926575+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:43:52.138613+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:43:52.138610+09:00","author":"네이버뉴스","description":"설악산 -9도, 홍천·파주 -6.6도까지 떨어져…서울도 곳곳 영하 낮 8∼13도 그쳐…당분간 추위, 내일 경기북동부와 강원내륙·산지 눈 가능성 찬바람 부는 서울의 아침 (서울=연합뉴스) 서대연 기자 = 서울 아침 최저기온이 3도까지 떨어지며 급격히 추워진 6일 서울 종로구 광화문네거리에서 외투 모자를 쓴 관광객과 시민들이 신호를 기다리고 있다. 2026.11.6 dwise@yna.co.kr (서울=연합뉴스) 이재영 기자 = 절기 입동(立冬)인 7일 내륙 대부분의 아침 기온이 영하로 내려가는 등 추위가 시작했다. 이날 오전 7시 기준 일최저기온 현황을 보면 설악산은 -9.0도, 횡성(둔내)은 -6.8도, 홍천(서석)과 파주(판문점)는 -6.6도까지 기온이 떨어졌다. 7일 오전 8시 20분 기준 일최저기온 분포도. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:43:52.138605+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"‘대법관 증원’에 공간확보 예산만 100억...행정처, 내년 6월 대법원 떠난다","link":"https://n.news.naver.com/mnews/article/025/0003563477","naverLink":"https://n.news.naver.com/mnews/article/025/0003563477","pubDate":"2026-11-07T10:43:52.138602+09:00","author":"네이버뉴스","description":"서울 서초구 대법원 청사 전경. 뉴스1 대법관을 현행 14명에서 26명으로 늘리는 법원조직법이 통과되면서 내년 대법원 공간 확보 예산에만 100억원 가량이 소요되는 것으로 나타났다. 이를 위해 법원행정처 일부 부서는 내년 6월부터 대법원을 떠나게 된다. 국회 법제사법위원회의 ‘2027년도 대법원 소관 예산안 검토보고서’ 등에 따르면 대법관 증원에 따른 공간 재배치 사업비용으로 내년에 편성된 예산은 총 99억 5600만원이다. 대법관 집무실 신설 예산으로 22억 5100만원, 재판연구관실 이전 예산으로 27억 8900만원, 법원행정처 외부 청사 이전 예산으로 49억 1600만원이 편성됐다. 대법원은 대법관 증원에 필요한 공간을 확보하기 위해 대법원 청사 본관 12~15층에 집무실을 신설할 계획이다. 대법원 본관 12층에 대법관 3명, 13층에 1명을 위한 집무실이 들어선다. 현재 대법관들은 대법원 본관 7~10층에 각 층 3명씩 근무하고 있고, 본관 12~15층은 재판연구관실로 사용하고 있다. 당초 본관 12~15층을 사용하던 재판연구관들은 대법원 청사 동관에서 근무하게 된다. 동관 3~5층에서 근무 중인 법원행정처 일부 부서는 외부 임차사무실로 순차적으로 이전하겠다는 계획이다. 대법원은 현재 외부에 임차할 사무실을 물색하고 있고, 내년 초에 외부로 이전할 법원행정처 부서도 확정할 예정이다. 국회예산정책처가 지난달 발간한 '2027년도 예산안 위원회별 분석'에 수록된 대법원 청사 이전 계획안에 따르면, 대법원은 본관 12~15층을 대법관 집무실로 활용할 계획이다. 국회예산정책처","category":"사회"},{"title":"차에서 폰 썼다고 “미친X”…초등생 머리 피범벅 만든 태권도 관장","link":"https://n.news.naver.com/mnews/article/025/0003563484","naverLink":"https://n.news.naver.com/mnews/article/025/0003563484","pubDate":"2026-11-07T10:43:52.138590+09:00","author":"네이버뉴스","description":"폭행 피해 아동의 머리 부위 상처 모습. 사진 스레드 캡처 차량 내에서 휴대전화를 사용했다는 이유로 초등학생 제자의 머리를 휴대전화로 내려쳐 다치게 한 40대 태권도장 관장이 경찰에 입건됐다. 진주경찰서는 아동복지법상 아동학대 혐의로 경남 진주시 한 태권도장 관장 40대 A씨를 조사 중이라고 지난 5일 밝혔다. A씨는 지난달 29일 오후 6시50분쯤 태권도장 차량을 운전해 원생들을 하원시키던 중 조수석에 탄 초등학교 4학년 원생 B군의 머리를 휴대전화로 10차례가량 때린 혐의를 받고 있다. A씨는 B군이 차량 내 휴대전화 사용 금지 규칙을 어겼다는 이유로 이 같은 행동을 한 것으로 전해졌다. 당시 차량 뒷좌석에는 중학교 2학년생인 B군 누나를 비롯한 다른 원생들도 함께 타고 있었던 것으로 확인됐다. 사건은 B군 누나가 휴대전화로 당시 상황을 촬영하고 소셜미디어(SNS)에 폭행 내용이 담긴 글과 영상이 올라오면서 알려졌다. 공개된 영상에서 A씨로 추정되는 남성은 B군을 향해 “미친X이네 이거”, “돌았어?”, “장난하는 것 같아?” 등 욕설과 폭언을 쏟아냈다. 이어 “손 내려라”, “뭘 잘했다고 울어”라고 소리친 뒤 “내일 반성문 10장 써와. A4용지에 빼곡하게”라고 요구했다. B군은 울먹이며 “아닙니다”라는 말을 반복했고 이 과정에서 무언가를 때리는 듯한 소리가 여러 차례 이어졌다. B군 어머니 C씨는 지난 6일 JTBC ‘사건반장’에 사건 당일 집 앞에 선 차량에서 아들이 머리를 부여잡고 내렸고 머리에서는 피가 흐르고 있었다고 설명했다. C씨가 경위를 묻자 누나는 “태권도 관장님이 동생을 때렸다”고 했고 C씨는 즉시 태권도장에 전화를 걸어 항의한 뒤 응급실로 이동했다. B군은 머리를 네 바늘 꿰매는 치료를 받았다. C씨는 ‘사건반장’에 “믿고 의지했던 학원에서 이런 일이 벌어져 너무나 충격이고 배신감이 든다”며 “아들이 원형탈모 치료를 받고 있는데 이번 일로 트라우마가 더 심해질까 걱정된다”고 호소했다. 논란이 커지자 A씨는 “아이를 지도하고 보호해야 할 어른으로서 감정을 다스리지 못하고 해서는 안 될 행동을 했다”며 “학생과 부모님께 진심으로 사과드린다”고 말한 것으로 전해졌다. 진주경찰서는 아동복지법상 아동학대 혐의로 A씨를 입건하고 정확한 사건 경위를 조사 중이라고 밝혔다.","category":"사회"},{"title":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]","link":"https://n.news.naver.com/mnews/article/011/0004679685","naverLink":"https://n.news.naver.com/mnews/article/011/0004679685","pubDate":"2026-11-07T10:33:39.816922+09:00","author":"네이버뉴스","description":"정보근 법무법인 리움 대표 변호사 정보근 변호사의 부동산법을 부탁해 얼마 전 오래전부터 알고 지낸 지인의 부탁으로 이혼소송을 진행한 적이 있다. 이들 부부는 10년 정도 결혼 생활을 유지하고 아이도 낳아 키우다가 불화 끝에 결국 헤어졌다. 전문직에 종사 중인 지인은 혼인 중 아파트를 포함해 예금, 자동차 등 상당한 재산을 취득했다. 이혼을 하며 재산을 분할하는 과정에서, 공동명의로 보유한 아파트는 일반적으로 한쪽이 아파트 소유권을 전부 취득하되, 다른 한쪽에 현금을 지급하는 형태로 정리된다. 이혼하는 마당에 공유지분을 유지할 수 없고, 공유지분 일부만 매각하면 제대로 된 값에 팔리지 않으니 손해가 크기 때문이다. 실제로 해당 사안에서도 남편은 아내가 보유한 공유지분을 이전받는 대신 재산분할로 현금 수억 원을 지급했다. 그런데 여기서 한 가지 의문이 생긴다. 이혼 시 재산분할 과정에서 지급받은 현금 수억 원에 대해 증여세가 부과될까. 결론부터 얘기하면 증여세가 부과되지 않는다. 이유는 재산분할은 혼인 중 공동으로 형성한 재산을 청산·분배하는 것이기 때문이다. 이혼 시 재산분할 과정에서 증여세 미과세의 경우와 비교해 배우자 사망 시 상속세가 부과되는 것은 형평성의 문제가 있다는 지적이 있다. 만약 부부가 백년해로하다 남편이 먼저 사망하는 경우 아내는 높은 상속세를 납부하는 반면, 오히려 이혼으로 재산분할을 하는 경우에는 증여세를 내지 않는다는 것이 불합리하다는 것이다. 부부간 상속세 폐지를 주장하는 논리 중 하나 또한 재산분할의 경우에도 증여세가 없다는 점이 근거로 제시되기도 한다. 동일한 아파트 한 채를 두고 배우자 간 이혼과 상속의 경우 전혀 다르게 취급할 본질적인 이유가 있는가. 이는 조세정책상의 결단 사항일 뿐 양자 사이에 본질적인 차이는 없는 것으로 보인다. 실제로 과거에는 이혼 재산분할이 상속세 배우자 공제액을 초과하면 그 초과분을 일률적으로 증여로 봐 과세하는 법률이 존재하기도 했다. 물론 이 법조항은 재산분할과 상속은 재산관계와 신분관계라는 점에서 본질적으로 다르다는 이유로 헌법재판소에서 위헌 결정이 났으나, 필자가 보기에 양자를 달리 취급하는 근거가 선뜻 이해가 되지 않는다. 실제로 상속세를 걱정해 ‘황혼 이혼’을 하는 사례도 심심치 않게 있다고 한다. 절세를 위해 황혼 이혼까지 고려되는 이유는 최근 아파트 가격 급등으로 인해 상속세 부과 대상인 사람이 급증했기 때문이다. 통계에 따르면 지난해 상속","category":"사회"},{"title":"이용철 법무장관 후보자 \"검찰개혁 차질 없이 완수\"","link":"https://n.news.naver.com/mnews/article/052/0002429398","naverLink":"https://n.news.naver.com/mnews/article/052/0002429398","pubDate":"2026-11-07T10:21:50.332120+09:00","author":"네이버뉴스","description":"이용철 법무부 장관 후보자가 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계 안착에 힘쓰겠다고 지명 이후 첫 공식 입장을 밝혔습니다. 이 후보자는 오늘(6일) 형사사법체계가 크게 개편된 엄중한 시기에 법무행정을 책임지는 법무부 장관 후보자로 지명돼 막중한 책임감을 느낀다며 이같이 전했습니다. 이어 참여정부 청와대 법무 비서관으로 검경 수사권 조정 등 검찰개혁 업무를 수행했던 경험을 살려 검찰개혁을 완수하고 새 형사사법체계 안착에 역할을 해달라는 게 이재명 대통령이 자신을 지명한 이유로 생각된다고 설명했습니다. 이 후보자는 장관으로 임명된다면 검찰 개혁 완수와 새 형사사법체계의 빠른 안착에 힘쓰는 한편, 범죄 피해자 등 사회적 약자의 인권 보호에도 최선을 다하겠다고 강조했습니다. 그러면서 국민에게 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다고 덧붙였습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:16:02.704974+09:00","author":"네이버뉴스","description":"[김형자 과학칼럼니스트 sisa@sisajournal.com] 안경테에 내장된 카메라로 문제 촬영, AI가 분석해 렌즈에 정답 띄워 신종 부정행위 도구로 악용되는 스마트 기기…당국 '엄벌' 경고 속 대응 고심 시험지를 바라보는 수험생. 안경테에 숨겨진 카메라가 문제를 촬영하고, 인공지능(AI)이 순식간에 답을 찾아낸다. 정답은 안경을 쓴 사람만 볼 수 있는 작은 화면에 나타난다. 겉보기엔 평범한 안경이지만, 실제로는 AI가 대신 문제를 풀고 있는 셈이다. 11월19일 치러지는 2027학년도 대학수학능력시험(수능)을 앞두고 교육 현장에 비상이 걸렸다. 최근 연세대와 서울시립대 논술시험장에서 AI 스마트 안경(AI 안경)을 이용한 부정행위가 잇따라 적발된 데 이어 올해 국가자격시험에서도 5건의 부정행위가 확인됐기 때문이다. 첨단 기술이 가져온 편리함이 이제는 시험의 공정성을 흔드는 새로운 변수로 떠올랐다. ⓒChatGPT 생성이미지 일반 안경으로 위장한 'AI 기기' 식별법은 수능 출제기관인 한국교육과정평가원(평가원)과 교육부는 2027학년도 수능부터 AI 안경을 반입 금지 물품으로 지정하고 강력한 제재 방침을 내놨다. AI 안경을 이용해 부정행위를 한 수험생은 형사고발하거나 수사를 의뢰하는 등 엄정하게 대응한다는 계획이다. 시험 중 착용은 물론 가방 등에 소지하는 것만으로도 해당 시험이 무효 처리되고, 다음 해 응시 자격도 정지된다. 현재 1년인 응시 자격 정지 기간을 최대 3년으로 확대하는 방안도 추진 중이다. 나아가 논술·면접 등 대학별 고사에서도 강화된 제재 방침을 적용할 수 있도록 각 대학에 권고하기로 했다. 문제는 AI 스마트 안경이 일반 안경과 외형상 큰 차이가 없어 현장에서 쉽게 식별하기 어렵다는 점이다. 그렇다면 시험장에서는 과연 어떤 단서로 이 위험한 기기를 가려내야 할까. AI 안경은 일반 안경에 인공지능 기능을 결합한 웨어러블 기기다. 안경테 안에는 카메라와 마이크, 소형 스피커 등이 탑재돼 있고, 일부 제품은 렌즈에 작은 화면을 띄우는 디스플레이까지 갖추고 있다. 작동 방식은 크게 세 단계로 나뉜다. 먼저 안경에 달린 카메라가 사용자의 바라보는 풍경이나 사물을 촬영하고, 마이크는 사용자의 음성과 주변 소리를 수집한다. 이렇게 모아진 정보는 스마트폰이나 인터넷을 거쳐 AI에 전달된다. 그러면 마지막으로 AI가 이미지와 음성을 분석해 사물을 식별하거나 사용자의 질문에 답한다. 분석 결과는 소형","category":"사회"},{"title":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장","link":"https://n.news.naver.com/mnews/article/015/0005351350","naverLink":"https://n.news.naver.com/mnews/article/015/0005351350","pubDate":"2026-11-07T10:03:02.328306+09:00","author":"네이버뉴스","description":"사진=생성형 AI 고용 불안을 무기로 70대 고령 노동자의 월급을 3년 넘게 뜯어낸 악덕 하청업체 팀장이 결국 철창신세를 지게 됐다. \"(원청의) 항의로 잘릴 수도 있다\"며 겁을 준 이 남성은 그렇게 갈취한 8000만 원 넘는 돈을 개인 빚을 갚고 도박판에 탕진한 것으로 드러났다. 7일 법조계에 따르면 수원지방법원 여주지원은 최근 공갈 혐의로 재판에 넘겨진 하청업체 현장 총괄팀장 A씨에게 징역 1년의 실형을 선고했다. 한국도로공사의 하청업체에서 현장 총괄팀장을 맡고 있던 A씨는 청소인부를 구하라는 회사 대표의 지시에 따라 2020년 73세의 고령인 D씨를 채용했다. D씨는 그해 2월 17일부터 고속도로 갓길과 졸음쉼터 등을 청소하는 업무에 종사했다. 그런데 A씨는 2020년 5월 피해자의 배우자가 운영하는 점포를 찾아가 \"청소 업무에 대해 도로공사에 항의가 들어오고 있으니 잘릴 수도 있다. 일하기 싫으면 그만둬라. 당신 말고도 청소 일 할 사람 많다\"고 협박성 발언을 쏟아냈다. 심지어 \"(상납금은) 나 혼자 먹는 거 아니다. 사장님한테 로비하는데 쓰는 거다\"라는 핑계를 댔다. 인사권을 쥔 팀장의 협박에 겁을 먹은 70대 노인은 그날 바로 현금 372만 원을 바쳤다. 이후 피해자는 2023년 12월까지 같은 방법으로 총 40회에 걸쳐 현금 및 피고인(또는 피고인 자녀) 명의의 계좌로 합계 8169만원을 갈취당했다. 제대로 일하고도 세금 낼 돈이 없어 타인에게 돈을 빌리고 세금을 체납해야 할 정도로 피해자의 삶은 망가져 갔다. 법정에서 A씨는 D씨가 처음 약 1년간은 성실하게 작업하다가 언제부터인가 늦게 출발하고 청소 현장이라고 거짓말을 하는 등 게으름을 피워 청소작업을 제대로 하라는 취지로 말한 것뿐이라고 주장했다. 하지만 재판부는 \"피해자는 상납금을 갈취당하고 있는 입장이므로 근로의욕이 저하돼 업무를 태만히 하게 될 수 있고, 상납금을 갈취하는 A가 업무 태만으로 주의를 주더라도 정당한 지적으로 들리기 어렵다\"고 지적했다. 이어 \"피고 A는 피해자가 업무를 태만히 했다면서도 피해자를 재추천해 2년 연장 계약을 하면서, 결국 고속도로 청소 업무의 수준이 저하되는 결과가 초래될 수 있다\"고 지적했다. 법원은 A씨가 선고기일 직전에 합의서를 제출했지만 '30개월에 걸쳐 나눠 갚겠다'는 조건 등을 내걸었고, D씨가 엄벌을 탄원한 점 등을 감안해 실형을 선고했다.","category":"사회"}],"생활·문화":[{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:43:53.326339+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활·문화"},{"title":"기온 뚝 떨어지면 혈압 상승…고혈압인 사람이 주의해야 할 5가지 습관","link":"https://n.news.naver.com/mnews/article/296/0000107013","naverLink":"https://n.news.naver.com/mnews/article/296/0000107013","pubDate":"2026-11-07T10:43:53.326293+09:00","author":"네이버뉴스","description":"기온 낮아지면 혈관 수축하면서 혈액 흐를 때 저항 커져 혈압 상승 기온이 낮아지면 체온 손실을 줄이기 위해 혈관이 수축하면서 혈압이 상승할 수 있다. 사진=게티이미지뱅크 7일은 겨울이 시작되는 입동(立冬). 기온이 뚝 떨어졌다. 이런 시기에는 건강관리에 특히 주의를 기울여야 할 사람들이 있다. 고혈압이 있는 사람들이다. 우리나라의 20세 이상 고혈압 환자는 약 1360여만 명으로 추정된다. 성인 10명 중 3명꼴로 고혈압을 앓고 있는 셈이다. 추워지면 혈압 때문에 병원을 찾는 사람이 늘어난다. 평소엔 안정적이던 수치가 갑자기 치솟거나, 어지럼증이나 두통 같은 증상이 동반되기도 한다. 추위로 인해 혈관이 수축하면서 혈압이 상승한다. 특히 기온이 급격히 떨어지는 늦가을과 겨울에는 혈압 관리에 더욱 주의해야 한다. 고혈압 환자라면 약 복용만큼이나 겨울에 하지 말아야 할 행동을 정확히 아는 것이 중요하다. 일상의 작은 방심이 혈압 급등으로 이어질 수 있기 때문이다. 미국 건강·의료 매체 '메디컬뉴스투데이(MedicalNewsToday)' 등의 자료를 토대로 추운 시기에 혈압이 높은 사람들이 주의해야 할 것들에 대해 알아봤다. 아침에 일어나자마자 찬바람 맞으며 외출 =하루 중 기온이 가장 낮은 때는 아침이다. 이때 따뜻한 실내에서 곧바로 밖으로 나가 찬 공기를 맞으면 혈관이 급격히 수축하며 혈압이 빠르게 오른다. 특히 기상 직후에는 자율신경 조절이 완전히 이뤄지지 않아 심혈관 부담이 더 크다. 외출 전에는 실내에서 옷을 충분히 갖춰 입고, 가볍게 몸을 풀어 체온을 올린 뒤 천천히 나서는 것이 안전하다. '눈 뜨자마자 외출'은 추운 계절에 고혈압 환자가 가장 먼저 피해야 할 행동이다. 뜨거운 물 샤워나 사우나 =추위를 녹이겠다고 갑자기 뜨거운 물에 들어가는 습관도 위험하다. 급격한 온도 변화는 혈관을 갑자기 확장시켰다가 다시 수축시키며 혈압 변동 폭을 키운다. 특히 욕실과 침실의 온도 차가 큰 경우 어지럼이나 심계 항진(두근거림)을 느끼는 사례도 많다. 샤워는 미지근한 물로 시작해 서서히 온도를 올리는 것이 좋다. '확 뜨겁게'가 아니라 '천천히 따뜻하게'가 원칙이다. 과격한 야외 활동 =추울 때 바깥에서 강도 높은 운동이나 작업 등 무리하게 움직이는 행동은 추울 때 고혈압 환자에게 큰 부담이 된다. 추운 환경에서 갑작스럽게 힘을 쓰면 혈압과 심장박동 수(심박수)가 동시에 급상승할 수 있다. 특히 새벽이나 아침 시간대에는","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:33:40.778074+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"\"美민주, 캐나다 관세 철폐 추진…트럼프 무역정책 제동 첫발\"","link":"https://n.news.naver.com/mnews/article/001/0016427572","naverLink":"https://n.news.naver.com/mnews/article/001/0016427572","pubDate":"2026-11-07T10:26:05.519669+09:00","author":"네이버뉴스","description":"미시간·메인 등 선거 쟁점…공화당 이탈표 확보 전략 철강·차 등 관세는 당내 이견…무역법 전면 개정 난항 캐나다 윈저와 미국 디트로이트를 잇는 앰배서더 다리 [AFP=연합뉴스 자료사진. 재판매 및 DB 금지] (뉴욕=연합뉴스) 김연숙 특파원 = 미국 민주당이 도널드 트럼프 행정부의 대(對) 캐나다 관세 정책을 되돌리기 위한 입법을 추진하고 있다고 월스트리트저널(WSJ)이 6일(현지시간) 보도했다. 트럼프 대통령의 무역 정책 전반에 제동을 걸기 위한 첫 번째 조치로, 민주당은 관세에 반대하는 공화당 의원들의 협조를 얻어 입법까지 이어간다는 구상이다. 상원 재무위원회 민주당 간사인 론 와이든(오리건) 상원의원은 내년 1월 위원회 주도권을 넘겨받은 뒤 캐나다 관세를 철폐하는 법안을 추진하기 위해 동료 의원들과 논의하고 있다고 밝혔다. 와이든 의원은 \"캐나다산 제품에 대한 관세 폐지에 압도적인 지지가 있다\"고 말했다. 민주당의 이 같은 움직임은 이번 중간선거에서 관세가 주요 쟁점으로 부상한 지역의 유권자 반발을 동력으로 활용하려는 것으로 풀이된다. 미시간, 메인, 알래스카주 등에서는 캐나다와의 무역 갈등이 선거 쟁점이 됐다. 민주당뿐만 아니라 일부 공화당 후보들까지 관세에 반대하는 입장을 보였다. 민주당은 이들 지역의 공화당 의원들을 설득해 초당적 지지를 확보할 방침이다. 다만 법안이 실제 입법으로 이어지기까지는 상당한 정치적 장벽이 있다. 트럼프 대통령이 거부권을 행사할 경우 이를 무력화하려면 상·하원에서 각각 출석 투표 의원의 3분의 2 이상 찬성이 필요하다. 민주당은 이번 선거에서 현재까지 상원 54석, 하원 253석을 확보했지만, 거부권을 무력화할 수준의 의석에는 미치지 못해 공화당 의원들의 협조가 필요하다. 민주당은 캐나다 관세 철폐를 시작으로 대통령의 일방적인 관세 부과 권한을 제한하고 의회의 통제권을 강화하는 방향으로 무역 정책을 손보겠다는 구상이다. 의회 관계자들은 캐나다 관세의 근거가 된 1930년 관세법 제338조와, 무역적자 등에 대응해 대통령이 한시적으로 추가 관세를 부과할 수 있도록 한 1974년 무역법 제122조 등 대통령의 관세 부과 권한을 제한하는 방안도 검토 대상이 될 수 있다고 말했다. 다만 미국 무역법의 근본적인 개정으로 이어지기는 쉽지 않을 전망이다. 철강·알루미늄·자동차 등 특정 산업에 대한 관세의 근거가 되는 1962년 무역확장법 제232조와, 강제 노동 의혹을 근거로 60개국에","category":"생활·문화"},{"title":"NYT “뉴진스 계약, 이례적으로 공격적…미성년 보호조항 없어 불공정”","link":"https://n.news.naver.com/mnews/article/016/0002719622","naverLink":"https://n.news.naver.com/mnews/article/016/0002719622","pubDate":"2026-11-07T10:08:38.684046+09:00","author":"네이버뉴스","description":"그룹 뉴진스. [헤럴드POP(현 헤럴드뮤즈) 제공] [헤럴드경제=장연주 기자] 그룹 뉴진스의 멤버들이 미성년자 시절 소속사 어도어와 체결한 전속계약에 미성년자 보호 조항이 빠지는 등 불공정한 내용이 포함됐다고 뉴욕타임스(NYT)가 보도해 눈길을 끈다. NYT는 5일(현지 시간) 뉴진스 멤버 5명이 만 14~17세였던 2022년 체결한 전속계약서를 입수했다며 이 같이 밝혔다. NYT는 뉴진스와 어도어의 계약서를 입수해 분석한 결과, 미성년자 보호조항, 성형 비용 부담, 행동 제한, 위약벌 산정 방식, 계약 종료 이후 초상권 조항 등 멤버들의 권리를 침해하는 조항들이 다수 발견됐다고 보도했다. 이에 대해 NYT는 법률 전문가 5명의 검토를 거쳤는데, 이 중 한명인 서울의 엔터테인먼트 전문 노종언 변호사는 “이례적으로 공격적인 계약”이라고 평가했다고 덧붙였다. NYT는 먼저 뉴진스의 계약서에 대해 ‘아동 보호 관련 문구가 없다’고 지적했다. 뉴진스 멤버들은 12살이라는 어린 나이에 기숙사 생활을 시작했으며, 새벽 2시까지 리허설을 하는 것은 드문일이 아니었다고 익명을 요구한 관계자는 밝혔다. NYT에 따르면, 멤버들이 연습을 하는 구역에는 폐쇄회로(CC)TV가 설치돼 있었고, 멤버 5명 중 4명은 연습 도중 학교를 그만뒀다. 이에 대해 하이브 관계자는 “회사가 아동보호법을 철저히 준수하며, 출연진들이 안전한 환경에서 일하고 훈련받을 수 있도록 최선을 다하고 있다”고 밝혔다. 이어 “소속 아티스트들에게 학업을 중단하도록 강요하거나 휴식을 취하는 것에 대해 불이익을 주지 않는다”고 해명했다. 하지만 NYT는 입수한 이메일을 통해, 해당 계약 조건이 사실상 협상 불가능한 것이었다고 지적했다. 예컨데, 2022년 1월 한 멤버의 어머니가 계약서에 서명하기 전 여러가지 변경사항을 요청했는데, 어도어 측 부사장이 “만약 위에 언급된 사항들을 포함해 현재 계약 초안에 동의하지 않으신다면, 계약 자체를 재고해 보는 것이 최선일 수 있다”고 답변한 사실을 공개했다. 뉴진스의 계약서에는 피부 관리, 성형 수술, 체형 교정 등 미용 관련 비용도 멤버들이 부담한다는 조항도 있었다. 멤버들은 연습생 시절 성형수술 및 기타 미용 시술에 회사가 지출한 금액의 상당 부분을 상환해야 했다는 것. 이에 대해 하이브 측 관계자는 “개인의 의사에 반하는 성형수술이나 시술을 권유하지도 않는다”고 NYT에 말했다. 계약서에는 또 계약 종료 이후에도 멤버들","category":"생활·문화"},{"title":"'배달기사가 내 짜장면 먹었다' 논란에…배민 \"고객 음식 아냐\"","link":"https://n.news.naver.com/mnews/article/277/0005839318","naverLink":"https://n.news.naver.com/mnews/article/277/0005839318","pubDate":"2026-11-07T10:03:02.328201+09:00","author":"네이버뉴스","description":"배민 \"폐기 처리한 음식\" 배달 음식 섭취 시 강한 제재 '배달 기사가 고객이 주문한 음식을 몰래 먹고 있었다'는 의혹에 대해 배달의민족 측이 \"폐기 처리한 음식을 먹은 것\"이라고 해명했다. 배달의민족 배달기사의 음식 무단 취식 의혹이 제기된 당시 모습. 배민 측은 음식이 파손돼 처리하는 과정에서 발생한 오해라고 해명했다. 스레드 캡처. 지난 5일 배달의민족 물류 서비스를 전담하는 우아한청년들은 입장문을 내고 \"전날(4일) 사회관계망서비스(SNS)에 배달 기사가 고객 주문 음식을 먹었다는 취지의 게시물이 올라왔다\"며 \"해당 건을 접수해 경위를 확인했으며 확인 결과와 당사 입장을 공유한다\"고 밝혔다. 이어 \"확인 결과 음식은 라이더가 비용을 부담하는 것으로 처리된 상황(자부담)\"이라며 \"고객이 파손 처리를 하는 과정을 목격해 오해가 생겼다\"고 설명했다. 그 러면서 \"고객께는 재조리된 음식과 함께 소정의 보상을 제공했다\"고 덧붙였다. 그러면서 우아한청년들은 배달 기사가 주문 음식을 전달하지 않고 임의로 먹는 행위에 대해서는 엄격한 제재 기준을 적용하고 있다고 강조했다. 회사 측은 \"고객 주문 음식을 전달하지 않고 취식하는 등 부정행위가 확인될 경우 '배민 커넥트' 이용 제한까지 가능한 강도 높은 정책을 운용하고 있다\"고 했다. 앞서 SNS에는 용인에 거주 중인 A씨가 \"아이들과 먹으려고 중국집에서 짜장면과 탕수육 등 여러 음식을 주문했다\"며 \"예정 시간이 지나도록 음식이 도착하지 않아 앱을 통해 기사의 위치를 확인했다\"고 적었다. 이어 그는 \"배달 기사가 우리 집으로 와야 하는데 오지 않길래 위치를 확인했더니 창밖으로 보이더라\"며 \"창밖으로 보니 배달 기사가 집 건너편에서 주문한 음식을 먹고 있었다\"고 주장했다. 글을 쓴 A씨에 따르면 배달 기사는 주변에서 쉽게 발견하기 어려운 집 맞은편 다리 아래서 배달할 음식을 개봉해 먹고 있었다. A씨는 글과 함께 배 달 기사의 뒷모습이 담긴 사진을 함께 공개했다. 배달의민족 측이 입장을 낸 후 A씨는 \"오늘(5일) 갑자기 환불해준다고 전화를 해주더라\"며 \"일단 상황 전달을 저에게 충분히 주지 못했으나 플랫폼이 잘못했다고는 생각하지 않지만, 이런 상황이 재발하지 않길 바라는 마음에 게시글을 올린 것\"이라 고 강조했다. 아울러 \" 플랫폼에 악의적인 마음은 없다. 해당 기사가 그렇다고 하는데 뭐 어쩌겠는가\"라면서도 \" 기사가 손을 입으로 가져가며 오토바이 주변을 서성이는 모습을","category":"생활·문화"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:01:19.954869+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활·문화"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활·문화"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활·문화"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활·문화"}],"세계":[{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:43:52.516209+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:43:52.516207+09:00","author":"네이버뉴스","description":"[美 중간선거] 도널드 트럼프 미국 대통령(오른쪽)과 스티븐 밀러 백악관 신임 비서실장. /로이터=뉴스1 백악관 첫 여성 비서실장의 기록을 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 선거 패배 이후 백악과 내각에서 처음으로 이뤄진 인사 교체다. 신임 비서실장에는 도널드 트럼프 대통령의 강경파 최측근으로 꼽히는 스티븐 밀러 부비서실장(41)이 임명됐다. 민주당은 트럼프 대통령의 이 같은 인사가 선거 참패에도 '마이웨이'를 고수하겠다는 의지를 보인 것이라며 의회 차원의 조사를 예고했다. 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 \"밀러 부비서실장이 백악관 비서실장을 맡게 된다\"며 \"내가 가장 신뢰하는 참모 중 하나\"라고 밝혔다. 와일스 실장에 대해선 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로 헌신해준 데 대해 감사하다\"고 발표했다. 트럼프 대통령은 '트럼프 정치조직'이 어떤 조직인지, 와일스가 어떤 역할을 맡게 될지는 구체적으로 언급하지 않았지만 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 패배에 따른 인적 개편임을 시사했다. 이날 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 지 사흘 만에 발표됐다. 밀러 신임 실장은 트럼프 대통령의 대표적인 강경파 측근으로 집권 1기부터 반(反)이민 정책을 설계하고 추진해온 핵심 참모다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했고 트럼프 대통령의 첫 취임사 준비도 주도했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지내다 2기 행정부 들어 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도했다. 미 정가에선 트럼프 대통령이 비서실장 교체를 단행하면서 조만간 후속 내각 개편이 이어질 수 있다는 관측이 나온다. 수지 와일스 전 백악관 비서실장. /AP=뉴시스 /사진=이혜미","category":"세계"},{"title":"[아프리카인물열전](45) \"노예의 풍요보다 자유로운 빈곤을\"…투레 기니 대통령","link":"https://n.news.naver.com/mnews/article/001/0016427649","naverLink":"https://n.news.naver.com/mnews/article/001/0016427649","pubDate":"2026-11-07T10:43:52.516203+09:00","author":"네이버뉴스","description":"프랑스어권 아프리카 식민지 중 첫 독립 선포 '강골'…26년 철권통치 그림자도 1961년 유고슬라비아를 방문한 아흐메드 세쿠 투레 기니 초대 대통령 [위키피디아 제공. 재판매 및 DB 금지] (카이로=연합뉴스) 김상훈 특파원 = \"우리는 노예 상태에서 누리는 풍요보다 자유 속의 빈곤을 택하겠다.\" 1958년 프랑스의 샤를 드골 대통령 면전에 던진 이 단호한 선언은 서부 아프리카 독립운동의 거대한 불씨가 되었다. 프랑스의 제국주의에 정면으로 맞서 기니의 즉각적인 독립을 쟁취한 인물, 아흐메드 세쿠 투레(1922~1984) 기니 초대 대통령은 아프리카 민족주의 역사에서 가장 강렬한 족적을 남긴 지도자 중 한 명으로 꼽힌다. 1922년 기니 중부 파라나에서 태어난 세쿠 투레는 19세기 프랑스 식민 침략에 맞서 싸운 위대한 저항군 지도자 사모리 투레의 후손으로 알려져 있다. 그는 우체국 직원 등으로 일하며 노동조합 활동에 투신했다. 탁월한 연설 능력과 강력한 카리스마를 바탕으로 기니 노동운동과 민족주의 진영의 핵심 지도자로 부상했다. 세쿠 투레의 이름이 전 세계에 각인된 것은 1958년 프랑스가 제안한 신헌법 찬반 국민투표 때다. 당시 드골 프랑스 대통령은 아프리카 식민지국들에 완전 독립 대신 '프랑스 공동체' 내의 자치국으로 남을 것을 종용했다. 대부분의 프랑스어권 아프리카 지도자들이 경제적 지원 중단을 우려해 이를 수용했지만, 세쿠 투레는 단호히 거부했다. 그해 9월 28일 실시된 투표에서 기니 국민은 95%의 압도적인 반대표를 던졌고, 10월 2일 기니는 프랑스어권 아프리카 국가 중 최초로 완전 독립을 선포했다. 세쿠 투레의 반란에 분노한 프랑스의 보복은 집요하고 가혹했다. 기니에 주둔하던 프랑스 관리와 기술자들을 즉각 철수시키며 전화선과 발전소 등 기반 시설을 파괴했고, 심지어 관공서의 전구와 행정 서류, 의약품까지 모조리 파기하거나 챙겨서 떠났다. 신생 독립국 기니를 철저히 붕괴시켜 다른 식민지국에 본보기를 보여주겠다는 의도였다. 그러나 세쿠 투레는 굴복하지 않았다. 서방의 지원이 끊기자 그는 옛소련, 중국 등 공산권 국가들과 손을 잡고 위기를 돌파했다. 가나의 콰메 은크루마 등과 함께 범(凡)아프리카주의 운동을 주도하며 아프리카의 완전한 해방을 역설했다. 대륙 전체의 독립을 상징하는 영웅으로 추앙받았다. 냉전 시대 강경한 사회주의 및 비동맹 노선을 걸었던 탓에 한국과 직접적인 외교적 인연은 없었다. 대신 그","category":"세계"},{"title":"트럼프, 비서실장에 '총리 별명' 충성파…美우선주의 마이웨이(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427650","naverLink":"https://n.news.naver.com/mnews/article/001/0016427650","pubDate":"2026-11-07T10:43:52.516200+09:00","author":"네이버뉴스","description":"'강경 이민정책 설계자' 스티븐 밀러 낙점…민주당 반발·여권도 우려 트럼프, 중간선거 패배 사흘만에 비서실장 교체하며 기존 정책기조 고수 천명 밀러 \"힘이 국제질서 좌우\" 제국주의적 세계관…공세적 대외정책 우려 커져 스티븐 밀러 신임 백악관 비서실장 [AFP=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 백나리 특파원 = 도널드 트럼프 미국 대통령이 중간선거 패배 사흘 만에 스티븐 밀러(41) 백악관 부비서실장을 비서실장에 낙점한 것은 중간선거 참패에도 '마이웨이'를 고수하겠다는 의지를 분명히 한 행보라는 평가다. '강경 이민정책의 설계자'이자 대외정책에 있어 제국주의적 시각을 보여온 최측근을 '최고위 호위무사'에 앉힘으로써 민심의 심판을 받은 핵심 정책을 내려놓지 않고 상·하원 권력을 접수한 민주당을 상대로 공세적 대응에 나서겠다는 뜻을 천명한 것으로 풀이된다. 트럼프 대통령이 6일(현지시간) 신임 백악관 비서실장으로 낙점해 발표한 밀러 부비서실장은 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프 대통령의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프 대통령의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것이라는 분석이다. 트럼프 행정부의 대표 정책이 정당했다는 주장을 고수하며 민주당과의 충돌을 불사하겠다는 의지나 다름없어서 당분간 미국 국내 정치에 큰 혼란이 예상된다. 밀러 신임 실장은 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 '좌파 척결'에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 당장 민주당 지도부는 이번 인선을 \"최악의 선택\"이라 맹폭하며 밀러 신임 실장에 대한 의회 차원의 조사를 예고했다. 밀러 신임 실장의 관여 속에 추진되는 행정부 정책에도 맞서 싸우겠다는 입장도 분명히 했다. 트럼프 대통령 지켜보는 밀러 신임 실장 [AFP=연합뉴스. 재판매 및 DB 금지]","category":"세계"},{"title":"이란, 핵개발 관련 중재국 제안 검토... 외교 물꼬 기대-NYT","link":"https://n.news.naver.com/mnews/article/014/0005600326","naverLink":"https://n.news.naver.com/mnews/article/014/0005600326","pubDate":"2026-11-07T10:43:52.516138+09:00","author":"네이버뉴스","description":"모흐센 레자이 이란 최고국가안보회의 사무총장.AP뉴시스 [파이낸셜뉴스] 미국과의 전쟁을 종식하기 위한 교착 상태의 외교적 노력으로 이란 전쟁에 돌파구가 마련될 조짐이 보이고 있다. 이란이 핵 프로그램의 미래를 다룬 중재국들의 제안을 검토 중인 것으로 확인됐다. 5일(현지시간) 뉴욕타임스(NYT)는 협상 관련 전현직 당국자들의 말을 인용해 몇 주간 강경 태도를 고수하던 이란이 핵 협상 재개 의사를 보였다며 전면전 재발을 막기 위해 카타르가 주도해 온 중재 노력이 결실을 보기 시작하고 있다고 보도했다. 이들 당국자는 이란이 검토 중인 조항들이 \"구체적인 제안\"이라고 설명했다. 카타르는 지난주 테헤란에서 두 차례 협상을 진행하고 자국 수도 도하에서 세 번째 회담을 주최하는 등 적극적인 외교전을 펼쳐왔다. 카타르 측은 아르메니아에서도 이란 당국자들과 만남을 가진 것으로 알려졌다. 미국 측에서는 JD 밴스 부통령이 군사적 충돌을 막기 위한 카타르 주도 외교를 적극 지지하고 있다. 밴스 부통령은 이번 주 중간선거에서 공화당이 대패한 원인으로 이란과의 전쟁을 지목하며 트럼프 대통령과 일정 부분 거리를 두는 모습을 보이기도 했다. 앞서 밴스 부통령은 지난달 모흐센 레자이 이란 최고국가안보회의 의장에게 이란의 핵 프로그램을 포함한 직통 평화 회담을 제안하는 서한을 보냈다. 레자이 의장은 이 서한에 대해 \"미국이 이란에 대한 태도를 바꾼 증거이자 이란 승리의 표식\"이라고 평가한 바 있다. 지난 2월 미국과 이스라엘이 이란을 공격하기 전에도 밴스 부통령은 도널드 트럼프 대통령의 측근 중 전면전에 가장 반대했던 인물로, 전쟁이 지역적 혼란과 막대한 인명 피해를 불러올 것이라고 경고했었다. 밴스는 최근 \"트럼프 대통령과 본인 모두 협상을 통한 타결 가능성에 긍정적\"이라며 진전이 있음을 내비쳤다. 이번 외교적 움직임은 트럼프 대통령과 이스라엘이 이란의 에너지 인프라 등 경제적 핵심 요충지를 겨냥한 대규모 공격을 검토 중인 가운데 이뤄졌다. 미국과 이란은 지난 6월 휴전에 합의하며 핵 문제 논의와 호르무즈 해협 재개방을 추진했으나, 협상이 결렬되면서 수개월간 교착 상태에 빠졌었다. 최근 양국 간 비난 수위가 높아지자 카타르 중재진이 막판 중재에 나선 것이다. 레자이 의장은 공개적으로는 동결 자산 해제, 석유 제재 및 봉쇄 해제 없이는 핵 협상이 없다고 밝혔으나, 비공개 자리에서는 아바스 아라그치 이란 외무장관, 모하마드 바케르 갈리바프","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:43:52.138586+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:26:05.519731+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 선거 패배에 영향을 미친 뒤 협상에 대한 희망의 조짐이 나타나고 있다. 트럼프는 6일 기자들과 문답하는 과정에서 중재국들의 이란과의 논의가 계속되고 있다고 밝혔다. 트럼프는 “우리는 이란과 대화하고 있다. 이전부터 그래 왔다”고 말했다. 카타르와 이란은 핵 협상으로 나아가기 위한 가교 합의를 논의하고 있다. 역내 당국자들에 따르면 중재국들과 이란은 테헤란의 핵 프로그램에 관한 추가 협상의 길을 여는 데 도움이 될 잠정적 중간 단계 합의를 논의했다. 당국자들은 카타르가 최근 양측에 제시한 이 제안이 이틀에 걸쳐 신뢰 구축 조치를 이행하도록 하는 내용을 담고 있다고 말했다. 이 조치에는 미국의 봉쇄 해제와 이란의 핵 프로그램을 둘러싸고 이란을 고립시키려는 미국의 정책에 따라 수년 동안 압류해 동결한 이란 자금 수십억 달러 가운데 일부를 풀어 주는 방안이 포함된다. 그 대가로 이란은 미국과 이스라엘의 폭격을 받은 자국 시설에 국제원자력기구(IAEA) 사찰단이 들어오는 것을 허용하게 된다고 당국자들은 말했다. 당국자들에 따르면 둘째 날에는 이란이 호르무즈 해협을 다시 개방하게 된다. 이는 이란과 오만이 해당 해협을 놓고 합의했으나 미국의 승인을 받지 못한 수정 합의에 따른 것이다. 이러한 조치들이 이","category":"세계"},{"title":"선거참패 1호 희생양?…'얼음아가씨' 백악관 첫 女비서실장 퇴장(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427624","naverLink":"https://n.news.naver.com/mnews/article/001/0016427624","pubDate":"2026-11-07T10:03:02.940635+09:00","author":"네이버뉴스","description":"와일스, 선거 앞두고 교체설 흘러나와…막판 트럼프 신임 떠난 정황 '행정부 내 권력암투' 분석도…\"와일스 일가 사익추구\" \"반대파의 모략\" 초기 유방암 진단받고 투병…\"트럼프, 알코올중독자 성격\" 발언 파장도 수지 와일스 [로이터=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 백악관 첫 여성 비서실장이라는 역사를 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 도널드 트럼프 미국 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 와일스 실장이 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 발표했다. 선거 패배 이후 백악과 내각 가운데 처음으로 이뤄진 교체 인사다. 집권당이 선거에서 질 경우 통상적으로 참모진과 각료 교체가 뒤따르게 되는데, 트럼프 대통령도 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 결과에 따른 인적 개편임을 시사했다. 와일스 실장은 공화당의 선거 전망이 암울해진 지난달부터 백악관과 행정부에서 교체설이 흘러나왔다. 그의 교체를 예상한 인사들이 후임 쟁탈전을 벌이고 있다고 보도될 정도였다. 막판에는 와일스 실장이 트럼프 대통령의 신임을 잃은 것 아니냐는 정황도 제기됐다. 역대 최단명 대변인인 케이티 재커라이어를 지명할 때 트럼프 대통령이 와일스 실장과 상의하지 않은 것으로 드러나면서다. 또 와일스 실장이 2024년 대선 때 영입한 제임스 블레어 전 백악관 부비서실장과 크리스 라시비타의 비위 의혹이 불거지자 트럼프 대통령이 즉각 이들과의 관계를 끊겠다고 발표하면서 와일스 실장과 사이가 틀어졌다는 관측이 나왔다. 트럼프 대통령은 선거 기간 와일스 실장의 교체설에 \"나는 전적으로 와일스를 신뢰한다\"고 선을 그었으나, 예상보다 처참한 중간선거 성적표를 받아들고 와일스 실장을 희생양 삼아 사실상 경질한 것으로도 볼 수 있다. 트럼프 대통령은 선거 당일 밤 여러 사람이 보는 앞에서 와일스 실장과 그가 이끄는 정치팀을 향해 '재앙'의 책임을 추궁하며 비난한 것으로 알려졌다고 뉴욕타임스(NYT)가 전했다. 와일스 실장의 교체 이면에는 트럼프 행정부에서 벌어진 권력 다툼이 작용했다는 분석이 제기된다. 그가 트럼프 대통령에게 잘못된 조언을 하면서 가족의 사익을 추구했다는 폭로가 나오고, 와일스 측은 반대파가 선거 패배의 책임을 자신에게 뒤집어씌운다고 반발하는 모습이다. 로버트","category":"세계"},{"title":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다","link":"https://n.news.naver.com/mnews/article/011/0004679676","naverLink":"https://n.news.naver.com/mnews/article/011/0004679676","pubDate":"2026-11-07T10:03:02.940631+09:00","author":"네이버뉴스","description":"클립아트코리아 생성형 인공지능(AI)이 학생들의 숙제와 시험 준비에까지 활용되면서 미국 학교의 평가 방식이 달라지고 있다. 집에서 작성하는 에세이 대신 교실에서 직접 글을 쓰거나 말로 답하는 구술시험이 다시 주목받고 있다. 최근 로이터통신에 따르면 미국의 일부 중·고등학교에서는 학생들의 AI 의존도를 낮추기 위해 손 글씨 과제와 대면 평가를 확대하고 있다. 로이터는 최근 미국 전역의 교사와 교육 전문가 12명을 인터뷰해 이러한 변화를 소개했다. 학생이 제출한 결과물만 평가하기보다 학습 내용을 실제로 이해했는지 확인하려는 움직임이다. 챗GPT가 대신 써주는 숙제…구술시험·손 글씨 부활 샌프란시스코에서 6학년 인문학을 가르치는 트리스턴 창 교사는 지난해부터 집에서 작성하는 에세이 숙제를 없앴다. 대신 학생에게 직접 질문을 던지고 답변을 듣는 구술시험을 도입했다. 시험에서는 작품의 등장인물과 줄거리, 주제, 은유적 표현 등을 묻는 15개 질문을 활용한다. 학생이 작품을 얼마나 이해했는지 말로 설명하도록 하는 방식이다. 창 교사는 “오랫동안 기술이 교육 방식을 바꿔왔지만 AI는 그중에서도 가장 급격한 변화”라며 “기존의 모든 방식이 통하지 않게 됐다”고 말했다. 다른 교사들도 숙제를 줄이는 대신 교실에서 학습 과정을 확인하는 데 집중하고 있다. 샌프란시스코의 중학교 영어 교사 러스티 셰이브는 집에서 과제를 해결하기 어려운 학생들이 AI에 의존하기 쉽다고 판단했다. 이에 교실에서 직접 글을 쓰는 시간을 늘렸다. 7학년 학생들과 에세이 한 편을 완성하는 데 한 달을 할애한 적도 있다고 전했다. 수학 수업에서도 변화가 나타났다. 뉴욕의 고등학교 수학 교사 밥슨 웡은 집에서 풀어오는 문제 수를 줄이고 수업 시간에 직접 문제를 해결하도록 했다. AI가 정답뿐 아니라 풀이 과정까지 만들어낼 수 있게 되면서 답을 맞혔는지만으로는 학생의 이해도를 평가하기 어려워졌기 때문이다. 웡 교사는 학생들에게 자신이 선택한 풀이법과 그 이유까지 설명하게 한다. 그는 “AI는 학생들의 수학 공부 방식뿐 아니라 내가 가르치는 방식까지 바꿨다”고 말했다. 디지털 기기 사용을 제한하는 학교도 있다. 시카고 교외의 고등학교 영어 교사 렉스 오발레는 수업이 시작되면 학생들에게 공책부터 꺼내도록 한다. 크롬북을 활용하는 수업은 전체 수업일의 약 10%로 제한했다. 오발레 교사는 “노트북이 없으면 학생들이 뒤에 숨을 수 없다”며 디지털 기기 사용을 줄인 뒤","category":"세계"},{"title":"트럼프, 그래도 마이웨이… “美에 공장 안 지으면 관세 300%”","link":"https://n.news.naver.com/mnews/article/023/0004008299","naverLink":"https://n.news.naver.com/mnews/article/023/0004008299","pubDate":"2026-11-07T10:01:19.432621+09:00","author":"네이버뉴스","description":"[美중간선거 후폭풍] 선거 패배에도 기존 입장 고수 도널드 트럼프 미국 대통령이 5일(현지 시각) 워싱턴DC 백악관에서 ‘백악관 집무실 국가기념물 지정’ 포고문에 서명하는 행사에 참석해 앉아 있다. /로이터 연합뉴스 도널드 트럼프 미국 대통령이 중간선거 참패 이틀 만인 5일(현지 시각) “미국에 공장을 짓지 않으면 최고 300%의 관세를 내야 한다”며 기존 관세 정책을 고수하겠다는 뜻을 분명히 했다. 공화당 대패의 원인으로 고물가와 이란 전쟁이 지목됐지만 정책 변화보다는 강경 대응을 예고한 것이다. 트럼프는 이날 백악관에서 취재진과 만나 “지금 관세를 없애면 미국에 건설 중인 3000여 공장의 공사가 모두 중단될 것”이라며 “그 대신 중국, 일본, 한국 등에서 제품을 들여오게 될 것”이라고 했다. 관세 철폐를 주장하는 사람들에게는 “어리석은 사람들”이라고 했다. 뉴욕 증시가 폭락하자 책임을 유권자에게 돌리기도 했다. 트럼프는 트루스소셜에 “민주당이 화요일 선거에서 크게 이겼기 때문에 오늘 주식시장이 폭락했다”며 “안타깝지만 여러분 스스로를 탓할 수밖에 없다”고 적었다. 또 다른 글에서는 “여러분의 은퇴 연금 계좌도 하락했다. 기억하라. 공화당이 아니라 민주당 때문”이라고 했다. 선거 결과에 대한 책임도 부인했다. 트럼프는 “나는 투표 용지에 없었다. 내가 출마했다면 압승했을 것”이라고 주장했다. 선거 전 자신의 이름이 투표 용지에 있다고 생각하고 투표하라고 독려했던 것과 달라진 태도다. 향후 국정 운영에 대해서는 “앞으로 1~2주 동안 많은 것을 보게 될 것”이라며 추가 조치를 예고했다. 이란에 대해서도 “가능하면 나머지를 파괴하고 싶지 않지만 그렇게 해야 할 수도 있다”고 했다. 한편 민주당은 하원(총 435석)에서 260석까지 넘볼 수 있는 상황이다. 이날 오후 6시 기준 민주당은 253석을 확보했고, 27석은 당선자가 확정되지 않았다. CBS뉴스는 민주당 최대 의석을 268석까지 전망했다. 민주당이 260석 이상을 확보하면 1990년 이후 36년 만에 최대 규모의 하원 의석을 차지하게 된다.","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:43:52.926582+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:43:52.926580+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:43:52.926578+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:43:52.926577+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:43:52.926573+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:43:52.926572+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:43:52.926569+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:43:52.926561+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:43:52.926558+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:43:52.926547+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-06","weekday":"금요일","label":"보관 · 11월 6일 금요일","total":24,"categories":{"사건 사고":[{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/article/088/0001038903","pubDate":"2026-11-06T23:00:09+09:00","author":"매일신문","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/088/0001038903"},{"title":"“요양보호사가 80대 환자 밀쳐 중상” 가족이 고소···경찰, 수사 착수","link":"https://n.news.naver.com/article/032/0003481193","pubDate":"2026-11-06T22:29:00+09:00","author":"경향신문","description":"전남 나주경찰서. 연합뉴스요양보호사가 80대 환자를 밀쳐 중상을 입혔다는 고소장이 접수돼 경찰이 수사에 나섰다.6일 전남 나주경찰서에 따르면 80대 환자 A씨의 가족은 폭행치상 등 혐의로 나주 한 요양병원의 요양보호사 B씨를 수사해달라는 내용의 고소장을 제출했다.고소인들은 A씨가 B씨에게 밀려 넘어지면서 고관절 부위를 크게 다쳤다고 주장했다. 또 간호조무사···","category":"사건 사고","naverLink":"https://n.news.naver.com/article/032/0003481193"},{"title":"“100여차례 여탕 몰카”…아내가 찍고 남편이 function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(!showPopular&&category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-popular="1" class="'+(showPopular?'active':'')+'">네이버 인기</button><button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
function dateOffsetKey(key,offset){
 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);
 return seoulDateKey(d);
}
function drawDateTabs(){
 const days=window.dailyDays||[];
 const todayKey=seoulDateKey(new Date());
 const yesterdayKey=dateOffsetKey(todayKey,-1);
 const today=days.find(d=>d.date===todayKey);
 const yesterday=days.find(d=>d.date===yesterdayKey);
 const options=[{key:"today",label:"오늘 · "+compactDate(todayKey)},{key:"yesterday",label:compactDate(yesterdayKey)},{key:"all",label:"전체 날짜"}];
 $("#date-tabs").innerHTML=options.map(o=>'<button type="button" data-day="'+o.key+'" class="'+(dayFilter===o.key?'active':'')+'">'+esc(o.label)+'</button>').join('');
}
async function load(){
  const todayKey=seoulDateKey(new Date());
  window.dailyLoading=false;
  const data=window.NEWS_DATA;
  if(!data||!data.days||!data.days.today){
    $("#count").textContent="오늘 뉴스 데이터 준비 중";
    $("#feed").innerHTML='<div class="empty">오늘 뉴스 데이터를 준비하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
