체포된 용의자는 없는 상태다. 수사당국은 화물 운송 절차에 익숙한 전문 조직일 가능성에 무게를 두고 수사를 벌이고 있다. 최초 신고는 화물이 사라진 뒤 수일이 지난 후에야 나왔다. 화물은 8월 말에 출발했지만 도난 사실은 9월 초에 파악된 것으로 알려졌다. 일각에서는 범인들이 고가 장비를 옮기거나 처분할 시간을 충분히 확보했을 가능성이 제기된다. 경찰은 구체적으로 어떤 제품이 실렸는지와 장비 회수 여부를 공개하지 않았다. 엔비디아 화물을 노린 범죄는 이번이 처음이 아니다. 지난해에도 캘리포니아 프리몬트와 유니언시티에서 엔비디아 화물을 노린 절도 사건이 잇따라 발생했다. 이 사건의 피해 규모는 750만달러를 웃돌았다. 수사당국은 당시에도 전문 조직이 개입한 것으로 판단했다. AI 투자 열풍으로 관련 부품 가격이 급등하면서 엔비디아 제품은 범죄조직의 표적으로 떠오르고 있다. 고성능 AI 칩은 해외 암시장에서 시세 훨씬 높은 가격에 거래될 수 있어 절도 유인이 크다. 이번 사건은 AI 공급망의 보안 취약성을 보여주는 사례라는 지적이 나온다. 빅고파이낸스는 \"고가 AI 반도체 운송 과정에 대한 실시간 위치 추적과 이상 정차 감지 등 보안 체계를 강화해야 한다는 목소리가 커지고 있다\"고 지적했다.","category":"사건 사고"},{"title":"세 번 만난 일본인 여성 왜 살해했나…30대 남성, 주식 실패에 처지 비관","link":"https://n.news.naver.com/mnews/article/008/0005437859","naverLink":"https://n.news.naver.com/mnews/article/008/0005437859","pubDate":"2026-11-07T00:26:25.047999+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"경찰까지 출동하더니…결국 경호원 고용한 '스카프 아저씨'","link":"https://n.news.naver.com/mnews/article/015/0005351326","naverLink":"https://n.news.naver.com/mnews/article/015/0005351326","pubDate":"2026-11-07T00:26:25.047995+09:00","author":"네이버뉴스","description":"온라인에서 관심을 모은 인물을 둘러싸고 현장 갈등이 커져 경찰이 출동했고, 이후 경호 인력까지 고용했다는 내용이다.\n기사에서는 인물을 둘러싼 상황과 주변의 반응을 전한다.\n공공장소에서의 갈등이 안전 문제로 번지지 않도록 상황 관리가 필요하다는 점을 보여준다.","category":"사건 사고"},{"title":"“암 말기” 구속 피하고 ‘스토킹 살인’ 60대… “대화 중 화나서” 혐의 인정","link":"https://n.news.naver.com/mnews/article/081/0003696787","naverLink":"https://n.news.naver.com/mnews/article/081/0003696787","pubDate":"2026-11-07T00:26:25.047980+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"\"길 좀 물을게요\"…밤길 여성 4명 뒤쫓은 뒤 5번째 성폭행 시도한 30대","link":"https://n.news.naver.com/mnews/article/053/0000062877","naverLink":"https://n.news.naver.com/mnews/article/053/0000062877","pubDate":"2026-11-07T00:26:25.047970+09:00","author":"네이버뉴스","description":"길 묻는 척 접근해 주거지까지 400m 따라가 폭행…징역 4년 선고 부산지법 서부지원. photo 연합뉴스 길거리에서 마주친 여성들을 뒤따라가다 20대 여성을 상대로 성폭행을 시도한 30대 남성이 실형을 선고받았다. A씨는 여성 4명을 차례로 뒤따라갔으나 범행에 실패했고, 이후 다섯 번째로 마주친 여성을 상대로 성폭행을 시도한 것으로 조사됐다. 6일 법조계에 따르면 부산지법 서부지원 형사1부(부장판사 나원식)는 강간상해 혐의로 기소된 30대 A씨에게 징역 4년을 선고했다. 이와 함께 성폭력치료프로그램 40시간 이수와 아동·청소년·장애인 관련 기관에 각 7년간 취업제한을 명령했다. A씨는 지난 7월 11일 오후 11시쯤 부산의 한 거리에서 마주친 여성 5명을 차례로 뒤따라갔다. 이 가운데 20대 여성 B씨에게 길을 묻는 척 접근해 주거지까지 약 400m를 따라간 것으로 조사됐다. A씨는 B씨의 주거지 인근에 도착하자 피해자의 목을 조르고 인적이 드문 곳으로 끌고 가려 했다. 이어 저항하는 B씨의 얼굴 등을 여러 차례 폭행한 뒤 성폭행을 시도한 것으로 조사됐다. 범행은 이를 목격한 주민이 고함을 지르면서 미수에 그쳤다. B씨는 이 과정에서 전치 2주의 상해를 입었다. 조사 결과 A씨는 범행 전 한 주점에서 술을 마시던 중 여성 손님과 업주 등 2명을 추행한 것으로 파악됐다. 이후 주점을 나와 귀가하던 중 길거리에서 마주친 여성들을 차례로 뒤따라가며 범행 대상을 물색한 것으로 조사됐다. 재판부는 \"이 사건 범행은 불특정인을 대상으로 한 이른바 '묻지마 범행'으로 이는 누구나 피해자가 될 수 있을 뿐만 아니라 피해자가 갑작스러운 범행에 대처하기도 어려워 사회적으로 큰 불안감을 야기하는 중대한 범죄에 해당한다\"며 \"피고인의 죄책이 매우 무겁고 비난 가능성이 매우 높다\"고 지적했다. 또 피해자가 정신과 진료를 받는 등 상당한 정신적·육체적 고통을 겪었으며, 피고인에 대한 엄벌을 요구했다고 밝혔다. 또 A씨가 피해자를 위해 2000만원을 공탁했으나 피해자가 수령을 거부한 점도 언급했다. 재판부는 공탁 사실을 피해 회복을 위한 노력으로 제한적으로 고려했다고 설명했다. 다만 A씨가 범행을 인정하고 형사처벌 전력이 없는 점, 강간 범행이 미수에 그친 점 등은 양형에 참작했다고 밝혔다. ※주간조선 온라인 기사입니다.","category":"사건 사고"},{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/mnews/article/088/0001038903","naverLink":"https://n.news.naver.com/mnews/article/088/0001038903","pubDate":"2026-11-07T00:26:25.047962+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[그해 오늘]골목서 폭행당한 뒤 끝내 숨져…김창민 감독 사망 1년","link":"https://n.news.naver.com/mnews/article/018/0006405407","naverLink":"https://n.news.naver.com/mnews/article/018/0006405407","pubDate":"2026-11-07T00:26:25.047940+09:00","author":"네이버뉴스","description":"김창민 감독의 사망 사건을 1년 뒤 되짚으며 당시 사건 경과와 관련자들의 책임 문제를 다룬다.\n사건 이후 제기된 의문과 대응 과정을 살펴본다.\n폭력 피해를 줄이기 위한 예방과 신속한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"‘여성 학대 의혹’ 카광 출국금지…“약자 괴롭힐수록 돈 되는 구조 없애야”","link":"https://n.news.naver.com/mnews/article/018/0006405408","naverLink":"https://n.news.naver.com/mnews/article/018/0006405408","pubDate":"2026-11-07T00:26:25.047938+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"}],"사회":[{"title":"119 구급차에서 태어난 31주 미숙아 살려낸 '50일의 기적'","link":"https://n.news.naver.com/mnews/article/654/0000209848","naverLink":"https://n.news.naver.com/mnews/article/654/0000209848","pubDate":"2026-11-07T00:26:25.047997+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"\"밤 10시 넘으면 씻지도 말라고?\"…아파트 공지문에 엇갈린 반응","link":"https://n.news.naver.com/mnews/article/003/0014307370","naverLink":"https://n.news.naver.com/mnews/article/003/0014307370","pubDate":"2026-11-07T00:26:25.047990+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 밤 10시 이후 샤워와 세탁기 사용을 자제해 달라는 아파트 공지문을 두고 네티즌들의 의견이 엇갈렸다. (사진출처=스레드 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 아파트 입주민이 밤 10시 이후 샤워와 세탁기 사용 등 물소리를 자제해 달라는 공지문을 게시한 사실이 알려지면서 온라인에서 논쟁이 벌어졌다. 6일 소셜미디어(SNS) 스레드에는 한 아파트 입주민이 작성한 층간소음 관련 공지문 사진이 올라왔다. 공지문 작성자는 밤 10시부터 자정은 물론 새벽 2~3시에도 세탁기와 샤워기, 세면대에서 물을 사용하는 소리가 들린다고 적었다. 그는 \"밤시간이 아니라면 지속 시간이 길더라도 견딜 수 있다. 일과의 마무리를 씻고 정리하는 것은 일반적\"이라면서도 \"한밤중 물소리는 이웃에게는 폭포수처럼 엄청난 소음\"이라고 썼다. 이어 \"새벽에 휴대폰을 던지고 싸우는 소리, 화장실 문 쾅 닫는 소리에 물 폭탄 소리까지 들린다\"며 \"층간소음에 취약한 아파트라 알고 싶지 않은 소음들마저 실시간 중계되는 구조이니 서로서로 조심하자는 취지\"라고 밝혔다. 그러면서 \"밤 10시 이후에는 서로 배려했으면 한다\"고 당부했다. 이를 접한 네티즌들의 반응은 엇갈렸다. 샤워와 세안, 화장실 이용은 일상생활에 필요한 행동인 만큼 제한해서는 안 된다는 의견이 나왔다. 네티즌들은 \"9시 출근 6시 퇴근만 있는 줄 아느냐\", \"밤늦게 퇴근하는 사람은 어쩌라는 거냐\", \"자다 깨서 화장실에 다녀오고 손을 씻을 수도 있다\", \"물소리는 층간소음에도 들어가지 않는다\"등의 댓글을 남겼다. 반면 아파트 구조에 따라 물소리도 크게 들릴 수 있는 만큼 늦은 시간에는 주의할 필요가 있다는 의견도 있었다. 일부 네티즌은 \"소음이 심한 아파트는 물소리도 엄청 크게 들린다\", \"세탁기는 밤 10시 이후 피하는 게 맞는 것 같다\", \"샤워도 늦은 시간이라면 10~15분 안에 끝내는 게 좋다\"고 했다. 이후 공지문 작성자로 추정되는 입주민은 댓글을 통해 공지의 취지를 추가로 설명했다. 그는 \"단지 샤워를 하지 말라는 게 아니다\"며 \"윗집은 하루 종일 쿵쾅쿵쾅 발망치 소리, 의자 드르륵 소리, 싸우는 소리가 난다\"고 주장했다. 이어 \"하루에도 몇십 번씩 화장실을 들락날락하는데 낮과 저녁 내내, 새벽 3시까지 화장실에서 우당탕탕 물을 틀었다 껐다 계속 반복하고 있어 자다가 자꾸 깬다\"고 덧붙였다. 또한 \"윗집은 평일은 물론 주말과 방학 내내 어디를","category":"사회"},{"title":"\"천국 가려면 굶어야\"…어린이 190명 굶겨 죽인 사이비 교주 '징역 200년'","link":"https://n.news.naver.com/mnews/article/088/0001038899","naverLink":"https://n.news.naver.com/mnews/article/088/0001038899","pubDate":"2026-11-07T00:26:25.047988+09:00","author":"네이버뉴스","description":"종교 지도자가 신도들에게 극단적인 금식을 강요해 다수의 사망자가 발생한 사건의 재판 결과를 다룬다.\n법원은 지도자의 책임을 인정해 중형을 선고했다.\n종교를 악용한 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"사회"},{"title":"구급차서 태어난 31주 미숙아…구급대원 덕에 살았다","link":"https://n.news.naver.com/mnews/article/009/0005760299","naverLink":"https://n.news.naver.com/mnews/article/009/0005760299","pubDate":"2026-11-07T00:26:25.047964+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"李대통령과 '오랜 인연' 이용철 법무장관 후보자, 공소취소 입장은?","link":"https://n.news.naver.com/mnews/article/022/0004173158","naverLink":"https://n.news.naver.com/mnews/article/022/0004173158","pubDate":"2026-11-07T00:26:25.047960+09:00","author":"네이버뉴스","description":"이용철 후보자는 검찰개혁을 마무리하고 새 형사사법체계가 현장에 안착하도록 힘쓰겠다고 밝혔다. 범죄 피해자와 사회적 약자의 인권 보호도 주요 과제로 제시했다.","category":"사회"},{"title":"“의사 선생님, 집도 드릴게요” 77억 들여 숙소까지 지은 농어촌…의사 구하기 얼마나 힘들길래","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-07T00:26:25.047949+09:00","author":"네이버뉴스","description":"의료 인력을 구하기 어려운 농어촌 지역이 의사 유치를 위해 주거 지원책을 마련했다는 기사다.\n숙소 조성에 큰 예산을 투입해 근무 여건을 개선하려는 시도가 소개됐다.\n지역 의료 공백을 줄이는 데 실제로 도움이 될지가 과제로 남는다.","category":"사회"},{"title":"일반인 목졸라 중상 입힌 '조폭' 출신 유튜버…예상 처벌 수위는","link":"https://n.news.naver.com/mnews/article/003/0014307414","naverLink":"https://n.news.naver.com/mnews/article/003/0014307414","pubDate":"2026-11-07T00:26:25.047947+09:00","author":"네이버뉴스","description":"수사기관 \"대본에 따른 연출된 촬영\" 주장 안 받아들여 변호사 \"12주 중상…주동자 징역 1년6개월 안팎 실형 예상\" 사진 JTBC 뉴스 영상 캡처 *재판매 및 DB 금지 [서울=뉴시스]이준형 인턴 기자 = 유튜브 생방송 중 일반인 출연자에게 위험한 격투기 기술을 걸어 기절시키고 중상을 입힌 전직 조폭 출신 유튜버가 검찰에 송치됐다. 이에 주동자는 징역 1년 이상, 공범은 징역 1년 6개월 안팎의 실형을 선고받을 것이라는 법조인의 분석이 나왔다. 3일 조기현 법무법인대한중앙 대표변호사는 공식 유튜브 채널을 통해 해당 사건의 수사 경과와 향후 처벌 수위를 전망했다. 조 변호사는 \"종합격투기 선수 출신 유튜버인 주동자가 피해자에게 전치 12주의 중상을 입힌 혐의(상해죄)로 불구속 송치됐다\"며 \"사건 이후 피해자와 합의를 진행해 법원이 구속영장을 기각했으나, 경찰은 추가 수사를 마무리하고 최근 사건을 검찰에 넘겼다\"고 밝혔다. 이 사건은 당초 '대본에 따른 연출된 촬영'이었다는 주장이 제기되었으나, 수사 기관은 이를 받아들이지 않았다. 조 변호사는 \"애초에 합의된 수준을 벗어나는 과도한 물리력이 행사됐고, 피해자가 촬영을 주저하며 거부했음에도 촬영을 강요해 결과적으로 12주의 중상을 입혔다\"며 \"사고 후 합의가 이뤄졌더라도 그냥 넘길 수 없는 사안\"이라고 설명했다. 함께 송치된 공범의 경우, 상해 방조 및 공동강요 혐의가 적용됐다. 조 변호사는 \"공범 역시 대본대로 촬영하자며 주저하는 피해자를 강요한 혐의가 인정되어 송치됐다\"고 덧붙였다. 향후 예상되는 처벌 수위에 대해서는 엄중한 실형 가능성을 제기했다. 조 변호사는 공범에 대해 \"이 사건과 별개로 이미 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며 \"이번 사건의 유죄 판결이 더해질 경우 경합범 가중 등을 고려해 총 징역 1년 6개월 안팎의 실형이 선고될 것으로 보인다\"고 내다봤다. 주동자에 대해서는 \"피해자와 합의를 거쳤다는 점이 양형에 유리한 요소로 작용해 예상 형량이 다소 줄어들 수는 있다\"면서도 \"합의가 감형 요소로 크게 작용하더라도 전치 12주의 중상해를 입힌 만큼 징역 1년 이상의 실형 선고를 피하기 어려울 것\"이라고 분석했다. 마지막으로 조 변호사는 \"피해자와의 합의가 배상을 위해 양형에 일정 부분 반영되는 것은 불가피하지만, 이번 사건은 위력을 동원한 강요와 중상해가 발생한 만큼 향후 검찰 기소와 법원의 재판 과","category":"사회"},{"title":"아무 것도 먹지 않는 아이…5년 전 급식실에서는 무슨 일이","link":"https://n.news.naver.com/mnews/article/629/0000549639","naverLink":"https://n.news.naver.com/mnews/article/629/0000549639","pubDate":"2026-11-07T00:26:25.047944+09:00","author":"네이버뉴스","description":"동천학교 급식실 CCTV 설치 두고 학부모·학교 갈등 학운위 가결에도 학교 측 개인정보 침해 이유 반대 서울 노원구 특수학교인 동천학교에서 교내 CCTV 설치를 둘러싼 갈등이 이어지고 있다. 학부모들은 학생들이 스스로 피해 사실이나 사고 경위를 설명하기 어려운 만큼 급식실, 감각운동실 등 사고 위험이 있는 공간에 CCTV를 설치해야 한다고 요구한다. 사진은 동천학교 급식실. /독자 제공 [더팩트ㅣ김태연 기자] #지난 2021년 3월 중증 자폐를 가진 초등학교 3학년 전모 군은 갑자기 학교 급식실에 들어가기를 거부하기 시작했다. 전 군은 학교는 물론 집에서조차 음식을 입에 대려하지 않아 한 달만에 몸무게 10㎏이 줄었다. 그러나 이유를 알 길이 없었다. 전 군 어머니 이은선 씨는 \"학교 급식실에 폐쇄회로(CC)TV가 없는데, 당시 학교에 물어봐도 무슨 일이 있었는지 알려주지 않았다\"며 \"아이는 자폐가 있어 무슨 일이 있었는지 스스로 설명하기 어려워하는 상황\"이라고 울먹였다. 전 군은 이후 1년 가까이 급식실에 들어가지 못했다. 적응 훈련 끝에 현재는 급식실에 들어갈 수 있지만 5년이 지난 지금도 여전히 집 밖에서는 음식을 거의 먹지 못하는 등 섭식장애를 겪고 있다. 서울 노원구 특수학교인 동천학교에서 CCTV 설치를 둘러싼 갈등이 이어지고 있다. 학부모들은 스스로 피해 사실이나 사고 경위를 설명하기 어려운 장애 아이들 특성상 급식실 등에 CCTV를 설치해야 한다고 요구한다. 그러나 학교 측은 개인정보 보호와 교육활동 위축 등을 이유로 반대하고 있다. 7일 취재를 종합하면 동천학교 학부모들이 급식실 CCTV 설치를 요구한 건 지난 2023년 5월부터다. 전 군 사례처럼 사고가 나더라도 확인하기 어려운 상황을 막아야 한다는 취지였다. 학부모들은 교내 여러 공간에 CCTV 설치를 원했지만 학교 측 부담을 고려해 급식실부터 설치를 추진하기로 했다. 이후 3년이 지난 올해 7월3일 제181차 학교운영위원회에서 9명 중 6명의 찬성으로 '급식실 CCTV 설치 요청' 안건이 가결됐다. 그러나 학교는 지난 8월5일 CCTV 설치를 거부한다고 공지했다. 교직원 139명을 대상으로 설문조사를 진행한 결과 121명이 교육활동 및 개인정보 보호 등을 이유로 CCTV 설치에 반대했기 때문이다. 학교 측은 \"급식실은 단순한 식사 공간이 아니라 학생들을 대상으로 식사 예절과 자립 등을 교육하는 공간인 만큼 CCTV 설치가 교육활동과 사생활","category":"사회"},{"title":"이용철 법무장관 후보 “참여정부서 검찰개혁 수행…차질없이 완수”","link":"https://n.news.naver.com/mnews/article/056/0012288941","naverLink":"https://n.news.naver.com/mnews/article/056/0012288941","pubDate":"2026-11-07T00:25:29.654393+09:00","author":"네이버뉴스","description":"이용철 법무부 장관 후보자가 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계 안착에 힘쓰겠다고 밝혔습니다. 이 후보자는 오늘(6일) “공소청과 중수청(중대범죄수사청)이 새로 출범하고 형사사법체계가 크게 개편된 엄중한 시기에 법무행정을 책임지는 법무부 장관 후보자로 지명받아 막중한 책임감을 느낀다”고 법무장관 후보자로 지명된 소감을 전했습니다. 이어 “대통령께서 저를 법무부 장관 후보자로 지명하신 이유는 참여정부 청와대 법무비서관으로서 검경 수사권 조정 등 검찰개혁과 사법제도 개혁 업무를 수행했던 경험을 살려 검찰개혁을 완수하고, 큰 폭으로 개정된 형사사법체계의 안착에 역할을 해달라는 것이라고 생각한다”고 했습니다. 그러면서 “만약 장관으로 일할 수 있는 기회가 주어진다면 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계의 빠른 안착에 힘쓰는 한편 범죄 피해자를 비롯한 사회적 약자의 인권 보호를 위해 최선을 다하겠다”고 강조했습니다. 이 후보자는 또 “국민 여러분께 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다”고 덧붙였습니다. [사진 출처 : 연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"이원석 전 검찰총장 \"위헌·위법 특검 그만둬야\"‥현직 검사들도 반발","link":"https://n.news.naver.com/mnews/article/214/0001533901","naverLink":"https://n.news.naver.com/mnews/article/214/0001533901","pubDate":"2026-11-07T00:23:53.454619+09:00","author":"네이버뉴스","description":"이원석 전 검찰총장이 특별검사 수사의 적법성을 문제 삼으며 중단을 요구했다.\n현직 검사들 사이에서도 반발이 나왔다는 내용으로, 특검의 권한과 수사 절차를 둘러싼 논쟁이 이어지고 있다.\n관련 기관의 입장과 법적 판단이 향후 쟁점이 될 전망이다.","category":"사회"}],"생활":[{"title":"임신 중 출혈 30대 산모…구급차서 31주차 아기 출산, 생명 구했다","link":"https://n.news.naver.com/mnews/article/015/0005351317","naverLink":"https://n.news.naver.com/mnews/article/015/0005351317","pubDate":"2026-11-07T00:26:26.611986+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"생활"},{"title":"[날씨] 토요일, 겨울의 시작 알리는 ‘입동’…아침 최저기온 ‘영하권 뚝’","link":"https://n.news.naver.com/mnews/article/029/0003057584","naverLink":"https://n.news.naver.com/mnews/article/029/0003057584","pubDate":"2026-11-07T00:26:26.611972+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"[오늘의 날씨] 겨울의 문턱 '입동' 영하권…곳곳 한파특보","link":"https://n.news.naver.com/mnews/article/629/0000549638","naverLink":"https://n.news.naver.com/mnews/article/629/0000549638","pubDate":"2026-11-07T00:26:26.611929+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"전국 맑고 쌀쌀…찬바람에 기온 '뚝'[오늘 날씨]","link":"https://n.news.naver.com/mnews/article/008/0005437440","naverLink":"https://n.news.naver.com/mnews/article/008/0005437440","pubDate":"2026-11-07T00:26:26.611915+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"CJ올리브네트웍스 매출 증가 46% 책임진 '스마트스페이스 AX'","link":"https://n.news.naver.com/mnews/article/293/0000092861","naverLink":"https://n.news.naver.com/mnews/article/293/0000092861","pubDate":"2026-11-07T00:26:26.121619+09:00","author":"네이버뉴스","description":"CJ올리브네트웍스의 스마트스페이스 AX 사업 매출이 1년 전보다 두 배 이상 늘며 3분기 전체 매출 증가분의 46%를 차지했다. 공장·물류센터·데이터센터와 방송 시설에 AI 전환을 지원하는 사업으로, AI 인프라 구축 수요가 실적 성장으로 이어졌다.","category":"생활"},{"title":"'입동' 이름값에 전국 곳곳 한파주의보…서울 첫 영하권","link":"https://n.news.naver.com/mnews/article/660/0000120768","naverLink":"https://n.news.naver.com/mnews/article/660/0000120768","pubDate":"2026-11-07T00:25:30.946337+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:26:26.611969+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"세월호 '단원고 4.16 아카이브', 유네스코 아태 기록유산 됐다","link":"https://n.news.naver.com/mnews/article/079/0004207007","naverLink":"https://n.news.naver.com/mnews/article/079/0004207007","pubDate":"2026-11-07T00:26:26.611913+09:00","author":"네이버뉴스","description":"기록물 23만5220점…달력·수학여행 일정표 등 수운잡방·음식디미방도 등재…韓 기록유산 28건 국가유산청 제공 세월호 참사 유가족과 생존자, 시민들이 남긴 기록이 유네스코 아시아태평양 지역 기록유산이 됐다. 5일 국가유산청에 따르면 지난 3일부터 인도네시아 자카르타에서 진행된 제11차 유네스코 세계기록유산 아시아태평양 지역위원회(MOWCAP) 총회는 '단원고 4.16 아카이브'를 지역목록에 올리기로 결정했다. 함께 신청한 조선시대 조리서 '수운잡방과 음식디미방'도 등재됐다. 이 아카이브는 정부나 기업이 아닌 유가족과 시민의 시선으로 작성된 민간 기록이다. 희생 학생들의 생전 흔적부터 전국에서 이어진 추모, 유가족과 생존자의 회복 과정까지 기록물이 모두 23만 5220점에 이른다. 기록물에는 학생들의 달력과 수학여행 일정표 등이 포함됐다. 국가유산청은 \"기록 과정 자체가 재난의 고통과 상처를 치유하고 회복하는 과정을 담고 있다는 점에서 중요성을 인정받았다\"고 설명했다. 국가유산청 제공","category":"문화"},{"title":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막","link":"https://n.news.naver.com/mnews/article/079/0004207114","naverLink":"https://n.news.naver.com/mnews/article/079/0004207114","pubDate":"2026-11-07T00:26:26.611885+09:00","author":"네이버뉴스","description":"사유·공감·관계의 가치 조명…전국서 인문행사 풍성 문체부 제공 인공지능(AI) 시대에 인간 고유의 사유와 판단, 공감의 가치를 되짚는 '2026 인문문화축제'가 6일 서울에서 개막한다. 이세돌 전 프로바둑기사와 김겨울 작가, 심채경 천문학자 등 다양한 분야의 인사들이 시민들과 만나 인문의 가치를 이야기한다. 문화체육관광부는 한국문화예술교육진흥원과 함께 이날부터 8일까지 서울 마포구 레이어스튜디오11에서 '2026 인문문화축제'를 개최한다고 6일 밝혔다. 올해 축제의 주제는 '인문지능'이다. AI가 답을 제시하는 시대일수록 스스로 질문하고 판단하며 타인을 이해하는 능력이 중요하다는 취지다. '생각의 주도권', '경험의 고유성', '관계의 재발견'을 중심으로 대담과 공연, 전시, 체험 프로그램을 선보인다. 개막일인 6일에는 이세돌 전 프로바둑기사와 최성운 PD가 'AI가 둘 수 없는 한 수'를 주제로 인간의 판단과 선택에 관해 대담한다. 이어 '제3차 인문정신문화 기본계획' 수립을 위한 정책토론회가 열린다. 7일에는 김겨울 작가와 김초희 영화감독, 이충녕 콘텐츠 창작자가 '비교하지 않는 나만의 속도'를 주제로 이야기를 나눈다. 웹툰 '닥터 프로스트'의 이종범 작가와 심채경 천문학자, 박혜진 문학평론가는 '당신의 일에도 인문이 있나요'를 주제로 일과 삶의 의미를 짚는다. 8일에는 래퍼 넉살과 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 '설렘은 편집되지 않아요'를 주제로 일상의 경험과 관계, 기록의 의미를 이야기한다. 공연 프로그램인 '인문의 밤'도 마련된다. 6일에는 황인찬 시인과 가수 양희은이 시와 노래가 만나는 토크콘서트 '노래가 된 시'를 선보인다. 7일에는 가수 선우정아와 건축가 조병수가 참여하는 '사유의 시간'이 이어진다. 행사장에서는 '길 위의 인문학', '지혜학교' 등 주요 인문사업의 성과를 소개하는 전시와 시민 참여형 회고록 프로그램이 진행된다. 상수동 골목과 경의선 숲길, 홍대 일대를 걸으며 지역의 문화와 이야기를 살펴보는 인문탐방도 운영한다. 축제와 연계한 인문 프로그램은 전국으로 확대된다. 전국 10개 지역서점에서는 한유주 소설가, 정재승 뇌과학자, 황보름·정혜윤 작가 등이 참여하는 북토크가 열린다. 이와 함께 11월 한 달간 전국 193곳에서 다양한 인문문화 프로그램이 진행된다. 문체부 정향미 문화예술정책실장은 \"인공지능 시대에도 삶의 방향을 정하는 것은 결국 사람이며, 그 힘은 인문에서 나온","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:26:26.121640+09:00","author":"네이버뉴스","description":"20년 전 그래픽카드 개봉·PC 장착 체험 무료 게임 공개 AI 시대 연 '지포스 8800 GTX' 출시 20주년 기념 [이데일리 한광범 기자] 엔비디아(NVIDIA)가 최근 인공지능(AI) 산업의 토대가 된 그래픽카드 ‘지포스 8800 GTX’ 출시 20주년을 맞아 2006년 PC 게이밍 환경을 재현한 무료 체험 콘텐츠를 공개했다. 과거 그래픽카드를 직접 개봉하고 컴퓨터에 장착하는 경험을 최신 그래픽 기술로 되살린 것이 특징이다. 엔비디아는 6일 지포스 8800 GTX 출시 20주년을 기념하는 스팀(Steam) 데모 ‘지포스 8800 GTX - 전설의 20년’을 소개했다. 해당 콘텐츠는 지난 5일 스팀에 무료로 공개됐으며, 이용자가 직접 조작할 수 있는 반응형 기술 데모 형태로 제작됐다. 지포스 8800 GTX는 2006년 11월 8일 출시된 고성능 그래픽카드다. 당시 ‘컴퍼니 오브 히어로즈’, ‘바이오쇼크’, ‘크라이시스’ 등 고사양 PC 게임을 구동하는 대표적인 제품으로 주목받았다. 특히 2007년 출시된 크라이시스는 높은 그래픽 요구 사양으로 유명해지면서 PC 성능을 가늠하는 상징적인 게임으로 자리 잡았다. 이 제품의 역사적 의미는 게임 성능에만 있지 않다. 지포스 8800 GTX는 엔비디아가 개발한 병렬 컴퓨팅 플랫폼 쿠다(CUDA)를 지원한 최초의 그래픽카드다. 이전까지 주로 화면에 그래픽을 그리는 데 사용하던 GPU를 과학 계산과 시뮬레이션 등 다양한 연산 작업에 활용할 수 있는 기반을 마련했다. 당시 제품에는 G80 아키텍처를 기반으로 한 128개의 통합 스트림 프로세서가 탑재됐다. 그래픽 처리 과정에서 서로 다른 작업에 연산 자원을 유연하게 배분하는 구조로, 다이렉트X 10도 지원했다. 768MB GDDR3 메모리와 384비트 메모리 버스를 갖춘 것도 특징이었다. 쿠다를 통해 GPU의 병렬 연산 능력을 일반적인 컴퓨팅 작업에 활용할 수 있게 되면서 GPU의 쓰임새는 점차 확대됐다. 과학 연구와 영상 처리 등을 거쳐 오늘날 대규모 AI 모델을 학습하고 실행하는 가속 컴퓨팅으로 이어졌다. 엔비디아가 20년 전 그래픽카드를 기념하면서 게임뿐 아니라 쿠다의 역사를 강조하는 이유다. 이번 기념 데모는 언리얼 엔진 아티스트 딜런 브라운이 엔비디아의 지원을 받아 제작했다. 이용자는 2006년 분위기로 꾸며진 게임방에 들어가 지포스 8800 GTX의 포장을 뜯고 그래픽카드를 살펴본 뒤 당시 사양을 재현한 PC","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:26:25.553816+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"[단독] “츠키 굿즈 대금 ‘7억’ 미지급”… 내한 공연 공동 주최사 관계자들 피소","link":"https://n.news.naver.com/mnews/article/022/0004173154","naverLink":"https://n.news.naver.com/mnews/article/022/0004173154","pubDate":"2026-11-07T00:26:25.048003+09:00","author":"네이버뉴스","description":"日 데코레이션즈, 사기·업무상횡령 등 혐의 고소 주최 측 “판매 저조해 지급 지연… 추후 갚을 것” ‘만찬가’로 국내에서도 인기를 얻은 일본 싱어송라이터 츠키(tuki.)가 올해 내한했던 공연을 둘러싸고 대금 미지급 분쟁이 불거졌다. 공연 상품을 공급한 일본 업체가 물품 대금과 위탁판매 정산금을 받지 못했다며 국내 공동 주최사 관계자들을 고소했다. 주최 측은 판매 부진으로 지급이 늦어졌다며 다른 공연을 통해 수익을 마련해 갚겠다는 입장이다. 일본 도쿄 소재 굿즈 업체 데코레이션즈가 지난 8월 부산진경찰서에 제출한 고소장에 따르면 사측은 츠키 내한 공연 공동 주최사인 에스비 위너 엔터테인먼트(SB WINNER ENT) 관계자 A씨 등 3명을 사기 및 업무상횡령 혐의로 고소했다. 고소장에는 SB WINNER ENT의 계약 실무 담당자들이 피고소인으로 적시됐다. 츠키 홈페이지 메인 이미지. 츠키 홈페이지 캡처 츠키는 지난 4월11일과 12일 양일간 인천 인스파이어 아레나에서 내한 공연을 열었다. 공연이 아닌 굿즈 판매 대행에서 문제가 발생했다. 고소장에 따르면 양측은 지난 2월26일 총 5775만엔(한화 약 4억8000만원) 규모의 굿즈 공급계약을 체결했다. 대금의 절반은 3월31일까지, 나머지는 4월30일까지 지급하고 일본에서 한국으로 물품을 운송하는 비용과 관세는 SB WINNER ENT가 부담하기로 했다. 이와 별도로 ‘츠키×세인트 마이클’ 협업 티셔츠와 후드티의 위탁판매 약정도 맺었다. 상품 소유권은 데코레이션즈에 두고 SB WINNER ENT가 판매를 맡아 판매대금의 20%를 수수료로 받는 방식이다. 데코레이션즈는 이 약정에 따라 티셔츠 550장(742만5000엔 상당)과 후드티 210장(564만9000엔 상당)을 인도했다고 밝혔다. 데코레이션즈 측은 공연 전인 4월9일까지 물품을 한국에 인도했으며, 계약상 SB WINNER ENT가 부담해야 할 관세와 배송비 2482만945엔(한화 약 2억1400만원)도 대신 지급했다고 주장했다. 물품 공급대금과 대납 비용을 합친 금액은 8257만945엔(한화 약 7억1200만원)이다. 고소인 측은 이 금액을 물품 공급 거래와 관련한 사기 피해액으로 제시했다. 대금 지급을 둘러싼 갈등은 공연 전부터 이어졌다는 것이 고소인 측 설명이다. SB WINNER ENT가 온라인 판매 부진 등을 이유로 선금 지급일을 공연 이후인 4월17일로 미뤄달라고 요청했으나, 해당 날짜에도 지급","category":"문화"},{"title":"경주 축제장 구급차 미배치, 70대 여성 골든타임 놓쳐 식물인간","link":"https://n.news.naver.com/mnews/article/022/0004173159","naverLink":"https://n.news.naver.com/mnews/article/022/0004173159","pubDate":"2026-11-07T00:26:25.047959+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"문화"},{"title":"문체부·한국문화예술교육진흥원, '2026 인문문화축제' 개막","link":"https://n.news.naver.com/mnews/article/014/0005600649","naverLink":"https://n.news.naver.com/mnews/article/014/0005600649","pubDate":"2026-11-07T00:25:30.946345+09:00","author":"네이버뉴스","description":"문화체육관광부와 한국문화예술교육진흥원이 2026 인문문화축제를 시작했다.\n축제는 인문학을 일상과 연결하고 시민이 다양한 분야의 관점을 접하도록 기획됐다.\n기술 변화 속에서 인간과 사회의 가치를 생각하는 자리를 마련한다.","category":"문화"},{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:23:55.654948+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"},{"title":"AI 시대 인간다움 묻는다… 2026 인문문화축제 6일 개막","link":"https://n.news.naver.com/mnews/article/020/0003760673","naverLink":"https://n.news.naver.com/mnews/article/020/0003760673","pubDate":"2026-11-07T00:22:58.194682+09:00","author":"네이버뉴스","description":"‘2026 인문문화축제’ 참여형 전시 ‘인문상점’에서 관람객이 청년들의 질문을 고르고 있다. 한국문화예술교육진흥원 제공 문화체육관광부와 한국문화예술교육진흥원이 공동 주최하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해로 3회째인 해당 축제는 ‘인문지능’을 주제로 8일까지 사흘간 열린다. 주최 측은 ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 나를 돌아보고, 타인을 이해하며, 삶의 방향을 스스로 선택하는 힘을 뜻한다고 설명했다. 개막특별포럼에서는 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 대담했다. 이어 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발표하고, 성해영 서울대 종교학과 교수를 좌장으로 학계와 산업계 전문가들이 AI 시대 인문의 의미와 인문정책의 방향, 생활권 인문 확산 방안을 논의했다. 축제 기간에는 작가와 예술인, 콘텐츠 창작자가 참여하는 대담과 공연도 이어진다. 6일에는 황인찬 시인과 양희은 가수가 ‘노래가 된 시’를 주제로 토크콘서트를 연다. 7일에는 김겨울 작가와 김초희 영화감독 등이 ‘비교하지 않는 나만의 속도’를 주제로 이야기를 나눈다. 이종범 웹툰 작가와 심채경 천문학자 등은 일과 인문의 관계를 다룬다. 8일에는 넉살 가수 등이 참여하는 대담이 진행된다. 관람객이 직접 참여하는 전시도 마련됐다. 전국 인문 프로그램의 현장을 소개하는 ‘인문의 길’, 다른 사람의 회고록에 자신의 이야기를 이어 쓰는 ‘우리의 회고록’, 청년인문실험 100개 팀의 질문을 살펴보는 ‘인문상점’ 등이 운영된다. 안동 인문행복센터의 ‘인문행복트럭’과 마포·홍대 일대를 걷는 ‘인문탐방’도 진행된다. 축제와 연계한 전국 단위 인문 프로그램도 11월 한 달간 이어진다. 전국 10개 지역서점에서 북큐레이션과 북토크를 열고, ‘청년인문교실’과 ‘길 위의 인문학’, ‘지혜학교’, ‘모두의 인문학’ 등 프로그램을 전국 193곳에서 운영한다. 임진택 한국문화예술교육진흥원장은 “AI 시대에 인간다움을 지키는 힘은 인문적 사유에서 나온다”며 “인문적 소양을 갖춘 시민이 자신과 생활을 바꿔 가는 것이 이번 축제가 말하는 인문지능”이라고 말했다. 인문문화축제는 2024년 처음 시작됐다. 제1회 축제는 ‘시대가 묻고 인문이 답하다’를 주제로 국립중앙박","category":"문화"}],"세계":[{"title":"미 중간선거로 보는 기독교 정치…'마가' 균열 시작?","link":"https://n.news.naver.com/mnews/article/079/0004207420","naverLink":"https://n.news.naver.com/mnews/article/079/0004207420","pubDate":"2026-11-07T00:26:26.611946+09:00","author":"네이버뉴스","description":"미국 중간선거 결과를 계기로 기독교 보수 진영의 정치적 결속과 내부 균열을 분석한 기사다.\n선거 이후 종교계와 정치권의 관계, 당내 노선 경쟁이 주요 쟁점으로 다뤄진다.\n향후 미국 정치 지형에 미칠 영향이 주목된다.","category":"세계"},{"title":"일본 다카이치 '타이완 발언' 1년…중국 \"발언 시정해야\"","link":"https://n.news.naver.com/mnews/article/055/0001401267","naverLink":"https://n.news.naver.com/mnews/article/055/0001401267","pubDate":"2026-11-07T00:26:25.553843+09:00","author":"네이버뉴스","description":"▲ 다카이치 사나에 일본 총리 중일 관계 급랭을 불러온 다카이치 사나에 일본 총리의 '타이완 유사시 개입' 시사 발언이 7일로 만 1년을 맞는 상황에서 일본 정부가 '타이완이 중국 영토의 일부'라는 중국 입장을 존중한다고 6일 언급했습니다. 그러나 중국 정부는 중일 관계 악화의 책임이 일본에 있다며 다카이치 총리의 잘못된 발언을 조속히 바로잡으라고 촉구했습니다. 일본 정부 대변인인 기하라 미노루 관방장관은 정례 기자회견에서 해당 발언 1주년에 대한 평가와 향후 중일 관계 설정에 관해 묻는 말에 \"타이완에 관한 정부의 입장은 1972년 중일 공동성명에 명시된 바와 같다\"고 대답했습니다. 1972년 양국이 정식 외교관계를 맺을 당시 채택한 중일 공동성명에서 일본은 \"타이완이 중국 영토의 일부임을 강조한다\"는 중국의 입장을 \"완전히 이해하고 존중한다\"고 명시했습니다. 다카이치 총리는 이날 총리관저에서 기자들과 만나 \"중국은 중요한 이웃 국가이며 여러 과제가 존재함에도 불구하고 오랜 기간 쌓아온 관계가 있다\"고 말했습니다. 그는 이어 \"중국과 전략적 호혜 관계를 포괄적으로 추진하고 공통의 과제에 대해 소통하며 국익을 수호하기 위한 대화를 함으로써 건설적이고 안정적인 관계를 구축해 나갈 것\"이라며 그동안 국회 소신 표명 연설 등에서 했던 중국에 대한 발언을 되풀이했습니다. 이에 대해 궈자쿤 중국 외교부 대변인은 이날 정례브리핑에서 \"중일 관계가 심각한 어려움에 처한 책임은 전적으로 일본 측에 있다\"고 밝혔습니다. 이어 \"1년 전 일본 지도자가 타이완과 관련한 잘못된 발언으로 타이완 문제에 무력 개입하려는 신호를 공개적으로 보내 중국의 국가주권에 도전하고 중일 관계의 정치적 기초를 흔들었다\"고 비판했습니다. 궈 대변인은 특히 \"유감스럽게도 1년이 지났지만 일본 당국은 여전히 제자리걸음을 하면서 문제를 회피할 뿐 잘못을 반성하고 시정하려는 성의와 행동을 보여주지 않고 있다\"며 \"일본이 시급히 해야 할 일은 타이완 문제에 관한 잘못된 언행을 바로잡는 것이고, 중요한 것은 역사 문제에 올바른 태도를 취하는 것\"이라고 주장했습니다. 지난해 말부터 중일 관계가 꼬인 이후 양국의 정상·외교장관 등 고위급 공식 대화는 사실상 중단된 상태입니다. 다만 지난 9월 일본의 민간 중일 경제교류 기구 대표단을 이끌고 방중한 이와야 다케시 전 일본 외무상이 왕이 중국 외교부장을 만나 중일 공동성명을 양국 간 '우회적 화해'의 수단으로 삼을 것을","category":"세계"},{"title":"대승거둔 美 민주당, 이제 온건·진보 노선 투쟁? LA서 민주사회주의자 시장 당선[트럼프 2기]","link":"https://n.news.naver.com/mnews/article/002/0002464732","naverLink":"https://n.news.naver.com/mnews/article/002/0002464732","pubDate":"2026-11-07T00:26:25.553826+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 큰 성과를 거둔 뒤 당내 노선 경쟁이 주목받고 있다.\n온건파와 진보파가 향후 정책 방향과 주도권을 두고 경쟁할 가능성이 제기된다.\n이번 선거 결과가 다음 대선 구도에 미칠 영향도 관심사다.","category":"세계"},{"title":"탄핵 위기 헤그세스 “버티고 싸운다”…민주당에 정면 도발","link":"https://n.news.naver.com/mnews/article/028/0002831117","naverLink":"https://n.news.naver.com/mnews/article/028/0002831117","pubDate":"2026-11-07T00:26:25.553824+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"},{"title":"최악 산불이 불붙인 반정부 시위… 거리로 나선 인니 Z세대","link":"https://n.news.naver.com/mnews/article/005/0001883556","naverLink":"https://n.news.naver.com/mnews/article/005/0001883556","pubDate":"2026-11-07T00:26:25.553815+09:00","author":"네이버뉴스","description":"대형 산불 이후 인도네시아에서 정부의 재난 대응과 환경 관리에 항의하는 시위가 확산했다.\n청년층이 거리 집회에 나서며 산불 피해와 정책 책임을 묻고 있다는 내용이다.\n재난 예방과 피해 복구, 정부의 설명 책임이 주요 쟁점으로 떠올랐다.","category":"세계"},{"title":"\"이란, 카타르 핵 협상안 검토 중\"…美와 종전 협상 돌파구 기대","link":"https://n.news.naver.com/mnews/article/421/0009275501","naverLink":"https://n.news.naver.com/mnews/article/421/0009275501","pubDate":"2026-11-07T00:26:25.553806+09:00","author":"네이버뉴스","description":"이란이 카타르가 전달한 핵 협상 관련 제안을 검토 중이라는 보도다.\n중재안을 계기로 미국과의 협상 재개 가능성이 거론되며 외교적 돌파구에 대한 기대가 나온다.\n실제 협상 진전 여부는 당사국의 공식 입장과 후속 논의에 달려 있다.","category":"세계"},{"title":"‘중간선거 완패’ 트럼프 “미국에 공장 안 지으면 관세 최고 300%”","link":"https://n.news.naver.com/mnews/article/009/0005759855","naverLink":"https://n.news.naver.com/mnews/article/009/0005759855","pubDate":"2026-11-07T00:26:25.553761+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령. [EPA연합뉴스] 도널드 트럼프 미국 대통령이 5일(현지시간) 미국에 공장을 짓지 않는 외국 기업에 최고 300%의 관세를 부과할 수 있다고 밝혔다. 공화당의 중간선거 참패 이후에도 관세정책을 유지하겠다는 뜻으로 풀이된다. 트럼프 대통령은 이날 백악관에서 향후 2년간 행정명령 활용 계획을 묻는 취재진에게 “우리는 많은 일을 할 것”이라며 “1주일간, 2주일간 많은 것을 보게 될 것이다. 준비하는 것이 많다”고 말했다. 이어 외국 기업들이 미국에 3000여개의 공장과 생산시설을 짓고 있다며 “내가 지금 관세를 없앤다면 이 공장들은 전부 건설이 중단될 것”이라고 전했다. 그는 기업들이 미국에 공장을 건설하는 이유에 대해 “99%는 그러지 않으면 50%, 100%, 150%, 250%의 관세를 내야 하기 때문”이라며 공장을 짓고 가동하면 관세를 내지 않아도 된다고 강조했다. 관세를 철회하면 미국 곳곳에 짓다 만 공장이 남고 중국과 일본, 한국, 필리핀에서 제품을 수입하게 될 것이라는 주장도 폈다. 미국 내 생산이 시작되면 물가가 크게 내려갈 것이라며 관세 폐지를 요구하는 이들을 “어리석은 사람들”이라고 비판했다. 이날 발언은 공화당이 중간선거에서 참패한 지 이틀 만에 나왔다. 선거 패배 이후 정책 변화 가능성이 거론됐지만, 관세를 통한 미국 내 투자 유도 기조를 재확인한 셈이다. 다만 최고 300% 관세의 구체적인 적용 대상이나 시행 시점은 제시하지 않았다. 그는 이란에 대해서도 군사적 압박을 이어갔다. 트럼프 대통령은 합의와 공격 사이에서 결정해야 한다며 “가능하면 (이란의) 나머지를 파괴하고 싶지 않지만 아마 해야 할 수도 있다”고 말했다. 이란이 미국의 승인 없이 핵프로그램과 관련한 행동에 나서지 않을 것이라고도 주장했다.","category":"세계"},{"title":"\"공화당 중간선거 대패 여파\"…루비오 미 국무장관, 사임 저울질","link":"https://n.news.naver.com/mnews/article/008/0005437446","naverLink":"https://n.news.naver.com/mnews/article/008/0005437446","pubDate":"2026-11-07T00:25:30.007084+09:00","author":"네이버뉴스","description":"[美 중간선거] 블룸버그 \"사임 포함 향후 행보 검토중\"… 백악관·국무부 '가짜뉴스' 일축 [코퍼스크리스티=AP/뉴시스]11월 3일 미국 중간선거를 앞두고 마코 루비오 국무장관이 유세에 등장하면서 관심이 쏠리고 있다. 사진은 27일(현지 시간) 미국 텍사스주 코퍼스크리스티항에서 열린 중간선거 지원 유세에서 도널드 트럼프 대통령이 지켜보는 가운데 루비오 장관이 발언하는 모습. 2026.10.28. /사진=권성근 마코 루비오 미 국무장관이 공화당의 중간선거 패배 이후 트럼프 행정부를 떠날지 여부를 저울질하고 있다고 5일(현지시간) 블룸버그통신이 보도했다. 이날 블룸버그는 내부 사정에 정통한 관계자의 말을 인용, 루비오 장관과 그의 보좌관들 사임을 포함한 여러 선택지를 검토하고 있다고 밝혔다. 루비오 장관은 행정 관료들에게 사임에 관해 이야기했으나 떠나지 말아 달라는 요청을 받은 것으로 전해진다. 다만 딜런 존슨 미 국무부 대외협력 차관보는 \"이것은 찌라시에나 어울리는 익명의 출처에 기반한 완벽하고 완전한 가짜 뉴스\"라고 일축했다. 베니 래 하모니 백악관 대변인 역시 \"이 가짜 뉴스는 사실 정보가 없는 익명의 출처들이 퍼뜨리는 조작된 장난질에 불과하다\"고 말했다. 행정부가 임기 말 레임덕 단계에 접어들 때 내각 구성원과 고위 참모들이 사임하는 것은 이례적인 일은 아니다. 더군다나 그가 내년 1월 이전에 사임하면 트럼프 대통령은 민주당이 의회 통제권을 갖기 전에 후임자를 지명할 수 있다. 민주당은 카리브해 내 마약 밀매 의심 선박 타격 등 루비오 장관이 관여했던 트럼프 행정부의 여러 주요 정책들을 조사할 계획이었다. 플로리다주 상원의원 출신인 루비오 장관은 2016년 공화당 대통령 경선에서 트럼프 대통령과 맞붙었으나 근래에는 대통령의 가장 신뢰받는 측근 중 한 명으로 변모했다. 루비오 장관과 JD 밴스 부통령은 당의 리더십을 승계하고 2028년 공화당 대선 후보에 도전할 잠재적 후보로 거론돼 왔다. 일부 관계자들에 따르면 루비오 장관이 직을 내려놓고 대선 출마를 준비할 가능성도 거론된다. 다만 루비오 장관 측근들은 밴스 부통령이 대선에 출마할 경우 그가 당내 싸움을 포기할 수도 있을 것으로 관측한다. 루비오 장관은 밴스 부통령이 \"최고의 후보가 될 것\"이라고 반복해서 시사해왔으며 향후 대선 출마에 대해선 대답을 회피해왔다.","category":"세계"},{"title":"트럼프 \"증시 폭락, 멍청한 민주당 승리 때문…여러분 스스로 탓해야\"","link":"https://n.news.naver.com/mnews/article/003/0014305414","naverLink":"https://n.news.naver.com/mnews/article/003/0014305414","pubDate":"2026-11-07T00:23:54.770379+09:00","author":"네이버뉴스","description":"[워싱턴=AP/뉴시스]미국 중간선거 직후인 5일(현지 시간) 뉴욕증시 3대 지수가 일제히 폭락한 가운데, 도널드 트럼프 대통령이 민주당을 지지한 유권자들에게 책임을 돌렸다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에 \"주식 시장이 이번 선거 결과 때문에 역사상 최악의 하루를 보냈다\"며 \"기억하라. 공화당이 아닌 '멍청한 민주당(Dumocrats)' 떄문\"이라고 적었다. 사진은 5일 백악관 집무실에서 취재진 질문에 답하는 트럼프 대통령. 2026.11.06. [서울=뉴시스] 김승민 기자 = 미국 중간선거 직후인 5일(현지 시간) 뉴욕증시 3대 지수가 일제히 폭락한 가운데, 도널드 트럼프 대통령이 민주당을 지지한 유권자들에게 책임을 돌렸다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에 \"주식 시장이 이번 선거 결과 때문에 역사상 최악의 하루를 보냈다\"며 \"기억하라. 공화당이 아닌 '멍청한 민주당(Dumocrats)' 때문\"이라고 적었다. 그는 \"우리가 (증시를) 누구도 경험하지 못했던 수준까지 끌어올리기 위해 얼마나 많은 노력을 기울였는데, 결국 이런 일이 벌어졌다. 그 결과 여러분의 퇴직연금 계좌도 손실을 입었다\"고 강조했다. 트럼프 대통령은 뒤이어 올린 추가 게시물을 통해서도 \"멍청한 민주당의 '화요일 대박(big Tuesday)'으로 오늘 증시가 폭락했다\"며 \"정말 안타까운 일이나, 여러분은 스스로를 탓할 수밖에 없다\"고 했다. 그는 그러면서 \"두려워하지 말라. 우리는 어떻게든 머지않아 그 어느 때보다 크고 강해질 것\"이라며 \"미국을 다시 위대하게(MAKE AMERICA GREAT AGAIN)\"라고 덧붙였다. 뉴욕증권거래소(NYSE)에 따르면 이날 다우존스30산업평균지수는 전장 대비 1833.54포인트(3.44%) 하락한 5만1522.58에 마감했다. 스탠더드앤드푸어스(S&P)500지수는 전장보다 334.82포인트(4.35%) 내린 7353.80에 거래를 마쳤다. 기술주 중심의 나스닥종합지수는 1421.516포인트(5.52%) 떨어진 2만4314.997에 장을 닫았다. CNBC는 민주당의 중간선거 승리로 데이터센터 건설이 둔화될 수 있다는 우려가 제기되면서 기술주 투매가 나타나 증시가 급락했다고 분석했다．","category":"세계"},{"title":"루비오 사임설, 헤그세스 탄핵론... 흔들리는 '트럼프호'","link":"https://n.news.naver.com/mnews/article/469/0000964045","naverLink":"https://n.news.naver.com/mnews/article/469/0000964045","pubDate":"2026-11-07T00:22:57.012503+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"}],"IT 과학":[{"title":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고","link":"https://n.news.naver.com/mnews/article/092/0002444296","naverLink":"https://n.news.naver.com/mnews/article/092/0002444296","pubDate":"2026-11-07T00:26:26.611988+09:00","author":"네이버뉴스","description":"AI 데이터센터 수요가 반도체 공급을 빠르게 흡수하면서 자동차 업계의 부품 수급 부담이 커질 수 있다는 전망이다.\n반도체 확보 경쟁이 이어질 경우 차량 생산비와 소비자 가격에도 영향을 줄 수 있다.\n내년 공급 상황과 가격 변동이 업계의 주요 변수로 꼽힌다.","category":"IT 과학"},{"title":"앤트로픽 IPO 미뤄지나…\"美 기술주 급락 여파\"","link":"https://n.news.naver.com/mnews/article/092/0002444279","naverLink":"https://n.news.naver.com/mnews/article/092/0002444279","pubDate":"2026-11-07T00:26:26.121658+09:00","author":"네이버뉴스","description":"미국 기술주 급락으로 투자심리가 얼어붙으면서 앤트로픽의 기업공개 추진 일정에도 차질이 생길 수 있다는 우려가 제기됐다. AI 관련주 전반의 변동성이 커진 가운데 시장의 관심은 상장 계획과 투자자 수요에 쏠리고 있다.","category":"IT 과학"},{"title":"AMD 마침내 인텔 넘어서나? 데이터센터 실적이 예고한 판도 변화 [고든 정의 TECH+]","link":"https://n.news.naver.com/mnews/article/081/0003696682","naverLink":"https://n.news.naver.com/mnews/article/081/0003696682","pubDate":"2026-11-07T00:26:26.121654+09:00","author":"네이버뉴스","description":"AMD와 인텔 모두 AI 데이터센터 수요에 힘입어 3분기 실적이 성장했지만, 데이터센터 사업의 성장률과 향후 전망에서는 차이가 나타났다. AMD는 AI GPU를 포함한 헬리오스 랙 시스템의 초기 매출을 반영했고, 이런 흐름이 이어지면 인텔과의 매출 격차가 좁혀지거나 역전될 가능성이 제기된다.","category":"IT 과학"},{"title":"\"미국 주춤해도 한국은 멈추면 안 돼\"…정부, AI 투자 지속 강조","link":"https://n.news.naver.com/mnews/article/015/0005351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:26:26.121647+09:00","author":"네이버뉴스","description":"배경훈 부총리, AI 데이터센터 투자 지속 강조 美 중간선거 후 AI 관련주 급락·투자 위축 우려 사이버 보안 차르 논의…초거대 AI 개발 검토 사진=연합뉴스 미국 중간선거 이후 인공지능(AI) 데이터센터 투자 위축 우려가 커지자 배경훈 부총리 겸 과학기술정보통신부 장관이 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 열기가 식더라도 다른 국가들이 이를 기회로 삼을 수 있다는 판단에서다. 배 부총리는 6일 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의를 마친 뒤 기자들과 만나 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦춰선 안 된다\"고 말했다. 최근 미국에서는 중간 function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="문화"&&/전시|공연|콘서트|영화|드라마|배우|가수|앨범|음악|미술|박물관|미술관|축제|출판|책|작가|문학|문화재|유네스코|한지|공예|연극|뮤지컬|예술|문화/.test(t)) score+=5;
  if(category==="생활"&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);\n  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
