window.NEWS_DATA = {"date":"2026-11-13","generatedAt":"2026-11-13T10:58:06.519794+09:00","total":150,"days":{"today":{"date":"2026-11-13","weekday":"금요일","label":"오늘 · 11월 13일 금요일","total":50,"categories":{"사건 사고":[{"title":"1%p씩, 빠르게 낮춰야… 혈당 ‘초기 관리’로 사망 위험 낮춘다","link":"https://n.news.naver.com/mnews/article/346/0000118834","naverLink":"https://n.news.naver.com/mnews/article/346/0000118834","pubDate":"2026-11-13T10:56:13.303988+09:00","author":"네이버뉴스","description":"[밀당365] 당뇨병 초기 ‘당화혈색소 6.5%’ 미만 달성 노력을 나이·동반질환·저혈당 등 고려해 의료진과 구체적 계획 세워야 당뇨병 환자는 진단 초기부터 적극적인 혈당 관리를 하면 추후 합병증 위험을 낮추는 등 예후 개선에 효과적이다. 다만, 혈당 조절 목표는 나이, 생활습관, 현재 건강상태 등에 따라 주치의와 조정이 필요하다./그래픽=최우연 매년 11월 14일은 세계보건기구(WHO)·세계당뇨병연맹(IDF)이 지정한 ‘세계 당뇨병의 날’이다. 국내 당뇨병 인구가 600만 명을 넘어선 가운데 예방·관리의 필요성이 다시금 강조될 필요가 있다. 첫걸음을 어떻게 내디뎌야 할까. 초기부터 확실하게 관리해야 ‘당화혈색소 6.5%’는 일반적인 당뇨병 환자의 혈당 조절 목표다. 초기부터 혈당을 관리해 당화혈색소를 이 진단 기준 미만으로 낮추는 것이 예후 개선에 도움이 된다. 이를 뒷받침하는 핵심 근거는 ‘UKPDS’다. 영국 옥스퍼드대 루리 홀만 교수 연구팀이 진행한 대규모 연구로, 당뇨병 진단 초기부터 혈당을 적극 조절하면 최대 44년 뒤에도 합병증·사망 위험이 낮다는 ‘유산(遺産) 효과’를 처음으로 입증했다. 대한당뇨병학회 국제학술대회(ICDM 2026)에서 만난 홀만 교수는 “당뇨병 진단 직후 가능한 한 이른 시점부터 혈당을 적극적으로 관리하라”며 “이미 시기를 놓쳤더라도 당화혈색소를 6.5% 이하로 낮추면 조기 관리로 얻을 수 있는 이점의 약 3분의 1은 여전히 기대할 수 있다”고 말했다. 당뇨병 전 단계(당화혈색소 5.7~6.4%)인 사람은 정상범위인 5.7% 미만으로 회복하기 위한 노력을 해야 한다. 생활습관 관리를 일찍 시작하면 추후 당뇨병으로 이어질 위험을 낮출 수 있다. 미국당뇨병학회(ADA) 진료지침에서는 당뇨병 전 단계 중에서도 당화혈색소가 6.0% 이상인 고위험군에서 더 적극적인 관리가 필요하다고 본다. 당화혈색소 1%p가 만드는 차이 다만, 처음부터 목표치에 도달해야 한다는 부담은 관리르 포기하게 만들 수 있다. 당화혈색소를 1%p씩 점진적으로 낮춰보자. UKPDS 결과에서 장기간 평균 당화혈색소가 1%p 낮을수록 미세혈관 합병증 위험은 37%, 당뇨병 관련 사망 위험은 21%, 심근경색 위험은 14% 낮았다. 당뇨병을 새로 진단받은 환자들 중 초기 집중 혈당 치료군(당화혈색소 7.0%)이 일반 치료군(당화혈색소 7.9%)보다 미세혈관 합병증 위험이 25% 낮았다. 나이, 동반질환, 상태 등에 따라","category":"사건 사고"},{"title":"\"젠슨 황 후임 CEO 1순위는 '쿠다' 개발자\"…예측시장서 '이안 벅' 급부상","link":"https://n.news.naver.com/mnews/article/003/0014319951","naverLink":"https://n.news.naver.com/mnews/article/003/0014319951","pubDate":"2026-11-13T10:56:12.312812+09:00","author":"네이버뉴스","description":"예측시장서 이안 벅 40%로 선두…차기 CEO 유력 후보 부상 쿠다 개발한 22년 엔비디아맨…'기술 전문성' 강점으로 꼽혀 [서울=뉴시스] 이안 벅 엔비디아 부사장. (사진=엔비디아 블로그 캡처) *재판매 및 DB 금지 [서울=뉴시스]이지영 기자 = 젠슨 황 엔비디아 최고경영자(CEO)가 잇단 스캔들에 휩싸이며 12일(현지시간) 전격 퇴진한 가운데 이안 벅 부사장이 유력 후보로 급부상했다. 엔비디아의 핵심 기술인 쿠다(CUDA)를 개발한 데다 22년간 회사에서 근무하며 주요 사업을 이끌어온 내부 인사라는 점이 강점으로 꼽힌다. 이날 야후파이낸스에 따르면 예측시장 칼시와 폴리마켓은 벅 부사장이 엔비디아의 차기 CEO직에 오를 가능성을 각각 약 40%로 보고 있다. 황 CEO가 사임한 현재 엔비디아 임시 CEO는 콜레트 크레스 최고재무책임자(CFO)가 맡았다. 시장과 엔비디아 고객사 등은 이사회가 최종으로 선임할 차기 CEO에 주목하고 있다. 후보는 회사 안팎에 여러 명이 거론되고 있지만 예측시장에서는 벅 부사장이 가장 앞섰다. 벅 부사장은 엔비디아에서 22년간 근무했다. 시스템 엔지니어로 입사한 뒤 현재는 하이퍼스케일·고성능컴퓨팅(HPC) 사업을 총괄하고 있다. 특히 엔비디아를 현재의 AI 반도체 강자로 만든 핵심 기술인 쿠다를 개발한 인물이다. 쿠다는 엔비디아 그래픽처리장치(GPU)를 그래픽 작업뿐 아니라 범용 연산에도 활용할 수 있도록 만든 소프트웨어 플랫폼이다. 이후 AI 모델 학습과 고성능 연산에 GPU가 폭넓게 쓰이면서 엔비디아의 경쟁력을 떠받치는 핵심 기술로 자리 잡았다. 벅 부사장은 스탠퍼드대에서 컴퓨터공학 박사 학위를 받는 등 기술 전문성도 갖추고 있다. 이에 따라 황 CEO 이후 엔비디아의 기술 전략을 이어갈 수 있는 내부 인사로 평가받는다. 다만 황 CEO가 남긴 빈자리를 그대로 채우기는 쉽지 않을 것이라는 우려도 나온다. 황 CEO는 기술 전문성뿐 아니라 강한 대외 인지도를 활용해 투자자와 고객을 끌어왔다. 대형 행사에서 기술을 직접 설명하는 기조연설로 수천명의 청중을 모으는 등 엔비디아의 얼굴 역할까지 맡았다. 차기 CEO가 기술력과 경영 능력은 물론 황 CEO가 맡았던 대외 역할까지 모두 이어갈 수 있을지는 불확실하다는 지적이다. 당분간 회사를 이끌 크레스 임시 CEO에 대해 월가에서는 긍정적 평가가 나왔다. 존 빈 키뱅크캐피털마켓츠 애널리스트는 \"크레스가 2013년부터 CFO로 근무하며","category":"사건 사고"},{"title":"“비만약 오젬픽 맞고 실명 됐어요” 첫 피해 구제 신청[아하대만]","link":"https://n.news.naver.com/mnews/article/021/0002832561","naverLink":"https://n.news.naver.com/mnews/article/021/0002832561","pubDate":"2026-11-13T10:56:12.312745+09:00","author":"네이버뉴스","description":"대만 남성, 정부 부처에 피해 구제 신청 6개월이 지나도 시력 회복되지 않아 ‘눈의 뇌졸중’ NAION 진단 주사제를 배에 놓고 있는 모습. 게티이미지뱅크 대만에서 비만치료제 오젬픽을 투여한 뒤 실명했다며 의약품 부작용 피해 구제를 신청한 사례가 처음 접수됐다. GLP-1 계열 비만치료제 사용이 확대되는 가운데 약물과 시력 손상 사이의 연관성에 관심이 쏠리고 있다. 12일 대만 연합보와 중국시보 등에 따르면 대만 위생복리부 식품약물관리서(TFDA)는 오젬픽 사용 후 시력 이상이 발생했다는 피해 구제 신청이 처음 접수됐다고 전날 밝혔다. 신청자는 50대 남성으로, 지난해 11월 만성폐쇄성폐질환(COPD)과 호흡 곤란 증상으로 타이베이시립연합병원을 찾았다. 당시 그의 체질량지수(BMI)는 32로 비만에 해당했다. 쑤이펑 타이베이시립연합병원 흉부내과 의사에 따르면 이 남성은 오젬픽을 4개월간 투여해 체중을 10㎏ 줄였으며, 그동안 특별한 부작용은 나타나지 않았다. 그러나 올해 2월 27일 아침 잠에서 깬 뒤 갑자기 오른쪽 눈앞이 온통 검게 보였고, 왼쪽 눈의 시력도 0.1까지 떨어져 응급실을 찾았다. 검사 결과 남성은 비동맥성 전방 허혈성 시신경병증(NAION) 진단을 받았다. 이후 6개월이 지나도록 시력이 회복되지 않자 오젬픽 투여에 따른 부작용일 가능성을 의심해 식약서에 신고했다고 쑤 의사는 전했다. NAION은 흔히 ‘눈의 뇌졸중’으로 불리는 질환이다. 녹내장 다음으로 많은 시신경 실명 원인으로 꼽히며, 시신경에 혈액 공급이 원활하게 이뤄지지 않아 시신경이 손상되는 질환이다. 영구적인 실명으로 이어질 수도 있다. 대만 식약서는 약물피해구제기금회가 해당 사례를 접수했으며, 지난 4월 말 정식 안건으로 등록했다고 밝혔다. 다만 약물 처방 목적과 투여량 조정 등에 대한 추가 설명을 해당 병원에 요청한 상태로, 아직 최종 심의 결과는 나오지 않았다. 이에 따라 오젬픽과 시력 손상 사이의 인과관계가 확인된 것은 아니다. 식약서에 따르면 지난 5일 기준 GLP-1 계열 약물과 관련한 의심 이상 반응 신고는 모두 314건이다. 이 가운데 12건은 안과 관련 부작용이며, 실명 피해를 주장한 이번 사례는 현재 구제 절차가 진행 중이다. GLP-1 계열 약물은 당초 제2형 당뇨병 치료제로 개발됐지만 최근에는 비만 치료와 체중 감량 목적으로도 널리 사용되고 있다. 대표적인 약물로는 세마글루타이드 성분의 오젬픽·위고비와 티르제파타이","category":"사건 사고"},{"title":"'10대 살해 50대 남성' 구속심사 불출석…참석 거부","link":"https://n.news.naver.com/mnews/article/001/0016440139","naverLink":"https://n.news.naver.com/mnews/article/001/0016440139","pubDate":"2026-11-13T10:56:11.743745+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[속보]“아내가 죽이려고 해서 내가 아내를 죽였다\" 경찰에 직접 신고한 80대 체포","link":"https://n.news.naver.com/mnews/article/087/0001230688","naverLink":"https://n.news.naver.com/mnews/article/087/0001230688","pubDate":"2026-11-13T10:56:11.743740+09:00","author":"네이버뉴스","description":"◇경찰 출동. 사진=연합뉴스 13일 서울의 한 주택에서 70대 아내를 살해한 후 직접 신고한 80대 남성이 경찰에 붙잡혔다. 서울 양천경찰서는 살인 혐의로 80대 남성 A씨를 현행범으로 체포해 조사 중이라고 밝혔다. 경찰에 따르면 A씨는 이날 오전 2시께 서울 양천구 신월동 주택에서 아내인 70대 여성을 살해한 혐의를 받는다. A씨는 범행 후 경찰에 직접 전화해 “아내가 나를 죽이려고 해서 내가 아내를 죽였다. 내가 범인이다”라고 신고한 것으로 전해졌다. 신고를 받고 출동한 경찰은 오전 2시 20분께 현장에서 A씨를 현행범으로 체포했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사하고 있으며, 수사 결과를 토대로 구속영장을 신청할 방침이다.","category":"사건 사고"},{"title":"[속보] ‘성북구 10대 여성살해’ 50대 남성, 구속영장 심사 출석 포기","link":"https://n.news.naver.com/mnews/article/028/0002832050","naverLink":"https://n.news.naver.com/mnews/article/028/0002832050","pubDate":"2026-11-13T10:56:11.743735+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[단독] 선관위 특검, 이틀째 중앙선관위 압수수색…'보안점수 허위작성' 수사","link":"https://n.news.naver.com/mnews/article/448/0000650798","naverLink":"https://n.news.naver.com/mnews/article/448/0000650798","pubDate":"2026-11-13T10:56:11.743727+09:00","author":"네이버뉴스","description":"/TV조선 방송화면 캡처 선거관리위원회 특별검사팀이 중앙선관위의 보안실태 점검 결과 허위작성 의혹과 관련해 이틀째 강제수사를 이어간다. 13일 TV조선 취재를 종합하면 특검팀은 전날에 이어 이날도 경기 과천 중앙선관위를 상대로 압수수색을 진행할 예정이다. 특검은 중앙선관위가 2022년 자체 보안실태 점수를 100점으로 제출했지만, 이후 국가정보원 문제 제기로 같은 기준으로 재평가한 결과 실제 점수가 30점대에 그친 정황 등을 들여다보고 있다. 앞서 특검은 전날 오전 9시 10분부터 중앙선관위 서버와 정보보안 관련 부서, 보안 관리 용역업체 2곳을 압수수색했다. 특검은 확보한 자료를 토대로 보안점검 결과가 실제와 다르게 작성된 경위와 관련자들의 관여 여부를 확인할 방침이다.","category":"사건 사고"},{"title":"운동하다 갑자기 쓰러진 40대…시민·소방 심폐소생술이 살렸다","link":"https://n.news.naver.com/mnews/article/421/0009287421","naverLink":"https://n.news.naver.com/mnews/article/421/0009287421","pubDate":"2026-11-13T10:56:11.743725+09:00","author":"네이버뉴스","description":"용인 운동시설서 갑자기 쓰러져…병원 이송 중 의식 회복 징후 김경덕 소방장(왼쪽부터),윤성준 소방위,이민우 소방사,김하원 소방교,김기현 소방위,정우빈 소방사. (용인서부소방서 제공. 재판매 및 DB 금지) 2026.11.13/뉴스1 (용인=뉴스1) 김기현 기자 = 운동 중 갑자기 쓰러져 심정지 상태에 빠진 40대 남성이 시민들의 신속한 초기 대응과 소방관들의 전문적인 응급처치로 목숨을 구했다. 13일 경기 용인서부소방서에 따르면 지난달 19일 용인시 한 운동시설에서 운동을 하던 40대 남성 A 씨가 갑자기 의식을 잃고 쓰러졌다. 그를 목격한 시민들은 즉시 119에 신고하고 구급대가 도착할 때까지 심폐소생술(CPR)을 시행하며 초기 대응에 나섰다. 가장 먼저 먼저 현장에 도착한 구갈119안전센터 펌뷸런스대원들도 곧바로 응급처치에 합류했다. 윤성준·김기현 소방위, 김하원 소방교, 이민우 소방사는 자동심장충격기(AED)를 적용하고 가슴 압박을 이어갔다. 뒤이어 도착한 구급대원인 김경덕 소방장과 정우빈 소방사는 기계식 가슴압박 장치인 루카스를 활용해 CPR 및 제세동을 실시했다. 덕분에 A 씨는 자발순환회복(ROSC·Return of spontaneous circulation) 상태에 접어들었다. ROSC는 CPR을 받은 심정지 환자 심장이 다시 뛰면서 혈액이 도는 경우를 의미한다. A 씨는 병원으로 이송되는 과정에서도 음성 자극에 반응하는 등 의식을 되찾는 모습을 보였으며, 현재 병원에서 치료를 이어가고 있다. 오은석 용인서부소방서장은 \"이번 사례는 시민들의 신속한 초기 대응과 소방대원들의 전문적인 응급처치가 함께 이뤄진 결과\"라며 \"심정지 환자는 초기 대응이 무엇보다 중요한 만큼 평소 심폐소생술과 자동심장충격기 사용법을 숙지하고, 위급상황이 발생하면 신속하게 119에 신고한 뒤 응급처치에 적극적으로 동참해 주시길 바란다\"고 말했다.","category":"사건 사고"},{"title":"이태원참사 특조위 조사 결과, 그 신뢰의 조건","link":"https://n.news.naver.com/mnews/article/047/0002535701","naverLink":"https://n.news.naver.com/mnews/article/047/0002535701","pubDate":"2026-11-13T10:56:11.743711+09:00","author":"네이버뉴스","description":"조사 과정의 투명성과 피해자의 알 권리를 위해선 ▲ 이태원참사 특별조사위원회 중간보고회 10.29 이태원참사 특별조사위원회 중간보고회가 지난 10월 27일 오전 서울 중구 한국프레스센터 기자회견장에서 열렸다. 한 위원이 손을 모은 채 보고를 듣고 있다. ⓒ 이정민 10·29 이태원참사 진상규명과 재발방지를 위한 특별조사위원회(아래 특조위)의 활동기한이 내년 9월까지로 한 해 늘어났다. 조사를 시작한 지 1년 5개월이 다 되어 가고, 남은 시간은 열 달 남짓이다. 그 끝에는 참사의 진상과 재발방지 대책을 담은 종합보고서가 놓일 것이다. 이쯤에서 물어야 할 것이 있다. 그 보고서가 발표되었을 때 우리 사회는 무엇을 근거로 그 조사 결과를 신뢰하게 되는가. 영국 법원은 100여 년 전 한 판결에서 '정의는 실현되어야 할 뿐 아니라, 실현되는 것이 분명히 보여야 한다'고 했다. 결론이 옳은 것 못지 않게, 그 결론에 이르는 과정 또한 납득할 수 있어야 한다는 의미가 담겨 있다. 사회적 참사의 진상규명 조사도 다르지 않다. 조사 결과가 신뢰를 얻는 것은 어떻게 묻고 무엇을 확인했는지가 분명히 보일 때이다. 그 과정을 가장 먼저 확인할 사람은 피해자이다. 피해자는 조사 결과의 영향을 가장 먼저, 가장 크게 받는 당사자이다. 그런 이들이 납득하지 못한 조사를 우리 사회가 온전히 받아들이기는 어렵다. 따라서 피해자에게 조사 과정을 투명하게 공개하는 일은 피해자에 대한 배려이기 전에 조사 자체의 신뢰를 세우는 출발점이 된다. 조사의 독립성과 투명성 투명한 과정 공개는 조사의 독립성과 충돌하지 않는다. 독립성은 조사기구가 누구의 간섭도 받지 않고 사실을 따라간다는 원칙이다. 조사가 어떻게 진행되고 있는지를 알리는 일은 그와 다른 문제이다. 투명성은 조사가 어떤 과정을 거쳐 어디까지 이르렀는지를 외부에서 확인할 수 있게 하는 원칙이다. 독립성이 조사의 공정함을 뒷받침한다면, 투명성은 그 공정함을 확인할 수 있게 해 준다. 독립된 기구일수록 주어진 권한을 어떻게 행사하고 있는지 설명할 책임도 커지기 마련이다. 헌법이 법관의 독립을 보장하면서도 재판은 공개하도록 한 것과 같은 이치이다. 두 원칙이 함께 지켜질 때 비로소 조사에 대한 사회적 신뢰도 자리 잡을 수 있다. 2017년 런던 그렌펠 타워 화재를 조사한 영국의 공개조사위원회가 그 예이다. 전직 판사가 이끈 이 독립 조사에서 유가족과 생존자를 비롯한 500명 넘는 이들이 법이 정","category":"사건 사고"},{"title":"양팔 문신 드러내고 \"두피 트러블 생겼다\" 겁박…미용실서 금품 뜯은 30대 구속","link":"https://n.news.naver.com/mnews/article/079/0004209442","naverLink":"https://n.news.naver.com/mnews/article/079/0004209442","pubDate":"2026-11-13T10:56:11.743709+09:00","author":"네이버뉴스","description":"실제 시술 없이 치료비 요구…업주 10명에게 75만 원 갈취 광주 서부경찰서 전경. 광주경찰청 제공 미용 시술 뒤 두피 트러블이 생겼다면서 미용실 업주들을 상대로 금품을 뜯어낸 30대 남성이 쇠고랑을 찼다. 광주 서부경찰서는 공갈 등 혐의로 30대 남성 A씨를 구속했다고 13일 밝혔다. A씨는 지난 3월부터 8월까지 광주지역 여성 업주가 운영하는 미용실 10여 곳을 찾아가 실제로 염색 등 시술을 받은 사실이 없는데도 \"염색 뒤 두피 트러블이 생겼다\"며 치료비 등을 요구해 업주 10명에게서 모두 75만 원을 강제로 빼앗은 혐의를 받고 있다. 조사 결과 A씨는 양팔의 문신을 드러낸 채 \"손해사정사를 통해 처리하면 더 큰 돈을 부담하게 될 것이다\"고 겁을 주거나, 일부 업소에는 다시 찾아가 \"정신과 치료비와 차비까지 주지 않으면 SNS에 올려 망하게 하겠다\"고 협박한 것으로 드러났다. 경찰은 지난 9월 한 미용실 업주의 신고를 받고 수사에 착수한 뒤 추가 피해 업소 9곳을 확인했다. 경찰은 A씨가 여수의 한 식당에서도 식중독에 걸렸다면서 합의금을 요구한 정황을 확인하고 전남광주를 중심으로 추가 피해 여부를 조사하고 있다. 경찰 관계자는 \"이번 사건은 영세한 소상공인들의 불안한 심리를 악용해 금품을 빼앗은 악질 범죄다\"라며 \"서민 생활을 침해하는 범죄에 무관용 원칙으로 적극 대응하겠다\"고 말했다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"사건 사고"}],"사회":[{"title":"\"출근 했는데 일을 못 하고 있어요\" 기업들 업무 마비…MS 주요 서비스 대규모 장애","link":"https://n.news.naver.com/mnews/article/277/0005842229","naverLink":"https://n.news.naver.com/mnews/article/277/0005842229","pubDate":"2026-11-13T10:56:12.861269+09:00","author":"네이버뉴스","description":"MS 아웃룩·코파일럿 등 대규모 장애 미국서 장애 신고 13만 건 넘어 국내 기업 업무도 마비 마이크로소프트의 이메일과 사무용 온라인 소프트웨어·인공지능(AI) 서비스 등에 대규모 접속 장애가 발생했다. 미국뿐 아니라 국내 기업에서도 이메일과 협업 도구가 작동하지 않는 등 업무에 차질을 빚었다. 마이크로소프트(MS) 이미지. 로이터연합뉴스 12일(현지시간) 온라인 서비스 장애 모니터링 사이트 다운디텍터에 따르면 미 동부시간 오후 1시20분 기준 메일 서비스인 아웃룩 관련 접속 장애 신고가 13만건을 넘어섰다. 이용자들은 이메일 수발신 지연과 계정 접속 불가 등 불편을 호소하고 있다. 이번 장애는 이메일뿐 아니라 AI 서비스 코파일럿과 사무용 온라인 플랫폼인 MS365, 화상회의·메신저 서비스 팀즈 등에도 영향을 미쳤다. 국내 기업에서도 불편이 잇따랐다. 국내 한 IT 업체 관계자는 \"MS 글로벌 장애로 현재 서비스 이용이 불가능한 상황\"이라고 전했다. MS 측은 사회관계망서비스(SNS)를 통해 \"인프라 부하가 증가한 것이 확인됐다\"며 \"이것이 연결 오류의 원인으로 추정된다\"고 밝혔다. 이어 이와 같은 인프라 부하를 분산하기 위해 접속 트래픽 등을 재분배하는 등 복구 작업에 착수했다고 덧붙였다.","category":"사회"},{"title":"“젠슨 황 불륜 상대 앨리스 황, 中 국가안전부 ‘칩 팀’ 요원… 정보수장이 직접 지휘”","link":"https://n.news.naver.com/mnews/article/366/0001204513","naverLink":"https://n.news.naver.com/mnews/article/366/0001204513","pubDate":"2026-11-13T10:56:12.312802+09:00","author":"네이버뉴스","description":"황러, 천이신 中 국가안전부장 직속 공작원 中 중앙판공청 AI 특임조직 가동 수출규제 완화 로비 임무 “황러 같은 국가안전부 여성 요원 더 있다” 젠슨 황 엔비디아 최고경영자(CEO)와 부적절한 관계를 맺은 중국계 여성 앨리스 황(중국명 황러·黄樂)이 중국 최고 정보기관인 국가안전부 내 반도체 전담 공작 조직 요원인 것으로 알려졌다. 황러가 젠슨 황과 쌓은 사적 유대를 무기로 미국의 수출 통제망을 뚫고 약 10조 원어치에 달하는 첨단 반도체를 중국으로 빼돌렸을 뿐 아니라, 미국 정부의 대중국 수출 규제 완화까지 유도하려 했다는 구체적인 정황도 드러났다. 단순한 개인 간 스캔들로 치부됐던 이번 사태가 미국 인공지능(AI) 기술 패권을 무너뜨리려는 중국 최고위층의 치밀한 국가급 정보전이었다는 분석에 힘이 실린다. 앨리스 황(오른쪽)이 2025년 5월 22일 대만 타이베이 한 레스토랑에서 젠슨 황이 주최한 만찬에 참석하고 있다. /연합뉴스 11일(현지시각) 대만 자유시보에 따르면 중국은 국가안전부를 포함해 범정부 차원에서 대미 기술 공작 조직을 가동한 것으로 나타났다. 황러는 그 최전선에서 엔비디아 내부 공급망을 교란하고, 워싱턴 정가를 겨냥한 로비 공작까지 수행했다. 자유시보는 미국 측이 입수한 정보와 관계자를 인용해 중국 공산당 중앙판공청이 미국과 AI 패권 경쟁에서 우위를 점하기 위해 범정부 특별조직을 비밀리에 결성했다고 전했다. 중국 당국은 미국 AI 발전 속도를 최대한 늦추는 것을 목표로 삼고 국가안전부를 필두로 과학기술위원회, 국가인터넷정보판공실, 상무부, 통일전선공작부, 중앙군사위원회 산하 기구를 총동원했다. 이 가운데 인민해방군 소속 정보지원부대는 국가안전부 산하 연구기관 중국현대국제관계연구원(CICIR)과 손잡고 미국 사회 내부 반(反)AI 정서와 데이터센터 건립 반대 여론을 부추기는 심리전과 중국에 대한 칩 수출 규제 완화 여론 조성 공작을 주도한 것으로 파악됐다. 특별조직 핵심 축에 해당하는 국가안전부는 내부에 반도체 확보 공작을 전담하는 이른바 ‘칩 팀(晶片組)’을 별도로 신설해 운영한 것으로 나타났다. 자유시보는 황러가 바로 이 칩 팀 조직 일원으로 활동했다고 전했다. 칩 팀 요원인 황러에게 내려진 주된 임무는 해외 제3국에 페이퍼컴퍼니를 세워 수출이 막힌 미국산 첨단 반도체와 고성능 서버를 사들이는 일이었다. 동시에 황러는 젠슨 황에게 의도적으로 접근해 긴밀한 사적 관계를 구축한 뒤, 그가","category":"사회"},{"title":"\"2200만원 가져간 건 장난\"…김승우, 왜 총 3.5억 나눠서 송금했나?","link":"https://n.news.naver.com/mnews/article/008/0005440738","naverLink":"https://n.news.naver.com/mnews/article/008/0005440738","pubDate":"2026-11-13T10:56:11.743744+09:00","author":"네이버뉴스","description":"배우 김승우(57)가 지인의 현금과 수표 2200만원을 가져간 혐의로 피소된 가운데 사건 이후 여러 차례 이뤄진 송금의 성격을 두고 양측의 주장이 엇갈리고 있다./사진=머니투데이 DB 배우 김승우(57)가 지인의 현금과 수표 2200만원을 가져간 혐의로 피소된 가운데 사건 이후 여러 차례 이뤄진 송금의 성격을 두고 양측의 주장이 엇갈리고 있다. 지난 12일 일요신문 보도에 따르면 김승우는 2021년 10월 서울 강남구 청담동의 한 유흥주점에서 지인 A씨의 지갑에 있던 현금과 수표 등 2200만원을 가져간 혐의로 고소돼 경찰 조사를 받고 있다. A씨는 평소 소지하고 다니던 현금과 수표 3000만원 가운데 김승우가 웨이터와 여성 접대부들에게 팁을 준 뒤 2200만원을 가져갔다고 주장했다. A씨는 \"웨이터와 여성 접대부들을 불러 김승우에게 받은 팁을 확인해보니 300만원 정도 준 것 같았다\"며 \"김승우가 지갑에서 돈을 꺼내는 모습을 본 접대부도 있었다\"고 말했다. 이에 대해 김승우의 법률대리인인 김영곤 변호사(법무법인 수호)는 \"친분 관계에 있는 사람들끼리 함께한 술자리에서 일어난 장난스러운 행위\"라고 주장했다. 이어 \"동석한 사람들이 모두 지켜보고 있는 공개적인 상황이었고, 몇 시간 후 다시 만나기로 해 그 때 금원을 반환할 예정이었다\"며 \"타인의 금전을 불법적으로 취득하려는 의사가 전혀 없었기 때문에 범죄 의사가 없었던 것으로 판단된다\"고 설명했다. 아울러 다음 날 A씨와 만나지 못해 계좌이체로 돈을 반환했다며 범행의 고의성이 없었다고 주장했다. 가져간 돈은 2200만원…2500만원·3000만원 송금한 김승우 양측의 주장이 엇갈리는 대목은 김승우가 A씨에게 돈을 돌려줬다고 주장하며 제시한 송금 내역이다. 보도에 따르면 김승우는 2023년 3월 21일부터 올해 4월 21일까지 세 차례에 걸쳐 A씨 소유 법인에 2500만원을 송금했다. 김승우 측은 해당 송금 내역을 돈을 반환했다는 근거로 제시했다. 그러나 A씨는 \"개인적으로 빌려준 돈을 갚은 것이지 훔친 돈을 준 것이 아니다\"라고 주장했다. 이 밖에도 사건 이틀 뒤인 10월 31일 김승우는 A씨에게 3000만원을 송금했고, 이튿날인 11월 1일에는 네 차례에 걸쳐 총 3억원을 송금했다. 이에 대해 A씨는 \"10월 31일 받은 3000만원은 투자금 3억원에 대해 약정한 10% 수익금\"이라고 주장했다. 김승우 측은 관련 송금을 피해금 반환의 근거로 제시하고 있지만, A","category":"사회"},{"title":"스쿨존서 초록불에 건너던 7살, 우회전 차에 치여 숨져","link":"https://n.news.naver.com/mnews/article/028/0002832049","naverLink":"https://n.news.naver.com/mnews/article/028/0002832049","pubDate":"2026-11-13T10:56:11.743742+09:00","author":"네이버뉴스","description":"스쿨존서 초록불에 건너던 7살, 우회전 차에 치여 숨져. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"폴드8에 TV, 세탁기까지…삼성, 한국시리즈 우승에 '통 큰 선물'","link":"https://n.news.naver.com/mnews/article/057/0001978037","naverLink":"https://n.news.naver.com/mnews/article/057/0001978037","pubDate":"2026-11-13T10:56:11.743738+09:00","author":"네이버뉴스","description":"갤럭시 Z 폴드8·비스포크 AI 콤보 등 총 12종 경품 매일 9명씩 총 108명…로그인만 하면 응모 가능 지난 8일 프로야구 2026 포스트시즌 한국시리즈에서 우승한 삼성 선수들이 박진만 감독을 헹가래 치고 있다. / 사진=연합뉴스 삼성전자가 삼성 라이온즈의 2026 한국시리즈 우승을 기념하는 특별 경품 이벤트를 오늘(13일)부터 진행합니다. '12년 만의 통산 9번째 우승'이라는 의미로 12일 동안 매일 9명씩 총 108명의 당첨자를 선정해 경품을 증정합니다. 별도의 제품 구매 조건이 없어 삼성닷컴을 방문해 로그인만 하면 전 국민 누구나 이벤트에 응모할 수 있습니다. 경품은 ▲ 갤럭시 Z 폴드8 ▲ 비스포크 AI 콤보 ▲ 85형 마이크로 RGB(빨강·초록·파랑) TV 등 대표 제품과 1년간 홈경기를 관람할 수 있는 '삼성 라이온즈 2027 블루존 시즌권' 등 총 12종으로 구성됐습니다. 삼성전자는 행사 기간 매일 당첨자를 추첨해 삼성닷컴에서 결과를 공지할 계획입니다. 삼성 라이온즈 우승 기념 경품 이벤트 / 사진=삼성전자 제공","category":"사회"},{"title":"‘오늘 전역한 아들 탔어요’ 차량 현수막 이벤트…주변 차도 ‘빵빵’ 축하","link":"https://n.news.naver.com/mnews/article/020/0003762274","naverLink":"https://n.news.naver.com/mnews/article/020/0003762274","pubDate":"2026-11-13T10:56:11.743736+09:00","author":"네이버뉴스","description":"차량 현수막 이벤트한 아버지. 보배드림 아들의 전역을 기념해 차량에 현수막을 붙이고 달린 아버지가 도로에서 만난 운전자들의 축하에 감사 인사를 전했다. 자동차 전문 커뮤니티 보배드림에는 11일 ‘많은 분들께 감사합니다’라는 제목으로 장문의 글이 올라왔다. 글쓴이는 “오늘은 아들이 18개월간의 군생활을 마치고 전역하는 날이었다”며 “추억거리 하나 만들고 싶어서 차량 트렁크에 현수막 하나를 붙였다”고 했다. 이와 함께 공개한 사진에는 차량 뒷유리에 ‘오늘 전역한 아들이 타고 있어요’라고 쓰인 현수막이 붙어있다. 그는 강원도 인제에서 충남 청양까지 차량에 현수막을 달고 이동했다고 한다. 글쓴이는 “많은 분이 창문을 열어 엄지 척, 따봉, 손하트, 빵빵 경적과 함께 저희 가족에게 잊지 못할 추억들을 함께해주셨다”며 “같이 창문을 열어 보답의 인사를 드린 분들도 있고 미처 감사의 인사를 드리지 못한 분들도 있는데 따뜻한 축의 인사 진심으로 감사하다”고 전했다. 이어 “별것도 아닌데 유난 떤다고 생각하는 분들도 계시겠지만 좋게 생각해달라”며 “혹시나 저희 차량으로 불편함이 있으셨다면 죄송하다는 말씀도 드린다”고 말했다. 누리꾼들의 아버지의 감동 이벤트에 호응했다. 이들은 “내가 제대했는데 아빠가 현수막 이벤트를 해준다면 눈물 날 것 같다” “멋진 아빠” “전역을 축하드린다” “멋있다. 수고한 아들에게도 박수를 보낸다” “대견하시겠다. 축하드린다” “이게 왜 불편하나, 멋진 아드님 전역 축하드린다”고 했다.","category":"사회"},{"title":"\"44세 딸 둘 아빠, 사람 빼고 다 팔았다\"…'남대문 스카프 아저씨' 정체","link":"https://n.news.naver.com/mnews/article/448/0000650795","naverLink":"https://n.news.naver.com/mnews/article/448/0000650795","pubDate":"2026-11-13T10:56:11.743731+09:00","author":"네이버뉴스","description":"라이브 방송을 켜고 소통한 '남대문 스카프 아저씨' 모습. / 인스타그램 캡처 손님에게 \"사지 마\", \"과소비야\"를 외치며 유명해진 '남대문 스카프 아저씨'가 라이브 방송에서 자신의 나이와 가족관계 등 그동안 알려지지 않았던 이야기를 털어놨다. 서울 남대문시장에서 잡화점 '한양사'를 운영하는 A씨는 최근 자신의 인스타그램에서 라이브 방송을 진행했다. 그는 \"결혼했고 딸이 둘 있다. 한국 나이로 44세\"라며 \"한양사에서 10년 넘게 장사했다\"고 자신을 소개했다. 이어 \"좌판에서도 팔고 이것저것 다 해봤다. 돈 되는 건 사람 빼고 다 팔았다\"고 말해 웃음을 자아냈다. 손님을 타박하면서도 웃음을 끌어내는 특유의 장사 방식도 설명했다. A씨는 \"물건보다는 어머님들과 이야기하고 농담하는 게 좋았다\"며 \"그렇게 웃고 떠들다 보면 하나씩 사주셨고, 또 찾아오셨다\"고 말했다. 최근 폭발적인 인기에 대해서는 \"다 운이다. 특별한 장사 기술이 있는 것도 아니고 처음부터 계획한 것도 아니다\"라며 몸을 낮췄다. 그러면서 \"10년 동안 먹고살려고 장사를 하다 보니 기분 좋게 일하고 싶어서 이런 말투가 몸에 밴 것 같다\"고 덧붙였다. 갑작스럽게 찾아온 유명세는 매장 밖으로도 번졌다. 네이버 스마트스토어 캡처","category":"사회"},{"title":"\"난 안 먹었어\"...반려견 잠시 맡겼더니 '개소주' 만든 20년 지인의 변명","link":"https://n.news.naver.com/mnews/article/031/0001074788","naverLink":"https://n.news.naver.com/mnews/article/031/0001074788","pubDate":"2026-11-13T10:56:11.743721+09:00","author":"네이버뉴스","description":"20년간 거래해 온 거래처에서 받은 반려견을 건강원에 넘겨 '개소주'로 만들어버린 남성이 누리꾼들의 지탄을 받고 있다. 20년간 거래해 온 거래처 사장에게 맡긴 반려견이 건강원에 넘겨져 '개소주'로 만들어졌다는 사실을 알게 된 반려견 주인이 분노를 터트렸다. 사진은 SBS '뉴스헌터스' 방송화면. [사진=SBS] 지난 10일 SBS '뉴스헌터스'에 따르면 경기 안산시에서 자동차 공업사를 운영하는 A씨는 지난달 31일 거래처 사장 B씨에게 반려견 '오순이'를 맡겼다. 오순이는 지난 5월 A씨 가족이 지인으로부터 데려온 믹스견으로, 사건 당시 생후 2개월에 불과했다. 가족은 공업사 이름의 첫 글자를 딴 '오순이'라는 이름을 지어주고 반려견 등록도 마쳤다. 사람을 잘 따르는 성격의 오순이는 공업사 직원들과 인근 상인들에게도 사랑받았다. A씨와 20년 넘게 거래해 온 B씨는 오순이를 볼 때마다 자신이 키우고 싶다며 여러 차례 데려가게 해달라고 부탁했다. 가족들은 오순이를 다른 사람에게 보낼 생각이 없었으나, B씨의 거듭된 부탁에 지난달 31일 주말 동안만 돌봐 달라며 오순이를 맡겼다. 20년간 거래해 온 거래처 사장에게 맡긴 반려견이 건강원에 넘겨져 '개소주'로 만들어졌다는 사실을 알게 된 반려견 주인이 분노를 터트렸다. 사진은 SBS '뉴스 헌터스' 방송화면. [사진=SBS]","category":"사회"},{"title":"이용철, 공소취소 '지훠권 행사' 여부 묻자 \"청문회서 답변\"","link":"https://n.news.naver.com/mnews/article/448/0000650799","naverLink":"https://n.news.naver.com/mnews/article/448/0000650799","pubDate":"2026-11-13T10:56:11.743719+09:00","author":"네이버뉴스","description":"이용철, 공소취소 '지훠권 행사' 여부 묻자 \"청문회서 답변\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[연합뉴스 이 시각 헤드라인] - 10:30","link":"https://n.news.naver.com/mnews/article/001/0016440193","naverLink":"https://n.news.naver.com/mnews/article/001/0016440193","pubDate":"2026-11-13T10:56:11.743715+09:00","author":"네이버뉴스","description":"■ 젠슨 황 퇴진직전 엔비디아 내 여론은…재직자 74% \"사퇴 반대\" 젠슨 황 엔비디아 최고경영자(CEO)가 잇단 불륜 의혹에 물러난 가운데 사퇴 발표 직전까지 직장인 익명 커뮤니티 블라인드에 올라온 엔비디아 재직자들의 사퇴 관련 의견은 반대가 74%로 찬성을 크게 웃돈 것으로 나타났다. 엔비디아 이사회는 12일(현지시간) 황 CEO가 사장과 CEO, 이사회 이사직에서 즉시 물러났다고 발표했다. 이사회는 콜레트 크레스 최고재무책임자(CFO)를 임시 CEO로 선임하고 사내외 후보를 대상으로 후임 물색에 착수했다. 13일 블라인드에 따르면 황 CEO 관련해 첫 불륜 의혹이 제기된 이달 6일부터 추가 의혹이 보도된 11일까지(미국 현지시간) 엔비디아 재직자가 남긴 사퇴 관련 의견 중 74%가 반대였다. 전문보기: https://www.yna.co.kr/view/AKR20261112174100017 12일(현지시간) 미국 캘리포니아 엔비디아 본사 [AFP=연합뉴스. 재판매 및 DB 금지] ■ 젠슨황 자녀·사위 입지 좁아질 듯…'가족승계' 물거품 전망 젠슨 황 전 최고경영자(CEO)가 추문을 안고 엔비디아에서 물러나면서 회사 내에서 주요 보직을 맡은 자녀와 사위 등 가족들의 입지도 좁아질 것으로 보인다. 공식적인 후계 구도가 없었던 엔비디아에서 장기적으로 가족 승계를 꾀하는 것이 아니냐는 관측도 일각에서 제기됐지만 이는 사실상 가능성이 사라지게 됐다. 12일(현지시간) 인공지능(AI) 업계에 따르면 황 전 CEO의 딸 매디슨 황은 엔비디아의 실물AI(피지컬AI) 부문 제품 마케팅 수석이사로 재직 중이다. 전문보기: https://www.yna.co.kr/view/AKR20261113021900091 ■ 李대통령 \"자본시장 개혁 의지 시험대…정상화 목표 확고\" 이재명 대통령은 13일 \"자본시장 개혁에 대한 우리 정부의 의지와 정책이 다시 한번 시험대에 올랐다\"며 \"자본시장 정상화는 우리 정부의 확고한 정책 방향으로, 의심할 여지가 없다\"고 말했다. 이 대통령은 이날 여의도 한국거래소를 찾아 '신뢰받는 자본시장, 현장에서 묻고 답을 찾다'를 주제로 자본시장 정책 간담회를 열고서 이같이 말했다. 최근 주가지수가 하락세를 보이며 금융시장에 대한 불안감이 커지는 상황에서 정부의 변함없는 개혁 의지를 부각하기 위한 일정으로 풀이된다. 전문보기: https://www.yna.co.kr/view/AKR20261113058500001","category":"사회"}],"생활·문화":[{"title":"“쇼핑카트에 기대면 편해진다”…척추관협착증 의외의 특징","link":"https://n.news.naver.com/mnews/article/020/0003762257","naverLink":"https://n.news.naver.com/mnews/article/020/0003762257","pubDate":"2026-11-13T10:56:13.304013+09:00","author":"네이버뉴스","description":"척추관협착증 환자는 걷거나 오래 서 있을 때 다리가 저리고 아프다가 앉거나 허리를 앞으로 숙이면 증상이 완화되는 경우가 있다. 쇼핑카트에 몸을 기대고 걸을 때 편안함을 느끼는 것도 특징적인 증상 중 하나다. 사진은 기사 내용과 직접 관련 없는 자료사진. 게티이미지뱅크 걷다가 다리가 저리거나 아파 자꾸 멈춰 서게 된다면 단순한 노화나 다리 혈관 문제로만 생각해서는 안 된다. 허리 통증이 두드러지지 않아도 척추관협착증이 원인일 수 있기 때문이다. 실제로 다리가 저리고 걷기 어려운 증상을 하지정맥류 때문이라고 생각했던 환자가 척추관협착증을 진단받고 치료한 사례도 있다. 12일 한양대학교 교육협력병원 센트럴병원 신경외과 최수영 과장은 동아닷컴에 “다리 저림이나 보행 장애가 일상생활에 지장을 주고 불편한 정도가 크다 보니 허리 불편감이 있는 걸 환자가 간과하는 경우가 많다”고 설명했다. 최 과장은 다리 통증과 보행 장애가 심했지만 원인을 하지정맥류로만 생각했던 환자를 진료한 경험을 소개했다. 이 환자는 척추내시경을 이용한 감압술을 받은 뒤 증상이 많이 호전됐다. 척추관협착증은 신경이 지나가는 통로인 척추관이 좁아지면서 신경을 압박하는 질환이다. 나이가 들면서 척추 주변의 뼈와 관절, 인대가 두꺼워지는 퇴행성 변화가 주요 원인이다. 건강보험심사평가원 국민관심질병통계를 인용한 병원 자료에 따르면 척추관협착증 환자는 2021년 약 462만 명에서 2024년 약 484만 명으로 증가했다. 2024년 기준 60세 이상이 전체 환자의 86%를 차지했다. ● 걷다가 아픈데 앉으면 괜찮아진다?…척추관협착증의 특징 척추관협착증의 대표적인 증상은 ‘신경인성 간헐적 파행’이다. 서 있거나 걸을 때 엉덩이와 허벅지, 종아리 등이 저리거나 아프다가 잠시 앉거나 허리를 앞으로 숙이면 증상이 완화되는 현상이다. 쇼핑카트나 유모차에 몸을 기대고 걸을 때 한결 편해지는 것도 특징적인 증상 가운데 하나다. 허리를 앞으로 숙이면 신경이 지나가는 공간이 상대적으로 넓어져 압박이 줄어들 수 있기 때문이다. 그렇다면 어느 정도 증상이 나타날 때 병원을 찾아야 할까. 최 과장은 “걷다가 다리가 저리거나 아픈데 쉬면 좋아지는 패턴이 일시적이지 않고 수주 이상 반복될 때” 진료를 받아야 한다고 설명했다. 걸을 수 있는 거리가 점점 짧아지거나 증상이 일상생활에 지장을 주는 경우도 마찬가지다. 다만 다리 통증이 나타난다고 모두 척추관협착증은 아니다. 허리디스크뿐 아니","category":"생활·문화"},{"title":"서동주 \"월급 전액 비트코인 투자, 3개월 만에 3배…집 샀다\"","link":"https://n.news.naver.com/mnews/article/015/0005353436","naverLink":"https://n.news.naver.com/mnews/article/015/0005353436","pubDate":"2026-11-13T10:56:13.304011+09:00","author":"네이버뉴스","description":"사진=유튜브 채널 '서동주의 또.도.동' 캡처 변호사 겸 방송인 서동주가 과거 월급을 비트코인에 투자해 집을 마련한 경험이 있다고 밝혔다. 서동주는 지난 12일 유튜브를 통해 '코리아 블록체인 위크(KBW) 2026'에 진행자로 참석하는 모습을 공개했다. 이날 서동주는 4명의 인사와 무대에 올라 스테이블 코인과 관련한 질문과 답변을 주고받는 형식의 행사를 진행했다. 행사에 앞서 서동주는 \"한국에서는 비트코인을 처음 알게 됐을 때 확 오르고 떨어지는 걸 경험했어서 '이거 사기 아니냐', '도박 아니냐' 이런 인식이 있었던 거 같다. 그런데 비트코인이나 이더리움같이 오래된 가상자산의 뒷면에는 철학적인 면이 있다\"고 말했다. 이어 비트코인이 처음 만들어진 계기를 설명했다. 서동주는 \"지금은 개인 거래에서도 은행을 통해 돈을 보내지 않나. 블록체인을 만든 사람은 이렇게 하지 않고 서로 직접 보내면 좋겠다고 생각한 거다. 그러려면 믿음이 있어야 하지 않나. 그래서 블록체인을 만들어서 모든 게 블록에 쓰여지게 하고, 아무도 그 거래내역을 수정하지 못하게 해 신뢰를 가질 수 있는 거래가 가능하고 수수료는 없어도 되도록 한 것\"이라고 전했다. 이어 \"수수료라는 게 어떤 기관이 가운데에 끼는 거 아니냐. 그런 영향력 있는 기관 없이도 거래를 해보겠다는 철학을 가지고 블록체인을 쓰기 시작했던 거고, 가상자산을 만들어서 거래하기 시작했던 거다. 탈중앙화라는 큰 개념이 있었고, 그러면서 이런 가상자산이 만들어지게 됐다는 비하인드 스토리를 이해하면 덜 거부감이 들 것 같다\"고 덧붙였다. 서동주가 비트코인을 처음 접한 건 2018년 로펌에 신입 변호사로 들어갔을 때였다고 했다. 당시 로펌에 블록체인 부서가 생기면서 자연스럽게 가상자산과 가까워졌다고. 서동주는 \"앞으로는 모든 게 가상자산화가 될 거라고 하더라. 패기 넘치는 신입이었기 때문에 월급을 통으로 비트코인을 사고 이더리움 사는 데에 썼다\"고 말했다. 이어 \"그게 3개월 만에 3배가 되는 일이 있었다. 그걸 통해 집도 샀다\"고 말해 놀라움을 안겼다. 현재 서동주는 삼프로TV '크립토플러스'를 진행하고 있다. 그는 면접 당시를 떠올리며 \"'가상자산 좀 알고 있냐'고 묻길래 그동안의 투자 이력을 쭉 말했다. 비트코인, 이더리움, 리플, 라이트코인 뿐만 아니라, 알트코인, 밈코인 등 안 사본 게 없었다. 삼프로TV에서 일하려고 한 건 아니었지만, 10년 후에 이런 자리가 생긴 걸 보면","category":"생활·문화"},{"title":"“‘단짠단짠’맛 신경질 돋워…짜증 늘었다면 음식 바꿔보길”","link":"https://n.news.naver.com/mnews/article/028/0002832032","naverLink":"https://n.news.naver.com/mnews/article/028/0002832032","pubDate":"2026-11-13T10:56:13.304001+09:00","author":"네이버뉴스","description":"[ESC] 박미향 기자의 절밥 에세이 ① 감은사 ‘마하연 사찰음식문화원’ 우관 스님 삶과 참수행 의미 찾아 공부하다…스승 명령 계기로 사찰음식 시작 ‘마하연 사찰음식문화원’을 운영하는 우관 스님이 담백하고 슴슴한 가을 밥상을 차렸다. 박미향 선임기자 한국 절밥이 전세계 ‘요리 인류’의 지대한 관심을 받고 있습니다. 이유가 뭘까요. 박미향 기자가 전국 내로라하는 절밥을 찾아 에세이로 그 이유를 알려드립니다. 사랑과 기침은 참을 수 없다는 말이 있다. 나이 들면 여기에 추가할 게 생긴다. 방귀다. 자신의 의지와 무관하게 시도 때도 없이 뿜어 나오는 방귀는 자괴감이 들게 한다. 중장년층은 남녀 가릴 것 없이 예전만큼 조여지지 않는 괄약근과 둔해진 직장 감각에 속수무책이 된다. 애써 ‘늙은 나이’의 장점을 찾다가도 방귀의 폭격을 당하면 처연해진다. 그럴 때마다 ‘인연’을 생각한다. ‘그래도, 나이 들어 신실한 인연은 많이 생겼잖아. 그거면 됐지.’ 잃는 게 있으면 얻는 게 있다. 위로가 된다. 나이 들면 추운 겨울에 햇살 같은 인연이 소중하다. 오랜만에 만났는데도 어제 만난 듯 따스하다. 경기도 이천시 마장면에 있는 감은사 주지 우관 스님이 그런 이다. 아이 같은 그의 얼굴을 마주하면 겨울철 붕어빵 같은 온기가 전해진다. 그와의 인연은 10년 전으로 거슬러 올라간다. 당시 이천에서 ‘마하연 사찰음식문화원’을 운영하며 사찰음식을 연구하는 스님이 있는데, 특별한 커피를 만든다는 얘기를 들었다. 호기심이 발동해 갔다. 허름한 건물에서 커피를 요리하듯 뽑아내는 스님과 그 커피를 마시며 삶의 의미를 되새기는 2030세대 청년들을 만났다. 발칙한 풍경이었다. 차도 아니고 고급 커피라니. 하지만 곧 깨달았다. 무례하지 않은 발칙함은 본래 상상을 전제로 한다는 걸 말이다. 상상은 곧 비전이 되고 꿈이 된다. 그날 우관 스님은 꿈을 제조하고 있었다. ‘마하연 사찰음식문화원’을 운영하는 우관 스님이 문화원 뒷마당 장독대에 서 있다. 박미향 선임기자","category":"생활·문화"},{"title":"\"음식 꿀꺽이 꺼끌꺼끌하다\"…식도가 보내는 경고 [헬스톡]","link":"https://n.news.naver.com/mnews/article/014/0005603769","naverLink":"https://n.news.naver.com/mnews/article/014/0005603769","pubDate":"2026-11-13T10:56:13.303996+09:00","author":"네이버뉴스","description":"조기암은 내시경 절제, 진행암은 항암·방사선·수술 병행…영양 관리도 핵심 뉴시스 [파이낸셜뉴스] 음식을 삼킬 때 목이나 가슴에 뭔가 걸리는 느낌이 계속된다면 단순한 소화불량으로 넘겨선 안 된다. 식도암의 신호일 수 있다. 식도암은 음식물이 지나가는 통로인 식도의 점막에서 생기는 악성종양이다. 식도는 목에서 가슴을 지나 위까지 이어지는 약 25~30㎝ 길이의 관 모양 장기로, 목 부분의 경부 식도와 가슴 부분의 흉부 식도로 나뉜다. 바로 옆에는 기도와 주요 혈관이 붙어 있다. 정상 식도는 점막이 매끄럽고 미세혈관이 규칙적으로 배열돼 있으며 안쪽 공간도 잘 유지된다. 반면 진행된 식도암은 내시경에서 덩어리(종괴)와 궤양이 생기고 식도 안쪽이 좁아진 모습으로 보인다. 하지만 조기 식도암은 점막의 미세한 변화로만 나타나는 경우가 있어 일반 백색광 내시경만으로는 찾아내기 쉽지 않다. 발견만큼 중요한 '병기 평가' 식도암의 병기는 종양이 식도 벽을 얼마나 깊이 파고들었는지, 주변 림프절로 퍼졌는지, 간이나 폐 등 다른 장기로 전이됐는지를 종합해 판단한다. 진단은 내시경과 조직검사로 하고, 컴퓨터단층촬영(CT)으로 주변 장기 침범과 림프절·원격 전이 여부를 살핀다. 양전자방출단층촬영(PET-CT)은 CT에서 보이지 않던 원격 전이를 찾는 데 도움이 되고, 내시경초음파는 필요할 때 종양이 파고든 깊이와 주변 림프절을 평가하는 데 쓰인다. 전이가 의심되는 병변이 있으면 자기공명영상(MRI)이나 조직검사를 추가로 한다. 일찍 찾으면 식도 지키며 치료 치료법은 병기와 종양 위치, 환자의 전신 상태에 따라 달라진다. 국내에서 흔한 식도 편평세포암을 기준으로, 암이 점막의 얕은 층에 머물러 림프절 전이 위험이 낮은 조기 식도암은 내시경 절제술로 식도를 보존하며 치료할 수 있다. 절제 후 최종 병리 검사에서 암이 점막근층이나 점막하층까지 파고든 것으로 확인되면 수술이나 항암방사선치료를 추가할지 결정한다. 수술로 떼어낼 수 있는 국소 진행성 식도암은 수술 전에 항암치료나 항암방사선치료를 먼저 한 뒤 수술한다. 수술이 어려운 경우에는 항암치료와 방사선치료를 동시에 해 완치를 목표로 한다. 다른 장기로 전이됐다면 세포독성 항암제와 면역항암제, 표적치료제 등 전신 치료가 중심이 된다. 치료 과정 내내 증상과 영양 상태를 관리하는 지지 요법도 중요하다. 음식을 삼키기 어려우면 식사 형태를 조절하고, 필요하면 식도에 스텐트를 넣거나 위에 직접 관","category":"생활·문화"},{"title":"골다공증 막으려 매일 걷는다고?…'이 운동' 효과 훨씬 컸다 [매일비타민]","link":"https://n.news.naver.com/mnews/article/088/0001040079","naverLink":"https://n.news.naver.com/mnews/article/088/0001040079","pubDate":"2026-11-13T10:56:13.303994+09:00","author":"네이버뉴스","description":"헝가리 셈멜바이스대 연구진은 폭발적인 순간 동작과 급격한 방향 전환을 동반한 고강도 운동이 골 형성을 자극하는 데 훨씬 효과적이라는 연구 결과를 발표했다. (AI 생성 이미지) 골다공증을 예방하려고 매일 걷고 꾸준히 근력운동을 해온 사람들에게 주목할 만한 연구 결과가 나왔다. 축구와 핸드볼처럼 빠르게 가속하고 급격하게 방향을 바꾸는 운동이 뼈 형성을 촉진하는 생물학적 반응을 더 강하게 일으킨 것으로 나타났다. 11일(현지시간) 사이언스데일리에 따르면, 헝가리 셈멜바이스대 연구진은 이같은 연구 결과를 국제학술지 '스포츠 메디슨-오픈(Sports Medicine - Open)'에 게재했다. 연구진은 건강한 성인 1천238명을 대상으로 진행된 임상연구 24건을 종합 분석했다. 연구진은 운동이 뼈에 미치는 영향을 살펴보기 위해 골밀도 대신 혈액 속 골형성 관련 바이오마커를 분석했다. 골밀도는 운동에 따른 변화를 확인하기까지 상당한 시간이 걸리는 반면, 혈중 바이오마커는 뼈가 운동 자극에 어떻게 반응하는지 비교적 짧은 기간 안에 파악할 수 있기 때문이다. 분석 결과 레크리에이션 수준의 축구와 핸드볼은 골형성과 관련된 혈중 지표를 최대 45~46% 높인 것으로 나타났다. 두 운동은 달리기와 걷기를 반복하는 데 그치지 않고 순간적으로 속도를 높이거나 급격하게 방향을 바꾸는 동작이 잦다는 공통점이 있다. 갑작스러운 가속과 감속, 급선회 등 다양한 움직임이 뼈에 강한 기계적 자극을 전달한다는 것이다. 반면 걷기와 스텝 에어로빅, 일반적인 헬스장 저항운동은 골형성 관련 지표를 높이는 효과가 상대적으로 작았다. 고강도 트레이닝은 골형성 지표인 오스테오칼신 수치도 유의미하게 높였다. 분석에서 나타난 평균 차이는 6.88이었다. 연구진이 특히 주목한 대목은 일반적으로 뼈 건강에 도움이 되는 것으로 알려진 저항운동의 결과였다. 근육에 부하를 주는 웨이트 트레이닝이 이번 분석에서는 골 대사 관련 혈중 지표에 유의미한 영향을 미치지 못한 것으로 나타났기 때문이다. 제1저자인 셈멜바이스대 박사과정 연구원은 \"저항운동이 골 대사 마커에 유의미한 영향을 주지 못했다는 점이 가장 놀라웠다\"며 \"여러 전문 가이드라인이 뼈 건강 유지를 위해 저항운동을 권장하고 있음에도 그렇다. 마찬가지로 걷기나 조깅 같은 저강도·중강도 지구력 운동도 장기적으로 유의미한 효과를 보이지 않았다\"고 밝혔다. 연구진은 운동 과정에서 발생하는 기계적 부하에 주목했다. 신체가","category":"생활·문화"},{"title":"“식사 후에는 반드시 움직여라”…혈당 낮추고 췌장 기능 돕는 가벼운 운동","link":"https://n.news.naver.com/mnews/article/296/0000107264","naverLink":"https://n.news.naver.com/mnews/article/296/0000107264","pubDate":"2026-11-13T10:56:13.303978+09:00","author":"네이버뉴스","description":"[권순일의 헬스리서치] 식사 후에 앉아 있지 말고 단 몇 분만이라도 신체 활동을 하면 혈당을 낮추는 데 큰 도움이 된다. 사진=게티이미지뱅크 혈당을 적절하게 유지하는 것은 단순히 당뇨병을 예방하는 것뿐 아니라 혈관, 심장, 뇌, 신장 등 전신 건강을 지키는 데 매우 중요하다. 혈당이 지나치게 높거나 낮으면 신체 기능에 여러 문제가 생길 수 있기 때문이다. 혈당이 높은 상태가 장기간 이어지면 인슐린 저항성이 심해지고 췌장의 인슐린 분비 기능에도 부담이 생길 수 있다. 따라서 혈당 관리는 제2형 당뇨병의 예방과 진행 조절에 중요하다. 높은 혈당, 여러 가지 건강 문제 유발 고혈당은 혈관 내벽을 손상시키고 염증과 산화 스트레스를 증가시킬 수 있다. 장기간 지속되면 동맥 경화와 혈관 합병증 위험이 커진다. 혈당이 지속적으로 높으면 심장과 뇌로 혈액을 공급하는 혈관에 손상이 생길 수 있다. 심근 경색과 뇌졸중 위험을 낮추기 위해 혈당 관리가 필요한 이유다. 또한 고혈당이 장기간 지속되면 신장의 미세혈관이 손상돼 당뇨병성 신장 질환으로 이어질 수 있으며 망막의 미세혈관을 손상시켜 당뇨병성 망막병증을 일으킬 수 있다. 심하면 시력 저하 끝에 실명이 될 수도 있다. 여기에 혈당 조절이 제대로 되지 않으면 뇌혈관 건강에 악영향을 미칠 수 있다. 특히 장기간의 당뇨병은 인지 기능 저하와 치매 위험 증가와도 관련이 있다. 혈당 조절에 도움 되는 생활 습관 혈당을 적절하게 유지하는 생활 습관으로는 정제 탄수화물을 줄이고 잡곡, 채소, 생선, 콩류 등을 골고루 섭취하기, 규칙적인 신체 활동, 탄산음료와 가당 커피 등 당분이 많은 음료 줄이기, 충분한 수면과 스트레스 관리 등이 꼽힌다. 전문가들은 \"혈당을 정상 범위에서 안정적으로 유지하는 게 중요하다\"며 \"특히 당뇨병 환자는 혈당을 지나치게 낮추는 저혈당도 주의해야 한다\"고 말한다. 이들은 \"혈당 관리에 아주 쉽고 좋은 방법이 한 가지 있는데 그것은 식사 후 몸을 움직이는 것\"이라고 입을 모은다. 연구에 따르면 식사 후 운동을 하면 근육이 포도당을 에너지로 사용할 수 있어 혈당 수치를 낮추는 데 도움이 된다. 한 메타분석에 따르면 식사 후 운동이 식사 전 운동보다 혈당을 낮추는 데 더 효과적이었으며, 참가자들이 더 일찍 움직이기 시작할수록 그 효과가 더 컸다. 효과를 보려면 꼭 강도 높은 운동을 해야 하는 것은 아니다. 몇 분간의 가벼운 운동만으로도 식후 혈당 조절에 도움이 된다. 이","category":"생활·문화"},{"title":"삼성·구글, 스마트 글래스 30종 공개 “아이웨어로 만나는 새로운 AI 시대”","link":"https://n.news.naver.com/mnews/article/005/0001884850","naverLink":"https://n.news.naver.com/mnews/article/005/0001884850","pubDate":"2026-11-13T10:56:12.861245+09:00","author":"네이버뉴스","description":"뉴욕서 라인업 공개…제미나이 탑재 젠틀몬·워비파커, 사전 판매 시작 삼성전자 제공 삼성전자가 구글 및 젠틀몬스터, 워비파커와 협업한 스마트 글래스 ‘인텔리전트 아이웨어’(사진)를 12일(현지시간) 미국 뉴욕에서 공개했다고 밝혔다. 인텔리전트 아이웨어는 삼성전자 하드웨어에 구글 생성형 인공지능(AI) ‘제미나이’를 탑재한 기기다. 한국 안경 브랜드 젠틀몬스터가 디자인한 16종과 미국 기업 워비파커의 14종으로 구성된 제품 라인업 전체가 공개됐다. 인텔리전트 아이웨어에 탑재된 제미나이는 눈앞에 보이는 사물이나 주변 환경에 대한 정보를 사용자와 자연스러운 대화를 통해 제공한다. 해외에선 현지어로 작성된 식당 메뉴를 번역하거나 낯선 길에서 지도 애플리케이션(앱)을 통해 길을 안내받을 수 있다. 회의 중 화이트보드나 화면에 작성된 문구를 촬영한 뒤 제미나이에 요약을 요청하면 삼성전자 갤럭시 스마트폰에 탑재된 삼성 노트에 내용을 저장하는 식으로 업무 효율도 높일 수 있다. 인텔리전트 아이웨어는 삼성전자의 오랜 모바일 하드웨어 제조 기술을 바탕으로 주요 부품을 41g의 가볍고 얇은 프레임 안에 최적화해 배치한 것이 특징이다. 무게와 구조적 균형은 물론 총 30종의 제품 디자인마다 다른 특성까지 고려해 일상생활에서 장시간 착용해도 편안하게 설계됐다고 삼성전자는 설명했다. 안경테 왼쪽에 탑재된 1200만 화소의 HDR 카메라는 AI가 주변 상황을 이해하는 데 필요한 시각 정보를 제공한다. 고해상도 사진과 생생한 색감의 동영상 촬영도 지원한다. 양쪽 테에 각각 탑재된 개방형 스피커 2개를 통해 주변 소리를 들으며 통화와 미디어 감상, AI 응답 기능을 이용할 수 있다. 4개의 마이크는 사용자의 음성 명령을 인식한다. ‘스냅드래곤 AR1’ 1세대 플랫폼이 주요 기능으로 지원되며 배터리는 1회 충전으로 최대 9시간, 충전 케이스 활용 시 최대 72시간까지 연속 사용이 가능하다. 젠틀몬스터와 워비파커는 이날 공식 온라인 채널을 통해 인텔리전트 아이웨어 사전 판매를 시작했다. 다음 달 10일에는 한국과 미국 매장에도 출시된다. 한국에선 젠틀몬스터 제품만 판매될 예정이며 삼성 강남, 삼성스토어 홍대점 등 국내 삼성전자 매장에서도 제품을 체험할 수 있다. 국내 판매 가격은 모델에 따라 최소 65만원, 최대 70만원으로 책정됐다.","category":"생활·문화"},{"title":"젠슨 황 사퇴로 \"영입한다면 영광\" 머스크 발언 재조명","link":"https://n.news.naver.com/mnews/article/119/0003154694","naverLink":"https://n.news.naver.com/mnews/article/119/0003154694","pubDate":"2026-11-13T10:56:12.312814+09:00","author":"네이버뉴스","description":"[데일리안 = 전기연 기자] 젠슨 황 엔비디아 최고경영자(CEO)가 불륜 논란으로 결국 자리에서 물러난 가운데 영입 의사를 공개적으로 드러낸 일론 머스크 테슬라 CEO의 발언이 다시 주목 받고 있다. 엔비디아는 12일(이하 현지시간) 황 CEO가 최고경영자와 이사회 구성원직에서 사퇴했다고 발표했다. 황 CEO는 중국 정보기관 연계 의혹이 제기된 여성과의 부적절한 관계 등 사생활 논란 끝에 1993년 회사 공동 창업 이후 33년 간 유지해 온 수장 자리에서 물러났다. ⓒAP/뉴시스 젠슨 황의 사퇴로 앞서 머스크가 공개적으로 영입의사를 드러낸 발언에도 관심이 쏠리고 있다. 머스크는 지난 11일 사회관계망서비스(SNS) 엑스(X·옛 트위터)에서 한 이용자가 \"일론, 제발 젠슨을 고용해줘\"라고 요청하자 \"그럴 수 있다면 영광일 것\"이라고 답했다. 머스크는 앞서 황 CEO를 공개적으로 옹호하기도 했다. 지난 8일 한 벤처투자자가 황 CEO의 잘못을 지적하면서도 미국의 인공지능(AI) 경쟁력 유지를 위해 대체하기 어려운 인물이라는 취지의 글을 올리자 \"동의한다\"는 댓글을 남겼다. 머스크의 발언이 더욱 관심을 받은 이유는 두 기업이 AI 사업을 중심으로 긴밀한 협력 관계를 맺고 있기 때문이다. 머스크는 지난 8월 스페이스X 실적발표에서 AI 인프라를 엔비디아 반도체만으로 구축하겠다는 계획을 밝혔다. 엔비디아의 차세대 AI 반도체 '베라 루빈'을 높이 평가하며 향후 우주 데이터센터 사업에도 활용하겠다는 구상을 내놨다. 스페이스X는 지난달 26일 엔비디아 차세대 반도체 도입을 위한 400억 달러(약 53조5000억원) 규모의 금융리스 계약 추진 계획을 발표했다. 엔비디아 역시 지난 6월 말 기준 스페이스X 주식 약 1억2280만 주를 보유하고 있으며 당시 평가액은 약 210억 달러(약 28조1000억 원)에 달했다. 해당 지분은 과거 머스크의 AI 기업 엑스에이아이(xAI)에 투자한 데 따른 것이다. 황 CEO가 사퇴하면서 향후 행보가 불투명한 가운데 머스크의 공개 발언이 실제 영입으로 이어질지 여부와 함께 머스크가 이끄는 기업들과의 협력 가능성에 이목이 쏠리고 있다. 한편 황 전 CEO는 중국 정보기관과 연계됐을 가능성이 제기된 여성과 친밀한 관계를 맺었다는 의혹에 휩싸였으며 이후 불륜 사실을 인정했다. 하지만 거취를 둘러싼 논란이 확산된 끝에 자리에서 물러났다. 엔비디아는 후임자가 결정될 때까지 콜레트 크레스 최고재무책임자","category":"생활·문화"},{"title":"HP와 인텔부터 맥도날드, CBS까지 '美 CEO 스캔들' 재조명…","link":"https://n.news.naver.com/mnews/article/014/0005603820","naverLink":"https://n.news.naver.com/mnews/article/014/0005603820","pubDate":"2026-11-13T10:56:12.312787+09:00","author":"네이버뉴스","description":"'부적절한 관계' 발각돼 퇴진…'미투 열풍' 속 불명예 사임 이어져 실리콘밸리 '거물'들 불륜·외도 잇따라…자리 유지하며 건재한 경우도 '엡스틴 문건'에서 공개된 빌 게이츠가 젊은 여인과 함께 찍은 사진. 성매매 의혹을 불러일으켰다. 로이터 연합뉴스 자료사진. [파이낸셜뉴스]미국 인공지능(AI) 반도체 기업 엔비디아의 젠슨 황 전 최고경영자(CEO) 해임을 계기로 미 대기업 CEO들의 '스캔들'이 다시 조명됐다. 뉴욕타임스(NYT) 등은 12일(현지시간) 컴퓨터·프린터 제조업체 HP와 유명 백화점 체인 콜스의 전직 CEO들이 황 전 CEO와 비슷한 사유로 몰락했다고 전했다. HP를 강력한 기술기업으로 성장시켰던 마크 허드 전 CEO는 2010년 이사회에 의해 해임됐다. 회사 자금 사용 내역을 공개하지 않았으며, 외부 계약업체 관계자와 '친밀한 개인적 관계'를 맺었다는 게 해임 사유였다. 그는 2014년 업무용 소프트웨어 기업 오라클의 공동 CEO로 복귀했다가 2019년 사망했다. 개인적 친분을 바탕으로 HP에서 쫓겨난 허드를 공동 CEO로 초빙했던 오라클의 래리 엘리슨 회장 자신도 과거 복수의 여성 직원과 연애 관계였던 것으로 알려졌다. 다섯차례 이혼을 겪은 이후 현재 부인은 중국 출신이다. 콜스의 애슐리 뷰캐넌도 부적절한 관계로 해임 지난해 콜스의 애슐리 뷰캐넌 전 CEO는 자신의 연인이자 공급업체 관계자에게 사업 거래를 몰아주려 했다가 해임됐다. 같은 해 대형 식료품 체인 크로거의 로드니 맥멀린 전 CEO도 해임됐는데, 발표됐던 사유는 부적절한 '개인적 행동'이었다. 지난 2018년에는 반도체 기업 인텔의 브라이언 크르자니크 전 CEO가 한 직원과 과거 '상호 합의에 따른 관계'를 맺었다는 사실이 드러나자 사임했다. 세계적인 햄버거 체인 맥도날드의 이사회는 2019년 스티브 이스터브룩 전 CEO가 역시 한 직원과 '상호 합의에 따른 관계'를 맺었다면서 그를 해임했다. 이후 맥도날드의 다른 직원도 이스터브룩과 성관계를 맺었다고 신고했고, 그는 사과와 함께 현금 및 주식 약 1억5000만달러를 회사에 반납했다. 인텔과 맥도날드의 CEO들이 불명예 퇴진했던 때는 '미투 열풍'이 불던 시기였다. 이들이 물러나게 된 직접적 계기는 '합의된 관계'였지만, 이스터브룩 전 CEO의 경우 미투 영향도 있었다. 당시 미디어 기업 CBS 코퍼레이션의 레슬리 문베스 CEO는 여러 여성으로부터 성희롱 고발이 이어지자 퇴직금 한 푼","category":"생활·문화"},{"title":"인종차별 당하고 징계까지…박항서, \"김치맨\" 외친 관중에 맞섰다가 2경기 출전 정지","link":"https://n.news.naver.com/mnews/article/014/0005603851","naverLink":"https://n.news.naver.com/mnews/article/014/0005603851","pubDate":"2026-11-13T10:56:12.312760+09:00","author":"네이버뉴스","description":"현지 팬이 자신과 구단 선수를 향해 모욕적인 발언을 하자 주먹을 불끈쥐며 항의하는 박항서 감독. /사진=엑스(X) 캡처, 뉴시스 [파이낸셜뉴스] 태국 프로축구 2부리그 깐짜나부리 파워 FC를 이끄는 박항서 감독이 소속팀 선수와 자신을 향해 인종차별적 언행을 한 관중에게 부적절하게 대응했다는 이유로 출전 정지 징계와 제재금을 부과 받았다. 태국축구협회는 관중의 인종차별을 인정하면서도 \"선수를 보호하려는 행동이었더라도 대응 방식이 부적절했다\"고 판단했다. 12일 연합뉴스에 따르면 태국축구협회는 이날 홈페이지를 통해 지난 10일 징계윤리위원회를 열고 박 감독에게 2경기 출전 정지 및 제재금 1만3333바트(약 53만원)의 징계를 내렸다고 밝혔다. 관련 규정에 따른 기본 제재금은 2만바트(약 79만원)인데, 2부 리그 감경 조항을 적용해 3분의 2의 제재금을 물렸다. 박 감독은 지난 1일 태국 농프리 스타디움에서 열린 파타야 유나이티드와의 2026-27시즌 태국 리그2 9라운드 원정 경기에서 2-2로 비긴 뒤 라커룸으로 향하다 상대 팬으로 보이는 남성과 충돌했다. 이 남성은 박 감독을 향해 \"김치맨\"이라고 조롱하고, 마다가스카르 출신 미드필더 존 바지오의 외모도 비하했다. 박 감독은 처음엔 입술에 손가락을 대며 조용히 하라는 손짓을 했지만, 조롱이 이어지자 주먹을 휘두르는 시늉을 하며 \"아래로 내려와 보라\"고 소리치는 등 강하게 대응했다. 구단 관계자 등이 박 감독을 제지하면서 물리적 충돌로 이어지지는 않았다. 이후 박 감독의 매니지먼트사인 DJ매니지먼트는 \"박 감독은 바지오에게 지속적인 욕설과 외모 비하 발언을 이어간 것에 대해 관중에 항의했다\"며 \"관중은 '원숭이'라는 인종차별적인 표현도 했다\"고 밝혔다. 이어 \"박 감독은 선수에게 가해지는 모욕적인 언행을 직접 목격했고, 이를 중단시키려고 관중에게 항의했다는 내용을 (태국축구협회에 제출한) 소명서에 담았다\"며 \"선수를 보호해야 하는 지도자로서의 책임을 다하고자 했다\"고 설명했다. 그러나 태국협회 징계윤리위원회는 \"선수를 보호하려는 행동 자체는 가능하지만 표현 방식은 적절하고 성숙해야 하며 추가적인 갈등을 일으켜서는 안 된다\"고 판단했다. 이어 \"특히 박 감독은 해당 경기에서 이미 출전 정지 징계를 받은 상태였으므로 경기장 내에서 더욱 신중하게 행동하고 경기 관련 구역에는 있지 말았어야 한다\"고 지적했다. 한편 박 감독에게 인종차별적 발언을 한 관중과 바지오 등 깐","category":"생활·문화"}],"세계":[{"title":"\"민주당 부패 조사 집중\" 트럼프, 밴스의 이란협상 제동…유가 급등","link":"https://n.news.naver.com/mnews/article/008/0005440694","naverLink":"https://n.news.naver.com/mnews/article/008/0005440694","pubDate":"2026-11-13T10:56:12.312817+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령이 11일(현지시간) 미국 버지니아주 알링턴의 알링턴 국립묘지에서 열린 재향군인의 날 기념식에 참석했다/로이터=뉴스1 /사진=(알링턴 로이터=뉴스1) 최종일 선임기자 도널드 트럼프 미국 대통령이 이란과의 협상을 이끌던 JD 밴스 부통령에게 협상 대신 돌연 민주당의 범죄·부패 조사에 집중하라고 지시했다. 트럼프 대통령이 이란과의 합의가 필요 없다고 선언하면서 이날 국제 유가가 다시 급등했다. 12일(현지시간) 월스트리트저널(WSJ)에 따르면 트럼프 대통령은 소셜미디어 트루스소셜에 미네소타, 캘리포니아, 일리노이 등을 꼽으며 \"밴스 부통령이 전적인 관심을 민주당 지역의 막대한 부패와 범죄에 쏟도록 요청했다\"며 이같이 밝혔다. 그는 \"이란과의 합의는 필요 없다\"며 이란의 돈 수천억 달러를 확보했고 해협도 장악하고 있다고 주장했다. 트럼프 대통령의 이란 전략은 2월 전쟁 개시 이후 여러 차례 바뀌었다. 최근에는 공습 재개, 이란 교역 봉쇄 유지, 합의 추진 세 가지를 놓고 고민하다 봉쇄를 강화하면서 밴스 부통령의 협상은 허용하는 쪽을 택했다. 이에 밴스 부통령이 최근 이란 최고국가안보회의 사무총장 모흐센 레자이와 소통 채널을 열고 대면 회담까지 검토하고 있는 중이었다. 트럼프 대통령은 며칠 전까지 참모와 상대국 인사들에게 밴스 부통령이 협상을 재개해도 좋다고 말했고 권한도 줬다. 그러나 곧바로 11일 재향군인의 날 연설에서는 전쟁에서 \"이겼다\"며 완전한 승리가 필요하다고 말했다. 대신 민주당에 부패로 맞불을 놓은 모양새다. 밴스 부통령은 올해 트럼프 대통령이 신설한 사기 근절 태스크포스를 이끌며 이민·의료 분야의 사기 의혹을 조사해왔고, 태스크포스는 정부에서 수천억 달러 규모의 사기를 찾아냈다고 주장한다. 반면 민주당은 트럼프 대통령 재산이 임기 중 급증했고 지난해 암호화폐 사업으로 14억달러를 벌었다며 부패 의혹의 중심으로 정조준했다. 대기업에 백악관 연회장 등 트럼프 대통령 사업 후원을 요구한 것도 조사하겠다고 예고했다. 한편 이날 국제유가는 미국과 이란 간 협상에 대한 기대감이 꺾이면서 급등했다. 런던 ICE 선물거래소에서 브렌트유 1월 인도분 선물은 전장보다 3.30% 오른 배럴당 95.82달러에 거래를 마쳤다. 뉴욕상업거래소에서 12월 인도분 미 서부 텍사스산 원유(WTI) 선물은 전장 대비 2.55% 오른 배럴당 88.74달러로 마감했다.","category":"세계"},{"title":"또 쪼그라든 엔비디아 시가총액…지난달 고점 대비 30% ↓","link":"https://n.news.naver.com/mnews/article/055/0001402763","naverLink":"https://n.news.naver.com/mnews/article/055/0001402763","pubDate":"2026-11-13T10:56:12.312815+09:00","author":"네이버뉴스","description":"▲ 엔비디아 본사 건물 젠슨 황 최고경영자(CEO)가 불륜 스캔들로 전격 퇴진하면서 엔비디아 시가총액이 장중 한때 6천억 달러(약 801조 원) 넘게 증발했습니다. 12일(현지시간) 뉴욕증시에서 엔비디아 주가는 전날보다 4.3% 내린 166.19달러에 거래를 마쳤습니다. 시총은 하루 새 약 1천820억 달러(약 242조 원) 줄어든 약 4조 130억 달러로 집계됐습니다. 시총은 장중 대부분 4조 달러를 밑돌다가 막판 낙폭을 줄이며 4조 달러선을 가까스로 지켰습니다. 엔비디아 시총은 지난해 7월 이후 줄곧 4조 달러를 웃돌았습니다. 이날 황 CEO 사임 소식에 엔비디아 주가는 13.1% 폭락한 151달러로 출발해 장중 148.80달러까지 밀렸습니다. 전날 종가 대비 14.3% 하락한 것으로, 지난해 6월 이후 약 17개월 만의 최저 수준입니다. 이로써 시총이 6천20억 달러(약 801조 원) 줄어든 3조 5천930억 달러까지 쪼그라들며 한때 마이크로소프트(MS)에 밀렸습니다. 하지만 저가 매수세가 몰리며 낙폭을 줄였습니다. 로이터 통신에 따르면 피델리티의 개인투자자 플랫폼에서는 엔비디아 매수 주문이 매도 주문의 5배에 달했습니다. 거래도 폭발했습니다. 이날 오후 초반까지 엔비디아 거래대금은 약 900억 달러로, S&P500 지수 편입 종목 전체 거래대금의 3분의 1에 육박했습니다. 단일 종목 하루 거래대금 역대 최대 기록은 2024년 3월 8일 엔비디아가 세운 1천40억 달러입니다. 종가 기준으로는 시총 2위를 지켰습니다. MS 시총(3조 8천840억 달러)과의 격차는 약 1천290억 달러입니다. 종가는 3월 30일(164.79달러) 이후 7개월여 만의 최저치입니다. 젠슨 황","category":"세계"},{"title":"\"러시아 선수 입국 안 된다\"…북유럽 등서 '비자 장벽'","link":"https://n.news.naver.com/mnews/article/055/0001402769","naverLink":"https://n.news.naver.com/mnews/article/055/0001402769","pubDate":"2026-11-13T10:56:12.312808+09:00","author":"네이버뉴스","description":"▲ 국제빙상연맹(ISU) 로고 러시아 선수들의 국제 스포츠 무대 복귀 움직임에 맞서 서방 국가들이 입국 제한 조치를 강화하고 있습니다. 로이터·AFP 통신 등에 따르면 핀란드 정부는 12일(현지시간) 러시아 국민의 솅겐 비자 소지 여부와 관계없이 핀란드의 국가적 이익에 필수적인 업무를 수행하는 경우에만 입국을 허용한다고 밝혔습니다. 스포츠 활동은 이런 예외에 포함되지 않아 핀란드에서 열리는 스포츠 경기에 러시아 선수들이 출전하는 길이 막혔습니다. 엘리나 발토넨 핀란드 외무장관은 \"러시아의 침략 전쟁이 지속되는 한 러시아 선수들이 핀란드에 들어올 이유는 없다\"며 \"이들의 입국은 핀란드의 국제 관계를 위태롭게 할 수 있다\"고 밝혔습니다. 핀란드 외무부는 오는 16일부터 발효되는 이번 조치가 러시아 국가대표팀 소속 선수뿐 아니라 중립 선수 자격으로 뛰는 선수들에게도 적용된다고 설명했습니다. 이에 따라오는 27∼28일 핀란드 최북단 루카에서 개막하는 크로스컨트리 스키 월드컵에 러시아 선수들은 참가할 수 없게 됐습니다. 내년 3월 핀란드 탐페레에서 열리는 피겨스케이팅 세계선수권대회에도 유력한 메달 경쟁자로 꼽히던 러시아 선수들의 출전이 차단될 전망입니다. 국제빙상연맹(ISU)은 이와 관련해 \"안타깝게도 세계 여러 지역에서 분쟁이 이어지고 있는 상황에서 선수들이 자국 정부의 행위로 인해 처벌받아서는 안 된다는 것이 우리의 입장\"이라고 AP통신에 밝혔습니다. 또 다른 북유럽 국가인 노르웨이 역시 이날 러시아와 그 동맹국 벨라루스 출신 선수들의 자국 내 경기 출전을 막겠다고 밝혔습니다. 노르웨이 정부는 성명에서 러시아·벨라루스 국민에 대한 비자 규정이 이미 엄격하게 적용되고 있다고 설명했습니다. 그러나 최근 국제 스포츠 연맹들이 규제를 완화하면서 두 나라 선수와 지원 인력이 대회 참가를 위해 노르웨이를 방문할 가능성이 커졌다고 지적했습니다. 이에 따라 노르웨이 정부는 출입국 관리 당국과 경찰에 스포츠 대회 참가를 위해 노르웨이를 방문하는 러시아·벨라루스 프로 선수와 지원 인력의 입국을 거부하도록 지시할 것이라고 밝혔습니다. 노르웨이 정부는 러시아 엘리트 스포츠계가 러시아 당국과 밀접한 관계를 맺고 있으므로 우크라이나 전쟁과 분리해서 볼 수 없다면서 강화한 비자 제한 조치가 조만간 발효될 것이라고 덧붙였습니다. 노르웨이는 12월 트론헤임에서 크로스컨트리 스키 월드컵을 개최할 예정입니다. 이번 조치에 따라 국제스키연맹(FIS)의","category":"세계"},{"title":"젠슨 황, 불륜 파문에 엔비디아 CEO 사임…장중 시총 801조원 증발","link":"https://n.news.naver.com/mnews/article/656/0000192298","naverLink":"https://n.news.naver.com/mnews/article/656/0000192298","pubDate":"2026-11-13T10:56:12.312804+09:00","author":"네이버뉴스","description":"젠슨 황 엔비디아 CEO. AFP=연합뉴스 엔비디아 공동 창업자이자 최고경영자(CEO)인 젠슨 황이 33년 만에 경영 일선에서 물러났다. 황 CEO의 갑작스러운 퇴진 소식에 엔비디아 주가는 장중 한때 14% 넘게 폭락키도 했다. 엔비디아 이사회는 12일(현지시간) 성명을 통해 황 CEO가 사장과 최고경영자, 이사회 이사직에서 즉각 사임한다고 밝혔다. 이사회는 전날 회의를 열어 황 CEO의 거취를 논의한 것으로 전해졌다. 이사회는 황 CEO가 회사와 반도체 업계에 막대한 기여를 했다고 평가하면서도 구체적인 사임 배경은 공개하지 않았다. 다만 월스트리트저널(WSJ)과 블룸버그 등 주요 외신은 이번 결정을 사실상 해임으로 해석했다. 엔비디아는 콜레트 크레스 최고재무책임자(CFO) 겸 수석부사장을 임시 CEO로 선임하고 정식 후임자 선임 절차에 착수했다. 후보군은 내부와 외부를 모두 포함해 검토할 예정이다. 2013년 엔비디아에 합류한 크레스 임시 CEO는 시스코와 마이크로소프트 등에서 약 25년간 재무 업무를 담당한 인물이다. 이사회 구조에도 변화가 생겼다. 엔비디아는 창립 이후 처음으로 하비 C. 존스 이사를 이사회 의장으로 선임했다. 시놉시스 CEO 등을 지낸 존스 의장은 1993년 엔비디아 창립 당시부터 이사회에 참여해 왔다. 이번 사태의 배경에는 황 CEO를 둘러싼 잇단 사생활 및 대중국 사업 관련 의혹이 있다. 미국 정보당국이 중국 스파이로 의심하는 싱가포르 기업 메가스피드의 전직 임원 앨리스 황과 황 CEO가 부적절한 관계를 맺었다는 사실이 알려지면서 논란이 불거졌다. 특히 메가스피드가 미국의 대중국 수출 규제를 우회해 엔비디아의 첨단 AI 반도체를 중국으로 반출했다는 의혹으로 미 당국의 조사를 받는 상황에서 황 CEO와 앨리스 황의 관계까지 드러나 파장이 커졌다. 미 의회도 관련 의혹과 트럼프 행정부의 수출 통제 대응을 둘러싼 진상 규명에 나선 것으로 전해졌다. 여기에 황 CEO가 자신에게 직접 보고하는 헬스케어 부문 부사장 킴벌리 파월과도 혼외 관계를 맺었다는 보도가 추가로 나오면서 사태가 급격히 확산했다. 황 CEO는 지난 8일 앨리스 황과의 관계를 인정하고 사과했지만 나흘 만에 CEO 자리에서 물러나게 됐다. 1993년 엔비디아를 공동 창업한 황 CEO는 33년간 회사를 이끌며 세계 AI 반도체 시장의 선두 기업으로 키워냈다. 특유의 검은 가죽 재킷과 자신감 넘치는 언변으로 글로벌 기술업계에서 상징","category":"세계"},{"title":"벤츠마저 독일 공장 투자 중단…폐쇄 카드까지 꺼냈다","link":"https://n.news.naver.com/mnews/article/018/0006409330","naverLink":"https://n.news.naver.com/mnews/article/018/0006409330","pubDate":"2026-11-13T10:56:12.312785+09:00","author":"네이버뉴스","description":"인건비 감축 협상 난항에 추가 투자 전면 중단 폭스바겐 이어 벤츠도 구조조정 압박…노사 갈등 격화 2030년까지 독일 자동차 일자리 20만개 사라질 수도 [이데일리 신수정 기자] 독일 자동차 산업의 위기가 폭스바겐에 이어 메르세데스-벤츠로 번지고 있다. 벤츠가 높은 생산비용과 노사 협상 난항을 이유로 독일 공장에 대한 추가 투자를 전면 중단하고 공장 폐쇄 가능성까지 검토하기 시작했다. 중국 시장에서의 경쟁 심화와 판매 부진에 고비용 구조까지 겹치면서 독일 자동차 산업 전반에 구조조정 압박이 거세지고 있다. 중국 상하이에서 열린 제9회 중국 국제수입박람회(CIIE)의 메르세데스-벤츠 부스에 전시된 로고. (사진=로이터) 12일(현지시간) 로이터통신에 따르면 메르세데스-벤츠 경영진은 최근 직원들에게 공개한 내부 문건을 통해 독일 내 모든 생산시설에 대한 추가 투자를 중단하기로 결정했다고 밝혔다. 노조 및 종업원평의회와 인건비 절감 방안을 놓고 협상을 벌였지만 합의점을 찾지 못한 데 따른 조치다. 미하엘 시베 메르세데스-벤츠 생산담당 이사는 사내 인트라넷에 공개한 인터뷰에서 “경영진은 독일 사업장에 대한 모든 추가 투자를 중단하기로 공동 결정했다”고 밝혔다. 벤츠는 수개월째 독일 생산시설의 비용 절감 방안을 추진하고 있다. 특히 높은 인건비를 낮추기 위해 노동자들에게 근로조건 변경을 요구해 왔지만 독일 최대 금속산업 노조인 IG메탈 등과의 협상은 난항을 겪고 있다. 파이낸셜타임스(FT)에 따르면 회사는 다수 노동자에게 적용되는 주 35시간 근무를 추가 임금 지급 없이 주 40시간으로 늘리는 방안을 제시했다. 사실상 시간당 인건비를 낮추겠다는 구상이지만 노동자 측과 이견을 좁히지 못하고 있다. 경영진은 공장 폐쇄까지 구체적으로 검토하겠다는 입장이다. 브리타 제거 메르세데스-벤츠 이사는 내부 문건에서 “우리 모두 어떤 대가를 치르더라도 공장 폐쇄는 피하고 싶다”면서도 “안타깝게도 이제는 이 선택지를 더욱 구체적으로 검토해야 한다”고 밝혔다. 앞서 시베 이사는 지난 9월 비용 절감 협상에 진전이 없으면 독일 내 공장 두 곳을 폐쇄할 수 있다고 경고했다. 다만 현재까지 실제 폐쇄가 확정된 공장은 없다. 독일 자동차 업계의 위기는 이미 다른 완성차와 부품업체로 확산하고 있다. 유럽 최대 자동차업체 폭스바겐은 창사 이래 최대 규모의 구조조정을 추진하고 있다. 최대 10만명의 일자리가 사라지고 독일 공장 최대 4곳이 폐쇄될 가능","category":"세계"},{"title":"\"일본 갈 돈 미리 바꿔둘까 했는데\"…'너무 흔들려' 전문가들마저 손 뗀 엔화","link":"https://n.news.naver.com/mnews/article/277/0005842179","naverLink":"https://n.news.naver.com/mnews/article/277/0005842179","pubDate":"2026-11-13T10:56:12.312781+09:00","author":"네이버뉴스","description":"엔화, 기관들도 '손절' 강세·약세 재료 충돌 계속 당국 개입에도 방향성 혼조 글로벌 운용사 포지션 축소 엔화의 방향성 예측이 어려워지자 글로벌 자산운용사들이 엔화 거래에서 발을 빼고 있다. 일본은행(BOJ)의 금리 인상 등 엔화 강세 요인과 여전히 큰 미·일 금리차 등 약세 요인이 동시에 작용하면서 시장 혼란이 커지고 있다. 이런 상황 속에서 엔화 흐름을 가늠해온 전통적인 판단 기준마저 제대로 작동하지 않는다는 분석이 나온다. 엔화의 방향성 예측이 어려워지자 글로벌 자산운용사들이 엔화 거래에서 발을 빼고 있다. 게티이미지 13일 블룸버그통신에 따르면 최근 수 개월간 엔화는 달러당 158엔 안팎의 범위에서 움직이다 지난 11일 다시 약세로 돌아서며 160엔 선에 근접했다. 올해 들어 등락을 거듭한 뒤 한동안 안정되는 추세를 보였으나, 다시 흔들리기 시작한 것이다. 블룸버그는 특히 미일 금리차와 엔화 움직임의 상관관계가 크게 약화했다고 지적했다. 통상 두 나라 금리 차이가 벌어지면 저금리의 엔화를 빌려 고금리의 달러 자산을 매수하는 캐리 트레이드가 늘어나면서 엔화 약세 압력이 커진다. 반대로 금리차가 좁혀지면 엔화 강세 요인으로 작용한다. 그러나 BOJ가 1990년 이후 가장 빠른 속도로 금리 인상을 단행하고, 일본 국채 금리도 수십 년 만의 높은 수준으로 올라섰지만, 엔화가 좀처럼 강세로 돌아서지 못하고 있는 상황이 벌어진 것이다. 심지어 당국의 대규모 환율 개입도 흐름을 바꾸는 데 실패했다. 일본 정부는 올해 엔화 방어를 위해 사상 최대인 27조1000억엔( 원)을 투입했다. 그러나 개입 직후 잠시 엔화 가치는 반등하는 듯했으나, 이후 다시 상승분을 반납하는 흐름을 보였다. 원/엔 재정환율이 장중 830원대 초반까지 떨어진 12일 서울 중구 하나은행 위변조대응센터에서 직원이 엔화를 정리하고 있다. 연합뉴스.","category":"세계"},{"title":"우크라 전 당국자 \"北, 올겨울 러 대규모 추가파병 가능성 작아\"","link":"https://n.news.naver.com/mnews/article/001/0016439948","naverLink":"https://n.news.naver.com/mnews/article/001/0016439948","pubDate":"2026-11-13T10:56:12.312777+09:00","author":"네이버뉴스","description":"\"'자제전략'으로 전환…러시아와 현상 유지하되 中에도 다가서기\" 日 전문가 \"대규모 파병 자제, 국내 여건이 더 큰 이유\" 분석도 평양 김일성 광장에 모인 북한군 병사들 [AP=연합뉴스 자료사진. 재판매 및 DB 금지] (서울=연합뉴스) 류미나 기자 = 북한이 올겨울 전쟁을 지원하기 위해 러시아에 대규모 병력을 추가 파병할 가능성은 작다는 우크라이나 전직 고위 당국자의 분석이 나왔다. 12일 미국의 북한 전문 매체 NK뉴스에 따르면 올해 9월까지 우크라이나 국가안보국방위원회 산하 허위정보대응센터장을 지낸 안드리 코발렌코는 이번 주 SNS에 글을 올려 북한군의 대규모 추가 파병 위협이 사실상 해소됐을 가능성이 크다고 밝혔다. 볼로디미르 젤렌스키 우크라이나 대통령은 지난 9월 러시아가 현재 8천명 규모인 북한군 병력에 1만명을 보강하려 한다고 주장했다. 앞서 여름에는 북한군 3만∼5만명이 전쟁에 투입될 수 있다고 경고하기도 했다. 그러나 코발렌코 전 센터장은 이런 \"가장 위험한 시나리오\"가 현실화하지 않았다며 북한이 \"자제 전략\"으로 돌아섰을 가능성을 제기했다. 특히 북한이 우크라이나 동부 격전지인 돈바스 지역 공세에 참여해 '레드 라인'을 넘는 일은 피하려 하는 것이라고 그는 분석했다. 코발렌코 전 센터장은 \"북한은 러시아와의 관계에서 현상을 유지하는 동시에 중국에 다가가고 있다\"며 \"이를 통해 전쟁이 어떻게 끝나든 그 결과에 종속되지 않으면서 러시아와의 동맹에서 이익을 얻을 수 있는 것\"이라고 설명했다. 다만 그는 북한이 여전히 전쟁에서 역할을 하고 있다고 강조했다. 우크라이나에서 자국 무기를 시험하고 러시아에 탄약과 탄도미사일을 공급하며, 실전 경험을 쌓고 있다는 것이다. 반면에 히나타-야마구치 료 일본 도쿄국제대 교수는 북한이 돈바스 투입을 꺼린다기보다 대규모 병력을 보낼 국내 여건이 안 되는 점이 더 큰 이유일 것이라고 분석했다. 히나타-야마구치 교수는 NK뉴스에 \"북한으로서는 그렇게 많은 병력을 보내기가 상당히 까다로운 일이다. 자국군에 많은 부담이 될 것\"이라며 \"병력을 많이 보낸다고 해서 반드시 더 많은 것을 얻어낼 수 있는 것은 아니라고 판단할 수 있다\"고 덧붙였다. 아울러 그는 젤렌스키의 9월 경고가 러시아에 맞선 우크라이나 상황에 국제사회의 관심을 끌려는 의도였을 수 있다며 추가 파병 가능성을 낮게 봤다. 북한은 이번 전쟁에서 러시아에 포대와 탄약, 탄도미사일 등을 제공해왔다. 2024년 가을","category":"세계"},{"title":"두 번의 불륜, 젠슨 황 33년 신화도 무너졌다... 엔비디아 최고 시험대","link":"https://n.news.naver.com/mnews/article/047/0002535695","naverLink":"https://n.news.naver.com/mnews/article/047/0002535695","pubDate":"2026-11-13T10:56:12.312773+09:00","author":"네이버뉴스","description":"중국 스파이 연루·사내 불륜 등 스캔들에 최고경영자 사임 ▲ 2026년 6월 16일, 당시 텍사스주 셔먼에서 코히어런트(Coherent)의 제조 시설 확장 착공식이 시작되기를 기다리고 있는 엔비디아의 젠슨 황 사장 겸 최고경영자(CEO). ⓒ AP/연합뉴스 33년간 엔비디아를 이끌어온 젠슨 황이 중국 스파이 연루 및 사내 불륜 등 잇단 스캔들에 휘말리며 최고경영자(CEO) 자리에서 물러났다. 엔비디아 이사회는 12일(현지시간) 성명을 통해 황 CEO가 사장과 최고경영자, 이사회 이사직에서 즉각 사임한다고 발표했다. 그러면서 콜레스 크레스 최고재무책임자(CFO) 겸 수석부사장을 임시 CEO를 맡고, 1993년부터 이사로 활동한 하비 C. 존스를 이사회 의장으로 선임했다. 크레스 임시 CEO는 정식 후임자가 임명될 때까지 회사를 이끌며, 기존 직책인 수석부사장과 CFO를 겸임한다. 아울러 이사회는 회사 안팎의 후보들을 대상으로 정식 CEO 선임 절차에 착수했다. 엔비디아 '임시 사령탑' 크레스는 누구? ▲ 임시 CEO를 맡게 된 엔비디아의 콜레스 크레스 최고재무책임자(CFO) 겸 수석부사장 (엔비디아 제공) ⓒ 로이터/연합뉴스","category":"세계"},{"title":"불명예 퇴진인데도 “우상이 떠났다” 직원들은 울고 본사엔 꽃다발…엔비디아 ‘초상집’ 분위기","link":"https://n.news.naver.com/mnews/article/011/0004681791","naverLink":"https://n.news.naver.com/mnews/article/011/0004681791","pubDate":"2026-11-13T10:56:12.312772+09:00","author":"네이버뉴스","description":"꽃다발과 양초가 놓인 엔비디아 본사. AFP 연합뉴스 33년간 엔비디아를 이끈 창업자 젠슨 황이 최고경영자(CEO) 자리에서 물러나자 미국 실리콘밸리가 충격에 빠졌다. 엔비디아 본사 앞에는 꽃다발과 양초가 놓였고, 일부 직원은 눈물을 흘렸다. 인공지능(AI) 업계 주요 인사들도 젠슨 황의 퇴진을 미국 기술산업의 큰 손실로 평가하며 잇따라 송별 메시지를 전했다. 12일(현지시간) CNBC 등 외신에 따르면 황의 사임 소식이 전해진 뒤 미국 캘리포니아주 샌타클래라 엔비디아 본사 앞에 꽃다발과 양초가 놓였다. 엔비디아는 이날 젠슨 황이 CEO, 사장, 이사회 이사직에서 즉시 물러난다고 발표했다. 후임자가 정해질 때까지는 콜레트 크레스 최고재무책임자(CFO)가 임시 CEO를 맡는다. 젠슨 황은 최근 불거진 사생활 논란과 중국 정보기관 연계 의혹을 받는 인물과의 관계를 둘러싼 파문 속에 회사를 떠나게 됐다. 다만 엔비디아는 구체적인 사임 사유는 밝히지 않았다. 본사 앞엔 꽃다발·양초…직원들은 눈물 엔비디아 내부도 충격에 휩싸였다. CNBC에 따르면 일부 직원은 사임 소식을 듣고 눈물을 흘렸다. 익명의 소식통은 많은 직원이 젠슨 황을 우상처럼 여겼고, 그를 엔비디아의 정체성을 이루는 핵심 인물로 받아들여 왔다고 전했다. 젠슨 황은 1993년 엔비디아를 공동 창업한 뒤 33년 동안 회사를 이끌며 그래픽처리장치(GPU) 업체였던 엔비디아를 AI 산업의 핵심 기업으로 키웠다. 약 60명의 임원에게 직접 보고받는 독특한 경영 방식으로도 유명했다. 기술 개발부터 사업 전략까지 주요 의사결정에 폭넓게 관여했고, 블룸버그에 따르면 사무실 구조와 조직 운영 방식도 주요 결정이 그에게 집중되도록 짜여 있었다. 이 때문에 갑작스러운 퇴진이 경영 공백으로 이어질 수 있다는 우려가 나온다. 엔비디아가 뚜렷한 후계자 없이 오랫동안 창업자 중심 체제를 유지해 왔기 때문이다. 이사회는 크레스 임시 CEO를 중심으로 사업 연속성을 확보하면서 내·외부 후보를 모두 검토해 정식 후임자를 찾을 계획이다. 꽃다발이 놓인 엔비디아 본사. AFP 연합뉴스","category":"세계"},{"title":"\"이재명 두 아들 군 면제\" 허위글...이수정 2심도 '피선거권 박탈형'","link":"https://n.news.naver.com/mnews/article/437/0000520423","naverLink":"https://n.news.naver.com/mnews/article/437/0000520423","pubDate":"2026-11-13T10:56:11.743655+09:00","author":"네이버뉴스","description":"〈사진=연합뉴스〉 이수정 국민의힘 수원정 당협위원장이 공직선거법과 정보통신망법 위반 혐의 사건 항소심에서도 벌금 300만원을 선고받았습니다. 21대 대선 과정에서 이재명 당시 더불어민주당 대선 후보의 두 아들이 군 면제를 받았다는 내용의 허위 글을 올린 혐의입니다. 수원고법 형사14부는 오늘(12일) 공직선거법상 허위사실 공표와 후보자 비방, 정보통신망법상 명예훼손 혐의로 기소된 이 위원장의 항소를 기각하고 원심을 유지했습니다. 공직선거법상 벌금 100만원 이상의 형이 확정되면 확정일부터 5년 동안 선거에 출마할 수 없습니다. 항소심 재판부는 \"피고인은 글의 내용이 허위일 수 있다는 미필적인 인식을 가지고 있는 상태에서 게시했던 것으로 보인다\"며 \"당시 이재명 후보의 당선을 막기 위한 고의가 있었다고 보는 게 타당하다\"고 밝혔습니다. 또 이 위원장이 선거관리위원회 홈페이지 등을 통해 글의 진위를 쉽게 확인할 수 있었는데도, 사실 여부를 확인하려는 노력을 충분히 하지 않았다고 지적했습니다. 원심의 형이 지나치게 무겁다는 이 위원장의 주장도 받아들이지 않았습니다. 항소심 재판부는 공직선거법상 낙선 목적의 허위사실 공표죄는 벌금형 하한이 500만원이라며 \"원심은 피고인에게 유리한 정상을 고려해 (하한보다) 가벼운 형을 선고했다\"고 설명했습니다. 이 위원장은 이날 선고 후 \"글을 올릴 당시 제 인식이 불분명했던 건 틀림이 없어 삭제한 뒤 사과를 세 번에 걸쳐서 했다. 그런데도 아쉬운 판결이 나왔다\"며 \"상고 여부와 관련해서는 변호인과 논의할 것\"이라는 입장을 밝혔습니다. 앞서 이 위원장은 대선 기간인 지난해 5월 28일 이재명 당시 민주당 대선 후보를 겨냥해 두 아들이 모두 군대 면제를 받았다는 허위 글을 소셜미디어에 올린 바 있습니다. 아들들의 면제 사유로 제시한 부분도 모두 사실무근이었습니다. 실제로 이 대통령의 두 아들은 모두 공군 병장으로 만기 전역했습니다. 논란이 일자 이 위원장은 몇 분 만에 게시물을 삭제했습니다. 그러면서 \"온라인에 떠도는 정보를 10초 정도 공유했다가 잘못된 정보임을 확인하고 즉시 삭제한 일\"이라며 \"너른 마음으로 용서해 달라\"고 해명했습니다. 하지만 민주당은 \"게시물을 내렸더라도 명백한 허위사실 유포\"라며 이 위원장을 공직선거법과 정보통신망법 위반 혐의로 고발했고, 이 위원장은 재판에 넘겨졌습니다. 공소청은 1심에서 벌금 500만원을 구형했습니다. 1심 재판부는 해당 게시글이 유권자의","category":"세계"}],"IT 과학":[{"title":"[르포] 옷 사 입히는 AI 로봇…日 AI 반려로봇 '러봇', 매장서 직접 만나보니","link":"https://n.news.naver.com/mnews/article/138/0002248379","naverLink":"https://n.news.naver.com/mnews/article/138/0002248379","pubDate":"2026-11-13T10:56:12.861336+09:00","author":"네이버뉴스","description":"본체 59만9500엔에 월 서비스료 별도…로봇용 옷도 8000엔부터 본체만 500만원에 월 이용료 별도…5년 최소 약 995만원 한국은 어르신 감성 돌봄이 로봇 ‘효돌’…IP 강국 日 시장서 AI반려봇 주목 일본 도쿄 지요다구 러봇(LOVOT) 스토어에 전시돼 있는 러봇의 모습[영=디지털데일리 오병훈기자] [도쿄(일본)=디지털데일리 오병훈기자] “오이데~ 오이데~(이리 와, 이리 와).” 13일 일본 도쿄 지요다구에 위치한 ‘러봇(LOVOT) 스토어’. 매장 직원이 일본어로 “이리 와”라고 부르자 매장 안을 돌아다니던 작은 AI 로봇이 곧장 방향을 틀었다. 통통한 몸을 흔들며 다가온 로봇은 동그란 눈으로 방문한 기자를 바라봤다. 기분 좋은 듯 눈매를 바꾸는 모습에 절로 웃음이 나왔다. 처음 눈에 들어오는 것은 두툼한 덩치였다. 온라인 소셜미디어 이미지로 볼 때는 봉제인형처럼 작을 줄 알았지만 최신형 ‘러봇 3.0’은 높이가 약 45㎝, 무게 약 4.6㎏에 달한다. 몸집이 크다고 귀여움이 줄어드는 것은 아니었다. 펭귄처럼 몸집에 비해 짧은 팔을 들었다 내리고, 뒤뚱뒤뚱 방향을 바꿔 움직이는 모습은 아장아장 걷는 어린아이를 연상케 했다. 러봇은 사람처럼 문장을 주고받는 대화형 챗봇이라기보다 이름이나 ‘오이데’, 인사 등 특정 말소리를 알아듣고 몸짓으로 반응하는 로봇이었다. 손을 뻗어 몸을 부드럽게 쓰다듬자 눈 모양이 달라지고, 몸을 움직이며 기분 좋은 표정을 짓는 듯했다. 보드라운 촉감에 더해 러봇의 반응을 보고 있자니 반려동물을 쓰다듬을 때와 비슷한 만족감이 들었다. 러봇은 일본 로봇 개발 기업 그루브엑스(GROOVE X)가 선보인 정서 교감형 인공지능(AI) 반려 로봇이다. 러봇의 모습[사진=디지털데일리 오병훈기자]","category":"IT 과학"},{"title":"젠슨 황 퇴장, '깐부 동맹' 앞날은… 美 대중 반도체 규제 변수","link":"https://n.news.naver.com/mnews/article/469/0000965350","naverLink":"https://n.news.naver.com/mnews/article/469/0000965350","pubDate":"2026-11-13T10:56:12.861327+09:00","author":"네이버뉴스","description":"GPU 26만장, AI 팩토리 협력… 후속 일정 주목 美 의회 수출통제 3법 추진… 점검할 상황 늘어 중국 추격 지연은 기회... 中 사업엔 부담 가능성 젠슨 황 전 엔비디아 최고경영자(CEO)가 1월 미국 네바다주 라스베이거스에서 열린 엔비디아 라이브 행사에 참석해 있다. 라스베이거스=AFP 연합뉴스 중국 정보기관과의 연계 의혹을 받는 여성과 불륜 관계를 시인한 젠슨 황 엔비디아 최고경영자(CEO)가 결국 사퇴했다. 엔비디아의 '심장'이었던 젠슨 황과 국내 기업 간 구축된 인공지능(AI) 협력 사업에 불확실성이 커졌다. 미국 의회의 대중국 반도체 수출통제 강화 움직임까지 겹치면서 국내 기업들의 후속 기술 협력부터 중국 공장의 장비 반입까지 점검해야 할 변수가 늘었다. 12일 테크업계에 따르면 엔비디아와 한국 기업들 관계는 '깐부 동맹'으로 불릴 정도로 돈독했다. 삼성전자와 SK하이닉스가 AI 시대 전략물자 격인 고대역폭메모리(HBM)를 엔비디아에 공급 중이고, 지난해 10월 한국 정부와 기업들은 엔비디아 그래픽처리장치(GPU) 26만 장 이상을 도입하는 협력 계획을 발표했다. 깐부 동맹의 협력 범위는 반도체 연구개발과 생산, AI 팩토리, 자율주행·로봇, 소버린(주권) AI 인프라까지 광범위하다. 문제는 협력 계획 대부분을 엔비디아에선 젠슨 황이 직접 지휘했다는 점이다. 그가 없는 새 경영 체제에서도 같은 일정과 우선순위로 추진될지 알 수 없다. 기존 GPU 계약의 이행뿐 아니라 추가 GPU 도입, 신규 투자와 공동 개발 등 협력의 모든 내용이 점검 대상이다. 일각에서는 엔비디아 리더십 교체가 당장 기존 계획의 변경으로 이어지진 않을 걸로 내다본다. 12일 서울 강남구 엔비디아 코리아 사무실에서 직원이 오가고 있다. 뉴스1","category":"IT 과학"},{"title":"AI안경 불법촬용 어떻게 막나…구글이 내놓은 해법은[모닝폰]","link":"https://n.news.naver.com/mnews/article/018/0006409237","naverLink":"https://n.news.naver.com/mnews/article/018/0006409237","pubDate":"2026-11-13T10:56:12.861326+09:00","author":"네이버뉴스","description":"촬영등 가리면 카메라 차단…행인 얼굴 자동 가림 영상정보 AI 학습·광고 금지…저장·전송 때 암호화 구글플레이 실시간 얼굴인식 금지…위반시 이용 제한 (구글 제공) [이데일리 한광범 기자] 시험 문제를 몰래 확인해 답을 얻고, 상대방 모르게 영상을 촬영하는 데까지 악용되는 인공지능(AI) 안경. 편리한 신기술이라는 기대 못지않게 사생활 침해와 부정행위에 대한 우려가 커지자 구글이 촬영 표시등을 가리면 카메라를 차단하고 주변 사람의 얼굴을 자동으로 가리는 등 구체적인 보호 기술을 공개했다. 기기 자체의 안전장치뿐 아니라 앱과 서비스 이용을 제한하는 방식까지 동원한다. 구글은 12일 샤람 이자디 안드로이드 XR 부사장 명의의 공식 블로그를 통해 ‘인텔리전트 아이웨어의 개인정보 보호 설계 원칙’을 발표했다. 삼성전자·젠틀몬스터·워비파커와 협력해 개발한 AI안경의 개인정보 보호 기능과 오남용 방지 정책을 상세히 설명한 것이다. 이번 발표는 AI안경을 둘러싼 사회적 논란이 확산하는 가운데 나왔다. 교육부가 지난 9일 발표한 조사 결과에 따르면 올해 국내 중·고교 시험에서 AI안경을 활용한 부정행위 4건이 적발됐다. 서울에서는 AI안경을 이용해 데이트 상대를 몰래 촬영하고 영상을 소셜미디어에 게시한 혐의로 경찰 수사가 진행되기도 했다. 구글은 스마트 안경에 대한 우려가 착용자뿐 아니라 주변 사람들에게서도 나온다는 점을 인정했다. 안경을 쓴 사람은 일상적인 사용의 편리함을 고민하지만, 주변 사람은 자신도 모르게 촬영될 수 있다는 점을 걱정한다는 것이다. 촬영등 가리면 센서가 감지…AI 전송 전 행인 얼굴 차단 가장 직접적인 보호 기능은 촬영 알림 표시등이다. 안경으로 사진이나 영상을 촬영하면 외부 LED가 켜져 주변 사람에게 촬영 사실을 알린다. 단순히 표시등을 설치하는 데 그치지 않고 이를 고의로 가리는 행위에도 대응하도록 설계했다. 표시등이 가려지거나 훼손·조작되면 내장된 센서가 즉각 감지해 사진과 영상 촬영을 차단한다. 촬영 사실을 숨기기 위해 표시등을 가리는 방식의 오남용을 막겠다는 취지다. 카메라가 인식하는 사람의 얼굴정보도 보호 대상이다. 이용자가 주변 사물에 관해 제미나이에게 질문하는 과정에서 행인이 함께 촬영되더라도 AI가 영상을 처리하기 전에 주변인의 얼굴을 자동으로 가림 처리한다. 얼굴정보가 포함된 영상을 그대로 AI에 전달하지 않도록 설계한 것이다. 제미나이가 인식한 시각정보는 이용자의 제미나이 활동 기","category":"IT 과학"},{"title":"[포스트 젠슨 황] 엔비디아 성장세 이어질까...국내 반도체 공급망도 주목","link":"https://n.news.naver.com/mnews/article/092/0002445121","naverLink":"https://n.news.naver.com/mnews/article/092/0002445121","pubDate":"2026-11-13T10:56:12.861324+09:00","author":"네이버뉴스","description":"② SK하이닉스·삼성전자 HBM 로드맵도 영향 엔비디아 이사회가 창업자이자 33년간 최고경영자(CEO)로 재직한 젠슨 황을 경질하고 콜렛 크레스 최고재무책임자(CFO)를 임시 CEO로 삼아 사태 진화에 나섰다. 콜렛 크레스 임시 CEO 체제의 경영 정상화 과제, 엔비디아의 향후 사업 전망과 국내 반도체 산업에 미칠 영향, 차기 CEO 후보군과 후계 구도 등을 살펴본다. [편집자 주] 최근 엔비디아의 성장 동력은 AI 모델 학습과 추론을 위한 GPU 수요다. 글로벌 클라우드 사업자와 AI 기업들은 대규모 데이터센터를 구축하고 있으며, 기업과 각국 정부도 자체 AI 인프라 확보에 나서고 있다. 엔비디아 2분기 매출은 962억 2100만 달러(약 133조 1600억원)로 전년 동기(467억 4300만 달러, 약 64조 6900억원) 대비 두 배 이상 늘어났다. 전체 매출 중 상당수가 데이터센터에서 나온다. 컴퓨텍스 2025 기간 중 열린 'GTC 타이베이' 기조연설에서 'AI 인프라' 개념을 설명하는 젠슨 황 엔비디아 CEO. (사진=지디넷코리아) 엔비디아는 GPU 성능 향상과 차세대 제품 출시, 소프트웨어 생태계 확장, 대규모 공급망 투자를 동시에 추진해왔다. 관건은 경영진 교체 이후에도 기존 성장 전략이 차질 없이 이어질 수 있느냐다. 엔비디아 AI 가속기 핵심부품 공급망, 그대로 유지될까 국내 산업계가 이번 사태를 주목하는 가장 큰 이유는 엔비디아와 한국 반도체 기업 간의 밀접한 공급망 관계 때문이다. 젠슨 황 엔비디아 CEO는 HBM 관련 전시물에 총 3개 서명을 남겼다. (사진=지디넷코리아)","category":"IT 과학"},{"title":"[기획-에이텍솔루션 신공장 준공]12인치 웨이퍼 재생 기술 고도화…HBM 핵심 공정까지 사업 확대","link":"https://n.news.naver.com/mnews/article/030/0003485263","naverLink":"https://n.news.naver.com/mnews/article/030/0003485263","pubDate":"2026-11-13T10:56:12.861320+09:00","author":"네이버뉴스","description":"국내 유일 300㎜ 웨이퍼 전공정 재생 역량 확보…19나노급 초정밀 품질 대응 아산 신공장에 HBM 캐리어 웨이퍼 전용 라인 구축…2028년 월 18만장 생산 목표 나노세정·유량제어장치·실리콘 부품으로 사업 다각화…반도체 공급망 경쟁력 강화 반도체 제조공정의 미세화와 고대역폭메모리(HBM) 생산 확대에 따라 웨이퍼 재생과 초정밀 부품 관리 기술의 중요성이 커지고 있다. 미세한 입자와 오염물도 반도체 수율에 영향을 미치는 만큼 웨이퍼를 신품에 가까운 품질로 복원하고 공정 부품의 청정도를 유지하는 기술이 핵심 경쟁력으로 떠오르고 있다. 에이텍솔루션은 12인치(300㎜) 웨이퍼 재생 기술을 중심으로 나노세정, 가스 유량제어장치(MFC), 실리콘 부품 등으로 사업 영역을 확대하며 반도체 공정 전문기업으로 성장하고 있다. 에이텍솔루션의 주요 사업 영역. 재생 웨이퍼, 나노 세정, MFC, 실리콘 부품을 공급한다. 2009년 반도체 소자·장비 업계 출신 경영진이 설립한 에이텍솔루션은 일본 히타치금속 AERA의 MFC 국내 대리점 사업으로 출발했다. 2011년 삼성전자 메모리 반도체 부품 세정사업에 진출했고 2014년 웨이퍼 재생사업을 시작했다. 이후 2019년 삼성전자, 2020년 SK하이닉스에 재생 웨이퍼를 공급하며 사업 기반을 확대했다. 2021년에는 아산공장을 준공하고 반도체 식각 공정용 실리콘 부품으로 영역을 넓혔다. 국내 유일 12인치 웨이퍼 전공정 재생 기술 확보 회사의 핵심 경쟁력은 국내에서 유일하게 확보한 12인치 웨이퍼 전공정 재생 기술이다. 웨이퍼 재생은 반도체 제조공정에서 사용한 웨이퍼의 박막과 오염물을 제거하고 연마·세정·검사 과정을 거쳐 다시 사용할 수 있도록 복원하는 기술이다. 반도체 제조사는 장비 상태와 공정 조건을 점검하기 위해 모니터링 웨이퍼를 사용하는데, 이를 반복 재생하면 원가를 크게 낮출 수 있다. 에이텍솔루션에 따르면 300㎜ 신품 테스트 웨이퍼 가격은 장당 약 60달러인 반면 재생 웨이퍼는 20~25달러 수준이다. 신품을 사용하는 것보다 비용을 60% 이상 절감할 수 있다는 설명이다. 재생 기술의 핵심은 웨이퍼 표면을 손상시키지 않으면서 불필요한 막질과 오염물을 제거하고 평탄도와 청정도를 회복하는 데 있다. 300㎜ 웨이퍼 공정. 랩핑·양면연마·CMP·세정·검사로 이어지는 가공 공정이 에이텍솔루션의 핵심 역량이다.","category":"IT 과학"},{"title":"네이버, AI 팩토리·물류·개인형 AI 에이전트로 '새 엔진' 시동","link":"https://n.news.naver.com/mnews/article/092/0002445123","naverLink":"https://n.news.naver.com/mnews/article/092/0002445123","pubDate":"2026-11-13T10:56:12.861315+09:00","author":"네이버뉴스","description":"AI 팩토리 사업 본격화·물류 전문 자회사 설립 추진·개인형 AI 에이전트 앱 출시 6분기 연속 매출 상승을 이룬 네이버가 연말에도 숨 가쁜 신사업 행보를 이어간다. 엔비디아·브룩필드와 손잡고 추진하는 글로벌 AI 팩토리 사업이 본격 실행 단계에 진입한 데 이어, 물류 전문 자회사 설립과 개인형 AI 에이전트 앱 출시까지 예고하며 미래 성장동력 확보에 속도를 내는 모습이다. 특히 이번 신사업들은 기존 검색·광고·커머스 중심의 사업 구조를 넘어 AI 인프라와 물류, 개인형 AI 서비스 등으로 사업 영역을 확장한다는 점에서 주목된다. 안정적인 수익 기반을 갖춘 기존 사업의 경쟁력을 강화하는 동시에 새로운 시장에서 중장기 성장 기회를 확보하겠다는 전략으로 풀이된다. 네이버 1784 본궤도 오르는 AI 팩토리 사업…첫 고객부터 빠르게 확보 가장 눈에 띄는 행보는 글로벌 AI 팩토리 사업이다. 네이버는 최근 브룩필드와 최대 90억 달러 규모의 컴퓨팅 인프라 확보 계약을 체결하고, 엔비디아의 약 10억 달러 규모 전략적 지분 투자까지 마무리하며 사업 추진을 위한 핵심 기반을 마련한 데 이어 초기 고객 확보까지 빠르게 마무리 지었다. 네이버는 12일 최근 미국 AI 추론 기업과 차세대 GPU를 포함한 약 2조원 규모의 컴퓨팅 서비스 공급 계약을 체결했다고 밝혔다. 이를 통해 2027년 초기 공급 물량에 대한 고객을 확보했으며, 내년 상반기 상용 서비스 개시와 함께 본격적인 매출 발생도 기대하고 있다. 이와 관련해 최수연 대표는 \"대형 고객과의 중장기 계약을 추진하는 동시에 성장 잠재력이 높은 글로벌 AI 기업으로 고객 기반을 확대해 안정성뿐만 아니라 높은 수익성을 함께 확보해 나갈 계획\"이라고 강조했다. 지난 9월3일 경기도 성남시에 위치한 네이버 1784를 방문한 브루스 플랫 브룩필드 코퍼레이션 회장과 박준우 브룩필드코리아 대표가 이해진 네이버 의장, 최수연 네이버 CEO와 글로벌 AI 팩토리 구축 사업에 대한 후속 논의를 진행했다. (사진=네이버)","category":"IT 과학"},{"title":"\"소용돌이치는 구름 뚫고 빼꼼\"…우주서 포착한 러시아 활화산","link":"https://n.news.naver.com/mnews/article/092/0002445124","naverLink":"https://n.news.naver.com/mnews/article/092/0002445124","pubDate":"2026-11-13T10:56:12.861311+09:00","author":"네이버뉴스","description":"[우주서 본 지구] ISS 우주비행사가 촬영한 알라이드 화산 소용돌이치는 두꺼운 구름 위로 러시아의 활화산이 우뚝 솟아 있는 모습이 국제우주정거장(ISS) 우주비행사의 카메라에 포착돼 관심을 모으고 있다. 과학매체 라이브사이언스는 쿠릴 열도 상공의 짙은 구름 사이로 모습을 드러낸 러시아 화산의 사진을 재조명해 최근 보도했다. 사진 속 화산은 쿠릴 열도의 최북단 섬인 아틀라소프 섬에 위치한 알라이드 화산이다. 쿠릴 열도는 러시아와 일본 사이 오호츠크해를 가로지르는 화산대에 자리한 약 50개의 섬으로 이루어져 있는 곳으로, 아틀라소프 섬은 활발한 화산 활동으로 유명한 러시아 캄차카반도에서 약 65㎞ 떨어져 있다. ISS에 탑승한 우주비행사가 러시아 아틀라소프 섬 상공의 두꺼운 구름층 위로 솟아오른 알라이드 화산의 모습을 사진에 담았다. (제공= NASA/ISS 프로그램) 아틀라소프 섬은 사실상 알라이드라는 거대한 화산 하나로 이루어져 있다. 원뿔형 화산인 알라이드는 해발 2285m로 쿠릴 열도에서 가장 높은 봉우리다. 스미스소니언협회 세계화산프로그램(GVP)에 따르면, 알라이드 화산은 지난 50년간 최소 9차례 분화했다. 1981년 4월에는 짙은 연기와 화산재 기둥을 대기 중으로 약 2000㎞까지 뻗어 올리는 대규모 분화를 일으켰다. 가장 최근의 분화는 2022년 9~11월 사이 발생했으며, 당시 용암이 화산 측면을 따라 강물처럼 흘러내렸다. 위 사진은 2019년 8월 ISS 우주비행사가 촬영한 것이다. 사진에는 아틀라소프 섬의 절반 가량이 낮게 깔린 소용돌이 모양의 두꺼운 구름 위로 솟아 있는 모습이 담겼다. 지름 약 1.6㎞에 달하는 칼데라가 있는 알라이드 화산 정상은 구름에 가려 보이지 않는다. 사진 촬영 당시 화산은 분화하지 않은 상태였다. 화산 측면 아래쪽에는 과거 분화 때 흘러내린 용암으로 형성된 골짜기들이 이어져 있으며, 이들 골짜기는 눈으로 뒤덮여 있다. 알라이드 화산은 2022년 11월에 마지막으로 분화했다. 이 사진은 구름에 가려지지 않은 아틀라소프 섬의 모습을 보여준다. (제공=Pierre Markuse, Copernicus Sentinel 데이터, 위키미디어)","category":"IT 과학"},{"title":"SFA, 3분기 영업익 전년비 17.2% ↓…\"반도체 기반 고수익 수주 확대\"","link":"https://n.news.naver.com/mnews/article/092/0002445134","naverLink":"https://n.news.naver.com/mnews/article/092/0002445134","pubDate":"2026-11-13T10:56:12.861306+09:00","author":"네이버뉴스","description":"영업이익률 개선세…연간 수주 목표 유지 SFA(대표 김상경)는 올해 3분기 연결기준 매출 4302억원, 영업이익 221억원을 거뒀다고 지난 12일 밝혔다. 전년 동기 대비 매출은 9.2% 증가했고 영업이익은 17.2% 감소했다. 별도기준으로는 매출액 1923억원, 영업이익 266억원을 기록했다. 특히 분기 매출총이익률이 21.7%로 전년 동기 대비 3.2%p 개선돼 2022년 이래 최고 수준을 기록했다고 강조했다. 1분기 18.8%, 2분기 21.4%에 이어 상승 추세가 지속되는 점도 언급했다. 마찬가지로 영업이익률도 매분기 개선됐다고 덧붙였다. SFA 전경 (사진=SFA) 이에 대해 SFA는 수익성 중심의 체질 개선이 이뤄지고 있고, 반도체를 중심으로 한 고부가가치 수주가 빠르게 늘었다고 분석했다. 4분기 이후 고부가 수주 비중 증가 및 올해 수주 모멘텀의 매출액 전환이 본격화되면 매출액 성장은 물론 고정비 분산 효과에 따라 큰 폭의 수익성 개선을 이룰 것으로도 기대했다. SFA 관계자는 “AI 로보틱스 기술 기반 고부가가치 품목 확대와 원가 경쟁력 강화 노력의 성과가 수익성 지표의 기초 체력이라 할 수 있는 매출총이익률 개선으로 현실화되는 상황”이라고 말했다. 향후 매출액 선행지표인 수주액은 누적 6435억원(해외법인 포함)으로 집계됐다. 상반기 수주액은 5079억원, 3분기의 수주액은 1356억원이다. SFA 관계자는 “상반기 전체 수주액의 13.6%에 그쳤던 반도체 산업의 수주 비중은 3분기 들어 56.9%까지 크게 상승했다”며 “반도체 산업 부문 수주 확대와 더불어 반도체 산업을 중심으로 회사의 수주 포트폴리오가 빠르게 확대되고 있는 것”으로 분석했다. 이어 “PO 미수취 수주건이 집계에서 제외됨에 따라 3분기 수주액이 다소 낮게 나타났으나, 반도체 OSAT 및 반도체 패키지 밸류체인 고객사 등으로부터 대규모 수주를 확보하면서 반도체 산업부문의 수주 성장세가 본격화되고 있다”며, “이들 수주 건을 포함한 실질적인 확정 수주 규모는 공표 수주액인 1356억원을 크게 상회하는 수준”이라고 설명했다. 회사는 반도체 산업부문의 가파른 성장과 유통·일반제조 부문의 견조한 수주 모멘텀을 바탕으로 기존에 제시한 연간 수주 목표 1조 3000억원을 유지했다. SFA 관계자는 “SFA반도체의 경우, 신규 라인 본격 가동에 따라 조만간 획기적인 실적 개선이 예상되고 유럽 시장을 중심으로 이차전지 완성차 캐즘의 해소 및","category":"IT 과학"},{"title":"엔비디아 떠난 'AI 깐부' 젠슨 황…네이버 'AI 공장' GPU 확보 순항할까","link":"https://n.news.naver.com/mnews/article/003/0014320138","naverLink":"https://n.news.naver.com/mnews/article/003/0014320138","pubDate":"2026-11-13T10:56:12.861297+09:00","author":"네이버뉴스","description":"젠슨 황 사임 후폭풍…네이버 AI 서버 수급 차질 여부 촉각 네이버 신주 대금 1.3조 납입 완료·1년 보호예수 적용…당장 영향 제한적 엔비디아 \"고객과 약속·제품 일정 차질 없을 것\"…18일 새 경영진 첫 실적 발표 분수령 [라스베이거스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 5일(현지 시간) 미 네바다주 라스베이거스 퐁텐블로 호텔에서 세계 최대 IT·전자 전시회 'CES 2026' 개막을 앞두고 열린 엔비디아 라이브에서 차세대 그래픽 처리장치 루빈 GPU와 중앙처리장치 베라 CPU를 들어 보이고 있다. 2026.01.06. [서울=뉴시스]윤정민 기자 = 젠슨 황 엔비디아 최고경영자(CEO)가 물러나면서 네이버가 인공지능(AI) 팩토리 사업에 필요한 AI 서버를 제때 확보할 수 있을지 주목된다. 엔비디아 경영진 교체 이후 최신 그래픽처리장치(GPU) 공급 일정이나 배정 물량이 달라지면, 네이버의 상용 서비스 시작과 설비 증설 계획에도 영향을 줄 수 있기 때문이다. 하지만 엔비디아가 기존 고객과 맺은 약속과 신제품 출시 일정을 차질 없이 이어가겠다고 못 박은 만큼, 네이버 사업이 당장 흔들릴 가능성은 작다는 분석이 우세하다. 엔비디아는 12일(현지 시간) 젠슨 황이 CEO와 이사직에서 물러났다고 밝혔다. 'AI 공장' 짓고 지분 투자까지…엔비디아의 아시아 협력 거점 된 네이버 [성남=뉴시스] 권창회 기자 = 이해진(오른쪽) 네이버 의장과 젠슨황 엔비디아 CEO가 8일 경기 성남 네이버1784 사옥에서 네이버 웹툰에 자막을 넣은 뒤 기념촬영을 하고 있다. 2026.06.08. kch0523@newsis.com","category":"IT 과학"},{"title":"앨리스 황, 남편 소유 투자회사 통해 화웨이 데이터센터에도 지분","link":"https://n.news.naver.com/mnews/article/023/0004009431","naverLink":"https://n.news.naver.com/mnews/article/023/0004009431","pubDate":"2026-11-13T10:56:12.861293+09:00","author":"네이버뉴스","description":"3줄 요약 ㆍ 상하이 허시 통해 룽텅 지분 27% 인수 ㆍ 사업 파트너 화퉁 그룹 엔비디아 반도체 구매 ㆍ 첨단 기술 유출 방지 차원 조사 필요 젠슨황이 과거 자신의 SNS에 공유했다며 소셜미디어에서 회자되는 엘리스 황과 촬영한 사진 / X 젠슨 황 전 엔비디아 최고경영자(CEO)와 내연 관계였던 앨리스 황(중국명 황러)이 중국 화웨이에 연산 자원을 제공하는 데이터센터에도 간접적으로 지분을 보유했던 것으로 나타났다. 앨리스 황이 미국의 수출 제한 대상인 엔비디아 인공지능(AI) 반도체를 중국에 우회 공급하는 데 관여했다는 의혹에 이어, 중국의 대표적인 AI 반도체 기업인 화웨이와 사업상 연결 고리까지 드러난 것이다. 12일(현지 시각) 미국 CNBC는 민간 정보 분석 업체 테사리의 조사 결과를 인용해 앨리스 황이 남편으로 알려진 캉웨이와 공동 소유한 투자 회사 ‘상하이 허시’를 통해 화웨이 관련 데이터센터에 간접 투자했다고 보도했다. 허시는 2021년 중국 데이터센터 개발 업체 ‘상하이 센추리 룽텅’ 지분 27%를 인수해 2024년까지 보유했다. 룽텅은 데이터센터 운영 업체 ‘선전 이펑 테크놀로지’ 지분 50.1%를 보유했고, 이펑의 주요 고객은 화웨이의 클라우드 사업부인 화웨이 클라우드였다. 앨리스 황이 투자 회사와 데이터센터 개발 업체를 거쳐 화웨이에 연산 자원을 제공하는 사업과 간접적으로 연결된 구조다. 허시는 이펑의 대출에도 지급 보증을 제공한 것으로 나타났다. 복잡한 기업 지분망 통해 화웨이와 연결 이 기업망은 엔비디아 반도체를 구매한 업체와도 연결돼 있었다. 허시의 사업 파트너이자 룽텅의 최대 주주인 ‘저장 센추리 화퉁 그룹’은 2023년부터 엔비디아 반도체를 구매한 것으로 조사됐다. 캉웨이는 2022년 룽텅 임원에 올랐으며, 룽텅과 화웨이의 사업 협약 체결 현장에도 참석한 것으로 전해졌다. 아직 엔비디아의 반도체가 실제 화웨이에 전달됐거나 미국의 수출 통제 규정을 위반했는지 여부는 불확실하다. 테사리는 복잡하게 얽힌 기업 지분 관계가 실제 사업상 연결 고리를 감추기 위해 설계됐을 가능성을 제기했다. 미국 국토안보수사국 특별수사관 출신인 브라이언 앤더슨 테사리 부사장은 “이번 사안이 국가 안보와 첨단 기술 유출 방지 차원에서 조사할 필요가 있다”고 밝혔다. 그는 수출 통제 대상인 엔비디아 장비가 허가 없이 화웨이에 이전됐다는 증거가 발견될 경우 수출 통제 위반과 밀수, 범죄 공모 등의 혐의가 적용될","category":"IT 과학"}]},"popular":[{"title":"미 국방장관에게 \"정숙하라\" 외친 병사... 그가 지키던 것은 무엇이었나","link":"https://n.news.naver.com/article/047/0002535681?ntype=RANKING","pubDate":"2026-11-13T10:56:16.359164+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"'지연된 정의는 정의가 아니'라던 대법관 5인, 지금은?","link":"https://n.news.naver.com/article/047/0002535685?ntype=RANKING","pubDate":"2026-11-13T10:56:16.359194+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"소녀상에 기도한 KIA 김도영, 정의연이 보낸 작은 선물","link":"https://n.news.naver.com/article/047/0002535686?ntype=RANKING","pubDate":"2026-11-13T10:56:16.359202+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기",
