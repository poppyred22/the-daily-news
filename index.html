6일 오후 정진혁 국가철도공단 신임 이사장과 김원준 한국공항공사 신임 사장에게 임명장을 전수했다. 홍 장관은 정진혁 이사장에게 \"국토균형발전과 지역성장 견인 등을 위한 철도의 위상이 새롭게 강조되는 현시점에서 국가철도공단의 역할과 책임이 더 중요해졌다\"며 \"그동안 주력해 온 철도건설뿐만 아니라 K-철도의 해외 경쟁력을 강화하는 등 미래가치를 창출할 발전 전략을 마련할 것\"을 당부했다. 철도 안전과 관련해서는 \"철도 전 분야에서 효율성보다 국민 안전을 최우선으로 하고, 사고 원천 차단을 위한 사전 예방 중심의 안전관리 체계 구축이 필요하다\"고 강조했다. 김원준 사장에게는 \"공항 운영과 항공 인프라 관리 전반에서 한국공항공사의 책임과 역할이 막중해졌다\"며 \"현장 중심의 철저한 항공안전 관리와 함께 지방공항 활성화와 지역 현안의 합리적 해결을 위해 관계기관과 적극적으로 소통해 줄 것\"을 요청했다. ◎공감언론 뉴시스 bsg05107@newsis.com","category":"사건 사고"},{"title":"강원도, 겨울철 화재 대비 어구보수보관장 75곳 안전점검","link":"https://www.yna.co.kr/view/AKR20261106137700062","pubDate":"2026-11-06T16:41:15+09:00","author":"연합뉴스","description":"(춘천=연합뉴스) 이재현 기자 = 강원특별자치도는 겨울철 화재 예방을 위해 오는 9일부터 30일까지 동해안 6개 시군 43개 항의 어구보수보관장...","category":"사건 사고"},{"title":"李정부 첫 경찰청장 후보자 김종철 \"관계성 범죄 대응 정비 급선무\"(종합)","link":"https://www.newsis.com/view/NISX20261106_0003858300","pubDate":"2026-11-06T16:15:12+09:00","author":"뉴시스","description":"[서울=뉴시스]최은수 염지윤 기자 = 국가경찰위원회가 6일 김종철 경찰청장 직무대행에 대한 제25대 경찰청장 임명 제청 동의안을 의결했다. 김 직무대행은 이상동기 범죄와 관계성 범죄에 대한 대응체계 정비를 최우선 과제로 꼽았다. 국가경찰위원회는 이날 오후 1시30분 서울 서대문구 경찰청에서 임시회의를 열고 김 직무대행에 대한 경찰청장 임명 제청 동의안을 심의·의결했다. 김 직무대행은 약 2시간 10분간 진행된 회의를 마친 뒤 취재진과 만나 임명 제청 동의를 받았다고 밝혔다. 김 직무대행은 경찰이 가장 먼저 해결해야 할 과제에 대해 \"무엇보다 이상동기 범죄라든지 관계성 범죄 등으로부터 우리 국민이 피해를 당하는 일이 없도록 여러 가지 시스템이나 현장 매뉴얼 등을 정비하는 게 제일 급선무가 아닌가 생각하고 있다\"고 말했다. 이어 \"더 나은 사회를 위한 바람, 경찰 쇄신에 대한 요구 등 다양한 국민의 목소리를 엄중하게 인식하고 있다\"며 \"수사는 물론이고 일반 치안행정 분야에 있어서까지 경찰 업무의 완결성을 제고하고, 이를 통해 국민의 신뢰를 하나하나 회복해 나가겠다\"고 밝혔다. 국경위 회의에서 오간 논의에 대해서는 \"치안 철학이라든지 각종 치안 현안에 대한 입장 등에 대해 여러 가지 질문이 있었고, 평상시 생각을 진솔하게 말씀드렸다\"고 밝혔다. 향후 인사청문회 준비와 관련해서는 \"있는 그대로 성실하게 책임 있는 자세로 최선을 다하겠다\"고 ","category":"사건 사고"},{"title":"식당서 여중생 뺨때린 40대…'벌금형'→'징역형' 뒤집힌 이유","link":"https://www.imaeil.com/page/view/2026110610262038075","pubDate":"2026-11-06T10:43:47+09:00","author":"매일신문","description":"식당에서 처음 본 여중생에게 다가가 뺨을 때려 바닥에 쓰러뜨린 40대 남성이 항소심에서 벌금형보다 무거운 징역형의 집행유예를 선고받았다. 부산지법 형사항소4-1부(재판장 정성호)는 6일 아동복지법 위반(아동학대)과 폭행 혐의로 기소된 40대 남성 A씨에게 징역 8개월에 집행유예 2년을 선고했다. 보호관찰도 명령했다. 앞서 1심이 선고한 벌금 500만원보다 무거운 처벌이다. 사건은 지난해 11월 1일 오후 6시쯤 부산 금정구의 한 식당에서 발생했다. 당시 A씨는 식당에 있던 여중생 B양에게 다가가 뒤에서 오른쪽 뺨을 손으로 때렸다. - 매일신문","category":"사건 사고"},{"title":"\"고인, 한국 무사히 돌아오도록\"…'뺑소니 사망' 여행유튜버, 유족이 전한 부탁","link":"https://www.imaeil.com/page/view/2026110609485443764","pubDate":"2026-11-06T09:49:22+09:00","author":"매일신문","description":"볼리비아에서 자전거로 여행하던 중 대형 화물트럭에 치여 숨진 여행 유튜버 진쓰레블(본명 조진우·33)의 가족이 고인을 국내로 데려오기 위한 절차에 들어갔다. 고인의 친형은 지난 5일 밤 조진우 씨의 사회관계망서비스(SNS)에 유가족을 대표해 입장문을 올렸다. 그는 \"갑작스럽고 안타까운 소식을 전하게 되어 마음이 미어지고 무겁다\"며 \"저의 친동생이자 많은 분들의 사랑과 응원을 받아온 진쓰레블님이 세상을 너무나도 갑작스러운 대형 트럭과의 교통사고로 세상을 떠났다\"고 밝혔다. 진쓰레블은 지난 4일 오전 볼리비아 엘알토에서 자전거를 타고 - 매일신문","category":"사건 사고"}],"사회":[{"title":"“왜 서울과 같이 묶나”...정부 ‘지방우대지수’ 추진에 수도권 반발 확산","link":"https://www.mk.co.kr/news/politics/12200387","pubDate":"2026-11-06T22:51:17+09:00","author":"매일경제","description":"“서울과의 거리가 권역 지정 주요 기준 지역별 특성 무시한 탁상 행정” 비판 기초단체·경제계 원점 재검토 요구 확산정부가 내년 시행을 목표로 추진하는 ‘지방우대지수’에 수도권 지자..","category":"사회"},{"title":"부산시·BNK금융·기보, 기후테크 기업에 150억 금융지원","link":"https://www.mk.co.kr/news/economy/12200358","pubDate":"2026-11-06T20:40:31+09:00","author":"매일경제","description":"기후테크 기업 금융 지원 업무협약 체결 대출이자·보증료·기술평가료 부담 낮춘다부산시가 BNK금융그룹, 기술보증기금과 손잡고 지역 기후테크 기업을 지원한다. 부산시는 6일 시청사에서..","category":"사회"},{"title":"배달 음식 틈타 전 연인 집 침입·자해 소동…30대 긴급체포","link":"https://www.newsis.com/view/NISX20261106_0003858639","pubDate":"2026-11-06T20:31:54+09:00","author":"뉴시스","description":"[서울=뉴시스]최은수 고선영 기자 = 흉기와 둔기를 들고 전 연인의 집에 침입해 자해 소동을 벌인 30대 남성이 경찰에 붙잡혔다가 석방됐다. 6일 경찰에 따르면 서울 수서경찰서는 지난 2일 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 혐의로 긴급체포했다. A씨는 지난 1일 서울 강남구의 한 오피스텔에 거주하는 전 연인 B씨의 집에 흉기와 둔기를 소지한 채 들어가 자해하겠다고 위협한 혐의를 받는다. A씨는 B씨의 집으로 배달 음식을 주문한 뒤 B씨가 문을 열자 집 안으로 들어간 것으로 조사됐다. A씨는 B씨에게 헤어지기 싫다며 자해하겠다고 위협하고, 흉기로 자해하는 시늉을 한 것으로 파악됐다. 피해자 측의 신고를 받고 출동한 경찰은 현장에서 A씨를 긴급체포해 조사한 뒤 석방했다. 경찰은 피해자에게 스마트워치를 지급하고 A씨가 피해자에게 접근하지 못하도록 긴급응급조치를 내렸다. 현재 스토킹처벌법에 따른 잠정조치 1~3호 신청도 준비하고 있다. ◎공감언론 뉴시스 eschoi@newsis.com, sunzero@newsis.com","category":"사회"},{"title":"소화기로 안 되자 이불까지…화재 현장서 빛난 경찰의 센스","link":"https://www.newsis.com/view/NISX20261106_0003858627","pubDate":"2026-11-06T20:28:03+09:00","author":"뉴시스","description":"[서울=뉴시스]정지연 인턴 기자 = 순찰 중 건물 화재를 발견한 경찰관이 소화기로도 잡히지 않는 불길을 버려진 이불까지 동원해 진압했다. 근무화에 불이 붙은 상황에서도 맨손으로 불길을 제압하는 모습이 공개됐다. 6일 대한민국 경찰청 공식 유튜브 '대한민국 경찰청'에는 대구의 한 골목길에서 순찰 중이던 경찰관이 건물 화재를 발견하고 진화하는 모습이 담긴 영상이 올라왔다. 영상에 따르면 낮 시간대 순찰하던 경찰관은 한 건물 주변에 모여 있는 시민들과 검은 연기를 발견했다. 현장에는 매캐한 연기가 피어오르고 있었으며 건조한 날씨로 건물에 불이 붙은 상태였다. 경찰관은 곧바로 순찰차에 비치된 소화기를 꺼내 초기 진화에 나섰다. 하지만 당시 바람이 강하게 불어 소화기만으로는 불길을 잡기 어려웠다. 이에 경찰관은 인근 폐건물로 향해 버려진 이불을 가져왔다. 다시 화재 현장으로 돌아온 경찰관은 이불로 불길을 덮으며 진화를 시도했다. 경찰관은 근무화에 불이 옮겨붙은 사실도 모른 채 불길을 제압했다. 이불을 이용한 진화가 이어지면서 불길은 조금씩 잦아들었다. 이후 현장에 도착한 소방대원들이 남아 있던 작은 불씨까지 진압하면서 화재 상황은 마무리됐다. 경찰청은 당시 상황을 전하며 \"건조한 환절기 주변을 한 번 더 살펴주세요. 그 한 번의 관심이 누군가의 일상을 지킵니다\"고 당부했다. 영상을 본 네티즌들은 \"항상 든든한 경찰 최고다\", \"이불 덮는 센스","category":"사회"},{"title":"이재명 정부 첫 경찰청장 후보자에 김종철…23개월 대행 체제 끝날까","link":"https://www.imaeil.com/page/view/2026110620231360980","pubDate":"2026-11-06T20:23:23+09:00","author":"매일신문","description":"이재명 정부 첫 경찰청장 후보자로 김종철 현 경찰청장 대행(경찰청 차장)이 지명됐다. 국가경찰위원회가 후보자 임명 제청에 동의한 데 이어 행정안전부 장관도 제청 절차를 마무리하면서 12·3 비상계엄 이후 23개월 가까이 이어진 경찰청장 직무대행 체제가 막을 내릴 지 주목된다. 윤호중 행정안전부 장관은 6일 정부서울청사에서 브리핑을 열고 김종철 경찰청 차장(치안정감)을 제25대 경찰청장으로 임명 제청했다고 밝혔다. 앞서 국가경찰위원회는 이날 오후 1시30분 임시회의를 열고 김 후보자에 대한 임명 제청 동의 안건을 의결했다. 행안부는 - 매일신문","category":"사회"},{"title":"서울변회 \"예외였던 로스쿨 결원보충제 폐지해야\"","link":"https://www.newsis.com/view/NISX20261106_0003858623","pubDate":"2026-11-06T20:03:22+09:00","author":"뉴시스","description":"[서울=뉴시스] 오정우 기자 = 서울지방변호사회가 정부가 여섯 번째 추진 중인 법학전문대학원(로스쿨) 결원보충제를 폐지할 것을 촉구했다. 서울변회는 6일 '교육부는 결원보충제를 폐지하고 원칙으로 돌아가라'는 성명을 내고 교육부가 지난달 26일 입법예고한 '법학전문대학원 설치·운영에 관한 법률 시행령' 개정안을 즉각 철회할 것을 요구했다. 개정안은 올해까지 적용되는 결원보충제를 2029학년도 입학전형까지 3년 더 연장하는 내용을 골자로 한다. 서울변회는 해당 제도가 사실상 총 입학정원을 늘리는 수단으로 작용해왔다고 비판했다. 서울변회는 \"결원보충제는 자퇴나 제적으로 생긴 결원을 정원 외로 뽑는 예외적·한시적 제도\"라며 \"시행령상 예외에 불과한 결원보충제가 거듭 연장되는 등 예외가 원칙처럼 10년 이상 운영되는 기형적인 구조가 이어지고 있다\"고 질타했다. 또 결원보충제를 통해 총 입학정원 2000명을 넘기고 있는 현실도 짚었다. 서울변회는 \"초기 정착이라는 도입 명분은 사라졌고 결원으로 줄어든 등록금 수입을 정원 외 선발로 메우는 기능뿐\"이라고 지적했다. 결원보충제를 3년 더 연장할 구체적 근거도 없다고도 주장했다. 아울러 결원보충제 TF(태스크포스)의 논의 경과와 결과를 공개해 연장을 결정한 근거를 밝혀야 한다고도 덧붙였다. 결원보충제는 자퇴나 제적 등으로 생긴 빈자리만큼 이듬해 신입생을 정원 외에서 추가로 뽑는 제도다. 로스쿨의 초기","category":"사회"},{"title":"이용철 법무부 장관 내정자 “검찰개혁 차질없이 완수”","link":"https://www.khan.co.kr/article/202611061847001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T18:47:00+09:00","author":"경향신문","description":"이용철 방위사업청장이 지난달 13일 국회 국방위 국정감사에서 의원질의에 답변하고 있다. 박민규 선임기자이용철 법무부 장관 내정자가 6일 “검찰개혁을 차질없이 완수하겠다”고 지명 소감을 밝혔다. 공소청과 중대범죄수사청 등으로 개편된 형사사법체계를 안착시키겠다는 의지로 풀이된다.이 내정자는 이날 “공소청과 중수청이 새로 출범하고 형사사법체계가 크게 개편된 엄중···","category":"사회"},{"title":"‘파견 검사 20명’ 조작기소 특검에···검사들 “무조건 피해야”, “법왜곡죄 범할까 우려”","link":"https://www.khan.co.kr/article/202611061742001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T17:42:00+09:00","author":"경향신문","description":"서울 서초구 공소청. 연합뉴스이른바 ‘조작기소 특검법’이 6일 국회 본회의를 통과하면서 향후 특검에 파견될 공소청 검사를 선발하는 절차가 진행될 예정이다. 그러나 검사들 사이에서는 특검 파견을 꺼리는 분위기가 감지된다.국회는 이날 본회의를 열고 ‘윤석열 정권 검찰청, 국가정보원, 감사원 등 국가기관의 조작수사·조작기소 등 의혹의 진상규명을 위한 특별검사 임···","category":"사회"},{"title":"[속보]행안부 장관, 김종철 경찰청장 내정자 임명 제청…“경찰개혁에 강력한 의지”","link":"https://www.khan.co.kr/article/202611061708001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T17:08:00+09:00","author":"경향신문","description":"윤호중 행정안전부 장관이 6일 정부서울청사에서 김종철 경찰청장 내정자 임명 제청 관련 브리핑을 하고 있다. 연합뉴스윤호중 행정안전부 장관이 6일 김종철 경찰청 차장(치안정감)을 신임 경찰청장으로 임명 제청했다. 지난달 시작된 새 형사사법체계 안착 노력과 경찰개혁 의지가 주요 인선 배경으로 작용했다.윤 장관은 이날 정부서울청사에서 브리핑을 열고 신임 경찰청장···","category":"사회"},{"title":"영풍 석포제련소, '제5회 석포마을 공모전' 개최","link":"https://www.imaeil.com/page/view/2026110611583339482","pubDate":"2026-11-06T15:26:23+09:00","author":"매일신문","description":"경북 봉화군 석포면에서 주민들의 일상과 사람, 자연의 감동을 나누는 지역 문화 행사가 개최된다. 영풍 석포제련소는 '2026 제5회 석포마을 공모전'을 개최하고 오는 12월 4일까지 작품을 접수한다고 6일 밝혔다. 지난 2021년 시작해 올해 5회째를 맞이한 이번 공모전은 봉화군과 석포면을 대표하는 주민 참여형 문화축제로 입지를 다지고 있다. 특히 올해는 기존 운영사인 리온픽쳐스와 더불어 석포청년회가 공동 주관으로 참여해 지역 소통과 상생의 가치를 더했다. 공모 분야는 '포토5행시'와 '동영상' 등 총 2개 부문이다. 올해 새롭게 - 매일신문","category":"사회"}],"생활 문화":[{"title":"배달 음식 틈타 전 연인 집 침입·자해 소동…30대 긴급체포","link":"https://www.newsis.com/view/NISX20261106_0003858639","pubDate":"2026-11-06T20:31:54+09:00","author":"뉴시스","description":"[서울=뉴시스]최은수 고선영 기자 = 흉기와 둔기를 들고 전 연인의 집에 침입해 자해 소동을 벌인 30대 남성이 경찰에 붙잡혔다가 석방됐다. 6일 경찰에 따르면 서울 수서경찰서는 지난 2일 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 혐의로 긴급체포했다. A씨는 지난 1일 서울 강남구의 한 오피스텔에 거주하는 전 연인 B씨의 집에 흉기와 둔기를 소지한 채 들어가 자해하겠다고 위협한 혐의를 받는다. A씨는 B씨의 집으로 배달 음식을 주문한 뒤 B씨가 문을 열자 집 안으로 들어간 것으로 조사됐다. A씨는 B씨에게 헤어지기 싫다며 자해하겠다고 위협하고, 흉기로 자해하는 시늉을 한 것으로 파악됐다. 피해자 측의 신고를 받고 출동한 경찰은 현장에서 A씨를 긴급체포해 조사한 뒤 석방했다. 경찰은 피해자에게 스마트워치를 지급하고 A씨가 피해자에게 접근하지 못하도록 긴급응급조치를 내렸다. 현재 스토킹처벌법에 따른 잠정조치 1~3호 신청도 준비하고 있다. ◎공감언론 뉴시스 eschoi@newsis.com, sunzero@newsis.com","category":"생활 문화"},{"title":"배우·스태프 부상부터 관객 안전까지…‘예술현장 안심공제’ 첫선","link":"https://www.khan.co.kr/article/202611062008001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=culture_news","pubDate":"2026-11-06T20:08:00+09:00","author":"경향신문","description":"한국예술인복지재단 제공예술 현장의 사고부터 관객 안전사고까지 보장하는 예술인 맞춤형 공제상품이 처음으로 출시됐다.문화체육관광부 산하 한국예술인복지재단은 6일 예술인 공제사업을 공식 출범하고 첫 상품인 ‘예술현장 안심공제’를 출시했다고 밝혔다. 공연·전시 등을 기획·운영하는 예술사업자가 가입할 수 있으며, 출연진과 스태프의 상해·질병부터 관객 안전사고, 시설···","category":"생활 문화"},{"title":"뉴진스 전속계약서 공개 파장…‘부적절한 연애’ 금지·소속사 비판 제한","link":"https://www.hani.co.kr/arti/culture/music/1286095.html","pubDate":"2026-11-06T17:58:00+09:00","author":"한겨레","description":"미국 뉴욕타임스가 뉴진스가 미성년자 시절 체결한 전속계약서에 교육권과 수면권 등 보호 조항이 빠져 있었다고 보도함. 계약서에는 소속사를 비판하는 발언을 제한하고 계약 종료 뒤에도 음악과 인공지능으로 만든 목소리를 활용할 수 있다는 내용이 담긴 것으로 전해져 논란이 커짐. 하이브는 연습생과 국가 표준 청소년 부속합의서를 체결했다고 설명함.","category":"생활 문화","priority":1},{"title":"강서구 시립화곡점, 행안부 우수 어린이놀이시설로 선정","link":"https://www.newsis.com/view/NISX20261106_0003858332","pubDate":"2026-11-06T16:52:55+09:00","author":"뉴시스","description":"[서울=뉴시스] 최현호 기자 = 서울 강서구는 '서울형키즈카페 시립화곡점'이 행정안전부의 '2026년 우수 어린이놀이시설'로 선정됐다고 6일 밝혔다. 올해는 전국 8만5000여 곳의 어린이놀이시설 가운데 지방정부와 교육청이 추천한 49곳을 대상으로 서면, 현장, 민간 전문가 심사를 거쳐 9곳이 선정됐다. 시립화곡점은 실내 놀이공간과 테라스, 생태환경, 아동지원시설을 연계해 놀이·돌봄·성장을 함께 지원하는 공공 놀이공간이라는 점에서 좋은 평가를 받았다. 특히 아동의 연령과 놀이 속도에 맞춰 조용한 놀이 공간과 활동적인 놀이 공간을 나눴다. 정글 놀이터와 집라인(줄을 타고 이동하는 놀이기구), 역할놀이 등 발달 특성에 맞는 시설과 놀이를 제공한다. 이번 선정으로 시립화곡점은 2029년까지 3년간 우수 어린이놀이시설 지위를 유지하며, 행정안전부로부터 인증서와 인증판을 받는다. 시립화곡점은 서울키즈플라자(강서구 화곡로31나길 35) 1층에 있으며, 이용 대상은 4~12세(2014~2022년생) 어린이다. 서울 거주자뿐 아니라 서울 소재 직장이나 학교에 다니는 시민도 이용할 수 있다. 이용 요금은 2시간 기준 어린이 1명당 5000원이며 보호자 1명은 무료로 입장할 수 있다. 두 자녀 이상 다자녀 가구는 증빙서류를 지참하면 무료로 이용할 수 있다. 시설은 사전 예약제로 운영하며 '우리동네키움포털'에서 예약할 수 있다. ◎공감언론 뉴시스 wrc","category":"생활 문화"},{"title":"마포구, 세계청년대회 종합지원 TF 가동…16개 부서","link":"https://www.newsis.com/view/NISX20261106_0003858318","pubDate":"2026-11-06T16:51:34+09:00","author":"뉴시스","description":"[서울=뉴시스] 최현호 기자 = 서울 마포구는 '2027 서울 세계청년대회'에 대비해 종합지원 전담조직(TF)을 구성하고 숙박·교통·안전 분야별 준비에 나섰다고 6일 밝혔다. 종합지원 TF에는 16개 부서가 참여하고 부구청장이 총괄을 맡는다. 구는 ▲총괄·홍보지원반 ▲교통·보행안전반 ▲공간·숙박지원반 ▲재난안전·의료지원반 ▲환경·문화지원반 등 5개 실무반을 두고 내년 9월까지 TF를 운영한다. 구는 상암 일대에 최대 50만명이 모일 것으로 예상하고 있다. 이에 지난 5일 첫 실무회의에서 참가자 숙박 공간 확보와 교통·보행 안전, 재난·응급의료 대응 등을 주요 과제로 살폈다. 우선 학교와 구립 체육센터 등 공공시설을 임시숙소로 활용하는 방안을 중점 검토했다. 참가자들이 이용할 수 있는 식당에 안내표지를 부착하고 음식점·도시락 제조업소의 위생관리 상태를 점검하는 방안도 다뤘다. 교통 분야에서는 행사장 주변 이동 경로를 점검하는 방안과 지하철 이용객 집중에 따른 혼잡 대책, 차량 통제 여부 등을 논의했다. 또 폭염과 집중호우에 대비한 안전 대책과 응급환자 대응 방안을 검토했다. 무더위 대피공간과 그늘막 확보, 식수 공급, 보건소·소방 등 관계기관과의 비상의료체계 구축 등을 논의했다. 세계청년대회는 전 세계 가톨릭 청년들이 모여 신앙과 문화를 나누는 국제행사다. 내년 7월29일부터 8월2일까지 교구별 사전 행사인 교구대회를 거쳐 8월3일부터","category":"생활 문화"},{"title":"“AI 성장의 과실 기업에 쏠려···로봇세·기본소득으로 불평등 완화해야”","link":"https://www.khan.co.kr/article/202611061640011/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T16:40:01+09:00","author":"경향신문","description":"6일 서울 영등포구 여의도 헌정회 회의실에서 열린 ‘AI 시대의 양극화 현상: 진단과 해법’ 정책토론회에서 서상목 대한민국헌정회 정책연구위원회 의장이 발표를 하고 있다. 이혜인 기자인공지능(AI)이 일자리를 대체하고 부의 집중을 가속화할 수 있다는 우려가 커지는 가운데, AI 시대에 맞춰 조세·재정과 사회복지 체계를 전면 개편해야 한다는 전문가들의 제언이 ···","category":"생활 문화"},{"title":"'청'춘 '도'파민 '청도', 이번엔 코드로 터졌다… 한국MS 수석개발자도 찾은 군 단위 해커톤 [영상]","link":"https://www.imaeil.com/page/view/2026110615153929853","pubDate":"2026-11-06T15:15:59+09:00","author":"매일신문","description":"경북 청도군이 인공지능(AI) 시대의 새로운 지방 모델을 보여줬다. 지난 5일 청도 신화랑풍류마을에서 열린 '2026 청도 바이브코딩 해커톤 with 해커그라운드'가 전국에서 모인 청년 개발자들의 열기 속에 막을 내렸다. 인구 4만 명 남짓한 군 단위 지자체가 글로벌 IT 기업인 한국마이크로소프트와 손잡고 최신 AI 에이전트 기술을 겨루는 대회를 치러낸 것으로, 수도권에 집중된 개발자 생태계에 던지는 의미가 작지 않다는 평가다. 이번 대회는 해커그라운드가 주최하고 대구한의대학교가 주관했으며 청도군과 한국마이크로소프트가 후원했다. 참 - 매일신문","category":"생활 문화"},{"title":"차 소리 비켜서니 물 흐르는 소리…강원 인제 백담계곡 탐방로 열렸다","link":"https://www.khan.co.kr/article/202611061515011/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T15:15:01+09:00","author":"경향신문","description":"백담사 진입로 보도·차도 분리탐방객들 안전하게 이동 가능인도 연결된 출렁다리도 설치백담계곡 탐방로 전경. 설악산국립공원사무소 제공강원 인제군 백담사 진입도로의 보도와 차도를 분리하는 사업이 마무리돼 관광객들이 백담계곡의 풍광을 즐기며 안전하게 탐방할 수 있게 됐다.설악산국립공원사무소와 인제군은 6일 백담사 주차장 일원에서 ‘백담계곡 탐방로 개통 행사’를 개···","category":"생활 문화"},{"title":"대구교통공사, 대구시와 도시철도 시설물 특별안전점검","link":"https://www.imaeil.com/page/view/2026110613224744743","pubDate":"2026-11-06T14:32:54+09:00","author":"매일신문","description":"최근 도시철도 운행 지연과 각종 장애가 잇따르자 대구교통공사가 대구시와 함께 특별안전점검을 벌이고 비상 대응체계 강화에 나섰다. 대구교통공사는 \"지난 5일 심야부터 6일 새벽까지 허주영 대구시 교통국장과 한근수 대구교통공사 사장, 운영·기술본부장 등이 참여한 가운데 도시철도 시설물 특별안전점검을 실시했다\"고 6일 밝혔다. 이들은 직접 모터카에 탑승해 1·2호선 본선 시설물과 최근 장애가 발생한 3호선 피뢰도선 등을 점검했다. 유사 장애의 재발 가능성과 노후 장비 및 시설물의 상태를 집중적으로 살폈다. 특히 3호선 전차선 피뢰도선 지 - 매일신문","category":"생활 문화"},{"title":"지역사회에 온정 전한 부산항만공사, 취약계층 나눔 봉사","link":"https://www.imaeil.com/page/view/2026110602221446692","pubDate":"2026-11-06T09:55:31+09:00","author":"매일신문","description":"부산항만공사(BPA)가 부산항 터미널 운영사들과 함께 지역 취약계층을 위한 나눔 활동을 펼쳤다. BPA는 지난 5일 부산연탄은행 밥상나눔터에서 취약계층을 대상으로 배식 봉사활동을 했다고 밝혔다. 부산항만공사와 터미널 운영사 9곳이 함께 연 '2026 아나바다 장터(리쉐어 마켓)'의 수익금 343만원을 부산연탄은행에 기부하고, 밥상공동체 사업을 지원하기 위해 마련됐다. BPA는 지난달 27일 국가유공자와 보훈가족 약 70명을 대상으로 1차 배식 봉사를 했다. 5일에는 취약계층 약 180명에게 삼 :06:42+09:00","author":"매일신문","description":"미국 하원이 젠슨 황 엔비디아 최고경영자(CEO)에게 중국 정부의 정보원이라는 의혹을 받는 앨리스 황과의 관계 및 접촉 경위를 소명하라고 요구했다. 5일(현지시각) 악시오스에 따르면 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼 정보위원장은 이날 황 CEO에게 공동 서한을 보냈다. 이들은 세 위원회가 함께 진행하는 비공개 브리핑에 황 CEO가 직접 참석해 앨리스 황과 어떤 교류를 해왔는지 설명해 달라고 요청했다. 또 외국의 정보 수집 시도에 대응하기 위해 엔비디아가 어떤 보안 체계를 운용하고 있는지 - 매일신문","category":"세계"},{"title":"[올댓차이나] 대만 증시, 美 반도체주 급락에 7일째 속락 마감…4.51%↓","link":"https://www.newsis.com/view/NISX20261106_0003858628","pubDate":"2026-11-06T20:05:55+09:00","author":"뉴시스","description":"[서울=뉴시스]이재준 기자 = 대만 타이베이 증시는 6일 미국 중간선거 이후 인공지능(AI) 데이터센터 건설 지연 우려가 커지고 반도체주가 급락한 여파로 7거래일 연속 하락 마감했다. 자취안(加權) 지수는 이날 전일 대비 1873.08 포인트, 4.51% 내려간 3만9701.64로 폐장했다. 4월30일 이래 6개월 만에 저수준으로 떨어졌다. 장중 지수는 사상 최대 낙폭을 경신했다. 종가치로는 역대 4번째다. 3만8915.76으로 출발한 지수는 3만7837.05~4만435.83 사이를 등락했다. 금융주를 제외한 지수는 3만4807.55로 1698.70 포인트 떨어졌다. 주요 8대 업종 모두 약세를 면치 못했다. 시장 비중이 절대적인 전자기기주가 4.93%, 시멘트·요업주 2.40%, 식품주 3.49%. 석유화학주 2.14%, 변동성이 심한 제지주 1.94%, 건설주 2.42%, 금융주 3.16%, 방직주 1.03% 하락했다. 지수 구성 종목 중 976개가 내리고 106개는 올랐으며 27개가 보합이다. 전체 시총의 40%를 차지하는 반도체 위탁생산 TSMC가 4.69%, 롄화전자(UMC) 6.50%, 전자기기 위탁제조 훙하이 정밀 4.47%, 타이다 전자 6.64%, 반도체 설계개발주 롄파과기 2.02%, AI 서버주 광다전뇌 3.17%, 광학렌즈주 다리광전 0.99%, 기판주 신싱 9.12%, 난야과기 4.58%, 리지전자 3.47%,","category":"세계"},{"title":"“물·전기 잡아먹는 데이터센터 반대”···유럽 15개국 공동 시위","link":"https://www.khan.co.kr/article/202611061950001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-06T19:50:00+09:00","author":"경향신문","description":"미국 중간선거 당일인 지난 3일(현지시간) 캔자스주 레번워스 카운티의 들판에 데이터센터 건설에 반대하는 팻말이 세워져 있다. 로이터연합뉴스데이터센터 확장에 반대하는 유럽 15개국 100여 개 단체가 공동 행동에 나선다. 에너지와 물 사용뿐 아니라 주거와 일자리, 생활비에 미치는 영향을 둘러싼 우려가 국경을 넘는 시위로 이어지는 모습이다.유로뉴스와 가디언은 ···","category":"세계"},{"title":"홍콩, 이달 중 CCTV에 AI 안면 인식 기술 도입한다","link":"https://www.mk.co.kr/news/world/12200284","pubDate":"2026-11-06T19:33:00+09:00","author":"매일경제","description":"“실종자 및 용의자 추적 위한 것” 공공기관부터 쇼핑몰까지 확산 생성 데이터는 최대 180일 보관홍콩이 이달부터 CCTV를 활용한 스마트 감시 네트워크 전반에 인공지능(AI) 기반..","categor sis.com/view/NISX20261106_0003858346","pubDate":"2026-11-06T17:35:24+09:00","author":"뉴시스","description":"[서울=뉴시스] 신효령 기자 = 유럽연합(EU) 집행위원회가 만 15세 학생을 대상으로 인공지능(AI) 활용 역량 인증제를 추진한다. 학생이 AI 답변이 맞는지 스스로 확인하는 능력을 기르는 게 핵심이다. EU 집행위는 5일(현지 시간) 발표한 교육·역량 종합대책에 2027~2028학년도부터 이 같은 인증제를 시범 운영한다는 계획을 담았다. 집행위는 보도자료에서 시범 운영 대상의 구체적인 연령이나 향후 대상 확대 여부를 밝히지 않았다. 유럽 매체 유로뉴스에 따르면 시범 운영 대상은 만 15세 학생이다. 필요한 역량을 갖춘 학생에게 인증서를 발급할 계획이다. 록사나 민자투 EU 집행위 수석부위원장은 \"학생들이 AI의 작동 방식을 이해하고, AI가 알려 주는 내용을 확인하며, 조작을 알아보도록 돕겠다\"고 말했다. 이어 \"언제 사용을 멈춰야 할지도 판단할 수 있도록 하겠다\"고 했다. 민자투 수석부위원장은 학생이 AI 답변에서 오류를 찾아내고 확인 과정을 설명하는 방식을 평가 사례로 들었다. 역사 과제라면 AI가 제시한 사건의 연도를 교과서와 대조해 바로잡고 출처를 밝히는 식이다. 집행위는 학생의 연령에 맞는 AI 학습 목표와 평가 지침을 마련하기로 했다. 지난 6월에는 경제협력개발기구(OECD)와 함께 초·중등 수업 사례를 담은 AI 교육 지침을 공개했다. 이번 교육 대책은 학생들의 기초학력 저하에 대응하기 위해 마련됐다. 집행위가 분석한","category":"IT 과학"},{"title":"'150억대 엔비디아칩' 싣고 사라졌다…운송트럭 두달째 행방불명","link":"https://www.etnews.com/20261106000316","pubDate":"2026-11-06T17:33:40+09:00","author":"전자신문","description":"미국 실리콘밸리에서 154억원 상당의 엔비디아 인공지능(AI) 반도체와 관련 장비가 운송 도중 사라져 경찰이 두 달째 수사를 벌이고 있다. 고가의 AI 반도체를 노린 전문 절도단의 소행일 가능성이 제기되는 가운데 아직 화물의 행방은 확인되지 않고 있다. 5일(현지시간) 미국 실리콘밸리 지역매체 머큐리뉴스에 따르면 캘리포니아주 오클랜드 경찰은 지난 8월 29일 오클랜드에서 텍사스주 포트워스로 운송되던 엔비디아 화물 도난 사건을 수사하고 있다. 도","category":"IT 과학"},{"title":"“韓처럼 성과급 달라” 대만 공장 건설 멈춘 마이크론…삼전닉스, 반사이익 거둘까","link":"https://www.etnews.com/20261106000307","pubDate":"2026-11-06T17:10:06+09:00","author":"전자신문","description":"마이크론의 대만 신규 공장 건설이 노사 갈등으로 사실상 중단되면서 삼성전자와 SK하이닉스가 반사이익을 얻을 수 있다는 전망이 나온다. 인공지능(AI) 반도체 수요 급증으로 메모리 공급 부족이 이어지는 상황에서 글로벌 3위 업체의 생산능력 확대에 차질이 생겼기 때문이다. 5일(현지시간) 블룸버그통신에 따르면 마이크론은 대만 북부 타오위안에 건설 중인 반도체 공장 '팹 11E'의 공사를 사실상 중단했다. 당초 2028년 가동을 목표로 최대 45억","category":"IT 과학"},{"title":"정부 데이터 칸막이 허물려면…\"예산·인력 지원하고 보안 강화해야\"","link":"https://www.newsis.com/view/NISX20261106_0003858433","pubDate":"2026-11-06T17:02:21+09:00","author":"뉴시스","description":"[서울=뉴시스]심지혜 기자 = 정부가 부처와 공공기관에 흩어진 데이터를 연결해 인공지능(AI) 활용을 확대하려는 범정부 데이터 공유체계가 실효성을 갖추기 위해서는 예산·인력 지원 등 제도적 뒷받침이 필요하다는 지적이 나왔다. 부처별 데이터 공유를 활성화하기 위한 인센티브와 데이터 제공에 따른 책임 문제 해결은 물론, 사이버보안 대책도 함께 강화해야 한다는 제언이 이어졌다. 국가인공지능전략위원회는 6일 하정우 상근 부위원장 주재로 제3차 전체회의를 열고 '범정부 데이터 파이프라인 구축 현황 및 활용 방안'을 심의·의결했다. ◆ 848개 기관 데이터 연결…부처 간 공유 활성화가 관건 범정부 데이터 파이프라인은 정부부처와 지방정부, 공공기관이 보유한 데이터를 기관 간 칸막이 없이 공유하고 업무에 활용할 수 있도록 지원하는 체계다. 지난 9월부터 시범운영에 들어갔으며 현재 848개 기관을 대상으로 서비스하고 있다. 10월 기준 공유데이터 5만4768건, 메타데이터 244만2269건이 등록됐다. 정부는 AI 기반 검색 기능을 통해 필요한 데이터를 찾고, 공유되지 않은 데이터도 보유기관에 제공을 요청할 수 있도록 했다. 앞으로 복지, 청년·고용, 지역소멸, 재난·안전 등 여러 부처가 공동 대응해야 하는 현안을 중심으로 데이터를 연계·결합해 활용할 계획이다. 이날 회의에서는 데이터 공유 방식과 부처별 참여를 활성화하기 위한 구체적인 방안도 논의됐","category":"IT 과학"},{"title":"배경훈 \"글로벌 AI 투자 불안에도 韓 투자 늦춰선 안 돼\"","link":"https://www.newsis.com/view/NISX20261106_0003858362","pubDate":"2026-11-06T16:38:39+09:00","author":"뉴시스","description":"[서울=뉴시스]심지혜 기자 = 배경훈 부총리 겸 과학기술정보통신부 장관이 미국의 인공지능(AI) 데이터센터 규제 움직임과 시장 불안에도 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 확대에 제동이 걸리더라도 글로벌 빅테크의 AI 투자는 지속되고, 다른 국가에는 새로운 기회가 될 수 있다는 판단이다. 배 부총리는 6일 국가AI전략위원회 전체회의 이후 기자들과 만나 최근 미국의 AI 데이터센터 규제 움직임과 국내 투자 위축 우려에 대해 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦추면 안 된다고 생각한다\"고 말했다. 그는 \"AI 속도 조절론에 대한 이야기도 있었지만 결국 빅테크들은 인공지능을 통해 새로운 산업과 문화를 계속 만들어 가려고 할 것이기 때문에 투자를 계속할 것\"이라고 전망했다. 미국의 투자 환경 변화가 다른 국가에는 기회가 될 수 있다는 점도 강조했다. 배 부총리는 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"고 언급했다. 이어 \"AI는 기대 심리가 너무 크다 보니 조금의 불안한 상황만 만들어져도 시장이 출렁거린다\"면서도 \"이렇게 출렁거리면서도 계속해서 우상향해 나가지 않을까 생각한다\"고 말했다. 한편 배 부총리는 범정부 차원의 사이버안보 대응체계 강화와 관련해 \"국가 차원의 대응체계가 필요하다는 데 공감하고 있다\"며 \"민간과 군을 포함한 여러 이해관계자를 ","category":"IT 과학"},{"title":"\"비만 치료 돕는 앱\"…한미약품, '에피데이' 출시","link":"https://www.newsis.com/view/NISX20261106_0003858359","pubDate":"2026-11-06T16:35:42+09:00","author":"뉴시스","description":"[서울=뉴시스]이소헌 기자 = 한미약품이 투약·식사·운동·체성분 등 일상 관리를 지원하고 의료진과 환자를 연결하는 비만 치료 애플리케이션을 출시했다. 한미약품은 비만 치료 환자의 주사 투약부터 식사, 운동, 체성분, 컨디션 등 건강 데이터를 기록 및 관리하고 이를 의료진과 연계할 수 있도록 지원하는 디지털 비만 솔루션 '에피데이'(eppiday)를 출시했다고 6일 밝혔다. 에피데이는 '감량보다 중요한 건 건강한 유지'라는 방향 아래 치료 전반의 생활습관 관리를 돕기 위해 개발됐다고 한미약품은 전했다. 환자의 건강 기록을 의료진과 연결해 보다 지 function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}

  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function story(x,i,featured){
  const when=x.pubDate?new Date(x.pubDate):null;
  const dateText=when&&!Number.isNaN(when.getTime())?new Intl.DateTimeFormat("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(when):"";
  const title=esc(x.title||"제목 없음");
  const description=esc(makeEasySummary(x.description||"이 기사에 제공된 상세 요약이 없습니다. 원문 기사에서 전체 내용을 확인해 주세요."));
  const author=esc(x.author||"뉴스");
  const categoryLabel=esc(x.category||"");
  const href=attr(x.link||"#");
  const expanded=window.openStoryLink===x.link;
  return '<article class="story"><div class="storytop"><span class="source">'+author+'</span><span>'+dateText+'</span></div><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(expanded?'true':'false')+'">'+title+'</button>'+(expanded?'<div class="story-detail"><p class="detail-summary">'+description+'</p><a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 기사 보기 ↗</a></div>':'')+'<div class="storybottom"><span>'+categoryLabel+'</span><button class="save" type="button" data-save="'+i+'" aria-label="기사 저장">☆</button></div></article>';
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활 문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const categoryData=window.dailyCategoryItems||{};
  let picks=[],rest=[];
  if(category===""){
    for(const [cat,rows] of Object.entries(categoryData)){
      const ranked=rows.filter(matches).map((x,i)=>({x,score:pickScore(x,cat)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      picks.push(...ranked.slice(0,3).map(p=>({...p,category:cat})));
      rest.push(...ranked.slice(3).map(p=>({...p,category:cat})));
    }
    picks.sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
    rest.sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
  }else{
    const ranked=(categoryData[category]||[]).filter(matches).map(x=>({x,score:pickScore(x,category),category})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
    picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
    rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
  }
  const total=picks.length+rest.length;
  $("#count").textContent=total+"개 · 오늘 기사";
  if(!total){$("#feed").innerHTML=window.dailyLoading?'<div class="empty">오늘의 뉴스를 모으고 있어요…<br>잠시만 기다려 주세요.</div>':'<div class="empty">오늘 표시할 기사가 없어요.</div>';return;}
  const renderStory=(p,i,featured)=>story(p.x,i,featured);
  window.renderedStories=[...picks,...rest].map(p=>p.x);
  const pickHeading=category===""?"오늘의 픽 · 전체 카테고리":"오늘의 픽";
  const picksHtml=picks.length?'<div class="sectionhead"><strong>'+pickHeading+'</strong><span>'+picks.length+'개 · 카테고리별 3개</span></div><div class="featured">'+picks.map((p,i)=>'<div class="pick-category">'+(category===""?'<div style="font-size:10px;color:#888;font-weight:700;padding-top:13px">'+esc(categories.find(c=>c[1]===p.category)?.[0]||p.category)+'</div>':'')+renderStory(p,i,true)+'</div>').join("")+'</div>':'';
  const restHtml=rest.length?'<hr class="sectionrule"><div class="sectionhead"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">'+rest.map((p,i)=>renderStory(p,picks.length+i,false)).join("")+'</div>':'';
  $("#feed").innerHTML=pickHeading? picksHtml+restHtml:restHtml;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;drawTabs();render();return}category=b.dataset.q;showSaved=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
