link":"https://n.news.naver.com/mnews/article/005/0001883377","naverLink":"https://n.news.naver.com/mnews/article/005/0001883377","pubDate":"2026-11-07T00:22:58.194658+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:22:57.379788+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"CJ올리브네트웍스 매출 증가 46% 책임진 '스마트스페이스 AX'","link":"https://n.news.naver.com/mnews/article/293/0000092861","naverLink":"https://n.news.naver.com/mnews/article/293/0000092861","pubDate":"2026-11-07T00:22:57.379756+09:00","author":"네이버뉴스","description":"CJ올리브네트웍스의 스마트스페이스 AX 사업 매출이 1년 전보다 두 배 이상 늘며 3분기 전체 매출 증가분의 46%를 차지했다. 공장·물류센터·데이터센터와 방송 시설에 AI 전환을 지원하는 사업으로, AI 인프라 구축 수요가 실적 성장으로 이어졌다.","category":"생활"},{"title":"“황제처럼 일 안 하겠습니다”…야근에 지친 청년들, 명나라 황제 도포에 열광한 까닭","link":"https://n.news.naver.com/mnews/article/030/0003483151","naverLink":"https://n.news.naver.com/mnews/article/030/0003483151","pubDate":"2026-11-07T00:22:57.012526+09:00","author":"네이버뉴스","description":"“황제처럼 일 안 하겠습니다”…야근에 지친 청년들, 명나라 황제 도포에 열광한 까닭. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:22:58.194767+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:22:58.194738+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"‘한지’ 24번째 인류무형유산 눈앞…태권도는 북 단독 등재 유력","link":"https://n.news.naver.com/mnews/article/028/0002830875","naverLink":"https://n.news.naver.com/mnews/article/028/0002830875","pubDate":"2026-11-07T00:22:58.194691+09:00","author":"네이버뉴스","description":"평가기구 두 유산에 모두 ‘등재 권고' 태권도 남북공동 등재 사실상 무산 닥나무로 만든 한지본을 완성하기 전 야외에서 줄에 걸고 바람에 말리는 모습. 국가유산청 제공 옛부터 이 땅의 장인들이 닥나무로 만들어온 ‘한지’ 종이의 제작·전승 문화와 한민족의 전통 무예 ‘태권도’가 유네스코(유엔교육과학문화기구)의 인류무형유산 목록에 나란히 오를 것으로 보인다. 국가유산청은 2024년 3월 한국 정부가 인류무형유산 대표 목록으로 등재 신청한 ‘한지 제작의 전통 지식과 기술 및 문화적 실천’에 대해 유네스코 무형유산보호협약 정부간위원회(이하 무형유산위원회) 산하 평가기구로부터 ‘등재’ 권고를 받았다고 5일 발표했다. 평가기구는 등재 신청 유산을 심사해 ‘등재’, ‘정보 보완’(등재 보류), ‘등재 불가’로 판정 내용을 나누어 무형유산위원회에 권고한다. 권고안은 위원회 검토를 거쳐 최종 등재 결정에 반영되는데, 특별한 변수가 없는 한 권고한 대로 확정되는 게 관례다. 평가기구는 의견서에서 “닥나무 껍질과 잿물 등의 천연재료로 만드는 한지는 기록과 인쇄, 생활, 의례 등 다양한 용도로 쓰이며 공동체의 일상생활과 문화적 실천에서 중요한 역할을 하고 있다”며 “신청서에서 장인과 지역 공동체, 연구자, 시민사회단체 등이 참여하는 다각적인 보호 노력과 지속적 전승을 위한 협력 체계를 확인할 수 있다”고 권고 사유를 밝혔다. 북한이 2024년 3월 신청한 ‘조선민주주의인민공화국의 전통무술―태권도’도 등재 권고를 받아 단독 등재가 유력시된다. 평가기구는 의견서를 통해 “자기 방어의 무예인 태권도는 건강과 사회적 가치를 증진하는 일상적 신체운동으로 (북한에서) 널리 받아들여지고 있다”며 “등재 신청 준비도 초기 단계부터 연행자, 대표기관, 단체, 개인이 폭넓게 참여하는 과정으로 진행됐고 이들이 긴밀히 협력하는 포괄적 보호체계도 제시했다”고 평가했다. 태권도는 한국 정부도 올해 3월 남북한 공동 등재를 추진하겠다는 뜻을 밝히며 등재 신청서를 냈으나 북한 신청안이 등재 권고를 받으면서 공동 등재는 사실상 무산됐다. 정부 대응이 늦고 소홀했던 것 아니냐는 지적이 나온다. 이와 관련해 허민 국가유산청장은 유네스코 공식 발표 전인 지난 2일 에스엔에스(SNS)에 ‘한지’와 ‘태권도’에 대한 등재 권고 내용을 미리 알리며 양해를 구하는 글을 올려 논란을 빚었다. 그는 “남북 관계 등 여러 여건으로 인해 현 시점에서 ‘공동 등재’는 사실상 어려울 것","category":"문화"},{"title":"AI 시대 인간다움 묻는다… 2026 인문문화축제 6일 개막","link":"https://n.news.naver.com/mnews/article/020/0003760673","naverLink":"https://n.news.naver.com/mnews/article/020/0003760673","pubDate":"2026-11-07T00:22:58.194682+09:00","author":"네이버뉴스","description":"‘2026 인문문화축제’ 참여형 전시 ‘인문상점’에서 관람객이 청년들의 질문을 고르고 있다. 한국문화예술교육진흥원 제공 문화체육관광부와 한국문화예술교육진흥원이 공동 주최하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해로 3회째인 해당 축제는 ‘인문지능’을 주제로 8일까지 사흘간 열린다. 주최 측은 ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 나를 돌아보고, 타인을 이해하며, 삶의 방향을 스스로 선택하는 힘을 뜻한다고 설명했다. 개막특별포럼에서는 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 대담했다. 이어 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발표하고, 성해영 서울대 종교학과 교수를 좌장으로 학계와 산업계 전문가들이 AI 시대 인문의 의미와 인문정책의 방향, 생활권 인문 확산 방안을 논의했다. 축제 기간에는 작가와 예술인, 콘텐츠 창작자가 참여하는 대담과 공연도 이어진다. 6일에는 황인찬 시인과 양희은 가수가 ‘노래가 된 시’를 주제로 토크콘서트를 연다. 7일에는 김겨울 작가와 김초희 영화감독 등이 ‘비교하지 않는 나만의 속도’를 주제로 이야기를 나눈다. 이종범 웹툰 작가와 심채경 천문학자 등은 일과 인문의 관계를 다룬다. 8일에는 넉살 가수 등이 참여하는 대담이 진행된다. 관람객이 직접 참여하는 전시도 마련됐다. 전국 인문 프로그램의 현장을 소개하는 ‘인문의 길’, 다른 사람의 회고록에 자신의 이야기를 이어 쓰는 ‘우리의 회고록’, 청년인문실험 100개 팀의 질문을 살펴보는 ‘인문상점’ 등이 운영된다. 안동 인문행복센터의 ‘인문행복트럭’과 마포·홍대 일대를 걷는 ‘인문탐방’도 진행된다. 축제와 연계한 전국 단위 인문 프로그램도 11월 한 달간 이어진다. 전국 10개 지역서점에서 북큐레이션과 북토크를 열고, ‘청년인문교실’과 ‘길 위의 인문학’, ‘지혜학교’, ‘모두의 인문학’ 등 프로그램을 전국 193곳에서 운영한다. 임진택 한국문화예술교육진흥원장은 “AI 시대에 인간다움을 지키는 힘은 인문적 사유에서 나온다”며 “인문적 소양을 갖춘 시민이 자신과 생활을 바꿔 가는 것이 이번 축제가 말하는 인문지능”이라고 말했다. 인문문화축제는 2024년 처음 시작됐다. 제1회 축제는 ‘시대가 묻고 인문이 답하다’를 주제로 국립중앙박","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:22:57.379775+09:00","author":"네이버뉴스","description":"20년 전 그래픽카드 개봉·PC 장착 체험 무료 게임 공개 AI 시대 연 '지포스 8800 GTX' 출시 20주년 기념 [이데일리 한광범 기자] 엔비디아(NVIDIA)가 최근 인공지능(AI) 산업의 토대가 된 그래픽카드 ‘지포스 8800 GTX’ 출시 20주년을 맞아 2006년 PC 게이밍 환경을 재현한 무료 체험 콘텐츠를 공개했다. 과거 그래픽카드를 직접 개봉하고 컴퓨터에 장착하는 경험을 최신 그래픽 기술로 되살린 것이 특징이다. 엔비디아는 6일 지포스 8800 GTX 출시 20주년을 기념하는 스팀(Steam) 데모 ‘지포스 8800 GTX - 전설의 20년’을 소개했다. 해당 콘텐츠는 지난 5일 스팀에 무료로 공개됐으며, 이용자가 직접 조작할 수 있는 반응형 기술 데모 형태로 제작됐다. 지포스 8800 GTX는 2006년 11월 8일 출시된 고성능 그래픽카드다. 당시 ‘컴퍼니 오브 히어로즈’, ‘바이오쇼크’, ‘크라이시스’ 등 고사양 PC 게임을 구동하는 대표적인 제품으로 주목받았다. 특히 2007년 출시된 크라이시스는 높은 그래픽 요구 사양으로 유명해지면서 PC 성능을 가늠하는 상징적인 게임으로 자리 잡았다. 이 제품의 역사적 의미는 게임 성능에만 있지 않다. 지포스 8800 GTX는 엔비디아가 개발한 병렬 컴퓨팅 플랫폼 쿠다(CUDA)를 지원한 최초의 그래픽카드다. 이전까지 주로 화면에 그래픽을 그리는 데 사용하던 GPU를 과학 계산과 시뮬레이션 등 다양한 연산 작업에 활용할 수 있는 기반을 마련했다. 당시 제품에는 G80 아키텍처를 기반으로 한 128개의 통합 스트림 프로세서가 탑재됐다. 그래픽 처리 과정에서 서로 다른 작업에 연산 자원을 유연하게 배분하는 구조로, 다이렉트X 10도 지원했다. 768MB GDDR3 메모리와 384비트 메모리 버스를 갖춘 것도 특징이었다. 쿠다를 통해 GPU의 병렬 연산 능력을 일반적인 컴퓨팅 작업에 활용할 수 있게 되면서 GPU의 쓰임새는 점차 확대됐다. 과학 연구와 영상 처리 등을 거쳐 오늘날 대규모 AI 모델을 학습하고 실행하는 가속 컴퓨팅으로 이어졌다. 엔비디아가 20년 전 그래픽카드를 기념하면서 게임뿐 아니라 쿠다의 역사를 강조하는 이유다. 이번 기념 데모는 언리얼 엔진 아티스트 딜런 브라운이 엔비디아의 지원을 받아 제작했다. 이용자는 2006년 분위기로 꾸며진 게임방에 들어가 지포스 8800 GTX의 포장을 뜯고 그래픽카드를 살펴본 뒤 당시 사양을 재현한 PC","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:22:57.012519+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"中 코로나19 다룬 영화 개봉 무산…\"상처 왜 들추나\" 비판여론","link":"https://n.news.naver.com/mnews/article/001/0016426090","naverLink":"https://n.news.naver.com/mnews/article/001/0016426090","pubDate":"2026-11-07T00:22:57.012494+09:00","author":"네이버뉴스","description":"中 코로나19 다룬 영화 개봉 무산…\"상처 왜 들추나\" 비판여론. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"[단독] “츠키 굿즈 대금 ‘7억’ 미지급”… 내한 공연 공동 주최사 관계자들 피소","link":"https://n.news.naver.com/mnews/article/022/0004173154","naverLink":"https://n.news.naver.com/mnews/article/022/0004173154","pubDate":"2026-11-07T00:22:56.598803+09:00","author":"네이버뉴스","description":"[단독] “츠키 굿즈 대금 ‘7억’ 미지급”… 내한 공연 공동 주최사 관계자들 피소. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"경주 축제장 구급차 미배치, 70대 여성 골든타임 놓쳐 식물인간","link":"https://n.news.naver.com/mnews/article/022/0004173159","naverLink":"https://n.news.naver.com/mnews/article/022/0004173159","pubDate":"2026-11-07T00:22:56.598760+09:00","author":"네 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"세계"},{"title":"대승거둔 美 민주당, 이제 온건·진보 노선 투쟁? LA서 민주사회주의자 시장 당선[트럼프 2기]","link":"https://n.news.naver.com/mnews/article/002/0002464732","naverLink":"https://n.news.naver.com/mnews/article/002/0002464732","pubDate":"2026-11-07T00:22:57.012529+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 큰 성과를 거둔 뒤 당내 노선 경쟁이 주목받고 있다.\n온건파와 진보파가 향후 정책 방향과 주도권을 두고 경쟁할 가능성이 제기된다.\n이번 선거 결과가 다음 대선 구도에 미칠 영향도 관심사다.","category":"세계"},{"title":"탄핵 위기 헤그세스 “버티고 싸운다”…민주당에 정면 도발","link":"https://n.news.naver.com/mnews/article/028/0002831117","naverLink":"https://n.news.naver.com/mnews/article/028/0002831117","pubDate":"2026-11-07T00:22:57.012527+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"},{"title":"최악 산불이 불붙인 반정부 시위… 거리로 나선 인니 Z세대","link":"https://n.news.naver.com/mnews/article/005/0001883556","naverLink":"https://n.news.naver.com/mnews/article/005/0001883556","pubDate":"2026-11-07T00:22:57.012517+09:00","author":"네이버뉴스","description":"서울 32배 불타…호흡기 질환 33만명 정부 대응 미흡에 “숨 쉴 권리” 외쳐 이면엔 경제 악화·부패 등 정부 불신 인도네시아 대학생들이 지난달 28일 수도 자카르타에서 프라보워 수비안토 대통령의 정책과 정부의 산불 대책에 항의하는 시위를 하던 도중 경찰의 방패를 당기며 실랑이를 펼치고 있다. 로이터연합뉴스 “우리가 불타면 너희도 함께 불타라.” 지난달 28일(현지시간) 인도네시아 수도 자카르타에서 대학생과 시민단체 관계자 등 1000여명이 정부 규탄 시위에 나섰다. 대다수가 검은 복장이었고 일부는 방독면을 썼다. 이보다 앞선 20일, 23일에도 비슷한 시위가 열렸다. ‘청년 서약의 날’(식민통치에 맞서 민족 단결과 국가 정체성을 선언한 날) 98주년에 맞춰 청년들이 주도한 시위의 발단은 산불이다. ‘11년 만에 최악의 산불’로 대기오염과 인명 피해가 커지는데 정부 대처가 미흡하다는 불만이 쏟아졌다. 그러는 사이 프라보워 수비안토 인도네시아 대통령은 취임 2주년(10월 20일)을 맞았다. 현지 여론조사기관 사이풀 무자니 연구컨설팅(SMRC)에 따르면 대통령 국정 지지율은 지난해 11월 81.2%에서 지난달 44.5%로 급락했다. 취임 이후 최저다. 인구 기준 세계 3위 민주주의 국가 인도네시아에서 정권 지지율 추락은 산불로만 설명되지 않는다. 연이은 정책 실패, 드러나는 권력 부패, 위태로운 경제, 자유와 인권 탄압이 누적돼 있었다. 이들이 바라는 ‘숨 쉴 권리’는 산불 연무(연기와 안개)로부터만 기인하지 않았다. 산불 외의 문제들","category":"세계"},{"title":"\"이란, 카타르 핵 협상안 검토 중\"…美와 종전 협상 돌파구 기대","link":"https://n.news.naver.com/mnews/article/421/0009275501"," AI 데이터센터 수요에 힘입어 3분기 실적이 성장했지만, 데이터센터 사업의 성장률과 향후 전망에서는 차이가 나타났다. AMD는 AI GPU를 포함한 헬리오스 랙 시스템의 초기 매출을 반영했고, 이런 흐름이 이어지면 인텔과의 매출 격차가 좁혀지거나 역전될 가능성이 제기된다.","category":"IT 과학"},{"title":"\"미국 주춤해도 한국은 멈추면 안 돼\"…정부, AI 투자 지속 강조","link":"https://n.news.naver.com/mnews/article/015/0005351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:22:57.379782+09:00","author":"네이버뉴스","description":"배경훈 부총리, AI 데이터센터 투자 지속 강조 美 중간선거 후 AI 관련주 급락·투자 위축 우려 사이버 보안 차르 논의…초거대 AI 개발 검토 사진=연합뉴스 미국 중간선거 이후 인공지능(AI) 데이터센터 투자 위축 우려가 커지자 배경훈 부총리 겸 과학기술정보통신부 장관이 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 열기가 식더라도 다른 국가들이 이를 기회로 삼을 수 있다는 판단에서다. 배 부총리는 6일 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의를 마친 뒤 기자들과 만나 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦춰선 안 된다\"고 말했다. 최근 미국에서는 중간선거 이후 AI 데이터센터 규제 강화 가능성이 부각되면서 관련 기업의 주가가 하락했다. AI 인프라 투자에도 영향을 미칠 수 있다는 우려가 제기되는 상황이다. 배 부총리는 미국의 투자 움직임이 둔화하더라도 글로벌 경쟁은 계속될 것으로 봤다. 그는 \"미국이 주춤하더라도 중국이나 프랑스, 캐나다 등 다른 국가들은 오히려 이를 기회로 삼을 수 있다\"고 말했다. 이어 \"AI에 대한 기대 심리가 큰 만큼 작은 불안 요인에도 시장이 크게 출렁일 수 있지만 개인적인 견해로는 장기적으로 우상향할 것으로 생각한다\"고 덧붙였다. 배경훈 부총리 겸 과학기술정보통신부 장관. / 사진=뉴스1","category":"IT 과학"},{"title":"\"전력망 비용 다 내겠다\"는 오픈AI… 국내 AI 데이터센터는 고객 확보 관건","link":"https://n.news.naver.com/mnews/article/469/0000964112","naverLink":"https://n.news.naver.com/mnews/article/469/0000964112","pubDate":"2026-11-07T00:22:57.379779+09:00","author":"네이버뉴스","description":"발 빠르게 지역사회와 공존 방안 발표 빅테크들, 美 정치 변화에 대응 착수 국내서도 18.4GW 데이터센터 계획 \"수요와 공급 엇갈릴 가능성\" 우려도 \"개발과 동시에 글로벌 고객과 협의\" 이재명 대통령이 6월 20일 울산 전시컨벤션센터에서 열린 울산 AI데이터센터 출범식에 와 격려사를 하고 있다. 왕태석 선임기자 오픈AI가 5일(현지시간) 직접 소유·운영하는 인공지능(AI) 데이터센터의 전기요금과 전력 인프라 비용을 전액 부담하겠다고 밝혔다. 다른 전력 소비자에게 비용이 전가되지 않도록 하겠다는 취지다. 미국 중간선거에서 민주당이 압승하며 AI 데이터센터 위축 전망에 힘이 실리자 발 빠르게 지역사회와의 공존 방안을 내놓은 것이다. 오픈AI는 데이터센터를 지을 때 지역 공직자들에게 관련 정보를 공개하지 못하게 하는 비밀유지계약을 요구해왔는데, 이런 관행도 중단하겠다고 했다. 그러면서 이날 발표와 비슷한 규정을 빅테크 전반에 적용하자고 제안했다. AI 투자에 거액을 쏟아부은 오픈AI를 비롯한 빅테크들은 미국 정치 지형 변화에 대응할 대책 마련을 서두르는 모습이다. 외신에 따르면 메타는 데이터센터 건설지를 미국 이외로 돌리거나 기존 시설을 확장해 쓰는 방안을 검토하고 있다. 마이크로소프트는 영국 네오클라우드 엔스케일과 맺은 데이터센터 계약을 지난달 취소했다. 국내에서도 여러 기업이 대규모 AI 데이터센터 투자를 추진해왔다. 정부가 6월 발표한 '3대 메가프로젝트'엔 2029년까지 8.4기가와트(GW) 규모의 AI 데이터센터를 구축하는 계획이 담겼다. SK가 5GW, GS가 2.4GW, 네이버가 1GW를 각각 맡았다. SK가 시설을 2035년까지 확장하는 단계까지 포함하면 총 18.4GW다. 8월 5일 경기 파주시 건설 현장에서 LG유플러스의 200메가와트(MW)급 AI 데이터센터 공사가 진행되고 있다. 김진욱 기자","category":"IT 과학"},{"title":"AI모델 구독 않고 골라쓰는 시대 열렸다","link":"https://n.news.naver.com/mnews/article/015/0005351238","naverLink":"https://n.news.naver.com/mnews/article/015/0005351238","pubDate":"2026-11-07T00:22:57.379777+09:00","author":"네이버뉴스","description":"글로벌 AI 유통 플랫폼 인기 코딩은 클로드, 문서는 GPT 토큰 사용량 만큼만 돈내면 돼 KT '토큰팩토리' 사업으로 선두 SKT·LGU+ 등도 참전 채비 인공지능(AI) 모델을 한곳에 모아 골라 쓰고, 실제 사용량만큼 요금을 내는 서비스 시장이 커지고 있다. 지금은 문서 작성에는 챗GPT, 코딩에는 클로드를 사용하고 싶다면 각각 월 구독료를 내야 한다. 특정 AI가 가끔 필요할 뿐인데 매달 고정 비용을 부담해야 하는 셈이다. 이런 불편을 인지한 국내 통신사들이 관련 플랫폼 구축에 뛰어들고 있는 것이다. 이에 따라 향후 AI 요금 경쟁도 본격화할 것으로 예상된다. ◇ 골라 쓰고 한 번에 결제 가장 먼저 포문을 연 곳은 KT다. KT가 지난달 30일 기업용으로 출시한 ‘토큰팩토리’는 GPT·클로드 등 여러 AI 모델을 한곳에서 골라 쓰고 사용량에 따라 요금을 결제하는 플랫폼이다. 초기 73개 모델을 제공하고 이달 글로벌 AI 유통 플랫폼 오픈라우터와 협력해 500개 이상으로 확대할 계획이다. 요금 기준은 AI가 정보를 처리하는 단위인 ‘토큰’이다. 이용자는 질문과 답변을 생성하는 데 사용한 토큰량에 따라 비용을 지급한다. 이진형 KT AX사업본부장은 “간단한 질문에도 가장 비싼 AI 모델을 사용하면 비용이 아깝다”며 “요약이나 번역 등 단순한 업무에는 저렴한 경량 모델을 활용할 수 있다”고 말했다. 이 플랫폼을 이용하면 기업에서는 업무에 따라 적합한 AI 모델을 활용할 수 있다. 광고 문구 작성과 단순 문서 요약에는 저렴한 모델을, 복잡한 코딩과 추론에는 고성능 모델을 배정할 수 있다는 얘기다. 불필요한 입력 내용을 줄이는 기술도 적용했다. 이 본부장은 “불필요한 입력 내용을 줄이고 업무에 적합한 저렴한 AI 모델을 자동으로 연결해 이용 비용을 최대 25% 절감할 수 있다”고 설명했다. KT는 기업 고객을 대상으로 사용량에 따라 요금을 부과하는 종량제와 함께 이용 규모·약정 기간에 따라 할인 혜택을 제공하는 약정형 요금제도 운영하고 있다. 다음달에는 서비스 기능을 고도화하고 내년 3월에는 개인과 개발자에게도 서비스를 개방할 예정이다. ◇ 통신사·빅테크도 토큰 경쟁 SK텔레콤과 LG유플러스 등도 이 시장에 참전을 예고했다. SK텔레콤은 AI 이용 패턴을 분석해 적합한 모델과 연산 인프라를 연결하는 ‘토큰 게이트웨이’ 사업 구상을 지난달 발표했다. LG유플러스는 AI 모델 최적화 기업 옵트에이아이와 손잡고 AI 연","category":"IT 과학"},{"title":"엔비디아, 네이버에 1.34조 납입…3대 주주로 'AI 동맹' 본격화","link":"https://n.news.naver.com/mnews/article/018/0006405323","naverLink":"https://n.news.naver.com/mnews/article/018/0006405323","pubDate":"2026-11-07T00:22:57.379772+09:00","author":"네이버뉴스","description":"10억달러 지분투자 마무리…네이버 3대 주주로 브룩필드, 200MW 이상 GPU 인프라 투자·소유 네이버클라우드, 장기계약으로 컴퓨팅 용량 확보 2027년 초 거래 종결 목표…글로벌 고객 유치 관건 [이데일리 이소현 기자] 엔비디아가 네이버(NAVER(035420))에 10억달러(약 1조3412억원) 규모의 전략적 지분투자를 완료했다. 네이버 지분 약 4.13%를 확보하면서 국민연금과 블랙록에 이어 3대 주주로 올라서게 됐다. 글로벌 대체투자사 브룩필드도 90억달러 규모의 인공지능(AI) 인프라 투자 계획을 구체화하면서 네이버·엔비디아·브룩필드의 3자 연합 글로벌 AI 팩토리 사업이 본궤도에 올랐다. 지난 7월 24일(현지시간) 미국 캘리포니아주 엔비디아 사옥에서 이해진(오른쪽) 네이버 의장과 엔비디아 젠슨 황 CEO가 10억 달러 규모의 전략적 투자 계약을 체결한 후 악수를 하고 있다.(사진=네이버) 네이버는 6일 ‘유상증자 또는 주식관련사채 등의 발행결과’ 공시를 통해 엔비디아를 대상으로 한 제3자배정 유상증자의 투자금 1조3411억9995만7500원이 전액 납입됐다고 밝혔다. 실제 발행한 보통주식은 655만8435주다. 주당 발행가액은 20만4500원이다. 엔비디아가 확보한 네이버 지분율은 약 4.13%로, 창업주인 이해진 네이버 이사회 의장의 지분율을 웃돌게 된다. 신주 상장 예정일은 오는 27일이며, 취득한 주식은 1년간 매각이 제한된다. 달러 기준 투자금은 당초 계약한 10억달러로 동일하지만, 환율 하락으로 원화 조달액과 발행주식 수는 줄었다. 최초 공시 당시 적용 환율은 달러당 1480.9원이었으나 최종 환율은 1341.2원으로 확정됐다. 이에 따라 원화 조달액은 약 1397억원, 발행주식 수는 68만3129주 감소했다. 브룩필드, 200MW 이상 GPU 인프라 소유…네이버클라우드 운영 이번 투자는 네이버와 엔비디아가 지난 7월 체결한 신주인수계약에 따른 것이다. 당시 엔비디아는 최소 90억달러 규모의 AI 컴퓨팅 인프라 확보를 투자 선결 조건으로 제시했다. 네이버는 지난달 27일 브룩필드와 관련 계약을 체결해 조건을 충족했다. 브룩필드도 이날 별도 자료를 통해 네이버와 약 90억달러 규모의 자본 파트너십을 체결했다고 밝혔다. 브룩필드가 국내 AI 컴퓨팅 인프라에 투자하는 것은 이번이 처음이다. 브룩필드는 이번 거래가 국내에서 이뤄진 스폰서 주도 민간 투자 가운데 역대 최대 규모라고 설명했다. 구체","category":"IT 과학"},{"title":"美민주 'AI 중단' 압박에 증시 패닉셀","link":"https://n.news.naver.com/mnews/article/009/0005760237","naverLink":"https://n.news.naver.com/mnews/article/009/0005760237","pubDate":"2026-11-07T00:22:57.379766+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 승리한 뒤 일부 정치인과 주정부 인사들이 AI 데이터센터 건설 중단과 규제 강화를 요구하면서 시장에 충격이 번졌다. 데이터센터 투자 위축 우려로 미국 반도체주와 한국 증시도 큰 폭으로 하락했고, 정부는 시장 변동성에 대응하기 위한 조치를 내놨다.","category":"IT 과학"},{"title":"빅테크 '보안 강화' AI 모델 잇따라 공개... 네이버·LG, SKT 모델은 언제","link":"https://n.news.naver.com/mnews/article/469/0000964118","naverLink":"https://n.news.naver.com/mnews/article/469/0000964118","pubDate":"2026-11-07T00:22:57.379764+09:00","author":"네이버뉴스","description":"오픈AI, 'GPT-6 사이버' 출시 악용 위험, 패치 후보까지 제시 구글, 앤트로픽 이어 경쟁 합류 국산 보안 특화 모델들 학습 중 서로 공격하며 방어 역량 키워 오픈AI가 공개한 보안 특화 인공지능(AI) 모델 'GPT-6 사이버' 이미지. 오픈AI 제공 인공지능(AI) 기반 시스템 침투 도구의 악용 위험성이 커지면서 글로벌 AI 기업들이 보안 강화형 AI 모델을 잇달아 내놓고 있다. 고도화한 보안 기능이 AI 시장의 격전지로 부상하며 국내에서 개발 중인 사이버 보안 특화 AI 파운데이션 모델에도 관심이 쏠린다. 오픈AI는 5일(현지시간) 자사 최상위 범용 AI 모델 'GPT-6 아스트라'를 기반으로 보안에 특화한 모델 'GPT-6 사이버'를 출시했다고 밝혔다. 보안 취약점 탐지는 물론 악용될 위험성을 검증하고, 취약점을 고칠 수 있는 패치 후보와 분석 자료까지 제시하는 성능을 갖췄다. 오픈AI는 이 모델로 웹 브라우저 '파이어폭스'에서 고위험 취약점 81건을 발견했고, 리눅스 운영 체제 취약점 948건에 작동하는 공격 도구도 개발했다. 오픈AI는 \"이 결과와 패치 후보를 개발사들에 전달했다\"고 밝혔다. 이 모델은 사이버 위험 평가 최고 수준인 '크리티컬' 등급으로 지정됐다. 구글은 지난달 28일 최신 범용 프런티어 모델 '제미나이 4 카본'을 공개하고 보안 성능 강화를 강조하며 \"소프트웨어에 숨은 복잡한 결함을 자율적으로 찾고, 검증된 취약점에 즉시 작동하는 코드 수정을 제시한다\"고 했다. 9월엔 경량 보안 특화 모델 '제미나이 3.8 플래시 사이버'도 내놓으며 \"취약점 탐지와 자동 패치에 최첨단 성능을 보인다\"고 했다. 앤트로픽의 '클로드 미토스' 전후로 빅테크들의 보안 특화 AI 모델 경쟁이 거세진 추세다. 국내에선 한국 환경에 맞춘 보안 모델이 개발되고 있다. 정부 주도의 사이버 보안 특화 AI 파운데이션 모델 개발 프로젝트에 참여한 네이버클라우드 컨소시엄은 기업·기관 41곳과 함께 보안 특화 모델을 개발하며 830테라바이트(TB)에 달하는 보안 실데이터를 학습시키고 있다. 네이버클라우드의 AI 모델 '하이퍼클로바X'로 방어, LG AI 연구원의 AI 모델 '엑사원'으로 공격 능력이 특화된 모델을 만든다. 내년 상반기 중 완성하겠다는 목표를 잡고 있다. SK텔레콤은 AI 기업 업스테이지, 보안기업 6곳, 대학 3곳이 참여하는 '독자 AI 사이버보안 협의체'를 지난달 출범시켰다. 정부의 독자 AI 파운","category":"IT 과학"},{"title":"“나 좀 일으켜 줘”…일부러 ‘덜 완벽하게’ 만든 로봇, 석 달 만에 월 매출 1억","link":"https://n.news.naver.com/mnews/article/020/0003760687","naverLink":"https://n.news.naver.com/mnews/article/020/0003760687","pubDate":"2026-11-07T00:22:57.379762+09:00","author":"네이버뉴스","description":"사진=이예리 기자 celsetta@donga.com 빈틈없이 일을 잘해 오히려 사람 같지 않은 이를 두고 흔히 ‘로봇 같다’고 한다. 그런데 일부러 ‘덜 완벽하게’ 만든 로봇이 있다. 엔터테인먼트 로봇 기업 루드다이나믹스의 ‘루드봇(LUDBOT)’이다. 루드다이나믹스는 과학·공학 유튜브 채널 ‘긱블’ 운영사가 올해 3월 사명을 바꾸고 로봇 사업에 뛰어든 회사다. 키 100cm가 채 안 되는 소형 로봇에 지방자치단체나 기업의 캐릭터를 입혀 공급하며, 지금까지 서울 종로구 마스코트 ‘종돌이’와 고려대학교 금연 캠페인 로봇 ‘담돌이’ 등을 선보였다. ● 짧은 다리로 걷다가 “아이쿠”…사람이 먼저 다가가게 만드는 매력 지난달 29일 서울 성수동에서 열린 시연회에서 종돌이 모양의 루드봇이 짧은 두 다리로 뒤뚱뒤뚱 걸어 나왔다. “안녕, 나는 종돌이야”라고 인사한 뒤 걸음을 옮기던 종돌이가 장애물에 부딪혀 넘어지자 관계자가 다가가 일으켜 세웠다. 이세형 루드다이나믹스 이사는 바퀴를 달면 넘어질 걱정이 없지만, 바퀴 달린 로봇은 자동차에 가까워 생명체로 느끼기 어렵다며 “두 다리로 걷고 몸짓으로 인사하는 순간 사람들은 로봇을 사람 대하듯 ‘이 아이’라고 부르기 시작한다”고 설명했다. 사진=이예리 기자 celsetta@donga.com","category":"IT 과학"}]},"popular":[]}}}; // UPDATED_AUTOMATICALLY_BY_NEWS_WORKFLOW

function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}
$("#today").textContent=compactDate(window.NEWS_DATA.days?.yesterday?.date||window.NEWS_DATA.date);
function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(!showPopular&&category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-popular="1" class="'+(showPopular?'active':'')+'">네이버 인기</button><button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
function drawDateTabs(){
 const days=window.dailyDays||[];
 const today=days[0],yesterday=days[1];
 const options=[{key:"today",label:today?"오늘 · "+compactDate(today.date):"오늘"},{key:"yesterday",label:yesterday?compactDate(yesterday.date):"어제"},{key:"all",label:"전체 날짜"}];
 $("#date-tabs").innerHTML=options.map(o=>'<button type="button" data-day="'+o.key+'" class="'+(dayFilter===o.key?'active':'')+'">'+esc(o.label)+'</button>').join('');
}
async function load(){
  const todayKey=seoulDateKey(new Date());
  window.dailyLoading=false;
  const data=window.NEWS_DATA;
  if(!data||!data.days||!data.days.today){
    $("#count").textContent="오늘 뉴스 데이터 준비 중";
    $("#feed").innerHTML='<div class="empty">오늘 뉴스 데이터를 준비하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday].filter(Boolean);
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="문화"&&/전시|공연|콘서트|영화|드라마|배우|가수|앨범|음악|미술|박물관|미술관|축제|출판|책|작가|문학|문화재|유네스코|한지|공예|연극|뮤지컬|예술|문화/.test(t)) score+=5;
  if(category==="생활"&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?allDays[0]?.date:allDays[1]?.date));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===window.NEWS_DATA.date?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
