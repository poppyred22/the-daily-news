<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><title>The Daily News</title>
<style>
:root{--bg:#f7f7f4;--ink:#191919;--muted:#858585;--line:#e7e7e1;--accent:#d9f36a;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{max-width:760px;margin:auto;padding:30px 20px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;font-weight:800}.date{font-size:11px;color:var(--muted)}
h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,68px);font-weight:400;letter-spacing:-3px;margin:25px 0 4px}.sub{font-size:12px;color:var(--muted);letter-spacing:.4px}
main{max-width:760px;margin:auto;padding:0 20px 60px}.tools{display:flex;gap:8px;margin:22px 0 16px}.search{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:9px;padding:13px;font-size:14px;outline:none}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:0 14px;font-size:12px;cursor:pointer}.btn.active{background:var(--accent);border-color:var(--accent)}
nav{display:flex;gap:7px;overflow:auto;padding:3px 0 15px;scrollbar-width:none}nav button{white-space:nowrap;border:0;background:transparent;padding:9px 13px;border-radius:20px;color:#777;font-size:12px;cursor:pointer}nav button.active{background:#202020;color:white}
.meta{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ink);padding:13px 0;font-size:11px;color:var(--muted)}.story{display:block;padding:19px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.storytop{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-bottom:9px}.source{font-weight:700;color:#555}.story h2{font-size:18px;line-height:1.45;letter-spacing:-.5px;margin:0 0 8px;font-weight:700}.desc{font-size:13px;line-height:1.65;color:#666;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.storybottom{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#999}.save{border:0;background:transparent;font-size:19px;padding:2px 4px;cursor:pointer;color:#888}.save.on{color:#111}.empty{text-align:center;padding:60px 10px;color:#888;font-size:13px;line-height:1.8}.foot{padding:28px 0;color:#aaa;font-size:10px;text-align:center}
</style></head>
<body>
<header><div class="top"><div class="brand">THE DAILY NEWS</div><div class="date" id="today"></div></div><h1>Daily<br>Brief.</h1><div class="sub">오늘의 뉴스를 가볍고 빠르게 읽는 나만의 브리핑</div></header>
<main><div class="tools"><input id="search" class="search" placeholder="기사 제목 또는 키워드 검색"><button id="refresh" class="btn">새로고침 ↻</button></div>
<nav id="tabs"></nav><div class="meta"><span id="count">기사를 불러오는 중</span><span id="sort">최신순</span></div><section id="feed"><div class="empty">최신 뉴스를 불러오고 있어요…</div></section><div class="foot">THE DAILY NEWS · 개인 뉴스 브리핑</div></main>
<script>
const categories=[["전체",""],["사회","사회"],["생활·문화","생활 문화"],["사건·사고","사건 사고"],["세계","세계"],["IT·과학","IT 과학"]];
let category="",items=[],saved=JSON.parse(localStorage.getItem("tdn_saved")||"[]"),showSaved=false;
const $=s=>document.querySelector(s);
$("#today").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
async function load(){ $("#feed").innerHTML='<div class="empty">뉴스를 불러오는 중…</div>';let q=category||"주요 뉴스";let feedUrl=new URL("https://news.google.com/rss/search");feedUrl.searchParams.set("q",q+" when:2d");feedUrl.searchParams.set("hl","ko");feedUrl.searchParams.set("gl","KR");feedUrl.searchParams.set("ceid","KR:ko");
try{const api="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feedUrl.toString());const res=await fetch(api,{credentials:"omit"});if(!res.ok)throw Error("뉴스 변환 서버 HTTP "+res.status);const data=await res.json();if(data.status!=="ok")throw Error(data.message||"RSS 변환 실패");let seen=new Set();items=(data.items||[]).map(x=>({title:x.title||"",link:x.link||"#",pubDate:x.pubDate||"",author:x.author||x.enclosure?.link||"Google 뉴스",description:x.description||""})).filter(x=>{let k=x.title.replace(/\\s+/g,"").toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true});if(!items.length)throw Error("검색 결과가 비어 있음");render()}catch(e){$("#feed").innerHTML='<div class="empty">뉴스 연결에 실패했어요.<br>새로고침을 눌러 다시 시도해 주세요.<br><small>'+esc(e.message||"연결 오류")+'</small></div>';$("#count").textContent="연결 오류";}}
function render(){let q=$("#search").value.trim().toLowerCase();let list=(showSaved?saved.map(s=>s):items).filter(x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q));$("#count").textContent=list.length+"개의 기사";$("#feed").innerHTML=list.length?list.map((x,i)=>{let link=x.link||"#";let date=x.pubDate?new Date(x.pubDate).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";let desc=(x.description||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").trim();let is=saved.some(s=>s.link===x.link);return '<article class="story"><div class="storytop"><span class="source">'+esc(x.author||"뉴스")+'</span><span>'+date+'</span></div><h2>'+esc(x.title||"제목 없음")+'</h2><p class="desc">'+esc(desc||"기사 원문에서 자세한 내용을 확인할 수 있습니다.")+'</p><div class="storybottom"><a href="'+attr(link)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">기사 원문 읽기 ↗</a><button class="save '+(is?'on':'')+'" data-save="'+i+'" aria-label="저장">'+(is?"★":"☆")+'</button></div></article>'}).join(""):'<div class="empty">표시할 기사가 없어요.</div>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;drawTabs();render();return}category=b.dataset.q;showSaved=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let b=e.target.closest("[data-save]");if(!b)return;let list=(showSaved?saved:items).filter(x=>{let q=$("#search").value.trim().toLowerCase();return !q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q)});let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];localStorage.setItem("tdn_saved",JSON.stringify(saved));render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
