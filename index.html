026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"'온갖 꽃이 한꺼번에 만개한다'는 뜻의 사자성어 '백화요란', 멤버 미나미가 새해 목표로 써 내려갔던 붓글씨는 올해 '중소돌의 기적'으로 현실이 됐습니다. 유튜브 속 솔직한 매력과 '거제 야호' 밈의 인기를 타고, 과거 발표한 '러브 어택'은 1년 11개월 만에 1위로 역주행했습니다. [원이 / 그룹 리센느 멤버 : 사실 기적이 쉽지 않잖아요. 근데 그 기적이라는 단어를 이렇게 붙여주셔서 너무 감사한 것 같고 또 한 번 또 기적이라는 단어를 다시 떠올리게 하는 그런 그룹이 되고 싶고요.] 유통가와 광고계 등 분야를 가리지 않고 협업하며 '리센느노믹스'란 신조어까지 낳았지만, 화제성이 식기 전 본업인 음악으로 대중성과 팬덤을 증명해야 하는 과제도 안고 있었습니다. [메이 / 그룹 리센느 멤버 : 잠깐 반짝할 화제성이 아니라 더 오래오래 리센느를 생각해주시고 리센느를 사랑해 주셨으면 좋겠다는 생각이 가장 큰 거 같아서… 더 열심히 하는 모습을 보여드리자 이런 얘기를 많이 나누는 것 같습니다.] 이번에 선보인 네 번째 미니앨범에선 체온을 닮은 '머스크 향'을 내세우며 고유의 향기 콘셉트를 이어 갔습니다. 팬들에게 친숙한 손글씨를 수록곡으로 재탄생시키며 팀의 성장 서사도 반영했습니다. [미나미 / 그룹 리센느 멤버 : (백화요란은) 평소에도 좋아하던 사자성어라 한 해의 목표로 써 봤는데, 이사님께서 그 글씨를 보시고 이렇게 아름다운 곡으로 탄생시켜 주신 거 같습니다.] 발매 직후 타이틀 '위드'는 국내 최대 음원 사이트 1위에 직행했고, 기존 발매 곡들까지 차트에서 자리를 지키며 순항하고 있습니다. 팬덤의 화력을 보여주는 음반 판매도 첫날 13만 장을 넘기며 지난 앨범 일주일 치 판매량을 하루 만에 제쳤습니다. '믿고 듣는 그룹'으로 기억되고 싶다는 리센느의 바람이, 확실한 대세 안착으로 결실을 맺을지 주목됩니다. YTN 이준엽입니다. VJㅣ유창규 영상편집 | 마영후 자막뉴스 | 김대천 ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"생활·문화"}],"세계":[{"title":"선거 참패 이틀 만에…백악관 집무실·각료회의실 보존 서명한 트럼프","link":"https://n.news.naver.com/article/009/0005759936","pubDate":"2026-11-06T19:19:18+09:00","author":"매일경제","description":"도널드 트럼프 미국 대통령이 백악관 집무실과 각료회의실을 국가기념물로 지정하는 포고문에 서명했다. 공화당의 중간선거 패배 직후 연회장 공사 현장을 방문한 데 이어 백악관 공간을 보..","category":"세계","naverLink":"https://n.news.naver.com/article/009/0005759936"},{"title":"��������, ȥ�� ��ߡ� �޶��ߴ� ����� �ݵ�","link":"https://n.news.naver.com/mnews/article/366/0001203181","naverLink":"https://n.news.naver.com/mnews/article/366/0001203181","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"뉴욕증권거래소(NYSE)에서 트레이더들이 업무를 보고 있다./연합뉴스 미국 뉴욕증시가 혼조 출발했다. 인공지능(AI) 데이터센터 규제 우려로 약세를 보였던 기술주 중심으로는 저가 매수세가 몰리는 모습이다. 6일(현지 시각) 오전 9시 35분 기준 뉴욕증권거래소(NYSE)에서 다우존스30산업평균지수는 전장보다 470.30포인트(0.91%) 하락한 5만1052.76을 나타냈다. 스탠더드앤드푸어스(S&P) 500지수는 21.68포인트(0.29%) 상승한 7375.41을, 나스닥 종합지수는 251.58포인트(1.03%) 오른 2만4566.57을 기록하고 있다. 시장은 미국 민주당의 상·하원 장악으로 AI 규제가 강화되고 데이터센터 건설에도 제동이 걸릴 수 있다는 우려가 커지면서 전날 기술주 중심 매도세가 거셌다. 전날 나스닥 종합지수는 5.52%, S&P500지수는 4.36%, 다우존스30산업평균지수는 3.44% 하락하며 마감했다. 이날은 급락했던 AI 관련주와 반도체주가 반등을 주도했다. 엔비디아는 7%, 샌디스크는 12%, 마이크론테크놀로지는 9% 수준의 상승폭을 기록했다. 다만 이날 고용시장이 예상보다 견조한 것으로 나타나 인플레이션 우려와 금리 인상 전망이 제기되면서 주가 반등은 제한됐다. 미국 10월 비농업 부분 일자리는 16만5000명 증가해 시장 예상치인 5만9000명을 크게 웃돌았다. 실업률도 시장 예상치인 4.2%를 소폭 하회한 4.1%를 기록했다.","category":"세계"},{"title":"NETHERLANDS GOVERNMENT","link":"https://n.news.naver.com/mnews/article/091/0010361234","naverLink":"https://n.news.naver.com/mnews/article/091/0010361234","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Weekly Council of Ministers meeting at the Ministry of General Affairs Eelco Heinen (L), Minister of Finance, arrives for the weekly Council of Ministers at the Ministry of General Affairs in The Hague, Netherlands, 06 November 2026. EPA/REMKO DE WAAL","category":"세계"},{"title":"\"�̶�, īŸ�� �� ����� ���� ��\"��ڸ�� ���� ���� ���ı� ���","link":"https://n.news.naver.com/mnews/article/421/0009275501","naverLink":"https://n.news.naver.com/mnews/article/421/0009275501","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"블룸버그 통신 보도…\"핵 활동 투명성 약속 시 평화 협상 진전\" 트럼프·카타르 국왕 통화…美 중간선거 이후 외교 움직임 무함마드 빈 압둘라흐만 알사니 카타르 총리 겸 외무장관(왼쪽)이 아바스 아라그치 이란 외무장관(오른쪽). 2026.8.27. ⓒ 뉴스1 ⓒ AFP=뉴스1 (서울=뉴스1) 이창규 기자 = 이란이 그동안 논의 대상에서 제외했던 핵 프로그램 관련 협상에 나설 의향을 보이고 있다고 블룸버그 통신이 6일(현지시간) 협상에 정통한 외교관을 인용해 보도했다. 이 외교관에 따르면 이란은 핵 활동과 관련해 중재국인 카타르가 제시한 제안을 검토하고 있다. 카타르가 제시한 제안의 구체적인 내용은 알려지지 않았다. 이란은 앞서 카타르를 통해 미국에 핵 관련 제안서를 전달한 것으로 알려졌다. 이란은 제안서를 통해 △이란 해상 봉쇄 해제 △모든 전선에서의 전쟁 중단 △이란 동결 자산 해제 등 7가지 조건을 제안한 것으로 알려졌다. 도널드 트럼프 미국 대통령은 이란과의 전쟁 주요 목표가 이란의 핵무기 개발을 막는 데 있다고 주장해 왔다. 그러나 이란은 자국의 핵 활동이 철저히 비군사적 목적이라는 입장을 유지했다. 미국과의 전쟁 이후 이란의 핵 활동이 어느 정도 이뤄졌는지는 알려지지 않았으나 핵 활동의 투명성을 높이겠다고 약속하는 것만으로도 평화 협상이 진전될 수 있다고 통신은 전했다. 이번 보도는 트럼프 대통령과 타밈 빈 하마드 알사니 카타르 국왕 간 전화 통화 이후 나왔다. 타밈 국왕은 전화 통화에서 \"대화를 이어가고, 분쟁을 해결하고 추가 확전을 막기 위해 외교적 수단에 의지하는 것이 중요하다\"고 말했다. 지난 3일 열린 미국 중간선거에서 트럼프 대통령과 공화당이 민주당에 상·하원을 모두 내주는 대패를 당하면서 이란 전쟁에도 변화가 생길 것이라는 관측이 제기됐다. 이란 전쟁에 따른 유가 상승이 선거에서 패배한 주요 원인으로 평가되기 때문이다. 트럼프 대통령은 선거 이후 당장 이란에 대한 추가 공습을 감행할 계획은 없다고 밝히기도 했다. 이란도 카타르를 비롯해 중동 국가들과 접촉하는 등 외교적 노력을 이어가고 있다. 아바스 아라그치 이란 외무장관은 지난 5일 사우디아라비아와 카타르 외무장관과 전화 통화를 하고 역내 안정을 구축하기 위한 노력에 대해 논의했으며, 아랍에미리트(UAE), 튀르키예, 쿠웨이트, 키프로스, 요르단 외무장관과도 통화했다.","category":"세계"},{"title":"TANZANIA LISSU VERDICT","link":"https://n.news.naver.com/mnews/article/091/0010361228","naverLink":"https://n.news.naver.com/mnews/article/091/0010361228","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"High Court of Tanzania set to deliver verdict in Tundu Lissu treason trial in Dar es Salaam A police vehicle carrying Tanzania's main opposition party Chadema, Tundu Lissu, drives out of the High Court in Dar es Salam, Tanzania, 06 November 2026. Lissu has been found guilty of inciting unrest and sentenced to four years in jail. EPA/STRINGER","category":"세계"},{"title":"India Hindu Festival","link":"https://n.news.naver.com/mnews/article/077/0007229333","naverLink":"https://n.news.naver.com/mnews/article/077/0007229333","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"India Hindu Festival People crowd a market as they shop ahead of Diwali festival in Mumbai, India, Friday, Nov. 6, 2026. (AP Photo/Rafiq Maqbool)","category":"세계"},{"title":"Emirates Abu Dhabi Championship Golf","link":"https://n.news.naver.com/mnews/article/077/0007229336","naverLink":"https://n.news.naver.com/mnews/article/077/0007229336","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Emirates Abu Dhabi Championship Golf Adrian Meronk of Poland hits his 2nd shot on the 18th hole during the second round of the Abu Dhabi Golf Championship in Abu Dhabi, United Arab Emirates, Friday, Nov. 6, 2026. (AP Photo/Altaf Qadri)","category":"세계"},{"title":"GERMANY TONGA DIPLOMACY","link":"https://n.news.naver.com/mnews/article/091/0010361232","naverLink":"https://n.news.naver.com/mnews/article/091/0010361232","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Tonga's King Tupou VI visits Berlin German President Frank-Walter Steinmeier (2-L) welcomes Tonga's King Tupou VI (L) during a reception with military honors at the German Federal Ministry of Defense, in Berlin, Germany, 06 November 2026. King Tupou VI is on an official visit to Berlin, as Germany and the Kingdom of Tonga are marking 50 years of diplomatic relations, according to the German federal foreign office. EPA/CLEMENS BILAN","category":"세계"},{"title":"FRANCE BUS CRASH","link":"https://n.news.naver.com/mnews/article/091/0010361236","naverLink":"https://n.news.naver.com/mnews/article/091/0010361236","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"FRANCE BUS CRASH. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"태극기 한가운데 테슬라 로고…머스크, 韓시장 9개월 연속 1위 홍보","link":"https://n.news.naver.com/article/003/0014307387","pubDate":"2026-11-06T22:50:25+09:00","author":"뉴시스","description":"[서울=뉴시스]정지연 인턴 기자 = 일론 머스크 테슬라 최고경영자(CEO)가 한국 수입차 시장에서 테슬라의 9개월 연속 1위 소식을 전하며 태극 문양 한가운데 자사 로고를 넣은 합성 이미지를 공유했다. 머스크는 지난 5일(현지시간) 자신의 엑스(X·옛 트위터) 계정에 '테슬라 코리아'(Tesla Korea)라는 문구를 게시하고 국내 수입차 판매 실적을 다룬 다른 이용자의 게시물을 공유했다. 해당 게시물 작성자는 \"테슬라가 한국 수입차 시장에서 벤츠와 BMW를 제치고 1위를 차지했다\"며 \"지난 10월 등록 대수는 9165대로, 지난해 같은 기간보다 110.7％ 늘었다\"고 밝혔다. 함께 첨부된 이미지에는 바람에 펄럭이는 태극기가 담겼다. 태극기의 가운데 태극 문양에는 테슬라의 알파벳 'T' 모양 로고가 들어가 있었다. 한국수입자동차협회(KAIDA)가 발표한 10월 수입 승용차 등록 통계에 따르면 국내 신규 등록 대수는 총 3만1117대였다. 브랜드별로는 테슬라가 9165대를 기록해 가장 많았다. 전체 등록 대수에서 차지하는 비중은 29.5%였다. 이어 메르세데스-벤츠가 6744대로 2위에 올랐고 BMW는 5633대로 3위를 기록했다. 테슬라와 2위 브랜드의 등록 대수 차이는 2421대였다. 차종별 집계에서는 테슬라 모델 Y 프리미엄이 5501대로 1위를 차지했다. 테슬라의 10월 신규 등록 대수는 지난해 같은 달과 비교해 110.7％ 증","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014307387"},{"title":"\"주문 넘쳐서\"…셀트리온, 삼성·롯데와 CMO 손잡는다","link":"https://n.news.naver.com/article/003/0014306755","pubDate":"2026-11-06T16:34:22+09:00","author":"뉴시스","description":"[서울=뉴시스]황재희 기자 = 셀트리온이 삼성바이오로직스·롯데바이오로직스와 CMO(위탁생산) 협력을 모색 중인 것으로 나타났다. 늘어나는 파이프라인과 글로벌 의약품 수요에 대응하기 위해서다. 6일 관련 업계에 따르면, 셀트리온과 롯데바이오로직스가 CMO 협력을 모색하고 있는 것으로 나타났다. 서정진 셀트리온 회장이 롯데바이오와 위탁생산 관련 논의를 진행 중이라고 한 언론이 보도하면서다. 다만 셀트리온은 당장 확정된 사항은 없다는 입장이다. 셀트리온 관계자는 “당사는 늘어나는 파이프라인과 글로벌 의약품 수요에 대응하기 위해 자체 생산시설 가동률을 극대화하는 한편, 외부 CMO 활용을 포함한 다양한 생산 전략을 상시 검토하고 있다”며 “고품질 의약품의 적기 공급을 위한 일반적인 전략 모색 차원이며, 특정 기업과의 협력 여부 등 확정된 사항은 없다”고 밝혔다. 업계에서는 양사의 니즈가 맞아떨어진다면 실제 계약으로까지 성사될 수 있다고 보고 있다. 두 회사 모두 송도에 위치해 물류·운송비용을 절감할 수 있다는 것이 최대 장점이다. 12만 리터 규모의 롯데바이오로직스 송도 1공장은 오는 18일 준공식을 열고 가동에 나선다. 한편 셀트리온은 앞서 삼성바이오로직스와 CMO 계약을 맺은 것으로도 파악됐다. 삼성바이오로직스는 지난 3일 글로벌제약사와 4343억원의 계약을 체결했다고 공시했다. 업계에서는 이 계약이 셀트리온과 맺은 계약으로 봤다. ◎공","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014306755"},{"title":"AI가 API 쓰고 스테이블코인으로 결제…쿠콘·DSRV 맞손","link":"https://n.news.naver.com/article/003/0014306357","pubDate":"2026-11-06T14:34:09+09:00","author":"뉴시스","description":"[서울=뉴시스]오동현 기자 = 쿠콘이 블록체인 인프라 기업 DSRV와 손잡고 블록체인 기반 금융 데이터와 인공지능(AI) 에이전트 결제 사업에 나선다. 쿠콘은 DSRV와 온체인 금융 데이터 응용프로그래밍 인터페이스(API) 및 AI 에이전트 결제 분야 협력을 위한 업무협약(MOU)을 맺었다고 6일 밝혔다. 온체인 데이터는 블록체인 네트워크에 기록되는 거래 정보 등을 말한다. 두 회사가 먼저 검토하는 분야는 스테이블코인의 결제·수납·정산 정보를 제공하는 API다. 금융기관과 기업이 블록체인 네트워크를 직접 조회하지 않고도 기존 금융 API처럼 지갑 잔액과 거래내역 조회, 입금 감지, 거래 확정 여부 확인, 정산용 데이터 제공 등의 기능을 쓸 수 있게 하는 것이 핵심이다. 쿠콘은 온체인 데이터를 API 형태로 금융기관·핀테크·기업 고객에게 제공하는 방안을 구체화하고, DSRV는 여러 블록체인의 데이터를 모아 처리하는 인프라를 바탕으로 원천 데이터 수집·처리와 기술 연동을 맡는다. AI 에이전트 결제 분야에서도 협력한다. 쿠콘이 MCP(모델 컨텍스트 프로토콜)로 제공하는 데이터 API에 x402 결제 프로토콜을 적용하고, DSRV의 지갑 기술과 블록체인 인프라를 연결하는 방식이다. x402는 API를 호출할 때 스테이블코인으로 결제를 처리하는 개방형 규약이다. 이를 적용하면 AI 에이전트가 별도 가입이나 계약 없이 필요한 API를 찾아 쓰","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014306357"},{"title":"�̱� AI ���� �Ҿȿ�������� ���ѱ��� ���� ���缱 �� �š�","link":"https://n.news.naver.com/mnews/article/032/0003481177","naverLink":"https://n.news.naver.com/mnews/article/032/0003481177","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"배경훈 부총리 겸 과학기술정보통신부 장관이 6일 서울 중구 국가인공지능전략위원회(AI전략위)에서 열린 제3차 전체회의에서 발언하고 있다. 연합뉴스 미국 중간선거 이후 인공지능(AI) 데이터센터 투자 위축 우려가 커지자 정부가 국내 AI 인프라 투자를 지속해야 한다고 강조했다. 미국의 투자 둔화는 일시적이며 글로벌 AI 경쟁은 계속될 것이라는 판단이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의를 마친 뒤 기자들과 만나 “한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦춰선 안 된다”고 말했다. 이어 “미국이 주춤하더라도 중국이나 프랑스, 캐나다 등 다른 국가들은 오히려 이를 기회로 삼을 수 있다”고 강조했다. 배 부총리의 발언은 미국 중간선거 이후 AI 투자 불안이 세계 증시로 확산하는 가운데 나왔다. 민주당이 상·하원을 장악하면서 데이터센터 규제가 강화될 수 있다는 관측이 나오자 5일(현지시간) 필라델피아 반도체지수는 12.25% 급락했다. 6년 7개월 만의 최대 낙폭이다. 6일 국내 증시에서도 삼성전자와 SK하이닉스가 각각 6.35%, 10.44% 하락했다. 배 부총리는 “AI에 대한 기대 심리가 큰 만큼 작은 불안 요인에도 시장이 크게 출렁일 수 있지만 개인적인 견해로는 장기적으로 우상향할 것으로 생각한다”고 말했다. 그는 이날 국회 과학기술정보방송통신위원회에서도 “잠시 주춤하더라도 미국은 다시 AI에 투자할 것이고, 이 기회를 삼아서 중국이나 프랑스, 캐나다가 빠르게 움직이고 있다”며 “저희도 빠르게 대응해야 한다”고 강조했다. 정부는 2029년까지 국내에 8.4기가와트(GW) 규모의 AI 데이터센터를 구축하고, 2035년까지 10GW를 추가할 계획이다. 이날 국회에서 황정아 더불어민주당 의원은 약 2000억원인 AI 데이터센터 직접사업 예산에 대해 “최소한 두 배 수준까지는 확대해야 이번 위기를 기회로 삼아 AI 패권국을 노려볼 수 있다”고 말했다. 배 부총리는 이재명 대통령이 신설 검토를 지시한 ‘사이버보안 차르’에 대해서는 “국가 차원의 사이버 안보 대응체계가 필요하다는 데 공감하고 있다”며 “국가안보실과 국무총리실, 관계부처가 민·관·군을 어떻게 아우를지 종합적으로 논의해야 하는 사안”이라고 말했다. 프런티어 AI 개발과 관련해서는 “결국 목표는 대한민국에서 프런티어 AI를 만들 수 있는 구조를 어떻게 짜느냐는 것”이라며 “독파모보다","category":"IT 과학"},{"title":"�Ｚ����Ʋ���� AI �۷���, ڸ�� 12�� �������ࡦȣ��Ų �Ǵн� �ռ���","link":"https://n.news.naver.com/mnews/article/008/0005437864","naverLink":"https://n.news.naver.com/mnews/article/008/0005437864","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"삼성전자가 7월 22일 영국 런던 올드 빌링스게이트에서 갤럭시 언팩 2026 행사를 열고 인텔리전트 아이웨어의 주요 기능과 새로운 디자인 2종을 공개했다./사진 제공=삼성전자 삼성전자와 젠틀몬스터가 협업한 AI(인공지능) 글래스가 미국에서 12일 사전예약에 들어간다. 젠틀몬스터는 할리우드 배우 호아킨 피닉스가 출연한 티저 영상을 공개하며 신제품 출시를 예고했다. 젠틀몬스터는 6일 호아킨 피닉스와 영화감독 조나단 글레이저가 참여한 '인텔리전트 아이웨어' 캠페인 필름의 티저 영상을 선보였다. 전체 영상은 이달 중 공개할 예정이다. 이번 제품은 삼성전자와 구글, 퀄컴이 협력하는 AI 글래스 프로젝트와 관련된 제품이다. 젠틀몬스터는 디자인 분야에서 협업하고 있으며 미국 아이웨어 브랜드 워비파커도 참여하고 있다. 워비파커 역시 12일부터 사전예약을 시작할 예정이다. 캠페인 영상은 낯선 호텔에서 기묘한 경험을 마주하는 세일즈맨의 이야기를 담았다. 호아킨 피닉스가 연기한 주인공은 현실과 환상이 뒤섞인 공간에서 정체를 알 수 없는 존재들과 마주한다. 이후 AI 안경을 통해 이들의 언어를 이해하고 소통하기 시작한다. 연출은 영화 '언더 더 스킨', '존 오브 인터레스트' 등을 제작한 조나단 글레이저 감독이 맡았다. 젠틀몬스터는 제품 기능을 직접 설명하는 대신 초현실적인 이야기를 통해 AI 안경이 제공할 새로운 경험을 표현했다고 설명했다. 삼성전자와 구글, 퀄컴이 협력하는 AI 글래스는 음성 기반 AI 비서와 실시간 번역, 길 안내, 카메라를 활용한 정보 검색 등의 기능을 지원할 것으로 예상된다. 삼성전자와 구글은 젠틀몬스터, 워비파커 등 글로벌 아이웨어 브랜드와 협력해 일상에서 착용할 수 있는 디자인 개발에도 나섰다. 다만 구체적인 제품 사양과 가격 등은 공개되지 않았다. 젠틀몬스터는 13일부터 23일까지 미국 뉴욕에서 일반 소비자를 대상으로 한 공개 체험 행사도 진행한다. 국내 출시 및 사전예약 일정은 아직 발표되지 않았지만 업계에서는 12월 출시 가능성이 거론된다.","category":"IT 과학"},{"title":"477�� ����� AI ���ȡ�������, '�⺻��' �߽� ��������","link":"https://n.news.naver.com/mnews/article/293/0000092865","naverLink":"https://n.news.naver.com/mnews/article/293/0000092865","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"하정우 국가인공지능(AI)전략위원회 상근 부위원장이 6일 서울 중구 서울스퀘어에서 제3차 전체회의를 주재하고 있다./사진 제공=국가AI전략위원회 국가 인공지능(AI) 전략을 총괄하는 국가AI전략위원회(AI전략위)가 출범 2년 차를 맞아 각 부처에 파편화된 AI 관련 법률 난립을 막기 위해 입법 가이드라인을 세우는 동시에 국민과 기업이 체감할 수 있는 현장 중심 성과를 내기 위해 거버넌스를 전면 재편한다. 특히 부처 간 데이터 칸막이를 허물어 848개 공공기관의 원천 데이터를 한곳에서 연계하는 범정부 파이프라인을 구축해 글로벌 AI 패권 경쟁 속 대한민국 AI 생태계의 실행력을 극대화한다는 전략이다. 신규 입법보다 기존 법체계 정비 우선 AI전략위는 6일 하정우 상근 부위원장 주재로 서울 중구 서울스퀘어에서 제3차 전체회의를 열었다. 이날 회의에는 이재명 정부의 AI 정책을 주도하는 하 부위원장, 배경훈 부총리 겸 과학기술정보통신부(과기정통부) 장관, 이해민 청와대 AI미래기획 수석을 포함해 정부·민간 위원, 관계 기관장 등 60여명이 참석했다. 이번 회의에서 AI전략위는 범정부 차원의 AI 입법 프레임워크를 마련하기로 했다. AI 기술이 의료·국방·제조·교육 등 산업 전반으로 확산하면서 관련 법률 제·개정 수요가 급증하자 정부 차원의 일관된 입법 원칙을 마련하기 위한 조치다. 22대 국회 개원 이후 약 29개월간 발의된 법률안 중 AI를 명시한 제·개정안은 477건으로 집계된다. 이는 21대 국회 4년간 발의된 170건과 비교하면 월평균 기준 약 4.7배 증가한 수치다. 업계 안팎에선 기술 진흥부터 딥페이크 오남용 방지, 산업별 AI 전환(AX)까지 부처별·의원별로 산발적으로 법안 발의가 이어지며 법안 간 충돌과 정책 피로도가 커졌다는 지적이 제기됐다. 범정부 차원 'AI 입법 프레임워크' 요약./사진 제공=국가인공지능(AI)전략위원회","category":"IT 과학"},{"title":"ڸ 'AI �ӵ�������' ƴ�� �İ��� ����ơ�'9.4�� ����'�� �븲��","link":"https://n.news.naver.com/mnews/article/293/0000092864","naverLink":"https://n.news.naver.com/mnews/article/293/0000092864","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"배경훈 부총리 겸 과학기술정보통신부(과기정통부) 장관이 6일 서울 중구 서울 스퀘어에서 열린 국가인공지능(AI)전략위원회 제3차 전체회의를 마친 뒤 취재진과 만나 질문에 답변하고 있다./사진=권용삼 기자 미국 중간선거에서 민주당이 압승하면서 인공지능(AI) 데이터센터 투자에 제동이 걸릴 수 있다는 우려가 나오는 가운데 배경훈 부총리 겸 과학기술정보통신부(과기정통부) 장관이 AI 인프라에 대한 투자를 지속 확대해야 한다는 입장을 내놨다. 미국이 AI 투자에 주춤하더라도 중국·프랑스·캐나다 등 다른 국가들은 오히려 이를 기회로 삼을 수 있는 만큼 우리나라 역시 긴장감을 낮추면 안 된다는 취지다. 배 부총리는 6일 서울 중구 서울 스퀘어에서 열린 국가인공지능(AI)전략위원회 제3차 전체회의를 마친 뒤 취재진과 만나 \"미국이 주춤한다고 해도 중국·프랑스·캐나다는 오히려 기회로 삼고 있다\"며 \"한국이 지금 분위기에 휩쓸려 투자를 멈추면 안 된다\"고 강조했다. 이어 \"AI에 대한 기대 심리가 큰 만큼 작은 불안 요인에도 시장이 크게 출렁일 수 있지만 개인적인 견해로는 장기적으로 우상향할 것으로 생각한다\"며 \"AI 속도조절론 얘기도 있지만 결국 AI를 통해 새로운 산업과 문화를 만들어 갈 것이기 때문에 투자를 계속 추진할 것\"이라고 덧붙였다. 이번 발언은 미국 중간선거 여파로 AI 데이터센터(DC)에 대한 규제 강화 가능성이 부각되면서 국내외 관련 기업의 주가가 하락하는 등 AI 인프라 투자 위축 우려가 나오자 이를 불식시키기 위한 행보로 풀이된다. 이달 3일(현지시간) 미국 연방의회 상·하원과 주지사를 뽑는 중간선거에서 AIDC 건설이 활발한 텍사스·조지아주 등에서 AI 속도조절론을 주장하는 민주당 주지사 후보자들이 잇달아 당선되면서 시장에선 AI 인프라 투자에 불확실성이 커진 상황이다. 미국 투자은행 골드만삭스는 \"주·지방 정부 선거에서 민주당이 승리함에 따라 데이터센터 사업이 일시 중단될 가능성이 있다\"며 \"이는 미국에서 계획된 데이터센터 용량 확대분의 약 45%에 영향을 줄 수 있다\"고 추정했다. 배경훈 부총리 겸 과학기술정보통신부 장관이 6일 서울 여의도 국회에서 진행된 과학기술정보방송통신위원회(과방위) 전체회의에서 답하고 있다./사진 제공=국회 방송 중계 캡처","category":"IT 과학"},{"title":"��������","link":"https://n.news.naver.com/mnews/article/056/0012289194","naverLink":"https://n.news.naver.com/mnews/article/056/0012289194","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 인공지능이 기존 음악을 편곡하는 수준을 넘어 이제 아예 새 곡까지 만들어내고 있습니다. 사람이 만든 곡과 구분하지 못할 정도로 완성도도 높아지고 있는데요. 이런 가운데 AI가 생성한 음악에도 저작권을 인정해야 하는지를 놓고 논란이 일고 있습니다. 강수연 기자가 취재했습니다. [리포트] 로봇 아티스트들이 경쾌한 리듬에 맞춰 춤을 춥니다. 흥이 나는 이 음악은 음악 제작 경험이 없는 직원들이 AI의 도움을 받아 만들었습니다. [김일유/브라이트벨 상무 : \"AI로 만들어진 음악을 부르고 춤추는 것 자체는 AI 로봇으로서의 정체성에 오히려 타당한 방법이 아닐까라는 생각이 들어서...\"] AI 음악 제작에 직접 도전해 봤습니다. 가을을 주제로 발라드 느낌의 노래를 만들어달라고 요청해보겠습니다. 30초도 안돼 가사와 멜로디가 완성됐습니다. 감사원 조사 결과, 국내 신규 위탁 음원의 60% 이상에 AI 활용 가능성이 제기되는 등 AI 음악은 갈수록 보편화되고 있습니다. 문제는 저작권과 수익 배분을 어떻게 할지입니다. 기존 창작자들은 AI 음악은 무단 학습 결과물이라며 정산 보류를 요구하고 있지만 AI 활용 측은 프롬프트 작성과 기획 등 기여도가 있다는 입장입니다. 한국음악저작권협회가 최근 마련한 AI 음악 저작권 신탁 등록 기준은 이런 논란 속에 철회됐습니다. AI 음악에서 원작자의 기여도를 분석하는 기술까지 개발되고 있습니다. [이종필/뉴튠 대표 : \"AI로의 음악 사용량이 명확하게 기록되고 추적되기 시작하면 그게 (저작권) 모든 문제를 해결하는...\"] 해외에서는 인간 기여도를 기준으로 AI 음악의 저작권료 지급 여부를 판단하는 만큼, 국내에서도 명확한 기준 마련이 시급하다는 지적이 나옵니다. KBS 뉴스 강수연입니다. 촬영기자:이재섭 방세준/영상편집:유지영/화면출처:치치앤키키, 조선힙합, 머무르/그래픽:김지혜 ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"IT 과학"},{"title":"��ü ���� ��� ���¿��� ��� ������ �������縷�� ������, ����Ÿ G-CON ����","link":"https://n.news.naver.com/mnews/article/109/0005636046","naverLink":"https://n.news.naver.com/mnews/article/109/0005636046","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"펄어비스 제공. [OSEN=고용준 기자] 글로벌 마켓에서 차세대 기술력 지표를 공인받은 국산 대작 타이틀이 국내 최대 규모의 개발자 콘퍼런스 전장에 출격해 고유의 엔진 아키텍처 노하우를 전면 공개한다. 오픈월드 액션 RPG ‘붉은사막’의 핵심 개발진들이 국내 대표 게임 개발자 콘퍼런스인 ‘G-CON 2026’ 메인 연사로 합류해 기술 상보를 공유한다. 지스타의 핵심 연계 행사이자 국내외 탑티어 개발자들이 전개하는 전술 교류의 장인 G-CON 2026은 오는 11월 19일 낮 12시 부산 벡스코 컨벤션홀 3층 특설 무대에서 개최된다. 이번 기술 세션에는 개발사 내부에서 전장의 그래픽과 공간 설계를 전담해 온 안근태 아트레벨 실장과 윤진호 게임엔진 그래픽스 실장이 전면 배치되어 국내 인프라 확장에 기여할 전망이다. 두 연사는 ‘붉은사막: 광활한 파이웰 대륙을 구현한 과정과 자체 엔진 기반 대규모 오픈월드 제작 기술’이라는 명확한 기술 팩트를 주제로 강연대에 오른다. 이번 콘퍼런스를 통해 공개될 세부 데이터는 외산 상용 엔진 의존도를 낮추고 독자 아키텍처 구축을 고심하는 국내외 개발사들에게 실질적인 가이드라인을 제공할 것으로 기대된다. 붉은사막의 메인 무대이자 사막, 설원, 초원 등 다채로운 기후 지표를 유기적으로 연동한 파이웰 대륙을 구현해 나간 실제 개발 공정 라인업이 세부적으로 다뤄진다. 특히 펄어비스가 다년간 공들여 빌딩해 온 차세대 개발 엔진 ‘블랙 스페이스 엔진(Black Space Engine)’을 활용한 대규모 오픈월드 렌더링 제작 기술 노하우가 베일을 벗는다. 개발진은 상용 엔진의 규격화된 한계를 극복하기 위해 자체 엔진 내부에서 빛의 물리적 산란을 시뮬레이션하는 그래픽스 파이프라인 개편 공정과 대규모 유저 트래픽 유입 시 발생할 수 있는 렌더링 병목 현상을 제어한 밸런싱 최적화 데이터를 공유할 방침이다. 아울러 개발자의 관점에서 해석한 게임 세계관의 물리적 공간 구성 과정과 플레이어의 실시간 전장 체류 및 몰입감 지표를 끌어올리기 위해 축적해 온 창작적·기술적 고민 데이터를 다채롭게 나눌 예정이다. 오픈월드 특유의 심리스 전장 환경에서 오브젝트와 캐릭터 간의 충돌 물리 매커니즘을 자연스럽게 구현하는 전술과, 단순한 비주얼 구현을 넘어 유저가 생태계와 상호작용하는 인지적 공간을 설계하는 빌드업 공정이 기획자들의 표심을 겨냥한다. 국내 세션에 앞서 글로벌 테크 무대를 통해 검증받은 기술 히스토리도 탄탄","category":"IT 과학"},{"title":"��2026 ���ϵ� ����: ���Žá� ������ ���֡� �������Ŀ function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}

}

  }
  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
