window.NEWS_DATA = {"date":"2026-11-08","generatedAt":"2026-11-07T10:16:29.639186+09:00","total":145,"days":{"today":{"date":"2026-11-08","weekday":"일요일","label":"오늘 · 11월 8일 일요일","total":59,"categories":{"사건 사고":[{"title":"장관들은 농담, 생존용품점은 특수…영국 뜻밖의 재난 대비 풍경","link":"https://n.news.naver.com/mnews/article/025/0003563473","naverLink":"https://n.news.naver.com/mnews/article/025/0003563473","pubDate":"2026-11-07T10:15:47.353459+09:00","author":"네이버뉴스","description":"\" “마스카라, 컨실러(잡티를 가리는 화장품), 소비뇽 블랑 와인 한 병.” \" 앤절라 레이너 영국 주택장관(왼쪽)이 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 앤디 번햄 총리 옆에서 발언하고 있다. 로이터=연합뉴스 앤절라 레이너 영국 주택장관이 지난 9월 한동안 버틸 수 있겠다며 농담처럼 꼽은 비상용품 목록이 약 한 달 뒤 다시 주목받았다. 영국 정부가 지난달 22일(현지시간) 국민에게 72시간을 버틸 비상물품을 갖추라는 ‘비 레디(Be Ready·대비하라)’ 캠페인을 시작하면서다. 이번에는 총리가 비상물품에 술을 넣어도 되느냐는 질문을 받고 술이 우선은 아니지만 한두 잔쯤은 괜찮다는 식으로 답했다. 월스트리트저널(WSJ)은 지난 2일 ‘영국은 종말에 대비하는데, 지도자들은 마스카라와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"“폭죽 테러 당했는데 경찰이 외면” 강릉 해변 ‘발칵’…20대男 주장 진실은","link":"https://n.news.naver.com/mnews/article/011/0004679679","naverLink":"https://n.news.naver.com/mnews/article/011/0004679679","pubDate":"2026-11-07T10:15:46.940935+09:00","author":"네이버뉴스","description":"강원 강릉 경포해변을 찾은 나들이객들이 피서를 즐기고 있다. 뉴스1 강원 강릉의 한 해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보가 경찰 조사 결과 거짓으로 밝혀졌다. 지난해 강원 양양에서도 성범죄와 마약 관련 허위 정보가 온라인에 퍼져 지역 상인들이 피해를 호소한 바 있다. 동해안 관광지를 겨냥한 가짜뉴스가 반복되면서 지역 이미지 훼손에 대한 우려가 커지고 있다. 폭죽 맞아 화상 입었다더니…사건 당시 강릉에도 없었다 6일 경찰 등에 따르면 강릉경찰서는 최근 강문해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보와 관련해 사실관계를 확인한 결과 피해 주장과 경찰의 신고 묵살 의혹이 모두 허위인 것으로 파악했다. 거짓 제보를 퍼뜨린 인물은 인천에 거주하는 27세 남성 A씨로 확인됐다. A씨는 인터넷에서 확보한 폭죽 영상과 2도 화상 사진을 자신의 피해 증거인 것처럼 꾸며 방송사와 온라인 커뮤니티 등에 전달한 것으로 조사됐다. A씨가 주장한 사건 발생 시점은 지난달 20일 저녁이었다. 그는 당시 강릉 강문해변에서 일부 남성이 사람을 향해 폭죽을 발사해 화상을 입었다고 주장했다. 경찰에 신고했지만 가해자의 신원을 확인하기 어렵다는 이유로 제대로 된 조치를 받지 못했다고도 했다. 하지만 경찰이 당시 행적을 추적한 결과 A씨는 강릉이 아닌 인천에 머물고 있었다. 주장한 피해 내용과 일치하는 112신고 기록도 존재하지 않았다. 다만 강문해변에서 실제 폭죽놀이가 이뤄진 정황은 확인됐다. 경찰은 현장에서 폭죽을 사용한 것으로 추정되는 20대 남성 2명의 신원을 파악하고 해수욕장법 위반 여부를 검토했다. 그러나 이들의 폭죽놀이와 A씨가 주장한 화상 피해는 별개인 것으로 확인됐다. 경찰이 피해 신고를 묵살했다는 주장 역시 사실이 아니었다. 관련 온라인 게시물은 현재 삭제된 상태다. 경찰은 A씨가 허위 정보를 퍼뜨린 경위를 살펴보고 명예훼손 등 혐의를 적용할 수 있는지 검토할 방침이다. 지난해 양양군 현남면 인구해수욕장에 내걸렸던 현수막. 뉴스1","category":"사건 사고"},{"title":"재판소원·대법관 증원에…대법·헌재 내년 건물값만 최소 100억","link":"https://n.news.naver.com/mnews/article/003/0014307518","naverLink":"https://n.news.naver.com/mnews/article/003/0014307518","pubDate":"2026-11-07T10:15:46.940927+09:00","author":"네이버뉴스","description":"증원 대법관 집무실·법원행정처 이전 등 100억 대법, 외부 임차청사 아직 못 구해…지연 우려 헌재, 임차료·운영비만 31억…별관 신축도 추진 [서울=뉴시스] 지난 3월 여당 주도로 국회를 통과한 '사법 3법'의 일환인 대법관 증원과 재판소원 제도에 따라 두 최고 사법기관이 내년 국회에 제출한 건물 값만 최소 100억원을 웃도는 것으로 나타났다. (사진=뉴시스DB). 2026.11.07. photo@newsis.com [서울=뉴시스]김정현 기자 = 지난 3월 여당 주도로 국회를 통과한 '사법 3법'의 일환인 대법관 증원과 재판소원 제도에 따라 두 최고 사법기관이 내년 국회에 제출한 건물 값만 최소 100억원을 웃도는 것으로 나타났다. 단순히 건물을 신·증축하는 것만 아니라 준비 기간 동안 외부 건물을 빌려 쓰기로 계획돼 있어, 몇 년 동안은 막대한 임차료를 세금으로 부담해야 할 것으로 보인다. 국회에서도 추진 상황을 꼼꼼히 점검하고 재정 부담을 완화할 대책을 마련할 필요가 있다는 지적이 나왔다. 7일 대법원과 헌법재판소의 내년도 예산안에 대한 국회 법제사법위원회 전문위원 및 국회예산정책처의 검토 보고서를 종합하면, 대법원은 내년 대법관 증원을 준비하는 데에만 99억5600만원을 새로 편성했다. 따로 잡힌 대법관 집무실 신설을 위한 자산취득비(비품 등 구입) 1억4000만원을 합하면 100억원을 넘는다. 지난 3월 법원조직법이 개정되면서 대법관 수는 대법원장을 포함해 현행 14명에서 26명이 된다. 증원되는 12명은 2028년부터 2030년까지 매년 4명씩 늘어난다. 이에 대법원은 재판연구관들이 사용하던 서울 서초구 청사 본관 12~15층을 증원되는 대법관들의 업무 공간으로 활용하기로 가닥을 잡았다. 현재는 지상 16층 청사 중 7~10층을 층당 3명의 대법관들이 쓰고 있다. 우선 내년 9월부터 대법원 본관 12층에 3명, 13층에 1명의 대법관 집무실 공사를 시작해 다음 해 2월까지 공사를 마무리한다. 여기에만 22억5100만원이 들어간다. 증원되는 대법관 사무실 면적은 213㎡로, 기존(266㎡)보다 작은 방을 쓴다. 장관이나 국회의원 사무실(165㎡)보다는 넓은 수준이지만, 사건 서류와 이를 검토할 전속재판연구관 등이 일할 공간도 포함된 면적이다. [서울=뉴시스] 대법원은 2028년부터 2030년까지 대법관 12명이 증원됨에 따라 내년에만 99억5600만원을 편성해 대법관 집무실 신설과 부서 이전 사업을 추","category":"사건 사고"},{"title":"복통에 구토·고열·혈변까지…응급실 찾아야 할 위험 신호","link":"https://n.news.naver.com/mnews/article/018/0006405446","naverLink":"https://n.news.naver.com/mnews/article/018/0006405446","pubDate":"2026-11-07T10:15:46.940921+09:00","author":"네이버뉴스","description":"소화불량부터 맹장염·담석·요로결석까지 원인 다양… 응급실 찾는 위험 신호 [이데일리 이순용 의학전문기자] 평소 건강했던 40대 직장인 A씨는 저녁 식사 후 갑자기 배가 아팠다. 과식 탓이라 생각해 소화제를 먹고 쉬었지만 통증은 가라앉지 않았고, 메스꺼움까지 겹치자 결국 응급실을 찾았다. 갑작스러운 복통이 생기면 대부분 소화불량부터 떠올린다. 실제로 과식이나 변비, 장염처럼 흔한 원인이 많지만 맹장염이나 담석, 요로결석처럼 서둘러 치료해야 하는 병의 신호일 수도 있다. 복통은 가볍게 시작했다가 빠르게 나빠지기도 하므로 참을 수 있느냐만으로 응급실 방문 여부를 판단해서는 안 된다. 급성 복통은 갑자기 생기거나 이전보다 뚜렷하게 심해지는 배의 통증이다. 위와 장뿐 아니라 쓸개, 췌장, 신장, 요로 등 여러 장기가 원인이 될 수 있다. 가장 흔한 원인은 소화불량과 위장염이지만 배가 심하게 부풀고 대변이나 방귀가 나오지 않는다면 장이 막히는 장폐색일 수 있어 확인이 필요하다. 또한 맹장염, 담석증, 요로결석도 흔한 원인이다. 맹장염은 배꼽 주변이나 가슴뼈 아래 오목한 명치에서 시작된 통증이 오른쪽 아랫배로 옮겨가는 것이 특징이다. 메스꺼움, 구토, 열이 함께 나타나며 치료가 늦어져 맹장이 터지면 배 속 전체에 염증이 퍼지는 복막염으로 이어질 수 있다. 담석증은 쓸개나 담도에 돌이 생기는 병으로 주로 명치나 오른쪽 윗배가 아프다. 기름진 음식을 먹은 뒤 통증이 생기거나 오른쪽 어깨와 등으로 퍼지기도 한다. 열과 오한에 더해 피부와 눈 흰자가 노랗게 변하는 황달까지 나타나면 염증이 생겼을 가능성이 있다. 요로결석은 옆구리에서 시작된 통증이 아랫배와 사타구니 쪽으로 이어지고 극심한 통증과 잠잠함이 반복된다. 소변에 피가 섞이기도 한다. 모든 복통에 응급실 진료가 필요한 것은 아니지만 다음과 같은 증상이 있다면 응급 상황일 수 있다. 참기 힘들 만큼 극심하거나 빠르게 심해지는 통증은 장기 염증이나 장에 구멍이 생기는 천공 등 긴급한 치료가 필요한 병일 수 있다. 피가 섞인 구토, 선홍색 혈변, 검고 끈적한 변은 소화기관 출혈의 신호이며, 어지럼증과 식은땀이 더해지면 더욱 위험하다. 구토가 반복되고 고열과 오한이 나타나거나 배가 부풀면서 대변과 방귀가 멈춘 경우에도 즉시 응급실에 가야 한다. 특히 기절, 의식 저하, 호흡곤란, 가슴 통증이 함께 나타나면 심장이나 혈관 등 다른 응급질환일 수 있다. 이때는 직접 운전하지 말고 11","category":"사건 사고"},{"title":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다","link":"https://n.news.naver.com/mnews/article/215/0001271980","naverLink":"https://n.news.naver.com/mnews/article/215/0001271980","pubDate":"2026-11-07T10:15:46.940917+09:00","author":"네이버뉴스","description":"임시조치 닷새만에 베란다 창문으로 들어가 가족 접근 지인 집 도어락 부수고 금품 절도까지 사진=연합뉴스 어머니와 외할머니를 폭행해 법원으로부터 접근금지 명령을 받은 30대 남성이 불과 닷새 만에 베란다 창문을 통해 집에 들어갔다가 처벌받았다. 춘천지법 형사3단독 박동욱 판사는 가정폭력범죄의 처벌 등에 관한 특례법 위반 혐의 등으로 재판에 넘겨진 A(37)씨에게 징역 10개월에 집행유예 2년을 선고했다고 7일 밝혔다. 아울러 보호관찰과 사회봉사 120시간도 명령했다. 공소사실에 따르면 A씨는 지난 6월 어머니와 외할머니를 때려 법원으로부터 주거지 즉시 퇴거와 가족들에 대한 접근·연락을 금지하는 임시 조치를 받았다. 그러나 A씨는 법원의 결정을 무시하고 닷새 만에 베란다 창문을 통해 집 안으로 들어가 가족들에게 접근했다. 비슷한 시기 평소 알고 지내던 지인의 집에 침입해 금품을 훔치기도 했다. 그는 술자리에서 알게 돼 친분을 쌓은 B씨의 집 현관문 도어락을 소화기로 내리쳐 부순 뒤 집 안으로 침입한 뒤 거실에 놓여 있던 B씨의 가방에서 차량 스마트키와 6장을 훔친 것으로 드러났다. 박 판사는 \"범행을 모두 인정하며 반성하고 있으나 존속폭행으로 임시 조치 결정을 받았는데도 가족들에게 접근하고, B씨의 집에 침입해 절도 범행을 저질러 죄질이 좋지 않으며, 피해자들과 합의하지 못한 점 등을 종합해 형을 정했다\"고 판시했다.","category":"사건 사고"},{"title":"“사지 마” 입담에 인파 폭발… 경찰 출동한 ‘남대문 스카프’ 결국","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:15:46.940912+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:15:46.940894+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로","link":"https://n.news.naver.com/mnews/article/028/0002831127","naverLink":"https://n.news.naver.com/mnews/article/028/0002831127","pubDate":"2026-11-07T10:15:46.940892+09:00","author":"네이버뉴스","description":"피해자가 요청한 ‘학급 교체’, 교육청 권고에도 학교장은 외면 사진은 기사 내용과 무관. 게티이미지뱅크 서울 시내 한 중학교에서 학교폭력을 겪은 피해자가 학교에 ‘학급 교체’를 지속해서 요청했지만, 거절당한 것으로 확인됐다. 사태 파악에 나선 서울특별시교육청 학생인권옹호관마저 학교에 ‘학급 교체 검토’를 제안했는데, 권한이 있는 교장은 ‘다른 사건과의 형평성’을 이유로 응하지 않고 있다. 학폭 신고했더니 돌아온 건 ‘맞학폭’ 서울 성북구 개운중학교에 다니는 ㄴ양은 2026년 5월부터 특정 무리한테 놀림을 당했다. 한겨레21이 입수한 학교폭력대책심의위원회(학폭위) 회의록을 보면, 학교폭력 가해자로 신고당한 개운중 동급생들은 ㄴ양과 눈이 마주치자, “코알라가 꼬나본다” “노무현, 코알라, 노숙자 중에 뭐로 불러줄까”라고 말하며 조롱했다. ‘코알라’는 극우 커뮤니티 등에서 노무현 전 대통령의 외모를 희화화하려고 쓰는 멸칭이자 혐오 표현이다. 이들은 ㄴ양의 귀에 대고 소리를 지르거나, 여럿이 모여 주변을 “펄쩍펄쩍” 뛰면서 돌고 6분가량 동물 소리를 지르고 얼굴을 “5㎝” 가까이 들이밀기도 했다. 동급생들의 괴롭힘을 견디지 못한 ㄴ양은 6월18일 가해 학생들을 신고했다. 그는 8월10일 열린 학폭위에 출석해 “다른 친구들과 관계가 좋았지만, 가해자들이 놀리기 시작하면서 친구들도 나를 피했다”고 호소했다. 가해 학생들의 부모는 사건 초기 서면 사과로 무마하려다 신고당하자, 되레 학폭으로 ㄴ양을 신고했다. ㄴ양 아버지는 “가해자나 가해자 학부모들은 전혀 반성하지 않고 사과의 진정성이 없다”며 “학생부 생활센터 지도 선생님들이 (가해) 아이들을 불러 야단쳤더니 오히려 학부모들이 ‘당신들이 뭔데 우리 애를 야단치고 가해자 몰이를 하느냐’며 화냈다고 들었다”고 말했다. 보호자와 함께 학폭위에 출석했던 가해 학생 중 일부는 조사관과의 진술마저 뒤집으며 학폭을 부인하기도 했다. 한 가해자의 어머니는 맞학폭을 신청한 이유를 묻는 말에 “ㄴ양을 향한 보복이라기보단 저희 아이의 억울한 상황을 조금 이야기해야겠다는 차원”이라고 설명했다. 교장 “학폭위 결정 없었으니…” 학폭위는 8월10일 ㄴ양의 신고 내용 대부분을 사실로 인정해 신고당한 같은 반 동급생 5명에게 징계를 내렸다. 이 중 3명은 ‘서면 사과’ 외에 ‘학교 봉사, 특별교육 이수, 보호자 특별교육 이수, 피해자 접촉·협박 및 보복행위 금지’ 처분을 받았다. ㄴ양 부모는 추가로","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:15:46.940888+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"김민석 사과하면 끝? '수사' 촉구하는 조선·중앙일보","link":"https://n.news.naver.com/mnews/article/006/0000138618","naverLink":"https://n.news.naver.com/mnews/article/006/0000138618","pubDate":"2026-11-07T10:15:46.940868+09:00","author":"네이버뉴스","description":"[AI 뉴스 브리핑] ▲김민석 더불어민주당 대표가 2026년 11월5일 당내 신천지 비밀연합 폭로를 두고 의총에서 증거가 없었다고 인정하고 비공개 사과한 것과 관련해 민티07에 출연해서도 당원여러분께 죄송하기도 하고 감사하기도 하다라고 사과하고 있다. 사진=민티07 영상 갈무리 김민석 더불어민주당 대표는 지난 8월 전당대회 때 경쟁 후보를 겨냥해 제기했던 신천지 관련 의혹에 증거가 없었다며 사과했다. 민주당은 자체 조사 보고서를 전면 공개하지 않고 당내 인사들이 제한적으로 열람하도록 했다. 보수언론에선 수사를 촉구했다. 6일 주요신문 사설을 정리했다. 민주당 신천지 의혹에 조사 결과 공개와 수사 요구 조선일보는 에서 김 대표의 의혹 제기와 조사 결과 비공개를 함께 문제 삼았다. \"김 대표가 전대 과정에서 신천지를 끼운 '3자 연합설'로 정치적 이득을 노렸다는 것은 부인하기 어렵다\"며 \"김 대표 스스로 허위사실을 공표했다고 자백한 셈인데 이런 식의 사과로 끝날 일인지 의문이다\"라고 했다. 이어 국민의힘 관련 신천지 의혹 수사와 비교했다. \"민주당 사정도 별반 다르지 않다는 소문이다. 전국동시지방선거가 있었던 2022년 이후 민주당에 입당한 신천지 신도가 적어도 2만~3만명이라고 한다\"고 전하면서 \"사실이라면 김 대표 말처럼 덮고 지나갈 일이 아니다\"라고 했다. 인용된 입당 규모는 사설에서 소문으로 제시한 수치다. 중앙일보도 에서 제한적 열람으로는 의혹을 해소하기 어렵다고 했다. \"조사 결과는 비공개로 묶은 채 관련 자료만 제한적으로 의원들에게 열람하게 하는 미봉책을 택했다\"며 \"뭔가 숨기는 게 있다는 의심만 짙어진다\"고 비판했다. 중앙일보는 국민의힘 관련 의혹에 검경 합동수사본부의 강제수사가 이뤄진 점을 들었다. \"민주당에도 같은 원칙과 잣대가 적용돼야 마땅하다\"며 \"민주당은 사안을 덮으려 하지 말고 수사기관에 정식 의뢰해 있는 그대로 진상을 밝혀야 한다\"고 촉구했다. 대통령 유튜브 방송에 소통 확대보다 경청 요구 이재명 대통령은 5일 개인 유튜브 채널을 통해 방송 '대통령의 Y'를 시작했다. 청와대는 2~3주 간격으로 방송을 이어가되 주요 현안이 생기면 횟수를 늘릴 수 있다고 밝혔다. 이 대통령은 첫 방송에서 사회관계망서비스(SNS) 등을 통한 직접 소통이 \"목숨줄 같은 존재\"라고 말했다. 세계일보는 에서 기존 SNS 활동에 유튜브 방송까지 더해지는 점을 우려했다. \"견제 없는 일방적 메시지 전달에 얼마나 많은","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:15:47.918842+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:15:46.940937+09:00","author":"네이버뉴스","description":"[김형자 과학칼럼니스트 sisa@sisajournal.com] 안경테에 내장된 카메라로 문제 촬영, AI가 분석해 렌즈에 정답 띄워 신종 부정행위 도구로 악용되는 스마트 기기…당국 '엄벌' 경고 속 대응 고심 시험지를 바라보는 수험생. 안경테에 숨겨진 카메라가 문제를 촬영하고, 인공지능(AI)이 순식간에 답을 찾아낸다. 정답은 안경을 쓴 사람만 볼 수 있는 작은 화면에 나타난다. 겉보기엔 평범한 안경이지만, 실제로는 AI가 대신 문제를 풀고 있는 셈이다. 11월19일 치러지는 2027학년도 대학수학능력시험(수능)을 앞두고 교육 현장에 비상이 걸렸다. 최근 연세대와 서울시립대 논술시험장에서 AI 스마트 안경(AI 안경)을 이용한 부정행위가 잇따라 적발된 데 이어 올해 국가자격시험에서도 5건의 부정행위가 확인됐기 때문이다. 첨단 기술이 가져온 편리함이 이제는 시험의 공정성을 흔드는 새로운 변수로 떠올랐다. ⓒChatGPT 생성이미지 일반 안경으로 위장한 'AI 기기' 식별법은 수능 출제기관인 한국교육과정평가원(평가원)과 교육부는 2027학년도 수능부터 AI 안경을 반입 금지 물품으로 지정하고 강력한 제재 방침을 내놨다. AI 안경을 이용해 부정행위를 한 수험생은 형사고발하거나 수사를 의뢰하는 등 엄정하게 대응한다는 계획이다. 시험 중 착용은 물론 가방 등에 소지하는 것만으로도 해당 시험이 무효 처리되고, 다음 해 응시 자격도 정지된다. 현재 1년인 응시 자격 정지 기간을 최대 3년으로 확대하는 방안도 추진 중이다. 나아가 논술·면접 등 대학별 고사에서도 강화된 제재 방침을 적용할 수 있도록 각 대학에 권고하기로 했다. 문제는 AI 스마트 안경이 일반 안경과 외형상 큰 차이가 없어 현장에서 쉽게 식별하기 어렵다는 점이다. 그렇다면 시험장에서는 과연 어떤 단서로 이 위험한 기기를 가려내야 할까. AI 안경은 일반 안경에 인공지능 기능을 결합한 웨어러블 기기다. 안경테 안에는 카메라와 마이크, 소형 스피커 등이 탑재돼 있고, 일부 제품은 렌즈에 작은 화면을 띄우는 디스플레이까지 갖추고 있다. 작동 방식은 크게 세 단계로 나뉜다. 먼저 안경에 달린 카메라가 사용자의 바라보는 풍경이나 사물을 촬영하고, 마이크는 사용자의 음성과 주변 소리를 수집한다. 이렇게 모아진 정보는 스마트폰이나 인터넷을 거쳐 AI에 전달된다. 그러면 마지막으로 AI가 이미지와 음성을 분석해 사물을 식별하거나 사용자의 질문에 답한다. 분석 결과는 소형","category":"사회"},{"title":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]","link":"https://n.news.naver.com/mnews/article/011/0004679681","naverLink":"https://n.news.naver.com/mnews/article/011/0004679681","pubDate":"2026-11-07T10:15:46.940931+09:00","author":"네이버뉴스","description":"‘피터팬 아빠’ 전경철 작가 뜻 잇는 임지영 피터팬재단 총괄디렉터 인터뷰 “복지부 재단법인 설립허가 기다려” “다시는 이 땅에, 피터팬이라는 이유로 세상 밖으로 내몰리는 아이가 없어야 한다. 더는 길이 보이지 않아, 자식과 자신을 포기하는 부모가 없기를 바란다.” (책 ‘안녕, 피터팬’ 中) 전경철 작가가 지난 7월 출간한 에세이 ‘안녕, 피터팬’을 들고 있다. 전 작가 브런치 캡처 지난 9월 5일. 전 국민을 울렸던 ‘피터팬 아빠’ 전경철 작가가 세상을 떠났다. 반평생 중증 자폐 아들을 돌보다 눈감은 전 작가의 마지막 소원은 단 하나, ‘피터팬재단’ 설립이었다. 피터팬재단은 성인 중증 자폐인들이 행복하게 살아갈 수 있는 마을 ‘네버랜드’ 건립을 목표로 한다. 피터팬재단 설립추진위원회는 전 작가가 숨지기 전날인 9월 4일 재단법인 설립 심사 신청을 냈다. 그로부터 두 달이 흘렀지만, 전 작가의 꿈은 미완으로 남아있다. 보건복지부의 재단법인 승인이 나지 않아서다. 임지영 피터팬재단 설립추진위원회 총괄디렉터를 만나 재단 설립 추진 과정을 들어봤다. 전경철(오른쪽) 작가와 그의 아들 전제원 씨. 전 작가 브런치 캡처","category":"사회"},{"title":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]","link":"https://n.news.naver.com/mnews/article/011/0004679685","naverLink":"https://n.news.naver.com/mnews/article/011/0004679685","pubDate":"2026-11-07T10:15:46.940923+09:00","author":"네이버뉴스","description":"정보근 법무법인 리움 대표 변호사 정보근 변호사의 부동산법을 부탁해 얼마 전 오래전부터 알고 지낸 지인의 부탁으로 이혼소송을 진행한 적이 있다. 이들 부부는 10년 정도 결혼 생활을 유지하고 아이도 낳아 키우다가 불화 끝에 결국 헤어졌다. 전문직에 종사 중인 지인은 혼인 중 아파트를 포함해 예금, 자동차 등 상당한 재산을 취득했다. 이혼을 하며 재산을 분할하는 과정에서, 공동명의로 보유한 아파트는 일반적으로 한쪽이 아파트 소유권을 전부 취득하되, 다른 한쪽에 현금을 지급하는 형태로 정리된다. 이혼하는 마당에 공유지분을 유지할 수 없고, 공유지분 일부만 매각하면 제대로 된 값에 팔리지 않으니 손해가 크기 때문이다. 실제로 해당 사안에서도 남편은 아내가 보유한 공유지분을 이전받는 대신 재산분할로 현금 수억 원을 지급했다. 그런데 여기서 한 가지 의문이 생긴다. 이혼 시 재산분할 과정에서 지급받은 현금 수억 원에 대해 증여세가 부과될까. 결론부터 얘기하면 증여세가 부과되지 않는다. 이유는 재산분할은 혼인 중 공동으로 형성한 재산을 청산·분배하는 것이기 때문이다. 이혼 시 재산분할 과정에서 증여세 미과세의 경우와 비교해 배우자 사망 시 상속세가 부과되는 것은 형평성의 문제가 있다는 지적이 있다. 만약 부부가 백년해로하다 남편이 먼저 사망하는 경우 아내는 높은 상속세를 납부하는 반면, 오히려 이혼으로 재산분할을 하는 경우에는 증여세를 내지 않는다는 것이 불합리하다는 것이다. 부부간 상속세 폐지를 주장하는 논리 중 하나 또한 재산분할의 경우에도 증여세가 없다는 점이 근거로 제시되기도 한다. 동일한 아파트 한 채를 두고 배우자 간 이혼과 상속의 경우 전혀 다르게 취급할 본질적인 이유가 있는가. 이는 조세정책상의 결단 사항일 뿐 양자 사이에 본질적인 차이는 없는 것으로 보인다. 실제로 과거에는 이혼 재산분할이 상속세 배우자 공제액을 초과하면 그 초과분을 일률적으로 증여로 봐 과세하는 법률이 존재하기도 했다. 물론 이 법조항은 재산분할과 상속은 재산관계와 신분관계라는 점에서 본질적으로 다르다는 이유로 헌법재판소에서 위헌 결정이 났으나, 필자가 보기에 양자를 달리 취급하는 근거가 선뜻 이해가 되지 않는다. 실제로 상속세를 걱정해 ‘황혼 이혼’을 하는 사례도 심심치 않게 있다고 한다. 절세를 위해 황혼 이혼까지 고려되는 이유는 최근 아파트 가격 급등으로 인해 상속세 부과 대상인 사람이 급증했기 때문이다. 통계에 따르면 지난해 상속","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:15:46.940914+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:15:46.940910+09:00","author":"네이버뉴스","description":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:15:46.940903+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"식탁 위에 방치했던 복권, '5억원'이었다","link":"https://n.news.naver.com/mnews/article/008/0005437920","naverLink":"https://n.news.naver.com/mnews/article/008/0005437920","pubDate":"2026-11-07T10:15:46.940901+09:00","author":"네이버뉴스","description":"스피또1000 110회차 1등 당첨 복권 사진과 당첨자 소감/사진=동행복권 가족에게 당첨 여부를 확인해 보라고 건넨 뒤 한동안 방치했던 복권이 5억원에 당첨된 사연이 소개됐다. 최근 동행복권에 따르면 서울 중랑구 면목로31길의 한 복권 판매점에서 판매된 스피또1000 110회차에서 1등 당첨의 주인공이 나왔다. 당첨자 A씨는 평소 매주 로또와 스피또를 1만원어치씩 구매했다. 어느 날 복권 판매점에 들러 스피또1000 5장을 구매해 집으로 돌아왔다. 복권을 본 가족들이 당첨 여부를 확인해 보고 싶다고해 A씨는 복권을 가족들에게 건네준 후 다른 볼일을 봤다. 이후 가족이 당첨된 것이 맞는지 확인해달라고 했지만, A씨는 소액에 당첨됐을 거라고 생각하고 하던 일을 계속했다. 얼마 후 A씨는 식탁 위에 복권이 올려져 있어 살펴봤는데 놀랍게도 '5억원'에 당첨돼 있었다. A씨는 \"전혀 예상하지 못한 큰 금액에 순간 너무 놀라 아무 말도 나오지 않았고, 한동안 얼떨떨한 기분이었다\"며 \"이런 큰 행운이 우리 가족에게 찾아왔다는 것이 너무 감사하고 행복한 마음\"이라고 말했다. 그는 \"당첨금은 전세 자금으로 보태쓰려고 한다\"고 덧붙였다. 스피또1000은 행운 숫자가 자신의 숫자 6개 가운데 하나와 일치하면 해당 당첨금을 받는 즉석 복권이다. 판매 가격은 1000원이다. 1등 당첨금은 5억원이다.","category":"사회"},{"title":"‘대법관 증원’에 공간확보 예산만 100억...행정처, 내년 6월 대법원 떠난다","link":"https://n.news.naver.com/mnews/article/025/0003563477","naverLink":"https://n.news.naver.com/mnews/article/025/0003563477","pubDate":"2026-11-07T10:15:46.940899+09:00","author":"네이버뉴스","description":"서울 서초구 대법원 청사 전경. 뉴스1 대법관을 현행 14명에서 26명으로 늘리는 법원조직법이 통과되면서 내년 대법원 공간 확보 예산에만 100억원 가량이 소요되는 것으로 나타났다. 이를 위해 법원행정처 일부 부서는 내년 6월부터 대법원을 떠나게 된다. 국회 법제사법위원회의 ‘2027년도 대법원 소관 예산안 검토보고서’ 등에 따르면 대법관 증원에 따른 공간 재배치 사업비용으로 내년에 편성된 예산은 총 99억 5600만원이다. 대법관 집무실 신설 예산으로 22억 5100만원, 재판연구관실 이전 예산으로 27억 8900만원, 법원행정처 외부 청사 이전 예산으로 49억 1600만원이 편성됐다. 대법원은 대법관 증원에 필요한 공간을 확보하기 위해 대법원 청사 본관 12~15층에 집무실을 신설할 계획이다. 대법원 본관 12층에 대법관 3명, 13층에 1명을 위한 집무실이 들어선다. 현재 대법관들은 대법원 본관 7~10층에 각 층 3명씩 근무하고 있고, 본관 12~15층은 재판연구관실로 사용하고 있다. 당초 본관 12~15층을 사용하던 재판연구관들은 대법원 청사 동관에서 근무하게 된다. 동관 3~5층에서 근무 중인 법원행정처 일부 부서는 외부 임차사무실로 순차적으로 이전하겠다는 계획이다. 대법원은 현재 외부에 임차할 사무실을 물색하고 있고, 내년 초에 외부로 이전할 법원행정처 부서도 확정할 예정이다. 국회예산정책처가 지난달 발간한 '2027년도 예산안 위원회별 분석'에 수록된 대법원 청사 이전 계획안에 따르면, 대법원은 본관 12~15층을 대법관 집무실로 활용할 계획이다. 국회예산정책처","category":"사회"},{"title":"'계몽'을 외칠수록 위헌·위법성이 드러난다‥윤석열의 '캐치-22' [서초동M본부]","link":"https://n.news.naver.com/mnews/article/214/0001534104","naverLink":"https://n.news.naver.com/mnews/article/214/0001534104","pubDate":"2026-11-07T10:15:46.940896+09:00","author":"네이버뉴스","description":"━ ■ \"스스로 미쳤다는 것을 아는 미치광이는 진짜 미치광이가 아니다.\" 조지프 헬러의 라는 소설이 있습니다. 1961년 출간됐고, 2차 세계대전을 배경으로 한 대표적인 반전(反戰) 풍자소설입니다. 제목 는 '22번 조항'이라는 뜻입니다. 주인공 요사리안 대위는 야전에서 빠져나가는 방법을 궁리하다 '캐치-22'에 꽂힙니다. 정신질환이 있다는 사실이 확인되면 전투임무에서 배제될 수 있다는 내용입니다. 하지만 결정적인 모순이 있습니다. 자신이 미치광이라는 걸 스스로 알고 입증하는 사람을 미치광이라고 할 수 있을까요? 이처럼 '캐치 22'라는 표현은 자가당착과 같이 역설적인 상황을 뜻하는 표현으로 자리 잡아 오늘날까지 사용되고 있습니다. 소설 역시 명작 반열에 올랐고, 2019년엔 할리우드 스타 배우 조지 클루니가 출연한 TV 드라마 시리즈로도 만들어졌습니다.","category":"사회"}],"생활":[{"title":"“목구멍까지 타는 통증”…의사들이 꼽은 ‘역류성 식도염’에 좋은 음식 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107010","naverLink":"https://n.news.naver.com/mnews/article/296/0000107010","pubDate":"2026-11-07T10:15:48.383543+09:00","author":"네이버뉴스","description":"오트밀은 위산으로 인한 통증을 줄이는 데 도움이 된다. 사진=게티이미지뱅크 식사 후 속이 쓰리거나 목구멍이 타는 듯한 통증을 한 번쯤 경험해 본 사람들이 많다. 이런 증상을 일으키는 위염이나 역류성 식도염은 방치될 경우 일상을 순식간에 무너뜨릴 수 있다. 위산이 식도를 타고 역류하면서 생기는 불편함은 몇 시간 동안 지속되고 만성화 되면 삶의 질을 크게 떨어뜨릴 수 있다. 루시아나 소아레스 미국 존슨앤웨일즈대 영양학과의 교수는 \"위산 역류를 겪는 사람에게는 저지방, 저산성, 고섬유질 식단이 기본\"이라며 \"과식은 위 내부 압력을 높여 증상을 악화시키므로 적은 양을 나누어 섭취하는 습관이 필요하다\"고 설명한다. 미국 매체 허프포스트(HuffPost)에 소개된 의료 전문가들의 조언을 바탕으로, 위산 역류를 완화하고 예방하는 데 도움을 주는 식품 6가지를 정리했다. 오트밀 소화기내과 전문의들이 위산 역류 예방식으로 가장 먼저 추천하는 식품은 가공을 최소화한 전통 방식의 오트밀이다. 엑타 굽타 메릴랜드대 의대 교수는 \"오트밀에 풍부한 수용성 섬유질은 기름진 식사나 빵류와 달리 소화기관에 부담을 주지 않고 부드럽게 소화된다\"고 말한다. 흔히 오트밀이 위산을 흡수한다는 속설이 있지만 이는 사실과 다르다. 굽타 교수는 \"식단의 목표는 산을 흡수하는 것이 아니라 애초에 과도한 산 분비를 유발하지 않는 데 있다\"며 \"섬유질이 원활한 배변을 도와 복압 상승으로 인한 역류를 방지해 주는 것이 핵심\"이라고 덧붙였다. 맑은 뼈 육수 뼈를 고아 낸 맑은 육수는 속을 편안하게 감싸면서도 영양을 채워주는 훌륭한 선택지다. 대릴 지오프레 영양학 박사는 \"따뜻한 육수는 과식하지 않아도 충분한 포만감과 영양을 제공해 소화기 부담을 던다\"고 전했다. 다만 지방이 과도하면 오히려 하부식도괄약근을 느슨하게 할 수 있으므로 기름기를 걷어낸 육수를 골라야 한다. 특히 뼈 육수에 풍부한 글리신, 프롤린, 글루타민 등 아미노산 성분은 자극받은 식도와 장 점막을 진정시키고 장벽을 강화하는 데 도움이 된다. 채소 위주의 녹즙 수분이 많고 산도가 낮은 잎채소로 만든 녹즙도 속쓰림 완화에 효과적이다. 오이, 셀러리, 시금치처럼 자극이 적은 채소를 착즙해 마시는 방식이 권장된다. 이들 채소에 풍부한 마그네슘은 소화기 전반의 근육과 신경이 정상적으로 기능하도록 돕고, 위 내용물이 위로 역류하지 않도록 조여주는 괄약근 유지에도 필수적이다. 단, 맛을 내기 위해 레몬, 라임","category":"생활"},{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:15:48.383530+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활"},{"title":"\"최강 한파\" 아침 최저 -6도·일교차 최대 15도…'입동' 뜻과 챙겨 먹으면 좋은 음식 [오늘 날씨]","link":"https://n.news.naver.com/mnews/article/119/0003152402","naverLink":"https://n.news.naver.com/mnews/article/119/0003152402","pubDate":"2026-11-07T10:15:48.383526+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T10:15:48.383496+09:00","author":"네이버뉴스","description":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"아침 최저 영하 1도 '꽁꽁'…중부지방은 가끔 비 소식[내일날씨]","link":"https://n.news.naver.com/mnews/article/421/0009275637","naverLink":"https://n.news.naver.com/mnews/article/421/0009275637","pubDate":"2026-11-07T10:15:48.383487+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"입동에 찾아온 영하권 강추위…수도권 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/660/0000120792","naverLink":"https://n.news.naver.com/mnews/article/660/0000120792","pubDate":"2026-11-07T10:15:48.383483+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"뜨끈~한 국물 한 그릇이 혈압을?…입동 한파에 건강관리 비상","link":"https://n.news.naver.com/mnews/article/421/0009275593","naverLink":"https://n.news.naver.com/mnews/article/421/0009275593","pubDate":"2026-11-07T10:15:47.918831+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:15:47.918826+09:00","author":"네이버뉴스","description":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"\"철도, 마트, 휴대폰까지 다 뚫렸다\"…개인정보 유출 어디까지 [도쿄나우]","link":"https://n.news.naver.com/mnews/article/015/0005351356","naverLink":"https://n.news.naver.com/mnews/article/015/0005351356","pubDate":"2026-11-07T10:15:47.353427+09:00","author":"네이버뉴스","description":"日 최대 통신사 도코모도 유출 무인양품·JR·도코모 덮친 사이버 공격 정부 美 빅테크와 긴급 공조 일본에서 유통, 철도, 금융, 언론 등 사회 인프라 전반을 겨냥한 사이버 공격이 잇따르는 가운데 일본 최대 이동통신사 NTT도코모에서도 최대 29만4839회선의 고객정보가 유출됐다. 이름과 전화번호는 물론 본인확인 서류 번호와 일부 고객의 은행 계좌번호까지 빠져나갔다. 일본 정부는 6일 사이버보안 긴급대책을 확정했다. 미국 빅테크와 협력해 아직 공개되지 않은 보안 취약점 정보를 확보하고, 고성능 인공지능(AI)으로 전력·통신 등 핵심 인프라를 점검할 방침이다. 도코모, 신분증 번호까지 유출…위로금 검토 NTT도코모는 6일 오후 기자회견을 열고 스마트폰을 판매하는 온라인몰과 가입자가 계약 내용을 확인·변경하는 ‘마이 도코모’가 외부의 무단 접속을 받았다고 밝혔다. 유출 대상은 개인 최대 20만4157회선, 법인 최대 9만682회선이다. 이름과 주소, 생년월일, 전화번호, 이메일 주소, 본인확인 서류 번호 등이 포함됐다. 일부 고객은 금융기관명과 계좌번호, 예금주명도 유출됐다. 도코모는 어떤 종류의 신분증 번호가 유출됐는지는 공개하지 않았다. 일본의 개인식별번호인 마이넘버는 유출 대상에서 제외됐다고 밝혔다. 공격자는 여러 시스템이 연동되는 구조를 악용해 고객정보를 자동으로 검색하고 수집한 것으로 파악됐다. 도코모는 4일 오전 대량 접속 경보를 감지해 마이 도코모를 중단했다. 같은 날 저녁 공격 경로를 차단했다고 판단해 서비스를 재개했으나 다른 수법으로 공격받을 가능성이 제기되자 5일 새벽 다시 중단했다. 고객정보 유출을 확인한 것은 5일 오전 2시였다. 도코모는 정기적으로 취약점 진단을 해왔지만 이번에 악용된 경로는 사전에 파악하지 못했다. 마에다 요시아키 도코모 사장은 6일 기자회견에서 사과하고 피해 고객에게 위로금을 지급하는 방안을 검토하겠다고 밝혔다. 지급 대상과 액수는 정해지지 않았다. 온라인몰 운영과 마이 도코모의 계약 변경 등 주요 업무가 중단됐고, 온라인 전용 요금제 ‘아하모’ 신규 가입 사이트도 예방 차원에서 닫았다. 무인양품 최대 2726만 건 유출 우려…GMO는 금전 피해 무인양품 운영사 료힌케이카쿠는 공식 앱에 대한 무단 접속으로 이메일 주소, 생년월일, 성별, 회원 ID 등 최대 약 2726만 건의 고객정보가 유출됐을 가능성을 조사하고 있다. 제휴 신용카드인 ‘MUJI 카드’ 번호 약 109만 건","category":"생활"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:15:46.940881+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활"}],"문화":[{"title":"검은콩·쌀뜨물·식초…미국 패션지가 주목한 ‘한국식 머리 감기’","link":"https://n.news.naver.com/mnews/article/032/0003481212","naverLink":"https://n.news.naver.com/mnews/article/032/0003481212","pubDate":"2026-11-07T10:15:48.383517+09:00","author":"네이버뉴스","description":"해외에서 주목하는 한국식 헤어케어의 핵심은 결국 특별한 비법보다 꾸준하고 세심한 관리에 있다. pexels 세안할 때는 클렌징 오일부터 토너, 세럼, 크림까지 꼼꼼하게 챙기면서 머리 감을 때는 샴푸 하나로 끝내지 않는가. 해외 뷰티업계가 주목하는 한국식 머리 감기는 이런 생각에서 출발한다. 미국 패션잡지 보그는 최근 ‘매끄럽고 윤기 나는 머릿결을 위한 한국식 머리 감기’라는 기사를 통해 K뷰티식 두피 관리법을 소개했다. 기사에 따르면 한국식 헤어케어는 두피를 건강한 모발의 바탕으로 보고, 문제가 생긴 뒤 치료하기보다 평소 관리하는 예방 중심의 접근법이 특징이다. 미국 뉴욕 유니언더마의 피부과 전문의 클레어 장도 한국 뷰티 문화가 두피 관리를 비듬이나 가려움증, 탈모가 생긴 뒤에야 신경 쓰는 영역이 아니라 일상적인 자기관리 일부로 만들었다고 전했다. 가장 먼저 눈에 띄는 것은 두피를 위한 성분이다. 보그는 한국식 헤어케어 제품에 살리실산, 나이아신아마이드, 병풀, 판테놀 등 스킨케어에서 익숙한 성분이 활용된다고 소개했다. 검은콩과 검은깨, 다시마, 쌀뜨물 등 전통적으로 모발 관리에 활용해 온 성분도 언급했다. 최근에는 PDRN과 엑소좀을 활용한 두피 앰플도 등장하고 있다. 물론 이런 성분이 실제 발모나 탈모 예방에 효과가 있는지는 제품별로 별도의 임상적 검증이 필요하다. 머리를 감는 순서에도 신경을 쓴다. 매번 할 필요는 없지만 샴푸 전 두피 스케일러나 각질 제거 제품을 사용해 과도한 피지와 각질, 스타일링 제품 잔여물을 제거하는 것이 첫 단계다. 두피 스케일러는 얼굴의 각질 제거제처럼 두피에 쌓인 묵은 각질과 과도한 피지, 스타일링 제품 잔여물을 씻어내는 전용 제품이다. 살리실산 등 각질 관리 성분을 활용한 제품부터 소금 알갱이가 들어간 스크럽 타입까지 종류가 다양하다. 매일 사용할 필요는 없으며, 지나친 각질 제거는 오히려 두피를 자극할 수 있다. 각질 및 피지 등을 제거한 후 미지근한 물로 두피와 모발을 충분히 적신 뒤 자신의 두피 상태에 맞는 샴푸를 선택한다. 지성 두피라면 과도한 피지와 노폐물 제거에 초점을 맞추고, 민감하거나 건조한 두피라면 자극이 적은 제품을 고르는 식이다. 샴푸할 때는 손톱 대신 손가락 끝으로 두피를 약 1분간 부드럽게 마사지한다. 실리콘 재질의 두피 브러시를 활용하기도 한다. 브러시를 강하게 문지르면 오히려 두피에 자극을 줄 수 있으니 주의한다. 미국피부과학회(AAD) 역시 샴푸는","category":"문화"},{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:15:48.383513+09:00","author":"네이버뉴스","description":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:15:48.383499+09:00","author":"네이버뉴스","description":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:15:48.383479+09:00","author":"네이버뉴스","description":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"예술인 연습 활동·관객 안전사고까지 보장…‘예술현장 안심 공제’ 첫발","link":"https://n.news.naver.com/mnews/article/028/0002831074","naverLink":"https://n.news.naver.com/mnews/article/028/0002831074","pub .news.naver.com/mnews/article/022/0004173207","naverLink":"https://n.news.naver.com/mnews/article/022/0004173207","pubDate":"2026-11-07T10:15:47.353468+09:00","author":"네이버뉴스","description":"선거 참패로 ‘겨울왕국’ 된 백악관, ‘얼음 아가씨’도 떠난다 [이 사람@World]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:15:47.353465+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:15:47.353463+09:00","author":"네이버뉴스","description":"[美 중간선거] 도널드 트럼프 미국 대통령(오른쪽)과 스티븐 밀러 백악관 신임 비서실장. /로이터=뉴스1 백악관 첫 여성 비서실장의 기록을 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 선거 패배 이후 백악과 내각에서 처음으로 이뤄진 인사 교체다. 신임 비서실장에는 도널드 트럼프 대통령의 강경파 최측근으로 꼽히는 스티븐 밀러 부비서실장(41)이 임명됐다. 민주당은 트럼프 대통령의 이 같은 인사가 선거 참패에도 '마이웨이'를 고수하겠다는 의지를 보인 것이라며 의회 차원의 조사를 예고했다. 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 \"밀러 부비서실장이 백악관 비서실장을 맡게 된다\"며 \"내가 가장 신뢰하는 참모 중 하나\"라고 밝혔다. 와일스 실장에 대해선 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로 헌신해준 데 대해 감사하다\"고 발표했다. 트럼프 대통령은 '트럼프 정치조직'이 어떤 조직인지, 와일스가 어떤 역할을 맡게 될지는 구체적으로 언급하지 않았지만 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 패배에 따른 인적 개편임을 시사했다. 이날 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 지 사흘 만에 발표됐다. 밀러 신임 실장은 트럼프 대통령의 대표적인 강경파 측근으로 집권 1기부터 반(反)이민 정책을 설계하고 추진해온 핵심 참모다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했고 트럼프 대통령의 첫 취임사 준비도 주도했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지내다 2기 행정부 들어 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도했다. 미 정가에선 트럼프 대통령이 비서실장 교체를 단행하면서 조만간 후속 내각 개편이 이어질 수 있다는 관측이 나온다. 수지 와일스 전 백악관 비서실장. /AP=뉴시스 /사진=이혜미","category":"세계"},{"title":"[아프리카인물열전](45) \"노예의 풍요보다 자유로운 빈곤을\"…투레 기니 대통령","link":"https://n.news.naver.com/mnews/article/001/0016427649","naverLink":"https://n.news.naver.com/mnews/article/001/0016427649","pubDate":"2026-11-07T10:15:47.353457+09:00","author":"네이버뉴스","description":"프랑스어권 아프리카 식민지 중 첫 독립 선포 '강골'…26년 철권통치 그림자도 1961년 유고슬라비아를 방문한 아흐메드 세쿠 투레 기니 초대 대통령 [위키피디아 제공. 재판매 및 DB 금지] (카이로=연합뉴스) 김상훈 특파원 = \"우리는 노예 상태에서 누리는 풍요보다 자유 속의 빈곤을 택하겠다.\" 1958년 프랑스의 샤를 드골 대통령 면전에 던진 이 단호한 선언은 서부 아프리카 독립운동의 거대한 불씨가 되었다. 프랑스의 제국주의에 정면으로 맞서 기니의 즉각적인 독립을 쟁취한 인물, 아흐메드 세쿠 투레(1922~1984) 기니 초대 대통령은 아프리카 민족주의 역사에서 가장 강렬한 족적을 남긴 지도자 중 한 명으로 꼽힌다. 1922년 기니 중부 파라나에서 태어난 세쿠 투레는 19세기 프랑스 식민 침략에 맞서 싸운 위대한 저항군 지도자 사모리 투레의 후손으로 알려져 있다. 그는 우체국 직원 등으로 일하며 노동조합 활동에 투신했다. 탁월한 연설 능력과 강력한 카리스마를 바탕으로 기니 노동운동과 민족주의 진영의 핵심 지도자로 부상했다. 세쿠 투레의 이름이 전 세계에 각인된 것은 1958년 프랑스가 제안한 신헌법 찬반 국민투표 때다. 당시 드골 프랑스 대통령은 아프리카 식민지국들에 완전 독립 대신 '프랑스 공동체' 내의 자치국으로 남을 것을 종용했다. 대부분의 프랑스어권 아프리카 지도자들이 경제적 지원 중단을 우려해 이를 수용했지만, 세쿠 투레는 단호히 거부했다. 그해 9월 28일 실시된 투표에서 기니 국민은 95%의 압도적인 반대표를 던졌고, 10월 2일 기니는 프랑스어권 아프리카 국가 중 최초로 완전 독립을 선포했다. 세쿠 투레의 반란에 분노한 프랑스의 보복은 집요하고 가혹했다. 기니에 주둔하던 프랑스 관리와 기술자들을 즉각 철수시키며 전화선과 발전소 등 기반 시설을 파괴했고, 심지어 관공서의 전구와 행정 서류, 의약품까지 모조리 파기하거나 챙겨서 떠났다. 신생 독립국 기니를 철저히 붕괴시켜 다른 식민지국에 본보기를 보여주겠다는 의도였다. 그러나 세쿠 투레는 굴복하지 않았다. 서방의 지원이 끊기자 그는 옛소련, 중국 등 공산권 국가들과 손을 잡고 위기를 돌파했다. 가나의 콰메 은크루마 등과 함께 범(凡)아프리카주의 운동을 주도하며 아프리카의 완전한 해방을 역설했다. 대륙 전체의 독립을 상징하는 영웅으로 추앙받았다. 냉전 시대 강경한 사회주의 및 비동맹 노선을 걸었던 탓에 한국과 직접적인 외교적 인연은 없었다. 대신 그","category":"세계"},{"title":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?","link":"https://n.news.naver.com/mnews/article/053/0000062883","naverLink":"https://n.news.naver.com/mnews/article/053/0000062883","pubDate":"2026-11-07T10:15:47.353455+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령이 지난 9월 17일(현지시간) 백악관 로즈가든에서 열린 만찬 중 연설하고 있다. photo AP·뉴시스 지난 11월 3일(현지시간) 치러진 미국 중간선거에서 민주당이 상·하원을 동시에 탈환했다. 민주당이 '여소야대'로 미 의회 주도권을 확보하면서 도널드 트럼프 행정부에 대한 견제가 강화될 것으로 보인다. '블루 웨이브'를 넘어 압승을 거둔 '블루 쓰나미'가 현실화하면서 미국의 통상정책을 둘러싼 우리나라의 셈법도 복잡해질 전망이다. 정치권에 따르면 정부는 이번 미 중간선거 결과를 두고 청와대를 비롯해 외교부와 국방부, 재정경제부와 산업통상부 등 관계 부처를 중심으로 국내 외교·안보 및 산업·통상 환경에 미칠 영향에 대한 분석에 착수했다. 관계 부처 합동대책회의를 열고 불확실성에 따른 대응 방안을 다각도로 검토해 철저한 리스크 관리에 돌입한다는 방침이다. 특히 양국 간 통상 환경 변화 등을 예단하지 않고 신중한 입장을 취하면서, 구체적 대미 전략투자 실행에 따른 경제안보 협력 증진에 집중할 계획이다. 청와대 관계자는 \"미 상·하원 의석 변화에 따른 대처 방안을 꾸준히 검토하고 있다\"며 \"그동안 한·미 관계가 간단치 않았기 때문에 청와대 모든 부서와 관계부처가 주시하고 있다\"고 전했다. 국회에선 여야가 함께하는 한미의원연맹이 오는 12월 중순 미국 방문 계획을 추진하고 있다. 중간선거 이후 새롭게 구성되는 미국 상·하원 의원뿐만 아니라 주요 부처 인사들과 만나 한·미 외교·통상 관련 현안을 논의한다는 방침이다. 이에 앞서 이달 10일 이사회와 총회를 열어 지도부 구성 등 협력 채널을 정비하고, 구체적 방미 일정과 대표단 구성 등을 논의할 예정이다. 조정식 국회의장 선출로 현재 공석인 민주당 측 공동회장에 대통령 평화외교특별보좌관인 6선 송영길 의원을 선출하는 절차가 이뤄지고 있다. 국민의힘 측 공동회장은 6선 조경태 의원이 맡고 있다. 한미의원연맹 여당 간사인 김영배 민주당 의원은 주간조선과 통화에서 \"12월 중순 방미해 대미 전략투자 1~3호 관련 사안을 점검하고 우리의 역할이 있는지 살펴볼 예정\"이라며 \"미 국무부, 상무부, 에너지부 등 정부 부처 인사들과 유관 상·하원 상임위원회 소속 의원들은 물론 다수당(민주당) 지도부도 직접 만날 것\"이라고 밝혔다. 그러면서 \"여소야대로 트럼프 행정부 자체 힘만으로는 잘 굴러갈 수 없겠지만, 미국의 통상 정책 등 국정 기조는 단기간에 달라지지 않을","category":"세계"},{"title":"트럼프, 백악관 비서실상 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:15:47.353422+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:15:46.940879+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:15:47.918851+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:15:47.918849+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:15:47.918846+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:15:47.918844+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:15:47.918840+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:15:47.918838+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:15:47.918833+09:00","author":"네이버뉴스","description":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:15:47.918822+09:00","author":"네이버뉴스","description":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:15:47.918817+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:15:47.918804+09:00","author":"네이버뉴스","description":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"}]},"popular":[{"title":"��40��� ���ڶ� ���� �����?����20�� �� �Դ� ���ε� �̽����� ���̴� ����","link":"https://n.news.naver.com/article/032/0003481206?ntype=RANKING","pubDate":"2026-11-07T10:15:49.329261+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"�� ������� ������ ������ �������١��� ����3�������������ϸ� 71���57��","link":"https://n.news.naver.com/article/032/0003481205?ntype=RANKING","pubDate":"2026-11-07T10:15:49.329286+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"ȣ������ ���� �̶� ���� �̻��� 2�ߡ�Ʈ���� ���̶��� ��ȭ �ߡ�","link":"https://n.news.naver.com/article/032/0003481224?ntype=RANKING","pubDate":"2026-11-07T10:15:49.329295+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":3},{"title":"���Ե������� ���� �� �ֽĽ��� ����, ���� 4%��µ� ��
