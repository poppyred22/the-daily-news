이와 A씨가 주장한 화상 피해는 별개인 것으로 확인됐다. 경찰이 피해 신고를 묵살했다는 주장 역시 사실이 아니었다. 관련 온라인 게시물은 현재 삭제된 상태다. 경찰은 A씨가 허위 정보를 퍼뜨린 경위를 살펴보고 명예훼손 등 혐의를 적용할 수 있는지 검토할 방침이다. 지난해 양양군 현남면 인구해수욕장에 내걸렸던 현수막. 뉴스1","category":"사건 사고"},{"title":"재판소원·대법관 증원에…대법·헌재 내년 건물값만 최소 100억","link":"https://n.news.naver.com/mnews/article/003/0014307518","naverLink":"https://n.news.naver.com/mnews/article/003/0014307518","pubDate":"2026-11-07T10:08:18.350545+09:00","author":"네이버뉴스","description":"재판소원·대법관 증원에…대법·헌재 내년 건물값만 최소 100억. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"복통에 구토·고열·혈변까지…응급실 찾아야 할 위험 신호","link":"https://n.news.naver.com/mnews/article/018/0006405446","naverLink":"https://n.news.naver.com/mnews/article/018/0006405446","pubDate":"2026-11-07T10:08:18.350537+09:00","author":"네이버뉴스","description":"소화불량부터 맹장염·담석·요로결석까지 원인 다양… 응급실 찾는 위험 신호 [이데일리 이순용 의학전문기자] 평소 건강했던 40대 직장인 A씨는 저녁 식사 후 갑자기 배가 아팠다. 과식 탓이라 생각해 소화제를 먹고 쉬었지만 통증은 가라앉지 않았고, 메스꺼움까지 겹치자 결국 응급실을 찾았다. 갑작스러운 복통이 생기면 대부분 소화불량부터 떠올린다. 실제로 과식이나 변비, 장염처럼 흔한 원인이 많지만 맹장염이나 담석, 요로결석처럼 서둘러 치료해야 하는 병의 신호일 수도 있다. 복통은 가볍게 시작했다가 빠르게 나빠지기도 하므로 참을 수 있느냐만으로 응급실 방문 여부를 판단해서는 안 된다. 급성 복통은 갑자기 생기거나 이전보다 뚜렷하게 심해지는 배의 통증이다. 위와 장뿐 아니라 쓸개, 췌장, 신장, 요로 등 여러 장기가 원인이 될 수 있다. 가장 흔한 원인은 소화불량과 위장염이지만 배가 심하게 부풀고 대변이나 방귀가 나오지 않는다면 장이 막히는 장폐색일 수 있어 확인이 필요하다. 또한 맹장염, 담석증, 요로결석도 흔한 원인이다. 맹장염은 배꼽 주변이나 가슴뼈 아래 오목한 명치에서 시작된 통증이 오른쪽 아랫배로 옮겨가는 것이 특징이다. 메스꺼움, 구토, 열이 함께 나타나며 치료가 늦어져 맹장이 터지면 배 속 전체에 염증이 퍼지는 복막염으로 이어질 수 있다. 담석증은 쓸개나 담도에 돌이 생기는 병으로 주로 명치나 오른쪽 윗배가 아프다. 기름진 음식을 먹은 뒤 통증이 생기거나 오른쪽 어깨와 등으로 퍼지기도 한다. 열과 오한에 더해 피부와 눈 흰자가 노랗게 변하는 황달까지 나타나면 염증이 생겼을 가능성이 있다. 요로결석은 옆구리에서 시작된 통증이 아랫배와 사타구니 쪽으로 이어지고 극심한 통증과 잠잠함이 반복된다. 소변에 피가 섞이기도 한다. 모든 복통에 응급실 진료가 필요한 것은 아니지만 다음과 같은 증상이 있다면 응급 상황일 수 있다. 참기 힘들 만큼 극심하거나 빠르게 심해지는 통증은 장기 염증이나 장에 구멍이 생기는 천공 등 긴급한 치료가 필요한 병일 수 있다. 피가 섞인 구토, 선홍색 혈변, 검고 끈적한 변은 소화기관 출혈의 신호이며, 어지럼증과 식은땀이 더해지면 더욱 위험하다. 구토가 반복되고 고열과 오한이 나타나거나 배가 부풀면서 대변과 방귀가 멈춘 경우에도 즉시 응급실에 가야 한다. 특히 기절, 의식 저하, 호흡곤란, 가슴 통증이 함께 나타나면 심장이나 혈관 등 다른 응급질환일 수 있다. 이때는 직접 운전하지 말고 11","category":"사건 사고"},{"title":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다","link":"https://n.news.naver.com/mnews/article/215/0001271980","naverLink":"https://n.news.naver.com/mnews/article/215/0001271980","pubDate":"2026-11-07T10:08:18.350531+09:00","author":"네이버뉴스","description":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"“사지 마” 입담에 인파 폭발… 경찰 출동한 ‘남대문 스카프’ 결국","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:08:18.350526+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:08:18.350507+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로","link":"https://n.news.naver.com/mnews/article/028/0002831127","naverLink":"https://n.news.naver.com/mnews/article/028/0002831127","pubDate":"2026-11-07T10:08:18.350504+09:00","author":"네이버뉴스","description":"피해자가 요청한 ‘학급 교체’, 교육청 권고에도 학교장은 외면 사진은 기사 내용과 무관. 게티이미지뱅크 서울 시내 한 중학교에서 학교폭력을 겪은 피해자가 학교에 ‘학급 교체’를 지속해서 요청했지만, 거절당한 것으로 확인됐다. 사태 파악에 나선 서울특별시교육청 학생인권옹호관마저 학교에 ‘학급 교체 검토’를 제안했는데, 권한이 있는 교장은 ‘다른 사건과의 형평성’을 이유로 응하지 않고 있다. 학폭 신고했더니 돌아온 건 ‘맞학폭’ 서울 성북구 개운중학교에 다니는 ㄴ양은 2026년 5월부터 특정 무리한테 놀림을 당했다. 한겨레21이 입수한 학교폭력대책심의위원회(학폭위) 회의록을 보면, 학교폭력 가해자로 신고당한 개운중 동급생들은 ㄴ양과 눈이 마주치자, “코알라가 꼬나본다” “노무현, 코알라, 노숙자 중에 뭐로 불러줄까”라고 말하며 조롱했다. ‘코알라’는 극우 커뮤니티 등에서 노무현 전 대통령의 외모를 희화화하려고 쓰는 멸칭이자 혐오 표현이다. 이들은 ㄴ양의 귀에 대고 소리를 지르거나, 여럿이 모여 주변을 “펄쩍펄쩍” 뛰면서 돌고 6분가량 동물 소리를 지르고 얼굴을 “5㎝” 가까이 들이밀기도 했다. 동급생들의 괴롭힘을 견디지 못한 ㄴ양은 6월18일 가해 학생들을 신고했다. 그는 8월10일 열린 학폭위에 출석해 “다른 친구들과 관계가 좋았지만, 가해자들이 놀리기 시작하면서 친구들도 나를 피했다”고 호소했다. 가해 학생들의 부모는 사건 초기 서면 사과로 무마하려다 신고당하자, 되레 학폭으로 ㄴ양을 신고했다. ㄴ양 아버지는 “가해자나 가해자 학부모들은 전혀 반성하지 않고 사과의 진정성이 없다”며 “학생부 생활센터 지도 선생님들이 (가해) 아이들을 불러 야단쳤더니 오히려 학부모들이 ‘당신들이 뭔데 우리 애를 야단치고 가해자 몰이를 하느냐’며 화냈다고 들었다”고 말했다. 보호자와 함께 학폭위에 출석했던 가해 학생 중 일부는 조사관과의 진술마저 뒤집으며 학폭을 부인하기도 했다. 한 가해자의 어머니는 맞학폭을 신청한 이유를 묻는 말에 “ㄴ양을 향한 보복이라기보단 저희 아이의 억울한 상황을 조금 이야기해야겠다는 차원”이라고 설명했다. 교장 “학폭위 결정 없었으니…” 학폭위는 8월10일 ㄴ양의 신고 내용 대부분을 사실로 인정해 신고당한 같은 반 동급생 5명에게 징계를 내렸다. 이 중 3명은 ‘서면 사과’ 외에 ‘학교 봉사, 특별교육 이수, 보호자 특별교육 이수, 피해자 접촉·협박 및 보복행위 금지’ 처분을 받았다. ㄴ양 부모는 추가로","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:08:18.350499+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:08:19.468788+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"젠슨 황에 접근한 중국 여성 기업인은 국가안전부 간첩","link":"https://n.news.naver.com/mnews/article/003/0014307502","naverLink":"https://n.news.naver.com/mnews/article/003/0014307502","pubDate":"2026-11-07T10:08:18.800792+09:00","author":"네이버뉴스","description":"엔비디아 첨단 반도체 중국 수출 유도에 역할? 국가안전부, 경제 지배 위해 기술 획득 전투 [베이징=뉴시스]중국 국가안전부.(사진=바이두 갈무리) *DB 및","category":"사회"},{"title":"[르포]\"러시아어로 밥 먹고, 친구도 만나요\"…한국 속 또 다른 고향","link":"https://n.news.naver.com/mnews/article/008/0005437900","naverLink":"https://n.news.naver.com/mnews/article/008/0005437900","pubDate":"2026-11-07T10:08:18.350562+09:00","author":"네이버뉴스","description":"[르포]\"러시아어로 밥 먹고, 친구도 만나요\"…한국 속 또 다른 고향. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:08:18.350557+09:00","author":"네이버뉴스","description":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]","link":"https://n.news.naver.com/mnews/article/011/0004679681","naverLink":"https://n.news.naver.com/mnews/article/011/0004679681","pubDate":"2026-11-07T10:08:18.350550+09:00","author":"네이버뉴스","description":"‘피터팬 아빠’ 전경철 작가 뜻 잇는 임지영 피터팬재단 총괄디렉터 인터뷰 “복지부 재단법인 설립허가 기다려” “다시는 이 땅에, 피터팬이라는 이유로 세상 밖으로 내몰리는 아이가 없어야 한다. 더는 길이 보이지 않아, 자식과 자신을 포기하는 부모가 없기를 바란다.” (책 ‘안녕, 피터팬’ 中) 전경철 작가가 지난 7월 출간한 에세이 ‘안녕, 피터팬’을 들고 있다. 전 작가 브런치 캡처 지난 9월 5일. 전 국민을 울렸던 ‘피터팬 아빠’ 전경철 작가가 세상을 떠났다. 반평생 중증 자폐 아들을 돌보다 눈감은 전 작가의 마지막 소원은 단 하나, ‘피터팬재단’ 설립이었다. 피터팬재단은 성인 중증 자폐인들이 행복하게 살아갈 수 있는 마을 ‘네버랜드’ 건립을 목표로 한다. 피터팬재단 설립추진위원회는 전 작가가 숨지기 전날인 9월 4일 재단법인 설립 심사 신청을 냈다. 그로부터 두 달이 흘렀지만, 전 작가의 꿈은 미완으로 남아있다. 보건복지부의 재단법인 승인이 나지 않아서다. 임지영 피터팬재단 설립추진위원회 총괄디렉터를 만나 재단 설립 추진 과정을 들어봤다. 전경철(오른쪽) 작가와 그의 아들 전제원 씨. 전 작가 브런치 캡처","category":"사회"},{"title":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]","link":"https://n.news.naver.com/mnews/article/011/0004679685","naverLink":"https://n.news.naver.com/mnews/article/011/0004679685","pubDate":"2026-11-07T10:08:18.350539+09:00","author":"네이버뉴스","description":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:08:18.350529+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:08:18.350524+09:00","author":"네이버뉴스","description":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:08:18.350516+09:00","author":"네이버뉴스","description":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"식탁 위에 방치했던 복권, '5억원'이었다","link":"https://n.news.naver.com/mnews/article/008/0005437920","naverLink":"https://n.news.naver.com/mnews/article/008/0005437920","pubDate":"2026-11-07T10:08:18.350514+09:00","author":"네이버뉴스","description":"식탁 위에 방치했던 복권, '5억원'이었다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활":[{"title":"“목구멍까지 타는 통증”…의사들이 꼽은 ‘역류성 식도염’에 좋은 음식 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107010","naverLink":"https://n.news.naver.com/mnews/article/296/0000107010","pubDate":"2026-11-07T10:08:20.712403+09:00","author":"네이버뉴스","description":"“목구멍까지 타는 통증”…의사들이 꼽은 ‘역류성 식도염’에 좋은 음식 6가지. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:08:20.712390+09:00","author":"네이버뉴스","description":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"\"최강 한파\" 아침 최저 -6도·일교차 최대 15도…'입동' 뜻과 챙겨 먹으면 좋은 음식 [오늘 날씨]","link":"https://n.news.naver.com/mnews/article/119/0003152402","naverLink":"https://n.news.naver.com/mnews/article/119/0003152402","pubDate":"2026-11-07T10:08:20.712385+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T10:08:20.712354+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활"},{"title":"아침 최저 영하 1도 '꽁꽁'…중부지방은 가끔 비 소식[내일날씨]","link":"https://n.news.naver.com/mnews/article/421/0009275637","naverLink":"https://n.news.naver.com/mnews/article/421/0009275637","pubDate":"2026-11-07T10:08:20.712344+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"입동에 찾아온 영하권 강추위…수도권 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/660/0000120792","naverLink":"https://n.news.naver.com/mnews/article/660/0000120792","pubDate":"2026-11-07T10:08:20.712338+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"“더 멀리 뛰려면, 잘 쉬어야죠” 7대 마라톤 완주한 의사가 말하는 ‘건강한 달리기’","link":"https://n.news.naver.com/mnews/article/346/0000118498","naverLink":"https://n.news.naver.com/mnews/article/346/0000118498","pubDate":"2026-11-07T10:08:20.712322+09:00","author":"네이버뉴스","description":"[이슈人터뷰] 목 디스크로 시작한 달리기, 삶의 일부 됐다 세계 7대 마라톤 완주 성공 다음 목표는 철인 3종 ‘킹 코스’ 풀 코스 마라톤을 120회 이상 완주한 남혁우 원장은 최근 세계 7대 마라톤 완주에도 성공했다. /김보미 기자 무더위가 물러가고 선선한 바람이 부는 가을은 러너들이 가장 사랑하는 계절이다. 특히 11월에는 주말마다 전국 곳곳에서 마라톤 대회가 열린다. 러너들은 체력 증진은 물론, 한계에 도전하는 과정에서 정신력까지 기를 수 있다는 점을 마라톤의 매력으로 꼽는다. 남정형외과 남혁우 원장(55) 역시 14년째 달리기의 매력에 푹 빠져 있다. 한 번 뛰기도 힘들다는 풀 코스 마라톤을 120회 이상 완주했고, 러너라면 한 번쯤 꿈꾸는 세계 7대 마라톤 완주 목표도 이뤘다. 오랜 기간 동안 부상과 회복을 반복하며 달렸던 그는 러너들이 겪는 통증을 누구보다도 깊이 이해한다. 지금은 직접 체득한 경험을 토대로 달리기 부상을 전문적으로 진료한다. 마라톤의 계절을 맞아, 남혁우 원장에게 건강한 달리기를 위한 조언을 구했다. -최근 베를린 마라톤을 마지막으로 세계 7대 마라톤 완주에 성공했다. 소감이 궁금하다. “팬데믹 이후 해외여행을 할 수 있게 되면서 보스턴 마라톤을 시작으로 세계 7대 마라톤 대회에 도전했다. 마라톤을 하면서 여행을 즐길 수 있다는 점이 정말 좋았다. 대회를 모두 완주한 지금은 시원섭섭한 마음이 더 크다. 더 뛰고 싶은데, 다른 경기가 없다는 게 아쉽다.” -달리기에 빠지게 된 계기는? “2012년경 진료를 하고 있는데 목이 아프고 손이 저렸다. 드레싱을 하던 중 손에 힘이 들어가지 않아 기구를 떨어뜨릴 정도였다. 목 디스크가 온 것 같아 MRI를 찍어 보니 디스크가 눌려 있었다. 진료도 봐야 하고, 수술은 꺼려져서 고민하던 중 정형외과 의사이면서 달리기를 오랫동안 해온 큰 형의 권유로 달리기를 시작하게 됐다. 당시 겨울이었는데 지푸라기라도 잡는 심정으로 혼자 한강을 뛰었다. 달리다 보니 근육 통증이나 저린 증상이 조금씩 좋아졌다. 달리기 자체에도 익숙해져 뛰는 시간과 거리를 점차 늘렸다. ‘나아질 수 있을 것 같다’는 생각에 한 두 달 계속 뛰었는데 증상이 완화됐다. 지금도 큰 증상 없이 잘 지내고 있다. 이후 달리기에 매료돼 지금까지 하고 있다.” 2023년 출전한 시카고 마라톤 당시 사진. /남혁우 원장 제공","category":"생활"},{"title":"한국예술인복지재단, 예술인 공제사업 출범","link":"https://n.news.naver.com/mnews/article/366/0001203076","naverLink":"https://n.news.naver.com/mnews/article/366/0001203076","pubDate":"2026-11-07T10:08:20.712313+09:00","author":"네이버뉴스","description":"첫 상품 ‘예술현장 안심공제’ 출시, 공연·전시 현장 맞춤형 보장 출연진·스태프 상해·질병 및 관객 사고에 따른 배상책임 통합 보장 예술사업자 대상 우선 출시, 향후 문화시설·예술인으로 확대 추진 한국예술인복지재단 제공 문화체육관광부(장관 최휘영) 산하 한국예술인복지재단(대표 정용욱)은 6일 예술인 공제사업을 출범하고, 공연·전시 현장에서 발생할 수 있는 위험을 통합 보장하는 ‘예술현장 안심공제’를 출시했다고 밝혔다. 예술인 공제사업은 공연·전시 현장의 특성을 반영한 공제상품으로 기존 예술인 복지제도의 사각지대를 보완하기 위한 사업이다. 정부와 예술계가 재원을 마련하고 위험을 분담하는 상호부조 방식으로 운영하며, 예술활동을 지속할 수 있는 복지 기반을 조성하는 것을 목표로 한다. 재단은 올해 정부의 첫 출연금 50억원을 바탕으로 사업의 재정 기반을 마련하고, 예술현장의 수요를 반영한 공제상품을 개발했다. 재단은 민간 보험으로 대비하기 어려운 예술현장의 위험을 보장하는 데 초점을 맞췄으며, 예술사업자의 현장 운영에 필요한 보장 항목을 상품에 담았다고 설명했다. 예술활동 중 발생하는 사고와 손실이 공연·전시 운영 중단으로 이어질 수 있다는 점에서, 사고 발생 이후의 지원뿐 아니라 사전에 위험에 대비하는 체계를 갖추겠다는 취지다. 첫 상품인 ‘예술현장 안심공제’는 공연·전시 등을 기획·운영하는 예술사업자와 단체를 가입 대상으로 한다. 출연진과 스태프의 상해·질병, 관객 등 제3자에 대한 법률상 배상책임과 대물 배상책임을 하나의 상품으로 보장한다. 보장 범위에는 본 공연·전시 기간뿐 아니라 준비와 연습 기간도 포함된다. 재단은 비영리 방식으로 공제사업을 운영해 사업비를 최소화하고 공제료 부담을 낮췄다고 설명했다. 민간 보험에서 개별적으로 가입하는 단체 상해와 행사주최자 배상책임을 통합했으며, 생년월일과 성별 등 기본 정보를 중심으로 가입 절차를 간소화했다. 재단은 첫 상품의 가입 대상을 예술사업자로 정하고, 향후 문화시설과 예술인까지 공제사업 대상을 단계적으로 확대할 계획이다. 공제사업 운영으로 발생하는 수익도 예술인 복지 증진에 재투자한다는 방침이다. 정용욱 재단 대표는 “예술인 공제사업은 예술현장의 특성을 반영한 맞춤형 안전망을 마련하고, 예술인 복지의 사각지대를 보완한다는 점에서 의미가 크다”며 “첫 출연금 50억원을 시작으로 향후 정부 출연금을 지속적으로 확보해 공제사업의 재정 기반을 확충하고, 예술인이 각종","category":"생활"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:08:19.468772+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:08:18.350491+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활"}],"문화":[{"title":"검은콩·쌀뜨물·식초…미국 패션지가 주목한 ‘한국식 머리 감기’","link":"https://n.news.naver.com/mnews/article/032/0003481212","naverLink":"https://n.news.naver.com/mnews/article/032/0003481212","pubDate":"2026-11-07T10:08:20.712376+09:00","author":"네이버뉴스","description":"해외에서 주목하는 한국식 헤어케어의 핵심은 결국 특별한 비법보다 꾸준하고 세심한 관리에 있다. pexels 세안할 때는 클렌징 오일부터 토너, 세럼, 크림까지 꼼꼼하게 챙기면서 머리 감을 때는 샴푸 하나로 끝내지 않는가. 해외 뷰티업계가 주목하는 한국식 머리 감기는 이런 생각에서 출발한다. 미국 패션잡지 보그는 최근 ‘매끄럽고 윤기 나는 머릿결을 위한 한국식 머리 감기’라는 기사를 통해 K뷰티식 두피 관리법을 소개했다. 기사에 따르면 한국식 헤어케어는 두피를 건강한 모발의 바탕으로 보고, 문제가 생긴 뒤 치료하기보다 평소 관리하는 예방 중심의 접근법이 특징이다. 미국 뉴욕 유니언더마의 피부과 전문의 클레어 장도 한국 뷰티 문화가 두피 관리를 비듬이나 가려움증, 탈모가 생긴 뒤에야 신경 쓰는 영역이 아니라 일상적인 자기관리 일부로 만들었다고 전했다. 가장 먼저 눈에 띄는 것은 두피를 위한 성분이다. 보그는 한국식 헤어케어 제품에 살리실산, 나이아신아마이드, 병풀, 판테놀 등 스킨케어에서 익숙한 성분이 활용된다고 소개했다. 검은콩과 검은깨, 다시마, 쌀뜨물 등 전통적으로 모발 관리에 활용해 온 성분도 언급했다. 최근에는 PDRN과 엑소좀을 활용한 두피 앰플도 등장하고 있다. 물론 이런 성분이 실제 발모나 탈모 예방에 효과가 있는지는 제품별로 별도의 임상적 검증이 필요하다. 머리를 감는 순서에도 신경을 쓴다. 매번 할 필요는 없지만 샴푸 전 두피 스케일러나 각질 제거 제품을 사용해 과도한 피지와 각질, 스타일링 제품 잔여물을 제거하는 것이 첫 단계다. 두피 스케일러는 얼굴의 각질 제거제처럼 두피에 쌓인 묵은 각질과 과도한 피지, 스타일링 제품 잔여물을 씻어내는 전용 제품이다. 살리실산 등 각질 관리 성분을 활용한 제품부터 소금 알갱이가 들어간 스크럽 타입까지 종류가 다양하다. 매일 사용할 필요는 없으며, 지나친 각질 제거는 오히려 두피를 자극할 수 있다. 각질 및 피지 등을 제거한 후 미지근한 물로 두피와 모발을 충분히 적신 뒤 자신의 두피 상태에 맞는 샴푸를 선택한다. 지성 두피라면 과도한 피지와 노폐물 제거에 초점을 맞추고, 민감하거나 건조한 두피라면 자극이 적은 제품을 고르는 식이다. 샴푸할 때는 손톱 대신 손가락 끝으로 두피를 약 1분간 부드럽게 마사지한다. 실리콘 재질의 두피 브러시를 활용하기도 한다. 브러시를 강하게 문지르면 오히려 두피에 자극을 줄 수 있으니 주의한다. 미국피부과학회(AAD) 역시 샴푸는","category":"문화"},{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:08:20.712371+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:08:20.712334+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:08:20.712316+09:00","author":"네이버뉴스","description":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"영화 '호프' 속 외계어처럼 세상에 없던 언어…인공어의 세계","link":"https://n.news.naver.com/mnews/article/584/0000040037","naverLink":"https://n.news.naver.com/mnews/article/584/0000040037","pubDate":"2026-11-07T10:08:19.468747+09:00","author":"네이버뉴스","description":"영화 '호프' 속 외계어처럼 세상에 없던 언어…인공어의 세계. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"부산불꽃축제, 8만발 연화 광안리 밤하늘 수놓는다","link":"https://n.news.naver.com/mnews/article/001/0016427660","naverLink":"https://n.news.naver.com/mnews/article/001/0016427660","pubDate":"2026-11-07T10:08:18.350470+09:00","author":"네이버뉴스","description":"부산불꽃축제, 8만발 연화 광안리 밤하늘 수놓는다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"}],"세계":[{"title":"참패 희생양 된 ‘얼음 아가씨’…트럼프, 비서실장에 강경파 밀러","link":"https://n.news.naver.com/mnews/article/025/0003563470","naverLink":"https://n.news.naver.com/mnews/article/025/0003563470","pubDate":"2026-11-07T10:08:18.800790+09:00","author":"네이버뉴스","description":"참패 희생양 된 ‘얼음 아가씨’…트럼프, 비서실장에 강경파 밀러. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 비서실장 전격 교체…‘강경 충성파’ 스티븐 밀러 임명","link":"https://n.news.naver.com/mnews/article/119/0003152405","naverLink":"https://n.news.naver.com/mnews/article/119/0003152405","pubDate":"2026-11-07T10:08:18.800788+09:00","author":"네이버뉴스","description":"중간선거 참패 사흘 만에 첫 고위급 인사 단행 反이민 정책 설계자 밀러, 9일부터 백악관 총괄 첫 여성 실장 와일스, 트럼프 정치조직으로 이동 민심떠나도 강경노선 고수…국정 대립 격화 전망 스티븐 밀러 백악관 신임 비서실장이 지난 10월 미 워싱턴DC 백악관에서 열린 한 행사에서 발언을 하고 있다. ⓒ UPI/연합뉴스 [데일리안 = 김규환 기자] 도널드 트럼프 미국 대통령이 11·3 중간선거에서 집권 공화당이 참패하자 백악관 비서실장을 전격 교체했다. 트럼프 2기 행정부 출범 이후 백악관 인사·예산을 쥔 ‘실세’로 통했던 수지 와일스 비서실장을 내리고 대표적인 강경파이자 최측근 인사인 스티븐 밀러(41) 백악관 부비서실장을 후임으로 임명한 것이다. 중간선거 패배 이후 첫 고위급 인사로, 국정 쇄신보다는 강경노선을 더욱 강화해 임기 후반 더 공세적인 국정 운영을 예고했다는 관측이 나온다. . 로이터·AP통신 등에 따르면 트럼프 대통령은 6일(현지시간) 자신 소유의 소셜미디어(SNS) 트루스소셜을 통해 “현 행정부의 부비서실장이자 내가 가장 신뢰하는 참모 중 한 명인 스티븐 밀러가 오는 9일부터 백악관 비서실장을 맡게 된다는 소식을 발표하게 돼 기쁘다”고 밝혔다. 그러면서 “밀러는 정치적으로 훌륭하고 판단도 잘하기 때문에 좋은 관리자가 될 것”이라고 덧붙였다. 그는 이어 “훌륭한 일을 해온 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신한 데 감사한다”고 덧붙였다. 다만 해당 조직의 구체적인 성격과 와일스가 맡을 역할은 공개하지 않았다. 이번 인사는 중간선거에서 민주당에 연방 상·하원 다수당 지위를 모두 내준지 사흘 만에 단행됐다. 미 유권자들이 이란전쟁 장기화와 고물가, 강경 이민정책 등에 불만을 표출하며 공화당에 등을 돌렸지만, 트럼프 대통령은 오히려 온건파 대신 강경 충성파를 백악관의 핵심 요직에 앉혔다. 미 인터넷매체 악시오스는 밀러의 발탁이 이민정책뿐 아니라 이란 전쟁에서도 더욱 강경한 접근을 예고할 수 있다고 분석했다. 밀러 부비서실장은 트럼프 대통령 1기 때 ‘마가’(MAGA·미국을 다시 위대하게)의 설계자인 스티브 배넌 전 수석 전략가의 추천으로 백악관에 들어가 2020년 대선 패배, 2021년 1·6 의사당 난입 사건 이후에도 트럼프 대통령의 곁을 지킨 충성파다. 트럼프 대통령이 1기 정부에서 호흡을 맞춘 후 2기 정부에서도 그","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:08:18.800785+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 니 대통령. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?","link":"https://n.news.naver.com/mnews/article/053/0000062883","naverLink":"https://n.news.naver.com/mnews/article/053/0000062883","pubDate":"2026-11-07T10:08:18.800770+09:00","author":"네이버뉴스","description":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 백악관 비서실상 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:08:18.800739+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:08:18.350489+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"운전석도 뒷좌석도 ‘상석’…칼 간 BMW7 시리즈, 남은 숙제는 AI 비서[타보니]","link":"https://n.news.naver.com/mnews/article/032/0003481062","naverLink":"https://n.news.naver.com/mnews/article/032/0003481062","pubDate":"2026-11-07T10:08:20.712310+09:00","author":"네이버뉴스","description":"지난 4일 경기도 하남시 미사리경정공원 주차장에 주차된 BMW의 순수전기차 ‘ i7 60 xDrive’ 부분 변경 모델. 오동욱 기자 “BMW가 칼을 갈았다.” 지난 4일 BMW코리아가 국내에 출시한 7시리즈의 미디어 시승 행사에서 심심치 않게 들렸던 말이다. BMW코리아는 이번 7시리즈가 직접 운전하는 차주와 뒷좌석에 타는 차주를 모두 만족시킨다고 자신했는데, 그만한 이유가 있었다. 하드웨어는 완성도가 높았고, 주행 시 만족도도 높았다. 다만 소프트웨어는 한계를 보였고, 카피바라를 닮은 앞면의 생김새는 고객의 취향을 탈 것처럼 보였다. 이날 시승한 차량은 BMW의 차세대 전동화·디지털 기술이 처음 적용된 전기차 모델 ‘i7 60 xDrive’다. 서울 광진구에서 경기 가평군까지 약 100㎞를 3시간가량 왕복했다. 15분가량은 전문 드라이버의 도움으로 뒷자리 승차감을 경험했다. 문 여는 순간부터…빈틈 줄인 하드웨어 지난 4일 경기도 하남시 미사리경정공원 주차장에서 BMW의 순수전기차 ‘ i7 60 xDrive’ 부분 변경 모델이 자동으로 문을 열고 있다. 오동욱 기자","category":"IT 과학"},{"title":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”","link":"https://n.news.naver.com/mnews/article/366/0001203195","naverLink":"https://n.news.naver.com/mnews/article/366/0001203195","pubDate":"2026-11-07T10:08:19.468801+09:00","author":"네이버뉴스","description":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:08:19.468796+09:00","author":"네이버뉴스","description":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:08:19.468794+09:00","author":"네이버뉴스","description":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:08:19.468792+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:08:19.468790+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:08:19.468786+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"AI주 투매 하루 만에 반등한 나스닥…AI 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:08:19.468784+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:08:19.468779+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:08:19.468768+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"}]},"popular":[{"title":"�������� �ݵƮ���� \"�ΰ����� 100% ����\"","link":"https://n.news.naver.com/article/214/0001534094?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725080+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"\"���� �η��� �ʴ�\"�� ����ɡ�'X' �� 150���� '����ȯ' [�м� �� ����]","link":"https://n.news.naver.com/article/214/0001534053?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725106+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"\"'���� �ѱ�'���� ���� �˳�?!\"��'���ַ�' ����� �� ���� '����'","link":"https://n.news.naver.com/article/214/0001534039?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725113+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":3},{"title":"\"������ ���Ŀ�\" ���̵� ����������� �� �ŵ�","link":"https://n.news.naver.com/article/214/0001534095?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725139+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 e=RANKING","pubDate":"2026-11-07T10:08:22.725222+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":17},{"title":"찴���� \"â�� �� �����Ѿ�\"���� ���� �����â�� ���� Ȯ�� ����","link":"https://n.news.naver.com/article/421/0009275598?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725227+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":18},{"title":"191�� ������ �ɳ� ���̺� ���� '¡�� 200��'��\"õ�� ������ �����\"","link":"https://n.news.naver.com/article/421/0009275554?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725233+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":19},{"title":"�̷��������ǵ� ��ŷ������ 3800���������� 3�� 5000�� ��������","link":"https://n.news.naver.com/article/421/0009275626?ntype=RANKING","pubDate":"2026-11-07T10:08:22.725240+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":20}]},"yesterday":{"date":"2026-11-07","weekday":"토요일","label":"어제 · 11월 7일 토요일","total":60,"categories":{"사건 사고":[{"title":"장관들은 농담, 생존용품점은 특수…영국 뜻밖의 재난 대비 풍경","link":"https://n.news.naver.com/mnews/article/025/0003563473","naverLink":"https://n.news.naver.com/mnews/article/025/0003563473","pubDate":"2026-11-07T10:08:37.515887+09:00","author":"네이버뉴스","description":"\" “마스카라, 컨실러(잡티를 가리는 화장품), 소비뇽 블랑 와인 한 병.” \" 앤절라 레이너 영국 주택장관(왼쪽)이 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 앤디 번햄 총리 옆에서 발언하고 있다. 로이터=연합뉴스 앤절라 레이너 영국 주택장관이 지난 9월 한동안 버틸 수 있겠다며 농담처럼 꼽은 비상용품 목록이 약 한 달 뒤 다시 주목받았다. 영국 정부가 지난달 22일(현지시간) 국민에게 72시간을 버틸 비상물품을 갖추라는 ‘비 레디(Be Ready·대비하라)’ 캠페인을 시작하면서다. 이번에는 총리가 비상물품에 술을 넣어도 되느냐는 질문을 받고 술이 우선은 아니지만 한두 잔쯤은 괜찮다는 식으로 답했다. 월스트리트저널(WSJ)은 지난 2일 ‘영국은 종말에 대비하는데, 지도자들은 마스카라와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"美오클랜드서 155억치 엔비디아 칩 화물 통째 도난…경찰 수사","link":"https://n.news.naver.com/mnews/article/421/0009275090","naverLink":"https://n.news.naver.com/mnews/article/421/0009275090","pubDate":"2026-11-07T10:08:37.515810+09:00","author":"네이버뉴스","description":"텍사스주 포트워스 향하던 중 증발 엔비디아 로고 일러스트. 2026.10.21 ⓒ 로이터=뉴스1 (서울=뉴스1) 윤다정 기자 = 약 1140만 달러(약 155억 원)어치의 엔비디아 반도체가 미국 캘리포니아주 오클랜드에서 텍사스로 향하던 중 통째로 도난당해 현지 경찰이 수사 중이다. 5일(현지시간) ABC7 베이에어리어에 따르면, 엔비디아 하드웨어 6팔레트로 구성된 화물이 8월 29일 오클랜드에서 출발해 텍사스주 포트워스로 향하던 중 사라졌다. 당국에 따르면 이 화물은 식품 운송업체로 확인된 트럭이 계획대로 인수해 갔다. 수사관들은 이후 샌버너디노 카운티에서 이 차량의 행방을 놓쳤다. 오클랜드 경찰은 성명에서 이스트 오클랜드에서 발생한 중절도 사건을 수사하고 있다며, 피해자가 9월 13일 경찰에 신고했다고 밝혔다. UC 버클리 하스 경영대학원 올라프 그로스 교수는 엔비디아 칩의 수요가 매우 많아 \"보안이 취약한 곳이라면 어디서든 이 칩들을 탈취할 유인이 매우 크다\"고 말했다. 또한 엔비디아 칩이 미국 밖에서 국내 가격의 약 두 배를 받는다며 \"칩 가격이 약 55만 달러라면 해외에서는 약 100만 달러 이상에 팔린다\"고 설명했다. 그는 \"화물이 점점 커지고 강탈 수법도 복잡해지고 있다\"며 \"이는 탈취 조직이 전문화되고 있음을 가리킨다\"고 분석했다. 그로스 교수는 \"이 칩들은 국가안보 자산인 만큼 보안이 훨씬 엄격해져야 한다\"고 강조하며 도난당한 칩의 행방에 대한 우려도 제기했다. 그는 \"칩이 어디로 가는지 알 수 없다는 점에서 국가안보 문제이기도 하다\"며 \"중국으로 갈 수도 있고, 세계 어느 분쟁 지역으로든 갈 수 있다\"고 지적했다. 베이에어리어에서는 고가의 기술 화물을 노린 범죄가 잇따르고 있다. 지난해에는 750만 달러(약 101억 원) 이상 규모의 엔비디아 화물 절도 사건이 벌어져 프리몬트와 유니언시티 경찰이 수사에 나섰다. 올해 9월에는 절도 미수 사건도 발생했다. 경찰에 따르면 용의자들은 고가의 엔비디아 제품을 실은 트럭으로 알고 범행을 시도했지만, 이 트럭에는 모래 4만 파운드(약 18톤)가 실려 있었다.","category":"사건 사고"},{"title":"“사지 마” 입담에 인파 폭발… 경찰 출동한 ‘남대문 스카프’ 결국","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:08:37.041384+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:08:37.041368+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[속보] 김종철 경찰청장 후보자 “막중한 책임 느껴”…경찰위 출석","link":"https://n.news.naver.com/mnews/article/025/0003563343","naverLink":"https://n.news.naver.com/mnews/article/025/0003563343","pubDate":"2026-11-07T10:08:37.041304+09:00","author":"네이버뉴스","description":"김종철 경찰청장 직무대행이 6일 이재명 대통령이 참석한 가운데 청와대에서 열린 한·동티모르 치안협력을 위한 기술약정서 체결식에 참석해 약정서 서명하기 위해 펜을 들고 있다. 청와대통신사진기자단 신임 경찰청장 후보자인 김종철 경찰청 차장은 6일 “엄중한 시기에 경찰청장 후보자로 지명된 것에 막중한 책임을 느낀다”고 밝혔다. 김 후보자는 이날 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하기 전 “경찰에 대한 국민의 기대가 어느 때보다 높고 또 그 이상 우려의 목소리가 크다는 걸 잘 알고 있다”며 이같이 말했다. 이어 “오늘 후보자로서 역량과 자질을 검증받는 만큼 책임 있는 자세로 성실히 임하겠다”고 했다. 경찰위는 이날 임시회의에서 김 후보자의 임명 제청 동의 여부를 심의한다. 경찰청장 인선은 대통령실의 후보자 추천, 경찰위 동의, 행정안전부 장관 제청, 국회 인사청문회, 대통령 임명 순으로 진행된다. 인사청문회를 거치되 국회의 임명 동의는 필요하지 않다. 김 후보자는 1970년 경남 함양에서 태어나 진주 명신고와 한국외국어대 영어과를 졸업했다. 1997년 경찰간부후보생 45기로 경위에 임관했다. 2019년 서울 서초경찰서장을 지냈으며, 2021년 경무관으로 승진해 부산경찰청 자치경찰부장을 맡았다. 같은 해 7월에는 문재인 정부 청와대 국정상황실에서 근무했다. 이후 대구·대전경찰청 공공안전부장, 서울경찰청 생활안전교통부장, 충남경찰청 공공안전부장, 강원경찰청 생활안전부장 등을 역임했다. 지난해 9월 치안감으로 승진해 경남경찰청장을 맡았고, 올해 8월 치안정감 승진자로 내정됐다. 이어 9월 경찰청 차장에 임명돼 청장 직무대행을 맡고 있다.","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:03:02.328249+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의
