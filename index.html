,"category":"생활·문화"},{"title":"\"물가 올라도 여행은 간다\"…글로벌 호텔주 시총 500억달러 불어","link":"https://n.news.naver.com/mnews/article/092/0002444388","naverLink":"https://n.news.naver.com/mnews/article/092/0002444388","pubDate":"2026-11-09T10:57:13.669739+09:00","author":"네이버뉴스","description":"항공료·유가 뛰어도 휴가 수요 견조…메리어트·힐튼 전망 잇달아 상향 물가 상승과 항공료 인상에도 여행 수요가 좀처럼 꺾이지 않으면서 글로벌 호텔업체들의 기업가치가 크게 뛰고 있다. 소비자들이 다른 지출은 줄이더라도 여행은 포기하지 않는 경향이 뚜렷해졌다는 분석이다. 파이낸셜타임스(FT)에 따르면 세계 주요 호텔그룹들의 시가총액은 올해 들어 약 500억 달러(약 68조 100억원) 가량 늘었다. 중동 전쟁으로 항공편 차질과 유가 상승이 이어졌지만 호텔 예약 수요는 예상보다 강한 흐름을 보였다. 세계 최대 호텔그룹 메리어트는 올해 객실당 매출 성장률 전망치를 4.5~5%로 상향했다. 올해 들어 세 번째 전망 상향이다. 고소득층의 고급 휴양 수요뿐 아니라 상대적으로 소득이 낮은 소비자들의 여행 지출도 늘었다. (사진=픽사베이) 앤서니 카푸아노 메리어트 최고경영자(CEO)는 레저 여행 수요를 호텔업계의 가장 밝게 빛나는 분야라고 평가했다. 특히 유럽 지역에서 강한 수요가 이어지고 있다고 설명했다. 하얏트와 힐튼도 지난달 올해 실적 전망을 상향했다. 중동 지역 객실 수요는 타격을 받았지만 미국 등 일부 지역에서 국내 여행 수요가 국제선 여행 둔화를 상쇄했다. 힐튼은 올해 객실당 매출이 4~4.5% 증가할 것으로 예상했다. 기존 전망치인 3~3.5%보다 높은 수준이다. 호텔주 주가도 강세를 보이고 있다. 주요 상장 호텔기업 가운데 메리어트와 힐튼 주가는 올해 각각 34%, 31% 상승했다. 외신은 이란 전쟁 발발 이후 항공편 취소와 영공 폐쇄가 잇따르고 호르무즈해협을 지나는 교통량 감소로 유가와 항공유 가격까지 급등했지만, 여행 수요가 예상보다 빠르게 다른 지역으로 이동하고 있다고 설명했다. 관광경제 컨설팅업체 투어리즘 이코노믹스는 최근 여행 소비가 과거보다 구조적으로 더 강해졌다고 분석했다. 지정학적 충돌이나 항공 차질이 발생하더라도 여행 자체를 취소하기보다 목적지를 바꾸는 소비자가 늘고 있다는 설명이다. 온라인 여행 플랫폼 부킹홀딩스도 3분기 총예약액이 545억 달러(약 74조 1581억원)로 사상 최대치를 기록했다고 밝혔다. 전년 동기 대비 10% 증가한 수준이다. 글렌 포겔 부킹홀딩스 CEO는 “사람들은 여행을 취소하기 전에 다른 많은 지출부터 줄인다”며 여행 수요의 강한 회복력을 강조했다. 실제 다른 소비 분야와의 차이도 나타나고 있다. 이케아의 최근 연간 소매 매출은 2% 감소했고, LVMH와 나이키 등도 최근","category":"생활·문화"},{"title":"전국 대체로 맑지만 아침 영하권 추위…일교차 15도 이상 [내일 날씨]","link":"https://n.news.naver.com/mnews/article/015/0005351704","naverLink":"https://n.news.naver.com/mnews/article/015/0005351704","pubDate":"2026-11-09T10:57:13.669717+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"\"맥박 50회인데 운동 괜찮다고?\"...부정맥에 대한 오해와 진실 [헬스톡]","link":"https://n.news.naver.com/mnews/art 26-11-09T10:57:12.851520+09:00","author":"네이버뉴스","description":"'협상 임박설'에 선긋는 미국…\"이란 요구 터무니없어\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"[영상] 볼 뽀뽀하고 같은 차 타고...젠슨 황, 불륜 티 났었다","link":"https://n.news.naver.com/mnews/article/119/0003152752","naverLink":"https://n.news.naver.com/mnews/article/119/0003152752","pubDate":"2026-11-09T10:57:12.851517+09:00","author":"네이버뉴스","description":"[영상] 볼 뽀뽀하고 같은 차 타고...젠슨 황, 불륜 티 났었다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"美 국무장관 “이란 요구 터무니없다”… 협상 돌파구 임박설 일축","link":"https://n.news.naver.com/mnews/article/366/0001203411","naverLink":"https://n.news.naver.com/mnews/article/366/0001203411","pubDate":"2026-11-09T10:57:12.851516+09:00","author":"네이버뉴스","description":"美 국무장관 “이란 요구 터무니없다”… 협상 돌파구 임박설 일축. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"시리아, 후티와 싸우는 사우디에 경제지원 받고 파병 추진","link":"https://n.news.naver.com/mnews/article/001/0016430502","naverLink":"https://n.news.naver.com/mnews/article/001/0016430502","pubDate":"2026-11-09T10:57:12.851491+09:00","author":"네이버뉴스","description":"시리아, 후티와 싸우는 사우디에 경제지원 받고 파병 추진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"시리아, 사우디-후티 전선에 파병 추진…“사우디 경제 지원”","link":"https://n.news.naver.com/mnews/article/056/0012289830","naverLink":"https://n.news.naver.com/mnews/article/056/0012289830","pubDate":"2026-11-09T10:57:12.851452+09:00","author":"네이버뉴스","description":"시리아가 예멘의 친이란 반군 후티와 교전 중인 사우디아라비아를 지원하기 위해 병력 파견을 준비하고 있다고 AP통신이 현지 시각 8일 보도했습니다. 시리아 당국자들에 따르면 시리아 특수부대원 약 600명으로 구성된 선발대가 다음 주 사우디에 파견돼 예멘 접경 지역에 배치될 예정입니다. 시리아는 이미 소수의 군사고문단을 사우디에 파견해 예멘 정부군 훈련을 지원했으나 예멘에 전투 병력을 직접 파견하지는 않았습니다. 최근에는 시리아 군 관계자 36명이 사우디 제다의 지휘·작전본부를 방문해 전선 상황과 작전 지역에 관한 브리핑을 받았다고 당국자는 전했습니다. 앞서 사우디와 시리아는 지난 4일 아흐메드 알샤라 시리아 대통령의 사우디 방문을 계기로 군사협력협정을 체결했으나 구체적인 내용은 공개되지 않았습니다. 시리아는 사우디가 주도하는 ‘메카 공동방위협정’에 가입하는 방안도 검토 중입니다. 지난 8월 사우디, 튀르키예, 파키스탄이 체결한 이 협정은 어느 한 회원국이 무력 공격을 받으면 이를 전체 회원국에 대한 공격으로 간주한다는 내용을 담고 있습니다. 시리아는 오랜 내전을 거치면서 실전 경험이 풍부하다는 평가를 받고 있지만, 지금까지 역내 분쟁에는 직접 개입하지 않는 신중한 태도를 보여왔습니다. 알샤라 대통령은 오랜 내전으로 황폐해진 시리아 재건에 집중하고 새로운 분쟁에 휘말리는 것을 피하겠다는 입장을 밝혀왔습니다. 이런 시리아가 사우디의 다른 동맹국들과 달리 후티와의 전투에 병력 파견을 추진하는 배경엔 현 정부가 사우디의 지원에 크게 의존하기 때문이라고 AP는 짚었습니다. 시리아 내전 당시 사우디는 반군에 자금을 지원했으며, 지난 4일 알샤라 대통령의 사우디 방문 때도 사우디는 시리아의 전후 재건을 위해 4억 달러(약 5천437억 원) 이상의 차관을 제공하기로 합의했습니다. 그러나 시리아 외교 당국자는 시리아 국영 통신을 통해 자국군의 예멘 파견 보도를 부인하며, 사우디와의 군사협력은 병력 훈련과 역량 강화에 초점을 맞추고 있다고 밝혔습니다. [사진 출처 : AFP=연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"세계"}],"IT 과학":[{"title":"비만약 상업화·기술수출 겹호재…한미사이언스 성장성 부각 [Why 바이오]","link":"https://n.news.naver.com/mnews/article/011/0004680072","naverLink":"https://n.news.naver.com/mnews/article/011/0004680072","pubDate":"2026-11-09T10:57:13.669736+09:00","author":"네이버뉴스","description":"에페글레나타이드 처방 시작…특허배분수익 기대 MASH 신약 3상 가능성·제넨텍 기술수출도 호재 화장품·케어푸드·건기식 등 자체 B2C 사업도 확대 한미사이언스 본사. 사진 제공=한미사이언스 한미사이언스(008930) 가 비만치료제 상업화와 신약 기술수출 확대에 힘입어 새로운 성장동력을 확보하고 있다. 한미약품의 신약이 판매되거나 기술수출될 때 특허와 사업 기여도에 따라 수익을 배분받는 구조인 데다 화장품·케어푸드·건강기능식품 등 자체 사업도 확대하면서 기존 지주회사 역할을 넘어 수익원이 다변화되고 있다는 평가가 나온다. 9일 iM증권에 따르면 한미사이언스는 2010년 지주회사 체제로 전환하면서 기존 한미약품이 보유하던 다수의 원천기술과 특허를 확보했다. 이에 따라 한미약품이 관련 기술을 적용한 제품을 판매하거나 글로벌 기술수출에 성공할 경우 한미사이언스도 기술·특허 기여도에 따라 수익을 배분받는다. 랩스커버리가 적용된 에페글레나타이드와 에피노페그듀타이드, 소네페글루타이드 등이 대표적이다. 최근 상업화에 들어간 비만·대사질환 치료제 에페글레나타이드가 수혜 사례다. 한미약품은 지난해 12월 식품의약품안전처에 에페글레나타이드 품목허가를 신청한 뒤 올해 10월 7일 허가를 획득했다. 같은 달 29일부터 일부 의료기관에서 처방도 시작됐다. 에페글레나타이드 매출이 늘어날수록 한미사이언스가 받는 특허배분수익도 함께 증가하는 구조다. 해외 기술수출 파이프라인의 개발 진전도 수익 확대 요인이다. 한미약품은 2020년 대사이상 지방간염(MASH) 치료제 후보물질 에피노페그듀타이드의 한국을 제외한 글로벌 개발·상업화 권리를 MSD에 최대 8억 7000만 달러 규모로 기술수출했다. MSD는 최근 미국간학회(AASLD)에서 MASH 환자 381명을 대상으로 진행한 임상 2b상 결과를 공개했다. 위약 대비 MASH 해소율을 유의하게 높였으며 7㎎ 용량에서는 간 섬유화 개선에서도 통계적 유의성을 확보했다. 한미사이언스가 직접 기여한 기술수출에서도 수익 창출이 기대된다. 한미약품은 올 8월 로슈그룹 자회사 제넨텍과 비만치료제 후보물질 ‘HM17321’ 기술이전 계약을 체결했다. 한미약품의 연구개발 이후 글로벌 기술수출과 상업화 단계에서 한미사이언스 이노베이션본부가 지원하는 구조로, HM17321 계약을 한미사이언스가 주도한 만큼 관련 업무기여수익이 증가할 것으로 예상된다. 자체 사업도 새로운 성장축으 13.226753+09:00","author":"네이버뉴스","description":"“기초보안 마지막 축은 암호…검증된 암호·키 관리 위에 양자 대비” 11월은 많은 기업과 기관이 내년 사업계획을 짜는 시기다. 보안 계획과 예산도 결정될 것이다. 지난해 국내 랜섬웨어 신고는 274건으로 전년보다 약 1.4배 늘었고, AI로 공격이 빨라지고 자동화되면서 방어는 더 어려워졌다. 그래서 주목받는 것이 침해를 전제한 방어다. 한국인터넷진흥원(KISA)은 사고에 대비해 네트워크와 분리된 백업을 강조한다. 따라서 예기치 못한 공격과 사고로 데이터가 유출돼도 내용을 읽을 수 없게 하는 암호화가 기초보안의 마지막 축이라고 드림시큐리티는 강조했다. 김대식 드림시큐리티 최고기술책임자(CTO)는 “인증으로 사용자를 확인하고 접근 통제로 움직임을 좁혀도 침해 위험은 남는다”며 “암호는 규제 대응용이 아니라 침해 뒤에도 데이터를 지키는 기초보안의 마지막 안전장치”라고 말했다. 단, 암호화 효과는 어떤 암호를 쓰느냐에 따라 달라진다는 게 드림시큐리티 지적이다. 실제로 공공 부문은 암호 신뢰성을 제도로 관리한다. 국가·공공기관이 비밀이 아닌 업무자료 암호화 제품을 도입할 때는 국정원이 안전성을 확인한 검증필 암호모듈 탑재 등 요건을 갖춰야 한다. 관련해 드림시큐리티는 2008년 국가 암호모듈 검증(KCMVP)을 획득한 뒤 암호모듈을 자체 개발해 왔고, 미국 암호모듈 검증(CMVP)도 받았다. 김 CTO는 “자체 개발한 암호모듈을 다른 보안 기업과 장비 제조사에도 공급하고 있다”며 “가상사설망(VPN)과 5G 통신장비, 클라우드 플랫폼, 문서보안(DRM), 결제 중계 서버, 사물인터넷(IoT) 원격감시 체계, 국방 연구개발 분야까지 탑재돼 있다”고 소개했다. 다른 기업이 암호를 직접 개발하지 않고도 검증된 암호를 쓸 수 있게 하는 역할이다. 검증된 암호 사용과 함께 중요한 것이 키 관리다. 키가 소스코드나 개발자 PC, 서버에 그대로 남으면 암호는 제 역할을 못 한다. 지난해 국내 최대 이커머스 기업의 대규모 개인정보 유출도 퇴사 직원이 재직 중 확보한 인증용 서명키로 가짜 인증 토큰을 만든 데서 비롯됐다. 키는 사람이 아닌 시스템에 맡기는 쪽으로 바뀌고 있다. 키 관리 시스템(KMS) 안에서 키를 보관하고 서명과 암호화까지 처리해 키가 밖으로 드러나지 않게 하는 방식이다. 김 CTO는 “생명보험사 두 곳과 대기업 계열사 한 곳에 키 관리 솔루션 'Magic KMS'를 적용해, 내부 업무 시스템에서 쓰는 API 키와 서명","category":"IT 과학"},{"title":"기술주 약세에도 강행…앤트로픽, 이달 26일 이전 IPO 완료 방침","link":"https://n.news.naver.com/mnews/article/029/0003057831","naverLink":"https://n.news.naver.com/mnews/article/029/0003057831","pubDate":"2026-11-09T10:57:13.226752+09:00","author":"네이버뉴스","description":"기술주 약세에도 강행…앤트로픽, 이달 26일 이전 IPO 완료 방침. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"삼성-구글 동맹, ‘AI 글라스’ 12월 출격…판 커지는 ‘글라스’ 시장","link":"https://n.news.naver.com/mnews/article/016/0002720580","naverLink":"https://n.news.naver.com/mnews/article/016/0002720580","pubDate":"2026-11-09T10:57:13.226744+09:00","author":"네이버뉴스","description":"삼성-구글 동맹, ‘AI 글라스’ 12월 출격…판 커지는 ‘글라스’ 시장. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"[로봇과 사람들] 엄윤설 에이로 .","category":"사건 사고"},{"title":"수도권제1순환로 송내나들목서 차량 8대 추돌‥5명 경상","link":"https://n.news.naver.com/mnews/article/214/0001534252","naverLink":"https://n.news.naver.com/mnews/article/214/0001534252","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"오늘 저녁 8시 50분쯤 인천 부평구 수도권제1순환고속도로 일산 방향 송내나들목 인근에서 승용차 8대가 연달아 부딪히는 사고가 났습니다. 이 사고로 5명이 경상을 입어 병원으로 옮겨졌고, 사고 수습을 위해 2개 차로가 통제되면서 한때 차량 정체가 빚어지기도 했습니다. 경찰은 차량 정체가 발생한 상태에서 속도를 줄이지 못한 차량이 앞서 가던 차량을 들이받으면서 사고가 시작된 것으로 보고 자세한 사고 경위를 조사하고 있습니다.","category":"사건 사고"},{"title":"서해안고속도로서 승용차끼리 부딪혀 2명 부상","link":"https://n.news.naver.com/mnews/article/056/0012289613","naverLink":"https://n.news.naver.com/mnews/article/056/0012289613","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"오늘(8일) 오후 6시쯤 전북 김제시 청하면 서해안고속도로 서울 방향 서김제 졸음쉼터 인근에서 승용차끼리 부딪혔습니다. 이 사고로 운전자 등 2명이 다쳤고, 사고 수습 과정에서 2차로가 통제되면서 한때 차량 지정체가 빚어졌습니다. 경찰은 정확한 사고 경위를 조사하고 있습니다. [사진 출처 : 시청자 나병철 제공] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사건 사고"},{"title":"인천 송내IC 인근 고속도로서 승용차 8대 추돌","link":"https://n.news.naver.com/mnews/article/422/0000924076","naverLink":"https://n.news.naver.com/mnews/article/422/0000924076","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"인천 송내IC 인근 고속도로서 승용차 8대 추돌. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"수도권제1순환고속도로서 차량 8대 추돌…5명 부상","link":"https://n.news.naver.com/mnews/article/056/0012289612","naverLink":"https://n.news.naver.com/mnews/article/056/0012289612","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"수도권제1순환고속도로서 차량 8대 추돌…5명 부상. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"당정, 소방 분야 2조원 재정지원 검토…\"국가 지원 대폭 확대\"","link":"https://n.news.naver.com/mnews/article/629/0000549776","naverLink":"https://n.news.naver.com/mnews/article/629/0000549776","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"고위당정서 소방 긴급투자 검토 진압 장비·특화 의료 체계 확충 범정부 재정분권 TF 재가동 합의 김민석 더불어민주당 대표가 지난 9월 23일 오전 서울 종로구 삼청동 총리공관에서 열린 '제10차 고위당정협의회'에 참석해 모두발언을 하고 있다. /박헌우 기자 [더팩트 | 박성호 기자] 더불어민주당과 정부가 초과 세수를 활용해 소방 분야에 2조원가량의 재정을 지원하는 방안을 추진한다. 박성준 민주당 수석대변인은 8일 서울 삼청동 국무총리 공관에서 열린 고위당정협의회 직후 브리핑에서 \"소방 관련 긴급 필수 투자에 대해 2조원 수준의 재정을 지원함으로써 지방정부의 소방 재정 부담을 완화하는 방안을 검토하기로 했다\"고 밝혔다. 이어 \"여기에 더해 정부는 화재 진압 장비와 훈련 시설, 소방 특화 의료 체계 확충 등에 필요한 예산을 내년도 예산안 심의 과정에 반영하기로 했다\"고 덧붙였다. 이날 회의에서 당은 소방 분야가 국민의 안전과 직결되는 만큼 필수 투자가 위축되지 않도록 국가 차원의 지원을 대폭 확대해 달라고 정부에 요청했다. 박 수석대변인은 \"지방정부의 소방 재정을 확충하는 방안도 당정이 긴밀히 협의해 나가기로 했다\"며 \"2조원에 대한 재정 지원 플러스알파에 베타까지 소방 재정 지원을 위한 재원을 마련하겠다\"고 말했다. 당정은 고위당정협의회에서 내년도 지방정부 가용 재원 규모를 확대하는 방안도 논의했다. 지방재정의 어려움을 고려해 올해 초과 세수를 활용하는 방안을 검토한다는 입장이다. 박 수석대변인은 \"예산안 국회 심사 과정에서 당정 간 긴밀한 협의를 거쳐서 구체적인 지원 규모를 확정하기로 했다\"면서 \"당정은 지방재정 보강 방안에 더해서 국세의 지방세 단계적 이양과 사무 재분배 등 보다 근본적인 지방재정 확충 필요성에 공감하고, 범정부(와) 신속하게 논의를 이어가도록 했다\"고 했다. 아울러 당정은 범정부 재정 분권 태스크포스(TF)를 재가동하고, 겨울철 폭설·한파에 대비한 24시간 상황 관리 체계를 구축하기로 했다. 한편 이날 고위당정협의회에는 김민석 더불어민주당 대표 한성숙 국무총리, 임광현 대통령 비서실장 등이 참석했다. 발로 뛰는 더팩트는 24시간 여러분의 제보를 기다립니다. ▶카카오톡: '더팩트제보' 검색 ▶이메일: jebo@tf.co.kr ▶뉴스 홈페이지: http://talk.tf.co.kr/bbs/report/write","category":"사건 사고"},{"title":"양산서 화물차·SUV 2대 추돌…4명 경상, 브레이크 파열 추정","link":"https://n.news.naver.com/mnews/article/421/0009277636","naverLink":"https://n.news.naver.com/mnews/article/421/0009277636","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"ⓒ 뉴스1 (양산=뉴스1) 강미영 기자 = 8일 낮 12시 36분쯤 경남 양산시 원동면의 한 도로에서 화물차와 스포츠유틸리티차량(SUV) 2대가 연이어 추돌하는 사고가 났다. 이 사고로 50대 화물차 운전자와 SUV 탑승자 3명 등 4명이 경상을 입고 인근 병원으로 이송됐다. 경찰은 내리막길을 주행하던 화물차가 브레이크 파열로 앞서가던 SUV를 들이받으면서 사고가 난 것으로 보고 정확한 경위를 조사하고 있다.","category":"사건 사고"}],"사회":[{"title":"하이브 이어 SM 해킹 확인...주민번호에 계약 정보까지 유출 [자막뉴스]","link":"https://n.news.naver.com/mnews/article/052/0002430110","naverLink":"https://n.news.naver.com/mnews/article/052/0002430110","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"'4대 기획사'로 꼽히는 SM에서 지난 4일, 전자결재시스템을 비롯한 업무망에 보관된 일부 문서 파일들이 새어 나가는 사고가 났습니다. 사고는 팬 소통 앱 '버블'을 운영하는 디어유와 공연 기획사 드림메이커 엔터테인먼트, 두 계열사에서도 발생했습니다. SM은 유출 정보가 휴대전화 번호, 주소, 계좌번호, 주민등록번호, 계약서 기재 정보 등이라며, 유출된 대상과 항목을 특정해 개별 통보하고 있다고 밝혔습니다. 앞서 다른 엔터테인먼트 회사인 하이브에서도 지난 9월과 10월, 여러 차례에 걸쳐 개인정보 유출 사태가 일어나 경찰이 내사에 착수했습니다. 하이브 역시, 사내 전자결재 시스템이 표적이었습니다. 공격자가 외부 업체에서 제공하는 '문서 미리 보기' 기능에 비정상적으로 접근해, 사내 전자결재 시스템 서버와 비용처리 시스템에 보관된 일부 내부 문서와 포함된 개인정보를 빼돌린 겁니다. SM은 사고를 인지하자마자 침투 경로와 공격자 IP를 차단해 추가 유출을 막았다며, 아직 2차 피해 사례는 확인되지 않았다고 설명했습니다. 하지만 글로벌 시장을 무대로 뛰는 대형 기획사들의 사내망이 잇따라 뚫리면서, 소속 아티스트와 관계자들의 개인정보 악용에 대한 우려가 커지고 있습니다. YTN 이준엽입니다. 디자인ㅣ김진호 영상편집 | 이영훈 자막뉴스 | 김대천 ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"보성군의회, 의정스피치 역량강화 교육","link":"https://n.news.naver.com/mnews/article/079/0004207616","naverLink":"https://n.news.naver.com/mnews/article/079/0004207616","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"보성군의회, 의정스피치 역량강화 교육. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"서울동구고, 자격증 취득부터 AI 활용까지…자격증·NCS·AI 활용 취업 전략 등 실무 중심 교육 지원","link":"https://n.news.naver.com/mnews/article/030/0003483344","naverLink":"https://n.news.naver.com/mnews/article/030/0003483344","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"서울동구고, 자격증 취득부터 AI 활용까지…자격증·NCS·AI 활용 취업 전략 등 실무 중심 교육 지원. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"객실가격 낮추고 지역밀착하는 메리어트…‘인사동·구월·해운대’ 신규호텔 선보여","link":"https://n.news.naver.com/mnews/article/020/0003760884","naverLink":"https://n.news.naver.com/mnews/article/020/0003760884","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"객실가격 낮추고 지역밀착하는 메리어트…‘인사동·구월·해운대’ 신규호텔 선보여. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"의료 파업 칼 댄 ‘닥터 X’…15%대로 하락하다 마침내 반등","link":"https://n.news.naver.com/mnews/article/016/0002720469","naverLink":"https://n.news.naver.com/mnews/article/016/0002720469","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"의료 파업 칼 댄 ‘닥터 X’…15%대로 하락하다 마침내 반등. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"美 '아이언 게이트' 육·해상 전면 봉쇄에…이란 혁명수비대 \"말장난\" 반발","link":"https://n.news.naver.com/mnews/article/014/0005601099","naverLink":"https://n.news.naver.com/mnews/article/014/0005601099","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"미 중부사령부, 육로·카스피해 통한 무기·제재 물자 운송 단속팀 신설 7월 해상 봉쇄 이어 압박 범위 대폭 확대…\"이란 군사력 재건·자금조달 원천 차단\" 이란 혁명수비대 강력 반발…\"말장난 불과, 경제 봉쇄 절대 실현 못 해\" 이란 사거리 2000㎞ 미사일 제한 해제 시사…카타르 중재 협상 속 양측 무력시위·기싸움 팽팽 미군이 이란의 육상 국경과 카스피해를 통한 무기 운송을 차단할 전담팀을 신설했다. 7일(현지 시간) 미국 워싱턴포스트(WP)에 따르면 브래드 쿠퍼 미 중부사령관은 '아이언 게이트'(Iron Gate) 태스크포스(TF) 창설을 지시했다. 사진은 지난 4월18일 이란 게슘섬 앞바다의 호르무즈해협에 유조선 한 척이 정박해 있는 모습. /사진=뉴시스 [파이낸셜뉴스] 미군이 수개월째 이어온 대(對)이란 해상 봉쇄에 이어 육상과 카스피해를 통한 무기 운송까지 전면 차단하기 위해 전담 부대를 창설했다. 이란은 \"경제 붕괴는 없을 것\"이라며 자체 설정했던 미사일 사거리 제한까지 풀겠다고 맞서는 등 미국과 이란 간의 제재를 둘러싼 힘겨루기가 최고조에 달하고 있다. ■ 美, 육로·카스피해 틀어막는다…'아이언 게이트 TF' 출범 미 중부사령부는 7일(현지시간) 이란의 육상 국경과 카스피해를 통한 첨단 무기 및 제재 대상 물자 운송을 차단하기 위한 '아이언 게이트(Iron Gate)' 태스크포스(TF) 창설을 공식 발표했다. 미 플로리다주 탬파 중부사령부 본부에 설치된 이 TF는 민간 인력과 군인 약 20명으로 구성됐다. TF는 재무부, 국무부 등 미 정부 타 기관과 공조해 첨단 무기체계와 민·군 겸용 기술, 불법 수익의 이동을 원천 차단하는 임무를 맡는다. 브래드 쿠퍼 중부사령관은 \"아이언 게이트 창설은 기존 해상 봉쇄 성과를 더욱 강화할 것\"이라며 \"이란이 테러 집단에 자금을 대고 무기 공장을 재건하며 군 전력을 보충할 능력을 더욱 강하게 제한하겠다\"라고 밝혔다. 앞서 미군은 지난 7월 페르시아만과 오만만에 있는 이란 항구들에 대한 해상 봉쇄를 단행해 현재까지 약 250억달러(약 34조원) 규모의 이란산 원유 수출을 차단한 것으로 추산된다. 하지만 이란이 이를 우회해 카자흐스탄·러시아 육상 수송이나 카스피해 경유 등 비밀 조달망을 통해 20억 달러 이상의 장비와 물자를 수입해 온 정황이 포착되자, 미국이 제재의 그물망을 촘촘히 조인 것이다. ■ 발끈한 이란 \"말장난에 불과\"…미사일 사거리 제한 해제 엄포 미국의","category":"사회"},{"title":"대통령 여권 재발급…‘정부 유출’ 우리 주민번호는 변경 쉽지 않다?","link":"https://n.news.naver.com/mnews/article/028/0002831227","naverLink":"https://n.news.naver.com/mnews/article/028/0002831227","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"대통령 여권 재발급…‘정부 유출’ 우리 주민번호는 변경 쉽지 않다?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"영어의 뿌리, 4000년 전 스웨덴 온 정체불명 이주민이 단서 [사이언스 브런치]","link":"https://n.news.naver.com/mnews/article/081/0003696908","naverLink":"https://n.news.naver.com/mnews/article/081/0003696908","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"영어의 뿌리, 4000년 전 스웨덴 온 정체불명 이주민이 단서 [사이언스 브런치]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"번개 치맥, 남산 등산 라면…‘시정 스킨십’ 늘리는 오세훈","link":"https://n.news.naver.com/mnews/article/005/0001883772","naverLink":"https://n.news.naver.com/mnews/article/005/0001883772","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"주말 동안 연이어 깜짝 일정 “사법리스크 덜고 시정 스킨십 늘려” 오세훈 서울시장이 지난 6일 서울 남산에서 열린 ‘2026 남산 나이트 페스티벌’ 라디오 일일 진행자로 참여해 시민들이 보낸 사연을 소개하고 있다. 서울시 제공 오세훈 서울시장이 최근 공식 일정 외 관계자, 시민들과 소통하는 ‘번개 자리’를 만드는 등 현장 행보를 늘리고 있다. 명태균 여론조사비 대납 의혹 항소심에서 무죄를 받으면서 사법 리스크를 덜고 ‘시정 스킨십’을 확대하는 모습으로 풀이된다. 오 시장은 지난 6일 서울 남산에서 캠핑과 피크닉을 함께 즐기는 ‘2026 남산 나이트 페스티벌’에 참여했다. 오 시장은 백범광장에 마련된 현장을 둘러보고 돗자리에서 족발, 호떡 등을 먹으며 캠프닉 현장을 직접 체험했다. 라이브 라디오 ‘남산 노을 FM’의 일일 진행자가 돼 시민들이 보낸 사연과 신청곡을 직접 소개하기도 했다. 이날 일정은 종료 예상 시간보다 1시간30분쯤 늦게 마무리됐다. 오 시장이 즉석으로 남산 정상에 올라 행사 관계자들과 컵라면을 먹는 이벤트를 제안하면서다. 원래는 건강정원 산책 일정을 마지막으로 공식 일정은 오후 7시쯤 끝날 예정이었다. 오 시장은 추가 일정을 하는 동안 남산을 찾은 시민들과 인사하고, 외국인들과 한국 관광에 대해 이야기를 나누며 소통을 이어갔다. 시 관계자는 “관계자들 뿐 아니라 시민들과 보다 오래 시간을 보내며 시정에 대해 적극적으로 알리려는 취지”라고 설명했다. 오 시장은 기자들과 만나 “남산의 노을을 시민들과 함께 누리며 야간 골목 상권까지 활성화 될 것”이라고 말했다. 남산 곤돌라 사업 지연 문제도 언급하며 “국토부가 시행령 한 줄만 바꿔주면 되는데 마지막까지 안 해주고 있다. 버스 대기 줄만 100m가 넘어 시민들과 관광객들의 불편이 이어지고 있다”고 지적했다. 지난 5일 ‘손목닥터9988’ 300만 돌파 행사에서도 깜짝 일정이 등장했다. 오 시장은 부스 체험을 마치고 한강 선착장에 있는 한 치킨집에서 행사 관계자들과 예정에 없던 번개 회동을 가졌다. 이 일정 또한 오 시장의 제안으로 이뤄진 것으로 전해졌다. 오 시장은 무알콜 맥주와 간식을 먹으며 시민들과 소통했다. 항소심 무죄 이후 사법리스크를 덜고 ‘시정 스킨십’을 늘리려는 행보라는 해석이 나온다. 시 관계자는 “최근 오 시장이 행사 후 이석하라고 해도 뒤에 일정이 없거나 시간이 남으면 번개 스케줄을 만든다”며 “항소심 무죄 이후 부담을 덜고 시민들","category":"사회"},{"title":"강원 인제에 올가을 첫 대설주의보…1cm 내리다 밤 11시 해제","link":"https://n.news.naver.com/mnews/article/437/0000519739","naverLink":"https://n.news.naver.com/mnews/article/437/0000519739","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"강원 인제, 올가을 첫 대설주의보 시간당 1cm 안팎 내리다 밤 11시 해제 강원도 평창군 대관령면 선자령 부근에서 등산객들이 설경을 즐기고 있다. 기사와 관련없는 사진 [연합뉴스] 강원 인제군에 올가을 들어 첫 대설특보가 내려졌습니다. 기상청은 오늘 오후 7시에 강원 인제군의 산지에 대설주의보를 발효한 가운데, 내륙·800m 이상 고지대를 중심으로 시간당 1cm 안팎의 눈이 내리다 밤 11시를 기점으로 대설주의보가 해제됐습니다. 대설주의보는 24시간 동안 눈이 5cm 이상 쌓일 것으로 예측될 때 발효됩니다. 이날 오후 7시 기준 주요 지점의 최심신적설 현황에 따르면, 설악산(인제) 3.9cm, 인남(철원) 2.6cm, 향로봉(고성) 2.1cm, 광덕산(화천) 1.8cm, 구룡령(홍천) 0.4cm의 눈이 쌓였습니다. 강원기상청 관계자는 \"강원 내륙, 산지에 내린 비 또는 눈이 얼어 도로 살얼음이 나타나는 곳이 있어 교통안전에 각별히 유의해야 한다\"고 설명했습니다.","category":"사회"}],"생활·문화":[{"title":"“AI·로봇에 대체되는 노동…기본소득으로 ‘부의 쏠림’ 줄여야”","link":"https://n.news.naver.com/mnews/article/032/0003481424","naverLink":"https://n.news.naver.com/mnews/article/032/0003481424","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"헌정회·사회정책학회 ‘AI 시대의 양극화 현상’ 정책토론회 AI 시대 해법은 서상목 대한민국헌정회 정책연구위원회 의장이 지난 6일 서울 영등포구 헌정회 회의실에서 열린 ‘AI 시대의 양극화 현상: 진단과 해법’ 정책토론회에서 발표를 하고 있다. ‘선 성장 후 분배’, 불균형 키워 경제 성과 기업에만 쏠려 ‘문제’ AI 토큰세·로봇세 등 도입하고 복지국가 패러다임 전환 필요 불평등 상시 대응 기구 마련을 인공지능(AI)이 일자리를 대체하고 부의 집중을 가속할 것에 대비해 조세·재정과 사회복지 체계를 전면 개편해야 한다고 전문가들이 제언했다. 대한민국헌정회와 한국사회정책학회는 지난 6일 서울 영등포구 대한민국헌정회 회의실에서 경향신문 후원으로 ‘AI 시대의 양극화 현상: 진단과 해법’ 정책토론회를 열었다. 발표자들은 기술 발전의 성과를 사회 전체가 공유하기 위해 국가가 적극적으로 개입해야 한다는 데 의견을 모았다. 유종성 연세대 한국불평등연구랩 소장은 ‘AI 기본사회를 위한 조세·재정개혁의 과제’ 발표에서 정부의 ‘선성장, 후분배’ 정책 기조를 비판했다. 유 소장은 “AI와 로봇이 갈수록 노동을 대체하고 있는 오늘날에 ‘선성장, 후분배’ 정책은 이미 심각한 수준의 양극화와 불평등을 더욱 극도로 심화할 것”이라고 지적했다. 유 소장은 최근 경제성장의 성과가 노동자보다 기업에 집중되고 있다는 점을 짚었다. 국회예산정책처에 따르면 올해 상반기 명목 국민총소득(GNI) 증가액 284조원 가운데 기업과 자영업자 등이 자본에 투자해 얻은 총영업잉여 증가분은 224조원으로 78.7%를 차지했다. 노동자의 임금 등에 해당하는 피용자보수 증가분은 47조원(16.5%)에 그쳤다. 유 소장은 AI 기본사회를 실현하려면 기본소득·기본자산·기본서비스를 세 축으로 삼아야 한다고 말했다. 기본소득으로 최소한의 소득 기반을 제공하고, 기본자산으로 상속·증여에 따른 기회 격차를 줄이며, 의료·교육·돌봄 등 기본서비스를 확대하자는 구상이다. 이를 위한 조세개혁 방안으로는 ‘AI 토큰세’와 ‘로봇세’ 도입을 제안했다. AI 사용량에 따라 세금을 부과하거나 로봇 사용 비용을 높여 기업이 사람 대신 AI와 로봇을 사용하는 유인을 줄이자는 취지다. 기업이 부담하는 건강보험·고용보험 등 사회보험료의 부과 기준도 근로자 임금에서 기업 이윤으로 전환하자고 제안했다. 기본소득은 단계적으로 도입하되, 평균 개인소득의 10~20%에 해당하는 월 30만~60만원을","category":"생활·문화"},{"title":"“제설제 60분내 뿌린다”…서울시, 한파 쉼터 ‘온기소’ 첫 도입","link":"https://n.news.naver.com/mnews/article/020/0003760875","naverLink":"https://n.news.naver.com/mnews/article/020/0003760875","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"경적 대신 일제히 차들이 멈췄다…서울 한복판서 뜻밖의 장면","link":"https://n.news.naver.com/mnews/article/025/0003563643","naverLink":"https://n.news.naver.com/mnews/article/025/0003563643","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"경적 대신 일제히 차들이 멈췄다…서울 한복판서 뜻밖의 장면. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"한국 소비자 위해 만든 '웃는 수세미' [더스쿠픽 쇼츠]","link":"https://n.news.naver.com/mnews/article/665/0000008522","naverLink":"https://n.news.naver.com/mnews/article/665/0000008522","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"한국 소비자 위해 만든 '웃는 수세미' [더스쿠픽 쇼츠]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"입동 추위 물렀거라! 주민 화합 나가신다","link":"https://n.news.naver.com/mnews/article/002/0002464828","naverLink":"https://n.news.naver.com/mnews/article/002/0002464828","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"한춘옥 의원 \"6개월 강의 9시간\" '전남형 청년창업사관학교' 교육 부실","link":"https://n.news.naver.com/mnews/article/079/0004207609","naverLink":"https://n.news.naver.com/mnews/article/079/0004207609","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"한춘옥 의원. 통합특별시의회 제공 한춘옥 전남광주통합특별시의원(더불어민주당·순천)이 6일 열린 경제국 행정사무감사에서 전남형 청년창업사관학교의 부실한 교육 운영과 바우처의 목적 외 사용, 위탁기관의 관리 부실을 강하게 질타했다. 한 의원은 2025년 청년창업사관학교의 교육 프로그램은 총 5회였지만, 실제 강의 시간은 6개월간 단 9시간에 불과했다. 일부 일정은 입교식과 페스티벌 참석으로 대체됐고, 마지막 교육은 온라인 강의로 진행됐다. 청년 창업가 육성이라는 사업 취지가 무색한 형식적 운영이라는 지적이다. 한 의원에 따르면 바우처 관리는 더욱 허술했다. 청년창업자에게 월 100만 원씩 최대 2년간 지원하는 바우처가 300만 원이 넘는 게이밍 컴퓨터와 고가의 다이슨 청소기, 7만 원이 넘는 필기도구 등 창업과의 직접적인 연관성이 불분명한 물품 구매에 사용됐다고 주장했다. 2025년 7~12월 지급액은 7억 2,267만 원이며, 이 중 7억 549만 원이 집행됐다. 더 큰 문제는 위탁 보육기관마다 바우처 사용 기준과 관리 방식이 달랐다는 점이다. 16개 보육기관 중 일부는 부적정 사용액을 환수한 반면, 다른 기관은 동일한 구매 내역을 정상 사용으로 인정했다. 같은 지출을 두고 기관마다 판단이 달랐다는 것은 통일된 관리 기준과 감독 체계가 제대로 작동하지 않았다는 방증이라는 지적이다. 한 의원은 \"청년 창업 지원은 반드시 필요한 사업이지만, 창업에 300만 원이 넘는 게이밍 컴퓨터가 정말 필요한지 묻지 않을 수 없다\"며 \"바우처는 공짜 돈이 아니라 시민의 세금\"이라고 강조했다. 이어 \"창업과 무관한 지출이 발생하지 않도록 사용 기준을 명확히 하고, 위탁기관의 관리·감독 책임도 강화해야 한다\"고 강조하고, 10개월간 1300시간을 가르치는 같은 통합특별시의 인공지능사관학교를 예로 들며 \"사업 이름만 청년창업사관학교일 것이 아니라 지역 특성을 반영한 실질적인 교육과 창업 성과로 그 가치를 증명해야 한다\"고 촉구했다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"생활·문화"},{"title":"아직 단풍 남았는데…뚝 떨어진 아침 기온[2026년 11월 09일 날씨]","link":"https://n.news.naver.com/mnews/article/032/0003481409","naverLink":"https://n.news.naver.com/mnews/article/032/0003481409","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"“건강하니까 괜찮겠지” 안심했다간 심장에 ‘독’…추운 날 더 조심해야 할 운동 [헬시타임]","link":"https://n.news.naver.com/mnews/article/011/0004679960","naverLink":"https://n.news.naver.com/mnews/article/011/0004679960","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"“건강하니까 괜찮겠지” 안심했다간 심장에 ‘독’…추운 날 더 조심해야 할 운동 [헬시타임]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"48세 채리나, 탄탄한 비키니 자태⋯꾸준히 해온 ‘이 운동’ 뭐길래?","link":"https://n.news.naver.com/mnews/article/296/0000107048","naverLink":"https://n.news.naver.com/mnews/article/296/0000107048","pubDate":"2026-11-08T12:00:00+09:00","author":"네이버뉴스","description":"48세 채리나, 탄탄한 비키니 자태⋯꾸준히 해온 ‘이 운동’ 뭐길래?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"“유방암 예방하려면 ‘이 음식’ 자주 드세요”…예방에 좋은 습관 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107046","naverLink":"https://n.news.naver.com/mnews/article/296/0000107046","pubDate":"2026-11-08T12:00:00+09:00", 경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"곡성군, 제7회 사회복지사 대회 개최… “처우 개선 지속 추진”","link":"https://n.news.naver.com/mnews/article/382/0001303428","naverLink":"https://n.news.naver.com/mnews/article/382/0001303428","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"곡성군, 제7회 사회복지사 대회 개최… “처우 개선 지속 추진”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"가상 아이돌 제작부터 투자 상담까지…12일 'AI 콘텐츠 페스티벌' 개막","link":"https://n.news.naver.com/mnews/article/014/0005601134","naverLink":"https://n.news.naver.com/mnews/article/014/0005601134","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"서울 코엑스서 14일까지 무료 전시·체험 김난도·궤도 등 참여, 강연·토론 사흘로 12~14일 서울 코엑스 더플라츠에서 열리는 'AI 콘텐츠 페스티벌 2026' 포스터. 문화체육관광부 제공 [파이낸셜뉴스] 인공지능(AI)으로 드라마를 기획하고 케이팝 가상 아이돌을 만들어 보는 축제가 열린다. 올해는 AI 콘텐츠 기업이 투자자와 공동 제작 파트너를 만나는 자리도 처음 마련된다. 9일 문화체육관광부에 따르면 문체부와 한국콘텐츠진흥원은 12~14일 서울 강남구 코엑스 2층 더플라츠에서 'AI 콘텐츠 페스티벌 2026'을 개최한다. 2024년 시작한 이 행사는 올해로 3회째다. 12~13일 코엑스 스타트업브랜치에서는 국내외 투자 관계자와의 일대일 상담, 참가 기업의 콘텐츠·기술 발표, 기업 간 교류회를 진행한다. 키다리스튜디오, MBC C&I, 대교인베스트먼트 등은 AI 활용 영상 제작, 확장현실(XR) 공동 제작, 유망 콘텐츠 기업 투자 등 각자의 수요를 먼저 제시한다. 이에 맞는 기술이나 콘텐츠를 보유한 기업이 협업을 제안하는 방식이다. 전시 공간은 감상·체험·창작·산업 융합 등 네 가지 주제로 나뉜다. AI 기반 영상·음악·게임을 선보인다. 생성형 AI로 장편영화를 완성한 MBC C&I는 드라마 기획·제작 실습을, 지로는 케이팝 가상 아이돌 제작 실습을 맡는다. AI 특화 콘텐츠 아카데미에 참여한 창작자들의 영상·가상현실(VR)·XR·게임 작품도 전시된다. 13일 메가박스 코엑스점에서는 행사와 연계해 '플리카와 루우(작은 빛)'와 '범행전야' 등 AI 콘텐츠 인재 양성 과정에서 나온 영상 작품을 상영한다. 강연·토론회는 지난해 이틀에서 사흘로 늘었다. 개막일인 12일 김난도 서울대 명예교수가 AI 시대 콘텐츠 소비 방식의 변화와 산업의 미래를 전망한다. 고삼석 동국대 석좌교수 등은 AI가 콘텐츠 창작·유통과 수익 구조에 미치는 영향을 논의한다. AI 시대에 달라지는 콘텐츠 투자 기준도 다룬다. 13일 창작자 대상 강연에서는 CJ포디플렉스의 스크린엑스(ScreenX)용 영상 제작 공정과 AI 활용 사례를 소개한다. AI 시대 인재 양성과 콘텐츠 제작 체계의 변화도 토론 주제다. 14일에는 과학 콘텐츠 창작자 궤도와 표창원범죄과학연구소 표창원 소장이 미래 직업과 기술 활용 윤리를 주제로 강연한다. AI를 접목한 마술·음악 공연도 펼쳐진다. 김경화 문체부 문화산업미디어정책관은 \"인공지능 시대에서의 콘텐츠 산업의 경쟁력","category":"생활·문화"},{"title":"'자카르타의 밤' 빛낸 7080 추억의 콘서트…교민 등 1천명 환호","link":"https://n.news.naver.com/mnews/article/001/0016428370","naverLink":"https://n.news.naver.com/mnews/article/001/0016428370","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"현숙·홍서범·조갑경·남궁옥분 등 유명 가수·밴드 합동 공연 자카르타서 열린 '7080 추억의 밤' 콘서트 (자카르타=연합뉴스) 손현규 특파원 = 7일(현지시간) 오후 인도네시아 수도 자카르타에 있는 '플라자 스나얀' 공연장에서 '7080 추억의 밤' 콘서트가 열리고 있다. 2026.11.7 (자카르타=연합뉴스) 손현규 특파원 = 1970∼80년대를 대표한 유명 가수들이 인도네시아 수도 자카르타에 모여 현지 교민들을 위한 합동 콘서트를 열었다. 이 콘서트는 7일 오후 7시(현지시간) 자카르타에 있는 '플라자 스나얀' 공연장에서 '7080 추억의 밤'이라는 이름으로 진행됐다. 콘서트에서는 '효녀 가수'로 유명한 현숙을 비롯해 홍서범·조갑경 부부, 남궁옥분, 권성희 등이 추억의 히트곡을 불렀다. 현숙은 \"자카르타 교민들은 민간 외교를 하시는 애국자\"라며 \"2시간의 공연 동안 기쁨과 희망을 보여드리기 위해 왔다\"고 말했다. 현숙이 '오빠는 잘 있단다'와 '요즘여자·요즘남자' 등을 부르자 교민뿐만 아니라 현지인들도 손뼉을 치며 환호했다. 이날 콘서트에서 사회도 함께 맡은 홍서범은 \"오늘 출연진들의 히트곡이 많아 가수마다 4곡씩 선별하기도 어려웠다\"며 \"인도네시아에서 활발하게 경제 활동을 하면서 국위 선양을 하는 우리 교민들을 응원한다\"고 말했다. 올해 데뷔 46주년인 건아들과 옥슨 80 등 1980년대 인기 밴드들도 관객들과 만났다. 이날 공연장에는 자카르타 한인 교민과 현지인 등 1천여명이 객석을 가득 메웠다. 남궁옥분은 연합뉴스와 만나 \"저물어가는 7080 정서의 향수를 인도네시아에서 교민들과 공유하고 싶었다\"며 \"잠시나마 추억의 그 시절로 돌아가 함께 웃으며 즐기는 시간이었다\"고 말했다. 이번 공연은 과거 인도네시아 한인상공회의소(코참) 회장을 지낸 송창근 KMK 글로벌 스포츠그룹 회장이 교민들을 위해 기획했다. 세계 신발 업계의 '큰손'으로 불리는 송 회장은 1988년 인도네시아에서 300달러(약 40만원)로 사업을 처음 시작했고, 지금은 6개 계열사에 3만5천명이 넘는 직원을 둔 그룹을 운영하고 있다. 송 회장은 이날 행사 수익금 가운데 일부를 한국인 다문화 가정이나 한국어를 배우는 현지 기술학교 고등학생들에게 장학금으로 전달할 계획이다. 송 회장은 \"인도네시아 한인사회의 기반을 다진 7080세대의 노고와 헌신에 감사와 존경의 마음을 전하고 아름다운 추억과 따뜻한 위로를 함께 나누기 위해 이번 공연을 기획했다\"","category":"생활·문화"},{"title":"[내일날씨] 일요일 아침 영하권 추위⋯중부지방 비","link":"https://n.news.naver.com/mnews/article/031/0001073114","naverLink":"https://n.news.naver.com/mnews/article/031/0001073114","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"일요일 아침 기온 영하권…강원지역 낮부터 비·산지엔 눈","link":"https://n.news.naver.com/mnews/article/654/0000209879","naverLink":"https://n.news.naver.com/mnews/article/654/0000209879","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"유튜브 방송하다 사람 기절시킨 조폭 출신 격투기 선수…변호사 “실형 가능성”","link":"https://n.news.naver.com/mnews/article/016/0002720288","naverLink":"https://n.news.naver.com/mnews/article/016/0002720288","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"[뉴시스] [헤럴드경제=김보영 기자] 유튜브 생방송 도중 일반인 출연자의 목을 졸라 기절시키고 전치 12주의 중상을 입힌 전직 조직폭력배 출신 격투기 선수 등 일당이 공소청에 송치됐다. 변호사는 피해자와 합의했더라도 실형이 나올 가능성이 높다고 봤다. 인천 서부경찰서는 지난 2일 격투기 선수 A씨를 상해 혐의로, 유튜버 3명을 상해방조 및 공동강요 혐의로 각각 인천공소청에 불구속 송치했다. 이들은 9월 6일 오전 4시경 인천 서해구 청라동 오피스텔에서 유튜브 방송 중 20대 남성 출연자의 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 의식을 잃고 쓰러진 출연자는 머리를 바닥에 강하게 부딪혔고, 신체 일부에 마비 증상을 보이는 등 전치 12주의 상해 진단을 받은 것으로 알려졌다. 격투기 선수 등은 미리 합의한 대본에 따라 연출된 행동이었다고 주장했으나, 경찰은 상해의 고의가 인정된다고 판단했다. 경찰은 겁에 질린 출연자가 대본대로 다투는 것을 주저하자 주변의 유튜버들이 다툼을 유도하거나 강요한 것으로 파악했다. 법조계에서는 실형이 나올 가능성이 큰 것으로 보고 있다. 조기현 변호사는 최근 유튜브 영상에서 “당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보이며 촬영을 강요해 12주의 중상을 입혔다”고 짚었다. 이어 “대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것”이라고 덧붙였다. 향후 형량에 대해서는 “피해자와 합의했기 때문에 형량이 앞서 예상했던 징역 4년보다는 줄어들 것으로 보인다”며 “상해죄나 중상해죄로 적용돼 징역 1년 이상의 실형은 나올 것”으로 전망했다. 한편 A씨는 이번 사건 이후 품위 유지 규정 위반을 이유로 소속 종합격투기 단체에서 퇴출됐다.","category":"생활·문화"},{"title":"“반려동물 키운다면 꼭 보세요”…집 비운 사이 고양이가 불냈다 ‘발칵’","link":"https://n.news.naver.com/mnews/article/009/0005760427","naverLink":"https://n.news.naver.com/mnews/article/009/0005760427","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"“반려동물 키운다면 꼭 보세요”…집 비운 사이 고양이가 불냈다 ‘발칵’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"\"돈 있는 집이 국민연금 더 빨리 타갔다\"…'조기 수급'의 기막힌 반전","link":"https://n.news.naver.com/mnews/article/014/0005601267","naverLink":"https://n.news.naver.com/mnews/article/014/0005601267","pubDate":"2026-11-07T12:00:00+09:00","author":"네이버뉴스","description":"\"돈 있는 집이 국민연금 더 빨리 타갔다\"…'조기 수급'의 기막힌 반전. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"경기도의회 function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();

  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}

    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
