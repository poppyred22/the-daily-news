미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"젠슨 황에 접근한 중국 여성 기업인은 국가안전부 간첩","link":"https://n.news.naver.com/mnews/article/003/0014307502","naverLink":"https://n.news.naver.com/mnews/article/003/0014307502","pubDate":"2026-11-07T10:08:37.515904+09:00","author":"네이버뉴스","description":"엔비디아 첨단 반도체 중국 수출 유도에 역할? 국가안전부, 경제 지배 위해 기술 획득 전투 [베이징=뉴시스]중국 국가안전부.(사진=바이두 갈무리) *DB 및","category":"사회"},{"title":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]","link":"https://n.news.naver.com/mnews/article/011/0004679681","naverLink":"https://n.news.naver.com/mnews/article/011/0004679681","pubDate":"2026-11-07T10:08:37.041402+09:00","author":"네이버뉴스","description":"‘피터팬 아빠’ 전경철 작가 뜻 잇는 임지영 피터팬재단 총괄디렉터 인터뷰 “복지부 재단법인 설립허가 기다려” “다시는 이 땅에, 피터팬이라는 이유로 세상 밖으로 내몰리는 아이가 없어야 한다. 더는 길이 보이지 않아, 자식과 자신을 포기하는 부모가 없기를 바란다.” (책 ‘안녕, 피터팬’ 中) 전경철 작가가 지난 7월 출간한 에세이 ‘안녕, 피터팬’을 들고 있다. 전 작가 브런치 캡처 지난 9월 5일. 전 국민을 울렸던 ‘피터팬 아빠’ 전경철 작가가 세상을 떠났다. 반평생 중증 자폐 아들을 돌보다 눈감은 전 작가의 마지막 소원은 단 하나, ‘피터팬재단’ 설립이었다. 피터팬재단은 성인 중증 자폐인들이 행복하게 살아갈 수 있는 마을 ‘네버랜드’ 건립을 목표로 한다. 피터팬재단 설립추진위원회는 전 작가가 숨지기 전날인 9월 4일 재단법인 설립 심사 신청을 냈다. 그로부터 두 달이 흘렀지만, 전 작가의 꿈은 미완으로 남아있다. 보건복지부의 재단법인 승인이 나지 않아서다. 임지영 피터팬재단 설립추진위원회 총괄디렉터를 만나 재단 설립 추진 과정을 들어봤다. 전경철(오른쪽) 작가와 그의 아들 전제원 씨. 전 작가 브런치 캡처","category":"사회"},{"title":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장","link":"https://n.news.naver.com/mnews/article/015/0005351350","naverLink":"https://n.news.naver.com/mnews/article/015/0005351350","pubDate":"2026-11-07T10:03:02.328306+09:00","author":"네이버뉴스","description":"사진=생성형 AI 고용 불안을 무기로 70대 고령 노동자의 월급을 3년 넘게 뜯어낸 악덕 하청업체 팀장이 결국 철창신세를 지게 됐다. \"(원청의) 항의로 잘릴 수도 있다\"며 겁을 준 이 남성은 그렇게 갈취한 8000만 원 넘는 돈을 개인 빚을 갚고 도박판에 탕진한 것으로 드러났다. 7일 법조계에 따르면 수원지방법원 여주지원은 최근 공갈 혐의로 재판에 넘겨진 하청업체 현장 총괄팀장 A씨에게 징역 1년의 실형을 선고했다. 한국도로공사의 하청업체에서 현장 총괄팀장을 맡고 있던 A씨는 청소인부를 구하라는 회사 대표의 지시에 따라 2020년 73세의 고령인 D씨를 채용했다. D씨는 그해 2월 17일부터 고속도로 갓길과 졸음쉼터 등을 청소하는 업무에 종사했다. 그런데 A씨는 2020년 5월 피해자의 배우자가 운영하는 점포를 찾아가 \"청소 업무에 대해 도로공사에 항의가 들어오고 있으니 잘릴 수도 있다. 일하기 싫으면 그만둬라. 당신 말고도 청소 일 할 사람 많다\"고 협박성 발언을 쏟아냈다. 심지어 \"(상납금은) 나 혼자 먹는 거 아니다. 사장님한테 로비하는데 쓰는 거다\"라는 핑계를 댔다. 인사권을 쥔 팀장의 협박에 겁을 먹은 70대 노인은 그날 바로 현금 372만 원을 바쳤다. 이후 피해자는 2023년 12월까지 같은 방법으로 총 40회에 걸쳐 현금 및 피고인(또는 피고인 자녀) 명의의 계좌로 합계 8169만원을 갈취당했다. 제대로 일하고도 세금 낼 돈이 없어 타인에게 돈을 빌리고 세금을 체납해야 할 정도로 피해자의 삶은 망가져 갔다. 법정에서 A씨는 D씨가 처음 약 1년간은 성실하게 작업하다가 언제부터인가 늦게 출발하고 청소 현장이라고 거짓말을 하는 등 게으름을 피워 청소작업을 제대로 하라는 취지로 말한 것뿐이라고 주장했다. 하지만 재판부는 \"피해자는 상납금을 갈취당하고 있는 입장이므로 근로의욕이 저하돼 업무를 태만히 하게 될 수 있고, 상납금을 갈취하는 A가 업무 태만으로 주의를 주더라도 정당한 지적으로 들리기 어렵다\"고 지적했다. 이어 \"피고 A는 피해자가 업무를 태만히 했다면서도 피해자를 재추천해 2년 연장 계약을 하면서, 결국 고속도로 청소 업무의 수준이 저하되는 결과가 초래될 수 있다\"고 지적했다. 법원은 A씨가 선고기일 직전에 합의서를 제출했지만 '30개월에 걸쳐 나눠 갚겠다'는 조건 등을 내걸었고, D씨가 엄벌을 탄원한 점 등을 감안해 실형을 선고했다.","category":"사회"},{"title":"[속보] 이용철 법무장관 후보 “검찰개혁 차질없이 완수하겠다”","link":"https://n.news.naver.com/mnews/article/366/0001203171","naverLink":"https://n.news.naver.com/mnews/article/366/0001203171","pubDate":"2026-11-07T10:03:02.328189+09:00","author":"네이버뉴스","description":"6일 법무부 장관 후보로 지명된 이용철 방위사업청장 /뉴스1 이용철 법무부 장관 후보자가 6일 공소청과 중대범죄수사청(중수청) 출범에 따른 형사사법 체계 개편을 언급하며 검찰 개혁을 차질 없이 완수하겠다는 입장을 밝혔다. 이 후보자는 이날 지명 소감을 통해 “공소청과 중수청이 새로 출범하고 형사사법 체계가 크게 개편된 엄중한 시기에 법무 행정을 책임지는 법무부 장관 후보자로 지명받아 막중한 책임감을 느낀다”고 밝혔다. 이어 “만약 장관으로 일할 수 있는 기회가 주어진다면 검찰 개혁을 차질 없이 완수하고 새로운 형사사법 체계의 빠른 안착에 힘쓰는 한편, 범죄 피해자를 비롯한 사회적 약자의 인권 보호를 위해 최선을 다하겠다”고 말했다. 이 후보자는 지명 배경에 대해서도 설명했다. 그는 “대통령께서 저를 법무부 장관 후보자로 지명하신 이유는 참여정부 청와대 법무비서관으로서 검경 수사권 조정 등 검찰 개혁과 사법 제도 개혁 업무를 수행했던 경험을 살려 검찰 개혁을 완수하고, 큰 폭으로 개정된 형사사법 체계의 안착에 역할을 해달라는 것이라고 생각한다”고 했다. 그러면서 “국민 여러분께 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다”고 덧붙였다. 앞서 이재명 대통령은 이날 이 후보자를 신임 법무부 장관 후보자로 지명했다. 이 후보자는 민주사회를 위한 변호사모임 출신으로 노무현 정부 청와대 민정2비서관과 법무비서관, 방위사업청 초대 차장 등을 지냈다. 지난해 11월부터 방위사업청장으로 재직하고 있다.","category":"사회"},{"title":"119 구급차에서 태어난 31주 미숙아 살려낸 '50일의 기적'","link":"https://n.news.naver.com/mnews/article/654/0000209848","naverLink":"https://n.news.naver.com/mnews/article/654/0000209848","pubDate":"2026-11-07T00:26:25.047997+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"\"밤 10시 넘으면 씻지도 말라고?\"…아파트 공지문에 엇갈린 반응","link":"https://n.news.naver.com/mnews/article/003/0014307370","naverLink":"https://n.news.naver.com/mnews/article/003/0014307370","pubDate":"2026-11-07T00:26:25.047990+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 밤 10시 이후 샤워와 세탁기 사용을 자제해 달라는 아파트 공지문을 두고 네티즌들의 의견이 엇갈렸다. (사진출처=스레드 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 아파트 입주민이 밤 10시 이후 샤워와 세탁기 사용 등 물소리를 자제해 달라는 공지문을 게시한 사실이 알려지면서 온라인에서 논쟁이 벌어졌다. 6일 소셜미디어(SNS) 스레드에는 한 아파트 입주민이 작성한 층간소음 관련 공지문 사진이 올라왔다. 공지문 작성자는 밤 10시부터 자정은 물론 새벽 2~3시에도 세탁기와 샤워기, 세면대에서 물을 사용하는 소리가 들린다고 적었다. 그는 \"밤시간이 아니라면 지속 시간이 길더라도 견딜 수 있다. 일과의 마무리를 씻고 정리하는 것은 일반적\"이라면서도 \"한밤중 물소리는 이웃에게는 폭포수처럼 엄청난 소음\"이라고 썼다. 이어 \"새벽에 휴대폰을 던지고 싸우는 소리, 화장실 문 쾅 닫는 소리에 물 폭탄 소리까지 들린다\"며 \"층간소음에 취약한 아파트라 알고 싶지 않은 소음들마저 실시간 중계되는 구조이니 서로서로 조심하자는 취지\"라고 밝혔다. 그러면서 \"밤 10시 이후에는 서로 배려했으면 한다\"고 당부했다. 이를 접한 네티즌들의 반응은 엇갈렸다. 샤워와 세안, 화장실 이용은 일상생활에 필요한 행동인 만큼 제한해서는 안 된다는 의견이 나왔다. 네티즌들은 \"9시 출근 6시 퇴근만 있는 줄 아느냐\", \"밤늦게 퇴근하는 사람은 어쩌라는 거냐\", \"자다 깨서 화장실에 다녀오고 손을 씻을 수도 있다\", \"물소리는 층간소음에도 들어가지 않는다\"등의 댓글을 남겼다. 반면 아파트 구조에 따라 물소리도 크게 들릴 수 있는 만큼 늦은 시간에는 주의할 필요가 있다는 의견도 있었다. 일부 네티즌은 \"소음이 심한 아파트는 물소리도 엄청 크게 들린다\", \"세탁기는 밤 10시 이후 피하는 게 맞는 것 같다\", \"샤워도 늦은 시간이라면 10~15분 안에 끝내는 게 좋다\"고 했다. 이후 공지문 작성자로 추정되는 입주민은 댓글을 통해 공지의 취지를 추가로 설명했다. 그는 \"단지 샤워를 하지 말라는 게 아니다\"며 \"윗집은 하루 종일 쿵쾅쿵쾅 발망치 소리, 의자 드르륵 소리, 싸우는 소리가 난다\"고 주장했다. 이어 \"하루에도 몇십 번씩 화장실을 들락날락하는데 낮과 저녁 내내, 새벽 3시까지 화장실에서 우당탕탕 물을 틀었다 껐다 계속 반복하고 있어 자다가 자꾸 깬다\"고 덧붙였다. 또한 \"윗집은 평일은 물론 주말과 방학 내내 어디를","category":"사회"},{"title":"\"천국 가려면 굶어야\"…어린이 190명 굶겨 죽인 사이비 교주 '징역 200년'","link":"https://n.news.naver.com/mnews/article/088/0001038899","naverLink":"https://n.news.naver.com/mnews/article/088/0001038899","pubDate":"2026-11-07T00:26:25.047988+09:00","author":"네이버뉴스","description":"종교 지도자가 신도들에게 극단적인 금식을 강요해 다수의 사망자가 발생한 사건의 재판 결과를 다룬다.\n법원은 지도자의 책임을 인정해 중형을 선고했다.\n종교를 악용한 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"사회"},{"title":"구급차서 태어난 31주 미숙아…구급대원 덕에 살았다","link":"https://n.news.naver.com/mnews/article/009/0005760299","naverLink":"https://n.news.naver.com/mnews/article/009/0005760299","pubDate":"2026-11-07T00:26:25.047964+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"“의사 선생님, 집도 드릴게요” 77억 들여 숙소까지 지은 농어촌…의사 구하기 얼마나 힘들길래","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-07T00:26:25.047949+09:00","author":"네이버뉴스","description":"의료 인력을 구하기 어려운 농어촌 지역이 의사 유치를 위해 주거 지원책을 마련했다는 기사다.\n숙소 조성에 큰 예산을 투입해 근무 여건을 개선하려는 시도가 소개됐다.\n지역 의료 공백을 줄이는 데 실제로 도움이 될지가 과제로 남는다.","category":"사회"}],"생활":[{"title":"NYT “뉴진스 계약, 이례적으로 공격적…미성년 보호조항 없어 불공정”","link":"https://n.news.naver.com/mnews/article/016/0002719622","naverLink":"https://n.news.naver.com/mnews/article/016/0002719622","pubDate":"2026-11-07T10:08:38.684046+09:00","author":"네이버뉴스","description":"그룹 뉴진스. [헤럴드POP(현 헤럴드뮤즈) 제공] [헤럴드경제=장연주 기자] 그룹 뉴진스의 멤버들이 미성년자 시절 소속사 어도어와 체결한 전속계약에 미성년자 보호 조항이 빠지는 등 불공정한 내용이 포함됐다고 뉴욕타임스(NYT)가 보도해 눈길을 끈다. NYT는 5일(현지 시간) 뉴진스 멤버 5명이 만 14~17세였던 2022년 체결한 전속계약서를 입수했다며 이 같이 밝혔다. NYT는 뉴진스와 어도어의 계약서를 입수해 분석한 결과, 미성년자 보호조항, 성형 비용 부담, 행동 제한, 위약벌 산정 방식, 계약 종료 이후 초상권 조항 등 멤버들의 권리를 침해하는 조항들이 다수 발견됐다고 보도했다. 이에 대해 NYT는 법률 전문가 5명의 검토를 거쳤는데, 이 중 한명인 서울의 엔터테인먼트 전문 노종언 변호사는 “이례적으로 공격적인 계약”이라고 평가했다고 덧붙였다. NYT는 먼저 뉴진스의 계약서에 대해 ‘아동 보호 관련 문구가 없다’고 지적했다. 뉴진스 멤버들은 12살이라는 어린 나이에 기숙사 생활을 시작했으며, 새벽 2시까지 리허설을 하는 것은 드문일이 아니었다고 익명을 요구한 관계자는 밝혔다. NYT에 따르면, 멤버들이 연습을 하는 구역에는 폐쇄회로(CC)TV가 설치돼 있었고, 멤버 5명 중 4명은 연습 도중 학교를 그만뒀다. 이에 대해 하이브 관계자는 “회사가 아동보호법을 철저히 준수하며, 출연진들이 안전한 환경에서 일하고 훈련받을 수 있도록 최선을 다하고 있다”고 밝혔다. 이어 “소속 아티스트들에게 학업을 중단하도록 강요하거나 휴식을 취하는 것에 대해 불이익을 주지 않는다”고 해명했다. 하지만 NYT는 입수한 이메일을 통해, 해당 계약 조건이 사실상 협상 불가능한 것이었다고 지적했다. 예컨데, 2022년 1월 한 멤버의 어머니가 계약서에 서명하기 전 여러가지 변경사항을 요청했는데, 어도어 측 부사장이 “만약 위에 언급된 사항들을 포함해 현재 계약 초안에 동의하지 않으신다면, 계약 자체를 재고해 보는 것이 최선일 수 있다”고 답변한 사실을 공개했다. 뉴진스의 계약서에는 피부 관리, 성형 수술, 체형 교정 등 미용 관련 비용도 멤버들이 부담한다는 조항도 있었다. 멤버들은 연습생 시절 성형수술 및 기타 미용 시술에 회사가 지출한 금액의 상당 부분을 상환해야 했다는 것. 이에 대해 하이브 측 관계자는 “개인의 의사에 반하는 성형수술이나 시술을 권유하지도 않는다”고 NYT에 말했다. 계약서에는 또 계약 종료 이후에도 멤버들","category":"생활"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:08:38.206733+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:08:37.041354+09:00","author":"네이버뉴스","description":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활"},{"title":"'배달기사가 내 짜장면 먹었다' 논란에…배민 \"고객 음식 아냐\"","link":"https://n.news.naver.com/mnews/article/277/0005839318","naverLink":"https://n.news.naver.com/mnews/article/277/0005839318","pubDate":"2026-11-07T10:03:02.328201+09:00","author":"네이버뉴스","description":"배민 \"폐기 처리한 음식\" 배달 음식 섭취 시 강한 제재 '배달 기사가 고객이 주문한 음식을 몰래 먹고 있었다'는 의혹에 대해 배달의민족 측이 \"폐기 처리한 음식을 먹은 것\"이라고 해명했다. 배달의민족 배달기사의 음식 무단 취식 의혹이 제기된 당시 모습. 배민 측은 음식이 파손돼 처리하는 과정에서 발생한 오해라고 해명했다. 스레드 캡처. 지난 5일 배달의민족 물류 서비스를 전담하는 우아한청년들은 입장문을 내고 \"전날(4일) 사회관계망서비스(SNS)에 배달 기사가 고객 주문 음식을 먹었다는 취지의 게시물이 올라왔다\"며 \"해당 건을 접수해 경위를 확인했으며 확인 결과와 당사 입장을 공유한다\"고 밝혔다. 이어 \"확인 결과 음식은 라이더가 비용을 부담하는 것으로 처리된 상황(자부담)\"이라며 \"고객이 파손 처리를 하는 과정을 목격해 오해가 생겼다\"고 설명했다. 그 러면서 \"고객께는 재조리된 음식과 함께 소정의 보상을 제공했다\"고 덧붙였다. 그러면서 우아한청년들은 배달 기사가 주문 음식을 전달하지 않고 임의로 먹는 행위에 대해서는 엄격한 제재 기준을 적용하고 있다고 강조했다. 회사 측은 \"고객 주문 음식을 전달하지 않고 취식하는 등 부정행위가 확인될 경우 '배민 커넥트' 이용 제한까지 가능한 강도 높은 정책을 운용하고 있다\"고 했다. 앞서 SNS에는 용인에 거주 중인 A씨가 \"아이들과 먹으려고 중국집에서 짜장면과 탕수육 등 여러 음식을 주문했다\"며 \"예정 시간이 지나도록 음식이 도착하지 않아 앱을 통해 기사의 위치를 확인했다\"고 적었다. 이어 그는 \"배달 기사가 우리 집으로 와야 하는데 오지 않길래 위치를 확인했더니 창밖으로 보이더라\"며 \"창밖으로 보니 배달 기사가 집 건너편에서 주문한 음식을 먹고 있었다\"고 주장했다. 글을 쓴 A씨에 따르면 배달 기사는 주변에서 쉽게 발견하기 어려운 집 맞은편 다리 아래서 배달할 음식을 개봉해 먹고 있었다. A씨는 글과 함께 배 달 기사의 뒷모습이 담긴 사진을 함께 공개했다. 배달의민족 측이 입장을 낸 후 A씨는 \"오늘(5일) 갑자기 환불해준다고 전화를 해주더라\"며 \"일단 상황 전달을 저에게 충분히 주지 못했으나 플랫폼이 잘못했다고는 생각하지 않지만, 이런 상황이 재발하지 않길 바라는 마음에 게시글을 올린 것\"이라 고 강조했다. 아울러 \" 플랫폼에 악의적인 마음은 없다. 해당 기사가 그렇다고 하는데 뭐 어쩌겠는가\"라면서도 \" 기사가 손을 입으로 가져가며 오토바이 주변을 서성이는 모습을","category":"생활"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:01:19.954869+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활"},{"title":"임신 중 출혈 30대 산모…구급차서 31주차 아기 출산, 생명 구했다","link":"https://n.news.naver.com/mnews/article/015/0005351317","naverLink":"https://n.news.naver.com/mnews/article/015/0005351317","pubDate":"2026-11-07T00:26:26.611986+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:08:38.684101+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:08:38.684068+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"문화"},{"title":"‘2026 인문문화축제’ 개막… 인공지능 시대 인간다움의 가치 조명","link":"https://n.news.naver.com/mnews/article/029/0003057567","naverLink":"https://n.news.naver.com/mnews/article/029/0003057567","pubDate":"2026-11-07T10:03:03.848490+09:00","author":"네이버뉴스","description":"8일까지 인문대담·정책토론·참여형 전시 진행… 이세돌·양희은 등 참여 2026 인문문화축제 현장 모습. 문화체육관광부(장관 최휘영)와 한국문화예술교육진흥원(원장 임진택)이 공동으로 마련한 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해 3회째를 맞은 인문문화축제는 ‘인문지능’을 주제로 오는 8일까지 열린다. 인문지능은 인공지능(AI) 기술이 발전하는 환경에서 스스로 질문하고 판단하며, 자신과 타인의 삶을 이해하는 인문적 역량을 의미한다. 축제 첫날에는 인공지능 시대의 인간다움과 인문정신문화 정책의 방향을 살펴보는 개막특별포럼이 진행됐다. 포럼은 정향미 문화체육관광부 문화예술정책실장의 환영사와 김재원 국회의원, 김선욱 인문정신문화진흥심의회 위원장의 축사로 시작됐다. 이후 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과인문문화의 가치’를 주제로 대담을 나눴다. 인공지능의 발전이 인간의 사고와 선택에 미치는 영향을 살펴보고 인문적 사유의 중요성을 조명하는 자리로 마련됐다. 이어진 정책토론회에서는 ‘제3차 인문정신문화 진흥 기본계획’ 수립 방향이 논의됐다. 정보람 한국문화관광연구원 부연구위원이 발제를 맡았으며, 성해영 서울대학교 종교학과 교수의 진행으로 김희삼 광주과학기술원(GIST) 교수, 정종은 부산대학교 교수, 강현조와우랩 이사가 토론에 참여했다. 참석자들은 AI 시대 인문정책의 역할과 정체성, 일상생활 속 인문 프로그램 확산 방안 등에 대해 의견을 교환했다. 6일 저녁에는 ‘인문의 밤-삶의 무늬’가 열린다. 황인찬 시인과 양희은 가수가 참여하는 토크콘서트 ‘노래가 된 시’와 인문사업 성과 발표회가 예정돼 있다. 7일에는 김겨울 작가, 김초희 영화감독, 이충녕 콘텐츠 창작자가 참여하는 ‘비교하지 않는 나만의 속도’가 진행된다. 이종범 웹툰 작가와 심채경 천문학자, 박혜진 편집자는 ‘당신의 일에도 인문이 있나요’를 주제로 대화를 나눈다. 같은 날 저녁에는 한국교육방송공사(EBS)와 공동 기획한 ‘인문의 밤-사유의 시간’에 선우정아 가수와 조병수 건축가가 참여한다. 8일에는 넉살 가수, 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 ‘설렘은 편집되지 않아요’를 주제로 이야기를 이어갈 예정이다. 관람객이 직접 참여할 수 있는 전시와 체험 프로그램도 운영된다. 전국 인문사업 현장을 소개하는 ‘인문의 길’, 타인의 회고록에 자신의 이야기를 더하는 ‘우리의 회고록’","category":"문화"},{"title":"인공지능 시대 인간다움 묻는 ‘2026 인문문화축제’ 개막… 주제는 ‘인문지능’","link":"https://n.news.naver.com/mnews/article/081/0003696655","naverLink":"https://n.news.naver.com/mnews/article/081/0003696655","pubDate":"2026-11-07T10:01:20.877887+09:00","author":"네이버뉴스","description":"- 6일 개막특별포럼서 이세돌·최성운 인문대담 및 제3차 인문정신문화 진흥 기본계획 논의 - 8일까지 서울 마포구 레이어스튜디오11서 인문대화·전시·탐방 등 다채로운 프로그램 운영 ▲6일 서울 마포구 레이어스튜디오11에서 열린 ‘2026 인문문화축제’ 개막특별포럼에서 임진택 한국문화예술교육진흥원장, 김선욱 인문정신문화진흥심의회 위원장, 김재원 국회의원, 정향미 문화체육관광부 문화예술정책실장 등 주요 인사들이 기념촬영을 하고 있다. (사진=한국문화예술교육진흥원 제공) 문화체육관광부(장관 최휘영, 이하 문체부)와 한국문화예술교육진흥원(원장 임진택, 이하 진흥원)이 공동 주최·주관하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막특별포럼을 시작으로 막을 올렸다. 올해로 3회째를 맞은 이번 축제는 ‘인문지능’을 주제로 오는 8일까지 이어진다. ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 스스로를 돌아보고 타인을 이해하며 삶의 방향을 주체적으로 선택하는 힘을 뜻한다. 첫날 열린 개막특별포럼은 정향미 문체부 문화예술정책실장의 환영사와 김재원 국회의원, 김선욱 인문정신문화진흥심의회 위원장의 축사로 시작됐다. 이어 인공지능 ‘알파고’와 대국을 펼쳤던 이세돌 전 프로바둑기사와 최성운 PD가 나서 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 인문대담을 진행했다. 대담 직후에는 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발제하고, 성해영 서울대 종교학과 교수를 좌장으로 김희삼 광주과학기술원(GIST) 교수, 정종은 부산대 교수, 강현조 와우랩(WOWLAB) 이사가 참여해 AI 시대 인문의 의미와 인문정책의 정체성, 생활권 인문 확산 방안을 논의했다. 6일 저녁 임진택 원장의 축사로 문을 여는 개막프로그램 ‘인문의 밤–삶의 무늬’는 황인찬 시인과 양희은 가수의 토크콘서트 ‘노래가 된 시’로 채워지고 이어 인문사업 성과 발표회도 열린다. 7일에는 김겨울 작가·김초희 영화감독·이충녕 콘텐츠 창작자의 ‘비교하지 않는 나만의 속도’, 이종범 웹툰 작가·심채경 천문학자·박혜진 편집자의 ‘당신의 일에도 인문이 있나요’, 한국교육방송공사(EBS)와 공동 기획한 선우정아 가수·조병수 건축가의 ’인문의 밤–사유의 시간’이 이어진다. 8일에는 넉살 가수·임승원 콘텐츠 창작자·유규선 콘텐츠기획자가 ‘설렘은 편집되지","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:26:26.611969+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막","link":"https://n.news.naver.com/mnews/article/079/0004207114","naverLink":"https://n.news.naver.com/mnews/article/079/0004207114","pubDate":"2026-11-07T00:26:26.611885+09:00","author":"네이버뉴스","description":"사유·공감·관계의 가치 조명…전국서 인문행사 풍성 문체부 제공 인공지능(AI) 시대에 인간 고유의 사유와 판단, 공감의 가치를 되짚는 '2026 인문문화축제'가 6일 서울에서 개막한다. 이세돌 전 프로바둑기사와 김겨울 작가, 심채경 천문학자 등 다양한 분야의 인사들이 시민들과 만나 인문의 가치를 이야기한다. 문화체육관광부는 한국문화예술교육진흥원과 함께 이날부터 8일까지 서울 마포구 레이어스튜디오11에서 '2026 인문문화축제'를 개최한다고 6일 밝혔다. 올해 축제의 주제는 '인문지능'이다. AI가 답을 제시하는 시대일수록 스스로 질문하고 판단하며 타인을 이해하는 능력이 중요하다는 취지다. '생각의 주도권', '경험의 고유성', '관계의 재발견'을 중심으로 대담과 공연, 전시, 체험 프로그램을 선보인다. 개막일인 6일에는 이세돌 전 프로바둑기사와 최성운 PD가 'AI가 둘 수 없는 한 수'를 주제로 인간의 판단과 선택에 관해 대담한다. 이어 '제3차 인문정신문화 기본계획' 수립을 위한 정책토론회가 열린다. 7일에는 김겨울 작가와 김초희 영화감독, 이충녕 콘텐츠 창작자가 '비교하지 않는 나만의 속도'를 주제로 이야기를 나눈다. 웹툰 '닥터 프로스트'의 이종범 작가와 심채경 천문학자, 박혜진 문학평론가는 '당신의 일에도 인문이 있나요'를 주제로 일과 삶의 의미를 짚는다. 8일에는 래퍼 넉살과 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 '설렘은 편집되지 않아요'를 주제로 일상의 경험과 관계, 기록의 의미를 이야기한다. 공연 프로그램인 '인문의 밤'도 마련된다. 6일에는 황인찬 시인과 가수 양희은이 시와 노래가 만나는 토크콘서트 '노래가 된 시'를 선보인다. 7일에는 가수 선우정아와 건축가 조병수가 참여하는 '사유의 시간'이 이어진다. 행사장에서는 '길 위의 인문학', '지혜학교' 등 주요 인문사업의 성과를 소개하는 전시와 시민 참여형 회고록 프로그램이 진행된다. 상수동 골목과 경의선 숲길, 홍대 일대를 걸으며 지역의 문화와 이야기를 살펴보는 인문탐방도 운영한다. 축제와 연계한 인문 프로그램은 전국으로 확대된다. 전국 10개 지역서점에서는 한유주 소설가, 정재승 뇌과학자, 황보름·정혜윤 작가 등이 참여하는 북토크가 열린다. 이와 함께 11월 한 달간 전국 193곳에서 다양한 인문문화 프로그램이 진행된다. 문체부 정향미 문화예술정책실장은 \"인공지능 시대에도 삶의 방향을 정하는 것은 결국 사람이며, 그 힘은 인문에서 나온","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:26:26.121640+09:00","author":"네이버뉴스","description":"20년 전 그래픽카드 개봉·PC 장착 체험 무료 게임 공개 AI 시대 연 '지포스 8800 GTX' 출시 20주년 기념 [이데일리 한광범 기자] 엔비디아(NVIDIA)가 최근 인공지능(AI) 산업의 토대가 된 그래픽카드 ‘지포스 8800 GTX’ 출시 20주년을 맞아 2006년 PC 게이밍 환경을 재현한 무료 체험 콘텐츠를 공개했다. 과거 그래픽카드를 직접 개봉하고 컴퓨터에 장착하는 경험을 최신 그래픽 기술로 되살린 것이 특징이다. 엔비디아는 6일 지포스 8800 GTX 출시 20주년을 기념하는 스팀(Steam) 데모 ‘지포스 8800 GTX - 전설의 20년’을 소개했다. 해당 콘텐츠는 지난 5일 스팀에 무료로 공개됐으며, 이용자가 직접 조작할 수 있는 반응형 기술 데모 형태로 제작됐다. 지포스 8800 GTX는 2006년 11월 8일 출시된 고성능 그래픽카드다. 당시 ‘컴퍼니 오브 히어로즈’, ‘바이오쇼크’, ‘크라이시스’ 등 고사양 PC 게임을 구동하는 대표적인 제품으로 주목받았다. 특히 2007년 출시된 크라이시스는 높은 그래픽 요구 사양으로 유명해지면서 PC 성능을 가늠하는 상징적인 게임으로 자리 잡았다. 이 제품의 역사적 의미는 게임 성능에만 있지 않다. 지포스 8800 GTX는 엔비디아가 개발한 병렬 컴퓨팅 플랫폼 쿠다(CUDA)를 지원한 최초의 그래픽카드다. 이전까지 주로 화면에 그래픽을 그리는 데 사용하던 GPU를 과학 계산과 시뮬레이션 등 다양한 연산 작업에 활용할 수 있는 기반을 마련했다. 당시 제품에는 G80 아키텍처를 기반으로 한 128개의 통합 스트림 프로세서가 탑재됐다. 그래픽 처리 과정에서 서로 다른 작업에 연산 자원을 유연하게 배분하는 구조로, 다이렉트X 10도 지원했다. 768MB GDDR3 메모리와 384비트 메모리 버스를 갖춘 것도 특징이었다. 쿠다를 통해 GPU의 병렬 연산 능력을 일반적인 컴퓨팅 작업에 활용할 수 있게 되면서 GPU의 쓰임새는 점차 확대됐다. 과학 연구와 영상 처리 등을 거쳐 오늘날 대규모 AI 모델을 학습하고 실행하는 가속 컴퓨팅으로 이어졌다. 엔비디아가 20년 전 그래픽카드를 기념하면서 게임뿐 아니라 쿠다의 역사를 강조하는 이유다. 이번 기념 데모는 언리얼 엔진 아티스트 딜런 브라운이 엔비디아의 지원을 받아 제작했다. 이용자는 2006년 분위기로 꾸며진 게임방에 들어가 지포스 8800 GTX의 포장을 뜯고 그래픽카드를 살펴본 뒤 당시 사양을 재현한 PC","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:26:25.553816+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"문체부·한국문화예술교육진흥원, '2026 인문문화축제' 개막","link":"https://n.news.naver.com/mnews/article/014/0005600649","naverLink":"https://n.news.naver.com/mnews/article/014/0005600649","pubDate":"2026-11-07T00:25:30.946345+09:00","author":"네이버뉴스","description":"문화체육관광부와 한국문화예술교육진흥원이 2026 인문문화축제를 시작했다.\n축제는 인문학을 일상과 연결하고 시민이 다양한 분야의 관점을 접하도록 기획됐다.\n기술 변화 속에서 인간과 사회의 가치를 생각하는 자리를 마련한다.","category":"문화"},{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:23:55.654948+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"}],"세계":[{"title":"참패 희생양 된 ‘얼음 아가씨’…트럼프, 비서실장에 강경파 밀러","link":"https://n.news.naver.com/mnews/article/025/0003563470","naverLink":"https://n.news.naver.com/mnews/article/025/0003563470","pubDate":"2026-11-07T10:08:37.515902+09:00","author":"네이버뉴스","description":"새 백악관 비서실장에 임명된 된 스티븐 밀러가 6일(현지시간) 워싱턴 DC 백악관 남쪽 잔디밭에서 나탈리 하프 백악관 보좌관과 함께 대통령 전용 헬기 ‘마린 원’에 탑승하기 위해 걸어가고 있다. AFP=연합뉴스 도널드 트럼프 미국 대통령이 중간선거 패배 사흘 만인 6일(현지시간) 새 백악관 비서실장에 스티븐 밀러(41) 부비서실장을 임명했다. 선거 패배 이후 백악관 내각 첫 교체 인사다. 트럼프 대통령은 이날 소셜미디어 트루스소셜을 통해 백악관 첫 여성 비서실장인 와일스 실장이 “트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라고 발표했다. 트럼프는 이후 백악관에서 기자들과 만나 “변화를 주고 싶었다”며 이번 인사가 중간선거 결과에 따른 인적 개편임을 시사했다. ‘얼음 아가씨’로 불리는 와일스는 대선 전부터 트럼프의 두터운 신임을 받아왔다. 하지만 트럼프 대통령은 선거 기간 와일스 실장의 교체설이 나돌자 “나는 전적으로 와일스를 신뢰한다”고 선을 그었으나, 예상보다 처참한 중간선거 성적표를 받아들고 와일스 실장을 희생양 삼아 사실상 경질한 것 아니냐는 분석이다. 밀러 실장은 이날 X를 통해 “지금 우리의 사명은 어느 때보다 분명하다”며 “온 마음을 다해 대통령을 지지하고 위대한 공화국을 지키기 위해 싸워야 한다”고 소감을 밝혔다. 그러면서 비서실장으로 임명된 것을 영광으로 생각한다고 했다. 그는 트럼프 대통령에 대해 “미 역사상 가장 획기적인 변화를 이끌어낸 정치 지도자”라며 “미국을 파괴하려는 세력들로부터 홀로 미국을 구해냈다”고 극찬했다. 지난 9월 22일(현지시간) 미국 뉴욕 유엔본부에서 열린 제81차 유엔총회 계기 도널드 트럼프 미국 대통령과 앤디 버넘 영국 총리의 양자 회담에 참석한 수지 와일스 백악관 비서실장(왼쪽)과 스티븐 밀러 백악관 부비서실장. AFP=연합뉴스","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:08:37.515898+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 선거 패배에 영향을 미친 뒤 협상에 대한 희망의 조짐이 나타나고 있다. 트럼프는 6일 기자들과 문답하는 과정에서 중재국들의 이란과의 논의가 계속되고 있다고 밝혔다. 트럼프는 “우리는 이란과 대화하고 있다. 이전부터 그래 왔다”고 말했다. 카타르와 이란은 핵 협상으로 나아가기 위한 가교 합의를 논의하고 있다. 역내 당국자들에 따르면 중재국들과 이란은 테헤란의 핵 프로그램에 관한 추가 협상의 길을 여는 데 도움이 될 잠정적 중간 단계 합의를 논의했다. 당국자들은 카타르가 최근 양측에 제시한 이 제안이 이틀에 걸쳐 신뢰 구축 조치를 이행하도록 하는 내용을 담고 있다고 말했다. 이 조치에는 미국의 봉쇄 해제와 이란의 핵 프로그램을 둘러싸고 이란을 고립시키려는 미국의 정책에 따라 수년 동안 압류해 동결한 이란 자금 수십억 달러 가운데 일부를 풀어 주는 방안이 포함된다. 그 대가로 이란은 미국과 이스라엘의 폭격을 받은 자국 시설에 국제원자력기구(IAEA) 사찰단이 들어오는 것을 허용하게 된다고 당국자들은 말했다. 당국자들에 따르면 둘째 날에는 이란이 호르무즈 해협을 다시 개방하게 된다. 이는 이란과 오만이 해당 해협을 놓고 합의했으나 미국의 승인을 받지 못한 수정 합의에 따른 것이다. 이러한 조치들이 이","category":"세계"},{"title":"선거 참패로 ‘겨울왕국’ 된 백악관, ‘얼음 아가씨’도 떠난다 [이 사람@World]","link":"https://n.news.naver.com/mnews/article/022/0004173207","naverLink":"https://n.news.naver.com/mnews/article/022/0004173207","pubDate":"2026-11-07T10:08:37.515896+09:00","author":"네이버뉴스","description":"수지 와일스 백악관 비서실장 1호 ‘경질’ 2024년 트럼프 대선 승리 당시 1등 공신 與 중간선거 참패에 더는 못 버티고 퇴장 미국 11·3 중간선거에서 여당인 공화당이 기록적 패배를 당한 뒤 백악관은 ‘겨울왕국’처럼 썰렁해졌다. 냉철하고 치밀한 성품 때문에 도널드 트럼프 대통령으로부터 ‘얼음 아가씨’(ice baby)란 별명을 얻은 비서실장은 가장 먼저 짐을 싸 백악관을 떠나는 신세가 됐다. 수지 와일스 미국 대통령 비서실장이 11·3 중간선거 직전인 지난 10월 초 혼자 깊은 생각에 잠겨 백악관 경내를 걷고 있다. 도널드 트럼프 대통령은 6일(현지시간) 중간선거 패배 책임을 물어 와일스를 경질했다. AFP연합뉴스 트럼프는 6일(현지시간) 사회관계망서비스(SNS)를 통해 백악관 비서실장 교체를 알렸다. 현재 비서실의 ‘2인자’인 스티븐 밀러(41) 부실장이 오는 9일부터 비서실장을 맡고, 수지 와일스(69) 현 비서실장은 물러난다는 것이다. 와일스가 공화당의 중간선거 패배 후 책임을 지고 사의를 밝힌 만큼 경질 인사로 풀이된다. 다만 트럼프는 와일스를 최대한 배려하는 태도를 취했다. 그는 SNS 글에서 와일스를 향해 “비서실장으로서의 봉사에 감사드린다”며 “정말 훌륭한 일을 해주셨다”고 찬사를 바쳤다. 그러면서 와일스가 완전히 자신의 곁을 떠나는 것은 아니며 ‘트럼프 정치 조직’(Trump Political Operation)으로 옮길 예정이라고 설명했다. 이는 와일스가 트럼프 개인의 사조직 운영에 관여하게 될 것이란 의미로 해석된다. 트럼프는 향후 정치적 영향력 유지, 정치자금 모금, 이른바 ‘마가’(MAGA·미국을 더 위대하게) 메시지 관리 등을 담당할 사조직을 재정비하고 있는 것으로 알려졌다. 와일스는 2024년 11월 대선에서 트럼프가 현직 부통령인 민주당 카멀라 해리스 후보를 상대로 예상 밖의 압승을 거두며 비로소 세상에 이름을 알렸다. 선거 직후 승리를 자축하는 연설을 하던 트럼프가 갑자기 “수지. 이리 와요. 이리 오라고”라며 그를 연단으로 불러냈다. 대선 기간 와일스는 트럼프 선거 캠프의 공동 위원장을 맡았다. 트럼프는 와일스를 ‘얼음 아가씨’라고 부르며 “뒤에 있는 걸 좋아하는데, 뒤에 있을 사람은 아니다”라는 의미심장한 발언을 했다. 그로부터 얼마 뒤 와일스는 트럼프 2기 행정부의 첫 백악관 비서실장으로 전격 발탁됐다. 미국 역사상 백악관 비서실장에 여성이 임명된 사례는 와일스가 최초다.","category":"세계"},{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:08:37.515891+09:00","author":"네이버뉴스","description":"[美 중간선거] 도널드 트럼프 미국 대통령(오른쪽)과 스티븐 밀러 백악관 신임 비서실장. /로이터=뉴스1 백악관 첫 여성 비서실장의 기록을 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 선거 패배 이후 백악과 내각에서 처음으로 이뤄진 인사 교체다. 신임 비서실장에는 도널드 트럼프 대통령의 강경파 최측근으로 꼽히는 스티븐 밀러 부비서실장(41)이 임명됐다. 민주당은 트럼프 대통령의 이 같은 인사가 선거 참패에도 '마이웨이'를 고수하겠다는 의지를 보인 것이라며 의회 차원의 조사를 예고했다. 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 \"밀러 부비서실장이 백악관 비서실장을 맡게 된다\"며 \"내가 가장 신뢰하는 참모 중 하나\"라고 밝혔다. 와일스 실장에 대해선 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로 헌신해준 데 대해 감사하다\"고 발표했다. 트럼프 대통령은 '트럼프 정치조직'이 어떤 조직인지, 와일스가 어떤 역할을 맡게 될지는 구체적으로 언급하지 않았지만 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 패배에 따른 인적 개편임을 시사했다. 이날 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 지 사흘 만에 발표됐다. 밀러 신임 실장은 트럼프 대통령의 대표적인 강경파 측근으로 집권 1기부터 반(反)이민 정책을 설계하고 추진해온 핵심 참모다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했고 트럼프 대통령의 첫 취임사 준비도 주도했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지내다 2기 행정부 들어 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도했다. 미 정가에선 트럼프 대통령이 비서실장 교체를 단행하면서 조만간 후속 내각 개편이 이어질 수 있다는 관측이 나온다. 수지 와일스 전 백악관 비서실장. /AP=뉴시스 /사진=이혜미","category":"세계"},{"title":"선거참패 1호 희생양?…'얼음아가씨' 백악관 첫 女비서실장 퇴장(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427624","naverLink":"https://n.news.naver.com/mnews/article/001/0016427624","pubDate":"2026-11-07T10:03:02.940635+09:00","author":"네이버뉴스","description":"와일스, 선거 앞두고 교체설 흘러나와…막판 트럼프 신임 떠난 정황 '행정부 내 권력암투' 분석도…\"와일스 일가 사익추구\" \"반대파의 모략\" 초기 유방암 진단받고 투병…\"트럼프, 알코올중독자 성격\" 발언 파장도 수지 와일스 [로이터=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 백악관 첫 여성 비서실장이라는 역사를 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 도널드 트럼프 미국 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 와일스 실장이 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 발표했다. 선거 패배 이후 백악과 내각 가운데 처음으로 이뤄진 교체 인사다. 집권당이 선거에서 질 경우 통상적으로 참모진과 각료 교체가 뒤따르게 되는데, 트럼프 대통령도 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 결과에 따른 인적 개편임을 시사했다. 와일스 실장은 공화당의 선거 전망이 암울해진 지난달부터 백악관과 행정부에서 교체설이 흘러나왔다. 그의 교체를 예상한 인사들이 후임 쟁탈전을 벌이고 있다고 보도될 정도였다. 막판에는 와일스 실장이 트럼프 대통령의 신임을 잃은 것 아니냐는 정황도 제기됐다. 역대 최단명 대변인인 케이티 재커라이어를 지명할 때 트럼프 대통령이 와일스 실장과 상의하지 않은 것으로 드러나면서다. 또 와일스 실장이 2024년 대선 때 영입한 제임스 블레어 전 백악관 부비서실장과 크리스 라시비타의 비위 의혹이 불거지자 트럼프 대통령이 즉각 이들과의 관계를 끊겠다고 발표하면서 와일스 실장과 사이가 틀어졌다는 관측이 나왔다. 트럼프 대통령은 선거 기간 와일스 실장의 교체설에 \"나는 전적으로 와일스를 신뢰한다\"고 선을 그었으나, 예상보다 처참한 중간선거 성적표를 받아들고 와일스 실장을 희생양 삼아 사실상 경질한 것으로도 볼 수 있다. 트럼프 대통령은 선거 당일 밤 여러 사람이 보는 앞에서 와일스 실장과 그가 이끄는 정치팀을 향해 '재앙'의 책임을 추궁하며 비난한 것으로 알려졌다고 뉴욕타임스(NYT)가 전했다. 와일스 실장의 교체 이면에는 트럼프 행정부에서 벌어진 권력 다툼이 작용했다는 분석이 제기된다. 그가 트럼프 대통령에게 잘못된 조언을 하면서 가족의 사익을 추구했다는 폭로가 나오고, 와일스 측은 반대파가 선거 패배의 책임을 자신에게 뒤집어씌운다고 반발하는 모습이다. 로버트","category":"세계"},{"title":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다","link":"https://n.news.naver.com/mnews/article/011/0004679676","naverLink":"https://n.news.naver.com/mnews/article/011/0004679676","pubDate":"2026-11-07T10:03:02.940631+09:00","author":"네이버뉴스","description":"클립아트코리아 생성형 인공지능(AI)이 학생들의 숙제와 시험 준비에까지 활용되면서 미국 학교의 평가 방식이 달라지고 있다. 집에서 작성하는 에세이 대신 교실에서 직접 글을 쓰거나 말로 답하는 구술시험이 다시 주목받고 있다. 최근 로이터통신에 따르면 미국의 일부 중·고등학교에서는 학생들의 AI 의존도를 낮추기 위해 손 글씨 과제와 대면 평가를 확대하고 있다. 로이터는 최근 미국 전역의 교사와 교육 전문가 12명을 인터뷰해 이러한 변화를 소개했다. 학생이 제출한 결과물만 평가하기보다 학습 내용을 실제로 이해했는지 확인하려는 움직임이다. 챗GPT가 대신 써주는 숙제…구술시험·손 글씨 부활 샌프란시스코에서 6학년 인문학을 가르치는 트리스턴 창 교사는 지난해부터 집에서 작성하는 에세이 숙제를 없앴다. 대신 학생에게 직접 질문을 던지고 답변을 듣는 구술시험을 도입했다. 시험에서는 작품의 등장인물과 줄거리, 주제, 은유적 표현 등을 묻는 15개 질문을 활용한다. 학생이 작품을 얼마나 이해했는지 말로 설명하도록 하는 방식이다. 창 교사는 “오랫동안 기술이 교육 방식을 바꿔왔지만 AI는 그중에서도 가장 급격한 변화”라며 “기존의 모든 방식이 통하지 않게 됐다”고 말했다. 다른 교사들도 숙제를 줄이는 대신 교실에서 학습 과정을 확인하는 데 집중하고 있다. 샌프란시스코의 중학교 영어 교사 러스티 셰이브는 집에서 과제를 해결하기 어려운 학생들이 AI에 의존하기 쉽다고 판단했다. 이에 교실에서 직접 글을 쓰는 시간을 늘렸다. 7학년 학생들과 에세이 한 편을 완성하는 데 한 달을 할애한 적도 있다고 전했다. 수학 수업에서도 변화가 나타났다. 뉴욕의 고등학교 수학 교사 밥슨 웡은 집에서 풀어오는 문제 수를 줄이고 수업 시간에 직접 문제를 해결하도록 했다. AI가 정답뿐 아니라 풀이 과정까지 만들어낼 수 있게 되면서 답을 맞혔는지만으로는 학생의 이해도를 평가하기 어려워졌기 때문이다. 웡 교사는 학생들에게 자신이 선택한 풀이법과 그 이유까지 설명하게 한다. 그는 “AI는 학생들의 수학 공부 방식뿐 아니라 내가 가르치는 방식까지 바꿨다”고 말했다. 디지털 기기 사용을 제한하는 학교도 있다. 시카고 교외의 고등학교 영어 교사 렉스 오발레는 수업이 시작되면 학생들에게 공책부터 꺼내도록 한다. 크롬북을 활용하는 수업은 전체 수업일의 약 10%로 제한했다. 오발레 교사는 “노트북이 없으면 학생들이 뒤에 숨을 수 없다”며 디지털 기기 사용을 줄인 뒤","category":"세계"},{"title":"트럼프, 그래도 마이웨이… “美에 공장 안 지으면 관세 300%”","link":"https://n.news.naver.com/mnews/article/023/0004008299","naverLink":"https://n.news.naver.com/mnews/article/023/0004008299","pubDate":"2026-11-07T10:01:19.432621+09:00","author":"네이버뉴스","description":"[美중간선거 후폭풍] 선거 패배에도 기존 입장 고수 도널드 트럼프 미국 대통령이 5일(현지 시각) 워싱턴DC 백악관에서 ‘백악관 집무실 국가기념물 지정’ 포고문에 서명하는 행사에 참석해 앉아 있다. /로이터 연합뉴스 도널드 트럼프 미국 대통령이 중간선거 참패 이틀 만인 5일(현지 시각) “미국에 공장을 짓지 않으면 최고 300%의 관세를 내야 한다”며 기존 관세 정책을 고수하겠다는 뜻을 분명히 했다. 공화당 대패의 원인으로 고물가와 이란 전쟁이 지목됐지만 정책 변화보다는 강경 대응을 예고한 것이다. 트럼프는 이날 백악관에서 취재진과 만나 “지금 관세를 없애면 미국에 건설 중인 3000여 공장의 공사가 모두 중단될 것”이라며 “그 대신 중국, 일본, 한국 등에서 제품을 들여오게 될 것”이라고 했다. 관세 철폐를 주장하는 사람들에게는 “어리석은 사람들”이라고 했다. 뉴욕 증시가 폭락하자 책임을 유권자에게 돌리기도 했다. 트럼프는 트루스소셜에 “민주당이 화요일 선거에서 크게 이겼기 때문에 오늘 주식시장이 폭락했다”며 “안타깝지만 여러분 스스로를 탓할 수밖에 없다”고 적었다. 또 다른 글에서는 “여러분의 은퇴 연금 계좌도 하락했다. 기억하라. 공화당이 아니라 민주당 때문”이라고 했다. 선거 결과에 대한 책임도 부인했다. 트럼프는 “나는 투표 용지에 없었다. 내가 출마했다면 압승했을 것”이라고 주장했다. 선거 전 자신의 이름이 투표 용지에 있다고 생각하고 투표하라고 독려했던 것과 달라진 태도다. 향후 국정 운영에 대해서는 “앞으로 1~2주 동안 많은 것을 보게 될 것”이라며 추가 조치를 예고했다. 이란에 대해서도 “가능하면 나머지를 파괴하고 싶지 않지만 그렇게 해야 할 수도 있다”고 했다. 한편 민주당은 하원(총 435석)에서 260석까지 넘볼 수 있는 상황이다. 이날 오후 6시 기준 민주당은 253석을 확보했고, 27석은 당선자가 확정되지 않았다. CBS뉴스는 민주당 최대 의석을 268석까지 전망했다. 민주당이 260석 이상을 확보하면 1990년 이후 36년 만에 최대 규모의 하원 의석을 차지하게 된다.","category":"세계"},{"title":"미 중간선거로 보는 기독교 정치…'마가' 균열 시작?","link":"https://n.news.naver.com/mnews/article/079/0004207420","naverLink":"https://n.news.naver.com/mnews/article/079/0004207420","pubDate":"2026-11-07T00:26:26.611946+09:00","author":"네이버뉴스","description":"미국 중간선거 결과를 계기로 기독교 보수 진영의 정치적 결속과 내부 균열을 분석한 기사다.\n선거 이후 종교계와 정치권의 관계, 당내 노선 경쟁이 주요 쟁점으로 다뤄진다.\n향후 미국 정치 지형에 미칠 영향이 주목된다.","category":"세계"},{"title":"일본 다카이치 '타이완 발언' 1년…중국 \"발언 시정해야\"","link":"https://n.news.naver.com/mnews/article/055/0001401267","naverLink":"https://n.news.naver.com/mnews/article/055/0001401267","pubDate":"2026-11-07T00:26:25.553843+09:00","author":"네이버뉴스","description":"▲ 다카이치 사나에 일본 총리 중일 관계 급랭을 불러온 다카이치 사나에 일본 총리의 '타이완 유사시 개입' 시사 발언이 7일로 만 1년을 맞는 상황에서 일본 정부가 '타이완이 중국 영토의 일부'라는 중국 입장을 존중한다고 6일 언급했습니다. 그러나 중국 정부는 중일 관계 악화의 책임이 일본에 있다며 다카이치 총리의 잘못된 발언을 조속히 바로잡으라고 촉구했습니다. 일본 정부 대변인인 기하라 미노루 관방장관은 정례 기자회견에서 해당 발언 1주년에 대한 평가와 향후 중일 관계 설정에 관해 묻는 말에 \"타이완에 관한 정부의 입장은 1972년 중일 공동성명에 명시된 바와 같다\"고 대답했습니다. 1972년 양국이 정식 외교관계를 맺을 당시 채택한 중일 공동성명에서 일본은 \"타이완이 중국 영토의 일부임을 강조한다\"는 중국의 입장을 \"완전히 이해하고 존중한다\"고 명시했습니다. 다카이치 총리는 이날 총리관저에서 기자들과 만나 \"중국은 중요한 이웃 국가이며 여러 과제가 존재함에도 불구하고 오랜 기간 쌓아온 관계가 있다\"고 말했습니다. 그는 이어 \"중국과 전략적 호혜 관계를 포괄적으로 추진하고 공통의 과제에 대해 소통하며 국익을 수호하기 위한 대화를 함으로써 건설적이고 안정적인 관계를 구축해 나갈 것\"이라며 그동안 국회 소신 표명 연설 등에서 했던 중국에 대한 발언을 되풀이했습니다. 이에 대해 궈자쿤 중국 외교부 대변인은 이날 정례브리핑에서 \"중일 관계가 심각한 어려움에 처한 책임은 전적으로 일본 측에 있다\"고 밝혔습니다. 이어 \"1년 전 일본 지도자가 타이완과 관련한 잘못된 발언으로 타이완 문제에 무력 개입하려는 신호를 공개적으로 보내 중국의 국가주권에 도전하고 중일 관계의 정치적 기초를 흔들었다\"고 비판했습니다. 궈 대변인은 특히 \"유감스럽게도 1년이 지났지만 일본 당국은 여전히 제자리걸음을 하면서 문제를 회피할 뿐 잘못을 반성하고 시정하려는 성의와 행동을 보여주지 않고 있다\"며 \"일본이 시급히 해야 할 일은 타이완 문제에 관한 잘못된 언행을 바로잡는 것이고, 중요한 것은 역사 문제에 올바른 태도를 취하는 것\"이라고 주장했습니다. 지난해 말부터 중일 관계가 꼬인 이후 양국의 정상·외교장관 등 고위급 공식 대화는 사실상 중단된 상태입니다. 다만 지난 9월 일본의 민간 중일 경제교류 기구 대표단을 이끌고 방중한 이와야 다케시 전 일본 외무상이 왕이 중국 외교부장을 만나 중일 공동성명을 양국 간 '우회적 화해'의 수단으로 삼을 것을","category":"세계"},{"title":"대승거둔 美 민주당, 이제 온건·진보 노선 투쟁? LA서 민주사회주의자 시장 당선[트럼프 2기]","link":"https://n.news.naver.com/mnews/article/002/0002464732","naverLink":"https://n.news.naver.com/mnews/article/002/0002464732","pubDate":"2026-11-07T00:26:25.553826+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 큰 성과를 거둔 뒤 당내 노선 경쟁이 주목받고 있다.\n온건파와 진보파가 향후 정책 방향과 주도권을 두고 경쟁할 가능성이 제기된다.\n이번 선거 결과가 다음 대선 구도에 미칠 영향도 관심사다.","category":"세계"}],"IT 과학":[{"title":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”","link":"https://n.news.naver.com/mnews/article/366/0001203195","naverLink":"https://n.news.naver.com/mnews/article/366/0001203195","pubDate":"2026-11-07T10:08:38.206762+09:00","author":"네이버뉴스","description":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:08:38.206754+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:08:38.206752+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:08:38.206750+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:08:38.206739+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:08:38.206729+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고","link":"https://n.news.naver.com/mnews/article/092/0002444296","naverLink":"https://n.news.naver.com/mnews/article/092/0002444296","pubDate":"2026-11-07T00:26:26.611988+09:00","author":"네이버뉴스","description":"AI 데이터센터 수요가 반도체 공급을 빠르게 흡수하면서 자동차 업계의 부품 수급 부담이 커질 수 있다는 전망이다.\n반도체 확보 경쟁이 이어질 경우 차량 생산비와 소비자 가격에도 영향을 줄 수 있다.\n내년 공급 상황과 가격 변동이 업계의 주요 변수로 꼽힌다.","category":"IT 과학"},{"title":"앤트로픽 IPO 미뤄지나…\"美 기술주 급락 여파\"","link":"https://n.news.naver.com/mnews/article/092/0002444279","naverLink":"https://n.news.naver.com/mnews/article/092/0002444279","pubDate":"2026-11-07T00:26:26.121658+09:00","author":"네이버뉴스","description":"미국 기술주 급락으로 투자심리가 얼어붙으면서 앤트로픽의 기업공개 추진 일정에도 차질이 생길 수 있다는 우려가 제기됐다. AI 관련주 전반의 변동성이 커진 가운데 시장의 관심은 상장 계획과 투자자 수요에 쏠리고 있다.","category":"IT 과학"},{"title":"AMD 마침내 인텔 넘어서나? 데이터센터 실적이 예고한 판도 변화 [고든 정의 TECH+]","link":"https://n.news.naver.com/mnews/article/081/0003696682","naverLink":"https://n.news.naver.com/mnews/article/081/0003696682","pubDate":"2026-11-07T00:26:26.121654+09:00","author":"네이버뉴스","description":"AMD와 인텔 모두 AI 데이터센터 수요에 힘입어 3분기 실적이 성장했지만, 데이터센터 사업의 성장률과 향후 전망에서는 차이가 나타났다. AMD는 AI GPU를 포함한 헬리오스 랙 시스템의 초기 매출을 반영했고, 이런 흐름이 이어지면 인텔과의 매출 격차가 좁혀지거나 역전될 가능성이 제기된다.","category":"IT 과학"},{"title":"\"미국 주춤해도 한국은 멈추면 안 돼\"…정부, AI 투자 지속 강조","link":"https://n.news.naver.com/mnews/article/015/0005351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:26:26.121647+09:00","author":"네이버뉴스","description":"배경훈 부총리, AI 데이터센터 투자 지속 강조 美 중간선거 후 AI 관련주 급락·투자 위축 우려 사이버 보안 차르 논의…초거대 AI 개발 검토 사진=연합뉴스 미국 중간선거 이후 인공지능(AI) 데이터센터 투자 위축 우려가 커지자 배경훈 부총리 겸 과학기술정보통신부 장관이 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 열기가 식더라도 다른 국가들이 이를 기회로 삼을 수 있다는 판단에서다. 배 부총리는 6일 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의를 마친 뒤 기자들과 만나 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦춰선 안 된다\"고 말했다. 최근 미국에서는 중간선거 이후 AI 데이터센터 규제 강화 가능성이 부각되면서 관련 기업의 주가가 하락했다. AI 인프라 투자에도 영향을 미칠 수 있다는 우려가 제기되는 상황이다. 배 부총리는 미국의 투자 움직임이 둔화하더라도 글로벌 경쟁은 계속될 것으로 봤다. 그는 \"미국이 주춤하더라도 중국이나 프랑스, 캐나다 등 다른 국가들은 오히려 이를 기회로 삼을 수 있다\"고 말했다. 이어 \"AI에 대한 기대 심리가 큰 만큼 작은 불안 요인에도 시장이 크게 출렁일 수 있지만 개인적인 견해로는 장기적으로 우상향할 것으로 생각한다\"고 덧붙였다. 배경훈 부총리 겸 과학기술정보통신부 장관. / 사진=뉴스1","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-06","weekday":"금요일","label":"보관 · 11월 6일 금요일","total":21,"categories":{"사건 사고":[{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/article/088/0001038903","pubDate":"2026-11-06T23:00:09+09:00","author":"매일신문","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/088/0001038903"},{"title":"“100여차례 여탕 몰카”…아내가 찍고 남편이 팔아 4300만원 챙긴 日 부부","link":"https://n.news.naver.com/article/030/0003483150","pubDate":"2026-11-06T22:20:00+09:00","author":"전자신문","description":"일본에서 젊은 부부가 목욕탕에 몰래카메라를 설치하거나 ","category":"사건 사고","naverLink":"https://n.news.naver.com/article/056/0012288935"},{"title":"與 \"'조작기소 특검법', 尹정치검찰 과오 청산하고 검찰개혁 마침표\"","link":"https://n.news.naver.com/article/003/0014306945","pubDate":"2026-11-06T17:51:12+09:00","author":"뉴시스","description":"[서울=뉴시스]권신혁 기자 = 더불어민주당은 6일 '조작기소 특검법'이 국회 본회의를 통과하자 \"윤석열 정권 정치검찰의 과오를 청산하고 검찰개혁의 마침표를 찍겠다\"고 밝혔다. 박성준 민주당 수석대변인은 이날 오후 서면브리핑에서 \"오늘 윤석열 정권 정치검찰 조작기소 특검법이 본회의를 통과했다\"며 이같이 말했다. 박 수석대변인은 \"이제 국회 추천을 거쳐 대통령의 특별검사 임명이 이뤄지면 본격적으로 윤석열 정권 정치검찰이 행했던 조작 기소의 민낯이 드러날 것\"이라고 했다. 또 \"검찰이 사라졌다고 해서 정치검찰이 벌인 잘못이 사라지는 것은 아니다\"라며 \"과거의 잘못을 바로잡아야 새로 출범한 공소청이 바로 서고 중수청을 비롯한 수사기관의 미래를 바로 세울 수 있다\"고 말했다. 그러면서 \"이번 조작기소 특검법은 조작을 일삼아 수사와 기소권을 휘둘렀던 정치검찰의 과오를 청산하고 검찰개혁의 마침표를 찍을 것\"이라고 덧붙였다. ◎공감언론 뉴시스 innovation@newsis.com","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014306945"}],"사회":[],"생활":[{"title":"“한 푼 한 푼 아끼며 살기 지쳤다”…거리로 나온 60만명에 장갑차 동원한 佛","link":"https://n.news.naver.com/article/009/0005760052","pubDate":"2026-11-06T23:48:33+09:00","author":"매일경제","description":"프랑스에서 생활비 부담 완화와 임금 인상, 공공서비스 개선을 요구하는 시위가 전국으로 확산했다. 노동자와 학생들이 함께 거리로 나서면서 학교 수업과 대중교통 운행에 차질이 생겼고,..","category":"생활","naverLink":"https://n.news.naver.com/article/009/0005760052"},{"title":"중국 ‘서열 5위’ 차이치, 북한 김성남 만나 “교류·협력 확대”","link":"https://n.news.naver.com/article/032/0003481194","pubDate":"2026-11-06T22:59:00+09:00","author":"경향신문","description":"북한 조선중앙통신은 김성남 노동당 국제비서를 단장으로 하는 노동당 대표단이 중국을 공식 방문하기 위해 전날 평양에서 출발했다고 4일 보도했다. 조선중앙통신·연합뉴스중국 공산당 권력 서열 5위인 차이치 중앙정치국 상무위원 겸 중앙서기처 서기가 6일 베이징에서 김성남 북한 노동당 국제비서와 만나 양국 간 교류·협력 확대 의지를 밝혔다.중국 관영 신화통신에 따르···","category":"생활","naverLink":"https://n.news.naver.com/article/032/0003481194"},{"title":"\"자전거 세워두고 본인은 임산부석에\"…출근길 지하철 무슨 민폐?","link":"https://n.news.naver.com/article/003/0014307298","pubDate":"2026-11-06T21:08:59+09:00","author":"뉴시스","description":"[서울=뉴시스]정지연 인턴 기자 = 출근 시간대 지하철에 서울시 공공자전거를 그대로 싣고 탄 승객의 모습이 공개돼 눈길을 끌었다. 평일에는 접이식 자전거를 제외한 일반 자전거의 지하철 휴대 탑승이 제한되는 만큼 이를 두고 부적절한 이용이라는 지적이 나왔다. 6일 소셜미디어(SNS) 스레드에는 지하철 객실 한가운데 자전가 한 대가 세워져 있는 사진이 올라왔다. 게시글 작성자는 \"출근 시간에 지하철 한가운데 따릉이를 세워두고 정작 본인은 저 멀리 임산부석에 앉아 있는 승객이 있다\"며 불편함을 드러냈다. 사진에는 지하철 객실 통로 한가운데 서울시 공공자전거 한 대가 세워져 있다. 자전거를 가져온 승객의 모습은 보이지 않는다. 게시글을 접한 네티즌들은 평일 지하철에 일반 자전거를 가지고 탔다는 점을 지적했다. 이들은 \"평일에는 접이식 자전거 외에는 지하철에 가지고 탈 수 없는 것으로 안다\", \"민원을 넣어야 하는 것 아니냐\", \"평일 출근길에 자전거를 가지고 탔다가 안내 방송을 듣고 결국 내린 경험이 있다\"며 관련 규정을 언급했다. 특히 공공자전거를 이용한 뒤 지하철에 그대로 싣고 탄 행동을 이해하기 어렵다는 반응도 나왔다. 네티즌들은 \"개인 자전거도 아니고 공공자전거인데 이용을 마친 뒤 반납하고 도착지에서 새로 빌리면 될 일\", \"자전거와 지하철 중 하나를 선택하면 될 텐데 굳이 두 가지를 함께 이용한 이유가 궁금하다\"고 했다. 이 밖에도","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014307298"},{"title":"홍콩, 이달 중 CCTV에 AI 안면 인식 기술 도입한다","link":"https://n.news.naver.com/article/009/0005759956","pubDate":"2026-11-06T19:33:00+09:00","author":"매일경제","description":"“실종자 및 용의자 추적 위한 것” 공공기관부터 쇼핑몰까지 확산 생성 데이터는 최대 180일 보관홍콩이 이달부터 CCTV를 활용한 스마트 감시 네트워크 전반에 인공지능(AI) 기반..","category":"생활","naverLink":"https://n.news.naver.com/article/009/0005759956"},{"title":"[올댓차이나] 홍콩 증시, 美·아시아 증시 약세에 동반 하락 마감 … H주 1.14%↓","link":"https://n.news.naver.com/article/003/0014307035","pubDate":"2026-11-06T18:47:52+09:00","author":"뉴시스","description":"[서울=뉴시스]이재준 기자 = 홍콩 증시는 6일 미국 반도체주 급락과 한국, 일본 증시 대폭 하락한 여파로 매도세가 선행하면서 반락 마감했다. 미국 중간선거 이후 인공지능(AI) 인프라 투자가 위축된다는 우려가 확산하면서 투자심리가 악화했다. 주말을 맞아 포지션 조정 매물과 차익 실현 매도도 출회했다. 항셍지수는 이날 전일 대비 315.12 포인트, 1.27% 내려간 2만4481.86으로 폐장했다. 6거래일 만에 하락했다. 홍콩 증시 상장 중국기업주 중심의 H주 지수는 전일보다 94.98 포인트, 1.14% 떨어진 8274.19으로 장을 끝냈다. 기술주로 이뤄진 항셍과기 지수는 전일에 비해 76.06 포인트, 1.83% 하락한 4078.23으로 거래를 마쳤다. 반도체주와 비철금속 관련주가 약세를 면치 못했다. 은행주와 운송주, 공공서비스주는 매도에 밀렸다. 특별 배당을 실시하는 스포츠 용품주 리닝은 5% 이상 치솟고 석유 관련주와 전력주는 견조한 모습을 보였다. 광통신 장비주 캠브리지 과기가 12.67%, 광섬유주 창페이 11.24%, 인공지능(AI) 대장주 즈푸 10.42%, 상장 이후 최저가로 떨어진 광통신 부품주 중지쉬촹 9.94%, 인쇄회로 기판주 성훙과기 8.98%, 기판주 젠타오 적층판 8.63%, 저장장치주 장보룽 8.55%, 반도체 설계주 비런과기 7.93%, 반도체주 중신국제 4.55%, 전자부품주 둥산정밀 3.25%","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014307035"},{"title":"서귀포 중문동 마트 기계실서 불…인명 피해 없어","link":"https://n.news.naver.com/article/003/0014306942","pubDate":"2026-11-06T17:48:05+09:00","author":"뉴시스","description":"[서귀포=뉴시스] 우장호 기자 = 6일 오후 4시18분께 제주 서귀포시 중문동의 한 마트 기계실에서 불이 났다. 신고를 받고 출동한 소방당국은 인력과 장비를 투입해 화재 발생 17분 만인 오후 4시35분께 불을 완전히 껐다. 화재 당시 현장에서는 검은 연기가 분출됐으나, 불이 난 기계실이 마트 본동과 분리된 별개 건물에 위치해 이용객 대피 등의 소동이나 인명 피해는 발생하지 않았다. 소방당국은 송풍기를 이용한 배연 작업을 마치는 대로 정확한 화재 원인과 재산 피해 규모를 조사할 예정이다. ◎공감언론 뉴시스 woo1223@newsis.com","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014306942"},{"title":"李사건 조작기소 여부 수사 특검을 李가 임명?…과거 특검 어땠나","link":"https://n.news.naver.com/article/003/0014306898","pubDate":"2026-11-06T17:41:46+09:00","author":"뉴시스","description":"[서울=뉴시스]권지원 기자 = '조작기소 특검법안'이 국회 본회의 문턱을 통과하면서 이재명 정부 7번째 특검이 출범하게 됐다. 특검 추천 방식의 중립성 논란부터 파견검사 수사권 문제까지 위헌 소지가 산적해 있다는 지적이 여전하다. 국회는 6일 오후 본회의를 열고 무제한 토론(필리버스터) 종결 표결을 거쳐 '윤석열 정권 검찰청, 국가정보원, 감사원 등 국가기관의 조작수사·조작기소 등 의혹 진상규명을 위한 특별검사 임명 등에 관한 법률안'(조작기소 특검법안)을 의결했다. 특검의 수사 대상에는 ▲대장동·위례신도시·백현동 개발 관련 배임 ▲대장동·백현동 관련 공직선거법 위반 ▲김진성 씨 위증교사 ▲쌍방울 대북송금 ▲성남FC 후원금 관련 제3자 뇌물 ▲법인카드 유용 의혹 등 현 대통령 관련 사건에 대한 검찰의 수사·기소가 포함됐다. 이재명 대통령 사건과 함께 문재인 전 정부 당시 제기된 ▲통계 조작 의혹 ▲서해 공무원 피격 및 탈북 어민 강제북송 사건 ▲문 전 대통령 전 사위 특혜 채용 관련 뇌물수수 의혹 ▲사드(THAAD·고고도미사일방어체계) 배치 관련 군사기밀 유출 의혹 ▲월성원전 1호기 경제성 조작 의혹 등도 수사 대상에 명시됐다. 특검팀은 특별검사보 8명, 파견검사 20명, 파견공무원 210명 등 총 309명 규모로 구성된다. 법안 공포 후 특검 추천과 임명 절차가 이어질 예정이다. 특검 후보는 교섭단체인 더불어민주당과 국민의힘, 비교","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014306898"},{"title":"올겨울 최강 엘니뇨 온다…“패딩보다 우산” 기온 높고 눈·비 자주 내려","link":"https://n.news.naver.com/article/030/0003483027","pubDate":"2026-11-06T14:03:54+09:00","author":"전자신문","description":"올겨울 한반도에 평년보다 따뜻하고 비가 많이 내리는 날씨가 나타날 가능성이 커지고 있다. 적도 태평양 해수면 온도가 이례적으로 높아지는 강력한 엘니뇨가 발달하면서 기상 변화에 대한 우려도 커지고 있다. 6일 연합뉴스에 따르면 최근 적도 태평양의 해수면 온도는 평년보다 크게 높아진 상태다. 지난달 11일부터 17일까지 해수면 온도 편차는 섭씨 3.3도에 달했으며, 10월 평균 편차도 2.6도를 기록했다. 8~10월 석 달 평균 편차는 2.4도로","category":"생활","naverLink":"https://n.news.naver.com/article/030/0003483027"},{"title":"반도체 넘어 양자·합성생물학으로…한-네덜란드 과기협력 넓힌다","link":"https://n.news.naver.com/article/003/0014306267","pubDate":"2026-11-06T14:00:00+09:00","author":"뉴시스","description":"[서울=뉴시스]윤현성 기자 = 한국과 네덜란드가 반도체 중심의 과학기술 협력을 양자와 합성생물학 등 첨단 분야로 확대한다. 양국 연구지원기관은 공동연구 신규 과제를 추진하고, 연구안보와 인공지능(AI) 안전 분야에서도 협력을 강화하기로 했다. 과학기술정보통신부는 6일 세종 과기정통부에서 네덜란드 교육문화과학부(OCW)와 '제1차 한-네덜란드 과학기술공동위원회'를 개최했다고 밝혔다. 이번 회의는 양국이 2024년 3월 네덜란드 헤이그에서 체결한 '한-네덜란드 연구 및 과학 협력 양해각서'의 후속 조치다. 양국 간 공식적인 과학기술 협력 채널을 본격적으로 가동한 첫 회의다. 한국에서는 황성훈 과기정통부 국제협력관을 수석대표로 과기정통부와 한국연구재단(NRF), 한국생명공학연구원(KRIBB), 인공지능안전연구소(AISI) 관계자들이 참석했다. 네덜란드에서는 수산느 카르스 교육문화과학부 유럽 국제협력 국장을 비롯해 교육문화과학부와 네덜란드 연구위원회(NWO), 에인트호번 공과대학교, 주한네덜란드대사관 등이 참여했다. 양국은 각자의 연구개발(R&D) 투자 방향과 주요 과학기술 정책을 공유하고 글로벌 연구안보, AI 안전 정책, 연구성과 사업화 등 주요 현안과 협력 방안을 논의했다. 연구안보 분야에서는 국제 연구협력을 확대하는 동시에 연구생태계의 건전성을 보호할 수 있는 정책과 제도적 대응 방안을 논의했다. 양측은 연구안보 관련 주요 정책 동향","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014306267"},{"title":"개신교·천주교·불교·유교, 낙태약·차별금지법 반대 연대","link":"https://n.news.naver.com/article/003/0014305461","pubDate":"2026-11-06T09:52:45+09:00","author":"뉴시스","description":"[서울=뉴시스]이수지 기자 = 종교계가 시민단체들과 함께 낙태약 합법화와 포괄적 차별금지법 제정 반대 운동에 나선다. 6일 거룩한방파제 통합국민대회에 따르면 낙태약 합법화와 포괄적 차별금지법 제정에 반대하는 종교계와 시민사회가 오는 13일 서울 청와대 앞에서 약 3000명 규모의 통합국민대회를 개최한다. 이번 대회는 지난 8월 21일 국회 본관 앞에서 열린 국민대회에 이어 정부와 국회에 관련 정책과 입법 추진 재검토를 촉구하기 위해 마련됐다. 특히 이번 대회는 기존 개신교계를 중심으로 진행되던 집회에 천주교, 불교 인사들이 함께 참여하고 유교계 대표도 발언에 나서는 등 종교계를 아우르는 공동 대응이 강화된다. 주최 측 관계자는 \"각 종교가 신학적·윤리적 입장이 모두 같지는 않지만, 생명의 존엄성과 신앙·양심의 자유 등 공동으로 중요하게 여기는 사회적 가치를 위해 연대한다는 취지\"라고 설명했다. 이번 국민대회의 핵심 의제는 약물에 의한 인공임신중절 의약품(낙태약) 도입 문제로, 헌법재판소의 낙태죄 헌법불합치 결정 이후 충분한 법률 정비가 이뤄지지 않은 상황에서의 도입은 부적절하다는 입장이다. 포괄적 차별금지법 제정에 대해서도 우려의 목소리를 높였다. 인간 존엄성과 부당한 차별 금지 원칙은 존중하면서도, 해당 법안이 헌법상 보장된 신앙·양심·표현의 자유와 종교기관 자율성 충돌 가능성이 있다는 것이다. 이번 대회는 13일 오후 12시 30","category":"생활","naverLink":"https://n.news.naver.com/article/003/0014305461"}],"문화":[{"title":"\"집무실서 생방송도 생각 중\"…'대통령의 Y' 첫 선","link":"https://n.news.naver.com/article/055/0001401277","pubDate":"2026-11-06T21:57:59+09:00","author":"SBS","description":"이재명 대통령이 국민과의 새로운 소통 창구로 마련한 유튜브 방송, '대통령의 Y'가 어젯밤 첫 선을 보였습니다. 어떤 내용이 담겼는지, 영상으로 먼저 보시겠습니다.[이재명 대통령 : 제가 삶을 살아오면서 수없이 많은 공격을 당했는데 그럴 때 제가 국민들과 직접 소통을 안 했으면 아마 저는 지금 이 자리에 없을 것입니다.","category":"문화","naverLink":"https://n.news.naver.com/article/055/0001401277"},{"title":"7㎝ 조각에 깃든 낯선 생명…권순영·함진 2인전 '미물'","link":"https://n.news.naver.com/article/003/0014306867","pubDate":"2026-11-06T17:26:09+09:00","author":"뉴시스","description":"[서울=뉴시스] 박현주 미술전문 기자 = 높이 7㎝의 작은 조각. 가느다란 다리 위로 나무줄기인지 사람의 몸인지 알 수 없는 형상이 솟아 있다. 뾰족한 꼭대기에는 둥근 구슬이 얹혀 있다. 인간과 식물, 동물의 형상이 뒤엉킨 기묘한 생명체다. 작가 함진이 폴리머클레이와 알루미늄 철사로 만든 '사람들 54. 선물 2'(2026)다. 손바닥에 들어올 만큼 작지만 그 안에는 현실에서 볼 수 없는 생명체가 살아 숨 쉬는 듯하다. 서울 종로구 서촌 드로잉룸에서 권순영과 함진의 2인전 '미물(Small Things)'이 6일 개막했다. 조각가 이정배가 기획한 이번 전시는 두 작가가 현실에 존재하는 대상을 그대로 재현하는 대신, 각자의 방식으로 새로운 세계를 만들어낸다는 공통점에서 출발한다. 함진은 어린 시절 이끼를 들여다보던 기억을 바탕으로 작은 조각들을 제작한다. 손끝으로 재료를 만지고 결합하며 인간과 동물, 식물, 사물의 특징이 뒤섞인 낯선 존재들을 탄생시킨다. 권순영은 작은 화면에 수많은 형상을 촘촘하게 그려 넣는다. 검은 밤하늘 아래 초록색 무늬로 둘러싸인 공간에는 나무와 동물, 정체를 알 수 없는 형상들이 모여 있다. 그 위로는 초승달과 작은 인물이 떠 있고, 화면 바깥에는 황량한 대지가 펼쳐진다. 현실에서는 함께 존재하기 어려운 장면들이 하나의 화면에서 만난다. 유년의 기억과 감정, 상상과 욕망이 뒤섞여 낯선 풍경을 이룬다. 두 작가의","category":"문화","naverLink":"https://n.news.naver.com/article/003/0014306867"},{"title":"배경훈 \"글로벌 AI 투자 불안에도 韓 투자 늦춰선 안 돼\"","link":"https://n.news.naver.com/article/003/0014306769","pubDate":"2026-11-06T16:38:39+09:00","author":"뉴시스","description":"[서울=뉴시스]심지혜 기자 = 배경훈 부총리 겸 과학기술정보통신부 장관이 미국의 인공지능(AI) 데이터센터 규제 움직임과 시장 불안에도 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 확대에 제동이 걸리더라도 글로벌 빅테크의 AI 투자는 지속되고, 다른 국가에는 새로운 기회가 될 수 있다는 판단이다. 배 부총리는 6일 국가AI전략위원회 전체회의 이후 기자들과 만나 최근 미국의 AI 데이터센터 규제 움직임과 국내 투자 위축 우려에 대해 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦추면 안 된다고 생각한다\"고 말했다. 그는 \"AI 속도 조절론에 대한 이야기도 있었지만 결국 빅테크들은 인공지능을 통해 새로운 산업과 문화를 계속 만들어 가려고 할 것이기 때문에 투자를 계속할 것\"이라고 전망했다. 미국의 투자 환경 변화가 다른 국가에는 기회가 될 수 있다는 점도 강조했다. 배 부총리는 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"고 언급했다. 이어 \"AI는 기대 심리가 너무 크다 보니 조금의 불안한 상황만 만들어져도 시장이 출렁   window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="문화"&&/전시|공연|콘서트|영화|드라마|배우|가수|앨범|음악|미술|박물관|미술관|축제|출판|책|작가|문학|문화재|유네스코|한지|공예|연극|뮤지컬|예술|문화/.test(t)) score+=5;
  if(category==="생활"&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
