05351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:02:22.965709+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 AI 데이터센터 투자 위축 우려가 커지자 배경훈 부총리는 한국의 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 정책 변화가 오히려 다른 국가에는 기회가 될 수 있다는 판단으로, 국내 투자와 초거대 AI 개발을 계속 추진하겠다는 취지다.","category":"IT 과학"},{"title":"\"전력망 비용 다 내겠다\"는 오픈AI… 국내 AI 데이터센터는 고객 확보 관건","link":"https://n.news.naver.com/mnews/article/469/0000964112","naverLink":"https://n.news.naver.com/mnews/article/469/0000964112","pubDate":"2026-11-07T00:02:22.965706+09:00","author":"네이버뉴스","description":"오픈AI는 자체 AI 데이터센터의 전기요금과 전력 인프라 비용을 직접 부담하겠다고 밝혔다. 데이터센터 건설에 따른 지역 주민의 비용 부담과 정보 비공개 관행을 줄이겠다는 취지지만, 국내에서는 계획된 데이터센터 규모에 비해 실제 고객 수요가 충분한지가 과제로 꼽힌다.","category":"IT 과학"},{"title":"AI모델 구독 않고 골라쓰는 시대 열렸다","link":"https://n.news.naver.com/mnews/article/015/0005351238","naverLink":"https://n.news.naver.com/mnews/article/015/0005351238","pubDate":"2026-11-07T00:02:22.965704+09:00","author":"네이버뉴스","description":"KT의 기업용 플랫폼 토큰팩토리는 GPT와 클로드 등을 포함한 73개 AI 모델을 제공하고, 사용량에 따라 요금을 매기는 방식으로 출발했다. 여러 서비스를 월정액으로 구독하는 대신 작업에 맞는 모델을 골라 쓴 만큼 결제하는 방식이며, 향후 제공 모델을 500개 이상으로 늘릴 계획이다.","category":"IT 과학"},{"title":"엔비디아, 네이버에 1.34조 납입…3대 주주로 'AI 동맹' 본격화","link":"https://n.news.naver.com/mnews/article/018/0006405323","naverLink":"https://n.news.naver.com/mnews/article/018/0006405323","pubDate":"2026-11-07T00:02:22.965698+09:00","author":"네이버뉴스","description":"엔비디아가 네이버의 유상증자 대금 약 1조3412억원을 납입해 네이버 지분 약 4.13%를 확보했다. 네이버는 브룩필드와 엔비디아의 협력을 바탕으로 GPU 인프라를 구축하고, 2027년부터 AI 데이터센터 사업을 단계적으로 확대할 계획이다.","category":"IT 과학"},{"title":"美민주 'AI 중단' 압박에 증시 패닉셀","link":"https://n.news.naver.com/mnews/article/009/0005760237","naverLink":"https://n.news.naver.com/mnews/article/009/0005760237","pubDate":"2026-11-07T00:02:22.965693+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 승리한 뒤 일부 정치인과 주정부 인사들이 AI 데이터센터 건설 중단과 규제 강화를 요구하면서 시장에 충격이 번졌다. 데이터센터 투자 위축 우려로 미국 반도체주와 한국 증시도 큰 폭으로 하락했고, 정부는 시장 변동성에 대응하기 위한 조치를 내놨다.","catego 6-11-06T22:27:37+09:00","author":"뉴시스","description":"[몸바사(케냐)=AP/뉴시스] 김재영 기자 = 동아프리카 케냐의 '종말의 날' 사교 지도자가 6일 191명를 살해한 죄로 징역 200년 선고를 받았다. 이 사람은 400명이 넘는 신도들의 '아사' 죽음과 연루되었다. 이날 몸바사 고등법원은 목사 폴 맥켄지에게 '예수를 만나기 위해 스스로 굶어죽어야 한다고 신도들에게 명령해 결국 190명의 어린이와 1명의 어른을 살해했다'면서 이같이 선고했다. 판사는 '굿뉴스 인터내셔널 교회' 우두머리인 맥켄지가 '따르던 신도들을 궁벽한 오지로 이사하도록 한 뒤 단식으로 죽음에 이르도록 명령'한 범죄의 주범이라고 지적했다. 검찰은 맥켄지와 추종자 28명을 살인 혐의로 기소했다. 피고인 중에는 맥켄지의 단식 명령을 집행한 경비원들 그리고 죽은 사람들을 비밀리에 공동 매장한 사람들이 들어 있다. 피고인들은 한 명만 빼고 모두 혐의를 부인했다. 법원은 10월 19일 피고인 29명 전원이 191명을 살해한 혐의에서 유죄라고 판결했고 이날 형량을 선고했다. 2023년 맥켄지 추종자들이 다른 마을에서 멀리 떨어져 진흙 오두막을 짓고 살고 있던 800에이커 면적의 농장에서 400여 구의 시신이 발굴되었다. ◎공감언론 뉴시스 kjy@newsis.com","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014307376"}],"사회":[],"생활 문화":[{"title":"뉴욕증시, 'AI 쇼크' 하루 만에 반등 시도…저가 매수에 나스닥 1.2%↑","link":"https://n.news.naver.com/article/003/0014307395","pubDate":"2026-11-06T23:42:16+09:00","author":"뉴시스","description":"[서울=뉴시스]박미선 기자 = 미국 뉴욕증시가 전날 급락 이후 반도체주를 중심으로 저가 매수세가 유입되면서 6일(현지 시간) 혼조세를 보이고 있다. 나스닥지수는 1% 넘게 반등했지만, 예상보다 강한 고용지표에 국채금리가 상승하면서 증시 상승 폭은 제한됐다. CNBC에 따르면 이날 나스닥종합지수는 1.2%, S&P500지수는 0.3% 각각 상승하며 거래를 시작했다. 반면 다우존스30산업평균지수는 0.9% 하락하며 엇갈린 흐름을 보였다. 전날 급락했던 인공지능(AI) 관련주와 반도체주가 반등을 주도했다. 전날 22% 폭락했던 샌디스크는 8% 상승했고, 17% 급락했던 마이크론테크놀로지는 6% 올랐다. 9% 떨어졌던 엔비디아도 5% 상승했다. 뉴욕증시는 전날 민주당의 중간선거 압승에 따른 데이터센터 건설 규제 강화 우려로 2025년 4월 이후 최대 낙폭을 기록했다. 나스닥지수는 5.5% 급락하며 최근 고점 대비 10% 이상 하락해 조정 국면에 진입했다. S&P500지수는 4.4%, 다우지수는 3.4% 각각 떨어졌다. 특히 AI 투자 확대를 주도해온 대형 기술주에 매도세가 집중되면서 '매그니피센트 세븐(M7)'의 시가총액은 하루 만에 총 1조 달러 증발했다. 민주당은 선거 승리 이후 데이터센터 건설 제한을 추진하고 있다. 미국의 주요 데이터센터 거점인 텍사스주의 지나 이노호사 주지사 당선인은 전날 CNN 인터뷰에서 \"주민 보호 장치가 마련될","category":"생활 문화","naverLink":"https://n.news.naver.com/article/003/0014307395"},{"title":"데이터센터 전력 불안 원인 찾아낸 켄텍 학부생들…한전 발명기술혁신대전 동상","link":"https://n.news.naver.com/article/009/0005760046","pubDate":"2026-11-06T23:31:41+09:00","author":"매일경제","description":"GPU 작업별 전력망 영향 추적 기술 전력 사용 조절 방안·효과까지 예측한국에너지공과대학교(KENTECH) 학부생들이 인공지능(AI) 데이터센터에서 발생하는 전력 사용량 변화가 전..","category":"생활 문화","naverLink":"https://n.news.naver.com/article/009/0005760046"},{"title":"\"역대 최고 제품\"이라더니…테슬라, '사이버트럭' 접고 '자율주행' 올인","link":"https://n.news.naver.com/article/003/0014307393","pubDate":"2026-11-06T23:21:04+09:00","author":"뉴시스","description":"[서울=뉴시스]박미선 기자 = 미국 전기차 업체 테슬라가 판매 부진에 시달려온 전기 픽업트럭 '사이버트럭'의 생산을 내년부터 단계적으로 중단한다. 대신 완전자율주행 차량 '사이버캡' 생산을 확대하며 자율주행과 로봇 사업 중심으로 전환에 속도를 낼 방침이다. 6일(현지 시간) 월스트리트저널(WSJ)에 따르면 일론 머스크 테슬라 최고경영자(CEO)는 이날 소셜미디어 엑스(X)를 통해 텍사스주 기가팩토리에서 사이버트럭 생산을 단계적으로 중단할 계획이라고 밝혔다. 머스크는 이번 결정이 사이버캡 생산 확대를 위한 공간을 확보하기 위한 조치라고 설명했다. 이는 기존 전기차 판매보다 완전자율주행차와 로봇 기술에 집중하려는 테슬라의 전략을 보여준다. 사이버트럭은 출시 초기 큰 관심을 끌었지만 이후 판매 부진에 시달려왔다. 자동차 시장조사업체 모터인텔리전스에 따르면 지난 10월 미국에서 등록된 사이버트럭은 1914대에 그쳤다. 반면 같은 기간 포드의 F시리즈 픽업트럭 판매량은 7만대를 넘었다. 머스크는 2019년 사이버트럭 시제품을 처음 공개하면서 포드의 인기 픽업트럭 F-150보다 우수한 차량이라고 자신했다. 투자자들에게는 테슬라의 \"역대 최고 제품\"이 될 것이라고 강조하기도 했다. 사이버트럭은 4년간의 개발 끝에 2023년 말 출시됐다. 당시 머스크는 사전 예약이 100만건을 넘었다고 주장했지만, 실제 판매량은 기대에 미치지 못했다. 잇따른 리콜","category":"생활 문화","naverLink":"https://n.news.naver.com/article/003/0014307393"},{"title":"남아공 ANC, 총선 이어 지방선거에서도 지지 하락세","link":"https://n.news.naver.com/article/003/0014307353","pubDate":"2026-11-06T21:36:35+09:00","author":"뉴시스","description":"[요하네스버그(남아공)=AP/뉴시스] 김재영 기자 = 남아공 권력을 독점하다시피 해왔던 아프리카 국민회의(ANC) 당이 이번주 열렸던 지방선거를 통해 일부 주요 도시서 지지세가 급감한 것으로 6일 잠정 개표 결과 드러났다. 전국적으로 개표가 76% 진행된 시점에 ANC는 약 31%를 득표했으나 핵심 도시들인 요하네스버그, 츠와네 및 에테콰이니 등에서 경쟁 정당에 뒤졌다. 직전 지방선거가 열렸던 2021년 투표 때 ANC는 45%를 얻었다. 2024년 총선 때 이 넬슨 만델라 당은 처음으로 다수당 지위를 상실했다. 1994년 첫 민주 선거 이래 유권자 지지 선두를 유지하고는 있으나 계속 하락세에 있다. 현재 ANC는 라이벌인 민주동맹(DA) 및 소규모 정당들과 통합 정부를 구성했으며 여러 지방 단위에서도 연합체로 집권하고 있다. 경쟁이 치열했던 요하네스버그 선거 조기 개표에서 DA가 ANC를 리드했지만 단독 과반이 안 돼 연합체 구성이 필요하다. ◎공감언론 뉴시스 kjy@newsis.com","category":"생활 문화","naverLink":"https://n.news.naver.com/article/003/0014307353"},{"title":"\"나한테 말 거네\" 최우식, 승무원 '갑질' 목격담에 소속사 \"허위사실, 법적 대응\"","link":"https://n.news.naver.com/article/088/0001038897","pubDate":"2026-11-06T21:10:59+09:00","author":"매일신문","description":"배우 최우식이 최근 온라인에서 확산한 이른바 '기내 태도 논란'에 휩싸인 가운데 소속사가 해당 내용은 사실이 아니라며 법적 대응에 나서겠다고 밝혔다. 최근 소셜미디어 스레드에는 자신을 승무원이라고 밝힌 한 누리꾼이 비행기 안에서 최우식을 응대했다며 그의 태도를 문제 삼는 내용의 글을 올렸다. 작성자는 기내식 주문을 받기 위해 말을 걸자 최우식이 곁에 있던 매니저에게 짜증을 냈다는 취지로 주장했다. 사실관계가 확인되지 않은 해당 게시물이 온라인을 중심으로 퍼지자 소속사가 직접 대응에 나섰다. 최우식의 소속사 페이블 컴퍼니는 6일 공식 - 매일신문","category":"생활 문화","naverLink":"https://n.news.naver.com/article/088/0001038897"},{"title":"정부 데이터 칸막이 허물려면…\"예산·인력 지원하고 보안 강화해야\"","link":"https://n.news.naver.com/article/003/0014306814","pubDate":"2026-11-06T17:02:21+09:00","author":"뉴시스","description":"[서울=뉴시스]심지혜 기자 = 정부가 부처와 공공기관에 흩어진 데이터를 연결해 인공지능(AI) 활용을 확대하려는 범정부 데이터 공유체계가 실효성을 갖추기 위해서는 예산·인력 지원 등 제도적 뒷받침이 필요하다는 지적이 나왔다. 부처별 데이터 공유를 활성화하기 위한 인센티브와 데이터 제공에 따른 책임 문제 해결은 물론, 사이버보안 대책도 함께 강화해야 한다는 제언이 이어졌다. 국가인공지능전략위원회는 6일 하정우 상근 부위원장 주재로 제3차 전체회의를 열고 '범정부 데이터 파이프라인 구축 현황 및 활용 방안'을 심의·의결했다. ◆ 848개 기관 데이터 연결…부처 간 공유 활성화가 관건 범정부 데이터 파이프라인은 정부부처와 지방정부, 공공기관이 보유한 데이터를 기관 간 칸막이 없이 공유하고 업무에 활용할 수 있도록 지원하는 체계다. 지난 9월부터 시범운영에 들어갔으며 현재 848개 기관을 대상으로 서비스하고 있다. 10월 기준 공유데이터 5만4768건, 메타데이터 244만2269건이 등록됐다. 정부는 AI 기반 검색 기능을 통해 필요한 데이터를 찾고, 공유되지 않은 데이터도 보유기관에 제공을 요청할 수 있도록 했다. 앞으로 복지, 청년·고용, 지역소멸, 재난·안전 등 여러 부처가 공동 대응해야 하는 현안을 중심으로 데이터를 연계·결합해 활용할 계획이다. 이날 회의에서는 데이터 공유 방식과 부처별 참여를 활성화하기 위한 구체적인 방안도 논의됐","category":"생활 문화","naverLink":"https://n.news.naver.com/article/003/0014306814"},{"title":"경찰, '삼성바이오 노조원 업무방해' 재수사 착수","link":"https://n.news.naver.com/article/003/0014306639","pubDate":"2026-11-06T16:10:24+09:00","author":"뉴시스","description":"[서울=뉴시스]황재희 기자 = 삼성바이오로직스 상생노동조합(노조) 1차 파업 당시 생산 현장 출입 문제로 업무방해 고소를 당한 조합원 사건이 경찰 단계로 되돌아갔다. 경찰이 한 차례 불송치로 마무리했던 사건을 공소청이 다시 들여다보라고 요구하면서다. 6일 관련 업계에 따르면, 인천 연수경찰서는 삼성바이오로직스 상생노동조합 조합원 A씨의 업무방해 혐의 사건을 재수사하고 있는 것으로 알려졌다. 공소청이 지난달 21일 연수경찰서에 재수사를 요구한 데 따른 것이다. 경찰이 증거 불충분을 들어 이 사건을 불송치한 건 지난달 1일이다. 결정이 나온 지 20일 만에 공소청이 제동을 건 셈이다. 사건이 재수사 단계로 넘어가면서 혐의를 둘러싼 노사 간 법적 다툼은 한동안 계속될 것으로 보인다. 삼성바이오로직스가 A씨를 고소한 건 올해 5월 1차 파업 당시다. 품질(Quality) 업무를 맡지 않은 A씨가 생산 현장에 들어가 공정을 지켜보는 등 조업을 방해했다는 게 요지다. 회사가 문제 삼는 대목은 권한이다. 자기 부서도 아닌 공정 구역에 업무상 권한 없이 들어가 마음대로 감시를 벌였고, 이로 인해 현장 업무가 제대로 돌아가지 못했다는 판단이다. 회사는 이를 통상적인 쟁의 활동으로 볼 수 없다는 입장이다. 직무 권한을 벗어난 행위로, 시설 관리권을 침해하고 생산 운영에 차질을 빚었다는 것이다. 파업 자체는 법이 보장하는 권리라 하더라도 그 과정의 개별","category":"생활 문화","naverLink":"https://n.news.naver.com/article/003/0014306639"}],"세계":[],"IT 과학":[]},"popular":[]}}}; // UPDATED_AUTOMATICALLY_BY_NEWS_WORKFLOW

function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}
$("#today").textContent=compactDate(seoulDateKey(new Date()));
function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(!showPopular&&category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-popular="1" class="'+(showPopular?'active':'')+'">네이버 인기</button><button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
function drawDateTabs(){
 const days=window.dailyDays||[];
 const today=days[0],yesterday=days[1];
 const options=[{key:"today",label:today?"오늘 · "+compactDate(today.date):"오늘"},{key:"yesterday",label:yesterday?compactDate(yesterday.date):"어제"},{key:"all",label:"전체 날짜"}];
 $("#date-tabs").innerHTML=options.map(o=>'<button type="button" data-day="'+o.key+'" class="'+(dayFilter===o.key?'active':'')+'">'+esc(o.label)+'</button>').join('');
}
async function load(){
  const todayKey=seoulDateKey(new Date());
  window.dailyLoading=false;
  const data=window.NEWS_DATA;
  if(!data||!data.days||!data.days.today){
    $("#count").textContent="오늘 뉴스 데이터 준비 중";
    $("#feed").innerHTML='<div class="empty">오늘 뉴스 데이터를 준비하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  if(data.date!==todayKey||data.days.today.date!==todayKey){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오늘 기사 데이터를 갱신하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday].filter(Boolean);
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const when=x.pubDate?new Date(x.pubDate):null;
  const dateText=when&&!Number.isNaN(when.getTime())?(()=>{const p=new Intl.DateTimeFormat("ko-KR",{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(when);const g=k=>p.find(v=>v.type===k)?.value||"";return g("month")+"/"+g("day")+" ("+g("weekday")+") "+g("hour")+":"+g("minute")})():"";
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const author=esc(x.author||"뉴스");
  const categoryLabel=esc(x.category||"");
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">제목을 반복하지 않도록 요약을 생략했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><div class="storytop"><span class="source">'+author+'</span><span>'+dateText+'</span></div><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'<div class="storybottom"><span>'+categoryLabel+'</span><button class="save" type="button" data-save="'+i+'" aria-label="기사 저장">☆</button></div></article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활 문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?allDays[0]?.date:allDays[1]?.date));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===window.NEWS_DATA.date?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
