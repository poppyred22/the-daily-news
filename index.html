"description":"中, 10개월 만에 신용거래 증거금 인하…기술주 시총 2289조원 증발. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"TAIWAN ENTERTAINMENT","link":"https://n.news.naver.com/mnews/article/091/0010375623","naverLink":"https://n.news.naver.com/mnews/article/091/0010375623","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"TAIWAN ENTERTAINMENT. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"中 기술주, 시총 2300조원 증발\"… 당국, 신용거래 규제 완화","link":"https://n.news.naver.com/mnews/article/469/0000967089","naverLink":"https://n.news.naver.com/mnews/article/469/0000967089","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"창업판 올해 들어 31% 하락 항셍테크는 2년 만에 최저 기록 30일부터 융자 증거금률 100%→80% 중국 상하이 루자쭈이 금융지구에서 3월 2일 보행자들이 육교를 건너는 가운데 전광판에 상하이 증시 지수가 표시돼 있다. 상하이=로이터 연합뉴스 중국 본토와 홍콩의 주요 기술주 지수 세 곳에 편입된 종목들의 시가총액이 6월 말 이후 1조7,000억 달러(약 2,290조 원) 줄었다는 집계가 나왔다. 중국 당국은 증시 안정을 위해 올해 1월 높였던 주식 신용거래 문턱을 10개월 만에 다시 낮추기로 했다. 블룸버그통신은 22일(현지시간) 6월 30일 종가와 비교해 선전거래소의 기술·성장주 시장을 대표하는 창업판 지수가 49.1%, 반도체 기업 비중이 큰 상하이 과창판50 지수는 44.2% 떨어졌다며 이같이 보도했다. 알리바바와 텐센트 등 홍콩에 상장된 대형 기술주로 구성된 항셍테크 지수는 2년 만에 최저 수준으로 밀렸다. 올여름 사상 최고치를 찍었던 창업판 지수는 연초와 비교해도 31% 낮다. 상하이종합지수도 앞서 20일 3,533.79로 마감해 종가 기준 지난해 7월 이후 최저치를 기록했다. 지난해 스타트업 딥시크의 등장으로 커졌던 '저비용 중국산 인공지능(AI)'에 대한 기대가 시험대에 올랐다는 게 블룸버그의 분석이다. 앞서 미국 상무부는 16일 중국 기업에 일정 규모 이상의 연산 능력을 제공하는 해외 데이터센터에 첨단 AI 칩을 공급하려면 허가를 받도록 하는 규정을 발표했다. 자산운용사 애버딘 인베스트먼츠의 부시 추 중국 주식 투자 책임자는 블룸버그에 \"AI 관련 설비 투자 둔화, 미중 공급망 사업의 지속가능성 여부 등에 대해 투자자들이 우려하고 있다\"고 말했다. 중국 당국은 증시 부양에 나섰다. 이날 중국중앙TV(CCTV)는 증권감독관리위원회(증감회)를 인용해 상하이·선전·베이징 증권거래소가 오는 30일부터 주식 신용매수에 적용하는 최저 증거금률을 100%에서 80%로 낮춘다고 보도했다. 지금은 증거금 100만 위안을 내면 100만 위안까지 빌릴 수 있지만, 앞으로는 125만 위안까지 빌려 주식을 살 수 있다. 당국은 이론상 4,000억 위안(약 80조6,000억 원)에 가까운 추가 매수 여력이 생길 것으로 추산했다. 상하이·선전거래소는 거래 수수료도 내리기로 했다. 선전거래소는 증권사가 사고파는 가격을 계속 제시해 거래를 돕는 '시장조성자' 제도를 창업판에 도입하기 위한 의견 수렴에도 착수했다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-21","weekday":"토요일","label":"보관 · 11월 21일 토요일","total":50,"categories":{"사건 사고":[{"title":"서산 상가 중식당서 가스폭발 추정 화재…60대 부부 화상·48분 만에 진화","link":"https://n.news.naver.com/mnews/article/014/0005607680","naverLink":"https://n.news.naver.com/mnews/article/014/0005607680","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"21일 오전 10시 45분께 충남 서산 동문동의 한 상가건물에서 불이 나 2명이 1도 화상을 입고 병원으로 이송됐다. /사진=뉴스1 [파이낸셜뉴스] 충남 서산의 한 아파트 앞 상가 음식점에서 가스 폭발로 추정되는 화재가 발생해 2명이 다쳤다. 21일 경찰과 서산소방서에 따르면 이날 오전 10시 45분쯤 충남 서산시 동문동의 한 아파트 인근 2층 상가건물 1층 중식당에서 폭발과 함께 불이 났다. 인근 아파트 주민의 \"상가 쪽에 불이 났다\"는 신고를 받고 출동한 소방당국은 소방차 등 장비 30여 대와 인력 60여 명을 투입해 48분 만인 오전 11시 33분쯤 불을 모두 껐다. 이 사고로 중식당을 운영하는 60대 부부가 얼굴과 팔 등에 1도 화상 등 경상을 입고 인근 병원으로 이송됐다. 또 음식점 1층 전체 면적 746.94㎡ 가운데 130㎡와 내부 집기류 등이 부서지고 타 소방서 추산 9658만1000원의 재산피해가 났다. 화재 직후 서산시는 오전 10시 58분쯤 재난문자를 발송해 \"가스폭발 화재에 따라 차량은 주변 도로를 우회하고 인근 주민은 대피해 달라\"고 안내했다. 경찰과 소방당국은 폭발음이 들렸다는 신고 등을 토대로 가스 폭발 지점과 정확한 화재 원인을 조사하고 있다.","category":"사건 사고"},{"title":"서산 음식점서 화재·폭발로 2명 경상…48분 만에 진화","link":"https://n.news.naver.com/mnews/article/003/0014337540","naverLink":"https://n.news.naver.com/mnews/article/003/0014337540","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"[서산=뉴시스] 21일 오전 10시45분께 충남 서산 동문동의 한 음식점에서 폭발화재가 발생해 벽이 갈라지고 주위에 LPG 탱크 잔해 등이 널부러져 있다. (사진=서산소방서 제공) 2026.11.21. photo@newsis.com *재판매 및 DB 금지 [서산=뉴시스]김덕진 기자 = 21일 오전 10시45분께 충남 서산 동문동의 한 2층 건물 1층 음식점에서 화재·폭발사고가 발생해 48분 만에 진화됐다. 서산소방서에 따르면 인근 아파트 주민이 \"상가 쪽에 불이 났다\"고 신고했다. 소방당국은 소방차 등 30대와 대원 등 65명을 투입해 이날 오전 11시33분께 화재를 진압했다. 이 사고로 2명이 경상을 입어 병원으로 이송됐고 해당 음식점 1층 746.94㎡ 중 130㎡와 내부 집기류 등이 부서지고 탔다. 소방당국은 재산피해를 9658만1000원으로 추산했다. 소방당국은 또 불이 건물 안 쪽에서 시작돼 바깥 LPG 탱크로 옮겨 붙으면서 폭발이 발생한 것으로 보고 정확한 사고 원인을 조사 중이다．","category":"사건 사고"},{"title":"홍대입구역서 3중 추돌로 시내버스 인도 돌진…승객 6명 경상","link":"https://n.news.naver.com/mnews/article/014/0005607679","naverLink":"https://n.news.naver.com/mnews/article/014/0005607679","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"21일 오후 서울 마포구 홍대역 인근에서 인도로 돌진한 버스가 멈춰 서 있다. /사진=뉴스1 [파이낸셜뉴스] 주말 저녁 서울 마포구 홍대입구역 인근에서 3중 추돌사고 여파로 시내버스가 인도로 돌진해 승객 6명이 다치는 사고가 발생했다. 21일 경찰과 소방당국에 따르면 이날 저녁 6시 57분쯤 서울 마포구 동교동 홍대입구역 1번 출구 인근에서 시내버스 2대와 승용차 1대가 잇따라 부딪히는 3중 추돌사고가 일어났다. 이 충격으로 버스 1대가 인도로 올라가 구조물을 들이받았다. 이 사고로 버스 승객 6명이 경상을 입고 인근 병원으로 이송됐다. 다행히 중상자나 사망자는 발생하지 않았으며 인도 위 보행자 피해도 없는 것으로 파악됐다. 현장을 목격한 이모 씨는 \"사고 후 지나가다 보니 버스 앞유리가 다 깨져 있었고, 조형물도 들이받은 상태였다\"고 전했다. 경찰이 사고 운전자를 상대로 음주 측정을 실시한 결과 음주 사실은 확인되지 않았으며 현재까지 약물 복용 정황도 없는 것으로 파악됐다. 사고 수습 과정에서 홍대입구역 일대에는 한동안 극심한 교통 혼잡이 빚어졌다. 서울경찰청 교통정보센터는 저녁 7시 54분쯤 사회관계망서비스(SNS)를 통해 \"사고 처리로 월드컵북로에서 양화로 방면, 양화로에서 양화대교 방면이 많이 지체되고 있다\"라고 공지했다. 마포구 역시 저녁 8시 5분쯤 안전문자를 발송해 해당 구간 우회와 안전운전을 당부했다. 경찰과 소방당국은 정확한 사고 경위를 조사하고 있다.","category":"사건 사고"},{"title":"홍대입구역 인근서 버스·승용차 3중 추돌…6명 병원 이송(종합)","link":"https://n.news.naver.com/mnews/article/003/0014337538","naverLink":"https://n.news.naver.com/mnews/article/003/0014337538","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"보행자 부상 없어 [서울=뉴시스] 21일 오후 서울 마포구 홍대입구역 인근에서 버스 2대와 승용차 1대가 충돌하는 3중 추돌 사고가 발생했다. 이 사고로 6명이 병원으로 이송됐다. (사진=SNS 캡처) 2026.11.21. photo@newsis.com [서울=뉴시스] 조성하 기자 = 서울 마포구 홍대입구역 인근에서 차량 3대가 잇따라 충돌해 6명이 병원으로 이송됐다. 21일 경찰과 소방당국에 따르면 이날 오후 6시57분께 마포구 홍대입구역 인근에서 버스 2대와 승용차 1대가 3중 추돌하는 사고가 발생했다. 사고 과정에서 버스 1대가 인도로 올라가 구조물을 들이받았다. 이 사고로 6명이 병원으로 이송됐다. 보행자 부상이나 중상자는 없는 것으로 파악됐다. 경찰 조사 결과 음주와 약물 운전을 의심할 만한 정황은 발견되지 않았다. 경찰과 소방당국은 정확한 사고 경위를 조사 중이다．","category":"사건 사고"},{"title":"평창서 공기총 사격 연습 중 ‘행인 피격’ 사망...60대 입건","link":"https://n.news.naver.com/mnews/article/655/0000033657","naverLink":"https://n.news.naver.com/mnews/article/655/0000033657","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"기사 내용의 이해를 돕기 위한 이미지. 클립아트코리아 제공 강원 평창군에서 공기총을 손질하다 실수로 발사해 행인이 다친 것으로 알려졌던 사고가 경찰 조사 결과 사격 연습 중 발생한 것으로 확인됐습니다. 공기총을 쏜 60대 남성은 영점 조절을 하던 중 인근을 지나던 행인을 맞혔으며 총상을 입고 병원으로 옮겨진 60대 남성은 치료 중 숨졌습니다. 21일 경찰과 소방당국 등에 따르면 이날 오전 11시4분께 평창군 방림면의 한 비닐하우스 인근에서 공기총에 맞은 A(60대)씨가 병원으로 이송됐습니다. A씨는 왼쪽 갈비뼈 부근에 총상을 입고 원주의 한 대형병원으로 옮겨졌습니다. 이송 당시에는 의식이 명료한 상태였으나 치료를 받던 중 끝내 사망했습니다. 당초 사고는 B(60대)씨가 비닐하우스에서 공기총에 가스를 주입하던 중 오발 사고가 난 것으로 전해졌습니다. 그러나 경찰 조사 결과 B씨는 당시 사격 연습을 하고 있었으며 공기총의 영점을 조절하던 중 인근을 지나던 A씨를 발견하지 못하고 총을 발사한 것으로 파악됐습니다. 영점 조절은 조준한 지점과 실제 탄환이 맞는 지점을 일치시키기 위해 총기의 조준 상태를 조정하는 과정입니다. A씨와 B씨는 서로 알지 못하는 사이였던 것으로 전해졌습니다. 경찰은 공기총을 발사한 B씨를 중과실치사 혐의로 입건해 조사하고 있습니다. 총기의 등록 여부와 소지·관리 상태, 사격 당시 주변 안전조치 여부 등도 확인할 방침입니다.","category":"사건 사고"},{"title":"주말 홍대서 시내버스 삼중추돌·인도 돌진…승객 6명 병원 이송(종합)","link":"https://n.news.naver.com/mnews/article/421/0009302912","naverLink":"https://n.news.naver.com/mnews/article/421/0009302912","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"주말 홍대서 시내버스 삼중추돌·인도 돌진…승객 6명 병원 이송(종합). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"홍대입구역서 버스 2대·승용차 '쾅'…인도 돌진에 6명 부상","link":"https://n.news.naver.com/mnews/article/053/0000063246","naverLink":"https://n.news.naver.com/mnews/article/053/0000063246","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"우회전하던 버스가 다른 버스 추돌…경차까지 잇따라 충돌 버스 1대 인도 침범해 구조물 들이받아…승객 등 6명 병원 이송 서울 마포구 홍대입구역 인근 버스·승용차 3중 추돌사고. photo 연합뉴스 서울 마포구 홍대입구역 인근에서 시내버스 2대와 승용차 1대가 잇따라 충돌하는 사고가 발생했다. 사고 충격으로 버스 1대가 인도까지 침범해 구조물을 들이받았으며, 승객 등 6명이 다쳤다. 21일 경찰과 소방당국에 따르면 이날 오후 6시 57분쯤 서울지하철 2호선 홍대입구역 1번 출구 인근 사거리에서 우회전하던 시내버스가 다른 버스를 들이받았다. 충격으로 밀려난 버스는 앞에 있던 경차를 잇따라 추돌했다. 이 과정에서 버스 1대가 인도로 돌진해 도로변 구조물과 충돌했다. 사고 차량 중 버스의 앞유리가 파손되는 등 현장에는 충돌 흔적이 남았다. 이 사고로 버스 승객 등 6명이 경상을 입고 병원으로 이송됐다. 다행히 사망자나 중상자는 없는 것으로 파악됐다. 사고 현장을 지나던 목격자 이모씨는 \"사고가 나고 한참 뒤에 지나가다가 경찰들이 와 있어서 자세히 봤더니 버스 앞유리가 다 깨져 있었고, 조형물도 들이받은 것 같았다\"고 말했다. 사고 여파로 홍대입구역 일대 교통에도 혼잡이 빚어졌다. 마포구는 오후 8시 5분쯤 안전문자를 발송해 \"3중 추돌사고가 발생해 교통이 혼잡하니 해당 구간을 우회하고 안전운전에 유의하길 바란다\"고 안내했다. 경찰과 소방당국은 운전자와 목격자 등을 상대로 정확한 사고 경위를 조사하고 있다. ※주간조선 온라인 기사입니다.","category":"사건 사고"},{"title":"평창서 공기총 사격 연습 중 60대 행인 피격 사망…경찰, 중과실치사 입건","link":"https://n.news.naver.com/mnews/article/014/0005607677","naverLink":"https://n.news.naver.com/mnews/article/014/0005607677","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"21일 오전 평창 방림면 비닐하우스 인근서 사고…갈비뼈 부근 총상 입고 치료 중 숨져 당초 '손질 중 오발' 알려졌으나 조사 결과 영점 조절·사격 연습 중 행인 못 보고 발사 서로 일면식 없는 사이…경찰, 총기 등록 여부 등 조사 후 구속영장 신청 검토 총기사건ㆍ사고 삽화. /사진=연합뉴스 [파이낸셜뉴스] 강원 평창군에서 공기총 사격 연습을 하던 60대 남성이 인근을 지나던 행인을 쏴 숨지게 하는 사고가 발생했다. 21일 경찰과 소방당국에 따르면 이날 오전 11시 4분쯤 평창군 방림면의 한 비닐하우스 인근에서 60대 남성 A씨가 공기총에 맞았다는 신고가 접수됐다. 왼쪽 갈비뼈 부근에 총상을 입은 A씨는 원주의 한 대형병원으로 옮겨졌으며 이송 당시에는 의식이 명료했으나 치료를 받던 중 끝내 숨졌다. 당초 이번 사고는 비닐하우스에서 공기총을 손질하며 가스를 주입하던 60대 B씨가 실수로 총을 발사해 일어난 오발 사고로 알려졌다. 그러나 경찰 조사 결과 B씨는 당시 사격 연습을 하고 있었으며, 조준 지점과 실제 탄환이 맞는 지점을 일치시키는 '영점 조절'을 하던 중 인근을 지나던 A씨를 발견하지 못하고 총을 발사한 것으로 파악됐다. A씨와 B씨는 서로 알지 못하는 사이였던 것으로 전해졌다. 경찰은 B씨를 중과실치사 혐의로 입건해 정확한 사고 경위를 조사하고 있다. 경찰은 총기의 등록 여부와 소지·관리 상태, 사격 당시 주변 안전조치 여부 등을 확인한 뒤 B씨에 대한 구속영장 신청 여부를 검토할 방침이다.","category":"사건 사고"},{"title":"홍대입구역에서 인도로 돌진한 버스…3중 추돌사고로 6명 다쳐","link":"https://n.news.naver.com/mnews/article/009/0005767066","naverLink":"https://n.news.naver.com/mnews/article/009/0005767066","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"홍대입구역 버스·승용차 3중 추돌사고로 인도 돌진 [연합뉴스/ 독자 제공] 서울 마포구 홍대입구역 인근에서 시내버스 2대와 승용차 1대가 잇따라 부딪혔다. 이 사고로 승객 등 6명이 경상을 입고 병원에 이송됐다. 21일 연합뉴스에 따르면 이날 오후 6시57분께 홍대입구역 1번 출구 근처에서 3중 추돌사고가 일어났다. 버스 1대는 인도를 침범해 구조물을 들이받았다. 마포구는 오후 8시 5분께 안전문자를 통해 “3중 추돌사고가 발생해 교통이 혼잡하니 해당 구간을 우회하고 안전운전에 유의하길 바란다”고 안내했다. 현재 경찰과 소방당국은 정확한 사고 경위를 조사중이다.","category":"사건 사고"},{"title":"전남광주 해남 두륜산서 등산객 추락해 중상","link":"https://n.news.naver.com/mnews/article/056/0012298711","naverLink":"https://n.news.naver.com/mnews/article/056/0012298711","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"전남광주 해남 두륜산에서 등산객이 추락해 중상을 입었습니다. 오늘(21일) 오후 2시쯤 해남군 두륜산을 등산 중이던 50대 A 씨가 10미터 아래로 추락했습니다. A 씨는 머리 출혈과 대퇴부 골절 등의 중상을 입어 소방청 헬기로 목포의 한 병원으로 이송됐습니다. 소방당국은 A 씨가 산악회원들과 함께 등산을 하다 추락한 것으로 보고 정확한 경위를 조사하고 있습니다. [사진 출처 : 연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사건 사고"}],"사회":[{"title":"민형배, 국립의대 선정 검증기구 협의 제안…서남권 반발 여전(종합)","link":"https://n.news.naver.com/mnews/article/079/0004212375","naverLink":"https://n.news.naver.com/mnews/article/079/0004212375","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"서남권 대표단, 현장 실사 생략·의료 취약성 미반영 등 부실 평가 의혹 제기 민 시장 \"국립의대 예산 무산 위기…주어진 시간 안에 최선\" 검증기구 구성 논의 민형배 전남광주통합특별시장이 21일 오후 무안청사에서 열린 서남권 연석회의 대표단과의 간담회에서 국립의대 후보 대학 선정 경위 등을 설명하고 있다. 전남광주통합특별시 제공 민형배 전남광주통합특별시장이 국립의대 설립 후보 대학으로 순천대가 선정된 것과 관련해 서남권 시민사회와 검증기구 구성 방안을 논의하기로 했다. 민 시장은 21일 오후 전남광주통합특별시 무안청사에서 목포대와 서남권 시민사회단체 관계자 등으로 구성된 서남권 연석회의 대표단과 간담회를 열고 국립의대 후보 대학 선정 경위와 평가 과정을 설명했다. 민 시장은 목포대와 순천대의 통합이 이뤄지지 않으면서 국립의대 설립 예산 1800억 원이 무산될 위기에 놓였다고 설명했다. 민 시장에 따르면 지난 8월 25일 국무회의에서 대학의 추진계획서가 없다는 문제가 제기됐으나, 8월 30일까지 후보 대학을 선정하고 추진계획서를 제출하는 조건으로 관련 예산이 의결됐다. 민 시장은 \"주어진 시간 안에서 최선을 다해 공정하게 하려고 노력했다\"며 \"행정은 늘 선택을 할 수밖에 없다\"고 강조했다. 그러나 서남권 대표단은 평가 과정에서 현장 실사가 생략되고 심사위원들에게 충분한 자료 검토 시간이 주어지지 않았다며 부실 평가 의혹을 제기했다. 또 서남권과 동부권의 의료 취약성 차이를 객관적인 지표로 평가하지 않았다고 지적했다. 이에 민 시장은 \"의료 취약지는 서로 따질 문제가 아니고 전남이라는 관점에서 봐야 한다\"고 반박했다. 전남연구원 김대성 실장은 심사위원 8명이 5개 영역 19개 지표를 평가한 결과 순천대가 89.15점, 목포대가 87.85점으로 순천대가 1.3점 앞섰다고 설명했다. 부지 관련 4개 지표에서는 목포대가 앞섰지만, 기초의학교원 관련 평가에서는 순천대가 높은 점수를 받았다는 설명이다. 서남권 대표단은 후보 대학 선정 과정과 심사 관련 자료를 전면 공개할 것을 요구했다. 민 시장은 법적으로 공개할 수 없는 자료를 제외하고는 이미 공개했다는 입장을 밝히면서 공정성 검증기구 구성 방안을 논의하자고 제안했다. 민 시장은 \"공정성 심사위원회가 됐든 명칭이 뭐라고 하든 그것을 어떻게 구성할지 논의하는 자리를 갖자\"며 다음 주 별도 협의를 제안했다. 이에 따라 양측은 다음 주 평가 공정성 검증기구의 구성 방안 등을 추가","category":"사회"},{"title":"“복통령이 개혁신당에?”…국회의원 꿈꿨던 박상보 근황 보니","link":"https://n.news.naver.com/mnews/article/033/0000053547","naverLink":"https://n.news.naver.com/mnews/article/033/0000053547","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"2024년 개혁신당 비례대표 출마 선언했지만 공천 불발 2020년부터 대한복지문화신문 기자…올해도 국회 관련 기사 작성 2012년 방송된 엠넷 오디션 프로그램 지역 예선에서 박상보씨가 노래를 부르고 있다. 박씨는 당시 독특한 창법으로 화제를 모으며 ‘복통령’이라는 별명을 얻었다. 방송 화면 캡처. 2012년 오디션 프로그램 에 출연해 ‘복통령’이라는 별명을 얻었던 박상보씨가 온라인에서 다시 화제다. 최근 엑스(X·옛 트위터)에 당시 박씨의 노래 영상과 함께 ‘복통령 이 사람 개혁신당에 있대’라는 글이 올라오면서다. 박씨가 개혁신당과 인연을 맺었던 것은 사실이다. 2024년 총선에서 개혁신당 비례대표 출마를 선언했다. 실제 공천은 받지 못했다. 박씨는 2012년 지역 예선에서 엠씨더맥스의 ‘행복하지 말아요’를 불렀다. 당시 양손을 배 위에 모으고 몸을 뒤로 젖히며 노래를 부르는 독특한 창법으로 주목받았다. 복통 때문에 제 실력을 발휘하지 못했다는 사연이 알려지면서 ‘복통령’이라는 별명이 붙었다. 본선 진출에는 실패했지만 ‘크레이지 보이스’상을 받았다. 방송 이후에도 간간이 예능 프로그램에 출연했던 박씨는 2019년 4월 27일 유튜브 채널 에 등장했다. ‘복통령을 만나다’라는 제목의 영상에서 박씨는 기자가 됐다는 근황을 알렸다. 정치인이 되고 싶다는 꿈도 밝혔다. 당시 영상 설명에는 박씨가 무소속으로 마포구청장 선거에 출마할 계획을 세우고 있다는 내용이 나온다. 2020년 6월에는 tvN 의 ‘캐스팅 2020’ 코너에 출연했다. 박씨는 8년 전 에서 입었던 것과 비슷한 회색 민소매 티셔츠 차림으로 등장해 특유의 창법을 재현했다. 2020년 6월 8일 보도에 따르면 박씨는 방송에서 대한복지문화신문 기자로 활동하고 있다고 밝혔다. 본격적인 정치 도전은 2024년 이뤄졌다. 그해 2월 22일 은 박씨가 이준석 대표가 이끄는 개혁신당의 비례대표 출마를 선언했다고 보도했다. 박씨는 정치외교학과 출신으로 국회출입기자 경력과 1급 사회복지사 자격증을 갖고 있다고 자신을 소개했다. 대한적십자사 수상인명구조요원으로 활동한 경력도 내세웠다. 개혁신당을 선택한 이유에 대해서는 이준석 대표와 사상이 정확하게 일치하지는 않지만 방향이 비슷하다며 자신을 중용주의자이자 실용주의자라고 설명했다. 서울 강남구 대치동의 빌라 관리인으로 활동하면서 주민들과 소통해 정치 감각을 단련했다는 주장도 했다. 당시 박씨는 대중에게 알려진 자신의 희화화된","category":"사회"},{"title":"구글, 인도네시아 친정부 유튜브 채널 대량 삭제…당국 반발","link":"https://n.news.naver.com/mnews/article/001/0016455904","naverLink":"https://n.news.naver.com/mnews/article/001/0016455904","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"'조직적 영향력 행사 활동' 채널 3분기 1만9천여개 폐쇄…세계 최다 유튜브 로고 [EPA 연합뉴스 자료사진. 재판매 및 DB 금지] (하노이=연합뉴스) 박진형 특파원 = 구글이 인도네시아에서 정부를 지지하는 유튜브 채널을 대량으로 폐쇄하자 인도네시아 정부가 구체적인 삭제 이유를 설명하라면서 반발하고 있다. 21일(현지시간) 로이터 통신과 싱가포르 일간 스트레이츠타임스 등에 따르면 구글은 지난 3분기에 인도네시아에서 '조직적인 영향력 행사 활동'에 따른 것으로 판단되는 친정부 유튜브 채널 1만9천372개를 삭제했다고 밝혔다. 이는 이 기간 같은 사유로 전 세계에서 폐쇄된 유튜브 채널의 약 절반을 차지하는 것으로, 인도네시아는 중국·러시아를 누르고 가장 많은 채널이 삭제된 국가가 됐다. 이전과 비교해도 폐쇄 채널 수는 1분기 3천598개, 2분기 437개에서 이번에 크게 늘었다. 이들 채널은 주로 프라보워 수비안토 대통령과 정부를 지지하는 현지 언어 콘텐츠를 공유했으며, 이 중 8월에 삭제된 1만134개 채널은 인도네시아 정부 비판자들을 비판하는 내용도 포함하고 있었다고 구글은 계정 삭제 관련 분기별 보고서에서 밝혔다. 구글은 계정의 정치적 성향과 상관없이 자사 정책에 따라 조직적인 영향력 행사 활동의 일부로 분류되는 유튜브 채널들을 폐쇄해왔다. 구글은 이들 채널을 삭제 대상으로 판단한 근거, 누가 채널을 운영하고 자금을 지원했는지, 인도네시아 정부와 직접적인 관련이 있는지 등은 구체적으로 밝히지 않았다. 이에 대해 전날 인도네시아 통신디지털부는 구글의 조치가 오해를 불러일으킬 위험성이 있다면서 삭제 채널을 선정한 구체적인 근거를 서면으로 제시할 것을 요구했다. 통신디지털부는 구글 인도네시아 관계자들과 회의를 갖고 삭제 결정 방법론과 검토 과정, 채널 소재지 파악 방법 등에 대해 상세한 정보를 요청했다고 밝혔다. 이어 회의에서 구글 측이 자사 보고서에 충분한 근거와 설명이 포함되지 않아 오해를 불러일으킬 수 있다는 점을 인정했다고 전했다. 인도네시아에서는 작년 8월 대규모 반정부 시위 사태가 전국을 휩쓴 이후 유튜브 채널 폐쇄가 급증했다. 구글은 그해 9월 정부 지지 콘텐츠를 공유하던 채널 445개를 삭제했다. 그 결과 구글 보고서에 따르면 지난 9월까지 5년 동안 삭제된 인도네시아 관련 유튜브 채널 총 2만7천516개 중 99%가 작년 9월 이후에 폐쇄됐다. 이와 관련해 인도네시아 소셜미디어 분석 플랫폼 '드론","category":"사회"},{"title":"보령 앞바다서 조업 중 30대 인도네시아 선원 양망기에 끼여 숨져","link":"https://n.news.naver.com/mnews/article/014/0005607681","naverLink":"https://n.news.naver.com/mnews/article/014/0005607681","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"보령해양경찰서 전경. /사진=뉴시스 [파이낸셜뉴스] 충남 보령 앞바다에서 조업 중이던 어선에서 외국인 선원이 장비에 끼여 숨지는 사고가 발생했다. 21일 보령해양경찰서에 따르면 이날 오전 9시 56분쯤 충남 보령시 오천면 호도 인근 해상에서 조업하던 7.93t(톤)급 연안복합어선 선장이 \"선원이 양망기에 빨려 들어갔다\"라고 신고했다. 양망기는 어구나 그물을 끌어올리는 장비다. 신고를 받고 출동한 해경 경비함은 28분 만에 현장에 도착해 의식이 없는 심정지 상태의 인도네시아 국적 30대 선원 A씨를 발견했다. 해경은 A씨에게 심폐소생술(CPR)을 실시하며 대천항으로 긴급 이송해 오전 11시 13분쯤 대기 중이던 119 구급대에 인계했다. A씨는 인근 병원으로 옮겨졌으나 의료진으로부터 끝내 사망 판정을 받았다. 사고가 난 어선은 이날 대천항에서 출항했으며 당시 A씨를 포함해 모두 4명이 타고 있었던 것으로 파악됐다. 해경은 \"A씨가 그물을 걷어 올리다 양망기에 끼어 그대로 빨려 들어갔다\"는 어선 관계자의 진술 등을 토대로 정확한 사고 경위를 조사하고 있다.","category":"사회"},{"title":"[속보] 국가자격 시험장서 울린 ‘따르릉~’ 벨소리…부정행위 6건 걸렸다","link":"https://n.news.naver.com/mnews/article/029/0003060345","naverLink":"https://n.news.naver.com/mnews/article/029/0003060345","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"[속보] 국가자격 시험장서 울린 ‘따르릉~’ 벨소리…부정행위 6건 걸렸다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"드론으로 만나는 판타지 속 마법과 모험","link":"https://n.news.naver.com/mnews/article/001/0016455951","naverLink":"https://n.news.naver.com/mnews/article/001/0016455951","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"드론으로 만나는 판타지 속 마법과 모험. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"보령 호도 인근서 30대 인도네시아 선원 양망기에 끼어 숨져","link":"https://n.news.naver.com/mnews/article/003/0014337542","naverLink":"https://n.news.naver.com/mnews/article/003/0014337542","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"[보령=뉴시스] 보령해양경찰서 전경. (사진=뉴시스 DB). photo@newsis.com *재판매 및 DB 금지 [보령=뉴시스]김덕진 기자 = 21일 충남 보령 호도 인근 바다에서 조업 중이던 7.93t 연안복합어선에서 외국인 선원이 끼임 사고로 숨졌다. 보령해양경찰서에 따르면 이날 오전 9시56분께 이 배 선장이 \"선원이 양망기에 빨려 들어갔다\"고 신고했다. 곧바로 경비함을 출동시킨 해경은 신고 접수 28분 만에 현장에 도착해 이미 의식이 없는 A(인도네시아 국적 30대)씨를 발견하고 심폐소생술을 실시하며 대천항으로 옮겼다. 이후 49분 만인 이날 오전 11시13분께 대천항에 도착한 해경은 A씨를 대기하고 있던 구급대에 인계했다. 병원으로 이송된 A씨는 끝내 의료진으로부터 사망판정을 받았다. 해경은 정확한 사고 경위를 조사 중이다．","category":"사회"},{"title":"사랑이도 지켜 본 추성훈 은퇴전…“어머니 이제 걱정 마세요”","link":"https://n.news.naver.com/mnews/article/025/0003566886","naverLink":"https://n.news.naver.com/mnews/article/025/0003566886","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"사랑이도 지켜 본 추성훈 은퇴전…“어머니 이제 걱정 마세요”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"추성훈, 원수에 복수 못하고 떠났다...22년 격투인생 마침표","link":"https://n.news.naver.com/mnews/article/025/0003566885","naverLink":"https://n.news.naver.com/mnews/article/025/0003566885","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"추성훈, 원수에 복수 못하고 떠났다...22년 격투인생 마침표. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"로또 2등이 한 곳서 무려 10장…5억원 당첨금 주인은 한 명?","link":"https://n.news.naver.com/mnews/article/053/0000063248","naverLink":"https://n.news.naver.com/mnews/article/053/0000063248","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"로또 2등이 한 곳서 무려 10장…5억원 당첨금 주인은 한 명?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"‘끔찍! 순대국밥서 돼지이빨이 나왔다’…광주 수완지구 식당 ‘위생 논란’","link":"https://n.news.naver.com/mnews/article/021/0002834487","naverLink":"https://n.news.naver.com/mnews/article/021/0002834487","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"SNS 캡처 광주 수완지구의 한 순대국밥집에서 배달 음식을 먹던 손님이 돼지 이빨로 추정되는 이물질을 씹었다며 위생 문제를 제기하는 글이 올라와 논란이 일고 있다. 식당 측은 ‘이빨’이 아니라 ‘뼛조각’일 것이라고 설명한 것으로 전해졌다. 21일 온라인 커뮤니티에 ‘순대국밥 먹다가 돼지 이빨을 씹었다’는 글이 올라왔다. 작성자 A씨는 광주의 한 식당에서 모둠국밥을 배달시켜 먹다가 단단한 물체를 씹고 이를 뱉어 확인했다고 밝혔다. A씨가 올려놓은 게시글 첨부 사진에는 뿌리 부분이 드러난 치아 모양의 흰 물체가 선명하게 보였다. A씨는 “제 이빨이 빠진 줄 알고 깜짝 놀랐다”며 “돼지 머릿고기에서 나온 돼지 이빨인 것 같다”고 주장했다. 그는 “이렇게 크고 뾰족한 걸 삼키기라도 했으면 어땠을까 싶다”고 했다. 식당에 항의하자 업주는 식재료를 선별하기 때문에 돼지 이빨이 들어갔을 가능성은 없고 뼛조각으로 보인다고 답했다고 한다. 식당은 국밥값을 환불했지만, A씨는 환불로 일을 마무리하려는 듯한 태도에 불만을 표시했다. A씨는 “평생 양치 한 번 안 했을 돼지 이빨을 넣고 국을 끓여 손님에게 내줬다는 게 너무 비위 상한다”며 “제가 씹어 먹었다는 게 화난다”고 토로했다. 이어 “돼지국밥을 먹다가 이빨이 나오는 게 흔한 일이냐”고 반문했다. 댓글에는 비슷한 경험을 했다는 반응도 나왔다. 한 누리꾼은 이후 순대만 들어간 메뉴를 주문한다고 했고, 다른 누리꾼은 돼지머리를 직접 삶는 국밥집에서 이빨이 나온 적이 있다고 적었다. 일부 누리꾼은 잇몸 속에 남은 이빨을 손질 과정에서 발견하지 못할 수 있다며 병원 진료와 보험 접수를 권했다. 반면 실수할 수도 있고 사과와 환불을 받았다면 추가 조치가 어렵다는 의견도 있었다. 이물질의 정체와 혼입 경위는 확인되지 않았다. 식품안전정보원은 음식에서 이물을 발견하면 음식과 이물의 사진을 남기고, 이물을 지퍼백이나 용기에 보관해야 원인 조사에 도움이 된다고 안내했다. 이물 신고는 전화 1399나 식품안전나라, 배달앱을 통해 접수할 수 있고, 신고 뒤 관할 기관의 원인 조사와 결과 통보가 진행된다.","category":"생활·문화"},{"title":"'AI 부정행위' 논란 뒤 첫 국가자격시험서 6건 또 적발","link":"https://n.news.naver.com/mnews/article/660/0000121912","naverLink":"https://n.news.naver.com/mnews/article/660/0000121912","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"▲김영훈 고용노동부 장관, 경비지도사 국가자격시험장 현장 점검 [연합뉴스] 세무사 시험 수석 합격자의 인공지능(AI) 부정행위 자백 이후 처음 치러진 국가자격시험에서 전자기기 소지 등 6건의 위반 사례가 적발됐습니다. 한국산업인력공단은 21일 전국 33개 시험장에서 시행된 제28회 경비지도사 시험에서 응시생 6명의 부정행위가 드러났다고 밝혔습니다. 공단은 이번 시험부터 휴대전화를 일괄 수거한 후 응시생 번호로 무작위 전화 걸어 전원 차단 여부를 재확인하는 절차를 도입했습니다. 이날 시험 도중 감독관이 무작위로 전화했더니 응시생 한 명의 휴대전화 벨소리가 울려 시험이 무효 처리됐습니다. 전원이 켜진 태블릿 PC를 소지하고 있던 응시생 등 5명도 적발돼 부정행위자로 분류됐습니다. 첨단기기 활용 부정행위 감시 전문인력인 'AI 인스펙터'가 이들을 잡아냈습니다. 이들은 당해 시험 무효와 함께 향후 응시제한 등 처분을 받을 전망입니다. 고용노동부와 공단은 AI를 악용한 부정행위를 원천 차단하기 위해 국가자격시험 관리·감독을 대폭 강화할 방침입니다. AI 인스펙터 인력을 확충하는 한편, 전파탐지기를 개발이 완료되는 대로 모든 시험장에 도입할 예정입니다. 폐쇄회로(CC)TV 역시 향후 외부 임차 시험장까지 확대 설치할 계획입니다. 아울러 수석·차석 합격자 점수 공개를 의무화하고, 국가기술자격 부정행위자의 응시제한 기간을 현행 3년에서 10년으로 늘리는 방안도 추진합니다.","category":"생활·문화"},{"title":"‘시험장서 또 전화벨이 울렸다’…AI 부정행위 논란 뒤 첫 국가시험서 또 6명 ‘무효’","link":"https://n.news.naver.com/mnews/article/021/0002834485","naverLink":"https://n.news.naver.com/mnews/article/021/0002834485","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"연합뉴스 세무사 시험 수석 합격자의 인공지능(AI) 부정행위 자백 이후 처음 치러진 국가자격시험에서 전자기기 소지 등으로 응시생 6명의 시험이 무효 처리됐다. 시험장에서 휴대전화 벨소리가 울리고 태블릿PC와 스마트워치 소지자도 적발됐다. 21일 한국산업인력공단에 따르면 이날 전국 33개 시험장에서 실시된 제28회 경비지도사 시험에서 전자기기 관리규정 위반과 부정행위 등 6건이 적발됐다. 공단은 최근 세무사 시험의 AI 부정행위가 드러난 이후 시험 감독을 강화했다. 이날 1차 시험에는 4400여 명, 2차 시험에는 7000여 명이 응시했다. 이번 시험부터 휴대전화 전원을 감독관이 직접 확인한 뒤 일괄 수거하고, 응시생 번호로 무작위 전화를 걸어 전원이 꺼졌는지 다시 확인하는 방식을 도입했다. 실제 시험 도중 전화가 울린 응시생 1명은 시험 무효 처분을 받았다. 휴대전화가 울린 응시생은 부정행위자로 분류되지 않았지만 시험은 무효 처리됐다. 첨단 전자기기 이용 부정행위 단속을 위해 배치된 전문인력 ‘AI 인스펙터’와 시험감독관도 현장 점검을 벌였다. 전원이 켜진 태블릿PC와 스마트워치 등 금지 물품 소지자들이 적발됐다. 부정행위자로 분류된 이들은 시험 무효와 향후 응시제한 등 처분을 받을 수 있다. 전문 감독인력은 전자·통신기기 소지자 2명과 스마트워치 착용자 1명을, 고사실 감독관은 메모지 사용자와 스마트워치 착용자를 각각 1명씩 적발했다. 일부 응시생은 초소형 카메라 설치 방지를 위해 부직포 앞치마를 착용했다. 정부는 국가자격시험의 감독을 강화하기 위해 AI 인스펙터 인력을 늘리고 개발 중인 전파탐지기를 완성되는 대로 모든 시험장에 도입할 방침이다. 폐쇄회로(CC)TV도 외부 임차 시험장까지 확대 설치한다. 김영훈 고용노동부 장관은 이날 오전 7시 30분 서울 용산철도고등학교 시험장을 방문해 감독관 교육과 시험 준비 상황을 살폈다. 정부는 아울러 수석·차석 합격자 점수를 공개하고, 국가기술자격시험 부정행위자의 응시제한 기간을 현행 3년에서 10년으로 늘리는 방안을 추진하고 있다.","category":"생활·문화"},{"title":"박종복 차기 은행聯회장 \"AI전환 책임감\"…신한 이사직 이해상충 검토","link":"https://n.news.naver.com/mnews/article/293/0000093659","naverLink":"https://n.news.naver.com/mnews/article/293/0000093659","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"박종복 차기 은행연합회장 최종 후보자 박종복 차기 은행연합회장 내정자가 인공지능(AI) 확산 등 금융산업의 전환기를 맞아 무거운 책임감을 느낀다는 소감을 밝혔다. 현재 맡고 있는 신한금융지주 사외이사직에 대해서는 이해상충이 발생하지 않도록 관련 법과 규정을 검토하겠다는 입장이다. 박 내정자는 23일 와의 통화에서 은행연합회장 최종 후보자로 추천된 데 대해 책임감을 느끼고 있다고 밝혔다. 다만 아직 사원총회 인준과 취임 절차가 남아 있고 업무보고도 받지 않은 만큼 구체적인 정책 방향은 취임 이후 제시하겠다고 설명했다. 그는 특히 AI 확산 등 금융산업이 새로운 전환기를 맞고 있다는 점을 강조했다. 우선 은행연합회의 업무와 주요 현안을 파악한 뒤 향후 운영 방향을 정리해 밝히겠다는 구상이다. 은행권이 자신을 최종 후보자로 선택한 배경에 대해서는 신중한 태도를 보였다. 박 내정자는 본인이 낙점받은 배경에 관한 질문에 \"글로벌 또 국내 다 경험했으니까\"라고 말했다. 국내외 금융시장 경험을 바탕으로 변화하는 금융환경에서 이해관계를 조율해 달라는 기대가 반영됐을 가능성을 조심스럽게 언급한 것이다. 그는 현재 맡고 있는 신한금융지주 사외이사직의 향후 거취도 언급했다. 사외이사직을 어떻게 정리할 것인가에 관해 \"법과 규정에 따라서 해야 될 것이고, 이해상충이 있으면 안 될 테니까\"라고 답했다. 이어 관련 규정을 살펴보고 절차에 맞춰 처리하겠다는 뜻을 밝혔다. 은행연합회는 시중은행과 지방은행, 국책은행, 인터넷전문은행 등 다양한 회원사의 이해관계를 대변하는 기관이다. 박 내정자가 현재 신한금융 사외이사로 활동하고 있는 만큼 향후 은행연합회장 직무와의 이해상충 가능성 및 겸직 여부가 검토 대상이 될 전망이다. 다만 박 내정자는 사외이사직 사임 여부나 구체적인 시점에 대해서는 확답하지 않았다. 국내 은행권에서 가장 시급하게 개선해야 할 과제를 묻는 질문에도 신중한 입장을 유지했다. 은행마다 처한 상황이 다른 만큼 관련 사안을 충분히 검토한 뒤 취임 시점에 자신의 생각을 밝히겠다고 설명했다. 은행연합회 회장후보추천위원회는 이날 제3차 회의를 열고 박 내정자를 차기 회장 최종 후보자로 단독 추천했다. 사원총회 의결을 거쳐 공식 선출되면 12월1일부터 3년간 은행연합회를 이끌게 된다. 앞으로 박 내정자는 생산적 금융 확대와 가계부채 관리, 금융소비자 보호 등 은행권의 주요 현안을 조율해야 할 역할을 수행할 것으로 보인다. 특히 금융산업","category":"생활·문화"},{"title":"증권가 해킹 피해 또 터졌다…삼성증권도 8241명 개인정보 유출","link":"https://n.news.naver.com/mnews/article/421/0009304349","naverLink":"https://n.news.naver.com/mnews/article/421/0009304349","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"증권가 해킹 피해 또 터졌다…삼성증권도 8241명 개인정보 유출. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"경기도, 철도 파업 대비 버스 증회·마을버스 막차 연장","link":"https://n.news.naver.com/mnews/article/421/0009303843","naverLink":"https://n.news.naver.com/mnews/article/421/0009303843","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"광역·시내버스 56회, 시외버스 93회 증회 경기도청사 전경. (뉴스1 DB) (경기=뉴스1) 이상휼 기자 = 경기도가 서울교통공사와 한국철도공사(코레일) 등 철도 운영기관의 파업에 대비해 버스 증회와 막차 연장 등 비상수송대책을 마련했다고 23일 밝혔다. 도에 따르면 서울교통공사는 25일, 코레일은 12월 10일 파업을 예고했다. 수도권광역급행철도(GTX)-A 운영노조도 12월 중 파업을 예고한 상태다. 파업이 현실화하면 서울지하철 1~8호선과 경의중앙선·수인분당선·경강선 등 수도권 광역전철, GTX-A 운행에 차질이 예상된다. 도는 출퇴근 시간대 혼잡이 예상되는 시내·광역버스 노선에 예비차량 38대를 투입해 운행 횟수를 56회 늘릴 계획이다. 혼잡이 이어질 경우 전세버스 추가 투입도 검토한다. 마을버스는 출퇴근 시간대 집중배차를 실시하고 막차시간을 1시간 연장한다. 예비차량 6대를 투입하고 기존 노선에도 차량 6대를 증차할 방침이다. 시외버스는 5개 권역 28개 노선에서 운행 횟수를 93회 늘린다. 도내 택시업계에도 3만 8321대의 운행 협조를 요청했다. 도는 파업 전날 오전 9시부터 상황 종료 때까지 비상수송대책본부를 24시간 운영하며 철도 운행과 교통 상황을 관리할 계획이다. 31개 시군과 실시간 정보공유 체계를 구축하고 도와 시군 홈페이지, 경기도교통정보센터, 경기버스정보앱 등을 통해 파업 일정과 대체교통수단 운행 정보도 안내한다. 이철규 경기도 철도운영과장은 \"철도 파업이 현실화할 경우 도민 불편을 최소화할 수 있도록 버스와 택시 등 대체교통수단을 적극 활용하겠다\"고 말했다.","category":"생활·문화"},{"title":"서울 중랑구서 80대 여성 택배 트럭에 치여 중상","link":"https://n.news.naver.com/mnews/article/214/0001537168","naverLink":"https://n.news.naver.com/mnews/article/214/0001537168","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"어제 저녁 6시 20분쯤 서울 중랑구 중화동의 한 대로변에서 80대 여성이 택배 트럭에 치이는 사고가 났습니다. 이 사고로 여성이 뼈가 부러지는 등 크게 다쳐 병원으로 이송된 것으로 알려졌습니다. 경찰은 트럭을 운전한 50대 남성을 상대로 정확한 사고 경위를 조사하고 있습니다.","category":"생활·문화"},{"title":"22일 소설, 충청권 영하권 추위…낮에도 쌀쌀","link":"https://n.news.naver.com/mnews/article/656/0000193146","naverLink":"https://n.news.naver.com/mnews/article/656/0000193146","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"주부들 한 해 겨울 준비 김장하다 손목·척추·관절 ‘윽’ [건강+]","link":"https://n.news.naver.com/mnews/article/022/0004177022","naverLink":"https://n.news.naver.com/mnews/article/022/0004177022","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"입동(立冬)이 지났다. 말 그대로 겨울이 시작됐다는 뜻이다. 이 무렵 밭에서 무와 배추를 뽑아 온 가족이 한 해 겨울을 보낼 김장을 서두른다. 가정에서 주부들의 손길이 더욱 분주해지는 시기다. 후유증을 줄이려면 재료를 준비하는 순간부터 마무리 단계까지 무게와 자세, 반복 사용을 조절하는 전략이 필요하다고 전문가들은 조언한다. 정성 만큼이나 몸에 쌓이는 피로도 만만치 않기 때문이다. 21일 부평힘찬병원 오승목 정형외과 원장은 “무거운 것을 들 때는 순간적으로 큰 힘이 필요하다”며 “같은 자세로 손질하거나 버무릴 경우 근육과 힘줄에 부담이 지속된다”고 판단했다. 준비 시 배추와 물을 옮기는 횟수가 많고, 바닥의 대야를 향해 몸을 숙이기 쉬워 무게와 작업 높이를 먼저 조정해야 한다. 바닥의 통을 들 때는 몸을 가까이 붙이고 발을 안정적으로 벌린다. 물건이 몸에서 멀수록 허리를 앞으로 굽히려는 힘이 커지므로 몸 가까이에서 든다. 대야와 도구는 손이 닿기 쉬운 곳에 둔다. 동시에 허리를 깊게 숙이거나 어깨를 치켜들지 않는다. 손목을 꺾은 채 양념을 버무리거나 배추를 움켜쥐면 힘줄과 주변 조직에 부담이 쌓인다. 손등과 팔이 가능한 한 일직선이 되도록 유지하고, 한 번에 다루는 배추와 양념의 양을 줄인다. 같은 자세를 고집하지 말고, 틈틈이 일어나 걷거나 팔을 내려 쉰다. 속 버무리기·채우기·통에 담기를 교대해 반복 부담을 나눈다. 통을 가득 채워 한꺼번에 들거나 높은 선반에 무리하게 올리지 않는다. 신체에 이미 피로가 쌓인 상태이기 때문이다. 몸에 가벼운 결림만 있다면 무리 가는 동작을 줄이고 쉰다. 통증이 허용하는 범위에서 가볍게 걷거나 관절을 부드럽게 움직인다. 붓기나 열감 없이 근육이 뻣뻣하게 뭉친 느낌에는 온찜질이 도움이 될 수 있다. 반대로 손목이나 무릎이 붓고 열감이 있다면 초기에는 뜨거운 찜질 대신 냉찜질을 한다. 인천힘찬종합병원 강민규 신경외과 과장은 “김장 후 내원하는 이들 중 요추 염좌가 대다수로 척추 주변의 근육이나 인대가 경직되면서 요통을 겪기 쉽다”면서 “다리 저림이 계속되거나 발에 힘이 잘 들어가지 않아 걸을 때 불편하다면 신경 기능 확인이 요구된다”고 말했다.","category":"생활·문화"},{"title":"겨울철 제철이라 신나게 먹었다간 “화장실 들락날락”…식약처가 경고한 음식 [헬시타임]","link":"https://n.news.naver.com/mnews/article/011/0004684694","naverLink":"https://n.news.naver.com/mnews/article/011/0004684694","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"겨울철 제철이라 신나게 먹었다간 “화장실 들락날락”…식약처가 경고한 음식 [헬시타임]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"}],"세계":[{"title":"역대 최장 유엔기후회의, 결국 빈손…‘화석연료 퇴출 합의’ 또 무산","link":"https://n.news.naver.com/mnews/article/009/0005767345","naverLink":"https://n.news.naver.com/mnews/article/009/0005767345","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"2026년 11월 22일, 안탈리아 엑스포 센터에서 열린 유엔 기후변화회의(COP31) 본회의에 무라트 쿠룸(Murat Kurum) COP31 의장 겸 튀르키예 환경·도시화·기후변화부 장관(왼쪽에서 두 번째)과 기타 관계자들이 참석하고 있다. [AFP=연합뉴스] 세계 각국이 기후위기 대응 방안을 논의하기 위해 모인 유엔기후변화협약 당사국총회(COP31)가 결국 합의문 채택에 실패했다. 화석연료 퇴출과 개발도상국 기후재원 확대 등을 둘러싼 회원국 간 이견을 좁히지 못하면서다. 당초 예정된 폐막일을 이틀 넘겨 역대 최장 회의 기록까지 세웠지만, 국제사회의 기후 대응 공조가 흔들리는 결과만 남겼다. 22일(현지시간) 로이터·AP통신 등에 따르면 COP31 의장을 맡은 튀르키예의 무라트 쿠룸 환경·도시화·기후변화부 장관은 이날 폐막 전체회의에서 “(만장일치가 필요한)합의문에 반대하는 국가들이 있었다”며 “결정문은 채택되지 않았다”고 말했다. 이번 협상의 최대 쟁점은 화석연료 퇴출이었다. 회의 초반 공개된 합의문 초안에는 ‘화석연료의 단계적 퇴출’이라는 표현이 포함됐지만, 사우디아라비아 등 주요 산유국의 반발에 부딪히면서 19일 공개된 2차 초안에서는 해당 문구가 삭제됐다. 개발도상국의 기후변화 적응을 지원하기 위한 재원 확대도 합의의 발목을 잡았다. 선진국의 기후재원을 1200억달러(약 160조원) 규모로 늘리겠다는 목표가 2차 초안에서 빠지면서 재정 지원을 요구해온 국가들의 반발을 샀다. 여기에 탄소 포집 기술을 둘러싼 논란도 이어졌다. 일부 대표단은 탄소 포집 기술이 합의문에 포함되는 데 반대했다. 이 기술이 화석연료 사용을 근본적으로 줄이는 대신 기존 화석연료 산업의 수명을 연장하는 수단으로 활용될 수 있다는 우려에서다. 협상을 주도한 호주와 개최국 튀르키예가 마련한 초안에는 기후위기의 심각성을 보여주는 대목도 담겼다. 산업화 이전 대비 지구 평균기온 상승 폭을 섭씨 1.5도 이내로 제한한다는 목표를 각국이 지키기 어려운 상황이라는 점을 처음으로 인정한 것이다. 아울러 이미 초과한 온도 상승분을 되돌릴 수 있도록 탄소 제거 기술 개발에 속도를 낼 것을 촉구했다. 기후총회에서 공식 합의문 채택이 무산된 것은 2009년 덴마크 코펜하겐에서 열린 COP15 이후 처음이다. 당시에도 각국은 ‘코펜하겐 협정’을 마련했지만 총회 공식 합의로 채택하는 데 실패했다. 이번 COP31의 합의 불발은 17년 만에 국제 기후협상의","category":"세계"},{"title":"‘인구 7억3000만’ 자유무역권 탄생…EU·인니 “관세 90％ 이상 철폐”","link":"https://n.news.naver.com/mnews/article/011/0004684693","naverLink":"https://n.news.naver.com/mnews/article/011/0004684693","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"EPA연합뉴스 유럽연합(EU)과 인도네시아가 21일(현지시간) 수출입 품목의 90% 이상에 붙는 관세를 철폐하는 내용의 무역협정을 체결했다. AFP통신 등 외신에 따르면 EU와 인도네시아는 벨기에 브뤼셀 EU 본부에서 양자 간 관세 장벽을 허무는 포괄적경제동반자협정(CEPA)과 투자보호협정(IPA)에 서명했다. 협정 서명식에는 우르줄라 폰데어라이엔 EU 집행위원장과 아이를랑가 하르타르토 인도네시아 경제조정부 장관이 참석했다. CEPA가 발효돼 완전히 이행되면 양측 수출입 품목의 90% 이상에 붙는 관세가 사라진다. 구체적으로 EU산 상품은 98.5%, 인도네시아산 상품은 90% 이상 무관세 혜택을 받는다. 현재 최대 50%에 달하는 EU산 자동차 관세는 5년에 걸쳐 단계적으로 철폐된다. EU 집행위원회는 이번 협정으로 연간 6억유로(약 8900억원)의 관세 비용이 절감되고 대(對)인도네시아 수출이 15년 내 40% 가까이 증가할 것으로 내다봤다. 하르타르토 장관은 “팜유와 신발·섬유·수산물 수출이 큰 혜택을 볼 것”이라고 기대했다. 양측 인구를 합치면 7억3000만 명에 달한다. 폰데어라이엔 위원장은 “인구 4억5000만 명의 EU를 동남아시아 최대 경제국이자 세계 4위 인구 대국과 연결하게 됐다”며 “EU가 아시아 국가와 체결한 가장 야심 찬 협정 중 하나”라고 평가했다. EU 집행위에 따르면 지난해 양측의 상품 교역액은 290억유로(약 42조8000억원)로 10년 전보다 24% 늘었다. 같은 기간 서비스 교역액도 94% 급증한 93억유로(약 13조7000억원)로 집계됐다. 지난해 9월 협상을 타결한 양측은 EU 27개 회원국 전체 승인과 양측 의회 비준 절차를 거쳐 내년 1월 협정을 공식 발효할 계획이다.","category":"세계"},{"title":"EU, 인도네시아 무역협정 체결…관세 90％ 이상 철폐","link":"https://n.news.naver.com/mnews/article/056/0012298714","naverLink":"https://n.news.naver.com/mnews/article/056/0012298714","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"유럽연합(EU)과 인도네시아가 현지 시각 21일 90％ 이상 수출입품에 관세를 철폐하는 내용의 무역협정을 체결했다고 AFP통신 등이 보도했습니다. 우르줄라 폰데어라이엔 EU 집행위원장과 아이를랑가 하르타르토 인도네시아 경제조정부 장관은 이날 벨기에 브뤼셀 EU 본부에서 포괄적경제동반자협정(CEPA)과 투자보호협정(IPA)에 서명했습니다. CEPA가 완전히 이행되면 EU산 상품의 98.5％, 인도네시아산은 90％ 이상이 무관세로 수출됩니다. 현재 최대 50％인 EU산 자동차 관세는 5년 동안 단계적으로 없애기로 했습니다. EU 집행위원회는 협정을 통해 연간 약 6억유로(약 8천900억원)의 관세 비용을 아끼고 인도네시아로 수출이 15년 안에 40％ 가까이 늘어날 것으로 추산했습니다. 아이를랑가 장관은 팜유와 신발·섬유·수산물 수출에 혜택을 받을 것으로 보인다고 말했습니다. EU와 인도네시아 인구를 합치면 약 7억3천만명입니다. 폰데어라이엔 위원장은 \"4억5천만 인구의 EU를 동남아시아 최대 경제국이자 세계 4위 인구대국과 연결한다\"며 \"EU가 아시아 국가와 맺은 가장 야심찬 협정 가운데 하나\"라고 말했습니다. EU 집행위에 따르면 지난해 EU와 인도네시아 사이 상품 무역액은 약 290억유로(약 42조8천억원)로 10년 사이 24％ 늘었습니다. 서비스 무역은 10년 전보다 94％ 증가해 약 93억유로(약 13조7천억원)를 기록했습니다. EU와 인도네시아는 지난해 9월 무역협정 협상을 타결했습니다. 협정은 EU 27개 회원국이 모두 승인하고 양쪽 의회에서 비준받아야 합니다. 양측은 내년 1월 공식 발효를 목표로 하고 있습니다. [사진 출처 : EPA=연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"세계"},{"title":"삼성-오우라 특허분쟁, 1차 결론 발표 미뤄졌다","link":"https://n.news.naver.com/mnews/article/092/0002446325","naverLink":"https://n.news.naver.com/mnews/article/092/0002446325","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"美ITC \"12월 22일까지 발표\"...최종결론은 내년 4월 삼성전자와 오우라의 미국 국제무역위원회(ITC) 스마트링 특허침해조사(337-TA-1468) 1차 결론 발표일이 연기됐다. 최종결론 발표 예정일도 내년 4월로 한 달 밀렸다. 미국 ITC는 20일(현지시간) 오우라가 삼성전자를 상대로 2025년 11월 제기한 특허침해조사 사건 1차 결론을 올해 12월 22일까지 발표하겠다고 밝혔다. 당초 이날 1차 결론이 나올 예정이었다. 동시에 ITC는 해당 특허침해조사 최종결론 발표 예정일을 2027년 3월 22일에서 4월 22일로 한 달 연기했다. ITC가 특허침해조사 사건에서 1차 결론과 최종결론 발표 예정일을 바꾸는 사례는 흔하다. 1차 결론이 12월 22일 이전에 나올 가능성도 있다. 미국 ITC는 20일(현지시간) 오우라가 삼성전자를 상대로 2025년 11월 제기한 특허침해조사 사건 1차 결론을 올해 12월 22일까지 발표하겠다고 밝혔다. 당초 이날 1차 결론이 나올 예정이었다. 동시에 ITC는 해당 특허침해조사 최종결론 발표 예정일을 2027년 3월 22일에서 4월 22일로 한 달 연기했다. (자료=미국 ITC) 오우라는 해당 분쟁에서 삼성전자가 특허 4건을 침해했다고 주장하고 있다. 특허 4건 중 1건(US11,868,178)은 특허심판원(PTAB)이 일부 청구항(권리범위)이 유효라고 판단했고, 삼성전자는 연방항소법원에 항소했다. 나머지 특허 3건에 대해선 삼성전자가 특허청에 결정계 재심사를 청구했다. 지난해 하반기부터 특허심판원 무효심판 개시율이 크게 떨어지면서 특허청 결정계 재심사를 활용하는 경우가 늘었다. ITC 1차 결론에 관심이 쏠리는 이유는 삼성전자가 오우라 특허를 침해했다는 판단이 나올 가능성 때문이다. 1차 결론 내용이 최종결론에서 뒤집히는 경우는 적다. ITC 사건에서 삼성전자의 특허침해가 인정되면 갤럭시링 미국 수입이 금지될 수 있다. 삼성전자는 지난 2024년 갤럭시링 첫 번째 제품 출시 후 후속 모델을 내놓지 않았다. 판매량도 많지 않았다. 스마트링은 헬스케어 시장에서 중요성이 커질 수 있는 제품이다. 혈류 등 사용자 건강정보 측정 정확도가 스마트링이 스마트워치보다 높다. 특허 침해로 판단되면 삼성전자는 향후 갤럭시링 판매량에 비례해 로열티를 오우라에 지급해야 할 수 있다. (자료: USPTO, USITC, EDTX 등 / 정리: 지디넷코리아)","category":"세계"},{"title":"England New Zealand Rugby","link":"https://n.news.naver.com/mnews/article/077/0007245510","naverLink":"https://n.news.naver.com/mnews/article/077/0007245510","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"England New Zealand Rugby England's Will Joseph, left, tackled by New Zealand's Beauden Barrett aver.com/mnews/article/077/0007245508","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"Italy ATP Finals Tennis. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"'AI 자백' 이후 첫 국가시험...6명 부정행위 적발","link":"https://n.news.naver.com/mnews/article/052/0002436204","naverLink":"https://n.news.naver.com/mnews/article/052/0002436204","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"세무사 시험 수석합격자의 인공지능 부정행위 자백 후 처음 치러진 국가 자격시험에서 전자기기 소지 등 위반 사례 6건이 적발됐습니다. 한국산업인력공단은 오늘(21일) 전국 33개 시험장에서 시행된 제28회 경비지도사 시험에서 응시생 6명의 부정행위가 드러났다고 밝혔습니다. 공단은 이번 시험부터 휴대전화를 모두 거둔 뒤 응시생 번호로 무작위 전화를 걸어 전원 차단 여부를 재확인하는 절차를 도입했습니다. 이날 시험 중 감독관이 무작위 전화를 거는 과정에서 응시생 한 명의 휴대전화 벨소리가 울려 시험이 무효처리됐습니다. 또 나머지 부정행위 5건은 첨단기기를 활용한 부정행위 감시 전문인력인 'AI 인스펙터'가 잡아낸 것으로 확인됐습니다. 전원이 켜진 태블릿 PC를 소지하고 있던 응시생 등 5명은 부정행위자로 분류돼 시험 무효와 함께 향후 응시제한 등 처분을 받을 예정입니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"IT 과학"},{"title":"세무사 시험 AI 부정행위 파장 속 경비지도사 시험서 6명 적발","link":"https://n.news.naver.com/mnews/article/087/0001232332","naverLink":"https://n.news.naver.com/mnews/article/087/0001232332","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"◇ 김영훈 고용노동부 장관이 21일 경비지도사 국가자격시험장인 서울 용산 소재 용산철도고등학교를 방문해 시험장 준비 및 시험감독관 교육 등을 확인하고 있다. 2026.11.21 사진=연합뉴스 세무사 시험 수석 합격자의 인공지능(AI) 활용 부정행위 자백 이후 처음 치러진 국가자격시험에서 전원이 켜진 전자기기를 소지하는 등 부정행위 6건이 적발됐다. 한국산업인력공단에 따르면 21일 전국 33개 시험장에서 실시된 제28회 경비지도사 시험에서 응시생 6명이 부정행위로 적발됐다. 이번 시험에서는 부정행위 방지를 위해 강화된 감독 절차가 적용됐다. 공단은 응시생들의 휴대전화를 일괄 수거한 뒤 무작위로 전화를 걸어 전원이 꺼져 있는지 확인하는 방식을 새롭게 도입했다. 실제 시험 도중 감독관이 무작위로 전화를 거는 과정에서 응시생 1명의 휴대전화 벨소리가 울렸고, 해당 응시생의 시험은 무효 처리됐다. 나머지 5건은 첨단기기를 이용한 부정행위를 감시하는 전문인력인 ‘AI 인스펙터’에 의해 적발됐다. 이 가운데 전원이 켜진 태블릿 PC를 소지한 응시생 등이 부정행위자로 분류됐다. 적발된 응시생들은 당해 시험 무효 처리와 함께 향후 응시제한 등의 처분을 받을 전망이다. 고용노동부와 공단은 AI 기술을 악용한 부정행위를 차단하기 위해 국가자격시험의 관리·감독 체계를 한층 강화할 방침이다. 이를 위해 AI 인스펙터 인력을 늘리고, 개발이 완료되는 대로 전파탐지기를 모든 시험장에 도입할 계획이다. 폐쇄회로(CC)TV 설치 범위도 외부 임차 시험장까지 확대하기로 했다. 제도 개선도 추진한다. 수석·차석 합격자의 점수 공개를 의무화하는 한편, 국가기술자격시험 부정행위자의 응시제한 기간을 현행 3년에서 10년으로 늘리는 방안을 검토하고 있다.","category":"IT 과학"},{"title":"‘AI 부정행위’ 원천 봉쇄할 수 있는 해법은?… 업계 “정부·모델사 협의가 관건” [AI 클로즈업]","link":"https://n.news.naver.com/mnews/article/138/0002249454","naverLink":"https://n.news.naver.com/mnews/article/138/0002249454","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"‘AI 부정행위’ 원천 봉쇄할 수 있는 해법은?… 업계 “정부·모델사 협의가 관건” [AI 클로즈업]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"SPAIN SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010374906","naverLink":"https://n.news.naver.com/mnews/article/091/0010374906","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"LaLiga - Alaves vs Deportivo A Coruna Jonny Otto (R) of Alaves defends possession of the ball against Marc Casado (L) of Deportivo during the LaLiga EA Sports match between Alaves and Deportivo de A Coruna in Vitoria, Spain, 21 November 2026. EPA/L. RICO","category":"IT 과학"},{"title":"APTOPIX Britain Premier League Soccer","link":"https://n.news.naver.com/mnews/article/077/0007245498","naverLink":"https://n.news.naver.com/mnews/article/077/0007245498","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"APTOPIX Britain Premier League Soccer Fulham's Kenny Tete loses his balance as he battles for the ball with Manchester City's Jeremy Doku (11) during the English Premier League soccer match between Manchester City and Fulham in Manchester, England, Saturday, Nov. 21, 2026. (AP Photo/Dave Thompson)","category":"IT 과학"},{"title":"BRITAIN SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010374890","naverLink":"https://n.news.naver.com/mnews/article/091/0010374890","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"English Premier League - Manchester City vs Fulham Ayyoub Bouaddi (L) and Rayan Cherki (R) of Manchester City in action against Calvin Bassey of Fulham during the English Premier League match Manchester City against Fulham FC, in Manchester, Britain, 21 November 2026. EPA/RYAN JENKINSON EDITORIAL USE ONLY. No use with unauthorized audio, video, data, fixture lists, club/league logos, 'live' services or NFTs. Online in-match use limited to 120 images, no video emulation. No use in betting, games or single club/league/player publications.","category":"IT 과학"},{"title":"“삼성·하이닉스 내년에도 웃는다”…무디스가 전망한 AI 반도체 호황","link":"https://n.news.naver.com/mnews/article/016/0002726606","naverLink":"https://n.news.naver.com/mnews/article/016/0002726606","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"[연합] [헤럴드경제=김주리 기자] 삼성전자와 SK하이닉스 등 국내 메모리 반도체 기업들이 내년에도 인공지능(AI) 투자 확대에 따른 실적 호조를 이어갈 것으로 전망됐다. AI 관련 메모리 수요가 빠르게 늘어나는 가운데 공급 확대는 제한적으로 이뤄지면서 국내 반도체 기업들에 유리한 시장 환경이 지속될 것이라는 분석이다. AI 인프라 투자가 확대되면서 데이터센터 건설과 전력망 장비, 냉각 시스템 등 관련 산업으로도 수혜가 확산할 것으로 예상된다. AI 메모리 수요 강세 지속…삼성·하이닉스 실적 호조 전망 21일 금융투자업계에 따르면 국제 신용평가사 무디스는 지난 19일 발표한 ‘2027년 아시아·태평양 지역 비금융기업 신용전망’ 보고서에서 한국의 기술 관련 수출이 내년 경제 성장을 뒷받침할 것으로 내다봤다. 무디스는 강력한 AI 수요와 제한적인 공급 증가가 메모리 반도체 제조업체에 우호적인 사업 환경을 조성하고 있다고 평가했다. 반도체 장비업체와 소재 공급업체, 특수화학 기업 등 관련 산업 역시 AI 투자 확대에 따른 수혜를 누릴 것으로 예상했다. 삼성전자와 SK하이닉스는 올해 아시아·태평양 지역 기술기업들의 이익 증가를 이끈 주요 기업으로 꼽혔다. 무디스는 두 기업을 중심으로 한국 메모리 반도체 제조업체들이 내년에도 AI용 메모리 제품의 생산능력을 확대하고 시장 경쟁력을 강화할 것으로 전망했다. 특히 AI 관련 제품의 수요가 높은 수준을 유지하는 가운데 메모리 반도체 공급 증가는 제한적으로 이뤄지고 있다는 점에 주목했다. 수요 증가에 대응해 생산능력을 확충하는 한국 기업들이 우호적인 산업 환경의 수혜를 이어갈 것이라는 설명이다. 무디스는 한국의 기술 관련 수출이 이러한 반도체 산업의 성장에 힘입어 내년에도 경제를 뒷받침할 것으로 평가했다. AI 시장 확대가 국내 주요 기업의 실적 개선과 수출 성장에 긍정적으로 작용할 것이라는 전망이다. 반도체 넘어 데이터센터·건설까지…AI 투자 수혜 확대 AI 투자 확대에 따른 수혜는 반도체 제조업체를 넘어 관련 인프라 산업으로 확산할 전망이다. AI 기술을 구동하기 위한 데이터센터와 반도체 생산시설의 투자가 늘면서 건설기업을 비롯한 관련 설비 제조업체에도 사업 기회가 확대되고 있기 때문이다. 무디스는 AI 인프라에 대한 지속적인 투자가 반도체와 데이터센터, 디지털 인프라 전반의 투자 및 실적 성장을 뒷받침할 것으로 내다봤다. 특히 대규모 반도체 생산시설과 데이터센터 건설에 참","category":"IT 과학"},{"title":"“167년 묵은 수학계 최고 난제, AI가 뚫었다?”…전 세계 수학자들 술렁","link":"https://n.news.naver.com/mnews/article/011/0004684690","naverLink":"https://n.news.naver.com/mnews/article/011/0004684690","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"AI가 수학계 160년 난제 풀었나 리만 가설 증명 주장…AI 작업 분량만 25만쪽 검증 통과하면 수학·암호학 판도 뒤흔들 가능성 기사 내용 이해를 위한 자료사진. 클립아트코리아 인공지능(AI)이 수학계 최대 난제 중 하나인 리만 가설을 해결했다는 주장이 나왔다. 다만 증명 과정에 대한 검증은 이뤄지지 않은 상태다. 클로드와 25만쪽 작업…160년 난제 풀었다 주장 20일(현지시간) AFP통신과 파이낸셜타임스 등에 따르면 미국 AI 기업 앤트로픽의 수학자 출신 연구원 레벤트 알포게는 이날 자신의 웹사이트에 클로드와 협력해 리만 가설의 증명을 찾아냈다는 내용의 글과 4쪽 분량의 문서를 공개했다. 그는 “클로드와 협업해 리만 가설의 증명을 발견했다고 믿는다”고 밝혔다. 알포게는 컴퓨터를 활용해 수학적 증명을 검증하는 프로그래밍 언어 ‘린’(Lean)으로 작성한 결과물도 공개했다. 나아가 리만 가설의 확장판으로 불리는 ‘일반화 리만 가설’까지 해결했다고 주장했다. AI와 함께 진행한 작업량은 25만쪽을 넘겼다는 설명이다. 그는 방대한 결과물을 그대로 공개하는 데 신중한 태도를 보였다. “거대하고 읽을 수 없는 ‘슬롭’(slop·AI가 양산한 저품질 결과물)의 참사를 올리는 것은 명백히 부적절하다”고 했다. 이어 “결승선에 가까워질 무렵 클로드가 나를 크게 앞질러 날아오르고 춤추고 반짝였다”며 AI가 예상보다 빠르게 논증을 발전시켰다고 전했다. 다만 현재까지 외부 수학자들의 정밀 검증은 이뤄지지 않았다. 리만 가설 연구 권위자인 브라이언 콘리는 AFP에 “인류 역사상 기념비적 순간”이라며 “내 생각엔 수학사에서 일어난 일 중 정말 가장 큰 사건”이라고 평가했다. 다만 논문 원고가 아닌 알포게의 웹사이트 게시글만 확인했다고 덧붙였다. AI 수학 능력 시험대…오픈AI도 난제 해결 주장 킷 예이츠 영국 배스대 교수 역시 “검증을 통과한다면 수학과 AI의 역량에 대한 우리의 이해 모두에 엄청난 파장을 낳을 것”이라고 내다봤다. 네스토르 기옌 뉴욕대 객원교수는 알포게가 증명을 완전히 이해하지 못했다고 인정한 점에 주목했다. AI가 모든 것을 독자적으로 해결하는 존재라기보다 인간의 연구를 돕는 도구로 기능했다는 해석이다. AI를 활용한 수학 난제 해결 주장은 이번이 처음은 아니다. 경쟁사 오픈AI도 지난 9월 유체의 움직임을 설명하는 ‘나비에-스토크스 문제’의 해법을 개발했다고 발표했다. 당시 관련 연구를 진행하던 알포게는 오픈","category":"IT 과학"},{"title":"[어바웃 C] LGU+ 홍범식 유임…AI 성과 속 신뢰 회복은 과제","link":"https://n.news.naver.com/mnews/article/293/0000093627","naverLink":"https://n.news.naver.com/mnews/article/293/0000093627","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"기업 최고 의사결정권자(CEO, CFO, COO, CIO 등)의 행보에서 투자 인사이트를 얻어 가세요. 서울 용산구 LG유플러스 사옥(왼쪽)과 홍범식 LG유플러스 대표 /생성형AI(구글 제미나이)의 도움을 받아 제작한 그래픽입니다. LG그룹이 최근 사장단 인사를 발표하고 홍범식 LG유플러스 대표 체제에 다시 한번 힘을 실었다. 이에 따라 홍 대표가 그간 추진해 온 통신 본업 경쟁력 강화 속 인공지능(AI) 중심의 사업구조 전환이 더욱 탄력을 받을 전망이다. 특히 구광모 LG그룹 회장의 '안정 속 AI 실행력 강화' 기조 속 지휘봉을 지킨 홍 대표는 취임 첫해 영업이익 반등을 이끈 데 이어 AI 데이터센터(AIDC) 등 미래 성장 사업의 외형을 키우면서 '전략통'의 면모를 입증했다는 평가가 나온다. 다만 올해 임금·단체협약을 둘러싼 노동조합(노조)과의 갈등과 지난해 해킹 사건 은폐 의혹 관련 논란은 홍 대표가 풀어야 할 과제로 꼽힌다. 구광모의 '전략통' 통했다…실적 반등에 AI 신사업까지 본궤도 홍 대표는 2024년 말 대표이사 후보로 선임된 이후 2025년 3월 정식 취임한 만큼 내년이면 취임 3년 차에 접어든다. 1968년생인 그는 미국 서던캘리포니아대(USC) 경영학과를 졸업하고 컬럼비아대에서 경영학 석사 학위를 취득했다. 모니터그룹과 SK텔레콤(SKT) 사업전략실장 등을 거쳐 글로벌 컨설팅 기업 올리버와이만과 베인앤드컴퍼니에서 경력을 쌓았다. 베인앤드컴퍼니에서는 아시아태평양지역 정보통신·테크놀로지 부문 대표와 글로벌디렉터, 한국 대표 등을 역임했다. 2019년에는 LG그룹에 합류해 지주사인 ㈜LG 경영전략부문장을 맡았다. 구 회장 취임 이후 그룹의 사업 포트폴리오를 재편하고 미래 성장동력을 발굴하기 위해 외부에서 영입한 대표적인 전략 전문가로 꼽힌다. 통신·미디어·기술 분야에서 축적한 산업 이해도에 더해 중장기 사업 전략과 인수합병(M&A) 경험을 두루 갖췄다는 점이 강점으로 평가됐다. LG유플러스와의 인연은 대표 취임 이전부터 이어졌다. 2022년 LG유플러스와 LG헬로비전의 기타비상무이사를 맡으며 통신 계열사의 주요 경영 현안에 참여했다. 그룹 차원의 사업 전략을 담당하면서 계열사 간 시너지를 모색한 경험이 대표 선임으로 이어졌다는 분석이다. LG유플러스 연간 영업이익 추이(단위:억원) /챗GPT의 도움을 받아 시각화하고 기자가 최종 검토·확인해 제작한 그래픽입니다. 그래픽에 포함된 데이터와 내용은","category":"IT 과학"},{"title":"\"AI로 167년 난제 풀었다\" 앤트로픽 수학자의 '리만 가설' 증명, MIT 검증 프로그램 통과","link":"https://n.news.naver.com/mnews/article/003/0014337502","naverLink":"https://n.news.naver.com/mnews/article/003/0014337502","pubDate":"2026-11-21T12:00:00+09:00","author":"네이버뉴스","description":"앤트로픽 소속 레벤트 알포게, 클로드와 협업해 '리만 가설' 증명 주장 '린' 작성 1700만줄 코드 공개… MIT 수학과 선임연구원 독립 검사 프로그램 통과 상금 100만 달러 걸린 '밀레니엄 난제'…수학계 최종 검증 남아 [서울=뉴시스] 사진은 인공지능(AI). 기사의 이해를 돕기 위한 이미지. (사진=유토이미지) 2026.10.10. photo@newsis.com *재판매 및 DB 금지 [서울=뉴시스]윤정민 기자 = 미국 인공지능(AI) 기업 앤트로픽 소속 수학자가 자사 AI 모델 '클로드(Claude)'와 함께 167년 동안 풀리지 않았던 수학계 최고 난제 '리만 가설'의 증명을 찾아냈다고 주장했다. 공개된 증명 코드는 이미 외부 학자의 검증 프로그램을 통과하며 신빙성을 높이고 있다. 남은 추가 검증까지 모두 통과해 국제 수학계가 이를 공식 인정한다면, AI가 인류 역사상 가장 어려운 학술 난제를 해결하는 데 결정적 역할을 한 기념비적인 사례가 된다. 레벤트 알포게 앤트로픽 연구원은 20일(현지 시간) 개인 블로그를 통해 \"클로드와 함께 작업해 리만 가설의 증명을 발견했다고 믿는다\"고 밝혔다. 소수의 비밀 쥔 167년 묵은 '리만 가설'…상금 13억5000만원 걸린 밀레니엄 난제 리만 가설은 독일의 천재 수학자 베른하르트 리만이 지난 1859년 세상에 내놓은 수학 문제다. 2, 3, 5, 7, 11처럼 1과 자기 자신으로만 나누어 떨어지는 1보다 큰 자연수를 '소수'라고 부른다. 소수가 나타나는 간격은 불규칙하지만, 특정 숫자 아래에 소수가 몇 개나 있는지 대략적인 개수는 공식으로 어림잡을 수 있다. 리만 가설이 참으로 증명되면 이 어림값이 실제 소수 개수와 얼마나 차이 나는지 더 정밀하게 파악할 수 있다. 리만은 소수의 분포 규칙을 연구하다 '리만 제타 함수'라는 복잡한 수식에 주목했다. 이 수식의 계산값이 '0'이 되는 지점들 가운데 소수 분포와 연결된 지점들이 모두 똑바른 한 세로선 위에 나란히 놓인다는 것이 가설의 핵심이다. 클레이수학연구소에 따르면 처음 10조개를 계산해 보니 모두 그 선 위에 있었다. 가설을 증명하려면 그 뒤로도 예외가 없다는 사실을 보여야 한다. 이에 클레이수학연구소는 2000년 리만 가설을 '밀레니엄 난제' 7개 중 하나로 선정하고 해법에 상금 100만 달러(약 13억5000만원)를 걸었다. [서울=뉴시스] 레벤트 알포게 앤트로픽 연구원은 20일(현지 시간) 개인 블로그를","category":"IT 과학"}]},"popular":[]}}}; // UPDATED_AUTOMATICALLY_BY_NEWS_WORKFLOW

try{saved=JSON.parse(localStorage.getItem("tdn_saved")||"[]");if(!Array.isArray(saved))saved=[];}catch(e){saved=[];}
const $=s=>document.querySelector(s);
function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}
$("#today").textContent=compactDate(seoulDateKey(new Date()));
function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(!showPopular&&category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-popular="1" class="'+(showPopular?'active':'')+'">네이버 인기</button><button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
function dateOffsetKey(key,offset){
 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);
 return seoulDateKey(d);
}
function drawDateTabs(){
 const days=window.dailyDays||[];
 const todayKey=seoulDateKey(new Date());
 const yesterdayKey=dateOffsetKey(todayKey,-1);
 const today=days.find(d=>d.date===todayKey);
 const yesterday=days.find(d=>d.date===yesterdayKey);
 const options=[{key:"today",label:"오늘 · "+compactDate(todayKey)},{key:"yesterday",label:compactDate(yesterdayKey)},{key:"all",label:"전체 날짜"}];
 $("#date-tabs").innerHTML=options.map(o=>'<button type="button" data-day="'+o.key+'" class="'+(dayFilter===o.key?'active':'')+'">'+esc(o.label)+'</button>').join('');
}
async function load(){
  const todayKey=seoulDateKey(new Date());
  window.dailyLoading=false;
  const data=window.NEWS_DATA;
  if(!data||!data.days||!data.days.today){
    $("#count").textContent="오늘 뉴스 데이터 준비 중";
    $("#feed").innerHTML='<div class="empty">오늘 뉴스 데이터를 준비하고 있어요.<br>잠시 후 다시 열어 주세요.</div>';
    return;
  }
  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
