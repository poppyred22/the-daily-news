"목숨줄 같은 존재\"라고 말했다. 세계일보는 에서 기존 SNS 활동에 유튜브 방송까지 더해지는 점을 우려했다. \"견제 없는 일방적 메시지 전달에 얼마나 많은","category":"사건 사고"},{"title":"난폭운전 후 \"가만 안 둬\" 경찰까지 위협한 50대 운전자","link":"https://n.news.naver.com/mnews/article/008/0005437929","naverLink":"https://n.news.naver.com/mnews/article/008/0005437929","pubDate":"2026-11-07T11:19:52.798902+09:00","author":"네이버뉴스","description":"난폭운전 후 \"가만 안 둬\" 경찰까지 위협한 50대 운전자. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"“‘검사 수사권 선택적 부활’은 위헌”…법조계, 조작기소 특검법에 거센 반발","link":"https://n.news.naver.com/mnews/article/022/0004173222","naverLink":"https://n.news.naver.com/mnews/article/022/0004173222","pubDate":"2026-11-07T11:19:52.798889+09:00","author":"네이버뉴스","description":"‘조작기소 특검법’이 더불어민주당 주도로 6일 여당 주도로 국회 본회의를 통과한 가운데 법조계 안팎에서 반발이 거세다. 지난달 2일 개정 형사소송법 시행과 함께 검사의 수사권이 폐지된 상황에서 조작기소 특검법이 파견검사의 수사권과 지휘권은 종전 형사소송법을 따라 부활시켰다는 점을 두고 “위헌 소지가 높다”는 비판이다. 7일 법조계에 따르면 법원행정처는 조작기소 특검법안 검토 의견서에서 “10월2일 형사사법절차 개편이 이뤄졌음에도 제정안은 수사·기소 분리와 관련된 사항이 반영돼 있지 않아 이를 반영할 필요가 있다”고 밝혔다. 이밖에도 △이의신청 규정의 부재 △공소유지 변호사 도입 △이례적인 영장재판의 전속관할(서울중앙지법)·영장전담법관 보임 △수사과정 언론브리핑에 따른 피의사실 공표 등이 위헌 요소가 될 여지가 있다는 지적이 담겼다. 6일 서울 여의도 국회에서 열린 제439회(정기회) 12차 본회의에서 윤석열 정권 검찰청, 국가정보원, 감사원 등 조작수사·조작기소 등 의혹의 진상규명을 위한 특별검사 임명 등에 관한 법률안이 더불어민주당 등 여권 주도로 통과되고 있다. 뉴시스 특히 이의신청 규정의 부재를 두고는 “수사대상이 된 자는 특별검사가 직무범위를 벗어난 수사 등을 하는 경우 법원에 이의신청을 할 수 있도록 규정하고 있는데, 이는 공정하고 객관적인 수사가 이뤄질 수 있도록 보완장치로 기능한다”는 헌법재판소의 결정례를 들었다. 이원석 전 검찰총장은 전날 입장문을 내고 “(정부 여당은) 수사하는 사람이 기소까지 하게 되면 확증편향에 빠져 수사 대상자의 인권을 침해한다면서 아예 검찰을 폐지했다”며 “그러나 ‘공소취소를 위한 특검’을 도입하면서 그 특검에는 수사와 기소 권한을 통째로 부여했다”고 비판했다. 또 “민주당이 수사 대상을 정하고 대통령이 임명하는 특검만은 민주당의 ‘수사-기소 원칙'의 예외”라며 “심지어 폐지된 형사소송법상 검사의 권한을 소급 적용하기까지 한다. 나에게, 우리 편에 유리한 형사사법 시스템을 창설한 것”이라고 했다. 그는 “특검법은 대통령과 그 측근들만 예외로 재판받지 않고 공소취소로 가는 길을 활짝 열어두고 있다”며 “이는 사회적 특수계급을 따로 만들고 인정하는 것으로 헌법상 평등의 원칙에 반한다. 누구도 자기 사건의 재판관이 될 수는 없다”고 강조했다. 이 전 총장은 아울러 “사법권은 독립된 사법부에 속한다”며 “행정권에 속하는 수사기관, 그것도 재판절차가 일시 중지된 대통령이 임명하는","category":"사건 사고"},{"title":"안일했던 스토킹 대응, 결국 참극…정말 `국민 위한` 수사기관 개편 맞나[사사건건]","link":"https://n.news.naver.com/mnews/article/018/0006405474","naverLink":"https://n.news.naver.com/mnews/article/018/0006405474","pubDate":"2026-11-07T11:19:52.798887+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"\"3~4세 의대반? 아동 학대로 구속해야\" 일타강사의 일침","link":"https://n.news.naver.com/mnews/article/079/0004207453","naverLink":"https://n.news.naver.com/mnews/article/079/0004207453","pubDate":"2026-11-07T11:19:52.798872+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"},{"title":"“이번엔 한국도 못 피해”…지구에 시뻘건 큰 줄, 올 겨울 역대 최강 엘니뇨 온다는데","link":"https://n.news.naver.com/mnews/article/011/0004679710","naverLink":"https://n.news.naver.com/mnews/article/011/0004679710","pubDate":"2026-11-07T11:19:52.798866+09:00","author":"네이버뉴스","description":"“이번엔 한국도 못 피해”…지구에 시뻘건 큰 줄, 올 겨울 역대 최강 엘니뇨 온다는데. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"조국마저도 “조작기소 특검, 문제 있다”","link":"https://n.news.naver.com/mnews/article/021/0002830971","naverLink":"https://n.news.naver.com/mnews/article/021/0002830971","pubDate":"2026-11-07T11:19:52.798851+09:00","author":"네이버뉴스","description":"조국마저도 “조작기소 특검, 문제 있다”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"李대통령 장남, '황제 골프' 의혹 제기한 주진우 고소…경찰 수사 착수","link":"https://n.news.naver.com/mnews/article/015/0005351230","naverLink":"https://n.news.naver.com/mnews/article/015/0005351230","pubDate":"2026-11-07T11:19:52.798849+09:00","author":"네이버뉴스","description":"서울경찰청, 이동호씨 고소 사건 광수단 배당 주진우, 대통령 가족 골프·헬기 이용 의혹 제기 이씨 \"골프장 간 적 없어\"…관련 의혹 전면 부인 주진우 의원 / 사진=연합뉴스 이재명 대통령의 장남 이동호씨가 대통령 가족의 '황제 골프' 의혹을 제기한 주진우 국민의힘 의원을 고소하면서 경찰이 수사에 나섰다. 이씨는 지난해 여름휴가 당시 해군기지 내 골프장을 방문하거나 골프를 친 사실이 없다며 주 의원의 주장을 부인하고 있다. 6일 서울경찰청에 따르면 경찰은 이씨가 주 의원을 상대로 제기한 명예훼손 고소 사건을 광역수사단에 배당했다. 이씨는 전날 서울경찰청에 고소장을 제출했다. 이번 사건은 주 의원이 지난달 29일 국회 소통관에서 제기한 의혹에서 비롯됐다. 주 의원은 이 대통령이 지난해 8월 여름휴가 기간 장남 부부와 함께 진해 해군기지 내 한산대CC에서 골프를 쳤다고 주장했다. 골프를 마친 뒤에는 저도 숙소까지 헬기로 이동했다는 의혹도 제기했다. 당시 주 의원은 헬기장에 정박해 있던 헬기라고 주장하는 사진을 공개했다. 이 대통령 부부에 대해서는 직권남용과 횡령 등 혐의로 서울경찰청에 고발장을 제출했다. 해당 고발 사건 역시 광역수사단에서 수사하고 있다. 반면 이씨는 주 의원이 제기한 의혹이 사실과 다르다는 입장이다. 이씨는 고소장을 통해 \"여름휴가 기간 중 한산대CC에 간 사실이 없고, 그곳에서 골프를 친 사실도 없다\"고 반박했다. 경찰은 고소장 내용을 검토한 뒤 이씨 등 관련자들을 불러 사실관계를 확인할 것으로 보인다. 주 의원이 제기한 대통령 부부 관련 고발 사건과 이씨의 명예훼손 고소 사건은 모두 서울경찰청 광역수사단에 배당된 상태다.","category":"사건 사고"},{"title":"행안장관 \"김종철, 경찰개혁에 대한 강력한 의지 높이 평가\"(종합)","link":"https://n.news.naver.com/mnews/article/001/0016426956","naverLink":"https://n.news.naver.com/mnews/article/001/0016426956","pubDate":"2026-11-07T11:19:52.798843+09:00","author":"네이버뉴스","description":"경찰청장에 김종철 차장 임명제청…\"현장 치안·정책 총괄 두루 경험\" \"치안정감 중 청장 후보자 나올 때까지 기다려…국경위서 충분한 논의\" 질문에 답하는 김종철 경찰청장 후보자 (서울=연합뉴스) 서명곤 기자 = 신임 경찰청장 후보자인 김종철 경찰청 차장이 6일 서울 서대문구 국가경찰위원회에서 열리는 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하며 취재진의 질문에 답변하고 있다. 2026.11.6 seephoto@yna.co.kr (서울=연합뉴스) 차민지 기자 = 윤호중 행정안전부 장관은 6일 김종철 경찰청장 후보자에 대해 \"현장 치안은 물론 자치경찰·인사·정보 등 정책 총괄 기능을 두루 경험했다\"며 \"형사사법체제 개편 및 경찰개혁이라는 시대적 과제 수행을 위한 거시적 안목도 겸비하고 있다\"고 평가했다. 윤 장관은 이날 브리핑에서 제25대 경찰청장에 김종철 현 경찰청 차장(치안정감)을 임명 제청한다고 밝힌 뒤 이같이 설명했다. 윤 장관은 김 후보자가 \"뛰어난 기획 능력과 업무추진력으로 대내외의 인정을 받고 있다\"고 강조했다. 이어 \"풍부한 경험과 조직관리 능력을 바탕으로 국민의 생명·신체와 재산을 보호하고 공공의 안녕과 질서를 유지하는 경찰의 임무를 충실하게 수행할 수 있는 적임자로 판단했다\"고 덧붙였다. 윤 장관은 김 후보자를 발탁한 가장 중요한 기준을 묻자 \"청장 직무대행으로서 경찰청을 이끌어오면서 보여준 리더십과 경찰개혁에 대한 강력한 의지를 (높이) 평가했다\"고 답했다. 경찰청장 직무대행 체제가 길어진 배경에 대해서는 \"지난해 12월 조지호 전 청장에 대한 파면 결정이 났지만, 당시 치안정감 대부분이 정년을 앞두고 있었고 일부는 내란 관련 재판을 받거나 의혹이 제기된 상황이어서 즉시 임명이 어려웠다\"고 설명했다. 이어 \"경찰은 계급제로 운영되는 만큼 치안정감 중에서 경찰청장 후보자가 나올 때까지 기다릴 수밖에 없는 구조\"라고 덧붙였다. 치안감에서 치안총감으로 두 계급을 한꺼번에 승진시킬 수 없는 만큼, 경찰청장 후보가 될 새로운 치안정감 승진자가 나올 때까지 기다려야 했다는 취지다. 김종철 경찰청장 후보자 임명제청 관련 브리핑하는 행안부 장관 (서울=연합뉴스) 안정원 기자 = 윤호중 행정안전부 장관이 6일 서울 종로구 정부서울청사에서 김종철 경찰청장 후보자 임명제청 관련 브리핑을 하고 있다. 2026.11.6 jeong@yna.co.kr","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T11:19:53.358693+09:00","author":"네이버뉴스","description":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"독일, ‘소수·지역 정당 출신’ 대통령으로 국민 통합 노려","link":"https://n.news.naver.com/mnews/article/022/0004173223","naverLink":"https://n.news.naver.com/mnews/article/022/0004173223","pubDate":"2026-11-07T11:19:53.075316+09:00","author":"네이버뉴스","description":"CSU 소속 아이그너 바이에른 州의회 의장 원내 44석 불과 소수당에 지역 정당 ‘한계’ 확정되면 ‘첫 여성 대통령’ 영예도 안게 돼 독일 연립정부가 ‘차기 대통령은 여성이어야 한다’는 원칙을 확인한 가운데 연정 내 소수당인 기독사회당(CSU) 소속 인사가 가장 유력한 후보로 떠올랐다. CSU는 독일 남부 바이에른주(州)에서만 활동하는 지역 정당으로, 자매 정당인 기독민주당(CDU)과 손잡고 오랫동안 독일 보수 진영의 목소리를 대변해왔다. 의원내각제 국가인 독일에서 대통령은 의례적·상징적 국가원수 노릇에 그치나, 이제껏 남성들만 맡아 왔다는 점에서 여성 대통령 탄생은 남다른 의미를 갖는다. 독일의 차기 대통령으로 유력시되는 일제 아이그너(61) 바이에른 주의회 의장. 소수당이자 바이에른 지역 정당인 CSU 소속이다. 당선이 확정되면 독일 역사상 첫 여성 대통령으로 기록된다. AFP연합뉴스 6일(현지시간) AFP 통신에 따르면 CDU/CSU 연합 지도부는 바이에른 주의회 일제 아이그너(61) 의장을 차기 대통령으로 추대하는 방안에 뜻을 모았다. 지도부 관계자는 AFP에 “CDU 대표인 프리드리히 메르츠 총리도 아이그너를 지지한다는 입장”이라고 전했다. 이에 따라 오는 9일 CDU/CSU 연석 회의에서 최종 승인만 이뤄지면 아이그너는 2027년 1월30일로 예정된 대통령 선거에서 당선이 확실시된다. 독일 대선은 연방의회 하원의원 및 16개주 대표들로 구성된 선거인단에 의한 간선제로 실시된다. 사회민주당(SPD) 출신 프랑크발터 슈타인마이어(71) 현 대통령의 임기는 2027년 3월18일 끝난다. 현재 독일은 원내 1당인 CDU/CSU 연합(208석)이 주도하고 여기에 3당인 SPD(120석)가 참여하는 형태의 연정을 운영하고 있다. CDU/CSU 연합 208석 중 전국 정당인 CDU가 164석, 바이에른주에만 후보를 내는 CSU는 44석이다. 소수당인 CSU가 대통령을 배출한다는 것은 다수당인 CDU가 크게 양보한 결과로 풀이된다. CSU 대표인 마르쿠스 죄더 바이에른주 총리가 메르츠를 끈질기게 설득한 것이 결국 주효했다는 분석이 제기된다. 죄더는 오래전부터 아이그너를 차기 대통령감으로 점찍고 메르츠 등 CDU 지도부와 협상을 벌여왔다. 메르츠는 애초 다수당인 CDU의 ‘기득권’을 강조했으나, CDU/CSU 연합 유지와 국민 통합 등 여러 효과를 감안해 결국 소수당이자 지역 정당 출신 대통령 탄생 쪽으로 돌아섰다.","category":"사회"},{"title":"‘얼음 아가씨’ 자리에 앉은 충성파 새 실장 “트럼프 위해 싸워야” …美우선주의 ‘마이웨이’ 고수 의지","link":"https://n.news.naver.com/mnews/article/021/0002831011","naverLink":"https://n.news.naver.com/mnews/article/021/0002831011","pubDate":"2026-11-07T11:19:52.798924+09:00","author":"네이버뉴스","description":"‘강경 이민정책 설계자’ 스티븐 밀러 부실장서 실장 승진 트럼프, 강경 충성파 기용하며 기존 정책기조 고수 의지 밀러 “힘이 국제질서 좌우” 제국주의적 세계관 밝혀와 신임 백악관 비서실장으로 임명된 스티븐 밀러(왼쪽). UPI=연합뉴스 자료사진. 스티븐 밀러(41) 미국 백악관 신임 비서실장은 6일(현지시간) 트럼프 대통령에 대해 “미 역사상 가장 획기적인 변화를 이끌어낸 정치 지도자”라고 극찬했다. 그는 이날 엑스(X)를 통해 “온 마음을 다해 대통령을 지지하고 위대한 공화국을 지키기 위해 싸워야 한다”라고 말했다. 도널드 트럼프 미국 대통령은 이날 백악관 첫 여성 비서실장으로 ‘얼음 아가씨’라는 닉네임으로 불렸던 수지 와일스(69)를 경질하고 ‘총리’라는 별칭으로 불려온 강경 충성파인 밀러 백악관 부비서실장을 그 자리에 앉혔다. 중간선거 패배 사흘 만에 밀러를 비서실장에 낙점한 것은 중간선거 참패에도 ‘마이웨이’를 고수하겠다는 의지를 뚜렷이 한 것으로 분석됐다. 밀러는 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 트럼프가 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것으로 보인다. 트럼프 측근들 사이에서 ‘총리’라는 별칭으로 불려온 밀러는 1기 행정부 때부터 선임고문으로 백악관을 지켰다. 2020년 트럼프 대통령의 대선 패배 이후에도 곁을 떠나지 않다 2기 행정부 들어 백악관 부비서실장으로 발탁된 측근 중의 측근으로 백악관에서 만난 아내 케이티 밀러와 함께 워싱턴 정가의 파워 커플로 불렸다.밀러는 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 ‘좌파 척결’에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 그가 임명되자마자 민주당 지도부가 맹폭을 퍼붓는 것은 그런 이유에서다. 당장 민주당 지도부는 이번 인선을 “최악의 선택”이라 비난하며 밀러 신임 실장에 대한 의회 차원의 조사를","category":"사회"},{"title":"차에서 폰 썼다고 “미친X”…초등생 머리 피범벅 만든 태권도 관장","link":"https://n.news.naver.com/mnews/article/025/0003563484","naverLink":"https://n.news.naver.com/mnews/article/025/0003563484","pubDate":"2026-11-07T11:19:52.798922+09:00","author":"네이버뉴스","description":"폭행 피해 아동의 머리 부위 상처 모습. 사진 스레드 캡처 차량 내에서 휴대전화를 사용했다는 이유로 초등학생 제자의 머리를 휴대전화로 내려쳐 다치게 한 40대 태권도장 관장이 경찰에 입건됐다. 진주경찰서는 아동복지법상 아동학대 혐의로 경남 진주시 한 태권도장 관장 40대 A씨를 조사 중이라고 지난 5일 밝혔다. A씨는 지난달 29일 오후 6시50분쯤 태권도장 차량을 운전해 원생들을 하원시키던 중 조수석에 탄 초등학교 4학년 원생 B군의 머리를 휴대전화로 10차례가량 때린 혐의를 받고 있다. A씨는 B군이 차량 내 휴대전화 사용 금지 규칙을 어겼다는 이유로 이 같은 행동을 한 것으로 전해졌다. 당시 차량 뒷좌석에는 중학교 2학년생인 B군 누나를 비롯한 다른 원생들도 함께 타고 있었던 것으로 확인됐다. 사건은 B군 누나가 휴대전화로 당시 상황을 촬영하고 소셜미디어(SNS)에 폭행 내용이 담긴 글과 영상이 올라오면서 알려졌다. 공개된 영상에서 A씨로 추정되는 남성은 B군을 향해 “미친X이네 이거”, “돌았어?”, “장난하는 것 같아?” 등 욕설과 폭언을 쏟아냈다. 이어 “손 내려라”, “뭘 잘했다고 울어”라고 소리친 뒤 “내일 반성문 10장 써와. A4용지에 빼곡하게”라고 요구했다. B군은 울먹이며 “아닙니다”라는 말을 반복했고 이 과정에서 무언가를 때리는 듯한 소리가 여러 차례 이어졌다. B군 어머니 C씨는 지난 6일 JTBC ‘사건반장’에 사건 당일 집 앞에 선 차량에서 아들이 머리를 부여잡고 내렸고 머리에서는 피가 흐르고 있었다고 설명했다. C씨가 경위를 묻자 누나는 “태권도 관장님이 동생을 때렸다”고 했고 C씨는 즉시 태권도장에 전화를 걸어 항의한 뒤 응급실로 이동했다. B군은 머리를 네 바늘 꿰매는 치료를 받았다. C씨는 ‘사건반장’에 “믿고 의지했던 학원에서 이런 일이 벌어져 너무나 충격이고 배신감이 든다”며 “아들이 원형탈모 치료를 받고 있는데 이번 일로 트라우마가 더 심해질까 걱정된다”고 호소했다. 논란이 커지자 A씨는 “아이를 지도하고 보호해야 할 어른으로서 감정을 다스리지 못하고 해서는 안 될 행동을 했다”며 “학생과 부모님께 진심으로 사과드린다”고 말한 것으로 전해졌다. 진주경찰서는 아동복지법상 아동학대 혐의로 A씨를 입건하고 정확한 사건 경위를 조사 중이라고 밝혔다.","category":"사회"},{"title":"[사실은] 중국 어선이 한반도 포위? 따져 보니…","link":"https://n.news.naver.com/mnews/article/055/0001401322","naverLink":"https://n.news.naver.com/mnews/article/055/0001401322","pubDate":"2026-11-07T11:19:52.798914+09:00","author":"네이버뉴스","description":"최근 소셜미디어(SNS)를 중심으로 중국 어선들이 서해와 제주도 근처 바다에 이른바 '장벽'을 세우고 있다는 주장이 빠르게 퍼졌습니다. \"서해뿐 아니라 제주도까지 장벽을 세우는 중국\"이라는 문구와 함께, 한반도 주변 바다에 배를 뜻하는 걸로 보이는 표시가 빼곡히 찍힌 지도 사진도 올라왔습니다.","category":"사회"},{"title":"\"어머니·할머니 때려놓고\"...베란다 창문으로 다시 들어온 30대","link":"https://n.news.naver.com/mnews/article/666/0000130988","naverLink":"https://n.news.naver.com/mnews/article/666/0000130988","pubDate":"2026-11-07T11:19:52.798912+09:00","author":"네이버뉴스","description":"접근 금지 조치에도 닷새 만에 무단 침입...지인 집 들어가 절도까지 법원, “범행 인정하고 반성 참작”...징역 10개월에 집행유예 2년 선고 법원 로고. 클립아트코리아 모친과 외조모를 때려 법원의 즉시 퇴거 및 접근금지 임시조치를 받고도 이를 비웃듯 닷새 만에 가족들에게 다시 접근한 30대가 징역형 집행유예를 선고받았다. 7일 연합뉴스에 따르면 춘천지법 형사3단독 박동욱 판사는 가종폭력범죄의 처벌 등에 관한 특례법 위반 혐의로 재판에 넘겨진 A씨(37)에게 최근 징역 10개월에 집행유예 2년을 선고했다. 박 판사는 또 보호관찰 8개월과 함께 120시간의 사회봉사 명령도 함께 판결했다. A씨는 지난 6월 자신의 어머니와 외할머니를 폭행한 혐의로 격리조치됐다. 당시 법원은 A씨에게 주거지에서 퇴거하고 일체의 접근 및 연락을 금지하는 임시조치 결정을 내렸다. 그러나 A씨는 법원 결정이 있은 지 닷새 만에 베란다 창문을 통해 집 안에 몰래 들어갔다. A씨의 범행은 가정폭력뿐안 아니었다. 그는 지난 6월 알고 지내던 B씨의 집 현관 잠금장치를 부순 뒤 내부로 무단 침입했다. 이어 거실에 있던 B씨의 가방에서 차량 스마트키와 신용카드 6장을 훔쳤다. 박 판사는 “존속폭행으로 임시조치 결정받았음에도 이를 위반해 가족들에게 접근했고, 지인의 주택에 침입해 물품을 훔치는 등 죄질이 매우 불량하다”며 “피해자들과 원만히 합의하지 못한 점도 불리한 정상”이라고 지적했다. 이어 “피고인이 자신의 범행을 모두 인정하고 반성하는 태도를 보이는 점 등을 종합적으로 고려해 형을 정했다”라고 덧붙였다.","category":"사회"},{"title":"코인 싸게 판다더니 1억 챙겨 도주…도박·유흥비로 탕진","link":"https://n.news.naver.com/mnews/article/021/0002831014","naverLink":"https://n.news.naver.com/mnews/article/021/0002831014","pubDate":"2026-11-07T11:19:52.798910+09:00","author":"네이버뉴스","description":"AI 생성 이미지 가상화폐를 시세보다 저렴하게 판매하겠다고 속여 구매자들로부터 현금 1억 원을 받아 달아난 20대 남성이 구속 상태로 검찰에 넘겨졌다. 이 남성은 가로챈 돈을 도박과 유흥비 등으로 모두 탕진한 것으로 조사됐다. 경기 일산동부경찰서는 사기 혐의로 20대 남성 A 씨를 구속 송치했다고 7일 밝혔다. 경찰에 따르면 A 씨는 지난달 7일 오후 5시쯤 경기 고양시의 한 카페에서 코인 직거래를 빌미로 피해자 2명에게 현금 1억 원을 받아 챙긴 뒤 도주한 혐의를 받는다. 그는 지인을 통해 알게 된 피해자들에게 자신이 특정 코인 관련 업무에 종사하고 있다며 현금으로 거래하면 코인을 시세보다 싸게 구매할 수 있다고 접근한 것으로 파악됐다. 다만 A 씨가 실제 해당 코인과 관련된 일을 했는지는 확인되지 않았다. 피해자 2명은 각각 현금 5000만 원을 마련해 A 씨와 약속한 카페에서 만났다. A 씨는 이들로부터 돈을 건네받은 뒤 음료를 주문하고는 주차를 하고 오겠다며 자리를 떠 그대로 달아난 것으로 조사됐다. 범행 이후 A 씨는 경찰의 추적을 피하기 위해 휴대전화까지 해지한 것으로 드러났다. 그는 경찰 조사에서 범행을 인정했으며, 피해자들로부터 가로챈 1억 원은 도박과 유흥비 등에 모두 사용한 것으로 전해졌다.","category":"사회"},{"title":"\"국장 대신 미국서 3배 먹을래\"…간 큰 서학개미 몰려간 곳은","link":"https://n.news.naver.com/mnews/article/018/0006405469","naverLink":"https://n.news.naver.com/mnews/article/018/0006405469","pubDate":"2026-11-07T11:19:52.798908+09:00","author":"네이버뉴스","description":"\"국장 대신 미국서 3배 먹을래\"…간 큰 서학개미 몰려간 곳은. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"北 해킹 IP 알아도 못 잡는다… \"추적 1~2년, 검거는 미지수\"","link":"https://n.news.naver.com/mnews/article/053/0000062887","naverLink":"https://n.news.naver.com/mnews/article/053/0000062887","pubDate":"2026-11-07T11:19:52.798898+09:00","author":"네이버뉴스","description":"지난 10월 4일 서울 종로구 정부서울청사에서 열린 금융권 침해사고 관련 긴급 점검회의에서 조용병 은행연합회장(가운데)을 비롯한 참석자들이 생각에 잠겨 있다. photo 뉴스1 최근 국내 금융권을 겨냥한 해킹 시도에서 북한 IP(인터넷 프로토콜)가 대거 확인됐지만, 범인 추적과 검거로 이어질 가능성은 낮다는 지적이 나온다. IP 주소만으로는 공격 주체를 입증하기 어려운 데다, 탈취 자금이 가상자산 세탁 과정을 거치면 추적이 사실상 끊기기 때문이다. 전문가들은 수사에 최소 1~2년이 걸릴 것으로 전망하고, 더 큰 문제로 이런 해킹이 금융권에 그치지 않는다는 점을 짚었다. 해킹으로 인한 가장 큰 위협은 국방 분야이며, 해킹 피해가 국방 영역으로 번지기 전에 정부 차원의 근본적 해법이 필요하다는 목소리가 나온다. 금융보안원은 지난 10월 21일 오전 3시부터 북한에 다수 할당된 IP 대역에서 금융권을 향한 스캔성 접근이 대량 탐지됐다고 밝혔다. 공문 발송 시점까지 탐지된 접근은 약 440만건이다. 스캔성 접근은 시스템의 취약점이나 열려 있는 네트워크 포트를 찾기 위한 사전 탐색 행위다. 다만 금융 당국은 해당 IP를 통한 접근이 실제 시스템 침입이나 정보 유출 등 피해로 이어진 사례는 확인되지 않았다고 밝혔다. 금융감독원은 \"국가를 특정할 수 없거나 우회 가능성이 있는 경우가 많아 해석에 유의해야 한다\"고 공지했다. 북한 IP라는 이유만으로 북한 소행이라고 단정하기 어렵다는 입장이다. 문제는 설령 북한 소행이 맞더라도 수사가 사실상 한계에 부딪힌다는 점이다. 이번 금융권 해킹은 경찰청 국가수사본부가 전담팀을 꾸려 수사 중이지만, 전문가들은 가상자산 추적이 복잡하고 여러 번의 세탁을 거치기 때문에 해킹 주체를 특정하기 어렵다고 본다. 작년에 발생한 유사 사건도 수사 결과가 발표된 적이 없다. 이번에도 범인을 특정하지 못한 채 미제로 남을 가능성이 더 크다는 분석이 나온다. 경찰은 신원미상의 공격자를 입건하고 미 연방수사국(FBI)에 공조를 요청했지만, 지난 10월 1일 첫 피해가 알려진 지 한 달이 지나도록 공격 주체를 특정하지 못하고 있다. 2019년 국내 가상자산거래소 '업비트'를 겨냥한 해킹은 경찰이 2024년에야 북한 정찰총국 산하 조직을 배후로 지목했다. 배후를 지목하는 데에만 무려 5년이 걸린 셈이다. 중국에서 북한 IT워커들과 직접 소통해봤다는 한 국내 보안업체 관계자는 \"이들에게 한국의 개인정보는 돈도","category":"사회"},{"title":"\"사지마\" 말리는데도 산다…요즘 SNS 뒤집어놓은 '이 가게' [권용훈의 트렌드워치]","link":"https://n.news.naver.com/mnews/article/015/0005351362","naverLink":"https://n.news.naver.com/mnews/article/015/0005351362","pubDate":"2026-11-07T11:19:52.798894+09:00","author":"네이버뉴스","description":"\"사지마\" 말리는데도 산다…요즘 SNS 뒤집어놓은 '이 가게' [권용훈의 트렌드워치]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T11:19:53.758057+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활·문화"},{"title":"\"최강 한파\" 아침 최저 -6도·일교차 최대 15도…'입동' 뜻과 챙겨 먹으면 좋은 음식 [오늘 날씨]","link":"https://n.news.naver.com/mnews/article/119/0003152402","naverLink":"https://n.news.naver.com/mnews/article/119/0003152402","pubDate":"2026-11-07T11:19:53.758053+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"검은콩·쌀뜨물·식초…미국 패션지가 주목한 ‘한국식 머리 감기’","link":"https://n.news.naver.com/mnews/article/032/0003481212","naverLink":"https://n.news.naver.com/mnews/article/032/0003481212","pubDate":"2026-11-07T11:19:53.758046+09:00","author":"네이버뉴스","description":"해외에서 주목하는 한국식 헤어케어의 핵심은 결국 특별한 비법보다 꾸준하고 세심한 관리에 있다. pexels 세안할 때는 클렌징 오일부터 토너, 세럼, 크림까지 꼼꼼하게 챙기면서 머리 감을 때는 샴푸 하나로 끝내지 않는가. 해외 뷰티업계가 주목하는 한국식 머리 감기는 이런 생각에서 출발한다. 미국 패션잡지 보그는 최근 ‘매끄럽고 윤기 나는 머릿결을 위한 한국식 머리 감기’라는 기사를 통해 K뷰티식 두피 관리법을 소개했다. 기사에 따르면 한국식 헤어케어는 두피를 건강한 모발의 바탕으로 보고, 문제가 생긴 뒤 치료하기보다 평소 관리하는 예방 중심의 접근법이 특징이다. 미국 뉴욕 유니언더마의 피부과 전문의 클레어 장도 한국 뷰티 문화가 두피 관리를 비듬이나 가려움증, 탈모가 생긴 뒤에야 신경 쓰는 영역이 아니라 일상적인 자기관리 일부로 만들었다고 전했다. 가장 먼저 눈에 띄는 것은 두피를 위한 성분이다. 보그는 한국식 헤어케어 제품에 살리실산, 나이아신아마이드, 병풀, 판테놀 등 스킨케어에서 익숙한 성분이 활용된다고 소개했다. 검은콩과 검은깨, 다시마, 쌀뜨물 등 전통적으로 모발 관리에 활용해 온 성분도 언급했다. 최근에는 PDRN과 엑소좀을 활용한 두피 앰플도 등장하고 있다. 물론 이런 성분이 실제 발모나 탈모 예방에 효과가 있는지는 제품별로 별도의 임상적 검증이 필요하다. 머리를 감는 순서에도 신경을 쓴다. 매번 할 필요는 없지만 샴푸 전 두피 스케일러나 각질 제거 제품을 사용해 과도한 피지와 각질, 스타일링 제품 잔여물을 제거하는 것이 첫 단계다. 두피 스케일러는 얼굴의 각질 제거제처럼 두피에 쌓인 묵은 각질과 과도한 피지, 스타일링 제품 잔여물을 씻어내는 전용 제품이다. 살리실산 등 각질 관리 성분을 활용한 제품부터 소금 알갱이가 들어간 스크럽 타입까지 종류가 다양하다. 매일 사용할 필요는 없으며, 지나친 각질 제거는 오히려 두피를 자극할 수 있다. 각질 및 피지 등을 제거한 후 미지근한 물로 두피와 모발을 충분히 적신 뒤 자신의 두피 상태에 맞는 샴푸를 선택한다. 지성 두피라면 과도한 피지와 노폐물 제거에 초점을 맞추고, 민감하거나 건조한 두피라면 자극이 적은 제품을 고르는 식이다. 샴푸할 때는 손톱 대신 손가락 끝으로 두피를 약 1분간 부드럽게 마사지한다. 실리콘 재질의 두피 브러시를 활용하기도 한다. 브러시를 강하게 문지르면 오히려 두피에 자극을 줄 수 있으니 주의한다. 미국피부과학회(AAD) 역시 샴푸는","category":"생활·문화"},{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T11:19:53.758042+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T11:19:53.758031+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T11:19:53.758029+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활·문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T11:19:53.758012+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"생활·문화"},{"title":"기온 뚝 떨어지면 혈압 상승…고혈압인 사람이 주의해야 할 5가지 습관","link":"https://n.news.naver.com/mnews/article/296/0000107013","naverLink":"https://n.news.naver.com/mnews/article/296/0000107013","pubDate":"2026-11-07T11:19:53.758002+09:00","author":"네이버뉴스","description":"기온 낮아지면 혈관 수축하면서 혈액 흐를 때 저항 커져 혈압 상승 기온이 낮아지면 체온 손실을 줄이기 위해 혈관이 수축하면서 혈압이 상승할 수 있다. 사진=게티이미지뱅크 7일은 겨울이 시작되는 입동(立冬). 기온이 뚝 떨어졌다. 이런 시기에는 건강관리에 특히 주의를 기울여야 할 사람들이 있다. 고혈압이 있는 사람들이다. 우리나라의 20세 이상 고혈압 환자는 약 1360여만 명으로 추정된다. 성인 10명 중 3명꼴로 고혈압을 앓고 있는 셈이다. 추워지면 혈압 때문에 병원을 찾는 사람이 늘어난다. 평소엔 안정적이던 수치가 갑자기 치솟거나, 어지럼증이나 두통 같은 증상이 동반되기도 한다. 추위로 인해 혈관이 수축하면서 혈압이 상승한다. 특히 기온이 급격히 떨어지는 늦가을과 겨울에는 혈압 관리에 더욱 주의해야 한다. 고혈압 환자라면 약 복용만큼이나 겨울에 하지 말아야 할 행동을 정확히 아는 것이 중요하다. 일상의 작은 방심이 혈압 급등으로 이어질 수 있기 때문이다. 미국 건강·의료 매체 '메디컬뉴스투데이(MedicalNewsToday)' 등의 자료를 토대로 추운 시기에 혈압이 높은 사람들이 주의해야 할 것들에 대해 알아봤다. 아침에 일어나자마자 찬바람 맞으며 외출 =하루 중 기온이 가장 낮은 때는 아침이다. 이때 따뜻한 실내에서 곧바로 밖으로 나가 찬 공기를 맞으면 혈관이 급격히 수축하며 혈압이 빠르게 오른다. 특히 기상 직후에는 자율신경 조절이 완전히 이뤄지지 않아 심혈관 부담이 더 크다. 외출 전에는 실내에서 옷을 충분히 갖춰 입고, 가볍게 몸을 풀어 체온을 올린 뒤 천천히 나서는 것이 안전하다. '눈 뜨자마자 외출'은 추운 계절에 고혈압 환자가 가장 먼저 피해야 할 행동이다. 뜨거운 물 샤워나 사우나 =추위를 녹이겠다고 갑자기 뜨거운 물에 들어가는 습관도 위험하다. 급격한 온도 변화는 혈관을 갑자기 확장시켰다가 다시 수축시키며 혈압 변동 폭을 키운다. 특히 욕실과 침실의 온도 차가 큰 경우 어지럼이나 심계 항진(두근거림)을 느끼는 사례도 많다. 샤워는 미지근한 물로 시작해 서서히 온도를 올리는 것이 좋다. '확 뜨겁게'가 아니라 '천천히 따뜻하게'가 원칙이다. 과격한 야외 활동 =추울 때 바깥에서 강도 높은 운동이나 작업 등 무리하게 움직이는 행동은 추울 때 고혈압 환자에게 큰 부담이 된다. 추운 환경에서 갑작스럽게 힘을 쓰면 혈압과 심장박동 수(심박수)가 동시에 급상승할 수 있다. 특히 새벽이나 아침 시간대에는","category":"생활·문화"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T11:19:53.358681+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활·문화"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T11:19:52.798920+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활·문화"}],"세계":[{"title":"트럼프, '대선 공신' 와일스 경질... '강경파' 밀러 전면 배치","link":"https://n.news.naver.com/mnews/article/469/0000964178","naverLink":"https://n.news.naver.com/mnews/article/469/0000964178","pubDate":"2026-11-07T11:19:53.075376+09:00","author":"네이버뉴스","description":"의회 내주고도 타협 대신 돌파 反이민 설계자 앞세운 백악관 미 백악관 비서실장에 발탁된 스티븐 밀러(오른쪽). EPA 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거 참패 사흘 만인 6일(현지시간) 수지 와일스 백악관 비서실장을 경질하고, 후임에 강경파 최측근인 스티븐 밀러 백악관 부비서실장을 발탁했다. 선거 패배에 따른 정책 기조 수정 대신 정권 내 최고 강경론자를 전면에 내세워 정면 돌파를 선택했다는 평가가 나온다. 트럼프 대통령은 이날 자신의 사회관계망서비스(SNS)인 트루스소셜을 통해 \"오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다\"고 발표했다. 트럼프 대통령은 밀러를 향해 \"내가 가장 신뢰하는 참모 중 한 명\"이라고 치켜세웠다. 와일스 실장에 대해선 \"훌륭한 일을 해냈고 감사하다\"며 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 했다. 트럼프 대통령은 이후 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 중간선거 패배에 따른 문책성 인사라는 점을 암시했다. 대선 일등공신의 퇴장… 예견된 불화설 도널드 트럼프 2기 미국 행정부의 백악관 비서실장에서 경질된 수지 와일스. AP 연합뉴스","category":"세계"},{"title":"지드래곤 마음도 훔친 차였는데…테슬라 '사이버트럭' 3년 만에 단종 수순","link":"https://n.news.naver.com/mnews/article/030/0003483161","naverLink":"https://n.news.naver.com/mnews/article/030/0003483161","pubDate":"2026-11-07T11:19:53.075374+09:00","author":"네이버뉴스","description":"테슬라의 전기차 픽업트럭인 '사이버트럭'. 사진=AP연합뉴스 테슬라가 야심 차게 내놓은 전기 픽업트럭 사이버트럭의 생산을 단계적으로 축소한다. 당초 연간 50만대 판매를 목표로 내세웠지만 실제 판매량이 기대에 크게 못 미친 데다, 회사가 자율주행 사업에 생산 역량을 집중하면서다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 엑스(X)를 통해 내년 중반부터 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄일 계획이라고 밝혔다. 생산 공간은 차세대 자율주행 차량인 사이버캡 제조에 활용할 예정이다. 텍사스 오스틴 기가팩토리는 사이버트럭의 특수 부품을 생산하는 유일한 시설이다. 이에 따라 생산 축소는 사실상 모델 단종 수순으로 해석된다. 머스크 CEO 역시 관련 결정에 대해 '한 시대의 끝'이라고 언급했다. 2019년 11월 처음 공개된 사이버트럭은 스테인리스 스틸 외장과 파격적인 각진 디자인으로 자동차 업계의 주목을 받았다. 테슬라는 제너럴모터스(GM)와 포드가 주도해온 미국 픽업트럭 시장에 도전장을 내밀며 연간 판매량 50만대를 목표로 제시했다. 하지만 실제 시장 성과는 기대에 미치지 못했다. 복잡한 생산 공정과 부품 수급 문제 등으로 출시가 지연됐고, 2023년 말 고객 인도가 시작된 이후에도 판매 확대에 어려움을 겪었다. 자동차 데이터 업체 켈리 블루북에 따르면 지난해 사이버트럭 판매량은 2만237대에 그쳤다. 당초 제시한 연간 판매 목표의 4% 수준이다. 디자인에 대한 소비자 호불호와 높은 가격, 조립 품질 논란, 잇따른 리콜 등이 수요 확대의 걸림돌로 작용했다. 테슬라는 사이버트럭 생산 축소를 계기로 사업 전략의 무게중심을 전기차에서 인공지능(AI)과 자율주행으로 옮기고 있다. 사이버캡 양산을 확대하는 동시에 휴머노이드 로봇 옵티머스 개발과 생산에도 역량을 투입하는 모습이다. 앞서 테슬라는 캘리포니아 공장의 모델S와 모델X 생산을 중단하고 해당 공간을 옵티머스 생산시설로 전환하겠다는 계획도 공개했다. 이번 사이버트럭 생산 축소 역시 같은 맥락으로 풀이된다. 전기 픽업트럭 시장에서 기대했던 성과를 거두지 못하자 생산 자원을 자율주행과 로봇 등 차세대 사업으로 재배치하는 것이다. 사이버트럭은 테슬라가 전기차 시장의 외연을 넓히기 위해 내놓은 상징적인 모델이었다. 그러나 대량 생산과 대중적 수요 확보라는 과제를 해결하지 못한 채 생산 축소라는 결정을 맞게 됐다. 테슬라가 자동차 제조업체","category":"세계"},{"title":"트럼프, 백악관 비서실장 전격 교체…강경파 밀러 발탁","link":"https://n.news.naver.com/mnews/article/014/0005600755","naverLink":"https://n.news.naver.com/mnews/article/014/0005600755","pubDate":"2026-11-07T11:19:53.075372+09:00","author":"네이버뉴스","description":"중간선거 참패 사흘 만에 인적 쇄신…9일부터 업무 와일스는 정치조직으로 이동…추가 개각 가능성 주목 반이민 정책 주도한 최측근 기용에 강경노선 강화 전망 스티븐 밀러 백악관 부비서실장. 연합뉴스 [파이낸셜뉴스] 도널드 트럼프 미국 대통령이 중간선거에서 공화당이 패배한 지 사흘 만에 백악관 비서실장을 교체했다. 후임에는 강경 이민정책을 주도해온 최측근 스티븐 밀러(41) 백악관 부비서실장을 발탁했다. 이번 인사를 계기로 백악관과 행정부 전반에 걸친 인적 개편이 이어질지 관심이 쏠린다. 6일(현지시간) 트럼프 대통령은 자신의 사회관계망서비스(SNS) 트루스소셜을 통해 밀러 부비서실장을 신임 백악관 비서실장으로 임명한다고 밝혔다. 밀러는 오는 9일부터 공식 업무를 시작한다. 트럼프 대통령은 밀러를 자신이 가장 신뢰하는 참모 중 한 명이라고 소개했다. 기존 비서실장인 수지 와일스에 대해서는 그간의 헌신에 감사를 표하며 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 예정이라고 설명했다. 다만 해당 조직의 구체적인 성격이나 와일스가 맡을 직책은 공개하지 않았다. 밀러는 엑스(X·옛 트위터)를 통해 비서실장으로 임명된 데 대해 영광스럽다는 입장을 밝혔다. 와일스 역시 백악관에서 트럼프 대통령을 보좌한 경험을 평생의 영광으로 평가하며 \"내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것\"이라고 전했다. 이번 인사는 지난 3일 치러진 중간선거에서 공화당이 연방 상원과 하원 모두 민주당에 다수당 지위를 내준 직후 단행됐다. 트럼프 대통령은 이날 백악관에서 취재진에게 와일스의 업무 수행을 긍정적으로 평가하면서도 변화를 원했다고 밝혀 선거 결과가 인사 결정에 영향을 미쳤음을 시사했다. 와일스는 2024년 미국 대선에서 트럼프 대통령의 선거대책위원장을 맡아 승리에 기여한 인물이다. 미국 최초의 여성 백악관 비서실장으로 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 다만 최근 트럼프 대통령과 와일스의 관계가 예전 같지 않다는 관측이 제기됐다. 뉴욕타임스(NYT)는 백악관 사정에 밝은 관계자들을 인용해 트럼프 대통령이 와일스를 주요 인사 결정 과정에서 제외하는 일이 있었다고 보도했다. 특히 캐롤라인 레빗 전 백악관 대변인의 후임 인선을 와일스와 협의하지 않고 진행했으며, 이미 승인한 사안을 두고도 다른 참모들 앞에서 와일스를 질책한 것으로 전해졌다. 중간선거 이후에는 와일","category":"세계"},{"title":"잇단 리콜에 판매 3% 굴욕…‘GD 차’ 사이버트럭 결국 단종","link":"https://n.news.naver.com/mnews/article/025/0003563474","naverLink":"https://n.news.naver.com/mnews/article/025/0003563474","pubDate":"2026-11-07T11:19:53.075370+09:00","author":"네이버뉴스","description":"가수 지드래곤(GD)이 해외 일정을 위해 지난 2024년 11월 4일 인천국제공항 2터미널에 도착해 테슬라의 전기 픽업트럭 '사이버트럭(Cybertruck)'에서 하차하고 있다. 뉴스1 가수 지드래곤(GD)이 여러 공식 석상에 타고 등장해 화제가 되기도 했던 테슬라의 전기차 모델 사이버트럭이 단종되게 됐다. 테슬라가 픽업트럭 시장에 야심 차게 진출했지만 저조한 판매량을 이겨내기 못한 이유다. 로이터통신에 따르면 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 엑스(X)에서 “내년 중순께 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄여나갈 예정”이라며 “사이버캡 생산을 위한 공간을 확보하기 위한 결정”이라고 밝혔다. 텍사스 오스틴 기가팩토리는 사이버트럭 특수 부품을 제조할 수 있는 유일한 시설이다. 이에 사실상 사이버트럭의 단종을 의미하는 것으로 해석된다. 머스크도 X 이용자의 질문에 “(사이버트럭은) 테슬라가 지금까지 만든 최고의 차량”이라며 이번 결정에 대해“한 시대의 끝”이라고 아쉬움을 드러냈다. 지난 2019년 처음 공개된 사이버트럭은 2023년 공식 출시됐다. 당시 머스크는 사이버트럭이 미국에서 꾸준히 인기를 얻던 제너럴모터스(GM)와 포드의 픽업트럭과 경쟁할 것이라고 기대했다. 연간 판매량을 50만대로 예상하기도 했다. 머스크는 사이버트럭을 그 어떤 차량 모델보다 튼튼하다고 강조해 왔지만 호불호가 갈리는 각진 디자인과 반복되는 리콜 문제, 비싼 가격 등으로 인해 판매량은 저조했다. 또 지나치게 밝은 주차등, 강철 트림 부품 이탈, 인버터 결함, 글자 크기가 너무 작은 경고등 같은 문제로 잇달아 리콜이 이뤄졌다. 블룸버그 통신은 “테슬라의 사이버트럭이 출시 2년도 되지 않아 리콜 횟수로 두 자릿수를 기록했다”며 “시장에서 제대로 자리 잡지 못한 이 모델은 문제로 점철된 행보를 이어가고 있다”고 지적했다. 테슬라는 사이버트럭의 판매량을 밝히지 않고 있지만 지난 분기 모델 S·모델 X와 사이버트럭을 합친 글로벌 인도량은 테슬라 전체 인도량의 약 3%를 조금 넘는 수준에 그쳤다. 자동차 데이터 플랫폼 켈리 블루북에 따르면 지난해 사이버트럭 판매량은 2만237대에 불과했다. 그마저도 머스크가 이끄는 또 다른 회사인 스페이스X가 주로 사들인 것으로 나타났다. 한편 테슬라는 전기 자동차 판매에서 벗어나 점점 인공지능(AI) 자율주행 기능을 갖춘 로보택시와 휴머노이드 로봇 개발 및 생산에 집중하고 있","category":"세계"},{"title":"‘트럼프 시대’, 쓰나미에 쓸려 나가다","link":"https://n.news.naver.com/mnews/article/036/0000054420","naverLink":"https://n.news.naver.com/mnews/article/036/0000054420","pubDate":"2026-11-07T11:19:53.075366+09:00","author":"네이버뉴스","description":"복지 파괴·부패·물가 폭등 탓 공화당 텃밭들 뒤집혀… 주도권 잡은 민주당 앞에도 수많은 난제 도널드 트럼프 미국 대통령이 중간선거를 하루 앞둔 2026년 11월2일 워싱턴 링컨기념관 부근에서 열린 유세에서 웃고 있다. REUTERS “주식시장이 다시 한번 기록적인 상승세를 보였다. 내가 집권한 지 불과 2년도 안 된 시점에 이뤄진 일이다. 여러분의 은퇴자금도 최고점을 찍었다. 모든 게 기록적이다!” 도널드 트럼프 미국 대통령은 2026년 11월4일 소셜미디어 트루스소셜에 이런 글을 올렸다. 이날 미국 주식시장은 활기가 넘쳤다. 다우존스 산업평균지수는 전날보다 1569.4(3.03%) 상승한 5만3356.12로 장을 마쳤다. 다우지수가 5만3천을 넘어선 건 9월8일 이후 처음이다. 대형 우량주 중심 스탠더드앤드푸어스(S&P)500 지수도 119.7(1.58%) 뛰어 7688.62를 기록했다. 첨단기술주 중심 나스닥 지수도 전날보다 364.5(1.44%) 오른 2만5736.51을 기록했다. 시장이 미국의 미래가 조금은 밝아졌다고 판단한 걸까? 같은 날 국제유가는 큰 폭으로 떨어졌다. 브렌트유는 전날보다 8% 이상 떨어져 배럴당 94.6달러를 기록했다. 9월29일 이후 최저가다. 서부텍사스산원유도 배럴당 88.6달러까지 떨어졌다. 세상이 조금은 안전해진 건가? 정신승리로 탈주한 트럼프 전날인 11월3일 미국에서 중간선거가 치러졌다. 4년 임기 대통령의 임기 중반에 치러진 선거였다. 트럼프 대통령과 집권 공화당에 대한 중간평가일 수밖에 없다. 공화당의 상징색은 빨간색이다. 야당인 민주당은 파란색을 쓴다. 선거에 앞서 미국 언론은 ‘파란색 파도’를 예상했다. 결과는 ‘파란색 쓰나미’(지진해일)였다. 최종 개표가 진행 중인 11월5일 오후 현재, 연방하원(435석)에선 민주당이 244석을 확보해 과반의석(218석)을 크게 웃돌고 있다. 연방상원(100석)에서도 민주당은 54석을 확보한 상태다. 공화당은 상원에서 7석, 하원에서 30석을 잃었다. 공화당이 의석을 잃은 지역 대부분이 2년 전인 2024년 대선 때 트럼프 대통령이 카멀라 해리스 민주당 후보와 두 자릿수 이상의 지지율 격차를 보이며 압승한 곳이다. 불과 2년 만에 참담한 성적표를 받아든 트럼프 대통령이 내놓은 ‘주식시장 예찬’은 그래서 황당하다. 2026년 11월3일 미국 뉴욕 브루클린의 기표소에서 유권자들이 투표하고 있다. AFP 연합뉴스","category":"세계"},{"title":"젤렌스키, \"전후 안보 지원 구체적 보장 원한다\"","link":"https://n.news.naver.com/mnews/article/003/0014307540","naverLink":"https://n.news.naver.com/mnews/article/003/0014307540","pubDate":"2026-11-07T11:19:53.075357+09:00","author":"네이버뉴스","description":"젤렌스키, \"전후 안보 지원 구체적 보장 원한다\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T11:19:53.075355+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프 \"선거 후 증시 3조달러 증발\"...민주당 승리 탓?","link":"https://n.news.naver.com/mnews/article/014/0005600779","naverLink":"https://n.news.naver.com/mnews/article/014/0005600779","pubDate":"2026-11-07T11:19:53.075301+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령. 연합뉴스 [파이낸셜뉴스] 도널드 트럼프 미국 대통령이 중간선거 이후 미국 증시가 급락한 것을 두고 \"우리나라가 선거 때문에 3조달러(약 4070조원)를 잃었다\"고 말했다. 공화당 패배에 대해서는 \"나는 투표용지에 없었다\"며 책임론에 선을 그었다. 트럼프 대통령은 6일(현지시간) 플로리다주 케네디우주센터에서 열린 항공우주 기술 행사 '업 서밋(UP.Summit)' 연설에서 \"어제 3조 달러가 사라졌다\"며 \"만약 3조 달러를 벌었다면 더 불쾌했을 것\"이라고 말했다. 공화당이 선거에서 패배한 뒤 증시가 하락한 것을 민주당 승리에 대한 시장의 부정적 반응으로 해석한 것이다. 이어 \"혹시 궁금해할까 봐 말하는데, 나는 이번 선거에 출마하지 않았다. 내가 투표용지에 있었다면 이겼을 것\"이라고 덧붙였다. 중간선거가 민주당의 상하원 다수당 장악으로 마무리된 가운데 5일 뉴욕증시에서는 나스닥100 지수가 2020년 이후 하루 기준 최대 낙폭을 기록했다. 트럼프 대통령은 고용지표를 두고 자신의 경제 성과로 강조했다. 트럼프 대통령은 이날 발표된 10월 고용보고서를 두고 \"놀라운 고용 수치를 기록했다\"며 제조업 증가 폭에 대해서는 \"수십 년 만의 최대\"라고 주장했다. 미 노동부에 따르면 10월 비농업 일자리는 16만5000개 늘어 시장 예상치인 6만5000개 안팎을 크게 웃돌았다. 제조업 일자리도 1만9000개 증가했다. 인공지능(AI) 분야에서는 미국이 경쟁에서 앞서 있다고 강조했다. 그는 \"누가 이기든 초지능(superintelligence)을 차지하는 쪽이 이긴다\"며 \"트럼프 행정부에서 승자는 언제나 미국일 것이고 지금 우리가 앞서 있다\"고 말했다. 이어 \"3주 전 백악관에서 시진핑 중국 국가주석과 이 문제를 이야기했다\"며 \"그는 전력을 다하고 있고 우리가 잘하고 있다고 축하해줬다\"고 전했다. 이란에 대해서는 핵무기 보유를 허용하지 않겠다는 입장을 재확인했다. 그는 \"1년여 전 B-2 폭격기를 보내지 않았다면 이스라엘은 지구상에서 사라졌을 것\"이라며 \"이란은 절대 핵무기를 갖지 못할 것\"이라고 말했다. 트럼프 대통령은 이번 선거에서 승리한 공화당 인사들도 치켜세웠다. 그는 바이런 도널즈 하원의원의 플로리다 주지사 당선을 축하하며 \"그는 힘든 방식으로, 열심히 일해서 이겼다\"고 말했다. 이날 연설은 트럼프 대통령이 수지 와일스 백악관 비서실장 후임으로 스티븐 밀러 부비서실장을 기용한다고 발표한 지","category":"세계"},{"title":"이란, 핵개발 관련 중재국 제안 검토... 외교 물꼬 기대-NYT","link":"https://n.news.naver.com/mnews/article/014/0005600326","naverLink":"https://n.news.naver.com/mnews/article/014/0005600326","pubDate":"2026-11-07T11:19:53.075294+09:00","author":"네이버뉴스","description":"모흐센 레자이 이란 최고국가안보회의 사무총장.AP뉴시스 [파이낸셜뉴스] 미국과의 전쟁을 종식하기 위한 교착 상태의 외교적 노력으로 이란 전쟁에 돌파구가 마련될 조짐이 보이고 있다. 이란이 핵 프로그램의 미래를 다룬 중재국들의 제안을 검토 중인 것으로 확인됐다. 5일(현지시간) 뉴욕타임스(NYT)는 협상 관련 전현직 당국자들의 말을 인용해 몇 주간 강경 태도를 고수하던 이란이 핵 협상 재개 의사를 보였다며 전면전 재발을 막기 위해 카타르가 주도해 온 중재 노력이 결실을 보기 시작하고 있다고 보도했다. 이들 당국자는 이란이 검토 중인 조항들이 \"구체적인 제안\"이라고 설명했다. 카타르는 지난주 테헤란에서 두 차례 협상을 진행하고 자국 수도 도하에서 세 번째 회담을 주최하는 등 적극적인 외교전을 펼쳐왔다. 카타르 측은 아르메니아에서도 이란 당국자들과 만남을 가진 것으로 알려졌다. 미국 측에서는 JD 밴스 부통령이 군사적 충돌을 막기 위한 카타르 주도 외교를 적극 지지하고 있다. 밴스 부통령은 이번 주 중간선거에서 공화당이 대패한 원인으로 이란과의 전쟁을 지목하며 트럼프 대통령과 일정 부분 거리를 두는 모습을 보이기도 했다. 앞서 밴스 부통령은 지난달 모흐센 레자이 이란 최고국가안보회의 의장에게 이란의 핵 프로그램을 포함한 직통 평화 회담을 제안하는 서한을 보냈다. 레자이 의장은 이 서한에 대해 \"미국이 이란에 대한 태도를 바꾼 증거이자 이란 승리의 표식\"이라고 평가한 바 있다. 지난 2월 미국과 이스라엘이 이란을 공격하기 전에도 밴스 부통령은 도널드 트럼프 대통령의 측근 중 전면전에 가장 반대했던 인물로, 전쟁이 지역적 혼란과 막대한 인명 피해를 불러올 것이라고 경고했었다. 밴스는 최근 \"트럼프 대통령과 본인 모두 협상을 통한 타결 가능성에 긍정적\"이라며 진전이 있음을 내비쳤다. 이번 외교적 움직임은 트럼프 대통령과 이스라엘이 이란의 에너지 인프라 등 경제적 핵심 요충지를 겨냥한 대규모 공격을 검토 중인 가운데 이뤄졌다. 미국과 이란은 지난 6월 휴전에 합의하며 핵 문제 논의와 호르무즈 해협 재개방을 추진했으나, 협상이 결렬되면서 수개월간 교착 상태에 빠졌었다. 최근 양국 간 비난 수위가 높아지자 카타르 중재진이 막판 중재에 나선 것이다. 레자이 의장은 공개적으로는 동결 자산 해제, 석유 제재 및 봉쇄 해제 없이는 핵 협상이 없다고 밝혔으나, 비공개 자리에서는 아바스 아라그치 이란 외무장관, 모하마드 바케르 갈리바프","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T11:19:52.798918+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T11:19:53.358700+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T11:19:53.358699+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T11:19:53.358697+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T11:19:53.358695+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T11:19:53.358691+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T11:19:53.358690+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T11:19:53.358686+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T11:19:53.358677+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T11:19:53.358673+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T11:19:53.358662+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[{"title":"'20만전자' 무너지자…삼성전자 노태문, '3000주' 6억3000만원 규모 추가 매입","link":"https://n.news.naver.com/article/030/0003483149?ntype=RANKING","pubDate":"2026-11-07T11:19:56.159372+09:00","author":"네이버 랭킹","description":"네이버
