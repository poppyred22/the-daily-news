이 씨가 리트 만점자 공부법이라며 출간해 한때 베스트셀러 1위에 오른 수험서에 대해서는 책 구매자들이 집단소송을 제기했고, 입시업체 '시대인재'는 이 씨와의 계약을 해지하는 등 파장이 확산하고 있습니다. '새로운 미래를 위한 청년변호사들의 모임'은 이 씨의 위계공무집행방해와 업무방해 혐의를 확인해 달라는 고발장을 서울 관악경찰서에 제출하고, 답안지 긴급보전과 통신자료 확보, 기기 구매내역 조사, 금융거래정보 조회 등을 요청했습니다. 앞서 법률사무소 이유의 박은선 변호사도 서울경찰청에 이 씨의 위계공무집행방해와 사기 혐의를 수사해 달라는 고발장을 내고, 고득점에 대한 허위 내용을 책으로 팔아 부당이득을 취했는지 등을 수사해 달라고 촉구했습니다. 서울경찰청은 현직 변호사들의 고발사건 2건을 광역범죄수사단에 배당하고 지방청이 직접 수사에 나서기로 결정했습니다. 지난해 수능 생명과학2에서 단 한 문제를 틀렸다는 이 씨가 수능 며칠 전, 기초적인 개념조차 모르는 채로 과외를 요청해왔다고 폭로한 인물의 자술서와 SNS 대화 내역도 경찰에 제출됐습니다. 이 씨가 리트 최초 만점자의 공부법이라며 스스로 출간해 한때 베스트셀러 1위까지 오른 수험서 '브레인 악셀'을 둘러싼 논란도 커지고 있습니다. 책에는 스마트폰을 멀리하고 식습관과 생활습관을 바꾸는 등 훈련을 했더니 인지능력이 크게 개선됐으며 자신의 성공이 그 방증이라는 주장이 담겼는데, 책을 구매한 수험생들은 책값을 돌려달라며 잇따라 글을 올리는가 하면 집단소송에도 나섰습니다. 수험생 17명을 대리해 오늘 서울중앙지법에 손해배상 청구 소송을 낸 박은선 변호사는 \"부정행위가 밝혀지면 이 씨의 홍보는 기망이 되고, 책값만큼의 배상은 물론 경우에 따라 위자료도 인정받을 수 있다\"고 말했습니다. 이런 가운데, 이 씨를 지난 10일 학습전략 강사 '브레인 코치'로 영입했던 대형 입시업체 시대인재는 이 씨와의 계약을 전격 해지하기로 했습니다. 시대인재LEET 측은 \"시험 공정성과 관계된 이번 사안의 심각성을 감안하면, 의혹 해소를 위해 사실관계 검증이 우선돼야 한다고 판단했다\"며 \"영입 발표 이후 이 씨가 활동한 내역은 아직 없었다\"고 설명했습니다.","category":"생활·문화"},{"title":"‘부정 의혹’ LEET시험 만점자, 줄고발 당했다…책 구매자 집단소송 제기","link":"https://n.news.naver.com/mnews/article/029/0003059956","naverLink":"https://n.news.naver.com/mnews/article/029/0003059956","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"업무방해 등 혐의 고발장 “지난해 수능이력도 수사돼야” 수능날 공개검증 취소안해 입시업체 시대인재도 손절 19일 2027학년도 법학적성시험 고사장이 마련된 서울 종로구 성균관대학교에서 시험을 마친 수험생들이 고사장을 나서고 있다. [연합뉴스] 법학적성시험(LEET) 만점자 이진우 씨가 18일 연이어 고발당했다. 올해 세무사 시험 수석 합격자의 부정행위 사실이 드러나던 중, 이씨도 생성형 AI 등을 활용해 대학수학능력시험(수능)을 치른 것 아니냐는 의혹이 확산되면서다. 이날 오전 법무법인 민의 방민우 변호사는 ‘새로운 미래를 위한 청년 변호사 모임’을 대표해 이씨에 대한 고발장을 서울 관악경찰서에 제출했다. 고발장에는 이씨가 올해 만점 받은 LEET뿐 아니라 그가 지난해 치른 2026학년도 수능 이력도 함께 수사돼야 한다는 내용이 담겼다. 고려대 커뮤니티에는 이씨로 추정되는 인물이 수능 직전 ‘과학칼럼을 쓰는 데 도움이 필요하다’며 생명과학2 과목 과외를 구하는 글이 게시됐고, 이에 응했다는 사연이 올라왔다. 글 작성자는 “당시 1시간가량 과외를 해줬는데, 도움을 청한 남성이 유전자(DNA) 구조와 염기서열 등 개념을 거의 몰랐다”며 “과외비로 3만원을 송금한 남성의 계좌상 이름이 이씨의 개명 전 이름과 같아 그가 수능 직전에 과외받은 것 아니냐”라는 의혹을 제기했다. 이씨가 소셜미디어(SNS)에 공개한 2026학년도 수능 성적 증명서를 보면 생명과학2 한 문제를 틀렸을 뿐 나머지 과목은 모두 맞혔다. 만약, 과외받은 남성이 실제 이씨라면 기본 개념도 모르던 사림이 불과 며칠 뒤 고득점을 달성했다는 예기가 된다. 연합뉴스는 이러한 의혹에 대해 문자 메시지로 질의했으나, 이씨한테서 회신받지 못했다. 법률사무소 이유의 박은선 변호사도 이씨에 대한 고발장을 서울경찰청에 냈다. 그가 부정행위를 저질렀다면 학습법을 담은 도서 출판·광고·판매 등도 사기 행위라는 주장이다. 박 변호사는 이날 이씨 저서 ‘브레인 악셀’을 구매한 17명을 대리해 이씨와 출판사를 상대로 손해배상 청구 소송을 내면서, 원고 1명당 책 구매대금과 위자료를 배상할 것을 요구했다. 한편, 이진우 씨는 19일 2027학년도 수능 국어 문제지가 공개되는 대로 문제 풀이와 채점 과정을 생중계하겠다고, 공개 검증 의사를 밝힌 상태다. 하지만, 이러한 해명에도 논란이 커지자 입시업체 시대인재는 이씨와 ‘브레인코치’ 계약을 해지하기로 했다. 이씨가 수능에 처음 응","category":"생활·문화"},{"title":"기아 노사, 복지·교육기관 36곳에 레이 22대·1억1300만원 지원","link":"https://n.news.naver.com/mnews/article/119/0003156962","naverLink":"https://n.news.naver.com/mnews/article/119/0003156962","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"14년째 ‘사랑나누기’ 캠페인…노사 공동 사회공헌 기금 마련 (왼쪽부터) 윤찬영 판매지회장, 김포시종합사회복지관 최유호 관장, 기아 국내사업본부장 정원정 부사장, 한국사회복지협의회 조남권 사무총장, 기아 국내오너십·판매지원사업부장 최진기 전무, 천용현 정비지회장이 18일 서울 압구정동 ‘Kia360’에서 기념 촬영을 하고 있다. ⓒ기아 [데일리안 = 이소영 기자] 기아 국내사업본부 노사가 전국 사회복지시설과 교육기관 36곳에 레이 22대와 장학금 1억1300만원을 지원한다. 기아는 지난 18일 서울 압구정동 브랜드 체험관 ‘Kia360’에서 ‘2026년 노사 합동 사랑나누기’ 캠페인 차량·장학금 전달식을 열었다고 19일 밝혔다. 2013년 시작해 올해로 14년째를 맞은 사랑나누기 캠페인은 국내사업본부 노사가 함께 마련한 사회공헌 기금으로 복지단체와 교육기관을 지원하는 프로그램이다. 올해 지원 대상에는 김포시종합사회복지관과 사회복지법인 신망원, 경남자동차고등학교, 경기자동차과학고등학교 등이 포함됐다. 전달된 레이는 복지단체 직원들의 업무와 노인·아동·장애인 등 시설 이용자들의 이동을 돕는 데 활용된다. 기아 관계자는 “노사가 힘을 모아 도움이 필요한 이웃들에게 손을 내밀 수 있어 뜻깊게 생각한다”며 “앞으로도 기아 노사는 신뢰와 화합을 바탕으로 상생의 가치를 실현하는 사회적 책임을 다하기 위해 지속적으로 노력할 것”이라고 말했다.","category":"생활·문화"},{"title":"중국, K영화·게임에 ‘최혜국 대우’ 약속…10년 한한령 끝나나","link":"https://n.news.naver.com/mnews/article/033/0000053475","naverLink":"https://n.news.naver.com/mnews/article/033/0000053475","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"이재명 대통령과 시진핑 중국 국가주석이 18일 아시아태평양경제협력체(APEC) 정상회의 개최지인 중국 선전에서 정상회담에 앞서 악수하고 있다. 청와대사진기자단 이재명 대통령과 시진핑 중국 국가주석의 18일 세 번째 정상회담을 계기로 한중 자유무역협정(FTA) 서비스·투자 협상이 타결됐다. 이로써 중국 정부의 한한령(限韓令·한류 제한령)이 10년 만에 해제 수순에 들어갈 것이란 전망이 나온다. 한중 정상은 이날 중국 선전 치린 산장에서 아시아태평양경제협력체(APEC) 정상회의를 계기로 34분간 정상회담을 가졌다. 지난해 경주 APEC과 올해 1월 이 대통령의 중국 국빈 방문에 이어 양국 정상의 세번째 회담이다. 정상회담을 계기로 양국은 한중 FTA 서비스·투자 협상 실질적 타결을 선언했다. 한중 FTA 서비스·투자 협상은 2015년 발효된 한중 FTA 협정에 근거한 후속조치로, 양국은 2018년 3월 서비스·투자 분야의 자유화 수준을 높이기 위한 협상을 시작해 8년 8개월 만에 합의점을 찾았다. 산업통상부에 따르면 한중 FTA 서비스·투자 협상을 통해 중국은 우리나라에 게임·영화 분야에 제3국보다 불리하지 않은 대우를 부여하는 최혜국대우를 약속했다. 온라인 게임과 영화 등 콘텐츠에 대한 사전심사에도 비차별 원칙을 적용하기로 했다. 중국이 통상협정에 이러한 내용을 포함한 것은 이번이 처음으로 한한령 해제의 신호탄이라는 해석이 나온다. 2016년 한국 정부의 고고도미사일방어체계(THAAD·사드) 배치 발표 이후 10년간 이어져 온 중국의 콘텐츠 규제가 풀리면서 국내 기업의 시장 진출 여건이 개선될 것으로 전망된다. 양국은 시청각 프로그램 공동제작 부속서에도 합의했다. 영화에 한정됐던 공동제작 대상을 드라마, 애니메이션, 예능, 다큐멘터리 등 다양한 시청각 프로그램으로 확대한다. 산업부는 양국 간 합작 프로그램 제작이 활성화되고 국내 콘텐츠 산업의 제작 기반이 넓어질 것이라고 전했다. 이재명 대통령은 이날 오후 엑스(X·옛트위터)를 통해 “중국의 한국에 대한 이번 최혜국 대우 합의는 한중관계의 전면적 실질적 복원을 넘어, 한중 관계의 새로운 미래를 만들어 나가는 토대가 될 것”이라며 “국민 여러분께서도 맡은 일 잘 해낸 외교부, 문화체육부, 산업부, 청와대 안보실, 정책실 등 공직자들을 많이 격려해 달라”고 밝히기도 했다. 관광 분야에서는 중국 내 23개 지역에 있는 우리 여행사가 중국 내 거주하는 중국인과 외국인을","category":"생활·문화"}],"세계":[{"title":"李·푸틴 10여분간 회동…7년만의 한러 정상 간 만남 성사","link":"https://n.news.naver.com/mnews/article/009/0005765905","naverLink":"https://n.news.naver.com/mnews/article/009/0005765905","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"李·푸틴 10여분간 회동…7년만의 한러 정상 간 만남 성사. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"이란, 미·중·러 정상회담 전날 쿠웨이트 미군기지 타격","link":"https://n.news.naver.com/mnews/article/214/0001536390","naverLink":"https://n.news.naver.com/mnews/article/214/0001536390","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"이란 테헤란에 있는 전쟁 선전 벽화 미국과 중국, 러시아의 첫 3자 정상회담을 하루 앞두고, 이란이 쿠웨이트의 미군 기지를 공격하면서 중동의 긴장이 다시 높아지고 있습니다. 로이터통신 등에 따르면 이란군은 현지시간 18일 쿠웨이트 알리 알살렘 공군기지의 미군 드론과 미사일 장비를 공격했다고 밝혔습니다. 쿠웨이트군도 드론 공격을 막기 위해 방공망을 가동했다고 발표했습니다. 이란은 지난 13일 바레인 미군 기지를 타격한 데 이어 쿠웨이트까지 공격하면서, 두 달 만에 걸프 지역 미군 기지에 대한 공세를 재개한 상태입니다. 이번 공격은 트럼프 미국 대통령이 내일 중국 선전에서 시진핑 중국 국가주석, 푸틴 러시아 대통령과 만나 이란 전쟁의 해법을 논의하기 직전에 이뤄졌습니다. 중국과 러시아가 이란의 핵심 우방인 만큼, 이번 공격이 3국 정상의 협상에 어떤 영향을 미칠지 주목됩니다.","category":"세계"},{"title":"계명대 이호택 교수, B2B 마케팅 국제학술지 논문 8편 게재","link":"https://n.news.naver.com/mnews/article/016/0002725388","naverLink":"https://n.news.naver.com/mnews/article/016/0002725388","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"계명대 이호택 교수.[계명대 제공] [헤럴드경제(대구)=김병진 기자]계명대는 경영학과 이호택 교수가 2026년 한 해 동안 기업 간 거래(B2B) 마케팅 분야 국제학술지에 논문 8편을 게재하며 연구 역량을 인정받았다고 18일 밝혔다. 특히 최근 발표한 논문 2편은 사회과학인용색인(SSCI)에 등재된 학술지 가운데 학술지인용보고서(JCR) 기준 상위 25% 이내인 Q1 학술지에 게재됐다. 이 교수는 올해 ‘Industrial Marketing Management’, ‘Journal of Business & Industrial Marketing’, ‘Marketing Intelligence & Planning’ 등 주요 국제학술지에 연구성과를 발표했다. 최근 Q1 학술지에 게재된 두 논문은 영업사원의 개인적 역량과 기업의 ESG(환경·사회·지배구조) 활동이 거래성과와 신뢰 형성에 미치는 영향을 분석했다. 첫 번째 논문은 B2B 영업사원 329명의 설문자료를 바탕으로 영업사원의 정치적 기술이 고객관계 구축 역량을 통해 영업성과에 기여한다는 점을 밝혀냈다. 두 번째 논문은 국내 판매기업과 구매기업 205쌍의 자료를 분석해 기업의 ESG 활동과 거래 상대방의 신뢰 형성 간 관계를 규명했다. 환경 관련 활동은 상대 기업의 따뜻함에, 지배구조 관련 활동은 전문성과 업무 수행 능력을 의미하는 유능함에 긍정적인 영향을 미치는 것으로 분석됐다. 이번 연구는 기업의 영업인력 육성과 고객관계 관리, ESG 경영전략 수립에 실질적인 시사점을 제공한다는 점에서 의미가 있다. 이호택 교수는 “B2B 마케팅 분야의 연구를 꾸준히 이어온 결과가 의미 있는 성과로 이어져 기쁘다”며 “앞으로도 지속적인 연구를 통해 학문적 가치와 산업 현장에 기여할 수 있는 실무적 의미를 함께 만들어가겠다”고 말했다.","category":"세계"},{"title":"시진핑, 푸틴과 정상회담 \"중러 관계, 산처럼 안정적\"","link":"https://n.news.naver.com/mnews/article/079/0004211364","naverLink":"https://n.news.naver.com/mnews/article/079/0004211364","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"미중러 3자 회담 하루 전 APEC 개최 선전서 회담 시진핑 \"중러, 평등하고 상조 존중하는 신형대국관계 모범 수립\" \"러시아 포함한 아태 공동체와 번영·발전 대계 논의하고 싶다\" 푸틴 \"중러 관계 발전세 유지…중국과 전략적 협력 강화하고 싶다\" 가스관 사업·북러 관계 등 이견에도 양국 관계 긍정 평가 시진핑 중국 국가주석(오른쪽)과 블라디미르 푸틴 러시아 대통령이 18일(현지시간) 중국 선전국제교류센터에서 열린 아시아태평양경제협력체(APEC) 정상회의 환영만찬에 참석해 악수하고 있다. 연합뉴스 시진핑 중국 국가주석과 블라디미르 푸틴 러시아 대통령이 18일 중국 광둥성 선전에서 정상회담을 가졌다. 아시아태평양경제협력체(APEC) 정상회의를 계기로 오는 19일 사상 최초로 열리는 미중러 3자 정상회담 하루 전이다. 중국 관영 신화통신에 따르면 시 주석은 이날 회담에서 \"중러 관계는 비바람에도 흔들리지 않고 산처럼 안정적\"이라며 \"격변하는 세계에 더 많은 안정성과 확실성을 제공했다\"고 양국 관계를 평가했다. 그는 \"평등하게 대우하고 상호 존중하며 협력 상생하는 신형대국관계의 모범을 수립했다\"며 \"대국으로서 응당한 책임·역할을 굳게 짊어지는 한편 세계 다극화와 국제관계 민주화를 선도하고 추진해야 한다\"고 향후 관계 강화의 필요성도 강조했다. 상호 신뢰, 발전 진흥, 호혜 상생 등을 언급한 시 주석은 \"중러 발전은 아시아·태평양의 발전과 긴밀히 관련 있고, APEC은 협력을 강화하는 주요 플랫폼\"이라며 \"중국은 러시아를 포함한 아태 공동체와 함께 아태의 번영·발전 대계를 함께 논의하고 아태 공동체를 함께 구축하고 싶다\"고 기대했다. 이에 푸틴 대통령은 \"중러 관계가 양호한 발전세를 유지하고 고위층이 밀접히 교류했으며 양자 무역액이 또다시 최고치를 새로 썼다\"고 평가하며 \"러시아는 중국과 서로 등을 맞댄 전략적 협력을 강화하고 싶다\"고 화답했다. 그는 무역·에너지·교육 등 구체적인 분야를 거론하며 \"러시아는 중국과 아태 지역의 발전·협력을 촉진하고 세계 다극화 과정을 함께 추진하며, 더 공정하고 합리적인 글로벌 거버넌스 시스템을 구축해 국제 관계 안정 수호에 중요한 역할을 하고 싶다\"고 희망했다. 다만 양 정상의 이 같은 발언에도 불구하고 양국은 '시베리아의 힘-2' 가스관 사업, 북한의 러시아-우크라이나 전쟁 파병에 따른 북러 관계 변화 등에 있어 아직 이견이 있다는 관측이 제기된다. 양 정상은 앞서 푸틴 대통령이 도","category":"세계"},{"title":"이 대통령, APEC 정상회의 환영 만찬","link":"https://n.news.naver.com/mnews/article/003/0014331362","naverLink":"https://n.news.naver.com/mnews/article/003/0014331362","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"이 대통령, APEC 정상회의 환영 만찬. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"APTOPIX Grand Theft Auto","link":"https://n.news.naver.com/mnews/article/077/0007242795","naverLink":"https://n.news.naver.com/mnews/article/077/0007242795","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"APTOPIX Grand Theft Auto A billboard announcing the release of the \"Grand Theft Auto VI\" video game is displayed near Times Square, Tuesday, Nov. 17, 2026, in New York. (AP Photo/Yuki Iwamura)","category":"세계"},{"title":"GERMANY FINANCE","link":"https://n.news.naver.com/mnews/article/091/0010372740","naverLink":"https://n.news.naver.com/mnews/article/091/0010372740","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"EU and Fed Approve Unicredit's Acquisition of Commerzbank The Commerzbank headquarters in the banking district in Frankfurt am Main, Germany, 18 November 2026. Unicredit's acquisition of Commerzbank has received final EU approval. The Commission sees no competition concerns; Unicredit already holds nearly half of the voting rights. EPA/Luis Sander","category":"세계"},{"title":"日, 조국 입국 거부에 “전과 때문… 독도 방문과 무관”","link":"https://n.news.naver.com/mnews/article/366/0001205795","naverLink":"https://n.news.naver.com/mnews/article/366/0001205795","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"조국 조국혁신당 혁신정책연구원장이 지난 2024년 5월 13일 경북 울릉군 독도를 찾아 태극기를 펼치고 있다. /조국혁신당 제공 일본 정부가 조국 혁신정책연구원장의 일본 입국을 거부한 이유는 독도 방문 이력이 아닌 형사처벌 전력 때문이라는 입장을 발표했다. 조 원장 측은 과거에도 전과가 있었지만 일본 입국에 문제가 없었다며 독도 방문에 따른 보복성 조치일 가능성을 제기했다. 18일 교도통신에 따르면 일본 출입국재류관리청은 조 원장이 출입국관리 및 난민인정법(입관법)에서 규정한 입국 거부 대상에 해당한다고 밝혔다. 일본 입관법 제5조 제1항은 일본이나 다른 국가에서 유죄 판결을 받아 1년 이상의 징역 또는 이에 상응하는 형을 선고받은 외국인을 입국 거부 대상에 포함하고 있다. 조 원장은 자녀 입시 비리 등 혐의로 징역 2년의 실형을 확정받은 바 있다. 일본 출입국재류관리청은 조 원장의 독도 방문과 이번 입국 거부 조치의 연관성에 대해서도 “이번 판단은 조 원장에게 전과가 있다는 점에 기인한 것”이라고 밝혔다. 조 원장 측은 1990년대 초 국가보안법 위반으로 처벌받고 사면·복권된 이후에도 여러 차례 일본을 방문했지만 입국을 거부당한 적은 없었다고 반박했다. 조 원장 측은 지난 2024년 5월 독도를 방문했을 당시 일본 외무성이 강하게 항의했던 점을 거론하며 “독도 방문이 입국 거부의 이유라면 이는 영토 주권에 대한 부당한 도전”이라고 비판했다. 한국 외교부는 일본 측에 유사 사례가 재발하지 않도록 해 달라고 요청했다. 외교부는 “우리 국민에 대한 입국 제한 조치가 객관적이고 일관된 기준에 따라 공정하고 예측 가능하도록 이루어지는 것이 중요하다는 입장을 일본 측에 전달했다”고 밝혔다. 한일 외교당국은 이번 사안을 비롯한 출입국 문제에 대해 소통을 이어가기로 했다. 앞서 조 원장은 전날 일본 학계와 공동으로 개최하는 세미나에 참석하기 위해 도쿄 하네다공항에 도착했으나 일본 출입국 당국으로부터 입국을 거부당해 귀국했다.","category":"세계"},{"title":"\"사우디, 후티와의 장기전 대비...최장 6개월 이어질 것\"","link":"https://n.news.naver.com/mnews/article/052/0002434853","naverLink":"https://n.news.naver.com/mnews/article/052/0002434853","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"\"사우디, 후티와의 장기전 대비...최장 6개월 이어질 것\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"USA HOUSE LEADERSHIP ELECTIONS","link":"https://n.news.naver.com/mnews/article/091/0010372738","naverLink":"https://n.news.naver.com/mnews/article/091/0010372738","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"USA HOUSE LEADERSHIP ELECTIONS. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"기후위기로 낯설어진 바다, AI만으로 예측할 수 없다","link":"https://n.news.naver.com/mnews/article/310/0000141850","naverLink":"https://n.news.naver.com/mnews/article/310/0000141850","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"기후위기로 낯설어진 바다, AI만으로 예측할 수 없다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"강원과학기술원 설립 놓고 춘천·원주 주도권 경쟁 조짐","link":"https://n.news.naver.com/mnews/article/079/0004211365","naverLink":"https://n.news.naver.com/mnews/article/079/0004211365","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"강원과학기술원 설립 놓고 춘천·원주 주도권 경쟁 조짐. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"SKT, 수능 마친 수험생에 가요대전·AI 구독·로밍 할인 혜택","link":"https://n.news.naver.com/mnews/article/119/0003156932","naverLink":"https://n.news.naver.com/mnews/article/119/0003156932","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"SKT, 수능 마친 수험생에 가요대전·AI 구독·로밍 할인 혜택. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"美사이버보안국도 자바 취약점 경고…\"즉각 패치 적용\" 권고","link":"https://n.news.naver.com/mnews/article/001/0016450387","naverLink":"https://n.news.naver.com/mnews/article/001/0016450387","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"패치적용 불가 시 인증되지 않은 접근 제한 등 통제 조치 당부 사이버 보안 [로이터=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 미국 사이버보안·인프라보안국(CISA)이 공공기관과 기업의 정보시스템에 널리 쓰이는 자바(Java)에서 인증 없이 원격으로 악성 코드를 실행할 수 있는 고위험 취약점이 확인됐다면서 긴급 패치를 권고했다. 18일(현지시간) CISA에 따르면 이 기관은 전날 홈페이지에 게시한 권고문에서 \"각 기관과 조직에 최근 공개된 오라클 자바(Oracle Java)에 영향을 미치는 심각한 보안 취약점에 대해 즉각적으로 패치를 적용할 것을 촉구한다\"고 밝혔다. CISA는 \"'CVE-2026-114938'로 추적되는 이 취약점은 메모리의 허용된 범위를 벗어나 데이터를 기록하는 '범위 밖 쓰기'(out-of-bounds write) 문제를 가리키며, 특정 조건에서 서비스 거부(DoS) 또는 원격 코드 실행으로 이어질 수 있다\"고 경고했다. CISA는 \"'Java4Shell'로 알려진 이 심각한 메모리 손상 취약점은 자바 개발 키트(JDK)의 일부인 x86-64 핫스팟 자바가상머신(JVM·자바소스 코드를 컴퓨터 운영체제에서 실행해주는 기능)의 Base64 디코더에 영향을 미친다\"고 지적했다. 이어 \"특수하게 조작된 Base64 입력 데이터는 JVM을 마비시키고 인증 없이 원격에서 코드를 실행할 수 있도록 만들 수 있다\"고 설명했다. CISA는 \"관련 자바 및 공급업체의 패치가 제공되는 즉시 적용하되, 인터넷에 직접 노출된 시스템을 먼저 처리하라\"며 \"즉각적인 패치 적용이 불가능한 경우 애플리케이션 범위에서 Base64 입력을 제한하고 검증하는 조치, 입력 데이터 크기 제한을 강제하는 조치, 인증되지 않은 접근을 제한하는 조치 등 임시적인 보완 통제 조치를 시행하라\"고 말했다. '더 해커 뉴스'는 취약점에 대한 패치가 오라클과 오픈JDK에 의해 배포됐으며, 현 시점까지 이 취약점이 실제 환경에서 악용됐다는 증거는 없다고 보도했다. 앞서 한국 과학기술정보통신부와 한국인터넷진흥원(KISA)도 전날 오픈JDK에서 발견된 보안 취약점과 관련해 기업과 기관에 긴급 점검 및 보안 업데이트를 권고했다. 과기정통부는 이번 취약점이 비정상적인 입력을 처리하는 과정에서 메모리 손상을 일으키는 문제로, 일부 프로그램에서는 공격자가 인증 없이 원격에서 임의의 코드를 실행할 수 있다고 강조했다. zheng","category":"IT 과학"},{"title":"[뉴욕개장] 나스닥 0.65% 상승 출발…엔비디아 실적 전망에 AI 불안 완화","link":"https://n.news.naver.com/mnews/article/421/0009297404","naverLink":"https://n.news.naver.com/mnews/article/421/0009297404","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[뉴욕개장] 나스닥 0.65% 상승 출발…엔비디아 실적 전망에 AI 불안 완화. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"[아이숏] 'K-AI 이노베이터' 조찬모임, 남상도 미소정보기술 대표 2027 사업전략 #shorts","link":"https://n.news.naver.com/mnews/article/031/0001076408","naverLink":"https://n.news.naver.com/mnews/article/031/0001076408","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[아이숏] 'K-AI 이노베이터' 조찬모임, 남상도 미소정보기술 대표 2027 사업전략 #shorts. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"[크립토 AI리포트] 비트코인 약세에 시장 '꽁꽁'…시총 20% 증발","link":"https://n.news.naver.com/mnews/article/092/0002445930","naverLink":"https://n.news.naver.com/mnews/article/092/0002445930","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[크립토 AI리포트] 비트코인 약세에 시장 '꽁꽁'…시총 20% 증발. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"개복치 모자가 걸어온다…로봇이 된 ‘퐝이’","link":"https://n.news.naver.com/mnews/article/018/0006412124","naverLink":"https://n.news.naver.com/mnews/article/018/0006412124","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"개복치 모자가 걸어온다…로봇이 된 ‘퐝이’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"과제 마감 챙겨주는 AI…튜링, 학업 비서 ‘파이’ 공개","link":"https://n.news.naver.com/mnews/article/018/0006412113","naverLink":"https://n.news.naver.com/mnews/article/018/0006412113","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"강의 포털·구글 캘린더 연동해 학업 일정 파악 시험 예상 문제부터 과제 초안까지 제안 팀원·AI가 한글·PPT·엑셀 함께 편집 [이데일리 신영빈 기자] 튜링은 과제 마감일과 시험 일정에 맞춰 할 일을 먼저 제안하는 대학생용 인공지능(AI) 에이전트 ‘파이(Pie)’를 선보였다고 18일 밝혔다. 파이는 튜링의 대학생용 AI 앱 ‘GPAI’에서 쓸 수 있다. 학생이 대학 강의 포털과 구글 캘린더를 연동하면 수강 과목과 강의자료, 학업 일정을 바탕으로 그날 할 일을 제안한다. 튜링 GPAI, 대학생 전용 AI 에이전트 '파이' 출시 (사진=튜링) 다음 주에 시험이 있으면 강의자료를 요약하고 예상 문제를 만든다. 과제 마감이 다가오면 문서나 엑셀, 발표자료 형태로 초안을 제시한다. 학생은 한 학기 동안 같은 대화창에서 작업을 이어갈 수 있다. 이전에 나눈 대화와 작업 내역은 다음 제안에 반영한다. 앱을 열면 첫 화면에서 할 일을 확인할 수 있도록 했고 강의 포털 연동 대상도 기존 25개 안팎 대학에서 국내 전체 대학으로 넓혔다. 조별 과제에 활용할 수 있는 실시간 공동편집 기능도 추가했다. 학생이 GPAI의 ‘AI 드라이브’에서 링크로 팀원을 초대하면 한글 문서와 파워포인트, 엑셀 파일을 함께 편집할 수 있다. 한 팀원이 AI에 수정을 요청하면 편집 권한이 있는 팀원 모두가 같은 문서에서 결과를 확인하고 후속 작업을 요청할 수 있다. 튜링은 앞으로 외부 서비스 연동을 늘려 취업 준비와 자격증 공부에 필요한 작업도 파이가 먼저 제안하도록 할 계획이다. 신지은·김지윤 튜링 공동대표는 “앞으로도 개인 학습부터 팀 프로젝트와 협업, 나아가 대학생의 일상 전반까지 GPAI 하나로 해결할 수 있도록 서비스를 지속 고도화하겠다”고 말했다.","category":"IT 과학"},{"title":"클러쉬, 베트남 소타텍과 AI 데이터센터 시장 공략","link":"https://n.news.naver.com/mnews/article/018/0006412110","naverLink":"https://n.news.naver.com/mnews/article/018/0006412110","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"‘엑셀레온’으로 GPU·NPU 통합 운영 검증 소타텍, 현지 고객 발굴·시스템 구축 담당 베트남 시작으로 동남아 시장 확대 추진 [이데일리 신영빈 기자] 클러쉬가 베트남 IT 기업 소타텍과 손잡고 현지 인공지능(AI) 데이터센터 시장을 공략한다. 클러쉬는 지난 6일 소타텍과 AI 인프라·AI 데이터센터(AIDC) 운영 협력을 위한 업무협약(MOU)을 맺었다고 18일 밝혔다. 타일러 루우(왼쪽) 소타텍 글로벌 총괄대표 CEO와 임정순 클러쉬 대표가 기념 사진을 찍고 있다. (사진=클러쉬) 양사는 클러쉬의 AI 인프라 운영 플랫폼 ‘엑셀레온’으로 그래픽처리장치(GPU)와 신경망처리장치(NPU)를 함께 운영하는 기술을 검증한다. 기술검증(PoC) 결과를 바탕으로 현지 상용화를 추진할 계획이다. 베트남 정부와 공공기관, 데이터센터 사업자, 통신사 등을 대상으로 공동 사업을 발굴한다. 클러쉬는 인프라 설계와 엑셀레온 설치·통합, 기술 지원을 맡는다. 소타텍은 현지 고객을 발굴하고 규제와 보안 요건에 맞춰 시스템을 구축·운영한다. 소타텍은 해외 법인 8곳과 개발자 2000여명을 둔 베트남 IT 기업이다. 소프트웨어 개발과 클라우드, 시스템 통합(SI) 사업을 해왔다. 이번 협약을 계기로 AI 인프라 운영 사업을 확대하고, 기존 기술 협력사인 국내 AI 반도체 기업 딥엑스·퓨리오사AI와도 협업을 강화할 계획이다. 임정순 클러쉬 대표는 “베트남에서 성공 레퍼런스를 만들고 이를 발판으로 ASEAN 시장까지 클러쉬의 글로벌 사업을 본격적으로 확대하겠다”고 말했다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-17","weekday":"화요일","label":"보관 · 11월 17일 화요일","total":48,"categories":{"사건 사고":[{"title":"'AI 커닝' 세무사 수석합격자, 13시간 경찰 조사 후 귀가 [종합]","link":"https://n.news.naver.com/mnews/article/015/0005355028","naverLink":"https://n.news.naver.com/mnews/article/015/0005355028","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하며 고개를 숙이고 있다. /사진=연합뉴스 인공지능(AI)을 이용해 제63회 세무사 시험에서 부정행위를 저질렀다고 자수한 수석합격자 한모씨(34)가 13시간 넘는 경찰 조사를 받고 귀가했다. 17일 오전 9시 20분께 서울 마포구 서울경찰청 광역수사단 청사로 들어선 한씨는 약 13시간 30분 만인 오후 10시 53분께 피의자 조사를 마치고 모습을 드러냈다. 연합뉴스에 따르면 한씨는 취재진에게 \"조사에 성실히 임하고 나왔다\"면서 \"다시 한번 세무사 시험을 열심히 준비해 온 모든 수험생과 관계자분들께 깊은 사과를 드린다\"고 말했다. 광수단 공공범죄수사대는 위계에 의한 공무집행방해 및 업무방해 혐의를 받는 한씨를 자수 후 이날 처음으로 불러 피의자 신분으로 조사했다. 앞서 지난 15일 오전 부정행위를 시인하고 서울청에 자수서를 낸 한씨는 같은 날 변호사의 유튜브 채널에 출연해 \"1·2차 시험에서 전자기기와 생성형 AI를 이용해 부정행위를 했다\"면서 \"제가 한 일을 모두 자수서에 써서 서울청에 제출했다\"고 밝혔다. 'AI안경'이 아닌 카메라로 시험 문제를 촬영해 AI에 전송한 뒤 스마트폰으로 답을 확인하는 방식으로 부정행위를 저질렀다는 게 한씨의 설명이다. 한씨가 시험 관계기관에 제출한 7쪽 분량의 경위서에는 범행 수법이 구체적으로 담긴 것으로 알려졌다. 연합뉴스는 경위서에 따르면 한씨는 카메라와 스마트폰, 개조된 계산기, 모니터를 들고 시험에 임했다고 보도했다. 감독관의 눈을 피해 시험 문제를 초소형 카메라로 촬영하면 스마트폰의 생성형 AI가 문제를 풀어줬고, 정답은 별도로 준비한 초소형 모니터로 확인했다는 것. 시험 문제와 정답을 송·수신하는 역할은 한씨가 개조한 계산기가 담당했고, 한씨는 서울로봇고를 졸업하고 대학에서 기계공학을 전공한 것으로 알려졌다. 경찰 조사에 앞서 한씨는 초소형 카메라와 노트북, 휴대전화 등 범행에 사용한 기기들을 일부 파손된 채로 경찰에 제출했으며, 경찰은 해당 기기들의 범행 사용 여부를 확인하기 위해 포렌식 작업을 진행 중이다. 이 밖에 경위서에는 지난해 12월부터 세무사와 회계사 시험을 대비해 부정행위를 준비했다는 내용이 담긴 것으로 전해졌고, 한씨는 세무사 시험에 앞서 지난 3월 치러진 제61회 공인회계사 시험에서도 부정행위를","category":"사건 사고"},{"title":"'AI 부정행위' 세무사 수석, 13시간 경찰 조사받고 귀가","link":"https://n.news.naver.com/mnews/article/422/0000927186","naverLink":"https://n.news.naver.com/mnews/article/422/0000927186","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"조사를 마치고 나온 한모(34) 씨 사진출처:연합뉴스 올해 세무사 시험에서 인공지능(AI)을 이용해 부정행위를 했다고 자수한 수석 합격자 한 모 씨가, 13시간 넘는 경찰 조사를 받고 오늘(17일) 밤 11시쯤 귀가했습니다. 서울경찰청 광역수사단 공공범죄수사대에서 피의자 조사를 받은 한 씨는 취재진에게 \"세무사 시험을 열심히 준비한 모든 수험생과 관계자들에게 다시 한 번 깊은 사과를 드린다\"며 \"앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 말했습니다. 경찰에 어떤 내용을 소명했느냐는 질문에 한 씨는 \"죄송하다\"고만 답했고, 조사 과정에서 범행을 시연했는지, 단독 범행인지 등 질문엔 답하지 않았습니다. 앞서 한 씨는 그제(15일) 법률대리인의 유튜브 방송에서 \"1·2차 시험 때 전자기기와 생성형 AI로 부정행위를 했다\"며, \"서울경찰청에 자수서를 제출했다\"고 밝혔습니다. 경찰 조사에 앞서 한 씨는 초소형 카메라와 노트북, 휴대전화 등 범행에 사용한 기기들을 일부 파손된 채로 제출했는데, 경찰은 해당 기기들이 실제로 범행에 이용됐는지 확인하기 위해 포렌식 작업을 진행 중입니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사건 사고"},{"title":"‘AI 부정행위’ 세무사 수석, 경찰 조사 약 13시간 만에 종료","link":"https://n.news.naver.com/mnews/article/056/0012295972","naverLink":"https://n.news.naver.com/mnews/article/056/0012295972","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"인공지능을 활용한 부정행위로 경찰에 자수한 제63회 세무사 시험 수석 합격자가 약 13시간에 걸친 조사를 마치고 귀가했습니다. 서울경찰청 광역수사단 공공범죄수사대는 오늘(17일) 위계에 의한 공무집행방해와 업무방해 혐의를 받는 34살 한 모 씨를 피의자 신분으로 불러 조사했습니다. 오늘 오전 9시 20분쯤 서울 마포구 서울경찰청 광역수사단 청사에 들어선 한 씨는 약 13시간 만인 밤 10시 50분쯤 피의자 조사를 마치고 청사에서 나왔습니다. 한 씨는 취재진에게 \"조사에 성실히 임하고 나왔다\"며 \"세무사 시험을 열심히 준비해 오신 모든 수험생과 관계자분들께 깊은 사과를 드린다\"고 말했습니다. 이어 \"앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 답했습니다. 다만 '어떤 내용을 소명했나' '조사 과정에서 범행 시연을 했나' '단독 범행인가' 등 질문에는 답하지 않고 \"죄송하다\"고만 말했습니다. 경찰은 오늘 한 씨를 상대로 구체적인 부정행위 수법과 활용 기기, 공범 존재 여부 등을 조사한 것으로 보입니다. 앞서 한 씨는 지난 15일 올해 세무사 시험에서 부정행위를 저질렀다며 서울경찰청에 자수서를 제출했습니다. 또, 같은 날 변호사의 유튜브 채널에 출연해 \"1·2차 시험에서 전자기기와 생성형 AI를 이용해 부정행위를 했다\"고 밝혔습니다. 또, 한 씨는 AI 안경이 아닌 초소형 카메라로 시험 문제를 촬영한 뒤 AI에 전송해 답을 확인하는 방식으로 부정행위를 저질렀다고 설명했습니다. 당시 AI가 생성한 답은 스마트폰 화면을 직접 보지 않고 초소형 액정 모니터로 확인한 것으로 알려졌습니다. 한 씨는 시험장 반입이 허용된 계산기도 개조해 가져갔는데, 이 계산기는 시험 문제와 AI가 생성한 답을 송수신하는 중계 장치 역할을 한 것으로 전해졌습니다. 경찰은 한 씨의 진술과 전자기기 분석 결과 등을 토대로 강제수사 여부를 검토할 예정입니다. [사진 출처 : 연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사건 사고"},{"title":"'AI부정행위' 세무 수석, 13시간 경찰조사 뒤 '고개 푹'…남긴 말은?","link":"https://n.news.naver.com/mnews/article/088/0001040913","naverLink":"https://n.news.naver.com/mnews/article/088/0001040913","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"\"모든 수험생과 관계자분께 깊은 사과…남은 절차도 모두 참석\" 세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하며 고개를 숙이고 있다. 연합뉴스 초소형 카메라와 인공지능(AI)을 이용해 세무사 시험에서 부정행위를 저질렀다고 자백한 수석 합격자 한모(34) 씨가 13시간 넘는 경찰 조사를 받고 귀가했다. 한씨가 계산기를 직접 개조하고 별도의 초소형 모니터까지 사용했다는 정황이 드러난 가운데 경찰은 제출된 전자기기를 분석하며 구체적인 범행 경위와 공범 여부를 확인하고 있다. 17일 경찰에 따르면 한씨는 이날 오전 9시 20분쯤 서울 마포구 서울경찰청 광역수사단 청사에 출석해 조사를 받은 뒤 오후 10시 53분쯤 건물을 나섰다. 한씨는 취재진 앞에서 \"조사에 성실히 임하고 나왔다\"며 \"다시 한번 세무사 시험을 열심히 준비해 온 모든 수험생과 관계자분들께 깊은 사과를 드린다\"고 고개를 숙였다. 이어 \"앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 약속했다. 다만 조사 과정에서 어떤 내용을 소명했는지, 범행을 재현했는지, 단독 범행인지 등을 묻는 질문에는 \"죄송하다\"는 말만 남겼다. 서울경찰청 광역수사단 공공범죄수사대는 한씨를 위계에 의한 공무집행방해 및 업무방해 혐의 피의자로 입건해 수사 중이다. 지난 15일 자수서를 제출한 이후 한씨가 경찰의 정식 피의자 조사를 받은 것은 이번이 처음이다. 한씨는 이날 오전 출석 당시에도 \"시험을 준비해 오신 수험생과 관계자분들께 진심으로 죄송합니다\"라며 \"제가 한 일을 숨기지 않고 수사기관에 사실대로 말씀드리겠다. 조사를 성실히 받고 잘못에 대한 책임을 지겠다\"고 했다. 범행에 사용된 것으로 알려진 전자기기와 관련해서도 새로운 정황이 나왔다. SBS는 이날 한씨의 7쪽 분량 경위서를 확보한 결과, 초소형 카메라와 스마트폰 외에도 개조된 계산기와 소형 모니터를 시험장에 반입했다는 내용이 담겼다고 보도했다. 한씨는 지난해 12월부터 세무사·공인회계사 시험 부정행위를 준비하면서 온라인에서 필요한 장비를 구매한 것으로 전해졌다. 특히 계산기를 직접 개조해 시험에 사용했다고 주장했다. 한씨는 초소형 카메라로 촬영한 시험 문제를 생성형 AI에 전달하고, 별도의 소형 모니터에서 답을 확인하는 방식으로 부정행위를 저질렀다는 입장이다. 개조된 계산기도 범행에 활용했다고 진술했으나 정답","category":"사건 사고"},{"title":"'세무냥이' 첫 경찰조사 13시간만 종료…\"남은 절차도 모두 참석\"","link":"https://n.news.naver.com/mnews/article/079/0004210885","naverLink":"https://n.news.naver.com/mnews/article/079/0004210885","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"경찰, 세무사 시험서 AI 부정행위 자수 '세무냥이' 첫 피의자 조사 \"수험생과 관계자에 죄송\" 답변 반복…범행 수법 질문에는 침묵 세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한(34)씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하며 고개를 숙이는 모습. 연합뉴스 올해 세무사 시험에서 인공지능(AI)과 초소형 전자기기 등을 활용한 부정행위를 저질렀다고 자수한 수석 합격자 '세무냥이' 한원석(34)씨에 대한 경찰 조사가 약 13시간 30분 만에 마무리됐다. 서울경찰청 광역수사단 공공범죄수사대는 17일 오전 9시 18분쯤 한씨를 위계에 의한 공무집행방해 및 업무방해 혐의로 소환해 조사했다. 조사는 약 13시간 30분 뒤인 오후 10시 50분쯤 마무리됐다. 조사를 마친 뒤 카메라 앞에 선 한씨는 \"조사에 성실히 임하고 나왔다\"며 \"다시 한번 세무사 시험을 열심히 준비해 온 모든 수험생과 관계자분들께 사과드린다. 앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 고개를 숙였다. 한씨는 수험생과 관계자들에게 사과하면서도 조사 과정에서 어떤 내용을 진술했는지 묻는 취재진 질문에는 \"죄송합니다\"라고만 답했다. 한씨는 조사 과정에서 범행을 시연했는지, 개조한 계산기와 모니터를 어떤 방식으로 사용했는지, 초소형 기기를 신체 어디에 숨겼는지 등 범행 수법에 관한 질문에도 답하지 않았다. 한씨는 단독 범행이 맞는지, 추가 자료를 제출할 계획이 있는지 등을 묻는 질문에도 답하지 않은 채 현장을 떠났다. 한씨는 이날 오전 경찰에 출석할 때도 취재진 앞에서 \"죄송합니다\"라고 말하며 두 차례 고개를 숙였다. 이어 \"시험을 준비해 온 모든 수험생과 관계자분들께 진심으로 죄송하다. 제가 한 일을 숨기지 않고 수사기관에 사실대로 말씀드리겠다. 성실하게 조사받고 잘못에 대한 책임을 지겠다\"고 말했다. 한씨는 제63회 세무사 시험 수석 합격자로, 온라인에서 '세무냥이'라는 이름으로 활동해왔다. 앞서 한씨는 지난 15일 유튜브 영상을 통해 초소형 카메라로 시험 문제를 촬영해 AI에 전송한 뒤 스마트폰을 활용해 답안을 확인하는 방식으로 부정행위를 저질렀다고 밝혔다. 한씨는 당시 부정행위에 사용한 초소형 카메라와 노트북, 휴대전화 등도 변호사를 통해 경찰에 임의제출했다. 경찰은 공범 여부와 구체적인 범행 수법 등을 조사한 것으로 알려졌다. 한씨는 외부 조력자 없이 단독으로 범행했다는 취","category":"사건 사고"},{"title":"李대통령, 태안 어선 실종 보고에 \"수색 최선 다할 것\" 지시","link":"https://n.news.naver.com/mnews/article/277/0005844813","naverLink":"https://n.news.naver.com/mnews/article/277/0005844813","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"이재명 대통령이 19일 충남 태안군 격렬비열도 인근 어선의 연락 두절 상황이 길어지고 있다는 보고를 받고 \"수색에 최선을 다하라\"고 지시했다. 강유정 청와대 수석대변인은 이날 언론 공지를 통해 이 대통령이 한성숙 국무총리와 관계부처에 이같이 지시했다고 전했다. 이 대통령은 중국 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의에 참석 중이다. 연합뉴스 또 이 대통령은 \"수색 인원의 안전에 유의하며 실종 가족의 지원에도 부족함이 없도록 할 것\"을 강조했다. 해양경찰청에 따르면 전날 오전 1시 무렵 충남 태안 해상에서 어선 한 척의 위치가 확인되지 않는다는 신고가 접수됐다. 어선에는 내국인 선장을 포함해 총 7명이 승선했다. 해경은 함정 17척과 항공기 3대 등을 투입해 수색 작업을 벌이고 있다.","category":"사건 사고"},{"title":"이란 매체 “게슘섬에서 잇단 폭발음…상공에선 연기 관측”","link":"https://n.news.naver.com/mnews/article/056/0012295971","naverLink":"https://n.news.naver.com/mnews/article/056/0012295971","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"이란 남부 연안에 있는 게슘섬 일대에서 원인을 알 수 없는 폭발음이 잇따라 들렸다고 파르스 통신이 현지 시각 17일 보도했습니다. 현지 주민들은 도시 북서쪽에서 여러 차례의 폭발음을 들렸으며, 폭발과 함께 섬 상공에서는 연기가 피어오르는 모습도 관측됐다고 말했습니다. 이번 폭발의 정확한 원인이나 배후 등은 아직 확인되지 않고 있습니다. 앞서 이란 이슬람혁명수비대는 이날 무인기를 동원해 바레인에 있는 셰이크 이사 공군 기지 내 미군 레이더 시스템을 타격했다고 발표했습니다. [사진 출처 : 구글지도 캡처] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사건 사고"},{"title":"'AI부정행위' 세무사 수석합격자 13시간 경찰조사 후 귀가(종합2보)","link":"https://n.news.naver.com/mnews/article/001/0016447557","naverLink":"https://n.news.naver.com/mnews/article/001/0016447557","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"\"수험생께 진심으로 죄송\"…15일 자수하고 첫 피의자 신분 조사 '카메라→AI→모니터' 직접 개조한 계산기로 문제·정답 송수신 조사를 마치고 나온 한모(34) 씨 [촬영 김채린] (서울=연합뉴스) 전재훈 김채린 기자 = 초소형 카메라 등 장비와 인공지능(AI)을 이용해 제63회 세무사 시험에서 부정행위를 저질렀다고 자수한 수석합격자 한모(34) 씨가 17일 13시간 넘는 경찰 조사를 받고 귀가했다. 이날 오전 9시 20분께 서울 마포구 서울경찰청 광역수사단 청사로 들어선 한씨는 약 13시간 30분 만인 오후 10시 53분께 피의자 조사를 마치고 청사에서 나왔다. 한씨는 취재진에게 \"조사에 성실히 임하고 나왔다\"며 \"다시 한번 세무사 시험을 열심히 준비해 온 모든 수험생과 관계자분들께 깊은 사과를 드린다\"고 말했다. 이어 \"앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 했다. 그는 '어떤 내용을 소명했나', '조사 과정에서 범행 시연을 했나', '단독 범행인가' 등 질문에는 답하지 않고 \"죄송하다\"고만 말했다. 광수단 공공범죄수사대가 위계에 의한 공무집행방해 및 업무방해 혐의를 받는 한씨를 자수 후 이날 처음으로 피의자 신분으로 불러 조사했다. 경찰은 한씨를 상대로 구체적인 부정행위 수법과 활용 기기, 공범 존재 여부 등을 조사한 것으로 보인다. 이날 오전 출석했을 때도 한씨는 자수를 결심한 계기를 묻는 취재진에 \"죄송합니다\"라고 말하며 고개를 숙였다. 그는 \"시험을 준비해 오신 수험생과 관계자분들께 진심으로 죄송합니다\"라며 \"제가 한 일을 숨기지 않고 수사기관에 사실대로 말씀드리겠다. 조사를 성실히 받고 잘못에 대한 책임을 지겠다\"고 말했다. 고개숙인 'AI커닝' 세무사시험 수석 합격자 (서울=연합뉴스) 김주형 기자 = 세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하며 고개를 숙이고 있다. 2026.11.17 kjhpress@yna.co.kr","category":"사건 사고"}],"사회":[{"title":"권순기 경남교육감, 국회 앞 1인 시위 … \"지방교육재정 상생안 입법해야\"","link":"https://n.news.naver.com/mnews/article/277/0005844030","naverLink":"https://n.news.naver.com/mnews/article/277/0005844030","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"\"우리 아이들이 안정적인 교육환경에서 배움을 이어갈 수 있도록 지방교육재정 상생안을 입법해 주십시오.\" 권순기 경남교육감이 17일 서울 여의도 국회의사당 정문에서 '지방교육재정 상생안' 입법 촉구 1인 시위에 나섰다. 권 교육감을 비롯한 전국 시·도교육감은 정부가 내국세 총액의 20.79％를 지방교육재정교부금 재원으로 산정하는 현행 방식을 폐지하고, 학령인구 변화와 경상성장률을 반영한 '지방교육재정교부금법 일부개정법률안'을 내놓은 것에 강한 우려를 표하며, 이에 맞서 교육재정의 안정성을 확보할 완충 장치로 '지방교육재정 상생안'을 제안했다. 권순기 경남교육감이 17일 서울 여의도 국회의사당 정문 앞에서 ‘지방교육재정 상생안’ 입법을 촉구하는 1인 시위를 하고 있다. [사진제공=경남교육청] 상생안은 지방교육재정교부금의 내국세 20.79％ 연동을 유지하되 세수가 전년보다 5％ 이상 증가하면 그 초과분의 3분의 2를 국가 미래대응기금에 출연하고 5％ 이상 감소하면 그 초과분의 3분의 1을 국가가 보전하는 것을 골자로 한다. 또 2026년분까지 종전 규정에 따른 정산분 11조 7000억원의 법률 명시, 미래대응기금 내 교육·인재 계정 지원 명시와 교육감협의체 추천 위원 포함 등도 담고 있다. 전국 시·도교육감은 내년도 예산안과 관련 법안 심의가 본격화하는 시기에 상생안의 필요성을 알리고 조속한 입법을 촉구하기 위해 릴레이 1인 시위를 하기로 했다. 권 교육감은 전국 시·도교육감 릴레이 1인 시위 첫 주자다. 권 교육감은 \"단순히 학생 수 감소만을 이유로 예산을 줄이는 것은 미래 교육의 기반을 약화하는 일\"이라며 \"세수 변동의 충격을 완충하고 교육 재정의 예측 가능성을 높이는 상생안이 조속히 입법화될 수 있도록 힘을 모아 달라\"고 말했다. 권 교육감을 비롯한 전국 시·도교육감들은 예산 부수 법안이 국회 본회의에 자동 부의되는 이달 말까지 국회와 협의하며 상생안의 취지가 법안에 반영될 수 있도록 총력을 기울일 방침이다. 교육감 릴레이 1인 시위는 수능일과 주말을 제외하고 오는 26일까지 일주일간 이어진다.","category":"사회"},{"title":"청주 옥산 주택서 불…60대 거주자 심정지","link":"https://n.news.naver.com/mnews/article/003/0014328522","naverLink":"https://n.news.naver.com/mnews/article/003/0014328522","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"[청주=뉴시스] 서주영 기자 = 17일 오후 9시11분께 충북 청주시 흥덕구 옥산면의 한 단층 단독주택에서 불이 났다. 신고를 받고 출동한 소방당국은 주택 내부에서 심정지 상태인 A(60대)씨를 발견해 병원으로 이송했다. 함께 거주하던 A씨 가족 1명은 스스로 대피했다. 불은 건물 일부를 태우고 1시간여 만에 진화됐다. 경찰과 소방당국은 정확한 화재 원인과 피해 규모를 조사하고 있다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/422/0000927187","naverLink":"https://n.news.naver.com/mnews/article/422/0000927187","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 경북 상주에서 규모 3.6의 지진이 발생했습니다. 올해 발생한 지진 중 가장 강한 규모로, 곳곳에서 흔들림이 감지됐는데요. 자세한 지진 상황, 취재기자 연결해 알아보겠습니다. 김동혁 기자 [기자] 오늘(17일) 오후 11시 10분쯤 경북 상주시에서 규모 3.6의 지진이 발생했습니다. 기상청은 경북 상주시 북서쪽 22㎞ 지역에서 규모 3.6의 지진이 일어났다고 밝혔습니다. 진앙의 자세한 주소는 경북 상주시 외서면 대전리입니다. 국토 중심부에서 비교적 규모가 큰 지진이 발생해 인근 많은 지역에서 흔들림이 발생했습니다. 이번 지진으로 경북과 충북에서는 진도 4의 흔들림이 감지됐습니다. 진도 4는 실내에서 많은 사람이 느끼고, 일부가 잠에서 깨며, 그릇, 창문 등이 흔들리는 수준입니다. 지진이 일어난 경북 상주시 인근 강원과 세종, 전북 지역도 계기 진도 3이 관측됐습니다. 계기진도3은 실내, 특히 건물 위층에 있는 사람이 현저하게 흔들림을 느끼며, 정지하고 있는 차가 약간 흔들리는 정도입니다. 이번 지진은 올해 한반도에서 발생한 지진 중 가장 큰 규모입니다. 기존 최대 규모는 지난 3월 강원 삼척시 해역과 지난 8월 전남광주 해남군에서 일어난 규모 3.1입니다. 이번 지진이 발생한 진앙지 반경 50㎞ 이내에서는 지난 1978년 규모 5.2의 강진이 일어나기도 했습니다. 가장 최근에는 지난 7월 23일 규모 2.6의 흔들림이 관측되기도 했습니다. 기상청은 지진 발생 인근 지역에서 지진동을 느낄 수 있다며 안전에 유의해 달라고 당부했습니다. 지금까지 보도국에서 전해드렸습니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사회"},{"title":"경북 상주 북서쪽서 규모 3.6 지진…유감신고 16건(종합)","link":"https://n.news.naver.com/mnews/article/003/0014328520","naverLink":"https://n.news.naver.com/mnews/article/003/0014328520","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"[상주=뉴시스] 이상제 기자 = 17일 오후 11시10분께 경북 상주시 북서쪽 22㎞ 지역에서 규모 3.6의 지진이 발생했다. 기상청에 따르면 진앙은 북위 36.52도, 동경 127.96도이며 지진 발생 깊이는 20㎞로 분석됐다. 계기진도는 경북과 충북에서 최대 Ⅳ로 나타났다. 강원·세종·전북은 Ⅲ, 경기·경남·대구·대전·광주·충남은 Ⅱ로 관측됐다. 계기진도 Ⅳ는 실내에 있는 다수가 진동을 느끼고 그릇이나 창문 등이 흔들리는 수준이다. Ⅲ은 건물 위층에 있는 사람이 진동을 뚜렷하게 느끼고 정차한 차량이 약간 흔들리는 정도다. Ⅱ는 조용한 상태나 건물 위층에 있는 소수의 사람만 진동을 느끼는 수준이다. 현재까지 경북 지역에서 접수된 지진 유감신고는 16건이며 피해 신고는 없는 것으로 파악됐다. 기상청은 \"지진 발생 인근 지역은 지진동을 느낄 수 있다\"며 \"안전에 유의하기 바란다\"고 말했다.","category":"사회"},{"title":"수능 이틀 전 경북 상주서 규모 3.6 지진…올들어 가장 강해(종합2보)","link":"https://n.news.naver.com/mnews/article/001/0016447587","naverLink":"https://n.news.naver.com/mnews/article/001/0016447587","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"17일 오후 11시 10분 17초 경북 상주시 북서쪽 22㎞ 지점에서 발생한 규모 3.6 지진 진앙. [기상청 제공. 재판매 및 DB 금지] (서울·상주=연합뉴스) 이재영 박세진 기자 = 17일 오후 11시 10분 17초 경북 상주시 북서쪽 22㎞ 지점에서 규모 3.6 지진이 발생했다고 기상청이 밝혔다. 진앙은 북위 36.52도, 동경 127.96도로 행정구역상 상주시 외서면이다. 진원의 깊이는 20㎞로 파악됐다. 애초 지진파 중 속도가 빠른 P파를 자동 분석한 결과 규모가 3.7로 추정됐으나, 추후 상세 분석을 거쳐 3.6으로 조정됐다. 국토 중심부에서 규모가 있는 지진이 발생하며 많은 지역이 흔들렸다. 경북 상주·문경시와 충북 보은군은 계기진도가 4로, '실내에 많은 사람이 느끼고 밤에는 잠에서 깨기도 하며, 그릇과 창문이 흔들리는 정도'의 흔들림이 있었을 것으로 추정된다. 또한 경북 김천시·예천군과 충북 괴산군·영동군·옥천군·제천시·증평군·청주시·충주시, 강원 영월군, 세종, 전북 무주군 등에선 '실내, 특히 건물 위층에서 현저히 느껴지며, 정차한 차가 약간 흔들리는 진동'(계기진도 3)이 있었겠다. 17일 오후 11시 10분 17초 경북 상주시 북서쪽 22㎞ 지점에서 발생한 규모 3.6 지진 계기진도 분포. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"경북 상주 규모 3.6 지진…올해 발생 지진 중 최대 규모","link":"https://n.news.naver.com/mnews/article/002/0002466341","naverLink":"https://n.news.naver.com/mnews/article/002/0002466341","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"충북에도 진도 3 흔들림 전달…경북소방본부 유감신고 13건 접수, 현재까지 피해 없어 경북 상주에서 규모 3.6의 지진이 발생해 충북을 비롯한 인근 지역에서도 흔들림이 감지되는 등 유감신고가 잇따랐다. 기상청에 따르면 17일 오후 11시 10분 17초께 경북 상주시 북서쪽 22㎞ 지점에서 규모 3.6의 지진이 발생했다. 진앙은 상주시 외서면 대전리 일대(북위 36.52도, 동경 127.96도)로 파악됐다. 이번 지진은 올해 들어 발생한 지진 가운데 규모가 가장 큰 것으로 나타났다. 지진으로 경북 지역에는 최대 진도 4의 흔들림이 전달된 것으로 추정됐다. 진도 4는 실내에 있는 많은 사람이 진동을 느끼고 일부는 잠에서 깰 수 있으며, 그릇이나 창문 등이 흔들리는 수준이다. 이날 충북에도 진도 3의 흔들림이 전달됐으며, 대전·세종·대구·충남·전북·경기·강원·경남 등에는 진도 2의 진동이 감지된 것으로 분석됐다. 경북소방본부에는 이날 오후 11시 19분 기준 지진을 느꼈다는 신고가 모두 13건 접수됐다. 다행히 현재까지 인명이나 재산 피해는 없는 것으로 파악됐다. 기상청은 “이번 지진의 규모와 진도 정보가 지진파(P파)를 활용한 자동 추정치로, 정밀 분석 결과에 따라 달라질 수 있다”고 설명했다. 또한 “추가 흔들림에 대비해 넘어지기 쉬운 가구 등에서 떨어져 있고, 진동이 멈춘 뒤에는 가스와 전기 상태를 확인한 후 안전한 장소로 대피할 것”을 당부했다. ▲ 17일 오후 11시 10분 17초께 경북 상주시 북서쪽 22㎞ 지점에서 규모 3.6의 지진이 발생했다.ⓒ기상청 제공","category":"사회"},{"title":"경북 상주서 규모 3.6 지진","link":"https://n.news.naver.com/mnews/article/079/0004210886","naverLink":"https://n.news.naver.com/mnews/article/079/0004210886","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"경북 상주서 규모 3.6 지진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"경북 상주 규모 3.6 지진…충북서도 유감 신고 18건","link":"https://n.news.naver.com/mnews/article/003/0014328516","naverLink":"https://n.news.naver.com/mnews/article/003/0014328516","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 17일 오후 11시10분께 경북 상주시에서 발생한 지진의 진앙. (사진=기상청 제공) 2026.11.17. photo@newsis.com *재판매 및 DB 금지 [청주=뉴시스] 서주영 기자 = 17일 경북 상주에서 규모 3.6의 지진이 발생한 뒤 충북에서도 흔들림을 느꼈다는 신고가 잇따랐다. 기상청에 따르면 이날 오후 11시10분께 경북 상주시 북서쪽 22㎞ 지점에서 규모 3.6의 지진이 발생했다. 충북소방본부에 접수된 지진 유감 신고는 오후 11시30분 기준 18건이다. 신고 내용은 대부분 \"건물이 흔들렸다\"는 취지인 것으로 전해졌다. 현재까지 인명피해나 대피 인원은 없는 것으로 확인됐다. 진앙은 북위 36.52도, 동경 127.96도이며 발생 깊이는 20㎞다. 최대 진도는 Ⅳ(4)다．","category":"사회"},{"title":"경북 상주 지진으로 충북서 유감신고 18건 접수돼","link":"https://n.news.naver.com/mnews/article/655/0000033612","naverLink":"https://n.news.naver.com/mnews/article/655/0000033612","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"AI로 생성한 이미지. 오늘(17) 오후 11시 10분쯤 경북 상주시에서 발생한 규모 3.6의 지진과 관련해 충북에서도 유감신고 18건이 접수된 것으로 파악됐습니다. 오늘 오후 11시 40분 기준 충북 소방본부 상황실에 접수된 지진 유감신고는 18건으로, 지역별로는 청주 9건, 보은 4건, 충주 2건, 증평과 음성, 옥천에서 각각 1건씩 신고됐습니다. 이들 신고는 \"아파트 흔들렸다\"는 등의 단순 내용이 주를 이뤘습니다. 현재까지 인명이나 실제 시설 파손 등의 피해 신고는 없습니다. 기상청은 오늘(17) 오후 11시 10분쯤 \"경북 상주시 북서쪽 22km 지역에서 규모 3.7 지진이 발생했다\"며 추가 지진 발생상황에 유의하라는 내용의 안전 재난 문자를 보냈습니다. 그리고 6분 뒤인 11시 16분쯤 재차 안전문자를 보내며 \"상세 분석 결과 해당 지진의 규모를 3.7에서 3.6으로 조정한다\"고 안내했습니다.","category":"사회"},{"title":"경북 상주시 북서쪽 22km에서 규모 3.6 지진","link":"https://n.news.naver.com/mnews/article/052/0002434252","naverLink":"https://n.news.naver.com/mnews/article/052/0002434252","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"오늘 밤 11시 10분쯤 경북 상주시 북서쪽 22km 지점에서 규모 3.6의 지진이 발생했습니다. 지진 발생 깊이는 20km로 집계됐습니다. 기상청은 이번 지진으로 경북 문경과 상주, 충북 보은에서 진도 4의 흔들림이 있을 것으로 추정했습니다. 진도 4는 실내에서 많은 사람이 느끼고 밤에는 잠에서 깨기도 하며, 그릇과 창문이 흔들리는 수준의 강도입니다. 이번 지진은 올해 우리나라에서 발생한 지진 가운데 가장 센 것으로, 규모 3.5 이상의 지진은 지난해 5월 충남 태안 북서쪽 52km 해역에서 일어난 3.7 지진 이후 처음입니다. 경북소방본부는 지금까지 지진 관련 신고가 13건 들어왔다고 밝혔습니다. YTN에도 \"자려고 누웠는데 건물이 흔들렸다\", \"강아지가 계속 짖었다\"는 제보가 접수됐습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"}],"생활·문화":[{"title":"세븐일레븐, 사회복무요원까지 '나라사랑' 확대…내년부터 편의점 할인 혜택","link":"https://n.news.naver.com/mnews/article/018/0006412280","naverLink":"https://n.news.naver.com/mnews/article/018/0006412280","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"앱 연계 ‘나라사랑멤버십’ 내년 상반기 내 도입 푸드 간편식, 일반 상품 등 할인 혜택 제공 [이데일리 박지애 기자] 편의점 세븐일레븐이 현역 군장병 중심으로 운영해온 ‘나라사랑 캠페인’의 지원 대상을 사회복무요원까지 확대한다. 김대일 세븐일레븐 대표이사(왼쪽)와 김용무 병무청 차장(오른쪽)이 서울 강동구 세븐일레븐 본사에서 열린 업무협약식에서 기념촬영을 하고 있다. (사진=코리아세븐) 세븐일레븐을 운영하는 코리아세븐은 지난 18일 서울 강동구 본사에서 병무청과 ‘사회복무요원 복지 증진을 위한 업무협약’을 체결했다고 19일 밝혔다. 협약식에는 김대일 세븐일레븐 대표이사와 김용무 병무청 차장, 서승일 병무청 사회복무국장 등 양 기관 주요 관계자가 참석했다. 이번 협약은 병역의무 이행에 대한 사회적 예우를 확대하고 사회복무요원에게 실질적인 복지 혜택을 제공하기 위해 마련됐다. 세븐일레븐이 지난 2014년부터 13년간 이어온 나라사랑 캠페인의 지원 대상을 사회복무요원으로 확대한 것은 이번이 처음이다. 세븐일레븐은 전국 점포망을 활용해 사회복무요원에게 간편식과 생필품 등 일상 소비에 필요한 상품의 할인 혜택을 제공할 계획이다. 이를 위해 내년 상반기 중 공식 모바일 애플리케이션(앱)과 연계한 ‘나라사랑 멤버십’을 도입한다. 전국 사회복무요원이 앱을 통해 간편하게 할인 혜택을 받을 수 있도록 시스템을 구축할 예정이다. 양 기관은 서비스 운영과 활성화를 위한 기술적·행정적 지원에도 협력하기로 했다. 세븐일레븐은 지난 2014년 백령도 해병부대에 위문품을 전달한 것을 시작으로 다양한 군 장병 지원 활동을 펼쳐왔다. 현재까지 전국 육·해·공군 부대에 50여 차례에 걸쳐 6억원 이상의 물품을 후원했다. 지난해에는 국가보훈부 공공 협력 사업인 국가유공자 할인 서비스를 소상공인연합회 회원사 중 처음으로 도입했다. 보훈 가족과 제대군인을 대상으로 ‘보훈 마켓’ 앱과 연계한 할인 서비스를 운영하고 있으며, 누적 이용자 수는 28만명에 달한다. 최재두 세븐일레븐 커뮤니케이션팀 ESG담당은 “병역의무를 이행하는 사회복무요원들에게 일상에서 체감할 수 있는 혜택을 제공하고자 이번 협력을 추진했다”며 “앞으로도 병역 이행에 대한 존중과 예우를 넓히는 데 적극적으로 힘을 보태겠다”고 말했다.","category":"생활·문화"},{"title":"[채승우의 카메라 타임머신] 생애 첫 입학시험","link":"https://n.news.naver.com/mnews/article/023/0004010161","naverLink":"https://n.news.naver.com/mnews/article/023/0004010161","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"조선일보는 그동안 보관해 온 1950년대 이후 1200만여 컷의 필름을 디지털로 바꿔 사진 아카이브를 구축하고 있다. 과거의 모습을 다시 볼 뿐만 아니라 새로운 이야기를 발굴하는 타임머신이 될 것으로 기대한다. -편집자 주 1963년 12월 27일 서울대 사범대 부속국민학교의 입학시험이 실시됐다. 남자 어린이들이 지능검사를 받고 있다. /조선일보DB 1963년 12월 27일 서울사대부속국민학교(특수학교)에서 어린이들이 지도 학생들과 함께 생애 첫 입학시험을 치르고 있다. 명목은 지능검사였지만, 당시 신문 제목처럼 “입맛 쓴 첫 시련”이었다. 일반 국민학교는 학구제에 따라 무시험 입학한 데 비해, 특수, 사립학교는 학생 선발권이 있었다. 당시 서울사대부속국민학교 경쟁률은 20대1에 달했다. 지능검사는 그림을 보고 셈하는 등의 문제였는데, 일부 학교에선 부잣집 아이들만 익숙한 TV, 냉장고, 전축 그림이 출제돼 어린이들은 환경의 차이를 마주해야 했다. 비싼 기성회비를 내는 학생들을 우선 선발해 공정성 논란도 일었다. 결국 1967년부터 특수, 사립학교도 추첨(뺑뺑이)으로 학생을 선발하는 제도가 도입됐다. 초기에는 지원자가 너무 많아 추첨을 병행하기도 했다. 1962년 12월 29일 서울사대부국에서 뺑뺑이 추첨과 지능검사, 면접을 함께 실시했다.","category":"생활·문화"},{"title":"갤럭시 사진 전송, 이제 ‘톡’ 맞대면 끝[모닝폰]","link":"https://n.news.naver.com/mnews/article/018/0006412187","naverLink":"https://n.news.naver.com/mnews/article/018/0006412187","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"삼성 원UI 9.5 베타서 새 기능 확인 NFC 기술 활용…애플 에어드롭과 유사 [이데일리 신영빈 기자] 삼성전자(005930) 갤럭시 스마트폰끼리 서로 맞대기만 해도 사진이나 파일을 공유할 수 있는 기능이 새롭게 등장했다. 애플 에어드롭처럼 복잡한 조작 없이 스마트폰을 가까이 대는 것만으로 파일 전송을 시작할 수 있게 된다. 19일 정보기술(IT) 업계에 따르면 삼성전자가 전날 공개한 ‘원 UI 9.5’ 베타 버전에서 ‘탭 투 쉐어’ 기능이 새로 적용됐다. 갤럭시 스마트폰끼리 서로 맞대기만 해도 사진이나 파일을 공유할 수 있는 ‘탭 투 쉐어’ 기능 사용 예상도 (사진=챗GPT 생성) 탭 투 쉐어는 갤럭시 스마트폰의 파일 공유 기능인 ‘퀵쉐어’에 추가된 기능이다. 사진이나 동영상 등 공유할 파일을 선택한 뒤 상대방 스마트폰에 자신의 기기를 가까이 대면 파일 전송을 시작할 수 있다. 기존 퀵쉐어는 주변 기기를 검색하고 전송할 상대방을 선택하는 방식이다. 새로운 기능은 스마트폰을 서로 맞대는 동작으로 상대방을 지정할 수 있어 파일 공유 과정이 한층 간편해진다. 이를 위해 근거리무선통신(NFC) 기술을 활용한다. NFC는 스마트폰을 교통카드 단말기 등에 가까이 대면 정보를 주고받을 수 있도록 하는 기술이다. 탭 투 쉐어를 사용하려면 파일을 주고받는 두 스마트폰 모두 NFC를 지원해야 한다. 애플이 아이폰에 제공하는 에어드롭과도 유사하다. 애플은 아이폰 두 대를 가까이 대면 사진이나 파일을 공유할 수 있도록 지원한다. 연락처를 교환하는 ‘네임드롭’ 기능도 제공한다. 삼성전자는 18일부터 한국과 미국, 영국, 독일, 폴란드, 인도 등 6개국에서 갤럭시 S26 시리즈를 대상으로 원UI 9.5 베타 프로그램을 시작했다. 국내 이용자도 삼성 멤버스 앱을 통해 참여할 수 있다. 이번 업데이트에는 개별 앱을 생체인식이나 비밀번호로 보호하는 ‘앱 잠금’ 기능도 추가됐다. 잠긴 앱의 알림 내용과 위젯까지 숨길 수 있다. 카메라에서는 전문가용 사진·동영상 촬영 설정을 저장해 다시 불러오고 주요 설정을 한 화면에서 조절할 수 있도록 개선됐다. 삼성 헬스에는 감정과 생각을 기록하는 ‘마음 노트’ 기능이 추가됐으며 복약 관리 기능의 지원 국가도 확대됐다. 특정 앱을 실행하기 전 10초간 멈추도록 설정해 스마트폰 사용을 줄이는 기능과 워드·파워포인트 문서를 별도 앱 없이 열어보는 기능도 도입됐다.","category":"생활·문화"},{"title":"서울시, 외국인 채용박람회 개최…인재 취업·정착 지원","link":"https://n.news.naver.com/mnews/article/030/0003486797","naverLink":"https://n.news.naver.com/mnews/article/030/0003486797","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"서울시가 외국인 인재의 국내 취업부터 안정적인 정착까지 지원을 확대한다. 외국인 구직자와 기업 간 채용 연계를 강화하고 글로벌 인재의 서울 정착을 촉진한다는 구상이다. 서울시는 18일 강남구 세텍(SETEC)에서 '2026 서울 외국인 취업·채용박람회'를 개최한다. 지난해에 이어 두 번째 열리는 행사로, 기업 모집 3주 만에 117개 기업이 참여를 신청했다. 외국인 구직자 사전 신청자도 2500명을 넘어섰다. 서울시 글로벌 잡 페어 2026 행사장 개요. 서울시 제공 국내 외국인 유학생은 올해 처음 30만명을 돌파했지만 실제 국내 취업으로 이어지는 비율은 7명 중 1명에 그친다. 반면 외국인 유학생의 86.5%는 한국 취업을 희망하는 것으로 조사됐다. 중소기업 역시 78.4%가 외국인 인재 채용 계획이 있지만 75.9%는 채용정보 확보와 적합한 인재 발굴에 어려움을 겪고 있다. 이번 박람회에는 삼성화재·삼성생명·신한은행·카카오뱅크 등 금융기업을 비롯해 롯데월드, 파크 하얏트 서울, 쿠팡풀필먼트서비스 등이 참여한다. 채용 분야는 글로벌사업·재무회계, 해외영업, 마케팅, 의료관광, 인공지능(AI) 풀스택 개발, 고객 응대 등이다. 참여기업 중 61곳은 외국인 유학생(D-2)과 구직자(D-10)의 취업 관련 체류자격 변경도 지원한다. 구직자는 공식 누리집에서 희망 기업의 면접을 사전 예약할 수 있다. 현장에서는 이력서 첨삭, AI 기반 맞춤형 기업 추천, 면접 상담 등을 제공한다. 별도 정착지원 공간에서는 비자·체류자격, 법률, 주거, 금융·연금 관련 무료 상담을 진행한다. 서울시는 행사 종료 후 3개월간 후속 면접과 채용 진행 상황을 확인하는 등 취업 연계를 이어갈 방침이다. 김명주 서울시 글로벌도시정책관은 “서울이 세계 최고 대학생 도시로 인정받은 만큼 이제는 공부한 글로벌 인재들이 서울 기업에서 일하고 성장할 수 있도록 지원할 때”라며 “이번 박람회로 외국인 인재와 기업의 채용 기회를 넓히고 취업부터 안정적인 정착까지 이어지는 지원체계를 강화하겠다”고 말했다.","category":"생활·문화"},{"title":"“슈퍼맘 신화는 없어요”…가수 이소은, 무대 위에 ‘진짜 엄마’를 쓰다 [인터뷰]","link":"https://n.news.naver.com/mnews/article/016/0002724785","naverLink":"https://n.news.naver.com/mnews/article/016/0002724785","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"전작 ‘건전지 아빠’ 이어 두 번째 시리즈 오선화 PD와 의기투합, 뮤지컬 작가 데뷔 “부모도 흔들리며 자라는 불완전한 인간” 워킹맘·전업맘 이분법 넘은 ‘돌봄의 연대’ 조명 가족뮤지컬 ‘건전지 엄마’의 이소은 작가와 오선화 NHN링크 콘서트사업팀 부장(‘건전지 엄마’ 프로듀서 [NHN링크 제공] [헤럴드경제=고승희 기자] 매일 아침 6~7시, 알람 소리에 시작하는 하루. 무거운 눈꺼풀을 겨우 뜨면 숨 고를 틈도 없이 일상이 시작된다. 서둘러 아침을 차리고, 아이를 달래 어린이집으로 향하는 전쟁 같은 작은 소동. 날마다 반복되는 치열한 일상이다. 폼 나는 영웅의 망토를 두르지 않았지만, 아이에게 엄마는 언제나 ‘에너자이저’다. “우리 엄마는 못 하는 게 없어. 우리나 심심할 때나 아플 때 언제나 가장 먼저 달려와. 엄마는 세상에서 가장 용감한 건전지야.” 그림책 ‘건전지 엄마’의 첫 장, ‘아이들의 믿음’을 한껏 담아 여는 이 문장 앞에서 이소은은 오래도록 마음이 머물렀다고 한다. “아이들은 엄마를 이토록 의심 없이 믿어주는데, 정작 같은 믿음을 스스로에게 늘 갖지 못할까”하는 생각에서였다. “(겉으론) 자신감 있어 보이지만, 실은 자기 의심이 많아요. 그래서 좌절도 하죠. 부모는 아이들의 성장만 생각하지만 사실 엄마인 나도 한 인간으로서 함께 자라고 있기에 겪는 고충이 따르는 것 같아요. 그 이야기를 솔직하게 보여주고 싶었어요.” (이소은) ‘소녀 가수’로 한 시절을 풍미했고, 미국으로 건너가 로스쿨을 마친 뒤 뉴욕에서 변호사로 일하던 가수 이소은이 이번엔 뮤지컬 작가로 첫발을 내디뎠다. 그가 극작가로 처음 이름을 올린 작품은 가족뮤지컬 ‘건전지 엄마’(2027년 1월 2일 개막, 이화여대 ECC 영산홀)다. 동명의 그림책을 원작으로 한 이 작품은 지난해 막 올린 ‘건전지 아빠’의 후속작이다. 이소은은 대본과 작사를 맡았다. 무대 위엔 어린이집 교사인 동구 엄마와 눈에 보이지 않는 곳에서 어린이집의 기기를 돌리는 건전지 엄마의 땀방울 맺힌 하루가 나란히 펼쳐진다. ‘엄마들의 하루’를 응원하기 위해 의기투합한 이소은 작가와 오선화 프로듀서(NHN링크 콘서트사업팀 부장) 역시 일과 육아를 병행하는 ‘젊은 엄마들’이다. 최근 서울 광화문의 한 카페에서 만난 두 사람은 “슈퍼맘이 최고인 것처럼 보이지만, (세상에) 완벽한 엄마는 없다”고 말한다. 가족뮤지컬 ‘건전지 엄마’의 이소은 작가 [NHN링크 제공]","category":"생활·문화"},{"title":"SAS “내년은 AI 성과의 해…기업 내 책임·신뢰 중요해진다”","link":"https://n.news.naver.com/mnews/article/030/0003486798","naverLink":"https://n.news.naver.com/mnews/article/030/0003486798","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"올해 4월 미국 그레이프바인 게이로드 텍산 리조트 컨벤션센터에서 'SAS 이노베이트 2026' 키노트가 진행되고 있다. ⓒ박종진기자 SAS가 기업 업무 전반에 인공지능(AI) 에이전트 도입이 확산되며 책임 소재와 투자 성과, 의사결정 신뢰성이 핵심 과제로 부상할 것으로 전망했다. AI가 단순 업무 지원을 넘어 스스로 판단하고 실행하는 단계로 점차 발전하며 기업의 관리·감독 체계와 경영 전략에도 변화가 있을 것이라고 예상했다. SAS는 17일 이같은 내용을 담은 '2027년 AI 산업 주요 전망' 11가지를 제시했다. 'AI가 결과로 평가받는 해'가 될 것이며 지난 몇 년간 AI가 기업에 무엇이 가능한지 보여줬다면 이제는 실제 성과를 내는지 증명해야 한다는 것이다. 최고정보책임자(CIO)가 사람뿐 아니라 AI 에이전트의 시스템 접근 권한까지 관리하게 된다. 에이전트의 데이터 접근 범위와 보안, 책임 소재를 명확히 하는 것이 경쟁력으로 작용할 전망이다. 금융 분야에서는 AI 에이전트가 쇼핑·구매를 넘어 송금 등 중요한 의사결정까지 수행할 것으로 예상된다. 은행은 거래 검증뿐 아니라 에이전트의 권한 위임 범위와 안전성까지 확인해야 한다. 소프트웨어(SW) 시장도 재편될 예정이다. AI로 자체 SW 개발이 쉬워지면서 기존 SW 기업은 산업 전문성과 제품 경쟁력, 실행력을 바탕으로 구매할 만한 가치를 입증해야 하는 게 과제로 지목됐. AI 생산성의 역설도 심화될 전망이다. 콘텐츠와 코드, 분석 결과물은 급증하지만 실질적인 경영 성과로 연결됐는지 증명하기는 어려워진다. 단순한 업무 속도 개선보다 업무 방식 자체를 재설계하는 역량이 중요해진다. 최고데이터책임자(CDO)는 AI 의사결정 기준을 새롭게 정립해야 한다. 의사결정 지연을 방지하면서 설명 가능성과 윤리성, 사람과 AI의 협력을 확보하는 것이 과제다. AI가 보편화될수록 조직의 학습 능력도 중요해질 것으로 지목됐다. AI의 판단과 사람의 개입이 실제 성과에 미친 영향을 분석하고 이를 개선에 반영하는 기업이 경쟁 우위를 확보할 것이란 예상이다. 또 AI 에이전트의 행동에 대한 기업 책임도 강화된다. 잘못된 고객 응대나 승인받지 않은 제안이 브랜드 위기로 이어질 수 있어 사람의 개입과 에이전트 중단 권한을 명확히 해야 한다. AI 투자 시장에서는 수익성 검증과 투자 재조정이 본격화된다. 막대한 인프라 비용을 감당할 수 있는 초대형 클라우드 기업의 영향력이 확대될 것으로","category":"생활·문화"},{"title":"[김도훈의 엑스레이] [147] ‘스마트 어쩌고’가 사람 잡네","link":"https://n.news.naver.com/mnews/article/023/0004010159","naverLink":"https://n.news.naver.com/mnews/article/023/0004010159","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"할리우드는 허술하다. 각본이 허술하다. 각본 꼼꼼하게 쓰는 사람도 많다. 할리우드는 그런 양반들에게는 큰 예산을 잘 주지 않는다. 허술해야 큰돈을 번다고 생각하는 모양이다. 관객을 허술하게 여기는 것이다. 할리우드는 미래 무대 영화를 만들 때 특히 허술해진다. SF 영화다. 좋아하는 장르다. 나는 ‘인디펜던스 데이’도 좋아한다. 그 영화는 모든 게 허술하다. 허술한 영화도 허술한 재미는 있다. 결말은 너무 허술해서 흥이 떨어진다. 윌 스미스는 외계인 모선에 컴퓨터 바이러스를 침투시킨다. 외계인 전투기가 다 멈춘다. 인간은 승리한다. 지구보다 발전한 시스템이 그렇게 허술할 리가 없다. 선진 문명 국방부 장관이 백업도 모르는 모양이다. 많은 결말이 그렇다. ‘스타워즈: 보이지 않는 위험’은 통제함을 파괴하자 모든 로봇이 멈춘다. ‘아이, 로봇’은 중앙 시스템을 제거하자 모든 로봇이 정신을 차린다. ‘어벤져스’도 모선을 폭파하자 외계 군단이 다 쓰러진다. 참 돈 쉽게 번다. 나는 할리우드에 사과하는 마음으로 글을 쓰고 있다. 지난주 지구가 멈췄다. 미국 항공기 이륙이 중단됐다. 보안 프로그램 파일 때문이다. 미국은 사태 사흘 전 AI 항공 관리 시스템 도입을 발표했다. 인과관계는 없다. 모르겠다. 멀쩡한 사람도 음모론자로 만드는 세상이다. 마이크로소프트도 멈췄다. 미국 최대 은행 JP모건도 멈췄다. 버그 때문이다. 외계인은 지구 침공 시 전력을 쓸 필요도 없다. 중앙 시스템만 건드리면 끝이다. 문명은 디지털이라는 이름 아래 허술해졌다. 할리우드는 허술하지 않았다. 리얼리즘이었다. 내 존재는 구름 속에 있다. 클라우드에 모든 기록이 있다. 구름이 걷히면 사라진다. 그깟 기록 없이도 생존은 가능하다. 외계인이 침공해도 냉장고만 채워두면 산다. 아니다. 프랑스 전역 슈퍼마켓 냉장고도 해킹으로 온도가 치솟았다. 아까운 고기를 다 버렸다. 나는 스마트 어쩌고 이름을 단 가전제품들을 의심하기 시작했다. 스마트한 사람이 되어야 산다. 스마트폰 없이 스마트해질 수 있을지는 잘 모르겠다.","category":"생활·문화"},{"title":"習 “점진적 문화교류 전개”… K콘텐츠 ‘최혜국 대우’ 약속도","link":"https://n.news.naver.com/mnews/article/022/0004176320","naverLink":"https://n.news.naver.com/mnews/article/022/0004176320","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"10년 만에 한한령 해제 청신호 업계 기대감에 엔터·관광주 급등 K팝·드라마 재진출 가능성 커져 법률·유통 등 서비스 시장 개방도 과거 번번이 무산… “지켜봐야” 신중 한국과 중국이 8년 만에 한·중 자유무역협정(FTA) 서비스·투자 후속협상을 타결하면서 한한령(限韓令·한류 제한령) 해제에 청신호가 켜졌다. 2016년 사드(THAAD·고고도미사일방어체계) 배치 이후 중국에서 이뤄진 한국 콘텐츠 제한에 대한 빗장이 풀릴 수 있을 것이라는 기대감이 고조되고 있다. 한국 콘텐츠의 중국행은 물론, 중국 자본의 한국 콘텐츠 제작 여건도 완화될 것이라는 관측이 업계 내에서 나온다. 다만, 중국이 정부 차원에서 한한령을 공식 인정하지 않았던 만큼 이번 협상 타결이 실제 한한령 해제로 이어질 수 있을지는 좀 더 지켜봐야 한다는 신중론도 있다. 마주 앉은 한·중 정상 이재명 대통령이 18일(현지시간) 아시아태평양경제협력체(APEC·에이펙) 정상회의 개최지인 중국 선전에서 열린 시진핑 중국 국가주석과의 정상회담에서 발언하고 있다. 우리 측에서 조현 외교부 장관, 위성락 국가안보실장, 최휘영 문화체육관광부 장관 등이 배석했다. 양국은 자유무역협정(FTA) 서비스·투자 후속협상 타결을 계기로 경제협력을 강화하기로 뜻을 모았다. 선전=이제원 선임기자 ◆한한령 해제 수순… 업계 기대감 상승 이번 실질 타결로 가장 큰 관심은 ‘한한령’ 빗장에 막혀 있던 ‘K콘텐츠’의 중국 수출 가능성이다. 바로 반응한 주식시장에서도 기대감을 엿볼 수 있다. 에스엠(SM엔터테인먼트)은 전일 대비 14.30% 오른 8만7900원에 주간 거래를 마쳤다. JYP엔터테인먼트(8.72%), 하이브(7.62%). 와이지엔터테인먼트(4.92%) 등 국내 대형 기획사들의 주가가 올랐고, CJ ENM(7.39%), 스튜디오드래곤(6.04%) 등 콘텐츠 제작사들도 상승세를 보였다. 정규장에서 강세를 보였던 엔터주들은 한·중 FTA 후속협상 타결 소식에 매수세가 본격적으로 몰리며 애프터마켓에서 ‘불기둥’을 그려나갔다. 노랑풍선, 모두투어 등 관광주 역시 중국과의 교류 확대 기대감에 반응했다. 국내 엔터테인먼트 업계 한 관계자는 “협상에서 콘텐츠 비차별을 언급한 것만으로도 진일보했다고 본다”며 “중국 콘텐츠 시장은 시장성도 크고, 쇼트폼 등 플랫폼 측면에서도 계속 커지고 있는 곳이다. 우리 콘텐츠 유통이 정식적으로 이뤄진다면 산업적으로 기회를 엿볼 수 있을 것으로 기대한다”고","category":"생활·문화"},{"title":"[날씨] 수능 전날인 수요일, 전국 곳곳에 ‘비와 눈’…강풍에 체감온도 ‘뚝’","link":"https://n.news.naver.com/mnews/article/029/0003059721","naverLink":"https://n.news.naver.com/mnews/article/029/0003059721","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"일본인은 '맛', 대만·홍콩은 '가성비'…외국인 한국여행 후기 30만건 보니","link":"https://n.news.naver.com/mnews/article/277/0005844027","naverLink":"https://n.news.naver.com/mnews/article/277/0005844027","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"와우패스, 최근 1년 다국어 리뷰 약 30만건 분석 일본 '맛있다' 언급 27.5%…영어권의 2.4배 영어권은 친절, 중국인은 재방문 의향 두드러져 국가별 선호 차이…관광상품·서비스 전략에 시사점 \"전복도 많이 들어있고 오징어 젓갈이 아무튼 맛있다. 리필도 된다. 어머니 손맛.\" 외국인 관광객들이 국내 한 식당에서 음식을 맛보고 있다. 외국인 관광객의 한국여행 후기 약 30만건을 분석한 결과, 일본은 '맛', 대만·홍콩은 '가성비', 영어권은 '친절', 중국은 '재방문 의향'에 대한 언급이 상대적으로 두드러진 것으로 나타났다. 강진형 기자 한국 음식점을 찾은 일본인 관광객이 남긴 후기다. 반면 영어권 관광객은 음식보다 사람을 기억했다. \"직원분이 영어는 못 하셨지만 정말 따뜻하게 친구에게 줄 꽃 고르는 걸 도와주셨다\"는 리뷰가 대표적이다. 같은 한국을 여행해도 무엇에 만족하고 어떤 경험을 기억하는지는 출신 지역에 따라 달랐다. 외국인 관광객 전용 결제 플랫폼 와우패스(WOWPASS)를 운영하는 오렌지스퀘어는 최근 1년간 축적된 다국어 리뷰 약 30만건과 지난 10월 결제 데이터를 분석한 결과를 17일 발표했다. 음식에 대한 만족은 여러 국가·지역에서 공통적으로 나타났지만, 유독 많이 언급하는 요소에는 차이가 있었다. 일본인 관광객은 '맛'에 가장 민감하게 반응했다. 일본어 리뷰에서 '맛있다'는 취지의 표현이 등장한 비율은 27.5%로 주요 국가·지역 가운데 가장 높았다. 영어권 리뷰의 11.4%와 비교하면 약 2.4배다. 일본인의 지난달 와우패스 1회 평균 결제액은 약 2만3000원으로 비교 대상 중 가장 컸다. 대만·홍콩 이용자는 가격 대비 만족도를 중시했다. 번체 중국어 리뷰에서 '가성비'를 언급한 비율은 5.6%로 주요 국가·지역 중 가장 높았다. 커피나 생수처럼 일상적인 소비에서도 지불한 가격에 걸맞은 만족을 얻었는지가 주요 평가 기준으로 나타났다. 한 대만 이용자는 한국의 아이스 아메리카노를 소개하며 \"사이즈업이 진짜 가성비\"라고 평가했다. 한국을 찾은 외국인 관광객의 국가·지역별 관심 요소. 와우패스 이용자들이 작성한 약 30만건의 다국어 리뷰에서 일본은 '맛'(27.5%), 대만·홍콩은 '가성비'(5.6%), 영어권은 '친절'(8.7%), 중국은 '재방문 의향'(4.9%) 관련 표현이 각각 두드러졌다.","category":"생활·문화"}],"세계":[{"title":"美국무부 \"北비핵화, 안보리 제재 전념\"…북미정상회담 물건너 가나","link":"https://n.news.naver.com/mnews/article/079/0004211390","naverLink":"https://n.news.naver.com/mnews/article/079/0004211390","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"美국무부 \"北비핵화, 안보리 제재 전념\"…북미정상회담 물건너 가나. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"美중간선거 공화당에 6000억 쏟은 머스크 \"어리석었다\" 후회","link":"https://n.news.naver.com/mnews/article/421/0009298382","naverLink":"https://n.news.naver.com/mnews/article/421/0009298382","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"美중간선거 공화당에 6000억 쏟은 머스크 \"어리석었다\" 후회. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"11월 독일 경기예측 지수 35.6·7.5P↑…\"9개월 만에 최고\"","link":"https://n.news.naver.com/mnews/article/003/0014328523","naverLink":"https://n.news.naver.com/mnews/article/003/0014328523","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스]이재준 기자 = 유럽 최대 경제국 독일의 경기선행을 보여주는 2026년 11월 경기예측 기대 지수는 9개월 만에 최고치를 기록했다고 마켓워치와 RTT 뉴스, dpa 통신이 17일 보도했다. 매체는 유럽경제연구센터(ZEW) 발표를 인용해 경기예측 기대 지수가 전월 28.1에서 35.6으로 7.5 포인트나 뛰어 올랐다고 전했다. 향후 6개월간 독일 경제에 대한 낙관도를 나타내는 기대지수의 시장 예상치는 28.3인데 실제는 이를 7.3 포인트 상회했다. ZEW는 독일 경제가 완만하지만 회복 궤도를 유지하고 있다며 제조업 수주 증가와 원유 가격 하락이 경기 회복을 뒷받침한다고 내다봤다. 현재 경기상황을 반영하는 11월 현황지수는 마이너스 33.2로 9월 마이너스 35.9에서 2.7 포인트 올랐다. 2023년 4월 이래 가장 높은 수준이다. 다만 현황지수는 여전히 마이너스 영역에 머물러 현재 경제 상황에 대한 평가가 부정적임을 나타냈다. 산업별로는 업종 간 온도 차가 뚜렷했다. 화학과 제약, 전기·전자 업종의 경기 전망은 크게 개선한 반면 금속 제조업에서는 향후 경기에 대한 기대가 악화했다. 건설업 경기 심리도 더 위축, 부정적인 전망이 한층 깊어졌다. ZEW는 그동안 독일 경기회복을 주도한 요인으로 정부 지출을 꼽았다. 그러면서 공공 지출 확대에 따라 정부 부채를 지속 가능한 수준으로 관리할 수 있을지에 대한 우려도 커지고 있다고 지적했다. 한편 유로화 사용 21개국으로 이뤄진 유로존의 경기기대 지수도 11월 큰 폭으로 개선했다. ZEW가 공표한 유로존 경기기대 지수는 전월보다 8.0 포인트 상승한 26.5로 집계됐다. 3개월 만에 고수준으로 시장 예상 19.1을 7.4 포인트 크게 웃돌았다. 천연가스 가격 급등 등 경제 여건을 둘러싼 부담이 이어지는 가운데서도 경기 전망은 좋아졌다.천연가스 가격 상승은 제조업체 수익성을 압박하고 소비자물가 전반을 끌어올리는 요인으로 꼽혔다. 반면 유로존 현황지수는 마이너스 14.7로 전월과 같은 수준에 머물렀다. 경기 전망에 대한 기대는 높아졌지만 현재 경제 상황에 대한 평가는 개선하지 않은 셈이다.","category":"세계"},{"title":"FRANCE UNIONS PROTEST","link":"https://n.news.naver.com/mnews/article/091/0010371742","naverLink":"https://n.news.naver.com/mnews/article/091/0010371742","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"French unions protest against government over wages and rising living costs A protester performs at an anti-government demonstration in Montpellier, southern France, 17 November 2026. Unions called for a national day of protest against government policy over public sector wages and the rising costs of living. EPA/GUILLAUME HORCAJUELO","category":"세계"},{"title":"러 \"우크라 나토 가입 수용 안할 것\"…美제안 사실상 거부(종합)","link":"https://n.news.naver.com/mnews/article/001/0016447591","naverLink":"https://n.news.naver.com/mnews/article/001/0016447591","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"젤렌스키, 헤르손·자포리자 10곳서 주민 대피·지원 제안 나토 로고 [AP=연합뉴스. 재배포 및 DB 금지] (로마=연합뉴스) 민경락 특파원 = 러시아가 우크라이나의 북대서양조약기구(NATO·나토) 가입을 받아들이지 않을 것이라는 기존 입장을 재확인했다. 17일(현지시간) 러시아 관영 타스통신 등에 따르면 세르게이 랴브코프 러시아 외무차관은 이날 \"우크라이나의 나토 가입을 수용하지 않을 것\"이라고 밝혔다. 종전협상의 핵심 의제 중 하나인 영토 문제와 관련해 미국 측이 우크라이나에 제안한 중재안을 사실상 거부한 것이다. 볼로디미르 젤렌스키 우크라이나 대통령은 지난 14일 \"미국 측이 '우크라이나가 나토에 가입한다면 어떻겠느냐? 그러면 우크라이나가 돈바스에서 철수하겠느냐?'라는 질문을 했다\"고 밝혔다. 그러면서 안전 보장과 충분한 재건자금 등을 포함한 안보 지원 패키지가 제공된다면 이 문제를 국민 투표에 부칠 것이라고 말했다. 러시아 측은 종전협상에서 우크라이나가 돈바스 지역 전체를 넘겨줘야 한다는 주장을 굽히지 않고 있다. 우크라이나 측은 러시아의 주장을 일축하며 현재의 전선을 동결하고 휴전해야 한다는 입장이다. 젤렌스키 대통령은 이날 주민 대피와 지원이 필요한 헤르손·자포리자 지역 10곳에서 인도주의 작전을 벌일 것을 제안했다. 그러면서 \"이 문제를 미국 중재자들과 논의할 것\"이라고 덧붙였다. 블라디미르 푸틴 러시아 대통령은 지난 12일 미국 특사들과 만나 도네츠크 지역 코스티안티니우카에서 인도주의 작전을 하자고 제안했지만 젤렌스키 대통령은 \"현지 민간인들에게는 이미 대피 기회가 주어졌다\"며 이를 거부했다. rock@yna.co.kr","category":"세계"},{"title":"China APEC","link":"https://n.news.naver.com/mnews/article/077/0007241616","naverLink":"https://n.news.naver.com/mnews/article/077/0007241616","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"China APEC From left Sean Stein, president of the US-China Business Council, Xu Xiaoxi, chairman of Xiamen C&D Group, Catherine Raw, chief strategy and development officer of BHP, Zhou Qunfei, chairperson of Lens Technology, Saravoot Yoovidhya, CEO of TCP Group, Liu Jincheng, founder and chairman of EVE Energy pose for a group photo after a session at the 2026 APEC CEO Summit held ahead of the APEC China 2026 summit in Shenzhen in southern China's Guangdong province on Tuesday, Nov 17, 2026. (AP Photo/Ng Han Guan)","category":"세계"},{"title":"트럼프 \"10개월 내 中 희토류 추월\"…이란 '더티밤' 공격설엔 \"전례 없는 대가\" 강력 경고","link":"https://n.news.naver.com/mnews/article/014/0005605815","naverLink":"https://n.news.naver.com/mnews/article/014/0005605815","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"필리핀 마닐라 쿼드 정상회의서 발언…\"미국 및 동맹국 희토류 생산 전례 없는 수준\" 언론·전문가는 \"10년 걸릴 일\" 일축… IEA 기준 中 채굴 61%·가공 92% 장악 이란의 워싱턴 공격 계획 보도에 \"핵 가져선 안 돼\"…시진핑·푸틴에 이란전 종식 압박 예고 \"대만 문제는 시진핑이 꺼낼 것\"…푸틴과 양자 회담·김정은과 만남 가능성도 열어둬 도널드 트럼프 미국 대통령이 17일(현지시간) 필리핀 마닐라에서 열린 미국-아세안(ASEAN·동남아시아국가연합) 정상회의에서 발언하고 있다. 트럼프 대통령은 이날 마닐라 순방 현장에서 기자들과 만나 희토류 자체 생산 확대와 이란의 테러 위협에 대한 강력한 경고 메시지를 냈다. /사진=연합뉴스 [파이낸셜뉴스] 아시아태평양경제협력체(APEC) 정상회의 참석차 아시아를 순방 중인 도널드 트럼프 미국 대통령이 희토류 생산 분야에서 10개월 안에 중국을 따라잡겠다고 공언했다. 또한 이란의 미국 본토 테러 계획설에 강력히 경고하며, 이어질 정상회담에서 중국과 러시아 정상에게 이란전 종식을 위한 압박에 나설 것임을 예고했다. 17일(현지시간) CNN 등 외신에 따르면 트럼프 대통령은 이날 필리핀 마닐라에서 열린 쿼드(Quad, 미국·일본·호주·인도) 정상회의에 앞서 기자들과 만나 \"우리는 이전에 없던 수준으로 희토류를 엄청난 양으로 생산하고 있다\"라며 \"10개월 안에 그들(중국)을 따라잡고 우리가 필요로 하는 모든 것을 확보할 것\"이라고 밝혔다. 그는 미국뿐만 아니라 일본과 인도 등 다른 쿼드 회원국 역시 희토류 생산에 나서고 있다며 긴밀한 협력을 강조했다. 그러나 트럼프 대통령은 이 같은 주장을 뒷받침할 구체적인 근거를 제시하지 않았다. 현지 언론과 전문가들은 그의 '10개월 추월론'과 현실 사이에 큰 괴리가 있다고 지적했다. 미국 지질조사국 통계에 따르면 지난해 희토류 생산량은 중국이 27만t(톤)인 반면 미국은 5만t에 그쳤다. 국제에너지기구(IEA) 역시 중국이 전 세계 희토류 채굴량의 61%, 환경오염 비용 탓에 미국이 기피해 온 정제·가공 단계의 92%를 장악하고 있다고 분석했다. CNN은 업계 전문가들의 의견을 인용해 미국이 지속적인 투자를 하더라도 중국 의존도를 낮추기까지는 10년이 걸릴 것이라고 전했다. 이날 트럼프 대통령은 이란의 테러 기도 의혹에 대해서도 목소리를 높였다. 앞서 미국 정보당국이 이란이 워싱턴 D.C.에서 방사능 오염 폭탄인 '더티밤(dirty bom","category":"세계"},{"title":"뉴욕증시 혼조세 출발… 엔비디아 실적 발표 주목","link":"https://n.news.naver.com/mnews/article/366/0001205489","naverLink":"https://n.news.naver.com/mnews/article/366/0001205489","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"뉴욕증시 혼조세 출발… 엔비디아 실적 발표 주목. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"아시안 투어 신인왕 송민혁, 세계랭킹 329위→214위","link":"https://n.news.naver.com/mnews/article/277/0005844032","naverLink":"https://n.news.naver.com/mnews/article/277/0005844032","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"아시안 투어 신인왕 송민혁, 세계랭킹 329위→214위. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프 “한국 투자 덕에 알래스카 LNG 파이프라인 사업 승인”","link":"https://n.news.naver.com/mnews/article/056/0012295970","naverLink":"https://n.news.naver.com/mnews/article/056/0012295970","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령은 한국의 대미 투자에 힘입어 알래스카 액화천연가스(LNG) 파이프라인 사업을 승인했다고 주장했습니다. 트럼프 대통령은 현지 시각 17일 필리핀 마닐라에서 열린 미국-아세안 정상 만찬에서 한국의 투자를 \"역사적\"이라고 평가하면서, 태평양 전역의 파트너 국가들에 저렴한 미국산 에너지를 기록적 규모로 수출할 수 있게 됐다고 말했습니다. 이는 미국 정부가 알래스카 LNG 파이프라인 사업 추진에 필요한 인허가를 승인했다는 취지로 풀이되지만, 구체적으로 어떤 인허가인지는 불분명합니다. 트럼프 대통령은 이 사업이 역내 국가들의 에너지 비용을 낮추고 에너지 안보를 강화할 것이라고 강조했습니다. 이날 만찬 행사에는 이재명 대통령도 참석했습니다. 앞서 트럼프 대통령은 지난 9월 30일 한국의 2천억 달러 규모 에너지 분야 대미 투자 프로젝트를 발표하면서 한국이 알래스카 LNG 사업에 500억 달러 이상 투자하기로 했다고 직접 밝힌 바 있습니다. 그러나 한국 정부는 투자 여부가 아직 확정되지 않았으며, 사업의 상업적 타당성 등을 검토해 참여 여부를 결정한다는 입장입니다. [사진 출처 : AP=연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"세계"}],"IT 과학":[{"title":"'AI 커닝' 세무사 시험 수석 합격자, 조사 13시간만 귀가…\"열심히 준비한 수험생께 죄송\"","link":"https://n.news.naver.com/mnews/article/448/0000651690","naverLink":"https://n.news.naver.com/mnews/article/448/0000651690","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"세무사 시험에서 AI를 활용해 부정행위를 저질렀다고 자백한 한 모 씨가 경찰 조사를 받고 13시간여 만에 귀가했다. 서울경찰청 광역수사단 공공범죄수사대는 이날 오전 9시 15분쯤부터 한 씨를 불러 피의자 신분으로 조사했다. 10시 52분쯤 조사를 마치고 나온 한 씨는 \"조사에 성실히 임하고 나왔다\"며 \"다시 한 번 세무사 시험을 열심히 준비해오신 모든 수험생 분들과 관계자분들게 깊은 사과드린다\"고 말했다. 그러면서 \"앞으로 남은 절차에도 빠짐없이 모두 참석하겠다\"고 밝혔다. 어떤 내용을 소명했는지 묻는 질문에 \"죄송하다\"고 답한 그는 공범이 있었는지, 어떤 방식으로 범행을 저질렀는지, 이날 조사에서 관련 시연을 했는지 등을 묻는 다른 질문에는 일체 답하지 않았다. 앞서 한 씨는 한 유튜브 채널에 출연해 \"1, 2차 시험에서 전자기기와 생성형 AI를 이용해 부정행위를 했다\"며 \"자수서에 써 경찰에 제출했다\"고 말한 바 있다. 경찰은 한 씨에 대해 업무방해와 위계에 의한 공무집행방해 등 혐의 적용을 검토중인 것으로 알려졌다.","category":"IT 과학"},{"title":"AI가 1시간 만에 ‘자바’ 치명적 결함 찾았다… 또 보안 비상","link":"https://n.news.naver.com/mnews/article/005/0001885984","naverLink":"https://n.news.naver.com/mnews/article/005/0001885984","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"美칼리프, AI 활용해 보안 취약점 발견 인간·AI 결합 ‘켄타우로스 해커’ 경고등 국내 공공 정보시스템 71%가 자바 기반 정부, 기업·기관에 긴급 점검 권고 자바 로고. 오라클 전 세계 기업과 공공기관에서 널리 쓰이는 프로그래밍 언어 ‘자바(Java)’에서 심각한 보안 취약점이 발견됐다. 지난달 PHP 보안 허점을 처음 찾아냈던 미국 보안업체 칼리프가 인공지능(AI)을 활용해 단 1시간 만에 찾아낸 결함이다. 국내 공공 정보시스템 70% 이상이 자바를 사용하는 만큼 정부도 서둘러 대응책 마련에 나섰다. 18일 정보기술(IT) 업계에 따르면 칼리프는 자바 실행환경인 오픈JDK에서 보안 취약점 ‘자바포셸(Java4Shell)’을 발견했다. 칼리프 소속 연구원 1명이 오픈AI의 코딩 에이전트 ‘코덱스’를 활용해 1시간 만에 구멍을 찾아냈고, 이후 2시간 만에 공격 코드까지 완성했다. AI 토큰 비용은 200달러(약 27만원) 미만에 불과했다. 칼리프는 지난달 오픈AI ‘GPT-5.6 솔'을 이용해 프로그래밍 언어 PHP의 보안 취약점을 처음 발견했던 기업이다. 칼리프는 “오늘날 최고의 해커는 인간과 AI가 결합한 ‘켄타우로스 해커’”라며 불필요한 코드를 제거해 사이버 공격 대상이 되는 표면적 자체를 줄여나가야 한다고 강조했다. 자바포셸은 오픈JDK에서 비정상적인 데이터를 처리하는 과정에서 메모리 손상이 발생하는 취약점이다. 일부 프로그램에서는 공격자가 별도 인증 없이도 원격으로 악성코드를 실행할 수 있다. 칼리프는 해당 취약점의 위험도를 공통취약점평가시스템(CVSS) 4.0 기준 10점 만점에 9.2점으로 평가했다. 최고 위험 수준인 ‘치명적’ 등급이다. 이에 미국 소프트웨어 기업 오라클은 17일(현지시간) 자바 보안 취약점 관련 11건을 포함해 주요 제품군에 대한 총 655건의 신규 보안 패치를 긴급 배포했다. 자바는 민간기업은 물론 병원, 은행, 정부기관 등의 핵심 정보 시스템에 폭넓게 사용되는 만큼 이번에 드러난 취약점이 자칫 대규모 보안 사고로 번질 수 있다는 우려가 나온다. 영국 파이낸셜타임스(FT)에 따르면 미국 경제지 포천 선정 500대 기업 약 90%가 자바를 사용하고 있다. 국내도 심각한 상황은 마찬가지다. 행정안전부에 따르면 지난해 말 기준 전국 공공 정보시스템 1만5618개 중 71.28%(1만1132개)가 자바를 개발언어로 사용했다. 이는 PHP 사용 시스템(1027개·6.58%)의 10배가","category":"IT 과학"},{"title":"[김정호의 AI시대 전략] 젠슨 황 사퇴 후 ‘AI 버블’ 공포, AI 에이전트 전자상거래로 잠재운다","link":"https://n.news.naver.com/mnews/article/023/0004010162","naverLink":"https://n.news.naver.com/mnews/article/023/0004010162","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"천문학적 금융비용 부각돼 거품 우려… 해법은 실질 수익창출 규제 혁파로 쇼핑·투자 대행하는 AI 에이전트 생태계 육성을 생일이나 축하 모임에서 장식으로 풍선을 달아 분위기를 살린다. 풍선(風船·Balloon)은 밀폐된 고무 주머니에 공기를 넣어 부풀게 하는 물건이다. 오늘날의 풍선을 최초로 만든 사람은 영국 물리화학자인 마이클 패러데이였다. 1824년 전기분해를 발명한 그는 물을 전기분해하면서 발생하는 수소 기체를 담아둘 장치가 필요했다. 이때 고무로 팽창식 용기를 만들었는데 그것이 바로 오늘날 풍선의 조상이다. 이제는 풍선을 공중에 띄우기 위해 가볍고 안전한 헬륨을 사용한다. 그래픽=이철원 풍선을 빵빵하게 계속 불다 보면 어느 순간 터지기도 한다. 적당한 시점에서 멈추어야 한다. 이때 내부 공기의 압력과 고무의 표면 수축력이 균형을 맞추게 된다. 공기의 압력이 너무 크면 풍선이 터진다. 현재 인공지능 사업에도 같은 원리가 적용된다. 풍선의 내부 공기 압력에 해당하는 힘은 급속히 증가하는 반도체 가격, 전기 사용료, 냉각 비용, 그리고 금융 조달과 이자 비용이다. 특히 GPU를 담보로도 대출받아 높은 이자 비용을 지불하기도 한다. 미래에는 확보한 반도체 메모리를 담보로 대출받는 상상도 가능하다. 이를 막는 반대 힘은 인공지능 시장의 매출 실적, 인공지능 수요 확대, 그리고 미래 예측 수익의 증대로 볼 수 있다. 이 중에서 특히 금융 비용의 증가가 가장 큰 위험 요인이다. 이를 ‘AI 버블’이라 부른다. 특히 엔비디아의 젠슨 황이 CEO에서 자진 사임하면서 그가 구축한 순환 투자 생태계(Circular Investment Ecosystem)의 불안정성이 AI 버블에 대한 공포를 더 키우고 있다. AI 버블을 방지하기 위한 방법은 결국 AI가 더 많은 수익을 지속적이고 확실하게 창출하는 것이다. 그 수익 방법이 바로 ‘AI 에이전트 상업 활동(AI Agent for Commerce)’이다. AI 에이전트가 고객에게서 받는 가입비, 구독료, 수수료, 광고료다. AI 에이전트가 개인을 대신해 상업 활동을 하고, 그 이득을 개인과 나누는 것이다. 비용을 개인(B2C)이 내거나 기업(B2B)이 대신 지불할 수 있다. AI 에이전트 상업 활동으로는 다음과 같은 예가 있다. AI 에이전트가 인간을 대신해 상거래를 한다. 물품 거래를 하고, 새벽 배송을 신청한다. 식당, 야구장, 극장과 병원을 예약하고, 버스, KTX, 항공권","category":"IT 과학"},{"title":"과기정통부, AI 시대 최적화된 '국가지식정보' 고도화 추진","link":"https://n.news.naver.com/mnews/article/030/0003486799","naverLink":"https://n.news.naver.com/mnews/article/030/0003486799","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"국가지식정보 통합플랫폼 '디지털집현전' 홈페이지 메인화면. 과학기술정보통신부가 17일 국립중앙도서관에서 한국지능정보사회진흥원(NIA)·국립중앙도서관과 '2026년 국가지식정보 정책 발전 세미나'를 개최했다. 이번 세미나는 'AI 시대, 지속 가능한 지식 생태계를 위한 국가 전략'을 주제로, 인공지능(AI) 기술 발전에 따른 국가지식정보의 역할 변화와 새로운 정책 방향을 논의하고 제2차 국가지식정보 기본계획(2027∼2029) 주요 정책과제 발굴을 위한 전문가 의견을 수렴하기 위해 마련됐다. 국가지식정보는 국가기관 등이 생산·보유·관리하는 정보 중 국민이 학습·연구·업무 등에 활용할 수 있는 국가적 이용가치가 있는 지식정보다. 국가지식정보위원회 지정을 받은 정보를 의미한다. 과기정통부는 그동안 국가지식정보 연계 및 활용 촉진에 관한 법률과 제1차 국가지식정보 기본계획에 따라 국가지식정보 통합플랫폼 '디지털집현전' 중심 국가·공공기관에 분산된 연구보고서, 학술자료 등 다양한 지식정보를 한곳에서 검색하고 활용할 수 있는 기반을 마련해왔다. 디지털집현전은 현재 약 2억6000만건의 지식정보를 연계하고 있다. 올해 1~10월 누적 방문자 수는 80만7780명으로 전년 동기 대비 127.4% 증가하는 등 이용이 확대되고 있다. 학술연구, 교육·학습, 정책·행정업무, 산업·기술정보 탐색 등 다양한 분야에서 국가지식정보 활용이 확산되는 것이다. 이러한 지식정보 연계 기반을 바탕으로 AI가 신뢰할 수 있는 지식정보를 보다 정확하고 효율적으로 활용할 수 있게 데이터 품질과 연계·활용 체계를 고도화하는 게 중요한 정책과제로 부상하고 있다. 세미나는 강인호 네이버 AI센터장은 'AI 시대, 지속 가능한 지식 생태계를 위한 국가 전략' 주제 기조발제로 시작됐다. 이어 김우영 하이랩컨설팅 대표와 박광동 한국법제연구원 센터장이 각각 '민간·해외 지식정보 확보·연계 확대 및 MCP(Model Context Protocol) 기반 AI 서비스 활용방안' 'AI 학습·활용 확대를 위한 저작권·공공누리 제도 개선 및 데이터 품질 강화'를 주제로 각각 발표했다. 패널토론에서는 학계·산업계·공공 분야 전문가들이 민간·해외 지식정보의 확보와 연계, AI 서비스에서 활용 확대, 저작권·공공누리 제도 개선과 데이터 품질 강화 등 제2차 기본계획에서 검토할 주요 정책과제와 향후 추진 방향에 대해 의견을 나눴다. 엄열 과기정통부 인공지능정책실장은 “AI가","category":"IT 과학"},{"title":"국회, AI 커닝 특별법 착수...\"부정행위 꿈도 꾸지 말라\"","link":"https://n.news.naver.com/mnews/article/092/0002445756","naverLink":"https://n.news.naver.com/mnews/article/092/0002445756","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"민주 \"응시자격 박탈 10년, 올해 수능부터\", 국힘 \"벌금형 없이 징역형\" 대학수학능력시험을 앞두고 국회도 AI를 이용한 시험 부정행위 처벌에 적극 나섰다. 정부가 17일 수능 부정행위 대책을 내놓은 날, 더불어민주당과 국민의힘은 각각 부정행위를 강력히 처벌하는 특별법을 만들겠다고 밝혔다. 김민석 민주당 대표는 이날 국회에서 열린 의원총회에서 “당은 AI 부정행위를 차단하기 위한 정부의 노력에 적극 동참하면서 AI 부정행위를 강력히 제재하기 위한 특별법 제정에 즉시 착수하겠다”고 말했다. 민주당 특별법의 핵심은 수능 부정행위자의 응시자격 박탈 기간을 1년에서 10년으로 늘리고, 이를 올해 수능부터 적용하는 것이다. 한성숙 국무총리가 같은 날 대국민담화에서 밝힌 정부 방침을 입법으로 뒷받침하는 내용이다. 김 대표는 “수능에서 부정행위가 있을 때 수능 응시 자격 박탈 기간을 1년에서 10년으로 대폭 늘리고, 이를 올해 수능부터 적용하도록 입법에 속도를 내겠다”며 “시험이 끝난 후에도 부정행위 징후가 포착되면 끝까지 조사해 입학 취소, 형사 처벌 등 강력한 조치가 이뤄지도록 하겠다”고 강조했다. 여당과 야당이 각각 AI를 통한 수능 부정행위를 막기 위한 입법 계획을 내놨다. 사진_뉴스1 민주당은 시험장마다 AI 부정행위 전담 인력을 한 명 이상 배치하고, 부정행위에 대응하다 생긴 일로 감독관에게 과도한 책임을 묻지 않도록 한다는 방침이다. 수능에 대한 신뢰를 허무는 허위 정보를 만들거나 퍼뜨리는 행위도 처벌할 수 있도록 한다는 계획이다. 민주당은 국가시험 공정성 확보를 위한 TF를 꾸린다. 한병도 원내대표는 “당은 TF를 구성해 국가시험 공정성 확보와 부정행위 엄단에 만전을 기하겠다\"며 \"부정행위는 꿈도 꾸지 말라”고 경고했다. 국민의힘은 처벌 수위를 더 높인 가칭 ‘국가시험 부정행위 처벌 등에 관한 특별법’을 추진한다. 전자통신기기를 이용한 부정행위는 벌금형 없이 징역형으로만 처벌하고, 수능뿐 아니라 모든 국가시험 응시를 10년간 막는 내용이다. 국회 교육위원회 야당 간사인 이인선 국민의힘 의원은 이날 국회 기자회견에서 “전자통신기기 등 부정한 수단을 쓴 경우 벌금형 없이 5년 이하의 징역형으로 무겁게 처벌하겠다”며 “10년간 모든 국가시험 응시를 원천 차단하겠다”고 말했다. 국민의힘 특별법에는 처벌 대상을 넓히고 단속 수단을 마련하는 내용도 담긴다. 장비를 대거나 문제를 빼돌린 공범과 미수범도 똑같이 처벌하고,","category":"IT 과학"},{"title":"숨빗AI, 시리즈A·스케일업 팁스로 150억원 확보…\"CT·MRI 판독 AI 확장\"","link":"https://n.news.naver.com/mnews/article/092/0002445755","naverLink":"https://n.news.naver.com/mnews/article/092/0002445755","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"누적 투자·조달 200억원 달성 숨빗에이아이(이하 숨빗AI)가 시리즈A 투자 유치와 중소벤처기업부 '스케일업 팁스' 선정을 통해 총 150억원 규모의 자금을 확보하며 3차원 다중 시퀀스 영상 판독 시장 확장에 나선다. 17일 회사에 따르면, 숨빗AI는 최근 SV인베스트먼트가 주도하고 시드 단독 투자사인 알토스벤처스를 비롯해 키움인베스트먼트, iM투자파트너스가 참여한 약 120억원 규모의 시리즈A 라운드를 마무리했다. 여기에 중소벤처기업부의 '스케일업 팁스' 특화형 과제인 '멀티시퀀스 CT·MRI 생성형 AI 솔루션 개발 및 글로벌 상용화'에 선정돼 향후 3년간 최대 30억원의 연구개발 자금을 연계 지원받는다. 2024년 알토스벤처스로부터 유치한 50억원 규모의 시드 투자를 합산하면 누적 투자·조달 금액은 약 200억원에 달한다. 숨빗AI는 2024년 7월 카카오브레인에서 흉부 엑스레이 판독 보조 AI 사업을 이끌던 최고헬스케어책임자(CHO) 출신 배웅 대표와 핵심 개발진이 의기투합해 설립한 기업이다. 숨빗에이아이 숨빗AI는 올해 4월 1일 흉부 엑스레이 판독문 초안을 자동 생성하는 '에어리드-씨엑스알'로 식품의약품안전처 3등급 디지털의료기기 품목허가(허가번호 D제허 26-10호)를 획득했다. 에어리드-씨엑스알은 2021년부터 국내외 흉부 엑스레이 영상·판독문 약 1400만건을 학습해 흉수·기흉·폐부종·폐결절·심장비대·활동성 결핵·늑골·쇄골 골절 등 최소 57종 이상의 소견을 분석하고, 전문의 판독문 수준의 예비소견서를 1~2초 만에 제시한다. 기존 PACS 환경과 판독 흐름을 바꾸지 않고도 AI 초안을 검토·수정할 수 있도록 설계됐으며, 관련 연구 논문은 영상의학 분야 최상위 저널인 Radiology 3편, AJR 2편, European Radiology 1편 등 총 6편이 게재됐다. 숨빗AI는 이번 확보 자금을 발판으로 컴퓨터단층촬영(CT)과 자기공명영상(MRI) 등 고난도 3차원 다중 시퀀스 영역으로 제품군을 넓힌다. 뇌·흉부·복부골반을 아우르는 CT 예비소견서 솔루션 '에어리드-씨티'는 2027년 출시를 목표로 개발 중이며, 오는 11월 29일부터 12월 2일까지 미국 시카고 맥코믹플레이스에서 열리는 북미영상의학회(RSNA) 2026 전시회에서 최초 공개한 뒤 미국 FDA와 유럽 CE 인증 등 글로벌 인허가 및 상용화를 본격 추진한다. 아울러 자체 개발 중인 비전-언어 모델(VLM) 연구부터 규제·임상 대","category":"IT 과학"},{"title":"이준석, 비행기서 직접 만든 ‘AI커닝 탐지 앱’ 공개 “감독관 휴대폰으로 신호 포착”","link":"https://n.news.naver.com/mnews/article/021/0002833537","naverLink":"https://n.news.naver.com/mnews/article/021/0002833537","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"“영국 출장 비행기에서 프로토타입으로 만들어본 것” 이준석 개혁신당 의원. 뉴시스 AI 등을 악용한 수능 부정행위가 우려되는 가운데 이준석 개혁신당 의원이 17일 수능 시험장 부정행위를 탐지할 수 있는 앱을 개발해 배포했다. 교실에서 전자 기기를 사용할 경우 감독관이 휴대전화를 통해 와이파이나 블루투스 신호를 잡아내는 방식이다. 이 의원은 “영국으로 출장 오는 비행기에서 교육부 장관의 답변을 보고 한숨을 내쉬었다”면서 “비행기 내 스타링크에 얹혀서 프로토타입(초기모델)로 만들어 본 것”이라고 전했다. 이 의원은 이날 SNS를 통해 직접 코딩해 만든 전파 탐지앱 ‘코리요스캔’(KoriyoSCAN)을 소개하며 “전문 장비를 전국 시험실에 당장 보급하기 어려운 만큼 (AI를 활용한 수능 부정행위를 막기 위해) 감독관의 휴대전화라도 활용해보자는 생각”이라고 밝혔다. 코리요는 이 의원 지역구가 있는 경기 화성의 마스코트다. 이 의원은 앱 기능과 작동방식에 대해 “감독관이 시험 전 빈 교실의 블루투스, 와이파이 신호를 먼저 기록한다”며 “이후 수험생 진입 후 새롭게 잡히는 신호를 알려 추가 확인을 돕는다”고 설명했다. 특히 이 의원은 “감독관의 전화기에 설치하고 비행기 모드를 켜야 측정을 시작할 수 있다”며 “전화와 알림은 무음처리하도록 했다. (초소형) 카메라와 무선 이어폰을 함께 쓰는 경우에도 이어폰이 저전력 블루투스 신호를 내보내는 상태라면 포착할 가능성이 있다”고 강조했다. 앱을 개발한 계기에 대해 “정부는 수능 연기에도 선을 그었다. 연기하더라도 근본적인 대책을 갖추려면 일주일로는 부족할 수 있다”면서 “그렇다면 남은 시간에 가능한 조치부터 총 동원해야 한다”고 전했다. 이 의원은 “이 앱은 통신을 차단하지 못하고 안드로이드의 제약으로 모든 (부정행위용) 기기를 찾아내지도 못한다”며 “아직 검증 전이지만 교육부가 이런 방향성을 신속히 검토하고, 감독관의 휴대전화 반입·사용 제한에 전파 탐지 목적의 한시적 예외를 두는 방안을 검토해 주길 바란다”고 촉구했다. 이어 “수험생을 위한 공익적 목적 외 다른 의도는 없기에 페이스북 글에 소스코드를 공개하겠다”며 “플레이스토어 등록과 심사를 기다릴 여유도 없어 안드로이드 설치파일(APK)을 직접 배포한다”고 말했다. 이 의원은 “시험장 주변의 핫스팟을 점검하고 특정 연령대의 이동통신데이터를 시험 시간에만 제한하는 방안도 생각해볼 수 있다. 문제와 정답을 외부로 주고받는 길을","category":"IT 과학"},{"title":"오라클, 기업용 SW 보안 취약점 652건 패치 예고","link":"https://n.news.naver.com/mnews/article/422/0000927167","naverLink":"https://n.news.naver.com/mnews/article/422/0000927167","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"해킹 (PG) [연합뉴스 제공] 오라클이 자사의 기업용 소프트웨어(SW)에서 확인된 보안 취약점을 수정하기 위해 총 652건의 신규 보안 패치를 배포할 예정입니다. 정보기술(IT) 업계에 따르면 오라클은 '2026년 11월 중요 보안 패치 업데이트(CSPU)' 사전 공지를 통해 이 같은 계획을 밝혔습니다. 이번 업데이트는 데이터베이스(DB)와 기업 업무용 프로그램, 시스템 간 연결을 지원하는 미들웨어, 재무·인사 관리 솔루션 등 다양한 제품군을 대상으로 합니다. 특히 오라클 퓨전 미들웨어와 데이터 분석 제품군인 오라클 애널리틱스에는 공통 취약점 평가 시스템(CVSS) 3.1 기준 최고점인 10.0점의 취약점이 포함됐습니다. 퓨전 미들웨어는 기업의 여러 업무용 프로그램을 실행하거나 연결하는 기반 SW로, 이번에 71건의 보안 패치가 예고됐습니다. 이 가운데 53건은 사용자 인증 없이 네트워크를 통해 원격 악용할 수 있는 취약점에 대응합니다. 기업의 재무·경영계획을 관리하는 하이페리온 제품군에는 267건, 회계·구매·인사 등을 통합 관리하는 E-비즈니스 스위트에는 72건의 패치가 각각 포함됐습니다. 공공기관과 기업의 업무 시스템에 폭넓게 사용되는 프로그래밍 언어인 자바(JAVA) 관련 보안 패치도 11건 예고됐습니다. 오라클은 이번 업데이트가 기존 분기별 누적 보안 패치를 보완하기 위한 것으로, 고객들에게 가능한 한 신속하게 패치를 적용할 것을 권고했습니다. 다만 사전 공지에 포함된 정보는 정식 보안 권고문 발표 전까지 변경될 수 있습니다. #자바 #보안 #국정원 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"IT 과학"},{"title":"라온시큐어, 구글 ‘디바이스 트러스트’ 연동…ZT 보안 강화","link":"https://n.news.naver.com/mnews/article/092/0002445753","naverLink":"https://n.news.naver.com/mnews/article/092/0002445753","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"안드로이드 엔터프라이즈 파트너 참여…사용자·기기 통합 접근통제 강화 라온시큐어 보안 솔루션이 구글 '디바이스 트러스트'와 연동, '어떤 기기로 접속하느냐'까지 검증하는 제로트러스트 체계로 고도화한다. AI 보안·인증 플랫폼 기업 라온시큐어(대표 이순형·이정아)는 구글 ‘디바이스 트러스트(Device Trust from Android Enterprise)’를 자사 핵심 인증·디바이스 관리 솔루션에 연동, 안드로이드 엔터프라이즈 파트너로 참여한다고 17일 밝혔다. '구글 디바이스 트러스트'는 업무용 안드로이드 기기 보안 상태를 지속적으로 확인하고, 이를 기업 접근통제 정책에 활용할 수 있게 지원하는 구글의 제로트러스트 기반 보안 체계다. 기업 내부 시스템에 접속하는 사용자 신원뿐 아니라 기기의 보안 상태까지 함께 검증해 신뢰할 수 없는 기기의 접근을 차단할 수 있다. 구글은 ‘안드로이드 엔터프라이즈(Android Enterprise)’ 검증 프로그램에서 보안 솔루션이 기기 신뢰 API(Device Trust API)와 적절히 연동됐는지 확인한다. 이를 통해 보안 솔루션 기업은 해당 API를 활용해 보안 패치 수준, 운영체제(OS) 버전, 네트워크 상태, 화면 잠금 여부 등 주요 기기 보안 정보를 실시간으로 확인하는 기능을 구현할 수 있다. 이렇게 확보한 정보는 보안 솔루션이 기기의 신뢰도를 평가하고 기업 시스템에 대한 접근 허용 여부를 결정하는 판단 근거가 된다. 이에 따라 라온시큐어의 제로트러스트 보안 제품을 도입한 기업은 사용자의 신원과 접속 기기의 보안 상태를 함께 검증해 보다 정교한 접근통제 정책을 적용할 수 있게 된다. 라온시큐어는 엔터프라이즈 통합 디바이스 관리 플랫폼 ‘원가드(OneGuard)’, 다중인증(MFA) 기반 통합 인증 플랫폼 ‘원패스(OnePass)’, 통합 계정·접근 관리 플랫폼 ‘옴니원 억세스(OmniOne Access)’에 디바이스 트러스트 신호 연동을 적용했다. 이를 통해 보안 패치가 적용되지 않았거나 운영체제가 최신 상태가 아닌 기기의 사내 시스템 접속을 제한하고, 위험 신호가 감지된 경우 추가 인증을 요구하는 등 사용자와 기기의 위험 수준을 종합적으로 검증하는 제로트러스트 보안 체계를 고도화했다. 이와 함께 향후 디바이스 트러스트를 통해 제공되는 기기 보안 신호를 자사의 AI 기반 위험 분석 체계와 연계해 이상행위 분석과 실시간 위험 기반 인증 기술을 고도화할 계획이다. 공공·금","category":"IT 과학"},{"title":"李대통령, 해외서 수능 비상회의...\"시험부정은 성적 도둑질”","link":"https://n.news.naver.com/mnews/article/092/0002445757","naverLink":"https://n.news.naver.com/mnews/article/092/0002445757","pubDate":"2026-11-17T12:00:00+09:00","author":"네이버뉴스","description":"시험 중 재난문자 수시 발신·AI 답안 요구 의무제출법 지시 아세안 APEC 정상회의 참석차 해외 순방 중인 이재명 대통령이 필리핀 현지에서 수능 비상 점검회의를 직접 주재하고 부정행위 추가 대책을 지시했다. 첨단 장비를 이용한 부정행위를 신고하면 한 건당 1억원 이상을 포상하고, 시험 중에도 재난문자를 수시로 보   $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
