<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><title>The Daily News</title>
<style>
:root{--bg:#f7f7f4;--ink:#191919;--muted:#858585;--line:#e7e7e1;--accent:#d9f36a;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{max-width:760px;margin:auto;padding:30px 20px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;font-weight:800}.date{font-size:11px;color:var(--muted)}
h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,68px);font-weight:400;letter-spacing:-3px;margin:25px 0 4px}.sub{font-size:12px;color:var(--muted);letter-spacing:.4px}
main{max-width:760px;margin:auto;padding:0 20px 60px}.tools{display:flex;gap:8px;margin:22px 0 16px}.search{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:9px;padding:13px;font-size:14px;outline:none}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:0 14px;font-size:12px;cursor:pointer}.btn.active{background:var(--accent);border-color:var(--accent)}
nav{display:flex;gap:7px;overflow:auto;padding:3px 0 15px;scrollbar-width:none}nav button{white-space:nowrap;border:0;background:transparent;padding:9px 13px;border-radius:20px;color:#777;font-size:12px;cursor:pointer}nav button.active{background:#202020;color:white}
.meta{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ink);padding:13px 0;font-size:11px;color:var(--muted)}.sectionhead{display:flex;align-items:center;gap:9px;margin:23px 0 5px}.sectionhead strong{font-size:16px;letter-spacing:-.4px}.sectionhead span{font-size:10px;color:#888}.featured{background:#fff;border:1px solid #ecece5;border-radius:13px;padding:0 16px;margin:10px 0 22px}.featured .story{padding:17px 0}.featured .story h2{font-size:19px}.picktag{display:inline-block;background:var(--accent);color:#202020;border-radius:4px;padding:4px 7px;font-size:9px;font-weight:800;letter-spacing:.4px;margin-bottom:8px}.restlist .story{padding:16px 0}.restlist .story h2{font-size:16px}.sectionrule{border:0;border-top:1px solid var(--line);margin:24px 0 0}.story{display:block;padding:19px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.storytop{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin-bottom:9px}.source{font-weight:700;color:#555}.story h2{font-size:18px;line-height:1.45;letter-spacing:-.5px;margin:0 0 8px;font-weight:700}.desc{font-size:13px;line-height:1.65;color:#666;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.storybottom{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#999}.save{border:0;background:transparent;font-size:19px;padding:2px 4px;cursor:pointer;color:#888}.save.on{color:#111}.empty{text-align:center;padding:60px 10px;color:#888;font-size:13px;line-height:1.8}.foot{padding:28px 0;color:#aaa;font-size:10px;text-align:center}
</style></head>
<body>
<header><div class="top"><div class="brand">THE DAILY NEWS</div><div class="date" id="today"></div></div><h1>Daily<br>Brief.</h1><div class="sub">오늘의 뉴스를 가볍고 빠르게 읽는 나만의 브리핑</div></header>
<main><div class="tools"><input id="search" class="search" placeholder="기사 제목 또는 키워드 검색"><button id="refresh" class="btn">새로고침 ↻</button></div>
<nav id="tabs"></nav><div class="meta"><span id="count">기사를 불러오는 중</span><span id="sort">최신순</span></div><section id="feed"><div class="empty">최신 뉴스를 불러오고 있어요…</div></section><div class="foot">THE DAILY NEWS · 개인 뉴스 브리핑</div></main>
<script>
const categories=[["전체",""],["사회","사회"],["생활·문화","생활 문화"],["사건·사고","사건 사고"],["세계","세계"],["IT·과학","IT 과학"]];
let category="",items=[],saved=JSON.parse(localStorage.getItem("tdn_saved")||"[]"),showSaved=false;
const $=s=>document.querySelector(s);
$("#today").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());
function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}
function drawTabs(){ $("#tabs").innerHTML=categories.map(([label,q])=>'<button class="'+(category===q?'active':'')+'" data-q="'+q+'">'+label+'</button>').join('')+'<button data-saved="1" class="'+(showSaved?'active':'')+'">★ 저장한 기사</button>'; }
async function load(){
  const todayKey=seoulDateKey(new Date());
  const cacheKey="tdn_news_"+todayKey;
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
    if(cached&&Object.keys(cached).length){
      window.dailyCategoryItems=cached;
      items=category===""?Object.values(cached).flat().sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)):cached[category]||[];
      render();
      $("#count").textContent=items.length+"개 · 저장된 오늘 기사 갱신 중";
    }else{
      window.dailyCategoryItems={};
      $("#feed").innerHTML='<div class="empty">오늘의 뉴스를 가져오는 중…</div>';
      $("#count").textContent="뉴스 연결 중";
    }
  }catch(e){
    window.dailyCategoryItems={};
    $("#feed").innerHTML='<div class="empty">오늘의 뉴스를 가져오는 중…</div>';
    $("#count").textContent="뉴스 연결 중";
  }
  const feeds={
    "사회":[["경향신문","https://www.khan.co.kr/rss/rssdata/society_news.xml"],["뉴시스","https://www.newsis.com/RSS/society.xml"]],
    "생활 문화":[["경향신문","https://www.khan.co.kr/rss/rssdata/culture_news.xml"],["뉴시스","https://www.newsis.com/RSS/culture.xml"]],
    "사건 사고":[["연합뉴스","https://www.yna.co.kr/rss/news.xml"],["SBS","https://news.sbs.co.kr/news/newsflashRssFeed.do"]],
    "세계":[["경향신문","https://www.khan.co.kr/rss/rssdata/kh_world.xml"],["뉴시스","https://www.newsis.com/RSS/international.xml"]],
    "IT 과학":[["경향신문","https://www.khan.co.kr/rss/rssdata/science_news.xml"],["전자신문","https://rss.etnews.com/Section901.xml"]]
  };
  const categoryItems={};
  for(const cat of Object.keys(feeds)) categoryItems[cat]=[];
  const seenTitles=new Set(),seenLinks=new Set();
  const tasks=Object.entries(feeds).flatMap(([cat,sources])=>sources.map(([source,url])=>({cat,source,url})));
  let finished=0,failures=0,total=0;
  const updateView=()=>{
    for(const cat of Object.keys(categoryItems))categoryItems[cat].sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
    for(const cat of Object.keys(categoryItems))categoryItems[cat]=categoryItems[cat].slice(0,10);
    window.dailyCategoryItems=categoryItems;
    items=category===""?Object.values(categoryItems).flat().sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)):categoryItems[category]||[];
    if(total>0){
      try{localStorage.setItem(cacheKey,JSON.stringify(categoryItems));}catch(e){}
    }
    render();
    $("#count").textContent=total+"개 · 오늘 기사 수집 중 ("+finished+"/"+tasks.length+")"+(failures?" · "+failures+"개 피드 오류":"");
  };
  const jobs=tasks.map(async task=>{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    try{
      let response=null,lastError=null;
      const urls=[
        "https://proxy.cors.dev/"+task.url,
        "https://api.allorigins.win/raw?url="+encodeURIComponent(task.url),
        "https://corsproxy.io/?url="+encodeURIComponent(task.url)
      ];
      for(const proxyUrl of urls){
        try{
          response=await fetch(proxyUrl,{credentials:"omit",cache:"no-store",signal:controller.signal});
          if(response.ok)break;
          lastError=new Error("HTTP "+response.status);
          response=null;
        }catch(err){lastError=err;response=null;}
      }
      if(!response)throw lastError||new Error("피드 연결 실패");
      const xml=new DOMParser().parseFromString(await response.text(),"application/xml");
      if(xml.querySelector("parsererror"))throw Error(task.source+" XML 오류");
      let nodes=[...xml.getElementsByTagName("item")],atom=nodes.length===0;
      if(atom)nodes=[...xml.getElementsByTagName("entry")];
      const rows=nodes.map(node=>{
        const pick=names=>{for(const name of names){const el=[...node.getElementsByTagName("*")].find(n=>n.localName===name);if(el)return el.textContent||"";}return "";};
        const linkEl=[...node.getElementsByTagName("*")].find(n=>n.localName==="link");
        const link=atom?(linkEl?.getAttribute("href")||linkEl?.textContent||""):(linkEl?.textContent||"");
        return {title:pick(["title"]).trim(),link:link.trim(),pubDate:pick(["pubDate","published","updated","date"]),author:task.source,description:pick(["description","summary","content","encoded"]),category:task.cat};
      }).filter(x=>x.title&&x.link);
      for(const x of rows){
        const d=new Date(x.pubDate);
        if(isNaN(d.getTime())||seoulDateKey(d)!==todayKey)continue;
        const titleKey=x.title.toLowerCase().replace(/\s+/g,"").replace(/[“”‘’"'.,!?·:()[\]{}]/g,"");
        const linkKey=x.link.split("?")[0].replace(/\/$/,"");
        if(seenTitles.has(titleKey)||seenLinks.has(linkKey))continue;
        seenTitles.add(titleKey);seenLinks.add(linkKey);
        categoryItems[task.cat].push(x);total++;
      }
    }catch(e){failures++;}
    finally{
      clearTimeout(timeout);
      finished++;
      updateView();
    }
  });
  await Promise.allSettled(jobs);
  if(total===0){
    $("#count").textContent="오늘 기사 0개 · "+failures+"개 피드 연결 실패";
    $("#feed").innerHTML='<div class="empty">뉴스 서버에서 기사를 가져오지 못했어요.<br>잠시 후 새로고침을 눌러 주세요.</div>';
  }else{
    $("#count").textContent=total+"개 · 오늘 기사"+(failures?" · "+failures+"개 피드 응답 없음":"");
  }
}
function pickScore(x){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보",1]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const categoryData=window.dailyCategoryItems||{};
  let picks=[],rest=[];
  if(category===""){
    for(const [cat,rows] of Object.entries(categoryData)){
      const ranked=rows.filter(matches).map((x,i)=>({x,score:pickScore(x)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      picks.push(...ranked.slice(0,3).map(p=>({...p,category:cat})));
      rest.push(...ranked.slice(3).map(p=>({...p,category:cat})));
    }
    picks.sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
    rest.sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
  }else{
    const ranked=(categoryData[category]||[]).filter(matches).map(x=>({x,score:pickScore(x),category})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
    picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
    rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
  }
  const total=picks.length+rest.length;
  $("#count").textContent=total+"개 · 오늘 기사";
  if(!total){$("#feed").innerHTML='<div class="empty">오늘 표시할 기사가 없어요.</div>';return;}
  const renderStory=(p,i,featured)=>story(p.x,i,featured);
  window.renderedStories=[...picks,...rest].map(p=>p.x);
  const pickHeading=category===""?"오늘의 픽 · 전체 카테고리":"오늘의 픽";
  const picksHtml=picks.length?'<div class="sectionhead"><strong>'+pickHeading+'</strong><span>'+picks.length+'개 · 카테고리별 3개</span></div><div class="featured">'+picks.map((p,i)=>'<div class="pick-category">'+(category===""?'<div style="font-size:10px;color:#888;font-weight:700;padding-top:13px">'+esc(categories.find(c=>c[1]===p.category)?.[0]||p.category)+'</div>':'')+renderStory(p,i,true)+'</div>').join("")+'</div>':'';
  const restHtml=rest.length?'<hr class="sectionrule"><div class="sectionhead"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">'+rest.map((p,i)=>renderStory(p,picks.length+i,false)).join("")+'</div>':'';
  $("#feed").innerHTML=pickHeading? picksHtml+restHtml:restHtml;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;drawTabs();render();return}category=b.dataset.q;showSaved=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];localStorage.setItem("tdn_saved",JSON.stringify(saved));render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
