화 넘어 구조적 원인 살펴야 인대·유착 조직 절제, 신경 압박 완화 신경통로가 좁아지면 통증·저림이 나타난다. 나이가 들어 허리가 아프면 찜질하거나 파스를 붙이며 견디는 경우가 많다. 하지만 신경이 지나는 통로가 좁아진 상태라면 이런 방법은 통증을 잠시 덜어줄 뿐 근본적인 해결책이 되지 못한다. 오래된 수동 물 펌프에 녹과 침전물이 쌓였을 때 펌프질만 반복해서는 문제가 해결되지 않듯, 척추도 통증의 원인을 살펴 그에 맞는 치료를 해야 한다. 신경 피해 후방으로 안전하게 접근 척추의 해부학적 구조는 수동 물 펌프와 닮았다. 척추 중심에는 신경다발이 지나는 척추관이 있고, 척추뼈 사이 양옆에는 신경가지가 빠져나가는 추간공이 있다. 척추관이 지하수를 끌어올리는 중심관이라면 추간공은 물이 흘러나오는 주둥이에 해당한다. 추간공 주변 인대는 주둥이의 거름망에 비유할 수 있다. 척추 구조는 나이가 들면서 변한다. 노화로 디스크의 수분과 탄력이 줄고 인대가 두꺼워지며, 관절 주변에 골극(뼈 돌기)이 자라나 신경이 지나는 공간이 좁아진다. 여기에 탈출한 디스크와 주변 조직에서 나온 염증 유발 물질이 염증 반응과 섬유성 유착까지 일으키면 통로는 더 좁아진다. 좁아진 통로는 신경을 압박해 통증과 저림을 유발한다. 이러한 문제는 척추의 여러 마디에 나타나기도 한다. 척추관협착증, 허리 디스크, 척추 유착성 질환이 있을 때 엉덩이와 다리까지 증상이 나타나는 것도 이 때문이다. 신경이 눌려 생긴 통증은 원인에 맞춰 접근하는 것이 중요하다. 서울 광혜병원 박경우 대표원장은 이를 오래된 수동 물 펌프의 수리에 빗대어 설명한다. 펌프 자체가 심하게 손상됐다면 부품을 고치거나 바꿔야 하지만, 통로가 막혔다면 그 부분만 뚫어도 물이 다시 흐른다. 척추도 마찬가지다. 신경 통로가 좁아졌다면 통로를 막은 원인을 해결해 압박을 줄이는 것이 관건이다. 이런 구조적 문제를 해결하기 위해 고안된 비수술적 치료법이 ‘추간공확장술’이다. 추간공 안팎의 특정 인대만 선택적으로 절제해 신경 통로를 넓히고, 주변 유착을 완화하는 방식이다. 시술은 신경가지와 혈관이 밀집한 추간공 앞쪽을 피해 비교적 안전한 후방으로 접근한다. 추간공확장술은 염증 유발 물질이 배출되기 쉬운 환경을 만드는 역할도 한다. 펌프의 거름망에 낀 찌꺼기를 걷어내 물길을 터주는 것과 비슷한 원리다. 박 대표원장은 “물리적으로 좁아져 있던 공간을 넓히면 신경 주변","category":"사건 사고"},{"title":"총수가 재판에 묶인 사이 ‘AI시대’…4년 멈춘 카카오, 성장시계 다시 돈다","link":"https://n.news.naver.com/mnews/article/009/0005767378","naverLink":"https://n.news.naver.com/mnews/article/009/0005767378","pubDate":"2026-11-23T11:06:32.509942+09:00","author":"네이버뉴스","description":"카카오 경영정상화 시동 김범수 창업주 2심 무죄에 법조·재계 “상고 실익 없어” 4년 가까운 수사·재판에 美 증권사 인수 불발되고 카뱅 신사업 인허가 지연 20일 서울고등법원에 출석하는 김범수 카카오 창업자(왼쪽). [뉴스1] SM엔터테인먼트 인수 과정에서의 시세조종 혐의로 기소된 김범수 카카오 창업자 겸 미래이니셔티브센터장이 항소심에서도 무죄를 선고받으면서 카카오가 사법 리스크의 무게를 덜게 됐다. 카카오는 내년 2월 인적분할을 기점으로 경영 정상화에 속도를 내겠다는 계획이다. 4년 가까이 이어진 수사와 재판으로 해외 인수와 금융 신사업이 잇따라 좌초된 만큼, 멈춰섰던 성장동력을 되살리는 일이 과제다. 22일 정보기술(IT)·금융투자업계에 따르면 카카오가 사업 확장에 가장 속도를 내야 할 시기를 재판 대응에 묶여 보냈다는 평가가 쏟아진다. 2023년 3월 금융당국 조사로 시작된 수사와 재판은 생성형 인공지능(AI) 경쟁이 본격화한 시기와 맞물렸다. 글로벌 빅테크가 메신저·검색 등 기존 서비스에 AI를 빠르게 입히는 동안 카카오는 김 창업자 구속과 재판을 함께 감당해야 했다. 대규모 투자나 인수처럼 최고 의사결정권자 판단이 필요한 사안일수록 뒤로 밀릴 수밖에 없었다는 게 업계 분석이다.","category":"사건 사고"},{"title":"LG헬로비전, 지역채널 뉴스 AI로 만든다…동네 소식부터 재난 정보까지","link":"https://n.news.naver.com/mnews/article/014/0005608111","naverLink":"https://n.news.naver.com/mnews/article/014/0005608111","pubDate":"2026-11-23T11:06:32.509877+09:00","author":"네이버뉴스","description":"LG헬로비전, 지역채널 뉴스 AI로 만든다…동네 소식부터 재난 정보까지. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"\"반도체 막으면 희토류 막는다?\"…美·中 다시 충돌","link":"https://n.news.naver.com/mnews/article/018/0006413984","naverLink":"https://n.news.naver.com/mnews/article/018/0006413984","pubDate":"2026-11-23T11:06:32.191556+09:00","author":"네이버뉴스","description":"美, 정상회담 이틀전 AI칩 규제, 당일엔 中 통신사 번호 차단 中 \"경제적 강압, 단호히 이익 수호\" 보복 예고, 희토류 카드 거론 \"젠슨 황 사건 이전으로 돌아가기 쉽지 않다\", 흔들리는 무역 휴전 내년 1월 민주당 의회 출범 앞둬 \"G20 이후엔 다른 게임\" 긴장 [이데일리 김정유 기자] 미국과 중국의 무역전쟁이 다시 불붙을 조짐을 보이고 있다. 중국이 ‘여성 간첩’을 통해 엔비디아의 첨단 반도체를 빼돌렸단 의혹 이후 미국에서 반도체와 통신 분야 규제를 잇달아 쏟아내고 있어서다. 이에 중국이 희토류 수출 통제를 무기로 맞불을 놓을 것이란 전망까지 나오면서 양국의 ‘무역휴전’도 흔들리고 있는 모양새다. 도널드 트럼프 미국 대통령(왼쪽)이 18일(현지시간) 아시아태평양경제협력체(APEC) 정상회의 참석차 중국 선전 공항에 도착해 시진핑 중국 국가주석 옆에서 손짓하고 있다. (사진=로이터) 22일(현지시간) 미국 CNN방송에 따르면 지난 19일 중국 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의를 전후해 미국은 대(對)중국 규제 고삐를 바짝 죄고 있다. 미 상무부는 트럼프 대통령이 선전에 도착하기 이틀 전 중국의 미국산 첨단 칩 접근을 추가로 차단하는 새로운 허가 요건을 발표했다. 정상회담 당일인 19일엔 미국 연방통신위원회(FCC)가 차이나모바일, 차이나텔레콤, 차이나유니콤이 인터넷전화(VoIP)용 미국 전화번호를 직접 확보하지 못하도록 규제했다. FCC는 앞서 지난달 29일 중국 시험기관의 미국행 전자제품 시험도 금지시킨 바 있다. 미국의 대중 규제가 하드웨어를 넘어 통신 번호 자원과 컴퓨팅 파워로까지 확대되는 모양새다. 국제통상법 전문가인 벤저민 코스트제와 호건로벨스캐드왈라더 홍콩 파트너는 “엔비디아 사태의 여파와 새 수출통제 규정이 정상회담 직전에 나오면서 미·중 간 불안한 휴전은 더욱 취약해졌다”고 진단했다. 엔비디아 사태는 젠슨 황 전 최고경영자(CEO)가 중국 정보기관과 연계된 것으로 의심받는 앨리스 황과 불륜 관계를 가지면서 퇴출된 사건이다. 이에 미국에선 자국의 첨단 기술이 중국에 넘어갈 수 있단 우려가 커진 상황이지만, APEC 정상회의에서 두 정상은 엔비디아 사태에 대해 언급하지 않았다. 미국의 이 같은 잇단 규제에 중국은 강하게 반발했다. 중국 외교부는 미국의 새 반도체 규제를 “전형적인 경제적 강압”이라고 규정했다. 중국 상무부는 시 주석이 트럼프 대통령을 맞이하기 하루 전에도","category":"사건 사고"},{"title":"\"AI 주식 매도세, 닷컴버블 닮은꼴\"…더 큰 붕괴 오나","link":"https://n.news.naver.com/mnews/article/422/0000928882","naverLink":"https://n.news.naver.com/mnews/article/422/0000928882","pubDate":"2026-11-23T11:06:32.191541+09:00","author":"네이버뉴스","description":"\"AI 주식 매도세, 닷컴버블 닮은꼴\"…더 큰 붕괴 오나. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"\"불륜이 문제가 아니라…\" 엔비디아 칩 中 밀반입에 캄보디아 범죄조직 연루 의혹","link":"https://n.news.naver.com/mnews/article/014/0005608070","naverLink":"https://n.news.naver.com/mnews/article/014/0005608070","pubDate":"2026-11-23T11:06:32.191534+09:00","author":"네이버뉴스","description":"\"불륜이 문제가 아니라…\" 엔비디아 칩 中 밀반입에 캄보디아 범죄조직 연루 의혹. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"\"AI 거품 이미 터졌는가\"…미국 증시 급락에 2000년 닷컴버블 붕괴 재조명","link":"https://n.news.naver.com/mnews/article/654/0000212794","naverLink":"https://n.news.naver.com/mnews/article/654/0000212794","pubDate":"2026-11-23T11:06:32.191527+09:00","author":"네이버뉴스","description":"WSJ \"최근 AI주 매도세, 닷컴버블 붕괴와 놀라울 만큼 유사\" 한국 증시 '미니 버블' 전형 지목…AI 투자 위축 따른 연쇄 충격 우려 ▲ 월스트리트저널 캡처 미국 증시에서 인공지능(AI) 관련주가 가파르게 하락하면서 2000년 닷컴버블 붕괴 당시의 시장 흐름이 재현될 수 있다는 경고가 나왔다. 한국 증시를 비롯한 일부 반도체·데이터센터 관련 시장에서는 이미 소규모 거품이 꺼졌지만, AI 산업 전반으로 충격이 확산할지는 여전히 불확실하다는 분석이다. 월스트리트저널(WSJ)은 22일(현지시간) 'AI 거품은 이미 터졌는가'라는 제목의 칼럼을 통해 최근 기술주 급락세를 2000년 닷컴버블 붕괴 당시와 비교했다. WSJ의 제임스 매킨토시 칼럼니스트는 \"최근 몇 주 AI 주식 매도세는 닷컴버블 붕괴와 놀랄 만큼 비슷하다\"며 주요 주가지수와 기술기업들의 하락률을 근거로 제시했다. 미국 대표 주가지수인 스탠더드앤드푸어스(S&P)500은 지난 20일 종가 기준으로 지난달 6일 사상 최고치보다 11.6% 하락했다. 닷컴버블이 무너진 2000년 당시 이 지수가 고점에서 연말까지 약 15% 떨어졌던 것과 비교하면 낙폭이 상당 부분 근접했다. 개별 기업의 주가 흐름에서는 과거보다 더 큰 충격을 받은 종목도 확인됐다. 인텔의 고점 대비 하락률은 2000년 60%에서 올해 64%로 커졌다. 오라클과 시게이트 역시 과거 각각 37%였던 낙폭이 올해는 나란히 60%에 달했다. 반대로 일부 반도체 기업은 2000년보다 하락 폭이 작았다. 엔비디아는 62%에서 48%, 마이크론은 63%에서 53%, 퀄컴은 54%에서 42%, 시스코는 52%에서 30%로 각각 줄었다. 특히 젠슨 황의 퇴진으로 위기를 맞은 엔비디아는 최근 7거래일 동안 주가가 27.7% 급락했다. 매킨토시 칼럼니스트는 \"일부는 거의 같고 일부는 더 나쁘며 일부는 더 낫다\"고 평가했다. 종목마다 하락 양상이 달라 현재 상황을 닷컴버블 붕괴와 동일하게 판단하기는 어렵다는 의미다. 그러나 데이터센터와 반도체를 중심으로 형성됐던 이른바 '미니 버블'에 대해서는 이미 붕괴가 진행됐다고 진단했다. 실제로 마이크론 주가는 3개월 동안 약 4배 급등한 이후 상승분을 상당 부분 반납하며 절반 넘게 떨어졌다. 반도체 업종 전체도 주가가 2배 수준으로 오른 뒤 43% 하락했다. 엔비디아의 투자를 받은 클라우드 기업 코어위브도 비슷한 흐름을 보였다. 지난해 증시 상장 이후 주가가 4배 이상 치","category":"사건 사고"},{"title":"AI거품, 이미 상당부분 꺼졌다…문제는 주가 아닌 투자 붕괴 가능성","link":"https://n.news.naver.com/mnews/article/029/0003060553","naverLink":"https://n.news.naver.com/mnews/article/029/0003060553","pubDate":"2026-11-23T11:06:32.191522+09:00","author":"네이버뉴스","description":"S&P500 조정 진입·나스닥 주간 10% ↓…AI주 매도 확산 “데이터센터·반도체 미니버블은 이미 꺼져”…한국도 영향 ECB “빅테크 현금흐름 마이너스”…AI 투자에 차입 확대 AI 혁명은 진행형…투자수익률 입증 못 하면 닷컴버블 재현 AI 개발사 앤트로픽 로고. 로이터 연합뉴스 인공지능(AI) 산업의 거품 붕괴가 시작된 것인가. 최근 세계 증시를 강타한 AI 관련주 급락은 AI 산업에 쏠렸던 투자자들의 믿음이 흔들리고 있음을 보여준다. 아직 AI 산업 전체의 붕괴를 선언할 단계는 아니지만, 데이터센터와 반도체를 중심으로 형성된 투자 거품은 이미 꺼지기 시작했다는 분석이 설득력을 얻고 있다. 월스트리트저널(WSJ)은 22일(현지시간) 최근 AI주 매도세가 2000년 닷컴버블 붕괴와 놀라울 정도로 닮았다고 보도했다. 제임스 매킨토시 칼럼니스트는 데이터센터와 관련 반도체를 둘러싼 ‘미니버블’은 이미 터졌다고 평가하면서도 AI 산업 전반의 거품 붕괴 여부는 아직 불확실하다고 밝혔다. 실제 시장의 충격은 작지 않다. 지난주 S&P500이 3.7% 하락해 고점 대비 10% 이상 떨어지는 조정장에 진입했고, 나스닥은 주간 10% 급락해 2020년 3월 이후 최악의 한 주를 기록했다. WSJ은 20일 나스닥에서 한 주 동안 4조달러 이상의 시가총액이 사라졌다고 보도했다. 한국을 비롯한 아시아 반도체 시장에도 매도세가 번졌다. 이번 하락은 AI 기업의 실적 부진만으로 설명되지 않는다. 시장은 막대한 투자비를 얼마나 빠르게 수익으로 회수할 수 있는지에 관심이 있다. 뉴욕타임스(NYT)는 엔비디아의 양호한 실적과 앤트로픽의 대형 기업공개(IPO)에도 투자자들의 불안이 해소되지 않았다고 분석했다. AI 기술의 성장 가능성보다 데이터센터 건설에 투입된 막대한 자본과 부채를 정당화할 수 있는 수익성이 핵심 쟁점으로 떠올랐다는 것이다. 우려를 뒷받침하는 지표도 나왔다. 유럽중앙은행(ECB)은 11월 금융안정보고서에서 미국 주요 빅테크 기업 대부분의 잉여현금흐름이 2026년 마이너스로 돌아섰으며, AI 인프라 투자를 위해 주식과 채권, 사모대출 등 외부 자금 조달에 의존하고 있다고 밝혔다. 미래 데이터센터 수익을 담보로 한 금융구조까지 확대되고 있다는 점도 지적했다. 이는 AI 투자가 기업의 현금창출 능력만으로 감당하기 어려운 단계에 접어들었음을 시사한다. 문제는 투자와 수요의 악순환이다. AI 서비스의 수익화가 기대에 못 미치면 빅테","category":"사건 사고"},{"title":"\"AI 거품 이미 터졌을 수도…최근 급락세, 닷컴 붕괴 낙폭 수준\"","link":"https://n.news.naver.com/mnews/article/421/0009304379","naverLink":"https://n.news.naver.com/mnews/article/421/0009304379","pubDate":"2026-11-23T11:06:32.191501+09:00","author":"네이버뉴스","description":"\"AI 거품 이미 터졌을 수도…최근 급락세, 닷컴 붕괴 낙폭 수준\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"美델타항공도 시스템 장애…항공편 1300여편 지연","link":"https://n.news.naver.com/mnews/article/018/0006413868","naverLink":"https://n.news.naver.com/mnews/article/018/0006413868","pubDate":"2026-11-23T11:06:32.191465+09:00","author":"네이버뉴스","description":"美델타항공도 시스템 장애…항공편 1300여편 지연. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"한덕수 '내란 가담' 혐의 파기환송심, 서울고법 형사1부 배당","link":"https://n.news.naver.com/mnews/article/214/0001537353","naverLink":"https://n.news.naver.com/mnews/article/214/0001537353","pubDate":"2026-11-23T11:06:31.784701+09:00","author":"네이버뉴스","description":"대법원이 일부 무죄 취지로 파기 환송한 한덕수 전 국무총리의 내란중요임무종사 혐의 사건이 내란전담재판부 중 한 곳인 서울고법 형사1부에 배당됐습니다. 서울고법은 형사1부와 형사12부를 내란전담재판부로 운영하고 있는데, 지난 5월 형사12부가 한 전 총리에게 2심에서 징역 15년을 선고했던 만큼 다른 재판부에 사건이 배당된 것으로 보입니다. 대법원은 지난 19일 한 전 총리가 12.3 계엄 선포 전 국무회의 개최를 건의한 점에 대해 무죄 취지로 판단하고 사건을 서울고법으로 돌려보냈습니다. 새 재판부는 대법원이 제시한 법리적 판단에 따라 파기 환송된 부분을 다시 심리할 예정입니다.","category":"사회"},{"title":"이부진 아들, 어머니 성 따르기로…'임' 씨에서 '이' 씨로 변경","link":"https://n.news.naver.com/mnews/article/057/0001979425","naverLink":"https://n.news.naver.com/mnews/article/057/0001979425","pubDate":"2026-11-23T11:06:31.784700+09:00","author":"네이버뉴스","description":"이부진 아들, 어머니 성 따르기로…'임' 씨에서 '이' 씨로 변경. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"이부진 아들, '임씨' 버리고 어머니 성 따라 '이씨'로 바꿨다","link":"https://n.news.naver.com/mnews/article/014/0005608116","naverLink":"https://n.news.naver.com/mnews/article/014/0005608116","pubDate":"2026-11-23T11:06:31.784697+09:00","author":"네이버뉴스","description":"이부진 아들, '임씨' 버리고 어머니 성 따라 '이씨'로 바꿨다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[티조챗] 여학생 따귀에 음주운전·표절에도 임명 강행하더니…교육부 장관 결국 퇴진","link":"https://n.news.naver.com/mnews/article/448/0000652761","naverLink":"https://n.news.naver.com/mnews/article/448/0000652761","pubDate":"2026-11-23T11:06:31.784694+09:00","author":"네이버뉴스","description":"[티조챗] 여학생 따귀에 음주운전·표절에도 임명 강행하더니…교육부 장관 결국 퇴진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"회원 3000명 텔레그램 '마약 백화점' 만들어…'품질보증' 알선 일당 검거","link":"https://n.news.naver.com/mnews/article/421/0009304373","naverLink":"https://n.news.naver.com/mnews/article/421/0009304373","pubDate":"2026-11-23T11:06:31.784685+09:00","author":"네이버뉴스","description":"회원 3000명 텔레그램 '마약 백화점' 만들어…'품질보증' 알선 일당 검거. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"이부진 호텔신라 사장 아들, 어머니 성 따라 李씨로 변경","link":"https://n.news.naver.com/mnews/article/003/0014339099","naverLink":"https://n.news.naver.com/mnews/article/003/0014339099","pubDate":"2026-11-23T11:06:31.784684+09:00","author":"네이버뉴스","description":"이부진 호텔신라 사장 아들, 어머니 성 따라 李씨로 변경. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"탄핵 추진에 입 닫은 조희대…직무정지 땐 전원합의체 차질 우려","link":"https://n.news.naver.com/mnews/article/015/0005356967","naverLink":"https://n.news.naver.com/mnews/article/015/0005356967","pubDate":"2026-11-23T11:06:31.784679+09:00","author":"네이버뉴스","description":"탄핵 추진에 입 닫은 조희대…직무정지 땐 전원합의체 차질 우려. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"새벽 3시 퇴근에 월 초과근무 100시간…이직해야 할까요?\" [어떻게 생각하세요]","link":"https://n.news.naver.com/mnews/article/014/0005608121","naverLink":"https://n.news.naver.com/mnews/article/014/0005608121","pubDate":"2026-11-23T11:06:31.784677+09:00","author":"네이버뉴스","description":"\"새벽 3시 퇴근에 월 초과근무 100시간…이직해야 할까요?\" [어떻게 생각하세요]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"집행유예중 밀항시도 중국인 해경에 붙잡혀","link":"https://n.news.naver.com/mnews/article/417/0001165250","naverLink":"https://n.news.naver.com/mnews/article/417/0001165250","pubDate":"2026-11-23T11:06:31.784673+09:00","author":"네이버뉴스","description":"밀항 도운 한국인 선장 등 2명 구속 송치 군산해경이 재판 중 해외로 밀출국을 시도한 중국인과 이를 도운 한국인 선장을 검거하고 있다./군산해경 밀수 범죄로 재판을 받던 중국인이 집행유예 기간 중 해외로 밀출국을 시도하다 해양경찰에 붙잡혔다. 돈을 받고 밀출국을 도운 한국인 선장도 함께 검거되면서 해상을 통한 불법 출국 범죄의 실태가 드러났다. 군산해양경찰서는 중국인 남성 A씨(40대)와 밀출국을 도운 한국인 선장 B씨(40대)를 출입국관리법 위반 혐의로 구속해 지난 20일 송치했다고 23일 밝혔다. 해경에 따르면 이들은 지난 13일 오전 0시17분쯤 전북 군산시 옥도면 어청도 남서쪽 93km 해상에서 어선을 이용해 밀출국을 시도한 혐의를 받고 있다. 중국인 A씨는 집행유예 기간 중 추가 범죄 혐의로 기소돼 재판을 받던 중 이를 피하기 위해 밀출국을 시도한 것으로 해경은 보고 있다. 선장 B씨는 밀출국 브로커로부터 대가를 받고 자신이 소유한 9.7톤급 어선에 A씨를 태운 뒤 정상적인 조업을 가장해 출항한 것으로 조사됐다. 군산해경은 해당 어선이 통상적인 조업구역을 크게 벗어난 데다 선박 위치 확인까지 끊긴 점을 수상하게 보고 해양사고와 국제범죄 가능성을 동시에 염두에 두고 추적에 나섰다. 해경은 가용 가능한 경비·수색 수단을 동원해 선박 위치를 추적했으며 약 4시간 만에 공해상에서 해당 어선을 발견했다. 이후 선박에 대한 정밀 검색을 진행해 밀출국 의심 정황을 확인하고 관련 증거 확보와 범행 경위 규명에 수사력을 집중한 끝에 이들의 출입국관리법 위반 혐의를 밝혀냈다. 해경은 이번 사건과 관련해 밀출국을 알선한 브로커와 추가 조력자 등 공범들의 신원을 특정하고 이들의 소재를 추적하는 등 수사를 확대할 방침이다.","category":"사회"}],"생활·문화":[{"title":"공포의 '어는 비', 출근길 초긴장...강풍 탓 체감추위 심해","link":"https://n.news.naver.com/mnews/article/215/0001273569","naverLink":"https://n.news.naver.com/mnews/article/215/0001273569","pubDate":"2026-11-23T11:06:33.023292+09:00","author":"네이버뉴스","description":"23일 전국에 비가 내리는 가운데 도로에 내린 비가 얼 수 있어 교통 안전에 주의해야겠다. 경기북부와 강원내륙·산지에는 비 대신 눈이 오기도 하겠다. 강원내륙·산지엔 큰 눈이 내릴 수도 있다. 서해5도는 이미 비가 내리기 시작했다. 비는 오전 수도권·강원내륙·강원산지·충남북부(경기북부와 강원내륙·산지는 비 또는 눈), 오후 충청권 나머지 지역과 남부지방으로 확대되겠다. 비는 중부지방에서는 오늘 중 그치겠다. 충청남부·호남·영남에서는 24일 이른 새벽, 제주에서는 24일 아침까지 이어지겠다. 예상 강수량은 서울·인천·경기북부 5∼30㎜, 경기남부·서해5도·강원내륙·강원산지·충청·제주도 5∼20㎜, 호남·대구·경북 5∼10㎜, 강원동해안·부산·울산·경남·울릉도·독도 5㎜ 안팎이다. 예상 적설은 강원북부내륙·산지 3∼8㎝, 강원중남부내륙·산지 1∼5㎝, 제주산지 1㎝ 미만이다. 오전 기온이 영하로 내려간 와중에 비가 내리기에 '어는 비' 현상을 조심해야 한다. 액체 상태인 비가 영하인 지면이나 물체 표면에 닿아 바로 얼어 살얼음이 끼는 현상을 뜻한다. 도로와 길에 살얼음이 끼어도 눈에 잘 보이지 않아 위험하다. 강원내륙과 충북, 경상내륙 등에서는 이날 아침 기온이 -5도 아래까지 내려갔다. 오전 8시 주요 도시 기온은 부산 5.3도, 인천 5.2도, 광주 3.2도, 서울 2.2도, 대전 1.2도, 울산 0.6도, 대구 -1.5도이다. 기온이 예년 이맘때와 비슷하거나 약간 낮은 상황이 낮에도 이어지겠다. 이날 낮 최고기온도 7∼15도에 머물겠다. 바람까지 강해 체감 추위는 더하겠다. 이날부터 대부분 지역에 순간풍속 시속 55㎞(산지는 70㎞) 안팎 강풍이 불겠다. 충남서해안엔 오전부터, 강원동해안·강원산지·경북동해안·경북북동산지·경남동해안엔 오후부터 순간풍속이 시속 70㎞를 넘게 바람이 매우 세게 불겠다. (사진=연합뉴스)","category":"생활·문화"},{"title":"아침 -5도 추위 속 충청·호남 눈·비…미세먼지 '좋음' [내일날씨]","link":"https://n.news.naver.com/mnews/article/421/0009304055","naverLink":"https://n.news.naver.com/mnews/article/421/0009304055","pubDate":"2026-11-23T11:06:33.023287+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"먹으면서도 후회는 없다…건강하게 즐기는 착한 간식 8가지","link":"https://n.news.naver.com/mnews/article/296/0000107676","naverLink":"https://n.news.naver.com/mnews/article/296/0000107676","pubDate":"2026-11-23T11:06:33.023262+09:00","author":"네이버뉴스","description":"칼로리 낮고 단백질, 식이 섬유, 비타민, 미네랄 등 영양소 풍부 제철 맞은 사과 몇 조각을 간식으로 먹으면 체중 증가 염려 없이 공복감을 없애고 각종 영양소를 섭취하는 데 도움이 된다. 사진=게티이미지뱅크 혈당이나 혈압이 정상 수준을 벗어나고, 콜레스테롤 수치가 증가하는 등 건강에 빨간 불이 켜지면 괴롭다. 음식을 가려 먹고 과식도 피해야 한다. 이런 경우엔 간식이 죄책감을 부를 수 있다. 공복감이 너무 심할 때 소량으로 건강도 챙기고 맛있게 먹을 수 있는 간식은 없을까. 미국 건강·의료 매체 '웹엠디(WebMD)' 등의 자료를 토대로 죄책감 없이 먹을 수 있는 간식을 정리했다. 그릭 요거트 =일부 향을 첨가한 요거트에는 상당히 많은 설탕이 들어 있다. 하루 권장 섭취량보다 더 많은 양이다. 설탕을 덜 먹는 선택으로 일반 저지방 그릭 요거트 4분의 3컵에 계피를 뿌린 조합이 있다. 뼈 건강에 좋은 칼슘, 포만감을 오래 느낄 수 있는 단백질을 충분히 섭취할 수 있다. 장 건강에 좋은 프로바이오틱스(유익균)도 덤으로 얻을 수 있다. 다크 초콜릿 =카카오 함량 86%의 다크 초콜릿 14g(0.5온스)에는 설탕이 겨우 2g 들어 있다. 달콤한 맛의 유혹에 빠져보자. 다크 초콜릿에는 심장 보호에 좋은 식물성 화학 물질(플라보놀)도 들어 있다. 초콜릿 조각을 씹는 대신 입안에서 슬슬 녹여 먹어도 독특한 맛을 느낄 수 있다. 고구마 =고구마는 자연적으로 달콤한 맛을 낸다. 고구마에는 건강에 좋은 식물성 화학 물질과 비타민A, B6, C가 들어 있다. 고구마를 전자레인지에서 굽고 그 위에 무 지방 바닐라 요거트, 메이플 시럽을 뿌린다. 고구마 대신 감자를 활용해도 좋다. 감자를 얇게 썰어 올리브 오일을 가볍게 두른 뒤 15분 정도 또는 바삭해질 때까지 굽는다. 그 위에 계피, 육두구, 생강을 뿌린다. 바나나 =껍질 벗긴 바나나를 세로로 자른 뒤 좋아하는 저지방 요거트와 무염 견과류를 얹으면 맛있는 간식이 탄생한다. 단백질, 프로바이오틱스, 칼슘도 충분히 섭취하고 단 맛도 즐길 수 있다. 심장에 좋은 칼륨과 불포화 지방산도 얻을 수 있다. 대추 =대추엔 천연 설탕이 풍부하게 들어 있다. 레시피에서 감미료로 자주 쓰는 이유다. 끈적거리고 쫄깃한 캐러멜 같다. 대추에는 섬유질, 비타민B6, 칼륨, 망간 등 미네랄도 꽤 많이 함유돼 있다. 냉동 완두콩 =얼린 완두콩은 차갑고 살짝 달콤하고 바삭한 간식이다. 냉동 완두콩 반 컵이면","category":"생활·문화"},{"title":"삼척시, 반려동물 진료비 가구당 5만 원 지원···12월 11일까지 신청","link":"https://n.news.naver.com/mnews/article/032/0003484353","naverLink":"https://n.news.naver.com/mnews/article/032/0003484353","pubDate":"2026-11-23T11:06:33.023226+09:00","author":"네이버뉴스","description":"주소지 읍·면·동 행정복지센터에서 신청 가능 삼척시청 전경. 삼척시 제공 강원 삼척시는 반려동물을 기르는 시민들의 진료비 부담을 덜기 위해 ‘반려동물 진료비 지원사업’을 추진한다고 23일 밝혔다. 지원 대상은 2026년 1월 1일 기준 삼척시에 2년 이상 거주하고, 동물등록을 마친 반려동물을 기르는 가구의 세대주다. 지원금은 가구당 연 1회, 최대 5만 원이다. 진료비가 10만 원 미만이면 실제 지출액의 절반을, 10만 원 이상이면 5만 원을 지원한다. 지원 항목은 질병 진단·치료, 예방접종, 중성화 수술 비용 등으로 삼척시 내 동물병원에서 올해 지출한 비용을 지원한다. 다만 사료·샴푸·의약품 등 물품 구매비와 미등록 반려동물은 지원 대상에서 제외된다. 신청자는 지급 청구서, 진료 내용과 비용을 확인할 수 있는 영수증 또는 진료확인서, 과거 주소가 포함된 주민등록등본, 세대주 명의 통장 사본을 갖춰 오는 12월 11일까지 주소지 읍·면·동 행정복지센터에 제출하면 된다. 삼척시 관계자는 “반려동물의 건강은 함께 사는 가족의 일상과도 맞닿아 있다”며 “이번 지원으로 반려동물을 아끼고 돌보는 시민들의 마음에 힘을 보태고자 한다”고 말했다.","category":"생활·문화"},{"title":"주민이 만드는 지역관광…‘관광두레’ 정부혁신 박람회 참가","link":"https://n.news.naver.com/mnews/article/003/0014339056","naverLink":"https://n.news.naver.com/mnews/article/003/0014339056","pubDate":"2026-11-23T11:06:33.023223+09:00","author":"네이버뉴스","description":"25~27일 경기 고양시 킨텍스서 27개 지역 주민사업체 상품 전시·체험 2013년 시작한 관광두레, 전국 152개 지역서 주민사업체 1411곳 육성 경기 여주시 ‘소이로리’의 ‘신륵 목어’. (사진=한국관광공사 제공) *재판매 및 DB 금지 [서울=뉴시스]김정환 관광전문 기자 = 지역 주민들이 특산물과 전통문화를 활용해 개발한 관광기념품과 체험 프로그램이 소개된다. 한국관광공사(사장 박성혁)는 25~27일 경기 고양시 일산서구 킨텍스로 킨텍스 제1전시장 1홀에서 열리는 ‘2026 대한민국 정부혁신 박람회’에 참가해 ‘관광두레’ 사업의 성과와 지역관광 혁신 사례를 선보인다고 23일 밝혔다. 행정안전부가 주최하는 이번 박람회는 ‘모두의 혁신, 든든한 미래, 행복한 국민’을 슬로건으로 국민이 일상에서 체감할 수 있는 정부혁신 성과와 미래 공공 서비스를 공유하는 행사다. 관광공사는 지역혁신·균형발전을 다루는 ‘성장하는 지역’ 분야에서 ‘주민이 그리는 지역의 미래, 관광두레’를 주제로 전시관을 운영한다. 관광두레는 지역 주민이 고유의 관광자원을 발굴하고 이를 활용해 관광사업체를 직접 창업·경영하도록 지원하는 사업이다. 문화체육관광부(장관 최휘영)와 관광공사가 2013년부터 추진해 왔다. 6월 기준 전국 152개 지역에서 주민사업체 1400여 곳을 육성했다. 관광공사는 올해 40개 지역에서 주민사업체 200곳을 발굴·지원하고 있다. 경남 김해시 ‘예술공간예닮’의 ‘미니 가야금 DIY 키트’. (사진=한국관광공사 제공) *재판매 및 DB 금지","category":"생활·문화"},{"title":"디지털 교육 앞서가던 노르웨이, 다시 종이책 꺼냈다...왜","link":"https://n.news.naver.com/mnews/article/092/0002446369","naverLink":"https://n.news.naver.com/mnews/article/092/0002446369","pubDate":"2026-11-23T11:06:32.509928+09:00","author":"네이버뉴스","description":"읽기·쓰기 능력 저하에 교육정책 재검토…학생 1인 1기기 의무 폐지하고 AI 활용도 제한 디지털 교육에 앞장서 온 노르웨이가 교실에서 태블릿PC와 노트북 사용을 줄이고 종이 교과서를 다시 확대하고 있다. 학생들의 읽기·쓰기 능력이 떨어지자 디지털 기기 중심의 교육이 학습 효과를 충분히 고려하지 못한 채 빠르게 확산했다는 반성이 나오면서다. 수도 오슬로는 초등학생에게 디지털 기기를 한 대씩 지급하도록 했던 의무 규정을 폐지했다. 노르웨이 정부는 종이 교과서 제공을 법적으로 보장하는 방안을 추진하는 한편, 초등학교에서 인공지능(AI) 사용을 원칙적으로 제한하는 방향으로 교육정책을 재정비하고 있다. 최근 AFP통신에 따르면 노르웨이는 최근 학교 교육에서 디지털 기기의 역할을 재검토하고 종이 교과서 활용을 확대하고 있다. 디지털 교육을 적극 도입했던 노르웨이가 학생들의 기초학력 저하 우려에 따라 태블릿PC 등 디지털 기기 사용을 줄이고 종이 교과서 활용을 확대하고 있다. (사진=클립아트코리아) 노르웨이는 지난 20년 가까이 학교에 컴퓨터와 태블릿PC를 적극적으로 도입해 왔다. 코로나19 팬데믹을 거치면서 디지털 교육은 확산했다. 오슬로시는 2023년부터 초등학교에서 학생 한 명당 디지털 기기 한 대를 갖추도록 했다. 그러나 학생들의 기초학력 저하에 대한 우려가 커지면서 정책 방향이 달라졌다. 토르게이르 미카엘센 노르웨이 디지털화부 장관은 AFP에 \"디지털 기기의 영향과 올바른 교육적 활용 방법에 대한 충분한 지식이 확보되기 전에 학교에 스크린을 너무 빠르게 도입했을 가능성이 있다\"고 말했다. 실제 노르웨이에서는 학생들의 학업 성취도가 하락하면서 디지털 교육의 효과를 재검토해야 한다는 목소리가 이어졌다. AFP는 2025년 국제학업성취도평가(PISA)에서 노르웨이 학생들이 읽기와 수학, 과학 세 영역 모두 경제협력개발기구(OECD) 평균에 미치지 못했다고 전했다. 세 영역에서 동시에 평균 이하를 기록한 것은 2006년 이후 처음이라는 설명이다. 2024년 노르웨이의 스크린 사용 관련 위원회 역시 학생들이 긴 글을 읽을 때 디지털 화면보다 종이에서 내용을 더 잘 이해하는 경향이 있다는 점을 지적했다. 학교 현장에서는 이미 디지털 기기 중심 수업에 대한 문제 제기가 있었다. 오슬로의 한 초등학교에서 3학년을 가르치던 교사 폴 루드비그 핀스타는 2023년 읽기와 쓰기에 어려움을 겪는 학생들을 위해 태블릿PC를 잠시 치우고 종","category":"생활·문화"},{"title":"\"하루 한 번 지역뉴스, 매시간마다\"...SKB, AI 아나운서로 하루 10회 방송","link":"https://n.news.naver.com/mnews/article/092/0002446390","naverLink":"https://n.news.naver.com/mnews/article/092/0002446390","pubDate":"2026-11-23T11:06:32.509901+09:00","author":"네이버뉴스","description":"20분 뉴스 제작 3시간→1시간…ch B tv 시청률 1년 새 3.4배 SK브로드밴드 케이블방송 지역채널 ch Btv 지역뉴스가 하루 한 번에서 매시간으로 늘었다. 기자가 쓰고 데스크가 승인한 원고를 AI 아나운서의 목소리와 영상으로 바꿔주는 자체 AI 방송 제작 솔루션 ‘Btv AI 스튜디오’를 도입한 결과다. 23일 SK브로드밴드 뉴스룸에 따르면 ch Btv는 올해 초부터 Btv AI 스튜디오를 적용해 평일 오전 9시부터 오후 6시까지 매시 정각 하루 10회 정시뉴스를 내보내고 있다. 저녁 7시 메인 뉴스 한 편이 전부이던 지역뉴스에 정시뉴스가 더해졌고, 20분 분량 뉴스 한 편을 만드는 시간은 3시간 이상에서 약 1시간으로 줄었다. SK텔레콤과 SK브로드밴드가 함께 개발한 Btv AI 스튜디오는 뉴스 제작 가운데 방송 화면을 만드는 단계만 맡는다. 취재와 사실 확인, 데스크 승인, 방송 직전 최종 검수는 모두 사람이 하고, AI는 승인된 원고를 AI 아나운서의 목소리와 자막, 방송 화면으로 만든다. 기자 리포트 더빙도 기자 본인의 목소리로 만든 AI 음성이 대신한다. B tv AI 스튜디오 AI 아나운서 선택 화면, AI를 활용해 제작한 AI 아나운서를 그날의 의상, 보도에 맞는 음성톤 등을 선택해 배치할 수 있다. 사진_SK브로드밴드 뉴스룸 보도국의 일하는 방식도 바뀌었다. 예전에는 저녁 뉴스 한 편을 위해 스튜디오 조명과 카메라를 맞추고, 진행자가 분장을 하고, 부조정실에 스태프가 모두 모여야 했다. 지금은 웹 화면에서 AI 아나운서를 고르고 큐시트를 짜면 뉴스의 뼈대가 잡히고, PD는 어색하게 읽힌 지명이나 숫자 표기를 고치고 자막 타이밍을 맞춘다. 날씨도 기상 데이터를 템플릿에 넣어 권역마다 따로 만든다. 이유진 경기보도국 PD는 “예전엔 저녁 뉴스 한 번을 위해 하루가 돌아갔는데, 지금은 현장에서 기사가 들어오면 언제든 바로 뉴스로 만들 수 있다”며 “AI가 영상을 만들어 주니까 저는 듣고, 보고, 고르는 사람이 됐고, 한 편 한 편을 보는 눈은 오히려 더 깐깐해졌다”고 말했다. 현장 기자는 오후 내내 붙잡던 더빙과 편집에서 벗어났다. 현장에서 기사를 써 보내면 데스크 승인을 거쳐 다음 정시뉴스로 나간다. 지난 10월 인천에서 주민 안전과 직결된 사건이 났을 때도 ch B tv 홈페이지 속보에 이어, 데스크 승인을 거친 기사가 한 시간도 안 돼 오후 5시 정시뉴스로 방송됐다. 이정윤 인천보도국 기","category":"생활·문화"},{"title":"[주간 뉴욕증시] AI 거품 공포 속 추수감사절…美 물가지표에 촉각","link":"https://n.news.naver.com/mnews/article/003/0014338752","naverLink":"https://n.news.naver.com/mnews/article/003/0014338752","pubDate":"2026-11-23T11:06:32.191562+09:00","author":"네이버뉴스","description":"지난주 S&P500 8% 넘게 급락…앤트로픽 상장 후 주가도 하락 25일 10월 PCE 발표…근원 물가 상승률 3.2% 전망 26일 추수감사절 휴장·27일 조기 폐장…델·HPE 실적 주목 [뉴욕=AP/뉴시스] 미국 뉴욕증시가 인공지능(AI) 투자 거품 우려로 급락한 가운데 이번 주에는 연방준비제도(Fed·연준)가 선호하는 물가 지표인 개인소비지출(PCE) 물가지수에 투자자들의 관심이 집중될 전망이다. 사진은 2022년 9월23일 미국 뉴욕증권거래소(NYSE) 건물 밖에 성조기가 펄럭이고 있다. 2026.11.23. *재판매 및 DB 금지 [서울=뉴시스]박미선 기자 = 미국 뉴욕증시가 인공지능(AI) 투자 거품 우려로 급락한 가운데 이번 주에는 연방준비제도(Fed·연준)가 선호하는 물가 지표인 개인소비지출(PCE) 물가지수에 투자자들의 관심이 집중될 전망이다. 추수감사절 연휴로 거래일이 줄어드는 만큼 물가 지표와 주요 기술기업 실적이 증시 향방을 가를 변수로 꼽힌다. 22일(현지 시간) 야후파이낸스에 따르면 지난주 뉴욕증시에서 스탠더드앤드푸어스(S&P)500지수는 8% 넘게 하락했다. 앤트로픽의 기업공개(IPO)와 엔비디아를 둘러싼 불확실성이 맞물리면서 AI 관련주를 중심으로 매도세가 확산했다. 이번 주 최대 관심사는 오는 25일 발표하는 미국의 10월 PCE 물가지수다. 특히 근원 PCE 물가지수는 연준이 통화정책을 결정할 때 중요하게 참고하는 인플레이션 지표로, 다음 달 연방공개시장위원회(FOMC) 회의를 앞두고 금리 전망에 영향을 미칠 것으로 보인다. 시장에서는 10월 PCE 물가지수가 전월 대비 0.3%, 전년 대비 3.8% 상승했을 것으로 예상하고 있다. 근원 PCE 물가지수는 전월 대비 0.3%, 전년 대비 3.2% 상승했을 것으로 전망된다. 근원 물가의 전년 대비 상승률 전망치는 전월 3.1%보다 높은 수준이다. AI 기업들의 주가 흐름도 주요 변수다. 지난 19일 미국 증시에 상장한 앤트로픽은 첫 거래에서 공모가 83달러보다 34% 높은 111.50달러에 거래를 시작했지만 상승 폭을 반납하며 97.17달러에 마감했다. 상장 이튿날에는 차익 실현 매물이 나오면서 주가가 약 10% 하락했다. 페이브파이낸스의 아누샤 로드리게스 수석 시장전략가는 \"앤트로픽의 기업가치가 1조 달러를 넘는 만큼 향후 성장성과 수익성에 대한 기대 수준이 매우 높다\"며 \"현재의 열기가 지속 가능한 시장 상승으로 이어질지, 단기적","category":"생활·문화"},{"title":"中서 39.5억년 전 암석 발견…\"지구 초창기 모습 어땠나\"","link":"https://n.news.naver.com/mnews/article/018/0006414013","naverLink":"https://n.news.naver.com/mnews/article/018/0006414013","pubDate":"2026-11-23T11:06:32.191518+09:00","author":"네이버뉴스","description":"허베이성 루룽현서 화강암질 편마암 발견, 면적 15㎡ 남짓 지구 탄생 6.5억년 뒤 형성, 세계 최고 암석과 5000만년 차 \"39.5억년 전 이미 판섭입과 유사한 지각 활동 확인돼 \" [이데일리 김정유 기자] 중국 과학자들이 아시아에서 가장 오래된 암석을 찾아냈다. 약 39억 5000만년 전에 형성된 이 암석은 지구가 막 생겨난 시기의 모습을 엿볼 수 있는 귀중한 단서로 꼽힌다. 최근엔 이 암석 분석을 통해 지구의 판구조 운동이 기존 학설보다 훨씬 이른 시기에 시작됐을 수 있다는 연구 결과까지 나왔다. 중국 허베이성 루룽현에서 발견된 39억 5000만년 전 화강암질 편마암. 아시아에서 가장 오래된 암석으로 확인된 이 암석은 초기 지구의 지각 진화 과정을 밝힐 새로운 증거가 될 것으로 기대된다. (사진=CCTV 화면 캡처) 22일 중국 관영 CCTV 보도에 따르면 중국 자연자원부 산하 중국지질조사국은 허베이성 루룽현에서 약 39억 5000만년 된 암석을 발견했다고 밝혔다. 이 암석은 화강암질 편마암의 일종으로 지표에 드러난 면적은 약 15㎡다. 이는 작은 방 한 칸 정도의 크기다. 해당 암석은 지구가 갓 태어난 시기에 만들어 진 것으로 추정됐다. 지구의 나이가 약 46억년임을 감안하면 이 암석은 지구가 생긴 지 6억 5000만년 밖에 지나지 않았을 때 형성된 것으로 보인다. 이처럼 지구 역사 초기 단계의 암석을 찾는 건 극히 드문 일이다. 이에 따라 중국에서 발견된 가장 오래된 암석의 기록은 기존보다 1억 5000만년 앞당겨졌다. 지금까지 인정받은 세계에서 가장 오래된 암석층은 약 40억년 전에 형성된 캐나다의 ‘아카스타 편마암’이다. 중국에서 발견된 암석보다 5000만년 정도 더 오래됐다. 중국 연구진은 암석 속에 박힌 미세한 지르콘 광물을 분석해 나이를 측정했다. 지르콘은 지구 초기의 역사를 그대로 간직한 ‘천연 타임캡슐’ 역할을 한다. 이어 연구진은 암석의 화학 성분을 추가로 분석해 초기 지구의 진화 과정을 새롭게 밝힐 수 있는 두 가지 사실을 확인했다. 우선, 지구가 이미 39억 5000만년 전에 현재의 판 섭입과 비슷한 지각 활동을 겪었을 가능성이 제기됐다. 판 섭입은 지표의 물질이 지하 수십㎞ 깊이까지 끌려 들어가는 현상이다. 이 같은 지질 활동이 기존 예상치보다 더 이른 시기에 시작됐을 수 있다는 의미다. 또한, 지구의 지각과 맨틀이 대규모로 분화하는 과정이 약 43억년 전에 이미 시작됐다는 사실도","category":"생활·문화"},{"title":"천안서 불법체류 노동자 몰던 승합차에 50대 농장주 참변","link":"https://n.news.naver.com/mnews/article/656/0000193252","naverLink":"https://n.news.naver.com/mnews/article/656/0000193252","pubDate":"2026-11-23T11:06:31.784705+09:00","author":"네이버뉴스","description":"대전일보DB 천안의 한 축사에서 불법체류 태국인 노동자가 몰던 승합차에 농장주가 치여 숨지는 사고가 발생했다. 천안서북경찰서는 태국 국적 A씨(40)를 교통사고처리법 위반(치사) 혐의로 붙잡아 조사하고 있다고 23일 밝혔다. 경찰에 따르면 A씨는 전날 오후 2시55분쯤 천안시 서북구 성환읍의 한 축사에서 승합차를 후진시키다 차량 뒤에 있던 농장주 B씨(56)를 들이받았다. 차에 깔린 B씨는 심정지 상태로 병원에 이송됐으나 숨졌다. 경찰은 A씨가 불법체류 중인 사실을 확인하고 출입국관리법 위반 혐의로 현행범 체포했다. A씨는 경찰 조사에서 \"당시 뒤에 있는 B씨를 보지 못했다\"는 취지로 진술한 것으로 알려졌다. 경찰은 정확한 사고 경위를 조사하고 있다.","category":"생활·문화"}],"세계":[{"title":"\"모빌리티 美 증시 상장 약속 어겼다\"…TPG, 카카오 상대로 1.5조 규모 국제중재 신청","link":"https://n.news.naver.com/mnews/article/003/0014338654","naverLink":"https://n.news.naver.com/mnews/article/003/0014338654","pubDate":"2026-11-23T11:06:32.509916+09:00","author":"네이버뉴스","description":"\"모빌리티 美 증시 상장 약속 어겼다\"…TPG, 카카오 상대로 1.5조 규모 국제중재 신청. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"젠슨 황 복귀 반대하던 美재무장관 돌변…“엔비디아 복귀 배제 안 해”","link":"https://n.news.naver.com/mnews/article/119/0003158165","naverLink":"https://n.news.naver.com/mnews/article/119/0003158165","pubDate":"2026-11-23T11:06:32.191561+09:00","author":"네이버뉴스","description":"베선트, 외부 CEO 영입 요구서 입장 선회…트럼프와 온도차 좁혀 트럼프는 황 복귀 지지…엔비디아 이사회는 복귀 불가 고수 中반도체 밀수·간첩 의혹 수사 변수…美의회도 진상 규명 요구 스콧 베선트 미국 재무장관이 9월 22일 뉴욕 유엔본부에서 열린 다국적 안보 회의에 참석하고 있다. ⓒAP/뉴시스 [데일리안 = 정인균 기자] 젠슨 황 전 엔비디아 최고경영자(CEO)의 복귀를 반대했던 스콧 베선트 미국 재무장관이 입장을 바꿔 복귀 가능성을 열어뒀다. 도널드 트럼프 미국 대통령이 황 전 CEO를 공개적으로 지지한 이후 행정부 내부에서도 기존 강경론이 누그러지는 모습이다. 파이낸셜타임스(FT)는 23일(현지시간) 베선트 장관이 엔비디아의 차기 CEO를 외부에서 영입해야 한다는 기존 입장에서 물러나 황 전 CEO의 복귀 가능성을 배제하지 않았다고 보도했다. 베선트 장관은 앞서 엔비디아가 경영진을 전면 교체해야 한다며 외부 인사를 차기 CEO로 선임할 것을 요구했다. 중국으로의 첨단 반도체 불법 수출 의혹이 불거진 만큼 기존 경영진의 책임부터 규명해야 한다는 이유에서다. 그러나 트럼프 대통령은 황 전 CEO의 복귀를 지지하며 그가 엔비디아에 필요한 인물이라는 입장을 밝혔다. 미국 정부가 황 전 CEO의 거취를 놓고 서로 다른 목소리를 내자 베선트 장관도 기존 입장을 완화했다. 다만 엔비디아 이사회는 여전히 황 전 CEO의 복귀에 반대하고 있다. 하비 존스 이사회 의장은 지난 17일 실적 발표에서 황 전 CEO의 사임을 만장일치로 수용했으며 복귀시킬 계획이 없다고 밝혔다. 미 의회에서도 반도체 수출통제 위반 의혹과 정부의 대응 과정을 조사해야 한다는 요구가 이어지고 있다. 황 전 CEO의 복귀 문제는 수사 결과와 이사회의 판단에 따라 결정될 전망이다.","category":"세계"},{"title":"나스닥 선물 2.7% 급반등…골드만 \"저가매수 기회지만 위험 여전\"(종합)","link":"https://n.news.naver.com/mnews/article/421/0009304180","naverLink":"https://n.news.naver.com/mnews/article/421/0009304180","pubDate":"2026-11-23T11:06:32.191554+09:00","author":"네이버뉴스","description":"S&P500 선물 1.96%·다우 1.35% 상승…지난주 기술주 폭락 후 반등 시도 골드만 공포지수 9.8까지 치솟아…\"연준 긴축·투매 부족에 추가 하락 위험\" 뉴욕증권거래소 트레이더들 ⓒ AFP=뉴스1 (서울=뉴스1) 신기림 기자 = 미국 뉴욕증시의 주요 주가지수 선물이 지난주 기술주 폭락 이후 일제히 급반등하고 있다. 골드만삭스는 미국 증시가 단기적인 저가매수 기회에 가까워졌다고 평가하면서도 연방준비제도(Fed·연준)의 추가 금리인상과 투자자들의 높은 주식 보유 비중을 경계해야 한다고 경고했다. 22일(현지시간) 오후 7시 16분 기준 나스닥100지수 선물은 전장 대비 671포인트(2.67%) 오른 2만5797.50을 기록했다. 스탠더드앤드푸어스(S&P)500지수 선물은 136.25포인트(1.96%) 상승한 7071.25, 다우존스 산업평균지수 선물은 651포인트(1.35%) 뛴 4만8867.00을 나타냈다. 지난주 뉴욕증시는 인공지능(AI) 투자에 대한 의구심과 엔비디아 관련 악재로 급락했다. S&P500지수는 고점 대비 10% 이상 하락하는 조정장에 진입했고 나스닥100지수는 약세장 기준인 고점 대비 20% 하락에 근접했다. 블룸버그통신에 따르면 골드만삭스 주식 트레이딩 부서는 이날 고객들에게 보낸 보고서에서 헤지펀드의 주식 매도가 상당히 진행돼 시장이 단기적인 매수 진입 시점에 가까워졌다고 평가했다. 골드만삭스가 자체 산출하는 변동성 공포지수는 지난 20일 10점 만점에 9.8까지 치솟아 역사적 극단 수준에 근접했다. 헤지펀드들은 3주 연속 글로벌 주식을 순매도했다. 공매도 규모는 매수 규모의 1.5배에 달했고 미국 개별 종목의 공매도는 주간 기준 2022년 6월 이후 최대를 기록했다. 주식 매수·매도 전략을 병행하는 헤지펀드의 순레버리지는 42.3%로 1년 만에 최저 수준으로 떨어졌다. 골드만삭스 트레이더들은 \"일반적으로 최근과 같은 공황 상황은 위험자산 비중을 늘릴 좋은 기회였다\"면서도 \"이번에는 두 가지 중요한 차이가 있다\"고 지적했다. 첫 번째는 연준의 금리인상 기조다. 골드만삭스는 2018년 4분기 긴축과 투자심리 악화로 미국 증시가 약세장 직전까지 밀렸던 상황을 비교 대상으로 제시했다. 당시 S&P500지수는 10월 급락 이후에도 바닥을 확인하기까지 6.8% 추가 하락했다. 과거 금리인상기에 골드만삭스 공포지수가 9를 넘었던 5차례 사례에서 S&P500의 이후 3개월 평균 상승률은 0.4%에","category":"세계"},{"title":"네타냐후·아이젠코트 연정 협상 또 결렬…이스라엘 정국 안갯속","link":"https://n.news.naver.com/mnews/article/029/0003060546","naverLink":"https://n.news.naver.com/mnews/article/029/0003060546","pubDate":"2026-11-23T11:06:32.191549+09:00","author":"네이버뉴스","description":"4시간 회담에도 총리직 배분·연정 구성 이견 못 좁혀 아이젠코트, 네타냐후 배제한 국가비상정부 대안 제시 네타냐후, 아랍계 정당 배제·주요 안보정책 합의 요구 서안지구 정착민 폭력도 격화…양측 정치적 책임 공방 정부 구성권 쥔 아이젠코트 야사르당 대표. EPA 연합뉴스 자료사진 베냐민 네타냐후 이스라엘 임시 총리와 가디 아이젠코트 야샤르당 대표 간 연립정부 구성 협상이 또다시 결렬됐다. 총리직 배분과 연정 참여 정당을 둘러싼 양측의 이견이 좁혀지지 않으면서 이스라엘의 차기 정부 출범이 불투명해졌다. AFP통신에 따르면 양측 대표단은 22일(현지시간) 텔아비브 인근 호텔에서 4시간 동안 협상을 벌였지만 합의에 실패했다. 지난 15일 첫 회담에 이어 두 번째 협상에서도 접점을 찾지 못했다. 양측은 공동성명에서 주요 현안을 논의하고 후속 협상을 이어가기로 했다고 밝혔으나 구체적인 일정은 공개하지 않았다. 아이젠코트 대표는 지난달 총선 결과에 따라 정부 구성권을 확보했으며 다음 달 6일까지 내각을 구성해야 한다. 필요하면 14일간 기한을 연장할 수 있다. 그가 이끄는 반네타냐후 진영은 총선에서 48석을 확보했지만, 의회 과반인 61석을 얻으려면 추가 세력과의 연대가 필요한 상황이다. 아이젠코트 대표가 검토하는 정부 구성 방안은 초정통파 유대교 정당과의 연대, 네타냐후의 리쿠드당을 포함한 거국내각, 야권 중심의 소수 정부 등 세 가지다. 네타냐후 총리는 아이젠코트 대표와 권력을 분점하는 국민통합정부 구성을 희망하고 있다. 두 사람이 총리직을 교대로 맡는 방안도 거론된다. 네타냐후로서는 부패 혐의와 관련한 정치적 부담을 줄일 수 있다는 계산도 깔려 있다. 그러나 아이젠코트 대표는 선거 기간 네타냐후 총리를 강하게 비판해온 만큼 그의 내각에 참여하는 데 부정적이다. 야권 동맹인 나프탈리 베넷 전 총리도 21일 “어떤 상황에서도 네타냐후나 그의 진영과 연정을 맺지 않겠다”고 선을 그었다. 리쿠드당은 통합정부 참여 조건으로 네타냐후에 대한 인신공격 중단과 아랍계 정당을 배제한 내각 구성을 요구하고 있다. 팔레스타인 국가 수립 반대와 시리아·레바논·가자지구 내 통제 구역 유지 등 안보·외교 정책에 대한 합의도 원한다. 초정통파 유대교도의 병역 의무화 문제에서는 타협 가능성을 열어두고 있다. 아이젠코트 대표는 협상이 계속 난항을 겪을 경우 네타냐후 진영을 제외한 국가비상정부를 구성하겠다는 대안도 제시했다. 야권 정당을 중심으로 소","category":"세계"},{"title":"美주가 급락에도 불확실성 여전...저가 매수자들 타이밍 '주저'","link":"https://n.news.naver.com/mnews/article/374/0000545209","naverLink":"https://n.news.naver.com/mnews/article/374/0000545209","pubDate":"2026-11-23T11:06:32.191548+09:00","author":"네이버뉴스","description":"\"매도세 소진된 것 같지만 반등 떠받칠 촉매 안보여\" [미국 주식 전광판 (사진=연합뉴스)] 지난주 미국 증시 매도세가 대거 나타나면서 지표로 볼 때 주가가 매우 싼 시점이라고 평가되지만, 저가 매수를 노리는 투자자들이 아직 시장 상황을 확신하지 못하고 있다고 블룸버그통신이 22일(현지시간) 분석했습니다. 블룸버그는 시장에 대한 펀더멘털 전망이 달라지지 않은 상태에서 나스닥 지수가 고점 대비 19.8%, 스탠더드앤드푸어스(S&P) 500지수가 12% 떨어졌는데도 전문 자산운용사들 사이에서는 지금이 바닥인지 확신하기 어렵다는 의견이 많다고 지적했습니다. 미국 시장은 추수감사절 연휴로 개장일이 짧은 한 주를 앞두고 있는 가운데, 젠슨 황 엔비디아 전 최고경영자(CEO)가 사생활을 넘어 잘못된 재무적 의사결정을 내린 것은 아닌지, 헤지펀드나 개인 투자자들이 과연 저가 매수에 나설 것인지, 연방준비제도(Fed·연준)가 주요 인사들의 발언대로 향후 금리를 올린 것인지가 주요 관심사 입니다. 라운드힐 인베스트먼트 데이브 마자 CEO는 \"현재 시장은 인플레이션 압력, 12월 금리 인상 가능성, 그리고 2028~2029년 인공지능(AI) 투자 수익에 대한 의구심 등 여러 문제를 동시에 겪고 있다\"면서 \"한주에 이 문제들이 해결될 기미는 보이지 않으며, 시장을 반등시킬 긍정적인 촉매제도 없는 상황이라 투자자들이 확신을 갖고 매수에 나서기는 어렵다\"고 말했습니다. 골드만삭스도 지난주 같은 급락장이 일반적으로 좋은 매수 기회가 될 수 있다고 조언하면서도 최근의 시장은 몇 가지 중요한 차이점이 있다고 지적했는데, 우선, 연준이 금리 인상 사이클에 있고 둘째, 투자자들의 포지션이 복잡하다고 설명했습니다. 골드만삭스 추산에 따르면 최근 한 달간 추세 추종 CTA 펀드를 비롯한 시스템 투자자들은 약 570억 달러 규모 주식을 순매도하면서 이들의 미국 주식 순포지션은 190억 달러 규모의 매도(숏) 포지션으로 전환됐고, 주가가 하락해야 이익을 얻는 구조가 됐습니다. 전 세계적으로는 시스템 투자자들의 매도 압력이 남아있지만 이는 대부분 미국 시장 밖에 해당하는 것으로, 미국 시장에서는 매도압력이 거의 남아있지 않고, 주가가 반등할 경우 CTA 펀드들이 다시 매수세로 돌아설 가능성도 있습니다. 골드만삭스는 고객 보고서에서 \"주식 시장이 바닥을 쳤다고 단정하지는 못해도 변동성이 과도하게 치솟았다는 점은 충분히 설득력 있게 주장할 수 있다\"고 밝","category":"세계"},{"title":"도대체 무슨 맛이길래…美 해군들 푹 빠 ory":"IT 과학"},{"title":"AI 학습 저작물, 어디까지 가능할까…26일 표준계약서 공청회","link":"https://n.news.naver.com/mnews/article/016/0002726859","naverLink":"https://n.news.naver.com/mnews/article/016/0002726859","pubDate":"2026-11-23T11:06:33.023228+09:00","author":"네이버뉴스","description":"AI 학습 저작물, 어디까지 가능할까…26일 표준계약서 공청회. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"SK브로드밴드, 데이터센터의 빈자리 무엇으로 채울까?","link":"https://n.news.naver.com/mnews/article/648/0000052870","naverLink":"https://n.news.naver.com/mnews/article/648/0000052870","pubDate":"2026-11-23T11:06:32.509944+09:00","author":"네이버뉴스","description":"SK브로드밴드, 데이터센터의 빈자리 무엇으로 채울까?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"엔비디아 사태·美 데이터센터 규제에…정부, AI반도체 업계 현안 긴급 점검","link":"https://n.news.naver.com/mnews/article/003/0014338572","naverLink":"https://n.news.naver.com/mnews/article/003/0014338572","pubDate":"2026-11-23T11:06:32.509940+09:00","author":"네이버뉴스","description":"엔비디아 사태·美 데이터센터 규제에…정부, AI반도체 업계 현안 긴급 점검. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"정부, AMD·엔비디아·인텔 불러모았다…AI반도체 공급망 논의","link":"https://n.news.naver.com/mnews/article/014/0005607975","naverLink":"https://n.news.naver.com/mnews/article/014/0005607975","pubDate":"2026-11-23T11:06:32.509938+09:00","author":"네이버뉴스","description":"메모리·기판 수급 불안에 대응 방안 모색 \"빅테크 협력 사업화 지원…업계 간담회 정례화\" 과학기술정보통신부. 뉴스1 [파이낸셜뉴스] 정부가 국내 인공지능(AI) 반도체 기업과 글로벌 빅테크 간 협력 확대를 지원하고 핵심 부품 수급 불안에 대응하기 위한 방안 마련에 나섰다. 최근 글로벌 기업과 국내 AI반도체 업계의 협력이 잇따르는 가운데 메모리와 기판 등 주요 부품의 수급 불안이 사업 확대에 걸림돌로 작용할 수 있다는 우려가 나오고 있어서다. 글로벌 빅테크 협력 확대…공동 실증·사업화 논의 과학기술정보통신부는 23일 서울 스페이스쉐어 서울역2센터에서 국내외 AI반도체 생태계 기업 24개사가 참석한 가운데 '국내 AI반도체 업계 현안 간담회'를 개최했다고 밝혔다. 이번 간담회에는 AMD, 엔비디아, 인텔 등 글로벌 빅테크 한국지사를 비롯해 퓨리오사AI, 리벨리온, 딥엑스 등 신경망처리장치(NPU) 기업과 AI 인프라·소프트웨어·피지컬 AI 분야 기업들이 참석했다. 최근 글로벌 빅테크와 국내 AI반도체 기업 간 협력은 확대되는 추세다. AMD는 퓨리오사AI·망고부스트와 개방형 이기종 AI 인프라 구축을 위한 업무협약(MOU)을 체결했다. 엔비디아는 SK텔레콤·리벨리온과 NVLink Fusion 기반 AI 인프라 구축에 협력하기로 했다. 인텔도 국내 23개 기업과 'K-AI 풀스택 얼라이언스'를 출범시켰다. 이날 참석 기업들은 피지컬 AI와 이기종 AI 인프라, 개방형 표준 및 소프트웨어 분야의 협력 현황을 공유했다. 특히 글로벌 빅테크와의 협력이 실제 사업 성과로 이어질 수 있도록 공동 실증과 사업화 기회를 확대하고 정부 차원의 지원도 강화해야 한다는 의견을 제시했다. 메모리·기판 수급 불안 우려…공급망 협력 필요 핵심 부품·소재의 수급 불안도 주요 현안으로 다뤄졌다. AI 데이터센터 확산으로 고대역폭메모리(HBM)와 저전력 D램(LPDDR), 패키지 기판 등의 수요가 늘면서 부품 확보와 원가 관리에 대한 부담이 커지고 있기 때문이다. 특히 구매 물량이 상대적으로 적은 스타트업과 중소 팹리스는 부품을 안정적으로 확보하는 데 어려움을 겪고 있다. 참석 기업들은 국내 메모리·부품 기업과 AI반도체 기업 간 수요·공급 정보를 공유하고 협력 체계를 강화할 필요가 있다는 데 의견을 모았다. 미국 등 주요국의 AI·데이터센터 정책 변화와 글로벌 빅테크의 투자 전략도 논의됐다. 참석 기업들은 대외 불확실성에 대응하기 위한 정보","category":"IT 과학"},{"title":"“엔비디아·AMD 손잡았지만 메모리 구하기 어렵다”…정부, AI반도체 공급망 점검","link":"https://n.news.naver.com/mnews/article/018/0006413888","naverLink":"https://n.news.naver.com/mnews/article/018/0006413888","pubDate":"2026-11-23T11:06:32.509936+09:00","author":"네이버뉴스","description":"과기정통부, 국내외 AI반도체 기업 24곳과 간담회 엔비디아·AMD·인텔 협력 확대…사업화가 관건 HBM·기판 수급 불안에 중소 팹리스 부담 美 GPU 수출통제 강화·젠슨 황 사임도 변수 [이데일리 김현아 기자] 국내 인공지능(AI) 반도체 기업들이 엔비디아와 AMD, 인텔 등 글로벌 빅테크와 협력을 확대하고 있지만, 메모리와 반도체 기판 등 핵심 부품 확보에는 어려움을 겪고 있다. 미국의 대중(對中) 반도체 수출통제 강화와 젠슨 황 엔비디아 최고경영자(CEO)의 사임까지 겹치면서 대외 불확실성도 커지고 있다. 과학기술정보통신부는 23일 서울 스페이스쉐어 서울역2센터에서 국내외 AI반도체 관련 기업 24곳이 참석한 가운데 ‘국내 AI반도체 업계 현안 간담회’를 개최했다. 이도규 과기정통부 정보통신정책실장이 주재한 간담회에는 글로벌 빅테크 한국지사인 AMD·엔비디아·인텔을 비롯해 국내 신경망처리장치(NPU) 기업인 퓨리오사AI·리벨리온·하이퍼엑셀·딥엑스·모빌린트가 참석했다. 데이터처리장치(DPU)·컴퓨트 익스프레스 링크(CXL) 분야에서는 망고부스트·파네시아·엑시나, AI 최적화 분야에서는 모레AI·노타AI·래블업이 참여한다. AI 모델 기업 업스테이지, 스토리지 기업 파두(440110), AI 인프라 기업 프렌들리AI·디노티시아·KTNF도 자리를 함께했다. 피지컬 AI 분야에서는 리얼월드·엑스와이지·스카이인텔리전스, AI 설계 분야에서는 엔닷라이트·알세미가 참석했다. 생성형AI로 작성 엔비디아·AMD·인텔과 협력 확대…사업화가 과제 최근 국내 AI반도체 기업과 글로벌 빅테크 간 협력은 빠르게 확대되고 있다. AMD는 퓨리오사AI·망고부스트와 서로 다른 종류의 AI 반도체를 연결하는 개방형 인프라 구축을 위한 업무협약(MOU)을 체결했다. 엔비디아는 SK텔레콤·리벨리온과 ‘NVLink Fusion’ 기반 AI 인프라 구축에 협력하기로 했다. 엔비디아의 그래픽처리장치(GPU)와 국산 NPU를 함께 활용하는 방식이다. 인텔도 국내 23개 기업과 ‘K-AI 풀스택 얼라이언스’를 출범시켰다. 중앙처리장치(CPU)와 국산 NPU, 소프트웨어, 서버를 결합해 AI 인프라 시장을 공략한다는 구상이다. 이날 간담회에서는 이러한 협력을 실제 매출과 사업 성과로 연결하는 방안이 논의됐다. 참석 기업들은 공동 실증과 상용화 확대를 위한 기업 간 협력과 정부 지원을 요청했다. 생성형AI로 작성","category":"IT 과학"},{"title":"[주간 클라우드 동향/11월④] 막기 어려운 AI 커닝…클라우드 기반 사후 추적 해법으로","link":"https://n.news.naver.com/mnews/article/138/0002249498","naverLink":"https://n.news.naver.com/mnews/article/138/0002249498","pubDate":"2026-11-23T11:06:32.509935+09:00","author":"네이버뉴스","description":"[디지털데일리 김보민기자] 지난주 국내 기술업계를 관통한 키워드를 꼽아보자면 '인공지능(AI) 부정행위'를 빼놓을 수 없습니다. 정부도 지난 17일 대학수학능력시험(수능)을 앞두고 초소형 카메라와 생성형 AI를 활용한 부정행위에 적극 대응하겠다고 예고했는데요. 수능뿐만 아니라 공무원 및 공공기관 채용, 전문직 및 국가자격, 대학 입시, 어학 등 각종 시험에서 악용될 가능성이 점쳐지면서 이에 기술적으로 대응해야 한다는 목소리가 커졌습니다. 정부는 해외 AI 플랫폼 기업들과 수능 부정행위 사후 조사에 협력할 예정입니다. 초소형 카메라로 시험 문제를 촬영한 뒤 클라우드 기반 AI 서비스로 정답을 확인하는 새로운 유형의 부정행위에 대응하자는 취지입니다. 이와 관련해 배경훈 부총리 겸 과학기술정보통신부 장관은 \"AI를 활용하기 위해서는 이미지를 촬영해야 하고 클라우드로 가 AI를 분석하게 된다\"며 \"통신 기록과 AI 사용 여부를 (확인하는 것과 관련해서도) 글로벌 빅테크사들과 적극 협력하기로 했다\"고 말했습니다. 클라우드 기반 AI 환경 자체가 부정행위에 대한 근거가 될 수 있다는 의미인데요. 현재 정부는 구체적인 후속 조사 진행 상황과 관련해 공식적인 입장을 내놓지 않고 있지만, AI 서비스 이용 기록과 더불어 통신 및 와이파이 접속 기록을 활용할 것으로 추정됩니다. 또한 AI 기업이 보유한 이미지 업로드 자료와 문제풀이 요청 기록을 분석하는 것도 대안으로 거론됩니다. 이 과정에서 적발된 부정행위에 대한 처벌 및 대응 방안에 대해서도 관심이 쏠릴 것으로 보입니다. 국내 정보통신기술(ICT) 업계에서는 더 많은 국가 고시 및 자격 검증 시험에서 AI 부정행위가 악용될 가능성이 높은 만큼 사전 대응 방안도 마련해야 한다고 입을 모읍니다. 전파탐지기 도입 등 추가 대책이 필요하다는 논의도 활발해지고 있는데요. 다만 정부 대책은 응시자가 한 곳에 모이는 '시험장'을 전제로 하고 있어, 클라우드 기업들이 주관하는 기술자격시험 등에는 적용이 어렵다는 한계도 제기됩니다. 응시자 대부분이 집이나 사무실에서 비대면으로 시험을 치를 경우 전파 자체로 대응이 어렵기 때문입니다. 종이 시험지와 PC 화면의 시험지 글씨 자체에 특수 패턴을 넣어 AI 안경 등이 이를 인식하기 어렵도록 하는 조치 또한 이론적인 단계에 머물러 있습니다. 한 보안업계 관계자는 \"사람의 눈과 카메라의 해상력 차이가 크지 않아 미세 패턴을 넣거나 물결무늬 현상을 유도","category":"IT 과학"},{"title":"일론 머스크 \"내년 AI 업계 자금난 심각\"…데이터센터 지연 경고","link":"https://n.news.naver.com/mnews/article/629/0000554392","naverLink":"https://n.news.naver.com/mnews/article/629/0000554392","pubDate":"2026-11-23T11:06:32.509932+09:00","author":"네이버뉴스","description":"가동 지연으로 수천억달러 추가 자금 필요 대규모 연산 자원 가동·냉각 부담도 지적 일론 머스크 테슬라 최고경영자(CEO)가 지나누14일(현지시간) 오후 베이징 인민대회당에서 열린 도널드 트럼프 대통령과 시진핑 중국 국가주석의 국빈 만찬에 참석해 시 주석의 연설을 듣고 있다. /AP.뉴시스 [더팩트｜우지수 기자]일론 머스크 테슬라·스페이스X 최고경영자(CEO)가 내년 인공지능(AI) 업계에 심각한 자금난이 발생할 수 있다고 경고했다. 데이터센터 가동이 지연되면서 막대한 투자 비용을 회수하지 못하는 기업들이 늘어날 수 있다는 우려다. 22일(현지시간) 야후파이낸스에 따르면 머스크는 전날 소셜미디어 엑스(X·옛 트위터)에서 AI 반도체 기업들의 주가 수준을 다룬 게시물에 \"내년에는 현금 부족 사태도 엄청날 것\"이라는 답글을 남겼다. 머스크는 데이터센터 가동 지연으로 AI 기업들에 수천억달러의 추가 운전자본이 필요할 수 있다고 지적했다. 그는 \"그 돈은 어디서 나올 것인가\"라며 자금 조달 문제를 제기했다. 이어 \"이 정도 규모의 연산 자원을 실제로 가동하고 냉각하며 안정적으로 운영하는 것은 믿기 어려울 정도로 어려운 일\"이라고 설명했다. AI 기업들은 연산 자원 확보와 데이터센터 확충에 막대한 자금을 투입하고 있다. 그러나 지역 주민들의 반발과 공사 지연 등으로 데이터센터 가동 일정에 차질이 발생하고 있다. 시설 운영이 늦어질수록 투자 비용을 회수하는 시점도 밀릴 수 있다는 분석이다. AI 투자 과열에 대한 우려는 글로벌 증시로도 확산하고 있다. 지난 20일 미국 스탠더드앤드푸어스(S&P)500지수와 다우존스30산업평균지수는 최근 고점 대비 10% 이상 하락하며 조정 국면에 진입했다. 발로 뛰는 더팩트는 24시간 여러분의 제보를 기다립니다. ▶카카오톡: '더팩트제보' 검색 ▶이메일: jebo@tf.co.kr ▶뉴스 홈페이지: http://talk.tf.co.kr/bbs/report/write","category":"IT 과학"},{"title":"화석연료 감축 합의 끝내 무산…COP31, 17년 만의 결렬[과학을읽다]","link":"https://n.news.naver.com/mnews/article/277/0005846197","naverLink":"https://n.news.naver.com/mnews/article/277/0005846197","pubDate":"2026-11-23T11:06:32.509918+09:00","author":"네이버뉴스","description":"산유국 반대에 감축 문구 삭제…EU·도서국 등 최종안 거부 기후적응 재원도 이견…과학계 \"1.5도 초과, 돌이킬 수 없는 변화\" 국제사회가 화석연료 감축과 기후재원 확대를 둘러싼 갈등을 끝내 해소하지 못하면서 제31차 유엔기후변화협약 당사국총회(COP31)가 핵심 합의문 채택에 실패했다. 2009년 덴마크 코펜하겐에서 열린 COP15 이후 17년 만에 포괄적인 정치적 합의 없이 막을 내린 것이다. 기후과학자들은 지구 평균기온 상승폭이 산업화 이전보다 1.5도를 넘어설 가능성이 커지는 상황에서 온실가스 감축 지연이 돌이킬 수 없는 기후변화를 초래할 수 있다고 경고했다. 튀르키예 안탈리아에서 열린 제31차 유엔기후변화협약 당사국총회(COP31) 전체회의 모습. 대형 화면에 무라트 쿠룸 COP31 의장이 발언하는 모습이 비치고 있다. 이번 총회는 화석연료 감축과 기후재원 확대를 둘러싼 이견으로 핵심 합의문 채택에 실패했다. 유엔기후변화협약(UNFCCC) 제공 23일 로이터통신과 AP통신 등 외신에 따르면 지난 9일 튀르키예 안탈리아에서 개막한 COP31은 당초 폐막 예정일인 20일을 이틀 넘긴 22일(현지시간)까지 협상을 이어갔지만 핵심 합의문인 '안탈리아 협약(Antalya Pact)'을 채택하지 못했다. 190여개국이 참여한 협상에서 화석연료 전환과 개발도상국 기후재원 지원 등을 둘러싼 이견을 좁히지 못한 결과다. 화석연료 감축 문구 삭제…산유국·EU 정면충돌 이번 총회의 최대 쟁점은 화석연료 감축이었다. 2023년 아랍에미리트(UAE) 두바이에서 열린 COP28에서는 화석연료로부터의 전환을 촉구하는 합의가 이뤄졌다. 그러나 이번 COP31에서는 사우디아라비아와 러시아 등 주요 산유국들이 화석연료 관련 표현에 반대하면서 최종 합의문 초안에서 관련 문구가 삭제됐다. 이에 유럽연합(EU)과 영국, 일부 군소도서국 및 개발도상국들이 반발했다. EU를 대표한 대러 오브라이언 아일랜드 기후·에너지·환경부 장관은 \"기후변화의 핵심 원인인 화석연료조차 언급하지 않는 포괄적인 결정문이나 안탈리아 협약을 지지하지 않겠다\"고 밝혔다. 외신에 따르면 약 40개국이 최종안에 반대하거나 수용 거부 의사를 표시했다. 무라트 쿠룸 COP31 의장 겸 튀르키예 환경·도시화·기후변화부 장관은 폐막 전체회의에서 \"이 회의장에 합의문에 반대하는 당사국들이 있다는 점이 분명하다\"며 \"이 문서에 대한 합의가 없다는 점을 인정한다. 따라서 해당 결정들","category":"IT 과학"},{"title":"오픈AI·구글 매주 진화하는데 애플 1년단위 고집…'예산 삭감·전산 대란'까지 AI 에이전트 패배론","link":"https://n.news.naver.com/mnews/article/138/0002249506","naverLink":"https://n.news.naver.com/mnews/article/138/0002249506","pubDate":"2026-11-23T11:06:32.509909+09:00","author":"네이버뉴스","description":"[MOVIEW] 존 터너스호 애플, 소프트웨어 전략의 구조적 한계 애플 시리 AI 한국어 지원 [사진=김문기 기자] [디지털데일리 김문기 기자] 하드웨어와 운영체제(OS)의 긴밀한 결합을 앞세워 견고한 '생태계 잠금(Lock-in)' 효과를 구축해 온 애플이 차세대 컴퓨팅 패권인 '인공지능(AI) 에이전트' 경쟁에서 구조적 한계에 직면했다. 연 단위로 제품 기획과 소프트웨어 출시 일정을 고정하는 기존 개발 공식이 매주 새로운 AI 모델과 자율 실행 기능을 쏟아내는 빅테크 경쟁사들의 속도를 따라잡지 못하는 가운데, 존 터너스 신임 최고경영자(CEO) 취임 이후 단행된 사내 AI 예산 삭감과 내부 업데이트 전산 대란까지 맞물리며 소프트웨어 조직 전반의 운영 역량이 의심된다. ◆ A부터 G까지 1년 전 확정되는 개발 캘린더…AI 시대엔 '족쇄'로 전락 23일(현지시간) 블룸버그통신은 애플이 막대한 자금력과 하드웨어 지배력을 보유하고도 구시대적 개발 방식 탓에 AI 에이전트 전쟁에서 패배할 심각한 위험에 처해 있다고 진단했다. 애플 소프트웨어 조직은 'A부터 G'까지 알파벳으로 구분되는 내부 릴리스 캘린더에 따라 움직이는 것으로 알려졌다. 매년 가을 선보일 차기 주요 OS의 기능과 로드맵을 전년도 늦여름이나 초가을에 확정 짓고, 이후 약 12개월간 정해진 공정만 이행하는 구조다. 과거 하드웨어 중심 시대에는 정밀한 사양 통제와 수직 계열화를 가능케 한 성공 방정식이었지만, 오픈AI와 앤트로픽, 구글, 메타가 매주 수차례 신규 AI 모델을 배포하는 현재의 기술 격변기에는 치명적인 족쇄로 작용하고 있다. 기술 완성도의 격차는 현장에서 그대로 드러난다. 오픈AI의 '닷츠(Dots)', 메타의 '뮤즈(Muse)', xAI의 '그록 봇(Grok Bot)' 등은 사용자의 지속적인 명령 없이도 백그라운드에서 이메일, 일정, 금융, 쇼핑 등 수천 개 외부 서비스를 넘나들며 자율적으로 과업을 완수한다. 반면 애플이 지난 9월 핵심 기능으로 내세운 시리(Siri) AI의 '화면 인식'은 여전히 메시지 대화창 속 지도 링크와 약속 시간조차 제대로 읽지 못할 만큼 맥락 파악이 불안정하다. 문제는 소비자들이 개별 앱 대신 AI 에이전트를 주력 인터페이스로 활용하기 시작하면서 애플 최대 수익원인 앱스토어 중심의 생태계 지배력이 약화되고 있다는 점이다. 애플은 최근 웹 브라우징과 앱 제어, 코딩까지 수행하는 범용 '컴퓨터 유즈(Computer-","category":"IT 과학"}]},"popular":[{"title":"환불 요구 쏟아지던 리트 만점자 책…중고가 20만원까지 등장","link":"https://n.news.naver.com/article/015/0005356869?ntype=RANKING","pubDate":"2026-11-23T11:06:35.591890+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기 00","author":"네이버뉴스","description":"출동하는 소방차. 경남 사천시의 한 고속도로를 달리던 승용차에서 불이 났다. 22일 소방당국에 따르면 이날 오후 9시50분쯤 사천시 통영대전고속도로 대전 방향 금곡 졸음쉼터 인근을 달리던 승용차에서 불이 났다. 불은 출동한 소방당국에 의해 약 35분 만에 꺼졌다. 이 화재로 승용차가 모두 탔으나 인명피해는 발생하지 않았다. 운전자는 주행 중 차량 보닛에서 불이 나자 차를 세우고 119에 신고한 것으로 전해졌다. 경찰과 소방당국은 정확한 화재 원인을 조사하고 있다.","category":"사건 사고"},{"title":"사천 통영대전고속도로 달리던 승용차서 불…인명피해 없어","link":"https://n.news.naver.com/mnews/article/001/0016457008","naverLink":"https://n.news.naver.com/mnews/article/001/0016457008","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"차량 화재 현장 [독자 제공. 재판매 및 DB 금지] (사천=연합뉴스) 이준영 기자 = 22일 오후 9시 50분께 경남 사천시 통영대전고속도로 대전 방향 금곡 졸음쉼터 인근을 달리던 승용차에서 불이 나 약 35분 만에 꺼졌다. 이 화재로 승용차가 전소했으며 인명 피해는 발생하지 않았다. 당시 운전자는 주행 중 차량 보닛에서 불이 나자 차를 세우고 소방당국에 신고했다. 신고를 받고 출동한 소방당국은 이날 오후 10시 25분께 불을 모두 진화했다. 경찰과 소방당국은 정확한 화재 원인을 조사할 계획이다. ljy@yna.co.kr","category":"사건 사고"},{"title":"창원 아파트서 엄마 숨지고 생후 5개월 딸 생존…추락 당시 아기 보호했나","link":"https://n.news.naver.com/mnews/article/088/0001041665","naverLink":"https://n.news.naver.com/mnews/article/088/0001041665","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"40대 여성 심정지 상태로 발견돼 끝내 사망…아기는 머리에 혹 외 큰 부상 없어 경찰·소방 \"추락 과정서 아기 보호했을 가능성\"…정확한 사건 경위 조사 경찰 이미지. 매일신문DB 경남 창원의 한 아파트에서 40대 여성이 생후 5개월 된 딸과 함께 추락해 숨지는 사고가 발생했다. 다행히 아기는 큰 부상 없이 목숨을 건진 것으로 알려졌다. 22일 경찰과 소방 등에 따르면 지난 20일 오전 9시 23분쯤 창원시의 한 아파트 단지에서 40대 여성 A씨와 생후 5개월 된 딸 B양이 쓰러져 있는 것을 주민이 발견해 소방 당국에 신고했다. ◆어머니는 숨지고 아기는 생존…발견 당시 울고 있어 신고를 받고 출동한 소방 당국이 현장에 도착했을 당시 A씨는 이미 심정지 상태였다. 반면 B양은 머리 부위에 혹이 생긴 것을 제외하면 별다른 외상 없이 울고 있었던 것으로 전해졌다. 소방 당국은 두 사람을 병원으로 이송했으나 A씨는 끝내 숨졌다. B양은 생명에 지장이 없는 상태인 것으로 알려졌다. ◆추락 과정서 아기 보호했을 가능성…경찰 조사 중 경찰과 소방 당국은 A씨가 추락하는 과정에서 아기를 보호해 B양의 부상 정도가 크지 않았을 가능성을 보고 있다. 다만 두 사람이 어떤 경위로 추락했는지, 추락 당시 정확한 상황이 어떠했는지는 아직 확인되지 않았다. 경찰은 사고 발생 경위와 사망 원인 등을 조사하고 있다. ※ 우울감 등 말하기 어려운 고민이 있거나 주변에 이런 어려움을 겪는 가족·지인이 있을 경우 자살예방상담전화 ☎109 또는 청소년상담전화 ☎1388에서 24시간 전문가의 상담을 받을 수 있습니다.","category":"사건 사고"},{"title":"수능·리트 ‘AI 커닝’에 다 뚫렸나… 당사자 사망에 진상 규명 ‘산 넘어 산’","link":"https://n.news.naver.com/mnews/article/005/0001886711","naverLink":"https://n.news.naver.com/mnews/article/005/0001886711","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"경찰 압수수색 등 강제수사 어려워져 시험지 분석만으로 공범 특정 힘들어 인공지능(AI) 커닝이 사회적 문제로 떠오른 가운데 지난 16일 한국도로교통공단 대구 운전면허시험장 학과시험장에서 시험관 등 관계자가 AI 안경에 대한 전파탐지기 시연을 하고 있다. 연합뉴스 올해 법학적성시험(LEET·리트) 만점자 이진우씨가 사망하면서 생성형 인공지능(AI)을 활용한 부정행위 의혹이 더 짙어졌지만 진상 규명 작업은 ‘산 넘어 산’이 될 것으로 보인다. 이씨는 올해 리트뿐 아니라 2024학년도 대학수학능력시험과 2026학년도 수능에서도 부정행위를 저질렀다는 의혹을 받았다. 하지만 그가 숨지면서 본인의 진술 확보는 물론 사용하던 물품 등에 대한 압수수색 등 강제 수사도 어려워졌다. 서울경찰청 광역수사단 금융범죄수사대는 22일 이씨에 대한 공무집행방해와 업무방해, 사기 등 고발 사건에 대한 수사를 이어가고 있다. 이씨의 리트 시험지는 법학전문대학원협의회가 보관하지 않는 것으로 파악됐지만 수사팀은 정부가 보존 조치한 2026학년도 수능 시험지 분석 등 다양한 방법을 검토하고 있다. 다만 수능 시험지 분석만으로는 공범 존재 여부 등 부정행위 의혹을 규명하는 데 한계가 있다. 노트북, 스마트폰 등 이씨가 사용한 물품 확보가 불가피하지만 그가 숨지면서 압수수색영장 발부부터 녹록지 않을 것으로 보인다. 유족을 통한 임의제출 가능성은 남아 있으나 유족이 협조할지는 불투명하다. 서정빈 법무법인 소울 변호사는 “공범이 특정돼야 (이씨의 물품에 대한) 압수수색영장이 나올 것으로 보인다”고 말했다. 챗GPT 등 생성형 AI 운영사에 이씨의 접속·이용 기록을 협조받는 방안도 거론된다. 앞서 정부는 글로벌 빅테크 기업과 공조해 AI 부정행위가 의심되는 수능 응시자의 AI 활용 기록을 파악하겠다고 공언했다. 이씨가 2024학년도 수능에서 부정행위를 했을 경우 공범 존재 가능성이 크다는 관측이 나온다. 당시에는 챗GPT가 출시된 지 약 1년이 지났을 무렵으로 생성형 AI의 수능 문제풀이 능력이 지금보다 크게 떨어졌기 때문이다. 이씨는 올해 리트 언어이해·추리논증 70문항을 모두 맞혔다. 2026학년도 수능에서는 전체 과목 중 생명과학2에서만 1문제 틀리며 전 과목 1등급을 받았다. 이 성적을 바탕으로 올해 서울대 치의학과에 입학했다. 3년 전 치러진 2024학년도 수능에서는 국어 2등급, 수학 1등급, 영어 1등급을 받아 이듬해 고려대 정치외교학과에 합","category":"사건 사고"},{"title":"[속보]아파트서 엄마와 5개월 아기 추락…안고있던 아기만 무사","link":"https://n.news.naver.com/mnews/article/021/0002834600","naverLink":"https://n.news.naver.com/mnews/article/021/0002834600","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"경찰차. 연합뉴스 자료사진 경남 창원시의 한 아파트에서 40대 여성이 아기와 함께 떨어져 숨졌다. 이 여성이 안고 있던 아기는 목숨을 건졌다. 22일 경찰 등에 따르면 지난 20일 오전 9시 23분쯤 창원시 한 아파트 단지에서 40대 여성 A씨와 생후 5개월 된 B양이 쓰러져 있는 것을 주민이 발견해 소방 당국에 신고했다. 소방 당국이 현장에 도착했을 당시 A씨는 심정지 상태였으며, B양은 머리 부위에 혹이 생긴 것을 제외하면 큰 부상 없이 울고 있었다. 소방 당국은 두 사람을 병원으로 옮겼다. A씨는 결국 숨지고 B양은 생명에 지장이 없는 상태인 것으로 알려졌다. 경찰과 소방 당국은 A씨가 떨어지면서 아기를 보호해 B양 부상 정도가 크지 않은 것으로 보고 있다. 경찰은 정확한 사건 경위를 조사하고 있다. ※ 우울감 등 말하기 어려운 고민이 있거나 주변에 이런 어려움을 겪는 가족ㆍ지인이 있을 경우 자살 예방 상담 전화 ☎109 또는 자살 예방 SNS 상담 “마들랜” (www.129.go.kr/etc/madlan)에서 24시간 전문가의 상담을 받을 수 있습니다.","category":"사건 사고"},{"title":"서울 목동 아파트 정전…엘리베이터에 주민 갇혀 구조, 전력 재개","link":"https://n.news.naver.com/mnews/article/021/0002834599","naverLink":"https://n.news.naver.com/mnews/article/021/0002834599","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"뉴시스 서울 양천구 목동6단지 아파트 전체가 정전돼 승강기에 갇힌 주민 1명이 구조됐고, 전력 공급은 20분이 채 안 돼 재개됐다. 22일 소방당국에 따르면 이날 오후 5시56분쯤 목동6단지 아파트 전체에 정전이 발생했다는 119신고가 접수됐다. 소방당국은 차량 7대와 인력 30명을 현장에 투입했다. 이번 정전으로 아파트 15개 동 전체의 전기 공급이 중단됐다. 승강기 운행이 중단되면서 내부에 갇힌 주민 1명이 소방당국에 구조됐다. 나머지 주민들은 전력 공급이 재개된 뒤 승강기에서 빠져나온 것으로 전해졌다. 아파트 전체의 전력 공급은 신고 접수 16분 뒤인 오후 6시12분께 정상화됐다.","category":"사건 사고"},{"title":"10km 완주 직후 쓰러진 19세…서울 이어 목포서도 사망","link":"https://n.news.naver.com/mnews/article/018/0006413809","naverLink":"https://n.news.naver.com/mnews/article/018/0006413809","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"의협, 대회 안전관리계획에 응급의료 대비 방안 명시 요구 [이데일리 김민정 기자] 목포에서 열린 마라톤대회에 참가한 19세 대학생이 10km 코스를 완주한 직후 쓰러져 숨졌다. 22일 목포경찰서 등에 따르면 이날 오전 11시 30분께 ‘2026 김대중마라톤대회’가 열린 목포종합경기장에서 대학생 A(19)씨가 쓰러졌다. A씨는 대회 구급대에 의해 인근 병원으로 옮겨졌으나 숨졌다. (사진=연합뉴스) A씨는 목포종합경기장을 출발해 도심과 해안 구간을 달린 뒤 경기장으로 돌아왔다. 결승선을 통과한 직후 갑자기 경련 증세를 보인 것으로 전해졌다. 평소 특별한 지병은 없었던 것으로 알려졌다. 경찰은 정확한 사망 경위를 조사할 방침이다. 지난달에는 서울에서 하프마라톤에 나선 20대 여성이 결승선을 약 500m 앞두고 쓰러져 숨졌다. 이 여성은 지난달 11일 서울시와 동아일보가 공동 주최한 ‘2026 서울달리기(서울레이스)’에 참가해 서울 종로구 관철동 인근 20.6km 지점까지 달렸다. 쓰러진 뒤 현장에서 응급처치를 받고 119구급차로 병원에 옮겨졌으나 의식을 회복하지 못하고 이튿날 숨졌다. 서울 대회 사고 이후 대한의사협회는 달리기 대회의 응급의료 대비를 강화해야 한다고 정부에 촉구했다. 의협에 따르면 국내 마라톤 대회는 2020년 19회에서 2024년 254회로 늘었다. 의협은 지난달 15일 브리핑에서 대규모 체육행사의 안전관리를 강화하는 내용의 국민체육진흥법 개정에 맞춰, 달리기 대회 안전관리계획에 의료진 배치와 자동심장충격기(AED) 확보 방안을 담도록 하위법령에 명시해 달라고 요구했다. 의협은 운동 중 가슴 통증이나 실신을 경험한 적이 있다면 대회 참가 전 의사와 상담할 것을 권고했다. 경기 중 가슴 통증이나 심한 어지럼, 호흡곤란이 나타나면 즉시 달리기를 멈추고 도움을 요청해야 한다고 당부했다. 주변에서 쓰러진 사람을 발견하면 곧바로 119에 신고하고, 반응이 없고 정상적으로 숨을 쉬지 않으면 가슴압박을 시작하고 가까운 곳의 자동심장충격기를 활용하라고 안내했다.","category":"사건 사고"},{"title":"마라톤대회 참가한 19세 대학생 사망…10km 코스 완주 직후 쓰러져","link":"https://n.news.naver.com/mnews/article/082/0001408414","naverLink":"https://n.news.naver.com/mnews/article/082/0001408414","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"일러스트 이지민 에디터 mingmini@busan.com 전남광주 목포에서 열린 마라톤대회에서 19세 대학생이 10㎞ 코스를 완주한 직후 쓰러져 숨지는 사고가 발생했다. 22일 목포MBC 등 전남지역 언론들에 따르면 이날 오전 11시 30분께 '2026 김대중마라톤대회'에 참가한 A(19) 씨가 목포종합경기장에서 마지막 결승선을 통과한 직후 쓰러졌다. 당시 현장 의료진이 심폐소생술 등 응급처치를 한 뒤 대회장소에 대기 중이던 구급차로 병원으로 이송했지만 끝내 숨졌다. A 씨는 10㎞ 코스에 참가해 경기장을 출발한 뒤 도심과 해안 구간을 달려 돌아온 것으로 전해졌다. 경찰은 정확한 사망 경위를 조사할 방침이다.","category":"사건 사고"},{"title":"19세 대학생, '김대중마라톤대회' 완주 직후 사망…한 달 전 서울선 20대 여성 러너 숨져","link":"https://n.news.naver.com/mnews/article/088/0001041664","naverLink":"https://n.news.naver.com/mnews/article/088/0001041664","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"목포서 10km 완주 뒤 경련 증세…10월 서울레이스에선 하프마라톤 결승선 500m 앞두고 쓰러져 목포종합경기장. 자료사진. 연합뉴스 마라톤대회에 참가한 젊은 연령대의 사망 사고가 잇따르고 있다. 지난달 서울에서 열린 대회에서 20대 여성 참가자가 결승선을 불과 500m가량 앞두고 쓰러져 숨진 데 이어, 이번에는 전남광주통합특별시 목포에서 열린 마라톤대회에서 19세 남성 참가자가 완주 직후 숨졌다. 특히 두 참가자 모두 10~20대의 젊은 연령대였고, 결승선을 통과했거나 거의 도착한 시점에 사고가 발생했다는 공통점이 있다. ◆목포서 10km 완주한 19세 대학생 숨져 22일 목포경찰 등에 따르면 이날 오전 11시 30분쯤 목포종합경기장에서 열린 '2026 김대중마라톤대회'에 참가한 A씨(19)가 갑자기 쓰러졌다. A씨는 목포종합경기장을 출발해 시내 주요 도심과 해안 구간을 달린 뒤 경기장으로 돌아오는 10㎞ 코스를 완주한 것으로 알려졌다. 그러나 결승선을 통과한 직후 갑작스러운 경련 증세를 보였고, 대회 자체 구급대에 의해 인근 병원으로 옮겨졌으나 끝내 숨졌다. 대학생인 A씨는 평소 특별한 지병이 없었던 것으로 전해졌다. 경찰은 정확한 사망 원인과 사고 경위를 조사하고 있다. 이날 대회는 하프마라톤과 10km, 5km 등으로 나뉘어 진행됐다. 주최 측은 참가자와 방문객 등 1만여 명이 목포를 찾을 것으로 예상했다. ◆한 달 전 서울에선 20대 여성 러너 사망…결승선 500m 앞두고 지난 10월 11일 서울 도심에서 열린 '2026 서울달리기(서울레이스)' 마라톤대회에서도 20대 여성 참가자가 쓰러져 숨졌다. 당시 하프마라톤에 참가한 여성 B씨는 오전 8시 49분쯤 서울 종로구 관철동 인근 20.6km 지점에서 의식을 잃고 쓰러졌다. 결승선까지 약 500m를 남겨둔 상황이었다. 대회 관계자가 즉시 119에 신고하고 심폐소생술(CPR)을 실시했으며, B씨는 병원으로 이송돼 치료받았지만 다음 날인 12일 숨졌다. B씨는 한국과학기술원(KAIST) 대학원생으로, 지난 2월 열린 다른 마라톤대회에서 여자부 1위를 차지한 경력이 있는 실력자로 알려졌다. 평소 달리기 경험이 풍부했던 참가자도 대회 도중 갑작스럽게 쓰러진 것이다. 당시 서울레이스 조직위원회는 공식 홈페이지를 통해 사망 소식을 알리고 유가족에게 애도의 뜻을 전했다. 사고 원인과 관련한 후속 조치도 진행하겠다고 밝혔다. ◆젊고 건강해도 발생하는 응급상황…완주 직","category":"사건 사고"},{"title":"경찰, 권순기 경남교육감 '매수 및 이해유도 혐의' 불송치","link":"https://n.news.naver.com/mnews/article/003/0014338415","naverLink":"https://n.news.naver.com/mnews/article/003/0014338415","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"*재판매 및 DB 금지 [창원=뉴시스] 김기진 기자 = 경남경찰이 지난 6·3 지방선거때 치러진 경남교육감 선거 과정에서 자신에 대한 지지를 전제로 한 방과후 학습 단체의 요구사항을 들어주기로 했다는 의혹으로 고발된 권순기 경남도교육감에 대해 불송치를 결정했다. 22일 뉴시스 취재를 종합하면 경남 창원중부경찰서는 공직선거법상 매수 및 이해유도 혐의로 고발된 권 교육감에 대해 최근 불송치 결정을 한 것으로 알려졌다. 경찰은 이달 초 권 교육감 측근 등을 소환해 수사한 결과 권 교육감이 직접적으로 관여한 사실을 발견할 수 없었던 것으로 전해졌다. 앞서 한 방과후 학교 관련 단체는 권 교육감이 지난 6월 교육감 선거 과정에서 자신들이 권 교육감을 지지하는 것을 전제로 자신들의 요구사항을 들어주기로 했었다는 주장을 하며 관련 사실을 기초로 경찰에 고발장을 제출했었다. 해당 고발장에는 이 단체 소속의 방과후 교사들 연락처 다수를 담은 임시저장장치(USB)를 당시 권 후보 측 관계자에게 전달했다는 내용 등이 담긴 것으로 전해졌다.","category":"사건 사고"}],"사회":[{"title":"당 내홍 덧낸 ‘김민석 100일’…민생도 확장도 갈길 멀어","link":"https://n.news.naver.com/mnews/article/028/0002833406","naverLink":"https://n.news.naver.com/mnews/article/028/0002833406","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"민주당 새 대표체제 초라한 성적표 지지율 10%p 상승커녕 5%p 하락 조희대 탄핵 또 리더십 시험대 김민석 더불어민주당 대표가 지난 21일 서울 마포구 ‘더블루’에서 열린 창당 71주년 기념 ‘1030 청년 연설대전’에서 축사를 하고 있다. 연합뉴스 김민석 더불어민주당 대표가 어수선한 분위기 속에서 오는 24일 취임 100일을 맞게 됐다. 전당대회를 계기로 본격화한 친명(이재명)계와 친청(정청래)계 간 대립은 연일 확전 양상이고, ‘취임 100일 내 당 지지율 10%포인트 상승’ 공약은 무색해진 상황이다. 김 대표 앞에 당 내홍을 수습하고 민생 동력을 되살려야 하는 과제가 놓여 있다는 평가가 나온다. 22일 한국갤럽이 지난 20일 발표한 여론조사 결과(17~19일 조사)를 보면, 민주당 지지율은 36%로 국민의힘(28%)과 한자릿수 격차(8%포인트)로 나타났다. 김 대표 취임 직전 갤럽 조사(8월11~13일, 41%)에 견줘 5%포인트 낮다.(자세한 내용은 중앙선거여론조사심의위원회 누리집 참조) 당 지지율 10%포인트 상승 공약과 “민주당을 바꾸겠다. 언어도, 정책도, 태도도, 문화도 진화할 것”(8월17일 당대표 수락 연설)이란 공언에 견줘 초라한 성적표다. 김 대표는 취임과 동시에 민생·확장·유능을 뜻하는 ‘에이비시(ABC) 플랜’을 발표했고, 중도를 끌어안는 ‘구조적 다수’의 길을 방향성으로 제시했다. 또 취임 뒤 당 유튜브 채널을 ‘민주당티비’로 개편하고 아침 7시에 출연하는 ‘직접 소통’ 승부수를 띄웠다. 당내에 수십개의 태스크포스(TF)를 꾸려 ‘일하는 여당’의 모습을 부각했다. 한 초선 의원은 “당-청 관계의 엇박자를 줄이고 안정적으로 유지했다는 건 큰 성과”라고 짚었다. 한 지도부 의원은 “모두가 역할을 맡고 정신없이 자기 일을 하며 성과를 쌓아가다 보면 당내 갈등도 자연히 잦아들 거란 게 김 대표 생각이었다”고 전했다. 하지만 당내 반목을 매듭짓지 못하며 김 대표 스스로 논란을 자초했다는 지적이 잇따른다. 김지용 중대범죄수사청장 인선 등을 둘러싸고 파열음이 커졌고, 이른바 ‘신천지 개입설’로 정점을 찍었다. 전당대회 과정에서 신천지 개입설을 주장했던 김 대표는 지난 3일 “조사 결과, 3자(반명·분열주의·신천지) 비밀연합의 증거는 없었다”고 사과했지만 당내 공방은 사그라들지 않고 있다. ‘이재명 대통령이 과거 윤석열 전 대통령 탄핵에 반대했다’는 발언으로 최민희 최고위원의 징계 절차가 시작되자","category":"사회"},{"title":"동네 단신은 AI가, 현장 취재는 기자가...LG헬로비전 지역뉴스 개편","link":"https://n.news.naver.com/mnews/article/092/0002446394","naverLink":"https://n.news.naver.com/mnews/article/092/0002446394","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"전국 CCTV 8000여 곳 재난특보에 연동 LG헬로비전이 AI를 활용해 지역채널의 동네 소식과 생활 정보를 늘린다. AI가 지방자치단체 보도자료를 바탕으로 단신 영상을 만들면 제작진이 검수하고, 취재 기자는 주민 제보를 토대로 생활 불편과 행정 사각지대를 살핀다. LG헬로비전은 23일 지자체와 경찰청, 국토교통부, 국립공원공단 등이 공개하는 데이터를 AI로 수집·분석해 지역뉴스 제작에 활용한다고 밝혔다. 이를 통해 시군구 단위 생활 소식을 보강하고, 산불이나 태풍이 발생하면 전국 8000여 곳의 CCTV 화면을 재난특보에 활용할 계획이다. 지역 단신 코너 ‘우리동네NOW’에서는 AI가 지자체 보도자료 등에서 지역 소식을 모아 음성으로 바꾸고, 내용에 맞는 사진과 영상을 찾아 붙인다. 제작진은 이렇게 만든 영상을 검수한 뒤 수시로 내보낸다. 기존 뉴스에서 일일이 챙기기 어려웠던 작은 마을의 소식도 다룰 수 있도록 제작 방식을 바꿨다. LG헬로비전 헬로tv뉴스 우리동네NOW스틸컷 주말에 갈 만한 축제와 지역 명소를 소개하는 ‘축제NOW 여기어때’, 지역 이슈를 짧은 영상으로 전하는 ‘숏픽NOW’, 기상 정보와 생활 정보를 함께 전하는 ‘날씨와 생활’도 선보인다. 생활 정보 콘텐츠는 문화와 행사, 인구 등으로 넓힐 예정이다. 현장 기자는 주민 제보를 받아 생활 속 불편과 행정 서비스가 미치지 못하는 곳을 취재한다. 지방소멸 위기에 대응하는 지역의 움직임을 연속보도로 다루고, 지역 현안에 대한 기획보도도 강화한다. ‘미니인터뷰’와 ‘지역이 묻고 국회가 답한다’에서는 주민과 지자체 관계자, 국회의원을 직접 만나 이야기를 듣는다. 재난 보도에는 AI가 수집하고 정리한 공공데이터를 활용한다. 전국 8000여 곳의 CCTV 화면을 실시간으로 연동해 산불이나 태풍이 발생하면 현장 영상을 특보에 곧바로 띄우고, 재난 발생 후 특보가 나가기까지 걸리는 시간을 줄인다는 계획이다. 심지훈 LG헬로비전 보도국장은 “글로벌 OTT와 유튜브의 영향력이 커지는 환경 속에서, AI 기술과 기자의 현장 전문성을 결합해 지역사회를 촘촘히 연결하는 시도는 케이블TV 지역채널만이 할 수 있는 차별화된 영역”이라고 말했다. 이어 “일상의 작은 소식부터 재난 안전 정보, 그리고 지역 현안에 대한 해법 제시까지 꼼꼼히 담아내고, 구성원 한 명 한 명이 지역 정보를 수집·정리·가공해 전달하는 ‘로컬 정보 큐레이터’로서 지역민의 곁을 든든하게 지키는 진정한","category":"사회"},{"title":"영월엔 한반도 빵, 울산엔 미역귀 디저트…지역의 맛과 멋 한자리에","link":"https://n.news.naver.com/mnews/article/421/0009304047","naverLink":"https://n.news.naver.com/mnews/article/421/0009304047","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"관광공사, 25일부터 사흘간 킨텍스서 관광두레 전시 지역 주민사업체 27곳 참여…시식·공예 체험도 강원 영월의 영월청년들이 만든 영월 한반도 빵(한국관광공사 제공) (서울=뉴스1) 윤슬빈 관광전문기자 = 지역 주민들이 만든 영월 한반도 빵과 미역귀 디저트, 도자기 장식품을 오는 25~27일 경기 고양시 킨텍스에서 만날 수 있다. 23일 한국관광공사에 따르면 공사는 킨텍스 제1전시장 1홀에서 3일간 진행하는 '2026 대한민국 정부혁신 박람회'에 참가한다. 행정안전부가 주최하는 박람회의 '성장하는 지역' 분야에서 '주민이 그리는 지역의 미래, 관광두레' 전시관을 운영한다. 관광두레는 지역 주민이 관광자원을 발굴하고 관광사업체를 창업·경영하도록 돕는 사업이다. 공사는 올해 40개 지역, 200개 주민사업체를 지원하고 있다. 전시 참여 규모를 '27개 지역 주민사업체'로 소개했다. 전시 상품은 △울산 동구의 돌 미역귀 디저트 △경기 여주의 신륵 목어 도자기 장식품 △김해의 미니 가야금 직접 만들기 꾸러미 등이다. △유성온천수 레진 아트 만들기 △자개 컵받침 만들기 △영월 한반도 빵 시식 프로그램도 운영한다. 정선희 한국관광공사 지역개발실장은 \"관광두레는 지역 주민이 스스로 지역의 매력을 발견하고 관광의 주체로 성장할 수 있도록 지원하는 지역혁신 관광사업\"이라며 \"이번 박람회를 통해 주민들이 만들어가는 지역의 변화와 성장 가능성을 국민과 공유하고 지속 가능한 지역관광 생태계 조성을 위한 노력을 이어가겠다\"고 말했다.","category":"사회"},{"title":"비닐하우스서 공기총 쏜 60대…모르는 마을 주민 숨졌다","link":"https://n.news.naver.com/mnews/article/055/0001404954","naverLink":"https://n.news.naver.com/mnews/article/055/0001404954","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"비닐하우스서 공기총 쏜 60대…모르는 마을 주민 숨졌다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"최태원 “AI 네이티브 시대엔 지혜 중심 교육을”","link":"https://n.news.naver.com/mnews/article/032/0003484287","naverLink":"https://n.news.naver.com/mnews/article/032/0003484287","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"최태원 “AI 네이티브 시대엔 지혜 중심 교육을”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"아산의료원장에 박승일 임명…서울아산병원장에 이제환","link":"https://n.news.naver.com/mnews/article/032/0003484271","naverLink":"https://n.news.naver.com/mnews/article/032/0003484271","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"아산사회복지재단은 20일 아산의료원장에 박승일 서울아산병원장(왼쪽 사진)을, 서울아산병원장에 이제환 진료부원장(오른쪽)을 각각 임명했다. 임기는 내년 1월1일부터다.","category":"사회"},{"title":"한·일 여성기자 포럼서 ‘미디어 업계 성 불평등’ 해법 모색","link":"https://n.news.naver.com/mnews/article/032/0003484267","naverLink":"https://n.news.naver.com/mnews/article/032/0003484267","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한·일 여성기자 포럼서 ‘미디어 업계 성 불평등’ 해법 모색. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"한전도 털렸다…주민번호 포함 152만건 유출","link":"https://n.news.naver.com/mnews/article/009/0005767335","naverLink":"https://n.news.naver.com/mnews/article/009/0005767335","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한전도 털렸다…주민번호 포함 152만건 유출. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"中 국가안전부, 2년 전부터 첨단 칩 확보위해 비밀 작전\"","link":"https://n.news.naver.com/mnews/article/001/0016456936","naverLink":"https://n.news.naver.com/mnews/article/001/0016456936","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"\"中 국가안전부, 2년 전부터 첨단 칩 확보위해 비밀 작전\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"한전 해킹… 주민·계좌번호 152만명분 샜다","link":"https://n.news.naver.com/mnews/article/029/0003060482","naverLink":"https://n.news.naver.com/mnews/article/029/0003060482","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한전 해킹… 주민·계좌번호 152만명분 샜다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"세계일보 ‘죽어야 끝나는 돌봄’ 시리즈, 제1회 장애인권 우수보도 기자상","link":"https://n.news.naver.com/mnews/article/022/0004177200","naverLink":"https://n.news.naver.com/mnews/article/022/0004177200","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한국기자협회와 한국장애인개발원이 세계일보 사회부 김승환·유경민·채명준·소진영 기자의 ‘죽어야 끝나는 돌봄’ 보도를 제1회 장애인권 우수보도 기자상 수상작으로 선정했다고 22일 밝혔다. 심사위원들은 “상의 취지에 부합하고 작품의 완성도와 사회적 파장력, 심층성 등에서 타 출품작에 비해 탁월하다”고 평가했다. 수상작은 발달장애 자녀를 둔 부모들을 심층 인터뷰하는 한편 부모 162명을 대상으로 설문조사를 진행하고 분석한 결과를 담았다. 정부 돌봄 서비스의 공백, 돌봄 인력의 질 문제, 보호시설의 한계 등까지 더해 총 3회에 걸쳐 발달장애 자녀 돌봄 문제를 집중 조명했다. 시상식은 26일 오전 11시 서울 중구 한국프레스센터 19층 기자회견장에서 열린다.","category":"생활·문화"},{"title":"월요일 출근길 어쩌나…전국 비·눈 예고에 교통안전 '경고' [날씨]","link":"https://n.news.naver.com/mnews/article/015/0005356803","naverLink":"https://n.news.naver.com/mnews/article/015/0005356803","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"“전기요금 내려고 입력했던 내 정보가”…한전, 이번엔 65만명 고객정보 유출","link":"https://n.news.naver.com/mnews/article/009/0005767326","naverLink":"https://n.news.naver.com/mnews/article/009/0005767326","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"서울 한국전력공사 서울본부 모습. [뉴시스] 한국전력공사에서 직원 개인정보 유출 사고가 발생한 데 이어 이번에는 전기요금 납부 고객과 조달업체 관계자들의 개인정보까지 대거 유출됐다. 특히 전기사용 고객의 주민등록번호는 물론 은행 계좌번호와 신용카드 번호 등 금융정보까지 노출된 것으로 확인돼 파장이 예상된다. 한전은 고객 서비스 플랫폼 ‘한전ON’ 이용자 65만487명과 전자조달시스템(SRM) 이용자 87만명의 개인정보가 유출된 사실을 확인했다고 22일 밝혔다. 이번 사고로 한전ON 이용자에게서는 총 12개 항목의 개인정보가 유출됐다. 구체적으로 고객번호와 고객명, 주민·외국인등록번호, 전화번호, 주소 등은 물론 은행명과 계좌번호, 예금주명은 물론 카드사와 카드번호, 카드명의자 정보 등 전기요금 및 청구정보까지 유출 대상에 포함됐다. 단순 연락처나 주소를 넘어 금융정보와 고유식별정보까지 포함됐다는 점에서 2차 피해에 대한 우려도 커지고 있다. 전자조달시스템에서도 대규모 개인정보 유출이 확인됐다. 기업 대표자 42만6827명의 성명과 주민·외국인등록번호, 이메일, 회사주소 등 4개 항목이 유출됐다. 한전 직원과 기업 직원 44만2934명에게서는 성명과 소속, 사번, 휴대전화 번호, 이메일, 회사 전화번호 등 6개 항목이 노출됐다. 한전은 지난 20일 개인정보 유출 상황을 인지한 뒤 외부 IP 접속을 중단하고 해외 서비스를 차단했다고 설명했다. 개인정보 유출이 확인된 고객에게는 개별적으로 유출 사실을 안내하고 있다. 국가정보원과 기후에너지환경부 사이버안전센터, 외부 전문가 등과 함께 정확한 유출 경위와 피해 범위를 조사하고 있다. 한전의 개인정보 관리 부실 논란이 이번이 처음이 아니다. 한전은 지난달에도 직원과 퇴직자, 협력사 직원 등 총 3만5528명의 개인정보가 유출된 사실을 확인했다고 발표했다. 당시 유출된 정보에는 이름과 전화번호 등이 포함됐으며, 한전은 수사 의뢰 등 후속 조치에 나서겠다고 밝힌 바 있다.","category":"생활·문화"},{"title":"한전, 사이버 침해로 고객 개인정보 유출…대국민 사과","link":"https://n.news.naver.com/mnews/article/003/0014338414","naverLink":"https://n.news.naver.com/mnews/article/003/0014338414","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"접속 차단·신고 등 긴급 조치…경찰 수사 의뢰 외부 보안 전문가와 추가 유출 및 피해 범위 조사 \"개인정보 보호체계 원점 재검토…재발 방지 총력\" [나주=뉴시스] 이창우 기자=광주전남공동(나주)혁신도시에 들어선 한국전력 신사옥 전경. (사진=뉴시스 DB) *재판매 및 DB 금지 [나주=뉴시스]이창우 기자 = 한국전력공사가 사이버 침해 사고로 고객 개인정보가 유출된 데 대해 대국민 사과문을 발표하고 재발 방지 대책 마련에 나섰다. 한전은 22일 발표한 사과문을 통해 \"사이버 침해로 인한 개인정보 유출 사고로 국민 여러분께 큰 심려를 끼쳐드린 점에 대해 진심으로 사과드린다\"며 \"고객의 소중한 정보를 완벽히 지키지 못한 책임을 통감한다\"고 밝혔다. 한전은 사고를 인지한 직후 관련 시스템에 대한 접속을 차단하고 비상대책종합상황실을 가동했으며, 관계기관에 신고하고 경찰에 수사를 의뢰했다고 설명했다. 현재 국가정보원과 기후에너지환경부, 외부 보안 전문가 등과 협력해 추가 유출 여부와 피해 범위를 조사하고 있다. 추가 피해를 막기 위해 일부 대외 서비스를 잠정 중단했으며, 운영 중인 서비스 전반에 대한 보안 점검도 진행하고 있다. 한전은 이번 사고가 고객 편의성과 서비스 접근성을 높이기 위해 제공해 온 일부 디지털 서비스 기능이 외부 사이버 공격의 표적이 되면서 발생했다고 밝혔다. 그동안 전기요금 조회와 납부 등 국민이 이용하는 개방형 디지털 서비스를 확대하는 과정에서 보안체계도 지속적으로 강화해 왔지만 결과적으로 개인정보를 안전하게 보호하지 못했다는 것이다. 한전은 현재까지 확인된 2차 피해는 없다고 설명하면서도 금융당국 등 관계기관과 협력해 금융정보 악용 가능성과 추가 보호조치 필요성을 검토하겠다고 밝혔다. 개인정보 유출이 확인된 고객에게는 유출된 정보 항목과 추가 피해 예방을 위한 유의사항, 문의처 등을 개별적으로 안내하고 필요한 지원을 제공할 방침이다. 아울러 개인정보 유출로 고객 피해가 발생할 경우 개인정보보호법 등 관련 법령에 따른 구제 절차도 성실히 이행하겠다고 강조했다. 특히 외부 전문기관의 객관적인 진단을 토대로 개인정보 보호체계 전반을 원점에서 재검토하고, 사고 원인을 철저히 규명해 유사한 사고가 재발하지 않도록 하겠다는 입장이다. 한전은 \"소중한 개인정보가 유출된 분들과 국민 여러분께 다시 한번 깊이 사과드린다\"며 \"빈틈없는 후속 관리와 철저한 보안대책 마련을 통해 국민의 신뢰를 지키는 데 최선을 다하겠","category":"생활·문화"},{"title":"서울의 음악, 유럽의 심장 브뤼셀을 울리다","link":"https://n.news.naver.com/mnews/article/016/0002726798","naverLink":"https://n.news.naver.com/mnews/article/016/0002726798","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"‘2026 서울·브뤼셀 뮤직 페스티벌’ 성황리 개최 K팝과 뮤지컬·재즈 어우러진 특별한 무대 춘향전 ‘사랑가’로 한국 전통음악의 멋 전달 서울 문화예술 세계화와 민간 국제교류 확대 지난 18일 벨기에 브뤼셀에서 열린 ‘2026 서울·브뤼셀 뮤직 페스티벌’에서 서울 뮤지션들과 현지 시민들이 기념촬영을 하고 있다. 양정원 기자 [헤럴드경제=양정원 기자] 유럽연합(EU)의 주요 기관이 자리한 벨기에 브뤼셀이 서울의 음악과 한국 전통문화로 물들었다. 세계 각국의 문화가 교차하는 유럽의 중심도시에서 한국 아티스트들이 K팝과 뮤지컬, 재즈를 아우르는 공연을 선보이고 현지 시민들이 한복과 한글, 판소리 등 한국 고유의 문화를 직접 체험하는 특별한 축제가 펼쳐졌다. 단순한 공연을 넘어 음악과 전통문화가 결합한 참여형 문화교류를 통해 서울의 문화예술적 역량과 한국문화의 다채로운 매력을 유럽 현지에 알리는 계기가 마련됐다는 평가다. 지난 18일 벨기에 브뤼셀에서 열린 ‘2026 서울·브뤼셀 뮤직 페스티벌(2026 Seoul & Brussels Music Festival)’은 한국의 현대음악과 전통문화가 조화를 이룬 복합문화축제로 진행됐다. 올해 처음 개최된 이번 행사는 서울시의 ‘2026년 민간국제문화교류 활성화 사업’의 일환으로 마련됐으며 서울시가 후원했다. 이번 페스티벌은 한국 대중음악의 세계적인 확산 흐름에 발맞춰 서울의 문화예술 콘텐츠를 유럽 현지에 소개하고, 음악을 매개로 양 도시 시민 간 문화적 공감대를 넓히기 위해 기획됐다. 특히 K팝 중심의 한류를 뮤지컬과 재즈, 판소리 등 다양한 장르로 확장하고, 관람객이 한국 전통문화를 직접 경험할 수 있도록 프로그램을 구성한 것이 특징이다. 서울을 대표해 참여한 뮤지션들은 뮤지컬의 대표적인 명곡으로 사랑받는 ‘지금 이 순간’을 비롯해 ‘오버 더 레인보우(Over the Rainbow)’, ‘댄싱퀸(Dancing Queen)’, ‘러빙 유 킵스 미 어라이브(Loving You Keeps Me Alive)’ 등을 열창했다. 세계적으로 친숙한 음악을 한국 아티스트 특유의 감성과 표현력으로 재해석한 무대는 언어와 국적을 넘어 관람객들이 음악으로 소통하는 시간을 만들어냈다. 한국 전통음악의 아름다움을 알리는 무대도 마련됐다. 아티스트들은 한국 고유의 멋을 담은 한복을 입고 고전소설 춘향전을 바탕으로 한 판소리 ‘사랑가’를 선보였다. 춘향과 이몽룡의 사랑을 노래하는 전통 선율과 장단은","category":"생활·문화"},{"title":"AI 시대에도 붓 가는 대로…페이스가 선택한 최연소 작가","link":"https://n.news.naver.com/mnews/article/310/0000141944","naverLink":"https://n.news.naver.com/mnews/article/310/0000141944","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"영국 화가 팸 에블린 아시아 첫 개인전 신작 20여 점 전시...종이 작업도 첫 공개 2027년 1월 9일까지 페이스갤러리 Portrait of Pam Evelyn, 2023. ⓒPhoto by Robert Glowacki, courtesy Pace Gallery 콘크리트 위로 번진 저녁노을, 고층 빌딩 유리창에 부딪혀 반사된 빛, 담벼락의 낙서…. 영국 화가 팸 에블린(Pam Evelyn·30)은 런던 도심에서 마주친 장면들을 그렸다. 선명한 유화 물감을 겹겹이 칠하고 긁어내기를 되풀이해 완성한 그의 추상화엔 강렬하고도 조각적인 매력이 있다. 에블린의 국내 첫 개인전 'The Wild Asphalt'가 서울 용산구 페이스갤러리에서 개막했다. 2019년 슬레이드 미술학교를 졸업하고, 2020년 왕립예술대학에서 회화로 석사 학위를 받으며 '엘리트 코스'를 밟아 온 에블린은 2023년 27세의 나이로 세계적 화랑인 페이스갤러리의 전속 작가가 됐다. 당시 갤러리 소속 최연소 아티스트로 화제에 올랐다. 이후 페이스 런던·뉴욕, 미국 댈러스 컨템포러리 미술관에서 개인전을 열었다. 이번 서울 전시가 아시아 첫 개인전이다. 지난 10일 갤러리에서 만난 작가는 키가 크고 팔이 길어 높이 3m가 넘는 거대한 캔버스에도 거뜬히 붓질할 기세였다. 신작 회화, 종이 작업 등 20여 점을 직접 설명하는 눈이 반짝거렸다. Pam Evelyn, Figure and Tower, 2026, oil on linen, 190 cm × 150 cm. ⓒPam Evelyn, courtesy Pace Gallery","category":"생활·문화"},{"title":"게임 경계 허문 '지스타'… 국내 주요 게임사 외면은 큰 숙제","link":"https://n.news.naver.com/mnews/article/014/0005607862","naverLink":"https://n.news.naver.com/mnews/article/014/0005607862","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"AI 전면에 내세우며 '외연 확장' 국내 빈자리 中·日 업체로 채워 게임 전시회 경쟁력 강화 관건 게임산업 성장 가능성은 보여줘 지난 19일 부산 해운대구 벡스코에서 열린 국내 최대 게임전시회 '지스타(G-STAR) 2026'에서 관람객들이 신작 게임을 즐기고 있다. 연합뉴스 【파이낸셜뉴스 부산=장민권 기자】국내 최대 게임전시회 '지스타 2026'이 나흘간 일정을 마무리했다. 사상 첫 AI 기업이 메인 스폰서를 맡은 이번 행사는 신작 중심의 전시에서 벗어나 AI 기반 콘텐츠 창작, 게임 지적재산(IP)의 활용, 다양한 산업과의 협업 등 게임산업의 새로운 성장 가능성을 보여줬다는 평가다. 다만 외연 확장이라는 성과와는 별개로 국내 주요 게임사들의 참여를 이끌어내 게임 전시회 본연의 경쟁력을 강화해야 한다는 과제도 남겼다. 22일 업계에 따르면 지난 19일 부산 벡스코에서 개막한 지스타 2026이 이날 막을 내렸다. 올해로 22회째를 맞은 지스타에는 41개국 1237개사가 참가해 총 3445부스 규모로 전시관을 꾸렸다. 올해 지스타의 가장 큰 변화는 AI의 전면 등장이다. AI 기업인 뤼튼테크놀로지스가 게임사가 아닌 기업으로는 처음으로 메인 스폰서를 맡아 AI 캐릭터 채팅 플랫폼 '크랙'을 선보였다. 크랙은 창작자가 설정한 세계관과 캐릭터를 바탕으로 이용자와 AI의 대화에 따라 이야기가 달라지는 서비스다. 200부스 규모의 전시관에 폭 40m의 대형 발광다이오드(LED) 스크린을 설치하고, 관람객이 AI 캐릭터와 대화하며 이야기를 만들어가는 체험 공간을 마련했다. 국내 대형 게임사들의 빈자리는 중국, 일본 등 해외 게임사들이 채웠다. 올해 처음 마련된 '지스타 글로벌 게임 쇼케이스'에 세가, 코에이 테크모 게임스, 캡콤, 넷이즈게임즈, CD 프로젝트 레드(CDPR) 등 5개 게임사가 참여해 글로벌 전시회로서 성장 가능성을 보여줬다. 호요버스의 '젠레스 존 제로' 체험 행사장에는 관람객이 몰리면서 대기열이 조기에 마감됐고, 캡콤 부스에서는 게임을 시연하기 위해 150분을 기다려야 한다는 안내판까지 등장했다. 현대자동차는 레이싱 시뮬레이션 기반 e스포츠 대회 '현대 N 버츄얼컵'을 통해 모빌리티와 게임을 결합한 체험을 선보였다. 역대 가장 많은 106곳의 국내외 인디게임 개발사들도 참여했다. 게임 시연 외에 개발자 강연과 창작자 대담 등 자체 기획 콘텐츠도 한층 다양해졌다. 신작을 보여주는 전시회에서 게임과 다른 콘텐","category":"생활·문화"},{"title":"23일 전국 눈·비… 강원 북부 적설량 최대 8㎝ [날씨]","link":"https://n.news.naver.com/mnews/article/022/0004177206","naverLink":"https://n.news.naver.com/mnews/article/022/0004177206","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"'젠슨 황 논란'으로 본 CEO 이미지브랜딩의 '핵심' [더 라이프이스트-박영실의 휴먼브랜딩]","link":"https://n.news.naver.com/mnews/article/015/0005356820","naverLink":"https://n.news.naver.com/mnews/article/015/0005356820","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한경닷컴 더 라이프이스트 기업의 가치는 실적과 기술력만으로 결정되지 않는다. 최고경영자(CEO)가 어떤 철학을 갖고 있으며, 위기 상황에서 어떻게 소통하고 행동하는지도 기업을 바라보는 중요한 판단 기준이 된다. 특히 CEO의 이름과 기업의 정체성이 강하게 연결된 조직에서는 개인의 평판이 기업의 신뢰에 영향을 미칠 수 있다. 엔비디아의 젠슨 황은 이러한 관계를 살펴보기에 의미 있는 사례다. 최근 젠슨 황을 둘러싼 논란은 한 가지 질문을 던진다. “CEO의 개인적 평판은 어디까지 기업의 신뢰와 연결되는가?” 이 글은 특정 의혹의 진위를 판단하거나 개인을 평가하려는 것이 아니다. CEO의 이미지가 어떻게 형성되고, 기업의 무형자산으로 축적되며, 예상하지 못한 평판 리스크에 어떻게 대응해야 하는지를 퍼스널 이미지브랜딩 관점에서 살펴보고자 한다. 젠슨 황의 사례가 보여주는 CEO 평판의 양면성","category":"생활·문화"},{"title":"“11월 8일 직접 만났다”…중고시장에 올라온 고 이진우 책, 가격보니","link":"https://n.news.naver.com/mnews/article/009/0005767396","naverLink":"https://n.news.naver.com/mnews/article/009/0005767396","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"중고 시장에 올라온 ‘브레인 악셀’ [당근] 법학적성시험(LEET·리트) 만점자 고 이진우씨가 지난 19일 갑작스럽게 사망한 가운데 그가 쓴 책 ‘브레인 악셀’이 중고거래 시장에서 정가의 10배가 넘는 가격에 매물로 나와 눈길을 끈다. 23일 중고거래 플랫폼 당근에는 고인의 저서 ‘브레인 악셀’을 판매한다는 게시글이 잇따라 올라와 있다. 일부 판매자는 정가 2만2000원인 책에 3만원부터 최대 25만원까지 가격을 책정했다. 한 판매자는 ‘브레인 악셀 이진우 초판 1쇄’라는 제목으로 해당 책을 25만원에 내놨다. 고인의 친필 사인이 담겼다고 주장하는 책에도 높은 가격이 붙었다. 서울 서대문구의 한 판매자는 ‘브레인 악셀 이진우 사인본’이라는 제목의 게시글을 올리고 20만원을 판매 희망 가격으로 제시했다. 판매자는 “11월 8일 이진우씨 직접 만나서 받은 사인입니다”라며 “제 이름은 펜으로 지워서 드릴 예정입니다”라고 설명했다. ‘브레인 악셀’은 고인이 인공지능(AI)를 활용해 시험에서 부정행위를 저질렀다는 의혹이 불거진 이후 일부 서점에서 판매가 중단된 상태다. 예스24는 지난 20일 내부 검토를 거쳐 해당 도서의 판매 중지를 결정했으며 알라딘 역시 출판사 또는 제작사의 유통 중단을 이유로 품절을 안내했다. 반면 23일 기준 교보문고와 영풍문고에서는 해당 도서가 여전히 판매되고 있다. 한편 이씨는 AI를 활용한 부정행위 의혹을 부인하며 지난 19일 수능 국어 영역 문제 풀이 생중계를 예고했으나 현장에 나타나지 않았다. 전날 저녁부터 주최측과 연락두절 상태였다. 그리고 당일 숨진 채 발견됐다. 경찰은 이씨 사망에도 부정행위 수법과 공범 여부 등을 확인하기 위해 수사를 이어갈 방침이다.","category":"생활·문화"}],"세계":[{"title":"화석연료 놓고 끝내 갈라졌다…31차 기후총회 합의 무산 [COP31 현장]","link":"https://n.news.naver.com/mnews/article/421/0009303718","naverLink":"https://n.news.naver.com/mnews/article/421/0009303718","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"화석연료 놓고 끝내 갈라졌다…31차 기후총회 합의 무산 [COP31 현장]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"'화석연료' 놓고 갈라진 유엔기후총회‥17년 만에 합의문 채택 실패","link":"https://n.news.naver.com/mnews/article/214/0001537271","naverLink":"https://n.news.naver.com/mnews/article/214/0001537271","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"튀르키예에서 열린 제31차 유엔기후변화협약 당사국총회가 화석연료 퇴출 등을 놓고 이견을 좁히지 못하면서 합의문 채택에 실패했습니다. 총회 의장을 맡은 튀르키예의 무라트 쿠룸 환경·도시화·기후변화부 장관은 현지시간 22일 폐막 회의에서 \"합의문에 반대하는 국가들이 있었다\"며 \"결정문은 채택되지 않았다\"고 밝혔습니다. 튀르키예와 호주 등은 화석연료 언급을 포함할지와 개발도상국의 기후변화 적응을 지원하기 위해 선진국이 기후 재원을 확대할지를 놓고 여러 차례 수정안을 제시했지만, 주요 산유국과 유럽연합 등의 최종 합의를 끌어내진 못했습니다. 유엔 기후총회에서 주요 합의문을 채택하지 못한 것은 이례적으로, 가장 최근엔 2009년 덴마크 코펜하겐 총회에서 합의문 채택에 실패했습니다. 이번 합의 불발로 이전 총회에서 약속한 회원국들의 의무가 사라지는 것은 아니지만, 국제사회의 기후변화 대응 동력에 큰 타격이 될 수 있다는 분석이 나오고 있습니다.","category":"세계"},{"title":"NORTH MACEDONIA NIGHT SKY","link":"https://n.news.naver.com/mnews/article/091/0010375635","naverLink":"https://n.news.naver.com/mnews/article/091/0010375635","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Star trails over Jakupica mountain range in North Macedonia A composite of 320 stacked long-exposure photographs shows star trails and aircraft light trails across the night sky above the Karadzica mountain hut in the Jakupica mountain range, approximately 40 km south of Skopje, in Studenicani municipality, North Macedonia, 21 November 2026 (issued 22 November 2026). EPA/GEORGI LICOVSKI","category":"세계"},{"title":"Portugal MotoGP Motorcycle Racing","link":"https://n.news.naver.com/mnews/article/077/0007246411","naverLink":"https://n.news.naver.com/mnews/article/077/0007246411","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Portugal MotoGP Motorcycle Racing. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"SWITZERLAND CHESS","link":"https://n.news.naver.com/mnews/article/091/0010375634","naverLink":"https://n.news.naver.com/mnews/article/091/0010375634","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"FIDE World Chess Championship - press conference The grandmaster Javokhir Sindarov of Uzbekistan, left, and grandmaster Gukesh Dommaraju of India, right, shakes hands during a press conference at the European headquarters of the United Nations ahead the FIDE World Chess Championship between grandmasters Gukesh Dommaraju of India and Javokhir Sindarov of Uzbekistan in Geneva, Switzerland, 22 November 2026. EPA/SALVATORE DI NOLFI","category":"세계"},{"title":"POLAND INCIDENT SECURITY","link":"https://n.news.naver.com/mnews/article/091/0010375633","naverLink":"https://n.news.naver.com/mnews/article/091/0010375633","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Polish authorities investigate unidentified object crash near Ukraine border An aerial photograph taken with a drone shows the site where an unidentified flying object crashed in a field in Nowy Lipowiec, Poland, 22 November 2026. The Operational Command of the Polish Armed Forces (DORSZ) reported a violation of Polish airspace on 20 November during overnight Russian airstrikes on western Ukraine. Polish prosecutors and Military Police completed their examination of the crash site on 21 November, recovering and securing fragments of the object and forensic evidence. A prosecutor's office spokesperson said the crater was significantly smaller than the one left by a Russian Kh-101 cruise missile that crashed in Tarnawa-Kolonia on 30 July. EPA/WOJTEK JARGILO POLAND OUT","category":"세계"},{"title":"ITALY SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010375625","naverLink":"https://n.news.naver.com/mnews/article/091/0010375625","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"ITALY SOCCER. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"Climate COP31 Turkey","link":"https://n.news.naver.com/mnews/article/077/0007246406","naverLink":"https://n.news.naver.com/mnews/article/077/0007246406","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Climate COP31 Turkey Samira Nawa, Denmark's minister for climate, energy and utilities, speaks outside a plenary session at the COP31 U.N. Climate Summit, Sunday, Nov. 22, 2026, in Antalya, Turkey. (AP Photo/Khalil Hamra)","category":"세계"},{"title":"Italy Serie A Soccer","link":"https://n.news.naver.com/mnews/article/077/0007246405","naverLink":"https://n.news.naver.com/mnews/article/077/0007246405","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Italy Serie A Soccer Bologna's Federico Bernardeschi, center right, vies for the ball with Udinese's Matteo Palma during the Serie A soccer match between Bologna and Udinese, in Bologna, Italy, Sunday, Nov. 22, 2026. (Massimo Paolone/LaPresse via AP) ITALY OUT; MANDATORY CREDIT","category":"세계"},{"title":"NETHERLANDS SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010375621","naverLink":"https://n.news.naver.com/mnews/article/091/0010375621","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Eredivisie - Ajax Amsterdam vs ADO Den Haag Matteo Waem of ADO Den Haag brings down the onrushing Tolu Arokodare of Ajax during the Dutch Eredivisie match between AFC Ajax and ADO Den Haag at the Johan Cruijff ArenA in Amsterdam, the Netherlands, 22 November 2026. EPA/OLAF KRAAK","category":"세계"}],"IT 과학":[{"title":"3년 만에 수능 17→100점… 진화한 AI ‘커닝 비즈니스’ 탄생시켜","link":"https://n.news.naver.com/mnews/article/005/0001886710","naverLink":"https://n.news.naver.com/mnews/article/005/0001886710","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"[흔들린 공정, 기로에 선 시험] AI기술이 무너뜨린 시험의 공정 서울 노원구 강북청솔학원에서 22일 열린 ‘2027학년도 대학수학능력시험 가채점 분석 설명회’에서 한 학부모가 가채점 점수로 예상되는 정시 배치 참고표를 살펴보고 있다. 뉴시스 인공지능(AI) 기술이 발전하면서 곳곳에서 시험의 공정성이 훼손되고 있다. 과거부터 커닝을 통한 부정행위는 있었지만 AI가 단계별 조력자 역할을 대체하면서 더 광범위하고 빠른 속도로 부정행위가 확산되고 있다. 전문가들은 AI 기술이 급속도로 발전한 2024년부터 AI 정답률이 덩달아 높아지면서 실제 부정행위에 활용된 사례가 늘었을 것으로 추정한다. 외부 조력을 통한 커닝은 대부분 시험지를 촬영해 이를 전송하고 외부에서 정답을 찾아 다시 수험생에게 답안을 전송하는 구조다. 2004년 대학수학능력시험 때 광주에서는 ‘선수’ ‘도우미’ ‘일반 수험생’ 집단으로 구성된 부정행위자 159명이 적발되는 일이 있었다. 휴대전화 수십대를 준비한 뒤 선수 집단이 고사장에 들어가 도우미 집단에 정답 신호를 메시지 형태로 보내는 방식이었다. 도우미들은 이 정답을 휴대전화로 일반 수험생 집단에 보냈다. 그러나 AI 기술은 외부 조력자가 충분치 않아도 부정행위를 할 수 있도록 커닝의 문턱을 대폭 낮췄다. 초창기 기술을 활용한 풀이 방식에는 2014년 출시된 수학 풀이 앱 ‘포토매스’가 있다. 카메라로 수학 문제를 비추면 광학 문자인식(OCR) 기능으로 풀이 과정과 정답을 보여주는 형식이었다. 당시 포토매스는 단순 수학 풀이에는 유용했지만 복잡한 문제에서는 한계를 보였다. 이후 포토매스는 2016년과 2018년 딥러닝 AI 기술을 장착하면서 손글씨를 인식하고, 복잡한 문제 풀이를 지원하면서 진화했다. 그러다 2022년 오픈AI가 생성형 AI인 ‘챗GPT’를 처음 공개하면서 판도를 뒤흔들었다. 다만 당시에는 여전히 복잡한 도형이나 까다로운 수식에 있어서는 오류가 잦았고 오답률도 높았다.","category":"IT 과학"},{"title":"화석연료 전환 합의 끝내 무산…COP31, 17년 만의 포괄합의 실패(종합)[과학을읽다]","link":"https://n.news.naver.com/mnews/article/277/0005846353","naverLink":"https://n.news.naver.com/mnews/article/277/0005846353","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"대표결정문 채택 불발…감축·기후재원 놓고 선진국·개도국 충돌 적응·정의로운 전환 등 부분 합의…과학계 \"실질적 감축 행동 앞당겨야\" 제31차 유엔기후변화협약 당사국총회(COP31)가 화석연료 전환과 기후재원 확대를 둘러싼 국가 간 이견을 좁히지 못한 채 막을 내렸다. 지구 평균기온 상승을 산업화 이전 대비 1.5도 이내로 억제하기 위한 국제사회의 공동 대응이 다시 한번 한계를 드러냈다. 다만 기후변화 적응과 정의로운 전환, 국제탄소시장 등 일부 분야에서는 합의가 이뤄졌다. 23일 기후에너지환경부에 따르면 지난 9일 튀르키예 안탈리아에서 개막한 COP31은 당초 폐막 예정일인 20일을 이틀 넘긴 22일(현지시간)까지 협상을 이어갔지만 핵심 대표결정문 채택에 실패했다. 한국시간으로는 23일 오전 1시께 폐막했다. 주요 기후위기 대응 방향에 관한 포괄적 합의에 실패한 것은 2009년 덴마크 코펜하겐에서 열린 COP15 이후 17년 만이다. 이번 총회에는 각국 정부와 국제기구, 산업계, 시민단체 등 10만여 명이 참석했다. 파리협정 발효 10주년을 맞아 기존 감축 목표를 구체적인 정책과 행동으로 연결하는 방안이 핵심 의제로 다뤄졌다. 화석연료 전환 빠진 대표결정문…감축 합의도 불발 튀르키예와 호주 의장국은 지구 평균기온 상승폭이 1.5도를 넘는 '오버슛(overshoot)'의 규모와 기간을 최소화하고, 전기화와 기후재원 확대 등을 담은 '안탈리아 협약(Antalya Pact)'을 추진했다. 그러나 화석연료로부터의 전환을 결정문에 명시하는 문제를 놓고 국가 간 입장이 충돌하면서 최종 채택에 실패했다. 온실가스 감축 강화를 요구하는 국가들과 재정·기술 지원 확대를 우선시하는 개발도상국 간 갈등도 이어졌다. 특히 감축정책의 이행을 촉진하기 위한 작업프로그램을 2027년 이후 어떻게 운영할지를 놓고 합의하지 못했다. 2026년 종료 예정이었던 감축 작업프로그램의 연장과 운영 방식에 대해서는 상당 부분 의견이 모였지만, 전 지구적 이행점검(GST)과 연계하는 문제에서 이견이 남았다. 각국의 국가온실가스감축목표(NDC)에 적용할 추가 지침도 마련하지 못했다. 두 의제는 내년 회의에서 다시 논의된다. 기후재원 문제에서도 한계가 드러났다. 지난해 합의한 '2035년까지 적응재원을 최소 3배 확대하기 위한 노력'과 관련해 재원 확대의 기준선과 이행 경로를 논의했지만, 구체적인 추진방안에는 합의하지 못했다. 다만 각국은 선진국의 재원","category":"IT 과학"},{"title":"‘1조 달러’ 넘긴 한국 수출, 이달 중순도 역대 최대…반도체 4배 급증","link":"https://n.news.naver.com/mnews/article/025/0003567127","naverLink":"https://n.news.naver.com/mnews/article/025/0003567127","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"‘1조 달러’ 넘긴 한국 수출, 이달 중순도 역대 최대…반도체 4배 급증. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"Britain Women's Super League Soccer","link":"https://n.news.naver.com/mnews/article/077/0007246415","nave
