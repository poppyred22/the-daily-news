 대응에 나섰다. 금융당국에 관련 정보를 공유하고 이상거래 탐지 등 감시 강화를 요청할 계획이다. 개인정보 유출이 확인된 고객에게는 사고 사실과 피해 예방 요령을 개별 안내했다. 한전 홈페이지에는 개인정보 유출 여부를 조회하고 피해를 접수할 수 있는 전용 창구도 마련했다. 한전은 출처가","category":"사회"}],"생활·문화":[{"title":"세계일보 ‘죽어야 끝나는 돌봄’ 시리즈, 제1회 장애인권 우수보도 기자상","link":"https://n.news.naver.com/mnews/article/022/0004177200","naverLink":"https://n.news.naver.com/mnews/article/022/0004177200","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한국기자협회와 한국장애인개발원이 세계일보 사회부 김승환·유경민·채명준·소진영 기자의 ‘죽어야 끝나는 돌봄’ 보도를 제1회 장애인권 우수보도 기자상 수상작으로 선정했다고 22일 밝혔다. 심사위원들은 “상의 취지에 부합하고 작품의 완성도와 사회적 파장력, 심층성 등에서 타 출품작에 비해 탁월하다”고 평가했다. 수상작은 발달장애 자녀를 둔 부모들을 심층 인터뷰하는 한편 부모 162명을 대상으로 설문조사를 진행하고 분석한 결과를 담았다. 정부 돌봄 서비스의 공백, 돌봄 인력의 질 문제, 보호시설의 한계 등까지 더해 총 3회에 걸쳐 발달장애 자녀 돌봄 문제를 집중 조명했다. 시상식은 26일 오전 11시 서울 중구 한국프레스센터 19층 기자회견장에서 열린다.","category":"생활·문화"},{"title":"월요일 출근길 어쩌나…전국 비·눈 예고에 교통안전 '경고' [날씨]","link":"https://n.news.naver.com/mnews/article/015/0005356803","naverLink":"https://n.news.naver.com/mnews/article/015/0005356803","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"“전기요금 내려고 입력했던 내 정보가”…한전, 이번엔 65만명 고객정보 유출","link":"https://n.news.naver.com/mnews/article/009/0005767326","naverLink":"https://n.news.naver.com/mnews/article/009/0005767326","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"서울 한국전력공사 서울본부 모습. [뉴시스] 한국전력공사에서 직원 개인정보 유출 사고가 발생한 데 이어 이번에는 전기요금 납부 고객과 조달업체 관계자들의 개인정보까지 대거 유출됐다. 특히 전기사용 고객의 주민등록번호는 물론 은행 계좌번호와 신용카드 번호 등 금융정보까지 노출된 것으로 확인돼 파장이 예상된다. 한전은 고객 서비스 플랫폼 ‘한전ON’ 이용자 65만487명과 전자조달시스템(SRM) 이용자 87만명의 개인정보가 유출된 사실을 확인했다고 22일 밝혔다. 이번 사고로 한전ON 이용자에게서는 총 12개 항목의 개인정보가 유출됐다. 구체적으로 고객번호와 고객명, 주민·외국인등록번호, 전화번호, 주소 등은 물론 은행명과 계좌번호, 예금주명은 물론 카드사와 카드번호, 카드명의자 정보 등 전기요금 및 청구정보까지 유출 대상에 포함됐다. 단순 연락처나 주소를 넘어 금융정보와 고유식별정보까지 포함됐다는 점에서 2차 피해에 대한 우려도 커지고 있다. 전자조달시스템에서도 대규모 개인정보 유출이 확인됐다. 기업 대표자 42만6827명의 성명과 주민·외국인등록번호, 이메일, 회사주소 등 4개 항목이 유출됐다. 한전 직원과 기업 직원 44만2934명에게서는 성명과 소속, 사번, 휴대전화 번호, 이메일, 회사 전화번호 등 6개 항목이 노출됐다. 한전은 지난 20일 개인정보 유출 상황을 인지한 뒤 외부 IP 접속을 중단하고 해외 서비스를 차단했다고 설명했다. 개인정보 유출이 확인된 고객에게는 개별적으로 유출 사실을 안내하고 있다. 국가정보원과 기후에너지환경부 사이버안전센터, 외부 전문가 등과 함께 정확한 유출 경위와 피해 범위를 조사하고 있다. 한전의 개인정보 관리 부실 논란이 이번이 처음이 아니다. 한전은 지난달에도 직원과 퇴직자, 협력사 직원 등 총 3만5528명의 개인정보가 유출된 사실을 확인했다고 발표했다. 당시 유출된 정보에는 이름과 전화번호 등이 포함됐으며, 한전은 수사 의뢰 등 후속 조치에 나서겠다고 밝힌 바 있다.","category":"생활·문화"},{"title":"한전, 사이버 침해로 고객 개인정보 유출…대국민 사과","link":"https://n.news.naver.com/mnews/article/003/0014338414","naverLink":"https://n.news.naver.com/mnews/article/003/0014338414","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"접속 차단·신고 등 긴급 조치…경찰 수사 의뢰 외부 보안 전문가와 추가 유출 및 피해 범위 조사 \"개인정보 보호체계 원점 재검토…재발 방지 총력\" [나주=뉴시스] 이창우 기자=광주전남공동(나주)혁신도시에 들어선 한국전력 신사옥 전경. (사진=뉴시스 DB) *재판매 및 DB 금지 [나주=뉴시스]이창우 기자 = 한국전력공사가 사이버 침해 사고로 고객 개인정보가 유출된 데 대해 대국민 사과문을 발표하고 재발 방지 대책 마련에 나섰다. 한전은 22일 발표한 사과문을 통해 \"사이버 침해로 인한 개인정보 유출 사고로 국민 여러분께 큰 심려를 끼쳐드린 점에 대해 진심으로 사과드린다\"며 \"고객의 소중한 정보를 완벽히 지키지 못한 책임을 통감한다\"고 밝혔다. 한전은 사고를 인지한 직후 관련 시스템에 대한 접속을 차단하고 비상대책종합상황실을 가동했으며, 관계기관에 신고하고 경찰에 수사를 의뢰했다고 설명했다. 현재 국가정보원과 기후에너지환경부, 외부 보안 전문가 등과 협력해 추가 유출 여부와 피해 범위를 조사하고 있다. 추가 피해를 막기 위해 일부 대외 서비스를 잠정 중단했으며, 운영 중인 서비스 전반에 대한 보안 점검도 진행하고 있다. 한전은 이번 사고가 고객 편의성과 서비스 접근성을 높이기 위해 제공해 온 일부 디지털 서비스 기능이 외부 사이버 공격의 표적이 되면서 발생했다고 밝혔다. 그동안 전기요금 조회와 납부 등 국민이 이용하는 개방형 디지털 서비스를 확대하는 과정에서 보안체계도 지속적으로 강화해 왔지만 결과적으로 개인정보를 안전하게 보호하지 못했다는 것이다. 한전은 현재까지 확인된 2차 피해는 없다고 설명하면서도 금융당국 등 관계기관과 협력해 금융정보 악용 가능성과 추가 보호조치 필요성을 검토하겠다고 밝혔다. 개인정보 유출이 확인된 고객에게는 유출된 정보 항목과 추가 피해 예방을 위한 유의사항, 문의처 등을 개별적으로 안내하고 필요한 지원을 제공할 방침이다. 아울러 개인정보 유출로 고객 피해가 발생할 경우 개인정보보호법 등 관련 법령에 따른 구제 절차도 성실히 이행하겠다고 강조했다. 특히 외부 전문기관의 객관적인 진단을 토대로 개인정보 보호체계 전반을 원점에서 재검토하고, 사고 원인을 철저히 규명해 유사한 사고가 재발하지 않도록 하겠다는 입장이다. 한전은 \"소중한 개인정보가 유출된 분들과 국민 여러분께 다시 한번 깊이 사과드린다\"며 \"빈틈없는 후속 관리와 철저한 보안대책 마련을 통해 국민의 신뢰를 지키는 데 최선을 다하겠","category":"생활·문화"},{"title":"서울시, 지하철 총파업 대비 비상수송대책…출근길 100% 운행","link":"https://n.news.naver.com/mnews/article/021/0002834996","naverLink":"https://n.news.naver.com/mnews/article/021/0002834996","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"시내버스 3519회 증회·혼잡역 31곳에 안전인력 배치 파업 장기화도 대비에 나서 서울 지하철 5호선 광화문역 내부 모습. 뉴시스 서울시가 오는 25일 예고된 서울교통공사 노동조합의 총파업에 대비해 출근시간대 지하철 운행률을 100%로 유지하고 시내버스 운행을 3519회 늘리는 비상수송대책을 마련했다. 24일 서울시에 따르면 시는 교통공사 노조가 25일 첫차부터 파업을 예고함에 따라 비상수송대책본부를 구성하고 단계별 대응계획을 수립했다. 서울교통공사와 한국철도공사(코레일), 버스업계, 자치구, 경찰 등 유관기관과 24시간 연락체계를 유지하며 교통 상황에 대응할 방침이다. 파업이 시작되더라도 출근시간대인 오전 7~9시 지하철 1~8호선은 평소와 동일하게 100% 운행된다. 퇴근시간대인 오후 6~8시에는 2호선과 5~8호선이 정상 운행되며, 1·3·4호선은 코레일 운행분을 포함해 88% 이상의 운행률을 유지한다. 전체 시간대 열차 운행률은 평시 대비 81% 수준이다. 파업에 참여하지 않는 9호선은 정상 운행된다. 출퇴근길 혼잡을 줄이기 위해 2·4호선에는 비상대기열차 3편성을 배치한다. 승객이 몰리는 시간대에 열차를 즉시 투입해 혼잡을 최소화할 계획이다. 시내버스 운행도 대폭 확대한다. 서울시는 시내버스 344개 일반노선의 출퇴근 집중배차시간을 각각 1시간 연장하고, 출근시간대 1873회와 퇴근시간대 1646회 등 총 3519회 증회 운행한다. 이는 지난해 12월 12일 파업 당시 비상수송대책보다 981회 늘어난 규모다. 이에 따라 출근시간대 집중배차는 기존 오전 7~9시에서 오전 6~9시로, 퇴근시간대는 오후 5~7시에서 오후 5~8시로 확대된다. 지하철 역사 내 안전관리도 강화한다. 서울시는 파업 미참여자와 협력업체 직원 등 평시 대비 약 80% 수준인 1만3000여명의 인력을 확보해 지하철 운행을 유지할 방침이다. 이용객이 집중될 것으로 예상되는 주요 혼잡역 31곳에는 서울시 직원 124명을 배치해 승객 이동을 안내하고 안전사고를 예방한다. 파업 장기화에 대비한 단계별 대책도 마련했다. 파업 시작일부터 7일까지를 1단계, 8일째부터를 2단계로 구분해 대응한다. 파업이 8일 이상 이어질 경우에도 출근시간대 운행률 90% 이상, 퇴근시간대 80% 이상을 유지하고 자치구 공공셔틀버스 등 추가 대체 교통수단을 확보할 계획이다. 서울시는 교통정보시스템(TOPIS)과 버스정보안내단말기(BIT), 또타지하철 앱 등을 통해","category":"생활·문화"},{"title":"인제 기린농협, 취약계층 이웃에 김장김치 200㎏ 전달","link":"https://n.news.naver.com/mnews/article/662/0000109026","naverLink":"https://n.news.naver.com/mnews/article/662/0000109026","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"농가주부모임·NH농협 인제군지부 동참 강원 인제 기린농협(조합장 정종옥)이 17일 NH농협 인제군지부(지부장 박진호), 기린농협 농가주부모임(회장 이창숙)과 함께 기린면 일대에서 ‘사랑의 김장김치 나눔행사’를 열었다(사진). 이날 참여자들은 김장김치 200㎏을 마련해 기린면과 상남면에 거주하는 취약계층 이웃에 전달했다. 정종옥 조합장은 “김장김치가 어려운 이웃들의 겨울나기에 보탬이 되길 바란다”며 “앞으로도 농가주부모임과 함께 지역사회 나눔활동을 이어가겠다”고 말했다.","category":"생활·문화"},{"title":"KT, 구글 AI·폰케어 결합한 '초이스 요금제' 신규 라인업 출시","link":"https://n.news.naver.com/mnews/article/001/0016459801","naverLink":"https://n.news.naver.com/mnews/article/001/0016459801","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"KT, 구글 AI·폰케어 결합한 '초이스 요금제' 신규 라인업 출시. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"서울의 음악, 유럽의 심장 브뤼셀을 울리다","link":"https://n.news.naver.com/mnews/article/016/0002726798","naverLink":"https://n.news.naver.com/mnews/article/016/0002726798","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"‘2026 서울·브뤼셀 뮤직 페스티벌’ 성황리 개최 K팝과 뮤지컬·재즈 어우러진 특별한 무대 춘향전 ‘사랑가’로 한국 전통음악의 멋 전달 서울 문화예술 세계화와 민간 국제교류 확대 지난 18일 벨기에 브뤼셀에서 열린 ‘2026 서울·브뤼셀 뮤직 페스티벌’에서 서울 뮤지션들과 현지 시민들이 기념촬영을 하고 있다. 양정원 기자 [헤럴드경제=양정원 기자] 유럽연합(EU)의 주요 기관이 자리한 벨기에 브뤼셀이 서울의 음악과 한국 전통문화로 물들었다. 세계 각국의 문화가 교차하는 유럽의 중심도시에서 한국 아티스트들이 K팝과 뮤지컬, 재즈를 아우르는 공연을 선보이고 현지 시민들이 한복과 한글, 판소리 등 한국 고유의 문화를 직접 체험하는 특별한 축제가 펼쳐졌다. 단순한 공연을 넘어 음악과 전통문화가 결합한 참여형 문화교류를 통해 서울의 문화예술적 역량과 한국문화의 다채로운 매력을 유럽 현지에 알리는 계기가 마련됐다는 평가다. 지난 18일 벨기에 브뤼셀에서 열린 ‘2026 서울·브뤼셀 뮤직 페스티벌(2026 Seoul & Brussels Music Festival)’은 한국의 현대음악과 전통문화가 조화를 이룬 복합문화축제로 진행됐다. 올해 처음 개최된 이번 행사는 서울시의 ‘2026년 민간국제문화교류 활성화 사업’의 일환으로 마련됐으며 서울시가 후원했다. 이번 페스티벌은 한국 대중음악의 세계적인 확산 흐름에 발맞춰 서울의 문화예술 콘텐츠를 유럽 현지에 소개하고, 음악을 매개로 양 도시 시민 간 문화적 공감대를 넓히기 위해 기획됐다. 특히 K팝 중심의 한류를 뮤지컬과 재즈, 판소리 등 다양한 장르로 확장하고, 관람객이 한국 전통문화를 직접 경험할 수 있도록 프로그램을 구성한 것이 특징이다. 서울을 대표해 참여한 뮤지션들은 뮤지컬의 대표적인 명곡으로 사랑받는 ‘지금 이 순간’을 비롯해 ‘오버 더 레인보우(Over the Rainbow)’, ‘댄싱퀸(Dancing Queen)’, ‘러빙 유 킵스 미 어라이브(Loving You Keeps Me Alive)’ 등을 열창했다. 세계적으로 친숙한 음악을 한국 아티스트 특유의 감성과 표현력으로 재해석한 무대는 언어와 국적을 넘어 관람객들이 음악으로 소통하는 시간을 만들어냈다. 한국 전통음악의 아름다움을 알리는 무대도 마련됐다. 아티스트들은 한국 고유의 멋을 담은 한복을 입고 고전소설 춘향전을 바탕으로 한 판소리 ‘사랑가’를 선보였다. 춘향과 이몽룡의 사랑을 노래하는 전통 선율과 장단은","category":"생활·문화"},{"title":"AI 시대에도 붓 가는 대로…페이스가 선택한 최연소 작가","link":"https://n.news.naver.com/mnews/article/310/0000141944","naverLink":"https://n.news.naver.com/mnews/article/310/0000141944","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"영국 화가 팸 에블린 아시아 첫 개인전 신작 20여 점 전시...종이 작업도 첫 공개 2027년 1월 9일까지 페이스갤러리 Portrait of Pam Evelyn, 2023. ⓒPhoto by Robert Glowacki, courtesy Pace Gallery 콘크리트 위로 번진 저녁노을, 고층 빌딩 유리창에 부딪혀 반사된 빛, 담벼락의 낙서…. 영국 화가 팸 에블린(Pam Evelyn·30)은 런던 도심에서 마주친 장면들을 그렸다. 선명한 유화 물감을 겹겹이 칠하고 긁어내기를 되풀이해 완성한 그의 추상화엔 강렬하고도 조각적인 매력이 있다. 에블린의 국내 첫 개인전 'The Wild Asphalt'가 서울 용산구 페이스갤러리에서 개막했다. 2019년 슬레이드 미술학교를 졸업하고, 2020년 왕립예술대학에서 회화로 석사 학위를 받으며 '엘리트 코스'를 밟아 온 에블린은 2023년 27세의 나이로 세계적 화랑인 페이스갤러리의 전속 작가가 됐다. 당시 갤러리 소속 최연소 아티스트로 화제에 올랐다. 이후 페이스 런던·뉴욕, 미국 댈러스 컨템포러리 미술관에서 개인전을 열었다. 이번 서울 전시가 아시아 첫 개인전이다. 지난 10일 갤러리에서 만난 작가는 키가 크고 팔이 길어 높이 3m가 넘는 거대한 캔버스에도 거뜬히 붓질할 기세였다. 신작 회화, 종이 작업 등 20여 점을 직접 설명하는 눈이 반짝거렸다. Pam Evelyn, Figure and Tower, 2026, oil on linen, 190 cm × 150 cm. ⓒPam Evelyn, courtesy Pace Gallery","category":"생활·문화"},{"title":"게임 경계 허문 '지스타'… 국내 주요 게임사 외면은 큰 숙제","link":"https://n.news.naver.com/mnews/article/014/0005607862","naverLink":"https://n.news.naver.com/mnews/article/014/0005607862","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"AI 전면에 내세우며 '외연 확장' 국내 빈자리 中·日 업체로 채워 게임 전시회 경쟁력 강화 관건 게임산업 성장 가능성은 보여줘 지난 19일 부산 해운대구 벡스코에서 열린 국내 최대 게임전시회 '지스타(G-STAR) 2026'에서 관람객들이 신작 게임을 즐기고 있다. 연합뉴스 【파이낸셜뉴스 부산=장민권 기자】국내 최대 게임전시회 '지스타 2026'이 나흘간 일정을 마무리했다. 사상 첫 AI 기업이 메인 스폰서를 맡은 이번 행사는 신작 중심의 전시에서 벗어나 AI 기반 콘텐츠 창작, 게임 지적재산(IP)의 활용, 다양한 산업과의 협업 등 게임산업의 새로운 성장 가능성을 보여줬다는 평가다. 다만 외연 확장이라는 성과와는 별개로 국내 주요 게임사들의 참여를 이끌어내 게임 전시회 본연의 경쟁력을 강화해야 한다는 과제도 남겼다. 22일 업계에 따르면 지난 19일 부산 벡스코에서 개막한 지스타 2026이 이날 막을 내렸다. 올해로 22회째를 맞은 지스타에는 41개국 1237개사가 참가해 총 3445부스 규모로 전시관을 꾸렸다. 올해 지스타의 가장 큰 변화는 AI의 전면 등장이다. AI 기업인 뤼튼테크놀로지스가 게임사가 아닌 기업으로는 처음으로 메인 스폰서를 맡아 AI 캐릭터 채팅 플랫폼 '크랙'을 선보였다. 크랙은 창작자가 설정한 세계관과 캐릭터를 바탕으로 이용자와 AI의 대화에 따라 이야기가 달라지는 서비스다. 200부스 규모의 전시관에 폭 40m의 대형 발광다이오드(LED) 스크린을 설치하고, 관람객이 AI 캐릭터와 대화하며 이야기를 만들어가는 체험 공간을 마련했다. 국내 대형 게임사들의 빈자리는 중국, 일본 등 해외 게임사들이 채웠다. 올해 처음 마련된 '지스타 글로벌 게임 쇼케이스'에 세가, 코에이 테크모 게임스, 캡콤, 넷이즈게임즈, CD 프로젝트 레드(CDPR) 등 5개 게임사가 참여해 글로벌 전시회로서 성장 가능성을 보여줬다. 호요버스의 '젠레스 존 제로' 체험 행사장에는 관람객이 몰리면서 대기열이 조기에 마감됐고, 캡콤 부스에서는 게임을 시연하기 위해 150분을 기다려야 한다는 안내판까지 등장했다. 현대자동차는 레이싱 시뮬레이션 기반 e스포츠 대회 '현대 N 버츄얼컵'을 통해 모빌리티와 게임을 결합한 체험을 선보였다. 역대 가장 많은 106곳의 국내외 인디게임 개발사들도 참여했다. 게임 시연 외에 개발자 강연과 창작자 대담 등 자체 기획 콘텐츠도 한층 다양해졌다. 신작을 보여주는 전시회에서 게임과 다른 콘텐","category":"생활·문화"}],"세계":[{"title":"외교·안보 수장 전면 교체, 이종석·정동영 '자주파' 퇴진…한미관계 개선 포석 관측","link":"https://n.news.naver.com/mnews/article/003/0014340594","naverLink":"https://n.news.naver.com/mnews/article/003/0014340594","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"이종석·정동영 동시 교체····한미 불협화음 해소 포석 관측 외교부 수장, 조현 이어 대미 외교통 임웅순 전면에 靑 \"국제 정세 변화에 대응…한미동맹·한반도 평화 일관되게 추진\" [서울=뉴시스] 조성봉 기자= 이재명 대통령이 20일 청와대에서 열린 수석보좌관회의에서 발언하고 있다. (청와대통신사진기자단) 2026.11.20. suncho21@newsis.com [서울=뉴시스] 김지은 김경록 기자 = 이재명 대통령이 23일 국가정보원과 외교·통일부 등 외교·안보 부처 수장을 전면 교체하는 2차 개각에 나선 것은 한미 관계 개선에 방점을 둔 것으로 풀이된다. 특히 한미 정보 당국 간 이상기류 빌미를 준 정동영 통일부 장관과 이종석 국가정보보원장 등 이른바 '자주파' 인사를 교체한 것은 한미 동맹 불협화음을 의식한 것이라는 해석이 나온다. 임광현 대통령비서실장은 이날 오후 춘추관에서 브리핑을 열고 이 대통령이 신임 국정원장 후보자에 강금실 전 법무부 장관, 외교부 장관 후보자에 임웅순 국가안보실 제2차장, 통일부 장관 후보자에 홍익표 전 청와대 정무수석을 지명했다고 발표했다. 무엇보다 이른바 '자주파'로 꼽히는 이 국정원장과 정 장관을 동시에 교체했다는 점이 눈에 띈다. 이는 지난 3월 정 장관의 '북한 구성 핵시설' 발언 이후 미국의 대북 정보 공유 제한이 이어지는 상황과 무관치 않다는 분석이 나온다. 야당은 물론 여권 일각에서도 미국의 대북 정보 제공 제한과 비자 발급 거부 사태가 잇따르면서 한·미 동맹 균열의 책임을 지고 이들을 경질해야 한다는 요구가 제기되기도 했다. 이와 함께 북한이 남북을 '적대적 두 국가'로 규정한 후 대화 재개의 실마리가 보이지 않는 점도 이 대통령 판단에 영향을 미쳤다는 평가다. 지난 18∼19일 아시아태평양경제협력체(APEC) 정상회의를 계기로 추진됐던 북미 정상회담도 도널드 트럼프 미국 대통령의 관심이 미·중·러 3자 정상회담에 쏠리며 불씨를 살리지 못했다. 이 대통령은 국정원장 후임자로 강금실 전 법무장관을 발탁했다. 강 후보자는 2021년 대선에서 이재명 당시 더불어민주당 후보의 후원회장을 맡았고, 지난해 대선을 앞두고 민주당 총괄선거대책위원장을 지냈다. 강금실 후보자가 임명되면 1961년 중앙정보부 창설 이후 첫 여성 정보기관장이 된다. 임 실장은 강 후보자에 대해 \" 개혁적 판사 출신으로 여성 최초 법무부 장관을 역임하며 검찰 개혁을 이끌었고 외교부 여성인권대사 등을 통해","category":"세계"},{"title":"카카오, 모빌리티 미국 상장 두고 사모펀드와 1.5조 분쟁","link":"https://n.news.naver.com/mnews/article/469/0000967293","naverLink":"https://n.news.naver.com/mnews/article/469/0000967293","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"모빌리티 2대 주주인 사모펀드 TPG 지분 유동화 위해 美 ADR 상장 추진 일반주주 이익 감안한 이사회 제동에 국제중재법원에 대규모 손해배상 청구 3월 31일 오후 11시 30분쯤 서울지하철 3호선 매봉역 인근에서 호출한 카카오모빌리티의 '강남 심야 자율주행 택시'가 정차해 있다. 카카오모빌리티 제공 카카오모빌리티의 미국 증시 상장을 반대했던 카카오가 사모펀드로부터 국제중재법원에서 1조5,000억 원 규모의 손해배상 청구를 받았다. 카카오는 카카오모빌리티 2대 주주인 사모펀드 TPG가 국제상업회의소(ICC) 국제중재법원에 손해배상 등의 청구를 제기했다고 23일 공시에서 밝혔다. TPG는 카카오가 주주 간 계약 및 합의서에 기반한 의무를 지키지 않았다며, 계약 위반에 따른 벌칙금(위약벌) 및 손해배상으로 1조5,000억 원을 청구했다. TPG는 10월 29일 ICC에 중재를 신청했고, 카카오는 10일 ICC 사무국으로부터 중재 신청서를 전달받았다. TPG는 ICC 사무국 요청에 따라 20일 전체 청구의 금전적 가치를 1조5,000억 원 이상으로 추산해 통지했다. 공시에 따르면 TPG는 카카오가 TPG와 체결한 카카오모빌리티의 미국 주식예탁증서(ADR) 상장 추진 의무를 저버렸다고 주장하고 있다. TPG는 투자금 회수를 위해 카카오모빌리티에 자사가 과반 의석을 보유한 '주주 가치 제고 위원회'를 두고, 자사 지분을 기초로 한 ADR 상장을 추진했었다. 카카오모빌리티는 7월 2일 미국 증권거래위원회(SEC)에 상장 공모 관련 신청서를 비공개로 제출하기도 했다. 하지만 이런 상장 움직임은 카카오 이사회에 의해 제동이 걸렸다. 카카오는 이사회가 ADR 상장 추진에 반대하기로 결의했다고 9월 22일 밝혔다. ADR 상장이 기존 카카오 일반 주주의 이익에 부합하지 않는단 이유였다. 당시 카카오 이사회는 \"특정 투자자의 주식 유동화를 중심으로 구성돼 일반 주주의 경제적 이익으로 환원된다고 평가하기 어렵다\"며 \"당사와 카카오모빌리티 간 투자 수요 분산 등이 우려된다\"고 밝혔다. 카카오는 향후 중재 절차에서 TPG 측 주장에 적극 대응하겠다고 밝혔다. 1조5,000억 원의 청구 금액에 대해서도 \"TPG가 일방적으로 산정한 추산 금액\"이라며 다투겠다는 게 회사 측 입장이다.","category":"세계"},{"title":"화석연료 놓고 끝내 갈라졌다…31차 기후총회 합의 무산 [COP31 현장]","link":"https://n.news.naver.com/mnews/article/421/0009303718","naverLink":"https://n.news.naver.com/mnews/article/421/0009303718","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"화석연료 놓고 끝내 갈라졌다…31차 기후총회 합의 무산 [COP31 현장]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"합의는 더디고 기후위기는 빨라지고…COP31이 드러낸 기후협상 한계","link":"https://n.news.naver.com/mnews/article/014/0005608451","naverLink":"https://n.news.naver.com/mnews/article/014/0005608451","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"합의는 더디고 기후위기는 빨라지고…COP31이 드러낸 기후협상 한계. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"NORTH MACEDONIA NIGHT SKY","link":"https://n.news.naver.com/mnews/article/091/0010375635","naverLink":"https://n.news.naver.com/mnews/article/091/0010375635","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Star trails over Jakupica mountain range in North Macedonia A composite of 320 stacked long-exposure photographs shows star trails and aircraft light trails across the night sky above the Karadzica mountain hut in the Jakupica mountain range, approximately 40 km south of Skopje, in Studenicani municipality, North Macedonia, 21 November 2026 (issued 22 November 2026). EPA/GEORGI LICOVSKI","category":"세계"},{"title":"Portugal MotoGP Motorcycle Racing","link":"https://n.news.naver.com/mnews/article/077/0007246411","naverLink":"https://n.news.naver.com/mnews/article/077/0007246411","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Portugal MotoGP Motorcycle Racing MotoGP rider Marc Marquez, of Spain, poses after finishing the Portugal Motorcycle Grand Prix to win the world championship, at the Algarve International circuit near Portimao, Portugal, Sunday, Nov. 22, 2026. (AP Photo/Jose Breton)","category":"세계"},{"title":"SWITZERLAND CHESS","link":"https://n.news.naver.com/mnews/article/091/0010375634","naverLink":"https://n.news.naver.com/mnews/article/091/0010375634","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"FIDE World Chess Championship - press conference The grandmaster Javokhir Sindarov of Uzbekistan, left, and grandmaster Gukesh Dommaraju of India, right, shakes hands during a press conference at the European headquarters of the United Nations ahead the FIDE World Chess Championship between grandmasters Gukesh Dommaraju of India and Javokhir Sindarov of Uzbekistan in Geneva, Switzerland, 22 November 2026. EPA/SALVATORE DI NOLFI","category":"세계"},{"title":"POLAND INCIDENT SECURITY","link":"https://n.news.naver.com/mnews/article/091/0010375633","naverLink":"https://n.news.naver.com/mnews/article/091/0010375633","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Polish authorities investigate unidentified object crash near Ukraine border An aerial photograph taken with a drone shows the site where an unidentified flying object crashed in a field in Nowy Lipowiec, Poland, 22 November 2026. The Operational Command of the Polish Armed Forces (DORSZ) reported a violation of Polish airspace on 20 November during overnight Russian airstrikes on western Ukraine. Polish prosecutors and Military Police completed their examination of the crash site on 21 November, recovering and securing fragments of the object and forensic evidence. A prosecutor's office spokesperson said the crater was significantly smaller than the one left by a Russian Kh-101 cruise missile that crashed in Tarnawa-Kolonia on 30 July. EPA/WOJTEK JARGILO POLAND OUT","category":"세계"},{"title":"ITALY SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010375625","naverLink":"https://n.news.naver.com/mnews/article/091/0010375625","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Serie A - Juventus FC vs Venezia FC Juventus' Teun Koopmeiners celebrates a goal goal during the Italian Serie A soccer match Juventus FC vs Venezia FC at the Allianz Stadium Stadium in Turin, Italy, 22 November 2026. EPA/ALESSANDRO DI MARCO","category":"세계"},{"title":"Climate COP31 Turkey","link":"https://n.news.naver.com/mnews/article/077/0007246406","naverLink":"https://n.news.naver.com/mnews/article/077/0007246406","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Climate COP31 Turkey Samira Nawa, Denmark's minister for climate, energy and utilities, speaks outside a plenary session at the COP31 U.N. Climate Summit, Sunday, Nov. 22, 2026, in Antalya, Turkey. (AP Photo/Khalil Hamra)","category":"세계"}],"IT 과학":[{"title":"3년 만에 수능 17→100점… 진화한 AI ‘커닝 비즈니스’ 탄생시켜","link":"https://n.news.naver.com/mnews/article/005/0001886710","naverLink":"https://n.news.naver.com/mnews/article/005/0001886710","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"[흔들린 공정, 기로에 선 시험] AI기술이 무너뜨린 시험의 공정 서울 노원구 강북청솔학원에서 22일 열린 ‘2027학년도 대학수학능력시험 가채점 분석 설명회’에서 한 학부모가 가채점 점수로 예상되는 정시 배치 참고표를 살펴보고 있다. 뉴시스 인공지능(AI) 기술이 발전하면서 곳곳에서 시험의 공정성이 훼손되고 있다. 과거부터 커닝을 통한 부정행위는 있었지만 AI가 단계별 조력자 역할을 대체하면서 더 광범위하고 빠른 속도로 부정행위가 확산되고 있다. 전문가들은 AI 기술이 급속도로 발전한 2024년부터 AI 정답률이 덩달아 높아지면서 실제 부정행위에 활용된 사례가 늘었을 것으로 추정한다. 외부 조력을 통한 커닝은 대부분 시험지를 촬영해 이를 전송하고 외부에서 정답을 찾아 다시 수험생에게 답안을 전송하는 구조다. 2004년 대학수학능력시험 때 광주에서는 ‘선수’ ‘도우미’ ‘일반 수험생’ 집단으로 구성된 부정행위자 159명이 적발되는 일이 있었다. 휴대전화 수십대를 준비한 뒤 선수 집단이 고사장에 들어가 도우미 집단에 정답 신호를 메시지 형태로 보내는 방식이었다. 도우미들은 이 정답을 휴대전화로 일반 수험생 집단에 보냈다. 그러나 AI 기술은 외부 조력자가 충분치 않아도 부정행위를 할 수 있도록 커닝의 문턱을 대폭 낮췄다. 초창기 기술을 활용한 풀이 방식에는 2014년 출시된 수학 풀이 앱 ‘포토매스’가 있다. 카메라로 수학 문제를 비추면 광학 문자인식(OCR) 기능으로 풀이 과정과 정답을 보여주는 형식이었다. 당시 포토매스는 단순 수학 풀이에는 유용했지만 복잡한 문제에서는 한계를 보였다. 이후 포토매스는 2016년과 2018년 딥러닝 AI 기술을 장착하면서 손글씨를 인식하고, 복잡한 문제 풀이를 지원하면서 진화했다. 그러다 2022년 오픈AI가 생성형 AI인 ‘챗GPT’를 처음 공개하면서 판도를 뒤흔들었다. 다만 당시에는 여전히 복잡한 도형이나 까다로운 수식에 있어서는 오류가 잦았고 오답률도 높았다.","category":"IT 과학"},{"title":"한투운용, 토스뱅크서 나스닥·반도체 펀드 단독 판매","link":"https://n.news.naver.com/mnews/article/014/0005608702","naverLink":"https://n.news.naver.com/mnews/article/014/0005608702","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"한국투자신탁운용 제공 [파이낸셜뉴스] 한국투자신탁운용이 토스뱅크를 통해 미국 나스닥100과 글로벌 반도체에 투자하는 공모펀드 2종을 단독 판매한다. 두 상품 모두 해외주식형 펀드지만 환매 신청 후 2영업일 만에 환매대금을 받을 수 있도록 유동성을 높였다. 한국투자신탁운용은 토스뱅크에서 '한국투자미국나스닥100 펀드'와 '한국투자글로벌반도체탑픽 펀드(UH)'를 단독 판매하고 있다고 24일 밝혔다. 한국투자미국나스닥100 펀드는 미국 나스닥100지수를 추종하는 환노출형 인덱스 펀드다. 토스뱅크에서는 '나스닥 100 따라가기'라는 이름으로 안내된다. 한국투자글로벌반도체탑픽 펀드(UH)는 글로벌 반도체 기업에 투자하는 상품이다. 리서치와 인공지능(AI) 기반 종목 평가를 거쳐 운용 매니저가 최종 편입 종목을 결정한다. AI 연산과 파운드리, 고성능 메모리 등 반도체 세부 분야별 투자 비중도 시장 상황에 맞춰 조정한다. 두 상품은 해외주식형 펀드임에도 오후 5시 이전 환매를 신청하면 2영업일 뒤 환매대금을 받을 수 있다. 오후 5시 이후 신청하면 3영업일 뒤 지급된다. 금에 투자하는 '한국투자금모으기 펀드'도 토스뱅크에서 판매한다. KRX 금 현물지수를 벤치마크로 삼아 금 현물과 금 현물형 상장지수펀드(ETF)로 포트폴리오를 구성한 상품으로, 토스뱅크에서는 '소액으로 금 모으기'라는 이름으로 안내된다. 해당 상품은 하나증권에서도 가입할 수 있다. 이우상 한국투자신탁운용 WM플랫폼부장은 \"나스닥100과 글로벌 반도체, 금 투자 상품까지 토스뱅크에서 한 번에 투자할 수 있다\"며 \"빠른 환매주기로 투자 편의성을 높인 펀드를 토스뱅크를 통해 편리하게 투자할 수 있기를 바란다\"고 말했다.","category":"IT 과학"},{"title":"안양시, AI 중장기 전략 수립 착수","link":"https://n.news.naver.com/mnews/article/011/0004685419","naverLink":"https://n.news.naver.com/mnews/article/011/0004685419","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"2027~2029년 종합계획 마련 피지컬 AI·데이터 기반 도시 전략 20일 오후 안양시 스마트도시통합센터에서 열린 안양시 인공지능 기본 및 종합계획 수립 용역 착수 보고회에서 참석자들이 보고를 듣고 있다. 사진제공 = 안양시 안양시가 인공지능(AI) 정책을 체계적으로 추진하기 위한 중장기 계획 수립에 들어갔다. 안양시는 24일 ‘인공지능 기본 및 종합계획 수립 용역’에 착수했다고 밝혔다. 이번 용역은 인공지능기본법에 맞춰 2027년부터 2029년까지 적용할 3개년 계획을 마련하기 위한 것이다. 시는 최근 스마트도시통합센터에서 착수 보고회를 열었다. 보고회에는 안양시 인공지능위원회와 민관협치위원회 위원, 시의원, 관계자 등 17명이 참석했다. 참석자들은 용역 추진 방향과 과업 범위를 공유하고, 계획의 실효성을 높이기 위한 의견을 제시했다. 위원들은 용역 초기 단계부터 자문에 참여한다. 시는 이들의 의견을 반영해 현장성과 실행력을 갖춘 계획을 수립할 방침이다. 용역은 국내외 AI 기술과 정책 흐름을 분석하고, 안양시의 여건을 진단하는 방식으로 진행된다. 이를 바탕으로 시 특성에 맞는 비전과 추진 전략을 도출한다. 특히 시는 AI와 데이터 기술 발전, 피지컬 AI 확산에 대응할 전략을 계획에 담기로 했다. 산·학·연·관 자원을 연계한 산업 생태계 조성 방안도 주요 내용으로 검토된다. 주요 과업은 AI 정책·기술 동향 분석, AI 활용 수요 조사, 추진 과제 발굴, 단계별 실행 로드맵 마련 등이다. 피지컬 AI 협력 클러스터 조성, 데이터 활용 체계 구축, 윤리·보안 거버넌스 마련도 포함된다. 시는 2027년 1월 중간 보고회를 열고, 같은 해 5월 최종 용역 결과를 확정할 계획이다. 시 관계자는 “이번 용역은 AI 기반 스마트도시 안양의 역량을 높이기 위한 청사진”이라며 “전문가와 위원회 의견을 반영해 시민이 체감할 수 있는 계획을 만들겠다”고 말했다.","category":"IT 과학"},{"title":"Britain Women's Super League Soccer","link":"https://n.news.naver.com/mnews/article/077/0007246415","naverLink":"https://n.news.naver.com/mnews/article/077/0007246415","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"Britain Women's Super League Soccer Arsenal's Smilla Holmberg, left, and West Ham United's Viviane Asseyi battle for the ball during the Women's Super League soccer match between Arsenal and West Ham United in London, Sunday, Nov. 22, 2026. (John Walton/PA via AP) UNITED KINGDOM OUT; NO SALES; NO ARCHIVE; PHOTOGRAPH MAY NOT BE STORED OR USED FOR MORE THAN 14 DAYS AFTER THE DAY OF TRANSMISSION; MANDATORY CREDIT","category":"IT 과학"},{"title":"Britain Premier League Soccer","link":"https://n.news.naver.com/mnews/article/077/0007246412","naverLink":"ht 감회의 승인을 거쳐 신용융자거래 증거금 비율 등을 조정한다\"고 공지했다. 이번 조정으로 이론적으로 4000억위안(약 80조7000억원)에 가까운 신규 자금이 유입될 수 있다는 추산도 나왔다고 신화통신은 전했다. 상하이·선전·베이징 증권거래소는 지난 1월 당시 시장 상황을 고려해 신용융자거래 증거금 비율을 80%에서 100%로 인상한 바 있다. 과도한 차입 투자를 억제하기 위해 증거금 비율을 높였지만 최근 신용매수 거래가 위축되자 이를 다시 낮추기로 한 것으로 풀이된다. 제일재경은 \"이는 시장 흐름에 따라 레버리지 위험이 누적되는 것을 완화하고 투자자의 합리적인 거래를 촉진하는 데 긍정적인 역할을 했다\"고 전했다. 그러면서 \"최근 신용매수 거래가 뚜렷하게 위축됐고 전반적인 레버리지 수준도 높지 않다\"며 \"증거금 비율을 적절히 낮추면 레버리지 비율을 적정 수준으로 높이고 신용매수 여력을 확대하며 시장에 유동성을 공급하는데 도움이 돼 시장의 장기적이고 안정적이며 건전한 발전을 촉진할 수 있다\"고 했다. 한편, 중국 본토와 홍콩의 주요 기술주도 최근 약세를 보이고 있다. 블룸버그통신에 따르면 중국 선전증권거래소 창업판지수와 상하이증권거래소 과창판50지수, 홍콩 항셍테크지수에 편입된 종목들의 시가총액은 지난 6월 말 이후 1조7000억 달러(약 2289조원) 감소했다.","category":"IT 과학"},{"title":"TAIWAN ENTERTAINMENT","link":"https://n.news.naver.com/mnews/article/091/0010375623","naverLink":"https://n.news.naver.com/mnews/article/091/0010375623","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"63rd Golden Horse Awards in Taipei Taiwanese director Joseph Hsu Chen-chieh celebrates winning the Best Director award for the movie 'Double Happiness' during the 63rd Golden Horse Awards in Taipei, Taiwan, 22 November 2026. EPA/RITCHIE B. TONGO","category":"IT 과학"},{"title":"\"中 기술주, 시총 2300조원 증발\"… 당국, 신용거래 규제 완화","link":"https://n.news.naver.com/mnews/article/469/0000967089","naverLink":"https://n.news.naver.com/mnews/article/469/0000967089","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"창업판 올해 들어 31% 하락 항셍테크는 2년 만에 최저 기록 30일부터 융자 증거금률 100%→80% 중국 상하이 루자쭈이 금융지구에서 3월 2일 보행자들이 육교를 건너는 가운데 전광판에 상하이 증시 지수가 표시돼 있다. 상하이=로이터 연합뉴스 중국 본토와 홍콩의 주요 기술주 지수 세 곳에 편입된 종목들의 시가총액이 6월 말 이후 1조7,000억 달러(약 2,290조 원) 줄었다는 집계가 나왔다. 중국 당국은 증시 안정을 위해 올해 1월 높였던 주식 신용거래 문턱을 10개월 만에 다시 낮추기로 했다. 블룸버그통신은 22일(현지시간) 6월 30일 종가와 비교해 선전거래소의 기술·성장주 시장을 대표하는 창업판 지수가 49.1%, 반도체 기업 비중이 큰 상하이 과창판50 지수는 44.2% 떨어졌다며 이같이 보도했다. 알리바바와 텐센트 등 홍콩에 상장된 대형 기술주로 구성된 항셍테크 지수는 2년 만에 최저 수준으로 밀렸다. 올여름 사상 최고치를 찍었던 창업판 지수는 연초와 비교해도 31% 낮다. 상하이종합지수도 앞서 20일 3,533.79로 마감해 종가 기준 지난해 7월 이후 최저치를 기록했다. 지난해 스타트업 딥시크의 등장으로 커졌던 '저비용 중국산 인공지능(AI)'에 대한 기대가 시험대에 올랐다는 게 블룸버그의 분석이다. 앞서 미국 상무부는 16일 중국 기업에 일정 규모 이상의 연산 능력을 제공하는 해외 데이터센터에 첨단 AI 칩을 공급하려면 허가를 받도록 하는 규정을 발표했다. 자산운용사 애버딘 인베스트먼츠의 부시 추 중국 주식 투자 책임자는 블룸버그에 \"AI 관련 설비 투자 둔화, 미중 공급망 사업의 지속가능성 여부 등에 대해 투자자들이 우려하고 있다\"고 말했다. 중국 당국은 증시 부양에 나섰다. 이날 중국중앙TV(CCTV)는 증권감독관리위원회(증감회)를 인용해 상하이·선전·베이징 증권거래소가 오는 30일부터 주식 신용매수에 적용하는 최저 증거금률을 100%에서 80%로 낮춘다고 보도했다. 지금은 증거금 100만 위안을 내면 100만 위안까지 빌릴 수 있지만, 앞으로는 125만 위안까지 빌려 주식을 살 수 있다. 당국은 이론상 4,000억 위안(약 80조6,000억 원)에 가까운 추가 매수 여력이 생길 것으로 추산했다. 상하이·선전거래소는 거래 수수료도 내리기로 했다. 선전거래소는 증권사가 사고파는 가격을 계속 제시해 거래를 돕는 '시장조성자' 제도를 창업판에 도입하기 위한 의견 수렴에도 착수했다.","category":"IT 과학"}]},"popular":[]}}}; // UPDATED_AUTOMATICALLY_BY_NEWS_WORKFLOW

function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}

function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}

 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);
 return seoulDateKey(d);
}

function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
