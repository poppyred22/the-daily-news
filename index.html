.","category":"사건 사고"},{"title":"‘여성 학대 의혹’ 카광 출국금지…“약자 괴롭힐수록 돈 되는 구조 없애야”","link":"https://n.news.naver.com/mnews/article/018/0006405408","naverLink":"https://n.news.naver.com/mnews/article/018/0006405408","pubDate":"2026-11-07T00:22:56.598740+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"}],"사회":[{"title":"119 구급차에서 태어난 31주 미숙아 살려낸 '50일의 기적'","link":"https://n.news.naver.com/mnews/article/654/0000209848","naverLink":"https://n.news.naver.com/mnews/article/654/0000209848","pubDate":"2026-11-07T00:23:53.454685+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"\"밤 10시 넘으면 씻지도 말라고?\"…아파트 공지문에 엇갈린 반응","link":"https://n.news.naver.com/mnews/article/003/0014307370","naverLink":"https://n.news.naver.com/mnews/article/003/0014307370","pubDate":"2026-11-07T00:23:53.454679+09:00","author":"네이버뉴스","description":"아파트에서 밤 10시 이후 세탁·샤워 등 생활 소음을 자제해 달라는 공지문이 게시돼 온라인에서 논쟁이 일었다. 공동주택의 층간소음 배려가 필요하다는 의견과 일상적인 생활까지 제한하는 것은 지나치다는 반응이 엇갈렸다.","category":"사회"},{"title":"\"천국 가려면 굶어야\"…어린이 190명 굶겨 죽인 사이비 교주 '징역 200년'","link":"https://n.news.naver.com/mnews/article/088/0001038899","naverLink":"https://n.news.naver.com/mnews/article/088/0001038899","pubDate":"2026-11-07T00:23:53.454677+09:00","author":"네이버뉴스","description":"종교 지도자가 신도들에게 극단적인 금식을 강요해 다수의 사망자가 발생한 사건의 재판 결과를 다룬다.\n법원은 지도자의 책임을 인정해 중형을 선고했다.\n종교를 악용한 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"사회"},{"title":"이혼해 강남아파트 받은 아내…“위장 이혼이지?” 美서 날벼락, “아파트 돌려줘!” 소송까지","link":"https://n.news.naver.com/mnews/article/016/0002720134","naverLink":"https://n.news.naver.com/mnews/article/016/0002720134","pubDate":"2026-11-07T00:23:53.454676+09:00","author":"네이버뉴스","description":"이혼 과정에서 이전된 부동산을 둘러싸고 미국에서 반환 소송이 제기됐다는 내용이다.\n당사자들이 재산 이전의 성격과 당시 합의 내용을 두고 다투는 것으로 전해졌다.\n법원이 이혼과 재산 분할의 실질을 어떻게 판단할지가 관심사다.","category":"사회"},{"title":"구급차서 태어난 31주 미숙아…구급대원 덕에 살았다","link":"https://n.news.naver.com/mnews/article/009/0005760299","naverLink":"https://n.news.naver.com/mnews/article/009/0005760299","pubDate":"2026-11-07T00:23:53.454655+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"李대통령과 '오랜 인연' 이용철 법무장관 후보자, 공소취소 입장은?","link":"https://n.news.naver.com/mnews/article/022/0004173158","naverLink":"https://n.news.naver.com/mnews/article/022/0004173158","pubDate":"2026-11-07T00:23:53.454652+09:00","author":"네이버뉴스","description":"성남시장 인수위원·성남산업진흥재단 대표 출신 6일 법무부 장관 후보자로 지명된 이용철(66·사진) 방위사업청장은 이재명 대통령과 오랜 인연을 이어온 인사로, 향후 인사청문 과정에서 이 대통령의 형사 사건 공소취소에 대해 어떤 입장인지 등을 집중 추궁받을 것으로 전망된다. 법조계에 따르면 이 후보자는 이 후보자는 과거 이 대통령이 대표변호사로 있던 법무법인 새길에서 변호사로 일했고, 2010년 이 대통령이 경기 성남시장에 당선된 뒤에는 인수위원회에도 참여했다. 이듬해 7월에는 성남산업진흥재단 대표이사가 됐다. 민주사회를 위한 변호사모임, 경제정의실천시민연합 등 시민사회 활동에도 활발히 참여한 것으로 알려졌다. 이재명 대통령, 이용철 방위사업청장(왼쪽부터). 뉴시스 1960년 전북 순창에서 태어난 그는 전주 신흥고와 연세대 법대를 졸업한 뒤 31회 사법시험에 합격했고, 사법연수원을 21기로 수료했다. 참여정부 시절엔 청와대 민정2비서관과 법무비서관을 지냈다. 2005년엔 국무총리 산하 국방획득제도개선단 단장을 맡아 방위사업청 출범을 준비하기도 했고, 방위사업청 개청준비단 부단장에 이어 2006년 개청 당시 초대 차장을 맡았다. 이재명정부 출범 후인 지난해 11월 방위사업청장에 발탁됐다. 이 후보자가 국회 인사청문회 등을 거쳐 임명된다면 이재명정부 두 번째 법무장관이 된다. 현 정부 초대 법무장관인 정성호 전 장관의 후임으로 낙점됐던 더불어민주당 김승원 의원은 지명된 뒤 잇단 논란 끝에 후보자직을 자진 사퇴했다. 이날 이 후보자 지명은 김 의원이 낙마한 지 48일만이다. 야권은 이 대통령과 이 후보자의 오랜 인연을 토대로 향후 청문 과정에서 공소취소에 대한 후보자의 입장과 공소취소에 지시 또는 관여할 의사가 있는지 등을 집중적으로 캐물을 것으로 보인다. 이 대통령은 여러 형사 사건으로 재판받던 중 대통령에 당선돼 심리가 중지된 상태로, 이 사건들에 대한 공소취소 문제가 정치권과 법조계의 최대 이슈로 떠올랐다. 여권은 이 대통령 사건을 비롯해 과거 검찰의 수사와 기소에 문제가 있다며 국정조사를 실시한 데 이어 일명 ‘조작기소 특별검사법’의 국회 본회의 통과까지 밀어붙였다. 이 후보자가 대장동 개발사업에 관여됐다는 의혹도 다시 쟁점이 될 수 있다. 이 후보자는 2010년 10월 대장동 사업의 핵심 인물인 유동규씨가 성남시 시설관리공단에 임용될 당시 임원추천위원으로 참여했다. 야권 일각에서는 이 후보자가 유 전 본부장에게","category":"사회"},{"title":"“의사 선생님, 집도 드릴게요” 77억 들여 숙소까지 지은 농어촌…의사 구하기 얼마나 힘들길래","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-07T00:23:53.454643+09:00","author":"네이버뉴스","description":"의료 인력을 구하기 어려운 농어촌 지역이 의사 유치를 위해 주거 지원책을 마련했다는 기사다.\n숙소 조성에 큰 예산을 투입해 근무 여건을 개선하려는 시도가 소개됐다.\n지역 의료 공백을 줄이는 데 실제로 도움이 될지가 과제로 남는다.","category":"사회"},{"title":"일반인 목졸라 중상 입힌 '조폭' 출신 유튜버…예상 처벌 수위는","link":"https://n.news.naver.com/mnews/article/003/0014307414","naverLink":"https://n.news.naver.com/mnews/article/003/0014307414","pubDate":"2026-11-07T00:23:53.454642+09:00","author":"네이버뉴스","description":"수사기관 \"대본에 따른 연출된 촬영\" 주장 안 받아들여 변호사 \"12주 중상…주동자 징역 1년6개월 안팎 실형 예상\" 사진 JTBC 뉴스 영상 캡처 *재판매 및 DB 금지 [서울=뉴시스]이준형 인턴 기자 = 유튜브 생방송 중 일반인 출연자에게 위험한 격투기 기술을 걸어 기절시키고 중상을 입힌 전직 조폭 출신 유튜버가 검찰에 송치됐다. 이에 주동자는 징역 1년 이상, 공범은 징역 1년 6개월 안팎의 실형을 선고받을 것이라는 법조인의 분석이 나왔다. 3일 조기현 법무법인대한중앙 대표변호사는 공식 유튜브 채널을 통해 해당 사건의 수사 경과와 향후 처벌 수위를 전망했다. 조 변호사는 \"종합격투기 선수 출신 유튜버인 주동자가 피해자에게 전치 12주의 중상을 입힌 혐의(상해죄)로 불구속 송치됐다\"며 \"사건 이후 피해자와 합의를 진행해 법원이 구속영장을 기각했으나, 경찰은 추가 수사를 마무리하고 최근 사건을 검찰에 넘겼다\"고 밝혔다. 이 사건은 당초 '대본에 따른 연출된 촬영'이었다는 주장이 제기되었으나, 수사 기관은 이를 받아들이지 않았다. 조 변호사는 \"애초에 합의된 수준을 벗어나는 과도한 물리력이 행사됐고, 피해자가 촬영을 주저하며 거부했음에도 촬영을 강요해 결과적으로 12주의 중상을 입혔다\"며 \"사고 후 합의가 이뤄졌더라도 그냥 넘길 수 없는 사안\"이라고 설명했다. 함께 송치된 공범의 경우, 상해 방조 및 공동강요 혐의가 적용됐다. 조 변호사는 \"공범 역시 대본대로 촬영하자며 주저하는 피해자를 강요한 혐의가 인정되어 송치됐다\"고 덧붙였다. 향후 예상되는 처벌 수위에 대해서는 엄중한 실형 가능성을 제기했다. 조 변호사는 공범에 대해 \"이 사건과 별개로 이미 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며 \"이번 사건의 유죄 판결이 더해질 경우 경합범 가중 등을 고려해 총 징역 1년 6개월 안팎의 실형이 선고될 것으로 보인다\"고 내다봤다. 주동자에 대해서는 \"피해자와 합의를 거쳤다는 점이 양형에 유리한 요소로 작용해 예상 형량이 다소 줄어들 수는 있다\"면서도 \"합의가 감형 요소로 크게 작용하더라도 전치 12주의 중상해를 입힌 만큼 징역 1년 이상의 실형 선고를 피하기 어려울 것\"이라고 분석했다. 마지막으로 조 변호사는 \"피해자와의 합의가 배상을 위해 양형에 일정 부분 반영되는 것은 불가피하지만, 이번 사건은 위력을 동원한 강요와 중상해가 발생한 만큼 향후 검찰 기소와 법원의 재판 과","category":"사회"},{"title":"이원석 전 검찰총장 \"위헌·위법 특검 그만둬야\"‥현직 검사들도 반발","link":"https://n.news.naver.com/mnews/article/214/0001533901","naverLink":"https://n.news.naver.com/mnews/article/214/0001533901","pubDate":"2026-11-07T00:23:53.454619+09:00","author":"네이버뉴스","description":"이원석 전 검찰총장 \"위헌·위법 특검 그만둬야\"‥현직 검사들도 반발. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"경기도교육청, 국회서 교권보호 3법 개정 촉구","link":"https://n.news.naver.com/mnews/article/421/0009274929","naverLink":"https://n.news.naver.com/mnews/article/421/0009274929","pubDate":"2026-11-07T00:22:56.598729+09:00","author":"네이버뉴스","description":"경기도교육청, 국회서 교권보호 3법 개정 촉구. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활":[{"title":"임신 중 출혈 30대 산모…구급차서 31주차 아기 출산, 생명 구했다","link":"https://n.news.naver.com/mnews/article/015/0005351317","naverLink":"https://n.news.naver.com/mnews/article/015/0005351317","pubDate":"2026-11-07T00:23:55.654939+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"생활"},{"title":"“나이 들고 신경 쓰이는 것 있다”… 성시경도 못 피한 ‘무릎 건강 악화’","link":"https://n.news.naver.com/mnews/article/346/0000118519","naverLink":"https://n.news.naver.com/mnews/article/346/0000118519","pubDate":"2026-11-07T00:23:55.654937+09:00","author":"네이버뉴스","description":"[스타의 건강] 나이 들수록 하체 근력 감소… 무릎 부담 커져 스쿼트 등 근력운동 도움, 격한 운동은 주의 가수 성시경(47)이 나이가 들면서 무릎 건강을 신경 쓰게 됐다고 밝혔다./사진 = 유튜브 채널 ‘들어봐! 유리의 숲’ 캡처 나이가 들수록 근육량과 근력이 감소해 무릎 관절을 지지하는 힘이 약해질 수 있다. 최근 가수 성시경(47)이 나이가 들면서 무릎 건강을 신경 쓰게 됐다고 밝혔다. 지난달 30일 공개된 유튜브 채널 ‘유리의 숲’에서 성시경은 예전보다 성격이 부드러워진 것 같다고 말했다. 그는 “힘이 좀 빠지는 것 같다”며 “경험이 쌓이고 이것저것을 잃어가면서, 무릎 건강이라든가”라고 했다. 그는 이어 “격한 운동을 좋아하는데 이제 조금 조심해야 하는구나 싶다”며 나이가 들면서 느끼는 변화를 전했다. 나이가 들면 근육량과 근력이 점차 감소한다. 특히 허벅지 앞쪽의 대퇴사두근은 무릎 관절을 안정적으로 지지하고 움직임을 조절하는 역할을 한다. 이 근육이 약해지면 걷거나 계단을 오르내릴 때 무릎에 가해지는 부담이 커질 수 있다. 무릎 건강을 유지하려면 관절 주변 근육을 꾸준히 강화하는 것이 좋다. 대표적인 운동으로는 스쿼트, 의자에서 앉았다 일어나기, 계단 오르기 등이 있다. 스쿼트는 허벅지와 엉덩이 근육을 강화해 무릎 관절의 안정성을 높이는 데 도움이 된다. 다만 무릎 통증이 있거나 근력이 약한 사람은 의자에서 천천히 앉았다 일어나는 동작부터 시작하는 것이 좋다. 실제 하체 근력운동이 무릎 건강에 도움이 된다는 연구 결과도 있다. 2026년 국제학술지 ‘건강 과학 보고서(Health Science Reports)’에 발표된 연구에서 45~70세 무릎 골관절염 환자 247명을 대상으로 8주간 운동 효과를 분석한 결과, 근력운동 집단은 대조군보다 무릎 통증 점수가 평균 1.95점(10점 만점 기준) 더 감소했다. 무릎 근력과 보행 능력도 유의하게 개선됐다. 무릎 건강을 유지하려면 하체 근력운동을 꾸준히 하고, 관절에 부담을 주는 격한 운동은 주의해야 한다./사진 = 유튜브 채널 ‘들어봐! 유리의 숲’ 캡처","category":"생활"},{"title":"[날씨] 토요일, 겨울의 시작 알리는 ‘입동’…아침 최저기온 ‘영하권 뚝’","link":"https://n.news.naver.com/mnews/article/029/0003057584","naverLink":"https://n.news.naver.com/mnews/article/029/0003057584","pubDate":"2026-11-07T00:23:55.654927+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"[오늘의 날씨] 겨울의 문턱 '입동' 영하권…곳곳 한파특보","link":"https://n.news.naver.com/mnews/article/629/0000549638","naverLink":"https://n.news.naver.com/mnews/article/629/0000549638","pubDate":"2026-11-07T00:23:55.654890+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"내일 아침 최저 영하 5도 ‘입동 추위’…일요일엔 비 소식","link":"https://n.news.naver.com/mnews/article/020/0003760585","naverLink":"https://n.news.naver.com/mnews/article/020/0003760585","pubDate":"2026-11-07T00:23:55.654851+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:23:55.200394+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"CJ올리브네트웍스 매출 증가 46% 책임진 '스마트스페이스 AX'","link":"https://n.news.naver.com/mnews/article/293/0000092861","naverLink":"https://n.news.naver.com/mnews/article/293/0000092861","pubDate":"2026-11-07T00:23:55.200368+09:00","author":"네이버뉴스","description":"CJ올리브네트웍스의 스마트스페이스 AX 사업 매출이 1년 전보다 두 배 이상 늘며 3분기 전체 매출 증가분의 46%를 차지했다. 공장·물류센터·데이터센터와 방송 시설에 AI 전환을 지원하는 사업으로, AI 인프라 구축 수요가 실적 성장으로 이어졌다.","category":"생활"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활"},{"title":"입동과 함께 찾아온 겨울 추위…주말에 서울도 영하권","link":"https://n.news.naver.com/mnews/article/057/0001977053","naverLink":"https://n.news.naver.com/mnews/article/057/0001977053","pubDate":"2026-11-07T00:22:58.194693+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:23:55.654948+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:23:55.654924+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막","link":"https://n.news.naver.com/mnews/article/079/0004207114","naverLink":"https://n.news.naver.com/mnews/article/079/0004207114","pubDate":"2026-11-07T00:23:55.654886+09:00","author":"네이버뉴스","description":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:23:55.200385+09:00","author":"네이버뉴스","description":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:23:54.770392+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"[단독] “츠키 굿즈 대금 ‘7억’ 미지급”… 내한 공연 공동 주최사 관계자들 피소","link":"https://n.news.naver.com/mnews/article/022/0004173154","naverLink":"https://n.news.naver.com/mnews/article/022/0004173154","pubDate":"2026-11-07T00:23:53.454690+09:00","author":"네이버뉴스","description":"日 데코레이션즈, 사기·업무상횡령 등 혐의 고소 주최 측 “판매 저조해 지급 지연… 추후 갚을 것” ‘만찬가’로 국내에서도 인기를 얻은 일본 싱어송라이터 츠키(tuki.)가 올해 내한했던 공연을 둘러싸고 대금 미지급 분쟁이 불거졌다. 공연 상품을 공급한 일본 업체가 물품 대금과 위탁판매 정산금을 받지 못했다며 국내 공동 주최사 관계자들을 고소했다. 주최 측은 판매 부진으로 지급이 늦어졌다며 다른 공연을 통해 수익을 마련해 갚겠다는 입장이다. 일본 도쿄 소재 굿즈 업체 데코레이션즈가 지난 8월 부산진경찰서에 제출한 고소장에 따르면 사측은 츠키 내한 공연 공동 주최사인 에스비 위너 엔터테인먼트(SB WINNER ENT) 관계자 A씨 등 3명을 사기 및 업무상횡령 혐의로 고소했다. 고소장에는 SB WINNER ENT의 계약 실무 담당자들이 피고소인으로 적시됐다. 츠키 홈페이지 메인 이미지. 츠키 홈페이지 캡처 츠키는 지난 4월11일과 12일 양일간 인천 인스파이어 아레나에서 내한 공연을 열었다. 공연이 아닌 굿즈 판매 대행에서 문제가 발생했다. 고소장에 따르면 양측은 지난 2월26일 총 5775만엔(한화 약 4억8000만원) 규모의 굿즈 공급계약을 체결했다. 대금의 절반은 3월31일까지, 나머지는 4월30일까지 지급하고 일본에서 한국으로 물품을 운송하는 비용과 관세는 SB WINNER ENT가 부담하기로 했다. 이와 별도로 ‘츠키×세인트 마이클’ 협업 티셔츠와 후드티의 위탁판매 약정도 맺었다. 상품 소유권은 데코레이션즈에 두고 SB WINNER ENT가 판매를 맡아 판매대금의 20%를 수수료로 받는 방식이다. 데코레이션즈는 이 약정에 따라 티셔츠 550장(742만5000엔 상당)과 후드티 210장(564만9000엔 상당)을 인도했다고 밝혔다. 데코레이션즈 측은 공연 전인 4월9일까지 물품을 한국에 인도했으며, 계약상 SB WINNER ENT가 부담해야 할 관세와 배송비 2482만945엔(한화 약 2억1400만원)도 대신 지급했다고 주장했다. 물품 공급대금과 대납 비용을 합친 금액은 8257만945엔(한화 약 7억1200만원)이다. 고소인 측은 이 금액을 물품 공급 거래와 관련한 사기 피해액으로 제시했다. 대금 지급을 둘러싼 갈등은 공연 전부터 이어졌다는 것이 고소인 측 설명이다. SB WINNER ENT가 온라인 판매 부진 등을 이유로 선금 지급일을 공연 이후인 4월17일로 미뤄달라고 요청했으나, 해당 날짜에도 지급","category":"문화"},{"title":"경주 축제장 구급차 미배치, 70대 여성 골든타임 놓쳐 식물인간","link":"https://n.news.naver.com/mnews/article/022/0004173159","naverLink":"https://n.news.naver.com/mnews/article/022/0004173159","pubDate":"2026-11-07T00:23:53.454651+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"문화"},{"title":"\"광주 시민과 연대한 팀 일생 다룬 영화, 이진숙 의원이 봤으면\"","link":"https://n.news.naver.com/mnews/article/006/0000138616","naverLink":"https://n.news.naver.com/mnews/article/006/0000138616","pubDate":"2026-11-07T00:23:53.454647+09:00","author":"네이버뉴스","description":"오마이뉴스, 미국인 청년 팀 원버그 일생 다룬 영화 ‘내 이름은 원덕기’ 제작 부상당한 시민 이송하고 위르겐 힌츠페터 카메라 앞에서 광주 참상 전한 팀 “5·18민주화운동 문제적 발언 전하는 언론사 데스크도 영화 봐야” ▲오마이뉴스가 제작한 영화 내 이름은 원덕기 포스터. 사진=오마이뉴스 1980년 5월 광주에 미국 청년 팀 원버그가 있었다. 그는 시민을 폭행하는 계엄군을 막아섰고, 위르겐 힌츠페터 카메라 앞에 서서 광주의 참상을 전했다. 5·18민주화운동을 경험한 뒤에는 대학원에서 한국학을 전공했으며 논문을 통해 신군부의 광주 탄압을 분석하기도 했다. 오마이뉴스는 팀 원버그의 삶의 궤적을 전한 영화 '내 이름은 원덕기'를 제작했다. 영화는 평범한 청년이었던 팀 원버그가 5·18민주화운동을 접한 뒤 어떤 삶을 살게 됐는지, 평범한 시민들의 연대가 얼마나 소중한지 보여주고 있다. ▲오마이뉴스가 제작한 영화 '내 이름은 원덕기' 속 장면. 팀 원버그가 위르겐 힌츠페터 카메라 앞에서 광주 현장에 대해 말하고 있다. 사진=오마이뉴스","category":"문화"},{"title":"‘한지’ 24번째 인류무형유산 눈앞…태권도는 북 단독 등재 유력","link":"https://n.news.naver.com/mnews/article/028/0002830875","naverLink":"https://n.news.naver.com/mnews/article/028/0002830875","pubDate":"2026-11-07T00:22:58.194691+09:00","author":"네이버뉴스","description":"평가기구 두 유산에 모두 ‘등재 권고' 태권도 남북공동 등재 사실상 무산 닥나무로 만든 한지본을 완성하기 전 야외에서 줄에 걸고 바람에 말리는 모습. 국가유산청 제공 옛부터 이 땅의 장인들이 닥나무로 만들어온 ‘한지’ 종이의 제작·전승 문화와 한민족의 전통 무예 ‘태권도’가 유네스코(유엔교육과학문화기구)의 인류무형유산 목록에 나란히 오를 것으로 보인다. 국가유산청은 2024년 3월 한국 정부가 인류무형유산 대표 목록으로 등재 신청한 ‘한지 제작의 전통 지식과 기술 및 문화적 실천’에 대해 유네스코 무형유산보호협약 정부간위원회(이하 무형유산위원회) 산하 평가기구로부터 ‘등재’ 권고를 받았다고 5일 발표했다. 평가기구는 등재 신청 유산을 심사해 ‘등재’, ‘정보 보완’(등재 보류), ‘등재 불가’로 판정 내용을 나누어 무형유산위원회에 권고한다. 권고안은 위원회 검토를 거쳐 최종 등재 결정에 반영되는데, 특별한 변수가 없는 한 권고한 대로 확정되는 게 관례다. 평가기구는 의견서에서 “닥나무 껍질과 잿물 등의 천연재료로 만드는 한지는 기록과 인쇄, 생활, 의례 등 다양한 용도로 쓰이며 공동체의 일상생활과 문화적 실천에서 중요한 역할을 하고 있다”며 “신청서에서 장인과 지역 공동체, 연구자, 시민사회단체 등이 참여하는 다각적인 보호 노력과 지속적 전승을 위한 협력 체계를 확인할 수 있다”고 권고 사유를 밝혔다. 북한이 2024년 3월 신청한 ‘조선민주주의인민공화국의 전통무술―태권도’도 등재 권고를 받아 단독 등재가 유력시된다. 평가기구는 의견서를 통해 “자기 방어의 무예인 태권도는 건강과 사회적 가치를 증진하는 일상적 신체운동으로 (북한에서) 널리 받아들여지고 있다”며 “등재 신청 준비도 초기 단계부터 연행자, 대표기관, 단체, 개인이 폭넓게 참여하는 과정으로 진행됐고 이들이 긴밀히 협력하는 포괄적 보호체계도 제시했다”고 평가했다. 태권도는 한국 정부도 올해 3월 남북한 공동 등재를 추진하겠다는 뜻을 밝히며 등재 신청서를 냈으나 북한 신청안이 등재 권고를 받으면서 공동 등재는 사실상 무산됐다. 정부 대응이 늦고 소홀했던 것 아니냐는 지적이 나온다. 이와 관련해 허민 국가유산청장은 유네스코 공식 발표 전인 지난 2일 에스엔에스(SNS)에 ‘한지’와 ‘태권도’에 대한 등재 권고 내용을 미리 알리며 양해를 구하는 글을 올려 논란을 빚었다. 그는 “남북 관계 등 여러 여건으로 인해 현 시점에서 ‘공동 등재’는 사실상 어려울 것","category":"문화"},{"title":"AI 시대 인간다움 묻는다… 2026 인문문화축제 6일 개막","link":"https://n.news.naver.com/mnews/article/020/0003760673","naverLink":"https://n.news.naver.com/mnews/article/020/0003760673","pubDate":"2026-11-07T00:22:58.194682+09:00","author":"네이버뉴스","description":"‘2026 인문문화축제’ 참여형 전시 ‘인문상점’에서 관람객이 청년들의 질문을 고르고 있다. 한국문화예술교육진흥원 제공 문화체육관광부와 한국문화예술교육진흥원이 공동 주최하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해로 3회째인 해당 축제는 ‘인문지능’을 주제로 8일까지 사흘간 열린다. 주최 측은 ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 나를 돌아보고, 타인을 이해하며, 삶의 방향을 스스로 선택하는 힘을 뜻한다고 설명했다. 개막특별포럼에서는 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 대담했다. 이어 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발표하고, 성해영 서울대 종교학과 교수를 좌장으로 학계와 산업계 전문가들이 AI 시대 인문의 의미와 인문정책의 방향, 생활권 인문 확산 방안을 논의했다. 축제 기간에는 작가와 예술인, 콘텐츠 창작자가 참여하는 대담과 공연도 이어진다. 6일에는 황인찬 시인과 양희은 가수가 ‘노래가 된 시’를 주제로 토크콘서트를 연다. 7일에는 김겨울 작가와 김초희 영화감독 등이 ‘비교하지 않는 나만의 속도’를 주제로 이야기를 나눈다. 이종범 웹툰 작가와 심채경 천문학자 등은 일과 인문의 관계를 다룬다. 8일에는 넉살 가수 등이 참여하는 대담이 진행된다. 관람객이 직접 참여하는 전시도 마련됐다. 전국 인문 프로그램의 현장을 소개하는 ‘인문의 길’, 다른 사람의 회고록에 자신의 이야기를 이어 쓰는 ‘우리의 회고록’, 청년인문실험 100개 팀의 질문을 살펴보는 ‘인문상점’ 등이 운영된다. 안동 인문행복센터의 ‘인문행복트럭’과 마포·홍대 일대를 걷는 ‘인문탐방’도 진행된다. 축제와 연계한 전국 단위 인문 프로그램도 11월 한 달간 이어진다. 전국 10개 지역서점에서 북큐레이션과 북토크를 열고, ‘청년인문교실’과 ‘길 위의 인문학’, ‘지혜학교’, ‘모두의 인문학’ 등 프로그램을 전국 193곳에서 운영한다. 임진택 한국문화예술교육진흥원장은 “AI 시대에 인간다움을 지키는 힘은 인문적 사유에서 나온다”며 “인문적 소양을 갖춘 시민이 자신과 생활을 바꿔 가는 것이 이번 축제가 말하는 인문지능”이라고 말했다. 인문문화축제는 2024년 처음 시작됐다. 제1회 축제는 ‘시대가 묻고 인문이 답하다’를 주제로 국립중앙박","category":"문화"}],"세계":[{"title":"미 중간선거로 보는 기독교 정치…'마가' 균열 시작?","link":"https://n.news.naver.com/mnews/article/079/0004207420","naverLink":"https://n.news.naver.com/mnews/article/079/0004207420","pubDate":"2026-11-07T00:23:55.654904+09:00","author":"네이버뉴스","description":"미국 중간선거 결과를 계기로 기독교 보수 진영의 정치적 결속과 내부 균열을 분석한 기사다.\n선거 이후 종교계와 정치권의 관계, 당내 노선 경쟁이 주요 쟁점으로 다뤄진다.\n향후 미국 정치 지형에 미칠 영향이 주목된다.","category":"세계"},{"title":"젠슨 황, 주가 폭락에 22조 날렸는데…“그 여성과 무슨 사이냐” 소환장도 받았다","link":"https://n.news.naver.com/mnews/article/011/0004679629","naverLink":"https://n.news.naver.com/mnews/article/011/0004679629","pubDate":"2026-11-07T00:23:54.770429+09:00","author":"네이버뉴스","description":"젠슨 황을 둘러싼 주가 변동과 법적 소환장 관련 소식이 함께 전해졌다.\n기사에서는 자산 평가액 변화와 개인적 사안에 대한 법적 절차를 다룬다.\n관련 의혹의 사실관계와 절차가 어떻게 진행될지 지켜볼 필요가 있다.","category":"세계"},{"title":"일본 다카이치 '타이완 발언' 1년…중국 \"발언 시정해야\"","link":"https://n.news.naver.com/mnews/article/055/0001401267","naverLink":"https://n.news.naver.com/mnews/article/055/0001401267","pubDate":"2026-11-07T00:23:54.770417+09:00","author":"네이버뉴스","description":"일본 다카이치 '타이완 발언' 1년…중국 \"발언 시정해야\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"“굶어 죽어야 천국 간다” 어린이 190명 아사시킨 사이비 지도자","link":"https://n.news.naver.com/mnews/article/021/0002830982","naverLink":"https://n.news.naver.com/mnews/article/021/0002830982","pubDate":"2026-11-07T00:23:54.770404+09:00","author":"네이버뉴스","description":"종교 지도자가 신도들에게 극단적인 금식을 강요해 다수의 사망자가 발생한 사건의 재판 결과를 다룬다.\n법원은 지도자의 책임을 인정해 중형을 선고했다.\n종교를 악용한 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"세계"},{"title":"대승거둔 美 민주당, 이제 온건·진보 노선 투쟁? LA서 민주사회주의자 시장 당선[트럼프 2기]","link":"https://n.news.naver.com/mnews/article/002/0002464732","naverLink":"https://n.news.naver.com/mnews/article/002/0002464732","pubDate":"2026-11-07T00:23:54.770401+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 큰 성과를 거둔 뒤 당내 노선 경쟁이 주목받고 있다.\n온건파와 진보파가 향후 정책 방향과 주도권을 두고 경쟁할 가능성이 제기된다.\n이번 선거 결과가 다음 대선 구도에 미칠 영향도 관심사다.","category":"세계"},{"title":"탄핵 위기 헤그세스 “버티고 싸운다”…민주당에 정면 도발","link":"https://n.news.naver.com/mnews/article/028/0002831117","naverLink":"https://n.news.naver.com/mnews/article/028/0002831117","pubDate":"2026-11-07T00:23:54.770399+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"},{"title":"최악 산불이 불붙인 반정부 시위… 거리로 나선 인니 Z세대","link":"https://n.news.naver.com/mnews/article/005/0001883556","naverLink":"https://n.news.naver.com/mnews/article/005/0001883556","pubDate":"2026-11-07T00:23:54.770390+09:00","author":"네이버뉴스","description":"최악 산불이 불붙인 반정부 시위… 거리로 나선 인니 Z세대. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"이란, 카타르 핵 협상안 검토 중\"…美와 종전 협상 돌파구 기대","link":"https://n.news.naver.com/mnews/article/421/0009275501","naverLink":"https://n.news.naver.com/mnews/article/421/0009275501","pubDate":"2026-11-07T00:23:54.770383+09:00","author":"네이버뉴스","description":"\"이란, 카타르 핵 협상안 검토 중\"…美와 종전 협상 돌파구 기대. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프 \"증시 폭락, 멍청한 민주당 승리 때문…여러분 스스로 탓해야\"","link":"https://n.news.naver.com/mnews/article/003/0014305414","naverLink":"https://n.news.naver.com/mnews/article/003/0014305414","pubDate":"2026-11-07T00:23:54.770379+09:00","author":"네이버뉴스","description":"[워싱턴=AP/뉴시스]미국 중간선거 직후인 5일(현지 시간) 뉴욕증시 3대 지수가 일제히 폭락한 가운데, 도널드 트럼프 대통령이 민주당을 지지한 유권자들에게 책임을 돌렸다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에 \"주식 시장이 이번 선거 결과 때문에 역사상 최악의 하루를 보냈다\"며 \"기억하라. 공화당이 아닌 '멍청한 민주당(Dumocrats)' 떄문\"이라고 적었다. 사진은 5일 백악관 집무실에서 취재진 질문에 답하는 트럼프 대통령. 2026.11.06. [서울=뉴시스] 김승민 기자 = 미국 중간선거 직후인 5일(현지 시간) 뉴욕증시 3대 지수가 일제히 폭락한 가운데, 도널드 트럼프 대통령이 민주당을 지지한 유권자들에게 책임을 돌렸다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에 \"주식 시장이 이번 선거 결과 때문에 역사상 최악의 하루를 보냈다\"며 \"기억하라. 공화당이 아닌 '멍청한 민주당(Dumocrats)' 때문\"이라고 적었다. 그는 \"우리가 (증시를) 누구도 경험하지 못했던 수준까지 끌어올리기 위해 얼마나 많은 노력을 기울였는데, 결국 이런 일이 벌어졌다. 그 결과 여러분의 퇴직연금 계좌도 손실을 입었다\"고 강조했다. 트럼프 대통령은 뒤이어 올린 추가 게시물을 통해서도 \"멍청한 민주당의 '화요일 대박(big Tuesday)'으로 오늘 증시가 폭락했다\"며 \"정말 안타까운 일이나, 여러분은 스스로를 탓할 수밖에 없다\"고 했다. 그는 그러면서 \"두려워하지 말라. 우리는 어떻게든 머지않아 그 어느 때보다 크고 강해질 것\"이라며 \"미국을 다시 위대하게(MAKE AMERICA GREAT AGAIN)\"라고 덧붙였다. 뉴욕증권거래소(NYSE)에 따르면 이날 다우존스30산업평균지수는 전장 대비 1833.54포인트(3.44%) 하락한 5만1522.58에 마감했다. 스탠더드앤드푸어스(S&P)500지수는 전장보다 334.82포인트(4.35%) 내린 7353.80에 거래를 마쳤다. 기술주 중심의 나스닥종합지수는 1421.516포인트(5.52%) 떨어진 2만4314.997에 장을 닫았다. CNBC는 민주당의 중간선거 승리로 데이터센터 건설이 둔화될 수 있다는 우려가 제기되면서 기술주 투매가 나타나 증시가 급락했다고 분석했다．","category":"세계"},{"title":"루비오 사임설, 헤그세스 탄핵론... 흔들리는 '트럼프호'","link":"https://n.news.naver.com/mnews/article/469/0000964045","naverLink":"https://n.news.naver.com/mnews/article/469/0000964045","pubDate":"2026-11-07T00:22:57.012503+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"}],"IT 과학":[{"title":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고","link":"https://n.news.naver.com/mnews/article/092/0002444296","naverLink":"https://n.news.naver.com/mnews/article/092/0002444296","pubDate":"2026-11-07T00:23:55.654940+09:00","author":"네이버뉴스","description":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"앤트로픽 IPO 미뤄지나…\"美 기술주 급락 여파\"","link":"https://n.news.naver.com/mnews/article/092/0002444279","naverLink":"https://n.news.naver.com/mnews/article/092/0002444279","pubDate":"2026-11-07T00:23:55.200398+09:00","author":"네이버뉴스","description":"미국 기술주 급락으로 투자심리가 얼어붙으면서 앤트로픽의 기업공개 추진 일정에도 차질이 생길 수 있다는 우려가 제기됐다. AI 관련주 전반의 변동성이 커진 가운데 시장의 관심은 상장 계획과 투자자 수요에 쏠리고 있다.","category":"IT 과학"},{"title":"AMD 마침내 인텔 넘어서나? 데이터센터 실적이 예고한 판도 변화 [고든 정의 TECH+]","link":"https://n.news.naver.com/mnews/article/081/0003696682","naverLink":"https://n.news.naver.com/mnews/article/081/0003696682","pubDate":"2026-11-07T00:23:55.200395+09:00","author":"네이버뉴스","description":"AMD와 인텔 모두 AI 데이터센터 수요에 힘입어 3분기 실적이 성장했지만, 데이터센터 사업의 성장률과 향후 전망에서는 차이가 나타났다. AMD는 AI GPU를 포함한 헬리오스 랙 시스템의 초기 매출을 반영했고, 이런 흐름이 이어지면 인텔과의 매출 격차가 좁혀지거나 역전될 가능성이 제기된다.","category":"IT 과학"},{"title":"\"미국 주춤해도 한국은 멈추면 안 돼\"…정부, AI 투자 지속 강조","link":"https://n.news.naver.com/mnews/article/015/0005351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:23:55.200390+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 AI 데이터센터 투자 위축 우려가 커지자 배경훈 부총리는 한국의 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 정책 변화가 오히려 다른 국가에는 기회가 될 수 있다는 판단으로, 국내 투자와 초거대 AI 개발을 계속 추진하겠다는 취지다.","category":"IT 과학"},{"title":"\"전력망 비용 다 내겠다\"는 오픈AI… 국내 AI 데이터센터는 고객 확보 관건","link":"https://n.news.naver.com/mnews/article/469/0000964112","naverLink":"https://n.news.naver.com/mnews/article/469/0000964112","pubDate":"2026-11-07T00:23:55.200388+09:00","author":"네이버뉴스","description":"발 빠르게 지역사회와 공존 방안 발표 빅테크들, 美 정치 변화에 대응 착수 국내서도 18.4GW 데이터센터 계획 \"수요와 공급 엇갈릴 가능성\" 우려도 \"개발과 동시에 글로벌 고객과 협의\" 이재명 대통령이 6월 20일 울산 전시컨벤션센터에서 열린 울산 AI데이터센터 출범식에 와 격려사를 하고 있다. 왕태석 선임기자 오픈AI가 5일(현지시간) 직접 소유·운영하는 인공지능(AI) 데이터센터의 전기요금과 전력 인프라 비용을 전액 부담하겠다고 밝혔다. 다른 전력 소비자에게 비용이 전가되지 않도록 하겠다는 취지다. 미국 중간선거에서 민주당이 압승하며 AI 데이터센터 위축 전망에 힘이 실리자 발 빠르게 지역사회와의 공존 방안을 내놓은 것이다. 오픈AI는 데이터센터를 지을 때 지역 공직자들에게 관련 정보를 공개하지 못하게 하는 비밀유지계약을 요구해왔는데, 이런 관행도 중단하겠다고 했다. 그러면서 이날 발표와 비슷한 규정을 빅테크 전반에 적용하자고 제안했다. AI 투자에 거액을 쏟아부은 오픈AI를 비롯한 빅테크들은 미국 정치 지형 변화에 대응할 대책 마련을 서두르는 모습이다. 외신에 따르면 메타는 데이터센터 건설지를 미국 이외로 돌리거나 기존 시설을 확장해 쓰는 방안을 검토하고 있다. 마이크로소프트는 영국 네오클라우드 엔스케일과 맺은 데이터센터 계약을 지난달 취소했다. 국내에서도 여러 기업이 대규모 AI 데이터센터 투자를 추진해왔다. 정부가 6월 발표한 '3대 메가프로젝트'엔 2029년까지 8.4기가와트(GW) 규모의 AI 데이터센터를 구축하는 계획이 담겼다. SK가 5GW, GS가 2.4GW, 네이버가 1GW를 각각 맡았다. SK가 시설을 2035년까지 확장하는 단계까지 포함하면 총 18.4GW다. 8월 5일 경기 파주시 건설 현장에서 LG유플러스의 200메가와트(MW)급 AI 데이터센터 공사가 진행되고 있다. 김진욱 기자","category":"IT 과학"},{"title":"AI모델 구독 않고 골라쓰는 시대 열렸다","link":"https://n.news.naver.com/mnews/article/015/0005351238","naverLink":"https://n.news.naver.com/mnews/article/015/0005351238","pubDate":"2026-11-07T00:23:55.200386+09:00","author":"네이버뉴스","description":"KT의 기업용 플랫폼 토큰팩토리는 GPT와 클로드 등을 포함한 73개 AI 모델을 제공하고, 사용량에 따라 요금을 매기는 방식으로 출발했다. 여러 서비스를 월정액으로 구독하는 대신 작업에 맞는 모델을 골라 쓴 만큼 결제하는 방식이며, 향후 제공 모델을 500개 이상으로 늘릴 계획이다.","category":"IT 과학"},{"title":"엔비디아, 네이버에 1.34조 납입…3대 주주로 'AI 동맹' 본격화","link":"https://n.news.naver.com/mnews/article/018/0006405323","naverLink":"https://n.news.naver.com/mnews/article/018/0006405323","pubDate":"2026-11-07T00:23:55.200382+09:00","author":"네이버뉴스","description":"10억달러 지분투자 마무리…네이버 3대 주주로 브룩필드, 200MW 이상 GPU 인프라 투자·소유 네이버클라우드, 장기계약으로 컴퓨팅 용량 확보 2027년 초 거래 종결 목표…글로벌 고객 유치 관건 [이데일리 이소현 기자] 엔비디아가 네이버(NAVER(035420))에 10억달러(약 1조3412억원) 규모의 전략적 지분투자를 완료했다. 네이버 지분 약 4.13%를 확보하면서 국민연금과 블랙록에 이어 3대 주주로 올라서게 됐다. 글로벌 대체투자사 브룩필드도 90억달러 규모의 인공지능(AI) 인프라 투자 계획을 구체화하면서 네이버·엔비디아·브룩필드의 3자 연합 글로벌 AI 팩토리 사업이 본궤도에 올랐다. 지난 7월 24일(현지시간) 미국 캘리포니아주 엔비디아 사옥에서 이해진(오른쪽) 네이버 의장과 엔비디아 젠슨 황 CEO가 10억 달러 규모의 전략적 투자 계약을 체결한 후 악수를 하고 있다.(사진=네이버) 네이버는 6일 ‘유상증자 또는 주식관련사채 등의 발행결과’ 공시를 통해 엔비디아를 대상으로 한 제3자배정 유상증자의 투자금 1조3411억9995만7500원이 전액 납입됐다고 밝혔다. 실제 발행한 보통주식은 655만8435주다. 주당 발행가액은 20만4500원이다. 엔비디아가 확보한 네이버 지분율은 약 4.13%로, 창업주인 이해진 네이버 이사회 의장의 지분율을 웃돌게 된다. 신주 상장 예정일은 오는 27일이며, 취득한 주식은 1년간 매각이 제한된다. 달러 기준 투자금은 당초 계약한 10억달러로 동일하지만, 환율 하락으로 원화 조달액과 발행주식 수는 줄었다. 최초 공시 당시 적용 환율은 달러당 1480.9원이었으나 최종 환율은 1341.2원으로 확정됐다. 이에 따라 원화 조달액은 약 1397억원, 발행주식 수는 68만3129주 감소했다. 브룩필드, 200MW 이상 GPU 인프라 소유…네이버클라우드 운영 이번 투자는 네이버와 엔비디아가 지난 7월 체결한 신주인수계약에 따른 것이다. 당시 엔비디아는 최소 90억달러 규모의 AI 컴퓨팅 인프라 확보를 투자 선결 조건으로 제시했다. 네이버는 지난달 27일 브룩필드와 관련 계약을 체결해 조건을 충족했다. 브룩필드도 이날 별도 자료를 통해 네이버와 약 90억달러 규모의 자본 파트너십을 체결했다고 밝혔다. 브룩필드가 국내 AI 컴퓨팅 인프라에 투자하는 것은 이번이 처음이다. 브룩필드는 이번 거래가 국내에서 이뤄진 스폰서 주도 민간 투자 가운데 역대 최대 규모라고 설명했다. 구체","category":"IT 과학"},{"title":"美민주 'AI 중단' 압박에 증시 패닉셀","link":"https://n.news.naver.com/mnews/article/009/0005760237","naverLink":"https://n.news.naver.com/mnews/article/009/0005760237","pubDate":"2026-11-07T00:23:55.200377+09:00","author":"네이버뉴스","description":"글로벌 증시 검은 금요일 데이터센터 규제 촉구…주지사 당선인 \"AIDC 끝낼것\" 장중 5천피 붕괴에 당국, 반대매매 막으려 긴급 조치 파란색으로 뒤덮인 증시 시세판 6일 서울 여의도 한국거래소 전광판에 코스피 종가가 표시돼 있다. 이날 코스피는 미국 블루쓰나미로 인공지능(AI) 투자 위축 우려가 커지면서 전 거래일 대비 6.02% 내린 5059.69에 거래를 마감했다. 코스피는 장 시작 뒤 불과 3분여 만에 서킷브레이커가 발동되고, 장중 5000선이 붕괴되는 등 불안정한 모습을 보이다가 낙폭을 다소 만회했다. 김재훈 기자 미국 중간선거에서 압승한 민주당 진영이 자국 내 인공지능(AI) 데이터센터 건설 중단을 잇달아 요구하면서 글로벌 금융 시장이 'AI 모라토리엄 충격'에 휩싸였다. 2022년 11월 챗GPT 출시 후 천문학적 투자와 성장 기대를 바탕으로 질주해온 AI 산업이 중간선거를 계기로 정치권 규제라는 새로운 장벽에 부딪힌 것이다. 미국 반도체지수는 6년8개월 만에 최대 폭으로 추락했고 한국 증시에서도 주가 급락으로 거래가 일시 중단되기도 했다. 5일(현지시간) 버니 샌더스 미국 버몬트주 상원의원(무소속)은 자신의 엑스(X)에 \"전국적인 데이터센터 건설 중단 조치를 지금 당장 시행하라\"고 말했다. 선거 승리를 등에 업은 민주당 진영에서 데이터센터 규제 요구는 거세지고 있다. 야사민 안사리 하원의원(애리조나주)은 \"AI 개발 중단을 새 하원의 첫날 최우선 과제로 삼아야 한다\"고 밝혔고 그레그 카사르 하원 진보코커스 의장도 이에 호응했다. 데이터센터 인허가 권한을 쥔 주정부의 규제 움직임은 AI 기업들에 더욱 현실적인 위협으로 다가오고 있다. 지나 이노호사 텍사스 주지사(민주당) 당선인은 이날 CNN과의 인터뷰에서 \"보호 장치가 마련될 때까지 데이터센터와 관련해 해오던 일을 멈춰야 한다\"며 \"내가 주지사가 되면 그것은 끝난다\"고 경고했다. 같은 당의 키샤 랜스 보텀스 조지아 주지사 당선인도 \"데이터센터 개발을 멈추는 행정명령에 서명할 것\"이라고 했다. 민주당이 주지사를 탈환한 텍사스(88.4GW)와 오하이오(21.9GW), 조지아(20.2GW) 세 곳에만 총 130.5GW의 데이터센터 건설 계획이 몰려 있다. 세 지역의 건설 계획 용량은 미국 전체 건설 예정 데이터센터의 40%에 달한다. 이달 증시 상장을 추진하고 있는 앤트로픽에도 불똥이 튀었다. 로이터통신은 앤트로픽의 기업공개(IPO)에 참여하려는 투자자들","category":"IT 과학"},{"title":"빅테크 '보안 강화' AI 모델 잇따라 공개... 네이버·LG, SKT 모델은 언제","link":"https://n.news.naver.com/mnews/article/469/0000964118","naverLink":"https://n.news.naver.com/mnews/article/469/0000964118","pubDate":"2026-11-07T00:23:55.200376+09:00","author":"네이버뉴스","description":"오픈AI, 'GPT-6 사이버' 출시 악용 위험, 패치 후보까지 제시 구글, 앤트로픽 이어 경쟁 합류 국산 보안 특화 모델들 학습 중 서로 공격하며 방어 역량 키워 오픈AI가 공개한 보안 특화 인공지능(AI) 모델 'GPT-6 사이버' 이미지. 오픈AI 제공 인공지능(AI) 기반 시스템 침투 도구의 악용 위험성이 커지면서 글로벌 AI 기업들이 보안 강화형 AI 모델을 잇달아 내놓고 있다. 고도화한 보안 기능이 AI 시장의 격전지로 부상하며 국내에서 개발 중인 사이버 보안 특화 AI 파운데이션 모델에도 관심이 쏠린다. 오픈AI는 5일(현지시간) 자사 최상위 범용 AI 모델 'GPT-6 아스트라'를 기반으로 보안에 특화한 모델 'GPT-6 사이버'를 출시했다고 밝혔다. 보안 취약점 탐지는 물론 악용될 위험성을 검증하고, 취약점을 고칠 수 있는 패치 후보와 분석 자료까지 제시하는 성능을 갖췄다. 오픈AI는 이 모델로 웹 브라우저 '파이어폭스'에서 고위험 취약점 81건을 발견했고, 리눅스 운영 체제 취약점 948건에 작동하는 공격 도구도 개발했다. 오픈AI는 \"이 결과와 패치 후보를 개발사들에 전달했다\"고 밝혔다. 이 모델은 사이버 위험 평가 최고 수준인 '크리티컬' 등급으로 지정됐다. 구글은 지난달 28일 최신 범용 프런티어 모델 '제미나이 4 카본'을 공개하고 보안 성능 강화를 강조하며 \"소프트웨어에 숨은 복잡한 결함을 자율적으로 찾고, 검증된 취약점에 즉시 작동하는 코드 수정을 제시한다\"고 했다. 9월엔 경량 보안 특화 모델 '제미나이 3.8 플래시 사이버'도 내놓으며 \"취약점 탐지와 자동 패치에 최첨단 성능을 보인다\"고 했다. 앤트로픽의 '클로드 미토스' 전후로 빅테크들의 보안 특화 AI 모델 경쟁이 거세진 추세다. 국내에선 한국 환경에 맞춘 보안 모델이 개발되고 있다. 정부 주도의 사이버 보안 특화 AI 파운데이션 모델 개발 프로젝트에 참여한 네이버클라우드 컨소시엄은 기업·기관 41곳과 함께 보안 특화 모델을 개발하며 830테라바이트(TB)에 달하는 보안 실데이터를 학습시키고 있다. 네이버클라우드의 AI 모델 '하이퍼클로바X'로 방어, LG AI 연구원의 AI 모델 '엑사원'으로 공격 능력이 특화된 모델을 만든다. 내년 상반기 중 완성하겠다는 목표를 잡고 있다. SK텔레콤은 AI 기업 업스테이지, 보안기업 6곳, 대학 3곳이 참여하는 '독자 AI 사이버보안 협의체'를 지난달 출범시켰다. 정부의 독자 AI 파운","category":"IT 과학"},{"title":"“나 좀 일으켜 줘”…일부러 ‘덜 완벽하게’ 만든 로봇, 석 달 만에 월 매출 1억","link":"https://n.news.naver.com/mnews/article/020/0003760687","naverLink":"https://n.news.naver.com/mnews/article/020/0003760687","pubDate":"2026-11-07T00:23:55.200374+09:00","author":"네이버뉴스","description":"사진=이예리 기자 celsetta@donga.com 빈틈없이 일을 잘해 오히려 사람 같지 않은 이를 두고 흔히 ‘로봇 같다’고 한다. 그런데 일부러 ‘덜 완벽하게’ 만든 로봇이 있다. 엔터테인먼트 로봇 function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}

}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="문화"&&/전시|공연|콘서트|영화|드라마|배우|가수|앨범|음악|미술|박물관|미술관|축제|출판|책|작가|문학|문화재|유네스코|한지|공예|연극|뮤지컬|예술|문화/.test(t)) score+=5;
  if(category==="생활"&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?allDays[0]?.date:allDays[1]?.date));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===window.NEWS_DATA.date?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
