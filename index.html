+09:00","author":"네이버뉴스","description":"설악산 -9도, 홍천·파주 -6.6도까지 떨어져…서울도 곳곳 영하 낮 8∼13도 그쳐…당분간 추위, 내일 경기북동부와 강원내륙·산지 눈 가능성 찬바람 부는 서울의 아침 (서울=연합뉴스) 서대연 기자 = 서울 아침 최저기온이 3도까지 떨어지며 급격히 추워진 6일 서울 종로구 광화문네거리에서 외투 모자를 쓴 관광객과 시민들이 신호를 기다리고 있다. 2026.11.6 dwise@yna.co.kr (서울=연합뉴스) 이재영 기자 = 절기 입동(立冬)인 7일 내륙 대부분의 아침 기온이 영하로 내려가는 등 추위가 시작했다. 이날 오전 7시 기준 일최저기온 현황을 보면 설악산은 -9.0도, 횡성(둔내)은 -6.8도, 홍천(서석)과 파주(판문점)는 -6.6도까지 기온이 떨어졌다. 7일 오전 8시 20분 기준 일최저기온 분포도. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"119 구급차에서 태어난 31주 미숙아 살려낸 '50일의 기적'","link":"https://n.news.naver.com/mnews/article/654/0000209848","naverLink":"https://n.news.naver.com/mnews/article/654/0000209848","pubDate":"2026-11-07T00:26:25.047997+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"\"밤 10시 넘으면 씻지도 말라고?\"…아파트 공지문에 엇갈린 반응","link":"https://n.news.naver.com/mnews/article/003/0014307370","naverLink":"https://n.news.naver.com/mnews/article/003/0014307370","pubDate":"2026-11-07T00:26:25.047990+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 밤 10시 이후 샤워와 세탁기 사용을 자제해 달라는 아파트 공지문을 두고 네티즌들의 의견이 엇갈렸다. (사진출처=스레드 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 아파트 입주민이 밤 10시 이후 샤워와 세탁기 사용 등 물소리를 자제해 달라는 공지문을 게시한 사실이 알려지면서 온라인에서 논쟁이 벌어졌다. 6일 소셜미디어(SNS) 스레드에는 한 아파트 입주민이 작성한 층간소음 관련 공지문 사진이 올라왔다. 공지문 작성자는 밤 10시부터 자정은 물론 새벽 2~3시에도 세탁기와 샤워기, 세면대에서 물을 사용하는 소리가 들린다고 적었다. 그는 \"밤시간이 아니라면 지속 시간이 길더라도 견딜 수 있다. 일과의 마무리를 씻고 정리하는 것은 일반적\"이라면서도 \"한밤중 물소리는 이웃에게는 폭포수처럼 엄청난 소음\"이라고 썼다. 이어 \"새벽에 휴대폰을 던지고 싸우는 소리, 화장실 문 쾅 닫는 소리에 물 폭탄 소리까지 들린다\"며 \"층간소음에 취약한 아파트라 알고 싶지 않은 소음들마저 실시간 중계되는 구조이니 서로서로 조심하자는 취지\"라고 밝혔다. 그러면서 \"밤 10시 이후에는 서로 배려했으면 한다\"고 당부했다. 이를 접한 네티즌들의 반응은 엇갈렸다. 샤워와 세안, 화장실 이용은 일상생활에 필요한 행동인 만큼 제한해서는 안 된다는 의견이 나왔다. 네티즌들은 \"9시 출근 6시 퇴근만 있는 줄 아느냐\", \"밤늦게 퇴근하는 사람은 어쩌라는 거냐\", \"자다 깨서 화장실에 다녀오고 손을 씻을 수도 있다\", \"물소리는 층간소음에도 들어가지 않는다\"등의 댓글을 남겼다. 반면 아파트 구조에 따라 물소리도 크게 들릴 수 있는 만큼 늦은 시간에는 주의할 필요가 있다는 의견도 있었다. 일부 네티즌은 \"소음이 심한 아파트는 물소리도 엄청 크게 들린다\", \"세탁기는 밤 10시 이후 피하는 게 맞는 것 같다\", \"샤워도 늦은 시간이라면 10~15분 안에 끝내는 게 좋다\"고 했다. 이후 공지문 작성자로 추정되는 입주민은 댓글을 통해 공지의 취지를 추가로 설명했다. 그는 \"단지 샤워를 하지 말라는 게 아니다\"며 \"윗집은 하루 종일 쿵쾅쿵쾅 발망치 소리, 의자 드르륵 소리, 싸우는 소리가 난다\"고 주장했다. 이어 \"하루에도 몇십 번씩 화장실을 들락날락하는데 낮과 저녁 내내, 새벽 3시까지 화장실에서 우당탕탕 물을 틀었다 껐다 계속 반복하고 있어 자다가 자꾸 깬다\"고 덧붙였다. 또한 \"윗집은 평일은 물론 주말과 방학 내내 어디를","category":"사회"},{"title":"\"천국 가려면 굶어야\"…어린이 190명 굶겨 죽인 사이비 교주 '징역 200년'","link":"https://n.news.naver.com/mnews/article/088/0001038899","naverLink":"https://n.news.naver.com/mnews/article/088/0001038899","pubDate":"2026-11-07T00:26:25.047988+09:00","author":"네이버뉴스","description":"종교 지도자가 신도들에게 극단적인 금식을 강요해 다수의 사망자가 발생한 사건의 재판 결과를 다룬다.\n법원은 지도자의 책임을 인정해 중형을 선고했다.\n종교를 악용한 범죄를 막고 피해자를 보호할 제도적 대응이 주목된다.","category":"사회"},{"title":"구급차서 태어난 31주 미숙아…구급대원 덕에 살았다","link":"https://n.news.naver.com/mnews/article/009/0005760299","naverLink":"https://n.news.naver.com/mnews/article/009/0005760299","pubDate":"2026-11-07T00:26:25.047964+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"“의사 선생님, 집도 드릴게요” 77억 들여 숙소까지 지은 농어촌…의사 구하기 얼마나 힘들길래","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-07T00:26:25.047949+09:00","author":"네이버뉴스","description":"의료 인력을 구하기 어려운 농어촌 지역이 의사 유치를 위해 주거 지원책을 마련했다는 기사다.\n숙소 조성에 큰 예산을 투입해 근무 여건을 개선하려는 시도가 소개됐다.\n지역 의료 공백을 줄이는 데 실제로 도움이 될지가 과제로 남는다.","category":"사회"},{"title":"일반인 목졸라 중상 입힌 '조폭' 출신 유튜버…예상 처벌 수위는","link":"https://n.news.naver.com/mnews/article/003/0014307414","naverLink":"https://n.news.naver.com/mnews/article/003/0014307414","pubDate":"2026-11-07T00:26:25.047947+09:00","author":"네이버뉴스","description":"수사기관 \"대본에 따른 연출된 촬영\" 주장 안 받아들여 변호사 \"12주 중상…주동자 징역 1년6개월 안팎 실형 예상\" 사진 JTBC 뉴스 영상 캡처 *재판매 및 DB 금지 [서울=뉴시스]이준형 인턴 기자 = 유튜브 생방송 중 일반인 출연자에게 위험한 격투기 기술을 걸어 기절시키고 중상을 입힌 전직 조폭 출신 유튜버가 검찰에 송치됐다. 이에 주동자는 징역 1년 이상, 공범은 징역 1년 6개월 안팎의 실형을 선고받을 것이라는 법조인의 분석이 나왔다. 3일 조기현 법무법인대한중앙 대표변호사는 공식 유튜브 채널을 통해 해당 사건의 수사 경과와 향후 처벌 수위를 전망했다. 조 변호사는 \"종합격투기 선수 출신 유튜버인 주동자가 피해자에게 전치 12주의 중상을 입힌 혐의(상해죄)로 불구속 송치됐다\"며 \"사건 이후 피해자와 합의를 진행해 법원이 구속영장을 기각했으나, 경찰은 추가 수사를 마무리하고 최근 사건을 검찰에 넘겼다\"고 밝혔다. 이 사건은 당초 '대본에 따른 연출된 촬영'이었다는 주장이 제기되었으나, 수사 기관은 이를 받아들이지 않았다. 조 변호사는 \"애초에 합의된 수준을 벗어나는 과도한 물리력이 행사됐고, 피해자가 촬영을 주저하며 거부했음에도 촬영을 강요해 결과적으로 12주의 중상을 입혔다\"며 \"사고 후 합의가 이뤄졌더라도 그냥 넘길 수 없는 사안\"이라고 설명했다. 함께 송치된 공범의 경우, 상해 방조 및 공동강요 혐의가 적용됐다. 조 변호사는 \"공범 역시 대본대로 촬영하자며 주저하는 피해자를 강요한 혐의가 인정되어 송치됐다\"고 덧붙였다. 향후 예상되는 처벌 수위에 대해서는 엄중한 실형 가능성을 제기했다. 조 변호사는 공범에 대해 \"이 사건과 별개로 이미 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며 \"이번 사건의 유죄 판결이 더해질 경우 경합범 가중 등을 고려해 총 징역 1년 6개월 안팎의 실형이 선고될 것으로 보인다\"고 내다봤다. 주동자에 대해서는 \"피해자와 합의를 거쳤다는 점이 양형에 유리한 요소로 작용해 예상 형량이 다소 줄어들 수는 있다\"면서도 \"합의가 감형 요소로 크게 작용하더라도 전치 12주의 중상해를 입힌 만큼 징역 1년 이상의 실형 선고를 피하기 어려울 것\"이라고 분석했다. 마지막으로 조 변호사는 \"피해자와의 합의가 배상을 위해 양형에 일정 부분 반영되는 것은 불가피하지만, 이번 사건은 위력을 동원한 강요와 중상해가 발생한 만큼 향후 검찰 기소와 법원의 재판 과","category":"사회"},{"title":"아무 것도 먹지 않는 아이…5년 전 급식실에서는 무슨 일이","link":"https://n.news.naver.com/mnews/article/629/0000549639","naverLink":"https://n.news.naver.com/mnews/article/629/0000549639","pubDate":"2026-11-07T00:26:25.047944+09:00","author":"네이버뉴스","description":"동천학교 급식실 CCTV 설치 두고 학부모·학교 갈등 학운위 가결에도 학교 측 개인정보 침해 이유 반대 서울 노원구 특수학교인 동천학교에서 교내 CCTV 설치를 둘러싼 갈등이 이어지고 있다. 학부모들은 학생들이 스스로 피해 사실이나 사고 경위를 설명하기 어려운 만큼 급식실, 감각운동실 등 사고 위험이 있는 공간에 CCTV를 설치해야 한다고 요구한다. 사진은 동천학교 급식실. /독자 제공 [더팩트ㅣ김태연 기자] #지난 2021년 3월 중증 자폐를 가진 초등학교 3학년 전모 군은 갑자기 학교 급식실에 들어가기를 거부하기 시작했다. 전 군은 학교는 물론 집에서조차 음식을 입에 대려하지 않아 한 달만에 몸무게 10㎏이 줄었다. 그러나 이유를 알 길이 없었다. 전 군 어머니 이은선 씨는 \"학교 급식실에 폐쇄회로(CC)TV가 없는데, 당시 학교에 물어봐도 무슨 일이 있었는지 알려주지 않았다\"며 \"아이는 자폐가 있어 무슨 일이 있었는지 스스로 설명하기 어려워하는 상황\"이라고 울먹였다. 전 군은 이후 1년 가까이 급식실에 들어가지 못했다. 적응 훈련 끝에 현재는 급식실에 들어갈 수 있지만 5년이 지난 지금도 여전히 집 밖에서는 음식을 거의 먹지 못하는 등 섭식장애를 겪고 있다. 서울 노원구 특수학교인 동천학교에서 CCTV 설치를 둘러싼 갈등이 이어지고 있다. 학부모들은 스스로 피해 사실이나 사고 경위를 설명하기 어려운 장애 아이들 특성상 급식실 등에 CCTV를 설치해야 한다고 요구한다. 그러나 학교 측은 개인정보 보호와 교육활동 위축 등을 이유로 반대하고 있다. 7일 취재를 종합하면 동천학교 학부모들이 급식실 CCTV 설치를 요구한 건 지난 2023년 5월부터다. 전 군 사례처럼 사고가 나더라도 확인하기 어려운 상황을 막아야 한다는 취지였다. 학부모들은 교내 여러 공간에 CCTV 설치를 원했지만 학교 측 부담을 고려해 급식실부터 설치를 추진하기로 했다. 이후 3년이 지난 올해 7월3일 제181차 학교운영위원회에서 9명 중 6명의 찬성으로 '급식실 CCTV 설치 요청' 안건이 가결됐다. 그러나 학교는 지난 8월5일 CCTV 설치를 거부한다고 공지했다. 교직원 139명을 대상으로 설문조사를 진행한 결과 121명이 교육활동 및 개인정보 보호 등을 이유로 CCTV 설치에 반대했기 때문이다. 학교 측은 \"급식실은 단순한 식사 공간이 아니라 학생들을 대상으로 식사 예절과 자립 등을 교육하는 공간인 만큼 CCTV 설치가 교육활동과 사생활","category":"사회"},{"title":"이용철 법무장관 후보 “참여정부서 검찰개혁 수행…차질없이 완수”","link":"https://n.news.naver.com/mnews/article/056/0012288941","naverLink":"https://n.news.naver.com/mnews/article/056/0012288941","pubDate":"2026-11-07T00:25:29.654393+09:00","author":"네이버뉴스","description":"이용철 법무부 장관 후보자가 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계 안착에 힘쓰겠다고 밝혔습니다. 이 후보자는 오늘(6일) “공소청과 중수청(중대범죄수사청)이 새로 출범하고 형사사법체계가 크게 개편된 엄중한 시기에 법무행정을 책임지는 법무부 장관 후보자로 지명받아 막중한 책임감을 느낀다”고 법무장관 후보자로 지명된 소감을 전했습니다. 이어 “대통령께서 저를 법무부 장관 후보자로 지명하신 이유는 참여정부 청와대 법무비서관으로서 검경 수사권 조정 등 검찰개혁과 사법제도 개혁 업무를 수행했던 경험을 살려 검찰개혁을 완수하고, 큰 폭으로 개정된 형사사법체계의 안착에 역할을 해달라는 것이라고 생각한다”고 했습니다. 그러면서 “만약 장관으로 일할 수 있는 기회가 주어진다면 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계의 빠른 안착에 힘쓰는 한편 범죄 피해자를 비롯한 사회적 약자의 인권 보호를 위해 최선을 다하겠다”고 강조했습니다. 이 후보자는 또 “국민 여러분께 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다”고 덧붙였습니다. [사진 출처 : 연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"이원석 전 검찰총장 \"위헌·위법 특검 그만둬야\"‥현직 검사들도 반발","link":"https://n.news.naver.com/mnews/article/214/0001533901","naverLink":"https://n.news.naver.com/mnews/article/214/0001533901","pubDate":"2026-11-07T00:23:53.454619+09:00","author":"네이버뉴스","description":"이원석 전 검찰총장이 특별검사 수사의 적법성을 문제 삼으며 중단을 요구했다.\n현직 검사들 사이에서도 반발이 나왔다는 내용으로, 특검의 권한과 수사 절차를 둘러싼 논쟁이 이어지고 있다.\n관련 기관의 입장과 법적 판단이 향후 쟁점이 될 전망이다.","category":"사회"}],"생활":[{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:01:20.877942+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T10:01:20.877910+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:01:19.954918+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:01:19.954869+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:01:18.745704+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활"},{"title":"임신 중 출혈 30대 산모…구급차서 31주차 아기 출산, 생명 구했다","link":"https://n.news.naver.com/mnews/article/015/0005351317","naverLink":"https://n.news.naver.com/mnews/article/015/0005351317","pubDate":"2026-11-07T00:26:26.611986+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:01:20.877925+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:01:20.877894+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"문화"},{"title":"인공지능 시대 인간다움 묻는 ‘2026 인문문화축제’ 개막… 주제는 ‘인문지능’","link":"https://n.news.naver.com/mnews/article/081/0003696655","naverLink":"https://n.news.naver.com/mnews/article/081/0003696655","pubDate":"2026-11-07T10:01:20.877887+09:00","author":"네이버뉴스","description":"- 6일 개막특별포럼서 이세돌·최성운 인문대담 및 제3차 인문정신문화 진흥 기본계획 논의 - 8일까지 서울 마포구 레이어스튜디오11서 인문대화·전시·탐방 등 다채로운 프로그램 운영 ▲6일 서울 마포구 레이어스튜디오11에서 열린 ‘2026 인문문화축제’ 개막특별포럼에서 임진택 한국문화예술교육진흥원장, 김선욱 인문정신문화진흥심의회 위원장, 김재원 국회의원, 정향미 문화체육관광부 문화예술정책실장 등 주요 인사들이 기념촬영을 하고 있다. (사진=한국문화예술교육진흥원 제공) 문화체육관광부(장관 최휘영, 이하 문체부)와 한국문화예술교육진흥원(원장 임진택, 이하 진흥원)이 공동 주최·주관하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막특별포럼을 시작으로 막을 올렸다. 올해로 3회째를 맞은 이번 축제는 ‘인문지능’을 주제로 오는 8일까지 이어진다. ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 스스로를 돌아보고 타인을 이해하며 삶의 방향을 주체적으로 선택하는 힘을 뜻한다. 첫날 열린 개막특별포럼은 정향미 문체부 문화예술정책실장의 환영사와 김재원 국회의원, 김선욱 인문정신문화진흥심의회 위원장의 축사로 시작됐다. 이어 인공지능 ‘알파고’와 대국을 펼쳤던 이세돌 전 프로바둑기사와 최성운 PD가 나서 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 인문대담을 진행했다. 대담 직후에는 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발제하고, 성해영 서울대 종교학과 교수를 좌장으로 김희삼 광주과학기술원(GIST) 교수, 정종은 부산대 교수, 강현조 와우랩(WOWLAB) 이사가 참여해 AI 시대 인문의 의미와 인문정책의 정체성, 생활권 인문 확산 방안을 논의했다. 6일 저녁 임진택 원장의 축사로 문을 여는 개막프로그램 ‘인문의 밤–삶의 무늬’는 황인찬 시인과 양희은 가수의 토크콘서트 ‘노래가 된 시’로 채워지고 이어 인문사업 성과 발표회도 열린다. 7일에는 김겨울 작가·김초희 영화감독·이충녕 콘텐츠 창작자의 ‘비교하지 않는 나만의 속도’, 이종범 웹툰 작가·심채경 천문학자·박혜진 편집자의 ‘당신의 일에도 인문이 있나요’, 한국교육방송공사(EBS)와 공동 기획한 선우정아 가수·조병수 건축가의 ’인문의 밤–사유의 시간’이 이어진다. 8일에는 넉살 가수·임승원 콘텐츠 창작자·유규선 콘텐츠기획자가 ‘설렘은 편집되지","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:26:26.611969+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막","link":"https://n.news.naver.com/mnews/article/079/0004207114","naverLink":"https://n.news.naver.com/mnews/article/079/0004207114","pubDate":"2026-11-07T00:26:26.611885+09:00","author":"네이버뉴스","description":"사유·공감·관계의 가치 조명…전국서 인문행사 풍성 문체부 제공 인공지능(AI) 시대에 인간 고유의 사유와 판단, 공감의 가치를 되짚는 '2026 인문문화축제'가 6일 서울에서 개막한다. 이세돌 전 프로바둑기사와 김겨울 작가, 심채경 천문학자 등 다양한 분야의 인사들이 시민들과 만나 인문의 가치를 이야기한다. 문화체육관광부는 한국문화예술교육진흥원과 함께 이날부터 8일까지 서울 마포구 레이어스튜디오11에서 '2026 인문문화축제'를 개최한다고 6일 밝혔다. 올해 축제의 주제는 '인문지능'이다. AI가 답을 제시하는 시대일수록 스스로 질문하고 판단하며 타인을 이해하는 능력이 중요하다는 취지다. '생각의 주도권', '경험의 고유성', '관계의 재발견'을 중심으로 대담과 공연, 전시, 체험 프로그램을 선보인다. 개막일인 6일에는 이세돌 전 프로바둑기사와 최성운 PD가 'AI가 둘 수 없는 한 수'를 주제로 인간의 판단과 선택에 관해 대담한다. 이어 '제3차 인문정신문화 기본계획' 수립을 위한 정책토론회가 열린다. 7일에는 김겨울 작가와 김초희 영화감독, 이충녕 콘텐츠 창작자가 '비교하지 않는 나만의 속도'를 주제로 이야기를 나눈다. 웹툰 '닥터 프로스트'의 이종범 작가와 심채경 천문학자, 박혜진 문학평론가는 '당신의 일에도 인문이 있나요'를 주제로 일과 삶의 의미를 짚는다. 8일에는 래퍼 넉살과 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 '설렘은 편집되지 않아요'를 주제로 일상의 경험과 관계, 기록의 의미를 이야기한다. 공연 프로그램인 '인문의 밤'도 마련된다. 6일에는 황인찬 시인과 가수 양희은이 시와 노래가 만나는 토크콘서트 '노래가 된 시'를 선보인다. 7일에는 가수 선우정아와 건축가 조병수가 참여하는 '사유의 시간'이 이어진다. 행사장에서는 '길 위의 인문학', '지혜학교' 등 주요 인문사업의 성과를 소개하는 전시와 시민 참여형 회고록 프로그램이 진행된다. 상수동 골목과 경의선 숲길, 홍대 일대를 걸으며 지역의 문화와 이야기를 살펴보는 인문탐방도 운영한다. 축제와 연계한 인문 프로그램은 전국으로 확대된다. 전국 10개 지역서점에서는 한유주 소설가, 정재승 뇌과학자, 황보름·정혜윤 작가 등이 참여하는 북토크가 열린다. 이와 함께 11월 한 달간 전국 193곳에서 다양한 인문문화 프로그램이 진행된다. 문체부 정향미 문화예술정책실장은 \"인공지능 시대에도 삶의 방향을 정하는 것은 결국 사람이며, 그 힘은 인문에서 나온","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:26:26.121640+09:00","author":"네이버뉴스","description":"20년 전 그래픽카드 개봉·PC 장착 체험 무료 게임 공개 AI 시대 연 '지포스 8800 GTX' 출시 20주년 기념 [이데일리 한광범 기자] 엔비디아(NVIDIA)가 최근 인공지능(AI) 산업의 토대가 된 그래픽카드 ‘지포스 8800 GTX’ 출시 20주년을 맞아 2006년 PC 게이밍 환경을 재현한 무료 체험 콘텐츠를 공개했다. 과거 그래픽카드를 직접 개봉하고 컴퓨터에 장착하는 경험을 최신 그래픽 기술로 되살린 것이 특징이다. 엔비디아는 6일 지포스 8800 GTX 출시 20주년을 기념하는 스팀(Steam) 데모 ‘지포스 8800 GTX - 전설의 20년’을 소개했다. 해당 콘텐츠는 지난 5일 스팀에 무료로 공개됐으며, 이용자가 직접 조작할 수 있는 반응형 기술 데모 형태로 제작됐다. 지포스 8800 GTX는 2006년 11월 8일 출시된 고성능 그래픽카드다. 당시 ‘컴퍼니 오브 히어로즈’, ‘바이오쇼크’, ‘크라이시스’ 등 고사양 PC 게임을 구동하는 대표적인 제품으로 주목받았다. 특히 2007년 출시된 크라이시스는 높은 그래픽 요구 사양으로 유명해지면서 PC 성능을 가늠하는 상징적인 게임으로 자리 잡았다. 이 제품의 역사적 의미는 게임 성능에만 있지 않다. 지포스 8800 GTX는 엔비디아가 개발한 병렬 컴퓨팅 플랫폼 쿠다(CUDA)를 지원한 최초의 그래픽카드다. 이전까지 주로 화면에 그래픽을 그리는 데 사용하던 GPU를 과학 계산과 시뮬레이션 등 다양한 연산 작업에 활용할 수 있는 기반을 마련했다. 당시 제품에는 G80 아키텍처를 기반으로 한 128개의 통합 스트림 프로세서가 탑재됐다. 그래픽 처리 과정에서 서로 다른 작업에 연산 자원을 유연하게 배분하는 구조로, 다이렉트X 10도 지원했다. 768MB GDDR3 메모리와 384비트 메모리 버스를 갖춘 것도 특징이었다. 쿠다를 통해 GPU의 병렬 연산 능력을 일반적인 컴퓨팅 작업에 활용할 수 있게 되면서 GPU의 쓰임새는 점차 확대됐다. 과학 연구와 영상 처리 등을 거쳐 오늘날 대규모 AI 모델을 학습하고 실행하는 가속 컴퓨팅으로 이어졌다. 엔비디아가 20년 전 그래픽카드를 기념하면서 게임뿐 아니라 쿠다의 역사를 강조하는 이유다. 이번 기념 데모는 언리얼 엔진 아티스트 딜런 브라운이 엔비디아의 지원을 받아 제작했다. 이용자는 2006년 분위기로 꾸며진 게임방에 들어가 지포스 8800 GTX의 포장을 뜯고 그래픽카드를 살펴본 뒤 당시 사양을 재현한 PC","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:26:25.553816+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"문체부·한국문화예술교육진흥원, '2026 인문문화축제' 개막","link":"https://n.news.naver.com/mnews/article/014/0005600649","naverLink":"https://n.news.naver.com/mnews/article/014/0005600649","pubDate":"2026-11-07T00:25:30.946345+09:00","author":"네이버뉴스","description":"문화체육관광부와 한국문화예술교육진흥원이 2026 인문문화축제를 시작했다.\n축제는 인문학을 일상과 연결하고 시민이 다양한 분야의 관점을 접하도록 기획됐다.\n기술 변화 속에서 인간과 사회의 가치를 생각하는 자리를 마련한다.","category":"문화"},{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:23:55.654948+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"},{"title":"AI 시대 인간다움 묻는다… 2026 인문문화축제 6일 개막","link":"https://n.news.naver.com/mnews/article/020/0003760673","naverLink":"https://n.news.naver.com/mnews/article/020/0003760673","pubDate":"2026-11-07T00:22:58.194682+09:00","author":"네이버뉴스","description":"‘2026 인문문화축제’ 참여형 전시 ‘인문상점’에서 관람객이 청년들의 질문을 고르고 있다. 한국문화예술교육진흥원 제공 문화체육관광부와 한국문화예술교육진흥원이 공동 주최하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해로 3회째인 해당 축제는 ‘인문지능’을 주제로 8일까지 사흘간 열린다. 주최 측은 ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 나를 돌아보고, 타인을 이해하며, 삶의 방향을 스스로 선택하는 힘을 뜻한다고 설명했다. 개막특별포럼에서는 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 대담했다. 이어 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발표하고, 성해영 서울대 종교학과 교수를 좌장으로 학계와 산업계 전문가들이 AI 시대 인문의 의미와 인문정책의 방향, 생활권 인문 확산 방안을 논의했다. 축제 기간에는 작가와 예술인, 콘텐츠 창작자가 참여하는 대담과 공연도 이어진다. 6일에는 황인찬 시인과 양희은 가수가 ‘노래가 된 시’를 주제로 토크콘서트를 연다. 7일에는 김겨울 작가와 김초희 영화감독 등이 ‘비교하지 않는 나만의 속도’를 주제로 이야기를 나눈다. 이종범 웹툰 작가와 심채경 천문학자 등은 일과 인문의 관계를 다룬다. 8일에는 넉살 가수 등이 참여하는 대담이 진행된다. 관람객이 직접 참여하는 전시도 마련됐다. 전국 인문 프로그램의 현장을 소개하는 ‘인문의 길’, 다른 사람의 회고록에 자신의 이야기를 이어 쓰는 ‘우리의 회고록’, 청년인문실험 100개 팀의 질문을 살펴보는 ‘인문상점’ 등이 운영된다. 안동 인문행복센터의 ‘인문행복트럭’과 마포·홍대 일대를 걷는 ‘인문탐방’도 진행된다. 축제와 연계한 전국 단위 인문 프로그램도 11월 한 달간 이어진다. 전국 10개 지역서점에서 북큐레이션과 북토크를 열고, ‘청년인문교실’과 ‘길 위의 인문학’, ‘지혜학교’, ‘모두의 인문학’ 등 프로그램을 전국 193곳에서 운영한다. 임진택 한국문화예술교육진흥원장은 “AI 시대에 인간다움을 지키는 힘은 인문적 사유에서 나온다”며 “인문적 소양을 갖춘 시민이 자신과 생활을 바꿔 가는 것이 이번 축제가 말하는 인문지능”이라고 말했다. 인문문화축제는 2024년 처음 시작됐다. 제1회 축제는 ‘시대가 묻고 인문이 답하다’를 주제로 국립중앙박","category":"문화"}],"세계":[{"title":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다","link":"https://n.news.naver.com/mnews/article/011/0004679676","naverLink":"https://n.news.naver.com/mnews/article/011/0004679676","pubDate":"2026-11-07T10:01:19.432705+09:00","author":"네이버뉴스","description":"클립아트코리아 생성형 인공지능(AI)이 학생들의 숙제와 시험 준비에까지 활용되면서 미국 학교의 평가 방식이 달라지고 있다. 집에서 작성하는 에세이 대신 교실에서 직접 글을 쓰거나 말로 답하는 구술시험이 다시 주목받고 있다. 최근 로이터통신에 따르면 미국의 일부 중·고등학교에서는 학생들의 AI 의존도를 낮추기 위해 손 글씨 과제와 대면 평가를 확대하고 있다. 로이터는 최근 미국 전역의 교사와 교육 전문가 12명을 인터뷰해 이러한 변화를 소개했다. 학생이 제출한 결과물만 평가하기보다 학습 내용을 실제로 이해했는지 확인하려는 움직임이다. 챗GPT가 대신 써주는 숙제…구술시험·손 글씨 부활 샌프란시스코에서 6학년 인문학을 가르치는 트리스턴 창 교사는 지난해부터 집에서 작성하는 에세이 숙제를 없앴다. 대신 학생에게 직접 질문을 던지고 답변을 듣는 구술시험을 도입했다. 시험에서는 작품의 등장인물과 줄거리, 주제, 은유적 표현 등을 묻는 15개 질문을 활용한다. 학생이 작품을 얼마나 이해했는지 말로 설명하도록 하는 방식이다. 창 교사는 “오랫동안 기술이 교육 방식을 바꿔왔지만 AI는 그중에서도 가장 급격한 변화”라며 “기존의 모든 방식이 통하지 않게 됐다”고 말했다. 다른 교사들도 숙제를 줄이는 대신 교실에서 학습 과정을 확인하는 데 집중하고 있다. 샌프란시스코의 중학교 영어 교사 러스티 셰이브는 집에서 과제를 해결하기 어려운 학생들이 AI에 의존하기 쉽다고 판단했다. 이에 교실에서 직접 글을 쓰는 시간을 늘렸다. 7학년 학생들과 에세이 한 편을 완성하는 데 한 달을 할애한 적도 있다고 전했다. 수학 수업에서도 변화가 나타났다. 뉴욕의 고등학교 수학 교사 밥슨 웡은 집에서 풀어오는 문제 수를 줄이고 수업 시간에 직접 문제를 해결하도록 했다. AI가 정답뿐 아니라 풀이 과정까지 만들어낼 수 있게 되면서 답을 맞혔는지만으로는 학생의 이해도를 평가하기 어려워졌기 때문이다. 웡 교사는 학생들에게 자신이 선택한 풀이법과 그 이유까지 설명하게 한다. 그는 “AI는 학생들의 수학 공부 방식뿐 아니라 내가 가르치는 방식까지 바꿨다”고 말했다. 디지털 기기 사용을 제한하는 학교도 있다. 시카고 교외의 고등학교 영어 교사 렉스 오발레는 수업이 시작되면 학생들에게 공책부터 꺼내도록 한다. 크롬북을 활용하는 수업은 전체 수업일의 약 10%로 제한했다. 오발레 교사는 “노트북이 없으면 학생들이 뒤에 숨을 수 없다”며 디지털 기기 사용을 줄인 뒤","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:01:19.432691+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 선거 패배에 영향을 미친 뒤 협상에 대한 희망의 조짐이 나타나고 있다. 트럼프는 6일 기자들과 문답하는 과정에서 중재국들의 이란과의 논의가 계속되고 있다고 밝혔다. 트럼프는 “우리는 이란과 대화하고 있다. 이전부터 그래 왔다”고 말했다. 카타르와 이란은 핵 협상으로 나아가기 위한 가교 합의를 논의하고 있다. 역내 당국자들에 따르면 중재국들과 이란은 테헤란의 핵 프로그램에 관한 추가 협상의 길을 여는 데 도움이 될 잠정적 중간 단계 합의를 논의했다. 당국자들은 카타르가 최근 양측에 제시한 이 제안이 이틀에 걸쳐 신뢰 구축 조치를 이행하도록 하는 내용을 담고 있다고 말했다. 이 조치에는 미국의 봉쇄 해제와 이란의 핵 프로그램을 둘러싸고 이란을 고립시키려는 미국의 정책에 따라 수년 동안 압류해 동결한 이란 자금 수십억 달러 가운데 일부를 풀어 주는 방안이 포함된다. 그 대가로 이란은 미국과 이스라엘의 폭격을 받은 자국 시설에 국제원자력기구(IAEA) 사찰단이 들어오는 것을 허용하게 된다고 당국자들은 말했다. 당국자들에 따르면 둘째 날에는 이란이 호르무즈 해협을 다시 개방하게 된다. 이는 이란과 오만이 해당 해협을 놓고 합의했으나 미국의 승인을 받지 못한 수정 합의에 따른 것이다. 이러한 조치들이 이","category":"세계"},{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:01:19.432687+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"트럼프, 그래도 마이웨이… “美에 공장 안 지으면 관세 300%”","link":"https://n.news.naver.com/mnews/article/023/0004008299","naverLink":"https://n.news.naver.com/mnews/article/023/0004008299","pubDate":"2026-11-07T10:01:19.432621+09:00","author":"네이버뉴스","description":"[美중간선거 후폭풍] 선거 패배에도 기존 입장 고수 도널드 트럼프 미국 대통령이 5일(현지 시각) 워싱턴DC 백악관에서 ‘백악관 집무실 국가기념물 지정’ 포고문에 서명하는 행사에 참석해 앉아 있다. /로이터 연합뉴스 도널드 트럼프 미국 대통령이 중간선거 참패 이틀 만인 5일(현지 시각) “미국에 공장을 짓지 않으면 최고 300%의 관세를 내야 한다”며 기존 관세 정책을 고수하겠다는 뜻을 분명히 했다. 공화당 대패의 원인으로 고물가와 이란 전쟁이 지목됐지만 정책 변화보다는 강경 대응을 예고한 것이다. 트럼프는 이날 백악관에서 취재진과 만나 “지금 관세를 없애면 미국에 건설 중인 3000여 공장의 공사가 모두 중단될 것”이라며 “그 대신 중국, 일본, 한국 등에서 제품을 들여오게 될 것”이라고 했다. 관세 철폐를 주장하는 사람들에게는 “어리석은 사람들”이라고 했다. 뉴욕 증시가 폭락하자 책임을 유권자에게 돌리기도 했다. 트럼프는 트루스소셜에 “민주당이 화요일 선거에서 크게 이겼기 때문에 오늘 주식시장이 폭락했다”며 “안타깝지만 여러분 스스로를 탓할 수밖에 없다”고 적었다. 또 다른 글에서는 “여러분의 은퇴 연금 계좌도 하락했다. 기억하라. 공화당이 아니라 민주당 때문”이라고 했다. 선거 결과에 대한 책임도 부인했다. 트럼프는 “나는 투표 용지에 없었다. 내가 출마했다면 압승했을 것”이라고 주장했다. 선거 전 자신의 이름이 투표 용지에 있다고 생각하고 투표하라고 독려했던 것과 달라진 태도다. 향후 국정 운영에 대해서는 “앞으로 1~2주 동안 많은 것을 보게 될 것”이라며 추가 조치를 예고했다. 이란에 대해서도 “가능하면 나머지를 파괴하고 싶지 않지만 그렇게 해야 할 수도 있다”고 했다. 한편 민주당은 하원(총 435석)에서 260석까지 넘볼 수 있는 상황이다. 이날 오후 6시 기준 민주당은 253석을 확보했고, 27석은 당선자가 확정되지 않았다. CBS뉴스는 민주당 최대 의석을 268석까지 전망했다. 민주당이 260석 이상을 확보하면 1990년 이후 36년 만에 최대 규모의 하원 의석을 차지하게 된다.","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:01:18.745702+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"},{"title":"미 중간선거로 보는 기독교 정치…'마가' 균열 시작?","link":"https://n.news.naver.com/mnews/article/079/0004207420","naverLink":"https://n.news.naver.com/mnews/article/079/0004207420","pubDate":"2026-11-07T00:26:26.611946+09:00","author":"네이버뉴스","description":"미국 중간선거 결과를 계기로 기독교 보수 진영의 정치적 결속과 내부 균열을 분석한 기사다.\n선거 이후 종교계와 정치권의 관계, 당내 노선 경쟁이 주요 쟁점으로 다뤄진다.\n향후 미국 정치 지형에 미칠 영향이 주목된다.","category":"세계"},{"title":"일본 다카이치 '타이완 발언' 1년…중국 \"발언 시정해야\"","link":"https://n.news.naver.com/mnews/article/055/0001401267","naverLink":"https://n.news.naver.com/mnews/article/055/0001401267","pubDate":"2026-11-07T00:26:25.553843+09:00","author":"네이버뉴스","description":"▲ 다카이치 사나에 일본 총리 중일 관계 급랭을 불러온 다카이치 사나에 일본 총리의 '타이완 유사시 개입' 시사 발언이 7일로 만 1년을 맞는 상황에서 일본 정부가 '타이완이 중국 영토의 일부'라는 중국 입장을 존중한다고 6일 언급했습니다. 그러나 중국 정부는 중일 관계 악화의 책임이 일본에 있다며 다카이치 총리의 잘못된 발언을 조속히 바로잡으라고 촉구했습니다. 일본 정부 대변인인 기하라 미노루 관방장관은 정례 기자회견에서 해당 발언 1주년에 대한 평가와 향후 중일 관계 설정에 관해 묻는 말에 \"타이완에 관한 정부의 입장은 1972년 중일 공동성명에 명시된 바와 같다\"고 대답했습니다. 1972년 양국이 정식 외교관계를 맺을 당시 채택한 중일 공동성명에서 일본은 \"타이완이 중국 영토의 일부임을 강조한다\"는 중국의 입장을 \"완전히 이해하고 존중한다\"고 명시했습니다. 다카이치 총리는 이날 총리관저에서 기자들과 만나 \"중국은 중요한 이웃 국가이며 여러 과제가 존재함에도 불구하고 오랜 기간 쌓아온 관계가 있다\"고 말했습니다. 그는 이어 \"중국과 전략적 호혜 관계를 포괄적으로 추진하고 공통의 과제에 대해 소통하며 국익을 수호하기 위한 대화를 함으로써 건설적이고 안정적인 관계를 구축해 나갈 것\"이라며 그동안 국회 소신 표명 연설 등에서 했던 중국에 대한 발언을 되풀이했습니다. 이에 대해 궈자쿤 중국 외교부 대변인은 이날 정례브리핑에서 \"중일 관계가 심각한 어려움에 처한 책임은 전적으로 일본 측에 있다\"고 밝혔습니다. 이어 \"1년 전 일본 지도자가 타이완과 관련한 잘못된 발언으로 타이완 문제에 무력 개입하려는 신호를 공개적으로 보내 중국의 국가주권에 도전하고 중일 관계의 정치적 기초를 흔들었다\"고 비판했습니다. 궈 대변인은 특히 \"유감스럽게도 1년이 지났지만 일본 당국은 여전히 제자리걸음을 하면서 문제를 회피할 뿐 잘못을 반성하고 시정하려는 성의와 행동을 보여주지 않고 있다\"며 \"일본이 시급히 해야 할 일은 타이완 문제에 관한 잘못된 언행을 바로잡는 것이고, 중요한 것은 역사 문제에 올바른 태도를 취하는 것\"이라고 주장했습니다. 지난해 말부터 중일 관계가 꼬인 이후 양국의 정상·외교장관 등 고위급 공식 대화는 사실상 중단된 상태입니다. 다만 지난 9월 일본의 민간 중일 경제교류 기구 대표단을 이끌고 방중한 이와야 다케시 전 일본 외무상이 왕이 중국 외교부장을 만나 중일 공동성명을 양국 간 '우회적 화해'의 수단으로 삼을 것을","category":"세계"},{"title":"대승거둔 美 민주당, 이제 온건·진보 노선 투쟁? LA서 민주사회주의자 시장 당선[트럼프 2기]","link":"https://n.news.naver.com/mnews/article/002/0002464732","naverLink":"https://n.news.naver.com/mnews/article/002/0002464732","pubDate":"2026-11-07T00:26:25.553826+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 큰 성과를 거둔 뒤 당내 노선 경쟁이 주목받고 있다.\n온건파와 진보파가 향후 정책 방향과 주도권을 두고 경쟁할 가능성이 제기된다.\n이번 선거 결과가 다음 대선 구도에 미칠 영향도 관심사다.","category":"세계"},{"title":"탄핵 위기 헤그세스 “버티고 싸운다”…민주당에 정면 도발","link":"https://n.news.naver.com/mnews/article/028/0002831117","naverLink":"https://n.news.naver.com/mnews/article/028/0002831117","pubDate":"2026-11-07T00:26:25.553824+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"세계"},{"title":"최악 산불이 불붙인 반정부 시위… 거리로 나선 인니 Z세대","link":"https://n.news.naver.com/mnews/article/005/0001883556","naverLink":"https://n.news.naver.com/mnews/article/005/0001883556","pubDate":"2026-11-07T00:26:25.553815+09:00","author":"네이버뉴스","description":"대형 산불 이후 인도네시아에서 정부의 재난 대응과 환경 관리에 항의하는 시위가 확산했다.\n청년층이 거리 집회에 나서며 산불 피해와 정책 책임을 묻고 있다는 내용이다.\n재난 예방과 피해 복구, 정부의 설명 책임이 주요 쟁점으로 떠올랐다.","category":"세계"}],"IT 과학":[{"title":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”","link":"https://n.news.naver.com/mnews/article/366/0001203195","naverLink":"https://n.news.naver.com/mnews/article/366/0001203195","pubDate":"2026-11-07T10:01:19.954944+09:00","author":"네이버뉴스","description":"“한국, 기술·제조·대규모 생산 갖춘 반도체 생태계” “부천 공장, SiC 공급 규모·품질·안정성 확보에 기여” “AI 데이터센터 전력 효율이 경쟁력… 모든 와트가 중요” “부천 공장은 온세미의 글로벌 실리콘카바이드(SiC) 전략에서 핵심적인 역할을 한다. 전력반도체 수요가 늘어나는 가운데 생산 규모와 품질, 안정적인 공급 능력을 갖추는 데 중요한 거점이다.” 하산 엘 코우리(Hassane El-Khoury) 온세미 회장 겸 최고경영자(CEO)는 지난달 11일 조선비즈와의 서면 인터뷰에서 이렇게 말했다. 미국 전력반도체 기업 온세미는 전기차와 산업용 설비 등에 쓰이는 전력반도체와 센싱 기술을 주력으로 한다. SiC는 높은 전압과 전력을 효율적으로 처리할 수 있는 차세대 전력반도체 소재다. 엘 코우리 CEO는 인공지능(AI) 데이터센터와 전기차 시장에서 전력 효율의 중요성이 커지면서 반도체 생산 능력과 안정적인 공급망이 기업의 경쟁력을 좌우할 것으로 내다봤다. 엘 코우리 CEO는 자동차 부품업체 콘티넨탈에서 엔지니어로 경력을 시작해 사이프러스반도체 CEO를 역임했으며, 2020년 12월 온세미 CEO로 취임했다. 하산 엘 코우리 온세미 회장 겸 최고경영자(CEO). /온세미 제공 부천 공장은 과거 삼성전자의 전력반도체 생산시설로, 1999년 페어차일드에 매각됐다가 2016년 온세미의 페어차일드 인수로 온세미 생산기지에 편입됐다. 온세미는 2018년부터 부천에서 SiC 전력반도체를 생산했으며, 2023년에는 약 1조4000억원을 투자한 SiC 생산시설 확충 사업을 완료했다. 당시 회사는 신규 생산라인이 완전 가동되면 연간 100만장 이상의 200㎜(8인치) SiC 웨이퍼를 생산할 수 있다고 밝혔다. 온세미는 1999년 모토로라의 반도체 사업부에서 분사해 설립됐다. 2016년 페어차일드반도체를 인수하며 사업을 확대했고, 2021년 기존 온세미컨덕터에서 온세미로 사명을 변경했다. 올해 2분기 매출은 16억400만달러(약 2조2000억원)로 전년 동기 대비 9% 증가했다. 영업이익률은 미국 일반회계기준(GAAP) 16.1%를 기록했다. 회사는 AI 데이터센터를 가장 빠르게 성장하는 사업으로 꼽으며 올해 관련 매출이 전년 대비 두 배 이상 늘어날 것으로 전망했다. 엘 코우리 CEO는 “한국은 기술력과 제조 능력, 대규모 생산 능력을 모두 갖춘 나라”라며 “이 세 가지를 동시에 갖춘 반도체 생태계는 세계적으로도 드물다”고","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:01:19.954936+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:01:19.954930+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:01:19.954914+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고","link":"https://n.news.naver.com/mnews/article/092/0002444296","naverLink":"https://n.news.naver.com/mnews/article/092/0002444296","pubDate":"2026-11-07T00:26:26.611988+09:00","author":"네이버뉴스","description":"AI 데이터센터 수요가 반도체 공급을 빠르게 흡수하면서 자동차 업계의 부품 수급 부담이 커질 수 있다는 전망이다.\n반도체 확보 경쟁이 이어질 경우 차량 생산비와 소비자 가격에도 영향을 줄 수 있다.\n내년 공급 상황과 가격 변동이 업계의 주요 변수로 꼽힌다.","category":"IT 과학"},{"title":"앤트로픽 IPO 미뤄지나…\"美 기술주 급락 여파\"","link":"https://n.news.naver.com/mnews/article/092/0002444279","naverLink":"https://n.news.naver.com/mnews/article/092/0002444279","pubDate":"2026-11-07T00:26:26.121658+09:00","author":"네이버뉴스","description":"미국 기술주 급락으로 투자심리가 얼어붙으면서 앤트로픽의 기업공개 추진 일정에도 차질이 생길 수 있다는 우려가 제기됐다. AI 관련주 전반의 변동성이 커진 가운데 시장의 관심은 상장 계획과 투자자 수요에 쏠리고 있다.","category":"IT 과학"},{"title":"AMD 마침내 인텔 넘어서나? 데이터센터 실적이 예고한 판도 변화 [고든 정의 TECH+]","link":"https://n.news.naver.com/mnews/article/081/0003696682","naverLink":"https://n.news.naver.com/mnews/article/081/0003696682","pubDate":"2026-11-07T00:26:26.121654+09:00","author":"네이버뉴스","description":"AMD와 인텔 모두 AI 데이터센터 수요에 힘입어 3분기 실적이 성장했지만, 데이터센터 사업의 성장률과 향후 전망에서는 차이가 나타났다. AMD는 AI GPU를 포함한 헬리오스 랙 시스템의 초기 매출을 반영했고, 이런 흐름이 이어지면 인텔과의 매출 격차가 좁혀지거나 역전될 가능성이 제기된다.","category":"IT 과학"},{"title":"\"미국 주춤해도 한국은 멈추면 안 돼\"…정부, AI 투자 지속 강조","link":"https://n.news.naver.com/mnews/article/015/0005351223","naverLink":"https://n.news.naver.com/mnews/article/015/0005351223","pubDate":"2026-11-07T00:26:26.121647+09:00","author":"네이버뉴스","description":"배경훈 부총리, AI 데이터센터 투자 지속 강조 美 중간선거 후 AI 관련주 급락·투자 위축 우려 사이버 보안 차르 논의…초거대 AI 개발 검토 사진=연합뉴스 미국 중간선거 이후 인공지능(AI) 데이터센터 투자 위축 우려가 커지자 배경훈 부총리 겸 과학기술정보통신부 장관이 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 열기가 식더라도 다른 국가들이 이를 기회로 삼을 수 있다는 판단에서다. 배 부총리는 6일 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의를 마친 뒤 기자들과 만나 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦춰선 안 된다\"고 말했다. 최근 미국에서는 중간선거 이후 AI 데이터센터 규제 강화 가능성이 부각되면서 관련 기업의 주가가 하락했다. AI 인프라 투자에도 영향을 미칠 수 있다는 우려가 제기되는 상황이다. 배 부총리는 미국의 투자 움직임이 둔화하더라도 글로벌 경쟁은 계속될 것으로 봤다. 그는 \"미국이 주춤하더라도 중국이나 프랑스, 캐나다 등 다른 국가들은 오히려 이를 기회로 삼을 수 있다\"고 말했다. 이어 \"AI에 대한 기대 심리가 큰 만큼 작은 불안 요인에도 시장이 크게 출렁일 수 있지만 개인적인 견해로는 장기적으로 우상향할 것으로 생각한다\"고 덧붙였다. 배경훈 부총리 겸 과학기술정보통신부 장관. / 사진=뉴스1","category":"IT 과학"},{"title":"\"전력망 비용 다 내겠다\"는 오픈AI… 국내 AI 데이터센터는 고객 확보 관건","link":"https://n.news.naver.com/mnews/article/469/0000964112","naverLink":"https://n.news.naver.com/mnews/article/469/0000964112","pubDate":"2026-11-07T00:26:26.121643+09:00","author":"네이버뉴스","description":"오픈AI는 자체 AI 데이터센터의 전기요금과 전력 인프라 비용을 직접 부담하겠다고 밝혔다. 데이터센터 건설에 따른 지역 주민의 비용 부담과 정보 비공개 관행을 줄이겠다는 취지지만, 국내에서는 계획된 데이터센터 규모에 비해 실제 고객 수요가 충분한지가 과제로 꼽힌다.","category":"IT 과학"},{"title":"AI모델 구독 않고 골라쓰는 시대 열렸다","link":"https://n.news.naver.com/mnews/article/015/0005351238","naverLink":"https://n.news.naver.com/mnews/article/015/0005351238","pubDate":"2026-11-07T00:26:26.121642+09:00","author":"네이버뉴스","description":"KT의 기업용 플랫폼 토큰팩토리는 GPT와 클로드 등을 포함한 73개 AI 모델을 제공하고, 사용량에 따라 요금을 매기는 방식으로 출발했다. 여러 서비스를 월정액으로 구독하는 대신 작업에 맞는 모델을 골라 쓴 만큼 결제하는 방식이며, 향후 제공 모델을 500개 이상으로 늘 function dateOffsetKey(key,offset){
 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);
 return seoulDateKey(d);
}

 const days=window.dailyDays||[];

function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="문화"&&/전시|공연|콘서트|영화|드라마|배우|가수|앨범|음악|미술|박물관|미술관|축제|출판|책|작가|문학|문화재|유네스코|한지|공예|연극|뮤지컬|예술|문화/.test(t)) score+=5;
  if(category==="생활"&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
