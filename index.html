window.NEWS_DATA = {"date":"2026-11-08","generatedAt":"2026-11-07T10:45:31.669993+09:00","total":124,"days":{"today":{"date":"2026-11-08","weekday":"일요일","label":"오늘 · 11월 8일 일요일","total":50,"categories":{"사건 사고":[{"title":"장관들은 농담, 생존용품점은 특수…영국 뜻밖의 재난 대비 풍경","link":"https://n.news.naver.com/mnews/article/025/0003563473","naverLink":"https://n.news.naver.com/mnews/article/025/0003563473","pubDate":"2026-11-07T10:43:27.866312+09:00","author":"네이버뉴스","description":"\" “마스카라, 컨실러(잡티를 가리는 화장품), 소비뇽 블랑 와인 한 병.” \" 앤절라 레이너 영국 주택장관(왼쪽)이 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 앤디 번햄 총리 옆에서 발언하고 있다. 로이터=연합뉴스 앤절라 레이너 영국 주택장관이 지난 9월 한동안 버틸 수 있겠다며 농담처럼 꼽은 비상용품 목록이 약 한 달 뒤 다시 주목받았다. 영국 정부가 지난달 22일(현지시간) 국민에게 72시간을 버틸 비상물품을 갖추라는 ‘비 레디(Be Ready·대비하라)’ 캠페인을 시작하면서다. 이번에는 총리가 비상물품에 술을 넣어도 되느냐는 질문을 받고 술이 우선은 아니지만 한두 잔쯤은 괜찮다는 식으로 답했다. 월스트리트저널(WSJ)은 지난 2일 ‘영국은 종말에 대비하는데, 지도자들은 마스카라와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"‘스카프 아저씨’ 결국 경호원까지 고용했다…인파 몰려 안전사고 우려","link":"https://n.news.naver.com/mnews/article/016/0002720169","naverLink":"https://n.news.naver.com/mnews/article/016/0002720169","pubDate":"2026-11-07T10:43:27.121360+09:00","author":"네이버뉴스","description":"‘스카프 아저씨’(좌)의 상점 앞에 몰린 인파[인스타그램] [헤럴드경제=김성훈 기자] 거침없는 입담으로 SNS 스타가 된 서울 남대문시장 ‘스카프 아저씨’가 민간 경호원까지 고용한 것으로 알려졌다. 너무 많은 인파가 몰려들어 안전관리가 필요한 상황이 됐기 때문이다. 6일 연합뉴스TV에 따르면, 남대문 시장에서 스카프를 판매하는 상인 A 씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 배치했다. 방문객이 너무 많이 몰려 발생할 수 있는 안전사고를 예방하고, 시장 내 질서를 유지하기 위해서다. 앞서 A 씨는 너무 많은 인파에 지난달 31일 임시 휴업을 선택했다. 며칠 간의 휴지기를 거쳐 지난 4일 다시 문을 열었지만 상황은 달라지지 않았고, 경찰이 출동하는 소동까지 벌어졌다. 결국 A 씨는 5일 다시 영업을 중단했다. 그는 자신의 SNS인 ‘남대문 다다구리’에 “요즘 생각지도 못한 너무 많은 관심과 사랑을 받고 있어서 솔직히 가슴 한구석에는 엄청난 부담감과 불안함이 있다”고 털어놨다. 구경 인파가 몰려들어 누군가 다치지 않을까 염려를 하면서 “앞으로 생길 일들에 살짝 두려운 마음이 드는 것도 사실이다”라고 했다. 남대문시장 상인회 차원에서도 사고 예방을 위해 촉각을 곤두세우고 있는 상황이다. 스카프 6장을 1만원에 판매하는 A 씨는 최근 온라인상에서 손님들에게 유쾌한 농담을 건네는 모습이 확산되면서 일약 SNS 스타가 됐다. 그는 손님들에게 “돈 쓰지 마. 이거 집에 가면 더 별로야”, “이걸로 땀이나 닦아, 하고 다니지 말고”라며 오히려 구매를 만류한다거나, 매대 가득한 스카프를 들추는 손님에게 “교양 있게 행동하지 마, 뒤집어야 나올 거 아니여~” 등의 입담으로 손님들의 웃음을 자아냈다. 이에 스카프를 사기보다 A 씨의 입담을 직접 듣거나 사진을 찍으려는 사람까지 늘면서 안전 문제와 타 업장 피해까지 발생하는 상황이 빚어지고 있다.","category":"사건 사고"},{"title":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다","link":"https://n.news.naver.com/mnews/article/215/0001271980","naverLink":"https://n.news.naver.com/mnews/article/215/0001271980","pubDate":"2026-11-07T10:43:27.121356+09:00","author":"네이버뉴스","description":"임시조치 닷새만에 베란다 창문으로 들어가 가족 접근 지인 집 도어락 부수고 금품 절도까지 사진=연합뉴스 어머니와 외할머니를 폭행해 법원으로부터 접근금지 명령을 받은 30대 남성이 불과 닷새 만에 베란다 창문을 통해 집에 들어갔다가 처벌받았다. 춘천지법 형사3단독 박동욱 판사는 가정폭력범죄의 처벌 등에 관한 특례법 위반 혐의 등으로 재판에 넘겨진 A(37)씨에게 징역 10개월에 집행유예 2년을 선고했다고 7일 밝혔다. 아울러 보호관찰과 사회봉사 120시간도 명령했다. 공소사실에 따르면 A씨는 지난 6월 어머니와 외할머니를 때려 법원으로부터 주거지 즉시 퇴거와 가족들에 대한 접근·연락을 금지하는 임시 조치를 받았다. 그러나 A씨는 법원의 결정을 무시하고 닷새 만에 베란다 창문을 통해 집 안으로 들어가 가족들에게 접근했다. 비슷한 시기 평소 알고 지내던 지인의 집에 침입해 금품을 훔치기도 했다. 그는 술자리에서 알게 돼 친분을 쌓은 B씨의 집 현관문 도어락을 소화기로 내리쳐 부순 뒤 집 안으로 침입한 뒤 거실에 놓여 있던 B씨의 가방에서 차량 스마트키와 6장을 훔친 것으로 드러났다. 박 판사는 \"범행을 모두 인정하며 반성하고 있으나 존속폭행으로 임시 조치 결정을 받았는데도 가족들에게 접근하고, B씨의 집에 침입해 절도 범행을 저질러 죄질이 좋지 않으며, 피해자들과 합의하지 못한 점 등을 종합해 형을 정했다\"고 판시했다.","category":"사건 사고"},{"title":"사람 몰려 경찰 출동…‘남대문 스카프’ 아저씨, 경호원까지 고용했다","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:43:27.121353+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:43:27.121339+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로","link":"https://n.news.naver.com/mnews/article/028/0002831127","naverLink":"https://n.news.naver.com/mnews/article/028/0002831127","pubDate":"2026-11-07T10:43:27.121337+09:00","author":"네이버뉴스","description":"피해자가 요청한 ‘학급 교체’, 교육청 권고에도 학교장은 외면 사진은 기사 내용과 무관. 게티이미지뱅크 서울 시내 한 중학교에서 학교폭력을 겪은 피해자가 학교에 ‘학급 교체’를 지속해서 요청했지만, 거절당한 것으로 확인됐다. 사태 파악에 나선 서울특별시교육청 학생인권옹호관마저 학교에 ‘학급 교체 검토’를 제안했는데, 권한이 있는 교장은 ‘다른 사건과의 형평성’을 이유로 응하지 않고 있다. 학폭 신고했더니 돌아온 건 ‘맞학폭’ 서울 성북구 개운중학교에 다니는 ㄴ양은 2026년 5월부터 특정 무리한테 놀림을 당했다. 한겨레21이 입수한 학교폭력대책심의위원회(학폭위) 회의록을 보면, 학교폭력 가해자로 신고당한 개운중 동급생들은 ㄴ양과 눈이 마주치자, “코알라가 꼬나본다” “노무현, 코알라, 노숙자 중에 뭐로 불러줄까”라고 말하며 조롱했다. ‘코알라’는 극우 커뮤니티 등에서 노무현 전 대통령의 외모를 희화화하려고 쓰는 멸칭이자 혐오 표현이다. 이들은 ㄴ양의 귀에 대고 소리를 지르거나, 여럿이 모여 주변을 “펄쩍펄쩍” 뛰면서 돌고 6분가량 동물 소리를 지르고 얼굴을 “5㎝” 가까이 들이밀기도 했다. 동급생들의 괴롭힘을 견디지 못한 ㄴ양은 6월18일 가해 학생들을 신고했다. 그는 8월10일 열린 학폭위에 출석해 “다른 친구들과 관계가 좋았지만, 가해자들이 놀리기 시작하면서 친구들도 나를 피했다”고 호소했다. 가해 학생들의 부모는 사건 초기 서면 사과로 무마하려다 신고당하자, 되레 학폭으로 ㄴ양을 신고했다. ㄴ양 아버지는 “가해자나 가해자 학부모들은 전혀 반성하지 않고 사과의 진정성이 없다”며 “학생부 생활센터 지도 선생님들이 (가해) 아이들을 불러 야단쳤더니 오히려 학부모들이 ‘당신들이 뭔데 우리 애를 야단치고 가해자 몰이를 하느냐’며 화냈다고 들었다”고 말했다. 보호자와 함께 학폭위에 출석했던 가해 학생 중 일부는 조사관과의 진술마저 뒤집으며 학폭을 부인하기도 했다. 한 가해자의 어머니는 맞학폭을 신청한 이유를 묻는 말에 “ㄴ양을 향한 보복이라기보단 저희 아이의 억울한 상황을 조금 이야기해야겠다는 차원”이라고 설명했다. 교장 “학폭위 결정 없었으니…” 학폭위는 8월10일 ㄴ양의 신고 내용 대부분을 사실로 인정해 신고당한 같은 반 동급생 5명에게 징계를 내렸다. 이 중 3명은 ‘서면 사과’ 외에 ‘학교 봉사, 특별교육 이수, 보호자 특별교육 이수, 피해자 접촉·협박 및 보복행위 금지’ 처분을 받았다. ㄴ양 부모는 추가로","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:43:27.121332+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"김민석 사과하면 끝? '수사' 촉구하는 조선·중앙일보","link":"https://n.news.naver.com/mnews/article/006/0000138618","naverLink":"https://n.news.naver.com/mnews/article/006/0000138618","pubDate":"2026-11-07T10:43:27.121317+09:00","author":"네이버뉴스","description":"[AI 뉴스 브리핑] ▲김민석 더불어민주당 대표가 2026년 11월5일 당내 신천지 비밀연합 폭로를 두고 의총에서 증거가 없었다고 인정하고 비공개 사과한 것과 관련해 민티07에 출연해서도 당원여러분께 죄송하기도 하고 감사하기도 하다라고 사과하고 있다. 사진=민티07 영상 갈무리 김민석 더불어민주당 대표는 지난 8월 전당대회 때 경쟁 후보를 겨냥해 제기했던 신천지 관련 의혹에 증거가 없었다며 사과했다. 민주당은 자체 조사 보고서를 전면 공개하지 않고 당내 인사들이 제한적으로 열람하도록 했다. 보수언론에선 수사를 촉구했다. 6일 주요신문 사설을 정리했다. 민주당 신천지 의혹에 조사 결과 공개와 수사 요구 조선일보는 에서 김 대표의 의혹 제기와 조사 결과 비공개를 함께 문제 삼았다. \"김 대표가 전대 과정에서 신천지를 끼운 '3자 연합설'로 정치적 이득을 노렸다는 것은 부인하기 어렵다\"며 \"김 대표 스스로 허위사실을 공표했다고 자백한 셈인데 이런 식의 사과로 끝날 일인지 의문이다\"라고 했다. 이어 국민의힘 관련 신천지 의혹 수사와 비교했다. \"민주당 사정도 별반 다르지 않다는 소문이다. 전국동시지방선거가 있었던 2022년 이후 민주당에 입당한 신천지 신도가 적어도 2만~3만명이라고 한다\"고 전하면서 \"사실이라면 김 대표 말처럼 덮고 지나갈 일이 아니다\"라고 했다. 인용된 입당 규모는 사설에서 소문으로 제시한 수치다. 중앙일보도 에서 제한적 열람으로는 의혹을 해소하기 어렵다고 했다. \"조사 결과는 비공개로 묶은 채 관련 자료만 제한적으로 의원들에게 열람하게 하는 미봉책을 택했다\"며 \"뭔가 숨기는 게 있다는 의심만 짙어진다\"고 비판했다. 중앙일보는 국민의힘 관련 의혹에 검경 합동수사본부의 강제수사가 이뤄진 점을 들었다. \"민주당에도 같은 원칙과 잣대가 적용돼야 마땅하다\"며 \"민주당은 사안을 덮으려 하지 말고 수사기관에 정식 의뢰해 있는 그대로 진상을 밝혀야 한다\"고 촉구했다. 대통령 유튜브 방송에 소통 확대보다 경청 요구 이재명 대통령은 5일 개인 유튜브 채널을 통해 방송 '대통령의 Y'를 시작했다. 청와대는 2~3주 간격으로 방송을 이어가되 주요 현안이 생기면 횟수를 늘릴 수 있다고 밝혔다. 이 대통령은 첫 방송에서 사회관계망서비스(SNS) 등을 통한 직접 소통이 \"목숨줄 같은 존재\"라고 말했다. 세계일보는 에서 기존 SNS 활동에 유튜브 방송까지 더해지는 점을 우려했다. \"견제 없는 일방적 메시지 전달에 얼마나 많은","category":"사건 사고"},{"title":"“‘검사 수사권 선택적 부활’은 위헌”…법조계, 조작기소 특검법에 거센 반발","link":"https://n.news.naver.com/mnews/article/022/0004173222","naverLink":"https://n.news.naver.com/mnews/article/022/0004173222","pubDate":"2026-11-07T10:43:27.121310+09:00","author":"네이버뉴스","description":"‘조작기소 특검법’이 더불어민주당 주도로 6일 여당 주도로 국회 본회의를 통과한 가운데 법조계 안팎에서 반발이 거세다. 지난달 2일 개정 형사소송법 시행과 함께 검사의 수사권이 폐지된 상황에서 조작기소 특검법이 파견검사의 수사권과 지휘권은 종전 형사소송법을 따라 부활시켰다는 점을 두고 “위헌 소지가 높다”는 비판이다. 7일 법조계에 따르면 법원행정처는 조작기소 특검법안 검토 의견서에서 “10월2일 형사사법절차 개편이 이뤄졌음에도 제정안은 수사·기소 분리와 관련된 사항이 반영돼 있지 않아 이를 반영할 필요가 있다”고 밝혔다. 이밖에도 △이의신청 규정의 부재 △공소유지 변호사 도입 △이례적인 영장재판의 전속관할(서울중앙지법)·영장전담법관 보임 △수사과정 언론브리핑에 따른 피의사실 공표 등이 위헌 요소가 될 여지가 있다는 지적이 담겼다. 6일 서울 여의도 국회에서 열린 제439회(정기회) 12차 본회의에서 윤석열 정권 검찰청, 국가정보원, 감사원 등 조작수사·조작기소 등 의혹의 진상규명을 위한 특별검사 임명 등에 관한 법률안이 더불어민주당 등 여권 주도로 통과되고 있다. 뉴시스 특히 이의신청 규정의 부재를 두고는 “수사대상이 된 자는 특별검사가 직무범위를 벗어난 수사 등을 하는 경우 법원에 이의신청을 할 수 있도록 규정하고 있는데, 이는 공정하고 객관적인 수사가 이뤄질 수 있도록 보완장치로 기능한다”는 헌법재판소의 결정례를 들었다. 이원석 전 검찰총장은 전날 입장문을 내고 “(정부 여당은) 수사하는 사람이 기소까지 하게 되면 확증편향에 빠져 수사 대상자의 인권을 침해한다면서 아예 검찰을 폐지했다”며 “그러나 ‘공소취소를 위한 특검’을 도입하면서 그 특검에는 수사와 기소 권한을 통째로 부여했다”고 비판했다. 또 “민주당이 수사 대상을 정하고 대통령이 임명하는 특검만은 민주당의 ‘수사-기소 원칙'의 예외”라며 “심지어 폐지된 형사소송법상 검사의 권한을 소급 적용하기까지 한다. 나에게, 우리 편에 유리한 형사사법 시스템을 창설한 것”이라고 했다. 그는 “특검법은 대통령과 그 측근들만 예외로 재판받지 않고 공소취소로 가는 길을 활짝 열어두고 있다”며 “이는 사회적 특수계급을 따로 만들고 인정하는 것으로 헌법상 평등의 원칙에 반한다. 누구도 자기 사건의 재판관이 될 수는 없다”고 강조했다. 이 전 총장은 아울러 “사법권은 독립된 사법부에 속한다”며 “행정권에 속하는 수사기관, 그것도 재판절차가 일시 중지된 대통령이 임명하는","category":"사건 사고"},{"title":"안일했던 스토킹 대응, 결국 참극…정말 `국민 위한` 수사기관 개편 맞나[사사건건]","link":"https://n.news.naver.com/mnews/article/018/0006405474","naverLink":"https://n.news.naver.com/mnews/article/018/0006405474","pubDate":"2026-11-07T10:43:27.121308+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:43:28.188160+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:43:27.121355+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:43:27.121352+09:00","author":"네이버뉴스","description":"설악산 -9도, 홍천·파주 -6.6도까지 떨어져…서울도 곳곳 영하 낮 8∼13도 그쳐…당분간 추위, 내일 경기북동부와 강원내륙·산지 눈 가능성 찬바람 부는 서울의 아침 (서울=연합뉴스) 서대연 기자 = 서울 아침 최저기온이 3도까지 떨어지며 급격히 추워진 6일 서울 종로구 광화문네거리에서 외투 모자를 쓴 관광객과 시민들이 신호를 기다리고 있다. 2026.11.6 dwise@yna.co.kr (서울=연합뉴스) 이재영 기자 = 절기 입동(立冬)인 7일 내륙 대부분의 아침 기온이 영하로 내려가는 등 추위가 시작했다. 이날 오전 7시 기준 일최저기온 현황을 보면 설악산은 -9.0도, 횡성(둔내)은 -6.8도, 홍천(서석)과 파주(판문점)는 -6.6도까지 기온이 떨어졌다. 7일 오전 8시 20분 기준 일최저기온 분포도. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:43:27.121347+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"식탁 위에 방치했던 복권, '5억원'이었다","link":"https://n.news.naver.com/mnews/article/008/0005437920","naverLink":"https://n.news.naver.com/mnews/article/008/0005437920","pubDate":"2026-11-07T10:43:27.121344+09:00","author":"네이버뉴스","description":"스피또1000 110회차 1등 당첨 복권 사진과 당첨자 소감/사진=동행복권 가족에게 당첨 여부를 확인해 보라고 건넨 뒤 한동안 방치했던 복권이 5억원에 당첨된 사연이 소개됐다. 최근 동행복권에 따르면 서울 중랑구 면목로31길의 한 복권 판매점에서 판매된 스피또1000 110회차에서 1등 당첨의 주인공이 나왔다. 당첨자 A씨는 평소 매주 로또와 스피또를 1만원어치씩 구매했다. 어느 날 복권 판매점에 들러 스피또1000 5장을 구매해 집으로 돌아왔다. 복권을 본 가족들이 당첨 여부를 확인해 보고 싶다고해 A씨는 복권을 가족들에게 건네준 후 다른 볼일을 봤다. 이후 가족이 당첨된 것이 맞는지 확인해달라고 했지만, A씨는 소액에 당첨됐을 거라고 생각하고 하던 일을 계속했다. 얼마 후 A씨는 식탁 위에 복권이 올려져 있어 살펴봤는데 놀랍게도 '5억원'에 당첨돼 있었다. A씨는 \"전혀 예상하지 못한 큰 금액에 순간 너무 놀라 아무 말도 나오지 않았고, 한동안 얼떨떨한 기분이었다\"며 \"이런 큰 행운이 우리 가족에게 찾아왔다는 것이 너무 감사하고 행복한 마음\"이라고 말했다. 그는 \"당첨금은 전세 자금으로 보태쓰려고 한다\"고 덧붙였다. 스피또1000은 행운 숫자가 자신의 숫자 6개 가운데 하나와 일치하면 해당 당첨금을 받는 즉석 복권이다. 판매 가격은 1000원이다. 1등 당첨금은 5억원이다.","category":"사회"},{"title":"‘대법관 증원’에 공간확보 예산만 100억...행정처, 내년 6월 대법원 떠난다","link":"https://n.news.naver.com/mnews/article/025/0003563477","naverLink":"https://n.news.naver.com/mnews/article/025/0003563477","pubDate":"2026-11-07T10:43:27.121342+09:00","author":"네이버뉴스","description":"서울 서초구 대법원 청사 전경. 뉴스1 대법관을 현행 14명에서 26명으로 늘리는 법원조직법이 통과되면서 내년 대법원 공간 확보 예산에만 100억원 가량이 소요되는 것으로 나타났다. 이를 위해 법원행정처 일부 부서는 내년 6월부터 대법원을 떠나게 된다. 국회 법제사법위원회의 ‘2027년도 대법원 소관 예산안 검토보고서’ 등에 따르면 대법관 증원에 따른 공간 재배치 사업비용으로 내년에 편성된 예산은 총 99억 5600만원이다. 대법관 집무실 신설 예산으로 22억 5100만원, 재판연구관실 이전 예산으로 27억 8900만원, 법원행정처 외부 청사 이전 예산으로 49억 1600만원이 편성됐다. 대법원은 대법관 증원에 필요한 공간을 확보하기 위해 대법원 청사 본관 12~15층에 집무실을 신설할 계획이다. 대법원 본관 12층에 대법관 3명, 13층에 1명을 위한 집무실이 들어선다. 현재 대법관들은 대법원 본관 7~10층에 각 층 3명씩 근무하고 있고, 본관 12~15층은 재판연구관실로 사용하고 있다. 당초 본관 12~15층을 사용하던 재판연구관들은 대법원 청사 동관에서 근무하게 된다. 동관 3~5층에서 근무 중인 법원행정처 일부 부서는 외부 임차사무실로 순차적으로 이전하겠다는 계획이다. 대법원은 현재 외부에 임차할 사무실을 물색하고 있고, 내년 초에 외부로 이전할 법원행정처 부서도 확정할 예정이다. 국회예산정책처가 지난달 발간한 '2027년도 예산안 위원회별 분석'에 수록된 대법원 청사 이전 계획안에 따르면, 대법원은 본관 12~15층을 대법관 집무실로 활용할 계획이다. 국회예산정책처","category":"사회"},{"title":"'계몽'을 외칠수록 위헌·위법성이 드러난다‥윤석열의 '캐치-22' [서초동M본부]","link":"https://n.news.naver.com/mnews/article/214/0001534104","naverLink":"https://n.news.naver.com/mnews/article/214/0001534104","pubDate":"2026-11-07T10:43:27.121340+09:00","author":"네이버뉴스","description":"━ ■ \"스스로 미쳤다는 것을 아는 미치광이는 진짜 미치광이가 아니다.\" 조지프 헬러의 라는 소설이 있습니다. 1961년 출간됐고, 2차 세계대전을 배경으로 한 대표적인 반전(反戰) 풍자소설입니다. 제목 는 '22번 조항'이라는 뜻입니다. 주인공 요사리안 대위는 야전에서 빠져나가는 방법을 궁리하다 '캐치-22'에 꽂힙니다. 정신질환이 있다는 사실이 확인되면 전투임무에서 배제될 수 있다는 내용입니다. 하지만 결정적인 모순이 있습니다. 자신이 미치광이라는 걸 스스로 알고 입증하는 사람을 미치광이라고 할 수 있을까요? 이처럼 '캐치 22'라는 표현은 자가당착과 같이 역설적인 상황을 뜻하는 표현으로 자리 잡아 오늘날까지 사용되고 있습니다. 소설 역시 명작 반열에 올랐고, 2019년엔 할리우드 스타 배우 조지 클루니가 출연한 TV 드라마 시리즈로도 만들어졌습니다.","category":"사회"},{"title":"한덕수·이상민도 감형? 석방?…‘내란 지우개’ 사법부의 음모 [논썰]","link":"https://n.news.naver.com/mnews/article/028/0002831129","naverLink":"https://n.news.naver.com/mnews/article/028/0002831129","pubDate":"2026-11-07T10:43:27.121335+09:00","author":"네이버뉴스","description":"내란에 침묵하던 사법부의 선택적 “사법독립” [논썰] 한덕수·이상민도 감형? 석방?…‘내란 지우개’ 사법부의 음모. 한겨레TV 안녕하십니까? 한겨레 ‘논썰’의 박용현입니다. 조희대 대법원장 국정조사 등을 두고 사법독립 침해라고 주장하는 법관들의 목소리가 분출하고 있습니다. ‘사법독립운동’이라도 하는 양 기개가 대단합니다. 그러나 비겁하고 공허합니다. 사법권이 명백히 침탈당하는 사태 앞에서도 법관들이 침묵했던 것을 기억하기 때문입니다. 12·3 내란 때입니다. 국민은 그날 ‘사법부의 침묵’ 기억한다 비상계엄이 선포되면 ‘모든 사법사무’는 계엄사령관이 관장합니다. 재판을 포함한 사법부의 모든 업무를 군인인 계엄사령관이 지휘·감독하는 것입니다. 또 포고령 위반 사건을 비롯해 중대 범죄의 재판 관할권도 군사법원으로 넘어갑니다. 윤석열이 계엄을 선포한 12월3일 밤 22시27분부터 국무회의에서 계엄 해제가 의결된 12월4일 오전 5시3분까지 6시간여 동안 이런 상황이 실제로 벌어졌습니다. 사법권이 통째로 군인의 손아귀에 있었던 것입니다. 당시 계엄사령부 포고령 1호에는 ‘포고령 위반자에 대해 영장 없이 체포·구금·압수수색을 할 수 있다’는 내용도 담겼습니다. 영장심사권을 통해 국민의 기본권을 보호하는 법관의 역할까지 부정당한 것입니다. [논썰] 한덕수·이상민도 감형? 석방?…‘내란 지우개’ 사법부의 음모. 한겨레TV","category":"사회"},{"title":"법관대표회의 이달 30일로 앞당겨…정치권 압박에 반발 기류","link":"https://n.news.naver.com/mnews/article/020/0003760588","naverLink":"https://n.news.naver.com/mnews/article/020/0003760588","pubDate":"2026-11-07T10:43:27.121293+09:00","author":"네이버뉴스","description":"김예영(왼쪽 네번째) 전국법관대표회의 의장이 8일 오전 경기도 고양시 사법연수원에서 열린 전국법관대표 하반기 정기회의에서 발언하고 있다. 2025.12.08 사진공동취재단 전국 법관들을 대표하는 전국법관대표회의가 애초 다음 달 예정됐던 정기회의 일정을 일주일 앞당겨 이달 말 전격 개최하기로 했다. ‘조작기소 특검법’ 국회 통과와 조희대 대법원장에 대한 국정조사 추진 등 사법부를 향한 여권의 압박이 거세지는 상황에서 법관들의 집단행동 여부, 그리고 그 수위에 대해 관심이 쏠리고 있다. 전국법관대표회의는 다음 달 7일 예정되어 있던 올해 하반기(7~12월) 정기회의 개최일을 이달 30일로 변경하기로 했다고 6일 밝혔다. 이번 결정은 이달 4일 오전 10시부터 오후 7시까지 진행된 법관대표회의 구성원 대상 전자투표 의결에 따른 결과다. 법관대표회의 측은 “구성원들 사이에 임시회의 개최 또는 정기회의 일정 조정에 관한 논의가 이어졌고, 투표 결과 개최 일정을 앞당기는 안에 찬성하는 의견이 더 많았다”고 했다. 조희대 대법원장이 29일 서울 서초구 대법원으로 출근하고 있다. 2026.10.29 뉴시스","category":"사회"},{"title":"이용철 법무장관 후보자 “검찰개혁 완수하고 사회적 약자 인권 보호”","link":"https://n.news.naver.com/mnews/article/005/0001883541","naverLink":"https://n.news.naver.com/mnews/article/005/0001883541","pubDate":"2026-11-07T10:43:27.121260+09:00","author":"네이버뉴스","description":"[이재명 대통령이 6일 법무부 장관 후보자에 이용철 방위사업청장을 지명했다. 뉴시스 이용철 법무부 장관 후보자가 6일 “검찰개혁을 차질 없이 완수하고 새로운 형사사법체계 안착에 힘쓰겠다”고 밝혔다. 이 후보자는 언론 공지를 통해 “공소청과 중수청(중대범죄수사청)이 새로 출범하고 형사사법체계가 크게 개편된 엄중한 시기에 법무행정을 책임지는 법무부 장관 후보자로 지명받아 막중한 책임감을 느낀다”고 소감을 전했다. 이 후보자는 지명 이유에 대해 “참여정부 청와대 법무비서관으로서 검경 수사권 조정 등 검찰개혁과 사법제도 개혁 업무를 수행했던 경험을 살려 검찰개혁을 완수하고, 큰 폭으로 개정된 형사사법체계의 안착에 역할을 해달라는 것이라고 생각한다”고 설명했다. 그러면서 “만약 장관으로 일할 수 있는 기회가 주어진다면 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계의 빠른 안착에 힘쓰는 한편 범죄 피해자를 비롯한 사회적 약자의 인권 보호를 위해 최선을 다하겠다”고 강조했다. 이 후보자는 “국민 여러분께 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다”고도 했다. 김남준 대통령실 대변인은 이 후보자를 민변 출신으로 인권 보호와 민주적 가치 증진에 힘써온 변호사라고 소개했다. 김 대변인은 이 후보자가 참여정부 민정수석실 민정2비서관과 법무비서관을 지내며 반부패 제도 개혁을 주도한 점도 지명 배경으로 들었다. 이어 “법조인이면서도 구조개혁 등 다양한 행정 경험을 갖춘 만큼 새로운 형사법 체계를 조속히 안착시키고 누구도 소외되거나 억울한 일을 겪지 않는 공정한 법무행정 구현을 기대한다”고 덧붙였다. 이재명 대통령은 이날 오후 방위사업청장인 이 후보자를 새 법무부 장관 후보자로 지명했다 . 전북 순창 출신인 이 후보자는 사법시험 31 회에 합격해 사법연수원 21 기를 수료했고 , 민주사회를 위한 변호사모임 ( 민변 ) 과 경제정의실천시민연합 ( 경실련 ) 등에서 시민사회 활동을 한 변호사 출신이다 .","category":"사회"}],"생활·문화":[{"title":"“목구멍까지 타는 통증”…의사들이 꼽은 ‘역류성 식도염’에 좋은 음식 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107010","naverLink":"https://n.news.naver.com/mnews/article/296/0000107010","pubDate":"2026-11-07T10:43:28.991543+09:00","author":"네이버뉴스","description":"오트밀은 위산으로 인한 통증을 줄이는 데 도움이 된다. 사진=게티이미지뱅크 식사 후 속이 쓰리거나 목구멍이 타는 듯한 통증을 한 번쯤 경험해 본 사람들이 많다. 이런 증상을 일으키는 위염이나 역류성 식도염은 방치될 경우 일상을 순식간에 무너뜨릴 수 있다. 위산이 식도를 타고 역류하면서 생기는 불편함은 몇 시간 동안 지속되고 만성화 되면 삶의 질을 크게 떨어뜨릴 수 있다. 루시아나 소아레스 미국 존슨앤웨일즈대 영양학과의 교수는 \"위산 역류를 겪는 사람에게는 저지방, 저산성, 고섬유질 식단이 기본\"이라며 \"과식은 위 내부 압력을 높여 증상을 악화시키므로 적은 양을 나누어 섭취하는 습관이 필요하다\"고 설명한다. 미국 매체 허프포스트(HuffPost)에 소개된 의료 전문가들의 조언을 바탕으로, 위산 역류를 완화하고 예방하는 데 도움을 주는 식품 6가지를 정리했다. 오트밀 소화기내과 전문의들이 위산 역류 예방식으로 가장 먼저 추천하는 식품은 가공을 최소화한 전통 방식의 오트밀이다. 엑타 굽타 메릴랜드대 의대 교수는 \"오트밀에 풍부한 수용성 섬유질은 기름진 식사나 빵류와 달리 소화기관에 부담을 주지 않고 부드럽게 소화된다\"고 말한다. 흔히 오트밀이 위산을 흡수한다는 속설이 있지만 이는 사실과 다르다. 굽타 교수는 \"식단의 목표는 산을 흡수하는 것이 아니라 애초에 과도한 산 분비를 유발하지 않는 데 있다\"며 \"섬유질이 원활한 배변을 도와 복압 상승으로 인한 역류를 방지해 주는 것이 핵심\"이라고 덧붙였다. 맑은 뼈 육수 뼈를 고아 낸 맑은 육수는 속을 편안하게 감싸면서도 영양을 채워주는 훌륭한 선택지다. 대릴 지오프레 영양학 박사는 \"따뜻한 육수는 과식하지 않아도 충분한 포만감과 영양을 제공해 소화기 부담을 던다\"고 전했다. 다만 지방이 과도하면 오히려 하부식도괄약근을 느슨하게 할 수 있으므로 기름기를 걷어낸 육수를 골라야 한다. 특히 뼈 육수에 풍부한 글리신, 프롤린, 글루타민 등 아미노산 성분은 자극받은 식도와 장 점막을 진정시키고 장벽을 강화하는 데 도움이 된다. 채소 위주의 녹즙 수분이 많고 산도가 낮은 잎채소로 만든 녹즙도 속쓰림 완화에 효과적이다. 오이, 셀러리, 시금치처럼 자극이 적은 채소를 착즙해 마시는 방식이 권장된다. 이들 채소에 풍부한 마그네슘은 소화기 전반의 근육과 신경이 정상적으로 기능하도록 돕고, 위 내용물이 위로 역류하지 않도록 조여주는 괄약근 유지에도 필수적이다. 단, 맛을 내기 위해 레몬, 라임","category":"생활·문화"},{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:43:28.991533+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활·문화"},{"title":"\"최강 한파\" 아침 최저 -6도·일교차 최대 15도…'입동' 뜻과 챙겨 먹으면 좋은 음식 [오늘 날씨]","link":"https://n.news.naver.com/mnews/article/119/0003152402","naverLink":"https://n.news.naver.com/mnews/article/119/0003152402","pubDate":"2026-11-07T10:43:28.991529+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:43:28.991519+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:43:28.991508+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T10:43:28.991506+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활·문화"},{"title":"아침 최저 영하 1도 '꽁꽁'…중부지방은 가끔 비 소식[내일날씨]","link":"https://n.news.naver.com/mnews/article/421/0009275637","naverLink":"https://n.news.naver.com/mnews/article/421/0009275637","pubDate":"2026-11-07T10:43:28.991498+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"한국예술인복지재단, 예술인 공제사업 출범","link":"https://n.news.naver.com/mnews/article/366/0001203076","naverLink":"https://n.news.naver.com/mnews/article/366/0001203076","pubDate":"2026-11-07T10:43:28.991477+09:00","author":"네이버뉴스","description":"한국예술인복지재단, 예술인 공제사업 출범. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:43:28.188149+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활·문화"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:43:27.121327+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활·문화"}],"세계":[{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:43:27.866317+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:43:27.866315+09:00","author":"네이버뉴스","description":"[美 중간선거] 도널드 트럼프 미국 대통령(오른쪽)과 스티븐 밀러 백악관 신임 비서실장. /로이터=뉴스1 백악관 첫 여성 비서실장의 기록을 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 선거 패배 이후 백악과 내각에서 처음으로 이뤄진 인사 교체다. 신임 비서실장에는 도널드 트럼프 대통령의 강경파 최측근으로 꼽히는 스티븐 밀러 부비서실장(41)이 임명됐다. 민주당은 트럼프 대통령의 이 같은 인사가 선거 참패에도 '마이웨이'를 고수하겠다는 의지를 보인 것이라며 의회 차원의 조사를 예고했다. 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 \"밀러 부비서실장이 백악관 비서실장을 맡게 된다\"며 \"내가 가장 신뢰하는 참모 중 하나\"라고 밝혔다. 와일스 실장에 대해선 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로 헌신해준 데 대해 감사하다\"고 발표했다. 트럼프 대통령은 '트럼프 정치조직'이 어떤 조직인지, 와일스가 어떤 역할을 맡게 될지는 구체적으로 언급하지 않았지만 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 패배에 따른 인적 개편임을 시사했다. 이날 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 지 사흘 만에 발표됐다. 밀러 신임 실장은 트럼프 대통령의 대표적인 강경파 측근으로 집권 1기부터 반(反)이민 정책을 설계하고 추진해온 핵심 참모다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했고 트럼프 대통령의 첫 취임사 준비도 주도했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지내다 2기 행정부 들어 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도했다. 미 정가에선 트럼프 대통령이 비서실장 교체를 단행하면서 조만간 후속 내각 개편이 이어질 수 있다는 관측이 나온다. 수지 와일스 전 백악관 비서실장. /AP=뉴시스 /사진=이혜미","category":"세계"},{"title":"[아프리카인물열전](45) \"노예의 풍요보다 자유로운 빈곤을\"…투레 기니 대통령","link":"https://n.news.naver.com/mnews/article/001/0016427649","naverLink":"https://n.news.naver.com/mnews/article/001/0016427649","pubDate":"2026-11-07T10:43:27.866311+09:00","author":"네이버뉴스","description":"프랑스어권 아프리카 식민지 중 첫 독립 선포 '강골'…26년 철권통치 그림자도 1961년 유고슬라비아를 방문한 아흐메드 세쿠 투레 기니 초대 대통령 [위키피디아 제공. 재판매 및 DB 금지] (카이로=연합뉴스) 김상훈 특파원 = \"우리는 노예 상태에서 누리는 풍요보다 자유 속의 빈곤을 택하겠다.\" 1958년 프랑스의 샤를 드골 대통령 면전에 던진 이 단호한 선언은 서부 아프리카 독립운동의 거대한 불씨가 되었다. 프랑스의 제국주의에 정면으로 맞서 기니의 즉각적인 독립을 쟁취한 인물, 아흐메드 세쿠 투레(1922~1984) 기니 초대 대통령은 아프리카 민족주의 역사에서 가장 강렬한 족적을 남긴 지도자 중 한 명으로 꼽힌다. 1922년 기니 중부 파라나에서 태어난 세쿠 투레는 19세기 프랑스 식민 침략에 맞서 싸운 위대한 저항군 지도자 사모리 투레의 후손으로 알려져 있다. 그는 우체국 직원 등으로 일하며 노동조합 활동에 투신했다. 탁월한 연설 능력과 강력한 카리스마를 바탕으로 기니 노동운동과 민족주의 진영의 핵심 지도자로 부상했다. 세쿠 투레의 이름이 전 세계에 각인된 것은 1958년 프랑스가 제안한 신헌법 찬반 국민투표 때다. 당시 드골 프랑스 대통령은 아프리카 식민지국들에 완전 독립 대신 '프랑스 공동체' 내의 자치국으로 남을 것을 종용했다. 대부분의 프랑스어권 아프리카 지도자들이 경제적 지원 중단을 우려해 이를 수용했지만, 세쿠 투레는 단호히 거부했다. 그해 9월 28일 실시된 투표에서 기니 국민은 95%의 압도적인 반대표를 던졌고, 10월 2일 기니는 프랑스어권 아프리카 국가 중 최초로 완전 독립을 선포했다. 세쿠 투레의 반란에 분노한 프랑스의 보복은 집요하고 가혹했다. 기니에 주둔하던 프랑스 관리와 기술자들을 즉각 철수시키며 전화선과 발전소 등 기반 시설을 파괴했고, 심지어 관공서의 전구와 행정 서류, 의약품까지 모조리 파기하거나 챙겨서 떠났다. 신생 독립국 기니를 철저히 붕괴시켜 다른 식민지국에 본보기를 보여주겠다는 의도였다. 그러나 세쿠 투레는 굴복하지 않았다. 서방의 지원이 끊기자 그는 옛소련, 중국 등 공산권 국가들과 손을 잡고 위기를 돌파했다. 가나의 콰메 은크루마 등과 함께 범(凡)아프리카주의 운동을 주도하며 아프리카의 완전한 해방을 역설했다. 대륙 전체의 독립을 상징하는 영웅으로 추앙받았다. 냉전 시대 강경한 사회주의 및 비동맹 노선을 걸었던 탓에 한국과 직접적인 외교적 인연은 없었다. 대신 그","category":"세계"},{"title":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?","link":"https://n.news.naver.com/mnews/article/053/0000062883","naverLink":"https://n.news.naver.com/mnews/article/053/0000062883","pubDate":"2026-11-07T10:43:27.866308+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령이 지난 9월 17일(현지시간) 백악관 로즈가든에서 열린 만찬 중 연설하고 있다. photo AP·뉴시스 지난 11월 3일(현지시간) 치러진 미국 중간선거에서 민주당이 상·하원을 동시에 탈환했다. 민주당이 '여소야대'로 미 의회 주도권을 확보하면서 도널드 트럼프 행정부에 대한 견제가 강화될 것으로 보인다. '블루 웨이브'를 넘어 압승을 거둔 '블루 쓰나미'가 현실화하면서 미국의 통상정책을 둘러싼 우리나라의 셈법도 복잡해질 전망이다. 정치권에 따르면 정부는 이번 미 중간선거 결과를 두고 청와대를 비롯해 외교부와 국방부, 재정경제부와 산업통상부 등 관계 부처를 중심으로 국내 외교·안보 및 산업·통상 환경에 미칠 영향에 대한 분석에 착수했다. 관계 부처 합동대책회의를 열고 불확실성에 따른 대응 방안을 다각도로 검토해 철저한 리스크 관리에 돌입한다는 방침이다. 특히 양국 간 통상 환경 변화 등을 예단하지 않고 신중한 입장을 취하면서, 구체적 대미 전략투자 실행에 따른 경제안보 협력 증진에 집중할 계획이다. 청와대 관계자는 \"미 상·하원 의석 변화에 따른 대처 방안을 꾸준히 검토하고 있다\"며 \"그동안 한·미 관계가 간단치 않았기 때문에 청와대 모든 부서와 관계부처가 주시하고 있다\"고 전했다. 국회에선 여야가 함께하는 한미의원연맹이 오는 12월 중순 미국 방문 계획을 추진하고 있다. 중간선거 이후 새롭게 구성되는 미국 상·하원 의원뿐만 아니라 주요 부처 인사들과 만나 한·미 외교·통상 관련 현안을 논의한다는 방침이다. 이에 앞서 이달 10일 이사회와 총회를 열어 지도부 구성 등 협력 채널을 정비하고, 구체적 방미 일정과 대표단 구성 등을 논의할 예정이다. 조정식 국회의장 선출로 현재 공석인 민주당 측 공동회장에 대통령 평화외교특별보좌관인 6선 송영길 의원을 선출하는 절차가 이뤄지고 있다. 국민의힘 측 공동회장은 6선 조경태 의원이 맡고 있다. 한미의원연맹 여당 간사인 김영배 민주당 의원은 주간조선과 통화에서 \"12월 중순 방미해 대미 전략투자 1~3호 관련 사안을 점검하고 우리의 역할이 있는지 살펴볼 예정\"이라며 \"미 국무부, 상무부, 에너지부 등 정부 부처 인사들과 유관 상·하원 상임위원회 소속 의원들은 물론 다수당(민주당) 지도부도 직접 만날 것\"이라고 밝혔다. 그러면서 \"여소야대로 트럼프 행정부 자체 힘만으로는 잘 굴러갈 수 없겠지만, 미국의 통상 정책 등 국정 기조는 단기간에 달라지지 않을","category":"세계"},{"title":"트럼프, 비서실장에 '총리 별명' 충성파…美우선주의 마이웨이(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427650","naverLink":"https://n.news.naver.com/mnews/article/001/0016427650","pubDate":"2026-11-07T10:43:27.866306+09:00","author":"네이버뉴스","description":"트럼프, 비서실장에 '총리 별명' 충성파…美우선주의 마이웨이(종합). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"머스크 \"한 시대의 끝\"…테슬라 사이버트럭 단종 예고 무슨 일?","link":"https://n.news.naver.com/mnews/article/008/0005437912","naverLink":"https://n.news.naver.com/mnews/article/008/0005437912","pubDate":"2026-11-07T10:43:27.866304+09:00","author":"네이버뉴스","description":"미국 뉴욕시 차이나타운에서 테슬라 사이버트럭이 주행하고 있다. /로이터=뉴스1 테슬라의 전기차 사이버트럭이 저조한 판매량을 이어간 끝에 단종된다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 X(옛 트위터)를 통해 \"내년 중순 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄여나갈 예정\"이라며 \"사이버캡 생산을 위한 공간을 확보하기 위한 결정\"이라고 밝혔다. 텍사스 오스틴의 기가팩토리는 사이버트럭의 특수부품을 제조하는 유일한 시설이라는 점에서 생산축소는 사실상 단종을 뜻하는 것으로 풀이된다. 머스크 CEO도 \"한 시대의 끝\"이라고 밝혔다. 사이버트럭은 2019년 11월 첫 공개 당시 미래지향적인 스테인리스 외장과 파격적인 디자인으로 수십만대의 사전 예약을 모으며 화제를 낳았다. 하지만 복잡한 외장 가공과 스테인리스 강판 제어 문제 등으로 출시가 거듭 연기된 끝에 2023년 말에야 고객 인도가 시작되는 등 차질을 빚었다. 판매량도 기대를 밑돌았다. 테슬라는 당초 연간 판매량을 50만대로 예상했지만 실제 판매량은 연 2만대 안팎에 그쳤다. 자동차 데이터플랫폼 켈리 블루북에 따르면 지난해 판매량은 2만237대였다. 시장에선 계절별 주행거리 저하, 조립 품질 문제, 리콜 반복 등의 문제가 이어지면서 사이버트럭이 대중적인 보급형 모델로 자리잡지 못했다는 평가가 나온다. 기가팩토리의 사이버트럭 전용 라인은 차세대 자율주행 전용 차량인 '사이버캡' 양산에 투입될 전망이다. 판매실적이 부진한 픽업 전기 트럭 사업의 생산 여력을 자율주행 신사업으로 전격 전환하겠다는 구상이다.","category":"세계"},{"title":"트럼프, '대선 공신' 와일스 경질... '강경파' 밀러 전면 배치","link":"https://n.news.naver.com/mnews/article/469/0000964178","naverLink":"https://n.news.naver.com/mnews/article/469/0000964178","pubDate":"2026-11-07T10:43:27.866301+09:00","author":"네이버뉴스","description":"의회 내주고도 타협 대신 돌파 反이민 설계자 앞세운 백악관 미 백악관 비서실장에 발탁된 스티븐 밀러(오른쪽). EPA 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거 참패 사흘 만인 6일(현지시간) 수지 와일스 백악관 비서실장을 경질하고, 후임에 강경파 최측근인 스티븐 밀러 백악관 부비서실장을 발탁했다. 선거 패배에 따른 정책 기조 수정 대신 정권 내 최고 강경론자를 전면에 내세워 정면 돌파를 선택했다는 평가가 나온다. 트럼프 대통령은 이날 자신의 사회관계망서비스(SNS)인 트루스소셜을 통해 \"오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다\"고 발표했다. 트럼프 대통령은 밀러를 향해 \"내가 가장 신뢰하는 참모 중 한 명\"이라고 치켜세웠다. 와일스 실장에 대해선 \"훌륭한 일을 해냈고 감사하다\"며 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 했다. 트럼프 대통령은 이후 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 중간선거 패배에 따른 문책성 인사라는 점을 암시했다. 대선 일등공신의 퇴장… 예견된 불화설 도널드 트럼프 2기 미국 행정부의 백악관 비서실장에서 경질된 수지 와일스. AP 연합뉴스","category":"세계"},{"title":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:43:27.866284+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프, 선거 참패에도 강경파 밀러 비서실장 발탁(종합)","link":"https://n.news.naver.com/mnews/article/003/0014307478","naverLink":"https://n.news.naver.com/mnews/article/003/0014307478","pubDate":"2026-11-07T10:43:27.866244+09:00","author":"네이버뉴스","description":"중간선거 사흘만 비서실장 교체…실세 와일스 퇴진 밀러, 강경 이민정책 설계한 충성파…민주당 반발 \"정책 더 우경화될것\"…민주당과 전쟁 대비 해석도 [워싱턴=AP/뉴시스]6일(현지 시간) 차기 백악관 비서실장으로 지명된 스티븐 밀러 부비서실장이 백악관을 나서며 취재진에 손을 들어보이고 있다. 2026.11.07. [워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 6일(현지 시간) 수지 와일스 백악관 비서실장을 교체한다고 발표했다. 중간선거 참패 책임을 물은 것으로 보인다. 후임으로는 트럼프 행정부 내에서도 강경파로 분류되는 스티븐 밀러 백악관 부비서실장을 발탁했다. 그간의 정책 기조를 더욱 강화하겠다는 의지로 풀이된다. 트럼프 대통령은 이날 소셜미디어(SNS) 트루스소셜에 \"현 트럼프 행정부 부비서실장이자 가장 신뢰하는 참모 중 한 명인 스티븐 밀러가 2026년 11월 9일 월요일부터 비서실장이 될 것\"이라고 밝혔다. 이어 \"탁월한 일을 해 온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로서의 그의 봉사에 감사를 표하고 싶다. 그는 훌륭한 일을 해냈다\"고 설명했다. 이번 조치는 공화당이 처참하게 패배한 중간선거 사흘 만에 이뤄졌다. 결국 와일스 실장이 선거 결과에 대한 책임을 지고 물러난 모양새다. 후임으로 지명된 밀러 부비서실장은 트럼프 대통령 1기 때부터 곁을 지켜온 측근이다. 막후에서 조율에 집중하는 와일스 실장과 달리 트럼프 대통령에 대한 충성심을 드러내는데 거침이 없는 스타일이다. 트럼프 2기 들어 전국을 휩쓴 강경 이민정책의 설계자로도 유명하다. 뉴욕타임스(NYT)는 \"밀러 부비서실장은 트럼프 2기 동안 이민 정책을 비롯한 가장 급진적인 국내 정책들을 설계해온 인물\"이라며 \"올해 초 트럼프 대통령이 그린란드 침공가능성을 공개 언급했을 때, 밀러는 미국이 국가 이익에 부합한다고 판단하면 자유롭게 다른나라 정부를 전복하고 영토와 자원을 차지할 수 있다는 미국 제국주의적 비전을 제시했다\"고 지적했다. [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 6일(현지 시간) 백악관을 나서며 취재진 질문에 답변하고 있다. 2026.11.07.","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:43:27.121326+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:43:28.188167+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:43:28.188165+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:43:28.188163+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:43:28.188162+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:43:28.188159+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:43:28.188157+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:43:28.188154+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:43:28.188145+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:43:28.188142+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:43:28.188130+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[{"title":"������ �𸣸� ���ء���30�� ������ �������� ���빮 ���̰���","link":"https://n.news.naver.com/article/005/0001883563?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495702+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"���� ��� ���ƶ� �ƹ��� ��� �� �ɷ� �� ��ȭ [��,û��-û������ �����ϴ�]","link":"https://n.news.naver.com/article/005/0001883519?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495731+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"���� 397���� �ݵ�ü�� ���С� ������ �й����� ���� �տ�","link":"https://n.news.naver.com/article/005/0001883542?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495739+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":3},{"title":"����ȸ �� ���þ� �� �ּ��䡱���ߴ������ ȸ�ļ� ���� �� [����]","link":"https://n.news.naver.com/article/005/0001883585?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495745+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":4},{"title":"���̴н� ��������ETF, ���� ��� 90% �϶�","link":"https://n.news.naver.com/article/005/0001883540?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495749+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":5},{"title":"��ȥ�� �Ĵ� �͵� �����, �� �������߸� �߳ġ������� 1�ΰ��� ����� ������","link":"https://n.news.naver.com/article/009/0005760304?ntype=RANKING","pubDate":"2026-11-07T10:43:31.495755+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스
