문이라는 분석과 김칫국물이 굳어 접착제 역할을 하고 있을 것이라는 추론이 나왔다. 숟가락, 스테인리스 뒤집개, 일자 드라이버, 병따개 등 각종 도구가 동원됐다. 게시자는 이용자들이 제안한 방법을 시도하면서 사진과 함께 결과를 보고했다. 뜨거운 물을 사용하라는 조언과 뜨거운 물을 사용하면 오히려 안 된다는 조언이 엇갈렸다. 게시자는 뜨거운 물을 쓰라는 스치니 덕분에 자신의 김치통이 더 ‘스키니’해졌다고 전했다. 실제 게시자가 올린 사진 속 김치통은 옆면이 움푹 들어가 있었다. 홍두깨로 뚜껑을 두드려보라는 제안도 나왔다. 세 번 내려친 결과는 뚜껑에 금 하나 추가. 게시자는 잠깐 울고 와야겠다며 눈물이 그렁그렁한 남자 배우의 인터넷 밈을 올렸다. 한 이용자는 뚜껑이 열리지 않는 용기들을 모아 스레드 이용자들의 오프라인 행사를 개최하자고 제안했다. 각자 도구를 가져와 뚜껑 열기에 도전하고 아서왕의 엑스칼리버처럼 김치통 뚜껑을 여는 데 성공한 사람을 그날의 왕으로 불러주자는 것이다. “2년 동안 모른 체했다고 단단히 삐진 것 아닌가”, “열려라 참깨 안 외친 게 문제일 수도 있다”는 자못 진지함을 가장한 조언도 등장했다. 삼성전자까지 소환됐다. 한 이용자는 삼성스토어 공식 계정을 태그하며 김치통 뚜껑을 열 방법을 알려달라고 요청했다. 게시자도 이런 경우에 대비한 별도의 매뉴얼이 있는지 궁금하다는","category":"생활·문화"},{"title":"LG전자, 9개 제품 '2026 우수디자인' 선정?디자인 경쟁력 입증","link":"https://n.news.naver.com/mnews/article/031/0001078183","naverLink":"https://n.news.naver.com/mnews/article/031/0001078183","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"무선 스피커·공기청정기 산업통상부장관상 수상 LG 사운드 스위트 패키지 한국디자인진흥원장상 LG전자가 제품과 패키지 디자인 경쟁력을 인정받으며 '2026 우수디자인(GD) 상품선정'에서 총 9개 제품이 선정되는 성과를 거뒀다. LG전자는 무선 스피커 'LG 엑스붐 미니'와 공기청정기 'LG 퓨리케어 에어로미니'가 산업통상부장관상인 '1인 가구를 위한 디자인 특별상'을 수상했다고 25일 밝혔다. LG전자가 2026 우수디자인(GD) 상품선정에서 산업통상부장관상과 한국디자인진흥원장상을 포함해 총 9개 제품이 우수디자인으로 선정됐다. [사진=LG전자] 엑스붐 미니는 간결한 디자인과 모듈식 구조로 제품 호환성과 사용 편의성을 높였다. 퓨리케어 에어로미니는 액세서리를 결합해 공기청정뿐 아니라 조명, 수납, 공기흐름 제어 등으로 기능을 확장할 수 있다. 특히 엑스붐 미니는 세계 3대 디자인상으로 꼽히는 iF, 레드닷, IDEA를 모두 석권한 데 이어 국내에서도 디자인 경쟁력을 인정받았다. 프리미엄 홈 오디오 시스템 'LG 사운드 스위트'의 패키지 디자인은 사용자 중심의 일체형 구조 설계와 친환경 펄프 소재 적용 등을 높이 평가받아 한국디자인진흥원장상을 수상했다. 이 밖에도 △휴머노이드 로봇 LG 클로이드 △LG 디오스 AI 오브제컬렉션 냉장고 핏 앤 맥스 △게이밍 모니터 LG 울트라기어 에보 △상업용 스탠드 에어컨 슈프림 플러스 △LG 이페이퍼 디스플레이 △LG 스마트 AR 리테일 공간 솔루션 등이 우수디자인에 선정됐다.","category":"생활·문화"},{"title":"충남도, 이동노동자 한파 쉼터 40곳 운영","link":"https://n.news.naver.com/mnews/article/079/0004213508","naverLink":"https://n.news.naver.com/mnews/article/079/0004213508","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"달콤한 보상 찾는 연말 맞아 ‘겨울 디저트 옷’ 입은 유통업계","link":"https://n.news.naver.com/mnews/article/144/0001151517","naverLink":"https://n.news.naver.com/mnews/article/144/0001151517","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"[스포츠경향 손봉석 기자] 한 해를 마무리하며 소중한 사람들과의 특별한 순간을 나누는 연말이 다가오고 있다. 한 해 동안 수고한 자신을 위한 달콤한 보상부터 사랑하는 사람들과 함께 나누는 특별한 시간까지, 연말을 더욱 풍성하게 만들어 줄 색다른 미식 경험에 대한 관심이 높아지는 시기다. 유통업계도 이러한 경향을 반영한 다양한 제품을 선보이고 있다. 연말 분위기에 어울리는 디저트의 맛과 향을 익숙한 제품에 접목하거나 겨울 제철 재료를 활용해 계절감을 살리는 등 연말 소비자들의 취향을 공략하며 선택의 폭을 넓히고 있다. 최근 출시되는 제품을 살펴보면 브라우니와 치즈케이크의 풍미를 담은 커피부터 딸기를 활용한 케이크, 토피넛과 헤이즐넛을 활용한 도넛, 캐러멜과 와플을 조합한 아이스크림까지 제품군이 다양하다. 단순히 달콤한 맛을 더하는 데 그치지 않고 다채로운 향과 식감을 살려, 제품 하나만으로도 풍성하게 맛보는 즐거움을 선사하는 데 주력하고 있다. 프리미엄 커피 브랜드 네스프레소(Nespresso)는 브라우니와 치즈케이크 등 디저트의 풍미를 담은 시즌 한정 커피를 선보이며 연말 소비자 공략에 나섰다. 진하고 달콤한 풍미로 겨울과 잘 어울리는 브라우니와 크리스마스나 연말 파티의 특별함과 잘 어우러지는 블루베리 치즈케이크의 달콤한 즐거움을 커피에 담아낸 것이 특징이다. 네스프레소는 올겨울 모던 크리스털 라이프스타일 브랜드 스와로브스키와 협업한 이번 ‘페스티브’ 컬렉션을 통해 가향 커피 2종과 블랙커피 1종 등 총 3종의 커피를 오리지널과 버츄오 두 라인으로 선보였다. 가향 커피 2종은 쌀쌀한 겨울철 더욱 생각나는 진하고 달콤한 풍미를 커피 한 잔에 담은 제품이다. ‘헤이즐넛 브라우니향 커피’는 진한 브라우니 퍼지향과 로스티드 헤이즐넛의 고소한 아로마가 어우러진다. ‘블루베리 치즈케이크향 커피’는 블루베리 잼을 떠올리게 하는 진한 과일향에 풍부한 치즈케이크향과 부드러운 캐러멜향이 조화를 이룬다. 두 제품 모두 우유를 더해 카푸치노로 즐기면 부드러운 우유 거품과 풍성한 디저트향을 함께 느낄 수 있어, 겨울철 일상 속 달콤한 휴식은 물론 소중한 사람들과 함께하는 연말 홈카페에도 제격이다. 이와 함께 선보인 블랙커피 ‘크리스털 스파크’는 비스킷과 코코아, 캐러멜 향으로 달콤한 디저트를 떠올리게 한다. 버츄오 라인의 ‘크리스털 스파크 더블 에스프레소’는 부드러운 질감에 비스킷과 과일, 은은한 코코아 풍미를 담았다. 오리지널 라인","category":"생활·문화"},{"title":"“오늘 밤은 어디서 자나”…집값 치솟자 ‘노숙 학생’ 155만명 기록한 美","link":"https://n.news.naver.com/mnews/article/021/0002835245","naverLink":"https://n.news.naver.com/mnews/article/021/0002835245","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"AI 생성 이미지 주거비 부담이 가파르게 치솟고 저소득층을 위한 공공복지 혜택마저 줄어들면서 미국 내 노숙 학생 수가 155만명을 넘어서며 역대 최대치를 기록했다. 23일(현지시간) 워싱턴포스트(WP)가 전한 미 연방정부 통계에 따르면 2024~2025학년도 미국 공립학교가 파악한 노숙 학생은 155만3989명으로 집계됐다. 연방정부 차원의 전국 단위 통계가 시작된 2004~2005학년도 이후 가장 많은 수치다. 미국 교육 당국은 길거리에서 노숙하는 경우뿐만 아니라, 안정적인 거처가 없어 지인이나 친척 집에 얹혀살거나 쉼터(보호시설), 모텔 등을 전전하며 생활하는 아동·청소년도 모두 노숙 학생으로 분류한다. 주거 불안정 아동·청소년의 교육을 지원하는 비영리단체 스쿨하우스 커넥션(SchoolHouse Connection)의 바버라 더필드 사무총장은 노숙 학생 수가 증가한 배경 중 하나로 코로나19 팬데믹 당시 학교에 지급된 한시적 지원금을 꼽았다. 팬데믹 기간 미국 학교 교육구에는 노숙 학생을 지원하기 위해 3년간 8억 달러의 긴급 자금이 지급됐다. 학교들은 이 예산으로 노숙 청소년을 찾아내고 필요한 자원을 제공할 직원을 채용할 수 있었다. 학생들의 주거 상황을 파악하고 지원 체계를 마련할 인력을 확보하면서 통계에 포착되는 노숙 학생도 늘어났다는 설명이다. 그러나 한시적 지원금이 종료되면서 학교의 학생 발굴 여력도 줄어들었다. 더필드 사무총장은 현재 대부분의 교육구가 노숙 상태에 놓인 학생을 모두 찾아낼 만큼 충분한 자원을 확보하지 못하고 있다고 전했다.","category":"생활·문화"},{"title":"히잡 안 쓰고 노래했다고 '태형 74대'…이란 여가수의 혹독한 대가","link":"https://n.news.naver.com/mnews/article/014/0005609309","naverLink":"https://n.news.naver.com/mnews/article/014/0005609309","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"이란 가수 파라스투 아마디./사진=파라스투 아마디 유튜브 영상 캡처, 연합뉴스 [파이낸셜뉴스] 히잡을 쓰지 않고 공연한 이란 여성 가수에게 태형이 집행됐다. 23일(현지시간) 미국 CNN 방송 등에 따르면 이란 가수 파라스투 아마디(29)와 공연에 참여한 남성 연주자 4명이 이날 각각 태형 74대를 집행 받았다. 아마디는 지난 2024년 12월 시아파 성지인 콤 인근 카라반세라이에서 히잡을 쓰지 않고 공연했다. 당시 아마디는 검은 민소매 드레스를 입고 머리를 가리지 않은 채 남성 연주자의 반주에 맞춰 노래했다. 해당 공연 영상이 화제가 되자 이란 사법당국은 아마디와 제작진을 입건했다. 이란은 여성들에게 히잡 착용과 단정한 복장을 의무화하고 있다. 재판부는 \"저속하고 부도덕한 온라인 콘텐츠를 제작·유포해 공공질서를 해쳤다\"며 아마디와 남성 연주자들에게 태형 74대와 함께 2년간 예술·음악 활동과 해외여행을 금지하는 형을 선고했다. 이란 법원은 지난해 2월에도 수도 테헤란에서 전통 이란 음악을 공연한 여성 가수 히바 세이피자데에게 징역 4년을 선고한 바 있다. 당시 법원은 \"세이피자데가 공연에서 부패와 매춘을 조장했다\"고 했으나 세이피자데는 13세기 이란의 고전 시구를 몇 구절 노래했을 뿐이라며 항소 뜻을 밝혔다. 한편 인권단체 국제앰네스티는 태형을 잔혹하고 비인도적이며 굴욕적인 형벌로 규정하고 있다. 앰네스티는 이란이 히잡 착용 의무에 저항하는 가수나 언론인, 여성 인권 운동가들을 상대로 자의적인 구금 및 기소, 태형을 갈수록 늘리고 있다고 지적했다.","category":"생활·문화"}],"세계":[{"title":"美 ‘과잉생산 관세’ 결과 이르면 이번주 공개…한국도 포함됐다","link":"https://n.news.naver.com/mnews/article/025/0003567660","naverLink":"https://n.news.naver.com/mnews/article/025/0003567660","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"제이미슨 그리어 미국 무역대표부(USTR) 대표가 지난 18일(현지시간) 중국 광둥성 선전국제교류센터에서 열린 아시아태평양경제협력체(APEC) 정상회의 환영 만찬에 참석하고 있다. AP=연합뉴스 미국 무역대표부(USTR)가 한국 등 16개 경제주체를 대상으로 진행한 ‘과잉생산 관세’ 조사 결과를 이르면 이번 주 발표할 것이라는 보도가 나왔다. 관세 부과 계획을 예고한 뒤 대상국의 의견을 받아 최종 확정하는 절차를 밟을 것으로 예상된다. 월스트리트저널(WSJ)은 24일(현지시간) 복수의 소식통을 인용해 USTR이 중국과 유럽연합(EU), 한국, 일본 등에 대한 무역법 301조 조사 결과를 빠르면 이번 주 내놓을 전망이라고 전했다. 다만 발표 시기는 바뀔 수 있다고 덧붙였다. USTR은 이들 경제주체가 보조금 지원 등을 통해 과잉생산을 유발하고 미국 기업에 불리한 환경을 조성했다며 지난 3월 조사에 착수했다. 한국에 적용될 관세율도 관심이다. 한국은 지난해 미국에 3500억 달러를 투자하기로 약속하고 관세를 25%에서 15%로 낮추는 데 합의했다. 미국이 기존 합의를 존중하겠다는 입장을 밝혀온 만큼, 과잉생산 관세가 부과되더라도 앞서 확정된 강제노동 관련 관세 12.5%와 합쳐 15%를 넘지 않을 것이라는 전망이 대체적이었다. 다만 이번 조사 결과와 구체적인 관세율은 아직 발표되지 않았다. USTR은 강제노동으로 생산된 제품을 수입하거나 관련 규제가 미비하다는 이유로 60개 경제주체에 대해서도 지난 3월 별도 조사를 시작했다. 이후 6월 관세 부과를 예고하고 7월 확정했으며, 한국에는 12.5%의 관세를 정했다. 무역법 301조는 미국의 무역을 제한하거나 부담을 주는 외국 정부의 부당하거나 불합리하고 차별적인 행동·정책·관행에 대해 행정부가 관세 부과 등으로 대응할 수 있도록 한 규정이다.","category":"세계"},{"title":"러 대사관 \"국제법 위반 아냐\"…울릉도 근접 비행 해명","link":"https://n.news.naver.com/mnews/article/422/0000929601","naverLink":"https://n.news.naver.com/mnews/article/422/0000929601","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"울릉도 영공 근접한 러시아 군용기…정부, 러 국방무관 초치 [연합뉴스 제공] 울릉도 영공에 가까이 접근한 러시아 군용기의 비행과 관련해 주한 러시아대사관이 국제법 위반이 아니라는 입장을 밝혔습니다. 러시아대사관은 현지시간 24일 타스통신을 통해 한국 방공식별구역, 카디즈는 한국 정부가 일방적으로 설정한 것으로 다른 나라 항공기에 법적 의무를 부과하지 않는다고 주장했습니다. 그러면서 러시아 측은 국제법 규범에 따라 행동했다고 강조했습니다. 앞서 러시아 군용기 여러 대는 이날 오전 동해 카디즈에 진입해 울릉도 영공을 침범하기 직전까지 접근했습니다. 우리 군은 영공 침범 가능성에 대비해 행정안전부에 경계경보 발령을 요청하기도 했습니다. 국방부는 주한 러시아 국방무관인 니콜라이 마르첸코 공군 대령을 초치해 엄중히 항의했고, 외교부도 외교채널을 통해 러시아 측에 유감을 표명하고 재발 방지를 촉구했습니다. #군용기 #러시아 #KADIZ #국방부 #울릉도 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"세계"},{"title":"COLOMBIA EXPLOSION","link":"https://n.news.naver.com/mnews/article/091/0010377110","naverLink":"https://n.news.naver.com/mnews/article/091/0010377110","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"Car bomb explosion in central Colombia injures more than 20 people People stand at the site of an overnight car bomb explosion which targeted a regional government building, in Villavicencio, central Colombia, 24 November 2026. The attack on the regional government offices left at least 23 people injured, including a minor, and caused damage to adjacent buildings. EPA/JAIR GONZALEZ --BEST QUALITY AVAILABLE--","category":"세계"},{"title":"France Elections","link":"https://n.news.naver.com/mnews/article/077/0007248146","naverLink":"https://n.news.naver.com/mnews/article/077/0007248146","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"France Elections 2027 presidential candidate for the French party Nouvelle Energie David Lisnard, speaks at the AMF congress, the annual meeting of French mayors in Paris, France, Tuesday, Nov. 24, 2026. (AP Photo/Teresa Suarez)","category":"세계"},{"title":"주택 가격 치솟자 美 노숙 학생 '역대 최다'…155만명 거리로","link":"https://n.news.naver.com/mnews/article/015/0005357801","naverLink":"https://n.news.naver.com/mnews/article/015/0005357801","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"/사진=게티이미지뱅크 주택 가격 상승 등의 영향으로 미국 내 노숙 학생이 통계 집계 이후 '역대 최다'를 기록했다. 23일(현지시간) 미 일간 워싱턴포스트(WP)는 미 연방정부의 자료를 인용해 지난 2024∼2025학년의 노숙 학생 수가 155만3989명으로 조사됐다고 보도했다. 이는 2004∼2005학년에 관련 통계를 집계한 이래 가장 많은 것이다. 보도에 따르면 해당 통계에서는 집이 없거나 다른 사람과 임시로 함께 사는 가정, 또 쉼터에 머물거나 모텔에 거주하는 가정의 학생들을 '노숙 학생'들로 집계했다. 스쿨하우스 커넥션(SchoolHouse Connection)의 바버라 더필드 사무국장은 \"주택 가격이 치솟으면서 가계가 영구 주택을 마련하기가 더욱 어려워지는 등 가족을 위한 안전망이 약해지고 있다\"고 밝혔다. 스쿨하우스 커넥션은 노숙 및 교육 문제를 다루는 단체다. 더필드 사무국장은 또 \"코로나19 팬데믹(전염병의 세계적 대유행) 기간 지원된 임시 자금이 노숙 학생들을 파악하는 데 도움이 돼 집계된 노숙 학생 수가 증가한 측면도 있다\"고 전했다. 교육구들은 팬데믹 기간 3년에 걸쳐 8억달러(한화 약 1조740억원)의 긴급 자금을 지원받아 노숙 학생들을 파악하고 필요한 자원을 제공하는 등 업무를 맡는 직원을 채용할 수 있었다. 더필드 사무국장은 \"이제 자금 지원이 종료돼 각 교육구가 노숙 학생들을 파악할 만큼의 충분한 자원을 확보하지 못하고 있다\"면서 \"도움이 필요한 가정은 늘어나는데 학교가 사용할 수 있는 자원을 줄어들고 있다\"고 지적했다. 이어 \"많은 저소득 가정이 의지하고 있는 식량 지원 등 공공복지 혜택도 삭감되고 있다. 학교는 노숙 문제 해결에 중요한 역할을 한다\"고 덧붙였다.","category":"세계"},{"title":"'시진핑 후계자 거론' 천지닝 상하이 당서기, 반부패 조사 받아","link":"https://n.news.naver.com/mnews/article/014/0005609239","naverLink":"https://n.news.naver.com/mnews/article/014/0005609239","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"관영 CCTV·신화통신 \"중대한 기율·법률 위반 혐의\"…구체적 혐의·직무 해임 여부는 미공개 20기 중앙정치국 위원 중 4번째 조사 대상…현직 상하이 당서기 조사는 천량위 이후 20년 만 칭화대 총장·베이징시장 거친 핵심 엘리트…올해 1월 방중한 이재명 대통령과 상하이서 만찬도 지난해 3월 6일(현지시간) 중국 베이징에서 열린 전국인민대표대회(전인대) 정부 업무보고 심의에 참석한 천지닝 상하이시 당서기의 모습. 시진핑 국가주석의 후계자 후보군으로 거론돼 온 천 서기는 '중대한 기율·법률 위반' 혐의로 당 중앙기율검사위원회와 국가감찰위원회의 반부패 조사를 받고 있다. /사진=뉴시스 [파이낸셜뉴스] 중국 경제의 심장부인 상하이시를 이끌며 시진핑 중국 국가주석의 후계자 후보군으로 거론돼 온 천지닝 상하이시 당서기가 반부패 조사를 받고 있다. 24일(현지시간) 중국 관영 신화통신과 중국중앙(CC)TV에 따르면 중국공산당 중앙정치국 위원인 천 서기는 '중대한 기율·법률 위반' 혐의로 현재 당 중앙기율검사위원회와 국가감찰위원회의 심사·조사를 받고 있다. 당국은 구체적인 혐의 내용과 조사 착수 시점을 공개하지 않았으며, 직무 해임이나 당적 처분 여부도 이번 보도에는 포함되지 않았다. 다만 시진핑 체제에서 당국의 '기율·법률 위반' 조사는 통상 부패 연루에 따른 사실상의 낙마 수순으로 받아들여진다. 상하이시 기율검사위원회는 발표 전날인 23일 홈페이지를 통해 천 서기가 최근 부패 문제 정비 회의에 참석해 연설했다고 전한 바 있다. ■ 현직 상하이 서기 조사는 20년 만…20기 정치국 위원 중 4번째 현직 상하이 당서기가 반부패 조사 대상에 오른 것은 2006년 사회보장기금 부정 운용 사건으로 해임된 천량위 이후 20년 만에 처음이다. 2022년 제20차 당대회 이후 출범한 20기 중앙정치국 위원 가운데 재임 중 조사 대상이 된 인사로는 장유샤·허웨이둥 전 중앙군사위 부주석, 마싱루이 전 신장위구르자치구 당서기에 이어 네 번째다. 이번 조사는 중국공산당이 지난달 26∼29일 제20기 중앙위원회 제5차 전체회의(20기 5중전회)를 열고 '전면적 종엄치당(전면적이고 엄격한 당 관리)'을 강조한 직후 이뤄져 고위층을 겨냥한 사정 정국이 한층 거세지고 있음을 보여준다. ■ 시진핑 칭화대 후배·차기 대권 후보군…1월 李 대통령과 만찬 인연 1964년생인 천 서기는 영국 임피리얼칼리지에서 환경공학 박사 학위를 받은 학자 출신 관료다. 시","category":"세계"},{"title":"'中 차기지도부 후보' 상하이 당서기 조사받아…4번째 정치국위원(종합)","link":"https://n.news.naver.com/mnews/article/001/0016461537","naverLink":"https://n.news.naver.com/mnews/article/001/0016461537","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"'엄중한 기율·법률 위반' 혐의…시진핑 사정작업 속 '부패 연루' 관측 천지닝 중국공산당 상하이 당서기 [풀 제공. 로이터=연합뉴스 자료사진] (상하이=연합뉴스) 차병섭 특파원 = 시진핑 중국 국가주석 주도의 대대적 반부패 작업이 이어지는 상황에서, 중국공산당 차기 최고지도부 유력 후보로 거론되던 상하이시 당서기가 당국의 조사 대상에 올랐다. 24일(현지시간) 중국공산당 중앙기율위원회·국가감찰위원회 홈페이지에 따르면 중앙정치국 위원이자 상하이 당서기인 천지닝(62)이 엄중한 기율·법률 위반 혐의로 중앙기율위·국가감찰위의 심사·조사를 받고 있다. 당국이 구체적인 혐의를 밝히지는 않았지만, 통상적으로 기율·법률 위반은 부패와 관련 있는 것으로 받아들여진다. 중국공산당 상하이시위원회 상무위는 이날 확대회의를 열고 당중앙의 조사 결정을 굳게 지지한다며 \"(이번 조사는) 반부패 투쟁에서 한걸음도 쉬지 않고 반걸음도 물러서지 않겠다는 강력한 신호를 충분히 보여줬다\"고 했다. 천지닝은 2022년 제20차 중국공산당 전국대표대회(당대회) 이후 구성된 현 중앙정치국 위원 20여명 가운데 허웨이둥 전 중앙군사위 부주석, 장유샤 전 중앙군사위 부주석, 마싱루이 전 신장위구르자치구 당서기에 이어 4번째로 조사 대상이 됐다. 앞서 중국공산당은 지난달 26∼29일 제20기 중앙위원회 제5차 전체 회의(20기 5중전회)를 열고 '전면적 종엄치당(전면적이고 엄격한 당 관리)'을 강조하기도 했다. 천지닝은 칭화대 총장과 환경보호부 부장(장관), 수도 베이징 시장 등을 거쳐 2022년부터 경제중심지인 상하이 '1인자' 당서기를 맡아왔다. 리창 총리가 2022년까지 상하이 당서기를 맡은 뒤 총리 자리에 올랐고 시 주석도 2007년 상하이 당서기를 거쳐 중앙정치국 상무위원이 된 만큼, 천지닝도 차기 최고 지도부 후보로 거론되어 왔다. 사우스차이나모닝포스트(SCMP)는 1989년 이후 10명의 상하이 당서기 중 시 주석을 비롯한 8명이 중앙정치국 상무위원이 됐다며, 상하이 당서기가 중국에서 정치적으로 가장 중요한 자리 중 하나라고 설명했다. 여기에는 리 총리와 장쩌민 전 국가주석, 주룽지 전 총리, 한정 부주석도 포함된다. 성도일보는 최근 30여년간 천량위를 제외한 역대 상하이 당서기 모두가 정치국 상무위원에 오른 만큼 천지닝도 내년 제21차 당대회에서 유력한 정치국 상무위원 후보로 전망되어 왔다고 전했다. '상하이방' 핵심 인물로 꼽혔던 천량위는","category":"세계"},{"title":"사우디 수도 최고층 빌딩, 일주일 만에 또 발사체에 피격","link":"https://n.news.naver.com/mnews/article/055/0001405556","naverLink":"https://n.news.naver.com/mnews/article/055/0001405556","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"▲ 후티 반군의 공격으로 파손된 사우디 수도 리야드의 PIF 타워 사우디아라비아 수도 리야드의 금융지구에 있는 최고층 빌딩이 일주일 만에 발사체에 또 피격됐습니다. 이번 발사체로 후티 반군의 소행으로 추정됩니다. 투르키 알말키 사우디 주도 연합군 대변인은 현지시간 24일, \"금융센터 내 타워 한 곳이 비겁한 테러 공격의 표적이 됐다\"며 \"관계 당국이 현재 공격 현장을 조사하고 있다\"고 밝혔습니다. 현장 목격자들의 외신 인터뷰에 따르면, 수도 리야드 금융지구 내 사우디 국부펀드(PIF) 본부가 입주한 초고층 빌딩이 타격받았습니다. 통상 리야드에 안보 위협이 발생했을 때 발송되던 휴대전화 긴급 경고 메시지는 이번에는 발송되지 않았습니다. 앞서 지난주에도 PIF 본부가 입주한 80층 타워가 후티 반군의 공격을 받아 여러 층과 인접 건물 2채가 파손됐습니다. 당시 사우디 당국은 피격 건물을 구체적으로 밝히지 않았지만, 민방위국이 공개한 사진에는 PIF 타워의 유리창이 깨지고 외벽이 손상된 모습이 담겼습니다. 친 이란 성향의 예멘 후티 반군은 지난주 공격의 배후를 자처했으나, 이번 공격에 대해서는 아직 입장을 내놓지 않았습니다. 높이 385ｍ의 PIF 타워는 사우디 경제 비전의 상징인 리야드 킹 압둘라 금융지구(KAFD)의 핵심 건물입니다. 초고층 빌딩과 고급 상점, 녹지 공간이 조성된 이 지구에는 사우디 증권거래소 본부와 골드만삭스 등 주요 다국적 기업들이 입주해 있습니다. 후티 반군은 최근 몇 주간 사우디의 공항과 에너지 기반 시설, 군사 시설, 리야드 금융지구 등을 겨냥해 공격 수위를 높여왔습니다. 지난달에는 리야드 킹칼리드 국제공항이 공격받아 14명이 숨지고 수백 명이 다쳤으며, 이에 따라 항공편 운항이 2주간 중단되기도 했습니다. 사우디 주도 연합군도 이에 대한 보복으로 예멘 내 후티 반군을 상대로 공습을 이어가고 있습니다. (사진=연합뉴스)","category":"세계"},{"title":"FRANCE EU PARLIAMENT","link":"https://n.news.naver.com/mnews/article/091/0010377106","naverLink":"https://n.news.naver.com/mnews/article/091/0010377106","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"European Parliament session in Strasbourg European Commissioner for Economy and Productivity; Implementation and Simplification Valdis Dombrovskis speaks during a debate on 'Presentation of the European Semester autumn package' at the European Parliament in Strasbourg, France, 24 November 2026. The current plenary session runs from 23 until 26 November 2026. EPA/RONALD WITTEK","category":"세계"},{"title":"VENEZUELA ECONOMY","link":"https://n.news.naver.com/mnews/article/091/0010377104","naverLink":"https://n.news.naver.com/mnews/article/091/0010377104","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"Fintech Venezuela executive president Maria Elena Machado interview in Caracas Maria Elena Machado, executive president of Fintech Venezuela, speaks during an interview in Caracas, Venezuela, 23 November 2026 (issued 24 November 2026). EPA/RONALD PENA R","category":"세계"}],"IT 과학":[{"title":"이젠 시험엔 앞치마 필수?…텝스, AI 부정행위 차단 위해 내달부터 가운·앞치마 입고 본다","link":"https://n.news.naver.com/mnews/article/021/0002835244","naverLink":"https://n.news.naver.com/mnews/article/021/0002835244","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"AI 생성 이미지 인공지능(AI)을 활용한 시험 부정행위 논란이 확산하는 가운데 서울대가 주관하는 영어능력평가시험 텝스(TEPS)도 가운과 앞치마 착용을 추진키로 했다. 옷이나 단추 등에 숨긴 초소형 카메라로 시험지를 촬영하지 못하게 하기 위한 목적이다. 24일 서울대 텝스관리위원회에 따르면 텝스관리위는 내달 5일 치러지는 제413회 정기시험부터 수험생에게 일회용 가운과 앞치마를 지급해 착용하도록 할 방침이다. 텝스관리위는 지난 21일 정기시험부터 수험생의 모자 착용을 금지하고 고사장별로 금속탐지기를 도입하는 등 부정행위 방지 대책을 시행하고 있다. 시험 중 AI를 활용하거나 스마트기기를 사용, 착용할 경우 부정행위로 처리돼 응시 자격이 박탈되며 법적 조치의 대상이 될 수 있다. 텝스관리위 관계자는 “수험자 보호와 부정행위 적발을 위한 조치”라며 “물품 구매를 마치는 등 준비가 된 상태”라고 설명했다. 고용노동부와 한국산업인력공단도 24일 ‘국가자격시험 공정성 확보 방안’을 발표하고 앞으로 공단이 시행하는 모든 국가 자격시험에서 수험생에게 부직포로 만든 가리개 형태의 앞치마를 입히기로 했다.","category":"IT 과학"},{"title":"쿠콘, 3분기 영업익 51억 ‘역대 최대’…AI·글로벌 결제 신사업 확대","link":"https://n.news.naver.com/mnews/article/018/0006414872","naverLink":"https://n.news.naver.com/mnews/article/018/0006414872","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"매출 203억·영업익 51억 전년比 16.9%·6.6% 증가 간편결제·외국인 결제 수요 증가에 실적 개선 AI 데이터·스테이블코인 사업 내년부터 수익화 전년도 영업익 20~30% 주주환원 추진 [이데일리 김현아 기자] 비즈니스 데이터 플랫폼 기업 쿠콘(294570)이 간편결제와 외국인 결제 수요 증가에 힘입어 분기 기준 역대 최대 영업이익을 기록했다. 내년부터는 인공지능(AI) 데이터와 글로벌 결제, 스테이블코인 등 신사업의 수익화에 나선다. 쿠콘은 24일 기업설명회(IR)를 열고 올해 3분기 별도 기준 매출 202억7000만원, 영업이익 51억1000만원을 기록했다고 밝혔다. 전년 동기 대비 각각 16.9%, 6.6% 증가했다. 영업이익은 분기 기준 역대 최대다. 매출 증가율도 지난 2분기 7.3%에서 3분기 16.9%로 높아졌다. 올해 3분기까지 누적 매출은 542억4000만원, 영업이익은 145억4000만원이다. 쿠콘 안광수 상무가 ‘2026년 3분기 정례 IR’에서 ‘AI·디지털자산 금융 인프라 기업’으로의 전환 전략을 발표하고 있다. 사진=쿠콘 결제 사업 호조…데이터 매출도 두 자릿수 성장 실적 개선을 이끈 것은 결제(페이먼트) 사업이다. 3분기 매출은 106억6000만원, 영업이익은 27억1000만원으로 전년 동기 대비 각각 21.4%, 26.7% 증가했다. 2024년 이후 분기 최대 실적이다. 대형 간편결제사와 전자결제대행사(PG)의 거래량이 늘고 위챗페이·알리페이 등 외국인 결제 수요가 증가한 영향이다. 영업이익률도 25.4%로 3개 분기 연속 개선됐다. 데이터 부문 매출은 96억1000만원으로 12.3% 증가했다. 공공 마이데이터 사업과 금융 마이데이터 응용프로그램 인터페이스(API) 매출 확대가 성장을 이끌었다. 영업이익은 24억원으로, AI 데이터 관련 개발 투자와 공공사업 초기 비용이 수익성에 영향을 미쳤다. AI 에이전트에 데이터 공급…스테이블코인 결제도 준비 쿠콘은 기존 데이터·결제 사업을 기반으로 AI와 디지털자산 금융 인프라 사업을 확대한다. AI 에이전트가 필요한 데이터를 직접 불러올 수 있도록 지원하는 MCP(모델 컨텍스트 프로토콜) 기반 데이터 API를 연내 100여 종으로 늘린다. 내년까지 전체 상품군에 MCP를 적용해 AI 에이전트의 데이터 이용 증가를 새로운 매출원으로 연결한다는 구상이다. 글로벌 결제 사업도 확대한다. 현재 20개국 50여 개 결제 파트너를 확보한 쿠콘은","category":"IT 과학"},{"title":"한수원, 사내 AI '하이누리' 성과 공유회…한전KDN·네이버와 협약","link":"https://n.news.naver.com/mnews/article/421/0009307432","naverLink":"https://n.news.naver.com/mnews/article/421/0009307432","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"업무 활용 우수사례 10건 발표…AI 에이전트 과제 발굴 협력 한국수력원자력, 사내 AI 서비스 '하이누리(Hy-NuRI)' 성과공유회 및 AI 기술협력 업무협약식 개최(한국수력원자력 제공) (세종=뉴스1) 김우진 기자 = 한국수력원자력이 사내 생성형 인공지능(AI) 서비스 '하이누리'의 활용 성과를 공유하고, 한전KDN·네이버클라우드와 AI 기술협력에 나선다. 한수원은 24일 경북 경주시 본사에서 하이누리 성과공유회와 업무협약식을 열었다고 밝혔다. 하이누리는 원전 운영 등 한수원의 방대한 업무자료를 학습한 사내 생성형 AI 플랫폼이다. 이날 공유회에서는 사내 공모전에 접수된 AI 활용 사례 가운데 업무혁신 효과가 큰 10건이 발표됐다. 임직원이 직접 개발하거나 업무에 적용한 사례다. 한수원은 한전KDN, 네이버클라우드와 AI 기술협력 업무협약도 맺었다. 세 기관은 업무혁신 전략 수립, AI 에이전트 기반 과제 발굴, AI 인프라·서비스 기술지원도 협력할 예정이다. 김회천 한수원 사장은 \"사내 생성형 AI 서비스 하이누리를 지속적으로 고도화하고 현업 중심의 활용을 확대해 업무 생산성을 높이겠다\"며 \"AI를 기반으로 한 원전 안전 운영 체계를 마련하는 데에도 힘쓰겠다\"고 말했다.","category":"IT 과학"},{"title":"“저 의대 갈래요” 달라졌다…내신 1등급 6명 중 1명 반도체 계약학과 지원 [세상&]","link":"https://n.news.naver.com/mnews/article/016/0002728175","naverLink":"https://n.news.naver.com/mnews/article/016/0002728175","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"반도체 계약학과 지원자 비율 7.3%→16.3% 의대 지원 건수 비중은 73.6%→67.1% 하락 올해 수시모집에서 자연계열 내신 최상위권 수험생들이 의대에 지원을 집중하는 경향이 다소 줄고 반도체 계약학과에 지원한 수험생 비율이 높아진 것으로 파악됐다. [AI로 제작] [헤럴드경제=김용재 기자] 올해 수시모집에서 자연계열 내신 최상위권 수험생들이 의대에 지원을 집중하는 경향이 다소 줄고 반도체 계약학과에 지원한 수험생 비율이 높아진 것으로 파악됐다. 의대 선호는 여전히 높지만 다른 학과에도 지원하는 움직임이 나타났다는 분석이다. 25일 진학사는 자사 서비스에 2026·2027학년도 수시 지원 대학을 공개한 자연계열 내신 1.0등급대 수험생의 지원 현황을 분석한 결과를 발표했다. 내신 1.0등급대는 1.00~1.09등급으로, 자연계열은 고교에서 과학 교과 이수단위가 사회 교과보다 많은 수험생으로 분류했다. 분석 대상 가운데 반도체 계약학과에 한 곳 이상 지원한 비율은 지난해 7.3%에서 올해 16.3%로 9.0%포인트 상승했다. 최상위권 수험생 약 6명 중 1명이 지원한 셈이다. 이들의 전체 수시 지원 건수에서 반도체 계약학과가 차지한 비중도 1.7%에서 4.1%로 높아졌다. 반면 의대에 한 곳 이상 지원한 수험생 비율은 89.8%에서 87.5%로 2.3%포인트 낮아졌다. 의대 지원자 1인당 평균 의대 지원 건수도 4.49건에서 4.27건으로 줄었다. 전체 수시 지원 건수 중 의대 비중은 73.6%에서 67.1%로 6.5%포인트 하락했다. 수시 지원 대학을 공개한 자연계열 내신 1.0등급대 수험생의 지원 현황 분석 결과 반도체 계약학과에 한 곳 이상 지원한 비율은 지난해 7.3%에서 올해 16.3%로 9.0%포인트 상승했다. [진학사 제공]","category":"IT 과학"},{"title":"[뉴욕개장]엔비디아발 AI 랠리 주춤하며 하락 출발…나스닥 1.43%↓","link":"https://n.news.naver.com/mnews/article/421/0009308136","naverLink":"https://n.news.naver.com/mnews/article/421/0009308136","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"미국 뉴욕 증권거래소의 트레이더. 2026.5.26 ⓒ AFP=뉴스1 (서울=뉴스1) 권영미 기자 = 24일(현지시간) 미국 뉴욕 증시가 하락세로 출발했다. 전날 엔비디아 젠슨 황 최고경영자(CEO)의 복귀로 급등했던 인공지능(AI) 관련주 랠리가 주춤해진 가운데 투자자들은 이번 주 나올 물가 지표를 기다리고 있다. 로이터통신에 따르면 개장 직후 다우존스 산업평균지수는 100.7포인트(0.20%) 하락한 4만9494.6을 기록했다. 스탠더드앤드푸어스(S&P) 500 지수는 64.8포인트(0.90%) 내린 7172.33, 나스닥 종합지수는 343.7포인트(1.43%) 떨어진 2만3745.862에 각각 출발했다.","category":"IT 과학"},{"title":"Britain London Museum","link":"https://n.news.naver.com/mnews/article/077/0007248145","naverLink":"https://n.news.naver.com/mnews/article/077/0007248145","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"Britain London Museum A silk vest thought to have been worn by King Charles I at his execution in 1649 is on display during a press preview of the new London Museum at Smithfield in London, Tuesday, Nov. 24, 2026. (AP Photo/Alastair Grant)","category":"IT 과학"},{"title":"KOSA, AI 사업 대가산정 로드맵 공개","link":"https://n.news.naver.com/mnews/article/018/0006415031","naverLink":"https://n.news.naver.com/mnews/article/018/0006415031","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"AI 구축비 5개 항목…전문기술 비용 신설 18개 직무에 SW기술자 평균임금 연계 별책 참고자료 공개·현장 검증 후 가이드 반영 [이데일리 신영빈 기자] 인공지능(AI) 구축사업을 발주할 때 검색증강생성(RAG) 등 AI 전문기술에 투입하는 인력 비용을 별도로 산정할 수 있는 기준이 나왔다. 한국인공지능·소프트웨어산업협회(KOSA)는 이 같은 내용을 담은 ‘AI·SW사업대가 로드맵’과 ‘AI사업 대가산정 참고자료’를 공개했다고 24일 밝혔다. 기존 ‘SW사업 대가산정 가이드’는 발주기관이 소프트웨어(SW) 사업 예산을 편성하거나 발주 금액을 산정할 때 활용해 왔다. 거대언어모델(LLM)을 특정 업무에 맞게 추가 학습시키거나 AI 모델의 운영·관리 체계를 구축하는 데 드는 비용은 충분히 반영하기 어려웠다. AI 전문직무에 어떤 SW기술자 평균임금을 적용할지를 두고도 발주기관과 개발사 간 이견이 있었다. KOSA는 이번 참고자료에서 비용 산정 범위를 AI 구축사업 전 과정으로 넓혔다. 사업비는 △AI 모델 구독 등 서비스 이용료 △데이터 구축·모델 학습 등 맞춤화 비용 △AI 특화기술요소 비용 △AI 시스템 개발비 △AI 인프라 구축비 등 5개 항목으로 나눴다. AI 전문기술 인력의 투입 비용을 산정하는 ‘AI 특화기술요소’ 항목을 신설했다. 기능점수(FP) 방식으로 산정하는 시스템 개발비와 그래픽처리장치(GPU)·클라우드 등 인프라 구축비 기준도 구체화했다. 직무별 인건비를 산정할 때는 기존 임금 통계를 활용한다. KOSA는 AI 직무 18개를 정의하고 각 직무에 적용할 ‘SW기술자 평균임금’ 항목을 제시했다. ‘RAG·지식검색 엔지니어’에게는 응용SW개발자 평균임금을, ‘AI 모델 아키텍트’에게는 IT아키텍트 평균임금을 적용한다. 이번 AI 산정 기준은 기존 가이드의 별책 참고자료로 마련됐다. 발주기관과 SW기업은 계약 금액을 산정할 때 이를 활용할 수 있다. SW기술자 임금실태조사에 AI 직무와 업무 영역을 추가하는 방안도 검토한다. 중장기적으로는 AI 도입에 따른 개발 생산성 변화와 비기능 요구사항 측정방법(SNAP) 도입 타당성도 연구한다. 실제 사업 데이터로 검증하고 시범 적용한 항목부터 정식 가이드에 반영할 계획이다. KOSA는 이날 오후 ‘2026년 SW사업대가 세미나’에서 로드맵과 참고자료를 소개했다. 한국SW측정원은 SNAP 도입 방안을, 미래경제전략연구원은 기능점수 단가를 현실화하기 위한 SW","category":"IT 과학"},{"title":"AI 맛집 추천은 '동네 경쟁'…서울 8곳서 겹친 식당 없었다","link":"https://n.news.naver.com/mnews/article/018/0006415026","naverLink":"https://n.news.naver.com/mnews/article/018/0006415026","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"애니모프, 챗GPT·제미나이 답변 540건 분석 챗GPT 3㎞ 떨어진 지점서 장소 겹침률 1.4% 제미나이 추천 장소 절반은 반경 634m 이내 [이데일리 신영빈 기자] 서울에서 챗GPT에 “근처 맛집 추천해줘”라고 묻자 질문 위치에 따라 식당 목록이 달라졌다. 여러 동네에서 똑같이 이름을 올린 식당은 한 곳도 없었다. 생성형 AI 검색 최적화(GEO) 기업 애니모프는 서울 9개 지점에서 챗GPT와 구글 제미나이가 내놓은 장소 추천 답변 540건을 분석한 결과를 24일 밝혔다. 애니모프가 서울 9개 지점에서 챗GPT와 제미나이에 '근처' 질문을 던져 받은 답변 540건을 집계한 분석 결과를 공개했다. (사진=애니모프) 애니모프는 지난달 11일 강남구 삼성동을 중심으로 3㎞ 간격의 9개 지점을 골랐다. 각 지점의 위도·경도를 질문과 함께 보내 해당 위치에서 받을 수 있는 추천을 조사했다. 저녁 맛집과 카페, 치과 등 주변 장소를 묻는 질문 15개를 두 AI에 각각 두 차례씩 입력했다. 챗GPT는 삼성동을 제외한 8개 지점에서 식당 35곳을 추천했다. 두 지점 이상에서 추천이 나온 식당은 없었다. 카페도 40곳 가운데 겹치는 곳이 없었다. 같은 지점에서 같은 질문을 반복했을 때 두 답변의 추천 장소가 겹친 비율은 챗GPT 34.0%, 제미나이 69.5%였다. 질문 위치를 3㎞ 떨어진 이웃 지점으로 바꾸자 겹침 비율은 챗GPT 1.4%, 제미나이 7.1%로 낮아졌다. 제미나이가 서울에서 추천한 장소의 절반은 질문 지점에서 634m 이내에 있었고 81.9%는 1.5㎞ 안에 있었다. 서울의 서로 다른 지점끼리 챗GPT 답변을 비교했을 때 추천 장소가 겹친 비율은 평균 1.3%였다. 업종별로는 저녁 맛집이 0%, 카페가 0.2%, 미용실이 1.4%였다. 은행은 12.9%로 가장 높았다. 이번 조사에서는 장소 이름에서 지점명을 떼고 집계했다. 같은 은행의 서로 다른 영업점도 이름이 같으면 중복 추천으로 계산한 것이다. 서울은 같은 방식으로 조사한 네 도시 가운데 동네별 추천 차이가 가장 컸다. 챗GPT의 지점 간 추천 겹침 비율은 도쿄 1.9%, 뉴욕 2.5%, 미국 오스틴 7.9%였다. 애니모프는 네 도시 36개 지점에서 수집한 답변 2160건과 장소별 원자료를 공개했다. 송준혁 애니모프 대표는 “로컬 GEO에서 성과를 내려면 매장이 있는 위치에서 AI가 무엇을 추천하는지 직접 확인하고 매장 정보·리뷰·웹페이지처럼 AI가","category":"IT 과학"},{"title":"에이블런, 누적 수주액 301억원…AI 업무 위임 교육 확대","link":"https://n.news.naver.com/mnews/article/018/0006415018","naverLink":"https://n.news.naver.com/mnews/article/018/0006415018","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"전년 동기 대비 48.2% 증가 누적 교육생 22만7000명 '에이전트 리터러시' 16개 과정 운영 [이데일리 신영빈 기자] 인공지능(AI) 교육기업 에이블런은 9월 말 기준 누적 수주·계약액이 301억원으로 전년 동기보다 48.2% 늘었다고 24일 밝혔다. 제조·금융·의료 등 여러 분야의 기업과 기관 1480곳이 고객사로 참여했다. 누적 22만7000명이 교육을 받았다. 에이블런이 교육을 확대하는 분야는 AI에 일을 맡기고 결과를 검증하는 ‘에이전트 리터러시’다. 교육생은 현업에서 해결할 문제를 구체적인 과제로 정리한 뒤 AI가 처리할 업무 범위와 권한을 정한다. 결과물을 어느 단계에서 누가 어떤 기준으로 확인할지도 정한다. 업무를 맡길 때 이 기준이 분명해야 결과물을 다시 검토하고 수정하는 부담을 줄일 수 있다는 게 회사 측 설명이다. 에이블런이 지난달 공개한 ‘AX 역량진단평가’에서는 기업·기관 10곳의 임직원 730명 가운데 47.3%가 ‘자동화·에이전트 운영’ 영역에서 취약 판정을 받았다. 회사는 기본·심화 과정 16개를 운영하고, 교육 도구인 ‘AX 어시스턴트 매니저’를 활용해 과제 설계와 검증 기준 수립, AI에 작업을 지시하는 프롬프트 작성 등을 지원한다. 맥킨지의 지난 8월 글로벌 AI 조사에 따르면 응답자의 80%가 AI 활용으로 개인 생산성이 높아졌다고 답했다. AI가 영업이익에 기여했다고 답한 비율은 37%였다. 조사에서 고성과 기업으로 분류된 곳은 약 6%였다. 이들 가운데 약 4분의 3은 업무 방식을 근본적으로 재설계했다고 응답했다. 박진아 에이블런 대표는 “AI를 도입한 기업들이 이제는 어떤 업무를 AI에 맡기고 결과를 누가 어떻게 확인할지 고민하고 있다”며 “현업 구성원이 직접 업무를 AI에 맡기고 결과를 검증할 수 있도록 에이전트 리터러시 교육을 기업 AX의 출발점으로 만들겠다”고 밝혔다.","category":"IT 과학"},{"title":"‘5인조 AI 보이그룹’ 히어러스, ‘CRUSH’로 가요계 출사표","link":"https://n.news.naver.com/mnews/article/144/0001151508","naverLink":"https://n.news.naver.com/mnews/article/144/0001151508","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"‘5인조 AI 보이그룹’ 히어러스, ‘CRUSH’로 가요계 출사표. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-23","weekday":"월요일","label":"보관 · 11월 23일 월요일","total":50,"categories":{"사건 사고":[{"title":"3.62㎏ 태어난 아기, 6개월뒤 3.68㎏ 사망…20대 부모는 PC방 다녔다","link":"https://n.news.naver.com/mnews/article/021/0002834926","naverLink":"https://n.news.naver.com/mnews/article/021/0002834926","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"AI에 ‘신생아 사망보험금’·‘아이 죽이고 싶다’ 등 검색 기사의 이해를 돕기 위한 인공지능(AI) 생성 이미지 출생한 아들을 6개월 동안 140회 넘게 홀로 두고 PC방에 다니는 등 방치해 숨지게 한 20대 부부에게 공소청이 무기징역을 구형했다. 23일 대전지법 제13형사부(장민경 부장판사) 심리로 열린 A(22) 씨와 B(22) 씨의 아동학대 살해 혐의 사건에서 검사는 부부에게 모두 무기징역을 선고해달라고 재판부에 요청했다. 두 사람 모두에게 10년간 아동·청소년 관련 기관 취업제한 명령도 내려달라고도 했다. 검사는 “피고인들 모두 친부모로 양육의 책임이 있는데도 피해 아동을 생후부터 방치해 극심한 발육부진과 영양결핍을 앓게 했고, 아동은 급기야 혈변을 하다 숨졌다”며 “특별한 경제적 활동도 없이 조부모로부터 도움을 받을 수 있음에도 거부하고 용납하기 어려운 사유로 무책임하게 친자식을 유기해 살해해 죄책에 상응하는 엄벌이 필요하다”고 밝혔다. A 씨 부부는 아들이 출생한 지 불과 10여일 됐던 지난해 12월 22일부터 올해 7월 5일까지 아이를 주거지에 홀로 둔 채 PC방에 가거나 여행을 가는 등 총 140차례에 걸쳐 방치하고, 아이에게 필요한 의·식·주 등 기본적인 보호·양육을 하지 않은 혐의로 재판에 넘겨졌다. 공소청 조사 결과 A 씨 부부는 아기를 상습적으로 방치하면서 체중이 현저히 감소한 아기에게 분유도 제대로 주지 않았는데, 부검 결과 아기의 특정 신체 부위가 짓물렀고 구더기까지 발견됐다. 두 사람은 올해 4월에는 집에 반려견과 당시 4개월이었던 아들만 둔 채 27시간 46분 동안 집을 비운 것으로도 조사됐다. 지난해 12월 출생 당시 몸무게가 3.62㎏였던 피해 아동은 사망했던 올해 7월 5일 당시엔 3.68㎏에 불과했다. 출생할 때 비해 겨우 0.06㎏ 늘어난 것으로, 생후 6개월 남아 평균 몸무게(8.3㎏)의 절반에도 미치지 못했다. 친부인 A 씨는 아기 사망 뒤 ‘아이가 죽으면 처벌이 얼마나 되느냐“고 인공지능(AI)에 물어봤고, 친모인 B 씨도 포털사이트에 아기 출생 약 한 달여 뒤부터 수개월에 걸쳐 ’신생아 사망 보험금‘, ’아이 죽이고 싶어요‘, ’아사 뜻‘ 등을 검색한 것으로 드러났다. 이들은 각각 “당황해서 검색했다”, “산후우울증 때문에 검색해서 위로받으려고 그랬다”고 법정에서 진술했는데, 아기의 사망과 관련해서는 “사망할 줄은 몰랐다”며 살인 고의를 부인해왔다. 피고인들의 변호인","category":"사건 사고"},{"title":"고경표, “대리운전 왜 안 불렀나” 묻자 한숨만…음주운전 사고 9일 만 경찰 조사","link":"https://n.news.naver.com/mnews/article/468/0001282961","naverLink":"https://n.news.naver.com/mnews/article/468/0001282961","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"고경표, “대리운전 왜 안 불렀나” 묻자 한숨만…음주운전 사고 9일 만 경찰 조사. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"'리트 만점자' 책 사고 손해배상 청구한 구매자들, 소 취하","link":"https://n.news.naver.com/mnews/article/018/0006414403","naverLink":"https://n.news.naver.com/mnews/article/018/0006414403","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"[이데일리 장영락 기자] AI를 이용한 부정행위 의혹을 받다 사망한 법학적성시험(LEET) 만점자 이진우씨 책 구매자들이 손해배상 소송을 취하했다. 연합 23일 법조계에 따르면 이씨 저서 ‘브레인 악셀’ 구매자 17명의 소송대리인은 지난 20일 서울중앙지법 민사18단독 재판부에 소 취하서를 제출했다. 이들은 앞서 이씨와 출판사를 대상으로 책값과 위자료 등을 청구하는 손해배상 소송을 청구한 바 있다. 하지만 소장 부본이 피고에게 송달되기 전인 19일 이씨가 사망하면서 소송을 계속 진행하지 못하게 됐다. 민사소송은 소장이 송달되기 전 피고가 사망하는 경우 상속인이 소송을 이어받는 소송수계가 적용되지 않도록 규정하고 있다.이씨는 올해 LEET 시험에서 만점을 받은 후 성적 향상 경험을 담았다는 저서 ‘브레인 악셀’을 출간했다. 그러나 이씨가 대학수학능력시험과 LEET에서 AI를 이용해 부정행위를 했다는 의혹이 불거지면서 책을 구매한 이들이 환불을 요청하는 등 반발하며 소송을 냈다. 이씨는 지난 19일 수학능력시험 당일 시험 풀이를 통해 공개 검증을 하겠다고 밝혔으나 현장에 나타나지 않고 연락이 두절됐고, 같은 날 오후 서울 강동구 한 모텔에서 숨진 상태로 발견됐다. 한편 경찰은 이씨가 위계에 의한 공무집행방해, 업무방해, 사기 등 혐의로 고발된 사건을 수사 중이다. 경찰은 이씨가 사망했지만 ‘공소권 없음’을 사유로 종결하지 않고 실체적 진실 확인을 위해 수사를 이어갈 방침이다.","category":"사건 사고"},{"title":"이 대통령, 5·18 진압경찰 등 포상취소에 \"역사교정 계속\"","link":"https://n.news.naver.com/mnews/article/422/0000929691","naverLink":"https://n.news.naver.com/mnews/article/422/0000929691","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"이재명 대통령은 5·18 민주화운동 진압 등에 관련된 경찰관들의 정부 포상이 취소된 것에 대해 \"반인권 범죄 가담이나 내란 범죄 수행자들의 서훈 박탈은 만시지탄이나 너무 당연한 조치\"라고 말했습니다. 이 대통령은 오늘(25일) SNS에 올린 글에서 이같이 언급한 뒤 \"앞으로도 마지막 한명까지 역사 교정은 쭉 계속될 것\"이라고 적었습니다. 앞서 경찰청은 국무회의에서 5·18 민주화운동 진압과 삼청교육 등 신군부 시기 헌법질서와 인권을 침해한 행위와 관련해 수여된 정부포상을 대거 취소했다고 밝혔습니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사건 사고"},{"title":"늑장수사 비판 끝에…경찰, 김병기 6개 의혹 송치","link":"https://n.news.naver.com/mnews/article/422/0000929431","naverLink":"https://n.news.naver.com/mnews/article/422/0000929431","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 경찰이 각종 비위 의혹을 받는 무소속 김병기 의원을 공소청에 송치했습니다. 수사에 착수한지 1년여 만인데요. 사회부 취재기자 연결해 자세히 들어보겠습니다. 신선재 기자. [기자] 네, 서울경찰청 광역수사단 공공범죄수사대는 김병기 무소속 의원의 각종 의혹에 대한 수사를 마치고 오늘(24일) 불구속 상태로 관련자들을 공소청에 넘겼습니다. 먼저 김 의원의 혐의가 인정된다고 판단한 건 모두 6개의 의혹과 관련해서인데요. 먼저 김 의원의 둘째 아들과 관련한 의혹은 대부분 송치됐습니다. 김 의원에겐 특정범죄가중처벌법상 뇌물 혐의와 업무방해 혐의가 적용됐는데요. 진우산전과 빗썸에 유리하게 의정활동을 해준 대가로 차남을 취업시켰다는 건데, 그렇게 차남이 얻은 급여와 숭실대 등록금 등 수천만원을 뇌물로 수수했다고 본 겁니다. 강선우 더불어민주당 의원의 공천헌금 1억원 수수 의혹을 묵인해 공천관리위원회의 업무를 방해한 혐의도 포함됐습니다. 이 밖에도 신라레저 고위 관계자에게 후원금 명목으로 500만원을 받고 국정감사에서 유리한 질의를 한 혐의, 대한항공에서 고가의 호텔 숙박권을 받은 혐의, 배우자가 동작구 업무추진비를 사적으로 유용한 혐의입니다. 또 쿠팡에 취업한 전직 보좌관에게 인사상 불이익을 주려 했다는 혐의도 공소청에 넘겨졌습니다. 김 의원 본인을 포함해 차남과 배우자, 기업 대표 등 18명이 함께 불구속 송치됐습니다. [앵커] 김 의혹을 둘러싸고 불거진 의혹은 13개에 이르는데, 송치되지 않은 사건도 많군요? [기자] 네, 먼저 이른바 '탄원서'가 공개되면서 가장 관심을 모았던 사건이죠. 전직 동작구 의원들로부터 정치자금 명목으로 모두 3천만원을 수수했다가 돌려줬다는 의혹인데요. 경찰은 전직 구의원들이 실제로 돈을 전달한 사실은 확인했지만, 김 의원이 직접 관련됐다는 증거는 파악하지 못해 불송치한 걸로 전해졌습니다. 다만 돈을 건넨 전직 구의원들과 전달에 관여한 이지희 동작구의회 부의장, 또 김 의원 배우자 이 모 씨는 송치됐습니다. 동작구 업무추진비 유용 의혹으로도 김 의원은 송치되지 않았지만 배우자가 공소청에 넘겨졌습니다. 또 김 의원이 서울 동작경찰서의 해당 의혹 수사를 무마하려 했다는 의혹과 관련해서도, 경찰은 김 의원이 직접 관련돼있다는 증거를 확보하지 못해 관련자 7명을 모두 불송치했습니다. 장남의 국정원 비밀 누설 의혹 등 그 밖의 의혹들도 모두 불송치했습니다. 경찰은 지난해 9월부터 수사를 시작했고","category":"사건 사고"},{"title":"'인터폴 적색수배' 금영엔터 회장 두바이서 붙잡혀…경찰 송환 추진","link":"https://n.news.naver.com/mnews/article/003/0014340786","naverLink":"https://n.news.naver.com/mnews/article/003/0014340786","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"'인터폴 적색수배' 금영엔터 회장 두바이서 붙잡혀…경찰 송환 추진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"‘횡령 혐의’ 금영엔터 회장, 두바이서 불법체류 적발…경찰 송환 추진","link":"https://n.news.naver.com/mnews/article/366/0001206792","naverLink":"https://n.news.naver.com/mnews/article/366/0001206792","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"일러스트=손민균 경찰이 회삿돈을 빼돌린 혐의로 수사를 받던 중 출국한 금영엔터테인먼트 김모 회장의 국내 송환을 추진하고 있다.. 최근 아랍에미리트(UAE) 두바이 출입국 당국이 그의 신병을 확보했기 때문이다. 23일 경찰청에 따르면 김 회장은 두바이에서 불법체류 사실이 확인돼 현지 출입국 당국 시설에 수용됐다. 경찰은 이르면 다음 달 국내 송환을 목표로 법무부를 통해 UAE 측과 협의 중이다. 김 회장은 자신과 가족 등에게 회사 자금을 빼돌린 혐의를 받고 있다. 전·현직 직원들이 설립한 외부 업체에 기술사용료 명목으로 회삿돈을 지급한 뒤 이 돈을 자신의 계좌나 자신이 대표로 있는 다른 회사로 옮긴 것으로 알려졌다. 김 회장이 수사를 받던 중인 2021년 말 출국하자 경찰은 이듬해 초 체포영장을 발부받고 여권 무효화와 인터폴 적색수배를 요청했다.","category":"사건 사고"},{"title":"“아침 거르고 점심 먹는 게 일상인데”…첫 끼 늦게 먹을수록 사망 위험 높았다 [헬시타임]","link":"https://n.news.naver.com/mnews/article/011/0004685327","naverLink":"https://n.news.naver.com/mnews/article/011/0004685327","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"“아침 거르고 점심 먹는 게 일상인데”…첫 끼 늦게 먹을수록 사망 위험 높았다 [헬시타임]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"“수능날 스마트기기 적발된 4건 수사 중”","link":"https://n.news.naver.com/mnews/article/032/0003484555","naverLink":"https://n.news.naver.com/mnews/article/032/0003484555","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"국수본 ‘리트 만점자’ 강제수사 가능성…AI 부정행위 33건 수사 경찰이 2027학년도 대학수학능력시험에서 스마트기기를 이용해 부정행위를 하다 적발된 사건 4건을 수사 중이다. 법학적성시험(LEET·리트) 만점자 이진우씨의 부정행위 의혹에 대해서는 그의 사망과 별개로 강제수사 가능성을 열어두고 있다. 홍석기 경찰청 국가수사본부장(사진)은 23일 서울 서대문구 경찰청에서 연 정례 기자간담회에서 올해 수능 부정행위 사건 4건을 수사 중이라고 밝혔다. 유형별로는 AI안경 사용 1건(충남), 카메라·이어폰 사용 1건(경기 남부), 휴대전화 촬영·검색 2건(서울) 등이다. 홍 본부장은 4건 모두 112신고에 따라 수사에 착수했다며 “관련 증거와 진술을 확보, 임의동행해 2명을 조사했고 나머지 2명은 추후 조사할 예정”이라고 말했다. 홍 본부장은 부정행위 의혹이 불거진 후 사망한 이씨에 대해서는 “굉장히 안타깝게 생각한다”면서도 “기기 사용 여부와 공모 정황 등을 확인해야 해서 공소권 없음과 별개로 필요하면 강제수사를 할 수도 있다”고 밝혔다. 추가 부정행위 의혹이 불거진 이씨의 2024학년도 수능에 관해서도 “수사 필요성이 있다고 판단되면 제한을 두지 않고 다 수사할 예정”이라고 했다. 이씨의 2026학년도 수능 시험지에 대해서는 자료 보전을 요청했으며 이를 확보하면 분석할 계획이라고 홍 본부장은 밝혔다. 인공지능(AI)을 활용한 시험 부정행위에 대응하기 위해 구성된 경찰청 태스크포스(TF)는 총 33건을 들여다보고 있다. 이들 중 15건은 수사 중이고 18건은 입건 전 조사(내사) 중이다. AI안경이나 이어폰 등 장비와 관련된 사건은 5건이다. TF는 온라인 게시글 가운데 부정행위 자백 12건, 예고 3건, 장비 판매 4건 등에 대해서도 작성자와 작성 경위 등 사실관계를 확인 중이라고 홍 본부장은 전했다. 교육부는 ‘수능 부정행위 신고센터’를 통해 추가 부정행위 의심 사례를 계속 제보받기로 했다. 제보 기한은 따로 정하지 않고 제보 대상도 과거 수능까지 포함된다. 다만 과거 부정행위 조사에 필요한 시험지를 확보하는 데는 어려움이 예상된다. 신진용 교육부 대입정책과장은 “신고 내용을 유형별로 정리하고 필요한 경우 사실관계 확인도 진행할 것”이라고 말했다.","category":"사건 사고"},{"title":"동료 떼죽음 본 원숭이들, ‘결벽증’ 생겼다?…어떻게 병 옮는지 몰라도 더러운 건 피해 [후암동 논문 연구소]","link":"https://n.news.naver.com/mnews/article/016/0002727321","naverLink":"https://n.news.naver.com/mnews/article/016/0002727321","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"텍사스 보호구역 일본원숭이 55마리 관찰 전염병 겪은 무리, 더러운 포도 절반 넘게 남겨 ‘피하기’를 배운 게 아니라 조심성 자체가 커져 첫 번째 실험 장면. 연구자가 울타리 밖에서 미닫이 실험대를 밀어 넣자 원숭이가 다가와 먹이를 고르고 있다. [로열 소사이어티 오픈 사이언스] [헤럴드경제=장윤우 기자] 코로나19가 한창이던 때를 떠올려 보면 현관 앞에 놓인 택배 상자를 소독제로 닦고, 엘리베이터 버튼은 손가락 대신 팔꿈치로 누르는 등 평소에 하지 않던 행동을 해왔다. 바이러스가 주로 공기를 통해 옮는다는 걸 알면서도 손에 닿는 거의 모든 것이 찜찜했다. 이런 반응은 사람에게서 여러 차례 확인된 바 있다. 감염병이 돌면 사람들은 그 병이 옮는 경로와 상관없는 것까지 더 꺼리게 된다는 연구들이다. 행동으로 병을 피하는 이른바 ‘행동 면역’이 위험한 시기에 한층 예민해진다는 것이다. 원숭이도 그럴까. 원숭이들이 오염돼 보이는 먹이를 피한다는 관찰은 이전에도 있었다. 다만 그 조심성이 겪은 일에 따라 달라지는지는 확인된 적이 없었다. 최근 국제학술지 ‘로열 소사이어티 오픈 사이언스’에 미국 UC샌디에이고 슈테판 카우프홀트·페데리코 로사노 연구팀은 치명적인 바이러스 유행을 겪은 원숭이 무리가 오염돼 보이는 먹이를 훨씬 더 많이 거부했다는 결과를 발표했다. [게티이미지뱅크]","category":"사건 사고"}],"사회":[{"title":"공무원 노조 교육부 지부, 최교진 전 장관에 감사패 전달 계획","link":"https://n.news.naver.com/mnews/article/025/0003567337","naverLink":"https://n.news.naver.com/mnews/article/025/0003567337","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"지난 16일 당시 최교진 교육부 장관이 서울 여의도 국회에서 열린 교육위원회 전체회의에서 인공지능(AI)을 활용한 부정행위에 대한 의원 질의를 듣고 있다. 뉴스1 전국공무원노동조합 교육부지부가 최교진 전 교육부 장관에게 감사패를 전달할 예정이다. 노조는 23일 입장문을 내고 “조합원과 교육부 전 직원의 감사한 마음을 담은 감사패를 최 전 장관에게 전달할 계획”이라고 밝혔다. 퇴임 장관에게 감사패를 전달하는 것이 관례는 아니다. 노조 관계자는 “반드시 하지는 않았다”며 “이번 장관은 저희와 소통도 자주 했고 교육계에서 공로도 커 의미 있게 준비하려 한다”고 말했다. 감사패 전달 적절성과 관련해서는 “이번 사태와 별개로 교육부 직원들이 그동안 장관의 노고에 감사한다는 뜻에서 드리는 것”이라고 밝혔다. 전달은 추후 공식적으로 크게 알리지 않고 진행될 예정이다. 노조는 최 전 장관의 사퇴에 대해 “수능 관리에 대한 도의적·정무적 책임을 지고 물러났다”며 “실무 직원들에게 비난의 화살이 돌아가지 않도록 본인의 거취로써 마지막 방패가 돼준 장관의 책임감에 고마움을 느낀다”고 밝혔다. 노조는 “향후 교육부의 신뢰 회복에도 힘쓰겠다”고 했다. 다만 대학수학능력시험 인공지능(AI) 부정행위 대응 부실로 불명예 퇴진한 장관에게 감사패를 전달하는 일이 부적절하다는 비판이 나올 가능성이 있다. 정치권에는 AI 등 신기술 발전에 맞춘 법·제도 정비를 촉구했다. 시험 감독관 보호 장치 강화도 요구했다. 노조는 “한 사람의 사퇴로 모든 문제를 덮고 지나간다면 이와 같은 비극은 반복될 수밖에 없다”고 밝혔다.","category":"사회"},{"title":"LG U+, 데이터독과 협력…익시오 서비스 장애 대응 시간 85% ↓","link":"https://n.news.naver.com/mnews/article/277/0005846908","naverLink":"https://n.news.naver.com/mnews/article/277/0005846908","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"데이터독 AI 익시오에 3개월간 적용 장애 대응·개선사항 반영 시간 80% 이상 줄어 LG유플러스는 글로벌 소프트웨어 기업 데이터독과 협력해 인공지능(AI) 통화 에이전트 서비스 '익시오(ixi-O)'의 서비스 안정성을 높이는 체계를 강화한다고 24일 밝혔다. 데이터독은 기업의 IT 시스템을 모니터링·분석하는 '옵저버빌리티'와 보안 플랫폼을 제공하는 기업이다.‌ 서비스 운영 과정에서 발생하는 각종 데이터를 AI로 분석해 이상 징후를 찾아내고 문제의 원인과 영향 범위를 파악할 수 있도록 돕는 솔루션인 '비츠 AI(Bits AI)'를 제공한다. LG유플러스 구성원이 익시오(ixi-O) 서비스를 점검하는 모습. LG유플러스 LG유플러스는 지난 8월부터 약 3개월간 비츠 AI를 실제 익시오 개발·운영 환경에 적용했다. 고객 불편이 접수된 사례에서는 익시오 고객의 서비스 이용 기록과 시스템 데이터를 AI로 분석해 문제 원인을 찾았다. 이 과정에서 원인 파악부터 개선 사항 반영까지 걸리는 시간을 기존 대비 약 86% 줄였다. 장애 대응에서도 효과를 확인했다. AI가 장애와 관련된 여러 데이터를 함께 분석해 문제의 원인과 서비스에 미치는 영향을 함께 파악했고, 장애 대응에 걸리는 시간을 기존 대비 85% 단축했다. 서비스에서 장애로 이어질 수 있는 이상 신호를 찾아 원인을 분석하는 데 걸리는 시간도 절반으로 줄였다. LG유플러스는 앞으로 데이터독과 협력해 익시오 운영 과정에서 AI 활용을 확대할 계획이다. 이번 검증에서 효과를 확인한 고객 불편 분석과 장애 대응뿐 아니라 익시오를 개발하고 운영하는 다양한 업무에 AI를 적용해 나갈 방침이다. 신정호 LG유플러스 ixi Agent개발Lab장(상무)은 \"AI는 단순 업무 효율화를 넘어 고객이 체감하는 서비스 품질을 높이는 핵심 수단이 되고 있다\"면서 \"앞으로도 AI 기술을 적극 활용해 보다 안정적이고 편리한 서비스를 제공하겠다\"고 말했다. 얀빙 리 데이터독 최고제품책임자(CPO)는 \"LG유플러스는 데이터독의 AI 기능을 실제 운영 환경에 적용해 운영 과정에서 얻은 인사이트를 보다 빠른 서비스 개선으로 연결했다\"며 \"이는 AI 기술이 서비스 품질과 운영 효율 향상은 물론 고객 신뢰 제고에도 기여할 수 있음을 보여주는 사례\"라고 말했다.","category":"사회"},{"title":"뉴로핏, 美 의료영상 AI 기업과 공급 계약…알츠하이머 시장 공략","link":"https://n.news.naver.com/mnews/article/015/0005357873","naverLink":"https://n.news.naver.com/mnews/article/015/0005357873","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"병원 넘어 美 외래 전문 영상검사센터 공략 레켐비·키순라 처방 의료기관 공급 확대 추진 뉴로핏이 미국 의료영상 인공지능(AI) 기업과 손잡고 뇌 영상분석 소프트웨어의 현지 공급 확대에 나선다. 기존 알츠하이머병 진단·치료 병원 중심의 영업망을 외래 전문 영상검사센터까지 넓힌다는 전략이다. 뉴로핏은 미국 서틀메디컬(Subtle Medical)과 자사 제품의 플랫폼 연동 및 상용화를 위한 공급 계약을 체결했다고 25일 밝혔다. 양사는 양전자방출단층촬영(PET) 영상 정량 분석 소프트웨어인 ‘뉴로핏 스케일 펫(Neurophet SCALE PET)’을 시작으로 주요 제품의 플랫폼 연동을 단계적으로 추진할 계획이다. 미국은 국내와 달리 병원 외부의 독립적인 외래 전문 영상검사센터(Outpatient Imaging Center)를 통한 의료영상 검사 서비스가 활성화돼 있다. 장비 가동률과 촬영 회전율이 수익성과 직결되는 만큼 영상 품질을 유지하면서 검사 시간을 단축하는 AI 소프트웨어의 수요가 높다. 뉴로핏은 이들 영상검사센터를 주요 고객으로 확보한 서틀메디컬의 영업망을 활용해 미국 내 제품 공급처를 다변화할 방침이다. 미국 캘리포니아주에 본사를 둔 서틀메디컬은 스탠퍼드대 연구진이 설립한 의료영상 AI 전문기업이다. 자기공명영상(MRI)과 PET 등 의료영상의 품질을 개선하고 촬영 효율을 높이는 소프트웨어를 개발하고 있다. 현재 세계 1500대 이상의 MRI·PET·컴퓨터단층촬영(CT) 장비에 솔루션을 공급하고 있다. 서틀메디컬은 자체 통합 플랫폼인 ‘AI 이미징 허브(AI Imaging Hub)’를 통해 의료기관의 영상 장비와 의료영상저장전송시스템(PACS), 외부 기업의 소프트웨어를 연동하고 있다. 독자 알고리즘을 적용한 ‘서틀HD 펫(SubtleHD PET)’은 PET 영상의 품질을 높이는 동시에 촬영 속도를 최대 75% 높일 수 있다는 게 회사 측 설명이다. 이번 계약을 통해 해당 플랫폼에 연동되는 뉴로핏 스케일 펫은 다양한 방사성 추적자가 뇌 영역별로 얼마나 축적됐는지를 정량화하는 소프트웨어다. 특히 알츠하이머병 항아밀로이드 항체 치료제의 처방과 치료 효과 판단에 중요한 뇌 속 아밀로이드 축적 정도를 국제 표준화 척도인 센틸로이드 스케일(Centiloid Scale)로 제공한다. 뉴로핏은 플랫폼 연동을 마친 뒤 알츠하이머병 치료제 레켐비와 키순라를 처방하는 북미 주요 의료기관을 중심으로 제품 공급을 확대할 계획이","category":"사회"},{"title":"한교총, \"평등법, 종교 자유 위협\"…박주민 \"함께 지키자\" 대화 제안","link":"https://n.news.naver.com/mnews/article/079/0004212998","naverLink":"https://n.news.naver.com/mnews/article/079/0004212998","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"\"교회 자율성 위축 우려\"…철회 촉구 박주민 의원 \"예배·설교·교리 등 대상 아냐\" \"보복 행위 징역형, 과태료로 변경\" [앵커] 더불어민주당 박주민 의원이 지난 11일 대표발의한 '평등에 관한 법률안', 이른바 평등법을 두고 한국교회총연합이 철회를 요구하고 나섰습니다. 종교의 자유를 위협할 수 있다며 직접 행동에 나서겠다고 예고했는데요. 박 의원은 법안의 제재 절차와 적용 범위에 대한 우려를 해명하며 교계에 직접 대화를 제안했습니다. 장세인 기자가 보도합니다. [기자] 한국교회총연합이 평등법 철회를 촉구하고 나섰습니다. 한교총은 \"2026년 한 해 동안 포괄적 차별금지법과 정교유착 방지법안, 사학법 개정안과 상속세 및 증여세법 시행령 개정에 대해 지속적으로 문제를 제기하며 정부와 국회에 시정을 촉구해 왔다\"며 \"그럼에도 종교의 자유와 교회의 자율성을 위축시킬 우려가 있는 입법 시도가 멈추지 않고 있다\"고 밝혔습니다. 한교총은 \"이러한 상황에서 박주민 의원이 지난 11일 평등에 관한 법률안을 발의했다\"며 \"이번 법안은 형사처벌과 징벌적 손해배상을 삭제했지만 국가인권위원회의 시정명령과 이행강제금, 민사상 손해배상 등 제재 수단을 포함하고 있다\"고 우려했습니다. 그러면서 \"형사처벌 조항보다 이행강제금 조항이 더 강력한 제재이므로 처벌 조항을 삭제했다고 종교와 양심, 표현의 자유에 대한 우려가 사라지는 것은 아니\"라고 강조했습니다. 박주민 의원이 발의한 평등법은 성별과 장애, 병력, 나이, 출신 국가, 혼인 여부, 종교, 성별 정체성 등을 이유로 한 합리적이지 않은 차별을 금지하는 법안입니다. 차별금지법안은 지난 21대 국회와 그 이전에도 여러 차례 발의됐지만 매번 국회를 통과하지 못했습니다. 박주민 의원은 교계의 우려를 알고 있다며 적극 해명에 나섰습니다. 박 의원은 이행강제금은 차별이 있었다는 이유만으로 곧바로 부과되는 것이 아니라고 설명했습니다. 인권위가 양측에 사실관계를 조사하고 차별을 바로잡아 달라는 권고와 시정명령, 여기에 이의신청과 소송 등 불복 절차를 모두 거친 뒤에도 명령을 이행하지 않을 때 부과되는 행정 수단이라는 겁니다. 또 이 법의 적용 영역은 고용과 재화·용역의 공급과 이용, 교육·직업훈련, 법령과 정책의 집행 등 네 가지라며 예배와 설교, 교리와 신앙고백은 대상이 아니라고 밝혔습니다. 피해자에게 불이익을 주는 보복 행위에 대한 징역형 조항 때문에 평등법이 처벌법이라는 오해가 이어져 이 역시","category":"사회"},{"title":"GS파워, 의왕시민과 탄소중립 실천 위한 ‘희망 한걸음’","link":"https://n.news.naver.com/mnews/article/092/0002446550","naverLink":"https://n.news.naver.com/mnews/article/092/0002446550","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"21일 부곡체육공원서 ‘두발로 Day’개최...시민 800여명 참여 GS파워(사장 유재영)는 21일 의왕시 부곡체육공원에서 열린 ‘탄소중립 생활 실천을 위한 희망 한걸음, 두발로 Day’를 후원했다고 밝혔다. 의왕시체육회가 주최하고 GS파워가 후원한 이번 행사는 시민들이 함께 걸으며 건강을 챙기고 친환경 생활 실천에 대한 관심을 높이기 위한 행사로 마련됐다. 추운 날씨에도 김성제 의왕시장과 박효증 GS파워 지역난방부문장 등 내빈과 800여명의 의왕시민이 참여했다. 김성제 의왕시장이 인사말을 하고 있다. 이날 행사는 아라고고 장구팀의 공연과 개회식, 준비운동, 시민 걷기 순으로 진행됐다. 참가자들은 부곡체육공원을 출발해 산들길과 장안지구 일대를 거쳐 공원으로 돌아오는 약 4㎞ 구간을 걸으며 이웃과 소통하는 시간을 가졌다. GS파워는 이번 후원을 통해 가까운 거리는 걸어서 이동하는 등 생활 속 작은 실천이 탄소중립으로 이어질 수 있다는 취지를 시민들과 공유했다. 박효증 GS파워 지역난방부문장은 “시민들이 함께 걸으며 건강을 챙기고 환경의 소중함을 되새기는 시간이 됐기를 바란다”며 “지역사회와 함께하는 기업으로서 시민들의 생활 속 탄소중립 실천을 응원한다”고 말했다. 박효증 GS지역난방부문장이 인사말을 하고 있다.","category":"사회"},{"title":"[속보] 젠슨 황 복귀에 엔비디아 33% 폭등…나스닥도 7% 급등 출발","link":"https://n.news.naver.com/mnews/article/081/0003702349","naverLink":"https://n.news.naver.com/mnews/article/081/0003702349","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 전 엔비디아 최고경영자(CEO). 로이터 연합뉴스 미국 뉴욕증시가 23일(현지시간) 젠슨 황 엔비디아 최고경영자(CEO)의 전격 복귀 소식에 장 초반 급등세를 보였다. 기술주 중심의 나스닥 종합지수는 이날 전 거래일 대비 7.30% 오른 24,269.75에 거래를 시작했다. 엔비디아 주가도 전 거래일 종가 대비 약 33% 오른 167.08달러에 거래를 시작했다. 지난주 인공지능(AI) 관련주를 중심으로 급락했던 뉴욕증시는 황 CEO의 복귀 소식에 급반등했다. 이날 엔비디아는 공식 홈페이지를 통해 이사회가 젠슨 황의 CEO 및 이사직 복귀를 만장일치로 결정했다고 밝혔다. 이사회는 미국 정부 고위 관계자들의 의견을 수렴했다며 황 CEO 복귀가 국가 안보에 어떤 위협도 되지 않는다고 판단했다고 전했다.","category":"사회"},{"title":"전석훈 경기도의원, 기획 '잡아드림'…전국 채용정보 제공 확대·웹 통합도 추진","link":"https://n.news.naver.com/mnews/article/030/0003488799","naverLink":"https://n.news.naver.com/mnews/article/030/0003488799","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"10월 말 누적 다운로드는 15만4048건 기록 잡아바로 핵심 기능 통합·31개 시군 연계 추진 전석훈 경기도의회 미래과학협력위원회 부위원장. 경기도 일자리앱 '잡아드림'의 지도 기반 채용정보 서비스가 서울 등 지자체 7곳으로 확대됐다. 23일 전석훈 경기도의원(더불어민주당·성남3)이 경기도일자리재단에서 받은 '잡아드림 추진현황'에 따르면 해당 서비스는 서울시·강원도·전북특별자치도·영월군·이천시·용인시·하남시 등 지자체 7곳 홈페이지와 플랫폼에 연계·보급됐다. 잡아드림은 구직자가 현재 위치나 희망 근무지역 주변의 채용정보를 지도에서 확인할 수 있는 서비스다. 기존 경기도·수도권 중심이던 정보 제공 범위를 전국 공공·민간 일자리로 넓혀 다른 지역의 채용공고도 검색할 수 있도록 했다. 올해 10월 말 기준 누적 다운로드는 15만4048건이다. 재단이 보고한 올해 월간활성이용자(MAU)는 평균 7739명으로 전년보다 44% 늘었다. 월간활성이용자는 한 달에 한 번 이상 앱을 실제 이용한 사람을 중복 없이 집계한 수치다. 이용 방식과 기능도 확대했다. 지난 8월에는 앱을 설치하지 않고 인터넷으로 채용정보를 검색하는 '일자리맵' 웹서비스를 시작했다. 원하는 지역과 검색 반경을 설정하면 주변 공공·민간 채용공고를 지도에서 살펴보고 상세 모집정보까지 확인할 수 있다. 이달에는 기본소득 등 경기도 주요 정책사업을 신청·접수하는 기능도 구현했다. 일자리 정보를 찾는 데 더해 도 정책사업 신청을 지원하도록 서비스 범위를 넓힌 것이다. 재단은 앞으로 잡아드림의 핵심 기능을 경기도일자리포털 '잡아바'로 이관·통합할 계획이다. 스마트폰에서 별도 앱 설치 없이 접속할 수 있는 모바일 웹서비스로 단계적으로 전환하고, 도내 31개 시·군 일자리센터와 연계도 강화할 방침이다. 잡아드림은 전 의원이 기획 단계부터 참여하고 재단이 구축·운영한 서비스다. 지난해 행정안전부 주관 '정부혁신 왕중왕전' 민원서비스 혁신 부문에서 장관상인 동상을 받았다. 전석훈 의원은 “도민을 위해 기획한 잡아드림이 서울시와 강원, 전북 등 다른 지자체 7곳으로 퍼져 나간 것은 지도 기반 일자리 서비스의 경쟁력을 현장에서 인정받은 결과”라며 “채용정보도 전국 단위로 넓어진 만큼, 경기도를 넘어 국민 누구나 쓰는 일자리앱으로 키워 나가겠다”고 말했다.","category":"사회"},{"title":"'인터폴 적색수배' 금영엔터 김진갑 회장, 두바이서 붙잡혀…다음달 송환 추진","link":"https://n.news.naver.com/mnews/article/014/0005608589","naverLink":"https://n.news.naver.com/mnews/article/014/0005608589","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"회삿돈 30억~40억원 빼돌린 배임·횡령 혐의…2021년 말 해외 도피 후 불법체류 적발 경찰, 법무부 통해 UAE 측과 송환 협의…특경법상 사기 혐의도 별도 수사 중 KY금영그룹빌딩 /사진=연합뉴스 [파이낸셜뉴스] 회삿돈을 빼돌린 혐의로 경찰 수사를 받다 해외로 도피한 노래방 기기 업체 금영엔터테인먼트의 김진갑 회장이 아랍에미리트(UAE) 두바이에서 현지 당국에 붙잡혔다. 23일 경찰청에 따르면 김 회장은 최근 두바이에서 불법체류 사실이 드러나 현지 출입국 당국 시설에 수용됐다. 경찰은 법무부를 통해 UAE 측과 협의하며 이르면 다음 달 중을 목표로 김 회장의 국내 송환을 추진하고 있다. 김 회장은 회사가 전·현직 직원들이 세운 외부 업체 3곳에 반주음악 재생기술 사용료 명목으로 약 30억~40억 원을 지급하게 한 뒤, 이를 자신과 가족 계좌 및 자신이 대표로 있는 다른 회사 등으로 빼돌린 혐의(배임·횡령 등)를 받고 있다. 앞서 경찰은 2021년 10월 부산에 있는 금영엔터테인먼트 사무실과 공장 등을 압수수색하며 본격적인 수사에 착수했다. 그러나 김 회장은 같은 해 11월 첫 소환 조사를 받은 뒤 추가 출석 요구에 응하지 않다가 그해 말 해외로 출국했다. 이에 경찰은 2022년 초 김 회장에 대한 체포영장을 발부받고 여권 무효화 조치와 함께 인터폴에 적색수배를 요청했다. 한편 김 회장은 배임·횡령 혐의와 별개로 특정경제범죄가중처벌법상 사기 혐의로도 수사를 받고 있다. 서울 수서경찰서는 올해 김 회장에 대한 사기 혐의 고소장을 접수해 수사를 진행 중이다.","category":"사회"},{"title":"'수십억 횡령' 금영엔터 회장 두바이서 붙잡혀…내달 송환 목표","link":"https://n.news.naver.com/mnews/article/469/0000967308","naverLink":"https://n.news.naver.com/mnews/article/469/0000967308","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"불법체류 적발돼 현지 출입국 시설에 수용 경찰, 법무부 통해 UAE와 국내 송환 협의 게티이미지뱅크 회삿돈 수십억 원을 빼돌린 혐의로 경찰 수사를 받다가 해외로 달아난 노래방 기기 업체 금영엔터테인먼트 김진갑 회장이 아랍에미리트(UAE) 두바이에서 붙잡혔다. 23일 경찰에 따르면, 김 회장은 최근 두바이에서 불법체류 사실이 드러나 현지 출입국 당국 시설에 수용됐다. 경찰은 법무부를 거쳐 UAE 당국과 협의하며 김 회장의 국내 송환을 추진하고 있다. 김 회장은 전·현직 직원들이 차린 외부 업체 3곳에 회사가 반주음악 재생기술 사용료 명목으로 30억~40억 원가량을 지급하도록 한 혐의를 받는다. 이 돈은 김 회장 본인과 가족 명의의 계좌, 김 회장이 대표를 맡고 있는 다른 회사 등으로 흘러간 것으로 전해졌다. 경찰은 2021년 10월 부산의 금영엔터테인먼트 사무실과 공장 등을 압수수색하며 본격적으로 수사에 나섰다. 하지만 김 회장은 같은 해 11월 첫 소환 뒤 조사에 응하지 않았고, 그해 말 해외로 출국했다. 경찰은 2022년 초 김 회장에 대한 체포영장을 발부받았고, 여권을 무효화하는 한편 인터폴(국제형사경찰기구)에 적색수배를 요청했다. 김 회장은 이와 별도로 특정경제범죄가중처벌법(특경법)상 사기 혐의로도 수사를 받고 있다. 서울 수서경찰서가 올해 관련 고소장을 접수해 수사 중이다.","category":"사회"},{"title":"현직 30대 해경 간부, 음주운전 적발 ‘면허 정지’ 수준…직위 해제","link":"https://n.news.naver.com/mnews/article/016/0002727367","naverLink":"https://n.news.naver.com/mnews/article/016/0002727367","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"사진은 기사와 무관. [게티이미지뱅크] [헤럴드경제=최원혁 기자] 현직 해양경찰 간부가 음주 운전으로 경찰에 적발돼 직위 해제됐다. 23일 연합뉴스에 따르면 인천 남동경찰서는 도로교통법상 음주운전 혐의로 서해5도 특별경비단 소속 30대 A경위를 입건해 조사 중이다. A경위는 지난 20일 오전 5시20분께 인천시 제물포구에서 남동구 구월동까지 술에 취한 상태에서 자신의 차량을 운전한 혐의를 받는다. 경찰은 ‘음주운전이 의심된다’는 신고를 받고 출동해 A경위를 붙잡았다. 적발 당시 측정된 A경위의 혈중알코올농도는 0.03% 이상 0.08% 미만의 면허 정지 수준이었던 것으로 전해졌다. A경위는 지인들과 술을 마신 뒤 귀가하면서 음주운전을 한 것으로 파악됐다. 해경은 A경위를 직위 해제했으며 향후 수사 결과에 따라 징계 여부를 결정할 방침이라고 했다.","category":"사회"}],"생활·문화":[{"title":"춘천 상권 살리고, 청도 돌봄 지키고…KT, 지역 문제 해결에 AI 투입","link":"https://n.news.naver.com/mnews/article/009/0005767940","naverLink":"https://n.news.naver.com/mnews/article/009/0005767940","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"윤호중 행정안전부 장관(왼쪽)과 박윤영 KT 대표이사가 ‘사회연대경제 인공지능전환(AX) 활성화 지원을 위한 업무협약’ 체결 후 기념 촬영을 하고 있다. [KT] KT가 인공지능전환(AX)의 무대를 확장한다. 행정안전부와 손잡고 인공지능(AI) 기술과 인프라를 지역사회에 제공해 주민들이 스스로 지역 문제를 해결할 수 있도록 자생적 생태계를 구축하겠다는 구상이다. 23일 통신업계에 따르면 이날 KT와 행안부는 서울 종로구 정부서울청사에서 ‘사회연대경제 AX 활성화 지원을 위한 업무협약’을 체결했다. 이번 협약은 지난 9월 사회연대경제기본법 제정을 계기로 민간기업의 기술력과 전문성을 연결해 지역 문제 해결력을 끌어올리고자 추진됐다. 구체적으로 KT와 행안부는 ▲AX 기반 지역사회 문제 해결 ▲지역 AI 인재 양성 및 디지털 격차 해소 ▲지역 민관협력 거버넌스 AX 지원 등 핵심 분야에서 협력을 이어간다는 방침이다. 우선 주민들과 사회연대경제조직이 직접 발굴한 현안에 KT의 AI 기술과 전문 인력을 투입해 맞춤형 해결 모델을 구축한다. KT는 과제 발굴 프로그램인 ‘소셜 AX 챌린지’를 운영하고 지역 소상공인과 청년 창업가를 위한 솔루션 지원 방안도 모색할 예정이다. 도출된 모델은 현장 실증을 거쳐 전국으로 확산한다. 미래 인재 육성과 어르신 디지털 포용에도 팔을 걷어붙인다. 교육청 및 대학교와 연계해 청년들을 지역 문제 해결형 AI 인재로 길러내고, AI 활용능력 자격시험(AICE) 취득을 지원한다. 아울러 KT를 대표하는 사회공헌 프로그램인 ‘정보기술(IT) 서포터즈’와 이동식 체험교육 ‘AI 스테이션’을 활용해 세대 불문 AI 교육 기회를 제공한다. 지방정부와 지역조직의 일하는 방식도 혁신한다. 조직별 업무 체계를 진단한 뒤 KT의 AX 컨설팅과 솔루션을 접목해 행정 효율을 높인다는 계획이다. 강원 춘천시와 경북 청도군이 시범사업 대상지로 낙점됐다. 춘천에서는 상인과 청년이 AI를 활용해 점포 운영과 마케팅 활동을 강화하는 ‘원도심 상권 활성화 모델’, 청도에서는 흩어진 돌봄 데이터를 모으고 방문 기록을 AI로 자동화하는 ‘통합 돌봄 모델’ 구축에 주력한다. 박윤영 KT 대표이사는 “KT는 대한민국을 대표하는 AX 플랫폼 기업으로서 ‘모두를 위한 AI’를 실현하기 위해 노력하고 있다”라며 “이번 협약을 계기로 지역사회가 필요로 하는 AI 교육과 디지털 포용, 공공 AX 혁신을 지원하고 지역과 함께 성장하는 지속","category":"생활·문화"},{"title":"서울 지하철 3년만 총파업?…내일 막판교섭, 임금인상 쟁점","link":"https://n.news.naver.com/mnews/article/437/0000522106","naverLink":"https://n.news.naver.com/mnews/article/437/0000522106","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"〈사진출처=연합뉴스〉 서울 지하철 1~8호선 운행사인 서울교통공사 노조가 총파업을 하루 앞두고 막판 교섭에 나섰습니다. 서울교통공사 노사는 24일 오전 10시부터 3개 노동조합과 차례로 임금·단체협약 본교섭을 진행합니다. 오전 10시 교통노조(제1노조)를 시작으로 오전 11시 올바른노조(제2노조), 오후 1시 30분 통합노조(제3노조)와 각각 교섭합니다. 지난 9월 29일 3차 본교섭이 결렬된 지 56일 만인데, 핵심 쟁점은 인력 충원과 임금 인상입니다. 노조는 2023년 마련된 2212명 규모의 인력 감축 계획을 철회할 것과 정년퇴직·육아휴직 등에 따른 결원 1313명 충원을 요구 중입니다. 사측도 인력 충원의 필요성은 일부 공감하고 있지만 채용 시기와 규모에는 이견을 보이고 있습니다. 노조는 합의 직후 채용을 요구하는 반면 사측은 내년 초 조직진단을 거쳐 규모를 결정하겠다는 입장입니다. 임금 인상을 두고도 사측은 정부 지침에 따른 3.5% 인상 요구를 수용하겠다는 입장입니다. 그러나 노조는 약 150억 원의 재원 마련 방안이 없어 실질적인 수용으로 보기 어렵다고 맞서고 있습니다. 서울교통공사는 지난해에도 노사가 총파업 직전 밤샘 협상 끝에 극적으로 합의했습니다. 이번에도 교섭이 늦은 밤까지 이어질 가능성은 있습니다. 만일 이번 교섭이 결렬되면 3개 노조는 25일부터 무기한 총파업에 돌입한다는 방침인데 3년만의 총파업입니다. 파업 시 필수유지인원을 중심으로 열차가 운행돼 운행률은 낮아질 것으로 예상합니다. 2022년 총파업 당시 코레일 운영 구간을 포함한 전체 지하철의 낮 시간 운행률은 약 82%에 그쳤습니다. 이번에도 파업이 현실화하면 시민 불편이 불가피할 전망입니다. 노조는 이미 20일부터는 안전운행 투쟁에도 돌입한 상태입니다. 공사는 파업에 대비해 비상대책본부를 가동하고 관제센터를 중심으로 열차 정시 운행을 독려하고 운행 간격을 실시간으로 조정할 계획입니다.","category":"생활·문화"},{"title":"테마파크·야영장까지 공제 확대…관광공제회, 여행자 공제 도입도 검토","link":"https://n.news.naver.com/mnews/article/277/0005846675","naverLink":"https://n.news.naver.com/mnews/article/277/0005846675","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"관광공제회, 중장기 사업 확대 방향 논의 2027년 사업계획·예산안 등 원안 의결 공제사업 성장동력 확보·위험관리 강화 한국관광협회중앙회 관광공제회가 테마파크와 야영장 등으로 공제 대상 업종을 확대하고, 여행자를 위한 공제상품을 도입하는 방안을 검토한다. 공제사업의 성장동력을 확보하고 관광산업의 위험관리 기능을 강화하기 위해서다. 한국관광협회중앙회 관광공제회가 지난 19일 한국관광협회중앙회 대회의실에서 제7차 운영위원회를 열고 2027년도 사업계획과 공제규정 개정안 등을 심의하고 있다. 한국관광협회중앙회 한국관광협회중앙회 관광공제회는 지난 19일 중앙회 4층 대회의실에서 제7차 운영위원회를 열고 이 같은 중장기 사업 방향을 논의했다고 23일 밝혔다. 이날 회의에서는 2027년도 사업계획 및 예산안, 이행보증 사고보상 결정안, 공제규정 개정안 등이 상정돼 원안대로 의결됐다. 이와 함께 공제사업의 성장동력 확보와 위험관리 강화를 위한 중장기 사업 방향도 공유됐다. 공제 대상 업종을 테마파크업과 야영장업 등으로 확대하고, 여행자를 대상으로 하는 공제상품을 새롭게 도입하는 방안이 포함됐다. 관광공제회는 공제사업 운영 과정에서 관광업계의 의견을 폭넓게 수렴하기 위해 간담회와 워크숍도 확대하기로 했다. 이경수 한국관광협회중앙회 회장은 \"관광사업 현장의 목소리를 바탕으로 공제상품과 제도를 내실화해 공제회가 관광사업자들에게 실질적인 버팀목이 될 수 있도록 노력하겠다\"고 말했다.","category":"생활·문화"},{"title":"“무대서 히잡 벗었다가”…이란 女가수에 태형 74대, 예술 활동 2년 금지","link":"https://n.news.naver.com/mnews/article/666/0000133652","naverLink":"https://n.news.naver.com/mnews/article/666/0000133652","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"인권단체 “히잡 착용 의무 어긴 공연 이유로 처벌”…해외여행도 2년 금지 국제앰네스티, 태형을 잔혹하고 비인도적인 형벌로 규정 이란의 여성 가수 파라스투 아마디가 공연하고 있다. 유튜브 파라스투 아마디 갈무리 히잡을 착용하지 않은 채 공연한 이란의 여성 가수에게 태형 74대가 집행됐다. 미국 CNN 방송은 23일(현지시간) 노르웨이 기반 인권단체 이란인권(IHRNGO)을 인용해 가수 파라스투 아마디가 히잡 착용 의무를 위반했다는 이유로 태형을 받았다고 보도했다. 아마디는 2024년 12월 이슬람 시아파 성지인 카라반세라이에서 히잡을 쓰지 않고 공연했다. 당시 촬영된 영상이 최근 온라인에 공개되면서 그는 법정에 서게 됐다. 공개된 영상에는 아마디가 머리를 가리지 않은 채 검은 민소매 드레스를 입고 남성 연주자들과 함께 노래하는 모습이 담겼다. 이란 법원은 아마디와 공연에 참여한 팀원 4명이 ‘저속하고 부도덕한 온라인 콘텐츠를 제작·유포해 공공질서를 해쳤다’고 판단해 유죄를 선고했다. 이들은 각각 태형 74대를 집행당했으며, 2년간 예술·음악 활동과 해외여행도 금지됐다. 이란에서는 여성이 공공장소에서 히잡을 착용해야 하며, 여성의 공개적인 단독 노래 공연도 제한된다. 아마디는 2022년 촉발된 히잡 반대 시위를 지지하며 히잡을 쓰지 않고 노래하는 영상을 공개해 주목받았다. 국제앰네스티는 태형을 잔혹하고 비인도적이며 굴욕적인 형벌로 규정하고 있다. 이란 당국이 히잡 착용 의무에 저항하는 가수와 언론인, 여성 인권 운동가 등을 상대로 자의적인 구금과 기소, 태형을 확대하고 있다는 게 이 단체의 지적이다. 이란에서는 여성 가수의 공연을 둘러싼 처벌이 이어지고 있다. 앞서 이란 법원은 지난해 2월 테헤란에서 전통 음악을 공연한 여성 가수 히바 세이피자데에게 징역 4년을 선고했다. 당시 법원은 세이피자데가 공연을 통해 ‘부패와 매춘을 조장했다’고 판단했다. 이에 세이피자데는 13세기 이란의 고전 시구 몇 구절을 노래했을 뿐이라며 항소 의사를 밝힌 바 있다.","category":"생활·문화"},{"title":"“한번 망가지면 회복 어려워”… 신장 튼튼하게 지키는 음식 5가지","link":"https://n.news.naver.com/mnews/article/296/0000107715","naverLink":"https://n.news.naver.com/mnews/article/296/0000107715","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"만성콩팥병 위험 낮추는 음식 콜리플라워. 사진=클립아트코리아 콩팥(신장)은 한번 손상되면 기능을 완전히 회복하기 어려운 장기다. 문제는 콩팥 기능이 심하게 떨어지면 체내 노폐물과 수분을 제대로 배출하지 못해 투석이나 신장이식이 필요할 수도 있다는 점이다. 콩팥 건강을 지키려면 평소 식습관을 관리하는 것이 중요하다. 신장 건강에 도움이 되는 식단에 활용하기 좋은 음식 다섯 가지를 살펴본다. 항산화 성분 많은 ' 블루베리 ' 블루베리는 안토시아닌과 폴리페놀과 같은 항산화 성분이 풍부한 과일이다. 안토시아닌은 블루베리 특유의 짙은 보라색을 만드는 색소 성분으로, 산화 스트레스와 염증 반응을 줄이는 데 도움이 된다. 산화 스트레스와 만성 염증은 콩팥의 미세혈관과 조직 손상에 관련된 요인으로 알려져 있다. 블루베리는 칼륨 함량이 상대적으로 낮은 편이어서 일부 만성콩팥병 환자의 식단에도 활용할 수 있다. 밥에 섞어 먹어도 좋은 ' 콜리플라워 ' 콜리플라워는 식이섬유와 비타민C가 들어 있는 채소다. 칼륨 함량이 상대적으로 낮아 일부 신장질환 환자의 식단에 활용하기 좋은 식재료로 꼽힌다. 짠 반찬이나 가공식품 대신 콜리플라워를 곁들이면 나트륨 섭취를 줄이는 데 도움이 될 수 있다. 콜리플라워는 찌거나 데쳐 먹을 수 있고, 잘게 다져 밥에 섞어 먹는 방법도 있다. 장 건강에도 좋은 ' 사과 ' 사과는 식이섬유와 폴리페놀을 함유하고 있어 건강한 과일로 손꼽힌다. 특히 사과에 들어 있는 수용성 식이섬유인 펙틴은 장내 미생물의 먹이가 되며 장 건강에 도움을 줄 수 있다. 식물성 식품 중심의 식습관이 만성콩팥병 위험을 낮출 수 있다는 연구 결과도 있다. 2025년 국제학술지 ≪신장영양학저널(Journal of Renal Nutrition)≫에 발표된 메타분석에서 성인 12만1927명의 자료를 분석한 결과, 식물성 식단을 실천하는 집단은 비교 집단보다 만성콩팥병 발생이 약 25% 낮았다. 연어. 사진=클립아트코리아","category":"생활·문화"},{"title":"\"마운자로 평생 맞겠다\"…서울대 교수가 직접 써보니 [건강!톡]","link":"https://n.news.naver.com/mnews/article/015/0005357317","naverLink":"https://n.news.naver.com/mnews/article/015/0005357317","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"장형우 분당서울대병원 교수 직접 비만치료 경험 공개해 사진=유튜브 비만 수술을 받고도 4년 만에 체중이 10㎏ 넘게 다시 늘었던 대학병원 교수가 위고비와 마운자로를 직접 사용한 뒤 장기간 투약을 이어가겠다는 뜻을 밝혔다. 약을 끊으면 다시 살이 찌는 것은 예상할 수 있는 결과인 만큼 비만치료제를 단기간 처방으로 봐선 안 된다는 설명이다. 장형우 분당서울대학교병원 심장혈관흉부외과 교수는 지난 21일 유튜브 채널 ‘김재원TV’에서 자신의 비만 치료 과정을 공개했다. 위소매절제술 뒤 체중이 다시 증가한 장 교수는 위고비로 감량한 뒤 현재는 마운자로를 주 1회 투여하고 있다. 그는 “사람들에 따라 평생 맞겠다고 다짐하는 이들이 꽤 있는데 나 역시 그렇게 다짐한 사람 중 하나”라고 말했다. 약을 바꾼 이유는 부작용 차이였다. 장 교수는 “위고비는 오전 시간대에 구역질이 살짝 나서 가끔 헛구역질을 했다”며 “최대 용량인 2.4㎎을 맞아도 부작용이 전부 없어지지 않아 마운자로로 갈아탔다”고 밝혔다. 이어 “마운자로는 구역질이 거의 없지만 변비가 약간 있다. 다만 불편할 정도는 보통의 수준이다”라고 했다. 특히 중단 이후의 체중 증가 가능성을 강조했다. 장 교수는 “비만 치료제는 맞다가 끊으면 80~90% 이상 환자에서 요요 현상이 오게 된다”며 “약의 원리상 너무 당연하고 놀라운 일이 전혀 아니다. 끊는 것에 대해 쉽게 생각하지 말고 장기적으로 맞아야 한다고 생각해야 한다”고 말했다. 당뇨병 환자에게는 기존 치료약과 함께 사용할 경우 혈당이 지나치게 낮아질 수 있다며 “반드시 담당 의사와 상의해 약물 용량을 조절해야 한다”고 당부했다.","category":"생활·문화"},{"title":"[날씨] 화요일, 전국 대부분 영하권 추위에 ‘칼바람’…충남·전라·제주에 ‘비 또는 눈’","link":"https://n.news.naver.com/mnews/article/029/0003060735","naverLink":"https://n.news.naver.com/mnews/article/029/0003060735","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"내가 병원에 유독 자주 갔던 이유… 남들 안 먹는 ‘초가공식품’ 많이 먹어서","link":"https://n.news.naver.com/mnews/article/346/0000119331","naverLink":"https://n.news.naver.com/mnews/article/346/0000119331","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"초가공식품 많이 먹으면 진료·응급실 이용 증가 연구진 “섭취량 줄이기 위한 정책 필요” 사진 = 클립아트코리아 과자, 패스트푸드 등과 같은 초가공식품 섭취량이 많을수록 의료 서비스 이용률이 높아질 수 있다는 연구 결과가 나왔다. 일반 진료를 자주 받을 뿐 아니라, 응급실을 찾거나 하루에 3가지 이상 약을 복용할 가능성 또한 높은 것으로 나타났다. 스페인 바르셀로나대학교와 이탈리아 팔레르모대학교 등 공동 연구팀은 2008년부터 2010년까지 수집된 스페인 성인 1만1530명의 식습관과 의료서비스 이용 자료를 분석했다. 연구 대상자들은 평균 48세였으며, 초가공식품 섭취량(체중 1㎏당 하루 섭취량)을 기준으로 네 집단으로 분류됐다. 연구팀은 초가공식품 섭취량과 ▲진료 ▲입원 ▲응급실 방문 ▲다약제 복용 등의 연관성을 살펴봤다. 분석 결과, 초가공식품 섭취량 상위 25%에 해당하는 사람들은 하위 25%에 해당하는 사람들과 비교했을 때 월 1회 이상 의사 진료를 받거나 연 2회 이상 응급실을 방문할 가능성이 각각 1.53배, 1.59배씩 높은 것으로 나타났다. 하루에 3가지 이상 약을 복용할 가능성 또한 1.43배 높았다. 추가로 연구팀은 60세 이상 2006명을 평균 3.4년간 추적했다. 그 결과, 초가공식품을 가장 많이 먹는 집단은 가장 적게 먹는 집단보다 입원 가능성이 1.57배 높은 것으로 확인됐다. 연구팀은 초가공식품 섭취가 만성질환 발생이나 사망 위험에 그치지 않고, 의료서비스 수요 증가와도 연결될 가능성이 있다고 주장했다. 초가공식품 섭취량을 줄이기 위해 관련 공중보건 정책이 필요하다는 설명이다. 연구를 진행한 바르셀로나대학교 카롤리나 도나트바르가스 박사는 “신선하거나 최소한으로 가공한 식품을 더 쉽게 구입할 수 있도록 지원할 필요가 있다”고 말했다. 이번 연구 결과는 국제학술지 ‘BMC 퍼블릭헬스(BMC Public Health)’에 최근 게재됐다.","category":"생활·문화"},{"title":"포근한 겨울 온다지만…24일 비바람 추위[2026년 11월 24일 날씨]","link":"https://n.news.naver.com/mnews/article/032/0003484546","naverLink":"https://n.news.naver.com/mnews/article/032/0003484546","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"한울본부 '에너지 아뜰리에', 주민 참여 문화체험 성료","link":"https://n.news.naver.com/mnews/article/022/0004177531","naverLink":"https://n.news.naver.com/mnews/article/022/0004177531","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"울진주민 60명 대상 원데이 클래스 진행 원목 샌딩부터 부품 조립까지 직접 제작 별도 전원 없이 소리 증폭, 스마트폰 거치대로도 활용 한국수력원자력 한울원자력본부는 울진군 주민들을 대상으로 목재를 활용한 다양한 문화체험 프로그램을 진행했다. 한울원자력본부는 지난 18~19일 양일간 울진군 주민 60명을 대상으로 '우드 스피커 만들기' 원데이 클래스를 운영했다고 23일 밝혔다. 이번 프로그램은 한울본부의 문화체험 프로그램인 '에너지 아뜰리에'의 하나로 마련했다. 참가자들은 원목을 샌딩하고 부품을 조립하는 과정을 거쳐 우드 스피커를 직접 제작했다. 한울본부가 지역주민을 대상으로 원데이클래스 '에너지아뜰리에'를 운영하고 있다. 한울본부 제공","category":"생활·문화"}],"세계":[{"title":"미, 한국 외교안보라인 교체에 \"한미동맹 내 긴밀한 협력 중요\"","link":"https://n.news.naver.com/mnews/article/052/0002437610","naverLink":"https://n.news.naver.com/mnews/article/052/0002437610","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"이재명 대통령이 단행한 외교·안보 라인 교체에 대해 미국 트럼프 행정부는 '동맹의 긴밀한 협력'을 강조하는 원론적 입장을 보였습니다. 미 국무부 대변인은 이번 개각 발표와 관련해 \"미국은 한미동맹 내 긴밀한 협력의 중요성을 높이 평가한다\"고 답했습니다. 이어 \"우리는 동맹국인 한국과 함께 미국 및 양국의 이익을 지속적으로 증진하고 있다\"고 덧붙였습니다. 강금실 국가정보원장 후보자와 임웅순 외교부 장관 후보자, 홍익표 통일부 장관 후보자에 대해선 \"한국의 각료 인사 결정과 관련해선 한국 정부에 문의해달라\"고 언급을 자제했습니다. 이 대통령의 이번 개각은 국정원장과 외교·통일부 장관 등 외교·안보 라인 주요 인사를 교체한 것으로, 그동안 미 행정부와 정치권에서 제기돼 온 '한미동맹 이상기류' 논란을 고려한 조치라는 해석을 낳고 있습니다. 정동영 통일부 장관과 이종석 국정원장 등 '자주파'로 분류되던 인사들이 교체 대상에 올라 미국과의 관계 개선 의지를 담았다는 해석도 가능합니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"세계"},{"title":"티파니 영, 마른파이브 새 얼굴로 발탁···‘Plus Yourself’ 캠페인으로 긍정 에너지 전파!","link":"https://n.news.naver.com/mnews/article/144/0001151351","naverLink":"https://n.news.naver.com/mnews/article/144/0001151351","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"티파니 영, 마른파이브 새 얼굴로 발탁···‘Plus Yourself’ 캠페인으로 긍정 에너지 전파!. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"기후행동 ‘이행’은커녕 ‘약속’ 재확인도 실패…한계 드러난 ‘COP 체제’","link":"https://n.news.naver.com/mnews/article/032/0003484551","naverLink":"https://n.news.naver.com/mnews/article/032/0003484551","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"기후행동 ‘이행’은커녕 ‘약속’ 재확인도 실패…한계 드러난 ‘COP 체제’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"몽골 외교부 장관 손 잡은 한성숙 총리","link":"https://n.news.naver.com/mnews/article/421/0009305840","naverLink":"https://n.news.naver.com/mnews/article/421/0009305840","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"몽골 외교부 장관 손 잡은 한성숙 총리. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"한성숙 총리, 몽골 외교부 장관 접견","link":"https://n.news.naver.com/mnews/article/421/0009305839","naverLink":"https://n.news.naver.com/mnews/article/421/0009305839","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"한성숙 총리, 몽골 외교부 장관 접견. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"젠슨 황 돌아왔다\"…엔비디아 주가 장 초반 30% 폭등(상보)","link":"https://n.news.naver.com/mnews/article/421/0009305908","naverLink":"https://n.news.naver.com/mnews/article/421/0009305908","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"167달러에 거래 시작…주요 지수도 동반 급등 출발 엔비디아 로고. 2026.6.11 ⓒ 로이터=뉴스1 (서울=뉴스1) 윤다정 기자 = 엔비디아 주가가 젠슨 황 최고경영자(CEO) 복귀 소식에 장 초반 약 30% 급등했다. 23일(현지시간) 미 동부시간 오전 9시 45분 기준 엔비디아 주가는 전 거래일 종가(125.53달러)보다 36.78달러(29.30%) 오른 162.31달러에 거래됐다. 거래량은 약 5188만 주를 기록했다. 엔비디아는 이날 167.06달러에 거래를 시작해 개장 직후 167.21달러까지 올랐다. 개장 첫 1분 동안에만 약 2262만 주가 거래됐다. 이후 상승 폭을 일부 반납하며 158달러 선까지 밀렸다가 다시 162달러대로 올라서는 등 30% 안팎의 상승폭을 이어가고 있다. 앞서 개장 전 거래에서 엔비디아 주가는 오전 9시26분 기준 32.58% 오른 166.43달러를 기록했다. 개장 전 거래량은 약 8962만 주에 달했다. 개장 전 거래 초반 135달러 안팎에서 움직이던 주가는 오전 9시를 앞두고 가파르게 치솟았다. 로이터에 따르면 엔비디아의 젠슨 황 복귀 발표 직후 인공지능(AI) 관련주에 대한 투자심리가 되살아나면서 뉴욕 증시 주요 지수도 일제히 큰 폭으로 상승 출발했다. 다우존스 산업평균지수는 개장 시점 전장 대비 1092.6포인트(2.27%) 오른 4만 9239.91을 기록했다. 스탠더드앤드푸어스(S&P) 500 지수는 전장 대비 317.0포인트(4.59%) 오른 7227.41로, 기술주 중심 나스닥 종합지수는 1652.0포인트(7.30%) 급등한 2만 4269.746으로 거래를 시작했다. 이후 나스닥 종합지수는 6% 안팎의 급등세를 이어가고 있다.","category":"세계"},{"title":"젠슨 황 복귀에 엔비디아 주가 폭등…나스닥 6%, S&P500 4% 끌어올려 [이상은의 워싱턴나우]","link":"https://n.news.naver.com/mnews/article/015/0005357328","naverLink":"https://n.news.naver.com/mnews/article/015/0005357328","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황이 지난 7월16일 일본 도쿄의 한 행사에서 발언하는 모습. /로이터 젠슨 황 엔비디아 전 최고경영자(CEO)의 복귀를 이사회가 의결했다는 소식에 미국 증시가 급등세를 이어가고 있다. 엔비디아(NVDA) 주가는 23일(현지시간) 장이 시작한 후 폭등했다. 30% 이상 뛰어오른 후 약간의 오르내림을 반복하고 있다. 네오클라우드 회사인 코어위브와 네비우스의 주가도 30% 이상 뛰어올랐다가 20%대 초반으로 상승폭을 줄여 거래되고 있다. 나스닥은 6% 이상, S&P500 지수도 4% 상승한 후 오르내리는 중이다. 이사회는 이날 성명을 통해 황 전 CEO와 일련의 논의를 진행했다면서 그의 솔직함과 회사를 이끌 능력에 만족한다고 밝혔다. 하비 존스 엔비디아 이사회 의장은 \"이사회는 젠슨이 엔비디아를 이끌기에 적합한 인물이라고 믿으며, 그의 복귀가 주주, 직원, 파트너, 고객의 최선의 이익이라고 판단한다\"고 말했다. 존스는 계속 엔비디아 이사회 의장을 맡을 예정이라고 덧붙였다. 그는 지난 주 회사의 3분기 실적 발표 당시 투자자들에게 황 전 CEO를 다시 영입할 계획이 없다고 했으나 불과 며칠 만에 이를 뒤집었다. 황 CEO는 성명에서 \"새로운 산업 혁명의 시작점에서 세계에서 가장 영향력 있는 기술 기업인 엔비디아로 돌아오게 되어 영광\"이라고 밝혔다. 워싱턴=이상은 특파원 selee@hankyung.com","category":"세계"},{"title":"RSM Classic Golf","link":"https://n.news.naver.com/mnews/article/077/0007247352","naverLink":"https://n.news.naver.com/mnews/article/077/0007247352","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"RSM Classic Golf Rasmus Neergaard-Petersen, of Denmark, lines up his putt on the third hole during the final round of the RSM Classic golf tournament, Monday, Nov. 23, 2026, on St. Simons Island, Ga. (AP Photo/Mike Stewart)","category":"세계"},{"title":"RUSSIA ART","link":"https://n.news.naver.com/mnews/article/091/0010376373","naverLink":"https://n.news.naver.com/mnews/article/091/0010376373","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"Paintings on walls in a village outside St. Petersburg Free-style copies of famous paintings and sculptures on the walls in a village outside St. Petersburg, Russia, 23 November 2026. EPA/ANATOLY MALTSEV","category":"세계"},{"title":"젠슨 황 엔비디아 복귀 소식…뉴욕증시 급등 출발","link":"https://n.news.naver.com/mnews/article/366/0001206794","naverLink":"https://n.news.naver.com/mnews/article/366/0001206794","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"뉴욕증권거래소./AFP 연합뉴스 젠슨 황의 엔비디아 최고경영자(CEO) 복귀 소식에 뉴욕증시 3대 지수가 23일(현지 시각) 일제히 상승 출발했다. 장 초반 엔비디아 주가가 28.98% 급등했고, 기술주 중심의 나스닥 종합지수는 6% 넘게 올랐다. 이날 오전 9시 35분 다우존스30산업평균지수는 전 거래일보다 1082.29포인트(2.25%) 오른 4만9229.62를 기록했다. 스탠더드앤드푸어스(S&P)500지수는 296.07포인트(4.28%) 상승한 7206.46에, 나스닥지수는 1391.72포인트(6.15%) 오른 2만4009.46에 거래됐다. 업종별로는 필수 소비재를 제외한 전 업종이 상승했다. 엔비디아 이사회는 황 CEO가 자리에서 물러난 지 11일 만에 재임명했다. 엔비디아는 “이사회는 결정 과정에서 미국 정부 고위급 인사들의 의견을 전달받았으며 이를 바탕으로 황 CEO의 복귀가 국가 안보에 위험을 초래하지 않는다고 확신하고 있다”고 밝혔다. 도널드 트럼프 미국 대통령도 이사회의 결정을 두고 “옳고 적절한 결정”이라고 평가했다. 다니엘라 해손 캐피털닷컴 선임 시장 애널리스트는 “투자자들은 최근 약세를 매수 기회로 활용하려는 모습을 보이고 있지만, 이것이 지속 가능한 회복을 의미하는지 판단하기에는 이르다”고 언급했다. 개별 종목 가운데 사이버 보안 업체 Z스케일러는 19.58% 뛰었다. 크라우드스트라이크가 인수 대금 439억달러 전액을 주식으로 지급하는 조건으로 Z스케일러를 인수한다고 발표한 영향이다. 제너럴모터스(GM)는 2.43% 올랐다. 블룸버그는 소식통을 인용해 GM 이사회가 메리 바라 CEO의 후임으로 스털링 앤더슨을 검토하고 있다고 보도했다. 이사회는 소프트웨어와 자율주행 기술에 정통한 인물을 차기 CEO로 원하는 것으로 전해졌다. 앤더슨은 자율주행 기술 기업 오로라 이노베이션의 공동 창업자로 지난해 6월 GM에 합류했다. 지난주 6만달러 아래로 떨어졌던 비트코인 가격이 반등하면서 암호화폐 관련주도 올랐다. 마라홀딩스는 23.31%, 스트래티지는 15.28% 상승했다. 유럽 주요 증시도 오름세를 보였다. 유로스톡스50지수는 전 거래일보다 1.78% 오른 6047.49를 기록했다. 독일 DAX지수는 1.78%, 프랑스 CAC40지수는 1.32%, 영국 FTSE100지수는 0.94% 상승했다. 국제 유가는 하락했다. 같은 시각 2027년 1월 인도분 서부텍사스산원유(WTI)는 전 거래일보다 1.59","category":"세계"}],"IT 과학":[{"title":"델, AI 서버 수요 증가에 호실적…250억 달러 자사주 매입","link":"https://n.news.naver.com/mnews/article/003/0014343746","naverLink":"https://n.news.naver.com/mnews/article/003/0014343746","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"3분기 매출, 전년比 두 배…·EPS, 시장 예상치 상회 PC·노트북 사업, 메모리 가격 상승 여파로 실적 부진 In this Aug. 15, 2011 photo, the logo on a Dell computer is displayed, in Philadelphia. Dell announced Monday, July 3, 2012, that it is buying Quest Software for about $2.36 billion, ending recent speculation about who the unnamed bidder was in a battle for the company with investment firm Insight Venture Partners. (AP Photo/Matt Rourke) [서울=뉴시스]신정원 기자 = 미국 PC·서버 제조업체 델이 인공지능(AI) 서버 수요 급증에 힘입어 시장 예상치를 웃도는 3분기 실적을 발표하고 250억 달러(악 33조원) 규모의 자사주 매입을 승인했다. CNBC에 따르면 델은 24일(현지 시간) 3분기 매출은 549억4000만 달러, 조정 주당순이익(EPS)은 9.45달러를 기록했다고 밝혔다. 금융정보업체 LSEG가 집계한 월가 예상치(매출 493억2000만 달러, EPS 6.59달러)를 크게 상회했다. 전체 매출은 전년 동기 대비 두 배 이상 급증했다. 델은 4분기 실적 전망치도 시장 예상치를 뛰어늠는 수준으로 제시했다. 매출 약 563억 달러, EPS 8.40달러를 기록할 것으로 전망했다. AI 서버 사업이 실적 성장을 견인했다. 델의 최대 사업 부문인 인프라 솔루션 그룹(ISG)의 3분기 매출은 419억7000만 달러로, 시장 예상치 352억7000만 달러를 넘어섰다. 이 중 AI 최적화 서버 매출은 220억 달러로 전년 동기 대비 291% 급증했다. ISG가 전체 매출에서 차지하는 비중은 85%에 달했다. 다음 회계연도 AI 서버 매출 전망은 780억 달러로 상향 조정했다. 시장 예상치는 740억 달러였다. 현재 AI 서버 수주 잔고는 1323억 달러이며, AI 서버 고객은 7500곳에 이른다. 제프 클라크 부회장 겸 최고운영책임자(COO)는 \"ISG가 이익과 성장의 대부분을 이끄는 완전히 다른 회사가 됐다\"고 밝혔다. 또 회사의 경쟁우위는 \"고객이 제품을 배송받은 후 몇 시간 만에 컴퓨터를 사용할 수 있도록 해주는 것\"이라고 말했다. 반면","category":"IT 과학"},{"title":"변리사도 AI 커닝?···60점 이상 고득점자 1년 새 14배","link":"https://n.news.naver.com/mnews/article/033/0000053600","naverLink":"https://n.news.naver.com/mnews/article/033/0000053600","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"2027학년도 대학수학능력시험(수능)이 치러진 19일 서울 영등포구 여의도여자고등학교에서 한 수험생의 책상 위에 안경과 전자기기가 놓여 있다. 사진공동취재단 세무사 시험과 법학적성시험(LEET·리트)에 이어 변리사 시험에서도 인공지능(AI) 부정행위 의혹이 제기됐다. 올해 변리사 2차 시험 고득점자가 지난해의 14배로 늘어났다고 국회 기후에너지환경노동위원회 소속 이헌승 국민의힘 의원이 23일 밝혔다. 이 의원이 한국산업인력공단으로부터 제출받은 자료에 따르면 올해 변리사 2차 시험 응시자 1130명 중 평균 60점 이상 고득점을 받은 사람은 인원은 42명(3.7%)으로, 지난해 3명(0.3%)의 14배나 됐다. 최근 5년간 응시자 수는 1100명 안팎으로 큰 차이가 없었으나 올해 고득점자 수는 5년 새 가장 많았다. 종전 최다였던 2024년(16명)과 비교해도 약 2.6배에 달한다. 합격자 평균 점수는 지난해 55.35점에서 올해 58.65점으로 3.3점 올랐다. 합격 최저점도 53점에서 56.44점으로 상승했다. 1·2차 시험을 같은 해에 통과한 ‘생동차’ 합격자는 2024년 5명에서 지난해와 올해 각각 11명으로 늘었다. 다만 과목별 난이도에 따라 고득점자 수가 해마다 크게 달라지는 만큼 이 같은 수치만으로 부정행위를 의심하기는 어렵다는 지적도 나온다. 대한변리사회가 지난 20일 공개한 최근 5년간 변리사 시험 채점 통계를 보면 과목별 고득점자 수는 해마다 큰 편차를 보였다. 민사소송법에서 60점 이상을 받은 응시자는 2022년 592명, 2023년 116명, 2024년 286명, 지난해 24명, 올해 558명이었다. 반면 상표법은 지난해 99명에서 올해 2명으로 급감했다. 다만 민사소송법 고득점자가 592명에 달했던 2022년에도 전체 평균 60점 이상 득점자는 한 자릿수에 그쳤다. 앞서 AI를 활용한 부정행위가 적발된 세무사 시험에서도 고득점자가 크게 늘어난 것으로 나타났다. 올해 세무사 1차 시험 회계학개론에서 90점 이상을 받은 응시자는 66명으로 2024년 1명, 지난해 2명에 비해 급증했다. 전체 응시자 수는 지난해 1만8708명에서 올해 1만6856명으로 오히려 줄었다. 2차 시험 합격 최고점도 지난해 70.62점에서 올해 82.87점으로 12.25점 상승했다.","category":"IT 과학"},{"title":"Russia Ukraine War","link":"https://n.news.naver.com/mnews/article/077/0007247354","naverLink":"https://n.news.naver.com/mnews/article/077/0007247354","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"Russia Ukraine War. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"젠슨 황 돌아와도…‘대중국 AI칩 수출통제’ 준수 여부 조사는 계속","link":"https://n.news.naver.com/mnews/article/028/0002833618","naverLink":"https://n.news.naver.com/mnews/article/028/0002833618","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 돌아와도…‘대중국 AI칩 수출통제’ 준수 여부 조사는 계속. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"젠슨 황 복귀에 엔비디아 30% 폭등…AI·반도체주 동반 급등","link":"https://n.news.naver.com/mnews/article/015/0005357327","naverLink":"https://n.news.naver.com/mnews/article/015/0005357327","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 복귀에 엔비디아 30% 폭등…AI·반도체주 동반 급등. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"젠슨 황, 엔비디아 CEO 전격 복귀에… 美증시 반도체주 폭등","link":"https://n.news.naver.com/mnews/article/029/0003060737","naverLink":"https://n.news.naver.com/mnews/article/029/0003060737","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황, 엔비디아 CEO 전격 복귀에… 美증시 반도체주 폭등. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"크라우드스트라이크, 지스케일러 59조원에 인수… 보안업계 사상 최대 M&A","link":"https://n.news.naver.com/mnews/article/366/0001206786","naverLink":"https://n.news.naver.com/mnews/article/366/0001206786","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"크라우드스트라이크, 지스케일러 59조원에 인수… 보안업계 사상 최대 M&A. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"INSS \"한국, AI 속도조절 영향력 부족\"","link":"https://n.news.nav   const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));

  if(!data.days.today || !data.days.today.date){
    $("#count").textContent="오늘 뉴스 업데이트 대기 중";
    $("#feed").innerHTML='<div class="empty">오전 10시 업데이트 대기중</div>';
    return;
  }
  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
