,"category":"사건 사고"},{"title":"'고점 대비 반토막' 비트코인 6만 달러 붕괴...이더리움도 6.5% 급락","link":"https://n.news.naver.com/mnews/article/014/0005607612","naverLink":"https://n.news.naver.com/mnews/article/014/0005607612","pubDate":"2026-11-21T10:59:40.429454+09:00","author":"네이버뉴스","description":"뉴시스 [파이낸셜뉴스] 가상화폐 '대장주'로 여겨지는 비트코인이 4개월 만에 6만 달러 선 아래로 주저앉으며 7주 연속 내림세를 기록했다. 테라·루나 붕괴 여파가 시장을 강타했던 2022년 이후 약 4년 만에 가장 긴 기간 이어진 약세다. 20일(현지시간) 미국 가상화폐 거래소 코인베이스에 따르면, 미 동부시간 정오 무렵 비트코인 개당 가격은 24시간 전 대비 약 4.7% 하락한 5만9467달러 선에서 거래됐다. 장중 한때 5만8678.48달러까지 밀렸다가 낙폭을 일부 만회했으나 6만 달러 선 회복에는 미치지 못했다. 비트코인 가격의 낙폭은 최근 일주일 14%에 달한다. 지난해 10월 기록한 사상 최고가(12만6210.5달러)와 비교하면 반토막 이하 수준으로 내려앉았다. 이번 주간 기준 7주 연속 약세는 지난 2022년 8주 연속 하락 이후 최장기간 부진이다. 주요 알트코인도 동반 급락해 시가총액 2위 이더리움은 같은 시각 24시간 전보다 6.5% 떨어진 1643.6달러에 거래됐다. 시장에서는 이번 급락의 직접적인 방아쇠로 기관 자금 이탈을 지목하고 있다. 블룸버그통신 보도에 따르면 전날 하루 동안 미국 비트코인 현물 상장지수펀드(ETF)에서 순유출된 자금은 5억8200만 달러(약 7800억원)에 달했다. 특히 순유출 물량의 대부분인 5억4110만 달러가 세계 최대 자산운용사 블랙록의 '아이셰어즈 비트코인 트러스트'(IBIT)에서 빠져나갔으며, 지난달 30일 이후 누적 유출액은 41억 달러로 불어났다. 전문가들은 거시경제 압박과 대형 인공지능(AI) 기업의 증시 입성이 복합적으로 작용해 위험자산 회피 심리를 키웠다고 분석했다. 가상화폐 유동성 공급사 윈센트의 폴 하워드 선임이사는 ETF 자금 유출 현상을 지적했다. 미 연방준비제도(Fed·연준)의 매파적 통화정책 기조가 위험자산 전반을 압박하면서 기관투자가들이 적극적인 저가 매수에 나서지 못하고 있다고 진단했다. 전날 진행된 AI 기업 앤트로픽의 대규모 기업공개(IPO)로 인한 수급 쏠림도 원인으로 꼽혔다. 가상화폐 재무관리업체 샤프링크의 매슈 셰필드 최고투자책임자(CIO)는 CNBC 인터뷰에서 앤트로픽 상장 직후 시장 거래자들이 2차 시장에서 해당 주식을 매수할 자금을 확보하기 위해 기존 보유 자산을 처분하면서 기술주와 가치주, 원자재, 가상화폐가 동반 하락했다고 설명했다. 여기에 가상자산 시장 내부의 악재도 투자 심리를 위축시켰다. 지난달 발생한 글로벌 거래","category":"사건 사고"},{"title":"\"이웃 별 통째로 삼키고 7년 만에 대폭발\"…'별들의 합체' 우주 드라마 첫 포착[사이언스 PICK]","link":"https://n.news.naver.com/mnews/article/003/0014337018","naverLink":"https://n.news.naver.com/mnews/article/003/0014337018","pubDate":"2026-11-21T10:59:40.429453+09:00","author":"네이버뉴스","description":"美 컬럼비아대 연구진, 안드로메다은하서 두 별이 합쳐지는 과정 세계 최초 관측 태양 반지름 350배 거대 별, 태양 질량 70% 동반성 7년 만에 흡수 제임스웹 등 관측자료로 별 내부 공전·합체 과정 재구성 성공 오랜 난제 '공통외피 진화' 규명…블랙홀·중성자별 탄생 비밀 풀까 지구에서 약 250만광년 떨어진 안드로메다은하에서 거대 별이 동반성을 집어삼켜 하나의 별로 합쳐지는 과정을 표현한 상상도. 국제 연구진은 제임스웹 우주망원경(JWST) 등의 관측자료를 활용해 두 별이 합체하는 과정을 규명했다. (사진=NASA) *재판매 및 DB 금지 [서울=뉴시스]윤현성 기자 = 수천 년 동안 서로의 주위를 맴돌던 두 별이 불과 7년 만에 하나의 별이 되는 극적인 장면이 인류 역사상 처음으로 포착됐다. 태양 반지름의 350배에 달하는 거대한 별이 태양과 비슷한 덩치의 이웃 별을 통째로 집어삼키면서 벌어진 일이다. 거대 별의 몸속으로 들어간 작은 별은 그 안에서도 한동안 공전을 이어가다 결국 중심부로 빨려 들어간 것으로 분석됐다. 별이 주변 행성을 삼키거나 두 별이 하나로 합쳐지는 현상 자체는 이전에도 이론으로 알려져 있었다. 하지만 별이 다른 별의 몸속을 돌며 서서히 중심부로 추락하는 생생한 과정이 실제 관측 자료를 통해 밝혀진 것은 이번이 처음이다. 태양보다 1만8000배 밝은 별…이웃 별 삼키고 7년 만에 대폭발 21일 학계에 따르면 미국 컬럼비아대학교 등이 참여한 국제 연구진은 지난 18일 국제학술지 '네이처'에 안드로메다은하에서 발생한 항성 합체 현상에 대한 연구 결과를 발표했다. 연구진이 주목한 것은 지구에서 약 250만광년 떨어진 안드로메다은하 외곽의 'AT 2025abao'라는 천체다. 연구진은 당초 두 별로 구성됐던 이 천체에 '빅 바오(Big Bao)'와 '리틀 바오(Little Bao)'라는 별명을 붙였다. 빅 바오는 질량이 태양의 약 7배, 반지름은 350배에 달했다. 밝기는 태양의 약 1만8000배로 추정됐다. 반면 리틀 바오는 태양의 약 70% 수준의 질량을 가진 별이었다. 두 별의 운명이 바뀌기 시작한 것은 빅 바오가 수명의 막바지에 접어들면서다. 별은 중심부의 수소 연료를 소진하고 진화하는 과정에서 외곽층이 크게 팽창할 수 있다. 우리 태양도 약 50억년 뒤에는 적색거성으로 팽창해 가장 가까운 행성인 수성을 집어삼킬 것으로 예상된다. 빅 바오 역시 진화 과정에서 외곽층이 팽창하면서 주변을 돌던","category":"사건 사고"},{"title":"[오늘 이 웹소설] 죽음 피해 떠난 악역 아내…남편의 사랑이 시작됐다","link":"https://n.news.naver.com/mnews/article/014/0005607615","naverLink":"https://n.news.naver.com/mnews/article/014/0005607615","pubDate":"2026-11-21T10:59:40.429450+09:00","author":"네이버뉴스","description":"카카오페이지 웹소설 '남주가 죽은 아내를 찾다가 미쳐간다는데, 그 아내가 나다'. 카카오엔터테인먼트 제공 [파이낸셜뉴스] 소설 속 악역으로 빙의했다. 그것도 전쟁터에 나간 남편의 보급품을 빼돌려 팔아넘기고 도망치다 붙잡혀 죽는 인물이다. 예정된 죽음을 피하려면 원작과 다른 선택을 해야 한다. 남편의 든든한 조력자가 돼 살아남는 데 성공한 줄 알았지만, 이번에는 자신이 떠난 남편이 다시 찾아 나서면서 예상치 못한 상황에 놓인다. 카카오페이지 로맨스판타지 웹소설 '남주가 죽은 아내를 찾다가 미쳐간다는데, 그 아내가 나다'는 죽을 운명의 악역으로 빙의한 주인공이 남편의 조력자가 돼 원작의 운명을 뒤집는 이야기를 그린 작품이다. 주인공이 빙의한 인물은 전장에 나간 남편 루시안의 가문에 지급된 보급품을 빼돌려 팔아넘기고 도망치다가 붙잡혀 죽을 운명이다. 자신에게 닥칠 최후를 알고 있는 주인공은 살아남기 위해 루시안을 돕기로 결심한다. 주인공은 전쟁터로 향하는 남편을 격려하고 보급품을 안전하게 전달하겠다고 약속한다. 제국을 위한 일임을 잊지 않고 기도하겠다며 좋은 아내의 역할도 마다하지 않는다. 살아남기 위해서라면 아첨꾼이든 조력자든 무엇이든 하겠다는 것이다. 그러나 루시안이 전장으로 떠난 지 얼마 후 주인공도 그의 곁을 떠난다. 원작에는 루시안과 이어질 여주인공이 따로 있기 때문이다. 자신은 두 사람의 관계에 방해가 되는 존재라고 생각하고 조용히 떠나기로 한 것이다. 하지만 주인공의 예상과 달리 루시안은 떠난 아내를 다시 찾으려 한다. 남편과 원작의 여주인공이 이어질 것으로 생각했던 주인공은 자신을 향한 루시안의 반응에 당황한다. 죽음을 피하려 남편을 돕고 떠났지만, 원작에서 예상했던 것과는 다른 상황이 펼쳐지는 것이다. 작품은 자신이 알고 있던 소설의 운명에서 벗어나려는 주인공과 떠난 아내를 찾는 남편의 관계를 통해 오해와 관계 역전을 풀어낸다. 살아남기 위한 선택이 예상하지 못한 로맨스로 이어진다는 점이 주요 관전 포인트다. 한편, 작품을 집필한 린아 작가는 앞서 '죽었어야 할 남편이 돌아왔다'와 '흑막들의 조련사가 되었습니다' 등을 선보였다. 두 작품은 카카오페이지에서 각각 누적 약 580만뷰, 612만뷰를 기록했다. '흑막들의 조련사가 되었습니다'는 평점 9.9점을 받았다.","category":"사건 사고"},{"title":"과거시험도 대형 입시비리 터졌다…합격자 33명 중 15명이 부정입학","link":"https://n.news.naver.com/mnews/article/016/0002726490","naverLink":"https://n.news.naver.com/mnews/article/016/0002726490","pubDate":"2026-11-21T10:59:39.267960+09:00","author":"네이버뉴스","description":"1000년 컨닝의 역사…작은 쪽지부터 AI 기기까지 [헤럴드경제=채상우 기자] 인공지능(AI) 기기를 이용한 시험 부정행위 문제가 전국을 떠들썩하게 만들고 있다. 이런 시험 부정행위는 최근의 일이 아니다. 고대에도 ‘인생역전’을 노린 부정행위가 행해지고 있었다. 옆 답안지를 들여다보던 것에서 쪽지에 쓴 공식으로, 무전기에서 휴대전화로 그리고 AI까지. 부정행위는 기술의 발전에 엎혀 1000년이 넘는 세월 동안 조금씩 진화를 거듭했다. 과거시험에도 있었던 컨닝…옷 속에 숨긴 초소형 답안지 챗GPT로 만든 가상 이미지. 시험 부정행위의 역사는 동서양을 막론하고 오래됐다. 중국의 과거제도는 수나라 때 시작돼 1905년 폐지될 때까지 1300여 년간 이어졌다. 관리를 선발하는 국가시험이었던 만큼 합격을 향한 경쟁도 치열했다. 응시자들은 경전을 통째로 외워야 했고, 시험에 실패하면 출세의 기회가 멀어졌다. 이 과정에서 기상천외한 부정행위가 등장했다. 명·청 시대에는 사서오경의 내용을 아주 작은 글씨로 축소한 답안지를 옷이나 신발 밑창에 숨겨 시험장에 가져갔다. 손바닥보다 작은 천 조각에 빼곡하게 글자를 적은 암기용 쪽지도 있었다. 시험장에 들어가기 전 응시자의 옷과 소지품을 검사하고, 음식까지 쪼개 확인할 정도로 단속이 엄격했지만 부정행위를 완전히 막지는 못했다. 시험관을 매수하거나 답안지에 암호처럼 특정 문구를 넣어 채점자에게 신호를 보내는 수법도 있었다. 시험장 안에서 답을 훔쳐보는 수준을 넘어 시험을 관리하는 사람까지 포섭한 것이다. 조선의 과거시험도 예외는 아니었다. 1699년에는 과거시험 합격자 33명 가운데 15명이 부정한 방식으로 합격한 사실이 드러난 대형 입시 비리가 있었다. 답안지에 붙이는 응시자 이름을 바꾸는 등 시험 결과를 조작한 사례가 포함됐다. 오늘날의 대리시험이나 답안지 바꿔치기와 다르지 않은 수법이었다. 1990년대 학력고사…돈으로 산 합격, 조직적으로 움직인 대리시험 1986년 11월 20일 서울 동성중학교에서 수험생들이 대입 학력고사를 치르는 모습. 부정행위와는 무관한 학력고사 관련 참고 이미지. [연합]","category":"사건 사고"},{"title":"리트 만점자, 사망 당일 새벽 짐정리... 이틀전엔 집주인에 “탈출 도와달라”","link":"https://n.news.naver.com/mnews/article/023/0004010934","naverLink":"https://n.news.naver.com/mnews/article/023/0004010934","pubDate":"2026-11-21T10:59:39.267957+09:00","author":"네이버뉴스","description":"3줄 요약 ㆍ 리트 만점자 부정행위 의혹 속 사망 ㆍ 사망 당일 짐 정리...이틀 전에는 집 주인에 \"탈출 도와달라\" ㆍ 공개 검증 불참 후 모텔서 숨진 채 발견 이진우 씨의 사망 당일 모습이 담긴 CCTV 영상./소셜미디어 연합뉴스 올해 법학적성시험(리트·LEET)에서 만점을 받아 화제가 됐지만 부정행위 의혹에 휩싸인 뒤 사망한 고(故) 이진우(32)씨가 사망한 당일 새벽 자취방에 돌아와 짐을 정리한 것으로 확인됐다. 이씨는 그간 사망하기 이틀 전인 17일 저녁 집을 나가 귀가하지 않은 것으로 알려졌지만, 수능 국어 문제 풀이 생중계 전 신변을 정리하기 위해 집을 찾았던 것으로 파악됐다. 본지 취재를 종합하면, 이씨는 사망 당일인 19일 새벽 서울 관악구 신림동 자택을 찾아 일부 짐을 챙긴 뒤 집을 나섰다. 남은 짐은 재활용품장에 버렸다. 이후 이씨는 부정행위 의혹에 정면 돌파하겠다며 예고했던 서울 강남구 대치동 소재 공개 검증 현장에 모습을 나타내지 않았다. 이씨가 예고했던 오전 8시 40분이 되도록 나타나지 않자, 오전 8시 42분쯤 신변 안전이 우려된다는 신고가 접수됐다. 하지만 경찰이 즉각 추적에 나섰지만 이씨는 집에 없었다. 19일 오후 법학적성시험(LEET·리트) 만점자 이진우 씨가 서울 강동구 한 숙박업소에서 심정지 상태로 발견됐다. 소방대원들이 숙박업소로 들어가고 있다. /임지훈 기자","category":"사건 사고"},{"title":"“1타 2피 제대로네”…수능 재난문자, 군부대 ‘투폰’ 병사들도 잡았다","link":"https://n.news.naver.com/mnews/article/009/0005766962","naverLink":"https://n.news.naver.com/mnews/article/009/0005766962","pubDate":"2026-11-21T10:59:39.267955+09:00","author":"네이버뉴스","description":"“1타 2피 제대로네”…수능 재난문자, 군부대 ‘투폰’ 병사들도 잡았다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"집주인에 \"탈출 도와달라\"... 리트 만점자, 사망 당일 새벽 자취방 들러","link":"https://n.news.naver.com/mnews/article/469/0000966911","naverLink":"https://n.news.naver.com/mnews/article/469/0000966911","pubDate":"2026-11-21T10:59:39.267927+09:00","author":"네이버뉴스","description":"시험 부정행위 의혹에 휩싸였다가 숨진 법학적성시험(LEET·리트) 만점자 이진우씨가 19일 숨진 채 발견되기 앞서 이날 오전 서울 강동구 한 숙박업소 인근에서 이동하는 모습이 폐쇄회로(CC)TV 영상에 찍혔다. 연합뉴스 법학적성시험(LEET·리트) 만점자 고 이진우(32)씨가 사망 당일 새벽 자취방에 돌아와 짐을 정리한 것으로 파악됐다. 이씨가 집주인에게 취재진을 피해 자택을 빠져나갈 방법을 물었던 사실도 확인됐다. 21일 경찰 등에 따르면 사망 당일인 19일 새벽 서울 관악구 신림동 자택에 귀가한 이씨는 일부 짐을 챙기고 그외 남은 짐을 재활용품장에 버린 뒤 집을 나왔다. 이씨는 사망 이틀 전인 17일 집을 나선 뒤 귀가하지 않은 것으로 알려졌으나 수능 국어 문제풀이 공개 검증을 앞둔 19일 새벽 자택에 들러 신변을 정리한 정황이 포착된 것이다. 이씨는 이날 오전 8시 40분 공개 검증이 예정됐던 강남구 대치동의 한 스튜디오에 끝내 모습을 드러내지 않았다. 행방이 묘연해지자 오전 8시 42분 신변 안전이 우려된다는 신고가 접수됐고 경찰이 즉각 추적에 나섰다. 신변을 걱정한 이씨의 가족도 자취방을 찾았지만 이씨는 이미 집을 떠난 뒤였다. 이씨는 이후 송파구와 강동구 일대를 대중교통과 도보로 이동하다가 강동구 천호동의 한 모텔에서 숨진 채 발견됐다. 이씨가 마지막으로 언론에 목격된 17일에는 취재진을 피해 집을 빠져 나갈 수 있도록 집주인에게 \"탈출하게 도와달라\"고 요청한 사실도 새롭게 확인됐다. 당시 이씨는 3층인 자기 집이 아닌 아랫집 2층 방으로 들어가 창문으로 뛰어내린 뒤 산으로 이동하는 방법 등을 집주인에게 제안했지만 실행에 옮기지는 않았다고 한다. 법학적성시험(LEET·리트) 만점자 이진우씨가 수능 국어 문제풀이 공개 검증에 불참했다. 사진은 19일 공개 검증이 예정됐던 서울 강남구의 한 스튜디오 모습. 연합뉴스","category":"사건 사고"},{"title":"독감 확산세 가팔라져…입원환자 1.5배·사망 신고 2배↑","link":"https://n.news.naver.com/mnews/article/001/0016454136","naverLink":"https://n.news.naver.com/mnews/article/001/0016454136","pubDate":"2026-11-21T10:59:39.267919+09:00","author":"네이버뉴스","description":"독감 확산세 가팔라져…입원환자 1.5배·사망 신고 2배↑. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"\"저 사람 주머니에 대마 넣어\"…지인 누명 씌우려던 60대 남성 집유","link":"https://n.news.naver.com/mnews/article/008/0005444381","naverLink":"https://n.news.naver.com/mnews/article/008/0005444381","pubDate":"2026-11-21T10:59:39.267977+09:00","author":"네이버뉴스","description":"삽화, 법원, 로고, 법원로고 /사진=김현정 평소 사이가 안 좋은 지인의 주머니에 대마를 넣어 벌을 받게 하려고 한 60대 남성이 징역형의 집행유예를 선고받았다. 21일 뉴스1에 따르면 춘천지법 형사3단독(박동욱 판사)은 마약류 관리에 관한 법률 위반(대마) 혐의로 기소된 A씨(69)에게 징역 8개월에 집행유예 2년을 선고하고 120시간의 사회봉사를 명령했다. 강원 춘천에서 게임장을 운영하는 A씨는 지난 2월 초 자신의 게임장 계단에서 알게된 손님 B씨에게 대마초 0.1g이 담긴 종이를 건넨 혐의로 재판에 넘겨졌다. 조사 결과 A씨는 금전 문제 등으로 갈등을 빚어온 C씨를 형사처벌 받게 할 목적으로 B씨에게 대마를 건네며 C씨의 옷 주머니에 넣도록 지시한 것으로 드러났다. 이후 C씨를 경찰에 신고할 계획이었던 것으로 조사됐다. 재판 과정에서 A씨는 B씨에게 대마를 건넨 사실은 인정하면서도 C씨를 형사처벌 받게 할 목적은 없었다고 주장했다. 그러나 재판부는 B씨가 수사 단계부터 A씨로부터 대마를 건네받으며 C씨의 주머니에 넣으라는 지시를 받았다고 일관되게 진술한 점 등을 근거로 A씨의 주장을 받아들이지 않았다. 재판부는 \"피고인은 평소 사이가 좋지 않은 C씨를 형사처벌 받게 하기 위해 대마를 건넸다\"며 \"범행 동기와 경위, 수법 등에 비춰 죄질이 좋지 않다\"고 판시했다.","category":"사회"},{"title":"\"김수현, '김새론 의혹' 품위유지 위반 맞다\"...8억7000만원 배상판결, 줄줄이 패소","link":"https://n.news.naver.com/mnews/article/014/0005607620","naverLink":"https://n.news.naver.com/mnews/article/014/0005607620","pubDate":"2026-11-21T10:59:39.267971+09:00","author":"네이버뉴스","description":"재판부, 골드메달리스트 광고주 쿠쿠에 배상 판결... 김수현 개인 청구는 기각 배우 김수현/사진=연합뉴스 [파이낸셜뉴스] 배우 김수현의 사생활 논란으로 광고 계약을 해지한 쿠쿠 측에 소속사 골드메달리스트가 8억7000여만원을 배상해야 한다는 법원의 판단이 나왔다. 김수현 개인에 대한 청구는 기각됐지만, 앞서 건강기능식품 업체 프롬바이오 측이 낸 소송에서도 11억원대 반환 판결이 나와 김수현 측의 광고 배상 부담이 커지고 있다. 20일 서울중앙지법 민사합의25부(권기만 부장판사)는 쿠쿠전자와 렌탈 전문기업 쿠쿠홈시스, 쿠쿠홈시스의 말레이시아 법인인 쿠쿠인터내셔널 버하드가 공동으로 김수현과 소속사 골드메달리스트에 제기한 20억원대의 손해배상 소송에서 원고 일부 승소 판결을 내렸다. 재판부는 김수현 소속사 골드메달리스트가 쿠쿠전자와 쿠쿠홈시스에게 각각 2억6000여만원, 6억1000여만원을 지급하라며 총 8억7000여만원의 배상 책임을 인정했다. 김수현에 대한 청구와 쿠쿠인터내셔널 버하드가 제기한 청구는 받아들이지 않았다. 재판부는 일부 광고 계약은 품위유지 의무 위반으로, 다른 계약은 당사자 간 신뢰관계가 무너졌다는 이유로 해지가 정당하다고 봤다. 이에 따라 소속사가 광고주에게 받은 모델료 일부를 돌려줘야 한다고 판단했다. 쿠쿠전자는 지난해 초 김수현이 고(故) 김새론이 미성년자일 때부터 교제했다는 의혹이 불거지며 여론이 악화하자 김수현의 광고를 내리고 민사소송을 냈다. 이와 관련해 경찰은 올해 7월 김수현의 아동복지법 위반 혐의 등에 대해 입증할 증거가 부족하다며 불송치 결정을 내렸다. 앞서 지난 13일 수원지법 제14민사부(문현호 부장판사)는 프롬바이오가 김수현 측을 상대로 낸 손해배상 소송에서 모델료 11억5000여만원을 돌려주라고 판결했다. 프롬바이오는 지난 2024년 10월부터 김수현을 광고 모델로 썼지만 그가 과거 미성년자이던 김새론과 교제했다는 의혹이 불거진 뒤 이듬해 광고를 중단했다. 재판부는 \"이 사건 의혹으로 피고의 긍정적이고 신뢰감 있는 이미지가 유지되지 못했다\"며 \"이로 인해 제품에 대한 판촉 활동을 할 수 없게 됐다\"고 판시했다.","category":"사회"},{"title":"아침 영하 8도, 주말 나들이 패딩 필수…곳곳 눈, 제주 대설특보","link":"https://n.news.naver.com/mnews/article/028/0002833293","naverLink":"https://n.news.naver.com/mnews/article/028/0002833293","pubDate":"2026-11-21T10:59:39.267968+09:00","author":"네이버뉴스","description":"20일 전남광주 무등산국립공원에서 시민들이 전날부터 이틀째 내린 눈을 감상하며 산책하고 있다. 광주지방기상청은 전날 광주에 올겨울 첫눈이 관측됐다고 발표했다. 광주/연합뉴스 토요일인 21일은 제주도 산지에 대설특보가 내려진 가운데 충남권과 전라권, 제주도를 중심으로 비나 눈이 내릴 것으로 예보됐다. 전국 대부분 지역이 맑겠으나 영하권 추위가 예상되고 아침 최저기온은 영하 8도까지 떨어진다. 외출시 따뜻한 옷과 장갑 등 보온에 신경을 써야 한다. 기상청은 이날 아침 최저기온을 -8~3도, 낮 최고기온은 1~11도로 예보했다. 전국이 대체로 맑겠으나 충남권과 전라권, 제주도는 대체로 흐리겠고 기온은 평년(최저 -3~6도, 최고 8~15도)보다 낮을 것으로 예상된다. 주요 도시 예상 아침 최저기온은 △서울 -5도 △인천 -4도 △춘천 -8도 △강릉 -2도 △대전 -3도 △대구 -2도 △전주 -2도 △광주 1도 △부산 1도 △제주 8도다. 낮 최고기온은 △서울 2도 △인천 2도 △춘천 2도 △강릉 5도 △대전 4도 △대구 6도 △전주 5도 △광주 7도 △부산 9도 △제주 11도로 예상된다. 북서쪽에서 남하한 찬 공기의 영향으로 일요일인 22일에도 아침 최저 기온은 -9~0℃, 낮 최고기온은 4~10℃로 추울 것으로 예상된다. 기상청 예보에 따르면, 21일 충남권은 새벽까지, 전라권은 아침까지, 제주도는 밤까지 비나 눈이 내리는 곳이 있을 것으로 예상된다. 오후에는 세종·충남 북부 내륙에, 밤에는 전라 서해안에 비나 눈이 내리겠고 전남·광주 서해안은 내일(22일) 새벽까지 이어진다. 20일부터 이날까지 예상 적설량은 △서해5도 1cm 안팎 △충남 서부 1~5cm △세종·충남 동부 1cm 안팎 △전북 서부·남동부 3~8cm △전남 북부 서해안 2~7cm △광주·전남 내륙·남부 서해안 1~3cm △울릉도·독도 1~3cm △제주도 산지 2~7cm다. 전북 서해안에는 이날 밤 1cm 미만의 눈이 더 내릴 것으로 예보됐다. 기상청은 내린 비나 쌓인 눈이 얼어 빙판길과 도로 살얼음이 나타나는 곳도 있겠으니 보행과 운전시 안전에 유의할 것을 당부했다. 곳곳에서 강풍도 예상된다. 제주도에는 강풍특보가 발효되어 오전까지 순간풍속 시속 70km(초속 20m) 이상의 강한 바람이 불고, 산지는 시속 90km(초속 25m) 이상의 강풍이 분다. 강원 산지·동해안에도 순간풍속 시속 55km(초속 15m) 안팎, 산지는 시속 70km(초속 20","category":"사회"},{"title":"비트코인 4개월만에 다시 6만 달러 아래로, 2022년 이후 최저","link":"https://n.news.naver.com/mnews/article/021/0002834438","naverLink":"https://n.news.naver.com/mnews/article/021/0002834438","pubDate":"2026-11-21T10:59:39.267965+09:00","author":"네이버뉴스","description":"비트코인 가상 이미지. 비트코인이 4개월 만에 6만 달러 선 아래로 다시 떨어졌다. 미국 가상화폐 거래소 코인베이스에 따르면 20일(현지시간) 비트코인 1개 가격은 전날보다 4.7% 떨어진 5만9467달러선을 오르내리고 있다. 비트코인 가격은 한때 5만8678.48달러까지 떨어졌다가 낙폭을 일부 회복했지만, 일주일 전보다 14% 하락했다. 가상화폐 시가총액 1위 종목인 비트코인 가격이 사상 최고가를 기록한 지난해 10월 12만6210.5달러의 절반에도 못 미치는 수준으로 떨어졌다. 비트코인은 7주 연속 하락세를 이어가며 테라·루나 붕괴 사태 등으로 8주 연속 내림세를 이어갔던 2022년 이후 최장기간 약세를 기록하고 있다. 블룸버그 통신은 “비트코인 약세는 기관 자금의 유출이 표면적인 주요 원인”이라고 분석했다. 실제로 비트코인 현물 ETF에서는 전날 하루에만 5억8200만 달러(약 7800억원)의 자금이 순유출됐으며, 지난달 30일 이후 비트코인 ETF에서 빠진 자금은 41억 달러에 달한다. 가상화폐 재무관리업체 샤프링크의 매슈 셰필드 최고투자책임자(CIO)는 CNBC 인터뷰에서 “앤트로픽 상장 직후 트레이더들이 2차 시장에서 주식을 사기 위해 다른 자산을 팔면서 기술주·가치주·원유·금·가상화폐가 일제히 하락했다”고 말했다.","category":"사회"},{"title":"“주머니에 대마 넣고 와라”…지인 누명 씌우려던 60대 집유","link":"https://n.news.naver.com/mnews/article/020/0003764122","naverLink":"https://n.news.naver.com/mnews/article/020/0003764122","pubDate":"2026-11-21T10:59:39.267962+09:00","author":"네이버뉴스","description":"춘천지법.(춘천시 제공. 재판매 및 DB 금지) 금전 문제 등으로 갈등을 빚어온 지인을 형사처벌 받게 할 목적으로 다른 사람을 시켜 지인의 주머니에 대마를 넣으라고 사주한 60대가 징역형의 집행유예를 선고받았다. 춘천지법 형사3단독(박동욱 판사)은 마약류 관리에 관한 법률 위반(대마) 혐의로 기소된 60대에게 징역 8개월에 집행유예 2년을 선고했다고 21일 밝혔다. 또 120시간의 사회봉사를 명령했다. 춘천에서 게임장을 운영하는 60대는 2월 초 자신의 게임장 계단에서 한 손님에게 대마초 0.1g이 담긴 종이를 건네준 혐의로 재판에 넘겨졌다. 그는 자신과 사이가 좋지 않았던 지인을 형사처벌 받게 할 목적으로 이 손님에게 지인의 옷 주머니에 대마를 넣도록 지시한 뒤 112에 신고하려 했던 것으로 조사됐다. 재판 과정에서 60대는 대마를 건넨 사실은 인정하면서도 지인을 형사처벌 받게 할 목적은 없었다고 주장했다. 그러나 재판부는 60대로부터 대마를 건네받은 손님이 60대가 대마를 지인의 주머니에 넣으라는 지시를 했다고 일관되게 진술한 점 등을 근거로 이를 받아들이지 않았다. 재판부는 “범행 동기와 경위, 수법 등에 비춰 죄질이 좋지 않다”고 판단했다.","category":"사회"},{"title":"\"머리 넘기고 앞치마 입으세요\"…대학 논술시험장 '진풍경'","link":"https://n.news.naver.com/mnews/article/015/0005356566","naverLink":"https://n.news.naver.com/mnews/article/015/0005356566","pubDate":"2026-11-21T10:59:39.267961+09:00","author":"네이버뉴스","description":"\"머리 넘기고 앞치마 입으세요\"…대학 논술시험장 '진풍경'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"\"이미 2.8억 손실, 월요일이 무섭다\"...미 증시 폭락에 개미들 패닉","link":"https://n.news.naver.com/mnews/article/008/0005444383","naverLink":"https://n.news.naver.com/mnews/article/008/0005444383","pubDate":"2026-11-21T10:59:39.267954+09:00","author":"네이버뉴스","description":"코스피가 전 거래일보다 267.93포인트(5.21%) 내린 4869.96에 마감한 20일 오후 서울 중구 하나은행 딜링룸에 지수가 표시돼 있다. 코스닥은 전 거래일보다 39.13포인트(5.71%) 내린 645.68에 거래를 마쳤다. /사진=뉴시스 국내 증시 급락에 이어 뉴욕증시 3대 지수가 일제히 급락했다. 투자자들이 \"월요일이 무섭다\"며 불안한 반응을 보이고 있는 가운데 \"무조건 버티자\"는 반응도 나온다. 21일 직장인 익명 커뮤니티 블라인드의 주식·투자 게시판에는 증시 급락에 따른 투자 손실을 호소하는 글이 쏟아졌다. 공무원 소속으로 표시된 한 이용자는 '주식으로 인생 망했습니다'는 글을 올렸다. 그는 \"투자를 도박으로 생각했다. 모든 의욕이 사라졌다\"며 2억8000만원 이상 손실 중인 자신의 주식 앱 화면을 공개했다. 또 다른 공무원 이용자는 \"주식으로 돈 다 잃었다\"며 \"원금 1억8000만원 넣고 2억3000만원까지 올랐다가 지금 1억원이 됐다. 꿈인가 싶다. 그냥 예·적금이나 할 것. 두 번 다시 주식은 쳐다도 보기 싫다\"고 토로했다. 해당 글에는 \"나도 같은 상황이다\" \"한숨만 나온다\" 등의 댓글이 달렸다. 다른 이용자들도 '삼전 주주들 월요일에 던질 거야?' '손절 vs 존버(최대한 버티기)' 등의 글을 올리며 고민에 빠진 모습을 보였다. 국장뿐 아니라 미장에 손을 댔다가 큰 투자 손실을 봤다는 이들의 하소연 글도 쏟아졌다. 해당 글에는 \"무조건 버텨라\" \"버티면 좋은 날이 다시 온다\" 등 희망적인 댓글도 달렸다. 반면 주가 하락을 매수 기회로 판단하는 투자자도 있었다. 일부 누리꾼들은 \"지금이 매수 타이밍이다\" \"지금 대출받아서 몰빵 투자할 시기\" 등의 댓글을 달았다. 전날 증시는 미국 앤트로픽 상장에 따른 자금 쏠림과 인공지능(AI) 규제, 통화 긴축 우려가 맞물려 양대 시장의 매도 사이드카를 유발했다. 로이터통신에 따르면 20일(현지시간) 뉴욕증권거래소에서 다우지수는 전장보다 1.85% 하락한 4만8188.18에 거래를 마쳤다. S&P500지수는 3.59% 내린 6918.45를 기록했으며, 기술주 중심의 나스닥 종합지수는 5.13% 급락한 2만2654.15로 마감했다. 다우지수와 S&P500지수는 지난달 6일 기록한 최고 종가에서 각각 10% 이상 하락하면서 조정 국면에 진입했다. 나스닥 지수는 올해 연간 상승분을 모두 반납했다. 국내 증시에서는 반도체주가 급락했다. 삼성전자가 1만4400원(","category":"사회"},{"title":"반려견 목줄 풀었다고 멱살 잡고 욕설…50대에 벌금 300만원","link":"https://n.news.naver.com/mnews/article/666/0000133089","naverLink":"https://n.news.naver.com/mnews/article/666/0000133089","pubDate":"2026-11-21T10:59:39.267952+09:00","author":"네이버뉴스","description":"반려견 목줄 풀었다고 멱살 잡고 욕설…50대에 벌금 300만원. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"교육장관, 나흘 침묵 끝에 꺼낸 첫마디 \"사퇴하라면 해야죠\"","link":"https://n.news.naver.com/mnews/article/123/0002394539","naverLink":"https://n.news.naver.com/mnews/article/123/0002394539","pubDate":"2026-11-21T10:59:39.267951+09:00","author":"네이버뉴스","description":"교육장관, 나흘 침묵 끝에 꺼낸 첫마디 \"사퇴하라면 해야죠\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"검증 당일 짐 정리한 이진우…집주인에 \"탈출 도와달라\"","link":"https://n.news.naver.com/mnews/article/057/0001979209","naverLink":"https://n.news.naver.com/mnews/article/057/0001979209","pubDate":"2026-11-21T10:59:39.267948+09:00","author":"네이버뉴스","description":"검증 당일 짐 정리한 이진우…집주인에 \"탈출 도와달라\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"허리가 길어 슬픈 닥스훈트야 괜찮아… 디스크는 유전병이란다[멍냥멍냥 건강 백과]","link":"https://n.news.naver.com/mnews/article/020/0003764119","naverLink":"https://n.news.naver.com/mnews/article/020/0003764119","pubDate":"2026-11-21T10:59:40.892458+09:00","author":"네이버뉴스","description":"대한민국 전체 가구의 27.7%(약 626만 가구·농림축산식품부 ‘2025 반려동물 양육 현황 조사’ 등)가 개와 고양이를 반려동물로 키우는 시대다. TV와 유튜브 등에서 반려견이나 반려묘 훈육 이야기는 많이 보지만 무엇보다 중요한 건강 이야기는 찾아보기 쉽지 않다. 동아일보는 사단법인 대한수의사회(회장 우연철)의 도움을 받아 반려동물과 보호자가 건강하게 오랫동안 살아가는 방법을 연재한다. 강아지. 사진은 기사 내용과 직접적인 연관 없음. 두 살 된 반려견 닥스훈트를 키우는 A 씨는 최근 스스로 책망을 많이 한다. ‘아이’가 허리 디스크 수술을 받게 된 것이다. ‘너무 무리하게 뛰어놀도록 했어. 내가 잘못 키운 거야.’ 그러나 반려견이 평소에 잘 뛰어놀았다는 이유만으로 보호자가 자책할 일은 아니다. 닥스훈트는 허리 디스크가 어릴 때부터 퇴행하기 쉬운 유전적 소인이 있다. 다시 말해 디스크 일부가 빠져나와 척수를 누르거나 손상하는 장애를 일으킬 수 있는 유전병이 있다는 얘기다. 비숑 프리제, 웰시코기, 코커스패니얼, 코통 드 튈레아르에서도 닥스훈트처럼 디스크가 일찍 퇴행할 가능성과 관련된 유전 변이가 있다는 연구 보고가 있다. 물론 이 견종들 몸통이 길다는 이유만으로 같은 견종인 내 반려견에 디스크가 빨리 나타날지 판단할 수는 없다. 이런 견종이라도 디스크 초기에 병원을 찾으면 수술하지 않고 더 악화하지 않도록 만들 가능성이 커진다. 사람으로 따지면 가벼운 교통사고를 당해 전치 2~3주 츠러들어…겨울 우울감 날리는 음식 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107622","naverLink":"https://n.news.naver.com/mnews/article/296/0000107622","pubDate":"2026-11-21T10:59:40.892445+09:00","author":"네이버뉴스","description":"뇌 기능과 신경 전달 물질 생성에 영향 버섯은 혈당을 낮추는 성분과 프리바이오틱스를 함유하고 있어 기분을 안정시키는 데 도움이 되는 식품으로 꼽힌다. 사진=게티이미지뱅크 요즘처럼 날씨가 추워지고 낮이 짧아지는 초겨울에는 평소보다 우울감이나 무기력감이 심해질 수 있다. 단순히 기분 탓만은 아니다. 햇빛 노출 감소, 생체 리듬 변화, 뇌의 신경 전달 물질의 변화, 신체 활동 감소 등이 복합적으로 작용하기 때문이다. 특히 가을에서 겨울로 넘어가는 시기에는 계절성 우울증이 나타나거나 기존의 우울 증상이 악화될 수 있다. 이런 우울한 감정이나 저조한 기분은 대부분의 사람들에게서 발생하는 일반적인 문제다. 그런데 우울감이나 의욕이나 열정 상실 등을 겪고 있다면 평소 먹고 있는 것에 대해 다시 생각해볼 필요가 있다. 연구에 따르면 매일 먹는 음식과 생활 방식은 기분에 큰 영향을 준다. 또한 우울증이 있는 사람들은 그 증상을 더 악화시킬 수 있는 음식을 선택한다는 연구 결과도 있다. 하지만 다행인 것은 기분을 좋게 만드는 음식도 많다는 사실이다. 이런 음식들은 영양소가 풍부하고 기분을 향상시키는 신경 전달 물질을 생산하는 것을 돕는다. 미국 건강·의료 매체 '에브리데이 헬스(Everyday Health)' 등의 자료를 토대로 우울증 완화에 도움을 주는 식품을 정리했다. 호두 =식물 중에 오메가-3 지방산을 가장 많이 포함하고 있다. 각종 연구 결과 오메가-3 지방산은 뇌 기능을 지원하고 우울증 증상을 감소시키는 것으로 나타났다. 지난 세기 동안 서양 식단에서 오메가-3 지방산이 많이 들어 있는 식품이 사라지면서 정신 질환이 크게 증가했다는 연구 결과도 있다. 버섯 =버섯이 정신 건강에 좋은 두 가지 이유가 있다. 혈당을 낮추는 데 도움이 되는 성분이 있어 기분을 안정시키며, 장내 유익균의 먹이가 되는 성분인 프로바이오틱스가 들어있기 때문이다. 장에 있는 신경 세포는 정신을 온전하게 유지시키는 역할을 하는 신경 전달 물질인 세로토닌의 80~90%를 생산하기 때문에 장내 건강 상태가 중요하다. 양파 =양파를 비롯해 파, 마늘 등의 파속 식물은 몇 가지 암 위험을 줄이는 효능이 있다. 전문가들은 \"양파와 마늘을 자주 먹으면 소화관 계통의 암 발생 위험을 감소시킨다\"고 말한다. 이런 채소들은 또한 항염증 효능이 있는 플라보노이드 항산화제를 많이 함유하고 있다. 소화관과 뇌 사이의 연관성을 안다면 왜 장과 관련된 암을 막는 데 도움이","category":"생활·문화"},{"title":"“열량 부담 줄어든다” 김장 김치에 수육 대신 곁들일 3가지 음식","link":"https://n.news.naver.com/mnews/article/346/0000119239","naverLink":"https://n.news.naver.com/mnews/article/346/0000119239","pubDate":"2026-11-21T10:59:40.892442+09:00","author":"네이버뉴스","description":"수육·두부·문어·굴 등 단백질 식품과 잘 어울려 돼지고기는 기름기 적은 부위로, 굴은 충분히 익혀 먹어야 두부의 부드러운 식감과 담백한 맛이 김치의 매콤하고 짭짤한 맛을 완화하는 역할을 한다. /사진=챗 GPT 생성 이미지 김장철이 본격적으로 시작됐다. 갓 버무린 김치에 곁들여 먹는 수육은 이맘때 즐길 수 있는 계절 별미다. 수육 외에도 굴, 두부, 문어, 굴 등을 곁들이면 김치의 아삭한 식감을 살리면서 부족한 단백질을 보충할 수 있다. 갓 담근 김지와 함께 먹기 좋은 음식에 대해 알아본다. 갓 버무린 김치에 지 아낄 수 있게 됐다. 오픈AI가 개발자와 기업을 대상으로 AI 응답 완료 목표 시간을 선택하고, 기다릴 수 있는 시간에 따라 API(응용프로그램 인터페이스) 요금을 할인하는 기능을 도입했다. AI 응답을 늦게 받는 대신 비용을 줄이는 방식은 처음이 아니다. 구글과 앤스로픽은 이미 대량의 AI 작업을 한꺼번에 처리하면 요금을 50% 할인하는 서비스를 제공하고 있다. 중국 딥시크도 이용자가 적은 시간대에 요금을 낮춘 바 있다. AI 기업들의 경쟁이 모델 성능을 넘어 이용 요금과 처리 방식으로 확대되고 있다. 생성형 AI로 이미지 작성 2시간 선택하면 30% 할인…8시간은 40% 오픈AI는 17일(현지시간) 공식 개발자 문서를 통해 ‘백그라운드 모드(Background Mode)’에 응답 완료 목표 시간을 설정하는 ‘완료 기간(Completion Window)’ 기능을 추가했다고 밝혔다. 개발자는 AI에 작업을 요청하면서 결과를 최대한 빨리 받을지, 2시간 또는 8시간 이내에 받는 것을 목표로 할지 선택할 수 있다. 2시간 옵션을 선택하면 모델 토큰 요금이 30% 할인되고, 8시간 옵션을 선택하면 40% 할인된다. 빠른 응답을 선택하면 기존 요금이 적용된다. 예를 들어 기업이 오전에 접수된 고객 문의를 분석해 오후 회의에 활용하려면 2시간 옵션을 선택할 수 있다. 수백 건의 계약서나 내부 문서를 검토해 다음 날 아침까지 보고서를 작성하는 업무라면 8시간 옵션이 적합하다. 2시간과 8시간은 AI가 작업을 마치도록 설정한 목표 시간이다. 작업이 일찍 끝나면 결과도 빨리 받을 수 있지만, 목표 시간 내 완료가 보장되는 것은 아니다. 할인은 AI 모델의 입력·출력 토큰 요금에 적용되며, 별도 도구 이용료는 제외된다. 구글·앤스로픽은 이미 50% 할인…딥시크는 시간대별 요금 차등 AI 요청을 늦게 처리하는 대신 가격을 낮추는 방식은 주요 AI 기업들이 이미 도입했다. 앤스로픽은 2024년 10월 ‘메시지 배치 API(Message Batches API)’를 선보였다. 여러 AI 요청을 모아 비동기적으로","category":"생활·문화"},{"title":"김장하다 관절도 '파김치'…이 자세만큼은 피해라","link":"https://n.news.naver.com/mnews/article/421/0009302341","naverLink":"https://n.news.naver.com/mnews/article/421/0009302341","pubDate":"2026-11-21T10:59:40.429474+09:00","author":"네이버뉴스","description":"허리·무릎부터 손목까지 부담 가중…잘못된 자세가 근골격계 통증 키워 작업 자세 바꾸고 틈틈이 휴식…손 저림·다리 근력 저하 땐 전문의 진료 16일 오전 서울 송파구 가락시장 가락몰 하늘공원에서 열린 '가락시장 김장나눔 시민대축제'에서 아이들이 김장을 담그고 있다. ⓒ 뉴스1 (서울=뉴스1) 천선휴 기자 = 본격적인 김장철이 시작되면서 겨울 먹거리를 준비하는 손길이 분주해지고 있다. 배추를 나르고 씻고 양념을 버무리는 과정은 생각보다 많은 체력이 필요하다. 무거운 배추와 김치통을 들 때는 허리에, 바닥에 쪼그려 앉아 속을 채울 때는 무릎에, 양념을 버무리고 재료를 손질할 때는 손목과 엄지 관절에 부담이 집중된다. 평소 허리나 관절이 좋지 않은 사람이라면 김장 후 통증이 심해질 수 있어 작업 자세와 시간을 조절하는 것이 중요하다. 특히 김장할 때는 허리를 숙이거나 무릎을 깊게 굽힌 자세를 오래 유지하고, 손목과 엄지에 힘을 주는 동작을 반복하기 쉽다. 한 번의 김장으로 퇴행성 질환이 생기는 것은 아니지만 기존에 있던 관절 질환을 악화시키거나 근육과 힘줄에 무리를 줄 수 있다. 쪼그려 앉고 허리 숙이는 자세, 무릎·허리에 부담 21일 의료계에 따르면 김장할 때 가장 주의해야 할 것은 작업 자세다. 특히 바닥에 쪼그려 앉아 작업하면 무릎이 깊게 굽혀진 상태에서 체중을 지탱하게 돼 무릎 관절에 가해지는 압박이 커진다. 무릎 골관절염이 있거나 평소 통증을 느끼는 사람은 증상이 악화할 수 있다. 김동환 강동경희대학교병원 재활의학과 교수는 \"바닥에 쪼그려 앉으면 무릎이 깊게 굽혀진 상태에서 체중을 지탱하게 돼 무릎 관절에 부담이 커진다\"며 \"특히 무릎 골관절염이 있거나 평소 통증을 느끼는 사람은 증상이 악화할 수 있어 주의해야 한다\"고 설명했다. 양반다리로 앉아 김장하는 자세도 허리에 부담을 줄 수 있다. 바닥에 놓인 배추와 양념을 향해 상체를 숙인 채 속을 버무리다 보면 허리와 등 근육이 긴장하기 쉽다. 여기에 몸을 비틀거나 무거운 재료를 반복해서 옮기면 허리 근육과 주변 조직에 부담이 쌓여 요통이 발생하거나 기존 통증이 심해질 수 있다. 김 교수는 \"허리를 숙인 상태에서 몸을 비틀거나 무거운 재료를 반복해서 옮기는 동작도 피하는 것이 좋다\"고 말했다. 배추 버무리다 엄지 뿌리 통증…퇴행성관절염 의심 손과 손목도 김장 후유증을 겪기 쉬운 부위다. 배추를 씻고 양념을 버무리거나 재료를 손질하는 과정에서 손목과 엄지손가락에 힘","category":"생활·문화"},{"title":"\"화웨이 초슬림 스마트워치, 이렇게 생겼다\"","link":"https://n.news.naver.com/mnews/article/092/0002446300","naverLink":"https://n.news.naver.com/mnews/article/092/0002446300","pubDate":"2026-11-21T10:59:40.429444+09:00","author":"네이버뉴스","description":"화웨이 워치 에어, 24일 폴더블폰 등과 함께 공개될 예정 화웨이가 조만간 선보일 차세대 스마트워치의 렌더링 이미지가 공개돼 주목된다. IT매체 폰아레나는 최근 IT 팁스터 디지털챗스테이션이 공개한 화웨이의 신형 스마트워치 ‘워치 에어’의 렌더링 이미지를 보도했다. 해당 팁스터는 렌더링 이미지와 함께 워치 에어의 주요 사양도 웨이보를 통해 공개했다. 베젤 두께 1.4㎜…세련된 디자인 적용 화웨이 워치에어는 1.92인치 정사각형 AMOLED 디스플레이를 탑재하며, 베젤 두께는 1.4㎜에 불과하다. 애플워치와 비교하면 상당히 얇은 수준이다. 애플워치12의 베젤 두께는 2.8㎜이며, 역대 애플워치 중 베젤이 가장 얇았던 애플워치7•8•9도 1.7㎜ 수준이다. 화웨이의 차세대 스마트워치 ‘워치 에어’의 렌더링이 공개됐다. (사진=디지털챗스테이션 웨이보) 화면 대 본체 비율은 86%로 다른 제품에 비해 높은 수준에 속한다. 디스플레이에는 LTPO 2.0 기술이 적용돼 최대 3500니트의 밝기를 지원할 것으로 알려졌다. 소재도 눈길을 끈다. 화웨이는 광택 있는 알루미늄의 고급스러운 외관에 티타늄의 견고함과 가벼운 무게를 결합한 새로운 고광택 티타늄 합금을 워치 에어에 적용한 것으로 전해졌다. 또, 회전식 크라운과 측면 버튼을 갖췄다. 화웨이의 스마트워치 제품군인 워치핏 시리즈와 마찬가지로 마이크가 내장된 돌출부도 확인된다. 전체적으로 날카로운 모서리 대신 부드러운 곡선 디자인을 적용해 세련된 외관을 완성했다. 초슬림 디자인에 강력한 배터리 성능도 기대 앞서 유출된 정보에 따르면 워치 에어의 두께는 6.9㎜, 무게는 27g에 불과해 역대급 초슬림·초경량 디자인을 구현할 것으로 예상된다. 배터리 성능도 기대를 모은다. 화웨이의 실리콘 적층 배터리 기술이 적용돼 한 번 충전으로 최소 5~6일간 사용할 수 있을 것으로 전망된다. 건강 관리와 피트니스 기능 역시 화웨이 워치6와 워치 GT 7 프로의 주요 기능을 두루 지원해 강력한 웨어러블 기기가 될 것으로 예상된다. 화웨이는 워치 에어를 오는 24일 폴더블 스마트폰 '메이트 X8', 애플 아이폰 에어의 경쟁 모델로 꼽히는 '메이트 90 에어'와 함께 공개할 예정이다. 해당 매체는 화웨이가 '에어' 브랜드 전략에 공을 들이고 있다며, 앞으로도 얇고 가벼운 디자인을 강조한 제품을 잇달아 선보일 것으로 전망했다.","category":"생활·문화"},{"title":"\"GTA6 하지 말고 학교 오세요\"…학생 붙잡으려 상품권 내건 교장","link":"https://n.news.naver.com/mnews/article/015/0005356360","naverLink":"https://n.news.naver.com/mnews/article/015/0005356360","pubDate":"2026-11-21T10:59:40.429432+09:00","author":"네이버뉴스","description":"출시일 결석 우려에 등교 학생 대상 경품 추첨 학교 미니버스로 결석생 데리러 나선 곳도 사진=AFP 세계적인 기대작 '그랜드 테프트 오토 VI(GTA6)'가 출시되자 영국 학교들이 학생들의 '게임 결석'을 막기 위한 이색 대책을 내놨다. 정상 등교한 학생에게 게임기 상품권을 주는가 하면 결석생을 학교 미니버스에 태워 등교시키는 학교까지 등장했다. 19일(현지시간) BBC와 UPI 등 외신에 따르면 북아일랜드 벨파스트의 남학교인 '벨파스트 보이스 모델 스쿨'은 GTA6 출시일인 이날과 이튿날 모두 등교한 학생을 대상으로 경품 추첨을 진행하기로 했다. 경품은 플레이스테이션이나 엑스박스에서 사용할 수 있는 70파운드 상당의 상품권이다. 모두 두 명을 뽑는다. 학교는 학부모들에게 보낸 안내문에서 \"GTA와 같은 활동은 주말까지 기다릴 수 있다\"며 정상 등교를 당부했다. 학교가 결석 방지에 나선 것은 게임 출시일이 중등교육자격시험(GCSE) 수학 시험과 겹쳐서다. 11학년 전체와 12학년 일부 학생이 이날 수학 시험을 치를 예정이었다. 메리 몽고메리 교장은 \"가장 중요한 것은 학생들이 학교에 나와 최선을 다해 시험을 치르도록 독려하는 것\"이라며 \"최근 몇 년 동안 GCSE 성적이 좋았고 이러한 성과를 이어가고 싶다\"고 말했다. 상품권을 내건 아이디어에는 학생들의 의견도 반영됐다. 학생들은 당초 GTA6 게임 자체를 경품으로 달라고 요구했지만 학교 측은 해당 게임이 18세 이상 이용 가능 등급이라는 이유로 거절했다. 대신 게임기에서 사용할 수 있는 상품권을 경품으로 정했다. 영국 내 다른 학교들도 비슷한 대책을 내놨다. 더럼주 비숍오클랜드에 있는 세인트존스 가톨릭학교는 출시일에 온종일 출석한 학생 가운데 한 명을 추첨해 65파운드 상당의 아마존 상품권을 주기로 했다. 버밍엄의 나인스타일스 아카데미는 한발 더 나갔다. 학교 미니버스를 지역사회로 보내 결석한 학생을 직접 태워오고, 한 주 동안 출석률 100%를 달성한 학생을 대상으로 상품권 추첨을 진행했다. 모의고사 일정도 GTA6 출시 주간까지 연장했다. 학교들이 GTA6 출시에 민감하게 반응한 것은 전작 출시 당시의 경험도 영향을 미친 것으로 보인다. 2013년 GTA5가 출시됐을 때 직장인과 학생들의 병가·결석이 늘었다는 보도가 나오면서 이른바 'GTA 독감(GTA flu)'이라는 표현까지 등장했다. 영국 학교·대학지도자협회는 \"학교는 학습과 성과에 출석이 얼마나 중요","category":"생활·문화"},{"title":"AI 시대에 빛난 게임의 '공감'…IP·유저가 함께 쓰는 사회공헌[지스타2026]","link":"https://n.news.naver.com/mnews/article/277/0005845782","naverLink":"https://n.news.naver.com/mnews/article/277/0005845782","pubDate":"2026-11-21T10:59:40.429427+09:00","author":"네이버뉴스","description":"호요버스·스마일게이트 사회공헌 성과 공유 한강공원 '원신 숲'·'유저 참여형' 기부 전환 게임 IP, 온라인 재미 넘어 선한 영향력 입증 올해 5회를 맞이한 '2026 플레이 펀앤굿 포럼'이 20일 부산 벡스코 지스타 현장에서 열렸다. '게임+컨버전스'를 주제로 한 이날 포럼에서 호요버스코리아와 스마일게이트는 인공지능(AI) 확산 속 기술이 대체할 수 없는 인간 고유의 가치인 '공감'과 '연대'를 지식재산권(IP)으로 풀어낸 사회공헌 사례들을 공유했다. 정주희 호요버스코리아 매니저가 20일 부산 벡스코에서 열린 '2026 플레이 펀앤굿' 포럼에서 '게임 IP와 함께 만드는 숲'을 주제로 사례를 발표하고 있다. 노경조 기자 게임 속 세계관이 현실 숲으로…호요버스의 '원신 숲 프로젝트' 첫 번째 발제자로 나선 정주희 호요버스코리아 매니저는 '게임 IP와 함께 만드는 숲'을 주제로 온라인상의 게임 경험을 오프라인 환경 실천으로 확장한 사례를 소개했다. 정 매니저는 \"AI 기술이 발전해도 기후 위기 같은 사회 문제는 여전히 남아 있으며, 이를 움직이는 연료는 결국 공감\"이라며 \"현대 사회 청년들 사이에서 가장 큰 공감 매개체인 게임 IP의 힘을 사회적 실천으로 연결하고자 했다\"고 기획 의도를 밝혔다. 앞서 호요버스는 지난 8월 2주간 게임 '원신' 속 지혜의 도시 '수메르'와 세계수에서 영감을 얻어 서울 양화한강공원에 실제 숲을 조성하는 프로젝트를 추진했다. 실행력을 높이기 위해 플랫폼 '당근'과 협업했다. 정 매니저는 \"'당근'의 동네 걷기 서비스와 연계해 챌린지를 진행한 결과 53만명이 참여해 목표치(1억 걸음)를 6200% 초과한 63억 걸음을 기록했다\"며 \"이는 약 616톤의 탄소 저감 효과로 이어졌다\"고 설명했다. 이어 9월에는 스마일게이트 희망스튜디오와 손잡고 굿즈 자선 펀딩을 진행해 식재 기금을 마련했으며, 오프라인 나무 심기 봉사에는 100명 모집에 681명이 몰리는 등 뜨거운 호응을 얻었다고 전했다. 그는 \"더위에도 코스프레를 하고 직접 나무를 심은 이용자들 덕분에 '원신 숲'이 문을 열었다\"며 \"서울 한강공원 최초로 게임사가 조성한 이 숲에는 황매화·매화나무·산수유 등 4010그루가 식재돼 연간 약 2.67톤의 탄소를 흡수한다\"고 말했다. 그러면서 \"사회적 실천을 일으키는 힘은 공감을 통한 자발적 힘이라는 것을 다시 한번 느낄 수 있었다\"며 \"온라인 참여가 오프라인 실천을 거쳐 다시 온라인 이야기로","category":"생활·문화"}],"세계":[{"title":"[지금, 명의] “폐암 2㎝ 이하라면 폐 일부만 절제…정상 폐 최대한 살린다”","link":"https://n.news.naver.com/mnews/article/011/0004684567","naverLink":"https://n.news.naver.com/mnews/article/011/0004684567","pubDate":"2026-11-21T10:59:40.429470+09:00","author":"네이버뉴스","description":"■가톨릭대 서울성모병원 심장혈관흉부외과 문영규 교수 초기 폐암, 수술로 완치 기대 2㎝ 이하 폐암, 폐 일부만 절제 가능 복잡 폐 구역 절제술로 정상 폐 조직 보존 단일공 흉강경 수술, 통증·신경 손상 줄여 폐 구역 절제술, 회복 빨라 일상 복귀 앞당겨 문영규 서울성모병원 심장혈관흉부외과 교수는 “폐암은 조기에 발견하면 수술로 완치를 기대할 수 있다”며 “최근에는 암을 완전히 제거하면서도 정상 폐 조직을 최대한 보존하는 수술이 가능해졌다”고 말했다./서울경제TV ‘지금 명의’ 캡처 폐암은 갑상선암 다음으로 많이 발생하는 암이다. 조기에 발견해 수술받으면 완치를 기대할 수 있지만, 평생 숨쉬기가 힘들어진다고 생각하는 사람이 많다. 폐는 한 번 잘라내면 다시 자라지 않는 장기이기 때문. 그동안 폐암 수술은 암이 생긴 폐엽 전체를 제거하는 방식이 표준이어서 폐 기능 저하에 대한 부담이 컸다. 하지만 이제는 달라지고 있다. 크기가 2㎝ 이하인 일부 초기 폐암은 ‘폐엽’ 전체가 아닌 암이 있는 ‘구역’만 정밀하게 제거할 수 있다. 암은 완전히 제거하면서 건강한 폐는 최대한 살리는 것이다. 21일 저녁 9시 25분 서울경제TV ‘지금, 명의’에 출연한 가톨릭대 서울성모병원 심장혈관흉부외과 문영규 교수는 “폐암은 조기 발견이 가장 중요하다”며 “1기 초기에 발견하면 수술로 90% 이상의 완치율도 기대할 수 있고, 정상 폐를 최대한 보존할 수 있다”고 말했다. ◇폐암, 늦게 발견되지만 초기라면 완치 가능성 폐암의 사망률이 높은 가장 큰 이유는 조기 발견이 어렵기 때문이다. 폐암을 조기에 발견할 수 있는 흉부 CT 검사는 일반 건강검진의 기본 항목이 아니다. 더욱이 폐는 통증을 느끼기 어려운 장기로, 암이 상당히 커져도 별다른 증상이 없는 경우가 많다. 실제 폐암 진단 당시 이미 뇌나 간, 뼈 등 다른 장기로 전이된 환자가 40% 이상에 달한다. 하지만 조기에 발견해 수술할 수 있다면 완치도 기대할 수 있다. 폐암은 기본적으로 1~2기가 주요 수술 대상이며, 일부 3기 환자도 수술이 가능하다. 특히 3기 일부 환자는 항암치료나 면역항암치료로 암의 크기와 전이 병변을 줄인 뒤 수술을 시행하기도 한다. 폐는 오른쪽 3개, 왼쪽 2개 폐엽으로 구성. 폐엽절제술은 폐암이 발생한 폐엽 전체를 절제하는 표준 수술법. /서울경제TV ‘지금 명의’ 캡처","category":"세계"},{"title":"트럼프 “미중러 회담서 ‘한반도 위험 대응’ 논의했다” 직접 확인","link":"https://n.news.naver.com/mnews/article/081/0003701741","naverLink":"https://n.news.naver.com/mnews/article/081/0003701741","pubDate":"2026-11-21T10:59:39.967707+09:00","author":"네이버뉴스","description":"“시진핑·푸틴과 한반도 위험 대응 논의” 시진핑(가운데) 중국 국가주석과 도널드 트럼프(오른쪽) 미국 대통령, 블라디미르 푸틴(왼쪽) 러시아 대통령이 19일(현지시간) 중국 광둥성 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의를 계기로 3자 정상회담을 하기 위해 회담 장소인 기린산장(麒麟山莊)에 도착하고 있다. 2026.11.19 AFP 연합뉴스 백악관 기자회견서 “한반도 위험 대응·우크라 살상 중단 논의” 中 발표 이어 트럼프도 직접 확인…북핵·비핵화 구체적 언급 없어 “중국, 첫 3자 핵위험 감축 논의 동의”…핵무기 절반 감축엔 난색 도널드 트럼프 미국 대통령이 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령과의 사상 첫 3자 정상회담에서 한반도 안보 문제를 논의했다고 직접 밝혔다. 중국이 앞서 한반도 문제가 회담 의제에 포함됐다고 발표한 데 이어 트럼프 대통령도 이를 확인한 것이다. 트럼프 대통령은 20일(현지시간) 백악관에서 기자회견을 열고 전날 중국 선전에서 열린 미중러 정상회담과 관련해 “한반도의 위험에 대응하고 우크라이나에서 살상을 중단하는 문제도 논의했다”고 말했다. 앞서 중국 관영 신화통신은 19일 미중러 정상이 우크라이나 전쟁과 핵확산 방지, 중동 정세, 한반도 문제 등 주요 국제·지역 현안에 관해 의견을 교환했다고 보도한 바 있다. 트럼프 대통령이 언급한 ‘한반도의 위험’은 북한 핵·미사일 위협을 염두에 둔 것으로 해석된다. 다만 북한이나 한반도 비핵화를 직접 거론하지는 않았으며, 세 정상이 어떤 대응 방안을 논의했는지도 구체적으로 밝히지 않았다. 원탁 테이블에 앉은 미중러 - 블라디미르 푸틴(왼쪽) 러시아 대통령과 시진핑(가운데) 중국 국가주석, 도널드 트럼프(오른쪽) 미국 대통령이 19일(현지시간) 중국 광둥성 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의를 계기로 원형 탁자에 마주 앉아 사상 첫 미중러 3자 정상회담을 하고 있다. 선전 로이터 연합뉴스","category":"세계"},{"title":"“미녹시딜 압도” 빗질만 했을 뿐인데 머리카락 풍성…탈모 잡는 전자 빗","link":"https://n.news.naver.com/mnews/article/011/0004684574","naverLink":"https://n.news.naver.com/mnews/article/011/0004684574","pubDate":"2026-11-21T10:59:39.967706+09:00","author":"네이버뉴스","description":"기사 내용과 무관한 사진. 클립아트코리아 탈모 인구 증가세 속 탈모 부위의 모발 재생을 돕는 전자 빗이 개발돼 화제다. 빗질할 때 두피에 전기자극을 주고, 모발 성장을 돕는 치료 물질을 피부 깊숙이 전달하는 방식이다. 생쥐 실험에서는 한 달 만에 탈모 부위의 약 98%가 새로 자란 털로 덮여 기존 탈모 치료제보다 높은 효과가 나타났다. 최근 홍콩 사우스차이나모닝포스트(SCMP)에 따르면 중국 베이항대와 홍콩시립대 공동 연구진은 전기자극과 약물 전달 기능을 결합한 탈모 치료용 전자 빗 ‘디탱글(Detangle)’을 개발했다. 연구 결과는 국제학술지 ‘네이처 커뮤니케이션스’에 발표됐다. 디탱글은 빗질할 때 발생하는 전기 펄스로 모낭을 자극하고, 치료 물질이 피부 깊숙이 침투하도록 돕는다. 치료 물질은 피부 표면에서 약 0.66㎜ 깊이까지 전달됐다. 일반적인 피부 표면 도포 방식보다 약 9배 깊은 수준이다. 빗에는 두 종류의 치료 물질이 들어 있다. 하나는 모낭 주변에 새로운 혈관이 만들어지도록 도와 혈액 공급을 늘린다. 또다른 하나는 모낭을 위축시켜 탈모를 유발하는 호르몬의 생성을 줄인다. 전기자극은 두 치료 물질이 모낭 세포 안으로 더 잘 전달되도록 돕는다. 연구진이 탈모를 유도한 생쥐에 사흘마다 전자 빗을 사용한 결과, 28일 뒤 털을 제거한 부위의 97.85%가 새로 자란 털로 덮였다. 반면 기존 탈모 치료제인 미녹시딜을 바른 생쥐는 약 70%, 피나스테리드를 투여한 생쥐는 약 50%에 그쳤다. 아무런 치료를 받지 않은 생쥐는 털이 다시 자란 부위가 약 1%에 그쳤다. 디탱글 전자 빗을 사용한 생쥐에서는 모낭 수와 혈류량도 함께 증가했다. 모낭 주변 혈관과 관련된 지표도 개선됐다. 연구진은 전기자극과 치료 물질을 병행했을 때 모발 재생 효과가 가장 컸다고 설명했다. 다만 이번 연구는 생쥐를 대상으로 한 동물실험으로, 사람에게도 같은 효과가 나타날지는 아직 확인되지 않았다. 사람을 대상으로 한 임상시험 계획이나 제품 출시 일정도 공개되지 않았다. 연구진은 이 장치의 약물 전달 기술이 탈모뿐 아니라 다른 질환 치료에도 활용될 가능성이 있다고 봤다. 세계인의 고민 ‘탈모’ 국내 탈모 인구는 증가세를 보이고 있다. 국민건강보험공단에 따르면 국내 탈모 인구는 잠재적으로 약 1000만명에 달하는 것으로 추산된다. 국회 보건복지위원회 김선민 의원실이 건강보험심사평가원에서 제출받은 자료에 따르면 탈모증 진료인원은 2022년","category":"세계"},{"title":"앤트로픽 수학자 \"최대 난제 리만 가설 증명했다\"","link":"https://n.news.naver.com/mnews/article/003/0014336984","naverLink":"https://n.news.naver.com/mnews/article/003/0014336984","pubDate":"2026-11-21T10:59:39.967701+09:00","author":"네이버뉴스","description":"앤트로픽 수학자 \"최대 난제 리만 가설 증명했다\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프 \"중국에 구형 칩만 판매…안팔면 中 스스로 만들것\"(종합)","link":"https://n.news.naver.com/mnews/article/001/0016455502","naverLink":"https://n.news.naver.com/mnews/article/001/0016455502","pubDate":"2026-11-21T10:59:39.967698+09:00","author":"네이버뉴스","description":"트럼프 \"중국에 구형 칩만 판매…안팔면 中 스스로 만들것\"(종합). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"비트코인 4달 만에 6만달러 아래로…2022년 이후 최장 약세","link":"https://n.news.naver.com/mnews/article/374/0000545039","naverLink":"https://n.news.naver.com/mnews/article/374/0000545039","pubDate":"2026-11-21T10:59:39.967694+09:00","author":"네이버뉴스","description":"장중 5만8천달러대로 추락…ETF 자금 순유출·앤트로픽 IPO 가상화폐 시가총액 1위 비트코인이 4개월 만에 다시 6만 달러선 아래로 무너졌습니다. 20일(현지시간) 미국 가상화폐 거래소 코인베이스에 따르면 비트코인 1개 가격은 미 동부시간 낮 12시 24시간 전보다 4.7% 떨어져 5만9천467달러선을 오르내리고 있습니다. 비트코인 가격은 오전 11시 5만8천678.48달러까지 떨어졌다 낙폭을 일부 회복했지만, 1주일 전과 비교해 약 14% 하락했고, 사상 최고가를 기록한 지난해 10월의 12만6천210.5달러와 견주면 절반에도 못 미치고 있습니다. 이에 비트코인은 7주 연속 하락세를 이어가며 테라·루나 붕괴 사태 등으로 8주 연속 내림세를 이어갔던 2022년 이후 최장기간 약세를 기록하게 됐습니다. 비트코인 약세는 기관 자금의 유출이 표면적인 주요 원인으로 지목됐다고 블룸버그 통신이 보도했습니다. 비트코인 현물 ETF에서는 전날 하루만 5억8천200만 달러(약 7천800억원) 자금이 순유출됐으며, 이 가운데 상당 부분인 5억4천110만 달러는 블랙록의 '아이셰어즈 비트코인 트러스트'(IBIT)에서 빠져나갔습니다. 지난달 30일 이후 비트코인 ETF에서 빠진 자금은 41억 달러에 달합니다. 이와 같은 기관과 ETF 자금 움직임에는 미국 연방준비제도(Fed·연준) 금리 인상 우려와 전날 앤트로픽의 대규모 기업공개(IPO)로 인한 자금 이탈 등이 자리 잡고 있다고 전문가들은 바라봤습니다. 여기에 지난달 발생한 바이낸스 해킹 사건과 미 상원에서 가상자산 규제 체계 법안 '클래리티법' 처리가 무산된 여파도 불확실성을 가중한 것으로 시장은 보고 있습니다. 가상화폐 시총 2위 종목 이더리움도 비트코인과 비슷한 움직임을 보이며 낮 12시 기준 24시간 전보다 6.5% 급락한 1천643.6달러를 기록했습니다. 당신의 제보가 뉴스로 만들어집니다. SBS Biz는 여러분의 제보를 기다리고 있습니다. 홈페이지 = https://url.kr/9pghjn","category":"세계"},{"title":"트럼프 \"한국 등에 자동차산업 빼앗겨\"…관세 효과 또 자찬","link":"https://n.news.naver.com/mnews/article/018/0006413435","naverLink":"https://n.news.naver.com/mnews/article/018/0006413435","pubDate":"2026-11-21T10:59:39.967665+09:00","author":"네이버뉴스","description":"APEC 귀국 회견서 \"아우디·도요타 美에 공장\" 7월·8월·10월 이어 한국 거듭 거론 韓 車관세 15%…현대차 260억달러 대미 투자 [이데일리 신수정 기자] 도널드 트럼프 미국 대통령이 독일·일본·한국·캐나다·멕시코에 미국 자동차 산업을 “도둑맞았다”며 자동차 회사들이 미국으로 돌아오고 있다고 주장했다. 관세 덕분에 미국 내 공장 건설이 늘고 있다고 자평하면서 한국을 다시 자동차 산업을 가져간 나라로 꼽았다. 지난 17일 마닐라에서 열린 제49차 동남아시아국가연합(ASEAN) 정상회의에서 도널드 트럼프 미국 대통령이 공식 만찬 자리에서 연설하고 있다. (사진=AFP) 트럼프 대통령은 20일(현지시간) 백악관 기자회견에서 “자동차 회사들이 모두 돌아오고 있다”며 “독일에서 일본, 한국, 캐나다, 멕시코에 이르기까지 다른 나라들이 우리에게서 훔쳐 간 것”이라고 말했다. 이어 “아무도 본 적 없는 규모로 모두 돌아오고 있다”고 덧붙였다. 이날 회견은 중국 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의를 비롯한 아시아 순방을 마친 뒤 열렸다. 트럼프 대통령은 순방 기간 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령과 3자 회동을 했다. 트럼프 대통령은 관세 때문에 미국에 수천 개 공장이 지어지고 있다고 주장했다. 그는 기업들이 관세를 내지 않으려고 미국으로 들어온다며 “아우디는 40억달러(약 5조 3000억원) 규모 공장을 발표했고 도요타는 50억달러(약 6조 7000억원) 규모 공장을 짓고 있다”고 말했다. 제너럴모터스(GM)와 포드도 생산을 늘리고 있다고 했다. 문을 닫을 뻔했던 포드 디트로이트 공장이 지금은 주 7일 24시간 돌아간다고도 말했다. 트럼프 대통령이 한국을 자동차 산업을 빼앗아 간 나라로 지목한 것은 이번이 처음이 아니다. 그는 지난달 25일 폭스뉴스 인터뷰에서 일본·한국·중국이 미국 자동차 산업을 잠식했다며 “모두 되찾고 있다”고 말했다. 같은 인터뷰에서 미국 제도를 악용하는 기업에는 관세를 최대 50%까지 올릴 수 있다고 경고했다. 8월 5일 네바다주 라스베이거스 연설에서는 “독일, 한국, 일본, 캐나다, 멕시코 등 전 세계에서 기업들이 돌아오고 있다”고 했다. 트럼프 대통령은 지난해 4월 수입 자동차에 25% 관세를 매겼다. 당시 백악관은 한미 자유무역협정(FTA)을 개정했는데도 자동차·부품 수입에 따른 안보 위협이 줄지 않았다고 주장했다. 피터 나바로 백악관 무역·제조업","category":"세계"},{"title":"트럼프 “미·중·러 정상회담서 한반도 위험 대응 논의”","link":"https://n.news.naver.com/mnews/article/023/0004010936","naverLink":"https://n.news.naver.com/mnews/article/023/0004010936","pubDate":"2026-11-21T10:59:39.967659+09:00","author":"네이버뉴스","description":"“푸틴, 외교적 전쟁 종식 원해” 편들기 이란 협상 두고 “받아들이기 어려워” 도널드 트럼프 미국 대통령이 지난 19일 중국 선전에서 열린 역사상 최초 미·중·러 3자 정상회담에서 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령과 한반도 문제를 논의했다고 20일(현지 시각) 밝혔다. 도널드 트럼프 미국 대통령이 20일(현지 시각) 백악관에서 기자회견을 하고 있다./EPA 연합뉴스 심도 있는 논의 오가지는 않은 듯 트럼프는 이날 백악관에서 아시아 순방 성과를 설명하는 기자회견을 열고 “우리는 한반도의 위험에 대응하고 우크라이나에서 벌어지는 살상을 멈추는 문제에 관해 얘기했다”고 밝혔다. 앞서 미·중·러 정상회담 직후 중국 관영 CCTV가 우크라이나 전쟁과 핵 확산 방지, 중동 정세, 한반도 문제 등에 관해서도 논의가 이뤄졌다고 보도한 바 있는데, 트럼프도 이를 확인한 것이다. 트럼프는 회담에서 논의한 ‘한반도의 위험’이 구체적으로 어떤 것인지, 그 위험에 대응하기 위해 어떤 대화를 나눴는지는 밝히지 않았다. 핵군축 논의를 소개하는 과정에서 언급된 점으로 미뤄 북핵 문제가 다뤄졌을 것으로 풀이된다. 다만 트럼프가 “우크라이나 문제에 많은 시간을 할애했다”고 밝힌 만큼 80여 분간 진행된 회담에서 심도 있는 논의가 오가지는 않았을 것으로 보인다. 트럼프 “푸틴, 외교적 수단으로 전쟁 종식 원해” 선전 회담의 핵심이었던 우크라이나 전쟁에 대해 트럼프는 “푸틴은 우크라이나 전쟁이 외교적 수단을 통해 종식되기를 바란다는 뜻을 분명히 밝혔다”며 밀착하는 모습을 보였다. 그러나 트럼프는 “하지만 이는 힘들다. 문제는 볼로디미르 젤렌스키 우크라이나 대통령과 푸틴이 서로를 엄청나게 증오한다는 점인데 해결이 절대 쉽지 않다”고 했다. 유럽 정상들의 거센 반발을 부른 “푸틴은 내 친구” 발언과 관련, 트럼프는 ‘푸틴이 미국의 친구라고 생각하느냐’는 기자 질문에 “미국에 대해선 (그렇다고) 말할 수 없다”고 한발 물러서는 모습을 보였다. 다만 그는 러시아가 미국에 이어 최다 핵무기 보유국인 점에서 푸틴과 “환상적인 관계를 가진 건 좋은 일”이라고 했다. 앞서 도날트 투스크 폴란드 총리는 “푸틴은 우리 친구가 아니며, 앞으로도 결코 아닐 것”이라며 전쟁 당사국인 우크라이나를 배제한 트럼프와 푸틴의 만남을 강하게 비판한 바 있다. “이란, 내가 받아들일 수 있는 합의 원치 않아” 트럼프는 한반도 위험 언급에 앞서 “우리는 이란이 결","category":"세계"},{"title":"유럽, 미중러 정상회담에 경계감…\"우크라 없는 종전협상 안 돼\"","link":"https://n.news.naver.com/mnews/article/003/0014335300","naverLink":"https://n.news.naver.com/mnews/article/003/0014335300","pubDate":"2026-11-21T10:59:39.967632+09:00","author":"네이버뉴스","description":"유럽, 미중러 정상회담에 경계감…\"우크라 없는 종전협상 안 돼\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"여자친구 출신 걸그룹, 차가원 회사 상대 전속계약 분쟁 승소","link":"https://n.news.naver.com/mnews/article/215/0001273465","naverLink":"https://n.news.naver.com/mnews/article/215/0001273465","pubDate":"2026-11-21T10:59:39.267934+09:00","author":"네이버뉴스","description":"소속사 대표, 300억대 사기 혐의로 별도 재판 중 사진=언코어 걸그룹 여자친구 출신 멤버 3명이 정산금을 받지 못했다며 전 소속사 빅플래닛메이드엔터를 상대로 낸 전속계약 해지 소송에서 승소했다. 21일 법조계에 따르면 서울중앙지법 민사합의18부(류승우 부장판사)는 지난 3일 비비지 멤버 은하(정은비)·신비(황은비)·엄지(김예원)가 빅플래닛메이드엔터를 상대로 낸 전속계약 무효 확인 및 정산금 청구 소송에서 원고 승소 판결을 내렸다. 빅플래닛메이드엔터의 대표는 차가원씨다. 재판부는 전속계약이 이미 해지된 상태라고 보고, 밀린 정산금을 지연이자까지 포함해 지급하라고 했다. 세 멤버는 빅플래닛메이드엔터가 2025년 4분기 정산금 총 3억3,870만원을 지급하지 않고 새 앨범 발매 준비를 전면 중단했다고 주장하며, 지난 3월 전속계약 해지 의사를 통보한 뒤 4월 소송을 제기했다. 재판부는 해지 의사표시가 있었던 당시 이미 전속계약의 기초인 신뢰관계가 무너졌다고 보는 것이 타당하다며, 그 의사표시가 피고 측에 도달한 3월 4일자로 계약이 해지된 것으로 판단했다. 또한 \"가수의 음원 발매, 공연, 광고 촬영 등과 같은 연예 활동은 물품과 같이 재고를 쌓아뒀다가 언제든 수요가 있을 때 공급할 수 있는 것이 아니고 가수의 당시 나이, 인지도 등에 따라 가능한 연예활동 범위가 달라지기도 한다\"고 짚었다. 연예인에게 수요가 있을 때 적절한 수준의 매니지먼트를 제공하는 것이 전속계약의 핵심이라는 취지다. 재판부는 또 비비지가 지난 1월께 타이틀곡 녹음까지 마치고 2월께 앨범 재킷 촬영을 앞두고 있었는데도, 빅플래닛메이드엔터가 사전 설명 없이 앨범 발매 전면 중단을 일방적으로 통보했다고 지적했다. 빅플래닛메이드엔터가 2023~2024년께 완전자본잠식 상태에 빠졌고 현재도 경영난으로 존속 자체가 불투명해 보이는 만큼, 멤버들이 매니지먼트 제공 가능성에 의문을 가진 것도 타당하다고 봤다. 은하, 신비, 엄지는 2015년 걸그룹 여자친구로 데뷔해 큰 인기를 얻었고, 이후 빅플래닛메이드엔터와 전속계약을 맺어 2022년 2월 비비지로 재데뷔했다. 지난 6월 전속계약 효력정지 가처분 신청이 법원에서 받아들여진 이후 가요 기획사 언코어와 새 전속계약을 체결했다. 한편 빅플래닛메이드엔터 대표 차가원씨는 300억원대 사기 혐의로 기소돼 1심 재판을 받고 있다. 빅플래닛메이드엔터와 관계사 소속 아티스트인 더보이즈, 이승기, 이무진, 엑소 첸·백현·시","category":"세계"}],"IT 과학":[{"title":"글로벌 매출 1조 넘긴 '렉라자'…국산 폐암 신약의 탄생기[약전약후]","link":"https://n.news.naver.com/mnews/article/421/0009302479","naverLink":"https://n.news.naver.com/mnews/article/421/0009302479","pubDate":"2026-11-21T10:59:40.892449+09:00","author":"네이버뉴스","description":"국내 바이오벤처 연구실에서 시작된 신약, 세계 폐암 시장으로 기존 치료제 내성 극복에서 1차 치료까지…글로벌 병용요법 매출 1조원 돌파 국내 31번째 신약 '렉라자' 이미지(유한양행 홈페이지 갈무리) (서울=뉴스1) 임여익 기자 = 국내 작은 바이오벤처의 연구실에서 탄생해 10여 년 만에 세계 폐암 치료 시장의 주역으로 성장한 신약 후보물질이 있다. 바로 유한양행(000100)의 비소세포폐암 치료제 '렉라자'(성분명 레이저티닙) 이야기다. 국내 연구진이 발굴한 물질이 글로벌 제약사의 손을 거쳐 세계 각국의 환자에게 쓰이기까지, 렉라자의 성장 과정은 한 편의 신약 개발 성공기로 평가된다. 존슨앤드존슨(J&J)에 따르면 올해 3분기 렉라자와 '리브리반트'(성분명 아미반타맙) 병용요법 관련 매출은 3억 2000만 달러(약 4500억 원)로 전년 동기 대비 62.3% 증가했다. 올해 1~3분기 누적 매출은 8억 6600만 달러(약 1조 2200억 원)로 지난해 연간 매출을 이미 넘어섰다. 렉라자의 탄생은 지난 2015년으로 거슬러 올라간다. 국내 바이오기업 제노스코가 발굴한 신약 후보물질을 오스코텍을 거쳐 유한양행이 도입하면서 본격적인 개발이 시작됐다. 당시만 해도 국내 바이오벤처가 발굴한 물질이 세계적인 항암제로 성장하기란 쉽지 않았다. 신약 하나를 개발하려면 오랜 연구와 막대한 임상 비용이 필요하기 때문이다. 유한양행은 렉라자의 가능성을 알아보고 임상 개발에 뛰어들었다. 2018년에는 글로벌 제약사 J&J의 자회사 얀센에 기술수출하며 해외 진출의 발판을 마련했다. 이후 2021년 국내에서 31번째 국산 신약으로 허가받았고, 2024년에는 미국 식품의약국(FDA)의 문턱을 넘었다. 렉라자와 리브리반트를 함께 사용하는 병용요법이 특정 유전자 변이 비소세포폐암의 1차 치료제로 승인된 것이다. 그렇다면 렉라자는 어떻게 폐암을 치료할까. 우리 몸의 세포에는 성장과 분열을 조절하는 일종의 '스위치'가 있다. 그중 하나가 상피세포성장인자수용체(EGFR)다. 그런데 이 유전자에 특정 변이가 생기면, 스위치가 꺼지지 않고 계속 켜진 상태가 되면서 암세포가 증식할 수 있다. 렉라자는 이처럼 고장 난 성장 스위치의 신호를 차단하는 3세대 표적항암제다. 특히 기존 EGFR 표적치료제에 내성이 생기는 주요 원인 중 하나인 'T790M' 변이에도 작용하도록 개발됐다. 여기에 리브리반트를 더하면 공격 경로가 하나 더 생긴다. 렉라자가 암세포","category":"IT 과학"},{"title":"\"이제 AI 가짜 목소리까지 잡는다\"…갤럭시 'One UI 9.0' 달라진 점 7가지","link":"https://n.news.naver.com/mnews/article/003/0014336943","naverLink":"https://n.news.naver.com/mnews/article/003/0014336943","pubDate":"2026-11-21T10:59:40.429481+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 삼성전자 갤럭시 운영체제 업데이트 'One UI 9'에 AI로 만든 가짜 목소리를 감지하는 기능과 문서 스캔 개선, 특정 인물을 자동 추적하는 영상 편집 기능 등이 총 7가지 기능이 적용됐다. (사진=유튜브 채널 '시니어 정보 탐정) 2026.11.18. [서울=뉴시스]강주연 인턴 기자 = 삼성전자의 갤럭시 운영체제 업데이트 'One UI 9'에 AI로 만든 가짜 목소리를 감지하는 기능과 문서 스캔 개선, 특정 인물을 자동 추적하는 영상 편집 기능 등이 도입됐다. 최근 유튜브 채널 '시니어 정보 탐정'은 갤럭시 운영체제 업데이트 이후 달라진 기능 7가지와 설정 방법을 소개했다. 가장 주요한 변화는 AI를 활용한 보이스피싱 탐지 기능이다. 갤럭시에는 기존에도 통화 중 보이스피싱이 의심되면 알려주는 기능이 있었지만, 이번 업데이트에서는 상대방의 목소리까지 분석해 AI로 만든 가짜 목소리가 의심되면 경고하도록 강화됐다. 영상에서는 \"상대방의 목소리에서 AI 변조나 조작 징후가 발견되면 실시간으로 경고한다\"고 설명했다. 설정은 전화 앱에서 설정 메뉴에 들어간 뒤 '보이스피싱 의심 전화 알림'을 활성화하면 된다. 다만 해당 기능이 모든 사기 전화를 차단하는 것은 아니다. 영상에서는 \"금전을 요구하는 전화를 받으면 알림 여부와 관계없이 가족에게 직접 전화해 사실 여부를 확인해야 한다\"고 당부했다. 문서 스캔 기능도 개선됐다. 서류를 촬영하면 비스듬하게 찍힌 문서를 반듯하게 보정하고 함께 찍힌 손가락을 제거할 수 있다. 영상에서는 \"손가락이 글씨를 가린 경우 해당 부분까지 복원되지는 않으므로 종이 끝부분을 잡고 촬영해야 한다\"고 안내했다. [서울=뉴시스] 마이 팬캠(My FanCam) 기능을 통해서는 갤러리에서 영상을 선택한 뒤 원하는 인물을 지정하면 해당 인물이 화면 중앙에 나오도록 영상을 재구성할 수 있다. (사진=유튜브 채널 '시니어 정보 탐정' 화면 캡쳐) 2026.11.18.","category":"IT 과학"},{"title":"AI가 만능? “체험·감정은 여전히 인간의 것”…‘마크로스’ 아버지가 말한 창작론","link":"https://n.news.naver.com/mnews/article/011/0004684554","naverLink":"https://n.news.naver.com/mnews/article/011/0004684554","pubDate":"2026-11-21T10:59:40.429480+09:00","author":"네이버뉴스","description":"[지스타 2026]카와모리 쇼지 감독·김용하 넥슨게임즈 본부장, 대담 카와모리 “직접 체험하고 느끼는 건 AI에 어려워” 김용하 “AI가 답 내려도…질문은 인간의 역할” 카와모리(왼쪽) 쇼지 감독과 김용하 넥슨게임즈 IO본부장이 20일 부산 해운대구 벡스코 컨벤션홀에서 열린 국제게임콘퍼런스 ‘G-콘 2026’에서 대담을 나누고 있다. 부산=이진석 기자 “AI는 맛있어 보이는 사과를 얼마든지 만들어 낼 수 있습니다. 그런데 그 사과를 먹을 수는 없죠.” 일본 애니메이션 ‘마크로스’ 시리즈를 만든 카와모리 쇼지 감독은 20일 부산 벡스코에서 열린 지스타 게임 콘퍼런스 ‘지콘(G-CON) 2026’에서 인공지능(AI)이 아직 하기 어려운 일로 ‘직접 체험하고 느끼는 것’을 꼽았다. AI가 학습하는 글과 영상에는 사람이 밖으로 표현한 내용이 담기지만, 그 순간 마음속에서 무엇을 느꼈는지까지 고스란히 담기지는 않는다는 설명이다. 카와모리 감독은 이날 ‘블루 아카이브’ 총괄 PD인 김용하 넥슨게임즈 IO본부장과의 대담에서 30여 년 전 애니메이션 ‘마크로스 플러스’에 AI 아이돌을 등장시킨 일화를 소개했다. 그가 관객들이 AI 아이돌의 공연에 열광하는 장면을 그리자 동료 애니메이터들은 “누가 AI 아이돌에게 저렇게 열광하겠느냐”며 웃었다고 한다. 카와모리 감독은 “언젠가 이런 시대가 오리라고는 생각했지만 내가 살아 있는 동안일지는 몰랐다”며 “생각보다 훨씬 빨리 왔고 그 속도는 더 빨라지고 있다”고 말했다. 그는 창작 과정에서도 AI가 잘하는 일은 맡길 수 있다고 봤다. ‘마크로스 플러스’를 제작할 당시 컴퓨터그래픽(CG)을 받아들인 경험도 들려줬다. 카와모리 감독은 “당시 일본에서는 CG를 꺼렸지만 미국에서는 이미 CG가 비용이 덜 든다는 이야기가 나왔다”며 “자본주의 사회에서 더 저렴한 방식을 이기기는 어렵다고 생각해 일찍 받아들였다”고 했다. 카와모리(왼쪽) 쇼지 감독과 김용하 넥슨게임즈 IO본부장이 20일 부산 해운대구 벡스코 컨벤션홀에서 열린 국제게임콘퍼런스 ‘G-콘 2026’에서 대담을 나누고 있다. 부산=이진석 기자","category":"IT 과학"},{"title":"[AI돋보기] 해킹에 커닝까지…AI의 역습에 한국 사회 비상","link":"https://n.news.naver.com/mnews/article/001/0016455441","naverLink":"https://n.news.naver.com/mnews/article/001/0016455441","pubDate":"2026-11-21T10:59:40.429473+09:00","author":"네이버뉴스","description":"금융권 해킹에 AI 도구 등장…국가자격시험 부정행위도 현실화 수능장 와이파이 차단·스마트안경 사생활 침해 우려…안전망 강화 시급 해킹에 커닝까지…AI의 역습에 한국 사회 비상 [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 인공지능(AI) 챗GPT가 등장한 지 4년여 만에 AI가 대한민국 사회에 급속히 퍼지면서 그동안 편리함에 가려졌던 부작용이 잇따라 드러나고 있다. AI를 활용한 해킹으로 국내 기업과 공공기관에서 개인 정보가 끊임없이 유출되고 교육 현장과 국가자격시험에서는 AI를 악용한 부정행위로 시험에 대한 신뢰마저 의심받는 지경에 이르렀다. 급기야 이번 대학수학능력시험(수능)에서는 AI 등을 활용한 부정행위를 막기 위해 위급재난문자까지 발송하자 온라인 커뮤니티 등에서는 \"전 국민이 영화 오징어게임 속 출연자가 된 거 아니냐\"는 자조 섞인 말까지 나왔다. 문명의 이기인 AI가 업무 효율을 높이고 생활을 편리하게 만드는 도구인 것은 맞지만 이제는 AI 악용이 중요한 사회적 문제가 된 만큼 이를 막기 위한 촘촘한 대응이 절실해지고 있다. 금융권까지 노린 AI 해킹…기존 보안망에 경고등 AI가 악용되는 대표적인 분야는 사이버보안이다. 지난 10월 KB국민은행을 포함해 국내 금융권이 AI를 동원한 해킹 공격으로 개인정보가 털리는 전대미문의 사고가 터졌고 심지어 금융보안 전담 기관인 금융보안원이 해킹 공격을 받아 금융사 직원 개인정보 등이 유출되는 사태까지 벌어졌다. 국내 기업과 대학, 공공기관의 경우도 하루가 멀다 하고 해킹에 의한 개인정보 유출 신고가 이어지고 있다. AI 진화에 따른 급속한 해킹 기술 발전의 후폭풍으로 이제는 내 개인정보가 사실상 '모두의 개인정보'가 된 시대에 살고 있다. 금융권 보안체계 점검 촉구 (서울=연합뉴스) 서명곤 기자 = 17일 서울 여의도 금융감독원 앞에서 경제정의실천시민연합, 민주사회를 위한 변호사모임 등 5개 단체가 연 기자회견에서 참가자들이 금융권 개인정보 유출 사태에 대한 책임 규명과 재발 방지 대책 마련을 촉구하고 있다. 2026.11.17 seephoto@yna.co.kr","category":"IT 과학"},{"title":"\"에지 AI 확산이 메모리 성장 견인\"…CXMT, 차세대 저전력 제품 양산","link":"https://n.news.naver.com/mnews/article/092/0002446294","naverLink":"https://n.news.naver.com/mnews/article/092/0002446294","pubDate":"2026-11-21T10:59:40.429471+09:00","author":"네이버뉴스","description":"3분기 실적발표서 MRDIMM 등 서버용 고성능 메모리도 선봬 에지 인공지능(AI)이 글로벌 메모리 시장 확장을 이끄는 동력으로 부상했다. 데이터센터에 집중됐던 메모리 반도체 수요가 AI 스마트폰과 자동차, 소비자용 기기 전반으로 확산하고 있다. 중국 메모리 반도체 기업 창신메모리테크놀로지(CXMT)는 차세대 저전력 메모리 LPDDR6 양산에 돌입했다. 21일 중국 펑파이신문에 따르면 차오칸위 CXMT 총재는 최근 3분기 실적발표에서 메모리 반도체 수요 증가세가 데이터센터에서 소비자용 단말기로 옮겨가고 있다고 밝혔다. AI 스마트폰과 AI PC, AI 글래스, 스마트 주행차량 등 신형 단말기 보급으로 기기 자체에서 AI를 구동하는 온디바이스 AI용 메모리 수요가 증가하고 있다. 차오칸위 총재는 \"온디바이스 AI 메모리 수요 증가율이 다른 분야를 웃돈다\"며 \"글로벌 메모리 시장 확장을 이끄는 핵심동력\"이라고 진단했다. CXMT의 차세대 모바일 저전력 메모리 LPDDR6. (사진=CXMT 홈페이지) 최근 거시경제 환경 악화와 원가 상승 등으로 전체 소비자용 기기 시장이 위축됐으나, CXMT는 AI 단말기 보급이 창출할 메모리 추가 수요를 긍정 평가했다. 차량용 시장 역시 스마트 주행 기술이 상용화 단계에 접어들면서 메모리 탑재량이 늘고 있다. CXMT는 에지 AI 수요 확대에 대응하기 위해 LPDDR6 제품을 출시했다. 신제품은 중국 업체 플래그십 스마트폰에 탑재하기 위해 양산을 시작했다. 최고 전송속도는 1만 2800Mbps(초당 메가비트)다. 이전 세대인 LPDDR5X와 비교해 데이터 전송대역폭은 60% 넓어졌고 전력소모는 20% 줄었다. 데이터 처리속도를 높이면서 전력효율을 개선해 플래그십폰이 요구하는 고성능 연산과 장시간 배터리 구동 조건을 충족했다. LPDDR6 활용처는 모바일을 넘어 산업 전반으로 넓어지고 있다. 향후 스마트 주행차량과 에지 컴퓨팅 기기는 물론 높은 전력효율을 요구하는 서버 환경으로도 적용 범위를 확대할 수 있다. 단말기에서 수집한 데이터를 실시간 처리해야 하는 에지 AI 특성상 저전력·고성능 메모리 중요성이 커진 결과다. CXMT는 실적발표에서 데이터센터와 기업용 서버 시장을 겨냥한 고성능 제품군도 구체화했다. CXMT는 서버용 메모리 분야에서 DDR5 기반 등록형 듀얼 인라인 메모리 모듈(RDIMM)과 멀티플렉스드 랭크 듀얼 인라인 메모리 모듈(MRDIMM) 등 규격 제품을 선보였다.","category":"IT 과학"},{"title":"AI 클로드가 수학 최대 난제 리만가설 증명했나","link":"https://n.news.naver.com/mnews/article/029/0003060302","naverLink":"https://n.news.naver.com/mnews/article/029/0003060302","pubDate":"2026-11-21T10:59:40.429465+09:00","author":"네이버뉴스","description":"클로드 로고(일러스트). [로이터=연합뉴스 자료사진] - 수학자인 앤트로픽 연구원, 웹사이트 통해 발표… 치열한 검증 전망 - 사실이라면 수학과 AI 역사상 최대 이정표 수학계의 최대 난제 중 하나로 꼽히는 리만 가설이 증명된 것인가. 인공지능(AI) 기업 앤트로픽의 한 연구원이 회사의 챗봇 클로드로 리만 가설을 증명했다고 주장했다고 AFP통신과 파이낸셜타임스 등 외신이 20일(현지시간) 보도했다. 보도에 따르면 하버드·케임브리지·프린스턴을 거친 정수론 전공자이기도 한 앤트로픽 연구원 레벤트 알포게는 이날 자신의 웹사이트에 올린 글과 4쪽짜리 문서를 통해 “클로드와 협업해 리만 가설의 증명을 발견했다고 믿는다”고 주장했다. 그는 1859년 제기된 기존의 리만 가설(RH)뿐만 아니라, 이를 디리클레 L-함수로 확장한 일반화 리만 가설(GRH)까지 추가 가정 없이 증명했다고 말했다. 클로드가 생성한 자연어 해설 초안은 25만 쪽이 넘어 비공개로 두었으며, 대신 수학적 논리의 정합성을 컴퓨터로 검증하는 프로그래밍 언어인 린(Lean) 코드를 14개의 분할 압축 파일 형태로 우선 공개했다. 이 주장은 아직 독립적으로 검증되거나 외부 전문가의 정밀 검토를 거치진 않았다. 그러나 리만 가설 분야의 권위자인 브라이언 콘리는 AFP통신에 “인류 역사상 기념비적 순간”이라며 “내 생각엔 수학사에서 일어난 일 중 정말 가장 큰 사건”이라고 평가했다. 그러면서 “논문 원고는 보지 못했고 알포게가 웹사이트에 올린 글만 확인했으며 원고 사본을 요청해 놨다”며 “(증명 방식이) 상당히 복잡해 보이고 이를 증명할 더 간단한 방법들이 나올 것으로 믿는다”고 말했다. 킷 예이츠 배스대 수리생물학·대중참여 교수는 “치열한 검증을 받게 될 것”이라면서도 “검증을 통과한다면 수학과 AI의 역량에 대한 우리의 이해 모두에 엄청난 파장을 낳을 것”이라고 전망했다. 알포게는 다리오 아모데이 앤트로픽 최고경영자(CEO)와 상의 후 결과를 발표했다고 전하면서 발표 시점이 냉소적인 시선을 받을 수 있다는 점을 인정했다. 이번 발표는 앤트로픽의 기록적인 상장(IPO) 다음 날 나왔다. 1859년 독일 수학자 베른하르트 리만이 제기한 리만 가설은 정수론의 핵심 난제로, 1과 자기 자신으로만 나누어떨어지는 ‘소수’(Prime Number)의 분포와 규칙에 관한 문제다. 무작위로 나타나는 것처럼 보이는 소수들이 실제로는 ‘리만 제타 함수’라는 복소수 함수의 특정","category":"IT 과학"},{"title":"트럼프 \"해외에 AI 데이터센터 지으면 막대한 세금\"","link":"https://n.news.naver.com/mnews/article/138/0002249435","naverLink":"https://n.news.naver.com/mnews/article/138/0002249435","pubDate":"2026-11-21T10:59:40.429463+09:00","author":"네이버뉴스","description":"도널드 트럼프 대통령이 6월17일(현지시간) 수요일 프랑스 오를리 공항에서 에어포스 원에서 내린 후 언론에 이야기하고 있다. [사진=연합뉴스] [디지털데일리 이상일기자] 도널드 트럼프 미국 대통령이 해외에 인공지능(AI) 데이터센터를 짓는 미국 기술기업에 막대한 세금이나 제한 조치를 부과할 수 있다고 경고했다. 세율과 시행 일정 등 구체안은 내놓지 않았지만 글로벌 AI 인프라 확장에 걸림돌이 될 수 있다는 관측이 나온다. 트럼프 대통령은 20일(현지시간) 백악관 기자회견에서 해외 데이터센터 건설 기업을 제재할 방침이라고 밝혔다. 그는 해외에 컴퓨팅 시설을 짓는 기업이 막대한 세금이나 제한 조치를 받을 수 있다고 말했다. 미국의 AI 인프라는 국내에 머물러야 한다는 주장이다. 중국 경쟁사가 첨단 컴퓨팅 역량을 쓰게 해서는 안 된다는 이유다. 이번 발언은 트럼프 대통령의 아시아 외교 순방 직후 나왔다. 미국은 최근 해외 데이터센터 구축을 겨냥한 반도체 수출 제한 조치를 발표했다. 트럼프 대통령은 세율, 집행 절차, 법안 내용, 시행 일정을 밝히지 않았다. 행정부 관계자들이 이 구상을 사전에 통보받지 못했다는 점도 인정했다. 이번 발언으로 해외 사업을 넓히는 클라우드 기업과 데이터센터 개발사는 또 다른 불확실성을 안게 됐다. 아마존, 마이크로소프트, 구글, 이퀴닉스, 디지털리얼티 등은 여러 나라에서 인프라를 운영한다. 현지 고객에 서비스를 제공하고 네트워크 지연을 줄이며 데이터 현지 보관 요건을 지키기 위해서다. 광범위한 제한이 도입되면 운영이 복잡해지고 계획된 투자에도 영향을 줄 수 있다. 미국 내 데이터센터 사업도 반발에 부딪혔다. 전력 소비, 공공요금, 물 사용량, 환경 영향 등이 이유다. 트럼프 대통령은 지역사회가 사업을 거부하기보다 개발사와 재정적 혜택을 협상하라고 권했다.","category":"IT 과학"},{"title":"우주로 출근 완료…위성들의 별별 사연","link":"https://n.news.naver.com/mnews/article/584/0000040253","naverLink":"https://n.news.naver.com/mnews/article/584/0000040253","pubDate":"2026-11-21T10:59:40.429461+09:00","author":"네이버뉴스","description":"로버가 달 환경을 흉내낸 현장에서 주행 연습을 하고 있다. 어린이과학동아 제공 지난 10월 7일 누리호가 인공위성 15기를 싣고 우주로 날아올랐다. 누리호 발사 사상 가장 많은 위성을 실었고 위성 다섯 기를 서로 다른 방향으로 내보내는 새로운 도전에도 성공했다. 누리호 5호기에 실린 위성들은 우주에서 어떤 임무를 수행할까. 한반도를 관측하는 위성부터 신약 개발과 달 탐사를 위한 위성, 대학생이 만든 위성까지 다양한 위성이 우주로 향했다. 위성 개발자들에게 각 위성의 특별한 임무와 제작 과정에서 겪은 이야기를 들어봤다. ● 한반도를 더 자주 관측한다…주탑재위성 '네온샛 2~6호' 이철 KAIST 인공위성연구소 기획조정실장 네온샛은 무게가 100kg 미만인 초소형 군집위성이다. 다섯 기가 한 팀을 이뤄 한반도를 촬영하고, 재난·재해와 국가안보에 필요한 정보를 수집한다. 위성이 많을수록 같은 지역을 더 자주 관측할 수 있다. 내년에는 다섯 기를 추가로 발사해 오전과 오후 관측으로 나눠 운영할 계획이다. 10월 8일 네온샛이 미국 오하이오주를 촬영해 지구로 보내온 첫 사진이다. 우주항공청 제공","category":"IT 과학"},{"title":"“AI 클로드가 167년 수학 난제 풀었다”…‘리만 가설’ 증명 주장에 수학계 술렁","link":"https://n.news.naver.com/mnews/article/021/0002834432","naverLink":"https://n.news.naver.com/mnews/article/021/0002834432","pubDate":"2026-11-21T10:59:40.429457+09:00","author":"네이버뉴스","description":"인공지능(AI) 기업 앤트로픽의 클로드 로고. 연합뉴스 앤트로픽 수학자 “일반화 리만 가설까지 해결”…1700만 줄 검증 코드 공개 공식 인정되면 상금 100만 달러 인공지능(AI) 챗봇 ‘클로드’를 활용해 167년간 풀리지 않은 수학계 최대 난제인 ‘리만 가설’을 증명했다는 주장이 나왔다. 해법이 검증될 경우 수학계는 물론 AI의 연구 역량에 대한 평가에도 상당한 영향을 미칠 것으로 전망된다. 20일(현지시간) 워싱턴포스트(WP)와 AFP통신 등에 따르면 AI 기업 앤트로픽 소속 수학자 레벤트 알포게는 이날 자신의 웹사이트에 공개한 문서에서 “클로드와 협력해 리만 가설의 증명을 발견했다고 믿는다”고 밝혔다. 그는 기존 가설보다 범위가 넓은 ‘일반화 리만 가설’까지 해결했다고 주장했다. 리만 가설은 독일 수학자 베른하르트 리만이 1859년 제시한 것으로, 소수의 분포와 규칙성을 설명하는 정수론의 핵심 난제다. 소수는 1과 자기 자신으로만 나누어떨어지는 자연수로, 인터넷 금융거래 등에 활용되는 암호체계의 수학적 토대이기도 하다. 리만 가설은 미국 클레이 수학연구소가 2000년 선정한 7대 ‘밀레니엄 난제’ 중 하나로, 공식 해법을 제시하면 100만 달러(약 14억 원)의 상금이 주어진다. 알포게는 수학적 논증을 컴퓨터로 검증하는 프로그래밍 언어 ‘린(Lean)’으로 작성한 1700만 줄 분량의 코드를 공개했다. 다만 일반적인 수학 논문 형태의 증명서는 내놓지 않았다. 전체 논증을 문서화하면 최소 25만 쪽에 이를 것으로 추산했다. 그는 AI가 도출한 증명의 수학적 내용을 자신도 완전히 이해하지 못했다고 인정했다. 수학계는 신중한 반응을 보이고 있다. 리만 가설 연구의 권위자인 브라이언 콘리는 “수학 역사상 가장 큰 사건이 될 수 있다”고 평가하면서도 아직 증명 원고를 확인하지 못했다고 밝혔다. 킷 예이츠 영국 배스대 교수는 엄격한 검증이 필요하다며 해법이 인정될 경우 수학과 AI에 대한 기존 인식을 바꿀 수 있다고 전망했다. 이번 발표는 앤트로픽의 기업공개(IPO) 다음 날 이뤄졌다. 알포게는 다리오 아모데이 최고경영자(CEO)와 상의해 결과를 공개했으며 상장과 발표 시점은 무관하다고 설명했다. 앞서 경쟁사 오픈AI도 지난 9월 또 다른 밀레니엄 난제인 ‘나비에-스토크스 문제’의 해법을 발견했다고 발표한 바 있다. 리만 가설의 해법이 공식 인정되려면 동료 심사를 거친 학술지에 논문을 게재하고 2년간의 검증을 통과","category":"IT 과학"},{"title":"삼성전자, 메타 독주 'AI 안경' 시장에 도전…다음 달 첫 제품 출시","link":"https://n.news.naver.com/mnews/article/031/0001077174","naverLink":"https://n.news.naver.com/mnews/article/031/0001077174","pubDate":"2026-11-21T10:59:40.429447+09:00","author":"네이버뉴스","description":"삼성전자, 메타 독주 'AI 안경' 시장에 도전…다음 달 첫 제품 출시. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"}]},"popular":[{"title":"[속보] 트럼프, 젠 37065","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"사진 제공: 경기북부소방 오늘 저녁 7시쯤 경기 파주시 서울문산고속도로 문산 방향 금촌나들목 인근에서 1톤 트럭 3대와 SUV 1대가 잇따라 추돌했습니다. 이 사고로 1톤 트럭을 몰던 40대 남성이 다리를 크게 다쳐 병원으로 옮겨졌습니다. 경찰은 해당 트럭이 앞서가던 트럭을 들이받으면서 연쇄 추돌이 발생한 것으로 보고 정확한 사고 경위를 조사하고 있습니다.","category":"사건 사고"},{"title":"‘스태프 성폭행’ 강지환, 뜨개질로 복귀 시동…하루 만에 퇴출됐다","link":"https://n.news.naver.com/mnews/article/025/0003566805","naverLink":"https://n.news.naver.com/mnews/article/025/0003566805","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"성범죄 혐의로 유죄 판결을 받고 활동을 중단한 배우 강지환이 지난 19일 틱톡 라이브 방송에서 근황을 전하는 모습. 사진 틱톡 라이브 방송 화면 캡처 스태프 성폭행 혐의로 유죄 판결을 받았던 배우 강지환(49)의 틱톡 계정이 하루 만에 삭제됐다. 20일 틱톡코리아에 따르면 강지환의 계정은 이날 영구 정지됐다. 플랫폼 외부에서 심각한 행동을 한 이용자의 계정을 제한하거나 영구 정지할 수 있다는 자체 가이드라인에 따른 조치다. 강지환은 지난 19일 틱톡 라이브 방송을 통해 근황을 전했다. 그는 뜨개질을 하며 시청자들에게 인사를 건네는 등 소통을 이어갔다. 하지만 방송 직후 과거 성범죄 전력이 재조명되면서 복귀 의지를 내비친 게 아니냐는 비판이 제기됐다. 앞서 강지환은 2019년 7월 경기 광주시 자택에서 드라마 ‘조선생존기’ 외주 스태프 여성 2명과 술을 마신 뒤 잠든 1명을 성폭행하고 다른 1명을 추행한 혐의로 기소됐다. 2020년 대법원에서 징역 2년 6개월에 집행유예 3년을 확정받았다. 그는 이 사건으로 출연 중이던 드라마에서 하차하는 등 연예계 활동을 전면 중단했다. 이후 드라마 제작사와 전 소속사가 제기한 손해배상 청구 소송에서도 각각 53억8000만원과 34억8000여만원을 배상하라는 판결을 받았다.","category":"사건 사고"},{"title":"한 총리 \"수능 스마트기기 부정행위자 형사고발\"…응시 제한 최대 10년 추진","link":"https://n.news.naver.com/mnews/article/018/0006413220","naverLink":"https://n.news.naver.com/mnews/article/018/0006413220","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"수능 부정행위 대응 TF 1차 회의 주재 현장 적발 111명…와이파이·블루투스 기록 분석해 추가 적발 대학 입학 취소·퇴학도…감독관엔 법률 지원·배상책임보험 [세종=이데일리 송주오 기자] 한성숙 국무총리가 2027학년도 대학수학능력시험(수능)에서 스마트기기를 이용한 부정행위자를 형사고발하겠다고 밝혔다. 수능 응시 제한 기간을 최대 10년으로 늘리는 방안도 추진하고, 이미 대학에 합격했거나 재학 중인 부정행위자는 입학 취소와 퇴학 조치를 하기로 했다. 한성숙 국무총리가 20일 서울 종로구 정부서울청사에서 열린 수능 부정행위 대응 태스크포스(TF) 1차 회의에서 발언하고 있다.(사진=연합뉴스) 한 총리는 20일 오후 정부서울청사에서 열린 수능 부정행위 대응 TF 1차 회의에서 “수능은 끝났지만 수능의 공정성을 위한 정부의 책임은 끝나지 않았다”며 이같이 말했다. 회의에는 교육부·과학기술정보통신부 장관과 행정안전부 재난안전관리본부장, 국민권익위원회 사무처장, 경찰청장 직무대리, 법무부 법무실장, AI전략위 지원단장 등이 참석했다. 한 총리는 “범정부 역량을 총동원해 이번 수능에서 발생한 부정행위를 철저히 적발하고 법과 원칙에 따라 엄정하게 조치하겠다”고 강조했다. TF에는 교육부와 과기정통부, 행안부, 법무부, 경찰청, 권익위가 참여하며, 필요하면 협력 부처를 늘릴 계획이다. 전날 치러진 수능에서는 스마트기기를 소지한 부정행위로 111명이 현장에서 적발됐다. 정부는 현장에서 놓친 부정행위도 끝까지 찾아낸다는 방침이다. 시험 당일 전담 감독관이 기록·저장한 의심 와이파이·블루투스 신호를 분석해 부정행위가 의심되는 사례는 수사를 의뢰한다. 권익위를 중심으로 신고·제보를 받고, 실제 부정행위로 확인되면 포상금을 지급하는 절차도 준비하고 있다. 경찰청은 온라인 커뮤니티와 SNS 등에 올라온 부정행위 의혹의 진위를 확인한다. 처벌 수위도 높인다. 모든 부정행위자의 올해 수능 시험은 무효 처리된다. 정부는 수능 부정행위 심의위원회를 통해 잘못의 경중을 따져 행정·형사 책임을 추가로 묻기로 했다. 특히 스마트기기 부정행위자는 형사고발하며, 이 경우 최대 5년의 형사처벌을 받을 수 있다. 수능 응시 제한 기간을 현행 1년에서 최대 10년으로 늘리는 방안은 올해 부정행위자부터 적용될 수 있도록 국회에서 논의하고 있다. 한 총리는 “정부도 적극 협력하겠다”고 했다. 이미 대학 입학이 결정됐거나 재학 중인 부정행위자는 입학 취소와 퇴학","category":"사건 사고"},{"title":"아버지는 10대 여성 살해 혐의…아들은 ‘의제강간’ 혐의로 재판행","link":"https://n.news.naver.com/mnews/article/028/0002833276","naverLink":"https://n.news.naver.com/mnews/article/028/0002833276","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"새만금수목원 공사 현장서 60대 근로자 추락사…중대재해법 조사 착수","link":"https://n.news.naver.com/mnews/article/029/0003060282","naverLink":"https://n.news.naver.com/mnews/article/029/0003060282","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"사고가 난 시설 [전북자치도소방본부 제공] 전북 김제시 국립새만금수목원 조성 공사 현장에서 60대 하청업체 근로자가 작업 도중 추락해 숨졌다. 20일 경찰과 고용노동부 등에 따르면 이날 오후 3시 55분쯤 전북 김제시 진봉면 국립새만금수목원 조성 공사 현장에서 하청업체 소속 근로자 A(60대)씨가 약 5ｍ 아래 바닥으로 떨어졌다. 이 사고로 A씨는 머리 부위 등을 크게 다쳐 끝내 숨졌다. A씨는 당시 동료 근로자들과 함께 작업에 투입됐으며 중수처리시설 내 설비 배관 등이 지나갈 수 있도록 뚫어놓은 공간인 개구부 가장자리에 걸터앉은 상태로 작업을 진행하다 중심을 잃고 추락한 것으로 파악됐다. 사고 당시 A씨는 안전모를 착용하고 있었던 것으로 확인됐다. 경찰과 고용노동부는 현장 관계자와 동료 작업자 등을 상대로 정확한 사고 경위를 조사하는 한편, 개구부 덮개나 안전난간 설치 등 추락 방지 조치가 제대로 이행됐는지 확인하고 있다. 특히 노동 당국은 해당 사업장이 중대재해처벌 등에 관한 법률 적용 대상에 해당하는 것으로 보고 법 위반 여부를 들여다볼 방침이다.","category":"사건 사고"},{"title":"도박판 싸움 말리던 업주 폭행해 숨지게 한 50대 구속","link":"https://n.news.naver.com/mnews/article/003/0014336855","naverLink":"https://n.news.naver.com/mnews/article/003/0014336855","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[거제=뉴시스] 신정철 기자= 사진은 현 거제경찰서 청사 전경.(사진=뉴시스DB).2026.08.13. sin@newsis.com [거제=뉴시스] 신정철 기자 = 경남 거제에서 도박을 하다 업주를 폭행해 숨지게 한 50대 A씨가 구속 송치됐다. 20일, 거제경찰서에 따르면 폭행치사 혐의로 구속된 A씨를 공소청에 송치했다. A씨는 지난 13일 오후 11시께 거제시 고현동의 한 노상에서 50대 B씨를 폭행해 숨지게 한 혐의를 받고 있다. 당시 A씨는 B씨의 영업장 내에서 도박을 하다 도박 상대방과 말다툼을 벌였다. A씨는 이를 말리던 B씨를 폭행, B씨는 병원으로 옮겨졌지만 끝내 숨졌다．","category":"사건 사고"},{"title":"\"이진우, 사망 당일 집 왔었다\"…이틀 전 집주인에 한 말","link":"https://n.news.naver.com/mnews/article/055/0001404698","naverLink":"https://n.news.naver.com/mnews/article/055/0001404698","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"▲ 이진우 씨가 살던 빌라 건물 법학적성시험(LEET) 만점자 고(故) 이진우(32) 씨가 사망한 당일 새벽 자취방으로 돌아와 짐을 정리한 것으로 파악됐습니다. 이 씨는 사망하기 이틀 전인 17일 집을 나간 뒤 귀가하지 않은 것으로 알려졌지만, 수능 문제풀이 공개 검증을 앞두고 신변을 정리한 정황이 새롭게 포착됐습니다. 이 씨는 지난 19일 새벽 서울 관악구 신림동 자택으로 돌아와 일부 짐을 챙긴 뒤 남은 짐은 재활용품장에 버리고 집을 나섰습니다. 이후 오전 8시 40분 서울 강남구 대치동의 한 스튜디오에서 예정됐던 공개 검증에 불참했습니다. 이 씨의 행방이 묘연해지자 오전 8시 42분 신변 안전이 우려된다는 신고가 접수됐습니다. 경찰이 즉각 추적에 나섰지만, 이 씨는 집에 없었습니다. 이 씨의 가족도 신변을 걱정해 자취방을 찾아온 것으로 전해졌습니다. 이후 이 씨는 송파구와 강동구 등을 대중교통과 도보로 배회하다 천호동의 한 모텔에서 숨진 채 발견됐습니다.","category":"사건 사고"},{"title":"'성북 10대 살해' 피의자 아들, 미성년자의제강간 혐의로 기소","link":"https://n.news.naver.com/mnews/article/008/0005444336","naverLink":"https://n.news.naver.com/mnews/article/008/0005444336","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"창업자 재판에 '잃어버린 3년'…카카오, AI로 판 뒤집는다","link":"https://n.news.naver.com/mnews/article/215/0001273391","naverLink":"https://n.news.naver.com/mnews/article/215/0001273391","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"SM엔터테인먼트 시세조종 혐의로 기소된 카카오 창업자 김범수 미래이니셔티브센터장이 2심에서도 무죄를 선고받았습니다. 카카오가 지난 3년여간 사법 리스크에 휘말리는 사이 오픈AI와 구글 등 글로벌 빅테크는 AI 시장의 판도를 바꿔놨습니다. 김범수 창업자는 \"새로운 도전과 성장에 힘을 보태겠다\"며 내년 인적분할을 앞둔 카카오의 대변혁을 예고했습니다. 자세한 내용 산업부 김대연 기자와 살펴보겠습니다. 김 기자, 김 창업자가 1심에 이어 2심에서도 무죄를 선고받았는데, 어떤 입장을 내놨습니까? 김범수 카카오 창업자는 2심 무죄 선고 직후 AI 사업에 대한 강한 의지를 드러냈습니다. 현장 발언 직접 들어보시죠. [김범수 / 카카오 미래이니셔티브센터장: 지난 3년간 카카오에 드리웠던 모든 불확실성이 해소되는 시간이 됐으면 좋겠습니다. AI 시대가 모든 산업을 재편하는 과정에서 카카오의 창업자로서 카카오의 도전과 혁신에 힘을 보탤 수 있는 모든 노력을 다하겠습니다.] 이번 항소심에서도 법원은 김 창업자의 SM엔터 주가 조작 혐의를 인정하지 않았습니다. 카카오가 SM엔터 주식을 사들여 주가가 올랐다는 이유만으로 시세조종이라고 단정할 수 없다는 겁니다. 재판부는 \"모든 매수 행위를 처벌하는 것은 부당하다\"며 \"처벌 범위를 무한정 확대하는 결과가 나올 수 있다\"고 지적했습니다. 2심에서도 무죄를 선고받은 김 창업자는 공식 입장문에서도 재도약의 필요성을 거듭 밝혔는데요. 김 창업자는 \"AI가 산업과 일상의 판을 바꾸고 있는 지금 카카오도 새로운 성장의 길을 열어야 한다\"고 말했습니다. 이어 \"구조적이고 과감한 변화가 필요한 때\"라며 \"창업자로서 새로운 도전과 성장에 힘을 보태겠다\"고 강조했습니다. 그런데 김 창업자가 재판받는 동안 글로벌 빅테크들은 이미 AI 시장을 빠르게 장악하지 않았습니까? 카카오가 사법 리스크에 발목 잡힌 사이 IT 산업의 중심은 '모바일'에서 'AI'로 넘어갔습니다. 공소청 수사가 본격화한 지난 2023년 11월부터 벌써 3년이 흘렀는데요. 공교롭게도 글로벌 빅테크들이 생성형 AI 시장을 키우기 시작한 때와 맞물립니다. 지난 2022년 11월 오픈AI가 '챗GPT'를 출시했고요. 이듬해 3월 앤트로픽의 '클로드'와 구글의 '바드'까지 등장했습니다. 불과 4개월 만에 글로벌 AI 패권 경쟁의 불이 붙은 겁니다. 국내에서도 생성형 AI 이용자가 폭발적으로 늘었습니다. 지난 2023년 13%에 불과했던 생성형 A","category":"사건 사고"},{"title":"'의류수거함 아기 시신' 유기한 母…살인 혐의 추가 '구속'","link":"https://n.news.naver.com/mnews/article/015/0005356528","naverLink":"https://n.news.naver.com/mnews/article/015/0005356528","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"항공·은행·NSA까지 줄줄이 장애…美 국가사이버국장 해임","link":"https://n.news.naver.com/mnews/article/025/0003566806","naverLink":"https://n.news.naver.com/mnews/article/025/0003566806","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"커스틴 데이비스 미국 국방부 최고정보책임자(CIO)가 지난 3월 26일(현지시간) 워싱턴DC 연방의회에서 열린 하원 군사위원회 산하 사이버·정보기술·혁신 소위원회 청문회에 참석해 자리에 앉고 있다. AP=연합뉴스 미국에서 항공·금융 등 주요 인프라의 전산 장애가 잇따르는 가운데 백악관 국가사이버국장이 해임됐다. 정확한 해임 경위는 알려지지 않았지만, 최근 장애 사태에 대한 문책성 인사라는 해석이 나온다. 20일(현지시간) 뉴욕타임스(NYT)와 CNN 등에 따르면 숀 케언크로스 국가사이버국장이 전날 해임되고 커스틴 데이비스 국방부 최고정보책임자(CIO)가 직무대행으로 지명됐다. 국가사이버국장은 연방정부 전반의 사이버 보안 정책과 전략을 조정하는 자리다. 데이비스 대행이 정식 국장으로 임명되려면 연방 상원의 인준을 받아야 한다. 미국에서는 지난 12일부터 마이크로소프트(MS) 아웃룩 장애와 미 전역 항공편 출발 중단, JP모건체이스 온라인 거래 장애, 유나이티드항공 전산 시스템 오류 등이 잇따랐다. 국가안보국(NSA) 내부 통신망 마비와 애플 서비스 장애까지 겹치면서 사이버 보안에 대한 우려가 커졌다. CNN은 백악관 소식통을 인용해 “트럼프 대통령은 케언크로스가 해당 직책을 수행할 만한 강력한 사이버 분야 자격을 갖추지 못해 그의 해임을 전적으로 지지했다”고 전했다. 국가안보보좌관을 겸하는 마코 루비오 국무장관은 전날 소셜네트워크서비스(SNS)인 X에 데이비스 대행을 향해 “미국의 사이버 보안을 강화하기 위해 함께 일하길 기대한다”고 적었다. 피트 헤그세스 국방부 장관도 데이비스 대행이 국방부 재임 기간 “헌신적 애국자 및 전문가로서 면모를 입증해왔으며, 사이버 보안 전반에서 도널드 트럼프 대통령의 미국 우선주의 의제를 추진할 것”이라고 밝혔다. 앞서 트럼프 대통령은 지난 17일 필리핀 방문 중 잇단 장애 사태에 대해 “그게 인생이다. 크고 강력하고 돈도 많으면 그런 일이 일어난다. 괜찮다”며 대수롭지 않다는 반응을 보였다.","category":"사회"},{"title":"美 잇단 주요 인프라 장애에 백악관 국가사이버국장 해임","link":"https://n.news.naver.com/mnews/article/214/0001537067","naverLink":"https://n.news.naver.com/mnews/article/214/0001537067","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"최근 미국에서 잇따라 대규모 전산 장애가 발생한 가운데 백악관 국가사이버국장이 교체됐습니다. 현지시간 20일 뉴욕타임스와 CNN 등에 따르면, 전날 숀 케언크로스 국장이 해임되고, 커스틴 데이비스 국방부 최고정보책임자가 직무대행으로 지명됐습니다. 국가사이버국장은 미 연방 정부 전반의 사이버 보안 정책과 전략을 조정하는 역할을 합니다. 케언크로스 국장의 해임 경위는 정확히 알려지지 않았지만, 최근 잇따라 발생한 대규모 인프라 장애와 관련된 것으로 보입니다. 지난 12일부터 마이크로소프트 아웃룩 장애, 미 전역 항공편 출발 중단 사태, JP모건 체이스 온라인 거래 장애, 유나이티드 항공 전산 시스템 오류, 미 국가안보국 내부 통신망 마비, 애플 서비스 장애 등이 잇따라 터지면서 사이버 보안 우려가 커져왔습니다.","category":"사회"},{"title":"철원군 '과수화상병' 차단 총력…\"겨울철 궤양 제거\"","link":"https://n.news.naver.com/mnews/article/003/0014336863","naverLink":"https://n.news.naver.com/mnews/article/003/0014336863","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"내년 3월까지 가지치기 시기 집중 예찰 의심 부위 40~70cm 아래 절단·도구 소독 [철원=뉴시스] 화상병 병징 사진. (사진=철원군 제공) photo@newsis.com *재판매 및 DB 금지 [철원=뉴시스]정건웅 기자 = 강원 철원군이 사과·배 농가에 치명적인 검역병해충 '과수화상병' 확산을 막기 위해 겨울철 궤양 제거에 나섰다. 농촌진흥청에 따르면 과수화상병은 치료약이 없어 한 그루만 감염돼도 과수원 전체를 폐원해야 한다. 병원균이 겨울을 나는 궤양을 이달부터 내년 3월까지 빠짐없이 찾아 없애는 것이 최선의 예방법이다. 군은 겨울철 가지치기 작업 때 의심 증상을 정확히 가려낼 것을 당부했다. 육안 판별이 어려우면 농촌진흥청 '과수화상병 전문가 상담' 앱에 의심 부위 사진을 올려 감염 확률을 확인할 수 있다. 화상병에 걸린 줄기는 갈색이나 검은색으로 마르고 궤양 주변 조직이 물에 젖은 듯 축축하다. 껍질을 벗기면 내부 변색 경계가 흐릿하고 시간이 지날수록 갈변한다. 환부에서 시큼한 냄새와 끈적임이 나거나 주변에 주황색·갈색 세균액이 굳어 붙어 있기도 하다. 반면 부란병·겹무늬썩음병 등 유사 병해는 궤양 표면에 돌기가 돋거나 노란 실 모양 포자퇴가 나타난다. 껍질을 벗겼을 때 변색 경계가 뚜렷하고 정상 부위가 갈변하지 않는 점도 다르다. 궤양을 발견하면 증상 부위 맨 아래 끝에서 40~70cm 이상 더 내려간 지점을 잘라내야 한다. 절단면에는 티오파네이트메틸 성분의 세균성 전문 도포제 등 소독약을 반드시 바른다. 외부 인력 투입과 작업 도구 사용 시 소독 관리도 중요하다. 전정가위·톱은 나무를 옮길 때마다 70% 알코올에 90초 이상 담그거나 소독액으로 닦아야 한다. 외부 작업자는 사전 교육 후 과수원 출입 전후 신발을 소독하고 작업복은 60도 이상 온수로 세탁한다. 개정 식물방역법에 따라 궤양 제거는 농가의 법적 의무다. 화상병이 발생한 과수원에서 궤양을 방치하는 등 예방 수칙을 어기면 손실보상금이 감액될 수 있다. 과수화상병균은 겨울 동안 궤양 속에 잠복하다 봄철 기온이 오르고 꽃이 피면 빗물이나 곤충·도구를 타고 번진다. 개화기 이후에는 사실상 방제가 어려워 휴면기인 겨울철에 감염원을 원천 차단하는 것이 피해 예방의 관건이다. 농업기술센터 관계자는 \"의심 증상을 발견하면 즉시 농업기술과 과학영농팀이나 병해충 신고 대표번호로 알려달라\"고 말했다.","category":"사회"},{"title":"홍천군, 2027년 예산 8894억 편성…역대 최대","link":"https://n.news.naver.com/mnews/article/003/0014336862","naverLink":"https://n.news.naver.com/mnews/article/003/0014336862","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"내달 7일 군의회서 최종 확정 [홍천=뉴시스] 본예산안 주요 내용. (사진=홍천군 제공) photo@newsis.com *재판매 및 DB 금지 [홍천=뉴시스]정건웅 기자 = 강원 홍천군이 역대 최대 규모인 8894억원대의 내년도 본예산안을 편성했다. 군은 8894억6506만원 규모의 2027년도 본예산안을 마련해 20일 군의회에 제출했다. 올해 본예산 8227억원보다 8.1%인 667억원 늘어난 규모다. 회계별로는 일반회계 8200억원과 특별회계 694억원으로 구성됐다. 숙원 사업인 용문~홍천 광역철도 조기 착공을 위해 철도건설기금 전출금 100억원을 우선 반영했다. 분야별로 보면 정주 인프라·미래산업 분야에 도시재생·사회간접자본 구축 322억5000만원과 특화자원 활용 미래산업 169억4000만원을 책정했다. 경제·농림 분야에는 일자리 창출 363억원과 반값 농자재 지원 165억원을 배정했다. 청년 지원 17억9000만원과 소상공인 지원 4억6000만원도 포함됐다. 아이·복지 분야에는 어르신 복지 343억원과 교육경비 등 인재 육성 92억원을 투입한다. 앞서 군은 민선 9기 핵심 사업과 제62회 강원도민체육대회 준비를 위해 경상경비와 보조금을 과감히 구조조정했다. 내년도 예산안은 군의회 심의를 거쳐 내달 7일 본회의에서 최종 확정된다. 홍천군은 전국 기초자치단체 중 면적이 가장 넓어 기반시설 확충과 농림업 지원에 막대한 재정이 요구된다. 관행적 경상비를 줄여 확보한 재원을 광역철도 기금과 민생 사업에 집중 배분해 재정 효율성을 높였다. 신영재 홍천군수는 \"불필요한 경비를 줄이고 군민에게 희망을 주는 예산 편성에 집중했다\"며 \"민선 9기 핵심 사업과 도민체전 등 주요 현안을 빈틈없이 챙기겠다\"고 말했다.","category":"사회"},{"title":"[부고] 이병상(삼성중공업 커뮤니케이션미디어그룹 프로)씨 별세","link":"https://n.news.naver.com/mnews/article/029/0003060285","naverLink":"https://n.news.naver.com/mnews/article/029/0003060285","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[부고] 이병상(삼성중공업 커뮤니케이션미디어그룹 프로)씨 별세. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"감독관 없는 시험, 명예도 없었다… ‘시험지 촬영’ 공사 생도, 퇴교 처분","link":"https://n.news.naver.com/mnews/article/022/0004176889","naverLink":"https://n.news.naver.com/mnews/article/022/0004176889","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"감독관 없는 ‘명예시험’ 규정 위반 과거 기말고사 중 스마트폰으로 무단 촬영 조사 시작되자 자퇴 요청했지만 불수용 감독관 없이 시험을 치르는 공군사관학교에서 스마트폰으로 시험지를 몰래 촬영한 생도가 퇴교 처분을 받았다. 20일 공군사관학교 교육운영위원회에 따르면 운영위는 지난 9월 명예시험 규정을 위반한 3학년 생도 1명에 대해 퇴교 처분을 결정했다. 공군사관학교 교육운영위원회가 명예시험 규정을 위반한 3학년 생도 1명에게 퇴교 처분을 내린 사실을 빈 시험장과 결재 도장으로 표현한 이미지. 인공지능(AI) 플랫폼 ‘세계온(SEGYE.On)’으로 생성 공군사관학교는 생도들의 정직과 신의를 바탕으로 감독관 없이 시험을 치르는 ‘명예시험’ 제도를 운영하고 있다. 학교 측은 해당 생도가 시험 중 부정행위를 저질렀다는 신고를 받고 조사에 착수한 것으로 전해졌다. 조사 과정에서 이 생도가 과거 기말고사 시험지를 스마트폰으로 무단 촬영한 사실이 드러났다. 신고가 접수된 올해의 부정행위 의혹과 시험에서 인공지능(AI)을 활용했는지는 확인되지 않았다. 해당 생도는 조사가 시작되자 자퇴 의사를 밝혔지만 학교 측은 이를 받아들이지 않은 것으로 알려졌다. 학교 측은 정확한 사실관계를 파악하기 위해 조사를 이어갔으며, 지난 9월 교육운영위원회를 거쳐 퇴교 처분을 내렸다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/437/0000521774","naverLink":"https://n.news.naver.com/mnews/article/437/0000521774","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"의·치의학교육입문검사(MDEET·미트) 수석 합격자로 알려진 최모 씨가 'AI 부정행위' 의혹을 정면 반박하며 시험지와 성적표를 공개했습니다. 최씨는 입장문을 통해 \"이번 루머는 1년으로 알려진 준비기간과 출신학교에서 시작됐다고 생각한다\"며 \"실제 준비기간은 6년이며, 저는 어떤 시험도 부정한 방법으로 치지 않았다\"고 밝혔습니다. 앞서 올해 세무사시험 수석 합격자인 한모 씨가 AI를 이용한 부정행위를 자수하면서, 온라인에선 각종 국가자격시험 고득점자들을 향한 부정행위 의혹이 거세졌습니다. 의·치의학교육입문검사, 미트(MDEET) 수석 합격자로 알려진 최모 씨가 오늘(20일) 온라인에 입장문을 올리고 'AI 부정행위' 의혹을 정면 반박했습니다. 전남대학교 치의학전문대학원에 재학 중인 최씨는 \"협성대와 건국대 스포츠건강학과, 연세대 일반대학원 스포츠응용산업학과를 거쳐 2019년 8월부터 치의학 전문대학원 입시를 준비했다\"고 운을 뗐습니다. 이어 \"첫 시험에서 합격권을 넘겼지만 텝스(TEPS) 성적이 낮아 지원한 모든 학교 1차 전형에서 떨어졌다\"며 \"이후 텝스 공부 비중을 높이던 중 전남대 치의학전문대학원 1차 전형에서 미트 성적이 반영된다는 사실을 알게 돼 시험을 치렀고, 합격했다\"고 설명했습니다. 미트 시험지와 대학 성적표를 함께 공개한 최씨는 \"이번 루머는 1년으로 알려진 준비기간과 출신학교에서 시작됐다고 생각한다\"며 \"실제로 치의학전문대학원 입학을 위해 준비한 기간은 6년\"이라고 강조했습니다. 그러면서 \"시간이 지날수록 가족들과 주변 사람들이 상처를 받게 돼 글을 쓰게 됐다\"며 \"결코 어떤 시험도 부정한 방법으로 치지 않았고, 근거 없는 비방과 억측에 대해선 법적 대응하도록 하겠다\"고 경고했습니다. 앞서 올해 세무사 시험 수석 합격자인 한모 씨가 AI를 이용한 부정행위를 자수하면서 온라인에선 각종 국가자격시험 고득점자들을 향한 의혹이 불거졌습니다. 비슷한 시기 같은 의혹을 받던 법학적성시험, 리트(LEET) 만점자 이진우 씨는 \"수능 당일, 생중계로 국어 문제풀이를 하겠다\"며 의혹을 부인하던 중 숨진 채 발견됐습니다. (화면출처 : 유튜브 '메가엑스퍼트' '미미미누' 'DreamSchool 이윤규')","category":"사회"},{"title":"“중국인 학생들에 길 알려줬을 뿐인데…‘순금’ 받았습니다”[사연잇슈]","link":"https://n.news.naver.com/mnews/article/081/0003701737","naverLink":"https://n.news.naver.com/mnews/article/081/0003701737","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"공항철도 타는 법 알려줬더니 키링 선물 알고 보니 순금 0.02g 함유 “고마워하는 마음이 더 소중” 인천국제공항에서 만난 중국인 학생들에게 서울역으로 가는 길을 안내해줬다가 뜻밖의 순금 선물을 받았다는 남성의 사연이 전해졌다. 스레드(@hwi_yeol_park) 캡처 인천국제공항에서 만난 중국인 학생들에게 서울역으로 가는 길을 안내해줬다가 뜻밖의 금 선물을 받았다는 남성의 사연이 전해져 화제다. 지난 17일 소셜미디어(SNS) 스레드에는 “인천공항에서 만난 중국 학생들. 서울역 가는 길을 몰라서 서 있길래 안내해줬더니 가지고 있던 굿즈를 날름 떼서 주네”라는 글과 함께 사진 한 장이 올라왔다. 사진에는 라부부 캐릭터 모양의 황금색 키링이 담겼다. 글쓴이 A씨는 “다른 나라 사람이 공항철도를 처음 타려면 쉽지 않겠다는 생각에 길을 알려줬을 뿐”이라며 “별것 아닌 일인데도 고마워하는 그 마음이 정말 소중한 것 같다”고 했다. 이를 본 누리꾼들은 “진짜 금 같다”, “저걸 선물할 정도로 도움이 고마웠나 보다” 등의 반응을 보였다. 이에 A씨는 “집에 와서 확인해 보니 순금이 맞았다”고 밝혔다. 인천국제공항에서 만난 중국인 학생들에게 서울역으로 가는 길을 안내해줬다가 뜻밖의 순금 선물을 받았다는 남성의 사연이 전해졌다. 스레드(@hwi_yeol_park) 캡처","category":"사회"},{"title":"하만식 해경청장, 태안 연락두절 어선 수색 총력 지휘","link":"https://n.news.naver.com/mnews/article/003/0014336861","naverLink":"https://n.news.naver.com/mnews/article/003/0014336861","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[인천=뉴시스] 이루비 기자 = 20일 오후 인천 연수구 해양경찰청 본청에서 하만식 해경청장이 충남 태안 서격렬비도 인근 해상에서 연락이 두절된 어선의 수색 현황과 향후 대책을 점검하기 위해 중앙구조본부 대책회의를 주재하고 있다. 하 청장은 \"가용한 모든 자원을 총동원해 마지막 한명까지 희망의 끈을 놓지 않고 수색에 최선을 다해달라\"고 강조했다. (사진=해경청 제공) 2026.11.20. photo@newsis.com *재판매 및 DB 금지","category":"사회"},{"title":"하만식 해경청장, 태안 연락두절 어선 수색 상황 점검","link":"https://n.news.naver.com/mnews/article/003/0014336859","naverLink":"https://n.news.naver.com/mnews/article/003/0014336859","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[인천=뉴시스] 이루비 기자 = 20일 오후 인천 연수구 해양경찰청 본청에서 하만식 해경청장이 충남 태안 서격렬비도 인근 해상에서 연락이 두절된 어선의 수색 현황과 향후 대책을 점검하기 위해 중앙구조본부 대책회의를 주재하고 있다. 하 청장은 \"가용한 모든 자원을 총동원해 마지막 한명까지 희망의 끈을 놓지 않고 수색에 최선을 다해달라\"고 강조했다. (사진=해경청 제공) 2026.11.20. photo@newsis.com *재판매 및 DB 금지","category":"사회"}],"생활·문화":[{"title":"삼성전자, 전영현·노태문 투톱 유지...메모리·스마트폰 겸직 해소","link":"https://n.news.naver.com/mnews/article/023/0004010750","naverLink":"https://n.news.naver.com/mnews/article/023/0004010750","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"삼성전자 전영현 디바이스솔루션(DS) 부문장(부회장)과 노태문 디바이스경험(DX) 부문장(사장). 삼성전자가 전영현 부회장과 노태문 사장의 ‘투 톱’ 체제를 유지하며 경영 안정에 힘을 실었다. 전 부회장은 반도체(DS) 부문장, 노 사장은 완제품(DX) 부문장을 계속 맡되, 각각 겸임해 온 메모리 반도체와 스마트폰 사업부장에는 새 리더십을 수혈했다. 경영의 연속성을 유지하면서 핵심 사업 역량을 강화하려는 움직임으로 풀이된다. 삼성전자는 20일 사장 승진 3명, 보직 변경 3명 등 총 6명 규모의 2027년 정기 사장단 인사를 발표했다. 사장 승진자 3명은 모두 반도체 부문에서 나왔다. ‘성과 있는 곳에 보상 있다’는 원칙에 따라 천문학적 실적을 내는 반도체 부문의 주요 부사장들을 전면 배치한 것이다. 전영현 DS 부문장과 노태문 DX 부문장은 겸직하고 있던 메모리사업부장, MX사업부장 자리를 내려놨다. 전 부회장은 파운드리(반도체 위탁 생산) 등 미래 사업의 경쟁력 강화에, 노 사장은 신사업 육성에 주력할 예정이다. 전 부회장과 노 사장의 2인 대표이사 체제도 유지된다. 삼성전자의 실적을 이끄는 메모리사업부장에는 황상준 사장이 임명됐다. 황 사장은 지난해 말부터 메모리개발담당 겸 D램 개발실장을 맡으며 고대역폭 메모리(HBM)와 D램 경쟁력 제고를 주도했다. 메모리사업부장을 맡으면서 기존 D램 개발실장도 겸임한다. 스마트폰의 뇌 역할을 하는 애플리케이션 프로세서(AP)와 이미지센서 등을 만드는 시스템LSI사업부는 삼성전자 반도체 미주 법인을 이끌어 온 조상연 사장이 맡는다. 삼성전자는 조 사장이 미국 고객사를 상대해 온 경험을 살려 신규 고객을 확보할 것으로 기대했다. 반도체 부문 최고기술책임자(CTO) 겸 반도체연구소장에는 반도체 신공정 개발을 이끌어 온 이종명 사장을 선임했다. 노태문 사장이 2020년부터 약 7년간 맡았던 MX사업부장에는 최원준 사장이 선임됐다. 퀄컴 출신인 최 사장은 MX사업부 개발실장과 최고운영책임자(COO)를 거치며 갤럭시 AI 도입과 갤럭시 S26, Z폴드8 등의 개발을 주도했다. 노 사장은 로봇 사업을 총괄하는 RX사업추진실장 직책은 유지한다. 삼성전자는 “핵심 사업 경쟁력 및 사업 간 시너지를 강화하는 동시에 미래 사업 경쟁력 강화를 적극적으로 추진할 것”이라고 밝혔다. 한편 삼성전기 장덕현 사장, 삼성디스플레이 이청 사장, 삼성SDS 이준희 사장, 삼성SDI 최주선 사장 등 삼","category":"생활·문화"},{"title":"공사 생도, 감독관 없는 ‘명예시험’ 도중 스마트폰 꺼내 시험지 촬영","link":"https://n.news.naver.com/mnews/article/658/0000161836","naverLink":"https://n.news.naver.com/mnews/article/658/0000161836","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"자퇴 의사 밝혔으나 공사 측 퇴교 처분 기사 내용과 관련 없음. 공군사관학교 제공 모든 시험을 감독관 없이 ‘명예시험’으로 치르는 공군사관학교에서 생도가 스마트폰으로 시험지를 촬영한 사실이 적발돼 퇴교 조치된 것으로 20일 파악됐다. 공군사관학교 교육운영위원회는 사관학교 명예시험 규정을 위반한 3학년 생도 1명에 대해 지난 9월 퇴교 처분을 결정했다고 이날 밝혔다. 사관학교 측은 앞서 해당 생도가 시험중 부정행위를 저질렀다는 신고를 받고 조사를 벌인 결과 과거 치러진 기말고사 시험중 시험지를 무단 촬영한 사실을 확인했다. 신고가 접수된 올해의 부정행위 의심 정황은 직접 확인되지 않았다. 문제의 생도가 인공지능(AI)을 시험에 활용했는지도 확인되지는 않았다. 다만 조사가 시작되자 문제의 생도는 자퇴 의사를 밝혔다. 공군사관학교 측은 정확한 경위 파악을 위해 생도의 자퇴 의사를 수용하지 않고 조사 절차를 진행하다가 지난 9월 결국 최종 퇴교 처분을 내렸다. 공군사관학교는 “사안을 엄중히 인식하고 명예교육 강화, 스마트기기 소지 여부 확인 절차 보강 등 대책을 강구하여 시행 중”이라며 “생도들이 부정행위 없이 명예롭게 시험에 임할 수 있도록 훈육하고 있다”고 말했다.","category":"생활·문화"},{"title":"박종원 담양군수, 내년 기본소득·스마트농업에 역점","link":"https://n.news.naver.com/mnews/article/277/0005845836","naverLink":"https://n.news.naver.com/mnews/article/277/0005845836","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"내년도 예산안 5,902억원 편성 긴급돌봄 지원·미래교육재단 설립 박종원 담양군수가 농어촌 기본소득과 스마트농업 육성 등 주민 소득 증대와 생활 안정을 내년도 군정 핵심 과제로 제시했다. 박 군수는 20일 제348회 담양군의회 제2차 정례회 시정연설에서 농업·경제·복지·문화관광·교육·행정 등 6개 분야 군정 운영 방향을 이같이 밝혔다. 박종원 담양군수가 20일 제348회 담양군의회 제2차 정례회에서 시정연설을 하고 있다. 담양군 제공 농업 분야 핵심 사업은 스마트농업 육성지구 조성과 농업용 로봇 실증이다. 농어촌 기본소득과 햇빛소득 등 주민 소득 증대 정책을 마련하고 광역교통망 확충에도 나선다. 복지 분야에서는 생활 긴급지원 서비스 '언능오쇼'와 긴급돌봄 간병비 지원에 중점을 뒀다. 문화관광과 교육 분야 주요 과제로는 '사계절 담빛 페스타'와 미래교육재단 설립을 제시했으며, 행정조직은 3개 수석실 중심으로 개편한다. 담양군은 내년도 예산안을 올해보다 9.2% 늘어난 5,902억원으로 편성했다. 분야별로는 사회복지 1,431억원, 농업 1,222억원, 환경 949억원으로 전체 예산안의 61%가 이들 3개 분야에 배정됐다. 예산안은 다음 달 18일 군의회 본회의에서 처리될 예정이다. 박 군수는 \"군민의 기대를 결과로 증명하는 행정, 신뢰로 평가받는 행정을 펼칠 것\"이라며 \"군민이 일상에서 체감할 수 있는 변화를 만드는 데 집중하겠다\"고 말했다.","category":"생활·문화"},{"title":"포스코 노사, 임금협상 재합의…격려금 620만원·특별조정분 60만원","link":"https://n.news.naver.com/mnews/article/014/0005607551","naverLink":"https://n.news.naver.com/mnews/article/014/0005607551","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"1차 잠정안 부결 13일 만…기본임금 2.6% 인상 유지 격려금 20만원 추가·의료비 지원 개선…조합원 찬반투표 남아 경북 포항 포스코 본사. 사진=연합뉴스 [파이낸셜뉴스]포스코 노사가 첫 잠정합의안이 조합원 투표에서 부결된 지 13일 만에 임금교섭에 다시 잠정 합의했다. 기본임금 2.6% 인상은 유지하되 격려금을 기존보다 20만원 늘리고 특별조정분 60만원 지급 등을 추가했다. 최종 타결 여부는 조합원 찬반투표에서 결정된다. 포스코는 20일 경북 포항 본사에서 노동조합과 본교섭을 열고 2026년 임금교섭 잠정합의안을 도출했다고 밝혔다. 이번 합의안에는 기본임금 2.6% 인상과 목표달성 격려금 350만원, 타결축하·노사화합장려금 220만원, 지역사랑상품권 50만원 지급이 포함됐다. 격려금과 상품권을 합친 금액은 620만원으로 기존 잠정합의안보다 20만원 늘었다. 의료비 지원 개선과 특별조정분 60만원 지급도 추가 반영됐다. 앞서 포스코 노사는 지난 10월 30일 첫 잠정합의안을 마련했지만, 이달 7일 실시한 조합원 찬반투표에서 찬성 48.3%, 반대 51.7%로 부결됐다. 이후 노사는 후속 교섭을 이어왔으며, 노조의 상경집회 과정에서 이희근 포스코 대표이사와 노조위원장이 면담을 갖기도 했다. 포스코 노조는 조만간 새 잠정합의안에 대한 조합원 찬반투표를 실시할 예정이다. 투표에서 과반수 찬성을 얻으면 올해 임금교섭이 최종 타결된다.","category":"생활·문화"},{"title":"2~3분 지연됐지만… 지하철 준법투쟁 큰 혼란 없었다","link":"https://n.news.naver.com/mnews/article/021/0002834295","naverLink":"https://n.news.naver.com/mnews/article/021/0002834295","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"■ 노조, 오늘부터 돌입 현장인력 1300명 충원 요구 “거부하면 25일 총파업 진행” 서울교통공사, 재정난에 난색 “작년 적자만 8268억원 달해” 북적거리는 승강장 서울 지하철 노동조합이 인력 충원 등을 요구하며 준법투쟁에 나선 가운데 20일 서울 중구 서울역 지하철 1호선 승강장이 시민들로 붐비고 있다. 뉴시스 서울지하철 노동조합이 20일 대규모 인력 충원을 요구하며 준법투쟁에 돌입했다. 노조는 현장 인력 공백을 해소하기 위해 1300여 명의 긴급 충원을 요구하고 있지만, 만성적인 재정난을 겪는 서울시와 서울교통공사는 노조 측 요구에 난색을 보이고 있다. 노조가 오는 25일부터 무기한 총파업을 예고하면서 지하철 운행 차질에 대한 우려도 커지고 있다. 이날 서울교통공사 등에 따르면 민주노총 소속 제1노조와 한국노총 소속 제2노조는 오전 6시부터 준법투쟁에 들어갔다. 기관사들은 지연된 운행 시간을 만회하기 위한 회복운전을 하지 않고, 역마다 정차 시간을 규정상 최대치인 30초까지 지키는 방식이다. 차량·기술·시설·전기 분야 직원들도 위험 작업 시 2인 1조 원칙을 철저히 지키고 특별점검과 추가 작업을 거부하기로 했다. 이날 수도권광역급행철도(GTX)-A 노조도 준법투쟁에 동참했다. 이에 따라 준법투쟁 첫날부터 출근길 일부 구간에서 열차 운행이 지연됐다. 오전 9시 기준 1호선 시청역 상행선에서는 스크린도어 고장으로 열차 운행이 20분간 지연됐고, 2호선 등에서도 상·하행 열차가 2∼3분씩 늦어졌다. 다행히 승객들이 큰 불편을 겪거나 역사 내 혼잡이 발생하는 상황은 없었다. 공사는 준법투쟁에도 하루 열차 운행 횟수와 출퇴근 시간대 배차 간격을 평소 수준으로 유지하고, 혼잡 역사에는 추가 인력을 투입한다는 방침이다. 이번 노사 갈등의 핵심은 신규 채용 규모를 둘러싼 입장 차다. 공사는 현재 504명에 대한 신규채용 절차를 진행 중인데, 노조는 현장 인력 공백을 해소하기 위해 이에 더해 약 800명을 더 충원해야 한다는 입장이다. 하지만 서울시와 공사는 경영 효율화를 위해 오히려 인력 조정이 필요하다고 난색을 표하고 있다. 앞서 공사는 2021년 경영혁신계획을 수립하고 올해까지 정원 2212명을 감축하는 방안을 추진한 바 있다. 현재까지 684명의 정원을 줄였으며, 나머지 1528명에 대한 감축은 보류된 상태다. 서울시와 공사는 2017년 서울메트로와 서울도시철도공사 통합 이후에도 중복 조직·업무가 충분히 정리되지","category":"생활·문화"},{"title":"10세 안팎 子사망…“부모가 돈 벌려고 죽였다” 화가가 분노한 이유[이원율의 후암동 미술관-귀스타브 도레 편]","link":"https://n.news.naver.com/mnews/article/016/0002726453","naverLink":"https://n.news.naver.com/mnews/article/016/0002726453","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"230. 귀스타브 도레 묘기중 다쳐 죽어가는 소년 곡예사 부모 눈물짓고…서글픈 그림 탄생 소년 소녀를 평생 소재로 삼은 화가 본인 처지를 이입하고 녹여냈을까 편집자 주 후암동 미술관 은 무한한 디지털 공간에 걸맞은 초장편 문화예술 스토리텔링 연재물의 ‘원조 맛집’입니다. ■기자 구독■ 을 누르시면 매 주말 새로운 예술 이야기를 즐기실 수 있습니다. 기사는 역사적 사실 기반에 일부 상상력을 더한 스토리텔링으로 쓰였습니다. “아이는 죽어가고 있다” 귀스타브 도레, 곡예사들(일부 확대), 1874, 캔버스에 유채, 225x184cm, 로제 키요 미술관 [Roger-Quilliot, Public Domain, commons.wikimedia.org] [헤럴드경제=이원율 기자]묘기를 부리던 꼬마 가 다쳤다. 어머니가 그런 아이를 안는다. 쏟아지는 피부터 닦는다. 소년은 신음을 멈추지 않는다. 눈을 감은 채 경련만 이어갈 뿐이다. 어머니 는 운다. 이마에 입을 맞추며 눈물을 또르르 흘린다. 그녀 또한 곡예사다. 그녀는 싸구려 왕관과 귀걸이, 눅눅한 푸른 천에 생뚱맞은 발레 슈즈를 챙겼다. 오직 눈에 띄기만 하는 복장이다. 이렇게 다음 순서를 기다리고 있었을 것이다. 준비한 곡예와 연기, 의상 모두 이제는 쓸모가 없어져 버렸지만. 옆에는 아버지 가 있다. 그의 행색은 지금도 우스꽝스럽다. 붉은 머리칼은 뾰족하게 세웠다. 꽉 끼는 몸으로 금빛 타이즈가 불룩하다. 이 또한 관객석의 폭소를 끌어내기 위한 분장일 것이다. 손으로는 땀에 찌든 채 늘어진 서커스 신발을 들고 있다. 귀스타브 도레, 곡예사들, 1874, 캔버스에 유채, 225x184cm, 로제 키요 미술관 [Roger-Quilliot, Public Domain, commons.wikimedia.org]","category":"생활·문화"},{"title":"수능 끝 한파 속 독감 확산…수험생 건강관리 '주의보'","link":"https://n.news.naver.com/mnews/article/422/0000928326","naverLink":"https://n.news.naver.com/mnews/article/422/0000928326","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"제주(20일, 금)…강풍·풍랑에 추위까지[오늘의 날씨]","link":"https://n.news.naver.com/mnews/article/421/0009300372","naverLink":"https://n.news.naver.com/mnews/article/421/0009300372","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"주말 아침, 대부분 지역 영하권 추위…충남·전라·제주, 눈 또는 비","link":"https://n.news.naver.com/mnews/article/449/0000368236","naverLink":"https://n.news.naver.com/mnews/article/449/0000368236","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"\"고양이가 훔쳐 온 물건 찾아가세요\"…편의점 앞에 등장한 '분실물 상자'","link":"https://n.news.naver.com/mnews/article/003/0014336848","naverLink":"https://n.news.naver.com/mnews/article/003/0014336848","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 고양이 하림이가 물어 온 물건을 모아 편의점 앞에 두고 주인을 찾고 있다. (사진출처=스레드 @'cu_hwangsang' 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 편의점 앞에 고양이가 물어 온 물건을 모아둔 상자가 등장했다. 양말과 장갑, 수건 등 주변 물건을 잇달아 물어 오는 고양이의 습관에 점주가 직접 주인 찾기에 나섰다. 지난 16일 소셜미디어(SNS) 스레드에는 편의점 앞에 놓인 상자 사진과 함께 고양이 하림이가 물건을 물어 오는 사연이 올라왔다. 사진 속 상자에는 '하림이가 훔쳐 온 물건. 본인 물건 가져가세요'라는 안내문이 붙어 있다. 아래에는 작은 고양이 그림과 영어로 '미안하다(sorry)'는 문구도 적혀 있다. 상자 안에는 작업용 목장갑과 천 조각 등 여러 물건이 담겨 있다. 편의점의 마스코트인 하림이는 평소 주변에서 물건을 물어 오는 일이 잦은 것으로 전해졌다. 점주 A씨는 \"참새, 매미, 사마귀, 쥐도 잡아 왔었다\"고 말했다. A씨는 하림이가 동물을 잡아 올 때마다 혼냈다고 한다. 그러자 하림이는 양말과 장갑, 수건, 외투 등 주변에 있는 물건을 물어 오기 시작했다. A씨는 \"그때마다 혼냈더니 눈에 보이는 건 다 물고 온다\"고 설명했다. A씨는 \"편의점에서 장갑을 자주 끼고 일해서 가져오는 게 아닐까\"라고 추측했다. 하림이가 물어 온 물건을 본 A씨는 실제로 잃어버린 사람이 있을 수 있다고 생각해 편의점 앞에 상자를 마련하고 주인을 찾기로 했다. A씨는 \"3살 버릇 여든 간다는데 누가 하림이 버릇 좀 고쳐주세요\"라며 웃음 섞인 당부를 남겼다. 게시글을 접한 네티즌들은 \"물건을 주워 오는 건 보은의 표시라던데\", \"가정형편에 보탬이 된다고 생각했나 보다\" 등의 반응을 보였다. 또 다른 네티즌은 과거 키우던 고양이도 동물을 잡아 오다가 가족이 혼내자 속옷과 양말, 면장갑을 물어 왔다며 \"물어 오지 말라고 혼냈더니 씨앗 들어 있는 봉지들을 물어 왔다\"고 적었다. 이어 \"엄마가 마당 텃밭에 면장갑, 목장갑 끼고 심는 걸 보더니 똑똑이\"라고 덧붙였다. 이 밖에도 \"뭐라도 물고 와서 주는 게 넘 기특하고 귀엽다\", \"고마움을 아는 고양이\", \"물건은 하림이가 훔쳤는데 물건 찾으러 주인이 와야 하는 현실\" 등의 댓글이 달렸다．","category":"생활·문화"}],"세계":[{"title":"브렉시트로 갈라선 EU·영국, 정상회담서 관계 재설정 시동","link":"https://n.news.naver.com/mnews/article/001/0016455370","naverLink":"https://n.news.naver.com/mnews/article/001/0016455370","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"브렉시트로 갈라선 EU·영국, 정상회담서 관계 재설정 시동. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"미 법무부, 알래스카 '상원 선거 결과 인증 저지' 소송 취하","link":"https://n.news.naver.com/mnews/article/052/0002435931","naverLink":"https://n.news.naver.com/mnews/article/052/0002435931","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"미국 법무부가 공화당 후보와 동명이인인 후보가 등장한 것을 이유로 알래스카주 연방 상원의원 선거 결과 인증을 보류해달라며 낸 소송을 취하했습니다. 현지 시간 20일 미 일간 워싱턴포스트에 따르면 법무부는 전날 제9 연방항소법원에 이번 소송을 기각해달라고 요청했습니다. 앞서 법무부는 선거운동이 한창이던 지난달 22일 연방지방법원에 이 같은 내용의 소송을 낸 바 있습니다. 알래스카주 공화당 상원의원 후보인 댄 S. 설리번 현역 상원의원과 중간 이름만 다른 댄 J. 설리번 후보가 출마함으로써 유권자 혼란이 예상되므로 댄 J. 설리번 후보를 선택한 유권자의 실제 투표 의도를 확인할 때까지 선거 결과 공식 인증을 보류해야 한다는 주장입니다. 이 소송은 선거 이틀 전인 1일 1심 법원에 의해 기각됐지만, 법무부는 이에 항소했습니다. 법무부는 소송 기각을 요청하면서 개표가 이미 완료됐기 때문에 유권자의 투표 의도를 조사하는 것이 불가능하다는 이유를 들었습니다. 알래스카주 상원의원 선거는 선거일 2주일 만인 17일에야 개표가 완료됐고, 민주당 메리 펠톨라 후보가 50.1%를 득표하면서 승리를 확정했습니다. 이에 따라 민주당은 연방 상원에서 18년 만에 최다 의석인 56석을 확보했으며, 미 전역에서 모두 9석의 연방 상원 의석을 탈환하며 1958년 중간선거 이후 68년 만에 최대 의석 탈환 기록을 세웠습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"세계"},{"title":"사우디 80층 타워 공격한 후티, 금융지구·발전소 추가 공격 예고","link":"https://n.news.naver.com/mnews/article/437/0000521776","naverLink":"https://n.news.naver.com/mnews/article/437/0000521776","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"후티 반군의 공격으로 파손된 사우디 리야드 금융지구 내 국부펀드 타워 〈사진=로이터〉 사우디아라비아 수도 리야드의 국부펀드 타워를 공격한 예멘의 후티가 금융지구와 발전소 등 사우디 주요 시설에 대한 추가 공격을 예고했습니다. 예멘의 친이란 반군 후티가 사우디아라비아 수도 리야드의 금융지구와 발전소 등 주요 시설에 대한 추가 공격을 예고했습니다. 사우디가 예멘 내 발전소를 공격한 데 따른 보복이라는 주장입니다. 후티는 현지 시간 20일 성명을 내고 사우디의 슈카이크 발전소를 공격 대상으로 지목했습니다. 후티는 슈카이크 발전소에서 근무하는 직원들에게 즉시 대피하라고 경고했습니다. 민간인들에게도 발전소에 접근하지 말 것을 요구했습니다. 수도 리야드의 핵심 금융시설도 공격 대상으로 지목했습니다. 후티는 \"적국 사우디의 수도 리야드에 위치한 킹 압둘라 금융지구(KAFD) 내 금융센터도 우리 군의 군사 표적\"이라며 \"이 시설의 모든 직원과 근로자, 민간인은 즉시 그곳에서 멀리 떨어지라\"고 촉구했습니다. 후티는 전날에도 이 금융지구에 있는 80층 높이의 사우디 국부펀드(PIF) 타워를 공격해 건물 일부를 파손했습니다. 사우디의 항구와 영공에 대한 공격 가능성도 경고했습니다. 후티는 \"적이 예멘 호데이다 항구 폭격 위협을 실행에 옮길 경우, 제다 등 홍해 연안의 모든 사우디 항구가 우리 군의 표적이 될 것\"이라고 밝혔습니다. 후티는 항공사들에도 사우디 영공을 피하라고 경고했습니다. 후티는 \"메카와 메디나 상공의 신성한 영공을 제외한 사우디 영공은 향후 몇 시간 동안 우리 군사작전의 무대가 될 것\"이라며 \"사우디 영공은 안전하지 않다\"고 주장했습니다. 앞서 사우디 주도 연합군은 이날 예멘의 주요 항구인 호데이다 항구에 있는 민간인들에게 대피를 경고했습니다.","category":"세계"},{"title":"10월 인도 인프라 생산 10.9% 급증…\"석탄·철광석·전력 호조\"","link":"https://n.news.naver.com/mnews/article/003/0014336865","naverLink":"https://n.news.naver.com/mnews/article/003/0014336865","pubDate":"2026-11-20T12:00:00+09:00","author":"네이버뉴스","description":"[문드라=AP/뉴시스] 인도 구자라트주 문드라에 있는 아다니 공장에서 풍력 터빈을 조립하는 작업을 진행하고 있다. 자료사진. 2026.11.20 [서울=뉴시스]이재준 기자 = 인도 인프라 관련 산업 생산이 10월에 석탄과 철광석·전력 생산 증가에 힘입어 10.9% 급증했다. PTI, 힌두, 마켓워치에 따르면 인도 상공부는 20일 인도 산업 경기와 건설·투자 활동을 파악할 수 있는 10월 핵심 인프라 산업지수(ICI 2022/23년도=100)가 123.1으로 전년 동월 대비 10.9% 상승했다고 발표했다. 역대 최고를 경신했다. 9월 ICI 상승률 8.2%(조정치)에서 2.7% 포인트나 가속했다. 지난해 10월 인프라 생산 증가율이 0.8%에 그쳤던 만큼 기저효과도 상당히 작용했다고 매체는 평가했다. 인프라 산업지수는 석탄·원유·천연가스·정유제품·비료·철강·시멘트·전력·철광석 등 9개 산업의 생산을 집계한다. 인도 전체 산업생산의 약 3분의 1을 차지하는 주요 지표다. 올해 6월부터 기준연도를 2022/2023년도 변경하면서 기존 8개 산업에 철광석을 추가했다. 생산 증가를 주도한 품목은 석탄과 철광석이다. 석탄 생산은 10월 전년 동월보다 23.1% 급증했다. 9월 증가율 10.7%보다 2배 이상 확대했다. 철광석 생산도 26.4% 늘어 9월 증가율 18.4%를 웃돌았다. 중동전쟁에 따른 천연가스 가격 급등으로 아시아 지역에서 석탄 화력발전 비중이 높아진 흐름과 맞물려 석탄 생산이 증가했다. 천연가스 가격 상승에 대응해 석탄을 활용한 발전량을 늘리면서 석탄 수요가 확대했다. 건설 관련 원자재 생산 역시 호조를 보였다. 시멘트 생산은 작년 동월에 비해 15.4% 많아 9월 증가율 10.1%를 넘어섰다. 철강 생산은 7.3% 늘어 9월 5.6%보다 증가폭이 커졌다. 전력 생산은 21.6% 증대해 9월 12.6% 증가에서 대폭 확대했다. 석탄 생산 증가와 함께 전력 공급을 위한 발전량이 늘어났다. 반면 원유 생산은 4.1% 줄었다. 9월 감소율 1.4%보다 낙폭이 확대했다. 천연가스 생산도 7.6% 줄어 9월 4.6% 감소보다 부진했다. 비료 생산은 12.2% 축소했다. 9월 감소율 11.7%과 비교해 낙폭이 커졌다. 정유제품 생산은 3.4% 증가했지만 9월 증가율 8.7%보다는 둔화했다. 인프라 생산은 회계연도 기준 누적 실적에서도 증대했다. 2026/27년도를 시작한 4월부터 10월까지 7개월 간 생산 증가율은","category":"세계"},{"title":"APTOPIX Trump Triumphal
