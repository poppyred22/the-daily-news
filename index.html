와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"“폭죽 테러 당했는데 경찰이 외면” 강릉 해변 ‘발칵’…20대男 주장 진실은","link":"https://n.news.naver.com/mnews/article/011/0004679679","naverLink":"https://n.news.naver.com/mnews/article/011/0004679679","pubDate":"2026-11-07T10:16:02.704972+09:00","author":"네이버뉴스","description":"강원 강릉 경포해변을 찾은 나들이객들이 피서를 즐기고 있다. 뉴스1 강원 강릉의 한 해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보가 경찰 조사 결과 거짓으로 밝혀졌다. 지난해 강원 양양에서도 성범죄와 마약 관련 허위 정보가 온라인에 퍼져 지역 상인들이 피해를 호소한 바 있다. 동해안 관광지를 겨냥한 가짜뉴스가 반복되면서 지역 이미지 훼손에 대한 우려가 커지고 있다. 폭죽 맞아 화상 입었다더니…사건 당시 강릉에도 없었다 6일 경찰 등에 따르면 강릉경찰서는 최근 강문해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보와 관련해 사실관계를 확인한 결과 피해 주장과 경찰의 신고 묵살 의혹이 모두 허위인 것으로 파악했다. 거짓 제보를 퍼뜨린 인물은 인천에 거주하는 27세 남성 A씨로 확인됐다. A씨는 인터넷에서 확보한 폭죽 영상과 2도 화상 사진을 자신의 피해 증거인 것처럼 꾸며 방송사와 온라인 커뮤니티 등에 전달한 것으로 조사됐다. A씨가 주장한 사건 발생 시점은 지난달 20일 저녁이었다. 그는 당시 강릉 강문해변에서 일부 남성이 사람을 향해 폭죽을 발사해 화상을 입었다고 주장했다. 경찰에 신고했지만 가해자의 신원을 확인하기 어렵다는 이유로 제대로 된 조치를 받지 못했다고도 했다. 하지만 경찰이 당시 행적을 추적한 결과 A씨는 강릉이 아닌 인천에 머물고 있었다. 주장한 피해 내용과 일치하는 112신고 기록도 존재하지 않았다. 다만 강문해변에서 실제 폭죽놀이가 이뤄진 정황은 확인됐다. 경찰은 현장에서 폭죽을 사용한 것으로 추정되는 20대 남성 2명의 신원을 파악하고 해수욕장법 위반 여부를 검토했다. 그러나 이들의 폭죽놀이와 A씨가 주장한 화상 피해는 별개인 것으로 확인됐다. 경찰이 피해 신고를 묵살했다는 주장 역시 사실이 아니었다. 관련 온라인 게시물은 현재 삭제된 상태다. 경찰은 A씨가 허위 정보를 퍼뜨린 경위를 살펴보고 명예훼손 등 혐의를 적용할 수 있는지 검토할 방침이다. 지난해 양양군 현남면 인구해수욕장에 내걸렸던 현수막. 뉴스1","category":"사건 사고"},{"title":"“사지 마” 입담에 인파 폭발… 경찰 출동한 ‘남대문 스카프’ 결국","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:16:02.704948+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:16:02.704931+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:16:02.704925+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[속보] 김종철 경찰청장 후보자 “막중한 책임 느껴”…경찰위 출석","link":"https://n.news.naver.com/mnews/article/025/0003563343","naverLink":"https://n.news.naver.com/mnews/article/025/0003563343","pubDate":"2026-11-07T10:08:37.041304+09:00","author":"네이버뉴스","description":"김종철 경찰청장 직무대행이 6일 이재명 대통령이 참석한 가운데 청와대에서 열린 한·동티모르 치안협력을 위한 기술약정서 체결식에 참석해 약정서 서명하기 위해 펜을 들고 있다. 청와대통신사진기자단 신임 경찰청장 후보자인 김종철 경찰청 차장은 6일 “엄중한 시기에 경찰청장 후보자로 지명된 것에 막중한 책임을 느낀다”고 밝혔다. 김 후보자는 이날 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하기 전 “경찰에 대한 국민의 기대가 어느 때보다 높고 또 그 이상 우려의 목소리가 크다는 걸 잘 알고 있다”며 이같이 말했다. 이어 “오늘 후보자로서 역량과 자질을 검증받는 만큼 책임 있는 자세로 성실히 임하겠다”고 했다. 경찰위는 이날 임시회의에서 김 후보자의 임명 제청 동의 여부를 심의한다. 경찰청장 인선은 대통령실의 후보자 추천, 경찰위 동의, 행정안전부 장관 제청, 국회 인사청문회, 대통령 임명 순으로 진행된다. 인사청문회를 거치되 국회의 임명 동의는 필요하지 않다. 김 후보자는 1970년 경남 함양에서 태어나 진주 명신고와 한국외국어대 영어과를 졸업했다. 1997년 경찰간부후보생 45기로 경위에 임관했다. 2019년 서울 서초경찰서장을 지냈으며, 2021년 경무관으로 승진해 부산경찰청 자치경찰부장을 맡았다. 같은 해 7월에는 문재인 정부 청와대 국정상황실에서 근무했다. 이후 대구·대전경찰청 공공안전부장, 서울경찰청 생활안전교통부장, 충남경찰청 공공안전부장, 강원경찰청 생활안전부장 등을 역임했다. 지난해 9월 치안감으로 승진해 경남경찰청장을 맡았고, 올해 8월 치안정감 승진자로 내정됐다. 이어 9월 경찰청 차장에 임명돼 청장 직무대행을 맡고 있다.","category":"사건 사고"},{"title":"세 번 만난 일본인 여성 왜 살해했나…30대 남성, 주식 실패에 처지 비관","link":"https://n.news.naver.com/mnews/article/008/0005437859","naverLink":"https://n.news.naver.com/mnews/article/008/0005437859","pubDate":"2026-11-07T00:26:25.047999+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"“암 말기” 구속 피하고 ‘스토킹 살인’ 60대… “대화 중 화나서” 혐의 인정","link":"https://n.news.naver.com/mnews/article/081/0003696787","naverLink":"https://n.news.naver.com/mnews/article/081/0003696787","pubDate":"2026-11-07T00:26:25.047980+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/mnews/article/088/0001038903","naverLink":"https://n.news.naver.com/mnews/article/088/0001038903","pubDate":"2026-11-07T00:26:25.047962+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"[그해 오늘]골목서 폭행당한 뒤 끝내 숨져…김창민 감독 사망 1년","link":"https://n.news.naver.com/mnews/article/018/0006405407","naverLink":"https://n.news.naver.com/mnews/article/018/0006405407","pubDate":"2026-11-07T00:26:25.047940+09:00","author":"네이버뉴스","description":"김창민 감독의 사망 사건을 1년 뒤 되짚으며 당시 사건 경과와 관련자들의 책임 문제를 다룬다.\n사건 이후 제기된 의문과 대응 과정을 살펴본다.\n폭력 피해를 줄이기 위한 예방과 신속한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:16:03.660862+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:16:02.704974+09:00","author":"네이버뉴스","description":"[김형자 과학칼럼니스트 sisa@sisajournal.com] 안경테에 내장된 카메라로 문제 촬영, AI가 분석해 렌즈에 정답 띄워 신종 부정행위 도구로 악용되는 스마트 기기…당국 '엄벌' 경고 속 대응 고심 시험지를 바라보는 수험생. 안경테에 숨겨진 카메라가 문제를 촬영하고, 인공지능(AI)이 순식간에 답을 찾아낸다. 정답은 안경을 쓴 사람만 볼 수 있는 작은 화면에 나타난다. 겉보기엔 평범한 안경이지만, 실제로는 AI가 대신 문제를 풀고 있는 셈이다. 11월19일 치러지는 2027학년도 대학수학능력시험(수능)을 앞두고 교육 현장에 비상이 걸렸다. 최근 연세대와 서울시립대 논술시험장에서 AI 스마트 안경(AI 안경)을 이용한 부정행위가 잇따라 적발된 데 이어 올해 국가자격시험에서도 5건의 부정행위가 확인됐기 때문이다. 첨단 기술이 가져온 편리함이 이제는 시험의 공정성을 흔드는 새로운 변수로 떠올랐다. ⓒChatGPT 생성이미지 일반 안경으로 위장한 'AI 기기' 식별법은 수능 출제기관인 한국교육과정평가원(평가원)과 교육부는 2027학년도 수능부터 AI 안경을 반입 금지 물품으로 지정하고 강력한 제재 방침을 내놨다. AI 안경을 이용해 부정행위를 한 수험생은 형사고발하거나 수사를 의뢰하는 등 엄정하게 대응한다는 계획이다. 시험 중 착용은 물론 가방 등에 소지하는 것만으로도 해당 시험이 무효 처리되고, 다음 해 응시 자격도 정지된다. 현재 1년인 응시 자격 정지 기간을 최대 3년으로 확대하는 방안도 추진 중이다. 나아가 논술·면접 등 대학별 고사에서도 강화된 제재 방침을 적용할 수 있도록 각 대학에 권고하기로 했다. 문제는 AI 스마트 안경이 일반 안경과 외형상 큰 차이가 없어 현장에서 쉽게 식별하기 어렵다는 점이다. 그렇다면 시험장에서는 과연 어떤 단서로 이 위험한 기기를 가려내야 할까. AI 안경은 일반 안경에 인공지능 기능을 결합한 웨어러블 기기다. 안경테 안에는 카메라와 마이크, 소형 스피커 등이 탑재돼 있고, 일부 제품은 렌즈에 작은 화면을 띄우는 디스플레이까지 갖추고 있다. 작동 방식은 크게 세 단계로 나뉜다. 먼저 안경에 달린 카메라가 사용자의 바라보는 풍경이나 사물을 촬영하고, 마이크는 사용자의 음성과 주변 소리를 수집한다. 이렇게 모아진 정보는 스마트폰이나 인터넷을 거쳐 AI에 전달된다. 그러면 마지막으로 AI가 이미지와 음성을 분석해 사물을 식별하거나 사용자의 질문에 답한다. 분석 결과는 소형","category":"사회"},{"title":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]","link":"https://n.news.naver.com/mnews/article/011/0004679681","naverLink":"https://n.news.naver.com/mnews/article/011/0004679681","pubDate":"2026-11-07T10:16:02.704968+09:00","author":"네이버뉴스","description":"‘피터팬 아빠’ 전경철 작가 뜻 잇는 임지영 피터팬재단 총괄디렉터 인터뷰 “복지부 재단법인 설립허가 기다려” “다시는 이 땅에, 피터팬이라는 이유로 세상 밖으로 내몰리는 아이가 없어야 한다. 더는 길이 보이지 않아, 자식과 자신을 포기하는 부모가 없기를 바란다.” (책 ‘안녕, 피터팬’ 中) 전경철 작가가 지난 7월 출간한 에세이 ‘안녕, 피터팬’을 들고 있다. 전 작가 브런치 캡처 지난 9월 5일. 전 국민을 울렸던 ‘피터팬 아빠’ 전경철 작가가 세상을 떠났다. 반평생 중증 자폐 아들을 돌보다 눈감은 전 작가의 마지막 소원은 단 하나, ‘피터팬재단’ 설립이었다. 피터팬재단은 성인 중증 자폐인들이 행복하게 살아갈 수 있는 마을 ‘네버랜드’ 건립을 목표로 한다. 피터팬재단 설립추진위원회는 전 작가가 숨지기 전날인 9월 4일 재단법인 설립 심사 신청을 냈다. 그로부터 두 달이 흘렀지만, 전 작가의 꿈은 미완으로 남아있다. 보건복지부의 재단법인 승인이 나지 않아서다. 임지영 피터팬재단 설립추진위원회 총괄디렉터를 만나 재단 설립 추진 과정을 들어봤다. 전경철(오른쪽) 작가와 그의 아들 전제원 씨. 전 작가 브런치 캡처","category":"사회"},{"title":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]","link":"https://n.news.naver.com/mnews/article/011/0004679685","naverLink":"https://n.news.naver.com/mnews/article/011/0004679685","pubDate":"2026-11-07T10:16:02.704959+09:00","author":"네이버뉴스","description":"정보근 법무법인 리움 대표 변호사 정보근 변호사의 부동산법을 부탁해 얼마 전 오래전부터 알고 지낸 지인의 부탁으로 이혼소송을 진행한 적이 있다. 이들 부부는 10년 정도 결혼 생활을 유지하고 아이도 낳아 키우다가 불화 끝에 결국 헤어졌다. 전문직에 종사 중인 지인은 혼인 중 아파트를 포함해 예금, 자동차 등 상당한 재산을 취득했다. 이혼을 하며 재산을 분할하는 과정에서, 공동명의로 보유한 아파트는 일반적으로 한쪽이 아파트 소유권을 전부 취득하되, 다른 한쪽에 현금을 지급하는 형태로 정리된다. 이혼하는 마당에 공유지분을 유지할 수 없고, 공유지분 일부만 매각하면 제대로 된 값에 팔리지 않으니 손해가 크기 때문이다. 실제로 해당 사안에서도 남편은 아내가 보유한 공유지분을 이전받는 대신 재산분할로 현금 수억 원을 지급했다. 그런데 여기서 한 가지 의문이 생긴다. 이혼 시 재산분할 과정에서 지급받은 현금 수억 원에 대해 증여세가 부과될까. 결론부터 얘기하면 증여세가 부과되지 않는다. 이유는 재산분할은 혼인 중 공동으로 형성한 재산을 청산·분배하는 것이기 때문이다. 이혼 시 재산분할 과정에서 증여세 미과세의 경우와 비교해 배우자 사망 시 상속세가 부과되는 것은 형평성의 문제가 있다는 지적이 있다. 만약 부부가 백년해로하다 남편이 먼저 사망하는 경우 아내는 높은 상속세를 납부하는 반면, 오히려 이혼으로 재산분할을 하는 경우에는 증여세를 내지 않는다는 것이 불합리하다는 것이다. 부부간 상속세 폐지를 주장하는 논리 중 하나 또한 재산분할의 경우에도 증여세가 없다는 점이 근거로 제시되기도 한다. 동일한 아파트 한 채를 두고 배우자 간 이혼과 상속의 경우 전혀 다르게 취급할 본질적인 이유가 있는가. 이는 조세정책상의 결단 사항일 뿐 양자 사이에 본질적인 차이는 없는 것으로 보인다. 실제로 과거에는 이혼 재산분할이 상속세 배우자 공제액을 초과하면 그 초과분을 일률적으로 증여로 봐 과세하는 법률이 존재하기도 했다. 물론 이 법조항은 재산분할과 상속은 재산관계와 신분관계라는 점에서 본질적으로 다르다는 이유로 헌법재판소에서 위헌 결정이 났으나, 필자가 보기에 양자를 달리 취급하는 근거가 선뜻 이해가 되지 않는다. 실제로 상속세를 걱정해 ‘황혼 이혼’을 하는 사례도 심심치 않게 있다고 한다. 절세를 위해 황혼 이혼까지 고려되는 이유는 최근 아파트 가격 급등으로 인해 상속세 부과 대상인 사람이 급증했기 때문이다. 통계에 따르면 지난해 상속","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:16:02.704950+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:16:02.704940+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장","link":"https://n.news.naver.com/mnews/article/015/0005351350","naverLink":"https://n.news.naver.com/mnews/article/015/0005351350","pubDate":"2026-11-07T10:03:02.328306+09:00","author":"네이버뉴스","description":"사진=생성형 AI 고용 불안을 무기로 70대 고령 노동자의 월급을 3년 넘게 뜯어낸 악덕 하청업체 팀장이 결국 철창신세를 지게 됐다. \"(원청의) 항의로 잘릴 수도 있다\"며 겁을 준 이 남성은 그렇게 갈취한 8000만 원 넘는 돈을 개인 빚을 갚고 도박판에 탕진한 것으로 드러났다. 7일 법조계에 따르면 수원지방법원 여주지원은 최근 공갈 혐의로 재판에 넘겨진 하청업체 현장 총괄팀장 A씨에게 징역 1년의 실형을 선고했다. 한국도로공사의 하청업체에서 현장 총괄팀장을 맡고 있던 A씨는 청소인부를 구하라는 회사 대표의 지시에 따라 2020년 73세의 고령인 D씨를 채용했다. D씨는 그해 2월 17일부터 고속도로 갓길과 졸음쉼터 등을 청소하는 업무에 종사했다. 그런데 A씨는 2020년 5월 피해자의 배우자가 운영하는 점포를 찾아가 \"청소 업무에 대해 도로공사에 항의가 들어오고 있으니 잘릴 수도 있다. 일하기 싫으면 그만둬라. 당신 말고도 청소 일 할 사람 많다\"고 협박성 발언을 쏟아냈다. 심지어 \"(상납금은) 나 혼자 먹는 거 아니다. 사장님한테 로비하는데 쓰는 거다\"라는 핑계를 댔다. 인사권을 쥔 팀장의 협박에 겁을 먹은 70대 노인은 그날 바로 현금 372만 원을 바쳤다. 이후 피해자는 2023년 12월까지 같은 방법으로 총 40회에 걸쳐 현금 및 피고인(또는 피고인 자녀) 명의의 계좌로 합계 8169만원을 갈취당했다. 제대로 일하고도 세금 낼 돈이 없어 타인에게 돈을 빌리고 세금을 체납해야 할 정도로 피해자의 삶은 망가져 갔다. 법정에서 A씨는 D씨가 처음 약 1년간은 성실하게 작업하다가 언제부터인가 늦게 출발하고 청소 현장이라고 거짓말을 하는 등 게으름을 피워 청소작업을 제대로 하라는 취지로 말한 것뿐이라고 주장했다. 하지만 재판부는 \"피해자는 상납금을 갈취당하고 있는 입장이므로 근로의욕이 저하돼 업무를 태만히 하게 될 수 있고, 상납금을 갈취하는 A가 업무 태만으로 주의를 주더라도 정당한 지적으로 들리기 어렵다\"고 지적했다. 이어 \"피고 A는 피해자가 업무를 태만히 했다면서도 피해자를 재추천해 2년 연장 계약을 하면서, 결국 고속도로 청소 업무의 수준이 저하되는 결과가 초래될 수 있다\"고 지적했다. 법원은 A씨가 선고기일 직전에 합의서를 제출했지만 '30개월에 걸쳐 나눠 갚겠다'는 조건 등을 내걸었고, D씨가 엄벌을 탄원한 점 등을 감안해 실형을 선고했다.","category":"사회"},{"title":"[속보] 이용철 법무장관 후보 “검찰개혁 차질없이 완수하겠다”","link":"https://n.news.naver.com/mnews/article/366/0001203171","naverLink":"https://n.news.naver.com/mnews/article/366/0001203171","pubDate":"2026-11-07T10:03:02.328189+09:00","author":"네이버뉴스","description":"6일 법무부 장관 후보로 지명된 이용철 방위사업청장 /뉴스1 이용철 법무부 장관 후보자가 6일 공소청과 중대범죄수사청(중수청) 출범에 따른 형사사법 체계 개편을 언급하며 검찰 개혁을 차질 없이 완수하겠다는 입장을 밝혔다. 이 후보자는 이날 지명 소감을 통해 “공소청과 중수청이 새로 출범하고 형사사법 체계가 크게 개편된 엄중한 시기에 법무 행정을 책임지는 법무부 장관 후보자로 지명받아 막중한 책임감을 느낀다”고 밝혔다. 이어 “만약 장관으로 일할 수 있는 기회가 주어진다면 검찰 개혁을 차질 없이 완수하고 새로운 형사사법 체계의 빠른 안착에 힘쓰는 한편, 범죄 피해자를 비롯한 사회적 약자의 인권 보호를 위해 최선을 다하겠다”고 말했다. 이 후보자는 지명 배경에 대해서도 설명했다. 그는 “대통령께서 저를 법무부 장관 후보자로 지명하신 이유는 참여정부 청와대 법무비서관으로서 검경 수사권 조정 등 검찰 개혁과 사법 제도 개혁 업무를 수행했던 경험을 살려 검찰 개혁을 완수하고, 큰 폭으로 개정된 형사사법 체계의 안착에 역할을 해달라는 것이라고 생각한다”고 했다. 그러면서 “국민 여러분께 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다”고 덧붙였다. 앞서 이재명 대통령은 이날 이 후보자를 신임 법무부 장관 후보자로 지명했다. 이 후보자는 민주사회를 위한 변호사모임 출신으로 노무현 정부 청와대 민정2비서관과 법무비서관, 방위사업청 초대 차장 등을 지냈다. 지난해 11월부터 방위사업청장으로 재직하고 있다.","category":"사회"},{"title":"119 구급차에서 태어난 31주 미숙아 살려낸 '50일의 기적'","link":"https://n.news.naver.com/mnews/article/654/0000209848","naverLink":"https://n.news.naver.com/mnews/article/654/0000209848","pubDate":"2026-11-07T00:26:25.047997+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"사회"},{"title":"\"밤 10시 넘으면 씻지도 말라고?\"…아파트 공지문에 엇갈린 반응","link":"https://n.news.naver.com/mnews/article/003/0014307370","naverLink":"https://n.news.naver.com/mnews/article/003/0014307370","pubDate":"2026-11-07T00:26:25.047990+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 밤 10시 이후 샤워와 세탁기 사용을 자제해 달라는 아파트 공지문을 두고 네티즌들의 의견이 엇갈렸다. (사진출처=스레드 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 아파트 입주민이 밤 10시 이후 샤워와 세탁기 사용 등 물소리를 자제해 달라는 공지문을 게시한 사실이 알려지면서 온라인에서 논쟁이 벌어졌다. 6일 소셜미디어(SNS) 스레드에는 한 아파트 입주민이 작성한 층간소음 관련 공지문 사진이 올라왔다. 공지문 작성자는 밤 10시부터 자정은 물론 새벽 2~3시에도 세탁기와 샤워기, 세면대에서 물을 사용하는 소리가 들린다고 적었다. 그는 \"밤시간이 아니라면 지속 시간이 길더라도 견딜 수 있다. 일과의 마무리를 씻고 정리하는 것은 일반적\"이라면서도 \"한밤중 물소리는 이웃에게는 폭포수처럼 엄청난 소음\"이라고 썼다. 이어 \"새벽에 휴대폰을 던지고 싸우는 소리, 화장실 문 쾅 닫는 소리에 물 폭탄 소리까지 들린다\"며 \"층간소음에 취약한 아파트라 알고 싶지 않은 소음들마저 실시간 중계되는 구조이니 서로서로 조심하자는 취지\"라고 밝혔다. 그러면서 \"밤 10시 이후에는 서로 배려했으면 한다\"고 당부했다. 이를 접한 네티즌들의 반응은 엇갈렸다. 샤워와 세안, 화장실 이용은 일상생활에 필요한 행동인 만큼 제한해서는 안 된다는 의견이 나왔다. 네티즌들은 \"9시 출근 6시 퇴근만 있는 줄 아느냐\", \"밤늦게 퇴근하는 사람은 어쩌라는 거냐\", \"자다 깨서 화장실에 다녀오고 손을 씻을 수도 있다\", \"물소리는 층간소음에도 들어가지 않는다\"등의 댓글을 남겼다. 반면 아파트 구조에 따라 물소리도 크게 들릴 수 있는 만큼 늦은 시간에는 주의할 필요가 있다는 의견도 있었다. 일부 네티즌은 \"소음이 심한 아파트는 물소리도 엄청 크게 들린다\", \"세탁기는 밤 10시 이후 피하는 게 맞는 것 같다\", \"샤워도 늦은 시간이라면 10~15분 안에 끝내는 게 좋다\"고 했다. 이후 공지문 작성자로 추정되는 입주민은 댓글을 통해 공지의 취지를 추가로 설명했다. 그는 \"단지 샤워를 하지 말라는 게 아니다\"며 \"윗집은 하루 종일 쿵쾅쿵쾅 발망치 소리, 의자 드르륵 소리, 싸우는 소리가 난다\"고 주장했다. 이어 \"하루에도 몇십 번씩 화장실을 들락날락하는데 낮과 저녁 내내, 새벽 3시까지 화장실에서 우당탕탕 물을 틀었다 껐다 계속 반복하고 있어 자다가 자꾸 깬다\"고 덧붙였다. 또한 \"윗집은 평일은 물론 주말과 방학 내내 어디를","category":"사회"}],"생활":[{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:16:03.660847+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:16:02.704919+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활"},{"title":"NYT “뉴진스 계약, 이례적으로 공격적…미성년 보호조항 없어 불공정”","link":"https://n.news.naver.com/mnews/article/016/0002719622","naverLink":"https://n.news.naver.com/mnews/article/016/0002719622","pubDate":"2026-11-07T10:08:38.684046+09:00","author":"네이버뉴스","description":"그룹 뉴진스. [헤럴드POP(현 헤럴드뮤즈) 제공] [헤럴드경제=장연주 기자] 그룹 뉴진스의 멤버들이 미성년자 시절 소속사 어도어와 체결한 전속계약에 미성년자 보호 조항이 빠지는 등 불공정한 내용이 포함됐다고 뉴욕타임스(NYT)가 보도해 눈길을 끈다. NYT는 5일(현지 시간) 뉴진스 멤버 5명이 만 14~17세였던 2022년 체결한 전속계약서를 입수했다며 이 같이 밝혔다. NYT는 뉴진스와 어도어의 계약서를 입수해 분석한 결과, 미성년자 보호조항, 성형 비용 부담, 행동 제한, 위약벌 산정 방식, 계약 종료 이후 초상권 조항 등 멤버들의 권리를 침해하는 조항들이 다수 발견됐다고 보도했다. 이에 대해 NYT는 법률 전문가 5명의 검토를 거쳤는데, 이 중 한명인 서울의 엔터테인먼트 전문 노종언 변호사는 “이례적으로 공격적인 계약”이라고 평가했다고 덧붙였다. NYT는 먼저 뉴진스의 계약서에 대해 ‘아동 보호 관련 문구가 없다’고 지적했다. 뉴진스 멤버들은 12살이라는 어린 나이에 기숙사 생활을 시작했으며, 새벽 2시까지 리허설을 하는 것은 드문일이 아니었다고 익명을 요구한 관계자는 밝혔다. NYT에 따르면, 멤버들이 연습을 하는 구역에는 폐쇄회로(CC)TV가 설치돼 있었고, 멤버 5명 중 4명은 연습 도중 학교를 그만뒀다. 이에 대해 하이브 관계자는 “회사가 아동보호법을 철저히 준수하며, 출연진들이 안전한 환경에서 일하고 훈련받을 수 있도록 최선을 다하고 있다”고 밝혔다. 이어 “소속 아티스트들에게 학업을 중단하도록 강요하거나 휴식을 취하는 것에 대해 불이익을 주지 않는다”고 해명했다. 하지만 NYT는 입수한 이메일을 통해, 해당 계약 조건이 사실상 협상 불가능한 것이었다고 지적했다. 예컨데, 2022년 1월 한 멤버의 어머니가 계약서에 서명하기 전 여러가지 변경사항을 요청했는데, 어도어 측 부사장이 “만약 위에 언급된 사항들을 포함해 현재 계약 초안에 동의하지 않으신다면, 계약 자체를 재고해 보는 것이 최선일 수 있다”고 답변한 사실을 공개했다. 뉴진스의 계약서에는 피부 관리, 성형 수술, 체형 교정 등 미용 관련 비용도 멤버들이 부담한다는 조항도 있었다. 멤버들은 연습생 시절 성형수술 및 기타 미용 시술에 회사가 지출한 금액의 상당 부분을 상환해야 했다는 것. 이에 대해 하이브 측 관계자는 “개인의 의사에 반하는 성형수술이나 시술을 권유하지도 않는다”고 NYT에 말했다. 계약서에는 또 계약 종료 이후에도 멤버들","category":"생활"},{"title":"'배달기사가 내 짜장면 먹었다' 논란에…배민 \"고객 음식 아냐\"","link":"https://n.news.naver.com/mnews/article/277/0005839318","naverLink":"https://n.news.naver.com/mnews/article/277/0005839318","pubDate":"2026-11-07T10:03:02.328201+09:00","author":"네이버뉴스","description":"배민 \"폐기 처리한 음식\" 배달 음식 섭취 시 강한 제재 '배달 기사가 고객이 주문한 음식을 몰래 먹고 있었다'는 의혹에 대해 배달의민족 측이 \"폐기 처리한 음식을 먹은 것\"이라고 해명했다. 배달의민족 배달기사의 음식 무단 취식 의혹이 제기된 당시 모습. 배민 측은 음식이 파손돼 처리하는 과정에서 발생한 오해라고 해명했다. 스레드 캡처. 지난 5일 배달의민족 물류 서비스를 전담하는 우아한청년들은 입장문을 내고 \"전날(4일) 사회관계망서비스(SNS)에 배달 기사가 고객 주문 음식을 먹었다는 취지의 게시물이 올라왔다\"며 \"해당 건을 접수해 경위를 확인했으며 확인 결과와 당사 입장을 공유한다\"고 밝혔다. 이어 \"확인 결과 음식은 라이더가 비용을 부담하는 것으로 처리된 상황(자부담)\"이라며 \"고객이 파손 처리를 하는 과정을 목격해 오해가 생겼다\"고 설명했다. 그 러면서 \"고객께는 재조리된 음식과 함께 소정의 보상을 제공했다\"고 덧붙였다. 그러면서 우아한청년들은 배달 기사가 주문 음식을 전달하지 않고 임의로 먹는 행위에 대해서는 엄격한 제재 기준을 적용하고 있다고 강조했다. 회사 측은 \"고객 주문 음식을 전달하지 않고 취식하는 등 부정행위가 확인될 경우 '배민 커넥트' 이용 제한까지 가능한 강도 높은 정책을 운용하고 있다\"고 했다. 앞서 SNS에는 용인에 거주 중인 A씨가 \"아이들과 먹으려고 중국집에서 짜장면과 탕수육 등 여러 음식을 주문했다\"며 \"예정 시간이 지나도록 음식이 도착하지 않아 앱을 통해 기사의 위치를 확인했다\"고 적었다. 이어 그는 \"배달 기사가 우리 집으로 와야 하는데 오지 않길래 위치를 확인했더니 창밖으로 보이더라\"며 \"창밖으로 보니 배달 기사가 집 건너편에서 주문한 음식을 먹고 있었다\"고 주장했다. 글을 쓴 A씨에 따르면 배달 기사는 주변에서 쉽게 발견하기 어려운 집 맞은편 다리 아래서 배달할 음식을 개봉해 먹고 있었다. A씨는 글과 함께 배 달 기사의 뒷모습이 담긴 사진을 함께 공개했다. 배달의민족 측이 입장을 낸 후 A씨는 \"오늘(5일) 갑자기 환불해준다고 전화를 해주더라\"며 \"일단 상황 전달을 저에게 충분히 주지 못했으나 플랫폼이 잘못했다고는 생각하지 않지만, 이런 상황이 재발하지 않길 바라는 마음에 게시글을 올린 것\"이라 고 강조했다. 아울러 \" 플랫폼에 악의적인 마음은 없다. 해당 기사가 그렇다고 하는데 뭐 어쩌겠는가\"라면서도 \" 기사가 손을 입으로 가져가며 오토바이 주변을 서성이는 모습을","category":"생활"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:01:19.954869+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활"},{"title":"임신 중 출혈 30대 산모…구급차서 31주차 아기 출산, 생명 구했다","link":"https://n.news.naver.com/mnews/article/015/0005351317","naverLink":"https://n.news.naver.com/mnews/article/015/0005351317","pubDate":"2026-11-07T00:26:26.611986+09:00","author":"네이버뉴스","description":"행사 현장의 응급의료 지원과 사고 대응 과정을 다룬 기사다.\n응급 상황에서 의료 지원이 제때 이뤄졌는지, 행사 안전관리 책임은 무엇인지가 쟁점이다.\n대규모 행사에서 의료 인력과 구급 체계를 사전에 갖추는 중요성을 짚는다.","category":"생활"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활"},{"title":"배달음식 받으려 문 연 틈에…前연인에 자해 협박한 30대 체포","link":"https://n.news.naver.com/mnews/article/022/0004173153","naverLink":"https://n.news.naver.com/mnews/article/022/0004173153","pubDate":"2026-11-07T00:23:53.454694+09:00","author":"네이버뉴스","description":"특수협박·스토킹처벌법 위반 등 혐의 입건 배달기사를 따라 헤어진 연인 집에 침입해 협박한 30대 남성이 경찰에 붙잡혔다. 서울 수서경찰서는 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 등 혐의로 입건했다고 6일 밝혔다. 사진=뉴시스 A씨는 지난 1일 오후 11시45분 강남구 역삼동 전 여자친구 자택에 흉기를 들고 찾아가 자해하겠다며 협박한 혐의를 받는다. 그는 피해자가 배달 음식을 받으려고 나온 틈을 타 주거지에 들어간 것으로 파악됐다. 피해자 측 신고를 받고 출동한 경찰은 이튿날 오전 1시50분쯤 A씨를 긴급체포했다. 경찰은 당초 특수협박 혐의로 A씨를 체포했다가 그가 반복해서 연락한 정황 등을 확인한 뒤 스토킹처벌법 위반 혐의도 추가 적용했다. 경찰은 A씨에게 피해자 주거지 100m 이내 접근과 전기·통신을 이용한 연락을 금지하는 긴급응급조치를 내렸으며, 전자발찌 부착을 포함한 잠정조치 신청도 검토하고 있다. 피해자에게는 스마트워치를 지급했다. 경찰은 A씨를 상대로 구체적인 범행 경위를 조사 중이다. 헤어진 연인의 집에 침입해 범행을 저지르는 사건은 끊이지 않고 있다. 앞서 지난 4월 경기 고양시에서는 20대 남성이 주택 외부 배관을 타고 올라가 전 여자친구의 집에 침입한 뒤 성폭행한 혐의로 구속 기소됐다. 조사 결과 이 남성은 이별 통보를 받은 뒤 문자와 전화 등으로 수차례 연락을 시도하다 직접 찾아가 범행한 것으로 나타났다. 2024년 9월 부산에서도 30대 남성이 헤어진 여자친구가 배달 음식을 받으려고 문을 연 틈을 타 집에 침입해 살해한 사건이 있었다. 이 남성은 지난해 10월 대법원에서 징역 30년을 확정받았다.","category":"생활"},{"title":"\"모든 게 오르는데 임금·연금만 제자리\" 프랑스 60만 고물가 시위","link":"https://n.news.naver.com/mnews/article/277/0005838862","naverLink":"https://n.news.naver.com/mnews/article/277/0005838862","pubDate":"2026-11-07T00:22:57.012501+09:00","author":"네이버뉴스","description":"에펠탑 폐쇄·공공서비스 마비 대부분 평화시위…일부 지역 경찰과 충돌 르코르뉘 총리, 9일 노사단체 협의 프랑스에서 고물가와 공공서비스 악화에 항의하는 대규모 시위가 벌어졌다. 전국에서 60만명 넘게 거리로 나섰고, 교사와 공무원까지 파업에 동참하면서 학교와 주요 관광시설이 문을 닫았다. 생활비 부담에 대한 불만이 확산하자 프랑스 정부는 노동계 및 재계와 긴급 협의에 나서기로 했다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 한 참가자가 프랑스 국기를 흔들고 있다. AP연합뉴스 5일(현지시간) AP·AFP통신과 르몽드 등에 따르면, 프랑스 주요 노동조합과 학생 단체들은 이날 파리와 리옹, 마르세유, 낭트 등 전국 각지에서 임금 인상과 공공서비스 개선을 요구하는 시위를 벌였다. 프랑스 내무부는 이날 오후 5시 기준 전국 시위 참가자를 60만명 이상으로 잠정 집계했다. 앞서 세 차례 열린 주말 시위의 참가자는 각각 55만명, 41만명, 32만명이었다. 평일에 열린 이번 시위에 주말보다 더 많은 인파가 몰린 것이다. 다만 주최 측인 노동총동맹(CGT)은 이보다 많은 160만명이 시위에 참여했다고 주장했다. 시위대는 치솟는 생활비에 비해 임금과 연금 인상이 턱없이 부족하다고 주장했다. 주요 노조는 공동성명에서 \"연료와 식품, 임대료, 가스, 전기 등 모든 가격이 오르고 있지만 임금과 연금만 제자리\"라며 정부에 대책을 촉구했다. 노조는 현재 시간당 12.31유로(약 1만9000원)인 최저임금 인상도 요구하고 있다. 소피 비네 CGT 사무총장은 \"기다리는 시간이 길어질수록 청구서만 늘어날 뿐\"이라며 정부의 즉각적인 대응을 요구했다. 세바스티앵 르코르뉘 총리는 오는 9일 노동조합 및 사용자 단체 대표들과 만나 임금과 생활비 문제를 논의하겠다고 밝혔다. 5일(현지시간) 프랑스 파리에서 열린 임금 인상 및 고등학생 시위 지지 집회에서 참가자들이 구호를 외치고 있다. AP연합뉴스","category":"생활"}],"문화":[{"title":"검은콩·쌀뜨물·식초…미국 패션지가 주목한 ‘한국식 머리 감기’","link":"https://n.news.naver.com/mnews/article/032/0003481212","naverLink":"https://n.news.naver.com/mnews/article/032/0003481212","pubDate":"2026-11-07T10:16:04.059973+09:00","author":"네이버뉴스","description":"해외에서 주목하는 한국식 헤어케어의 핵심은 결국 특별한 비법보다 꾸준하고 세심한 관리에 있다. pexels 세안할 때는 클렌징 오일부터 토너, 세럼, 크림까지 꼼꼼하게 챙기면서 머리 감을 때는 샴푸 하나로 끝내지 않는가. 해외 뷰티업계가 주목하는 한국식 머리 감기는 이런 생각에서 출발한다. 미국 패션잡지 보그는 최근 ‘매끄럽고 윤기 나는 머릿결을 위한 한국식 머리 감기’라는 기사를 통해 K뷰티식 두피 관리법을 소개했다. 기사에 따르면 한국식 헤어케어는 두피를 건강한 모발의 바탕으로 보고, 문제가 생긴 뒤 치료하기보다 평소 관리하는 예방 중심의 접근법이 특징이다. 미국 뉴욕 유니언더마의 피부과 전문의 클레어 장도 한국 뷰티 문화가 두피 관리를 비듬이나 가려움증, 탈모가 생긴 뒤에야 신경 쓰는 영역이 아니라 일상적인 자기관리 일부로 만들었다고 전했다. 가장 먼저 눈에 띄는 것은 두피를 위한 성분이다. 보그는 한국식 헤어케어 제품에 살리실산, 나이아신아마이드, 병풀, 판테놀 등 스킨케어에서 익숙한 성분이 활용된다고 소개했다. 검은콩과 검은깨, 다시마, 쌀뜨물 등 전통적으로 모발 관리에 활용해 온 성분도 언급했다. 최근에는 PDRN과 엑소좀을 활용한 두피 앰플도 등장하고 있다. 물론 이런 성분이 실제 발모나 탈모 예방에 효과가 있는지는 제품별로 별도의 임상적 검증이 필요하다. 머리를 감는 순서에도 신경을 쓴다. 매번 할 필요는 없지만 샴푸 전 두피 스케일러나 각질 제거 제품을 사용해 과도한 피지와 각질, 스타일링 제품 잔여물을 제거하는 것이 첫 단계다. 두피 스케일러는 얼굴의 각질 제거제처럼 두피에 쌓인 묵은 각질과 과도한 피지, 스타일링 제품 잔여물을 씻어내는 전용 제품이다. 살리실산 등 각질 관리 성분을 활용한 제품부터 소금 알갱이가 들어간 스크럽 타입까지 종류가 다양하다. 매일 사용할 필요는 없으며, 지나친 각질 제거는 오히려 두피를 자극할 수 있다. 각질 및 피지 등을 제거한 후 미지근한 물로 두피와 모발을 충분히 적신 뒤 자신의 두피 상태에 맞는 샴푸를 선택한다. 지성 두피라면 과도한 피지와 노폐물 제거에 초점을 맞추고, 민감하거나 건조한 두피라면 자극이 적은 제품을 고르는 식이다. 샴푸할 때는 손톱 대신 손가락 끝으로 두피를 약 1분간 부드럽게 마사지한다. 실리콘 재질의 두피 브러시를 활용하기도 한다. 브러시를 강하게 문지르면 오히려 두피에 자극을 줄 수 있으니 주의한다. 미국피부과학회(AAD) 역시 샴푸는","category":"문화"},{"title":"“식습관 탓만은 아니다”⋯유전되는 고콜레스테롤혈증, 조기 발견 중요","link":"https://n.news.naver.com/mnews/article/296/0000107011","naverLink":"https://n.news.naver.com/mnews/article/296/0000107011","pubDate":"2026-11-07T10:16:04.059969+09:00","author":"네이버뉴스","description":"증상 없어도 심근경색·뇌졸중 위험⋯美 JAMA, 조기 검사·약물치료 강조 국제학술지 JAMA는 5일(현지시간) 환자 교육자료를 통해 가족성 고콜레스테롤혈증을 설명했다. 가족성 고콜레스테롤혈증은 LDL 콜레스테롤 수치가 비정상적으로 높아지는 유전질환으로 미국 질병통제예방센터는 190mg/dL 이상일 때 치료가 필요하다고 조언했다. 사진=게티이미지뱅크 평소 기름진 음식을 즐기지 않고 운동도 꾸준히 하는데 콜레스테롤 수치가 유독 높은 사람들이 있다. 식습관이나 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"문화"},{"title":"‘2026 인문문화축제’ 개막… 인공지능 시대 인간다움의 가치 조명","link":"https://n.news.naver.com/mnews/article/029/0003057567","naverLink":"https://n.news.naver.com/mnews/article/029/0003057567","pubDate":"2026-11-07T10:03:03.848490+09:00","author":"네이버뉴스","description":"8일까지 인문대담·정책토론·참여형 전시 진행… 이세돌·양희은 등 참여 2026 인문문화축제 현장 모습. 문화체육관광부(장관 최휘영)와 한국문화예술교육진흥원(원장 임진택)이 공동으로 마련한 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막했다. 올해 3회째를 맞은 인문문화축제는 ‘인문지능’을 주제로 오는 8일까지 열린다. 인문지능은 인공지능(AI) 기술이 발전하는 환경에서 스스로 질문하고 판단하며, 자신과 타인의 삶을 이해하는 인문적 역량을 의미한다. 축제 첫날에는 인공지능 시대의 인간다움과 인문정신문화 정책의 방향을 살펴보는 개막특별포럼이 진행됐다. 포럼은 정향미 문화체육관광부 문화예술정책실장의 환영사와 김재원 국회의원, 김선욱 인문정신문화진흥심의회 위원장의 축사로 시작됐다. 이후 이세돌 전 프로바둑기사와 최성운 PD가 ‘AI 시대, 다시 묻는 인간다움과인문문화의 가치’를 주제로 대담을 나눴다. 인공지능의 발전이 인간의 사고와 선택에 미치는 영향을 살펴보고 인문적 사유의 중요성을 조명하는 자리로 마련됐다. 이어진 정책토론회에서는 ‘제3차 인문정신문화 진흥 기본계획’ 수립 방향이 논의됐다. 정보람 한국문화관광연구원 부연구위원이 발제를 맡았으며, 성해영 서울대학교 종교학과 교수의 진행으로 김희삼 광주과학기술원(GIST) 교수, 정종은 부산대학교 교수, 강현조와우랩 이사가 토론에 참여했다. 참석자들은 AI 시대 인문정책의 역할과 정체성, 일상생활 속 인문 프로그램 확산 방안 등에 대해 의견을 교환했다. 6일 저녁에는 ‘인문의 밤-삶의 무늬’가 열린다. 황인찬 시인과 양희은 가수가 참여하는 토크콘서트 ‘노래가 된 시’와 인문사업 성과 발표회가 예정돼 있다. 7일에는 김겨울 작가, 김초희 영화감독, 이충녕 콘텐츠 창작자가 참여하는 ‘비교하지 않는 나만의 속도’가 진행된다. 이종범 웹툰 작가와 심채경 천문학자, 박혜진 편집자는 ‘당신의 일에도 인문이 있나요’를 주제로 대화를 나눈다. 같은 날 저녁에는 한국교육방송공사(EBS)와 공동 기획한 ‘인문의 밤-사유의 시간’에 선우정아 가수와 조병수 건축가가 참여한다. 8일에는 넉살 가수, 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 ‘설렘은 편집되지 않아요’를 주제로 이야기를 이어갈 예정이다. 관람객이 직접 참여할 수 있는 전시와 체험 프로그램도 운영된다. 전국 인문사업 현장을 소개하는 ‘인문의 길’, 타인의 회고록에 자신의 이야기를 더하는 ‘우리의 회고록’","category":"문화"},{"title":"인공지능 시대 인간다움 묻는 ‘2026 인문문화축제’ 개막… 주제는 ‘인문지능’","link":"https://n.news.naver.com/mnews/article/081/0003696655","naverLink":"https://n.news.naver.com/mnews/article/081/0003696655","pubDate":"2026-11-07T10:01:20.877887+09:00","author":"네이버뉴스","description":"- 6일 개막특별포럼서 이세돌·최성운 인문대담 및 제3차 인문정신문화 진흥 기본계획 논의 - 8일까지 서울 마포구 레이어스튜디오11서 인문대화·전시·탐방 등 다채로운 프로그램 운영 ▲6일 서울 마포구 레이어스튜디오11에서 열린 ‘2026 인문문화축제’ 개막특별포럼에서 임진택 한국문화예술교육진흥원장, 김선욱 인문정신문화진흥심의회 위원장, 김재원 국회의원, 정향미 문화체육관광부 문화예술정책실장 등 주요 인사들이 기념촬영을 하고 있다. (사진=한국문화예술교육진흥원 제공) 문화체육관광부(장관 최휘영, 이하 문체부)와 한국문화예술교육진흥원(원장 임진택, 이하 진흥원)이 공동 주최·주관하는 ‘2026 인문문화축제’가 6일 서울 마포구 레이어스튜디오11에서 개막특별포럼을 시작으로 막을 올렸다. 올해로 3회째를 맞은 이번 축제는 ‘인문지능’을 주제로 오는 8일까지 이어진다. ‘인문지능’은 인공지능(AI)이 답을 제시하는 시대에 스스로를 돌아보고 타인을 이해하며 삶의 방향을 주체적으로 선택하는 힘을 뜻한다. 첫날 열린 개막특별포럼은 정향미 문체부 문화예술정책실장의 환영사와 김재원 국회의원, 김선욱 인문정신문화진흥심의회 위원장의 축사로 시작됐다. 이어 인공지능 ‘알파고’와 대국을 펼쳤던 이세돌 전 프로바둑기사와 최성운 PD가 나서 ‘AI 시대, 다시 묻는 인간다움과 인문문화의 가치’를 주제로 인문대담을 진행했다. 대담 직후에는 ‘제3차 인문정신문화 진흥 기본계획’ 수립을 위한 정책토론회가 열렸다. 정보람 한국문화관광연구원 부연구위원이 기본계획 수립 방향을 발제하고, 성해영 서울대 종교학과 교수를 좌장으로 김희삼 광주과학기술원(GIST) 교수, 정종은 부산대 교수, 강현조 와우랩(WOWLAB) 이사가 참여해 AI 시대 인문의 의미와 인문정책의 정체성, 생활권 인문 확산 방안을 논의했다. 6일 저녁 임진택 원장의 축사로 문을 여는 개막프로그램 ‘인문의 밤–삶의 무늬’는 황인찬 시인과 양희은 가수의 토크콘서트 ‘노래가 된 시’로 채워지고 이어 인문사업 성과 발표회도 열린다. 7일에는 김겨울 작가·김초희 영화감독·이충녕 콘텐츠 창작자의 ‘비교하지 않는 나만의 속도’, 이종범 웹툰 작가·심채경 천문학자·박혜진 편집자의 ‘당신의 일에도 인문이 있나요’, 한국교육방송공사(EBS)와 공동 기획한 선우정아 가수·조병수 건축가의 ’인문의 밤–사유의 시간’이 이어진다. 8일에는 넉살 가수·임승원 콘텐츠 창작자·유규선 콘텐츠기획자가 ‘설렘은 편집되지","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T00:26:26.611969+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"이세돌·김겨울·심채경이 묻는 '인문지능'…인문문화축제 개막","link":"https://n.news.naver.com/mnews/article/079/0004207114","naverLink":"https://n.news.naver.com/mnews/article/079/0004207114","pubDate":"2026-11-07T00:26:26.611885+09:00","author":"네이버뉴스","description":"사유·공감·관계의 가치 조명…전국서 인문행사 풍성 문체부 제공 인공지능(AI) 시대에 인간 고유의 사유와 판단, 공감의 가치를 되짚는 '2026 인문문화축제'가 6일 서울에서 개막한다. 이세돌 전 프로바둑기사와 김겨울 작가, 심채경 천문학자 등 다양한 분야의 인사들이 시민들과 만나 인문의 가치를 이야기한다. 문화체육관광부는 한국문화예술교육진흥원과 함께 이날부터 8일까지 서울 마포구 레이어스튜디오11에서 '2026 인문문화축제'를 개최한다고 6일 밝혔다. 올해 축제의 주제는 '인문지능'이다. AI가 답을 제시하는 시대일수록 스스로 질문하고 판단하며 타인을 이해하는 능력이 중요하다는 취지다. '생각의 주도권', '경험의 고유성', '관계의 재발견'을 중심으로 대담과 공연, 전시, 체험 프로그램을 선보인다. 개막일인 6일에는 이세돌 전 프로바둑기사와 최성운 PD가 'AI가 둘 수 없는 한 수'를 주제로 인간의 판단과 선택에 관해 대담한다. 이어 '제3차 인문정신문화 기본계획' 수립을 위한 정책토론회가 열린다. 7일에는 김겨울 작가와 김초희 영화감독, 이충녕 콘텐츠 창작자가 '비교하지 않는 나만의 속도'를 주제로 이야기를 나눈다. 웹툰 '닥터 프로스트'의 이종범 작가와 심채경 천문학자, 박혜진 문학평론가는 '당신의 일에도 인문이 있나요'를 주제로 일과 삶의 의미를 짚는다. 8일에는 래퍼 넉살과 임승원 콘텐츠 창작자, 유규선 콘텐츠기획자가 '설렘은 편집되지 않아요'를 주제로 일상의 경험과 관계, 기록의 의미를 이야기한다. 공연 프로그램인 '인문의 밤'도 마련된다. 6일에는 황인찬 시인과 가수 양희은이 시와 노래가 만나는 토크콘서트 '노래가 된 시'를 선보인다. 7일에는 가수 선우정아와 건축가 조병수가 참여하는 '사유의 시간'이 이어진다. 행사장에서는 '길 위의 인문학', '지혜학교' 등 주요 인문사업의 성과를 소개하는 전시와 시민 참여형 회고록 프로그램이 진행된다. 상수동 골목과 경의선 숲길, 홍대 일대를 걸으며 지역의 문화와 이야기를 살펴보는 인문탐방도 운영한다. 축제와 연계한 인문 프로그램은 전국으로 확대된다. 전국 10개 지역서점에서는 한유주 소설가, 정재승 뇌과학자, 황보름·정혜윤 작가 등이 참여하는 북토크가 열린다. 이와 함께 11월 한 달간 전국 193곳에서 다양한 인문문화 프로그램이 진행된다. 문체부 정향미 문화예술정책실장은 \"인공지능 시대에도 삶의 방향을 정하는 것은 결국 사람이며, 그 힘은 인문에서 나온","category":"문화"},{"title":"2006년 PC 게임방 그대로…엔비디아, 추억의 그래픽카드 부활","link":"https://n.news.naver.com/mnews/article/018/0006405320","naverLink":"https://n.news.naver.com/mnews/article/018/0006405320","pubDate":"2026-11-07T00:26:26.121640+09:00","author":"네이버뉴스","description":"20년 전 그래픽카드 개봉·PC 장착 체험 무료 게임 공개 AI 시대 연 '지포스 8800 GTX' 출시 20주년 기념 [이데일리 한광범 기자] 엔비디아(NVIDIA)가 최근 인공지능(AI) 산업의 토대가 된 그래픽카드 ‘지포스 8800 GTX’ 출시 20주년을 맞아 2006년 PC 게이밍 환경을 재현한 무료 체험 콘텐츠를 공개했다. 과거 그래픽카드를 직접 개봉하고 컴퓨터에 장착하는 경험을 최신 그래픽 기술로 되살린 것이 특징이다. 엔비디아는 6일 지포스 8800 GTX 출시 20주년을 기념하는 스팀(Steam) 데모 ‘지포스 8800 GTX - 전설의 20년’을 소개했다. 해당 콘텐츠는 지난 5일 스팀에 무료로 공개됐으며, 이용자가 직접 조작할 수 있는 반응형 기술 데모 형태로 제작됐다. 지포스 8800 GTX는 2006년 11월 8일 출시된 고성능 그래픽카드다. 당시 ‘컴퍼니 오브 히어로즈’, ‘바이오쇼크’, ‘크라이시스’ 등 고사양 PC 게임을 구동하는 대표적인 제품으로 주목받았다. 특히 2007년 출시된 크라이시스는 높은 그래픽 요구 사양으로 유명해지면서 PC 성능을 가늠하는 상징적인 게임으로 자리 잡았다. 이 제품의 역사적 의미는 게임 성능에만 있지 않다. 지포스 8800 GTX는 엔비디아가 개발한 병렬 컴퓨팅 플랫폼 쿠다(CUDA)를 지원한 최초의 그래픽카드다. 이전까지 주로 화면에 그래픽을 그리는 데 사용하던 GPU를 과학 계산과 시뮬레이션 등 다양한 연산 작업에 활용할 수 있는 기반을 마련했다. 당시 제품에는 G80 아키텍처를 기반으로 한 128개의 통합 스트림 프로세서가 탑재됐다. 그래픽 처리 과정에서 서로 다른 작업에 연산 자원을 유연하게 배분하는 구조로, 다이렉트X 10도 지원했다. 768MB GDDR3 메모리와 384비트 메모리 버스를 갖춘 것도 특징이었다. 쿠다를 통해 GPU의 병렬 연산 능력을 일반적인 컴퓨팅 작업에 활용할 수 있게 되면서 GPU의 쓰임새는 점차 확대됐다. 과학 연구와 영상 처리 등을 거쳐 오늘날 대규모 AI 모델을 학습하고 실행하는 가속 컴퓨팅으로 이어졌다. 엔비디아가 20년 전 그래픽카드를 기념하면서 게임뿐 아니라 쿠다의 역사를 강조하는 이유다. 이번 기념 데모는 언리얼 엔진 아티스트 딜런 브라운이 엔비디아의 지원을 받아 제작했다. 이용자는 2006년 분위기로 꾸며진 게임방에 들어가 지포스 8800 GTX의 포장을 뜯고 그래픽카드를 살펴본 뒤 당시 사양을 재현한 PC","category":"문화"},{"title":"한국 이 정도 일 줄이야 “최고다”…머스크 갑자기 태극기 사진 올린 이유가","link":"https://n.news.naver.com/mnews/article/011/0004679643","naverLink":"https://n.news.naver.com/mnews/article/011/0004679643","pubDate":"2026-11-07T00:26:25.553816+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"},{"title":"문체부·한국문화예술교육진흥원, '2026 인문문화축제' 개막","link":"https://n.news.naver.com/mnews/article/014/0005600649","naverLink":"https://n.news.naver.com/mnews/article/014/0005600649","pubDate":"2026-11-07T00:25:30.946345+09:00","author":"네이버뉴스","description":"문화체육관광부와 한국문화예술교육진흥원이 2026 인문문화축제를 시작했다.\n축제는 인문학을 일상과 연결하고 시민이 다양한 분야의 관점을 접하도록 기획됐다.\n기술 변화 속에서 인간과 사회의 가치를 생각하는 자리를 마련한다.","category":"문화"},{"title":"임권택 “내 스태프 작품?”…거장의 롱테이크 흉내낸 영화 정체","link":"https://n.news.naver.com/mnews/article/025/0003563412","naverLink":"https://n.news.naver.com/mnews/article/025/0003563412","pubDate":"2026-11-07T00:23:55.654948+09:00","author":"네이버뉴스","description":"6일 서울영화센터에서 열린 2026 대한민국예술원의 영화전 ‘AI 시대, 영화는 어떻게 살아 남는가’ 에 참석한 임권택 감독(오른쪽)이 최휘영 문화체육부관광부 장관과 인사 나누고 있다. 사진 대한민국예술원 봄꽃이 막 번져가는 아파트촌 뒷산 풍경 위로 남도민요의 한을 닮은 국악 가락이 흐른다. 산에 듬성듬성 세워진 아파트는 공동묘지 비석처럼 보인다. 이어 엔딩 크레딧처럼 오르는 긴 자막. “2020년 1월 국내에서 첫 코로나19 확진자가 나왔다. (후략)” 아버지가 돌아가셨다는 소식을 듣고 병원에 온 아들은 격리 공간에서 이미 수습까지 마친 아버지의 얼굴을 확인할 수 없어 애절하게 울부짖는다. 6일 서울 충무로 서울영화센터 2관에서 공개된 4분 분량의 단편 인공지능(AI) 영화 ‘확인’ 속 장면이다. 개막 이틀째를 맞은 ‘2026년 대한민국예술원 영화전’에서 생성형 AI를 활용해‘임권택 스타일’로 만들었다. ‘임권택 없이 임권택 영화를 만들다’란 도발적 제목의 프로젝트 일환이다. 현장에서 영화를 본 임권택(92) 감독의 얼굴엔 알 수 없는 미소가 흘렀다. 임 감독은 중앙일보와 인터뷰에서 “내 영화같다고 느껴지진 않았지만, 내 영화에 참여한 스태프가 만들었나 싶긴 했다”고 말했다. 6일 개막 이틀째를 맞은 ‘대한민국예술원 영화전 2026’ 에선 임권택 감독의 스타일로 AI가 생성한 단편 ‘확인’(맨 아래부터)도 공개됐다. 배창호 감독의 영화 ‘젊은 남자’(1994), 정지영 감독의 ‘내 이름은’ 속 장면을 AI로 변주한 사례도 발표됐다. 사진 대한민국예술원","category":"문화"}],"세계":[{"title":"트럼프, 비서실장 전격 교체…‘강경 충성파’ 스티븐 밀러 임명","link":"https://n.news.naver.com/mnews/article/119/0003152405","naverLink":"https://n.news.naver.com/mnews/article/119/0003152405","pubDate":"2026-11-07T10:16:03.077026+09:00","author":"네이버뉴스","description":"중간선거 참패 사흘 만에 첫 고위급 인사 단행 反이민 정책 설계자 밀러, 9일부터 백악관 총괄 첫 여성 실장 와일스, 트럼프 정치조직으로 이동 민심떠나도 강경노선 고수…국정 대립 격화 전망 스티븐 밀러 백악관 신임 비서실장이 지난 10월 미 워싱턴DC 백악관에서 열린 한 행사에서 발언을 하고 있다. ⓒ UPI/연합뉴스 [데일리안 = 김규환 기자] 도널드 트럼프 미국 대통령이 11·3 중간선거에서 집권 공화당이 참패하자 백악관 비서실장을 전격 교체했다. 트럼프 2기 행정부 출범 이후 백악관 인사·예산을 쥔 ‘실세’로 통했던 수지 와일스 비서실장을 내리고 대표적인 강경파이자 최측근 인사인 스티븐 밀러(41) 백악관 부비서실장을 후임으로 임명한 것이다. 중간선거 패배 이후 첫 고위급 인사로, 국정 쇄신보다는 강경노선을 더욱 강화해 임기 후반 더 공세적인 국정 운영을 예고했다는 관측이 나온다. . 로이터·AP통신 등에 따르면 트럼프 대통령은 6일(현지시간) 자신 소유의 소셜미디어(SNS) 트루스소셜을 통해 “현 행정부의 부비서실장이자 내가 가장 신뢰하는 참모 중 한 명인 스티븐 밀러가 오는 9일부터 백악관 비서실장을 맡게 된다는 소식을 발표하게 돼 기쁘다”고 밝혔다. 그러면서 “밀러는 정치적으로 훌륭하고 판단도 잘하기 때문에 좋은 관리자가 될 것”이라고 덧붙였다. 그는 이어 “훌륭한 일을 해온 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신한 데 감사한다”고 덧붙였다. 다만 해당 조직의 구체적인 성격과 와일스가 맡을 역할은 공개하지 않았다. 이번 인사는 중간선거에서 민주당에 연방 상·하원 다수당 지위를 모두 내준지 사흘 만에 단행됐다. 미 유권자들이 이란전쟁 장기화와 고물가, 강경 이민정책 등에 불만을 표출하며 공화당에 등을 돌렸지만, 트럼프 대통령은 오히려 온건파 대신 강경 충성파를 백악관의 핵심 요직에 앉혔다. 미 인터넷매체 악시오스는 밀러의 발탁이 이민정책뿐 아니라 이란 전쟁에서도 더욱 강경한 접근을 예고할 수 있다고 분석했다. 밀러 부비서실장은 트럼프 대통령 1기 때 ‘마가’(MAGA·미국을 다시 위대하게)의 설계자인 스티브 배넌 전 수석 전략가의 추천으로 백악관에 들어가 2020년 대선 패배, 2021년 1·6 의사당 난입 사건 이후에도 트럼프 대통령의 곁을 지킨 충성파다. 트럼프 대통령이 1기 정부에서 호흡을 맞춘 후 2기 정부에서도 그","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:16:03.077024+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 선거 패배에 영향을 미친 뒤 협상에 대한 희망의 조짐이 나타나고 있다. 트럼프는 6일 기자들과 문답하는 과정에서 중재국들의 이란과의 논의가 계속되고 있다고 밝혔다. 트럼프는 “우리는 이란과 대화하고 있다. 이전부터 그래 왔다”고 말했다. 카타르와 이란은 핵 협상으로 나아가기 위한 가교 합의를 논의하고 있다. 역내 당국자들에 따르면 중재국들과 이란은 테헤란의 핵 프로그램에 관한 추가 협상의 길을 여는 데 도움이 될 잠정적 중간 단계 합의를 논의했다. 당국자들은 카타르가 최근 양측에 제시한 이 제안이 이틀에 걸쳐 신뢰 구축 조치를 이행하도록 하는 내용을 담고 있다고 말했다. 이 조치에는 미국의 봉쇄 해제와 이란의 핵 프로그램을 둘러싸고 이란을 고립시키려는 미국의 정책에 따라 수년 동안 압류해 동결한 이란 자금 수십억 달러 가운데 일부를 풀어 주는 방안이 포함된다. 그 대가로 이란은 미국과 이스라엘의 폭격을 받은 자국 시설에 국제원자력기구(IAEA) 사찰단이 들어오는 것을 허용하게 된다고 당국자들은 말했다. 당국자들에 따르면 둘째 날에는 이란이 호르무즈 해협을 다시 개방하게 된다. 이는 이란과 오만이 해당 해협을 놓고 합의했으나 미국의 승인을 받지 못한 수정 합의에 따른 것이다. 이러한 조치들이 이","category":"세계"},{"title":"선거 참패로 ‘겨울왕국’ 된 백악관, ‘얼음 아가씨’도 떠난다 [이 사람@World]","link":"https://n.news.naver.com/mnews/article/022/0004173207","naverLink":"https://n.news.naver.com/mnews/article/022/0004173207","pubDate":"2026-11-07T10:16:03.077022+09:00","author":"네이버뉴스","description":"수지 와일스 백악관 비서실장 1호 ‘경질’ 2024년 트럼프 대선 승리 당시 1등 공신 與 중간선거 참패에 더는 못 버티고 퇴장 미국 11·3 중간선거에서 여당인 공화당이 기록적 패배를 당한 뒤 백악관은 ‘겨울왕국’처럼 썰렁해졌다. 냉철하고 치밀한 성품 때문에 도널드 트럼프 대통령으로부터 ‘얼음 아가씨’(ice baby)란 별명을 얻은 비서실장은 가장 먼저 짐을 싸 백악관을 떠나는 신세가 됐다. 수지 와일스 미국 대통령 비서실장이 11·3 중간선거 직전인 지난 10월 초 혼자 깊은 생각에 잠겨 백악관 경내를 걷고 있다. 도널드 트럼프 대통령은 6일(현지시간) 중간선거 패배 책임을 물어 와일스를 경질했다. AFP연합뉴스 트럼프는 6일(현지시간) 사회관계망서비스(SNS)를 통해 백악관 비서실장 교체를 알렸다. 현재 비서실의 ‘2인자’인 스티븐 밀러(41) 부실장이 오는 9일부터 비서실장을 맡고, 수지 와일스(69) 현 비서실장은 물러난다는 것이다. 와일스가 공화당의 중간선거 패배 후 책임을 지고 사의를 밝힌 만큼 경질 인사로 풀이된다. 다만 트럼프는 와일스를 최대한 배려하는 태도를 취했다. 그는 SNS 글에서 와일스를 향해 “비서실장으로서의 봉사에 감사드린다”며 “정말 훌륭한 일을 해주셨다”고 찬사를 바쳤다. 그러면서 와일스가 완전히 자신의 곁을 떠나는 것은 아니며 ‘트럼프 정치 조직’(Trump Political Operation)으로 옮길 예정이라고 설명했다. 이는 와일스가 트럼프 개인의 사조직 운영에 관여하게 될 것이란 의미로 해석된다. 트럼프는 향후 정치적 영향력 유지, 정치자금 모금, 이른바 ‘마가’(MAGA·미국을 더 위대하게) 메시지 관리 등을 담당할 사조직을 재정비하고 있는 것으로 알려졌다. 와일스는 2024년 11월 대선에서 트럼프가 현직 부통령인 민주당 카멀라 해리스 후보를 상대로 예상 밖의 압승을 거두며 비로소 세상에 이름을 알렸다. 선거 직후 승리를 자축하는 연설을 하던 트럼프가 갑자기 “수지. 이리 와요. 이리 오라고”라며 그를 연단으로 불러냈다. 대선 기간 와일스는 트럼프 선거 캠프의 공동 위원장을 맡았다. 트럼프는 와일스를 ‘얼음 아가씨’라고 부르며 “뒤에 있는 걸 좋아하는데, 뒤에 있을 사람은 아니다”라는 의미심장한 발언을 했다. 그로부터 얼마 뒤 와일스는 트럼프 2기 행정부의 첫 백악관 비서실장으로 전격 발탁됐다. 미국 역사상 백악관 비서실장에 여성이 임명된 사례는 와일스가 최초다.","category":"세계"},{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:16:03.077019+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"트럼프, 백악관 비서실상 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:16:03.076979+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:16:02.704916+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"},{"title":"선거참패 1호 희생양?…'얼음아가씨' 백악관 첫 女비서실장 퇴장(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427624","naverLink":"https://n.news.naver.com/mnews/article/001/0016427624","pubDate":"2026-11-07T10:03:02.940635+09:00","author":"네이버뉴스","description":"와일스, 선거 앞두고 교체설 흘러나와…막판 트럼프 신임 떠난 정황 '행정부 내 권력암투' 분석도…\"와일스 일가 사익추구\" \"반대파의 모략\" 초기 유방암 진단받고 투병…\"트럼프, 알코올중독자 성격\" 발언 파장도 수지 와일스 [로이터=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 백악관 첫 여성 비서실장이라는 역사를 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 도널드 트럼프 미국 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 와일스 실장이 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 발표했다. 선거 패배 이후 백악과 내각 가운데 처음으로 이뤄진 교체 인사다. 집권당이 선거에서 질 경우 통상적으로 참모진과 각료 교체가 뒤따르게 되는데, 트럼프 대통령도 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 결과에 따른 인적 개편임을 시사했다. 와일스 실장은 공화당의 선거 전망이 암울해진 지난달부터 백악관과 행정부에서 교체설이 흘러나왔다. 그의 교체를 예상한 인사들이 후임 쟁탈전을 벌이고 있다고 보도될 정도였다. 막판에는 와일스 실장이 트럼프 대통령의 신임을 잃은 것 아니냐는 정황도 제기됐다. 역대 최단명 대변인인 케이티 재커라이어를 지명할 때 트럼프 대통령이 와일스 실장과 상의하지 않은 것으로 드러나면서다. 또 와일스 실장이 2024년 대선 때 영입한 제임스 블레어 전 백악관 부비서실장과 크리스 라시비타의 비위 의혹이 불거지자 트럼프 대통령이 즉각 이들과의 관계를 끊겠다고 발표하면서 와일스 실장과 사이가 틀어졌다는 관측이 나왔다. 트럼프 대통령은 선거 기간 와일스 실장의 교체설에 \"나는 전적으로 와일스를 신뢰한다\"고 선을 그었으나, 예상보다 처참한 중간선거 성적표를 받아들고 와일스 실장을 희생양 삼아 사실상 경질한 것으로도 볼 수 있다. 트럼프 대통령은 선거 당일 밤 여러 사람이 보는 앞에서 와일스 실장과 그가 이끄는 정치팀을 향해 '재앙'의 책임을 추궁하며 비난한 것으로 알려졌다고 뉴욕타임스(NYT)가 전했다. 와일스 실장의 교체 이면에는 트럼프 행정부에서 벌어진 권력 다툼이 작용했다는 분석이 제기된다. 그가 트럼프 대통령에게 잘못된 조언을 하면서 가족의 사익을 추구했다는 폭로가 나오고, 와일스 측은 반대파가 선거 패배의 책임을 자신에게 뒤집어씌운다고 반발하는 모습이다. 로버트","category":"세계"},{"title":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다","link":"https://n.news.naver.com/mnews/article/011/0004679676","naverLink":"https://n.news.naver.com/mnews/article/011/0004679676","pubDate":"2026-11-07T10:03:02.940631+09:00","author":"네이버뉴스","description":"클립아트코리아 생성형 인공지능(AI)이 학생들의 숙제와 시험 준비에까지 활용되면서 미국 학교의 평가 방식이 달라지고 있다. 집에서 작성하는 에세이 대신 교실에서 직접 글을 쓰거나 말로 답하는 구술시험이 다시 주목받고 있다. 최근 로이터통신에 따르면 미국의 일부 중·고등학교에서는 학생들의 AI 의존도를 낮추기 위해 손 글씨 과제와 대면 평가를 확대하고 있다. 로이터는 최근 미국 전역의 교사와 교육 전문가 12명을 인터뷰해 이러한 변화를 소개했다. 학생이 제출한 결과물만 평가하기보다 학습 내용을 실제로 이해했는지 확인하려는 움직임이다. 챗GPT가 대신 써주는 숙제…구술시험·손 글씨 부활 샌프란시스코에서 6학년 인문학을 가르치는 트리스턴 창 교사는 지난해부터 집에서 작성하는 에세이 숙제를 없앴다. 대신 학생에게 직접 질문을 던지고 답변을 듣는 구술시험을 도입했다. 시험에서는 작품의 등장인물과 줄거리, 주제, 은유적 표현 등을 묻는 15개 질문을 활용한다. 학생이 작품을 얼마나 이해했는지 말로 설명하도록 하는 방식이다. 창 교사는 “오랫동안 기술이 교육 방식을 바꿔왔지만 AI는 그중에서도 가장 급격한 변화”라며 “기존의 모든 방식이 통하지 않게 됐다”고 말했다. 다른 교사들도 숙제를 줄이는 대신 교실에서 학습 과정을 확인하는 데 집중하고 있다. 샌프란시스코의 중학교 영어 교사 러스티 셰이브는 집에서 과제를 해결하기 어려운 학생들이 AI에 의존하기 쉽다고 판단했다. 이에 교실에서 직접 글을 쓰는 시간을 늘렸다. 7학년 학생들과 에세이 한 편을 완성하는 데 한 달을 할애한 적도 있다고 전했다. 수학 수업에서도 변화가 나타났다. 뉴욕의 고등학교 수학 교사 밥슨 웡은 집에서 풀어오는 문제 수를 줄이고 수업 시간에 직접 문제를 해결하도록 했다. AI가 정답뿐 아니라 풀이 과정까지 만들어낼 수 있게 되면서 답을 맞혔는지만으로는 학생의 이해도를 평가하기 어려워졌기 때문이다. 웡 교사는 학생들에게 자신이 선택한 풀이법과 그 이유까지 설명하게 한다. 그는 “AI는 학생들의 수학 공부 방식뿐 아니라 내가 가르치는 방식까지 바꿨다”고 말했다. 디지털 기기 사용을 제한하는 학교도 있다. 시카고 교외의 고등학교 영어 교사 렉스 오발레는 수업이 시작되면 학생들에게 공책부터 꺼내도록 한다. 크롬북을 활용하는 수업은 전체 수업일의 약 10%로 제한했다. 오발레 교사는 “노트북이 없으면 학생들이 뒤에 숨을 수 없다”며 디지털 기기 사용을 줄인 뒤","category":"세계"},{"title":"트럼프, 그래도 마이웨이… “美에 공장 안 지으면 관세 300%”","link":"https://n.news.naver.com/mnews/article/023/0004008299","naverLink":"https://n.news.naver.com/mnews/article/023/0004008299","pubDate":"2026-11-07T10:01:19.432621+09:00","author":"네이버뉴스","description":"[美중간선거 후폭풍] 선거 패배에도 기존 입장 고수 도널드 트럼프 미국 대통령이 5일(현지 시각) 워싱턴DC 백악관에서 ‘백악관 집무실 국가기념물 지정’ 포고문에 서명하는 행사에 참석해 앉아 있다. /로이터 연합뉴스 도널드 트럼프 미국 대통령이 중간선거 참패 이틀 만인 5일(현지 시각) “미국에 공장을 짓지 않으면 최고 300%의 관세를 내야 한다”며 기존 관세 정책을 고수하겠다는 뜻을 분명히 했다. 공화당 대패의 원인으로 고물가와 이란 전쟁이 지목됐지만 정책 변화보다는 강경 대응을 예고한 것이다. 트럼프는 이날 백악관에서 취재진과 만나 “지금 관세를 없애면 미국에 건설 중인 3000여 공장의 공사가 모두 중단될 것”이라며 “그 대신 중국, 일본, 한국 등에서 제품을 들여오게 될 것”이라고 했다. 관세 철폐를 주장하는 사람들에게는 “어리석은 사람들”이라고 했다. 뉴욕 증시가 폭락하자 책임을 유권자에게 돌리기도 했다. 트럼프는 트루스소셜에 “민주당이 화요일 선거에서 크게 이겼기 때문에 오늘 주식시장이 폭락했다”며 “안타깝지만 여러분 스스로를 탓할 수밖에 없다”고 적었다. 또 다른 글에서는 “여러분의 은퇴 연금 계좌도 하락했다. 기억하라. 공화당이 아니라 민주당 때문”이라고 했다. 선거 결과에 대한 책임도 부인했다. 트럼프는 “나는 투표 용지에 없었다. 내가 출마했다면 압승했을 것”이라고 주장했다. 선거 전 자신의 이름이 투표 용지에 있다고 생각하고 투표하라고 독려했던 것과 달라진 태도다. 향후 국정 운영에 대해서는 “앞으로 1~2주 동안 많은 것을 보게 될 것”이라며 추가 조치를 예고했다. 이란에 대해서도 “가능하면 나머지를 파괴하고 싶지 않지만 그렇게 해야 할 수도 있다”고 했다. 한편 민주당은 하원(총 435석)에서 260석까지 넘볼 수 있는 상황이다. 이날 오후 6시 기준 민주당은 253석을 확보했고, 27석은 당선자가 확정되지 않았다. CBS뉴스는 민주당 최대 의석을 268석까지 전망했다. 민주당이 260석 이상을 확보하면 1990년 이후 36년 만에 최대 규모의 하원 의석을 차지하게 된다.","category":"세계"},{"title":"미 중간선거로 보는 기독교 정치…'마가' 균열 시작?","link":"https://n.news.naver.com/mnews/article/079/0004207420","naverLink":"https://n.news.naver.com/mnews/article/079/0004207420","pubDate":"2026-11-07T00:26:26.611946+09:00","author":"네이버뉴스","description":"미국 중간선거 결과를 계기로 기독교 보수 진영의 정치적 결속과 내부 균열을 분석한 기사다.\n선거 이후 종교계와 정치권의 관계, 당내 노선 경쟁이 주요 쟁점으로 다뤄진다.\n향후 미국 정치 지형에 미칠 영향이 주목된다.","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:16:03.660870+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:16:03.660868+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:16:03.660866+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:16:03.660864+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:16:03.660860+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:16:03.660858+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:16:03.660854+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:16:03.660843+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:16:03.660826+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"},{"title":"AI가 반도체 쓸어가자 자동차업계 '비상'…내년 가격 폭등 경고","link":"https://n.news.naver.com/mnews/article/092/0002444296","naverLink":"https://n.news.naver.com/mnews/article/092/0002444296","pubDate":"2026-11-07T00:26:26.611988+09:00","author":"네이버뉴스","description":"AI 데이터센터 수요가 반도체 공급을 빠르게 흡수하면서 자동차 업계의 부품 수급 부담이 커질 수 있다는 전망이다.\n반도체 확보 경쟁이 이어질 경우 차량 생산비와 소비자 가격에도 영향을 줄 수 있다.\n내년 공급 상황과 가격 변동이 업계의 주요 변수로 꼽힌다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-06","weekday":"금요일","label":"보관 · 11월 6일 금요일","total":26,"categories":{"사건 사고":[{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/article/088/0001038903","pubDate":"2026-11-06T23:00:09+09:00","author":"매일신문","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/088/0001038903"},{"title":"“100여차례 여탕 몰카”…아내가 찍고 남편이 팔아 4300만원 챙긴 日 부부","link":"https://n.news.naver.com/article/030/0003483150","pubDate":"2026-11-06T22:20:00+09:00","author":"전자신문","description":"일본에서 젊은 부부가 목욕탕에 몰래카메라를 설치하거나 휴대전화를 이용해 여성들의 모습을 불법 촬영한 뒤, 영상을 온라인으로 판매한 혐의로 경찰에 검거됐다. 아내가 현장에서 촬영을 담당하고 남편은 이를 인터넷에 유통하는 방식으로 역할을 나눠 범행한 것으로 조사됐다. 5일(현지시간) 교도통신에 따르면 교토부 경찰은 이날 성적 모습 촬영 처벌법 위반 혐의로 이시카와현 가나자와시에 거주하는 회사원 나카타케 다이치(35)와 아내 미사토(24)를 체포했다","category":"사건 사고","naverLink":"https://n.news.naver.com/article/030/0003483150"},{"title":"경찰, '은평 스토킹 살해' 60대 구속영장…\"시비 붙어 범행\"(종합)","link":"https://n.news.naver.com/article/003/0014307159","pubDate":"2026-11-06T19:46:43+09:00","author":"뉴시스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014307159"},{"title":"[속보]경찰, '은평 전 연인 살해' 60대 구속영장 신청","link":"https://n.news.naver.com/article/003/0014307154","pubDate":"2026-11-06T19:44:26+09:00","author":"뉴시스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014307154"},{"title":"서울중수청, '김기현 무죄 선고' 1심 판사 고발건 반부패국 배당","link":"https://n.news.naver.com/article/003/0014307099","pubDate":"2026-11-06T19:24:32+09:00","author":"뉴시스","description":"[서울=뉴시스] 오정우 기자 = 김건희 여사에게 전당대회 당선을 대가로 267만원 상당의 가방을 건넨 혐의로 기소된 김기현 국민의힘 의원에게 무죄를 선고한 1심 판사를 상대로 한 고발 사건이 중대범죄수사청 일선 부서에 배당됐다. 6일 법조계에 따르면 중수청은 전날 법왜곡죄 혐의로 고발된 조형우 서울중앙지법 형사합의22부 부장판사 사건을 서울중수청 반부패수사국(국장 김정환)에 배당했다. 시민단체 사법정의바로세우기시민행동(사세행)은 4일 조 부장판사가 법왜곡을 일으켰다며 중수청에 고발장을 제출한 바 있다. 사세행은 김 의원의 급여 계좌에서 가방 결제 대금이 빠져나갔지만 김 의원이 아내의 선물 사실을 몰랐다고 본 재판부 판단을 문제삼았다. 앞서 서울중앙지법 형사합의22부(부장판사 조형우)는 지난달 30일 청탁금지법 위반 혐의를 받는 김 의원에게 무죄를 선고했다. 같은 혐의로 기소된 배우자 이모씨에게는 벌금 500만원을 선고했다. 재판부는 이씨가 2023년 국민의힘 당대표 선거에서 윤석열 전 대통령이 김 의원을 지원한 데 대한 답례로 김 여사에게 267만원 상당의 로저비비에 가방을 건넸다고 판시했다. 다만 김 의원이 가방 전달에 공모·가담했음을 입증할 증거는 부족하다고 판단했다. 이에 김건희 특검팀(특별검사 민중기)은 전날 사실오인 및 법리오해를 이유로 재판부에 항소장을 제출했다. ◎공감언론 뉴시스 friend@newsis.com","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014307099"},{"title":"“시신 일부 냄비서 발견”…연예인 전처 ‘토막 살해’ 남성이 차에서 한짓","link":"https://n.news.naver.com/article/009/0005759922","pubDate":"2026-11-06T19:06:27+09:00","author":"매일경제","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/009/0005759922"},{"title":"중수청, ‘쿠팡 허위 세금계산서’ 의혹 경찰로 이첩…“중복수사 우려”","link":"https://n.news.naver.com/article/056/0012288935","pubDate":"2026-11-06T18:01:01+09:00","author":"경향신문","description":"경기 광주 쿠팡 물류센터 모습. 문재원 기자중대범죄수사청(중수청)이 쿠팡의 ‘허위 세금계산서 발급 의혹’ 사건을 경찰로 넘겼다.서울중수청 경제범죄수사국은 5일 국세청이 한국 쿠팡 본사와 물류 자회사인 쿠팡풀필먼트서비스(CFS) 법인, 각 전·현직 대표이사 등 4명을 고발한 사건을 서울경찰청에 이첩했다고 밝혔다.앞서 국세청은 쿠팡이 2023년 고객들에게 유료···","category":"사건 사고","naverLink":"https://n.news.naver.com/article/056/0012288935"},{"title":"與 \"'조작기소 특검법', 尹정치검찰 과오 청산하고 검찰개혁 마침표\"","link":"https://n.news.naver.com/article/003/0014306945","pubDate":"2026-11-06T17:51:12+09:00","author":"뉴시스","description":"[서울=뉴시스]권신혁 기자 = 더불어민주당은 6일 '조작기소 특검법'이 국회 본회의를 통과하자 \"윤석열 정권 정치검찰의 과오를 청산하고 검찰개혁의 마침표를 찍겠다\"고 밝혔다. 박성준 민주당 수석대변인은 이날 오후 서면브리핑에서 \"오늘 윤석열 정권 정치검찰 조작기소 특검법이 본회의를 통과했다\"며 이같이 말했다. 박 수석대변인은 \"이제 국회 추천을 거쳐 대통령의 특별검사 임명이 이뤄지면 본격적으로 윤석열 정권 정치검찰이 행했던 조작 기소의 민낯이 드러날 것\"이라고 했다. 또 \"검찰이 사라졌다고 해서 정치검찰이 벌인 잘못이 사라지는 것은 아니다\"라며 \"과거의 잘못을 바로잡아야 새로 출범한 공소청이 바로 서고 중수청을 비롯한 수사기관의 미래를 바로 세울 수 있다\"고 말했다. 그러면서 \"이번 조작기소 특검법은 조작을 일삼아 수사와 기소권을 휘둘렀던 정치검찰의 과오를 청산하고 검찰개혁의 마침표를 찍을 것\"이라고 덧붙였다. ◎공감언론 뉴시스 innovation@newsis.com","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014306945"},{"title":"\"유튜버한테 날아든 수상한 메일\"…방미통위, 사칭 메일 주의 당부","link":"https://n.news.naver.com/article/003/0014306402","pubDate":"2026-11-06T14:55:02+09:00","author":"뉴시스","description":"[서울=뉴시스]박은비 기자 = 유튜버들에게 방송미디어통신위원회를 사칭하는 메일이 발송돼 주의가 요구된다. 방미통위는 '유튜브 채널 내 성인·불법 스팸 댓글 방치 관련 긴급 모니터링 및 조치 협조 요청'이라는 제목의 사칭 메일은 방미통위가 보낸 메일이 아니라고 6일 밝혔다. 네이버 메일 계정으로 발송된 이 메일은 보안 강화와 시스템 패치를 요구한다. 유튜버 채널 댓글에 성인광고, 성매매 유도, 불법 링크 등이 포함된 스팸성 게시물이 등록되고 있으니 삭제·차단하라는 내용도 담겼다. 발신인은 궁금한 사항을 유튜브 크리에이터 지원센터로 문의하라고 권유하는 한편 메일 확인 즉시 수신 확인 답변을 보내달라고 했다. 이런 패턴이 전형적인 사기 목적의 이메일이라는 게 방미통위 설명이다. 방미통위는 별도의 유튜브 크리에이터 지원센터를 운영하고 있지 않다. 메일주소도 '@korea.kr'을 사용하며, 관인이 날인된 공문을 사용한다. 방미통위는 한국인터넷진흥원(KISA)과 함께 문제가 된 메일 계정의 발송 기능을 차단 조치한 상태다. 관련 사기 메일을 받으면 즉시 방미통위나 KISA에 신고해달라고 당부했다. ◎공감언론 뉴시스 silverline@newsis.com","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014306402"}],"사회":[],"생활":[{"title":"“한 푼 한 푼 아끼며 살기 지쳤다”…거리로 나온 60만명에 장갑차 동원한 佛","link":"https://n.news.naver.com/article/009/0005760052","pubDate":"2026-11-06T23:48:33+09:00","author":"매일경제","description":"프랑스에서 생활비 부담 완화와 임금 인상, 공공서비스 개선을 요구하는 시위가 전국으로 확산했다. 노동자와 학생들이   const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
