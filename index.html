두에게 10년간 아동·청소년 관련 기관 취업제한 명령도 내려달라고도 했다. 검사는 “피고인들 모두 친부모로 양육의 책임이 있는데도 피해 아동을 생후부터 방치해 극심한 발육부진과 영양결핍을 앓게 했고, 아동은 급기야 혈변을 하다 숨졌다”며 “특별한 경제적 활동도 없이 조부모로부터 도움을 받을 수 있음에도 거부하고 용납하기 어려운 사유로 무책임하게 친자식을 유기해 살해해 죄책에 상응하는 엄벌이 필요하다”고 밝혔다. A 씨 부부는 아들이 출생한 지 불과 10여일 됐던 지난해 12월 22일부터 올해 7월 5일까지 아이를 주거지에 홀로 둔 채 PC방에 가거나 여행을 가는 등 총 140차례에 걸쳐 방치하고, 아이에게 필요한 의·식·주 등 기본적인 보호·양육을 하지 않은 혐의로 재판에 넘겨졌다. 공소청 조사 결과 A 씨 부부는 아기를 상습적으로 방치하면서 체중이 현저히 감소한 아기에게 분유도 제대로 주지 않았는데, 부검 결과 아기의 특정 신체 부위가 짓물렀고 구더기까지 발견됐다. 두 사람은 올해 4월에는 집에 반려견과 당시 4개월이었던 아들만 둔 채 27시간 46분 동안 집을 비운 것으로도 조사됐다. 지난해 12월 출생 당시 몸무게가 3.62㎏였던 피해 아동은 사망했던 올해 7월 5일 당시엔 3.68㎏에 불과했다. 출생할 때 비해 겨우 0.06㎏ 늘어난 것으로, 생후 6개월 남아 평균 몸무게(8.3㎏)의 절반에도 미치지 못했다. 친부인 A 씨는 아기 사망 뒤 ‘아이가 죽으면 처벌이 얼마나 되느냐“고 인공지능(AI)에 물어봤고, 친모인 B 씨도 포털사이트에 아기 출생 약 한 달여 뒤부터 수개월에 걸쳐 ’신생아 사망 보험금‘, ’아이 죽이고 싶어요‘, ’아사 뜻‘ 등을 검색한 것으로 드러났다. 이들은 각각 “당황해서 검색했다”, “산후우울증 때문에 검색해서 위로받으려고 그랬다”고 법정에서 진술했는데, 아기의 사망과 관련해서는 “사망할 줄은 몰랐다”며 살인 고의를 부인해왔다. 피고인들의 변호인","category":"사건 사고"},{"title":"李대통령 “시험 부정행위, 주가조작 같은 중대범죄…엄두도 못 내게 처벌 강화”","link":"https://n.news.naver.com/mnews/article/005/0001887070","naverLink":"https://n.news.naver.com/mnews/article/005/0001887070","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"“의심사례 빠짐없이 추적해 일벌백계…‘지난 일이니 다 끝났겠지’라는 생각 명백히 오산” “AI 시대 맞아 기존 시험 및 평가 방식 변화 필요성 고민해야” 이재명 대통령이 24일 청와대에서 열린 국무회의에서 발언하고 있다. 뉴시스 이재명 대통령은 24일 “단 하나의 부정행위도 용납하지 않는다는 확고한 원칙에 따라 행정력을 총동원해 시험 부정 범죄에 엄정히 대응해 달라”고 주문했다. 이 대통령은 청와대에서 주재한 국무회의에서 “실력을 겨루는 모든 시험의 부정행위는 성실하게 노력한 다른 사람의 기회를 훔치는 것이고, 공정경쟁이라는 공동체의 핵심 원리를 파괴하는 중대 범죄”라며 이같이 밝혔다. 이 대통령은 시험 부정행위에 대해 “사익을 위해 타인에게 손해를 끼치며 사회적 신뢰의 근간을 흔든다는 점에서 주가조작 범죄와 본질이 전혀 다르지 않다”며 “이런 불법과 반칙을 방관하면 사회가 온전히 유지될 수 없다”고 지적했다. 이 대통령은 국가시험 전반에 대한 범정부 합동 조사를 실시해 부정행위를 철저히 밝혀내 책임을 물어야 한다고 강조했다. 이 대통령은 “인공지능(AI) 기업과 긴밀하게 협조하고 신고센터를 운영해 모든 의심 사례를 빠짐없이 추적하고, 법과 원칙에 따라 엄정하기 일벌백계하라”고 지시했다. 또 “적극적이고 과감한 포상제도를 운영해 부정행위 적발 가능성을 대폭 높여야 한다”며 “시험지 불법 촬영, 외부 유출을 원천 차단하고 유출 시 끝까지 추적할 수 있도록 하는 법 제도와 기술의 정비도 최대한 속도를 높여야 한다”고 당부했다. 특히 “‘지난 일이니 다 끝났겠지’라는 생각이 명백히 오산이라는 점을 확실하게 보여줘야 한다”며 “관련 법령 정비를 통해 부정행위를 시도하겠다는 엄두조차 낼 수 없도록 처벌과 제재 수위를 획기적으로 강화해야 한다”고 재차 강조했다. 아울러 이 대통령은 “본격적 AI 시대를 맞아 기존의 시험과 평가 방식의 변화가 필요한 건 아닌지도 고민해야 할 때”라고도 덧붙였다.","category":"사건 사고"},{"title":"구조조정·자산 매각으로 재무숨통…롯데그룹, 롯데월드타워 담보 해지","link":"https://n.news.naver.com/mnews/article/020/0003764475","naverLink":"https://n.news.naver.com/mnews/article/020/0003764475","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"구조조정·자산 매각으로 재무숨통…롯데그룹, 롯데월드타워 담보 해지. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"고경표, “대리운전 왜 안 불렀나” 묻자 한숨만…음주운전 사고 9일 만 경찰 조사","link":"https://n.news.naver.com/mnews/article/468/0001282961","naverLink":"https://n.news.naver.com/mnews/article/468/0001282961","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"고경표, “대리운전 왜 안 불렀나” 묻자 한숨만…음주운전 사고 9일 만 경찰 조사. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"'리트 만점자' 책 사고 손해배상 청구한 구매자들, 소 취하","link":"https://n.news.naver.com/mnews/article/018/0006414403","naverLink":"https://n.news.naver.com/mnews/article/018/0006414403","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"[이데일리 장영락 기자] AI를 이용한 부정행위 의혹을 받다 사망한 법학적성시험(LEET) 만점자 이진우씨 책 구매자들이 손해배상 소송을 취하했다. 연합 23일 법조계에 따르면 이씨 저서 ‘브레인 악셀’ 구매자 17명의 소송대리인은 지난 20일 서울중앙지법 민사18단독 재판부에 소 취하서를 제출했다. 이들은 앞서 이씨와 출판사를 대상으로 책값과 위자료 등을 청구하는 손해배상 소송을 청구한 바 있다. 하지만 소장 부본이 피고에게 송달되기 전인 19일 이씨가 사망하면서 소송을 계속 진행하지 못하게 됐다. 민사소송은 소장이 송달되기 전 피고가 사망하는 경우 상속인이 소송을 이어받는 소송수계가 적용되지 않도록 규정하고 있다.이씨는 올해 LEET 시험에서 만점을 받은 후 성적 향상 경험을 담았다는 저서 ‘브레인 악셀’을 출간했다. 그러나 이씨가 대학수학능력시험과 LEET에서 AI를 이용해 부정행위를 했다는 의혹이 불거지면서 책을 구매한 이들이 환불을 요청하는 등 반발하며 소송을 냈다. 이씨는 지난 19일 수학능력시험 당일 시험 풀이를 통해 공개 검증을 하겠다고 밝혔으나 현장에 나타나지 않고 연락이 두절됐고, 같은 날 오후 서울 강동구 한 모텔에서 숨진 상태로 발견됐다. 한편 경찰은 이씨가 위계에 의한 공무집행방해, 업무방해, 사기 등 혐의로 고발된 사건을 수사 중이다. 경찰은 이씨가 사망했지만 ‘공소권 없음’을 사유로 종결하지 않고 실체적 진실 확인을 위해 수사를 이어갈 방침이다.","category":"사건 사고"},{"title":"'인터폴 적색수배' 금영엔터 회장 두바이서 붙잡혀…경찰 송환 추진","link":"https://n.news.naver.com/mnews/article/003/0014340786","naverLink":"https://n.news.naver.com/mnews/article/003/0014340786","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"불법체류 드러나 현지 출입국 시설에 수용…내달 송환 목표 기술료 30억~40억 빼돌린 혐의…21년 말 해외로 출국 경찰로고.(뉴시스DB) *재판매 및 DB 금지 [서울=뉴시스] 신항섭 기자 = 회삿돈을 빼돌린 혐의로 경찰 수사를 받다 해외로 출국한 노래방 기기 업체 금영엔터테인먼트 회장이 아랍에미리트(UAE) 두바이에서 붙잡혔다. 23일 경찰에 따르면 김 회장은 최근 두바이에서 불법체류 사실이 드러나 현지 출입국 당국 시설에 수용됐다. 경찰은 법무부를 통해 UAE 측과 협의하며 김 회장의 국내 송환을 추진하고 있다. 김 회장은 회사가 전·현직 직원들이 세운 외부 업체 3곳에 반주음악 재생기술 사용료 명목으로 약 30억~40억원을 지급하게 한 혐의를 받는다. 이 돈은 김 회장 본인과 가족 계좌, 김 회장이 대표로 있는 다른 회사 등으로 흘러간 것으로 알려졌다. 경찰은 2021년 10월 부산에 있는 금영엔터테인먼트 사무실과 공장 등을 압수수색하며 본격 수사에 나섰다. 김 회장은 같은 해 11월 경찰의 첫 소환 이후 조사에 응하지 않다가 그해 말 해외로 출국했다. 경찰은 2022년 초 김 회장에 대한 체포영장을 발부받고 여권 무효화 조치와 함께 인터폴에 적색수배를 요청했다. 김 회장은 이와 별개로 특정경제범죄가중처벌법상 사기 혐의로도 수사를 받고 있다. 서울 수서경찰서는 올해 관련 고소장을 접수했다．","category":"사건 사고"},{"title":"‘횡령 혐의’ 금영엔터 회장, 두바이서 불법체류 적발…경찰 송환 추진","link":"https://n.news.naver.com/mnews/article/366/0001206792","naverLink":"https://n.news.naver.com/mnews/article/366/0001206792","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"일러스트=손민균 경찰이 회삿돈을 빼돌린 혐의로 수사를 받던 중 출국한 금영엔터테인먼트 김모 회장의 국내 송환을 추진하고 있다.. 최근 아랍에미리트(UAE) 두바이 출입국 당국이 그의 신병을 확보했기 때문이다. 23일 경찰청에 따르면 김 회장은 두바이에서 불법체류 사실이 확인돼 현지 출입국 당국 시설에 수용됐다. 경찰은 이르면 다음 달 국내 송환을 목표로 법무부를 통해 UAE 측과 협의 중이다. 김 회장은 자신과 가족 등에게 회사 자금을 빼돌린 혐의를 받고 있다. 전·현직 직원들이 설립한 외부 업체에 기술사용료 명목으로 회삿돈을 지급한 뒤 이 돈을 자신의 계좌나 자신이 대표로 있는 다른 회사로 옮긴 것으로 알려졌다. 김 회장이 수사를 받던 중인 2021년 말 출국하자 경찰은 이듬해 초 체포영장을 발부받고 여권 무효화와 인터폴 적색수배를 요청했다.","category":"사건 사고"},{"title":"“아침 거르고 점심 먹는 게 일상인데”…첫 끼 늦게 먹을수록 사망 위험 높았다 [헬시타임]","link":"https://n.news.naver.com/mnews/article/011/0004685327","naverLink":"https://n.news.naver.com/mnews/article/011/0004685327","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"클립아트코리아 아침 식사를 거르고 정오가 지나 첫 끼를 먹는 사람은 이른 아침 식사를 하는 사람보다 사망 위험이 높을 수 있다는 연구 결과가 나왔다. 최근 과학 전문매체 사이언스얼러트에 따르면 중국 화중과학기술대 연구진은 미국 성인 3만1044명의 식사 시간과 사망 위험 사이의 연관성을 분석해 이 같은 결과를 확인했다. 연구진은 미국 국민건강영양조사(NHANES)에 참여한 40세 이상 성인 3만1044명의 1999~2018년 식사 기록을 분석했다. 참가자들이 하루 중 처음과 마지막으로 열량이 있는 음식이나 음료를 섭취한 시간을 확인하고 사망 기록과 비교했다. 중앙값 8.6년의 추적 기간 동안 참가자 7129명이 숨졌으며, 이 가운데 2259명은 심혈관질환으로 사망했다. 분석 결과 오전 7~8시에 첫 끼를 먹는 사람과 비교해 오전 8~10시에 먹는 사람은 전체 사망 위험이 10% 높았다. 오전 10시부터 정오 사이에 먹는 경우에는 19%, 정오 이후 첫 끼를 먹는 경우에는 29% 높게 나타났다. 특히 정오가 지나 첫 끼를 먹는 사람은 오전 7~8시에 먹는 사람보다 심혈관질환으로 사망할 위험이 46% 높았다. 기대수명에도 차이가 나타났다. 50세를 기준으로 정오 이후 첫 끼를 먹는 사람의 추정 기대수명은 오전 7~8시에 먹는 사람보다 평균 2.46년 짧았다. 하루 중 마지막 식사 시간 역시 사망 위험과 연관성을 보였다. 오후 7~8시에 마지막 식사를 마친 사람과 비교해 자정 이후 음식을 섭취한 사람은 전체 사망 위험이 27% 높았다. 50세 기준 추정 기대수명도 평균 2.35년 짧은 것으로 나타났다. 연구진은 늦은 식사가 체내 생체시계를 교란하고 혈당과 지방 대사에 영향을 미칠 가능성이 있다고 설명했다. 다만 이번 연구는 관찰연구로 늦은 식사가 사망 위험을 직접 높인다는 인과관계가 입증된 것은 아니다. 연구진은 식사 시간이 기존 건강 상태나 생활 습관을 반영하는 지표일 수도 있다며 결과를 신중하게 해석해야 한다고 강조했다. 해당 연구는 국제학술지 ‘유럽 임상영양학 저널(European Journal of Clinical Nutrition)’에 게재됐다.","category":"사건 사고"},{"title":"“수능날 스마트기기 적발된 4건 수사 중”","link":"https://n.news.naver.com/mnews/article/032/0003484555","naverLink":"https://n.news.naver.com/mnews/article/032/0003484555","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"국수본 ‘리트 만점자’ 강제수사 가능성…AI 부정행위 33건 수사 경찰이 2027학년도 대학수학능력시험에서 스마트기기를 이용해 부정행위를 하다 적발된 사건 4건을 수사 중이다. 법학적성시험(LEET·리트) 만점자 이진우씨의 부정행위 의혹에 대해서는 그의 사망과 별개로 강제수사 가능성을 열어두고 있다. 홍석기 경찰청 국가수사본부장(사진)은 23일 서울 서대문구 경찰청에서 연 정례 기자간담회에서 올해 수능 부정행위 사건 4건을 수사 중이라고 밝혔다. 유형별로는 AI안경 사용 1건(충남), 카메라·이어폰 사용 1건(경기 남부), 휴대전화 촬영·검색 2건(서울) 등이다. 홍 본부장은 4건 모두 112신고에 따라 수사에 착수했다며 “관련 증거와 진술을 확보, 임의동행해 2명을 조사했고 나머지 2명은 추후 조사할 예정”이라고 말했다. 홍 본부장은 부정행위 의혹이 불거진 후 사망한 이씨에 대해서는 “굉장히 안타깝게 생각한다”면서도 “기기 사용 여부와 공모 정황 등을 확인해야 해서 공소권 없음과 별개로 필요하면 강제수사를 할 수도 있다”고 밝혔다. 추가 부정행위 의혹이 불거진 이씨의 2024학년도 수능에 관해서도 “수사 필요성이 있다고 판단되면 제한을 두지 않고 다 수사할 예정”이라고 했다. 이씨의 2026학년도 수능 시험지에 대해서는 자료 보전을 요청했으며 이를 확보하면 분석할 계획이라고 홍 본부장은 밝혔다. 인공지능(AI)을 활용한 시험 부정행위에 대응하기 위해 구성된 경찰청 태스크포스(TF)는 총 33건을 들여다보고 있다. 이들 중 15건은 수사 중이고 18건은 입건 전 조사(내사) 중이다. AI안경이나 이어폰 등 장비와 관련된 사건은 5건이다. TF는 온라인 게시글 가운데 부정행위 자백 12건, 예고 3건, 장비 판매 4건 등에 대해서도 작성자와 작성 경위 등 사실관계를 확인 중이라고 홍 본부장은 전했다. 교육부는 ‘수능 부정행위 신고센터’를 통해 추가 부정행위 의심 사례를 계속 제보받기로 했다. 제보 기한은 따로 정하지 않고 제보 대상도 과거 수능까지 포함된다. 다만 과거 부정행위 조사에 필요한 시험지를 확보하는 데는 어려움이 예상된다. 신진용 교육부 대입정책과장은 “신고 내용을 유형별로 정리하고 필요한 경우 사실관계 확인도 진행할 것”이라고 말했다.","category":"사건 사고"},{"title":"동료 떼죽음 본 원숭이들, ‘결벽증’ 생겼다?…어떻게 병 옮는지 몰라도 더러운 건 피해 [후암동 논문 연구소]","link":"https://n.news.naver.com/mnews/article/016/0002727321","naverLink":"https://n.news.naver.com/mnews/article/016/0002727321","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"텍사스 보호구역 일본원숭이 55마리 관찰 전염병 겪은 무리, 더러운 포도 절반 넘게 남겨 ‘피하기’를 배운 게 아니라 조심성 자체가 커져 첫 번째 실험 장면. 연구자가 울타리 밖에서 미닫이 실험대를 밀어 넣자 원숭이가 다가와 먹이를 고르고 있다. [로열 소사이어티 오픈 사이언스] [헤럴드경제=장윤우 기자] 코로나19가 한창이던 때를 떠올려 보면 현관 앞에 놓인 택배 상자를 소독제로 닦고, 엘리베이터 버튼은 손가락 대신 팔꿈치로 누르는 등 평소에 하지 않던 행동을 해왔다. 바이러스가 주로 공기를 통해 옮는다는 걸 알면서도 손에 닿는 거의 모든 것이 찜찜했다. 이런 반응은 사람에게서 여러 차례 확인된 바 있다. 감염병이 돌면 사람들은 그 병이 옮는 경로와 상관없는 것까지 더 꺼리게 된다는 연구들이다. 행동으로 병을 피하는 이른바 ‘행동 면역’이 위험한 시기에 한층 예민해진다는 것이다. 원숭이도 그럴까. 원숭이들이 오염돼 보이는 먹이를 피한다는 관찰은 이전에도 있었다. 다만 그 조심성이 겪은 일에 따라 달라지는지는 확인된 적이 없었다. 최근 국제학술지 ‘로열 소사이어티 오픈 사이언스’에 미국 UC샌디에이고 슈테판 카우프홀트·페데리코 로사노 연구팀은 치명적인 바이러스 유행을 겪은 원숭이 무리가 오염돼 보이는 먹이를 훨씬 더 많이 거부했다는 결과를 발표했다. [게티이미지뱅크]","category":"사건 사고"}],"사회":[{"title":"공무원 노조 교육부 지부, 최교진 전 장관에 감사패 전달 계획","link":"https://n.news.naver.com/mnews/article/025/0003567337","naverLink":"https://n.news.naver.com/mnews/article/025/0003567337","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"지난 16일 당시 최교진 교육부 장관이 서울 여의도 국회에서 열린 교육위원회 전체회의에서 인공지능(AI)을 활용한 부정행위에 대한 의원 질의를 듣고 있다. 뉴스1 전국공무원노동조합 교육부지부가 최교진 전 교육부 장관에게 감사패를 전달할 예정이다. 노조는 23일 입장문을 내고 “조합원과 교육부 전 직원의 감사한 마음을 담은 감사패를 최 전 장관에게 전달할 계획”이라고 밝혔다. 퇴임 장관에게 감사패를 전달하는 것이 관례는 아니다. 노조 관계자는 “반드시 하지는 않았다”며 “이번 장관은 저희와 소통도 자주 했고 교육계에서 공로도 커 의미 있게 준비하려 한다”고 말했다. 감사패 전달 적절성과 관련해서는 “이번 사태와 별개로 교육부 직원들이 그동안 장관의 노고에 감사한다는 뜻에서 드리는 것”이라고 밝혔다. 전달은 추후 공식적으로 크게 알리지 않고 진행될 예정이다. 노조는 최 전 장관의 사퇴에 대해 “수능 관리에 대한 도의적·정무적 책임을 지고 물러났다”며 “실무 직원들에게 비난의 화살이 돌아가지 않도록 본인의 거취로써 마지막 방패가 돼준 장관의 책임감에 고마움을 느낀다”고 밝혔다. 노조는 “향후 교육부의 신뢰 회복에도 힘쓰겠다”고 했다. 다만 대학수학능력시험 인공지능(AI) 부정행위 대응 부실로 불명예 퇴진한 장관에게 감사패를 전달하는 일이 부적절하다는 비판이 나올 가능성이 있다. 정치권에는 AI 등 신기술 발전에 맞춘 법·제도 정비를 촉구했다. 시험 감독관 보호 장치 강화도 요구했다. 노조는 “한 사람의 사퇴로 모든 문제를 덮고 지나간다면 이와 같은 비극은 반복될 수밖에 없다”고 밝혔다.","category":"사회"},{"title":"울릉도 주민 출근길에 때아닌 대피령…러시아 군용기 KADIZ 진입에 경계경보 발령","link":"https://n.news.naver.com/mnews/article/088/0001041917","naverLink":"https://n.news.naver.com/mnews/article/088/0001041917","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"울릉도 주민 출근길에 때아닌 대피령…러시아 군용기 KADIZ 진입에 경계경보 발령. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"LG U+, 데이터독과 협력…익시오 서비스 장애 대응 시간 85% ↓","link":"https://n.news.naver.com/mnews/article/277/0005846908","naverLink":"https://n.news.naver.com/mnews/article/277/0005846908","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"LG U+, 데이터독과 협력…익시오 서비스 장애 대응 시간 85% ↓. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"한교총, \"평등법, 종교 자유 위협\"…박주민 \"함께 지키자\" 대화 제안","link":"https://n.news.naver.com/mnews/article/079/0004212998","naverLink":"https://n.news.naver.com/mnews/article/079/0004212998","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"\"교회 자율성 위축 우려\"…철회 촉구 박주민 의원 \"예배·설교·교리 등 대상 아냐\" \"보복 행위 징역형, 과태료로 변경\" [앵커] 더불어민주당 박주민 의원이 지난 11일 대표발의한 '평등에 관한 법률안', 이른바 평등법을 두고 한국교회총연합이 철회를 요구하고 나섰습니다. 종교의 자유를 위협할 수 있다며 직접 행동에 나서겠다고 예고했는데요. 박 의원은 법안의 제재 절차와 적용 범위에 대한 우려를 해명하며 교계에 직접 대화를 제안했습니다. 장세인 기자가 보도합니다. [기자] 한국교회총연합이 평등법 철회를 촉구하고 나섰습니다. 한교총은 \"2026년 한 해 동안 포괄적 차별금지법과 정교유착 방지법안, 사학법 개정안과 상속세 및 증여세법 시행령 개정에 대해 지속적으로 문제를 제기하며 정부와 국회에 시정을 촉구해 왔다\"며 \"그럼에도 종교의 자유와 교회의 자율성을 위축시킬 우려가 있는 입법 시도가 멈추지 않고 있다\"고 밝혔습니다. 한교총은 \"이러한 상황에서 박주민 의원이 지난 11일 평등에 관한 법률안을 발의했다\"며 \"이번 법안은 형사처벌과 징벌적 손해배상을 삭제했지만 국가인권위원회의 시정명령과 이행강제금, 민사상 손해배상 등 제재 수단을 포함하고 있다\"고 우려했습니다. 그러면서 \"형사처벌 조항보다 이행강제금 조항이 더 강력한 제재이므로 처벌 조항을 삭제했다고 종교와 양심, 표현의 자유에 대한 우려가 사라지는 것은 아니\"라고 강조했습니다. 박주민 의원이 발의한 평등법은 성별과 장애, 병력, 나이, 출신 국가, 혼인 여부, 종교, 성별 정체성 등을 이유로 한 합리적이지 않은 차별을 금지하는 법안입니다. 차별금지법안은 지난 21대 국회와 그 이전에도 여러 차례 발의됐지만 매번 국회를 통과하지 못했습니다. 박주민 의원은 교계의 우려를 알고 있다며 적극 해명에 나섰습니다. 박 의원은 이행강제금은 차별이 있었다는 이유만으로 곧바로 부과되는 것이 아니라고 설명했습니다. 인권위가 양측에 사실관계를 조사하고 차별을 바로잡아 달라는 권고와 시정명령, 여기에 이의신청과 소송 등 불복 절차를 모두 거친 뒤에도 명령을 이행하지 않을 때 부과되는 행정 수단이라는 겁니다. 또 이 법의 적용 영역은 고용과 재화·용역의 공급과 이용, 교육·직업훈련, 법령과 정책의 집행 등 네 가지라며 예배와 설교, 교리와 신앙고백은 대상이 아니라고 밝혔습니다. 피해자에게 불이익을 주는 보복 행위에 대한 징역형 조항 때문에 평등법이 처벌법이라는 오해가 이어져 이 역시","category":"사회"},{"title":"GS파워, 의왕시민과 탄소중립 실천 위한 ‘희망 한걸음’","link":"https://n.news.naver.com/mnews/article/092/0002446550","naverLink":"https://n.news.naver.com/mnews/article/092/0002446550","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"GS파워, 의왕시민과 탄소중립 실천 위한 ‘희망 한걸음’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[속보] 젠슨 황 복귀에 엔비디아 33% 폭등…나스닥도 7% 급등 출발","link":"https://n.news.naver.com/mnews/article/081/0003702349","naverLink":"https://n.news.naver.com/mnews/article/081/0003702349","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 전 엔비디아 최고경영자(CEO). 로이터 연합뉴스 미국 뉴욕증시가 23일(현지시간) 젠슨 황 엔비디아 최고경영자(CEO)의 전격 복귀 소식에 장 초반 급등세를 보였다. 기술주 중심의 나스닥 종합지수는 이날 전 거래일 대비 7.30% 오른 24,269.75에 거래를 시작했다. 엔비디아 주가도 전 거래일 종가 대비 약 33% 오른 167.08달러에 거래를 시작했다. 지난주 인공지능(AI) 관련주를 중심으로 급락했던 뉴욕증시는 황 CEO의 복귀 소식에 급반등했다. 이날 엔비디아는 공식 홈페이지를 통해 이사회가 젠슨 황의 CEO 및 이사직 복귀를 만장일치로 결정했다고 밝혔다. 이사회는 미국 정부 고위 관계자들의 의견을 수렴했다며 황 CEO 복귀가 국가 안보에 어떤 위협도 되지 않는다고 판단했다고 전했다.","category":"사회"},{"title":"전석훈 경기도의원, 기획 '잡아드림'…전국 채용정보 제공 확대·웹 통합도 추진","link":"https://n.news.naver.com/mnews/article/030/0003488799","naverLink":"https://n.news.naver.com/mnews/article/030/0003488799","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"전석훈 경기도의원, 기획 '잡아드림'…전국 채용정보 제공 확대·웹 통합도 추진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"'인터폴 적색수배' 금영엔터 김진갑 회장, 두바이서 붙잡혀…다음달 송환 추진","link":"https://n.news.naver.com/mnews/article/014/0005608589","naverLink":"https://n.news.naver.com/mnews/article/014/0005608589","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"'인터폴 적색수배' 금영엔터 김진갑 회장, 두바이서 붙잡혀…다음달 송환 추진. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"'수십억 횡령' 금영엔터 회장 두바이서 붙잡혀…내달 송환 목표","link":"https://n.news.naver.com/mnews/article/469/0000967308","naverLink":"https://n.news.naver.com/mnews/article/469/0000967308","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"불법체류 적발돼 현지 출입국 시설에 수용 경찰, 법무부 통해 UAE와 국내 송환 협의 게티이미지뱅크 회삿돈 수십억 원을 빼돌린 혐의로 경찰 수사를 받다가 해외로 달아난 노래방 기기 업체 금영엔터테인먼트 김진갑 회장이 아랍에미리트(UAE) 두바이에서 붙잡혔다. 23일 경찰에 따르면, 김 회장은 최근 두바이에서 불법체류 사실이 드러나 현지 출입국 당국 시설에 수용됐다. 경찰은 법무부를 거쳐 UAE 당국과 협의하며 김 회장의 국내 송환을 추진하고 있다. 김 회장은 전·현직 직원들이 차린 외부 업체 3곳에 회사가 반주음악 재생기술 사용료 명목으로 30억~40억 원가량을 지급하도록 한 혐의를 받는다. 이 돈은 김 회장 본인과 가족 명의의 계좌, 김 회장이 대표를 맡고 있는 다른 회사 등으로 흘러간 것으로 전해졌다. 경찰은 2021년 10월 부산의 금영엔터테인먼트 사무실과 공장 등을 압수수색하며 본격적으로 수사에 나섰다. 하지만 김 회장은 같은 해 11월 첫 소환 뒤 조사에 응하지 않았고, 그해 말 해외로 출국했다. 경찰은 2022년 초 김 회장에 대한 체포영장을 발부받았고, 여권을 무효화하는 한편 인터폴(국제형사경찰기구)에 적색수배를 요청했다. 김 회장은 이와 별도로 특정경제범죄가중처벌법(특경법)상 사기 혐의로도 수사를 받고 있다. 서울 수서경찰서가 올해 관련 고소장을 접수해 수사 중이다.","category":"사회"},{"title":"현직 30대 해경 간부, 음주운전 적발 ‘면허 정지’ 수준…직위 해제","link":"https://n.news.naver.com/mnews/article/016/0002727367","naverLink":"https://n.news.naver.com/mnews/article/016/0002727367","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"현직 30대 해경 간부, 음주운전 적발 ‘면허 정지’ 수준…직위 해제. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"춘천 상권 살리고, 청도 돌봄 지키고…KT, 지역 문제 해결에 AI 투입","link":"https://n.news.naver.com/mnews/article/009/0005767940","naverLink":"https://n.news.naver.com/mnews/article/009/0005767940","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"윤호중 행정안전부 장관(왼쪽)과 박윤영 KT 대표이사가 ‘사회연대경제 인공지능전환(AX) 활성화 지원을 위한 업무협약’ 체결 후 기념 촬영을 하고 있다. [KT] KT가 인공지능전환(AX)의 무대를 확장한다. 행정안전부와 손잡고 인공지능(AI) 기술과 인프라를 지역사회에 제공해 주민들이 스스로 지역 문제를 해결할 수 있도록 자생적 생태계를 구축하겠다는 구상이다. 23일 통신업계에 따르면 이날 KT와 행안부는 서울 종로구 정부서울청사에서 ‘사회연대경제 AX 활성화 지원을 위한 업무협약’을 체결했다. 이번 협약은 지난 9월 사회연대경제기본법 제정을 계기로 민간기업의 기술력과 전문성을 연결해 지역 문제 해결력을 끌어올리고자 추진됐다. 구체적으로 KT와 행안부는 ▲AX 기반 지역사회 문제 해결 ▲지역 AI 인재 양성 및 디지털 격차 해소 ▲지역 민관협력 거버넌스 AX 지원 등 핵심 분야에서 협력을 이어간다는 방침이다. 우선 주민들과 사회연대경제조직이 직접 발굴한 현안에 KT의 AI 기술과 전문 인력을 투입해 맞춤형 해결 모델을 구축한다. KT는 과제 발굴 프로그램인 ‘소셜 AX 챌린지’를 운영하고 지역 소상공인과 청년 창업가를 위한 솔루션 지원 방안도 모색할 예정이다. 도출된 모델은 현장 실증을 거쳐 전국으로 확산한다. 미래 인재 육성과 어르신 디지털 포용에도 팔을 걷어붙인다. 교육청 및 대학교와 연계해 청년들을 지역 문제 해결형 AI 인재로 길러내고, AI 활용능력 자격시험(AICE) 취득을 지원한다. 아울러 KT를 대표하는 사회공헌 프로그램인 ‘정보기술(IT) 서포터즈’와 이동식 체험교육 ‘AI 스테이션’을 활용해 세대 불문 AI 교육 기회를 제공한다. 지방정부와 지역조직의 일하는 방식도 혁신한다. 조직별 업무 체계를 진단한 뒤 KT의 AX 컨설팅과 솔루션을 접목해 행정 효율을 높인다는 계획이다. 강원 춘천시와 경북 청도군이 시범사업 대상지로 낙점됐다. 춘천에서는 상인과 청년이 AI를 활용해 점포 운영과 마케팅 활동을 강화하는 ‘원도심 상권 활성화 모델’, 청도에서는 흩어진 돌봄 데이터를 모으고 방문 기록을 AI로 자동화하는 ‘통합 돌봄 모델’ 구축에 주력한다. 박윤영 KT 대표이사는 “KT는 대한민국을 대표하는 AX 플랫폼 기업으로서 ‘모두를 위한 AI’를 실현하기 위해 노력하고 있다”라며 “이번 협약을 계기로 지역사회가 필요로 하는 AI 교육과 디지털 포용, 공공 AX 혁신을 지원하고 지역과 함께 성장하는 지속","category":"생활·문화"},{"title":"서울 지하철 3년만 총파업?…내일 막판교섭, 임금인상 쟁점","link":"https://n.news.naver.com/mnews/article/437/0000522106","naverLink":"https://n.news.naver.com/mnews/article/437/0000522106","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"〈사진출처=연합뉴스〉 서울 지하철 1~8호선 운행사인 서울교통공사 노조가 총파업을 하루 앞두고 막판 교섭에 나섰습니다. 서울교통공사 노사는 24일 오전 10시부터 3개 노동조합과 차례로 임금·단체협약 본교섭을 진행합니다. 오전 10시 교통노조(제1노조)를 시작으로 오전 11시 올바른노조(제2노조), 오후 1시 30분 통합노조(제3노조)와 각각 교섭합니다. 지난 9월 29일 3차 본교섭이 결렬된 지 56일 만인데, 핵심 쟁점은 인력 충원과 임금 인상입니다. 노조는 2023년 마련된 2212명 규모의 인력 감축 계획을 철회할 것과 정년퇴직·육아휴직 등에 따른 결원 1313명 충원을 요구 중입니다. 사측도 인력 충원의 필요성은 일부 공감하고 있지만 채용 시기와 규모에는 이견을 보이고 있습니다. 노조는 합의 직후 채용을 요구하는 반면 사측은 내년 초 조직진단을 거쳐 규모를 결정하겠다는 입장입니다. 임금 인상을 두고도 사측은 정부 지침에 따른 3.5% 인상 요구를 수용하겠다는 입장입니다. 그러나 노조는 약 150억 원의 재원 마련 방안이 없어 실질적인 수용으로 보기 어렵다고 맞서고 있습니다. 서울교통공사는 지난해에도 노사가 총파업 직전 밤샘 협상 끝에 극적으로 합의했습니다. 이번에도 교섭이 늦은 밤까지 이어질 가능성은 있습니다. 만일 이번 교섭이 결렬되면 3개 노조는 25일부터 무기한 총파업에 돌입한다는 방침인데 3년만의 총파업입니다. 파업 시 필수유지인원을 중심으로 열차가 운행돼 운행률은 낮아질 것으로 예상합니다. 2022년 총파업 당시 코레일 운영 구간을 포함한 전체 지하철의 낮 시간 운행률은 약 82%에 그쳤습니다. 이번에도 파업이 현실화하면 시민 불편이 불가피할 전망입니다. 노조는 이미 20일부터는 안전운행 투쟁에도 돌입한 상태입니다. 공사는 파업에 대비해 비상대책본부를 가동하고 관제센터를 중심으로 열차 정시 운행을 독려하고 운행 간격을 실시간으로 조정할 계획입니다.","category":"생활·문화"},{"title":"서울지하철 준법투쟁 나흘째… 24일 최종교섭","link":"https://n.news.naver.com/mnews/article/022/0004177534","naverLink":"https://n.news.naver.com/mnews/article/022/0004177534","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"열차 지연 등 출퇴근길 혼란 없어 임단협 결렬 땐 내일부터 총파업 서울교통공사 노동조합의 준법투쟁(태업)이 나흘째 이어진 23일 서울 지하철 출근길은 평소와 다르지 않았다. 공사에 따르면 이날 오전 9시쯤까지 준법투쟁에 따른 열차 지연이나 고장, 사고 등 특이상황은 발생하지 않았다. 공사 관계자는 “평소 월요일 출근길과 비슷한 상황”이라며 “아직 열차 지연이나 사고, 고장 등이 보고된 것이 없다”고 말했다. 지난 20일 서울 1호선 용산역에서 전철이 이동하고 있다. 뉴스1 이날 오전 8시쯤 지하철 2호선 왕십리역을 기준으로 열차 배차간격은 3∼5분 수준으로 평소와 비슷한 수준이었다. 을지로입구역 승강장에서 경광봉을 들고 승객들의 이동을 안내하던 역 직원은 “평상시와 다를 바 없다”며 “특별히 더 붐비거나 위험한 상황이 발생하는 것은 아니다”라고 설명했다. 공사 노조는 인력 감축 계획 철회와 안전 인력 충원 등을 요구하며 지난 20일부터 준법투쟁을 벌이고 있다. 조합원들이 안전 수칙과 운행 규정을 엄격하게 준수하는 방식으로 업무를 수행하면서 일부 열차의 운행이 지연될 가능성이 있다. 노사는 서울지하철 노조가 예고한 총파업을 하루 앞둔 24일 오전 10시부터 공사 본사에서 1노조(교통노조)·2노조(올바른노조)·3노조(통합노조)와 차례로 임금·단체협약 최종교섭에 나선다. 노조는 공사 인력 2212명 감축 계획 철회와 정부 지침에 따른 3.5% 임금 인상, 안전 업무 2인 1조 의무화를 위한 인력 충원 등을 요구하고 있다. 교섭이 결렬되면 3개 노조가 25일부터 무기한 총파업에 돌입할 방침이어서 출퇴근길 열차 운행 축소와 혼잡 등 시민 불편이 우려된다. 공사 관계자는 “공사는 전 열차의 정시 운행을 독려하고, 출퇴근 시간대 배차 간격을 조절하는 등 준법투쟁에도 시민 불편이 없도록 대응하고 있다”며 “파업으로 인한 불편이 야기되지 않도록 노조와 최종교섭에 성실히 임하겠다”고 말했다.","category":"생활·문화"},{"title":"테마파크·야영장까지 공제 확대…관광공제회, 여행자 공제 도입도 검토","link":"https://n.news.naver.com/mnews/article/277/0005846675","naverLink":"https://n.news.naver.com/mnews/article/277/0005846675","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"관광공제회, 중장기 사업 확대 방향 논의 2027년 사업계획·예산안 등 원안 의결 공제사업 성장동력 확보·위험관리 강화 한국관광협회중앙회 관광공제회가 테마파크와 야영장 등으로 공제 대상 업종을 확대하고, 여행자를 위한 공제상품을 도입하는 방안을 검토한다. 공제사업의 성장동력을 확보하고 관광산업의 위험관리 기능을 강화하기 위해서다. 한국관광협회중앙회 관광공제회가 지난 19일 한국관광협회중앙회 대회의실에서 제7차 운영위원회를 열고 2027년도 사업계획과 공제규정 개정안 등을 심의하고 있다. 한국관광협회중앙회 한국관광협회중앙회 관광공제회는 지난 19일 중앙회 4층 대회의실에서 제7차 운영위원회를 열고 이 같은 중장기 사업 방향을 논의했다고 23일 밝혔다. 이날 회의에서는 2027년도 사업계획 및 예산안, 이행보증 사고보상 결정안, 공제규정 개정안 등이 상정돼 원안대로 의결됐다. 이와 함께 공제사업의 성장동력 확보와 위험관리 강화를 위한 중장기 사업 방향도 공유됐다. 공제 대상 업종을 테마파크업과 야영장업 등으로 확대하고, 여행자를 대상으로 하는 공제상품을 새롭게 도입하는 방안이 포함됐다. 관광공제회는 공제사업 운영 과정에서 관광업계의 의견을 폭넓게 수렴하기 위해 간담회와 워크숍도 확대하기로 했다. 이경수 한국관광협회중앙회 회장은 \"관광사업 현장의 목소리를 바탕으로 공제상품과 제도를 내실화해 공제회가 관광사업자들에게 실질적인 버팀목이 될 수 있도록 노력하겠다\"고 말했다.","category":"생활·문화"},{"title":"[유경숙의 축제 막전막후] [9] 개성 만점 생활밀착형 축제들","link":"https://n.news.naver.com/mnews/article/023/0004011248","naverLink":"https://n.news.naver.com/mnews/article/023/0004011248","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"지난 6~8일 경북 구미에서 열린 구미라면축제. 농심 구미공장이 있는 도시가 라면을 지역관광 콘텐츠로 키우고 있다. /구미라면축제 한국 축제가 젊어지고 있다. 버터 냄새로 발길을 붙잡는 빵 축제부터 삼겹살 라면, 반띵 라면 등 이색 라면을 선보이는 구미라면축제 , 뻥튀기 그릇에 수북이 담아주는 재치 만점 김천김밥축제까지. 요즘 축제는 그야말로 ‘힙하거나 사라지거나’ 둘 중 하나다. 이름만 들어도 흥미롭고 심리적 접근성이 좋아 젊은 층 반응이 뜨겁다. 이런 변화가 반가운 것은 오랜 정체기에 빠진 국내 축제판에 새로운 가능성을 제시하는 긍정적 조짐 때문이다. 1996년 시작된 ‘문화관광축제’ 지정 제도가 30년이 된 지금도 “어디를 가나 비슷하다”는 냉소적 비판은 사라지지 않았고, 문학·영화·웹툰·K팝 등과 비교하면 국내 축제의 글로벌 경쟁력은 여전히 아쉽다. 규모는 커졌지만 관객에게 새로운 재미를 주지 못한 채 타성에 안주한 탓이다. 그런 답답한 틈을 비집고 등장한 것이 젊고 힙한 생활 밀착형 소재들이다. 방문객 35만명을 모은 구미라면축제는 K라면 문화를 정교하게 큐레이션해, 2030세대는 물론 외국인 관광객까지 매료시켰다. 뻔한 개막식과 특산물 판매 중심의 구성, 전통 재현이라는 틀에서 벗어나 현대 한국인의 라이프스타일을 핵심 콘텐츠로 끌어들이고, 젊은 층을 메인 관객이자 주체로 겨냥한 전략이 주효했다. 특히 주목할 점은 라면·김밥·떡볶이·커피·짬뽕·치즈·팝업 등 최근 주목받는 축제 소재들이 따지고 보면 별로 새로운 게 아니라는 점이다. 흔하고 익숙해 가볍게 흘려보냈던 것들이다. 묵직한 전통문화만 고집하지 않고 일상의 콘텐츠를 과감하게 축제의 주인공으로 선택한 지자체의 달라진 시각 역시 칭찬할 만하다. 물론 미식 축제에만 편중되는 현상은 경계해야 한다. 강원도 전역에 낚시 축제가 우후죽순 생겼다가 기후 온난화로 동시에 위기를 맞은 것처럼, 요즘 유행하는 빵 축제와 드론쇼 등 특정 소재에 대한 쏠림은 또 다른 획일화를 낳을 수 있다. 한국 축제의 새바람이 단발성으로 끝나지 않으려면, 개성 만점인 새싹 축제들이 잘 성장할 수 있도록 지원하고 차별화하는 정책적 관심이 필요하다. K팝이 세계를 흔들었듯, 한국 축제도 글로벌로 나아가야 한다.","category":"생활·문화"},{"title":"TBS FM, 내달 2년여 만에 정규방송 재개","link":"https://n.news.naver.com/mnews/article/022/0004177511","naverLink":"https://n.news.naver.com/mnews/article/022/0004177511","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"오미희·강석우·배미향 등 진행 정상화 때까지 재능기부 참여 서울특별시 미디어재단 TBS가 2년여간 이어온 비상방송 체제를 종료하고 다음 달 1일부터 정규방송을 재개한다. TBS는 다음 달 1일부터 TBS FM(95.1㎒) 정규방송을 재개한다고 23일 밝혔다. TBS는 2024년 9월 30일부터 이달까지 비상방송 체제를 이어왔다. 개편된 정규방송엔 오미희, 강석우, 배미향 등 베테랑 라디오 진행자들이 함께한다. 다만 TBS 방송이 정상화될 때까진 출연료 없이 재능기부로 프로그램을 진행하기로 했다. TBS는 서울시 출연기관에서 해제된 이후 2년 6개월째 임금체불이 이어져 방송 제작비도 부족한 상태다. 이에 방송 정상화를 위해 방송인들이 재능기부에 뜻을 모았다. 신규 편성 프로그램은 ‘유정현의 아침을 여는 클래식’(오전 8시), ‘한낮의 설렘 양수경입니다’(낮 12시), ‘오미희의 행복 느낌’(오후 4시) ‘음악의 정원에서 강석우입니다’(오후 6시), ‘배미향의 추억의 팝스’(오후 8시), ‘김형준의 골든팝스’(자정) 등이다. 기존에 방송되던 ‘함춘호의 포크송’(오전 10시)과 ‘최일구의 허리케인 라디오’(오후 2시)는 편성을 유지한다. 이와 함께 이가희(오전 4시), 송정애(오전 6시), 이민준(오후 1시), 김상아(오후 10시) 등 TBS 아나운서들도 프로그램 진행에 투입된다. 주말 오후 1시에는 서울시 출입기자단이 참여하는 ‘서울, 언박싱’(토요일)과 시사 대담 ‘TBS 초대석’(일요일)이 각각 편성됐다. 한용길 TBS 대표이사는 “비상방송 체제를 넘어 방송 본연의 기능을 담당해야 할 때”라며 “이번 정규방송 재개를 계기로 시민 곁에 다시 다가가겠다”고 말했다.","category":"생활·문화"},{"title":"출근길 영하권 추위…‘빙판길’ 조심","link":"https://n.news.naver.com/mnews/article/028/0002833635","naverLink":"https://n.news.naver.com/mnews/article/028/0002833635","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"\"마운자로 평생 맞겠다\"…서울대 교수가 직접 써보니 [건강!톡]","link":"https://n.news.naver.com/mnews/article/015/0005357317","naverLink":"https://n.news.naver.com/mnews/article/015/0005357317","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"장형우 분당서울대병원 교수 직접 비만치료 경험 공개해 사진=유튜브 비만 수술을 받고도 4년 만에 체중이 10㎏ 넘게 다시 늘었던 대학병원 교수가 위고비와 마운자로를 직접 사용한 뒤 장기간 투약을 이어가겠다는 뜻을 밝혔다. 약을 끊으면 다시 살이 찌는 것은 예상할 수 있는 결과인 만큼 비만치료제를 단기간 처방으로 봐선 안 된다는 설명이다. 장형우 분당서울대학교병원 심장혈관흉부외과 교수는 지난 21일 유튜브 채널 ‘김재원TV’에서 자신의 비만 치료 과정을 공개했다. 위소매절제술 뒤 체중이 다시 증가한 장 교수는 위고비로 감량한 뒤 현재는 마운자로를 주 1회 투여하고 있다. 그는 “사람들에 따라 평생 맞겠다고 다짐하는 이들이 꽤 있는데 나 역시 그렇게 다짐한 사람 중 하나”라고 말했다. 약을 바꾼 이유는 부작용 차이였다. 장 교수는 “위고비는 오전 시간대에 구역질이 살짝 나서 가끔 헛구역질을 했다”며 “최대 용량인 2.4㎎을 맞아도 부작용이 전부 없어지지 않아 마운자로로 갈아탔다”고 밝혔다. 이어 “마운자로는 구역질이 거의 없지만 변비가 약간 있다. 다만 불편할 정도는 보통의 수준이다”라고 했다. 특히 중단 이후의 체중 증가 가능성을 강조했다. 장 교수는 “비만 치료제는 맞다가 끊으면 80~90% 이상 환자에서 요요 현상이 오게 된다”며 “약의 원리상 너무 당연하고 놀라운 일이 전혀 아니다. 끊는 것에 대해 쉽게 생각하지 말고 장기적으로 맞아야 한다고 생각해야 한다”고 말했다. 당뇨병 환자에게는 기존 치료약과 함께 사용할 경우 혈당이 지나치게 낮아질 수 있다며 “반드시 담당 의사와 상의해 약물 용량을 조절해야 한다”고 당부했다.","category":"생활·문화"},{"title":"[날씨] 화요일, 전국 대부분 영하권 추위에 ‘칼바람’…충남·전라·제주에 ‘비 또는 눈’","link":"https://n.news.naver.com/mnews/article/029/0003060735","naverLink":"https://n.news.naver.com/mnews/article/029/0003060735","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"한울본부 '에너지 아뜰리에', 주민 참여 문화체험 성료","link":"https://n.news.naver.com/mnews/article/022/0004177531","naverLink":"https://n.news.naver.com/mnews/article/022/0004177531","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"울진주민 60명 대상 원데이 클래스 진행 원목 샌딩부터 부품 조립까지 직접 제작 별도 전원 없이 소리 증폭, 스마트폰 거치대로도 활용 한국수력원자력 한울원자력본부는 울진군 주민들을 대상으로 목재를 활용한 다양한 문화체험 프로그램을 진행했다. 한울원자력본부는 지난 18~19일 양일간 울진군 주민 60명을 대상으로 '우드 스피커 만들기' 원데이 클래스를 운영했다고 23일 밝혔다. 이번 프로그램은 한울본부의 문화체험 프로그램인 '에너지 아뜰리에'의 하나로 마련했다. 참가자들은 원목을 샌딩하고 부품을 조립하는 과정을 거쳐 우드 스피커를 직접 제작했다. 한울본부가 지역주민을 대상으로 원데이클래스 '에너지아뜰리에'를 운영하고 있다. 한울본부 제공","category":"생활·문화"}],"세계":[{"title":"“카모 상장 약속 지켜라”… TPG, 카카오 상대 1.5조 국제중재","link":"https://n.news.naver.com/mnews/article/366/0001206732","naverLink":"https://n.news.naver.com/mnews/article/366/0001206732","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"TPG, ICC에 카카오·카모 상대 중재 신청 청구 가치 1.5조…카카오 자기자본 9.85% 쟁점은 주주간계약상 상장 협조 의무 서울 중구 서울역 택시 승강장에 정차한 카카오 택시./뉴스1 카카오모빌리티 2대 주주인 글로벌 사모펀드(PEF) 운용사 텍사스퍼시픽그룹(TPG)이 최대주주 카카오를 국제중재 무대로 끌고 갔다. 카카오가 카카오모빌리티의 미국 주식예탁증서(ADR) 상장을 가로막았다며 1조5000억원대 중재를 걸었다. 카카오는 23일 TPG가 카카오와 카카오모빌리티를 상대로 국제상업회의소(ICC) 국제중재법원에 중재를 신청했다고 공시했다. 신청인은 TPG 측 법인인 카키홀딩스(Khaki Holdings, LP)와 모빌리티코인베스트(Mobility Co-Invest, LP)다. 중재지는 홍콩이다. TPG는 지난달 29일 중재를 신청했다. 카카오는 이달 10일 ICC 사무국에서 신청서를 받은 것으로 전해졌다. 청구 내용은 주주간계약(SHA)과 관련 합의서에 따른 의무 이행, 위약벌, 손해배상 등이다. TPG는 지난 20일 중재비용 예납액 산정을 위해 전체 청구의 금전적 가치를 1조5000억원(약 11억달러) 이상으로 추산해 ICC에 통지했다. 비금전적 청구까지 포함한 금액으로, 지난해 말 카카오 자기자본(15조2249억원)의 9.85%에 해당한다. 1조5000억원은 TPG가 일방적으로 산정한 추산치로, TPG가 수정·보완 가능성을 유보해 최종 청구금액은 확정되지 않았다. 카카오는 청구와 금액의 타당성을 모두 부인하고 중재 절차에서 적극 대응할 예정인 것으로 알려졌다. 분쟁은 카카오 이사회가 ADR 상장에 반대하면서 시작됐다. TPG는 자신이 보유한 카카오모빌리티 구주를 기초로 ADR을 발행해 미국 증시에서 투자금을 회수하는 방안을 추진해왔다. 카카오모빌리티는 지난 7월 미국 증권거래위원회(SEC)에 등록신청서(Form F-1)를 비공개로 냈다. 카카오 이사회는 지난 9월 이 구조에 반대했다. 매각대금은 TPG에 돌아가지만 모회사와 자회사로 투자 수요가 나뉘고 카카오의 순자산가치(NAV) 할인이 커질 수 있다고 봤다. 자회사가 미국에 상장하면 카카오도 미국 증권법상 책임을 질 수 있다는 점도 반대 사유로 들었다. TPG로선 카카오모빌리티 투자금 회수 추진을 목표로 중재 카드까지 꺼낸 것으로 풀이된다. TPG 컨소시엄은 2017년 카카오모빌리티에 처음 투자했고 2021년 추가 투자해 지분 약 29%를 확보했다.","category":"세계"},{"title":"티파니 영, 마른파이브 새 얼굴로 발탁···‘Plus Yourself’ 캠페인으로 긍정 에너지 전파!","link":"https://n.news.naver.com/mnews/article/144/0001151351","naverLink":"https://n.news.naver.com/mnews/article/144/0001151351","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"티파니 영, 마른파이브 새 얼굴로 발탁···‘Plus Yourself’ 캠페인으로 긍정 에너지 전파!. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"기후행동 ‘이행’은커녕 ‘약속’ 재확인도 실패…한계 드러난 ‘COP 체제’","link":"https://n.news.naver.com/mnews/article/032/0003484551","naverLink":"https://n.news.naver.com/mnews/article/032/0003484551","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"기후행동 ‘이행’은커녕 ‘약속’ 재확인도 실패…한계 드러난 ‘COP 체제’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"몽골 외교부 장관 손 잡은 한성숙 총리","link":"https://n.news.naver.com/mnews/article/421/0009305840","naverLink":"https://n.news.naver.com/mnews/article/421/0009305840","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"(서울=뉴스1) 이종덕 기자 = 한성숙 국무총리가 23일 서울 종로구 정부서울청사에서 방한중인 바트뭉흐 바트체첵 몽골 외교장관을 접견하고 있다.(총리실 제공, 재판매 및 DB 금지) 2026.11.23/뉴스1","category":"세계"},{"title":"한성숙 총리, 몽골 외교부 장관 접견","link":"https://n.news.naver.com/mnews/article/421/0009305839","naverLink":"https://n.news.naver.com/mnews/article/421/0009305839","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"한성숙 총리, 몽골 외교부 장관 접견. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"젠슨 황 돌아왔다\"…엔비디아 주가 장 초반 30% 폭등(상보)","link":"https://n.news.naver.com/mnews/article/421/0009305908","naverLink":"https://n.news.naver.com/mnews/article/421/0009305908","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"167달러에 거래 시작…주요 지수도 동반 급등 출발 엔비디아 로고. 2026.6.11 ⓒ 로이터=뉴스1 (서울=뉴스1) 윤다정 기자 = 엔비디아 주가가 젠슨 황 최고경영자(CEO) 복귀 소식에 장 초반 약 30% 급등했다. 23일(현지시간) 미 동부시간 오전 9시 45분 기준 엔비디아 주가는 전 거래일 종가(125.53달러)보다 36.78달러(29.30%) 오른 162.31달러에 거래됐다. 거래량은 약 5188만 주를 기록했다. 엔비디아는 이날 167.06달러에 거래를 시작해 개장 직후 167.21달러까지 올랐다. 개장 첫 1분 동안에만 약 2262만 주가 거래됐다. 이후 상승 폭을 일부 반납하며 158달러 선까지 밀렸다가 다시 162달러대로 올라서는 등 30% 안팎의 상승폭을 이어가고 있다. 앞서 개장 전 거래에서 엔비디아 주가는 오전 9시26분 기준 32.58% 오른 166.43달러를 기록했다. 개장 전 거래량은 약 8962만 주에 달했다. 개장 전 거래 초반 135달러 안팎에서 움직이던 주가는 오전 9시를 앞두고 가파르게 치솟았다. 로이터에 따르면 엔비디아의 젠슨 황 복귀 발표 직후 인공지능(AI) 관련주에 대한 투자심리가 되살아나면서 뉴욕 증시 주요 지수도 일제히 큰 폭으로 상승 출발했다. 다우존스 산업평균지수는 개장 시점 전장 대비 1092.6포인트(2.27%) 오른 4만 9239.91을 기록했다. 스탠더드앤드푸어스(S&P) 500 지수는 전장 대비 317.0포인트(4.59%) 오른 7227.41로, 기술주 중심 나스닥 종합지수는 1652.0포인트(7.30%) 급등한 2만 4269.746으로 거래를 시작했다. 이후 나스닥 종합지수는 6% 안팎의 급등세를 이어가고 있다.","category":"세계"},{"title":"젠슨 황 복귀에 엔비디아 주가 폭등…나스닥 6%, S&P500 4% 끌어올려 [이상은의 워싱턴나우]","link":"https://n.news.naver.com/mnews/article/015/0005357328","naverLink":"https://n.news.naver.com/mnews/article/015/0005357328","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 복귀에 엔비디아 주가 폭등…나스닥 6%, S&P500 4% 끌어올려 [이상은의 워싱턴나우]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"RSM Classic Golf","link":"https://n.news.naver.com/mnews/article/077/0007247352","naverLink":"https://n.news.naver.com/mnews/article/077/0007247352","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"RSM Classic Golf. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"RUSSIA ART","link":"https://n.news.naver.com/mnews/article/091/0010376373","naverLink":"https://n.news.naver.com/mnews/article/091/0010376373","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"RUSSIA ART. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"젠슨 황 엔비디아 복귀 소식…뉴욕증시 급등 출발","link":"https://n.news.naver.com/mnews/article/366/0001206794","naverLink":"https://n.news.naver.com/mnews/article/366/0001206794","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 엔비디아 복귀 소식…뉴욕증시 급등 출발. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"변리사도 AI 커닝?···60점 이상 고득점자 1년 새 14배","link":"https://n.news.naver.com/mnews/article/033/0000053600","naverLink":"https://n.news.naver.com/mnews/article/033/0000053600","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"2027학년도 대학수학능력시험(수능)이 치러진 19일 서울 영등포구 여의도여자고등학교에서 한 수험생의 책상 위에 안경과 전자기기가 놓여 있다. 사진공동취재단 세무사 시험과 법학적성시험(LEET·리트)에 이어 변리사 시험에서도 인공지능(AI) 부정행위 의혹이 제기됐다. 올해 변리사 2차 시험 고득점자가 지난해의 14배로 늘어났다고 국회 기후에너지환경노동위원회 소속 이헌승 국민의힘 의원이 23일 밝혔다. 이 의원이 한국산업인력공단으로부터 제출받은 자료에 따르면 올해 변리사 2차 시험 응시자 1130명 중 평균 60점 이상 고득점을 받은 사람은 인원은 42명(3.7%)으로, 지난해 3명(0.3%)의 14배나 됐다. 최근 5년간 응시자 수는 1100명 안팎으로 큰 차이가 없었으나 올해 고득점자 수는 5년 새 가장 많았다. 종전 최다였던 2024년(16명)과 비교해도 약 2.6배에 달한다. 합격자 평균 점수는 지난해 55.35점에서 올해 58.65점으로 3.3점 올랐다. 합격 최저점도 53점에서 56.44점으로 상승했다. 1·2차 시험을 같은 해에 통과한 ‘생동차’ 합격자는 2024년 5명에서 지난해와 올해 각각 11명으로 늘었다. 다만 과목별 난이도에 따라 고득점자 수가 해마다 크게 달라지는 만큼 이 같은 수치만으로 부정행위를 의심하기는 어렵다는 지적도 나온다. 대한변리사회가 지난 20일 공개한 최근 5년간 변리사 시험 채점 통계를 보면 과목별 고득점자 수는 해마다 큰 편차를 보였다. 민사소송법에서 60점 이상을 받은 응시자는 2022년 592명, 2023년 116명, 2024년 286명, 지난해 24명, 올해 558명이었다. 반면 상표법은 지난해 99명에서 올해 2명으로 급감했다. 다만 민사소송법 고득점자가 592명에 달했던 2022년에도 전체 평균 60점 이상 득점자는 한 자릿수에 그쳤다. 앞서 AI를 활용한 부정행위가 적발된 세무사 시험에서도 고득점자가 크게 늘어난 것으로 나타났다. 올해 세무사 1차 시험 회계학개론에서 90점 이상을 받은 응시자는 66명으로 2024년 1명, 지난해 2명에 비해 급증했다. 전체 응시자 수는 지난해 1만8708명에서 올해 1만6856명으로 오히려 줄었다. 2차 시험 합격 최고점도 지난해 70.62점에서 올해 82.87점으로 12.25점 상승했다.","category":"IT 과학"},{"title":"Russia Ukraine War","link":"https://n.news.naver.com/mnews/article/077/0007247354","naverLink":"https://n.news.naver.com/mnews/article/077/0007247354","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"Russia Ukraine War Police officers stand outside a restaurant damaged in a Russian strike in Kyiv, Ukraine, Monday, Nov. 23, 2026. (AP Photo/Evgeniy Maloletka)","category":"IT 과학"},{"title":"젠슨 황 돌아와도…‘대중국 AI칩 수출통제’ 준수 여부 조사는 계속","link":"https://n.news.naver.com/mnews/article/028/0002833618","naverLink":"https://n.news.naver.com/mnews/article/028/0002833618","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"트럼프, 엔비디아에 “내부 조사 계속하라”…미 하원 조사도 이어져 엔비디아 최고경영자(CEO) 젠슨 황이 지난해 11월19일 미국 워싱턴에서 열린 미국·사우디아라비아 투자포럼에 참석하고 있다. 워싱턴/로이터 연합뉴스 젠슨 황이 엔비디아 최고경영자(CEO)로 복귀했지만, 엔비디아의 첨단 인공지능(AI) 칩이 미국의 수출통제를 피해 중국으로 흘러갔다는 의혹에 대한 미 당국의 조사는 계속된다. 엔비디아는 23일(현지시각) 진행 중인 정부 조사에 계속 협조하겠다고 밝혔다. 도널드 트럼프 미국 대통령도 황의 복귀를 환영하면서 엔비디아에 수출통제 준수 여부를 살피는 내부 조사를 철저히 이어가라고 주문했다. 엔비디아 이사회는 이날 복귀 발표 성명에서 독립이사들로 구성된 국가안보·수출통제위원회를 최근 신설했다고 밝혔다. 위원회는 회사의 무역 규정 준수 여부와 국가안보 위험을 감독한다. 엔비디아는 회사 전체의 준법 업무를 총괄할 최고준법책임자도 새로 채용하기로 했다. 외국 정보기관이 황을 표적으로 삼았다는 보도를 살피기 위해 별도로 꾸린 독립이사 위원회도 조사를 끝까지 진행할 방침이다. 황은 이 조사에 협조하겠다는 뜻을 밝혔다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에 올린 글에서 황의 복귀가 국가안보에 위험을 초래한다고 볼 이유가 없다고 밝혔다. 미국 정부가 황 개인의 위법 행위를 뒷받침할 증거를 갖고 있지 않다는 점을 법무장관이 확인했다고도 했다. 그러면서 엔비디아가 미국의 수출통제 규정을 준수했는지 철저히 조사해 회사가 법적 의무를 다하고 있는지 확인해야 한다고 강조했다. 미 하원 조사도 이어진다. 황은 다음달 1일 하원 외교위원회·정보위원회·중국공산당 특별위원회의 비공개 면담에 출석한다. 팀 테터 엔비디아 법률고문은 다음날 출석한다. 세 위원장은 중국이 미국의 최첨단 칩에 접근하는 과정에서 황과 엔비디아가 어떤 역할을 했는지 확인하겠다고 밝혔다. 워싱턴/김원철 특파원","category":"IT 과학"},{"title":"젠슨 황 복귀에 엔비디아 30% 폭등…AI·반도체주 동반 급등","link":"https://n.news.naver.com/mnews/article/015/0005357327","naverLink":"https://n.news.naver.com/mnews/article/015/0005357327","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"23일(현지시간) 미국 뉴욕증시에서 엔비디아 주가는 정규장 개장 직후 30% 넘게 급등했다. 장 초반 상승률은 한때 35%에 달했다. 주가가 164달러를 넘어서면서 엔비디아 시가총액은 전 거래일 대비 약 9400억달러 불어났다. 황의 사임 이후 급락했던 주가가 경영 복귀 발표를 계기로 반등한 것이다. 반도체와 AI 인프라 관련주도 일제히 상승했다. 장 초반 네비우스는 35%, 코어위브는 29% 급등했다. 엔비디아와 밀접한 사업 관계를 맺고 있는 Arm은 20%, 마벨테크놀로지는 19% 올랐다. 마이크론(16%), AMD(12%), 인텔(15%) 등 주요 반도체 기업들도 두 자릿수 상승률을 기록했다. 미국 증시 전체도 급등했다. 기술주 중심의 나스닥종합지수는 개장 직후 약 7% 치솟았고 S&P500지수도 장 초반 4.5% 상승했다. 다우존스30산업평균지수 역시 1100포인트 넘게 올랐다. 실리콘밸리=김인엽 특파원 inside@hankyung.com","category":"IT 과학"},{"title":"젠슨 황, 엔비디아 CEO 전격 복귀에… 美증시 반도체주 폭등","link":"https://n.news.naver.com/mnews/article/029/0003060737","naverLink":"https://n.news.naver.com/mnews/article/029/0003060737","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"이사회 만장일치로 복귀 결정… “국가안보 위협 없어” 실리콘밸리 여론에 백악관 지지까지… 11일 만의 극적 반전 엔비디아 프리마켓 30% 육박 폭등… 162달러 선 단숨에 회복 반도체·기술주 전반 랠리 확산… 위험자산 투자심리 급반전 젠슨 황 엔비디아 CEO. 로이터=연합뉴스 사생활 논란과 국가안보 의혹으로 물러났던 젠슨 황 엔비디아 창업자가 사임 11일 만에 최고경영자(CEO)로 전격 복귀했다. AI(인공지능) 패권 경쟁의 핵심 인물이 돌아왔다는 소식에 엔비디아 주가가 30% 가까이 폭등하며 패닉에 빠졌던 미국 기술주와 반도체 시장을 강하게 끌어올리고 있다. 엔비디아 이사회는 23일(현지시간) 공식 성명을 통해 젠슨 황을 사장, CEO 및 이사회 구성원으로 즉시 재임명했다고 발표했다. 하비 C. 존스 이사회 의장은 “황 CEO와 일련의 논의를 거친 끝에 만장일치로 복귀를 결정했다”며 “이사회는 결정 과정에서 미국 정부 고위급 인사들의 의견을 전달받았으며, 황 CEO의 복귀가 국가안보에 어떤 위협도 초래하지 않는다고 확신한다”고 밝혔다. 앞서 황 CEO는 중국 정보기관 연루 의혹을 받는 인물 및 사내 임원과의 부적절한 관계가 드러나면서 지난 12일 전격 사임했다. 이사회는 지난 19일 실적 발표 콘퍼런스콜 당시만 해도 복귀 불가 입장을 고수했으나, 실리콘밸리 업계와 16만5000여명의 복직 촉구 서명, 나아가 도널드 트럼프 대통령과 스콧 베센트 재무장관까지 공개적으로 복귀를 지지하면서 입장을 선회했다. 다만 엔비디아는 독립 이사들로 구성된 위원회를 통해 외국 정보기관 표적 의혹에 대한 독립 조사를 끝까지 진행할 방침이며, 국가안보·수출통제위원회 신설 및 최고준법책임자(CCO) 채용 등 지배구조와 컴플라이언스 감독을 대폭 강화하기로 했다. 임시 CEO를 맡았던 콜레트 크레스는 기존 최고재무책임자(CFO)직으로 복귀한다. 리더십 공백에 따른 AI 생태계 붕괴 우려가 해소되면서 뉴욕증시는 9시40분(현지시간) 현재 전날 대비 1366포인트(6%) 넘게 상승하며 2만4000선을 돌파하는 등 지난주 리더십 불확실성과 AI 투자 위축 우려로 급락했던 낙폭을 한 번에 만회하는 흐름이다. 반 황 CEO의 복귀가 글로벌 AI 인프라 투자와 차세대 칩 공급망의 정상화를 의미한다는 평가 속에 주요 반도체 종목과 관련 상장지수펀드(ETF)도 동반 급등세로 돌아섰다. 반에크 반도체 ETF(SMH)와 라운드힐 메모리 ETF 등 주요 반","category":"IT 과학"},{"title":"크라우드스트라이크, 지스케일러 59조원에 인수… 보안업계 사상 최대 M&A","link":"https://n.news.naver.com/mnews/article/366/0001206786","naverLink":"https://n.news.naver.com/mnews/article/366/0001206786","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"크라우드스트라이크, 지스케일러 59조원에 인수… 보안업계 사상 최대 M&A. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"INSS \"한국, AI 속도조절 영향력 부족\"","link":"https://n.news.naver.com/mnews/article/092/0002446556","naverLink":"https://n.news.naver.com/mnews/article/092/0002446556","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"\"국제 합의 가능성 낮아…미중 충돌에 합의 난항\" 한국이 인공지능(AI) 공급망에서는 경쟁력이 높지만, 프런티어 AI의 출시 전 평가에 접근하지 못해 속도조절 논의에서 영향력이 제한된다는 분석이 나왔다. 관련 국제 합의 가능성도 낮다는 평가가 이어졌다. 국가안보전략연구원(INSS)은 이 같은 내용의 'AI 속도조절 논의 현황과 대응 방안' 전략보고서를 23일 발간했다. 국가안보전략연구원(INSS)이 23일 발간한 'AI 속도조절 논의 현황과 대응 방안' 전략보고서 표지. (사진=INSS) 보고서는 속도조절을 프런티어 AI의 개발과 배포 속도를 위험 평가와 통제 역량에 맞춰 조정하는 정책으로 정의했다. AI 능력이 인간의 평가와 통제를 앞지르는 '감독 격차'를 줄이려는 접근이다. 논의는 7월 프런티어 AI 기업 종사자 1386명의 공개서한 '프런티어 속도조절(Pacing the Frontier)'을 계기로 부상했다. 9월12일 다리오 아모데이 앤트로픽 최고경영자(CEO)가 에세이를 내자 경쟁사 수장들도 동조했다. 보고서는 안전 기준 강화가 후발 기업에 진입장벽이 돼 선도기업의 우위를 굳히는 수단으로 읽힐 수 있다고 봤다. 보고서는 AI 속도조절 관련 국제 합의 가능성을 낮게 평가했다. 도널드 트럼프 미국 대통령은 AI 안전 우려를 '사기'라고 일축했고, 중국 또한 속도조절을 '선도국의 기술우위 고착화 시도'로 보고 거부했다고 짚었다. 9월 미중 정상회담에서도 양국은 AI 사고 대응용 소통채널 설치에만 합의했다. 중견국 21개국 정상의 9월22일 공동성명과 11월9일 '파리 선언'에는 미국과 중국이 모두 불참했다. 한국은 미국의 인프라 투자 확대에 따른 수혜와 투자 감속 충격에 동시에 노출돼 있다. 고대역폭메모리(HBM) 공급 실적 증가에 더해 미국 대형 변압기 수입시장 점유율 1위(2026년 수입액 기준)를 점하고 있다. 국내 전력기기 3사의 수주잔액은 2026년 1분기 32조원을 넘었다. 이와 달리 미국 데이터센터 개발계획 400기가와트(GW) 가운데 실제 착공은 35% 수준으로 추정된다. 중간선거 직후인 11월5일 코스피는 5.28% 하락한 5383.80으로 마감했다. 보고서는 평가 접근권이 더 취약하다고 짚었다. 한국 AI안전연구소는 국내외 42개 모델을 평가했지만 출시 전 사전평가는 한 건도 없다. 영국 AI안보연구소(AISI)조차 앤트로픽의 '미토스 5.1' 출시 전 평가에서 빠졌다. 백악관 국가사이버국","category":"IT 과학"},{"title":"[사이언스게시판] 우주항공청, '한국형 위성항법시스템' 통합 상세설계검토회의 개최 外","link":"https://n.news.naver.com/mnews/article/584/0000040286","naverLink":"https://n.news.naver.com/mnews/article/584/0000040286","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"KPS 위성 1호기 제원 및 형상. 우주항공청 제공 ■ 우주항공청·국토교통부·해양수산부·해양경찰청 등은 11월 24일부터 27일까지 한국항공우주연구원에서 한국형 위성항법시스템(KPS) 통합 상세설계검토회의(CDR)을 개최한다고 23일 밝혔다. 회의에서는 KPS를 구성하는 위성·지상·사용자시스템의 설계 결과를 종합적으로 검토하고 각 시스템이 요구되는 기능·성능을 구현할 수 있도록 설계됐는지 확인한다. 상세설계검토가 마무리되면 KPS 위성 1호기 제작·조립과 검증용 지상시스템 구축에 필요한 절차에 착수한다. ■ 과학기술정보통신부(과기정통부)는 23일 국가과학AI연구센터(NAIS)에서 과학 AI 분야 산·학·연 전문가 간담회를 개최했다고 밝혔다. 간담회에서는 국가 과학 AI 자원 연계·결집 방안과 'AI 과학자' K-문샷 미션 추진 방향이 논의됐다. 유용균 NAIS 센터장은 NAIS의 3대 핵심 임무와 임무 추진 현황, 향후 계획을 소개했다. 임성빈 PD는 K-문샷 AI 과학자 미션 로드맵을 발표했다. AI 과학자를 활용해 과학적 발견의 속도와 규모를 혁신할 수 있도록 핵심 기술을 확보·연계하고 궁극적으로 인간 책임 하에 AI가 연구 전주기를 자율 수행하는 단계까지 고도화해 나가겠다는 계획임을 밝혔다. 이어진 자유토론에서는 AI-ready 데이터 표준 체계 마련, 대형 연구시설·자율실험실과 연계한 고품질 연구데이터 생산 방안 등이 논의됐다. ■ 과기정통부는 23일부터 27일까지 '2026 연구실 안전주간'을 진행하며 23일 서울 세종대 컨벤션센터 광개토관에서 기념식을 개최했다고 밝혔다. 연구실 안전주간은 매년 11월 열리며 연구실 안전관리 관계자들이 한자리에 모여 노고를 격려하고 연구실 안전의 중요성과 안전한 연구환경 조성을 위한 실천 의지를 다지는 자리다. 올해는 \"안심하고 연구하는 안전한 연구실, 함께 만드는 안전한 내일\"을 주제로 올해 4월 심의·의결된 「연구실 안전 강화 대책」의 현장 확산과 연구주체의 자율적인 안전관리 실천을 촉진하는 데 중점을 뒀다. 과기정통부는 대책 이행을 위해 내년도 연구실 안전 관련 예산을 전년 대비 약 3배 이상 확대해 구 현장의 안전관리 역량 강화와 사고 예방을 위한 환경 개선을 대폭 지원할 계획이다. ■ 한국과학기술정보연구원(KISTI)은 인공지능(AI) 기반의 정보서비스 구축을 위한 실무 기술백서를 발간했다고 23일 밝혔다. 이번 실무 기술백서는 25일 공식 런칭하는 AI 연구","category":"IT 과학"},{"title":"Huang’s former affair partner contacted Chinese intelligence for more than a year: Report","link":"https://n.news.naver.com/mnews/article/640/0000097238","naverLink":"https://n.news.naver.com/mnews/article/640/0000097238","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"Alice Huang’s contacts with Chinese intelligence overlapped with scrutiny of Nvidia chip shipments to China, according to a report in The New York Times. Nvidia's former CEO Jensen Huang greets a supporter while Chinese businessperson Alice Huang looks on after Jensen's keynote speech at Computex 2024 in Taipei, Taiwan, June 2, 2024. REUTERS/YONHAP Alice Huang, the woman at the center of the Nvidia scandal, was in contact with an officer of China's Ministry of State Security (MSS) for more than a year, including during part of her affair with former Nvidia CEO Jensen Huang, The New York Times (NYT) reported Sunday. Also known by her Chinese name, Huang Le, Alice Huang is not related to Jensen Huang. Her contacts with the MSS officer ran from spring last year until this fall, multiple people familiar with U.S. intelligence reports on the encounters told the newspaper. The contacts also overlapped with a period when Megaspeed, a Singapore-based company Alice Huang once led, was buying advanced Nvidia chips in bulk. She left the company in August last year, according to Megaspeed. Some of those chips went to data centers in Southeast Asia serving Chinese tech companies such as Alibaba","category":"IT 과학"},{"title":"“AI 부정행위 ‘두더지 잡기식’ 대응은 한계…교육과정 전반 재검토해야”","link":"https://n.news.naver.com/mnews/article/032/0003484552","naverLink":"https://n.news.naver.com/mnews/article/032/0003484552","pubDate":"2026-11-23T12:00:00+09:00","author":"네이버뉴스","description":"AI 시대 ‘대입 공정성 강화·교육 방식 전환’ 전문가 제언 보안·평가 방식만 바꿔선 못 풀어 스스로 판단·소통 능력 기르도록 수업 방식·평가체계 여건 갖춰야 인공지능(AI)을 활용한 부정행위 논란과 관련해 대학 입시의 공정성과 변별력 확보에만 매몰되면 AI 시대에 필요한 학교 교육의 변화를 놓칠 수 있다는 지적이 나온다. 새로운 부정행위 수법이 등장할 때마다 보안을 강화하는 ‘두더지 잡기’식 대응을 넘어 AI가 지식을 대신 생산하는 시대에 학교가 무엇을 가르쳐야 할지 새롭게 논의하고 그에 맞는 교육 여건을 갖춰야 한다는 것이다. 이재명 대통령은 지난 20일 대학수학능력시험을 포함한 국가시험 전반의 부정행위 탐지·차단과 감독체계 개선 등 종합대책 마련을 지시했다. 이에 서·논술형 확대와 과정 중심 평가 등 대입제도 개편론이 주목받지만, AI가 서술형 답안까지 만들어내는 상황에서 시험 형태만 바꿔서는 대입 평가의 신뢰성을 확보하기 어렵다는 진단이 나온다. 우선 시험 보안과 평가 방식 변화만으론 근본적인 문제를 해결하기 어렵다는 지적이 많다. 김경범 국가교육위원회 대입제도특별위원회 위원은 23일 통화에서 “AI의 발전으로 수능뿐 아니라 학생부·내신, 논술·면접 등 대입 평가 전반의 신뢰가 흔들리고 있다”며 “새 부정행위 수단이 나올 때마다 보안을 강화하는 대응은 ‘두더지 잡기 게임’이 될 수 있다”고 말했다. 김 위원은 “진짜 필요한 것은 시험의 공정성 확보뿐 아니라 AI 시대에 아이들에게 필요한 역량을 적절히 가르치고 있는지 묻는 것”이라며 “‘앞으로 학교는 아이들에게 무엇을 어떻게 가르쳐야 하나’라는 질문을 사회적 의제로 끌어올려야 한다”고 말했다. AI가 만들어낸 답에 의존하지 않고 스스로 사고하고 판단하며 다른 사람과 소통·협력할 능력을 기르도록 교육과정과 수업 방식부터 재검토해야 한다는 것이다. 이를 위해선 지식 전달에서 나아가 학생이 스스로 탐구하고 발견하는 수업으로 바뀌어야 한다는 제안도 나온다. 김용 한국교원대 교수는 “학생들이 수업에서 자기 몸으로 지식을 발견하는 경험을 해야 한다”고 강조했다. 예컨대 피타고라스 정리를 활용한 문제 풀이를 반복하기보다 그 정리를 처음 발견하는 과정을 경험하도록 가르치거나, 역사 수업에서도 특정 사건의 연도를 외우는 데 그치지 않고 변화의 원인과 배경을 탐구하도록 하자는 것이다. 김 교수는 “정부는 시험의 공정성 강화에 매달리기보다 토론의 장을 마련해 새로운 교육 방","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-22","weekday":"일요일","label":"보관 · 11월 22일 일요일","total":50,"categories":{"사건 사고":[{"title":"고속도로 달리던 중 보닛서 ‘활활’ 승용차 화재···인명피해 없어","link":"https://n.news.naver.com/mnews/article/032/0003484330","naverLink":"https://n.news.naver.com/mnews/article/032/0003484330","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"출동하는 소방차. 경남 사천시의 한 고속도로를 달리던 승용차에서 불이 났다. 22일 소방당국에 따르면 이날 오후 9시50분쯤 사천시 통영대전고속도로 대전 방향 금곡 졸음쉼터 인근을 달리던 승용차에서 불이 났다. 불은 출동한 소방당국에 의해 약 35분 만에 꺼졌다. 이 화재로 승용차가 모두 탔으나 인명피해는 발생하지 않았다. 운전자는 주행 중 차량 보닛에서 불이 나자 차를 세우고 119에 신고한 것으로 전해졌다. 경찰과 소방당국은 정확한 화재 원인을 조사하고 있다.","category":"사건 사고"},{"title":"사천 통영대전고속도로 달리던 승용차서 불…인명피해 없어","link":"https://n.news.naver.com/mnews/article/001/0016457008","naverLink":"https://n.news.naver.com/mnews/article/001/0016457008","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"차량 화재 현장 [독자 제공. 재판매 및 DB 금지] (사천=연합뉴스) 이준영 기자 = 22일 오후 9시 50분께 경남 사천시 통영대전고속도로 대전 방향 금곡 졸음쉼터 인근을 달리던 승용차에서 불이 나 약 35분 만에 꺼졌다. 이 화재로 승용차가 전소했으며 인명 피해는 발생하지 않았다. 당시 운전자는 주행 중 차량 보닛에서 불이 나자 차를 세우고 소방당국에 신고했다. 신고를 받고 출동한 소방당국은 이날 오후 10시 25분께 불을 모두 진화했다. 경찰과 소방당국은 정확한 화재 원인을 조사할 계획이다. ljy@yna.co.kr","category":"사건 사고"},{"title":"창원 아파트서 엄마 숨지고 생후 5개월 딸 생존…추락 당시 아기 보호했나","link":"https://n.news.naver.com/mnews/article/088/0001041665","naverLink":"https://n.news.naver.com/mnews/article/088/0001041665","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"40대 여성 심정지 상태로 발견돼 끝내 사망…아기는 머리에 혹 외 큰 부상 없어 경찰·소방 \"추락 과정서 아기 보호했을 가능성\"…정확한 사건 경위 조사 경찰 이미지. 매일신문DB 경남 창원의 한 아파트에서 40대 여성이 생후 5개월 된 딸과 함께 추락해 숨지는 사고가 발생했다. 다행히 아기는 큰 부상 없이 목숨을 건진 것으로 알려졌다. 22일 경찰과 소방 등에 따르면 지난 20일 오전 9시 23분쯤 창원시의 한 아파트 단지에서 40대 여성 A씨와 생후 5개월 된 딸 B양이 쓰러져 있는 것을 주민이 발견해 소방 당국에 신고했다. ◆어머니는 숨지고 아기는 생존…발견 당시 울고 있어 신고를 받고 출동한 소방 당국이 현장에 도착했을 당시 A씨는 이미 심정지 상태였다. 반면 B양은 머리 부위에 혹이 생긴 것을 제외하면 별다른 외상 없이 울고 있었던 것으로 전해졌다. 소방 당국은 두 사람을 병원으로 이송했으나 A씨는 끝내 숨졌다. B양은 생명에 지장이 없는 상태인 것으로 알려졌다. ◆추락 과정서 아기 보호했을 가능성…경찰 조사 중 경찰과 소방 당국은 A씨가 추락하는 과정에서 아기를 보호해 B양의 부상 정도가 크지 않았을 가능성을 보고 있다. 다만 두 사람이 어떤 경위로 추락했는지, 추락 당시 정확한 상황이 어떠했는지는 아직 확인되지 않았다. 경찰은 사고 발생 경위와 사망 원인 등을 조사하고 있다. ※ 우울감 등 말하기 어려운 고민이 있거나 주변에 이런 어려움을 겪는 가족·지인이 있을 경우 자살예방상담전화 ☎109 또는 청소년상담전화 ☎1388에서 24시간 전문가의 상담을 받을 수 있습니다.","category":"사건 사고"},{"title":"수능·리트 ‘AI 커닝’에 다 뚫렸나… 당사자 사망에 진상 규명 ‘산 넘어 산’","link":"https://n.news.naver.com/mnews/article/005/0001886711","naverLink":"https://n.news.naver.com/mnews/article/005/0001886711","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"경찰 압수수색 등 강제수사 어려워져 시험지 분석만으로 공범 특정 힘들어 인공지능(AI) 커닝이 사회적 문제로 떠오른 가운데 지난 16일 한국도로교통공단 대구 운전면허시험장 학과시험장에서 시험관 등 관계자가 AI 안경에 대한 전파탐지기 시연을 하고 있다. 연합뉴스 올해 법학적성시험(LEET·리트) 만점자 이진우씨가 사망하면서 생성형 인공지능(AI)을 활용한 부정행위 의혹이 더 짙어졌지만 진상 규명 작업은 ‘산 넘어 산’이 될 것으로 보인다. 이씨는 올해 리트뿐 아니라 2024학년도 대학수학능력시험과 2026학년도 수능에서도 부정행위를 저질렀다는 의혹을 받았다. 하지만 그가 숨지면서 본인의 진술 확보는 물론 사용하던 물품 등에 대한 압수수색 등 강제 수사도 어려워졌다. 서울경찰청 광역수사단 금융범죄수사대는 22일 이씨에 대한 공무집행방해와 업무방해, 사기 등 고발 사건에 대한 수사를 이어가고 있다. 이씨의 리트 시험지는 법학전문대학원협의회가 보관하지 않는 것으로 파악됐지만 수사팀은 정부가 보존 조치한 2026학년도 수능 시험지 분석 등 다양한 방법을 검토하고 있다. 다만 수능 시험지 분석만으로는 공범 존재 여부 등 부정행위 의혹을 규명하는 데 한계가 있다. 노트북, 스마트폰 등 이씨가 사용한 물품 확보가 불가피하지만 그가 숨지면서 압수수색영장 발부부터 녹록지 않을 것으로 보인다. 유족을 통한 임의제출 가능성은 남아 있으나 유족이 협조할지는 불투명하다. 서정빈 법무법인 소울 변호사는 “공범이 특정돼야 (이씨의 물품에 대한) 압수수색영장이 나올 것으로 보인다”고 말했다. 챗GPT 등 생성형 AI 운영사에 이씨의 접속·이용 기록을 협조받는 방안도 거론된다. 앞서 정부는 글로벌 빅테크 기업과 공조해 AI 부정행위가 의심되는 수능 응시자의 AI 활용 기록을 파악하겠다고 공언했다. 이씨가 2024학년도 수능에서 부정행위를 했을 경우 공범 존재 가능성이 크다는 관측이 나온다. 당시에는 챗GPT가 출시된 지 약 1년이 지났을 무렵으로 생성형 AI의 수능 문제풀이 능력이 지금보다 크게 떨어졌기 때문이다. 이씨는 올해 리트 언어이해·추리논증 70문항을 모두 맞혔다. 2026학년도 수능에서는 전체 과목 중 생명과학2에서만 1문제 틀리며 전 과목 1등급을 받았다. 이 성적을 바탕으로 올해 서울대 치의학과에 입학했다. 3년 전 치러진 2024학년도 수능에서는 국어 2등급, 수학 1등급, 영어 1등급을 받아 이듬해 고려대 정치외교학과에 합","category":"사건 사고"},{"title":"[속보]아파트서 엄마와 5개월 아기 추락…안고있던 아기만 무사","link":"https://n.news.naver.com/mnews/article/021/0002834600","naverLink":"https://n.news.naver.com/mnews/article/021/0002834600","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"경찰차. 연합뉴스 자료사진 경남 창원시의 한 아파트에서 40대 여성이 아기와 함께 떨어져 숨졌다. 이 여성이 안고 있던 아기는 목숨을 건졌다. 22일 경찰 등에 따르면 지난 20일 오전 9시 23분쯤 창원시 한 아파트 단지에서 40대 여성 A씨와 생후 5개월 된 B양이 쓰러져 있는 것을 주민이 발견해 소방 당국에 신고했다. 소방 당국이 현장에 도착했을 당시 A씨는 심정지 상태였으며, B양은 머리 부위에 혹이 생긴 것을 제외하면 큰 부상 없이 울고 있었다. 소방 당국은 두 사람을 병원으로 옮겼다. A씨는 결국 숨지고 B양은 생명에 지장이 없는 상태인 것으로 알려졌다. 경찰과 소방 당국은 A씨가 떨어지면서 아기를 보호해 B양 부상 정도가 크지 않은 것으로 보고 있다. 경찰은 정확한 사건 경위를 조사하고 있다. ※ 우울감 등 말하기 어려운 고민이 있거나 주변에 이런 어려움을 겪는 가족ㆍ지인이 있을 경우 자살 예방 상담 전화 ☎109 또는 자살 예방 SNS 상담 “마들랜” (www.129.go.kr/etc/madlan)에서 24시간 전문가의 상담을 받을 수 있습니다.","category":"사건 사고"},{"title":"서울 목동 아파트 정전…엘리베이터에 주민 갇혀 구조, 전력 재개","link":"https://n.news.naver.com/mnews/article/021/0002834599","naverLink":"https://n.news.naver.com/mnews/article/021/0002834599","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"뉴시스 서울 양천구 목동6단지 아파트 전체가 정전돼 승강기에 갇힌 주민 1명이 구조됐고, 전력 공급은 20분이 채 안 돼 재개됐다. 22일 소방당국에 따르면 이날 오후 5시56분쯤 목동6단지 아파트 전체에 정전이 발생했다는 119신고가 접수됐다. 소방당국은 차량 7대와 인력 30명을 현장에 투입했다. 이번 정전으로 아파트 15개 동 전체의 전기 공급이 중단됐다. 승강기 운행이 중단되면서 내부에 갇힌 주민 1명이 소방당국에 구조됐다. 나머지 주민들은 전력 공급이 재개된 뒤 승강기에서 빠져나온 것으로 전해졌다. 아파트 전체의 전력 공급은 신고 접수 16분 뒤인 오후 6시12분께 정상화됐다.","category":"사건 사고"},{"title":"10km 완주 직후 쓰러진 19세…서울 이어 목포서도 사망","link":"https://n.news.naver.com/mnews/article/018/0006413809","naverLink":"https://n.news.naver.com/mnews/article/018/0006413809","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"의협, 대회 안전관리계획에 응급의료 대비 방안 명시 요구 [이데일리 김민정 기자] 목포에서 열린 마라톤대회에 참가한 19세 대학생이 10km 코스를 완주한 직후 쓰러져 숨졌다. 22일 목포경찰서 등에 따르면 이날 오전 11시 30분께 ‘2026 김대중마라톤대회’가 열린 목포종합경기장에서 대학생 A(19)씨가 쓰러졌다. A씨는 대회 구급대에 의해 인근 병원으로 옮겨졌으나 숨졌다. (사진=연합뉴스) A씨는 목포종합경기장을 출발해 도심과 해안 구간을 달린 뒤 경기장으로 돌아왔다. 결승선을 통과한 직후 갑자기 경련 증세를 보인 것으로 전해졌다. 평소 특별한 지병은 없었던 것으로 알려졌다. 경찰은 정확한 사망 경위를 조사할 방침이다. 지난달에는 서울에서 하프마라톤에 나선 20대 여성이 결승선을 약 500m 앞두고 쓰러져 숨졌다. 이 여성은 지난달 11일 서울시와 동아일보가 공동 주최한 ‘2026 서울달리기(서울레이스)’에 참가해 서울 종로구 관철동 인근 20.6km 지점까지 달렸다. 쓰러진 뒤 현장에서 응급처치를 받고 119구급차로 병원에 옮겨졌으나 의식을 회복하지 못하고 이튿날 숨졌다. 서울 대회 사고 이후 대한의사협회는 달리기 대회의 응급의료 대비를 강화해야 한다고 정부에 촉구했다. 의협에 따르면 국내 마라톤 대회는 2020년 19회에서 2024년 254회로 늘었다. 의협은 지난달 15일 브리핑에서 대규모 체육행사의 안전관리를 강화하는 내용의 국민체육진흥법 개정에 맞춰, 달리기 대회 안전관리계획에 의료진 배치와 자동심장충격기(AED) 확보 방안을 담도록 하위법령에 명시해 달라고 요구했다. 의협은 운동 중 가슴 통증이나 실신을 경험한 적이 있다면 대회 참가 전 의사와 상담할 것을 권고했다. 경기 중 가슴 통증이나 심한 어지럼, 호흡곤란이 나타나면 즉시 달리기를 멈추고 도움을 요청해야 한다고 당부했다. 주변에서 쓰러진 사람을 발견하면 곧바로 119에 신고하고, 반응이 없고 정상적으로 숨을 쉬지 않으면 가슴압박을 시작하고 가까운 곳의 자동심장충격기를 활용하라고 안내했다.","category":"사건 사고"},{"title":"마라톤대회 참가한 19세 대학생 사망…10km 코스 완주 직후 쓰러져","link":"https://n.news.naver.com/mnews/article/082/0001408414","naverLink":"https://n.news.naver.com/mnews/article/082/0001408414","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"일러스트 이지민 에디터 mingmini@busan.com 전남광주 목포에서 열린 마라톤대회에서 19세 대학생이 10㎞ 코스를 완주한 직후 쓰러져 숨지는 사고가 발생했다. 22일 목포MBC 등 전남지역 언론들에 따르면 이날 오전 11시 30분께 '2026 김대중마라톤대회'에 참가한 A(19) 씨가 목포종합경기장에서 마지막 결승선을 통과한 직후 쓰러졌다. 당시 현장 의료진이 심폐소생술 등 응급처치를 한 뒤 대회장소에 대기 중이던 구급차로 병원으로 이송했지만 끝내 숨졌다. A 씨는 10㎞ 코스에 참가해 경기장을 출발한 뒤 도심과 해안 구간을 달려 돌아온 것으로 전해졌다. 경찰은 정확한 사망 경위를 조사할 방침이다.","category":"사건 사고"},{"title":"19세 대학생, '김대중마라톤대회' 완주 직후 사망…한 달 전 서울선 20대 여성 러너 숨져","link":"https://n.news.naver.com/mnews/article/088/0001041664","naverLink":"https://n.news.naver.com/mnews/article/088/0001041664","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"목포서 10km 완주 뒤 경련 증세…10월 서울레이스에선 하프마라톤 결승선 500m 앞두고 쓰러져 목포종합경기장. 자료사진. 연합뉴스 마라톤대회에 참가한 젊은 연령대의 사망 사고가 잇따르고 있다. 지난달 서울에서 열린 대회에서 20대 여성 참가자가 결승선을 불과 500m가량 앞두고 쓰러져 숨진 데 이어, 이번에는 전남광주통합특별시 목포에서 열린 마라톤대회에서 19세 남성 참가자가 완주 직후 숨졌다. 특히 두 참가자 모두 10~20대의 젊은 연령대였고, 결승선을 통과했거나 거의 도착한 시점에 사고가 발생했다는 공통점이 있다. ◆목포서 10km 완주한 19세 대학생 숨져 22일 목포경찰 등에 따르면 이날 오전 11시 30분쯤 목포종합경기장에서 열린 '2026 김대중마라톤대회'에 참가한 A씨(19)가 갑자기 쓰러졌다. A씨는 목포종합경기장을 출발해 시내 주요 도심과 해안 구간을 달린 뒤 경기장으로 돌아오는 10㎞ 코스를 완주한 것으로 알려졌다. 그러나 결승선을 통과한 직후 갑작스러운 경련 증세를 보였고, 대회 자체 구급대에 의해 인근 병원으로 옮겨졌으나 끝내 숨졌다. 대학생인 A씨는 평소 특별한 지병이 없었던 것으로 전해졌다. 경찰은 정확한 사망 원인과 사고 경위를 조사하고 있다. 이날 대회는 하프마라톤과 10km, 5km 등으로 나뉘어 진행됐다. 주최 측은 참가자와 방문객 등 1만여 명이 목포를 찾을 것으로 예상했다. ◆한 달 전 서울에선 20대 여성 러너 사망…결승선 500m 앞두고 지난 10월 11일 서울 도심에서 열린 '2026 서울달리기(서울레이스)' 마라톤대회에서도 20대 여성 참가자가 쓰러져 숨졌다. 당시 하프마라톤에 참가한 여성 B씨는 오전 8시 49분쯤 서울 종로구 관철동 인근 20.6km 지점에서 의식을 잃고 쓰러졌다. 결승선까지 약 500m를 남겨둔 상황이었다. 대회 관계자가 즉시 119에 신고하고 심폐소생술(CPR)을 실시했으며, B씨는 병원으로 이송돼 치료받았지만 다음 날인 12일 숨졌다. B씨는 한국과학기술원(KAIST) 대학원생으로, 지난 2월 열린 다른 마라톤대회에서 여자부 1위를 차지한 경력이 있는 실력자로 알려졌다. 평소 달리기 경험이 풍부했던 참가자도 대회 도중 갑작스럽게 쓰러진 것이다. 당시 서울레이스 조직위원회는 공식 홈페이지를 통해 사망 소식을 알리고 유가족에게 애도의 뜻을 전했다. 사고 원인과 관련한 후속 조치도 진행하겠다고 밝혔다. ◆젊고 건강해도 발생하는 응급상황…완주 직","category":"사건 사고"},{"title":"경찰, 권순기 경남교육감 '매수 및 이해유도 혐의' 불송치","link":"https://n.news.naver.com/mnews/article/003/0014338415","naverLink":"https://n.news.naver.com/mnews/article/003/0014338415","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"*재판매 및 DB 금지 [창원=뉴시스] 김기진 기자 = 경남경찰이 지난 6·3 지방선거때 치러진 경남교육감 선거 과정에서 자신에 대한 지지를 전제로 한 방과후 학습 단체의 요구사항을 들어주기로 했다는 의혹으로 고발된 권순기 경남도교육감에 대해 불송치를 결정했다. 22일 뉴시스 취재를 종합하면 경남 창원중부경찰서는 공직선거법상 매수 및 이해유도 혐의로 고발된 권 교육감에 대해 최근 불송치 결정을 한 것으로 알려졌다. 경찰은 이달 초 권 교육감 측근 등을 소환해 수사한 결과 권 교육감이 직접적으로 관여한 사실을 발견할 수 없었던 것으로 전해졌다. 앞서 한 방과후 학교 관련 단체는 권 교육감이 지난 6월 교육감 선거 과정에서 자신들이 권 교육감을 지지하는 것을 전제로 자신들의 요구사항을 들어주기로 했었다는 주장을 하며 관련 사실을 기초로 경찰에 고발장을 제출했었다. 해당 고발장에는 이 단체 소속의 방과후 교사들 연락처 다수를 담은 임시저장장치(USB)를 당시 권 후보 측 관계자에게 전달했다는 내용 등이 담긴 것으로 전해졌다.","category":"사건 사고"}],"사회":[{"title":"KT, 육군교육사령부와 미래 국방기술 발전 '맞손'[테크스냅]","link":"https://n.news.naver.com/mnews/article/001/0016459782","naverLink":"https://n.news.naver.com/mnews/article/001/0016459782","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"LGU+, 강남 '일상비일상의틈'서 블랙핑크 리사 다큐 상영회 샥즈, 서울대어린이병원에 이어폰·기부금 전달 (서울=연합뉴스) 박형빈 기자 = KT가 인공지능(AI)과 통신 인프라 기술력을 바탕으로 육군의 미래 작전 환경 구축과 국방 분야 디지털 전환을 지원한다. [KT 제공. 재판매 및 DB 금지] ▲ KT는 육군교육사령부와 육군의 차세대 지휘통제체계(KCCS-ARMY) 체계 연구·발전을 위한 상호협력 및 지원 업무협약을 체결했다고 24일 밝혔다. 양측의 협력 대상은 AI·클라우드·5G 등 첨단기술 공유 및 자문, 전투실험 등 연구 개발 관련 과제 공동 발굴, 미래 육군의 첨단 핵심기술 및 신무기체계 발굴 지원 등이다. 특히 KT는 국방광대역통합망(M-BcN), 국방통합데이터센터(DIDC), 국방 5G 인프라 등 국방 분야에서 축적한 통신·데이터 인프라 구축 경험을 활용해 육군의 미래 작전 환경에 적합한 AI·네트워크 기술을 제안하고 KCCS-ARMY 연구를 위한 기술 자문을 지원할 방침이다. [LG유플러스 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"비닐하우스서 공기총 쏜 60대…모르는 마을 주민 숨졌다","link":"https://n.news.naver.com/mnews/article/055/0001404954","naverLink":"https://n.news.naver.com/mnews/article/055/0001404954","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"경찰 \"총포 허가 없어\"…중과실치사 혐의 영장 신청 ▲ 공기총 사격 연습을 한 비닐하우스 강원 평창에서 공기총 사격 연습을 하다가 지나가던 주민을 맞혀 숨지게 한 60대 남성에 대해 경찰이 구속영장을 신청했습니다. 평창경찰서는 공기총을 발사해 행인을 숨지게 한 A(68)씨에 대해 중과실치사 혐의를 적용, 춘천지방공소청 영월지청에 구속영장을 신청했다고 22일 밝혔습니다. A씨는 지난 21일 오전 11시 4분쯤 평창군 방림면에서 공기총 사격 연습을 하던 중 인근을 지나던 마을 주민 B(68)씨를 맞혀 숨지게 한 혐의를 받습니다. B씨는 사고 직후 의식이 있는 상태로 병원에 옮겨져 치료받았으나 끝내 숨졌습니다. 조사 결과 A씨는 비닐하우스 안에 임시 과녁을 세워놓고 열린 출입문을 통해 공기총을 발사하다가 사고를 낸 것으로 파악됐습니다. 경기도에 거주하는 A씨는 지난 19일부터 친인척 집에 머물렀으며, 마을 주민 B씨와는 서로 모르는 사이였던 것으로 전해졌습니다. 경찰은 총포 소지 허가증이 없는 A씨가 총기를 소지하게 된 이유와 사건 경위를 조사하고 있습니다. (사진=평창소방서 제공, 연합뉴스)","category":"사회"},{"title":"최태원 “AI 네이티브 시대엔 지혜 중심 교육을”","link":"https://n.news.naver.com/mnews/article/032/0003484287","naverLink":"https://n.news.naver.com/mnews/article/032/0003484287","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"도쿄포럼서 공동 인재 육성 제안 최태원 SK그룹 회장(사진)이 대학은 ‘인공지능(AI) 네이티브 시대’에 맞는 새로운 교육 체계를 갖춰야 한다고 말했다. 최 회장은 지난 20~21일 일본 도쿄대에서 열린 ‘도쿄포럼 2026’에 참석해 “AI가 만든 가치가 폭넓게 공유되도록 변화의 방향을 이끌 인재를 키워야 한다”며 대학의 역할은 “지식을 가르치는 데서 나아가 지혜를 기르는 데 집중해야 한다”고 강조했다. 도쿄포럼은 최종현학술원과 일본 도쿄대가 주관해 2019년부터 매년 여는 행사다. 최 회장은 부친의 이름을 딴 최종현학술원 이사장이다. 최 회장은 이번 포럼에서 AI 네이티브 사회를 “사이버 공간과 물리적 공간이 융합된, 인간 중심의 사회”라고 규정했다. 다만 그는 “현재 AI 네이티브 사회에 어떻게 도달할 수 있을지 아직 누구도 정답을 갖고 있지 않다”고 했다. 최 회장은 교육을 이 해법을 찾는 출발점으로 봤다. 특히 “AI는 새로운 것이고 아무도 답을 갖고 있지 않기 때문에 집단지성을 모아 답을 찾아야 한다”며 “그 답이 틀릴 수도 있지만, 시스템을 직접 설계해본 경험은 사회에 나가 실제 도전에 맞설 때 문제를 해결하는 역량이 될 것”이라고 말했다. 그러면서 특히 지난달 선보인 SK그룹의 2년제 비학위 청년 AI 인재육성 프로그램인 ‘아이젠(AIGEN)’에 대해 최 회장은 “팀 프로젝트를 주고 스스로 답을 찾게 하는 방식”이라며 “참가자들은 다양한 분야의 과제를 풀며 문제 해결을 위한 자신만의 설계를 해보게 될 것”이라고 소개했다. 최 회장은 AI 시대 기업과 대학의 협력 방안에 관해 “한국·일본의 기업과 대학들이 AI 인재를 공동 육성하는 프로그램을 만들어 운영하는 것도 좋은 방법”이라고 했다.","category":"사회"},{"title":"아산의료원장에 박승일 임명…서울아산병원장에 이제환","link":"https://n.news.naver.com/mnews/article/032/0003484271","naverLink":"https://n.news.naver.com/mnews/article/032/0003484271","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"아산사회복지재단은 20일 아산의료원장에 박승일 서울아산병원장(왼쪽 사진)을, 서울아산병원장에 이제환 진료부원장(오른쪽)을 각각 임명했다. 임기는 내년 1월1일부터다.","category":"사회"},{"title":"한·일 여성기자 포럼서 ‘미디어 업계 성 불평등’ 해법 모색","link":"https://n.news.naver.com/mnews/article/032/0003484267","naverLink":"https://n.news.naver.com/mnews/article/032/0003484267","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"지난 21일 일본 도쿄 지요다구 일본프레스센터에서 열린 ‘제4회 한·일 여성기자 포럼’ 참석자들이 기념촬영을 하고 있다. 한국여성기자협회 제공 한국여성기자협회와 일본여성기자협회가 21일 일본 도쿄도 지요다구 일본프레스센터에서 ‘제4회 한·일 여성기자 포럼’을 열고 양국 미디어 업계의 성 불평등과 지방 소멸 문제의 해법을 모색했다. 이날 행사에는 한국 측 참가자 30여명을 포함해 한·일 언론인과 정치인, 기업인 등 200여명이 참석했다. 나카무라 시로 일본신문협회 회장 겸 아사히신문사 회장은 축사에서 일본 미디어 업계의 남성 중심적 의사결정 구조를 지적했다. 모은희 KBS 디지털뉴스국 부장은 한국의 저출생과 지방 소멸 원인으로 수도권 집중과 노동시장의 구조적 불평등을 꼽았다. 최문선 한국여성기자협회 회장은 “한·일 여성 기자들이 공유하는 문제를 함께 고민하고 해법을 모색해 양국 사회와 언론계 개선으로 이어지기를 기대한다”고 강조했다.","category":"사회"},{"title":"‘취임 100일’ 김민석 “엇박자 없이 당청 안정화…민생 위해 당내 안정 필요”","link":"https://n.news.naver.com/mnews/article/011/0004685415","naverLink":"https://n.news.naver.com/mnews/article/011/0004685415","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"“초반 실수 정리하며 나아질 것” “대법원장 탄핵, 민생 흔들림 없어” “개각 인선, 바로 합 맞출 인물들” 김민석 더불어민주당 대표가 23일 국회에서 열린 최고위원회의에서 현안에 관해 발언하고 있다. 오승현 기자 취임 100일을 맞은 김민석 더불어민주당 대표가 24일 “당청 관계는 비교적 안정이 됐는데 당내가 더 안정돼야 한다”며 당내 결속과 민생 집중 의지를 밝혔다. 김 대표는 이날 당 공식 유튜브 채널 ‘민티07’에 출연해 “지난 100일은 정치하면서 가장 만만치 않았던 기간 중 하나였다”며 이같이 말했다. 지지자들이 당사 앞에서 전달한 취임 100일 책자를 언급한 김 대표는 “당청 관계는 엇박자 없이 여러 일을 풀어갈 기초가 잡혔고 언론에 드러나지 않은 성과도 많지만 역시 소리가 나는 곳은 당”이라며 “초반에 실수한 부분도 정리되면서 나아질 것으로 기대한다”고 강조했다. 이어 “당내 안정은 결국 민생 때문에 하는 것”이라며 “각종 지표와 성과만큼 더 와닿는 체감 민생을 당이 노력해야 할 첫 번째, 두 번째, 세 번째 과제로 삼겠다”고 덧붙였다. 민생 행보에 힘을 싣는 동시에 당론으로 추진 중인 조희대 대법원장 탄핵에 대해서는 공세 수위를 유지했다. 김 대표는 “대법원장 탄핵은 내란 진압의 마지막 정리 단계인 만큼 이로 인해 민생에 대한 집중력이 흔들리지 않도록 하겠다”며 한덕수 전 국무총리 대법원 판결을 정면으로 겨냥했다. 김 대표는 이어 “이번 판결에서 첫 번째 국무회의 부분만 무죄로 하고 나머지를 명료하게 유죄로 한 것인지 구조가 불명료하다는 의문이 법률 전문가들 사이에서도 제기된다”며 “대법원 스스로 비상계엄의 성격을 명료하게 내란으로 규정하는 것을 끝까지 피하려 한 자세가 반영된 것 아닌가 한다”고 지적했다. 그러면서 “오늘(24일) 열리는 토론회 등을 통해 원심에 어떤 주문을 한 것인지 명확히 밝히라고 요구할 것”이라고 말했다. 김 대표는 전날 단행된 추가 개각 인선에 대해서도 “역량과 대통령의 국정철학 합치도가 높아 안정적으로 바로 일할 수 있는 인사”라고 호평했다. 일부 후보자의 전문성 논란을 두고는 “강금실 국정원장 후보자는 개혁성과 전체 방향 감각을 갖췄고, 한준호 행정안전부 장관 후보자는 청와대와 당 최고위원 등을 거치며 국정 고민을 많이 했다”고 설명했다. 최교진 전 교육부 장관 사퇴로 공석이 된 교육부 장관 인선 기준에 대해서는 “인공지능(AI) 시대로의 전환이라는 큰 틀에서 교육의","category":"사회"},{"title":"KT, 육군교육사령부와 AI 기반 지휘통제체계 연구 협력","link":"https://n.news.naver.com/mnews/article/016/0002727456","naverLink":"https://n.news.naver.com/mnews/article/016/0002727456","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"첨단기술 기반 연구과제 공동 발굴 추진 국방 통신·데이터 인프라 구축 경험 활용 24일 KT 광화문빌딩 웨스트에서 열린 협약식에서 김원태(왼쪽) KT Enterprise부문 공공금융사업본부장(전무)과 정광웅 육군교육사령부 전투발전부장(소장)이 업무협약 체결 후 기념사진을 촬영하고 있다.[KT 제공] [헤럴드경제=김광우 기자] KT가 육군교육사령부와 손잡고 인공지능(AI)과 5세대 이동통신(5G) 등 첨단기술을 활용한 차세대 지휘통제체계 연구에 나선다. 24일 KT는 육군교육사령부와 ‘KCCS-Army 체계 연구·발전을 위한 상호협력 및 지원 업무협약(MOU)’을 체결했다고 밝혔다. KT 광화문빌딩 웨스트에서 열린 협약식에는 김원태 KT 엔터프라이즈부문 공공·금융사업본부장(전무)과 정광웅 육군교육사령부 전투발전부장(소장) 등 주요 관계자들이 참석했다. 이번 협약은 육군의 작전환경과 임무 특성을 반영한 차세대 지휘통제체계인 KCCS-Army의 연구·발전을 위해 마련됐다. 양측은 민간의 첨단기술을 군 작전환경에 접목하는 방안을 공동으로 모색한다. 구체적으로 AI·클라우드·5G 등 첨단기술 공유와 자문, 전투실험 관련 연구개발 과제 공동 발굴, 미래 육군의 핵심기술 및 신무기체계 발굴 지원 등에 협력할 계획이다. KT는 국방광대역통합망(M-BcN)과 국방통합데이터센터(DIDC), 국방 5G 인프라 등 기존 국방 사업에서 쌓은 경험을 활용한다. 이를 바탕으로 미래 작전환경에 적합한 AI·네트워크 기술을 제안하고, KCCS-Army 연구를 위한 기술 자문을 지원할 방침이다. 협약식에 앞서 KT는 육군교육사령부 관계자들에게 광화문빌딩에 위치한 ‘AI 이노베이션 허브’를 소개하고 국방 AI 전환(AX) 사업 방향을 공유했다. 이어 차세대 지휘통제체계 연구를 위한 세부 협력 분야와 기술 교류 방안을 논의했다. 향후 육군교육사령부 관계자를 대상으로 AX·네트워크 신기술과 활용 사례를 소개하는 정기 기술 세미나도 개최할 예정이다. 김원태 KT 전무는 “미래 지휘통제체계의 발전을 위해서는 군의 작전환경에 대한 이해와 민간의 첨단기술이 유기적으로 결합돼야 한다”며 “국방 통신망과 데이터 인프라 구축·운영 경험을 바탕으로 육군교육사령부와 긴밀히 협력해 KCCS-Army 발전을 지원하겠다”고 말했다. 한편, KT는 지난 9월 AI·클라우드·5G·위성통신·보안 등 전사 역량을 결집한 ‘국방 AX 태스크포스(TF)’를 출범했다. 이를 중심으","category":"사회"},{"title":"한전도 털렸다…주민번호 포함 152만건 유출","link":"https://n.news.naver.com/mnews/article/009/0005767335","naverLink":"https://n.news.naver.com/mnews/article/009/0005767335","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"고객 플랫폼 '한전ON' 65만명 조달시스템 87만명 정보 유출 계좌·카드번호·주소까지 포함 금융범죄 악용 등 2차피해 우려 한국전력에서 152만여 건에 달하는 개인정보가 유출되는 대규모 사이버 침해 사고가 발생했다. 특히 주민등록번호와 계좌번호, 카드번호 등 금융범죄에 악용될 수 있는 정보까지 유출되면서 2차 피해 우려가 커지고 있다. 22일 한전에 따르면 고객 서비스 플랫폼 '한전ON' 이용자 65만487명과 구매·공사·용역 업무를 처리하는 전자조달시스템(SRM) 이용자 약 87만명의 개인정보가 유출된 것으로 확인됐다. 두 시스템의 유출 규모를 합치면 152만248명에 달한다. 한전ON에서는 고객명과 주민·외국인등록번호, 전화번호, 주소, 은행명, 계좌번호, 예금주명, 카드사, 카드번호, 요금 및 청구정보 등 12개 항목이 유출됐다. SRM에서도 기업 대표자 42만6827명의 주민등록번호와 이메일, 회사 주소 등이 유출됐다. 한전 직원과 기업 직원 44만2934명의 이름과 소속, 사번, 휴대전화번호 등도 유출 대상에 포함됐다. 이번 사고는 단순한 연락처 유출을 넘어 주민등록번호와 금융정보까지 포함됐다는 점에서 파장이 클 전망이다. 이름과 주소, 전화번호, 전기요금 청구정보가 결합되면 한전을 사칭한 보이스피싱이나 명의도용 범죄 등에 악용될 가능성이 있다. 피해 여부는 한전ON 홈페이지의 '개인정보 유출 안내' 메뉴에서 확인할 수 있다. 피해 신고와 문의는 한전 고객센터(국번 없이 123)에서 접수한다. 한전은 \"회사를 사칭한 전화·문자에 개인정보 및 금융정보 제공, 인증번호 전달을 금지해 달라\"며 \"출처가 불분명한 문자, 이메일을 받으면 절대 링크(URL)를 클릭하지 말고 경찰서나 한국인터넷진흥원에 신고해 달라\"고 당부했다. 이날 김동철 한전 사장은 대국민 사과문을 통해 \"고객의 소중한 정보를 완벽히 지키지 못한 책임을 통감하며, 이번 사고를 엄중하게 받아들이고 있다\"며 \"개인정보 보호 체계 전반을 원점에서 재검토해 유사한 사고가 재발하지 않도록 하겠다\"고 밝혔다. 최근 해킹과 개인정보 유출 사고는 공공·민간을 가리지 않고 잇따르고 있다. 지난 5월 온라인동영상서비스(OTT) 티빙의 이용자 계정 3954만개가 유출됐고, 9~10월에는 신한은행과 KB국민은행 등 금융회사 16곳에서 개인정보 약 10만건의 유출이 확인됐다. 특히 신한은행에서는 외부 공격자가 정상적인 인증 절차를 거치지 않고 대출모집인용 조회 서비","category":"사회"},{"title":"\"中 국가안전부, 2년 전부터 첨단 칩 확보위해 비밀 작전\"","link":"https://n.news.naver.com/mnews/article/001/0016456936","naverLink":"https://n.news.naver.com/mnews/article/001/0016456936","pubDate":"2026-11-22T12:00:00+09:00","author":"네이버뉴스","description":"美 수출통제 우회위해 전담조직 구성…칩 확보·밀반입·공급망 정보 수집 시진핑 기술 자립 전략과 맞물려 정보기관 차원의 '반봉쇄 투쟁' 강화 첨단 반도체 경쟁 [로이터=연합뉴스 자료사진. 재판매 및 DB 금지] (서울=연합뉴스) 송진원 기자 = 중국의 국가정보기관이 미국의 대중국 반도체
