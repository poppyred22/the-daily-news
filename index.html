ink":"https://n.news.naver.com/mnews/article/079/0004209338","naverLink":"https://n.news.naver.com/mnews/article/079/0004209338","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"12일 오후 8시 1분쯤 경북 경산시 진량읍 선화리의 한 골판지 공장에서 불이 났다. 경북소방본부 제공 경산 골판지 공장에서 불이 난 지 2시간 40여 분 만에 주불이 진화됐다. 12일 경북소방본부에 따르면 이날 오후 8시 1분쯤 경북 경산시 진량읍 선화리의 한 골판지 공장에서 불이 나 2시간 40여 분 만인 오후 10시 44분쯤 큰불이 잡혔다. 이 불로 공장 건물 4개 동이 전소됐고, 인명피해는 없었다. 앞서 소방 당국은 화재 발생 10여 분 만에 대응 1단계를 발령하고 장비 41대와 인력 96명을 투입해 진화작업을 벌였다. 대응 단계는 주불이 진화된 후인 오후 10시 50분 해제됐다. 소방 당국은 잔불이 정리되는 대로 정확한 피해규모와 화재 원인을 조사할 계획이다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"사건 사고"},{"title":"용인서 통근버스가 250m 역주행… 차량 3대 충돌","link":"https://n.news.naver.com/mnews/article/421/0009286796","naverLink":"https://n.news.naver.com/mnews/article/421/0009286796","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"ⓒ 뉴스1 김초희 디자이너 (용인=뉴스1) 박대준 기자 = 12일 오후 7시 30분께 경기 용인시 용인서울고속도로 용인 방향 서수지 요금소 인근에서 통근버스가 역주행해 마주 오던 차량 3대를 잇달아 충돌하는 사고가 났다. 이 사고는 역주행하던 버스를 피하려던 차량 3대가 급하게 충돌을 피하려다 버스 측면과 부딪히면서 발생했다. 당시 버스는 주행 속도가 빠르지 않아 별다른 인명피해는 발생하지 않았다. 해당 버스는 서수지 요금소를 지나 고속도로를 진입하는 과정에서 차로를 잘못 들어선 뒤 250m가량 역주행하다 멈췄으며, 버스 안에 승객은 없었던 것으로 알려졌다. 경찰 조사 결과 버스 운전자는 음주나 약물 상태는 아니었던 것으로 확인됐다. 경찰은 정확한 사고 경위를 조사 중이다.","category":"사건 사고"},{"title":"“아들이 숨을 쉬지 않는다”⋯숨진 중증 발달장애 10대 몸에서 학대 정황 발견, 40대 어머니 긴급체포","link":"https://n.news.naver.com/mnews/article/087/0001230599","naverLink":"https://n.news.naver.com/mnews/article/087/0001230599","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"},{"title":"“성매매 시키고 돈 훔쳐와라”…살해된 10대가 겪은 일들(종합)","link":"https://n.news.naver.com/mnews/article/018/0006409167","naverLink":"https://n.news.naver.com/mnews/article/018/0006409167","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"김승우 측, 절도 혐의 전면 부인…\"장난이었고 돈도 돌려줬다\"","link":"https://n.news.naver.com/mnews/article/008/0005440580","naverLink":"https://n.news.naver.com/mnews/article/008/0005440580","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"배우 김승우가 지인의 현금 2200만원을 가져간 혐의로 피소된 가운데 법률대리인을 통해 공식 입장을 내고 혐의를 부인했다. 술자리에서 벌어진 장난이었으며 돈도 반환했다는 주장이다. 사진은 배우 김승우. /사진=머니투데이 사진 DB 배우 김승우가 지인의 현금 2200만원을 가져간 혐의로 피소된 가운데 법률대리인을 통해 공식 입장을 내고 혐의를 부인했다. 술자리에서 벌어진 장난이었으며 돈도 반환했다는 주장이다. 12일 김승우의 법률대리인 법무법인 수호 김영곤 변호사는 공식 입장을 통해 \"본 사건은 친분관계에 있는 사람들끼리 함께 한 술자리에서 일어난 장난스러운 행위\"라고 밝혔다. 이어 \"동석한 사람들이 모두 지켜보고 있는 공개적인 상황이었고, 몇 시간 후 다시 만나기로 해 그때 금원을 반환할 예정이었다\"며 \"김승우에게 타인의 금전을 불법적으로 취득하려는 의사가 전혀 없었기 때문에 범죄 의사가 없었던 것으로 판단된다\"고 설명했다. 또 \"다음날 서로 만나지 못해 계좌이체를 통해 즉시 해당 금원을 제보자에게 반환했다\"며 고의성이 없었다고 강조했다. 고소인과의 관계에 대해서는 \"이후에도 양 당사자는 아무 일 없이 형제처럼 친하게 지냈으며 제보자가 어려운 상황에 처했을 때 김승우가 금전적으로 도움을 주기도 했다\"고 전했다.그러면서 \"제보자가 실체적 진실에 부합하지 않는 주장을 하면서 형사고소까지 하고 있어 이에 강력하게 대처할 예정\"이라고 덧붙였다. 앞서 이날 한 매체는 김승우가 2021년 10월 서울 강남구 청담동의 한 유흥주점에서 지인 A씨의 지갑에 있던 현금과 수표 등 2200만원을 가져간 혐의로 고소돼 경찰 조사를 받고 있다고 보도했다. A씨는 당시 술자리 도중 잠시 자리를 비운 사이 김승우가 돈을 가져갔으며 이후 여러차례 반환을 요구했지만 돌려받지 못했다고 주장한 것으로 전해졌다. 김승우는 1969년생으로 1990년 영화 '장군의 아들'로 데뷔했다. 영화 '돈을 갖고 튀어라', '라이터를 켜라', '포화속으로' 등에 출연하며 얼굴을 알렸다.","category":"사건 사고"},{"title":"서울 청담대교 북단서 차량 4대 사고‥1명 다쳐","link":"https://n.news.naver.com/mnews/article/214/0001535277","naverLink":"https://n.news.naver.com/mnews/article/214/0001535277","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"오늘 저녁 7시쯤, 서울 광진구 자양동 청담대교 북단에서 달리던 소형 화물차가 멈춰 서 있던 다른 차량을 뒤에서 들이받아 1명이 다쳤습니다. 이 사고로 소형 화물차를 운전하던 70대 남성이 다쳐 병원으로 옮겨졌으며, 옆 차로를 달리고 있던 차량 2대가 사고를 피하려다 서로 충돌했습니다. 경찰은 음주 정황은 없다고 보고 정확한 사고 원인을 조사하고 있습니다.","category":"사건 사고"},{"title":"서울 홍제동 일대 도로공사 중 정전…1,200여 세대 피해","link":"https://n.news.naver.com/mnews/article/056/0012293018","naverLink":"https://n.news.naver.com/mnews/article/056/0012293018","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"어젯밤 서울 홍제동에 도로공사 중 정전이 발생해 주민들이 불편을 겪었습니다. 어젯밤 9시쯤 서울 서대문구 홍제동 일대 아파트와 주택가 등 1,200여 가구에 전기 공급이 끊겼다가 약 3시간 반 만에 복구됐습니다. 한국전력은 서울 서대문구가 발주한 도로공사 중 지하에 매설된 전선을 훼손하면서 서 정전이 발생한 것으로 보고 정확한 원인을 조사하고 있습니다. 이에 앞서 서울 서대문구는 홍제3동 주민센터에 임시 대피소를 마련하고 인근 주민들에게 안전사고에 유의해 달라고 안내했습니다. [사진 출처 : 시청자 안솔이 제공] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사건 사고"},{"title":"개인이 사전에 막을 수 있는 피해 사례도 있었다","link":"https://n.news.naver.com/mnews/article/005/0001884839","naverLink":"https://n.news.naver.com/mnews/article/005/0001884839","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"개인이 사전에 막을 수 있는 피해 사례도 있었다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"‘아침에 이메일이 안오네’…MS 아웃룩 등 대규모 장애 발생","link":"https://n.news.naver.com/mnews/article/021/0002832487","naverLink":"https://n.news.naver.com/mnews/article/021/0002832487","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"프랑스 파리 인근 마이크로소프트(MS) 사무실 모습. 로이터 연합뉴스 마이크로소프트의 이메일과 사무용 온라인 소프트웨어·인공지능(AI) 서비스 등에 대규모 접속 장애가 발생했다. 12일(현지시간) 온라인 서비스 장애 모니터링 사이트 다운디텍터에 따르면 미 동부시간 오후 1시 20분 기준 메일 서비스인 아웃룩 관련 접속 장애 신고가 13만건을 넘어섰다. 이용자들은 이메일 수발신 지연과 계정 접속 불가 등 불편을 호소하고 있다. 이번 장애는 이메일뿐 아니라 AI 서비스 코파일럿과 사무용 온라인 플랫폼인 MS365, 화상회의·메신저 서비스 팀즈 등에도 영향을 미쳤다. MS 측은 사회관계망서비스(SNS)를 통해 “인프라 부하가 증가한 것이 확인됐다”며 “이것이 연결 오류의 원인으로 추정된다”고 밝혔다. 이어 이와 같은 인프라 부하를 분산하기 위해 접속 트래픽 등을 재분배하는 등 복구 작업에 착수했다고 덧붙였다.","category":"사회"},{"title":"한양 성곽 세계유산 등재 놓고…정비 사업 늦어질까 반발","link":"https://n.news.naver.com/mnews/article/028/0002831992","naverLink":"https://n.news.naver.com/mnews/article/028/0002831992","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"12일 오후 서울 종로구 서울역사박물관 야주개홀에서 열린 ‘한양의 수도성곽’ 세계유산 등재 추진 2차 주민설명회에서 종로구 사직동 주민이 낡은 집 사진과 ‘수도성곽 세계유산 결사반대’ 문구를 쓴 펼침막을 들어 보이고 있다. 신형철 기자 12일 오후 서울 종로구 서울역사박물관 야주개홀. 서울 종로구 사직동의 한 주민이 낡은 집 사진과 ‘수도성곽 세계유산 결사반대’라고 쓴 펼침막을 들어 보였다. 그는 “주객이 전도됐다. 한양 성곽 보전을 위해 주민들의 삶과 재산권이 침해당하고 있다”고 말했다. 불이 나도 소방차가 들어오지 못하는 골목에서 집수리도 못 하고 산다고 했다. 서울시가 낙산·남산 일대 주민들을 대상으로 연 ‘한양의 수도성곽’ 유네스코 세계유산 등재 추진 2차 설명회에선 정비사업이 늦어질 수 있다는 항의가 이어졌다. 박물관 밖에서도 ‘사업 시작 전 없던 규제, 이제 와서 주민에게 떠넘기지 마라’라고 적은 손팻말을 든 이들이 있었다. 문혜영 동후암1구역 재개발 추진위원장은 등재 추진 소식을 이달 2일에야 들었다며 “(재개발 사업) 지연으로 발생하는 비용은 누가 어떻게 책임질 건가”라고 물었다. 희소식으로만 여겨져온 세계유산 등재가 논란의 소재가 되고 있다. 서울의 주택정비사업과 맞물려 ‘재산권 침해’ 주장이 나오기 때문이다. 서울시와 경기도, 고양시는 2021년 3월부터 한양도성·북한산성·탕춘대성을 ‘한양의 수도성곽’으로 묶어 세계유산 등재를 추진해왔다. 세 성곽을 연결해 전쟁 때 왕과 백성이 피난할 수 있게 한 조선의 수도 방어 체계가 등재 신청의 핵심이다. 서울시와 국가유산청은 올해 1월 유네스코 세계유산센터에 신청서를 냈다. 그로부터 두달 뒤 ‘세계유산의 보존·관리 및 활용에 관한 특별법’ 시행령이 개정·시행되면서 주변 주민들의 반발이 본격화했다. 2024년 11월 개정법 시행으로 도입된 세계유산영향평가 대상과 절차가 구체화됐기 때문이다. 등재 뒤 국가유산청장이 성곽과 주변 완충구역을 세계유산지구로 지정·고시하면 그 안에서는 정비구역 지정이나 건축허가에 앞서 평가를 거쳐야 한다. 12일 서울 성북구 삼선동 인근 한양도성길에서 바라본 성곽. 정용일 선임기자 yongil@hani.co.kr","category":"사회"},{"title":"아파트아이, 아파트케어 서비스 수도권 전 지역 확대","link":"https://n.news.naver.com/mnews/article/144/0001149552","naverLink":"https://n.news.naver.com/mnews/article/144/0001149552","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"[스포츠경향 손봉석 기자] 아파트 생활지원 플랫폼 ‘아파트아이(대표 최병인)’가 생활 밀착형 홈케어 서비스 ‘아파트케어’를 서울 · 경기 · 인천 등 수도권 지역까지 확대한다고 전했다. 아파트케어는 아파트아이 애플리케이션(이하 앱)을 통해 수리 항목을 선택해 신청하면 전문가를 연계, 집수리를 받을 수 있는 서비스다. 수리 ∙ 유지보수 경험과 높은 설비 이해도를 가진 믿을 수 있는 아파트 생활 수리 전문가를 앱으로 간편하게 방문 신청할 수 있는 것이 특징이다. 또 정찰제로 운영돼 사전에 가격을 확인하고 신청할 수 있어, 추가 비용을 부담하거나 현장에서 가격을 협의하는 부담감을 덜었다. 올해 1월 특정 지역에서 시범 운영을 시작한 아파트케어는 약 10개월간의 운영을 거쳐 서울·경기·인천까지 서비스 지역을 확대한다. 현재 수도권 약 2만 개 단지에서 아파트케어를 이용할 수 있다. 아파트케어는 LED 전등 교체, 스위치·콘센트 보수, 싱크대·욕실 수전 교체, 문고리 수리 등 입주민이 일상에서 자주 겪지만 직접 해결하기 어렵거나 업체를 따로 알아보기 번거로운 총 22개 생활 수리 항목을 서비스로 제공 중이며 지속 확대할 예정이다. 특히 에어컨 청소 영역을 일부 지역에서 제공 중이며 추후 이용 가능 지역을 넓힐 계획이다. 아파트아이는 이번 서비스 지역 확대를 기념해 11월 10일부터 12월 31일까지 아파트아이 앱에서 생활수리 관련 OX 자가 진단 이벤트를 진행한다. 이벤트 참여자 중 천 명을 추첨해 아파트캐시를 지급하며, 아파트케어 이용 후 리뷰를 작성한 회원에게는 아파트캐시 5천 원을 제공한다. 또한 리뷰 작성자 중 1명을 추첨해 전 달 관리비 상당의 아파트캐시를 추가 지급할 예정이다. 당첨자는 매월 추첨을 통해 선정한다. 아파트아이 기획팀 유관형 팀장은 “아파트케어 출시 직후 입주민 활용이 활발하고 만족도가 높아 서비스 지역을 넓히게 됐다.”며, “아파트아이는 아파트케어를 전국으로 확대하기 위해 서비스를 고도화할 계획”이라고 밝혔다. 앞서 아파트 아이는 롯데카드와 손잡고 관리비 자동이체 서비스를 재개하며, ‘최대 15만 원 캐시백’ 프로모션을 단독 진행했다. 이 프로모션은 주거비와 생활물가가 동시에 상승해 가계의 실질 소득이 줄어드는 상황에서, 고정 지출인 아파트 관리비 부담이라도 덜고자 기획이 됐다. 아파트아이는 전국 3만여 단지, 1,200만 세대를 대상으로 관리비 조회·납부를 비롯해 방문 차량 예약, 입주민 투","category":"사회"},{"title":"이완섭 서산시장, 현대에 \"서산간척지 명소로 함께 만들자\" 주문","link":"https://n.news.naver.com/mnews/article/003/0014319599","naverLink":"https://n.news.naver.com/mnews/article/003/0014319599","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"이완섭 서산시장, 현대에 \"서산간척지 명소로 함께 만들자\" 주문. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"'중국 스파이 스캔들' 젠슨 황 엔비디아 CEO 사임…CFO가 임시경영","link":"https://n.news.naver.com/mnews/article/057/0001977975","naverLink":"https://n.news.naver.com/mnews/article/057/0001977975","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"사임한 젠슨 황 엔비디아 CEO / 사진=연합뉴스 미국 인공지능 반도체 기업 엔비디아는 중국 스파이 연루 의혹 등에 휩싸인 젠슨 황 최고경영자가 사임했다고 발표했습니다. 엔비디아는 현지시간 12일 성명을 통해 황 CEO가 CEO와 이사직에서 즉각 물러난다고 밝혔습니다. 엔비디아는 임시 CEO로 콜레트 크레스 최고재무책임자(CFO)를 임명했습니다. 또 하비 C. 존스를 이사회 의장으로 선임했습니다.","category":"사회"},{"title":"서울 홍제동서 1,100여 세대 정전…\"도로공사 중 케이블 고장\"","link":"https://n.news.naver.com/mnews/article/055/0001402680","naverLink":"https://n.news.naver.com/mnews/article/055/0001402680","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"▲ 정전 (위 사진은 기사 내용과 관련이 없습니다.) 오늘(12일) 밤 9시쯤 서울 서대문구 홍제동 일대 1,100여 세대의 전기 공급이 끊겨 주민들이 불편을 겪고 있습니다. 한국전력공사 측은 홍제동 일대 주택 108세대와 아파트 3개 단지 1,063세대에서 인근 도로 정비 공사 중 케이블 고장으로 인해 정전이 발생했다고 밝혔습니다. 서대문구청은 재난 문자를 통해 \"안전사고에 유의해달라\"고 당부하는 한편 \"홍제3동 주민센터에 임시 대피소를 마련했다\"고 전했습니다.","category":"사회"},{"title":"특례시 시장들 “규모에 걸맞는 실질적 권한 부여해야” 한목소리","link":"https://n.news.naver.com/mnews/article/009/0005763084","naverLink":"https://n.news.naver.com/mnews/article/009/0005763084","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"‘특례시시장협의회’ 정기회의 법적권한·재정 확대 등 논의 특례시장들이 12일 정기회의를 갖고 권한 확대방안을 논의했다. 왼쪽부터 강기윤 창원특례시장, 정명근 화성특례시장, 이상일 용인특례시장, 민경선 고양특례시장 순. [대한민국특례시장협의회] 대한민국특례시시장협의회는 12일 용인시 처인구 포곡읍 에버랜드 판다월드 교육장에서 ‘2026년 제2회 정기회의’를 열고 특례시의 실질적인 권한을 확대하기 위한 방안 등을 논의했다. 이번 회의에는 협의회 대표회장인 강기윤 창원특례시장과 이상일 용인특례시장, 정명근 화성특례시장, 민경선 고양특례시장, 김현수 수원특례시 제1부시장 등이 참석했다. 참석자들은 특례시의 실질적인 지위와 권한을 확보하기 위한 재정특례 등을 행정안전부 장관에게 건의하는 방안을 다뤘다. 참석자들은 지방자치법 개정을 통한 특례시 법적 지위 확립, 조정·징수교부금 확대 등 실질적인 재정특례 부여, 지역 현안을 결정할 핵심 사무 이양, 부시장·구청장 직급 상향 등 자치조직권 확대 등 공동 건의 내용을 논의했다. ‘지방자치법’상 지방자치단체의 종류에 ‘특례시’를 명시해 ‘별도의 독립된 자치단체 유형’으로 특례시의 법적 지위를 명확히 하고, 일반조정교부금 조성 기준과 도세 징수교부금 교부 비율을 확대해 특례시 권한에 맞는 재정 자율성을 확보하기 위해서다. 현행 ‘지방자치법’은 인구 100만명 이상 대도시를 특례시로 규정하고 있지만, 지방자치단체의 종류로 특례시를 명시하고 있지는 않다. 참석자들은 이와함께 특례시 관련 행정안전부 국정감사 서면질의와 답변 내용을 공유하며 비수도권 특례시 지정 확대 논의에 대한 협의회 공동 대응 방향 등을 검토했다. 특례시의 법적 지위와 재정특례에 관한 공동연구, 연구 성과와 연계한 국회 정책토론회 개최, 시민과 공무원을 대상으로 한 특례시 제도 교육, 신규 특례사무 인수인계와 우수사례 벤치마킹 추진 방안도 다뤘다. 이상일 용인특례시장은 이날 회의에서 “5개 특례시가 힘을 모아 ‘특례시 지원에 관한 특별법’을 마련해 내년 6월 시행을 앞두고 있다”며 “재정·행정사무와 관련해 필요한 권한을 확보하기 위해 더욱더 목소리를 내야 하고, 공동의 노력을 기울여야 할 것”이라고 강조했다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/056/0012293026","naverLink":"https://n.news.naver.com/mnews/article/056/0012293026","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 부산 북항의 명물이 상어 '부캉이'였다면, 강릉항의 명물은 바로 '안목이'였습니다. 강릉 앞바다에서 1년 가까이 머물다 구조된, 어린 남방큰돌고래 안목이가 치료와 재활 훈련을 마치고 제주 바다로 돌아갔습니다. 고향을 찾은 안목이를 민소영 기자가 취재했습니다. [리포트] 제주 서남쪽 산방산 인근 해역, 울산에서 온 대형 선박이 자리를 잡습니다. 수조 속 돌고래를 크레인으로 조심스레 들어 올리더니 바다에 설치된 가두리에 넣습니다. 돌고래는 어느새 가두리를 벗어나 유영을 시작합니다. 올여름 강릉 앞바다에서 구조된 어린 남방큰돌고래, '안목이'입니다. 고향에 돌아온 걸 아는지 익숙하게 헤엄을 칩니다. 무리에서 떨어져 나온 안목이는 선박을 따라다니고 사람도 피하지 않는 모습으로 화제가 됐습니다. 하지만 몸 곳곳에 상처가 생기는 등 생명에도 위험이 커지자 당국은 구조를 결정했습니다. 이어진 넉 달간의 치료와 재활 훈련 끝에, 고향인 제주 바다로 돌아오게 됐습니다. [김현성/해양수산부 해양생태과장 : \"야생성을 잃기 전에 자연으로 돌아가는 것이 적절하다는 전문가들의 판단하에 최대한 빨리, 그리고 더 추워지기 전에...] 안목이는 별도의 적응 기간 없이 제주 바다로 자연 방류돼, 전문가들이 당분간 추적 관찰하며 야생 적응 여부를 살펴볼 예정입니다. 이를 위해 등지느러미에 위성 추적 장치도 달았습니다. 안목이는 2시간도 채 안 돼 남방큰돌고래 무리가 자주 관측되는 서귀포시 대정 앞바다까지 헤엄쳐 갔습니다. 하지만 관광 선박에 둘러싸인 모습이 목격된 만큼 다시 스크루 등에 다치는 일이 반복되지 않도록 면밀한 관찰이 필요해 보입니다. KBS 뉴스 민소영입니다. 촬영기자:부수홍 한창희/화면제공:해양수산부, 다큐제주/그래픽:박미나 ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"경북 경산 골판지 제조 공장 불···2시간 40분 만에 초진","link":"https://n.news.naver.com/mnews/article/657/0000057407","naverLink":"https://n.news.naver.com/mnews/article/657/0000057407","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"경북 경산의 한 골판지 제조 공장에서 불이 나 2시간 40분 만에 초진됐습니다. 경북소방본부에 따르면 11월 12일 8시쯤 경북 경산시 진량읍 골판지 제조 공장에서 불이 나 대응 1단계를 발령하고 119특수대응단과 중앙 구조본부 영남 119특수구조대, 구미 119화학구조센터 장비와 인력을 동원해 진화에 나섰습니다. 불은 2시간 40분 만에 초진됐으며, 현재까지 인명 피해는 없는 것으로 확인됐습니다. 소방 당국은 불이 완전히 꺼지기까지는 다소 시간이 걸릴 것으로 보고, 불을 끄는 대로 정확한 화재 원인과 재산 피해 규모 등을 조사하기로 했습니다.","category":"사회"},{"title":"이청·장덕현·최주선, 헬멧·방진복 입고 등장…\"충청권 84조 투자 앞장\"","link":"https://n.news.naver.com/mnews/article/031/0001074439","naverLink":"https://n.news.naver.com/mnews/article/031/0001074439","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"이청·장덕현·최주선, 헬멧·방진복 입고 등장…\"충청권 84조 투자 앞장\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"지역서 시작하는 통합돌봄 AX… 청도서 미래 방향 모색","link":"https://n.news.naver.com/mnews/article/022/0004174781","naverLink":"https://n.news.naver.com/mnews/article/022/0004174781","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"10월30일 청도상상마루서 ‘2026 통합돌봄 AX 포럼’ 개최 AI·데이터 기반 지역사회 통합돌봄의 현황과 과제, 지역 적용 가능성 논의 민·관·공·산·학이 함께 지역 돌봄 현안 공론화 및 협력 방안 모색 농촌의 고령화와 돌봄 사각지대 문제에 대응하기 위해 지역사회가 직면한 현안을 공론화하고 인공지능(AI)과 데이터 기반의 통합돌봄 전환 방향을 논의했다. (사)경북시민재단이 주관한 ‘2026 통합돌봄 인공지능 전환(AX) 포럼이 지난달 30일 오후 경북 청도군 청도상상마루 상상홀에서 개최됐다. 이번 포럼은 행정안전부 ‘지역 주도 민·관 협력체계 구축·확산 사업’의 일환으로, 지역사회가 직면한 문제와 현안을 발굴하고 민·관·공·산·학의 다양한 주체가 함께 해결 방향을 모색하기 위한 공론의 장으로 마련됐다. 참석자들은 이 자리에서 농촌의 고령화와 돌봄 인프라 부족 등 지역적 특성을 고려해 AI와 데이터 기술을 활용한 지역사회 통합돌봄의 가능성을 살펴보고 지역의 수요와 자원을 연계하기 위한 협력 방향을 논의했다. 첫 번째 발제자인 성지은 과학기술정책연구원 선임연구위원은 ‘AI 기반 지역사회 통합돌봄의 현황과 과제’를 주제로 기술 공급자 중심의 서비스 제공, 기술·기기에 대한 신뢰 부족, 정서적 교감의 부재, 법·제도 및 인프라 미비 등 현행 기술 기반 복지·돌봄의 한계를 진단하고 당사자 및 수요자 중심, 문제 해결 기반의 초학제적 연구, 지속가능한 전환 랩(Transition Lab) 기반의 지역 맞춤형 통합돌봄을 해결책으로 제시했다. 성 연구위원은 “AI·사물인터넷(IoT) 스마트 돌봄, 통합 데이터 플랫폼, 돌봄 로봇 등이 복지·돌봄 현장에 도입되고 있으나, 여전히 공급자 중심의 접근에 머물러 있어 현장 확산과 효용성 체감에는 한계가 있다”고 진단하며 “단순한 수혜자나 객체를 넘어 당사자·사용자·시민사회가 주도적으로 참여하는 ‘공동창조(Co-creation)’ 기반의 복지·돌봄 전환이 중요하다”고 강조했다. 이를 위해 ▲복지·돌봄 난제 해결을 위한 ‘임무 지향적 혁신 프로그램’ 추진 및 고도화된 절약형 혁신(AFI) 도입 ▲융합형 돌봄 혁신을 위한 초학제적 연구 시스템과 민·관·산·학·연 협력 리빙랩 플랫폼 구축 ▲돌봄 당사자 및 전문인력의 주체화·역량 강화와 지역 기반 로컬랩-전환랩 연계 전략 등 AI 기반 지역사회 통합돌봄 구현을 위한 주요 정책 및 실천과제를 제안했다. 두 번째 발제자인 ㈜앤유비즈 이보현","category":"생활·문화"},{"title":"류경기 중랑구청장, 서울 25개 자치구 중 유일 ‘복지구청장상’ 수상","link":"https://n.news.naver.com/mnews/article/016/0002722831","naverLink":"https://n.news.naver.com/mnews/article/016/0002722831","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"사회복지시설·장기요양기관 종사자 1597명 복지포인트 신설…현장 처우 개선 성과 중랑동행사랑넷 참여자 3만2,542명…고립가구 791가구 결연 등 지역 돌봄망 강화 류경기 중랑구청장이 2026복지구청장상 수상자로 결정됐다. [헤럴드경제=박종일 선임기자]“복지의 시작은 사람이다” 류경기 중랑구청장이 사회복지 종사자의 처우 개선과 지역사회 복지안전망 구축에 기여한 공로를 인정받아 ‘2026 복지구청장상’을 수상했다. 서울시 25개 자치구 구청장 가운데 유일한 수상자다. 서울특별시사회복지사협회는 지난 10일 공개추천과 심사를 거쳐 류 구청장을 올해 복지구청장상 수상자로 선정했다고 밝혔다. 회원 2만1000여 명 규모의 협회가 주관한 이번 선정에는 중랑구 복지관연합회 소속 10개 기관장이 추천에 참여했다. 이번 수상에서 주목받은 것은 복지서비스를 제공하는 현장 종사자들의 처우 개선을 위한 중랑구의 노력이다. 중랑구는 사회복지시설 종사자와 장기요양기관 요양보호사를 대상으로 복지포인트 제도를 새롭게 마련했다. 지역 내 사회복지시설 73개소 종사자 573명에게 연간 10만 원, 장기요양기관 236개소 요양보호사 1024명에게 연간 5만 원을 지원한다. 일정 근무조건을 충족한 총 1597명이 지원 대상이며, 연간 소요 예산은 1억850만 원이다. 복지정책의 성패가 현장 종사자들의 전문성과 헌신에 달려 있다는 점에서 이들의 노고를 인정하고 실질적인 처우 개선에 나섰다는 데 의미가 있다. 사회복지인 한마음 워크숍과 아동·청소년 복지시설 종사자 워크숍 등을 지원해 종사자 간 교류를 활성화하고 민관 협력 기반을 강화한 점도 좋은 평가를 받았다. 중랑구의 복지행정은 현장 종사자 지원을 넘어 주민과 이웃이 함께 참여하는 지역사회 돌봄체계 구축으로 이어지고 있다. 대표적인 사업이 중랑형 복지브랜드인 ‘중랑동행사랑넷’이다. 공공과 민간, 주민을 연결하는 복지 협력 네트워크로, 지난 11월 5일 기준 참여자는 3만2542명에 이른다. 여기에 ‘우리동네사랑넷’ 인적 연계망과 ‘중랑동행아카데미’ 교육 플랫폼을 구축해 지역 복지자원의 연결과 역량 강화에도 힘쓰고 있다. 특히 사회적 고립가구와 지역주민을 연결하는 ‘중랑동행 이웃잇기’ 결연사업은 지역사회 돌봄안전망의 핵심이다. 지난 10월 말 기준 791가구가 결연을 맺어 이웃이 이웃의 안부를 살피는 관계 중심의 돌봄체계를 만들어가고 있다. 복지 사각지대를 행정기관의 힘만으로 해소하는 데는 한계가","category":"생활·문화"},{"title":"\"김치맨\" 외쳐댄 관중에 주먹 불끈쥐고…박항서 감독 끝내","link":"https://n.news.naver.com/mnews/article/088/0001040063","naverLink":"https://n.news.naver.com/mnews/article/088/0001040063","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"2026년 11월1일 열린 태국 프로축구 2부리그 경기에서 관중에게 모욕적인 인종차별 발언을 듣자 격분하는 박항서 감독. 엑스(X) 캡처. 태국 프로축구 2부리그에서 활동 중인 박항서 깐짜나부리 파워FC 감독이 상대 팀 관중의 인종차별적 언행에 거칠게 대응했다는 이유로 징계를 받았다. 12일 태국축구협회에 따르면 협회 징계윤리위원회는 지난 10일 박 감독에게 2경기 출전 정지와 벌금 1만3333바트(약 53만원)의 징계를 내렸다. 당초 벌금은 2만바트로 책정됐으나, 2부리그에 적용되는 감경 규정에 따라 3분의 2 수준으로 조정됐다. 논란은 지난 1일 태국 파타야의 농프루 스타디움에서 치러진 파타야 유나이티드와 깐짜나부리의 2026~2027시즌 태국 리그2 경기에서 불거졌다. 양 팀이 2-2로 비긴 뒤 박 감독과 상대 팀 관중 사이에 충돌이 발생한 것이다. 당시 파타야 구단 팬으로 추정되는 일부 관중은 박 감독을 향해 욕설을 퍼붓고 '김치맨'이라는 표현을 여러 차례 외친 것으로 알려졌다. 이들은 깐짜나부리 소속 미드필더인 마다가스카르 출신 존 바지오에게도 신체적 특징을 조롱하는 발언을 쏟아냈다. 이 과정에서 '원숭이'라는 인종차별적 표현도 사용된 것으로 전해졌다. 박 감독은 처음에는 입가에 손가락을 갖다 대며 관중에게 조용히 하라는 뜻을 전달했다. 그러나 비하 발언이 멈추지 않자 주먹을 휘두르는 듯한 동작을 취하고 관중석을 향해 아래로 내려오라고 외치며 격앙된 반응을 보였다. 박 감독 측은 선수를 향한 모욕적인 발언을 제지하려던 행동이었다는 입장이다. 박 감독의 매니지먼트사인 DJ매니지먼트는 사건 직후 \"박 감독은 선수에게 지속적인 욕설과 외모 비하 발언을 하는 관중에게 항의했다\"며 \"선수에게 가해지는 모욕적인 언행을 직접 목격하고 이를 중단시키려 한 것\"이라고 해명했다. 이어 \"선수를 보호해야 하는 지도자로서의 책임을 다하고자 했다\"며 이 같은 사정을 태국축구협회에 제출한 소명서에도 설명했다고 밝혔다. 하지만 태국축구협회의 판단은 달랐다. 관중이 인종차별적 발언을 한 점은 인정하면서도, 이에 대응한 박 감독의 행동이 지도자로서 적절하지 않았다고 봤다. 협회는 \"선수를 보호하기 위한 행동 자체는 가능하지만 표현 방식에는 적절성과 성숙함이 필요하다\"며 \"추가적인 갈등을 일으켜서는 안 된다\"고 밝혔다. 또 박 감독이 당시 이미 출전 정지 처분을 받은 상태였다는 점도 문제 삼았다. 협회는 박 감독이 경기 관련 구역에","category":"생활·문화"},{"title":"역사 강사 황현필, 경기교육청 초청 강연서 사실 오류 논란… 도의회 “검증 부실”","link":"https://n.news.naver.com/mnews/article/023/0004009312","naverLink":"https://n.news.naver.com/mnews/article/023/0004009312","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"3줄 요약 ㆍ 역사강사 황현필, 북한 회고록 근거 미검증 주장 공식 강연서 전달 ㆍ 경기교육청, 김형직-양세봉 의형제 주장 검증 미흡 인정 ㆍ 강사 선정 과정 혼란·교육청 공식 강연 검증 기준 논란 황현필 강사. /뉴시스 경기도교육청이 역사 강사 황현필씨를 초청해 진행한 공식 강연에서 검증되지 않은 역사적 주장이 사실처럼 전달됐다는 지적이 나왔다. 교육청은 강연 내용을 사전에 검증했다고 밝혔지만, 정작 논란이 된 발언의 근거는 충분히 확인하지 못했다고 인정했다. 12일 경기도의회 교육행정위원회 김현석 부위원장(국민의힘·과천1)에 따르면, 황씨는 지난달 28일 경기도교육청이 개최한 명사 초청 강연회에서 항일 무장 투쟁을 설명하면서 “김일성의 아버지 김형직하고 양세봉이 의형제 사이”라고 했다고 한다. 양세봉은 일제강점기 조선 혁명군을 이끌고 항일 무장 투쟁을 벌인 독립운동가다. 김 부위원장은 황씨가 언급한 의형제 관계가 1992년 발간된 북한 김일성의 회고록 ‘세기와 더불어’에 등장하는 주장이라고 지적했다. 해당 회고록에는 양세봉이 김형직과 결의형제라고 말했다는 취지의 내용이 담겨 있다고 한다. 그러나 이를 뒷받침할 독립적인 사료가 확인되지 않은 상황에서 황씨가 출처나 검증 여부에 대한 설명 없이 확정된 사실처럼 전달했다는 것이다. 강사 선정 과정에서도 문제가 제기됐다. 교육청이 제출한 강연 운영 계획에는 교육감 비서실이 ‘강사 섭외 및 일정 조율’을 담당한다고 기재돼 있지만, 의원실에 제출한 별도 답변 자료에는 교육역량과 장학사가 섭외 담당자로 적혀 있었다. 교육청은 강사 선정 주체에 대해 담당 부서에서 결정했다고 설명했지만, 비서실의 관여 여부와 최종 승인자 등에 대해서는 추가 확인이 필요하다는 입장을 밝혔다. 김현석 의원. /경기도의회","category":"생활·문화"},{"title":"AI 품은 안경, 스마트폰서 완전 해방 ‘새로운 경험’","link":"https://n.news.naver.com/mnews/article/020/0003762144","naverLink":"https://n.news.naver.com/mnews/article/020/0003762144","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"AI 품은 안경, 스마트폰서 완전 해방 ‘새로운 경험’. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"대한민국 관광 새 역사...연간 방한객 사상 최초 2천만명 돌파","link":"https://n.news.naver.com/mnews/article/052/0002431865","naverLink":"https://n.news.naver.com/mnews/article/052/0002431865","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"연합뉴스 한국을 방문한 외국인 관광객이 사상 최초로 2천만명을 돌파한 것으로 나타났다. 이는 2012년에 방한객 1천만명을 달성한 이후 14년 만에 거둔 성과다. 12일 문화체육관광부에 따르면 한국을 방문한 외국인 관광객이 2천만명을 돌파한 데 이어 연말까지 남은 기간 갱신되는 수치 역시 모두 새로운 기록으로 남게 될 전망이다. 올해 1∼9월 외국인의 관광 분야 소비액은 15조9천416억원으로, 지난해 같은 기간보다 47.7% 급증했다. 같은 기간 비수도권 공항과 항만으로 입국한 방한객도 각각 324만명, 158만명으로, 작년보다 37.4%, 14.5% 늘었다. 이러한 성과는 'K-컬처'의 세계적인 확산과 범부처 협조 체계 확립, 국민의 성숙한 환대 정신이 어우러진 결과라고 문체부는 설명했다. 해외한류실태조사에 따르면 작년 말 기준 '자국에서 한류 콘텐츠가 인기 있다'는 비율은 음악(54%), 드라마(51%), 영화(49%), 음식(55%), 미용(53%) 등으로 50% 전후를 기록했다. 한류가 한국 제품·서비스 구매에 긍정적 영향을 미친다는 응답률은 65%로, 3년 연속 성장했다. 문체부는 방한 관광 2천만명 시대를 맞아 기념행사와 업계 간담회, 언론 기고, 지방 국제 공항 환대 행사 등을 계획하고 있다. 김대현 문체부 제2차관은 이날 인천국제공항을 찾아 입국자를 환영한다. 최휘영 문체부 장관은 \"외국인 관광객 2천만명 돌파는 '대체 불가 관광대국'으로 도약하는 출발점\"이라며 \"다음 달까지 전대미문의 성과를 국민과 공유해 자부심을 높이고, 방한 관광객 3천만명 시대 달성과 4천만명 시대를 향한 수용 태세를 준비하겠다\"고 말했다.","category":"생활·문화"},{"title":"김민석, '언행 논란' 최민희 감찰조사 지시","link":"https://n.news.naver.com/mnews/article/422/0000925649","naverLink":"https://n.news.naver.com/mnews/article/422/0000925649","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"더불어민주당 김민석 대표가 최민희 최고위원의 언행 논란과 관련해 당 윤리감찰단에 감찰 조사를 지시했습니다. 민주당은 오늘(12일) \"김 대표는 최근 최 최고위원의 일련의 언행과 관련한 여러 논란을 심각하게 인식했다\"며 이같은 사실을 전했습니다. 이번 조사는 최 의원에게 제기된 문제들의 사실관계와 경위를 객관적으로 확인하고, 당헌·당규 및 윤리규범 위반 여부를 살펴보기 위해서라는 것이 당의 설명입니다. 최 의원은 최근 지역구 당원 등이 참여하는 단체 대화방에서 취재 중인 사진·영상 기자들을 '하이에나 떼'라고 표현해 논란을 빚었습니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"생활·문화"},{"title":"서울 집값 떠받치는 전월세…2027년 매매 상승폭 3%로 둔화 전망","link":"https://n.news.naver.com/mnews/article/014/0005603363","naverLink":"https://n.news.naver.com/mnews/article/014/0005603363","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"건설산업연구원 2027년 부동산 시장 전망 발표 수도권 매매 3% 상승 전망…금리·대출한도 제약 영통·동탄·기흥 등 반도체 지역 구매력 개선 변수 전국 전세 4.5% 상승…공급 감소·임차 수요 잔류 서울 핵심 입지 청약 대기…가격 따라 성적 차이 2027년 주택·부동산 경기전망 발표자료. 건산연 제공 [파이낸셜뉴스] 내년 서울 주택시장은 전·월세가격 상승과 매수 수요가 가격을 떠받치겠지만, 누적된 집값 부담과 높은 대출금리가 추가 상승을 제약할 것이라는 전망이 나왔다. 경기 남부에서는 반도체산업의 영향을 받는 영통·동탄·기흥 등이 구매력 개선 여부에 따라 주변 지역과 다른 흐름을 보일 것으로 예상됐다. 11일 한국건설산업연구원(건산연)은 2027년 수도권 주택 매매가격은 연간 3.0% 상승할 것으로 전망했다. 올해 연간 전망치인 4.8%보다 상승폭이 줄어드는 수준이다. 전국 매매가격 상승률은 올해 전망치 2.5%에서 내년 2.0%로 낮아질 것으로 내다봤다. ■서울 매수 수요 유지…금리·대출한도가 상승 속도 제약 건산연은 수도권 집값을 지지하는 요인으로 전·월세가격 상승과 서울 중심의 매수 수요를 꼽았다. 임차 비용이 높아지면 일부 수요가 매매시장으로 이동하면서 가격 하방을 지지할 수 있다는 분석이다. 다만 집값이 이미 많이 오른 상황에서 높은 주택담보대출 금리와 대출한도 제약이 추가 매수 여력을 제한할 것으로 봤다. 세제 등 정책 변화에 따라 매물이 늘어날 가능성도 있어 가격 상승 경로에는 불확실성이 남아 있다고 설명했다. 수도권 안에서도 산업기반에 따른 차이가 예상됐다. 반도체산업의 영향을 받는 수원 영통과 화성 동탄, 용인 기흥 등은 특별급여 지급과 같은 구매력 개선 요인에 따라 인근 지역과 다른 가격 흐름을 보일 가능성이 있다고 진단했다. ■비싼 집값에 임차시장 잔류…전세·월세 부담 확대 우려 임대차시장은 매매시장보다 상승 압력이 커질 것으로 예상됐다. 건산연은 내년 전국 주택 전세가격이 4.5% 올라 올해 전망치인 3.6%보다 상승폭을 키울 것으로 내다봤다. 공급 측면에서는 2023년 착공 감소가 준공·입주 감소로 이어져 신규 전세 공급이 충분히 늘기 어려울 것으로 분석했다. 1주택 실거주자 중심의 시장 재편도 전세 매물 감소 요인으로 꼽았다. 수요 측면에서는 높은 매매가격과 대출 규제, 금리 부담 때문에 주택 구입을 미룬 가구가 임차시장에 남을 것으로 예상했다. 전세 공급은 부족한데 임차 수요가 유지되","category":"생활·문화"},{"title":"\"집 팔기 전후, 183일 체류·건강보험 관리해야\"…홍콩서 세무설명회","link":"https://n.news.naver.com/mnews/article/421/0009286789","naverLink":"https://n.news.naver.com/mnews/article/421/0009286789","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"한국세무사회·주홍콩 총영사관 등 주최…상속세 강연 이어 개별상담 12일 '홍콩 재외동포가 알아야 할 한국 세금 설명회'를 마친 뒤 한국세무사회 임원 세무사들이 동포 개개인의 사정에 맞춘 개별 세무 상담을 진행하고 있다.2026.11.12/뉴스1 ⓒ News1 송용환 기자 (홍콩=뉴스1) 송용환 기자 = 한국세무사회(회장 구재이)가 홍콩 재외 동포들의 세금 애로사항을 직접 해결하기 위해 현지를 찾았다. 세무사회는 '183일 이상 한국 체류'와 '한국 건강보험' 이용 문제를 면밀하게 살펴야 한다고 조언했다. 12일 한국세무사회에 따르면 이날 오후 주홍콩 대한민국 총영사관 대강당에서 '세무사와 함께하는 홍콩 재외동포 세무설명회'가 열렸다. 한국세무사회와 재외동포청, 주홍콩 대한민국 총영사관이 마련한 이번 설명회는 홍콩 재외동포들이 알아야 할 한국 세금을 안내하고 현장 세무상담을 진행하기 위해 마련됐다. 강연은 한국세무사회 이동기 부회장(재외동포세무지원센터장)과 조인정 재외동포세무지원센터 운영위원이 맡았고, 강의 후에는 두 명의 강사를 비롯해 김선명 부회장, 이석정 세무연수원장 등이 재외동포들과 개별 상담을 가졌다. 첫 발표에 나선 이동기 부회장은 재외동포 세무에서 가장 중요한 기준으로 '거주자·비거주자 판정'을 꼽았다. 이 부회장은 \"한국 세법상 거주자 여부는 국적이나 주민등록이 아니라 생계를 같이하는 가족, 직업, 재산 등 생활 근거지(주소)를 종합해 판단한다\"며 \"홍콩 영주권이나 외국 국적이 있더라도 가족이나 생활 근거지가 한국에 있으면 거주자로 판정돼 세금이 많이 나올 수 있다\"고 설명했다. 이어 한국 내 부동산 보유 및 양도 시 주의할 점에 대해 \"비거주자라도 기준시가 12억 원 초과 주택의 월세나 다주택자 임대소득, 상가 임대소득은 소득세 신고를 해야 추후 해외 송금 시 자금 출처 확인에 문제가 없다\"고 강조했다. 두 번째 연사로 나선 조인정 운영위원은 상속·증여세와 해외 송금, 해외 금융계좌 신고 의무를 다뤘다. 조 운영위원은 \"상속세는 상속인이 아닌 피상속인(돌아가신 분)의 거주자 여부에 따라 공제가 달라진다\"며 \"피상속인이 한국 비거주자일 경우 배우자 공제나 금융재산 공제가 안 되고 일괄공제 2억 원만 적용돼 순재산이 2억 원을 넘으면 신고 대상이 된다\"고 설명했다. 증여와 송금 절차에 대해 조 운영위원은 \"비거주자가 한국 내 예금이나 부동산을 증여받을 때는 등기나 송금에 앞서 한국은행의 사전 신고필증","category":"생활·문화"},{"title":"60만원대에 디자인만 30종…삼성 첫 AI글라스, 메타 추격","link":"https://n.news.naver.com/mnews/article/011/0004681677","naverLink":"https://n.news.naver.com/mnews/article/011/0004681677","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"■ 내달 10일 한미 동시 출시 ‘인텔리전트 아이웨어’ 사전 판매 41g 초경량에 9시간 연속 사용 메타보다 가볍고 1시간 오래가 제미나이·빅스비로 통번역·검색 삼성전자(005930) 가 60만 원대 인공지능(AI) 안경 신제품을 다음달 10일 한국과 미국에 출시한다. 최대 경쟁사 메타보다 높은 성능과 갤럭시 생태계 연동성, 30종에 이르는 디자인을 앞세워 차세대 모바일 기기로 떠오른 AI 안경 시장에서도 1위에 올라선다는 목표다. 12일 삼성전자는 한국과 미국에서 AI 안경 ‘인텔리전트 아이웨어’의 사전 판매를 시작해 다음달 10일 정식 출시한다고 밝혔다. 인텔리전트 아이웨어는 삼성전자가 구글과 공동 개발하고 패션 브랜드 젠틀몬스터·워비 파커와 협업해 제작한 첫 AI 안경이다. 인텔리전트 아이웨어는 사양에 따라 국내에서 65만~70만 원, 미국에서 395~449달러에 판매된다. 가격은 국내 출시된 메타의 ‘레이밴 메타 웨이페어러 2세대’(국내 69만~74만 원·미국 379달러)보다 미국 기준으론 소폭 높다. 신제품은 무게 41g에 1200만 화소 카메라, 2기가바이트(GB) 메모리와 64GB 스토리지(저장공간)를 갖췄다. 1회 충전으로 9시간 동안 쓸 수 있고 개방형 스피커 2개와 마이크 4개를 탑재해 음성인식 기능을 지원한다. 레이밴 메타보다 무게는 9g 가볍고 배터리 시간은 1시간 길어 성능이 더 뛰어나다. 삼성전자는 안경 프레임과 색상에 따라 디자인을 30종으로 다양화했다. 젠틀몬스터 16종, 워비파커 14종이다. 기존 AI 안경 제품들이 한정된 디자인 종류로 사용자의 다양한 패션 취향을 충족하지 못하는 한계를 극복하겠다는 취지다. 국내에서는 젠틀몬스터 제품만, 미국에서는 젠틀몬스터와 워비파커 제품을 모두 살 수 있다. 삼성전자는 신제품과 갤럭시 스마트폰 간 연동성도 특장점으로 내세웠다. 신제품은 스마트폰처럼 구글 ‘제미나이’와 삼성 ‘빅스비’를 AI 에이전트로 장착해 사용자의 시야를 실시간 인식하고 통번역이나 검색 등을 지원할 수 있다. 회의 중 화이트보드에 작성된 내용을 자동으로 갤럭시 스마트폰의 ‘삼성 노트’에 저장하는 식이다. 스마트폰과 AI 연산을 나눠 수행해 효율화하는 ‘스플리트 컴퓨팅’도 지원한다. 인텔리전트 아이웨어는 촬영 시 발광다이오드(LED) 표시등이 켜지도록 해 불법 촬영 등 프라이버시 문제도 예방할 방침이다. 안경을 벗으면 카메라가 자동으로 꺼지는 기능도 들어갔다. 삼성전자의 AI","category":"생활·문화"}],"세계":[{"title":"트럼프 \"대규모 이민행렬 美침공…멕시코, 안막으면 관세 2배\"","link":"https://n.news.naver.com/mnews/article/001/0016439532","naverLink":"https://n.news.naver.com/mnews/article/001/0016439532","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"민주당 향해 \"자신들 부패 감추려고 날 공격…공화당, 치열하게 싸워야\" 트럼프 [AFP=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 도널드 트럼프 미국 대통령은 멕시코에서 미국으로 향하는 대규모 이민자 행렬이 형성됐다면서, 이를 막지 않으면 멕시코에 대한 관세를 두 배로 올리겠다고 경고했다. 트럼프 대통령은 12일(현지시간) 소셜미디어 트루스소셜에 올린 글에서 \"중간선거에서 공화당이 패배한 것으로 인식되는 가운데, 우리나라를 향한 침공이 다시 일어나고 있다\"고 말했다. 트럼프 대통령은 \"거대한 이주민 행렬이 형성되고 있으며, 멕시코를 통과하는 불법 행진을 시작하고 있다\"며 \"이런 이주민 행렬에 속한 많은 사람은 여러 나라가 원하지 않는 사람들\"이라고 주장했다. 트럼프 대통령은 \"멕시코는 당장 그들을 막아야 한다. 그렇게 하지 않으면 멕시코에 대한 관세는 즉시 두 배로 인상될 것\"이라며 \"멕시코, 텍사스 주지사, 매우 진보적인 텍사스의 신임 주지사, 우리의 훌륭한 국경순찰대, 그리고 이민세관단속국(ICE)은 이런 사실을 통보받았다\"고 말했다. 트럼프 대통령은 또 민주당을 \"우리나라 역사상, 심지어 세계 역사상 가장 부패하고 반미적인 정치 지도자들과 정치꾼들로 이뤄진 집단\"이 이끈다면서 \"민주당 지지 성향 주(州)들에서 벌어진 대규모 부패로부터 벗어나기 위해 민주당은 트럼프 행정부가 부패했다고 거듭 주장한다\"고 비판했다. 트럼프 대통령은 \"그것(트럼프 행정부가 부패했다는 주장)은 미네소타, 캘리포니아를 비롯해 미 전역의 민주당 지지 성향 주들에서 발생한 엄청나고 전례 없는 도둑질을 무효로 하기 위해 그들이 거듭해서 악의적으로 사용하는 짧고 강렬한 정치적 문구\"라고 강조했다. 그는 \"민주당원들은 부패하고 사악하며, 나는 그들과 정반대\"라며 \"공화당원들이여, 치열하게 싸워라. 그렇지 않으면 여러분에게는 더 이상 나라가 남아 있지 않을 것\"이라고 말했다. 트럼프 대통령은 \"공화당이 이끄는 상원은 더이상 '법안들이 보내져 죽어버리는 곳'이어선 안 된다\"며 \"하원이 다섯 차례나 상원으로 보낸 '세이브 아메리카 법안'(유권자 신분 검사 강화 법안)을 통과시키지 않은 것은 중간선거에서 공화당에 치명적 타격을 줬다\"고 지적했다. zheng@yna.co.kr","category":"세계"},{"title":"최태원 \"한일경제연대 추진 역량 결집할 '빅텐트' 플랫폼 준비\"","link":"https://n.news.naver.com/mnews/article/001/0016439762","naverLink":"https://n.news.naver.com/mnews/article/001/0016439762","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"'한일경제연대 로드맵 구상 콘퍼런스' 개최…단계별 협력 로드맵 제시 최태원 최종현학술원 이사장(SK그룹 회장) [최종현학술원 제공. 재판매 및 DB 금지] (서울=연합뉴스) 김민지 기자 = 최태원 최종현학술원 이사장(SK그룹 회장)이 한일경제연대를 지속해 추진하기 위한 '빅텐트'(Big Tent)형 상설 협력 플랫폼을 준비하고 있다고 밝혔다. 13일 최종현학술원에 따르면, 최 회장은 지난 12일 최종현학술원과 동아시아연구원이 서울 강남구 한국고등교육재단 콘퍼런스홀에서 공동 개최한 '한일경제연대 로드맵 구상 콘퍼런스'에서 영상 기조연설을 통해 이같이 말했다. 그는 3년 뒤 달성할 경제협력 수준, 5년 뒤 공동 성과를 창출할 산업과 완화해야 할 제도적 장벽, 10년 뒤 기업과 국민이 실질적인 혜택을 체감할 수 있는 경제연대의 모습을 단계별로 구체화하자고 제안했다. 산업별 협력 기회를 발굴하고 인력과 자본의 이동을 제약하는 장벽을 낮추는 등 실현할 수 있는 분야부터 협력을 확대해 비전을 구체적인 실행 전략으로 발전시켜야 한다는 것이다. 그러면서 \"로드맵이 우리가 나아갈 길을 제시한다면, 플랫폼은 그 길을 함께 걸어갈 힘을 모으는 기반이 될 것\"이라며 한일경제연대의 비전을 실행할 협력 주체들의 역량을 결집해야 한다고 강조했다. 현대일본학회와 일본 나카소네 평화연구소(NPI)가 함께 참여한 이번 행사에는 양국의 외교·안보·경제·산업 분야 전문가들이 참석했다. 연구진은 ▲ 경제 안보와 공급망 협력을 중심으로 한 '생존의 연대' ▲ 첨단기술과 산업혁신을 위한 '혁신의 연대' ▲ 문화·인적 교류를 통한 '매력의 연대'를 3대 협력 축으로 제시했다. 손열 연세대 교수는 양국이 경제적 위상의 상대적 하락과 인구 감소라는 구조적 도전에 직면했다고 진단하며, 향후 10년이 경제연대의 향방을 결정할 '결정적 시기'라고 봤다. 그러면서 한일경제연대의 모델로 아세안경제공동체(AEC)형 접근을 제안하며, 올해부터 2045년까지 약 20년에 걸친 로드맵을 통해 단계적으로 개별 협력을 축적하고 분야별 제도를 연결해야 한다고 주장했다. jakmj@yna.co.kr","category":"세계"},{"title":"[인사]기후에너지환경부","link":"https://n.news.naver.com/mnews/article/003/0014319581","naverLink":"https://n.news.naver.com/mnews/article/003/0014319581","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"[세종=뉴시스] ◇과장급 전보 및 신규보임 ▲수자원정책관 물관리총괄과장 김병훈 ▲전력산업정책관실 전력시장과장 홍수경 ▲재생에너지정책관실 태양광산업과장 이주형 ▲전력시장 제도기획단 부단장 김양지 ▲태양광 보급추진단 부단장 김태훈 ▲국립야생동물질병관리원 질병감시팀장 황의정 ▲금강유역환경청 환경관리국장 변상윤 ▲금강유역환경청 유역관리국장 김태연","category":"세계"},{"title":"“관악에서 세계무대까지”···‘그루브 인 관악’ 국제 진출 지원 성과, 전원 4강 진출","link":"https://n.news.naver.com/mnews/article/144/0001149557","naverLink":"https://n.news.naver.com/mnews/article/144/0001149557","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"WDC 2026 FINAL 대회 참가 사진 김규동(G.SENSE), 염도훈(D.SWAVE) [스포츠경향 손봉석 기자] 관악문화재단(대표이사 소홍삼)이 ‘2026 그루브 인 관악’을 통해 추진한 스트릿댄서들의 해외 진출 지원이 국제대회 성과로 이어졌다. 올해 처음으로 국제 스트릿댄스 대회의 한국 공식 예선을 개최한 데 이어, 관악에서 선발된 한국대표 3개 팀이 일본에서 열린 ‘WDC 2026 FINAL’에서 출전한 3개 종목 모두 4강에 진출하며 국제무대에서 경쟁력을 보여줬다. 올해 5주년을 맞은 ‘그루브 인 관악’은 국내 댄서들의 국제무대 진출 기회를 넓히는 데 중점을 뒀다. 재단은 지난 5월 일본 스트릿댄스 전문 문화기업 ‘필인 도쿄(FEELIN TOKYO)’와 업무협약을 체결하고, 국제대회 ‘월드 댄스 콜로세움(World Dance Colosseum, 이하 WDC)’의 한국 공식 예선을 축제 프로그램으로 도입했다. 지난 7월 12일 관악아트홀에서 열린 한국대표 선발전에서는 락킹·왁킹·힙합 3개 종목의 우승팀이 선발됐다. WDC 2026 FINAL 대회 참가 사진 김해린(CELINE) 김수현(SIMMON) (앞)","category":"세계"},{"title":"40년 집권 우간다 대통령…아들이 권력 승계하나","link":"https://n.news.naver.com/mnews/article/001/0016439531","naverLink":"https://n.news.naver.com/mnews/article/001/0016439531","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"여당 일각 반대에 '일단 제동' 무후지 카이네루가바(52) 우간다 군 총사령관[AP=연합뉴스 자료사진. 재판매 및 DB 금지] (요하네스버그=연합뉴스) 나확진 특파원 = 아프리카 우간다에서 40년째 집권하고 있는 요웨리 무세베니(82) 대통령에 이어 그의 아들 무후지 카이네루가바(52) 군 총사령관을 차기 지도자로 내세우려는 움직임이 본격화하고 있다. 여당 일각에서 강한 반대 의견이 제기되면서 일단 제동이 걸린 것으로 보이지만, 무후지 총사령관을 둘러싼 후계 논의는 계속될 것으로 전망된다. 12일(현지시간) AFP 통신에 따르면, 무세베니 대통령은 지난달 말 여당인 국민저항운동(NRM) 핵심 인사들에게 후계 문제를 제기하면서 아들 무후지 총사령관의 지도자 자격을 설명하는 취지의 문건을 전달한 것으로 전해졌다. 이어 지난 10일 NRM은 비공개 집행위원회 회의에서 무후지 총사령관의 후계자 지명 문제를 논의한 것으로 알려졌다. 하지만 참석한 위원 28명 가운데 7명이 표결에 참여해 찬성 4명, 반대 3명이 나온 시점에서 여러 위원이 반대 발언을 했고, 결국 논의가 중단됐다고 AFP는 전했다. 회의에서 캘빈 에초두 NRM 부대표는 무후지 총사령관을 전역시키고 민간 직책을 맡겨 국민과 접촉하며 정치적 경험을 쌓도록 해야 한다고 제안한 것으로 전해졌다. 그는 또 무후지 총사령관이 아직 준비되지 않았다며 무세베니 대통령이 2031년 대선에 다시 출마해야 한다고 말한 것으로 알려졌다. 다만 이 같은 AFP 보도와 관련해 무후지 총사령관의 지지 세력인 애국연맹(PLU)의 다우디 카반다 의원은 12일 \"허위 정보\"라고 반박했다고 현지 온라인 매체 펄스우간다는 전했다. 구체적으로 어느 부분이 허위인지에 대해서는 언급하지 않았다. 앞서 무후지 총사령관은 지난 8월 직접 2031년 대선 출마 의사를 밝혔다. PLU는 그에 대한 전국적인 지지 서명 운동을 벌이고 있다. 요웨리 무세베니(82) 우간다 대통령 [신화=연합뉴스 자료사진. 재판매 및 DB 금지]","category":"세계"},{"title":"'스캔들 파문' 젠슨황 엔비디아 CEO 사실상 해임…33년만에 퇴진(종합)","link":"https://n.news.naver.com/mnews/article/001/0016439530","naverLink":"https://n.news.naver.com/mnews/article/001/0016439530","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"이사회, 전격 사임 발표…中스파이 의심 여성·사내 부사장과 불륜 논란 엔비디아 \"헤아릴 수 없는 기여에 감사\"…젠슨황 향후 역할 밝히지 않아 크레스 CFO, 임시 CEO에 선임…회사안팎 후보 대상 정식 CEO 선임 절차 진행 젠슨 황 엔비디아 CEO [AFP=연합뉴스 자료사진] (워싱턴=연합뉴스) 이유미 특파원 = 미국 인공지능(AI) 반도체 기업 엔비디아의 젠슨 황 최고경영자(CEO)가 중국 스파이 연루 의혹 등 잇단 스캔들에 휩싸인 가운데 12일(현지시간) 전격 퇴진했다. 엔비디아 이사회는 이날 성명을 통해 황 CEO가 사장과 최고경영자, 이사회 이사직에서 즉각 사임한다고 밝혔다. 이사회는 '사임'(resign)이라는 표현을 썼지만, 각종 논란의 중심에 선 황 CEO를 사실상 해임한 것으로 풀이된다. 월스트리트저널(WSJ)과 블룸버그 등 주요 경제 매체들도 젠슨 황이 해임됐다(ousted)고 보도했다. 이사회는 콜레트 크레스 최고재무책임자(CFO) 겸 수석부사장을 임시 CEO로 임명했다. 아울러 하비 C. 존스를 회사 첫 이사회 의장으로 선임했다고 밝혔다. 크레스 임시 CEO는 정식 후임자가 임명될 때까지 임시 CEO를 맡으며 기존 수석부사장과 CFO 직책을 겸임한다. 이사회는 회사 안팎의 후보들을 대상으로 정식 CEO 선임 절차에 착수했다고 밝혔다. 크레스 임시 CEO는 2013년 9월 엔비디아에 합류한 이후 재무 부문을 총괄하며 회사의 성장에 핵심적인 역할을 해왔다. 앞서 시스코와 마이크로소프트 등 주요 기술기업에서 약 25년간 재무 관련 업무를 담당했다. 크레스 임시 CEO는 \"우리 지도부와 함께 젠슨이 지난 33년간 다져온 탁월한 기반을 더욱 공고히 해나갈 것\"이라며 \"엔비디아가 가속 컴퓨팅 및 AI 분야의 선두주자가 될 수 있게 한 노력을 계속 발전시켜 나갈 것\"이라고 밝혔다. 존스 신임 이사회 의장은 30년 이상 기업 경영과 벤처 투자 분야에서 활동해왔으며, 반도체 설계 소프트웨어 기업 시놉시스의 CEO 등을 역임했다. 존스 의장은 \"이사회는 크레스와 경영진을 전적으로 신뢰한다\"며 \"회사의 운영과 고객에 대한 약속, 제품 개발 계획이 차질 없이 이어질 것으로 기대한다\"고 말했다. 엔비디아는 황 CEO가 \"회사와 업계에 헤아릴 수 없을 만큼 큰 기여를 했다\"며 감사를 표했지만, 구체적 사임 이유는 밝히지 않았다. 앞으로 황 CEO가 어떤 역할을 하거나 회사와 어떤 관계를 맺을 지도 공개하지 않았다.","category":"세계"},{"title":"Brooklyn Building Collapse","link":"https://n.news.naver.com/mnews/article/077/0007235783","naverLink":"https://n.news.naver.com/mnews/article/077/0007235783","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"Brooklyn Building Collapse A drone flies over the site of a building that collapsed the previous day in the Brooklyn borough of New York, Thursday, Nov. 12, 2026. (AP Photo/Yuki Iwamura)","category":"세계"},{"title":"‘젠슨 황 후임’ 엔비디아 임시 CEO 콜렛 크레스는 누구?","link":"https://n.news.naver.com/mnews/article/028/0002831999","naverLink":"https://n.news.naver.com/mnews/article/028/0002831999","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"콜렛 크레스 엔비디아 임시 최고경영자(CFO). AFP 연합뉴스 12일(현지시각) 전격 사임한 젠슨 황 엔비디아 최고경영자(CEO)를 대신할 후임으로 콜렛 크레스(59) 엔비디아 최고재무책임자(CFO)가 선임됐다. 엔비디아 이사회는 이날 크레스 최고재무 책임자가 엔비디아 임시 최고경영자(CEO)를 맡는다고 밝혔다. 그는 기존 CFO 직책을 수행하면서 임시 CEO를 맡는다. 엔비디아 이사회는 정식 후임자 선임을 위한 절차에 착수했으며, 내·외부 후보자를 모두 검토할 계획이다. 하비 C. 존스 엔비디아 이사회 의장은 “콜렛 크레스는 엔비디아 사업과 고객, 운영 및 재무 상황에 대한 깊은 이해를 갖추고 있다”며 “엔비디아 이사회는 콜렛 크레스와 경영진을 신뢰하며, 회사 운영과 고객과의 약속, 제품 로드맵은 차질 없이 이어질 것”이라고 밝혔다. 크레스는 마이크로소프트와 시스코 등 주요 기술 기업의 재무 부서에서 25년간 경력을 쌓아온 뒤 2013년부터 엔비디아에 합류해 재무를 책임졌다. 그는 과거 인터뷰에서 엔비디아에 처음 출근했을 당시 자신이 거쳐온 직장 중 가장 작은 회사였다고 회고한 적이 있다. 크레스 최고재무책임자를 임시 최고경영자로 선택한 것은 시장의 충격을 최소화하려는 판단으로 풀이된다. 그는 매 분기 실적 발표 때마다 황 최고경영자와 함께 나와 투자자들을 상대해 왔다. 시장에 익숙한 인물이라는 점에서 단기적인 경영 안정에 적합하다는 평가를 받았을 것으로 보인다.","category":"세계"},{"title":"APTOPIX Climate COP31 Turkey","link":"https://n.news.naver.com/mnews/article/077/0007235781","naverLink":"https://n.news.naver.com/mnews/article/077/0007235781","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"APTOPIX Climate COP31 Turkey Activist Greta Thunberg attends a news conference at the COP31 U.N. Climate Summit, Thursday, Nov. 12, 2026, in Antalya, Turkey. (AP Photo/Khalil Hamra)","category":"세계"},{"title":"China Sun Yat-sen","link":"https://n.news.naver.com/mnews/article/077/0007235780","naverLink":"https://n.news.naver.com/mnews/article/077/0007235780","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"China Sun Yat-sen. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"}],"IT 과학":[{"title":"삼성 AI 안경 베일 벗었다…12월 10일 국내 출시·65만원부터","link":"https://n.news.naver.com/mnews/article/001/0016439479","naverLink":"https://n.news.naver.com/mnews/article/001/0016439479","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"구글 제미나이 탑재…번역·길 안내·회의자료 요약 지원 젠틀몬스터 등 30종 공개…국내에는 16종 출시 (서울=연합뉴스) 박형빈 기자 = 삼성전자가 구글, 젠틀몬스터, 워비파커와 협업한 인공지능(AI) 안경 '인텔리전트 아이웨어'를 공개하고 다음 달 한국과 미국 시장에 출시한다. 삼성전자는 12일(현지시간) 미국 뉴욕에서 젠틀몬스터 16종과 워비파커 14종 등 인텔리전트 아이웨어 전체 라인업 30종을 공개했다. 구글의 AI 제미나이를 탑재해 번역과 길 안내, 회의자료 요약 등을 지원하며, 약 41g의 프레임에 카메라와 스피커, 마이크를 담았다. 이날부터 두 브랜드의 공식 온라인 채널에서 사전 판매를 시작하고 다음 달 10일 정식 출시한다. 국내에는 젠틀몬스터 컬렉션만 선보이며 가격은 모델에 따라 65만∼70만원이다. 삼성전자, 구글·젠틀몬스터·워비파커 협업 인텔리전트 아이웨어 공개 (서울=연합뉴스) 삼성전자는 구글, 젠틀몬스터, 워비파커와 협업한 인텔리전트 아이웨어의 전체 라인업이 12일(현지시간) 미국 뉴욕에서 공개됐다고 13일 밝혔다. 사진은 삼성전자 인텔리전트 아이웨어 젠틀몬스터 디자인. 2026.11.13 [삼성전자 제공. 재판매 및 DB 금지] photo@yna.co.kr 눈앞의 정보 묻고 회의자료 요약…갤럭시 연동해 빅스비도 지원 인텔리전트 아이웨어는 제미나이를 통해 주변 사물에 관한 질문에 답하거나 외국어 메뉴 번역, 길 안내 등을 제공한다. 갤럭시 스마트폰과 연동하면 삼성전자의 AI 음성 비서 빅스비도 사용할 수 있다. 예를 들어 회의 중 화이트보드에 적힌 내용을 아이웨어로 촬영해 제미나이에 요약을 요청하면 결과를 스마트폰의 삼성 노트에 저장할 수 있다. 스마트폰을 꺼내지 않고 주요 알림을 음성으로 전달받거나 메시지에 답하는 것도 가능하다. 갤럭시 스마트폰과는 일부 연산을 나눠 처리하는 '스플릿 컴퓨팅' 구조도 적용됐다. 프레임 왼쪽에는 1천200만 화소 HDR 카메라를 탑재해 AI에 시각 정보를 제공하고 고해상도 사진과 동영상을 촬영할 수 있도록 했다. 양쪽 테에는 개방형 스피커 2개와 마이크 4개를 장착했다. 퀄컴의 스냅드래곤 AR1 1세대 플랫폼을 탑재했으며, 배터리 사용 시간은 1회 충전으로 최대 9시간이다. 충전 케이스를 함께 사용하면 최대 72시간 사용할 수 있다. 호환 기기는 원 UI 9 이상을 탑재한 갤럭시 스마트폰, 안드로이드 17의 올해 9월 업데이트 버전 이상을 적용한 구글 픽셀","category":"IT 과학"},{"title":"“통장에 23원뿐인데”…AI로 9억원 둔갑시켜 판사까지 속였다","link":"https://n.news.naver.com/mnews/article/018/0006409173","naverLink":"https://n.news.naver.com/mnews/article/018/0006409173","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"가상화폐 내역·국시 합격증 AI 조작…보완 수사로 덜미 재판부 \"자신 안위 위해 닥치는 대로 위조…지극히 위험\" [이데일리 김주환 기자] 인공지능(AI)으로 각종 서류를 위조해 사기 행각을 벌인 20대 남성에게 검찰 구형보다 무거운 실형이 선고됐다. 구속영장 심사 과정에서는 위조된 잔액증명서를 내밀어 판사까지 속인 것으로 드러났다. 인공지능을 이용해 위조한 예금 잔액 증명서(위)와 실제 계좌 잔고(아래). (이미지=뉴시스) 12일 법조계에 따르면 부산지법 동부지원 형사3단독(노행남 판사)은 사기와 사문서위조 등 혐의로 기소된 A씨에게 징역 7년을 선고했다. 검찰이 구형한 징역 6년보다 1년 높은 형량이다. A씨는 지난해 7월부터 올해 1월까지 수십억원대 자산을 가진 의사 겸 사업가 행세를 하며 AI로 의사 국가시험 합격증과 가상화폐 거래 내역 등을 조작해 피해자들을 속였다. 이 과정에서 투자금 등 명목으로 피해자 2명으로부터 3억7700만원을 받아 챙긴 혐의로 재판에 넘겨졌다. 위조 범위는 공문서인 불기소 이유통지서부터 사문서인 잔액증명서·금융거래확인서까지 가리지 않았다. 특히 사기 혐의로 구속영장이 청구되자 AI를 이용해 실제 잔액이 23원에 불과한 계좌에 9억여원이 있는 것처럼 잔액증명서를 조작했다. 변호인을 통해 위조된 증명서를 법원에 제출한 A씨는 피해액을 변제할 자금을 확보한 것처럼 주장했다. 법원이 이를 받아들이면서 구속영장은 실제 기각됐다. 그러나 검사의 보완 수사로 해당 증명서의 위조 사실이 드러나면서 A씨는 재청구된 구속영장이 발부돼 결국 구속됐다. 재판부는 A씨가 피해자들로부터 용서받지 못한 데다 피해 회복조차 이뤄지지 않은 점을 지적했다. 노 판사는 “공문서와 사문서를 가리지 않고 자신의 안위를 위해 닥치는 대로 위조한 피고인의 범행은 지극히 위험하다”며 “검찰 구형은 징역 6년이지만 범행 수법이 너무도 위험해 구형보다 높은 형을 선고한다”고 양형 사유를 밝혔다.","category":"IT 과학"},{"title":"AI로 서류 위조, 판사까지 속였다…구형보다 무거운 '징역 7년'","link":"https://n.news.naver.com/mnews/article/015/0005353393","naverLink":"https://n.news.naver.com/mnews/article/015/0005353393","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"AI로 서류 위조, 판사까지 속였다…구형보다 무거운 '징역 7년'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"'99.38점' 세무사 수석에 AI 안경 의혹 확산…\"2차시험 답안지 검토 중\"(종합2보)","link":"https://n.news.naver.com/mnews/article/003/0014319582","naverLink":"https://n.news.naver.com/mnews/article/003/0014319582","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"'99.38점' 세무사 수석에 AI 안경 의혹 확산…\"2차시험 답안지 검토 중\"(종합2보). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"“첫 성관계, 몇 살이 가장 좋을까?”… 과학적으로 ‘이 때’가 적기","link":"https://n.news.naver.com/mnews/article/296/0000107252","naverLink":"https://n.news.naver.com/mnews/article/296/0000107252","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"첫 성관계 늦을수록 성인기 우울증 위험 낮아지는 경향 첫 성관계는 빠를수록 좋을까, 늦을수록 좋을까. 첫 성관계를 경험한 나이가 성인이 된 뒤 정신건강과 관련이 있다는 연구 결과가 나왔다. 사진=게티이미지뱅크 첫 성관계는 빠를수록 좋을까, 늦을수록 좋을까. 첫 성관계를 경험한 나이가 성인이 된 뒤 정신건강과 관련이 있다는 연구 결과가 나왔다. 연구진이 주목한 나이는 19세다. 첫 성관계 시기가 늦을수록 우울증 위험이 낮아지는 경향을 보였지만, 소득과 교육 수준에 따라 그 연관성은 크게 달라졌다. 중국 구이저우중의약대 카이파 탕 박사 연구팀은 첫 성관계 연령과 성인기 우울증 위험의 연관성을 분석한 연구 결과를 국제학술지 《성의학 저널(The Journal of Sexual Medicine)》에 발표했다. 연구진은 미국 국민건강영양조사(NHANES)에 참여한 성인 4907명의 데이터를 분석했다. 조사 자료는 2013년부터 2016년까지 수집됐으며, 참가자들이 처음 성관계를 경험한 나이와 성인기 우울증 증상을 비교했다. 소득, 교육 수준, 흡연 등 건강 관련 행동이 두 요인 사이의 관계에 미치는 영향도 살펴봤다. 분석 결과, 첫 성관계를 늦게 경험한 사람일수록 성인기 우울증 증상이 적은 경향을 보였다. 우울증 위험은 첫 성관계 연령이 높아질수록 17세까지 감소했으며, 이후 약 19세 6개월까지 비슷한 수준을 유지했다. 첫 성관계 시기가 이보다 더 늦어진 사람들에게서는 우울증 위험이 소폭 증가하는 양상이 나타났다. 이러한 연관성은 남녀 모두에게서 관찰됐지만 여성에게서 더욱 뚜렷했다. 소득과 교육 수준, 건강 관련 행동을 통계적으로 반영하자 연관성은 크게 약해졌다. 소득 수준을 고려한 뒤에는 남성에게서 첫 성관계 연령과 우울증 사이의 연관성이 사실상 사라졌지만, 여성에게서는 일부 남아 있었다. 연구진은 두 요인 사이의 관계를 추가로 확인하기 위해 유전정보를 활용한 '멘델 무작위화' 분석도 실시했다. 이는 특정 행동과 관련된 유전적 특성이 질병 위험과 어떤 관계를 보이는지 분석해 인과관계를 추정하는 방법이다. 연구진은 대규모 유전정보 데이터에서 첫 성관계 연령과 관련된 유전적 특성을 찾아 우울증 위험과 비교했다. 초기 분석에서는 첫 성관계 시기가 늦은 것과 관련된 유전적 특성이 일반적인 우울증과 중증 우울증 위험 감소에도 연관된 것으로 나타났다. 하지만 유전적으로 예측한 가구소득을 반영하자 이러한 연관성은 남녀 모두에게서","category":"IT 과학"},{"title":"젠틀몬스터, 안경에 AI 심었다…41g 초경량에 72시간 사용 ‘깜짝’","link":"https://n.news.naver.com/mnews/article/468/0001280679","naverLink":"https://n.news.naver.com/mnews/article/468/0001280679","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"제미나이 탑재…음성 명령으로 AI와 자연스럽게 대화 삼성전자와 하드웨어 협업…약 41g 초경량 설계 구현 안경 2종·선글라스 4종 기반 총 16종 라인업 구성 젠틀몬스터가 뉴욕 퍼블릭 프리뷰를 통해 인텔리전트 아이웨어 컬렉션의 전 라인업을 최초 공개했다. 사진 | 젠틀몬스터 [스포츠서울 | 표권향 기자] 글로벌 패션 아이웨어 브랜드 젠틀몬스터가 패션과 인공지능(AI) 기술을 결합한 새로운 아이웨어를 선보인다. 구글의 AI 모델 제미나이(Gemini)를 탑재하고 삼성전자와 하드웨어 기술 협업을 통해 완성한 제품으로, 안경 하나로 AI와 대화하고 일상 속 다양한 도움을 받을 수 있는 것이 특징이다. 약 41g의 초경량 설계에 최대 72시간 사용 가능한 배터리 성능까지 갖춰 스마트 아이웨어 시장에 새로운 바람을 예고했다. 젠틀몬스터(Gentle Monster)는 뉴욕 퍼블릭 프리뷰(Public Preview)를 통해 인텔리전트 아이웨어(Intelligent Eyewear) 컬렉션의 전체 라인업을 최초 공개했다고 12일 밝혔다. 젠틀몬스터의 인텔리전트 아이웨어 컬렉션은 두 가지 안경과 네 가지 선글라스 프레임을 기반으로 다양한 컬러와 렌즈 조합으로 총 16종으로 구성됐다. 사진 | 젠틀몬스터","category":"IT 과학"},{"title":"'Magician of colors': Lee Dai-won exhibition sets record number of visitors at MMCA Deoksugung","link":"https://n.news.naver.com/mnews/article/640/0000096798","naverLink":"https://n.news.naver.com/mnews/article/640/0000096798","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"More than 300,000 visitors saw the painter’s vibrant works at MMCA Deoksugung, setting a new exhibition record for the venue. Artworks by painter Lee Dai-won are seen on display at the “Nothing Here Makes You Sad” exhibition, a retrospective on Lee, at the National Museum of Modern and Contemporary Art, Korea Deoksugung branch in Jung District, central Seoul. NATIONAL MUSEUM OF MODERN AND CONTEMPORARY ART, KOREA A retrospective of painter Lee Dai-won (1921-2005) has drawn more than 300,000 visitors, the most ever for an exhibition at the National Museum of Modern and Contemporary Art, Korea (MMCA) Deoksugung branch in Jung District, central Seoul, the museum said Thursday. “Lee Dai Won: Nothing Here Makes You Sad” welcomed 300,572 visitors from Aug. 6 to Sunday to top the museum’s previous record of 261,695 visitors in 2023 for “The Most Honest Confession: Chang Ucchin Retrospective.” An average of 3,666 visitors a day — with foot traffic peaking on Sept. 26 at more than 18,000 daily visitors — came to enjoy the first retrospective of Lee featuring some 120 oil paintings and 100 pieces of archival items. The exhibition highlighted 70 years of Lee’s career as an artist. The exhibiti","category":"IT 과학"},{"title":"[올댓차이나] 대만 훙하이 3분기 순이익 34%↑…\"AI 수요에 역대 최고 실적\"","link":"https://n.news.naver.com/mnews/article/003/0014319600","naverLink":"https://n.news.naver.com/mnews/article/003/0014319600","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스]이재준 기자 = 세계 최대 전자기기 위탁생산(EMS) 업체인 대만 훙하이(鴻海) 정밀은 인공지능(AI) 관련 수요 증가에 힘입어 3분기 시장 예상을 웃도는 실적을 거뒀다. 중앙통신과 거형망, 재신쾌보에 따르면 훙하이 정밀은 12일 2026년 7∼9월 3분기 결산에서 순이익이 775억2400만 대만달러(약 3조1343억원)로 전년 동기 576억7300만 대만달러보다 34% 급증했다고 발표했다. 시장 예상치 696억 대만달러를 상회했다. 2분기 599억7400만 대만달러보다는 29% 늘어났다. 주당 순이익(EPS)은 5.51 대만달러로 분기로 사상 최고치를 경신했다. 3분기 연결 매출액은 3조156억3400만 대만달러로 전분기보다 19%, 전년 동기보다 46.5% 증가해 역대 최고를 기록했다. 영업이익도 1153억5000만 대만달러로 전분기에 비해 22%, 전년 동기보다 64% 늘었다. 영업이익률은 3.83%로 전분기 대비 0.07% 포인트, 전년 동기보다 0.4% 포인트 상승했다. 다만 매출 총이익률은 6.02%로 전분기보다 0.1% 포인트, 전년 동기에 비해선 0.33% 포인트 저하했다. 원자재와 부품 가격 상승의 영향을 받았지만 제품 구성 개선과 사업 규모 확대가 핵심 수익성 개선을 이끌었다고 훙하이는 설명했다. 순이익률은 2.57%로 전분기보다 0.2% 포인트 높아졌지만 전년 동기 대비로는 0.23% 포인트 낮았다. 매출과 영업이익, 순이익, 주당순이익은 모두 분기 기준 사상 최고다. 제품별 매출 비중을 보면 클라우드·네트워크 제품이 54%로 가장 컸다. 소비자용 스마트 제품은 29%로 전분기와 같았고 컴퓨터 단말 제품 경우 12%로 2분기 15%보다 줄었다. 부품 및 기타 제품은 5%로 전분기와 동일했다. 1∼3분기 누적 매출은 7조6610억6200만 대만달러로 전년 동기 5조4967억3300만 대만달러보다 39% 늘어나면기 같은 기간으로 사상 최대를 경신했다. 누적 순이익은 1874억1700만 대만달러로 전년 동기 1441억4100만 대만달러에 비해 30% 늘어 역대 동기간 최고치를 기록했다. 누적 주당순이익은 13.35대만달러로 작년 같은 기간의 10.38대만달러를 웃돌았다. 1∼3분기 매출 총이익률은 6.1%로 전년 동기 6.27%보다 0.18% 포인트 저하했다. 영업이익은 2858억200만 대만달러로 65%급증했고 영업이익률은 3.73%로 0.57% 포인트 상승했다. 순이익률은 2.4","category":"IT 과학"},{"title":"SPAIN FASHION","link":"https://n.news.naver.com/mnews/article/091/0010366909","naverLink":"https://n.news.naver.com/mnews/article/091/0010366909","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"Latin American Fashion Week in Madrid A model presents a creation by international fashion platform Colectiva Fashion Leader Mexico during the Latin American Fashion Week (LATAM) runway show in Madrid, Spain, 12 November 2026. The 9th edition of Fashion Week LATAM takes place in Madrid on 12 and 13 November 2026. EPA/SERGIO PEREZ","category":"IT 과학"},{"title":"Film - Maika Monroe","link":"https://n.news.naver.com/mnews/article/077/0007235782","naverLink":"https://n.news.naver.com/mnews/article/077/0007235782","pubDate":"2026-11-12T12:00:00+09:00","author":"네이버뉴스","description":"Film - Maika Monroe This image released by Bleecker Street shows Maika Monroe in a scene from \"Victorian Psycho.\" (Helen Sloan/Bleecker Street via AP) AP PROVIDES ACCESS TO THIS THIRD PARTY PHOTO SOLELY TO ILLUSTRATE NEWS REPORTING OR COMMENTARY ON FACTS n.news.naver.com/mnews/article/055/0001402358","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"전남광주 북구 아파트 화재로 1명 심정지…입주민 '방화 혐의'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"정읍 내장산서 사진 찍던 60대, 1.5m 높이 추락해 발목 골절","link":"https://n.news.naver.com/mnews/article/003/0014316909","naverLink":"https://n.news.naver.com/mnews/article/003/0014316909","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 119 구급대 출동 삽화. (사진=뉴시스 DB). photo@newsis.com *재판매 및 DB 금지 [정읍=뉴시스]강경호 기자 = 11일 오후 1시28분께 전북 정읍시 내장산을 찾은 방문객 A(60대·여)씨가 1.5m 높이에서 떨어졌다. 이 사고로 A씨는 오른쪽 발목 골절상 등을 입고 병원에 옮겨졌다. 소방당국은 당시 A씨가 사진을 촬영하던 중 추락한 것으로 추정하고 있다.","category":"사건 사고"},{"title":"전남광주 아파트 화재로 14명 중경상...40대 남성 입건","link":"https://n.news.naver.com/mnews/article/052/0002431589","naverLink":"https://n.news.naver.com/mnews/article/052/0002431589","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"자신이 살고 있던 아파트에 불을 질러 14명을 다치게 혐의를 받는 40대 남성이 경찰에 입건됐습니다. 광주 북부경찰서는 방화치상 혐의로 40대 남성 A 씨를 입건해 조사할 예정이라고 밝혔습니다. A 씨는 오늘(11일) 오후 6시 반쯤 전남광주 북구에 있는 아파트 6층에서 자신이 거주하던 작은방에 불을 지른 혐의를 받습니다. 이 불로 70대 남성 경비원이 13층 계단참에서 심정지 상태로 발견돼 병원으로 옮겨졌고, 주민 13명이 의식 저하와 연기 흡입 등 크고 작은 부상을 입었습니다. 경찰은 함께 살던 어머니로부터 A 씨가 불을 지른 것 같단 진술을 확보했는데, 연기를 마신 A 씨의 치료 상황을 지켜보며 조사 일정과 구속영장 신청 여부를 결정할 방침입니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사건 사고"},{"title":"전주 다가구주택 화장실서 화재…비데 전기적 요인 발화 추정","link":"https://n.news.naver.com/mnews/article/014/0005603012","naverLink":"https://n.news.naver.com/mnews/article/014/0005603012","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"11일 오후 5시 55분께 전북 전주시 완산구 중화산동의 한 다가구주택 4층의 세대 내 화장실에서 불이 났다. /사진=전북소방 [파이낸셜뉴스] 11일 오후 5시 55분께 전북 전주시 완산구 중화산동의 한 다가구주택 4층 세대 내 화장실에서 불이 났다. 신고를 받고 출동한 소방 당국은 펌프차 등 장비 14대와 인력 38명을 투입해 발화 20여 분 만에 불을 완전히 껐다. 이 불로 다행히 다친 사람은 없었으나 화장실 내부(6㎡)와 비데, 욕실용품 등이 불에 타 소방서 추산 545만 원 상당의 재산 피해가 발생했다. 경찰과 소방 당국은 화장실 비데에서 전기적 요인으로 인해 불이 시작된 것으로 보고, 정확한 화재 원인과 사건 경위를 조사하고 있다.","category":"사건 사고"},{"title":"절도 사건 9개월 방치한 경찰…알고 보니 미성년 아들 연루","link":"https://n.news.naver.com/mnews/article/008/0005439916","naverLink":"https://n.news.naver.com/mnews/article/008/0005439916","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"미성년 아들이 연루된 절도 사건을 담당하고 9개월간 처리하지 않은 경찰관이 수사를 받고 있다./사진=김현정 디자인기자 미성년 아들이 연루된 절도 사건을 담당하고 9개월간 처리하지 않은 경찰관이 수사받고 있다. 대전경찰청 반부패경제범죄수사대는 대전 한 경찰서 소속 경위 A씨를 직무 유기 혐의로 입건해 수사 중이라고 11일 밝혔다. A씨는 올해 초 자신의 아들을 포함한 미성년자 2명이 저지른 절도 사건을 배당받고도 9개월간 처리하지 않은 혐의를 받는다. A씨는 지난 9월 '장윤기 사건'을 계기로 수사관의 가족이 관계인인 사건은 다른 관서로 이송하게 하는 상피제가 시행됐음에도 자진 신고하지 않고 처리를 미뤄온 것으로 전해졌다. 이 사실은 해당 사건이 6개월이 지나 장기 사건으로 분류돼 팀 내 분석 회의가 진행되는 과정에서 내부 직원이 청문 감사 부서에 신고하면서 드러난 것으로 파악됐다. 경찰은 최근 A씨를 직위해제하고 고의로 수사를 미뤘는지 여부를 살피고 있다.","category":"사건 사고"},{"title":"10대 살해한 50대 입 닫아 조사 난항…얽히고설킨 사이(종합2보)","link":"https://n.news.naver.com/mnews/article/001/0016437007","naverLink":"https://n.news.naver.com/mnews/article/001/0016437007","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"광주 아파트서 40대 주민 방화…경비원 심정지·주민들 중경상","link":"https://n.news.naver.com/mnews/article/437/0000520319","naverLink":"https://n.news.naver.com/mnews/article/437/0000520319","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"광주 아파트서 40대 주민 방화…경비원 심정지·주민들 중경상. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"전남광주 북구 아파트서 불‥주민 방화 혐의로 입건","link":"https://n.news.naver.com/mnews/article/214/0001534999","naverLink":"https://n.news.naver.com/mnews/article/214/0001534999","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[사진출처 : 김해빈님] 전남광주 북구 아파트에서 발생한 화재가 주민의 방화에서 시작된 것으로 파악됐습니다 광주 북부경찰서는, 이 아파트에 살던 40대 남성에 대해 고의로 자신의 집에 불을 지른 혐의로 조사 중입니다. 오늘(11일) 오후 6시 반쯤 북구 운암동의 한 아파트 6층에서 불이 났는데, 이곳에 살던 남성의 어머니가 경찰 조사에서 \"아들이 불을 냈다\"는 취지로 말한 것으로 전해졌습니다. 이 불로 70대 경비원이 아파트 비상계단에서 심정지 상태로 발견돼 병원으로 옮겨졌으며, 불을 지른 혐의를 받는 남성도 연기를 흡입해 병원에서 치료를 받고 있습니다.","category":"사회"},{"title":"경기도, 내년도 살림 짜기…'생명·안전'과 취약계층 예산 최우선 편성","link":"https://n.news.naver.com/mnews/article/030/0003484770","naverLink":"https://n.news.naver.com/mnews/article/030/0003484770","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"민주당 도당과 국회 인근서 간담회…의원 등 38명 참석 재정난 극복 위해 지방세제 개편과 국비 확보에 힘 모아 추미애 경기지사(앞줄 오른쪽)가 10일 오후 국회 인근에서 서영석 민주당 경기도당 위원장을 만나 지방세제 개편 등 재정위기 대응 방안을 논의하고 기념 촬영했다. 경기도 제공. 경기도와 더불어민주당 경기도당이 내년 민생예산과 국비 확보에 힘을 모으기로 했다. 경기도는 지난 10일 오후 국회 인근에서 민주당 경기도당과 '예산협력 간담회'를 열고 지방세제 개편 등 재정위기 대응 방안을 논의했다고 11일 밝혔다. 간담회에는 추미애 지사와 서영석 민주당 경기도당 위원장, 도당 소속 국회의원과 원외 지역위원장 등 38명이 참석했다. 추 지사는 도의 재정난과 세입·세출 구조의 한계를 설명하고 지방세제 개편에 당 차원의 지원을 요청했다. 참석자들은 도가 내년 본예산에 민생사업을 우선 반영하겠다는 방침에 뜻을 같이하고, 지방정부의 재정 자율성을 높이기 위한 세제 개편과 국비 확보에 협력하기로 했다. 추 지사는 지난 8월 상당수 민생·필수사업의 올해 예산이 9개월분만 편성됐다며 재정 비상 상황을 선언했다. 경기도와 경기연구원은 이후 추가경정예산으로 남은 3개월분 사업비를 확보했으나 재정난을 초래한 세입·세출 구조는 여전히 개선이 필요하다고 진단했다. 도는 조만간 2027년도 본예산안을 경기도의회에 제출하고 편성 방향과 주요 내용을 도민에게 알릴 예정이다. 서 위원장은 인구 증가와 고령화가 동시에 진행되는 경기도의 여건에 맞춰 지방재정 정책을 마련해야 한다며 참석자들에게 협력을 당부했다. 추미애 지사는 “가능한 모든 방안을 동원해 생명·안전, 취약계층 관련 예산을 최우선으로 편성하겠다”고 말했다.","category":"사회"},{"title":"\"출근 했는데 일을 못 하고 있어요\" 기업들 업무 마비…MS 주요 서비스 대규모 장애","link":"https://n.news.naver.com/mnews/article/277/0005842229","naverLink":"https://n.news.naver.com/mnews/article/277/0005842229","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"MS 아웃룩·코파일럿 등 대규모 장애 미국서 장애 신고 13만 건 넘어 국내 기업 업무도 마비 마이크로소프트의 이메일과 사무용 온라인 소프트웨어·인공지능(AI) 서비스 등에 대규모 접속 장애가 발생했다. 미국뿐 아니라 국내 기업에서도 이메일과 협업 도구가 작동하지 않는 등 업무에 차질을 빚었다. 마이크로소프트(MS) 이미지. 로이터연합뉴스 12일(현지시간) 온라인 서비스 장애 모니터링 사이트 다운디텍터에 따르면 미 동부시간 오후 1시20분 기준 메일 서비스인 아웃룩 관련 접속 장애 신고가 13만건을 넘어섰다. 이용자들은 이메일 수발신 지연과 계정 접속 불가 등 불편을 호소하고 있다. 이번 장애는 이메일뿐 아니라 AI 서비스 코파일럿과 사무용 온라인 플랫폼인 MS365, 화상회의·메신저 서비스 팀즈 등에도 영향을 미쳤다. 국내 기업에서도 불편이 잇따랐다. 국내 한 IT 업체 관계자는 \"MS 글로벌 장애로 현재 서비스 이용이 불가능한 상황\"이라고 전했다. MS 측은 사회관계망서비스(SNS)를 통해 \"인프라 부하가 증가한 것이 확인됐다\"며 \"이것이 연결 오류의 원인으로 추정된다\"고 밝혔다. 이어 이와 같은 인프라 부하를 분산하기 위해 접속 트래픽 등을 재분배하는 등 복구 작업에 착수했다고 덧붙였다.","category":"사회"},{"title":"대전 유성구 아파트서 불…주민 5명 대피","link":"https://n.news.naver.com/mnews/article/055/0001402357","naverLink":"https://n.news.naver.com/mnews/article/055/0001402357","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"대전 유성구 아파트서 불…주민 5명 대피. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"주민이 불지른 광주전남 아파트···불은 껐지만 경비원 심정지로 발견","link":"https://n.news.naver.com/mnews/article/032/0003482187","naverLink":"https://n.news.naver.com/mnews/article/032/0003482187","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"전남광주 북구에서 11일 오후 6시33분쯤 발생한 아파트 화재. 전남광주통합소방본부 제공 11일 전남광주 북구 아파트에서 발생한 화재는 주민의 방화에서 시작된 것으로 밝혀졌다. 광주 북부경찰서는 현주건조물방화 혐의로 A씨(40대)를 입건해 조사 중이다. A씨는 이날 오후 6시33분쯤 전남광주 북구 운암동 한 아파트 6층 자신의 집에 불을 낸 혐의를 받는다. 당시 어머니 B씨(70대)와 함께 집에 있던 A씨는 라이터로 옷가지에 불을 붙인 것으로 조사됐다. B씨는 경찰 조사에서 “아들이 불을 냈다”는 취지로 말한 것으로 알려졌다. 불은 30여분 만에 진화됐지만, 70대 경비원이 아파트 비상계단에서 심정지 상태로 발견돼 병원으로 옮겨졌다. 진화 작업을 하던 소방관 1명도 어지럼증을 호소해 병원 치료를 받았다. 주민 12명도 연기를 마셔 병원으로 옮겨졌다. A씨도 연기를 마셔 병원 치료를 받고 있다. 생명에 지장은 없는 것으로 전해졌다. 경찰은 A씨가 불을 지른 경위와 경비원의 행적 등을 조사하고 있다.","category":"사회"},{"title":"[서아람의 법스타그램] [14] 법조인들의 자녀 교육","link":"https://n.news.naver.com/mnews/article/023/0004009074","naverLink":"https://n.news.naver.com/mnews/article/023/0004009074","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"/AI 생성 이미지 법대 시절, 동기로부터 특이한 얘기를 들은 적이 있다. 그 친구의 아버지는 판사였는데, 법대 입학을 강경하게 반대했다는 것이다. ‘돈도 못 버는데 스트레스란 스트레스는 다 받고 욕도 왕창 먹는’ 직업을 딸에게 물려주고 싶지 않다며, 더 ‘편하고 우아한’ 직업을 고르라고 진지하게 말씀하셨다고 한다. 요즘 말로 하면 워라밸 좋은, 꿀 빠는 직종을 찾으라는 뜻이었겠지. 지금은 그 마음을 충분히 이해한다. 주말에 야근하던 검사들이 야식을 먹으러 간 적이 있었다. 10시가 넘은 시각이었고, 다들 초췌한 몰골에 행색은 초라했으며 기분은 우울했다. 그때 뉴스에서 수능 만점자 뉴스가 나왔다. “우와, 대단하다. 쟤는 나중에 뭐가 될까.” 한 검사가 감탄하자 다른 검사가 시니컬하게 대꾸했다. “뭐 그래 봤자 우리처럼 되겠죠.” 아닌 게 아니라 맞는 말이라서 다들 꿀 먹은 벙어리가 됐다. 모두가 부러워하는 전문직도, 막상 되고 나면 시달리고 치이고 밀리는 직장인일 뿐임을 실감한 순간이었다. 드라마나 영화에 나오는 법조인들은 자식을 명문대에 보내 법조인으로 만들려고 열혈 사교육을 퍼붓는 모습으로 그려지곤 한다. 드라마 ‘스카이캐슬’에 나온, 인간 사회는 피라미드라고 핏대를 세우던 검사 아빠처럼 말이다. 현실은 딱히 그렇진 않다. 내가 겪어 본 바로는, 법조인 중 극성 부모의 비율은 일반적인 비율과 비슷한 것 같다. 어린 나이부터 아이를 영어 놀이학교, 영어유치원, 국제학교에 보내면서 “교육이야말로 가장 저렴한 상속”이라 외치기도 하지만, 그건 부모가 법조인이어서가 아니라 그들의 성향과 가치관이 그렇기 때문이다. 법조인 부모들이 교육에 집착하지 않게 되는 경로가 몇 가지 있다. 내가 공부 잘 해 봤는데 그게 마냥 행복한 건 아니더라, 잘 놀고 추억을 많이 쌓으며 자라는 게 중요하다, 라고 하는 경우도 있고, 업무에 너무 바빠서 아이 학원까지 챙기기 어려운 경우도 있고, 유전자가 승리할 거라고 믿고 자만하는 경우도 있다. 물론 경제적 여유가 없는 경우도 있다. 학원 공화국인 이 나라의 사교육 비용은, 판검사뿐만 아니라 작은 사무실을 운영하는 변호사들에게도 굉장한 부담이다. 나는 요즘 두 아이의 영어 학원비를 결제할 때마다, 검사로 임관하기 전 검찰 교수님과의 식사 자리에서 들은 얘기가 떠오른다. 그분께 월급을 얼마나 받으시는지 질문했더니 대답이 이랬다. “사과나 배는 맘껏 사 먹어. 망고는 동남아 갔을 때만 먹고.","category":"사회"},{"title":"경주시, 미국 진출 일지테크와 투자협력 속도","link":"https://n.news.naver.com/mnews/article/022/0004174486","naverLink":"https://n.news.naver.com/mnews/article/022/0004174486","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"주낙영 시장 등 경주투자유치대표단, ITAC 방문해 업무협약 체결 경주·앨라배마 생산거점 교류 확대 및 글로벌 공급망 협력 추진 경북 경주시가 미국에 생산거점을 둔 자동차부품 기업 일지테크와 전략적 투자 파트너십을 맺고, 미국 현지 사업 성과를 경주지역 후속 투자로 연결하기 위한 협력에 적극 나섰다. 주낙영 경주시장이 9일(현지시간) 미국 앨라배마주 일지테크 미국법인 ITAC 공장에서 황찬권 법인장에게 생산시설에 대한 설명을 듣고 있다. 경주시 제공 경주시는 9일(현지시간) 미국 앨라배마주 루번에 있는 일지테크 미국법인 ITAC를 방문, 국내외 생산거점 간 공급망 협력과 경주지역 투자 확대 방안을 논의했다고 11일 밝혔다. 이번 방문은 미국 투자유치대표단의 첫 공식 일정이다. 주낙영 경주시장과 임활 경주시의회 의장, 주동열 경주시의회 경제산업위원장, 주광일 일지테크 본부장, 황찬권 ITAC 법인장 등이 참석했다. 일지테크는 경산에 본사를 둔 자동차 차체부품 제조기업으로, 경주에 공장 4개를 운영하고 있다. 특히 국내복귀투자 보조금 사업으로 추진한 경주3공장은 미국 현지공장으로 이어지는 공급망을 구축하고 있다. 미국 앨라배마주 일지테크 미국법인 ITAC에서 열린 전략적 투자파트너십 업무협약식에서 참석자들이 기념촬영을 하고 있다. 사진 왼쪽부터 주광일 일지테크 본부장, 개리 스포트 ITAC 관리실장, 황찬권 ITAC 법인장, 주낙영 경주시장, 임활 경주시의회 의장, 주동열 경주시의회 경제산업위원장, 이상걸 경주상공회의소 회장.","category":"사회"},{"title":"경기혁신센터, 판교에서 예비창업자·창업기업 일대일 맞춤 상담 43건","link":"https://n.news.naver.com/mnews/article/030/0003484771","naverLink":"https://n.news.naver.com/mnews/article/030/0003484771","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"경기혁신센터, 판교에서 예비창업자·창업기업 일대일 맞춤 상담 43건. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"이용철, 청와대 비서관 때 '5·18 보상금' 신청…\"일반적인 수준으로 진행\"","link":"https://n.news.naver.com/mnews/article/055/0001402364","naverLink":"https://n.news.naver.com/mnews/article/055/0001402364","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"이용철, 청와대 비서관 때 '5·18 보상금' 신청…\"일반적인 수준으로 진행\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"52kg 한가인, 아들딸 낳고도 ‘납작배+복근’⋯집에서 따라하는 ‘이 운동’은?","link":"https://n.news.naver.com/mnews/article/296/0000107197","naverLink":"https://n.news.naver.com/mnews/article/296/0000107197","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[셀럽헬스] 한가인의 10분 복부 운동 한가인은 납작한 배와 복근을 유지하는 운동 방법으로, 트레이너와 약 10분 분량의 복부 운동을 소개했다. 사진=유튜브 채널 '자유부인 한가인' 배우 한가인이 탄탄한 복부를 유지하기 위해 실천하는 운동 루틴을 공개했다. 최근 유튜브 채널 '자유부인 한가인'에 키 168.7cm, 체중 52kg인 한가인의 복부·하체 운동을 담은 영상이 올라왔다. 제작진이 \"복근 공개 가능하냐\"고 묻자, 한가인은 \"만져보면 있다\"고 답하며 자신감을 보였다. 한가인은 납작한 배와 복근을 유지하는 운동 방법으로 트레이너와 약 10분 분량의 복부 운동을 소개했다. 크런치와 바이시클 킥, 사이드 펜듈럼 스윙이 포함된 루틴으로, 트레이너는 허리 부담을 고려해 동작을 구성했다고 설명했다. 집에서도 시도할 수 있지만, 처음부터 10분을 쉬지 않고 채울 필요는 없다. 배에 힘이 들어가는지, 목과 허리로 버티고 있지는 않은지 살피는 것이 먼저다. 동작을 크게 하려 애쓰기보다 자세가 흐트러지기 전에 쉬어가야 운동을 꾸준히 이어가기 쉽다. 사진=유튜브 채널 '자유부인 한가인'","category":"생활·문화"},{"title":"크랜베리, CES 2027 인공지능 부문 혁신상 수상…음원분석 기술력 인정","link":"https://n.news.naver.com/mnews/article/030/0003484748","naverLink":"https://n.news.naver.com/mnews/article/030/0003484748","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"소리로 위험 감지하는 인공지능 안전관리 솔루션 ‘소브릭’ 혁신상 선정 360도 음원 위치 추적·실시간 위험음 분석…북미 공공·산업안전 시장 공략 인공지능(AI) 음원분석 전문기업 크랜베리가 세계 최대 정보기술(IT)·가전 전시회 'CES 2027'에서 인공지능 부문 혁신상을 수상하며 글로벌 안전관리 시장 진출에 속도를 낸다. 크랜베리(대표 이은혜)는 자체 개발한 인공지능 음원분석 통합 솔루션 '소브릭(SOBRIC)'이 CES 2027 혁신상 인공지능 부문 수상작으로 선정됐다고 11일 밝혔다. CES 혁신상은 미국 소비자기술협회(CTA)가 매년 CES 개막에 앞서 기술력과 디자인, 혁신성 등을 종합 평가해 수여하는 상이다. 소브릭은 인공지능 기반 음원분석 기술과 현장 대응 시스템을 결합한 기술력을 인정받았다. 소브릭은 기존 영상 중심의 안전관리 체계를 소리 영역으로 확장한 멀티모달 안전관리 시스템이다. 카메라 사각지대에서 발생하거나 영상만으로 파악하기 어려운 위험 상황을 소리로 감지해 신속한 대응을 지원한다. 핵심 기술은 음원 탐지부터 위치 추적, 위험 판단, 경보 전달까지 이어지는 통합 처리 기능이다. 서로 연결된 2대의 엣지 인공지능(Edge AI) 장비가 360도 전 방향에서 발생하는 소리의 위치를 추적하고 비명, 총성, 폭발음, 낙상 등 위험음을 실시간으로 분류한다. 긴급 구조요청을 나타내는 음성 키워드도 감지할 수 있다. 위험 상황이 감지되면 팬·틸트·줌(PTZ) 카메라가 소리 발생 지점으로 자동 회전하고 영상관리시스템(VMS)과 통합 관제 플랫폼에 경보를 전달한다. 서버에서는 구조요청 언어와 긴급 의도를 분석해 번역 메시지를 생성함으로써 외국인의 구조요청에도 대응할 수 있도록 했다. 영상 촬영이 제한되는 공간에서도 활용할 수 있다. 카메라 설치가 어려운 곳에서는 음원분석만으로 위험 상황을 판단하고 영상 활용이 가능한 환경에서는 음원분석 결과와 영상 객체 정보를 결합해 감지 정확도를 높이는 방식이다. 크랜베리는 그동안 지방자치단체 공공안전과 도시 안전관리, 산업시설 등에 음원분석 기술을 적용하며 현장 데이터를 축적해 왔다. 이를 기반으로 위험음 인식 알고리즘과 엣지 인공지능 기반 실시간 분석 기술을 고도화한 것이 이번 수상으로 이어졌다는 설명이다. 소브릭의 기술 고도화 과정에는 크랜베리와 숭실대학교 인공지능융합연구원의 공동 연구 성과 일부도 활용됐다. 해당 연구는 과학기술정보통신부와 정보통신기획평가원이","category":"생활·문화"},{"title":"대구 달서구, 청년부부 결혼축하금 신청","link":"https://n.news.naver.com/mnews/article/016/0002722282","naverLink":"https://n.news.naver.com/mnews/article/016/0002722282","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"달서구 청년 부부 결혼축하금 신청 홍보 포스터.[대구 달서구 제공] [헤럴드경제(대구)=김병진 기자]대구 달서구는 올해로 지원이 마무리되는 ‘청년 부부 결혼축하금 지원 사업’ 신청을 다음달 15일까지 받는다고 11일 밝혔다. ‘청년부부 결혼축하금 지원 사업’은 지원 요건을 충족한 달서구 거주 청년부부에게 온누리상품권 30만원을 지급하는 사업이다. 지원 대상은 혼인신고일 기준 부부 모두 19~39세로, 부부 중 한 명 이상이 초혼이고 한 명 이상이 내국인이어야 한다. 또 혼인신고 후 부부 모두 달서구에서 6개월 이상 계속 거주하고 지급일까지 달서구에 주민등록을 유지해야 한다. 신청은 혼인신고일로부터 12개월 이내에 관할 동 행정복지센터 또는 달서구청 가족정책과를 방문해 접수할 수 있다. 예산 소진 시 조기 마감될 수 있다. 대구 달서구 관계자는 “어려운 재정여건 속에서도 올해까지 결혼축하금 지원을 이어가고 있다”며 “이어 앞으로도 그동안 추진해 온 결혼친화 정책을 바탕으로 청년들의 만남과 결혼을 지원하는 다양한 사업을 지속적으로 이어갈 계획”이라고 말했다.","category":"생활·문화"},{"title":"연간 방한객, 사상 최초 2천만명 돌파했다…\"관광대국 출발점\"","link":"https://n.news.naver.com/mnews/article/422/0000925501","naverLink":"https://n.news.naver.com/mnews/article/422/0000925501","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"명동을 찾은 외국인 관광객 모습 [연합뉴스 자료사진] 올해 한국을 방문한 외국인 관광객이 사상 최초로 2천만 명을 돌파했습니다. 문화체육관광부는 \"연간 방한 관광객 2천만 명은 한국 관광이 한 차원 새로운 단계로 도약했음을 뜻하는 성과로 연말까지 남은 기간 갱신되는 수치 역시 모두 새로운 기록으로 남게 된다\"고 강조했습니다. 이는 지난 2012년 방한객 1천만명을 달성한 이후 14년 만에 거둔 성과입니다. 올해 1~9월 외국인의 관광 분야 소비액은 15조 9,416억 원으로, 지난해 같은 기간보다 47.7% 급증했습니다. 같은 기간 비수도권 공항과 항만으로 입국한 방한객도 각각 324만 명, 158만 명으로, 작년보다 37.4%, 14.5% 늘었습니다. 문체부는 이러한 성과가 'K-컬처'의 세계적인 확산과 범부처 협조 체계 확립, 국민의 성숙한 환대 정신이 어우러진 결과라고 설명했습니다. 해외한류실태조사에 따르면 작년 말 기준 '자국에서 한류 콘텐츠가 인기 있다'는 비율은 음악(54%), 드라마(51%), 영화(49%), 음식(55%), 미용(53%) 등으로 50% 전후를 기록했습니다. 한류가 한국 제품·서비스 구매에 긍정적 영향을 미친다는 응답률은 65%로, 3년 연속 성장했습니다. 문체부는 방한 관광 2천만명 시대를 맞아 기념행사와 업계 간담회, 언론 기고, 지방 국제 공항 환대 행사 등을 계획하고 있습니다. 최휘영 문체부 장관은 \"외국인 관광객 2천만명 돌파는 '대체 불가 관광대국'으로 도약하는 출발점\"이라며 \"다음 달까지 전대미문의 성과를 국민과 공유해 자부심을 높이고, 방한 관광객 3천만명 시대 달성과 4천만명 시대를 향한 수용 태세를 준비하겠다\"고 말했습니다. #관광객 #2천만명 #문화체육관광부 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"생활·문화"},{"title":"KT텔레캅, 독거노인·장애인 10만 가구에 AI 돌봄 서비스","link":"https://n.news.naver.com/mnews/article/029/0003058625","naverLink":"https://n.news.naver.com/mnews/article/029/0003058625","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"KT텔레캅, 독거노인·장애인 10만 가구에 AI 돌봄 서비스. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"속초 대포항 국가 거점어항 선정…수산물류·해양관광 거점 육성","link":"https://n.news.naver.com/mnews/article/021/0002832227","naverLink":"https://n.news.naver.com/mnews/article/021/0002832227","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"5년간 총 950억 원 투입, 동해안권 핵심 경제축 재편 대포항 국가 거점어항 조성 기본계획. 강원도 제공 속초=이성현 기자 강원 속초시 대포항 일대가 수산물류·관광·청년을 연계한 동해안 해양 복합 거점으로 육성된다. 강원도는 해양수산부 주관 국가 거점어항 조성사업 최종 평가에서 대포항이 전국 1순위로 최종 확정됐다고 12일 밝혔다. 이번 공모 선정에 따라 대포항 일대에는 향후 5년간 총사업비 950억 원을 투입해 국가 거점어항 조성사업이 추진된다. 주요사업은 산지 거점 수산물 유통센터, 어선 접안 인프라 확충 및 안전시설 현대화, 친환경 수산물 위판 및 콜드체인 구축, 해양 친수 공간 및 관광 편의시설 조성 등이다. 특히 도는 별도의 공모사업에 선정된 ‘청년 바다마을 조성사업’을 이번 국가 거점 어항 기본계획에 포함해 시너지를 높였다. 청년 임대주택과 주민공동시설 조성, 맞춤형 일자리 및 어업 기술 전수를 연계해 어촌에 지속 가능한 활력을 불어넣을 계획이다. 도는 이번 사업을 계기로 대포항을 단순한 어항의 기능을 넘어 수산물류와 해양관광이 유기적으로 결합된 동해안권 핵심 경제축으로 재편한다. 이를 통해 지역 경제에 새로운 부가가치를 창출하는 해양복합 거점으로 육성한다는 구상이다. 우상호 강원지사는 “사업을 속도감 있게 추진해 대포항의 산업 경쟁력을 한 단계 높이고 수산업과 관광이 동반 성장하는 지속가능한 해양경제 거점으로 완성하겠다”고 말했다.","category":"생활·문화"},{"title":"경기도 '철도 40개·83조원' 건의…추미애 지사, 13일 '철도 확충' 건의","link":"https://n.news.naver.com/mnews/article/030/0003484768","naverLink":"https://n.news.naver.com/mnews/article/030/0003484768","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"광역철도 29개로 최다…일반철도 8개·고속철도 3개 '코레일+'에서 사전 설문…유튜브 실시간 댓글로도 참여 추미애 경기지사(오른쪽)가 10월2일 서울 국토발전전시관에서 홍지선 국토교통부 장관을 만나 경기도가 건의한 40개 철도 사업을 '제5차 국가철도망 구축계획'에 최대한 반영해달라는 내용의 요청서를 전달하고 기념 촬영했다. 경기도 제공. 추미애 경기지사가 오는 13일 정부에 약 83조원 규모의 철도사업 40개를 국가계획에 반영해 달라고 건의할 예정이다. 경기도는 추 지사가 이날 오전 서울 전문건설회관에서 열리는 '제5차 국가철도망 구축계획 국민 의견수렴 행사'에 직접 참석한다고 11일 밝혔다. 도가 정부에 제출한 사업은 광역철도 29개, 일반철도 8개, 고속철도 3개다. 추 지사는 행사에서 도민들이 겪는 출퇴근 불편을 전하고, 이동권을 보장하고 통근 시간을 줄이려면 철도망을 확충해야 한다는 점을 강조할 예정이다. 앞서 추 지사는 기획예산처 장관과 국토교통부 장관을 잇달아 만나 도내 교통 여건을 설명하고 정부 지원을 요청했다. 제5차 국가철도망 구축계획은 2026년부터 2035년까지 10년간 국가 철도망 확충 방향을 정하는 법정계획이다. 국토교통부는 계획 수립에 앞서 지방정부와 전문가, 국민의 의견을 듣는다. 행사는 주관 기관인 한국교통연구원의 주제 발표에 이어 지방정부 의견 발표, 전문가 토론, 국민 의견수렴 순으로 진행된다. 국토부 사전 설문에는 오는 13일까지 경기도와 국토부 누리집, 철도 통합 앱 '코레일+'에 게시된 QR코드를 통해 참여할 수 있다. 행사 당일에는 국토부 공식 유튜브 채널에서 생중계를 보며 실시간 댓글로 의견을 낼 수 있다. 경기도는 건의한 사업이 국가계획에 반영될 수 있도록 국토부와 기획예산처, 국회, 시군과 협의를 이어갈 방침이다.","category":"생활·문화"},{"title":"임종식 경북교육감, 포항 학부모들과 교육정책 간담회","link":"https://n.news.naver.com/mnews/article/022/0004174470","naverLink":"https://n.news.naver.com/mnews/article/022/0004174470","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"포항시학부모회장협의회 회원 40여 명 참석, 도교육청 견학 학생 성장 위한 학부모 역할과 협력 방안 등 다앙한 논의 학부모 교육 참여 역량 높이고 교육행정기관과 협력 강화 다짐 경북교육청이 포항지역 학부모들과 만나 주요 교육정책을 공유하고 교육 현장의 다양한 의견을 들었다. 경북교육청은 11일 도교육청 화백관에서 포항시학부모회장협의회 회원 40여 명과 함께 교육정책 소통 행사를 가졌다고 밝혔다. 임종식 경북교육감이 포항시학부모협의회와 교육정책을 소통하고 있다. 경북교육청 제공 이번 행사는 포항시학부모회장협의회의 역량강화 체험연수의 하나로, 학부모의 교육 참여 역량을 높이고 학부모와 교육행정기관 간 소통과 협력 체계를 강화하기 위해 마련됐다. 학부모들은 이날 경북교육청 홍보영상 시청과 교육감과의 대화, 도교육청 견학 등을 통해 경북교육정책을 이해하고 교육 현장의 의견을 공유했다. 특히 교육감과의 대화에서는 평소 궁금했던 경북교육정책과 특색사업에 대해 직접 질문하고 답변을 들으며 정책에 대한 이해를 높였다. 또 학교 현장에서 느끼는 다양한 의견을 전달하고, 학생들의 성장과 교육 발전을 위한 학부모의 역할과 협력 방안에 대해서도 다양한 의견을 나눴다. 임종식 경북교육감이 포항시학부모협의회와 기념사진을 촬영하고 있다.","category":"생활·문화"},{"title":"[날씨] 목요일, 전국 곳곳에 짙은 안개…인천, 경기 남부 등엔 ‘빗방울’도","link":"https://n.news.naver.com/mnews/article/029/0003058640","naverLink":"https://n.news.naver.com/mnews/article/029/0003058640","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"발달장애 어린이 미술전… 삼성복지재단 5년째 개최","link":"https://n.news.naver.com/mnews/article/022/0004174458","naverLink":"https://n.news.naver.com/mnews/article/022/0004174458","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"삼성복지재단은 다음 달 10일까지 서울 용산구 삼성아동교육문화센터에서 발달장애 아동·청소년 미술작품 무료 전시회 ‘작가의 비밀정원: 꿈의 조각들’을 개최한다고 11일 밝혔다. 올해로 5회째를 맞이한 이번 전시는 발달장애인을 위한 의료기반 예술형 치료교육 센터인 서울시 어린이병원 레인보우 예술센터에 참여한 발달장애 아동·청소년 97명의 작품이 전시된다. 역대 가장 많은 작가가 참여한 이번 전시는 ‘향기의 조각’과 ‘당신에게 퍼지는 향기’ 두 가지 주제로 구성됐다. 삼성복지재단은 전시 작품을 담은 2027년 달력 약 2만부를 제작해 전국 사회복지관과 서울특별시 어린이병원 등에 무료로 배포할 예정이다. 류문형 삼성재단 총괄 부사장은 “지난 5년 동안 한마음으로 동행해 왔듯, 앞으로도 발달장애 아동·청소년들이 자신만의 재능을 마음껏 펼칠 수 있도록 든든한 동반자로서 함께 하겠다”고 밝혔다.","category":"생활·문화"}],"세계":[{"title":"Climate COP31 Turkey","link":"https://n.news.naver.com/mnews/article/077/0007234343","naverLink":"https://n.news.naver.com/mnews/article/077/0007234343","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"Climate COP31 Turkey Gordana Siljanovska-Davkova, president of North Macedonia, speaks during a plenary session at the COP31 U.N. Climate Summit, Wednesday, Nov. 11, 2026, in Antalya, Turkey. (AP Photo/Khalil Hamra)","category":"세계"},{"title":"TURKEY COP 31 CLIMATE","link":"https://n.news.naver.com/mnews/article/091/0010365748","naverLink":"https://n.news.naver.com/mnews/article/091/0010365748","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"TURKEY COP 31 CLIMATE. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"[올댓차이나] 10월 中 신차 301만대 판매·9.2%↓…“수출은 60% 급증”","link":"https://n.news.naver.com/mnews/article/003/0014316913","naverLink":"https://n.news.naver.com/mnews/article/003/0014316913","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[선전=신화/뉴시스] 중국 최대 전기차 메이커 비야디의 자동차 전용선이 광둥성 선전항에서 수출용 전기차를 선적하고 있다. 자료사진. 2026.11.11 [서울=뉴시스]이재준 기자 = 중국 10월 신차 판매량이 국내 판매 부진에도 수출 호조에 힘입어 겨우 300만대를 넘어섰다. 이재망(理財網)과 홍콩경제일보, 경제통, 재신쾌보는 11일 중국자동차공업협회(CAAM) 최신 통계를 인용해 2026년 10월 중국 신차 판매량이 301만6000대로 전년 동월 대비 9.2% 감소했다고 전했다. 전월보다는 2.0% 증가했다. 중국 내 판매는 195만대로 작년 같은 달에 비해 26.6% 대폭 줄어들었다. 17개월 연속 감소했으며 최근 7개월 동안은 낙폭이 매달 20%를 넘었다. 중동 정세 불안에 따른 유가 상승으로 휘발유 차량 구매를 자제하는 움직임이 이어지면서 내연기관차 내수 판매량은 61만6000대로 48.5% 격감했다. 9월 내연기관차 내수 판매량은 65만2000대로 전년 동월보다 45.3% 급감했다. 경기 둔화와 자동차 판매 촉진 정책의 변경으로 국내 신에너지차(NEV) 판매도 9.0% 줄었다. 10월 수출은 106만6000대로 5개월 연속 월간 100만대를 돌파했다. 전기차와 플러그인 하이브리드차(PHV) 등 신에너지차 수출이 60만6000대로 작년 같은 달에 비해 1.4배 증가하며 전체 수출 증가를 이끌었다. 수출을 포함한 신에너지차 판매량은 194만대로 전년 동월보다 13.1% 늘었다. 전체 신차 판매에서 차지하는 비중은 64.3%로 높아졌다. 전기차 판매는 135만3000대로 22% 증가했지만 PHV는 58만7000대로 3% 감소했다. 1~10월 누적 신차 판매량은 2628만6000대로 전년 동기 대비 5.1% 감소했다. 국내 판매는 1701만4000대로 22.9% 줄었지만 수출은 927만1000대로 65.1%급증했다. 동기간 신에너지차 판매량은 1441만1000대로 11.3% 늘었으며 전체 판매에서 차지하는 비중은 54.8%로 상승했다. 천스화(陳士華) CAAM 부비서장은 \"국내 판매 부진이 조만간 해소된다고 낙관하기 어렵다\"며 \"그래도 . 수출은 올해 연간 1100만대에 이를 것\"이라고 전망했다. 예상대로면 2025년 수출 실적 709만8000대보다 약 55% 격증한다. CAAM은 중국 자동차 시장의 공급이 수요를 웃도는 상황이 이어지고 업계 이익 수준도 낮다고 평가했다. 유럽연합(EU)의 중국산 하이브리드차","category":"세계"},{"title":"러시아·우크라, 역대 최대 포로교환 합의‥영토·안보 입장차 여전","link":"https://n.news.naver.com/mnews/article/214/0001535001","naverLink":"https://n.news.naver.com/mnews/article/214/0001535001","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"러시아와 우크라이나가 9개월 만에 재개된 종전 협상에서 최대 규모의 포로 교환에 합의했지만, 안전 보장과 영토 문제 등 핵심 의제에서는 여전히 입장 차를 보이고 있습니다. 현지시간 11일 로이터·AFP통신 등에 따르면 러시아와 우크라이나는 미국 중재로 아랍에미리트 아부다비에서 2시간 가량 종전 협상을 벌였습니다. 이틀간 진행된 이번 협상에서 합의한 포로 교환 규모는 1천 명 넘는 수준으로 역대 최대 규모가 될 것으로 전해졌으며, 필요한 절차를 거쳐 2~3주 내에 포로 교환이 이뤄질 예정입니다. 양측이 종전 협상을 계속 하는데에도 의견을 같이함에 따라, 미국 특사 재러드 쿠슈너와 스티브 윗코프는 후속 조치로 12일 모스크바에서 블라디미르 푸틴 러시아 대통령과 회담한 뒤 아일랜드 더블린으로 이동해 볼로디미르 젤렌스키 우크라이나 대통령과도 만날 계획입니다.","category":"세계"},{"title":"LATVIA ECONOMY CONFERENCE","link":"https://n.news.naver.com/mnews/article/091/0010365746","naverLink":"https://n.news.naver.com/mnews/article/091/0010365746","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"Latvijas Banka Economic Conference in Riga (L-R) Deputy Governor of Latvijas Banka Andris Strazds, Deutsche Bundesbank President Joachim Nagel, former director of the European Department at the International Monetary Fund Alfred Kammer, Bruegel Director Jeromin Zettelmeyer, and Vice President of the European Parliament Roberts Zile attend the economic conference 'From Policy to Impact. Europe's Economic Future', in Riga, Latvia, 11 November 2026. Organized by the central bank of Latvia, the conference addressed major economic challenges and strategic policy directions facing the euro area. EPA/TOMS KALNINS","category":"세계"},{"title":"민주콩고 에볼라 확진 1만1000명 돌파…기록상 역대 2번째 규모","link":"https://n.news.naver.com/mnews/article/014/0005603014","naverLink":"https://n.news.naver.com/mnews/article/014/0005603014","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"치명률 48.8%로 5387명 사망…보름 만에 신규 확진 1000명 늘며 급증 2014~2016년 서아프리카 유행 이후 최대 규모…주변 8개 주로 확산 분쟁·보건 시설 방화 등 치안 불안과 백신 부재가 확산 통제 걸림돌 종전 '자이르형' 백신 접종 중…우간다는 8월 종식, 케냐는 마지막 환자 퇴원 에볼라 생존자 출신 간병인 제르키스 마함바(29)가 지난달 28일(현지시간) 콩고민주공화국 북키부주 부템보의 한 에볼라 치료센터 격리 병동 유리창 너머로 입원 환아의 가족에게 환자의 상태를 설명하고 있다. /사진=연합뉴스 [파이낸셜뉴스] 콩고민주공화국(민주콩고)을 휩쓸고 있는 에볼라 바이러스 확진자가 1만1000명을 넘어서며 역대 두 번째 최악의 대유행으로 치닫고 있다. 11일(현지시간) 민주콩고 국립공중보건연구소(INSP)와 주요 외신에 따르면 지난 9일 기준 민주콩고 내 에볼라 누적 확진자는 1만1042명, 사망자는 5387명으로 집계됐다. 확진자 1만 명을 넘어선 지 불과 보름 만에 신규 감염자가 약 1000명 늘었으며, 치명률은 무려 48.8%에 달한다. 현재 2990명이 완치됐고 973명이 치료시설에 머물고 있으나, 사망자의 다수가 치료센터 밖에서 발생하고 있어 실제 피해 규모는 더 클 것으로 우려된다. 이번 에볼라 유행은 2만8600명 이상이 감염되고 1만1000명 넘게 사망했던 2014~2016년 서아프리카 대유행에 이어 기록상 두 번째 규모다. 과거 2018~2020년 민주콩고 내 최악의 유행(확진 3500명·사망 약 2300명) 규모는 이미 넘어선 상태다. 지난 5월 중순 동북부 이투리주에서 시작된 발병은 노르키부주 등 전국 26개 주 가운데 8개 주로 무섭게 확산했다. 이처럼 확산 속도가 빠른 데는 지역 내 고질적인 분쟁과 의료진에 대한 불신 등 치안 불안이 크게 작용하고 있다. 실제로 지난 8일 이투리주 롤와에서는 젊은이들이 에볼라 치료센터에 불을 질렀으며, 민병대 간 충돌로 파타키 지역의 보건 대응이 일시 중단되기도 했다. 여기에 방역 인력의 임금 체불에 따른 파업과 열악한 인프라까지 겹쳐 방역망 통제가 한계에 달했다는 분석이다. 특히 이번에 유행 중인 '분디부교형 에볼라 바이러스'는 아직 승인된 백신이나 치료제가 없다는 점도 문제다. 이에 보건당국은 기존 '자이르형' 에볼라를 위해 개발된 '에르베보(Ervebo)' 백신이 중증 악화 방지에 교차 효과가 있다고 보고 2만1866명에게 긴급 접종을","category":"세계"},{"title":"BELGIUM EU PARLIAMENT","link":"https://n.news.naver.com/mnews/article/091/0010365745","naverLink":"https://n.news.naver.com/mnews/article/091/0010365745","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"BELGIUM EU PARLIAMENT. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"이란 안보수장 \"미국이 공격하면 유럽 미군 기지까지 타격\"","link":"https://n.news.naver.com/mnews/article/001/0016437013","naverLink":"https://n.news.naver.com/mnews/article/001/0016437013","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"이란 혁명수비대가 주최한 무기 사용법 훈련에 참여한 이란 여성들 [로이터=연합뉴스 자료사진. 재판매 및 DB 금지] (카이로=연합뉴스) 김상훈 특파원 = 이란의 안보수장인 모흐센 레자이 이란 최고국가안보회의(SNSC) 사무총장은 11일(현지시간) 자국이 공격받을 경우 유럽 내 미군 기지까지 보복 타격을 가할 수 있다고 경고했다. 이란 국영 IRIB 방송에 따르면 레자이 사무총장은 \"만약 적들이 이란에 대한 새로운 공격을 시도한다면, 그들 스스로 계산에 따르더라도 전쟁은 4~5일을 넘기지 못할 것\"이라고 주장했다. 그는 \"미국이 '쿠 콜랑'(Kuh Kolang, 이란 중부 나탄즈 핵시설 인근의 지하 핵시설로 일명 '곡괭이산'으로 불림)을 공격하는 실수를 범한다면, 우리는 인근 미군 기지는 물론 멀리 떨어진 모든 미군 기지까지 표적으로 삼을 것이다. 유럽 국가에 있는 일부 미군 기지 역시 타격 목표가 될 수 있다\"고 경고했다. 특히 그는 \"미군 항공기가 이륙하는 모든 장소를 우리에 대한 위협으로 간주할 것\"이라며 \"그들이 훗날 어떤 변명도 하지 못하도록 지금 이를 분명히 밝혀둔다\"고 강조했다. 또한 이란의 군사적 성과를 과시하며 \"우리는 미국의 무인기(드론) 7대와 잠수함 2척을 성공적으로 나포했다\"고 주장했다. 외교 및 지역 안보 현안과 관련해서는 러시아와의 밀착을 과시하기도 했다. 레자이 사무총장은 \"블라디미르 푸틴 러시아 대통령이 '이란 이슬람 공화국은 전복될 수 있는 정권이 아니다'라는 점을 미국 측에 강조했다고 내게 말했다\"고 전했다. 아울러 그는 중동 지역 내 독자적인 안보 협력 구상을 시사하며 \"우리는 걸프 해역(페르시아만)과 맞닿아 있는 8개국으로 구성된 연합체를 창설하기로 확고히 결의했다\"고 덧붙였다. meolakim@yna.co.kr","category":"세계"},{"title":"美·러·우크라 종전협상 종료…포로교환 합의에도 영토 문제 등 난항(종합2보)","link":"https://n.news.naver.com/mnews/article/421/0009284391","naverLink":"https://n.news.naver.com/mnews/article/421/0009284391","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"유럽 안보체제 중점 논의…쿠슈너 \"12일 푸틴 회동 후 젤렌스키 만날 것\" 우크라 대표 \"가장 어려운 협상 중 하나…연내 해결책 도출 기대\" 아랍에미리트(UAE) 아부다비에서 열린 미국·러시아·우크라이나 3자 종전 협상 모습. 2026.11.10 ⓒ 로이터=뉴스 (서울=뉴스1) 유철종 전문위원 이창규 기자 = 러시아와 미국, 우크라이나가 11일(현지시간) 아랍에미리트(UAE) 아부다비에서 이틀간 진행한 3자 종전협상을 마무리했다. 미국의 중재로 지난 2월 이후 약 9개월 만에 재개된 이번 협상에서 러시아와 우크라이나는 대규모 전쟁포로 교환에 원칙적으로 합의했지만, 영토 문제 등 핵심 쟁점에서는 이견을 좁히지 못한 것으로 보인다. 러시아 리아노보스티·인테르팍스통신 등에 따르면 러시아 대표단장인 블라디미르 메딘스키 대통령 보좌관은 협상 후 기자회견에서 전쟁 종식 이후 유럽의 새로운 안보체제 구축이 핵심 의제였다고 밝혔다. 그는 \"우크라이나 전쟁은 얄타·포츠담 회담 이후 형성된 유럽 안보체제 전체가 제대로 작동하지 않고 있음을 보여줬다\"며 \"유기체 전체가 병들어 있고 우크라이나에서는 고름집이 터졌을 뿐이므로 유기체 전체를 치료해야 한다\"고 주장했다. 이어 \"미국 측이 참여한 가운데 입장을 교환했으며 일부 사안에서는 상호 이해에 도달했지만 그렇지 못한 사안도 있었다\"며 논의를 계속하겠다고 밝혔다. 그는 \"특정 국가에 불이익을 주지 않는 공정하고 새로운 (유럽)안보체제가 필요하다\"고 강조했다. 앞서 리아노보스티는 자국 협상단 소식통을 인용해 우크라이나 전쟁 해결은 이번 협상의 여러 의제 가운데 하나이며, 참가국들이 유럽의 새로운 안보체제 구축 문제에 주로 집중할 것이라고 보도한 바 있다. 메딘스키 보좌관은 또 러시아와 우크라이나가 대규모 전쟁포로 교환에 원칙적으로 합의했다면서 구체적인 규모와 조건은 추후 발표하겠다고 밝혔다. 볼로디미르 젤렌스키 우크라이나 대통령은 전날 첫날 협상 후 양측 포로를 각각 1000~1500명씩 교환하는 방안이 논의됐다고 소개했다. 메딘스키 보좌관은 \"최종 합의에 도달하기 전까지는 협상 과정의 구체적인 내용을 공개하지 않는 것이 원칙\"이라며 다른 협상 내용에 대해서는 말을 아꼈다. 미국 측 대표인 재러드 쿠슈너 대통령 특사는 협상에서 상당한 진전이 있었다고 평가하면서도 \"영토 문제는 여전히 가장 어려운 문제로 남아 있다\"고 밝혔다고 블룸버그통신이 보도했다. 쿠슈너는 전쟁포로 교환에서 합의에 도","category":"세계"},{"title":"올해만 5000명 넘게 걸리더니 “35년 만에 최악”…미국 덮친 ‘이 전염병’ 뭐길래","link":"https://n.news.naver.com/mnews/article/011/0004681219","naverLink":"https://n.news.naver.com/mnews/article/011/0004681219","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"클립아트코리아 미국에서 홍역이 1년 넘게 확산하면서 26년간 유지해 온 ‘홍역 청정국’ 지위를 잃을 가능성이 커졌다. 올해 감염자만 5000명을 넘어서며 1991년 이후 가장 많은 환자가 발생했다. 10일(현지시간) 미국 뉴욕타임스(NYT)는 최근 홍역 바이러스의 유전자 분석 결과를 토대로 미국에서 홍역이 풍토병처럼 지속적으로 전파되는 수준에 이르렀다고 보도했다. 미국 질병통제예방센터(CDC)에 따르면 지난 5일 기준 올해 미국의 홍역 확진자는 5182명이다. 지난해 전체 확진자 2289명의 두 배를 웃도는 규모다. 올해 홍역 감염자 5182명…35년 만에 최다 발생 미국은 지난 2000년 홍역 퇴치국 지위를 인정받았다. 하지만 최근 집단감염이 여러 지역에서 이어지면서 26년 만에 이 지위를 잃을 위기에 놓였다. 홍역 퇴치국은 바이러스 감염 사례가 완전히 사라진 나라를 뜻하지 않는다. 해외에서 유입된 환자가 발생하더라도 자국 내에서 동일한 바이러스의 전파가 12개월 이상 지속되지 않는 상태를 의미한다. 문제는 미국에서 발생한 홍역 집단감염이 지역을 옮겨가며 장기간 이어지고 있다는 점이다. NYT에 따르면 홍역 바이러스의 유전자 분석 결과, 지난 7월 유타주와 애리조나주에서 발생한 집단감염은 1년 전 텍사스주에서 시작된 유행과 연관된 것으로 나타났다. 일부 감염은 유타주에서 오리건주와 워싱턴주로도 퍼졌다. 올해 초 버지니아주에서 확인된 홍역 역시 지난달 중순 아이오와주와 인디애나주, 펜실베이니아주 등으로 확산한 것으로 전해졌다. 빌 해니지 하버드대 공중보건대학원 전염병센터 공동소장은 “이것만으로도 홍역이 1년 이상 전파되고 있다는 강력한 증거가 된다”고 말했다. 텍사스서 유타·애리조나까지 확산…17일 청정국 지위 결정 홍역은 전파력이 매우 강한 감염병이다. 감염자가 기침하거나 재채기할 때 공기 중으로 퍼진 바이러스를 통해 다른 사람에게 옮을 수 있다. 프레드 허치슨 암센터의 J.T. 매크론 생물학자는 “홍역은 전염성이 높고 쉽게 퍼진다”며 “미국은 연결된 지역사회가 많아서 바이러스가 한 집단에서 다른 집단으로 넘나들면서 전염 고리를 유지할 수 있다”고 설명했다. 미국의 홍역 퇴치국 지위 유지 여부는 조만간 판가름 날 전망이다. 세계보건기구(WHO) 미주지역본부인 범미보건기구(PAHO)는 10일부터 13일까지 전문가위원회를 열고 각국의 홍역 발생 현황과 바이러스 전파 경로 등을 검토한다. 위원회는 미국에서 동일한","category":"세계"}],"IT 과학":[{"title":"젠슨 황 사임, AI 황제 추문으로 퇴장","link":"https://n.news.naver.com/mnews/article/025/0003564910","naverLink":"https://n.news.naver.com/mnews/article/025/0003564910","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 사임, AI 황제 추문으로 퇴장. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"네이버, AI 팩토리 2조원 첫 수주…\"10곳 이상과 추가 논의\"","link":"https://n.news.naver.com/mnews/article/015/0005353274","naverLink":"https://n.news.naver.com/mnews/article/015/0005353274","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"수랭식 인프라로 GPU 수요 선점 美데이터센터 규제 강화도 호재 네이버가 브룩필드·엔비디아와 공동으로 추진하는 ‘인공지능(AI) 팩토리’ 사업에서 약 2조원 규모의 컴퓨팅 서비스 공급 계약을 처음으로 따냈다. 10곳 이상의 기업과 추가 계약도 논의 중이다. 이번 계약의 공급 물량은 약 20메가와트(㎿)다. 내년 AI 팩토리 사업 목표 물량인 200㎿의 10%에 이른다. 계약 상대는 해외 기업으로, 네이버는 내년 상반기부터 4~5년에 걸쳐 컴퓨팅 서비스를 순차적으로 공급한다. 김희철 네이버 최고재무책임자(CFO)는 12일 3분기 실적 콘퍼런스콜에서 “나머지 180㎿도 기업 10곳 이상과 계약을 논의하고 있다”고 밝혔다. 네이버의 경쟁력은 최신 AI 슈퍼칩 플랫폼을 안정적으로 운영할 수 있는 데이터센터 인프라다. 차세대 그래픽처리장치(GPU)인 루빈으로 개발한 AI 플랫폼인 엔비디아의 베라 루빈은 높은 발열량 때문에 액체 냉각 설비가 필수적이다. 최수연 네이버 대표는 “네이버는 국내에서 대부분의 수랭식 데이터센터를 확보했다”며 “글로벌 고객에게 최신 플랫폼을 적기에 공급할 수 있다”고 말했다. 미국 데이터센터 규제 강화 가능성도 네이버에는 기회 요인이다. 미국 중간선거에서 민주당이 압승하면서 데이터센터의 전력 사용과 입지 규제가 강화될 수 있다는 전망이 나온다. 미국 내 증설이 지연되면 안정적인 전력·냉각 인프라를 갖춘 해외 데이터센터로 수요가 이동할 가능성이 있다. 네이버와 추가 계약을 논의하는 기업 상당수도 미국의 규제 움직임을 주시하는 것으로 전해졌다.","category":"IT 과학"},{"title":"대경대·영현로보틱스, 피지컬 AI 기반 로봇 기술 공동 개발 업무협약 체결","link":"https://n.news.naver.com/mnews/article/016/0002722285","naverLink":"https://n.news.naver.com/mnews/article/016/0002722285","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[대경대 제공] [헤럴드경제(경산)=김병진 기자]대경대가 로봇 전문기업 영현로보틱스(대표 이욱진)와 손잡고 피지컬 AI(Physical AI)를 기반으로 한 뷰티·국방·푸드·바이오 분야 협동로봇 기술 공동 개발에 나선다. 대경대는 지난 9일 경북 경산 테마캠퍼스 대회의실에서 영현로보틱스와 업무협약(MOU)을 체결하고 대학의 교육·연구 인프라와 기업의 로봇 자동화 기술을 결합해 산업 현장에 적용할 융합기술을 개발하기로 했다. 양 기관은 기존 뷰티 분야의 협력 경험을 바탕으로 국방과 푸드, 바이오·헬스케어 분야까지 공동 연구개발을 확대할 계획이다. 특히 로봇 동작 학습과 제어 기술, 현장 실증 데이터 분석 등을 통해 산업별 맞춤형 협동로봇 기술을 고도화할 방침이다. 아울러 협동로봇 실습 중심의 교육과정과 교재를 공동 개발하고 현장실습 및 인턴십을 연계해 피지컬 AI와 로봇 융합 분야 전문인력 양성에도 힘을 모으기로 했다. 이채영 대경대 총장은 “대학의 특성화 교육 역량과 기업의 로봇 기술을 융합해 공동 기술개발을 확대하고 교육과 연구, 산업 현장이 유기적으로 연결되는 산학협력 모델을 구축하겠다”고 말했다.","category":"IT 과학"},{"title":"뉴욕 맨해튼에 '텐더바' 문 연다…日 거장 기술에 한식 안주 결합","link":"https://n.news.naver.com/mnews/article/018/0006408475","naverLink":"https://n.news.naver.com/mnews/article/018/0006408475","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"미쉐린 2스타 한식당 주옥 옆에 개점 우에다 가즈오 제자 양광진 헤드 바텐더 맡아 '하드 셰이크'로 칵테일 향·질감 차별화 신창호 셰프의 와규 떡갈비·새우 타로전 선보여 [뉴욕=이데일리 성주원 특파원] 미국 뉴욕 맨해튼 코리아타운에 일본식 정통 바텐딩 기술과 한식 안주를 결합한 칵테일 바가 들어선다. 미쉐린 2스타 한식 레스토랑 ‘주옥(Joo Ok)’과 협업해 일본 칵테일 거장의 기술로 만든 술과 한국 셰프의 요리를 함께 선보인다. 양광진 뉴욕 텐더바 헤드 바텐더가 지난 10일(현지시간) 맨해튼 코리아타운의 텐더바에서 일본 칵테일 거장 우에다 가즈오의 칵테일 기술서와 자신이 번역한 한국어판을 소개하고 있다. (사진=이데일리 성주원 특파원) 텐더바(Tender Bar)는 이달 맨해튼 32번가 16층에 문을 연다고 밝혔다. 주옥 바로 옆에 자리한 이곳은 주옥과 연계하면서도 독자적인 콘셉트를 갖춘 칵테일 바로 기획됐다. 칵테일 제조는 양광진 헤드 바텐더가 책임진다. 서울과 도쿄 등에서 약 20년간 경력을 쌓은 그는 일본의 전설적인 바텐더 우에다 가즈오에게 기술을 배웠다. 텐더바는 우에다가 개발한 ‘하드 셰이크(Hard Shake)’를 핵심 기술로 내세운다. 하드 셰이크는 얼음이 담긴 셰이커를 무조건 빠르고 강하게 흔드는 방식이 아니다. 얼음과 술의 움직임을 정교하게 제어해 미세한 기포를 만들고, 알코올의 자극을 부드럽게 하면서 향과 질감의 균형을 살리는 기술이라는 게 텐더바 측 설명이다. 양 바텐더는 “똑같은 재료를 사용해도 어떻게 흔드느냐에 따라 맛이 달라진다”며 “볶음밥을 만들 때 웍을 움직이는 방식에 따라 결과가 달라지는 것과 비슷하다”고 설명했다. 진과 라임주스, 시럽으로 만드는 기본 칵테일 ‘김렛(Gimlet)’도 바텐더의 기술에 따라 맛과 질감이 달라질 수 있다는 것이다. 메뉴에는 김렛과 마티니 등 클래식 칵테일뿐 아니라 우에다가 개발한 오리지널 칵테일도 포함됐다. 스카치위스키와 블루 큐라소, 코앵트로를 조합해 초록색 재료 없이 녹색을 구현한 ‘킹스 밸리(King’s Valley)‘가 대표적이다. 1974년 우에다가 처음 개발한 오리지널 칵테일 ’하나츠바키(HanaTsubaki)‘도 선보인다. 얼음은 손으로 직접 다듬고, 라임은 사용 전 하나하나 맛을 확인하는 등 재료 관리에도 공을 들인다. 음식은 주옥의 신창호 셰프가 맡는다. 미야자키 A5 와규 떡갈비와 새우 타로전, 고추장을 곁들인 가리비 등 한식의","category":"IT 과학"},{"title":"[뉴욕개장] 상승세 출발…코어위브 호실적·AI 투자 우려 완화","link":"https://n.news.naver.com/mnews/article/421/0009284392","naverLink":"https://n.news.naver.com/mnews/article/421/0009284392","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"[뉴욕개장] 상승세 출발…코어위브 호실적·AI 투자 우려 완화. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"BRITAIN EU TALKS","link":"https://n.news.naver.com/mnews/article/091/0010365736","naverLink":"https://n.news.naver.com/mnews/article/091/0010365736","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"BRITAIN EU TALKS. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"그래디언트 'iKAOS', 정부출연연 22곳 과학 콘텐츠 제공","link":"https://n.news.naver.com/mnews/article/092/0002444936","naverLink":"https://n.news.naver.com/mnews/article/092/0002444936","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"국가과학기술연구회 'ONEST' 채널 입점…총 23개 기관 콘텐츠 연동 그래디언트가 운영하는 과학 콘텐츠 포털 'iKAOS(아이카오스)'에서 국가과학기술연구회(NST)와 22개 정부출연연구기관의 과학기술 콘텐츠를 제공한다. 이용자들은 개별 연구기관의 채널을 방문하지 않고도 주요 연구 성과와 과학 지식을 한곳에서 찾아볼 수 있게 됐다. 그래디언트는 자체 개발한 과학 콘텐츠 포털 iKAOS에 국가과학기술연구회와 소관 정부출연연구기관의 콘텐츠를 제공하는 'ONEST' 채널이 입점했다고 11일 밝혔다. ONEST는 국가과학기술연구회와 22개 정부출연연구기관의 연구 성과 및 과학기술 지식 콘텐츠를 제공하는 채널이다. 각 기관이 고유한 역량을 유지하면서 하나로 연결되고, 과학기술 분야에서 최고 수준을 지향한다는 의미를 담고 있다. 그래디언트가 자체 개발한 과학 콘텐츠 포털 ‘iKAOS’에 국가과학기술연구회 및 소관 22개 정부출연연구기관의 과학기술 콘텐츠를 제공하는 ‘ONEST’ 채널이 입점했다 이번 입점으로 iKAOS 이용자들은 총 23개 기관이 제공하는 과학기술 콘텐츠를 통합적으로 탐색할 수 있게 됐다. iKAOS는 여러 과학 기관과 크리에이터의 콘텐츠를 한곳에서 검색하고 시청할 수 있도록 구축한 과학 콘텐츠 포털이다. 유튜브 등 동영상 플랫폼에 축적된 과학 콘텐츠를 이용자가 원하는 주제에 따라 쉽게 찾아볼 수 있도록 키워드 기반 검색과 콘텐츠 탐색 기능을 제공한다. 이용자는 분야와 주제, 기관별로 콘텐츠를 검색하거나 영상에 연결된 키워드를 선택해 관련 콘텐츠를 이어서 살펴볼 수 있다. 예를 들어 에너지 관련 강연을 시청하다 해당 키워드를 선택하면 다른 연구기관이나 과학 크리에이터가 제공하는 관련 영상까지 함께 확인할 수 있다. 긴 과학 강연의 내용을 쉽게 파악할 수 있도록 영상요약과 영상노트 기능도 지원한다. 영상요약은 강연의 주요 내용과 전체 흐름을 정리해 제공하며, 영상노트는 주제별 설명과 해당 영상의 시간대를 연결해 필요한 내용을 빠르게 찾아볼 수 있도록 돕는다. 그래디언트는 현재 iKAOS를 통해 자체 과학 지식 플랫폼 'SOAK(쏙)'을 비롯해 카오스재단, 국립과천과학관, 국립광주과학관, 서울시립과학관 등의 콘텐츠를 제공하고 있다. 과학쿠키, 지식인미나니 등 과학 크리에이터와 사이언스북스, 생물학연구정보센터(BRIC) 등 전문기관과도 협력하고 있다. 김병민 그래디언트 퍼블리싱 그룹장은 \"과학 정보를 쉽게 접","category":"IT 과학"},{"title":"에퀴닉스, 싱가포르 데이터센터 개소…3900억원 투입","link":"https://n.news.naver.com/mnews/article/018/0006408469","naverLink":"https://n.news.naver.com/mnews/article/018/0006408469","pubDate":"2026-11-11T12:00:00+09:00","author":"네이버뉴스","description":"초기 1550개 캐비닛 제공…PUE 1.20 목표 내년 싱가포르국립대와 냉각·에너지 기술 검증 시설 구축 [이데일리 신영빈 기자] 글로벌 디지털 인프라 기업 에퀴닉스가 싱가포르에 여섯 번째 데이터센터를 열었다. 액체 냉각 등 고효율 설비를 적용해 AI·GPU 인프라 수요에 대응하고 현지 대학과 차세대 데이터센터 기술도 검증한다. 에퀴닉스는 싱가포르에 ‘SG6’ 데이터센터를 개소했다고 11일 밝혔다. 싱가포르 6번째 IBX 데이터센터인 에퀴닉스 SG6 (사진=에퀴닉스) SG6의 초기 투자금은 약 2억9000만달러(약 3900억원)다. 1단계로 서버 장비를 수용하는 캐비닛 약 1550개를 제공하며 최종 완공 시 최대 20MW의 IT 용량을 갖출 예정이다. 싱가포르 정부의 데이터센터 사업자 선정 공모를 통해 구축한 에퀴닉스의 첫 시설이다. 고밀도 AI 시스템과 전력 소비가 큰 GPU 인프라를 지원하기 위해 자체 냉각 어레이 기술과 액체 냉각을 적용했다. 건물 옥상과 외벽에는 태양광 패널을 설치해 현장에서 재생에너지를 생산한다. 전력효율지수(PUE)는 1.20 달성을 목표로 설계했다. PUE는 데이터센터 전체 소비전력을 IT 장비 소비전력으로 나눈 값으로, 1에 가까울수록 에너지 효율이 높다. 싱가포르 건설청과 정보통신미디어개발청이 운영하는 ‘그린마크 플래티넘’ 인증 취득도 추진한다. 수자원 절약을 위해 싱가포르의 재생수인 ‘뉴워터’와 빗물 집수 시스템을 활용한다. 모은 빗물은 냉각탑 운영에 사용해 상수도 의존도를 낮춘다. 에퀴닉스는 싱가포르국립대(NUS) 에너지 솔루션 허브와 협력해 2027년 SG6 안에 공동 혁신 시설을 열 계획이다. 액체 냉각과 인지형 디지털 트윈, 배터리 에너지 저장 등 신기술을 시험하고 데이터센터의 에너지 효율을 높이는 방안을 연구한다. 회사는 싱가포르에서 재생에너지 전력구매계약(PPA) 4건을 체결했으며, 이를 통해 2028년까지 현지 재생에너지 포트폴리오를 누적 215MWp로 확대할 예정이다. 에퀴닉스는 2002년 싱가포르에 진출한 뒤 현지 데이터센터를 6곳으로 늘렸다. 올해 8월에는 싱가포르의 2차 데이터센터 사업자 선정 공모에서도 신규 구축 사업자로 선정됐다. 현재 전 세계 36개국 77개 시장에서 280개 이상의 데이터센터를 운영하고 있다. 아데어 폭스-마틴 에퀴닉스 최고경영자(CEO) 겸 사장은
