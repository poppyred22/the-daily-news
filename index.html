”…정부 책임론 공세","link":"https://www.etnews.com/20261106000159","pubDate":"2026-11-06T11:13:23+09:00","author":"전자신문","description":"야권이 6일 코스피 5000선 붕괴와 관련 정부 증시 정책 책임론을 제기했다. 인위적인 주가 부양과 반도체 호황에 기댄 경제 운용이 시장 불안을 키웠다며, 초과세수에 기반한 미래대응기금 조성을 백지화하고 국가채무 상환에 나서라고 압박했다. 장동혁 국민의힘 대표는 이날 매일신문 유튜브에 출연해 “미국 중간선거 결과의 영향도 있겠지만 그건 세계 모든 나라 주식시장이 겪는 같은 조건”이라며 “대비가 부족했던 것이고, 반도체 호황에 주식시장이 상승했던","category":"사건 사고"},{"title":"대법, ‘아산 곡교천 기름 유출’ 현대차 벌금형 확정","link":"https://www.khan.co.kr/article/202611061025001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T10:25:00+09:00","author":"경향신문","description":"서울 서초구 대법원. 박민규 선임기자대법원이 2018년 충남 아산 곡교천 기름 유출 사고의 책임을 물어 현대자동차 법인과 실무자에 대한 벌금형을 확정했다.대법원 2부(주심 오경미 대법관)는 최근 현대차 법인과 아산공장 과장 A씨에게 각각 벌금 500만원과 200만원을 선고한 원심을 확정했다고 6일 밝혔다.2018년 1월17일과 2월28일 현대차 아산공장 인···","category":"사건 사고"},{"title":"\"고인, 한국 무사히 돌아오도록\"…'뺑소니 사망' 여행유튜버, 유족이 전한 부탁","link":"https://www.imaeil.com/page/view/2026110609485443764","pubDate":"2026-11-06T09:49:22+09:00","author":"매일신문","description":"볼리비아에서 자전거로 여행하던 중 대형 화물트럭에 치여 숨진 여행 유튜버 진쓰레블(본명 조진우·33)의 가족이 고인을 국내로 데려오기 위한 절차에 들어갔다. 고인의 친형은 지난 5일 밤 조진우 씨의 사회관계망서비스(SNS)에 유가족을 대표해 입장문을 올렸다. 그는 \"갑작스럽고 안타까운 소식을 전하게 되어 마음이 미어지고 무겁다\"며 \"저의 친동생이자 많은 분들의 사랑과 응원을 받아온 진쓰레블님이 세상을 너무나도 갑작스러운 대형 트럭과의 교통사고로 세상을 떠났다\"고 밝혔다. 진쓰레블은 지난 4일 오전 볼리비아 엘알토에서 자전거를 타고 - 매일신문","category":"사건 사고"}],"사회":[{"title":"日다카이치 대만 유사시 발언 1년…日정부 \"입장 변경 없어\"(종합)","link":"https://www.newsis.com/view/NISX20261106_0003858637","pubDate":"2026-11-06T20:26:43+09:00","author":"뉴시스","description":"[서울·베이징=뉴시스]김예진 기자, 박정규 특파원 = 다카이치 사나에(高市早苗) 일본 총리가 대만 유사시 자국의 개입 가능성을 시사한 발언을 한지 1년을 앞둔 가운데, 일본 정부는 관련 입장에 변함이 없다고 밝혔다. 6일 일본 공영 NHK, 니혼게이자이신문(닛케이) 등에 따르면 정부 대변인인 기하라 미노루(木原稔) 관방장관은 이날 오전 정례 기자회견에서 중국이 요구하고 있는 다카이치 총리의 대만 유사시 발언 철회에 대해 응할 생각이 있는지 묻는 질문에 \"정부가 거듭 말해온 것에 변화는 없다\"고 밝혔다. 다카이치 총리는 지난해 11월 7일 국회에서 대만 유사시와 관련한 질문을 받고 \"전함을 사용해 무력 행사가 수반된다면 이는 아무리 생각해도 (일본의) 존립위기사태가 될 수 있는 경우라고 저는 생각한다\"고 말했다. 존립위기사태로 판단될 경우 일본이 공격받지 않더라도 집단적 자위권을 한정적으로 행사해, 자위대에 방위출동을 명령할 수 있다. 다카이치 총리의 이 답변은 대만 유사시 일본의 개입 가능성을 국회에서 처음으로 언급한 것으로, 외교적인 파장을 불렀다. 중국 측이 크게 반발했다고 철회를 요구했으나, 다카이치 총리는 철회하지 않았다. 기하라 장관은 \"어떠한 사태가 존립위기사태에 해당하는지 개별 구체적인 상황에 따라 정부가 모든 정보를 종합해 판단하는 것\"이라며 \"정부의 입장은 일관돼 있다\"고 밝혔다. 아울러 \"대만에 관한 정부의 입장은 ","category":"사회"},{"title":"“텍사스서 단물만 빼먹지 마”…주지사 당선인, 데이터센터 건설 제동 예고","link":"https://www.mk.co.kr/news/world/12200329","pubDate":"2026-11-06T20:19:24+09:00","author":"매일경제","description":"미국 민주당 소속 지나 히노호사 텍사스 주지사 당선인이 주민 보호 대책을 갖추기 전까지 데이터센터 사업에 제동을 걸겠다는 뜻을 밝혔다. 데이터센터 투자가 집중된 텍사스의 정책 변화..","category":"사회"},{"title":"도요타, 차세대 EV로 중국 시장 재공략","link":"https://www.newsis.com/view/NISX20261106_0003858311","pubDate":"2026-11-06T17:55:50+09:00","author":"뉴시스","description":"[서울=뉴시스]문은주 기자 = 도요타자동차가 차세대 전기차(EV)로 중국 시장 공략에 나선다. 6일 지지통신 등에 따르면 도요타자동차는 내년 차세대 EV 출시를 시작으로 2030년까지 중국 내 신규 고객을 확보하겠다고 밝혔다. 판매 부진이 지속되고 있는 중국 시장에 활력을 불어넣기 위한 조치다. 올해 4~9월 중국 내 도요타자동차 판매 대수는 전년 동기 대비 25.1% 쪼그라든 68만 4903대에 그쳤다. 같은 기간 북미 지역 판매량이 153만 9000대로 지난해 같은 기간보다 1.8% 증가한 것과 대조적이다. 북미 지역에서는 도요타가 강점을 보이는 하이브리드차(HV) 등 가솔린 차량에 대한 선호도가 높은 반면 중국에서는 EV 수요가 높아진 데 따른 것으로 풀이된다. 경기 침체 속에 중동 정세 악화로 연료 가격이 상승하면서 중국이 주도하는 EV 전환이 활기를 찾은 것도 침체 요인으로 꼽힌다. 중국 자동차시장정보연회(CPCA) 집계에 따르면, 중국 내 EV 시장은 BYD의 독주 체제 속에서 중국 토종 기업이 상위권을 장악하고 있다. 지난 9월 기준 브랜드별 점유율에서 BYD는 22.8%로 1위를 차지했고 중국 기업인 지리자동차(11%)와 링파오(7.2%)가 그 뒤를 이었다. 외국 기업 중엔 테슬라차이나가 점유율 6%로 4위에 올랐지만 도요타는 순위권에 들지 못했다. 도요타자동차는 광저우자동차그룹 등 중국 합작파트너와의 협력을 통해 연구","category":"사회"},{"title":"美 '블루쇼크'에 AI 붐 '흔들'…\"공포 과도하다\" 신중론도","link":"https://www.newsis.com/view/NISX20261106_0003857967","pubDate":"2026-11-06T17:46:28+09:00","author":"뉴시스","description":"[서울=뉴시스]신정원 기자 = 미국 중간선거에서 민주당이 의회와 주요 주지사 선거를 석권하면서 인공지능(AI) 열풍에 제동이 걸릴 것이란 우려가 확산하고 있다. 뉴욕증시에서 기술주의 시가총액이 하루 기준 사상 최대 규모로 증발하는 등 시장 공포가 극에 달한 가운데, 월가에서는 주정부 권력 개편에 따른 실제 규제 파장과 AI 붐의 존속 여부를 두고 분석이 엇갈리고 있다. 5일(현지 시간) 파이낸셜타임스(FT)와 CNBC 등에 따르면 이번 선거에서 민주당이 승리한 텍사스와 조지아, 오하이오 등은 미국의 대표적인 데이터센터 건설 거점 지역으로 꼽힌다. 민주당 후보들이 선거 과정에서 신규 데이터센터 건설 유예나 세제 혜택 폐지 등을 공약한 만큼, 이들 주에서 규제가 현실화하면 이미 추진 중인 사업은 물론 향후 투자 계획에도 차질이 불가피할 수 있다. 골드만삭스는 규제 강화를 예고한 민주당 당선인들의 주(州)가 미국 전체 AI 데이터센터 계획 용량의 약 45%에 달하는 것으로 추정했다. 시장 조사 기관 클린뷰 역시 신규 승인 유예에 찬성하는 신임 주지사의 주가 전체 계획 용량의 약 41%에 해당하는 것으로 파악했다. 이 중 텍사스는 미국 전체 계획 용량의 25%가 몰려 있다. 민주당 소속 지나 히노호사 텍사스 주지사 당선인은 \"주민 보호 법안과 전력·수자원 규제가 입법될 때까지 모든 신규 인허가를 전면 중단하겠다\"고 밝힌 상태다. 테슬라와 스","category":"사회"},{"title":"“주부 대리기사가 만들었다”…조회수 60억 돌파, 난리난 영화의 정체","link":"https://www.mk.co.kr/news/world/12200138","pubDate":"2026-11-06T17:33:58+09:00","author":"매일경제","description":"인공지능(AI) 기술을 활용해 평범한 소시민들이 제작한 중국의 단편 영화가 누적 조회수 60억 회를 돌파하며 현지 미디어 시장에 거센 센세이션을 일으키고 있다. 6일 베트남 매체 ..","category":"사회"},{"title":"‘중간선거 완패’ 트럼프 “미국에 공장 안 지으면 관세 최고 300%”","link":"https://www.mk.co.kr/news/world/12200122","pubDate":"2026-11-06T17:21:04+09:00","author":"매일경제","description":"도널드 트럼프 미국 대통령이 5일(현지시간) 미국에 공장을 짓지 않는 외국 기업에 최고 300%의 관세를 부과할 수 있다고 밝혔다. 공화당의 중간선거 참패 이후에도 관세정책을 유지..","category":"사회"},{"title":"거창군 기본 소득 지원 조례안 가결 .'거창형 기본 소득' 본격 추진","link":"https://www.imaeil.com/page/view/2026110614162135066","pubDate":"2026-11-06T15:12:40+09:00","author":"매일신문","description":"거창군은 지난 5일 열린 제296회 임시 회에서「거창군 기본 소득 지원 조례」가 원안 가결됨에 따라, 군민의 생활 안정과 지역 경제 활성화를 위한 '거창형 기본 소득'의 본격적 추진에 나선다고 밝혔다. 이번 조례안 의결은 군민의 생활 안정과 지역 경제 활성화를 위한 거창형 기본 소득의 제도적 기반을 마련하는 중요한 진전이다. 군은 향후 조례 공포 등 후속 절차를 거쳐 지역 여건에 맞는 기본 소득 정책을 구체화해 나갈 계획이다. 거창군은 정부의 농어촌 기본 소득 시범 사업 공모 참여를 위해 힘써왔으나, 경상남도 자체 심사 결과 정부 - 매일신문","category":"사회"},{"title":"청해부대 작전 범위 확대에…시민단체들 “명백한 이란 전쟁 참전 행위”","link":"https://www.khan.co.kr/article/202611061448001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T14:48:00+09:00","author":"경향신문","description":"시민사회와 대학가 등의 28개 단체로 구성된 ‘이란 전쟁 파병에 반대하는 사람들’이 6일 청와대 사랑채 앞에서 기자회견을 열고 정부의 청해부대 작전 범위 확대 추진에 반대하고 있다. ‘이란 전쟁 파병에 반대하는 사람들’ 제공.시민단체들이 청해부대 작전 범위를 호르무즈 해협에 더 가까이로 확대하겠다는 정부 방침에 대해 “명백한 이란 전쟁 참전 행위”라고 비판···","category":"사회"},{"title":"대구시교육청, 정책자문위원회 개최…'글로벌 교육수도 대구' 도약 구체화","link":"https://www.imaeil.com/page/view/2026110611322513067","pubDate":"2026-11-06T11:33:46+09:00","author":"매일신문","description":"대구시교육청은 6일 오후 시교육청 대회의실에서 '2026 대구미래교육정책자문위원회'(이하 자문위원회)를 개최한다. 이번 회의는 민선 3기 강은희 교육감의 '대구에서 배우고 세계를 품는 글로벌 교육수도 대구'의 공약이행계획과 2027 대구미래역량교육을 논의하고, 각계 전문가와 시민사회의 제안을 폭넓게 수렴해 정책 완성도를 높이기 위해 마련됐다. 자문위원회는 각계각층의 의견을 수렴할 수 있도록 전문가, 시민대표, 교육원로 등 총 80명의 위원으로 구성됐다. 위원들은 대구미래교육 정책 방향을 제시하고 과제를 점검․보완하는 등 대구교육의 - 매일신문","category":"사회"},{"title":"창녕군, \"일선 행정 서비스 첨병, 이장님들 AI교육 받으세요\"","link":"https://www.imaeil.com/page/view/2026110611065839266","pubDate":"2026-11-06T11:24:17+09:00","author":"매일신문","description":"경남 창녕군이 일선 행정의 최접점에서 주민과 행정기관을 연결하는 이장들을 대상으로 생활밀착형 인공지능(AI) 교육을 추진해 눈길을 끌고 있다. 이장들이 주민들의 다양한 행정 수요에 신속하게 대응하고, 농업과 일상생활에 필요한 정보를 보다 효율적으로 전달하기 위해서는 디지털 기술 활용 능력이 중요해지고 있기 때문이다. 창녕군은 지난 4일부터 6일까지 고암·영산·길곡면 이장 42명을 대상으로 '찾아가는 인공지능(AI) 활용 교육'을 실시했다. 이번 교육은 정부의 인공지능 대중화 정책에 맞춰 군민들의 AI 활용 역량을 강화하고, 특히 주 - 매일신문","category":"사회"}],"생활 문화":[{"title":"배달 음식 틈타 전 연인 집 침입·자해 소동…30대 긴급체포","link":"https://www.newsis.com/view/NISX20261106_0003858639","pubDate":"2026-11-06T20:31:54+09:00","author":"뉴시스","description":"[서울=뉴시스]최은수 고선영 기자 = 흉기와 둔기를 들고 전 연인의 집에 침입해 자해 소동을 벌인 30대 남성이 경찰에 붙잡혔다가 석방됐다. 6일 경찰에 따르면 서울 수서경찰서는 지난 2일 30대 남성 A씨를 특수협박 및 스토킹처벌법 위반 혐의로 긴급체포했다. A씨는 지난 1일 서울 강남구의 한 오피스텔에 거주하는 전 연인 B씨의 집에 흉기와 둔기를 소지한 채 들어가 자해하겠다고 위협한 혐의를 받는다. A씨는 B씨의 집으로 배달 음식을 주문한 뒤 B씨가 문을 열자 집 안으로 들어간 것으로 조사됐다. A씨는 B씨에게 헤어지기 싫다며 자해하겠다고 위협하고, 흉기로 자해하는 시늉을 한 것으로 파악됐다. 피해자 측의 신고를 받고 출동한 경찰은 현장에서 A씨를 긴급체포해 조사한 뒤 석방했다. 경찰은 피해자에게 스마트워치를 지급하고 A씨가 피해자에게 접근하지 못하도록 긴급응급조치를 내렸다. 현재 스토킹처벌법에 따른 잠정조치 1~3호 신청도 준비하고 있다. ◎공감언론 뉴시스 eschoi@newsis.com, sunzero@newsis.com","category":"생활 문화"},{"title":"뉴진스 전속계약서 공개 파장…‘부적절한 연애’ 금지·소속사 비판 제한","link":"https://www.hani.co.kr/arti/culture/music/1286095.html","pubDate":"2026-11-06T17:58:00+09:00","author":"한겨레","description":"미국 뉴욕타임스가 뉴진스가 미성년자 시절 체결한 전속계약서에 교육권과 수면권 등 보호 조항이 빠져 있었다고 보도함. 계약서에는 소속사를 비판하는 발언을 제한하고 계약 종료 뒤에도 음악과 인공지능으로 만든 목소리를 활용할 수 있다는 내용이 담긴 것으로 전해져 논란이 커짐. 하이브는 연습생과 국가 표준 청소년 부속합의서를 체결했다고 설명함.","category":"생활 문화","priority":1},{"title":"서귀포 중문동 마트 기계실서 불…인명 피해 없어","link":"https://www.newsis.com/view/NISX20261106_0003858520","pubDate":"2026-11-06T17:48:05+09:00","author":"뉴시스","description":"[서귀포=뉴시스] 우장호 기자 = 6일 오후 4시18분께 제주 서귀포시 중문동의 한 마트 기계실에서 불이 났다. 신고를 받고 출동한 소방당국은 인력과 장비를 투입해 화재 발생 17분 만인 오후 4시35분께 불을 완전히 껐다. 화재 당시 현장에서는 검은 연기가 분출됐으나, 불이 난 기계실이 마트 본동과 분리된 별개 건물에 위치해 이용객 대피 등의 소동이나 인명 피해는 발생하지 않았다. 소방당국은 송풍기를 이용한 배연 작업을 마치는 대로 정확한 화재 원인과 재산 피해 규모를 조사할 예정이다. ◎공감언론 뉴시스 woo1223@newsis.com","category":"생활 문화"},{"title":"주차된 캠핑카서 화재, 야산으로 번졌다…인명피해 없어","link":"https://www.newsis.com/view/NISX20261106_0003858510","pubDate":"2026-11-06T17:43:20+09:00","author":"뉴시스","description":"[군산=뉴시스]강경호 기자 = 6일 오후 4시37분께 전북 군산시 옥도면 야미도리에서 주차된 1t 캠핑카에 불이 났다. 불은 주차된 자리 바로 옆에 위치한 야산으로 번지며 산불로 이어졌다. 차량에 난 불은 화재 발생 30분여만에 진화됐고 화재 발생 1시간 뒤에는 산에서 난 화재도 큰 불이 잡힌 상태다. 화재로 발생한 인명피해는 없었다. 소방당국은 정확한 피해 면적과 규모 등을 조사 중이다. ◎공감언론 뉴시스 lukekang@newsis.com","category":"생활 문화"},{"title":"책 안사왔다고…초등생 맨살에 사인한 동화작가","link":"https://www.etnews.com/20261106000265","pubDate":"2026-11-06T15:46:56+09:00","author":"전자신문","description":"초등학교 강연을 찾은 동화 작가가 자신의 책이 아닌 공책에 사인을 요청한 학생들의 맨살에 직접 사인을 남겨 논란이 일고 있다. 책을 구매해야 사인을 받을 수 있다는 취지의 발언까지 알려지면서 온라인에서 비판이 확산하고 있다. 6일 소셜미디어와 온라인 커뮤니티에 따르면 60대 남성 동화 작가 A씨는 최근 자신의 사회관계망서비스(SNS)에 초등학생 두 명의 팔뚝에 사인한 사진을 올렸다. A씨는 게시물에서 “좀 야박하다고 할지는 몰라도 공책을 찢어","category":"생활 문화"},{"title":"대구교통공사, 대구시와 도시철도 시설물 특별안전점검","link":"https://www.imaeil.com/page/view/2026110613224744743","pubDate":"2026-11-06T14:32:54+09:00","author":"매일신문","description":"최근 도시철도 운행 지연과 각종 장애가 잇따르자 대구교통공사가 대구시와 함께 특별안전점검을 벌이고 비상 대응체계 강화에 나섰다. 대구교통공사는 \"지난 5일 심야부터 6일 새벽까지 허주영 대구시 교통국장과 한근수 대구교통공사 사장, 운영·기술본부장 등이 참여한 가운데 도시철도 시설물 특별안전점검을 실시했다\"고 6일 밝혔다. 이들은 직접 모터카에 탑승해 1·2호선 본선 시설물과 최근 장애가 발생한 3호선 피뢰도선 등을 점검했다. 유사 장애의 재발 가능성과 노후 장비 및 시설물의 상태를 집중적으로 살폈다. 특히 3호선 전차선 피뢰도선 지 - 매일신문","category":"생활 문화"},{"title":"영암 대불산단서 또 20대 청년 노동자 사망···노동계 “엄벌” 요구","link":"https://www.khan.co.kr/article/202611061353001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=society_news","pubDate":"2026-11-06T13:53:00+09:00","author":"경향신문","description":"조선업 밀집한 산단, 2년간 사망 16명“2인1조 등 안 지켜, 작업 중지 해야”전국금속노종조합 광주전남지부는 6일 고용노동부 목포지청 앞에서 기자회견을 열고 “20대 하청 노동자가 작업도중 사망한 HD현대삼호에 대해 즉각적인 작업중지와 철저한 사고원인 조사, 안전관리 실태에 대한 전면적은 점검을 실시하라”고 요구했다. 금속노조 제공.전남광주 영암의 대불···","category":"생활 문화"},{"title":"배달앱 수수료 상한제 실효성 논란…“자영업자 보호 넘어 시장 전체 봐야”","link":"https://www.etnews.com/20261106000197","pubDate":"2026-11-06T13:33:57+09:00","author":"전자신문","description":"배달플랫폼 수수료 상한제 등 가격 규제 입법을 둘러싸고 정책 실효성과 시장 부작용을 면밀히 검토해야 한다는 목소리가 나왔다. 배달플랫폼 수수료를 법으로 강제하는 획일적 규제가 플랫폼 생태계를 위축시키고 자영업자와 소비자 모두에게 피해를 줄 수 있다는 우려도 제기됐다. 국민의힘 김민전 의원은 6일 국회의원회관에서 한국경쟁법학회 주관으로 '자영업자 보호를 위한 배달플랫폼 입법, 무엇을 고려해야 하나?' 토론회를 개최했다. 현재 국회에서는 수수료 상","category":"생활 문화"},{"title":"식당서 여중생 뺨때린 40대…'벌금형'→'징역형' 뒤집힌 이유","link":"https://www.imaeil.com/page/view/2026110610262038075","pubDate":"2026-11-06T10:43:47+09:00","author":"매일신문","description":"식당에서 처음 본 여중생에게 다가가 뺨을 때려 바닥에 쓰러뜨린 40대 남성이 항소심에서 벌금형보다 무거운 징역형의 집행유예를 선고받았다. 부산지법 형사항소4-1부(재판장 정성호)는 6일 아동복지법 위반(아동학대)과 폭행 혐의로 기소된 40대 남성 A씨에게 징역 8개월에 집행유예 2년을 선고했다. 보호관찰도 명령했다. 앞서 1심이 선고한 벌금 500만원보다 무거운 처벌이다. 사건은 지난해 11월 1일 오후 6시쯤 부산 금정구의 한 식당에서 발생했다. 당시 A씨는 식당에 있던 여중생 B양에게 다가가 뒤에서 오른쪽 뺨을 손으로 때렸다. - 매일신문","category":"생활 문화"},{"title":"“배달기사가 내 짜장면 먹는데 제재도 없어?”… 업체 해명에 '반전'","link":"https://www.etnews.com/20261106000086","pubDate":"2026-11-06T10:02:57+09:00","author":"전자신문","description":"배달기사가 자신이 주문한 음식을 몰래 먹고도 정상적으로 배달 업무를 하고 있다는 고객의 주장이 온라인에서 논란이 된 가운데, 배달 플랫폼 측이 해당 음식은 기사가 직접 비용을 부담한 폐기 음식이었다고 해명했다. 6일 관련 업계에 따르면 배달의민족 물류 서비스를 전담하는 우아한청년들은 전날 입장문을 통해 “배달기사가 고객 주문 음식을 먹었다는 취지의 게시물을 확인하고 경위를 조사한 결과, 해당 음식은 라이더가 비용을 부담하는 것으로 처리된 상황이","category":"생활 문화"}],"세계":[{"title":"선거 참패 이틀 만에…백악관 집무실·각료회의실 보존 서명한 트럼프","link":"https://www.mk.co.kr/news/world/12200254","pubDate":"2026-11-06T19:19:18+09:00","author":"매일경제","description":"도널드 트럼프 미국 대통령이 백악관 집무실과 각료회의실을 국가기념물로 지정하는 포고문에 서명했다. 공화당의 중간선거 패배 직후 연회장 공사 현장을 방문한 데 이어 백악관 공간을 보..","category":"세계"},{"title":"“전쟁 곧 끝난다”…트럼프, 우크라 넘어 ‘유럽 전체 합의’ 예고","link":"https://www.mk.co.kr/news/world/12200219","pubDate":"2026-11-06T18:48:42+09:00","author":"매일경제","description":"푸틴 특사 만나 비공개 회동 협상 구체적 내용은 공개 안해도널드 트럼프 미국 대통령은 러시아-우크라이나 전쟁이 곧 끝날 것이라면서 우크라이나를 넘어 유럽 전체를 포괄하는 광범위한 ..","category":"세계"},{"title":"伊 멜로니 \"우크라 협상서 유럽 한목소리 내야\"…EU 대표 결정 촉구","link":"https://www.newsis.com/view/NISX20261106_0003858467","pubDate":"2026-11-06T17:56:19+09:00","author":"뉴시스","description":"[서울=뉴시스] 신효령 기자 = 조르자 멜로니 이탈리아 총리가 우크라이나 종전 협상에서 유럽연합(EU)을 대표할 인사를 12월에 정하자고 제안했다. 유럽 각국이 따로 움직이면서 협상에서 유럽의 신뢰가 떨어졌다는 이유에서다. 5일(현지 시간) 유럽 매체 유로뉴스와 이탈리아 안사통신에 따르면 멜로니 총리는 이날 안토니우 코스타 유럽이사회 상임의장에게 이같은 내용이 담긴 서한을 보냈다. 그는 \"유럽은 우크라이나 문제에서 한목소리를 내야 한다\"며 \"더는 미룰 수 없다\"고 밝혔다. 멜로니 총리는 영국·프랑스·독일 3국 협의체(E3)와 우크라이나 지원국 모임인 '의지의 연합'(Coalition of the Willing) 등 외교 채널이 겹친다고 지적했다. 일부 유럽 국가의 국가안보보좌관과 우크라이나·EU·북대서양조약기구(NATO·나토) 관계자들이 미국 마이애미에서 비공식 회동한 사례도 언급했다. 지난 4~5일 벨기에 브뤼셀에서는 E3와 미국·우크라이나·나토 관계자들이 우크라이나의 전후 안보와 재건 방안을 논의했다. 멜로니 총리는 유럽 각국이 공동 방침이나 명확한 권한 없이 외교에 나선 점을 비판했다. 유럽이 제각각 움직이는 모습은 전쟁이 계속되기를 바라는 쪽에만 이롭다고 주장했다. 현재 EU 외교안보 고위대표는 카야 칼라스로, 임기는 2029년 10월까지다. 칼라스는 유럽이 서로 다른 목소리를 내서는 안 된다는 멜로니 총리의 주장에 공감했다.","category":"세계"},{"title":"“이란전 끝내라”…‘중간선거 참패’ 트럼프, 민주당 압박에 어찌하오리까","link":"https://www.mk.co.kr/news/world/12200091","pubDate":"2026-11-06T17:10:19+09:00","author":"매일경제","description":"미국 중간선거에서 상·하원을 모두 민주당에 내주며 참패한 도널드 트럼프 대통령이 이란 전쟁을 둘러싼 복잡한 셈법 속에서 진퇴양난에 빠졌다. 선거 패배의 주요 원인으로 이란전이 지목..","category":"세계"},{"title":"트럼프, 오벌 오피스 국가기념물 보존 포고령 서명","link":"https://www.newsis.com/view/NISX20261106_0003858168","pubDate":"2026-11-06T17:04:21+09:00","author":"뉴시스","description":"[서울=뉴시스] 구자룡 기자 = 도널드 트럼프 미국 대통령은 5일 백악관 집무실(오벌 오피스)와 내각 회의실 등을 국가 기념물로 보존하는 내용의 포고령에 서명했다. 이는 3일 선거에서 공화당이 상하원을 모두 내주는 참패를 당한 후 트럼프 대통령이 취한 첫 공식 조치라고 AP 통신은 보도했다. 트럼프 대통령은 포고문에 서명한 뒤 “누구도 손대거나, 파괴하거나, 멍청한 사람들이 약간 다른 모양으로 뭔가를 짓기 위해 허물어뜨리는 것을 허용하지 않을 것”이라고 말했다. 하지만 후임 대통령이 트럼프 대통령의 포고령을 바꾸는 조치를 통해 트럼프가 금빛 장식으로 가득 채운 집무실을 재단장하는 것을 막지 못한다고 AP 통신은 전했다. 트럼프 대통령 자신도 지난해 1월 취임 이후 전임자들의 국가 기념물 지정을 뒤집은 바 있다. 백악관과 그 부지는 국립공원관리청이 관리하는 대통령 공원의 일부로 연방 소유이며 이미 국가 사적지로 지정되어 있다. 그럼에도 집무실은 국가적으로 중요한 역사적 건축물로서 별도의 지정과 보호 관리가 필요하다고 포고문은 밝혔다. 국가 기념물로 지정되는 곳은 집무실(110호), 외곽 집무실(106호 및 108호), 캐비넷 룸(내각 회의실)(105호) 등이다. 포고문에 따르면 내무부 장관은 국립공원관리청을 통해 기념물의 역사적 특성, 건축적 완전성 및 대통령직과의 연관성을 보호하는 방식으로 기념물을 관리하도록 했다. 장관은 기념물의 ","category":"세계"},{"title":"선전APEC 앞두고 車 경적 금지하자…호루라기·트럼펫·닭울음 인형 등장","link":"https://www.newsis.com/view/NISX20261106_0003857924","pubDate":"2026-11-06T14:47:45+09:00","author":"뉴시스","description":"[서울=뉴시스] 구자룡 기자 = 중국 광둥성 선전시는 18일과 19일 아시아태평양경제협력체(APEC) 정상회의 개최에 앞서 이달부터 시내 모든 차량에 대해 경적 사용을 금지했다. 경적 금지 시행 1주일이 채 안된 가운데 거리에서는 운전자들이 경적을 대신하는 다양한 대처법들이 등장하고 있다고 홍콩 명보와 현지 언론이 6일 전했다. 길을 막고 있는 보행자에게 큰 소리를 지르거나 어떤 운전자는 닭 울음 소리를 내는 인형을 사용했다. 초록불인데도 오랫동안 정차해 있는 경우 내려서 앞차의 창문을 두드리는 사람도 있었다. 경적 대신 호루라기, 확성기 심지어 트럼펫을 사용하는 사람들의 사진도 온라인에 올라왔다. 일부 운전자들은 무심코라도 경적을 사용하지 않도록 ‘누르기 금지’ 스티커를 핸들에 크게 붙여두기도 했다. 선전시에 따르면 경적금지 유효기간은 5년이며 1회 위반시 300위안(약 6만원)의 벌금이 부과된다. 1년 내에 3회 이상 위반할 경우 3회부터는 건당 벌금이 500위안으로 늘어난다. 다만 급커브, 오르막길 정상, 시야 확보가 어려운 구간, 추월 또는 비상 상황 발생시 등에는 경적 사용이 허용된다. 시는 5일 공식 웨이보 계정을 통해 선전시의 24시간 경적 금지령은 새로운 것이 아니라 기존 규정의 갱신이라고 공지했다. 선전경제특구는 1996년 경적 금지령을 시행했고, 2000년 이를 시 전체로 확대했다는 것이다. ◎공감언론 뉴시스 kjd","category":"세계"},{"title":"“지켜보고 있다” 선거 참패 후 보수단체에 이메일 뿌린 트럼프 백악관","link":"https://www.khan.co.kr/article/202611061402001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-06T14:02:00+09:00","author":"경향신문","description":"도널드 트럼프 미국 대통령이 5일(현지시간) 워싱턴 백악관 오벌 오피스에서 발언하고 있다. AP연합뉴스미국 백악관이 공화당의 중간선거 참패 후 3000여곳의 보수단체에 “활동을 지켜보고 있다”는 내용의 경고성 메시지를 발신한 것으로 전해졌다. 백악관은 외부의 지지를 얻기 위한 노력이라고 설명했다.월스트리트저널(WSJ)은 5일(현지시간) 백악관 대외협력실이 ···","category":"세계"},{"title":"잇단 사임설에 입 연 루비오 “트럼프 대통령 임기 끝까지 일할 것”","link":"https://www.khan.co.kr/article/202611061339001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-06T13:39:00+09:00","author":"경향신문","description":"‘2028년 대선 출마’ 질문에는 답변 회피마코 루비오 미국 국무장관이 지난 4일(현지시간) 미국 워싱턴 DC 국무부에서 발언하고 있다. 로이터연합뉴스미국 중간선거에서 공화당이 참패한 뒤 마코 루비오 국무장관의 사임설이 잇따라 제기되자, 루비오 장관이 직접 나서 사임설을 일축했다.루비오 장관은 5일(현지시간) 뉴욕타임스(NYT) 인터뷰에서 “도널드 트럼프 ···","category":"세계"},{"title":"이란, 미국에 핵 협상안 전달…“7개 조건 먼저 이행”","link":"https://www.khan.co.kr/article/202611060902001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-06T09:02:00+09:00","author":"경향신문","description":"트럼프 선거 참패 직후러시아와는 전후 안보 논의지난 3일(현지시간) 이란 테헤란에 스티브 윗코프 미국 특사, 도널드 트럼프 미국 대통령, 베냐민 네타냐후 이스라엘 총리, JD 밴스 미국 부통령이 그려진 광고판이 설치돼 있다. AP연합뉴스이란이 중재국 카타르를 통해 미국에 핵 협상 제안서를 전달했다. 이란은 앞서 제시한 7가지 조건이 충족되면 핵 협상이 진행···","category":"세계"},{"title":"300만 명 계좌 막히자 시위대 거리로…파라과이 대통령, 결국 백기","link":"https://www.imaeil.com/page/view/2026110609003857308","pubDate":"2026-11-06T09:01:18+09:00","author":"매일신문","description":"파라과이 성인 인구의 60%가 쓰던 디지털 은행이 사흘 만에 무너졌다. 300만 명의 예금이 묶이고 거리에 시위대가 쏟아지자, 산티아고 페냐 파라과이 대통령이 5일(현지시간) 임기를 2년 남기고 중도 사임했다. 페냐 대통령은 이날 소셜미디어에 공개한 영상에서 \"우리나라의 안정, 사회적 평화, 민주주의 제도를 수호해야 할 필요성을 염두에 두고 이같이 결정했다\"고 밝혔다. 이어 \"만약 제가 어느 시점에 실수를 저질렀다면 국민 여러분께 사과드리고 싶다\"고 덧붙였으나, 우에노 은행과의 연루 의혹에 대해서는 직접적인 과오를 인정하지 않았다. - 매일신문","category":"세계"}],"IT 과학":[{"title":"\"中스파이 여성과 무슨 사이냐\"…젠슨 황, 결국 美의회 소환됐다","link":"https://www.imaeil.com/page/view/2026110619372009593","pubDate":"2026-11-06T20:06:42+09:00","author":"매일신문","description":"미국 하원이 젠슨 황 엔비디아 최고경영자(CEO)에게 중국 정부의 정보원이라는 의혹을 받는 앨리스 황과의 관계 및 접촉 경위를 소명하라고 요구했다. 5일(현지시각) 악시오스에 따르면 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼 정보위원장은 이날 황 CEO에게 공동 서한을 보냈다. 이들은 세 위원회가 함께 진행하는 비공개 브리핑에 황 CEO가 직접 참석해 앨리스 황과 어떤 교류를 해왔는지 설명해 달라고 요청했다. 또 외국의 정보 수집 시도에 대응하기 위해 엔비디아가 어떤 보안 체계를 운용하고 있는지 - 매일신문","category":"IT 과학"},{"title":"“데이터센터 짓지 마” 외국인, 반도체 3조 던진 이유","link":"https://www.mk.co.kr/news/business/12200206","pubDate":"2026-11-06T18:32:50+09:00","author":"매일경제","description":"나스닥이 하루 만에 5.5% 폭락하며 조정 국면에 들어섰습니다. 민주당이 상·하원을 모두 가져가면서 AI 데이터센터 규제가 강해질 수 있다는 공포가 하루 늦게 시장을 덮쳤는데요. ..","category":"IT 과학"},{"title":"조진중 '시그널2' 내달 7일 공개…“AI로 배우 대체 못해”","link":"https://www.etnews.com/20261106000317","pubDate":"2026-11-06T17:42:21+09:00","author":"전자신문","description":"배우 조진웅의 과거 소년범 전력 논란으로 공개가 무기한 연기됐던 tvN 드라마 '두 번째 시그널'(시그널2)이 오는 12월 7일 방송을 확정했다. 조진웅의 출연 분량은 그대로 유지된다. tvN은 인공지능(AI)을 활용한 배우 교체까지 검토했지만 기술적 한계로 최종 적용하지 않기로 했다. 6일 tvN에 따르면 '시그널2'는 12월 7일부터 매주 월·화요일 오후 10시에 방송된다. 총 8부작으로 제작된 이번 작품은 첫 주에 3회까지 공개된다. 첫","category":"IT 과학"},{"title":"“韓처럼 성과급 달라” 대만 공장 건설 멈춘 마이크론…삼전닉스, 반사이익 거둘까","link":"https://www.etnews.com/20261106000307","pubDate":"2026-11-06T17:10:06+09:00","author":"전자신문","description":"마이크론의 대만 신규 공장 건설이 노사 갈등으로 사실상 중단되면서 삼성전자와 SK하이닉스가 반사이익을 얻을 수 있다는 전망이 나온다. 인공지능(AI) 반도체 수요 급증으로 메모리 공급 부족이 이어지는 상황에서 글로벌 3위 업체의 생산능력 확대에 차질이 생겼기 때문이다. 5일(현지시간) 블룸버그통신에 따르면 마이크론은 대만 북부 타오위안에 건설 중인 반도체 공장 '팹 11E'의 공사를 사실상 중단했다. 당초 2028년 가동을 목표로 최대 45억","category":"IT 과학"},{"title":"뉴욕 선물시장 혼조 속 나스닥 반등…현물시장도 상승할까?","link":"https://www.newsis.com/view/NISX20261106_0003858448","pubDate":"2026-11-06T17:06:35+09:00","author":"뉴시스","description":"[서울=뉴시스] 유세진 기자 = 미국 주식 선물시장은 혼조세를 보이고 있지만 민주당의 중간선거 압승으로 인공지능(AI)에 대한 규제 강화 우려로 급락했던 나스닥 지수 선물은 소폭 반등하면서 뉴욕 증시의 반등 가능성에 대한 기대를 갖게 했다고 CNBC가 6일 보도했다. 뉴욕 증시 지수 선물은 이날 다우존스 산업평균지수가 1.3% 하락했고, S&P 500 선물 역시 0.35% 하락했지만, 나스닥100 선물은 0.3%포인트 상승, 5일 큰 손실의 일부를 만회했다. 하지만 이날 아시아 증시는 한국과 일본, 호주, 홍콩과 중국 증시 모두 하락했다. 특히 한국과 일본 증시가 큰 폭으로 하락하며, 아시아 증시 하락을 주도했다. 나스닥지수는 5일 5.5%나 급락했다. S&P 500은 4.4%, 다우 지수는 3.4% 떨어졌다. ◎공감언론 뉴시스 dbtpwls@newsis.com","category":"IT 과학"},{"title":"급락한 K방산주, 드론 시대 시험대…전차·자주포 수요는 여전","link":"https://www.newsis.com/view/NISX20261106_0003858440","pubDate":"2026-11-06T17:05:38+09:00","author":"뉴시스","description":"[서울=뉴시스]박영환 기자 = 한국 방산주가 실적 부진과 수출계약 지연으로 급락했지만 전차·자주포 등 주력 무기의 장기 수요는 여전히 유효하다는 분석이 나왔다. 미국 경제매체 CNBC는 5일(현지 시간) 한국 방산업체들의 주가 하락 배경과 드론 확산에 따른 무기 수요 변화를 분석했다. CNBC가 인터뷰한 전문가들은 드론과 드론 공격을 막는 대드론 체계의 중요성이 커졌지만, 전차·자주포 등 기존 무기체계도 여전히 필요하다고 평가했다. CNBC에 따르면 한화에어로스페이스와 LIG 디펜스&에어로스페이스(LIG D&A), 현대로템, 한국항공우주산업(KAI)의 시가총액 합계는 지난달 30일 기준 약 62조원이다. 각 종목의 52주 최고가를 기준으로 계산한 시가총액 합계 170조원보다 108조원 적다. 한국 방산업체들은 러시아의 우크라이나 침공 이후 유럽 각국이 국방비를 늘리면서 수혜를 봤다. 전차와 자주포, 미사일 체계를 경쟁력 있는 가격에 비교적 빨리 공급할 수 있다는 점이 강점으로 꼽혔고, 지난 2년간 방산주 상승세를 뒷받침했다. 그러나 CNBC는 올해 들어 실적 부진과 원화 강세, 수출계약 지연 등이 주가를 압박했다고 짚었다. 피터 김 KB증권 선임 전무는 반도체 업종으로 자금이 옮겨간 데다 성장 기대를 반영해 주가가 이미 높아졌던 점도 부담이 됐다고 설명했다. 각국 정부의 국방비 증액 약속이 실제 예산 승인과 발주로 이어지는 속도 역시","category":"IT 과학"},{"title":"배경훈 \"글로벌 AI 투자 불안에도 韓 투자 늦춰선 안 돼\"","link":"https://www.newsis.com/view/NISX20261106_0003858362","pubDate":"2026-11-06T16:38:39+09:00","author":"뉴시스","description":"[서울=뉴시스]심지혜 기자 = 배경훈 부총리 겸 과학기술정보통신부 장관이 미국의 인공지능(AI) 데이터센터 규제 움직임과 시장 불안에도 국내 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 투자 확대에 제동이 걸리더라도 글로벌 빅테크의 AI 투자는 지속되고, 다른 국가에는 새로운 기회가 될 수 있다는 판단이다. 배 부총리는 6일 국가AI전략위원회 전체회의 이후 기자들과 만나 최근 미국의 AI 데이터센터 규제 움직임과 국내 투자 위축 우려에 대해 \"한국이 지금의 분위기에 휩쓸려서 투자를 멈추거나 늦추면 안 된다고 생각한다\"고 말했다. 그는 \"AI 속도 조절론에 대한 이야기도 있었지만 결국 빅테크들은 인공지능을 통해 새로운 산업과 문화를 계속 만들어 가려고 할 것이기 때문에 투자를 계속할 것\"이라고 전망했다. 미국의 투자 환경 변화가 다른 국가에는 기회가 될 수 있다는 점도 강조했다. 배 부총리는 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"고 언급했다. 이어 \"AI는 기대 심리가 너무 크다 보니 조금의 불안한 상황만 만들어져도 시장이 출렁거린다\"면서도 \"이렇게 출렁거리면서도 계속해서 우상향해 나가지 않을까 생각한다\"고 말했다. 한편 배 부총리는 범정부 차원의 사이버안보 대응체계 강화와 관련해 \"국가 차원의 대응체계가 필요하다는 데 공감하고 있다\"며 \"민간과 군을 포함한 여러 이해관계자를 ","category":"IT 과학"},{"title":"엔비디아, 'RTX 스파크' 기술 소개…차세대 'AI PC' 경험 제시","link":"https://www.etnews.com/20261106000278","pubDate":"2026-11-06T16:03:09+09:00","author":"전자신문","description":"엔비디아가 그래픽처리장치(GPU)와 중앙처리장치(CPU)를 단일 칩으로 결합한 'RTX 스파크(RTX Spark)'를 앞세워 클라우드 연결 없이 개인용 PC에서 인공지능(AI) 비서를 직접 구동하는 '로컬 AI' 시장 공략에 본격적으로 나섰다. 하드웨어 슈퍼칩과 함께 메모리 사용량을 대폭 줄인 경량 모델, 로컬·클라우드 하이브리드 기술을 동시에 선보이며 온디바이스 AI 생태계를 완성한다는 전략이다. 엔비디아는 6일 서울 종로구 JW 메리어트 동","category":"IT 과학"},{"title":"기본법 우선 등 'AI 입법 프레임워크' 나왔다…국가AI전략위, 7개 TF 신설","link":"https://www.etnews.com/20261106000224","pubDate":"2026-11-06T16:00:00+09:00","author":"전자신문","description":"인공지능(AI) 관련 입법 추진에 앞서 참고해야 할 '대한민국 AI 입법 프레임워크'가 나왔다. 국가AI전략위원회가 국가 AI 핵심과제 추진을 위해  중 총격을 받아 숨졌다. 튀르키예 국방부는 5일(현지시간) 정례 브리핑에서 군인 1명이 지난달 31일 불법 월경 개입 과정에서 총격으로 사망했다고 밝혔다. 국방부는 \"튀르키예-이란 국경 엔긴 마인 국경 초소 책임 구역에서 불법 월경 개입 도중 보병 계약직 일병이 이란 쪽에서 발사된 것으로 추정되는 총격에 의해 사망했다\"고 설명했다. 사망 병사는 하카리주 윅세코바 지구 제7국경여단 소속으로, 총격 직후 헬기로 하카리 주립병원에 후송됐으나 끝내 숨졌다. 유해는 서부 아이든주 치네 - 매일신문","category":"사건 사고"},{"title":"스페인 “극우 무너졌다” 폴란드 “민주주의 승리”…우크라 “지원 확대”","link":"https://www.khan.co.kr/article/202611052057005/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T20:57:00+09:00","author":"경향신문","description":"트럼프 패배에 유럽 내 온도차종전 실무 협상 앞둔 러 “중재 기대” 극우 진영선 언급 피하며 선 긋기 외교 영향 우려…다수 ‘원론 답변’ 일각선 “전기톱 학살 당했다” 평가미국 중간선거에서 공화당이 참패하며 도널드 트럼프 대통령의 레임덕(권력누수)이 가시화하자 유럽 각국의 표정이 엇갈렸다. 트럼프 대통령과 충돌해온 스페인 등의 정상은 반색했다. 전쟁 중인 ···","category":"사건 사고"},{"title":"\"2025년 암 사망원인 1위 폐암\"…법의학자가 전한 폐 건강 관리법","link":"https://www.newsis.com/view/NISX20261105_0003855955","pubDate":"2026-11-05T18:00:00+09:00","author":"뉴시스","description":"[서울=뉴시스]강주연 인턴 기자 = 2025년 국내 사망원인 1위인 암 가운데, 폐암이 사망원인으로 가장 높은 비중을 차지하는 것으로 나타났다. 이에 금연과 실내 환기, 미세먼지가 심한 날 마스크 착용, 꾸준한 유산소 운동 등 평소 폐 건강 관리가 중요하다는 전문가의 조언이 나왔다. 지난 3일 유성호 서울대학교 의과대학 법의학교실 교수는 유튜브 채널 '유성호의 데맨톡'에서 \"2025년 사망원인 통계를 보면 우리나라 3대 사망원인은 암, 심장질환, 폐렴 순\"이라며 \"암 가운데 사망원인이 가장 높은 암은 폐암이다. 이어서 \"결론적으로 폐암과 폐렴 등 폐와 관련된 사망 질환이 무척 많다\"고 덧붙였다. 폐는 직접 숨을 쉴 수 없고, 뇌의 명령에 따라 주변 근육이 움직이면서 호흡이 이뤄진다. 유 교수는 \"폐에는 근육이 없다\"며 \"갈비뼈 사이 근육과 횡격막이 수축하고 이완하면서 몸통 안에 음압이 생기고, 그 압력으로 폐가 부풀어 오른다\"고 설명했다. 숨을 쉬도록 명령하는 기관은 뇌줄기에 자리한 연수다. 유 교수는 \"몸에 이산화탄소가 쌓이면 연수가 민감하게 반응해 갈비뼈 사이 근육과 횡격막을 움직이도록 명령한다\"고 말했다. 평소에는 호흡을 따로 의식하지 않고 살아가지만 운동할 때는 숨쉬기에 신경 써야 한다. 유 교수는 달리기와 수영을 예로 들며 특히 수영할 때는 숨을 충분히 내쉬어야 한다고 설명했다. 그는 \"수영할 때 숨을 제대로 내뱉지 못하는 ","category":"사건 사고"},{"title":"군위군, 지역안전지수 자살 분야 3년 연속 2등급…생명존중 문화 확산","link":"https://www.imaeil.com/page/view/2026110516161412833","pubDate":"2026-11-05T16:19:35+09:00","author":"매일신문","description":"대구 군위군이 행정안전부가 산출한 '지역안전지수' 자살 분야에서 3년 연속 2등급을 받았다. 지역안전지수는 교통사고, 화재, 범죄, 생활안전, 자살, 감염병 등 6개 분야의 안전역량을 5개 등급으로 계량화한 지표로, 1등급에 가까울수록 안전한 지역으로 평가된다. 군위군은 군위읍과 부계면을 생명존중안심마을으로 지정하고, 생명존중 병·의원 및 약국 8곳을 지정, 운영하는 등 지역 사회 기반의 생명 존중 문화를 확대하고 있는 점이 높이 평가됐다. 특히 노년기 맞춤형 자살 예방 특화사업인 '보물함(보고, 물어보고, 함께하는 이웃)'을 통해 - 매일신문","category":"사건 사고"},{"title":"제2 반도체는 K-바이오…\"혁신생태계로 대전환\"","link":"https://www.newsis.com/view/NISX20261105_0003856724","pubDate":"2026-11-05T16:14:33+09:00","author":"뉴시스","description":"[서울=뉴시스]황재희 기자 = 바이오산업을 반도체에 이은 차세대 성장엔진으로 키우려면 정부 R&D 지원 방식을 보조금에서 투자형으로 바꾸고, 규제체계도 신기술의 시장 진입을 앞당기는 방향으로 전환해야 한다는 제언이 나왔다. 국민경제자문회의와 국가과학기술자문회의, 국가바이오혁신위원회는 5일 서울 코리아나호텔 그랜드볼룸에서 '대한민국 넥스트 엔진: 바이오 대혁신, 국가미래성장을 잇다'를 주제로 공동포럼을 열었다. 경제와 과학기술을 아우르는 바이오 분야의 특성상 연구 개발부터 투자·산업화, 규제 개선까지 정책 전반을 묶어서 봐야 한다는 판단에 따라 세 기구가 함께 자리를 마련했다. 포럼에는 노연홍 한국제약바이오협회 회장, 주요 제약·바이오기업 대표 등 산·학·연 관계자 300여명이 참석했다. 김성식 국민경제자문회의 부의장은 환영사에서 바이오산업을 \"반도체에 이은 대한민국의 차세대 성장엔진으로 육성해야 한다\"고 말하며 \"임상·사업화 단계의 R&D 투자 확대, AI·바이오 데이터 생태계 구축, 불필요한 규제 혁신이 핵심 과제\"라고 말했다. 이어 \"투자·데이터·제도 혁신이 유기적으로 연결되는 선순환 구조를 통해 실질적인 국가 성장으로 이어가야 한다\"고 덧붙였다. 이경수 국가과학기술자문회의 부의장은 “좋은 연구가 좋은 기술로 이어지고, 국민의 삶을 바꾸는 성과로 열매 맺기까지 과학기술과 경제, 정책과 제도가 함께 움직여야 한다”며 “우리나라 바이","category":"사건 사고"},{"title":"[미 중간선거]트럼프 레임덕 가시화에 “민주주의 승리”“미국 내부 문제”···엇갈린 표정","link":"https://www.khan.co.kr/article/202611051601011/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T16:01:01+09:00","author":"경향신문","description":"도널드 트럼프 미국 대통령이 11·3 중간선거를 하루 앞둔 지난 2일(현지시간) 미국 워싱턴 D C 링컨기념관 반사연못에서 연설하기 위해 도착하고 있다. 로이터연합뉴스11·3 미국 중간선거에서 공화당이 참패하며 도널드 트럼프 대통령의 레임덕(권력누수)이 가시화하자 유럽 각국의 표정이 엇갈렸다. 트럼프 대통령과 충돌해온 스페인 등의 정상은 반색했다. 전쟁 ···","category":"사건 사고"},{"title":"대구교통공사, 반월당역에 AI 인파밀집 관리 기술 실증…혼잡 위험 사전 예측","link":"https://www.imaeil.com/page/view/2026110509283151001","pubDate":"2026-11-05T15:26:58+09:00","author":"매일신문","description":"대구교통공사가 도시철도 반월당역을 대상으로 인공지능(AI)과 디지털 트윈 기술을 활용한 인파밀집 사고 예방 기술 실증에 나선다. 실시간 혼잡 상황을 파악하는 데 그치지 않고 이용객 이동 흐름을 분석해 혼잡 위험을 사전에 예측하는 것이 핵심이다. 대구교통공사는 \"지난 4일 ㈜애나 등 참여기관과 'AI 기반 철도역사 인파밀집사고 예방을 위한 디지털 트윈 플랫폼 기술개발' 현장 실증을 위한 업무협약을 체결했다\"고 5일 밝혔다. 이번 사업은 조달청과 한국조달연구원(KIP)이 이 지역 주민들과 정가의 눈길을 끌고 있다. 박용선 포항시장, 황병직 영주시장, 조현일 경산시장, 조주홍 영덕군수, 박권현 청도군수, 황이주 울진군수 등은 지난달 열린 경북 시장군수 협의회 직후 별도의 자리를 갖고 경북도내 도의원을 지낸 현직 시장·군수들의 별도 정례 모임을 논의한 것으로 확인됐다. 모임은 도의원 시절부터 축적해 온 의정 경험과 광역 도정에 대한 깊은 이해도를 바탕으로 각 지자체 간 상생 발전은 물론 경북도 - 매일신문","category":"사회"},{"title":"중간선거 참패한 트럼프, 중남미에 더 강경해질까···쿠바 군사개입 가능성 주목 [미 중간선거]","link":"https://www.khan.co.kr/article/202611051533001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T15:33:00+09:00","author":"경향신문","description":"도널드 트럼프 미국 대통령이 중간선거 다음 날인 4일(현지시간) 백악관 내 새 연회장 건설 현장을 찾아 발언하고 있다. UPI연합뉴스미국 중간선거에서 공화당이 참패하면서 도널드 트럼프 행정부의 중남미 정책이 더욱 강경해질 수 있다는 전망이 나온다. 민주당이 상·하원을 모두 장악하면서 국내 정책 추진에 제약을 받게 된 트럼프 대통령이 공격적 대외 행보를 통해···","category":"사회"},{"title":"[미 중간선거] 미시시피·알래스카 초접전···“민주당 하원 최대 262석 예상”","link":"https://www.khan.co.kr/article/202611051518001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T15:18:00+09:00","author":"경향신문","description":"3일(현지시간) 미국 워싱턴 미 국회의사당의 모습. 신화연합뉴스미국 중간선거 다음 날인 4일(현지시간)에도 일부 지역에서 개표 결과가 확정되지 않아 집계가 이어지고 있다. 민주당이 이미 상·하원에서 과반을 차지한 가운데 남은 접전지에서도 의석을 확보할 수 있을지 주목된다.이날도 알래스카주와 미시시피주에서는 상원 선거에 대한 개표가 진행됐다. 미시시피주에서는···","category":"사회"},{"title":"전남광주통합특별시, 교량·터널 점검 설계내역서 30일→1일로 줄인 AI 플랫폼 자체 개발","link":"https://www.imaeil.com/page/view/2026110514490871051","pubDate":"2026-11-05T14:49:41+09:00","author":"매일신문","description":"한 달 넘게 걸리던 도로시설물 안전점검 설계내역서 작성이 하루 만에 끝나게 됐다. 전남광주통합특별시는 종합건설본부 신해섭 주무관이 기획·개발한 '시설물 안전관리 실무 플랫폼'을 구축해 운영하고 있다. 별도의 외부 용역이나 개발 예산을 투입하지 않고 현장 담당자가 직접 만든 행정 시스템이다. 교량과 터널, 지하차도, 옹벽 등 도로시설물은 종류와 규모에 따라 안전 점검 기준과 주기가 다르다. 관리 대상이 수백 개에 이르다 보니 담당자가 시설물마다 점검 일정을 확인하고, 안전 점검 용역을 발주할 때마다 설계내역서를 따로 작성해야 했다. - 매일신문","category":"사회"},{"title":"벡스코 정전 원인은 통신공사 중 합선…비상발전기 켜졌어도 전력 공급 실패","link":"https://www.imaeil.com/page/view/2026110514472209523","pubDate":"2026-11-05T14:47:59+09:00","author":"매일신문","description":"지난달 부산 해운대구 벡스코에서 발생한 26분간의 정전은 전력 감시시스템 통신공사 중 작업자가 통신선을 고압 선로에 접촉시켜 합선을 일으킨 것이 원인으로 확인됐다. 벡스코에 따르면 한국전기안전공사가 정밀 점검한 결과 이같이 드러났다. 전기설비 감시 시스템에 정상 범위를 벗어난 수치가 나타나자 시공업체가 현장 점검에 나섰고, 문에 눌려 손상된 통신선을 발견했다. 작업자가 해당 통신선을 교체하던 중 전기가 흐르는 설비에 접촉해 합선이 발생했다. 정전은 제1전시장과 사무동에 오후 3시 9분께 시작됐다. 26분간 이어지면서 4개 전시 행사 - 매일신문","category":"사회"}],"생활 문화":[{"title":"원아에게 물려 파상풍 주사 맞은 교사…되레 아동학대로 고소당했다, 왜?","link":"https://www.imaeil.com/page/view/2026110521261379134","pubDate":"2026-11-05T21:27:24+09:00","author":"매일신문","description":"세종시의 한 공립유치원에서 원아에게 신체적 피해를 입은 교사가 학부모로부터 아동학대 혐의로 고소당하는 일이 벌어졌다. 학부모는 아이 몸에 생긴 상처를 두고 교사가 목을 졸랐다고 주장하고 있지만, 교사 측은 사실이 아니라며 맞서고 있다. 세종시교육청은 관내 공립유치원에서 발생한 교사 아동학대 피소 사건과 관련해 교원 보호와 원아의 안정적인 교육활동 참여를 위한 대책을 마련하겠다고 5일 밝혔다. 전국교직원노동조합 세종지부와 세종교육청 등에 따르면 이 유치원 특수교육대상 원아의 보호자는 최근 담당 교사 A씨를 아동학대 혐의로 고소했다. - 매일신문","category":"생활 문화"},{"title":"“학생 수당 지키자” 덴마크서도 4만명 수업 거부 거리로","link":"https://www.khan.co.kr/article/202611052057035/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T20:57:03+09:00","author":"경향신문","description":"예산 삭감 반발서 시작…‘국방비 우선’ 정부 정책 반대 목소리학교 비운 학생들 4일(현지시간) 덴마크 코펜하겐에서 고교·대학 학생단체 12곳이 공동으로 주최한 시위에서 학생들이 교육 예산 삭감 반대를 외치고 있다. EPA연합뉴스덴마크에서도 정부의 교육예산 삭감에 반발한 학생들이 대규모 수업 거부와 거리 시위에 나섰다. 국방비를 늘리기 위해 교육·복지 예산을···","category":"생활 문화"},{"title":"[책과 삶]누군가에겐 당연하지 않은 ‘오줌권’","link":"https://www.khan.co.kr/article/202611052052015/?utm_source=khan_rss&utm_medium=rss&utm_campaign=culture_news","pubDate":"2026-11-05T20:52:01+09:00","author":"경향신문","description":"우리들의 오줌권김지학 지음 | 원더박스 | 296쪽 | 2만원볼일이 급할 때 가까운 화장실을 찾아 해결하는 일. 다수에게는 일상적인 일이지만 장애인들에게는 고도의 계획이 필요한 일이다. 콜센터나 물류센터에서 일하는 노동자들은 바쁘다는 이유로 화장실행을 거절당하기도 한다. 누구든 제약 없이 화장실을 이용할 수 있게 하는 ‘오줌권’은 인권과 긴밀히 연결돼 있다···","category":"생활 문화"},{"title":"[새책]일은 당신에게 위험하다 外","link":"https://www.khan.co.kr/article/202611052052005/?utm_source=khan_rss&utm_medium=rss&utm_campaign=culture_news","pubDate":"2026-11-05T20:52:00+09:00","author":"경향신문","description":"일은 당신에게 위험하다산업안전보건 기준은 제조업에서 일하는 남성 노동자를 표준으로 한다. 그러나 현장엔 여성도 있다. 직업환경전문의인 저자는 수십 년 동안 일터에서 여성 노동자들을 접하며 그들의 안전할 권리를 고민한다. 한국 여성 노동자들의 노동보건 역사가 담긴 산문집. 김현주 지음. 마름모. 1만9800원슈거 제너레이션2039년, 중동 전쟁으로 유가가 치···","category":"생활 문화"},{"title":"4살아이 버스에 3시간 갇혔는데 아무도 몰랐다…어쩌다","link":"https://www.imaeil.com/page/view/2026110520342881262","pubDate":"2026-11-05T20:34:37+09:00","author":"매일신문","description":"4살 여자아이가 영어학원 통학버스에서 내리지 못한 채 약 3시간 동안 홀로 갇혀 있었던 사실이 드러났다. 경기남부경찰청은 아동복지법 위반 혐의로 학원 대표와 버스기사 등 4명에 대한 고소장을 접수해 수사하고 있다고 5일 밝혔다. 사건은 지난달 1일 발생했다. 당시 4살 A양은 오전 10시께 학원 통학버스를 타고 등원했지만, 안전벨트를 풀지 못해 차량에서 내리지 못한 것으로 전해졌다. 문제는 A양이 버스에 남아 있다는 사실을 아무도 알아채지 못했다는 점이다. 함께 탑승한 차량 도우미는 A양의 하차 여부를 확인하지 못했고, 버스는 아이 - 매일신문","category":"생활 문화"},{"title":"대구지법 '피해자 주소 노출' 사고…\"실수 아닌 살인 방조 행위\"","link":"https://www.imaeil.com/page/view/2026110515283787081","pubDate":"2026-11-05T20:04:20+09:00","author":"매일신문","description":"최근 대구 법원의 '실수'로 스토킹 피해자의 주소지가 가해자에게 노출되는 사건이 발생했다. 개인정보 노출로 폭력 피해자들이 살해되거나 안전에 위협을 느끼는 일이 다수 발생하는 만큼, 재발 방지 대책을 강구해야 한다는 목소리가 나온다. 대구여성의전화는 지난달 23일 대구지방법원이 스토킹 가해자에게 피해자의 주소지를 노출하는 사고가 발생했다고 5일 밝혔다. 피해자가 스토킹에 따른 잠정조치를 연장하는 과정에서 법원이 가해자에게 발송할 잠정조치 결정문 속 가해자 주소지를 피해자의 실거주지로 오기입했다는 것이다. 단체에 따르면 피해자는 전남 - 매일신문","category":"생활 문화"},{"title":"세월호 기록·한글 조리서, 세계기록유산 아태지역 등재(종합)","link":"https://www.newsis.com/view/NISX20261105_0003857040","pubDate":"2026-11-05T19:52:11+09:00","author":"뉴시스","description":"[서울=뉴시스] 조성하 한이재 기자 = 단원고 학생들 관련 기록물과, 현재 전하는 가장 오래된 한글 조리서 등이 유네스코 세계기록유산 아시아태평양 지역목록에 이름을 올렸다. 유네스코 세계기록유산 아시아태평양 지역위원회(MOWCAP)는 5일 인도네시아 자카르타에서 총회를 열고 '단원고 4.16 아카이브'와 '수운잡방과 음식디미방'의 세계기록유산 아태지역목록 등재를 최종 결정했다. MOWCAP는 유네스코 세계기록유산 프로그램을 위한 지역위원회로 세계기록유산 자문기구인 IAC의 부속기구다. 2년 주기로 세계기록유산 아시아태평양 지역목록을 등재한다. 진정성, 완전성, 지역적 중요성 등을 기준으로 등재한다. 여기에는 역사적 중요성, 형태와 양식, 사회적, 공동체적 또는 정신적 중요성, 독창성과 희귀성 등이 있다. '단원고 4·16 아카이브'는 2014년 세월호 침몰 사고로 세상을 떠난 단원고 학생들의 생전 일상과 국민의 추모 활동, 유가족과 생존자들의 회복 노력에 관한 기록물 23만5220점이다. 유산청은 \"세계기록유산 한국위원회는 해당 기록물에 대하여 시민과 유가족이 민간의 시각에서 사회적 재난의 실상을 기록하였고, 기록 과정 자체가 재난의 고통과 상처를 치유하고 회복하는 과정이라는 점을 높이 평가했다\"고 설명했다. 4·16연대는 이날 성명을 내고 \"23만5220점에 이르는 기록은 국가가 만든 것이 아니라 참사 직후부터 피해자 가족과 시민들","category":"생활 문화"},{"title":"\"식중독 확산 막는다\"…식약처·WHO, 합동훈련","link":"https://www.newsis.com/view/NISX20261105_0003856826","pubDate":"2026-11-05T16:57:28+09:00","author":"뉴시스","description":"[서울=뉴시스]송종호 기자 = 식품의약품안전처가 식중독 독소에 오염된 수입 원료로 만든 식품이 국내에 유통되는 상황을 가정해 국제기구와 합동 대응훈련을 했다. 식품안전 사고 발생 시 신속한 정보 공유와 피해 확산 방지 등 위기대응 역량을 강화하기 위해서다. 식약처는 식품 안전사고 발생 시 신속한 대응으로 피해 확산을 방지하고 위기대응 체계를 점검하기 위해 '2026년 재난 대응 안전한국훈련'을 실시했다고 5일 밝혔다. 이번 훈련은 세레울라이드 독소가 검출된 수입원료를 사용한 가공식품이 국내에 대량 유통돼 다수의 환자가 발생하는 상황을 가정했다. 이 상황에서 안전사고 주요 상황 대응 매뉴얼에 따라 진행했다. 세레울라이드는 식중독균인 ’바실루스 세레우스‘가 분비하는 물질로 잠복기 0.5~6시간으로 강한 구토·오심·복통 유발한다. 주로 탄수화물이 풍부한 식품에 존재한다. 특히 올해는 세계보건기구(WHO) 국제식품안전당국네트워크(INFOSAN)와 함께 국제적 정보교류 및 협력체계를 점검하고, 수입원료로 인한 식품 안전사고 발생 시 국내 대응과 국제공조를 연계하는 데 중점을 뒀다. INFOSAN은 식품안전 비상사태나 위해식품 발생 시 신속한 정보 공유와 조정된 대응을 목적으로 유엔식농업기구(FAO0/WHO가 설립한 국제식품안전당국 네트워크이다. 이번 훈련에서는 ▲제품 및 환자에 대한 식중독 원인 조사 ▲위해 원료의 수입·유통 경로 추적 및 제","category":"생활 문화"},{"title":"대구 남구, 보건복지부 지역복지평가 '최우수상' 수상","link":"https://www.imaeil.com/page/view/2026110516055215341","pubDate":"2026-11-05T16:05:59+09:00","author":"매일신문","description":"대구 남구(구청장 조재구)는 보건복지부가 주관한 '2026년 지역복지평가' 지역사회보장계획 시행결과 부문에서 최우수상을 수상했다고 5일 밝혔다. 보건복지부는 매년 전국 시·도와 시·군·구를 대상으로 지역사회보장계획 시행 성과를 평가하고 있다. 남구는 이번 평가에서 위기가구를 신속하게 발굴·지원하는 '일사천리 복지기동단 운영'을 비롯해 14개 민간단체와 협력하는 '생명을 살려라 자살예방 지원사업', 1인 가구 증가에 대응한 '고독사 없는 안전한 마을 만들기' 등에서 높은 평가를 받았다. 이와 함께 민관협력 활성화와 지역사회보장협의체 - 매일신문","category":"생활 문화"},{"title":"되풀이되는 의료진 폭행…\"보호대책 실효성 없어\"(종합)","link":"https://www.newsis.com/view/NISX20261105_0003856371","pubDate":"2026-11-05T15:53:52+09:00","author":"뉴시스","description":"[서울=뉴시스] 류난영 기자 = 고(故) 임세원 강북삼성병원 정신건강의학과 의사가 환자가 휘두른 흉기에 찔려 사망한 후 의료인 폭행에 대한 처벌을 강화하는 '임세원법'이 통과됐지만 세브란스병원에서 또다시 흉기난동으로 의사가 크게 다치는 등 의료진에 대한 범행이 끊이지 않고 있다. 의료계는 그동안 의료진을 겨냥한 흉기난동 사태가 거듭됐음에도 진료 현장의 안전을 실질적으로 담보할 수 있는 실효성 있는 보호 대책이 마련되지 않았다며 의료진 폭행에 대한 처벌 강화와 안전장치 마련 등이 필요하다는 지적이다. 5일 경찰에 따르면 전날 50대 여성 A씨는 서울 서대문구 세브란스병원에서 이 병원 정신건강의학과 교수 B씨에게 칼을 휘두른 것으로 조사됐다. A씨는 평소 이 병원 의료진에게 불만을 품고 있던 것으로 알려졌다. 병원에서 의료진이 환자가 휘두른 흉기에 다치는 사건은 이번이 처음이 아니다. 지난 2018년 12월 31일 임세원 강북삼성병원 정신건강의학과 교수가 진료 도중 환자 C모씨가 휘두른 흉기에 찔려 숨졌다. 임 교수는 당시 C씨의 공격을 피해 빠져 나온 후 의료진에게 '도망가'를 외치며 피신했지만 끝내 목숨을 잃었다. 이후 2019년 4월에 안전한 진료환경 구축을 위해 병원에 보안 인력을 배치하고 비상벨 설치를 의무화 하는 등 이른바 '임세원법'(의료법 개정안)이 제정돼 의료인에게 상해를 입히면 7년 이하의 징역 또는 1000만원 이하의","category":"생활 문화"}],"세계":[{"title":"트럼프, 알래스카 상원 “가짜 댄 설리번 표 진짜에게 줘야”","link":"https://www.khan.co.kr/article/202611052317001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T23:17:00+09:00","author":"경향신문","description":"도널드 트럼프 미국 대통령이 4일(현지시간) 백악관의 신축 연회장 공사 현장에서 연설하고 있다. UPI연합뉴스도널드 트럼프 미국 대통령이 중간선거 개표가 진행 중인 알래스카주 상원 의원 투표를 두고 공화당 후보와 이름이 같은 무소속 후보가 얻은 표 등을 공화당 후보에게 넘겨야 한다고 주장했다.트럼프 대통령은 5일(현지시간) 소셜미디어 트루스소셜에 “가짜 댄···","category":"세계"},{"title":"‘브루클린의 버락’ 제프리스, 사상 첫 흑인 하원의장 유력","link":"https://www.khan.co.kr/article/202611052118015/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T21:18:01+09:00","author":"경향신문","description":"8선의 민주당 하원 원내대표의장 선출 땐 미국 서열 3위트럼프 상대 국정 견제 숙제“의회 통제권 탈환” 하킴 제프리스 미국 민주당 하원 원내대표가 4일(현지시간) 워싱턴 민주당전국위원회 본부에서 기자회견을 하고 있다. UPI연합뉴스미국 중간선거에서 민주당이 연방 하원의회를 탈환하면서 하킴 제프리스(56) 하원 민주당 원내대표가 차기 하원의장으로 유력해졌다···","category":"세계"},{"title":"민주사회주의자 약진…미 민주당 내 진보파 목소리 커질까","link":"https://www.khan.co.kr/article/202611052118005/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T21:18:00+09:00","author":"경향신문","description":"연방 하원 DSA 소속 6명 늘어 8명비공식 연대 ‘더 블록’ 세력화 모색지도부·하원의장 선출이 시험대미국 중간선거에서 ‘미국민주사회주의자들’(DSA) 소속 후보들을 비롯한 진보 성향 인사들이 약진하면서 민주당 내 노선 경쟁이 본격화할 것으로 보인다. 진보 성향 당선인들이 당 지도부에 대한 영향력 확대를 모색하는 가운데, 차기 지도부 선거 및 하원의장 선출···","category":"세계"},{"title":"지지 후보마다 낙선···머스크, ‘최대 큰손’서 ‘최대 패배자’로","link":"https://www.khan.co.kr/article/202611051644001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T16:44:00+09:00","author":"경향신문","description":"미국 중간선거가 치러진 지난 3일(현지시간) 텍사스주 켈러의 한 투표소에서 한 자원봉사자가 일론 머스크 테슬라 최고경영자(CEO)를 비판하는 팻말을 들어 보이고 있다. EPA연합뉴스‘최대 큰손’이 ‘최대 패자’가 됐다. 일론 머스크 테슬라 최고경영자(CEO) 이야기다.정치전문매체 폴리티코는 4일(현지시간) 공화당 참패로 끝난 미국 중간선거에서 머스크 CEO···","category":"세계"},{"title":"[미 중간선거]중간선거 압승에 민주당 ‘빅텐트론’ ‘진보 대선 후보’ 당내 논의 활발","link":"https://www.khan.co.kr/article/202611051637011/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T16:37:01+09:00","author":"경향신문","description":"의회진보직원협회(CPSA)와 메트로 DC 민주사회주의자들(MDC DSA) 소속 회원들이 3일(현지시간) 미국 중간선거 개표 밤 행사에서 환호하고 있다. 로이터연합뉴스미국 중간선거에서 압승을 거둔 민주당의 향후 방향성에 관심이 쏠리고 있다. 진보 성향의 의원들뿐만 아니라 중도 성향의 의원들이 대거 당선되면서 당내 다양한 계파를 아우르는 운영 방안과 2028년···","category":"세계"},{"title":"[롤드컵]젠지, 4강서 중국 IG와 격돌…한중 자존심 대결","link":"https://www.newsis.com/view/NISX20261105_0003856558","pubDate":"2026-11-05T16:13:44+09:00","author":"뉴시스","description":"[서울=뉴시스]오동현 기자 = 올해 국내 리그 오브 레전드(LoL) 최강팀에 오른 젠지 e스포츠가 북미 라이온(LYON)을 완파하고 '2026 LoL 월드 챔피언십(롤드컵)' 4강에 진출했다. 결승 진출을 놓고 맞붙을 상대는 한국 선수 '더샤이' 강승록과 '루키' 송의진이 활약하는 중국 인빅터스 게이밍(IG)이다. 젠지는 5일(한국시간) 미국 텍사스주 앨런의 크레딧 유니언 오브 텍사스 이벤트 센터에서 열린 롤드컵 8강전에서 LYON을 세트스코어 3대0으로 제압했다. 스위스 스테이지를 3전 전승으로 통과한 젠지는 8강에서도 한 세트도 내주지 않으며 2024년부터 3년 연속 롤드컵 4강 진출에 성공했다. 젠지는 올해 국내 LoL 프로리그인 LCK에서 2년 연속 우승을 달성한 강력한 우승 후보다. 올해 LCK 결승전에서 한화생명e스포츠를 3대1로 꺾고 통산 7번째 정상에 올랐다. 젠지는 LCK 1번 시드 자격으로 이번 롤드컵에 출전했다. 국내 무대를 제패한 기세를 세계 무대에서도 이어가며 팀의 첫 롤드컵 우승에 도전하고 있다. 젠지의 4강 상대인 IG는 앞서 4일 열린 8강전에서 같은 중국 리그(LPL) 소속 톱 e스포츠(TES)를 3대1로 꺾고 가장 먼저 준결승 진출을 확정했다. IG의 핵심 선수인 더샤이 강승록과 루키 송의진은 중국 무대에서 오랫동안 활약해 온 한국 선수들이다. 두 선수는 2018년 IG의 롤드컵 우승을 이끌었던 주역이","category":"세계"},{"title":"'한인 2세' 데이브 민, 하원의원 재선…한국계 하원선거 3명 당선","link":"https://www.imaeil.com/page/view/2026110515514677619","pubDate":"2026-11-05T16:07:31+09:00","author":"매일신문","description":"한국계 미국 연방 하원의원 데이브 민(50·한국 이름 민건기)이 중간선거에서 재선에 성공했다. 현재까지 이번 중간선거에서 한국계 하원의원 3명의 당선이 확정됐다. AP통신은 4일(현지시간) 민주당 소속인 민 의원이 캘리포니아주(州) 47선거구에서 공화당 소속 제니 레이 르루 후보를 제치고 당선이 확실시된다고 보도했다. 민 의원은 미국에서 태어난 한국계 정치인이다. 1976년 로드아일랜드에서 태어나 펜실베이니아대와 하버드대 로스쿨을 졸업했고, 미국 증권거래위원회(SEC) 기업 감시 변호사를 지냈다. 이후 캘리포니아대 어바인에서 법학 - 매일신문","category":"세계"},{"title":"美 민주당 6개 경합지 주정부·상하원 독식…권력 지형 재편","link":"https://www.imaeil.com/page/view/2026110515031231170","pubDate":"2026-11-05T15:56:47+09:00","author":"매일신문","description":"미국 중간선거에서 연방 상·하원을 장악한 민주당이 주요 경합 주(州), 주정부와 주의회 선거에서도 역사적인 승리를 거뒀다. 4일(현지시간) NBC 방송과 뉴욕타임스(NYT)에 따르면 민주당은 주요 경합 주 5곳에서 주지사와 주 상·하원을 싹쓸이하는 이른바 '트라이펙타'(Trifecta·3관왕)를 달성했다. 미시간주와 펜실베이니아주에서는 각각 하원과 상원을 공화당에서 탈환했다. 미네소타주에서는 양당이 권력을 분점했던 하원의 단독 과반을 확보했다. 위스콘신주에서는 상·하원을 모두 공화당에서 탈환했고, 네바다주에서는 주지사직을 되찾았다. - 매일신문","category":"세계"},{"title":"미 ‘블루 쓰나미’에 이란 ‘반색’·이스라엘 ‘충격’···미 중동 전략에 촉각[미 중간선거]","link":"https://www.khan.co.kr/article/202611051523001/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T15:23:00+09:00","author":"경향신문","description":"4일(현지시각) 미국 미시간주 디트로이트에서 열린 중간선거 개표 행사에서 상원 선거에 승리한 압둘 엘사예드 민주당 후보가 그의 아내 사라 주카쿠 옆에서 발언하고 있다. AP연합뉴스미국 중간선거를 휩쓴 ‘블루 쓰나미’(민주당 압승) 이후 JD 밴스 미국 부통령은 4일(현지시간) 엑스에 올린 장문의 글에서 “우리가 패배한 이유는 (이란) 전쟁”이라고 선언했다.···","category":"세계"},{"title":"\"5억달러 갖다버렸네\"…美중간선거, 최대 패배자는 트럼프 아닌 '이사람'","link":"https://www.imaeil.com/page/view/2026110507184870419","pubDate":"2026-11-05T07:18:57+09:00","author":"매일신문","description":"미국 중간선거에서 공화당 후보들을 지원하기 위해 막대한 정치자금을 쏟아부은 일론 머스크 테슬라·스페이스X 최고경영자(CEO)가 이번 선거의 최대 패배자라는 분석이 나왔다. 선거에 직접 출마하지 않은 개인이 단일 선거에서 지출한 정치자금으로는 미국 역사상 최대 규모인 5억 달러에 가까운 돈을 투입했지만, 그가 밀었던 공화당 후보들이 잇따라 고전하면서 정치적 영향력에도 타격을 입었다는 평가가 나온다. 미국 정치전문매체 폴리티코 등 외신은 4일(현지시간) 중간선거 결과를 두고 머스크가 지원한 공화당 후보들이 주요 선거에서 잇따라 패배했다 - 매일신문","category":"세계"}],"IT 과학":[{"title":"6000억 후원 물거품…“머스크, 선거 최대 패배자”","link":"https://www.khan.co.kr/article/202611052057015/?utm_source=khan_rss&utm_medium=rss&utm_campaign=kh_world","pubDate":"2026-11-05T20:57:01+09:00","author":"경향신문","description":"사업 거점 텍사스까지 민주당 승리데이터센터 건설 등 불확실성 커져‘최대 큰손’이 ‘최대 패자’가 됐다. 일론 머스크 테슬라 최고경영자(CEO·사진) 이야기다. 정치전문매체 폴리티코는 4일(현지시간) 공화당 참패로 끝난 미국 중간선거에서 머스크가 ‘가장 큰 패배자’로 떠올랐다고 분석했다. 그가 수억달러를 쏟아부으며 밀어준 공화당 후보 대부분이 낙선했기 때문이···","category":"IT 과학"},{"title":"화성은 살아있다…‘열’ 존재 가능성","link":"https://www.khan.co.kr/article/202611052039005/?utm_source=khan_rss&utm_medium=rss&utm_campaign=science_news","pubDate":"2026-11-05T20:39:00+09:00","author":"경향신문","description":"국제 공동 연구진, 염화수소 검출화산 활동 연관 ‘뜨거운 물’ 징후지구에 인접한 태양계 4번째 행성이며, 미래에 유인기지 건설이 유력한 화성(사진)에서 화산 활동의 징후가 발견됐다. 그동안 화성은 지질 변화가 없는 ‘죽은 행성’으로 여겨졌지만, 그렇지 않을 가능성이 제기된 것이다.러시아와 폴란드 과학아카데미 소속 우주연구소 과학자들이 주도한 국제 공동 연구···","category":"IT 과학"},{"title":"핵융합·해양원자로·차세대 OLED에 2.2조 투입…R&D 예타 3건 시행 결정","link":"https://www.newsis.com/view/NISX20261105_0003856991","pubDate":"2026-11-05T18:30:09+09:00","author":"뉴시스","description":"[서울=뉴시스]윤현성 기자 = 핵융합에너지와 해양용 용융염원자로(MSR), 차세대 디스플레이 기술 개발에 총 2조1674억7000만원 규모의 국가 연구개발(R&D) 투자가 추진된다. R&D 예비타당성조사(예타) 폐지 전에 접수됐던 3개 사업이 모두 '시행' 결정을 받으면서 2027년부터 순차적으로 사업에 들어간다. 과학기술정보통신부는 3~5일 박인규 과학기술혁신본부장 주재로 '2026년 제9회 국가연구개발사업평가 총괄위원회'를 서면 개최하고 2025년 제4차와 2026년 제1차 예타 결과를 확정했다고 밝혔다. 이번에 심사를 마친 사업들은 기존 R&D 예타 제도가 폐지되기 전에 접수된 과제들이다. 올해 제도 개편으로 기존 R&D 예타는 폐지됐고, 현재는 대규모 시설·장비 구축 등을 포함한 구축형 R&D에 별도의 사업추진심사를 적용하는 체계로 전환됐다. 총사업비 1000억원 이상이면서 국가 재정지원 규모가 500억원 이상인 신규 구축형 R&D가 대상이다. ◆핵융합 상용화에 10년간 1.48조…극한환경 검증·실증센터 구축 2025년 제4차 예타 대상이었던 '핵융합에너지 가속화 실현을 위한 핵심기술 개발 및 실증 기반 구축 사업'은 시행으로 의결됐다. 총사업비는 1조4813억원(국비 1조2877억원)이며 2027년부터 2036년까지 10년간 진행된다. AI 기술 발전과 데이터센터 확대에 따라 중장기적인 전력 수요 증가가 예상되면서 미래 에너","category":"IT 과학"},{"title":"중앙정부 세수 호황인데, 지방은 곳간 비상…추경호 \"대구 재정 상황 심각\"","link":"https://www.imaeil.com/page/view/2026110516114922115","pubDate":"2026-11-05T18:00:00+09:00","author":"매일신문","description":"정부가 반도체 호황에 따른 추가 세수의 활용 방안을 고심하는 반면, 지방정부는 세수 부족과 지출 부담에 시달리며 재정난이 심화하고 있다. 대구시는 재정 압박으로 지방채 1천680억원을 신규 발행하기로 하면서 재정건전성에 대한 우려도 커지고 있다. 추경호 대구시장은 5일 시청 동인청사에서 기자설명회를 열고 민선 9기 첫 본예산인 '2027년도 예산안'을 총 12조7천51억원 규모로 편성했다고 밝혔다. 그동안 예산안 언론 브리핑은 행정부시장이 맡아왔으나, 시장이 직접 설명에 나선 것은 이례적이다. 경제부총리를 지낸 추 시장이 지방재정의 - 매일신문","category":"IT 과학"},{"title":"휴네시온, 광주 전력 엑스포서 발전소 보안 기술 전시","link":"https://www.newsis.com/view/NISX20261105_0003856921","pubDate":"2026-11-05T17:33:29+09:00","author":"뉴시스","description":"[서울=뉴시스]윤정민 기자 = 휴네시온이 발전소 등 주요 산업 시설에서 내부 설비 데이터를 외부로 안전하게 보내면서, 밖에서 들어오는 해킹 통로는 원천 차단하는 일방향 보안 기술을 선보였다. 휴네시온은 전남광주 김대중컨벤션센터에서 열리는 '빛가람 국제전력기술 엑스포(BIXPO) 2026'에 참가해 산업제어망 보안 제품과 국가망보안체계(N2SF) 구축 사례를 전시했다고 5일 밝혔다. 전시 제품은 산업제어망 데이터 전송에 쓰이는 '아이원넷 DD' '아이원넷 DX', 보안 수준이 다른 망 사이의 데이터 이동을 통제하는 '아이원넷 CDS', 네트워크 접근을 통제하는 'i-oneNAC' 등이다. '아이원넷 DD'는 물리적으로 한쪽 방향으로만 데이터를 보낼 수 있도록 설계됐다. 휴네시온은 이 제품으로 설비 운영과 보안 관제에 필요한 정보를 제어망 밖으로 보낼 수 있다고 설명했다. '아이원넷 DX'는 방향이 서로 다른 일방향 통로를 각각 사용한다. 두 망은 이 통로를 통해 직접 양방향 연결을 맺지 않고도 데이터를 주고받을 수 있다. 산업제어망은 발전설비 등 실제 장비를 감시하고 제어하는 데 쓰인다. 산업제어망과 업무망 사이에 일방향 전송 장치를 두면 제어망에서 나가는 통신을 허용하면서 외부에서 들어오는 공격 경로를 줄일 수 있다. 휴네시온은 한국부동산원에서 진행 중인 N2SF 구축 사례도 소개했다. N2SF는 공공기관이 업무 정보를 중요도에 따라","category":"IT 과학"},{"title":"올겨울 가금류 고병원성 AI 첫 발생…질병청, 인체감염 예방 강화","link":"https://www.newsis.com/view/NISX20261105_0003856831","pubDate":"2026-11-05T17:28:12+09:00","author":"뉴시스","description":"[세종=뉴시스] 강진아 기자 = 질병관리청이 고병원성 조류인플루엔자(AI) 바이러스가 확인된 가금농장에 현장대응요원을 파견하고 인체감염 예방 조치에 나섰다. 5일 질병청에 따르면 전날인 4일 경기 연천 소재 가금농장에서 고병원성 AI 바이러스가 확인돼 살처분이 시행됐다. 26-27절기 야생 조류와 야생 포유류인 삵에서 고병원성 AI 바이러스가 검출된 바 있으나 가금류에서 확인된 건 이번이 처음이다. 다만 현재까지 국내에서 인체감염 사례가 보고된 적은 없다. AI는 닭·오리·칠면조·철새 등 여러 종류의 조류에 감염되는 바이러스성 감염병이다. AI 인체감염증은 야생조류·가금류 등에서 발생한 AI가 사람에게 전파돼 발생하는 질병으로, 주로 감염된 조류의 분변·사체나 그에 오염된 물건 등을 접촉한 손으로 눈·코·입을 만졌을 때 감염될 수 있다. 일반 국민은 야생조류나 AI 발생 농가와 접촉 가능성이 낮아 AI 인체감염증 발생 가능성이 높은 편은 아니다. 하지만 AI에 감염된 가금류에 직접 접촉한 고위험군(AI 발생 농가종사자, 살처분 참여자 등)을 중심으로 해외에서 고병원성 AI 인체감염증 발생 사례가 지속적으로 보고되고 있다. 이에 현장에 파견된 대응요원은 지자체와 협력해 고위험군에게 개인보호구 착용, 계절인플루엔자 예방접종 여부 등을 확인하고 인체감염 예방수칙을 준수하도록 지도했다. 현재까지 발생 농장 종사자 중 의심 증상자는 확인되지 ","category":"IT 과학"},{"title":"[컨콜]김병규 넷마블 대표 \"AI 업무 환경 구축…내년 신작 10종 자체 출시 가능\"","link":"https://www.newsis.com/view/NISX20261105_0003856787","pubDate":"2026-11-05T16:36:15+09:00","author":"뉴시스","description":"[서울=뉴시스]이주영 기자 = 김병규 넷마블 대표가 개발부터 출시·서비스까지 인공지능(AI)을 활용하는 업무 환경을 바탕으로 내년 신작 10종을 자체 출시할 수 있다고 밝혔다. 김 대표는 5일 3분기 실적 발표 컨퍼런스콜에서 \"개발뿐 아니라 게임 출시와 서비스 과정에서 AI 네이티브 기반의 업무 환경을 구축하기 위해 노력해 왔다\"며 \"이러한 시스템을 기반으로 충분히 10개의 게임을 한 해에 출시하는 것이 가능하다고 계산하고 있다\"고 말했다. 내년 신작 13종은 자체 출시 10종과 해외 법인 출시 약 3종으로 구성된다. 회사는 여러 게임을 개발·서비스하는 과정에서 AI 도입 효과를 자체적으로 검증할 기회가 많다며 이를 바탕으로 다수의 신작 출시를 준비하고 있다고 설명했다. 김 대표는 올해 하반기 예정됐던 일부 신작이 내년으로 밀린 이유에 대해 \"기존 장르 안에서 차별성을 확보하고 서비스 완성도를 높이기 위한 조치\"라며 \"올해 출시한 '몬길: 스타 다이브'과 '일곱 개의 대죄: 오리진'의 성과를 살펴 개선점을 후속작에 반영했다\"고 전했다. ◎공감언론 뉴시스 zoo@newsis.com","category":"IT 과학"},{"title":"민감한 파일, 업무망 안에서 검사한다…샌즈랩, 폐쇄망용 CTX 출시","link":"https://www.newsis.com/view/NISX20261105_0003856761","pubDate":"2026-11-05T16:34:27+09:00","author":"뉴시스","description":"[서울=뉴시스]윤정민 기자 = 샌즈랩이 의심스러운 파일이나 보안 위협 정보를 외부 서버로 올리지 않고 내부망에서 직접 분석할 수 있는 보안 제품을 새로 내놨다. 보안 담당자는 인터넷과 완전히 잘린 내부 업무망 안에서 파일의 악성 여부를 검사할 수 있다. 샌즈랩은 공공·금융·국방 분야의 망분리 환경을 겨냥한 사이버 위협 인텔리전스(CTI) 제품 '폐쇄망용 CTX'를 출시했다고 5일 밝혔다. 공공기관과 금융·국방 분야에서는 보안 규정에 따라 업무망을 인터넷망과 분리해 운영하는 곳이 많다. 샌즈랩에 따르면 기존 위협 정보 서비스는 웹이나 클라우드로 제공되는 경우가 많아 폐쇄망에서 이용하기 어렵다. 외부 서비스로 의심 파일을 검사하려면 내부망에 있는 파일을 밖으로 옮겨야 한다. 폐쇄망용 CTX는 위협 정보 조회와 파일 분석을 내부망에서 처리한다. 담당자가 파일의 식별값인 해시값이나 웹주소(URL), IP 주소, 도메인을 입력하면 내부 데이터베이스(DB)에서 기존 위협 기록을 찾아볼 수 있다. 추가 분석이 필요한 파일을 등록하면 내부 서버에서 구동하는 인공지능(AI)이 악성 여부와 위험도를 분석하고 파일의 주요 동작을 정리해 보여준다. 분석 결과와 조회 기록도 내부망에 남는다. 샌즈랩은 위협 데이터 33억건을 학습한 AI 모델과 33억건 규모의 위협 정보 DB를 기관 내부망에 설치한다고 설명했다. 폐쇄망에서 새로 발견된 위협을 조회하려면 내부","category":"IT 과학"},{"title":"수술실 간호 인력 자동 배정…'이 기술' 미국 특허","link":"https://www.newsis.com/view/NISX20261105_0003856658","pubDate":"2026-11-05T15:46:11+09:00","author":"뉴시스","description":"[서울=뉴시스] 류난영 기자 = 의료진과 운영진이 데이터를 바탕으로 병원 자원의 운영, 배분 등을 돕는 데이터 기반 병원 운영 플랫폼 기술 'DOCC'(Data-based Operation & Communication Center)이 미국에서 특허로 등록됐다. 유럽과 국내에 이어진 성과다. 이 기술은 수술실·검사 장비·병상·의료 인력 등 병원 자원의 운영 현황과 예측 정보를 PAN(판)이라는 화면에 통합해 보여주는 시스템으로 효과적인 수술실 간호 인력 배정 등을 돕는다. 삼성서울병원은 수술실 간호 인력의 경험과 역량을 분석해 인력을 배정하는 '의료 인력 정보 제공 방법 및 장치'가 미국 특허로 등록됐다고 5일 밝혔다. 이 기술은 지난달 12일 국내에서도 특허 등록이 완료됐다. 앞서 2025년 12월에는 수술실의 실제 사용률을 분석해 수술실 배정을 최적화하는 기술이 유럽 특허로 등록돼 독일·영국·프랑스에서 권리를 확보한 바 있다. 이번 성과로 DOCC 관련 특허는 국내 4건, 유럽 1건, 미국 1건 등 총 6건이 등록됐으며, 국내외에서 다수의 DOCC 관련 특허 심사가 계속 진행 중이다. 이번 미국 특허는 수술실 간호사의 실제 수술 참여 이력을 분석해 역량을 수치화하고, 이를 인력 배정에 활 function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}

function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}

  const categoryLabel=esc(x.category||"");
  const href=attr(naverNewsUrl(x));
  const expanded=window.openStoryLink===x.link;
  return '<article class="story"><div class="storytop"><span class="source">'+author+'</span><span>'+dateText+'</span></div><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(expanded?'true':'false')+'">'+title+'</button>'+(expanded?'<div class="story-detail"><p class="detail-summary">'+description+'</p><a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">'+(x.naverLink||String(x.link||"").includes("news.naver.com/")?"네이버뉴스에서 기사 보기 ↗":"원문 기사 보기 ↗")+'</a></div>':'')+'<div class="storybottom"><span>'+categoryLabel+'</span><button class="save" type="button" data-save="'+i+'" aria-label="기사 저장">☆</button></div></article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활 문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?allDays[0]?.date:allDays[1]?.date));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+esc(day.label||day.date)+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===window.NEWS_DATA.date?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · 오늘·어제 기사";
  $("#feed").innerHTML=visibleCount?html:'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}
$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
