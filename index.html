Link":"https://n.news.naver.com/mnews/article/011/0004682991","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"자이 미래 전략 발표회서 ‘비욘드 리빙’ 제시 LG전자와 공동 개발…내년 11월 분양부터 적용 IX 플랫폼으로 공간 바꿔 오래 쓰는 주택 추진 올 정비사업 수주 11조 전망…창사 이래 최대 허윤홍 GS건설 대표가 16일 서울 삼성동 웨스틴 서울 파르나스에서 열린 ‘자이 미래전략발표회’에 참석해 인사말을 하고 있다. 사진 제공=GS건설 GS건설(006360) 이 거주자의 상황을 인식해 필요한 기능을 스스로 실행하는 ‘레벨3 AI홈’을 내년 분양단지부터 도입한다. 가족 구성과 생활 방식에 따라 내부 공간을 바꿔 오래 사용할 수 있는 주거 플랫폼도 추진, 라이프스타일에 맞춰 유연한 공간을 완성한다. AI를 통해 일상의 번거로움을 줄이고 공간의 가변성을 높이는 건축 기술로 주거 편의성과 경제성을 높이고 기후 변화에도 대응하겠다는 구상이다. GS건설은 16일 서울 삼성동 웨스틴 서울 파르나스에서 자이 미래전략 발표회 ‘리이볼브(RE:EVOLVE)’를 열고 집이라는 공간을 넘어 거주자의 삶과 변화에 맞춰 진화하겠다는 중장기 비전 ‘비욘드 리빙(Beyond Living)’을 제시했다. 허윤홍 GS건설 대표는 인사말에서 “미래를 향한 약속을 어떻게 현실로 만들어갈지 끊임없이 고민해 왔다”며 이 자리가 그 결과물이라고 밝혔다. 2024년 11월 자이 리브랜딩 이후 2년 만에 고객 경험 중심의 브랜드 전략을 구체화한 것이다. AI홈과 가변형 공간을 구현하는 ‘IX 플랫폼’, 기후 변화에 대응하는 ‘클리마 시스템’이 핵심이다. LG전자와 공동 개발 중인 AI홈은 생성형 AI를 기반으로 가전과 사물인터넷(IoT) 기기, 주거시설·생활서비스를 하나의 인터페이스로 통합하는 솔루션이다. 명령에 따라 기기를 작동시키는 기존 스마트홈에서 나아가 거주자의 상황을 인식해 필요한 기능을 먼저 실행하는 것을 목표로 한다. 이용구 GS건설 건축주택설계부문장이 16일 서울 삼성동 웨스틴 파르나스에서 열린 자이 미래전략발표회에서 주거 자율화 레벨 LHA에 대해 설명하고 있다. 사진 제공=GS건설","category":"생활·문화"},{"title":"AI에 효율 맡긴 인간의 다음 숙제, 송길영의 답은 ‘돌봄’","link":"https://n.news.naver.com/mnews/article/310/0000141760","naverLink":"https://n.news.naver.com/mnews/article/310/0000141760","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"환경재단 ‘세상을 밝게 만든 사람들’ 수상 AI 발전 덕에 아낀 시간과 수고 돌보고 고쳐 쓰고 오래 쓰는 데 들여야 친환경 선택, 희생 아닌 일상 되려면 훈계보다 초대, 죄책감보다 자부심 일으켜야 완벽함보다 꾸준함, 오늘 하나 덜어내기부터 송길영 작가. ⓒ환경재단 제공 무엇이건 AI가 순식간에 결과물을 내놓는 시대, 아낀 시간을 우리는 어디에 써야 할까. 빅데이터 전문가 송길영 작가는 말한다. \"사람이 시간을 기꺼이 들여야 할 답 중 하나는 돌보고, 고쳐 쓰고, 오래 쓰는 수고에 있다. 환경을 고민하고 살아가는 일은 어쩌면 인간다움을 지키는 가장 구체적인 방법일지도 모른다.\" 20년 넘게 사람들이 온라인에 남긴 글과 댓글을 분석해 온 그는 스스로를 사람의 마음을 캐는 '마인드 마이너'라 부른다. 『시대예보』 시리즈를 통해 AI와 자동화 같은 변화를 일자리, 돌봄, 인간관계 등 일상 문제와 연결해 설명해 왔다. AI가 많은 일을 대신하는 시대에 사람이 기꺼이 들이는 수고의 의미를 묻는 책 『수고인류의 시간』을 최근 펴냈다. 지난 3일 환경재단 '2026 세상을 밝게 만든 사람들' 시상식에서 사회 부문 수상의 영예를 안았다. 송 작가는 이날 \"AI가 오고 기후가 바뀌는 세상의 변화를 다 같이 이해했다면, 이제는 준비할 때\"라고 말했다. 이어진 인터뷰에선 \"더 많은 이들이 환경을 지키는 일에 동참하게 하려면 훈계 대신 초대의 언어로 말을 걸어야 한다\"고도 했다. -수상을 축하드립니다. 세상을 밝게 만들기 위해 요즘 어떤 일을 하고 계세요? \"사람들의 마음을 읽는 일을 합니다. 수많은 사람들이 남긴 기록을 들여다보면, 세상이 어디로 움직이고 있는지가 조금 먼저 보입니다. 우리가 느끼는 막막함의 상당 부분은 '알 수 없음'에서 옵니다. 변화를 이해한다고 두려움이 사라지진 않지만, 적어도 무엇을 준비해야 할지는 알 수 있습니다. 변화의 방향을 조금 먼저 읽고, 막연한 불안이 아니라 준비할 수 있는 언어로 바꿔 전하는 것이 제가 할 수 있는 작은 밝힘이라고 생각합니다.\" -효율로 설명되지 않는 환경의 가치를 어떻게 설득할 수 있을까요? \"우리가 써 온 '효율'이라는 계산기는 생각보다 범위가 좁았습니다. 이번 분기, 올해, 우리 회사, 우리 집의 테두리 안에서만 손익을 따져 왔지요. 계산서에 찍히지 않은 비용은 강으로, 바다로, 다음 세대의 몫으로 넘어갔습니다. 그래서 저는 환경의 가치를 '효율이 아닌 것'으로 설명하기보다,","category":"생활·문화"},{"title":"인도 10월 도매물가 12.29%↑…에너지 가격 급등","link":"https://n.news.naver.com/mnews/article/003/0014325881","naverLink":"https://n.news.naver.com/mnews/article/003/0014325881","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"실업률 4.9%로 8개월 만에 최저…여성 고용도 개선 [뭄바이=AP/뉴시스] 사우디아라비아산 원유를 싣고 호르무즈 해협을 통과한 라이베리아 선적 유조선 선룽호가 하역을 위해 인도 뭄바이항에 접안하고 있다. 자료사진. 2026.11.16 [서울=뉴시스]이재준 기자 = 인도 도매물가 상승률이 에너지 가격 급등으로 4년여 만에 가장 높은 수준으로 치솟았다. 제조업 제품과 식품 물가 상승세는 다소 둔화했지만 연료·전력 가격이 큰 폭으로 오르면서 전체 물가를 끌어올렸다. 마켓워치와 인베스팅 닷컴, RTT 뉴스에 따르면 인도 상공부는 16일 도매물가지수(WPI)는 10월에 전년 동월대비 12.29% 뛰었다고 발표했다. 9월 상승률 11.39%에서 0.90% 포인트 높아졌으며 시장 예상 12.1%도 웃돌았다. 2022년 8월 이래 최대 상승폭이다. 2022/2023년을 기준연도로 새 지수 체계를 도입한 2026년 6월 이후로는 최고치다. WPI는 9월 112.5에서 10월 113.3으로 상승했다. 주요 품목별로는 연료·전력 가격이 전년 동월보다 32.84% 급등, 9월 상승률 25.85%를 크게 웃돌았다. 1차 상품 가격도 9.24% 올라 전월 8.67% 상승에서 0.57%포인트 가속했다. 반면 제조업 제품 가격 상승률은 9.76%에서 9.54%로 소폭 감속했다. 연료·전력 가격 상승을 주도한 건 석유와 천연가스 등 에너지 품목이다. 석유제품을 포함한 광물유 가격은 45.57% 치솟아 9월 40.02%보다 상승폭이 커졌다. 원유와 천연가스 가격은 70.80% 급등해 전월 상승률 57.32%를 훨씬 상회했다. 석탄·갈탄 가격 상승률도 9.31%에서 10.49%로 높아졌다. 전력 가격은 9월 0.43% 하락에서 10월 8.06% 상승으로 돌아섰다. 식품 물가 상승률은 8.66%에서 8.58%로 소폭 낮아졌다. 식품지수는 도매물가지수의 24.99%를 차지하며 10월 지수는 120.2를 기록했다. 다만 식품 내부에서는 품목별로 흐름이 엇갈렸다. 1차 상품에 포함된 식품 가격 상승률이 8.14%에서 8.26%로 높아진 반면 제조업 제품에 포함된 식품 가격 상승률은 9.44%에서 9.24%로 낮아졌다. 제조업 제품 가운데서는 화학제품 가격이 전년 동월에 비해 17.53% 뛰어오르고 기초금속은 17.21% 급상승했다. 고무·플라스틱 제품은 13.90%, 섬유제품 13.67%, 담배제품13.24% 올랐다. 제조업 전체의 물가 상승률은 다","category":"생활·문화"},{"title":"송연섭 경기도의원, 배달특급 운영 계약 개선과 홍보 재원 확보 촉구","link":"https://n.news.naver.com/mnews/article/030/0003486344","naverLink":"https://n.news.naver.com/mnews/article/030/0003486344","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"재공고에도 한 업체만 응찰…경쟁 없이 수의계약 체결 도, 상생배달앱 공모·시군 지역화폐 사업 연계 검토 송연섭 경기도의회 경제노동위원회 의원. 경기도의회에서 공공배달앱 '배달특급'의 운영사 선정 방식을 손질하고 홍보 재원을 확보해야 한다는 지적이 나왔다. 경기도의회 경제노동위원회 송연섭 의원(더불어민주당, 비례)은 이날 행정사무감사 종합감사에서 내년도 배달특급 예산안에 반영된 약 29억원을 운영 용역비로 쓰면 홍보에 투입할 재원이 남지 않는다고 지적했다. 송 의원은 내년도 운영분이 포함된 용역 입찰에 한 업체만 응찰해 수의계약으로 이어졌다고 밝혔다. 그는 배달앱 운영·개발 경험을 요구한 조건이 다른 기업의 참여를 막는 문턱이 됐다며 입찰 조건을 손질하고 계약 절차의 투명성을 높이라고 요구했다. 운영사인 NHN페이코와 발주처인 코리아경기도주식회사의 지분 관계도 짚었다. 송 의원은 페이코가 2020년 사업 참여를 계기로 경기도주식회사 지분을 확보했다가 일부를 넘긴 뒤에도 배달특급 운영을 맡아왔다고 설명했다. 지분 양도 자체에 문제가 있다고 보지는 않는다면서도 경기도가 대주주인 만큼 운영 계약 구조를 서둘러 정비해야 한다고 주문했다. 홍보 재원 확보 방안으로는 페이코와 추가 출자를 협의하고, 관심 있는 기업을 대상으로 투자설명회를 여는 방안을 제시했다. 경기도가 활용할 수 있는 재원도 함께 검토할 것을 요청했다. 박노극 도 경제실장은 “수의계약이라도 절차에 따라 진행했지만, 여러 사안이 얽혀 있어 안팎에서 오해할 여지가 있다는 점은 인정한다”며 “문제없이 정리할 수 있는 방안을 함께 살펴보겠다”고 말했다. 그러면서 “부족한 재원을 보완하기 위해 12월 상생배달앱 공모와 20여개 시군 지역화폐 연계 배달 사업을 활용하는 방안을 검토 중”이라고 덧붙였다. 송연섭 의원은 “내년이 배달특급을 살릴 사실상 마지막 기회”라며 “운영사 선정의 투명성을 높이고 홍보 재원과 시군 사업을 연계한 이용 기반을 함께 확보해야 한다”고 말했다.","category":"생활·문화"},{"title":"노동자 절반, 물가 상승 감안 땐 올해 상반기 실질임금 줄었다","link":"https://n.news.naver.com/mnews/article/032/0003483068","naverLink":"https://n.news.naver.com/mnews/article/032/0003483068","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"작년 비해 0.3% 상승 그쳐…반도체 호황으로 성장률 상승과 괴리 코로나 이후 실질급여 ‘정체’…비반도체 기업 ‘수익 생산성’ 부진 반도체 산업 호황으로 경제성장률은 높아졌지만, 올해 상반기 근로자 절반 이상은 물가 상승 등을 고려하면 실질임금이 줄어든 산업에서 일한 것으로 드러났다. 한국개발연구원(KDI) 연구팀이 16일 발표한 ‘기업 생산성 분석으로 살펴본 실질임금 정체의 배경과 시사점’ 보고서를 보면, 올해 상반기 평균 실질임금(1인당 임금총액 기준)은 전년 동기보다 0.3% 증가했다. 2024년(0.5%)과 2025년(0.9%) 연간 상승률을 모두 밑돌았다. 일부 고임금 산업의 상여금이 전체 임금 상승을 이끌었지만, 기본급과 통상적인 수당 등을 합친 실질 정액급여 기준으로는 0.3% 감소했다. 실질임금이 떨어진 산업에 종사하는 근로자의 비중은 2025년 29.3%에서 올해 상반기 53.2%로 높아졌다. 지난해에는 근로자 10명 중 약 3명만 임금이 물가를 따라가지 못했지만, 올해는 10명 중 5명 이상으로 늘어났다는 뜻이다. 정규직 등 상용근로자만 보면 비중은 44.4%였다. 연구진은 하반기까지 포함하더라도 수치가 크게 달라지지 않을 것으로 전망했다. KDI는 실질임금이 코로나19 대유행 시기인 2021년을 기점으로 정체됐다고 분석했다. 2011~2021년 24%(연평균 2.2%) 늘었으나 2021~2025년에는 0.2%(연평균 0.05%) 오르는 데 그쳤다. 연구진은 2021~2022년에는 물가 상승이, 2022년 이후에는 명목 정액급여 상승세 둔화가 실질임금 상승을 주로 제약했다고 분석했다. 올해 상반기에는 명목 정액급여 상승세가 둔화한 가운데 중동전쟁에 따른 물가 상승도 영향을 미쳤다고 봤다. 보고서는 산업의 생산성과 급여 상승률이 대체로 비례하는데, 비반도체 분야 ‘수익 생산성’이 부진해 임금이 잘 오르지 않는 것으로 분석했다. 수익 생산성은 노동과 자본을 투입해 얼마나 많은 부가가치를 창출하는지를 나타낸다. 2021~2025년 반도체 제조업의 수익 생산성은 연평균 8.5% 증가한 반면 비반도체 부문은 연평균 0.4% 감소했다. 비반도체 부문의 경우 기존에 생산성이 높았던 기업들마저 사실상 정체 상태에 머물렀다. 생산성이 더 많이 오른 산업일수록 실질 정액급여도 더 많이 오르는 경향이 나타났다. 2021~2025년 업종별로 비교한 결과, 생산성 상승률이 10%포인트 높은 업종은 상용근로자의 실질","category":"생활·문화"},{"title":"\"방값 올리려 손님 내쳤다간\"…숙박요금 2배 물어낸다","link":"https://n.news.naver.com/mnews/article/018/0006410754","naverLink":"https://n.news.naver.com/mnews/article/018/0006410754","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"\"방값 올리려 손님 내쳤다간\"…숙박요금 2배 물어낸다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"생활·문화"},{"title":"주담대 변동금리 기준되는 코픽스, 2년 8개월 만에 최고","link":"https://n.news.naver.com/mnews/article/079/0004210315","naverLink":"https://n.news.naver.com/mnews/article/079/0004210315","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"핵심요약 10월 신규 취급액 기준 연 3.62%…주담대 금리 더 올라 연합뉴스 지난달 은행권 주택담보대출 변동금리 기준인 코픽스(COFIX·자금조달비용지수)가 두 달 연속 상승했다. 은행연합회는 올해 10월 신규 취급액 기준 코픽스는 9월보다 0.19%포인트 오른 연 3.62%로 집계됐다고 16일 밝혔다. 이는 2024년 2월(3.62%) 이후 2년 8개월 만에 최고치다. 올해 9월 0.25%p 오른 데 이어 10월에도 0.19%p 올라 두 달간의 상승 폭이 0.44%p에 달했다. 10월 잔액 기준 코픽스는 연 3.15%에서 3.26%로 0.11%p 올랐다. 코픽스는 국내 8개 은행이 조달한 자금의 가중평균금리로, 은행이 실제 취급한 예·적금, 은행채 등 수신상품의 금리 변동이 반영된다. 코픽스가 오르면 그만큼 은행이 자금을 확보할 때 그만큼 더 많은 이자를 내야 해 차주들의 부담이 커진다. 신(新)잔액 기준 코픽스는 연 2.79%에서 2.93%로 0.14%p 상승했다. 신잔액 코픽스에는 기타 예수금과 차입금, 결제성 자금 등의 금리도 포함된다. 시중은행은 이르면 17일부터 신규 주택담보대출 변동금리에 이날 공개된 코픽스 금리를 반영할 예정이다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메 te":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"“트럼프 만나기 싫어서”… 나토, 내년 정상회의 건너뛴다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"“비행기표 너무 비싸다” 했는데…12월 국제선 유류할증료 드디어 내린다","link":"https://n.news.naver.com/mnews/article/011/0004682846","naverLink":"https://n.news.naver.com/mnews/article/011/0004682846","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"사진 제공=대한항공 미국·이란 종전 기대감과 공급 과잉 전망 등으로 국제유가가 하락하면서 다음 달 국제선 항공권에 부과되는 유류할증료도 내려간다. 16일 업계에 따르면 12월 발권 기준 국제선 항공권에는 유류할증료 25단계가 적용된다. 이번 달에 적용된 27단계보다 2단계 내린 수준이다. 이에 따라 다음 달 발권하는 미국 동부 왕복 항공권은 약 6만 원 저렴해질 것으로 예상된다. 대한항공은 오는 12월 1일부터 31일까지 적용되는 한국 출발 국제선 유류할증료를 이날 공지했다. 노선별 대권거리에 비례해 편도 기준 5만 800원~37만 7800원으로 책정됐다. 노선별 유류 할증료는 편도 기준 △후쿠오카·칭다오 등 동북아 최단 노선(499마일 이하) 5만 800원 △도쿄·베이징 등 동북아 주요 노선(500~999마일) 6만 9500원 △방콕·싱가포르·호찌민 등 동남아 주요 노선(2000~2999마일) 16만 9600원 △런던·파리·로스앤젤레스(LA) 등 서유럽·미국 서부 노선(5000~6499마일) 33만 6400원 △뉴욕·워싱턴 등 미국 동부 노선(6500~9999마일) 37만 7800원으로 책정됐다. 이달 유류 할증료(5만 5600~40만 8100원)와 비교하면 최소·최대 금액 기준으로 각각 8.6%, 7.4% 내린 수준이다. 주요 노선별 인하액은 편도 기준 △동북아 최단 노선 4800원 △동북아 주요 노선 6500원 △동남아 주요 노선 1만 6200원 △서유럽·미국 서부 노선 3만 3700원 △미국 동부 노선 3만 300원이다. 이에 따라 뉴욕 등 미국 동부 노선의 왕복 유류 할증료 부담은 6만 600원 줄어든다. 아시아나항공도 내렸다 이날 아시아나항공도 오는 12월 1일부터 16일까지 발권하는 한국 출발 국제선 항공권의 유류 할증료를 공지했다. 노선별 대권거리에 비례해 편도 기준 5만 7500원~32만 2400원으로 책정됐다. 통상 유류 할증료는 발권일 기준 1개월 치가 발표되나, 아시아나항공의 이번 12월 유류 할증료는 16일까지만 적용된다. 17일부터는 통합 대한항공 체계로 항공권이 발권돼 대한항공의 12월 유류 할증료가 적용된다. 노선별 유류 할증료는 편도 기준 △후쿠오카·칭다오 등 동북아 최단 노선(대권거리 499마일 이하) 5만 7500원 △도쿄·베이징 등 동북아 주요 노선(500~999마일) 8만 4300원 △방콕·호찌민 등 동남아 주요 노선(2000~2499마일) 16만 4600원 △런던·파리·로","category":"세계"},{"title":"韓, 국제전기통신연합 이사국 10선 연임…\"국제 전파규범 논의 주도\"","link":"https://n.news.naver.com/mnews/article/003/0014325819","naverLink":"https://n.news.naver.com/mnews/article/003/0014325819","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"韓, 국제전기통신연합 이사국 10선 연임…\"국제 전파규범 논의 주도\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"칩수출통제 완화하더니…\"트럼프, 엔비디아 주식 830억원 보유\"","link":"https://n.news.naver.com/mnews/article/001/0016445179","naverLink":"https://n.news.naver.com/mnews/article/001/0016445179","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"WP \"엔비디아칩 中수출 승인 등으로 이익…내년 민주당 의회 조사 전망\" 도널드 트럼프 미 대통령과 젠슨 황 전 엔비디아 CEO [로이터=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 박성민 특파원 = 젠슨 황 전 엔비디아 최고경영자(CEO)를 두둔해온 도널드 트럼프 미국 대통령이 최대 830억원에 육박하는 엔비디아 주식을 보유한 것으로 나타났다. 미 일간 워싱턴포스트(WP)는 16일(현지시간) 일반에 공개된 트럼프 대통령 재무자료를 분석한 결과, 트럼프 대통령이 보유한 엔비디아 주식가치는 올해 8월말 기준으로 1천300만 달러(약 174억원)∼6천200만 달러(약 828억원)에 달한다고 보도했다. 이는 트럼프 대통령이 집권 2기 취임을 앞둔 2024년 말에 보유한 엔비디아 주식 가치 61만5천 달러(약 8억2천만원)∼130만 달러(약 17억4천만원)에 비해 급격히 오른 것이다. WP는 올해 9∼10월 재무 자료는 아직 공개되지 않았고, 엔비디아의 주가가 그간 더 상승했다는 점 등을 이유로 실제 가치는 이보다 더 높을 수 있다고 분석했다. 트럼프 대통령은 젠슨 황과 밀접한 관계를 유지해왔으며, 지난해 말에는 엔비디아의 고성능 인공지능(AI) 반도체 H200을 중국에 수출하는 것을 승인했다. 또 하워드 러트닉 상무장관은 엔비디아 최첨단 반도체를 중국으로 불법 유출한 혐의를 받는 기업에 대한 제재를 지연·유보해왔다. 결국 트럼프 대통령은 엔비디아의 성공을 통해 막대한 이익을 얻은 셈이다. 그간 트럼프 대통령은 야당과 시민사회의 주식 매각 요구를 거부해왔다. 백악관은 트럼프 대통령의 포트폴리오가 자녀들이 관리하는 신탁, 제3의 금융 기관들의 투자 관리 등 2가지 방식으로 관리되고 있다고 설명했다. 백악관은 WP에 \"대통령은 개별 주식을 선택하거나 거래하지 않는다. 독립적 금융 관리자들이 그의 포트폴리오를 운용한다\"고 밝혔다. 트럼프 대통령이 주식 거래를 하고 있지만, 자신이 직접 관여하지 않았기 때문에 이해관계 충돌 등 문제가 없다는 얘기다. 하지만, 트럼프 대통령의 이러한 엔비디아 투자는 이번 중간선거에서 압승한 민주당이 연방 상원과 하원을 장악하게 되면 엔비디아에 대한 광범위한 조사뿐 아니라 트럼프 대통령의 주식 거래, 러트닉 장관의 이해관계를 면밀히 조사할 것으로 보인다고 WP는 내다봤다. 트럼프 대통령은 지난해 12월 소셜미디어 트루스소셜을 통해 엔비디아가 중국에 H200을 판매할 수 있도록 허용할 것","category":"세계"},{"title":"Trump","link":"https://n.news.naver.com/mnews/article/077/0007240444","naverLink":"https://n.news.naver.com/mnews/article/077/0007240444","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"Trump. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"PARAGUAY GOVERNMENT CRISIS","link":"https://n.news.naver.com/mnews/article/091/0010370761","naverLink":"https://n.news.naver.com/mnews/article/091/0010370761","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"Paraguayan President Pedro Alliana addresses the nation Paraguayan President Pedro Alliana attends a press conference in Asuncion, Paraguay, 16 November 2026. In his first address to the nation since being sworn into office on 06 November, Alliana said his government's priority is to 'ensure the country's stability, restore confidence, and provide concrete and swift responses to the needs' of all Paraguayans, including those affected by the intervention in Ueno Bank. EPA/JUAN PABLO PINO","category":"세계"},{"title":"PERU POPE VISIT","link":"https://n.news.naver.com/mnews/article/091/0010370759","naverLink":"https://n.news.naver.com/mnews/article/091/0010370759","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"PERU POPE VISIT. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 아시아순방 나서며 \"중국서 김정은 만날수도\"","link":"https://n.news.naver.com/mnews/article/003/0014325883","naverLink":"https://n.news.naver.com/mnews/article/003/0014325883","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"시진핑·푸틴 이어 김정은 만남 언급…\"좋은 일 될것\" 미중러 회담에 질문에 \"김정은 올수도…시진핑에 달려\" [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 16일(현지 시간) 필리핀과 중국 방문을 위해 백악관을 나서며 취재진 질문에 답하고 있다. 2026.11.16. [워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 16일(현지 시간) 아시아 순방길에 오르며 \"김정은과도 만날 수도 있다\"고 밝혔다. 트럼프 대통령은 이날 필리핀과 중국 방문을 위해 백악관을 나서며 취재진에 \"우리는 시진핑 중국 국가주석과 만날 예정이다. 그는 한달전 이곳을 방문했다. 그리고 블라디미르 푸틴 대통령과도 만날 예정이다\"면서 이같이 말했다. 트럼프 대통령은 이번 순방에서 시 주석과 양자회담을 진행하고, 미중러 3자 정상회담에 나설 계획이었는데, 여기에 더해 김 위원장과의 만남까지 이뤄질 수 있다고 언급한 것이다. 트럼프 대통령은 시 주석, 푸틴 대통령, 김 위원장을 연이어 언급한 후 \"좋은 일이 될 것이다\"고 했다. 김 위원장과 어디서 만날 것이냐는 취재진 질문에는 \"중국에서(in China)\"라고 답했다. 또 다른 취재진이 시 주석, 푸틴 대통령과 3자 회담에서 북한의 핵문제도 논의할 것이냐고 묻자 \"어쩌면 김정은과도 함께할 수 있다. 그가 올 수도 있다(we might have Kim Jong Un, He may come)\"면서 \"모르겠다. 그것은 시 주석에 달렸다\"고 답변했다. 실제 김 위원장과 회담이 조율된 것인지, 트럼프 대통령의 희망사항을 밝힌 것인지는 불명확하다. 미국 정부 고위관계자는 지난 13일 트럼프 대통령 아시아 순방 관련 전화브리핑에서 김 위원장과 회담에 대한 질문에 \"북한과의 접촉 계획은 전혀 없다(there are no plans at all for engagement with North Korea)\"고 답했다.","category":"세계"}],"IT 과학":[{"title":"수능 앞두고 AI 안경 구매 늘었나?…당근서 검색량 2배 이상 폭증","link":"https://n.news.naver.com/mnews/article/016/0002724234","naverLink":"https://n.news.naver.com/mnews/article/016/0002724234","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"수능 앞두고 AI 안경 구매 늘었나?…당근서 검색량 2배 이상 폭증. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"한미 외교차관 AI 포함 경제협력 방안 논의","link":"https://n.news.naver.com/mnews/article/052/0002433797","naverLink":"https://n.news.naver.com/mnews/article/052/0002433797","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"한미 외교차관 AI 포함 경제협력 방안 논의. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"670조원 AI 돈줄 흔들리나…젠슨 황 퇴진에 엔비디아 투자 위축 우려","link":"https://n.news.naver.com/mnews/article/016/0002724367","naverLink":"https://n.news.naver.com/mnews/article/016/0002724367","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"젠슨 황 엔비디아 전 최고경영자(CEO)가 스캔들로 갑작스럽게 회사를 떠나면서, 그가 주도했던 5000억달러(약 670조원) 규모의 인공지능(AI) 금융지원 구상이 위축될 것이란 전망이 나오고 있다. 사진은 지난 9월 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 주최한 기술업계 리더들의 오찬 모습. 왼쪽 상단부터 시계방향으로 하워드 러트닉 미 상무부 장관, 사티아 나델라 마이크로소프트 CEO, 그렉 브록먼 오픈AI 사장, 마이크 존슨 미국 하원의장, 리사 수 AMD CEO, 도널드 트럼프 미국 대통령, 젠슨 황 전 엔비디아 CEO, 마크 저커버그 메타 CEO. [로이터] [헤럴드경제=도현정 기자] 젠슨 황 엔비디아 전 최고경영자(CEO)가 연이은 스캔들로 인해 갑작스럽게 회사를 떠나면서, 그가 주도했던 5000억달러(약 670조원) 규모의 인공지능(AI) 산업 금융지원 구상이 다소 위축될 수 있다는 전망이 나왔다. 로이터 통신이 16일(현지시간) 황 전 CEO가 엔비디아를 떠난 후에도 엔비디아의 AI 금융지원 구상은 이어지겠지만, 위험 감수 의지는 다소 줄어들 것이라고 보도했다. 전문가들은 엔비디아가 선호해온 AI 스타트업이나 네오클라우드(AI 컴퓨팅 자원을 대여해 주는 특화 클라우드 제공업체)에 대한 투자가 위축될 수 있다고 내다봤다. 엔비디아는 지난 8월 자사 칩을 구매하는 고객사들이 데이터센터 등 대규모 AI 인프라를 지을 수 있도록 글로벌 대형 금융사들과 손잡고 만든 고객사의 자금 조달을 지원하는 프로그램을 발표한 바 있다. 여기에 아폴로 글로벌 매니지먼트, 블랙록, 블랙스톤, 브룩필드 자산운용, 골드만삭스, KKR 등의 금융사들이 참여하기로 했다. 로이터는 엔비디아의 이 구상이 임시 CEO를 맡고 있는 콜레트 크레스 최고재무책임자(CFO) 체제하에서도 계속될 것이라 전망했다. 다만, 향후 운영 방향을 점검하는 과정에서 초기에는 일시 중단될 수도 있을 것으로 예상했다. 모닝스타의 브라이언 콜렐로 애널리스트는 “엔비디아의 CEO 교체는 불확실성을 가중시킨다”라며 5000억달러 금융지원 구상의 향방을 가늠하기 어렵다고 말했다. 로이터는 익명의 소식통들을 인용, 엔비디아의 금융 협력사들은 여전히 AI 기업에 자금을 지원하기 위한 방안을 논의 중이라고 전했다. 브룩필드 자산운용의 AI 인프라 부문 글로벌 책임자 시칸더 라시드는 이메일을 통해 “우리는 양 팀(브룩필드와 엔비디아) 간의 관계를 매우 소중하게 생","category":"IT 과학"},{"title":"기승 부리는 해킹…금감원, 전금·온투업계에 \"보안, 비용 아닌 투자\"","link":"https://n.news.naver.com/mnews/article/003/0014326353","naverLink":"https://n.news.naver.com/mnews/article/003/0014326353","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"기승 부리는 해킹…금감원, 전금·온투업계에 \"보안, 비용 아닌 투자\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"'호남권 반도체 국가산단' 추진 공무원 7명에 1500만원 포상","link":"https://n.news.naver.com/mnews/article/053/0000063095","naverLink":"https://n.news.naver.com/mnews/article/053/0000063095","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"'호남권 반도체 국가산단' 추진 공무원 7명에 1500만원 포상. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"김포 메추리 농장서 AI 항원 검출...수도권 24시간 이동 중지 명령","link":"https://n.news.naver.com/mnews/article/666/0000132359","naverLink":"https://n.news.naver.com/mnews/article/666/0000132359","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"김포 메추리 농장서 AI 항원 검출...수도권 24시간 이동 중지 명령. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"김포 메추리 농장서 AI 항원 확인… 24시간 일시 이동 중지 명령","link":"https://n.news.naver.com/mnews/article/022/0004175669","naverLink":"https://n.news.naver.com/mnews/article/022/0004175669","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"농림축산식품부는 16일 경기 김포시에 있는 한 메추리 농장에서 H5형 조류인플루엔자(AI) 항원이 확인됐다고 밝혔다. 고병원성 AI 중앙사고수습본부는 이날 해당 농장에 초동 대응팀을 투입해 출입을 통제하고, 가축 처분과 역학 조사를 진행 중이다. 고병원성 여부는 농림축산검역본부가 정밀 검사 중이며 결과가 나오기까지 1∼3일 걸릴 것으로 예상된다. 지난 3일부터 가금 농장에서 확인된 고병원성 AI는 연천·장흥·여주·강화·진천·파주·경주에서 각각 1건씩 총 7건이다. 중수본은 AI 확산을 막기 위해 이날 오후 11시부터 17일 오후 11시까지 24시간 동안 경기·서울·인천 등 수도권의 메추리 농장과 축산 시설·차량 등에 일시 이동중지 명령을 내렸다. 아울러 축산 농가에 외부 차량·인력 출입 통제와 매일 소독 등의 방역 수칙을 철저히 준수해달라고 강조했다. 또 축산 농가에서 사육 중인 가금의 폐사 증가나 산란율 저하 등 주요 고병원성AI 의심 증상뿐 아니라, 사료 섭취 감소 등의 경미한 증상이 나타나도 당국에 즉시 신고해 달라고 당부했다.","category":"IT 과학"},{"title":"“수능에서 AI 쓸 수 있어야”…서울대 교수의 제언 왜?","link":"https://n.news.naver.com/mnews/article/016/0002724232","naverLink":"https://n.news.naver.com/mnews/article/016/0002724232","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"AI 안경을 활용한 시범 사례. [교육부 제공] [헤럴드경제=채상우 기자] 대학수학능력시험(수능)에 인공지능(AI)를 활용할 수 있도록 교육체계 전반이 바뀌어야 한다는 서울대 교수의 제안이 화제다. AI와의 활용이 일상화될 미래를 준비하기 위해 개인의 AI 활용 능력을 교육 평가에 반영해야 한다는 취지다. 조성준 서울대 산업공학부 교수는 지난 4월 공개된 출판사 사이언스북스 유튜브 채널 영상에서 자신이 공저한 ‘미래를 만듭니다’ 책을 소개하면서 이같이 밝혔다. 조 교수는 “기업에서는 임직원들이 (이미) AI를 업무에 활용을 하고 있다”며 “이제는 그 사람이 손에 들고 다니는 AI와 한 팀이 됐을 때 그 성과는 어떨까로 평가 기준이 바뀌어야 한다”고 설명했다. 이어 “기업이 그렇게 사람을 원한다면 우리 대학도 교육하는 방식이 바뀌어야 되고, 중·고등학교도 또 바뀌어야 된다”고 말했다. 그는 “조금 과격하게 들릴지는 모르지만 수능시험 볼 때 (수험생들이) AI를 들고 가야 한다. 왜? AI는 누구나 쓸 수 있기 때문에. 저는 그렇게 생각한다”라며 AI 활용을 전제로 학업능력을 평가해야 한다고 주장했다. 조 교수는 해당 제안이 교육, 시험 제도의 전면 개편을 전제로 한 것이라고 설명했다. 그는 “그렇게 된다면 수능시험 문제가 바뀌어야 되고 고등학교, 대학교 교과과정이 바뀌어야 된다”고 강조했다. 조 교수는 앞서 한 언론과의 인터뷰에서도 “우리가 기존의 교육 방식으로 AI을 이기긴 어려울 것 같다”며 교육·입시제도 변화 필요성을 강조했다. 그는 “아직까지는 기업들이 입사 면접에서 (AI 사용이) 안 된다고 한다”며 “그런데 입사한 뒤 첫날부터 ‘AI 잘 쓰시죠?’라고 물어본다”고 지적하며 기업 채용 과정이 바뀔 거라고 전망했다. 이어 “생물학적인 뇌와 디지털 뇌를 같이 하나의 패키지로 놓고 쓰게 하는 것이 대학의 교육 방향이 돼야 한다”며 “그렇다면 질문하는 법, 생각하는 방법 등을 (주로) 학교에서 가르쳐야 한다”고 강조했다.","category":"IT 과학"},{"title":"뱅크샐러드금융서비스, AI OS 인재 찾는다···BFS 2기 공개 채용","link":"https://n.news.naver.com/mnews/article/144/0001150136","naverLink":"https://n.news.naver.com/mnews/article/144/0001150136","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"[스포츠경향 손봉석 기자] 뱅크샐러드 자회사인 뱅크샐러드금융서비스(BFS)가 금융 솔루션 전문가 2기를 공개 채용한다고 밝혔다. 이번 채용을 통해 뱅크샐러드금융서비스의 AI OS 기반 새로운 영업 모델인 ‘AI-Native Sales’를 이끌어갈 인재 확보에 나선다. 채용은 오는 30일까지 진행되며, 신입∙경력 모두 지원할 수 있다. 지원자는 서류 전형 및 직무 면접 과정을 거친다. 이후 교육 프로그램을 거쳐 전환 평가 합격 시 정규직으로 채용된다. 채용과 관련한 구체적인 내용은 뱅크샐러드금융서비스 채용 홈페이지를 통해 확인할 수 있다. 금융 솔루션 전문가의 주요 업무는 △금융·건강 데이터 기반 보험 분석 △고객 중심 솔루션 도출 △AI 상담 플랫폼 고도화 등이다. AI는 상담 준비와 데이터 분석, 자료 생성 등 반복적이고 복잡한 업무를 지원하며, 금융 솔루션 전문가는 고객 상황에 대한 종합적인 판단과 맞춤형 솔루션 제시에 집중한다. 실제 상담 경험을 바탕으로 플랫폼을 개선하는 역할도 수행한다. 금융 솔루션 전문가는 AI OS가 내재화된 업무 환경에서 금융 전문성과 AI 활용 역량을 함께 키울 수 있다. 금융 전문 지식은 물론 보험 약관 해석과 심사 사례 등이 축적된 사내 지식베이스를 통해 고객 혜택 개선 사례, 유병력자 언더라이팅 등 실무 지식을 학습한다. 모든 금융 솔루션 전문가는 1인 1AI 에이전트를 기반으로 보험 상담을 진행한다. AI가 우선적으로 검토해야 할 것을 정리해 고객에게 가장 잘 맞는 상담 방향을 제시하면 금융 솔루션 전문가는 이를 바탕으로 최종 판단을 내리게 된다. 금융 솔루션 전문가의 상담 역량은 시스템의 발전으로 이어진다. 이처럼 개인의 노하우가 개인에 머물지 않고 시스템과 조직의 자산이 되는 구조이기 때문에 고객은 일정 수준 이상의 상담 품질을 경험할 수 있다. 뱅크샐러드금융서비스의 ‘AI-Native Sales’는 AI를 업무 전반에 내재화해 기존의 개인 네트워킹과 경험 중심 영업 방식에서 나아가는 새로운 영업 모델을 지향한다. AI가 영업 기회 발굴부터 상담 연결까지 자동화하고, 금융 솔루션 전문가는 전문적인 상담, 데이터 기반 금융 솔루션 제공에 집중하는 것이 특징이다. 뱅크샐러드 관계자는 “뱅크샐러드는 AI OS를 중심으로 사업 운영 체계를 구축하고 조직 전반의 생산성과 실행 역량을 높이고 있다”며, “AI 환경에 최적화된 새로운 비즈니스 모델을 만들어가는 과정에서 금융 솔루션","category":"IT 과학"},{"title":"[김국현의 과학기술 유행어 도감] [23] 보이저호, ‘1광일’ 도착","link":"https://n.news.naver.com/mnews/article/023/0004009933","naverLink":"https://n.news.naver.com/mnews/article/023/0004009933","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"창백한 푸른 점(Pale Blue Dot). 이 시적인 표현은 1990년 보이저 1호가 촬영한 유명한 지구 사진을 말한다. 칼 세이건은 책임자들을 설득하여 행성들을 마지막으로 한번 더 돌아보게 했다. 보일 듯 말 듯 작은 점. 그 점 위에서 아등바등 살고 있는 우리 인류. 우주가 보기에 얼마나 소소한가. 다시 수십 년의 항해 뒤 바로 오늘 보이저 1호는 ‘1광일(光日)’이라는 역사적인 거리에 도달한 최초의 인공물이 된다. 지구에서 빛의 속도로 달려 하루가 걸리는 거리다. 1광일이면 전파로 명령을 내려도 그 결과를 회신받는 데 꼬박 이틀이 걸린다. 최근 그렇게 힘들여 명령을 내렸다. 절전을 위한 명령이었다. 전기를 아껴 10년만 더 애써 주길 바라고 있는 모양이다. 그런데 태양 빛도 닿지 않는 태양계 너머 성간 우주를 내달리는 이 우주선은 무슨 에너지로 임무 수행을 할까? 바로 난로다. 원료인 플루토늄은 붕괴하면서 열을 낸다. 이 열을 전기로 바꾼다. 1977년 발사니 곧 50주년, 이 난로는 점점 식어간다. 그나저나 수십 년간 꺼지지 않는 이 난로, 탐이 난다. 잠수함이나 발전소의 원자로처럼 핵분열 연쇄반응을 일으키는 것이 아니니, 종이 한 장도 뚫지 못하는 알파선만 주로 나온다. 하지만 자연에 존재하지 않는 플루토늄은 원자로에서 우라늄으로 만들어야 하니 정말 비싸다. 발암물질인 이 연료, 분말이 새어 나가 호흡이라도 하게 되면 끝이다. 인류를 설명하기 위해 보이저 1호에 차량 번호판처럼 붙여둔 금도금한 레코드판, 외계인이 떼어낸다면 다치지 않게 조심해야 할 것이다.","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-15","weekday":"일요일","label":"보관 · 11월 15일 일요일","total":50,"categories":{"사건 사고":[{"title":"전주서 택시가 도로 표지판·주차 차량 연쇄 추돌…70대 기사 부상","link":"https://n.news.naver.com/mnews/article/014/0005604518","naverLink":"https://n.news.naver.com/mnews/article/014/0005604518","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"15일 저녁 6시 23분께 전북 전주시 덕진구 만성동 도로서 아이오닉 5 택시 돌진 표지판 들이받고 50m가량 주행 후 주차된 캐스퍼 및 상가 건물과 잇달아 충돌 빈 차에 인도 보행자 없어 추가 인명피해 면해…경찰·소방 당국 사고 경위 조사 15일 저녁 6시 23분께 전북 전주시 덕진구 만성동에서 택시가 주차된 캐스퍼 승용차와 건물을 잇달아 들이받는 사고가 났다. /사진=뉴시스 [파이낸셜뉴스] 전북 전주시 도심에서 택시가 도로 표지판과 주차된 차량, 상가 건물을 연이어 들이받는 사고가 발생했다. 15일 경찰과 소방 당국에 따르면 이날 저녁 6시 23분께 전북 전주시 덕진구 만성동의 한 도로에서 주행 중이던 아이오닉 5 택시가 도로 표지판을 들이받았다. 사고를 낸 택시는 첫 충돌 이후에도 50m가량을 더 주행하다가 빈 상가 건물 앞에 주차돼 있던 캐스퍼 승용차 및 건물 외벽과 충돌하고서야 멈춰 섰다. 이 사고로 상가 건물 외벽과 차량 등이 파손됐다. 사고 당시 택시 안에는 승객이 타고 있지 않았으며 주차된 차량 내부나 인도에도 사람이 없어 다행히 추가 인명피해는 발생하지 않았다. 이 사고로 머리 등을 다쳐 가벼운 부상(경상)을 입은 70대 택시 운전자 A씨는 출동한 구급대에 의해 인근 병원으로 옮겨져 치료를 받고 있다. 경찰과 소방 당국은 목격자 진술 등을 토대로 정확한 사고 경위를 조사 중이다.","category":"사건 사고"},{"title":"‘AI 커닝’ 세무사 수석, 경찰 출석… “잘못 책임지겠다”","link":"https://n.news.naver.com/mnews/article/366/0001205274","naverLink":"https://n.news.naver.com/mnews/article/366/0001205274","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하고 있다. /연합뉴스 올해 세무사 자격 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모(34)씨가 17일 피의자 신분으로 경찰에 출석했다. 한씨는 이날 오전 9시쯤 서울 마포구 서울경찰청 광역수사단 청사 앞에 도착했다. 검은색 패딩 차림의 그는 “죄송합니다”라고 말한 뒤 허리를 굽혔다. 한씨는 “시험을 준비해오신 수험생분들과 관계자분들께 진심으로 죄송하다”며 “제가 한 일을 숨기지 않고 수사기관에 말씀드리겠다”고 말했다. 이어 “조사를 성실히 받고 잘못에 대한 책임을 지겠다”고 했다. 한씨는 다만 ‘공범이 있느냐’ ‘초소형 카메라 등은 어떻게 준비했느냐’ ‘범행이 안 걸릴 줄 알았느냐’ 등과 같은 취재진의 다른 질문엔 답하지 않고 광역수사단 공공범죄수사대 조사실로 향했다. 한씨는 지난 15일 경찰에 자수서를 제출했다. 같은 날 자신의 법률 대리인인 이돈호 법무법인 노바 대표 변호사의 유튜브 채널에 출연해 세무사 자격시험 1·2차 시험과 공인회계사 1차 시험에서 AI를 활용한 부정행위를 저질렀다고 자백했다. 한씨는 전날 초소형 카메라와 노트북 등 부정행위에 이용한 범행 도구도 변호인을 통해 경찰에 제출했다. 경찰은 범행 도구를 분석하는 한편, 이날 한씨를 상대로 구체적인 범행 경위를 조사할 계획이다.","category":"사건 사고"},{"title":"브레인포트개발공사 “지속적으로 공동 책임 지는 구조 만들어야” [AI 산업 부울경이 이끈다]","link":"https://n.news.naver.com/mnews/article/082/0001407235","naverLink":"https://n.news.naver.com/mnews/article/082/0001407235","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"광역권 8년 경제정책 협력 구조 강조 “브레인포트는 수십 년 협력의 결과” 파울 판 뉘넌 브레인포트 개발공사 사장. 브레인포트개발공사 제공. 네덜란드 남부 에인트호번 일대는 ‘브레인포트(Brainport)’라고 불린다. 네덜란드는 로테르담항과 스히폴 공항처럼 국가 경제를 떠받치는 교통 거점을 ‘메인포트(mainport)’라고 부르는데, 여기에 빗대 ‘두뇌(brain)가 모이는 항구’라는 뜻을 담았다. 말장난처럼 쓰이던 단어였지만 2005년 지역 협력기구인 브레인포트 재단이 출범하면서 공식 명칭이 됐다. 2016년 네덜란드 정부는 이 지역을 로테르담항, 스히폴 공항과 같은 공식 메인포트로 인정했다. 브레인포트에는 극자외선(EUV) 노광장비 독점 기업 ASML을 비롯해 필립스, NXP, DAF 같은 글로벌 기업과 7000여 개 하이테크 중소기업이 모여 있다. 이 생태계의 경제전략을 짜고 실행하는 곳이 지역 경제개발기관 ‘브레인포트 개발공사(Brainport Development)’다. 에인트호번·헬몬트·펠트호번·베스트 4개 시와 21개 지자체 연합인 메트로폴레지오 에인트호번(MRE)이 주주인 별도 법인으로, 시청과 거리를 두고 운영된다. 21개 지자체는 2024년 2025~2032년 8년 치 경제전략과 예산을 이 기관에 한꺼번에 맡겼다. 4년 단위였던 위임 기간을 처음으로 8년으로 늘렸다. 선거로 시장과 정당이 바뀌어도 경제정책이 흔들리지 않게 하기 위해서다. 브레인포트 개발공사를 이끄는 사람은 파울 판 뉘넌(Paul van Nunen) 사장이다. 그는 2013년부터 네덜란드 정부공보처(RVD) 처장으로 마르크 뤼터 당시 총리와 내각의 대변인 역할을 하다가 2018년 5월 고향으로 돌아와 브레인포트 개발공사 사장을 맡았다. 는 판 뉘넌 사장에게 광역 경제개발 정책의 성공 비결과 AI 전략을 물었다. 판 뉘넌 사장은 지역의 공동 의제를 강조하면서, AI는 기존 산업을 키우는 ‘도구’라고 설명했다. ■ 21개 지자체·기업·대학이 함께 만든 ‘공동 의제’ 브레인포트의 협력 문화는 위기에서 시작됐다. 판 뉘넌 사장은 “이 생태계는 정부의 마스터플랜 하나에서 나온 것이 아니다”라고 강조했다. 1990년대 초 필립스와 DAF가 구조조정을 하면서 지역 일자리 수천 개가 사라졌고, 그 충격은 에인트호번시를 넘어 주변 지역까지 영향을 줬다. 판 뉘넌 사장은 “기업, 정부, 교육기관은 누구도 혼자서는 지역 문제를 해결할 수 없다는","category":"사건 사고"},{"title":"주택서 화목난로 ‘펑’…2세 여아 등 일가족 7명 부상","link":"https://n.news.naver.com/mnews/article/016/0002723703","naverLink":"https://n.news.naver.com/mnews/article/016/0002723703","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"주택서 화목난로 ‘펑’…2세 여아 등 일가족 7명 부상. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"정점식 \"이번 정부서 개헌 없다…'대국민 사기' 조정식 사퇴해야\"","link":"https://n.news.naver.com/mnews/article/421/0009290875","naverLink":"https://n.news.naver.com/mnews/article/421/0009290875","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"\"국회의장이 국민에게 개헌으로 보이스피싱\" 정점식 국민의힘 원내대표가 16일 오전 서울 종로구 청와대 사랑채 앞에서 열린 현장 최고위원회의에서 모두발언을 하고 있다. 2026.11.16 ⓒ 뉴스1 오대일 기자 (서울=뉴스1) 손승환 기자 = 정점식 국민의힘 원내대표는 16일 조정식 국회의장이 헌법개정자문위원회를 출범시키고 개헌 논의를 본격화한 데 대해 \"국민의힘은 분명히 답한다. 이번 정부에서 개헌은 없다\"고 못 박았다. 정 원내대표는 이날 오전 국회에서 기자들과 만나 \"오늘 조 의장이 헌법개정자문위 출범 등 개헌 관련 로드맵을 발표했다\"며 이같이 말했다. 앞서 조 의장은 이날 국회에서 긴급 기자회견을 열고 헌법개정자문위 공동위원장에 김형오·정세균 전 국회의장을 위촉하고, 내년을 목표로 개헌을 추진하겠다는 입장을 밝혔다. 정 원내대표는 \"정부와 더불어민주당은 '이재명 탈옥법'과 검찰청 해체, 보완수사권 폐지, 노란봉투법, 입틀막법 등 온갖 위헌적 악법에 야합했다\"며 \"현행 헌법도 제멋대로 짓밟는 세력이 무슨 개헌이란 말인가\"라고 비판했다. 이어 \"무엇보다 국회의장의 입장 발표 시점이 문제\"라며 \"내일 국무회의에서 '이재명 탈옥법' 의결을 앞두고 있다. 탈옥에 대한 여론의 비판을 돌리기 위해 개헌을 미끼로 삼은 것\"이라고 지적했다. 정 원내대표는 \"국무총리는 대통령 대신 '이재명 탈옥법'을 의결하고, 국회의장은 국민에게 개헌으로 보이스피싱을 하고 있다\"며 \"대한민국 헌법을 이재명 탈옥의 도구로 쓴 것\"이라고 주장했다. 그는 \"조정식은 국회의장은 물론 국회의원 자격도 없다\"며 \"개헌을 운운하는 대국민 사기를 즉각 중단하고 사퇴부터 해야 한다\"고 촉구했다.","category":"사건 사고"},{"title":"주말 저녁 잠실광역환승센터 화재 발생…29분 만에 진화","link":"https://n.news.naver.com/mnews/article/119/0003155417","naverLink":"https://n.news.naver.com/mnews/article/119/0003155417","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"주말 저녁 잠실광역환승센터 화재 발생…29분 만에 진화. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"[단독] 특검, 선관위 과장 피의자 조사… 선거물품 특혜 의혹 수사 확대","link":"https://n.news.naver.com/mnews/article/005/0001885251","naverLink":"https://n.news.naver.com/mnews/article/005/0001885251","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"[단독] 특검, 선관위 과장 피의자 조사… 선거물품 특혜 의혹 수사 확대. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"'음주운전' 고경표…경찰 \"교특법상 치상 혐의 검토 중\"","link":"https://n.news.naver.com/mnews/article/018/0006410434","naverLink":"https://n.news.naver.com/mnews/article/018/0006410434","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"'음주운전' 고경표…경찰 \"교특법상 치상 혐의 검토 중\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"JMS 정명석, 영치금 등 ‘3억’ 압류…‘피해자 손해배상’ 에 따른 조치","link":"https://n.news.naver.com/mnews/article/021/0002832925","naverLink":"https://n.news.naver.com/mnews/article/021/0002832925","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"넷플릭스 ‘나는 신이다’ 포스터 속 정명석. 준강간 혐의로 복역 중인 기독교복음선교회(JMS) 정명석(81)의 교도소 영치금이 압류됐다. 15일 법조계에 따르면, 대전지법은 최근 홍콩 국적 여신도인 메이플씨의 신청을 받아들여 정씨의 대전교도소 영치금과 JMS 교단 예금 등에 대한 채권압류 및 추심명령을 내렸다. 법원이 이들에게 내린 청구 금액은 정씨와 교단에 각각 3억 882만 원 상당이다. 구체적인 압류 대상은 현재 보관 중인 영치금과 향후 입금될 금액, 교정시설에서 작업으로 받는 작업장려금 등이다. 정씨는 지난 2018년 2월부터 2021년 9월까지 충남 금산군에 있는 수련원 등지에서 23회에 걸쳐 메이플씨를 비롯한 3명의 여신도를 성폭행하거나 추행한 혐의로 징역 17년을 확정받았다. 피해자들은 정씨를 비롯해 2인자인 정조은과 교단을 상대로 손해배상 소송도 제기했다. 대전지법 제12민사부(부장판사 임성실)는 메이플씨에게 2억 5000만 원과 이자를 지급하라고 판결했다. 다른 피해자 2명에 대해서는 각각 8000만 원과 이자, 4000만 원과 이자를 지급하라는 판결을 내렸다. 정명석과 교단 측은 이 판결에 불복해 항소를 제기했지만 법원은 가집행이 가능하다고 판단했다. 한편 수원지법 역시 메이플씨의 신청을 받아들여 정조은의 교도소 영치금을 압류하기도 했다.","category":"사건 사고"},{"title":"세무사회 “AI 부정행위 철저 수사…국가자격시험 전수조사해야”","link":"https://n.news.naver.com/mnews/article/018/0006410149","naverLink":"https://n.news.naver.com/mnews/article/018/0006410149","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"세무사회 “AI 부정행위 철저 수사…국가자격시험 전수조사해야”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"}],"사회":[{"title":"스캐터랩, 청소년 AI챗 과몰입 우려에 대표 직속 '제타' 안전팀 신설","link":"https://n.news.naver.com/mnews/article/003/0014326226","naverLink":"https://n.news.naver.com/mnews/article/003/0014326226","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"주요 AI 개발 인력 절반, 콘텐츠·대화 검수 모델 개발에 투입 스토리 제작·출시·노출 3단계 검수…연령별 접근 제한 국내 청소년 하루 3시간·월 기본 결제 10만원 한도 연내 도입 [서울=뉴시스] 스캐터랩 엔터테인먼트형 인공지능(AI) 채팅 서비스 '제타' (사진=스캐터랩 제공) *재판매 및 DB 금지 [서울=뉴시스]윤정민 기자 = 스캐터랩이 인공지능(AI) 캐릭터 채팅 서비스 '제타'의 이용자 보호를 맡을 대표 직속 조직을 만들었다. 지난달 예고한 국내 청소년 이용 시간과 결제 한도 제한은 연내 도입할 계획이다. 청소년의 하루 기본 이용 시간은 3시간, 월 기본 결제 한도는 10만원으로 설정한다. 스캐터랩은 김종윤 대표가 직접 이끄는 안전 전담 조직 '트러스트&세이프티 팀'을 신설했다고 17일 밝혔다. 스캐터랩은 제타의 주요 AI 개발 인력 절반을 콘텐츠와 대화를 검수하는 AI 모델 개발에 투입한다. 새 조직은 콘텐츠 안전 정책 수립부터 자체 AI 모델 개발, 콘텐츠 검수까지 맡는다. 제타에서는 창작자가 인물과 상황을 설정한 이야기인 '플롯'을 고른 뒤 AI 캐릭터와 대화하며 이야기를 이어갈 수 있다. 스캐터랩은 연말까지 플롯 검수 체계를 개선해 이용 등급을 구분하고 가입 단계에서 연령 확인을 강화해 이용자가 자신의 연령에 맞는 플롯에 접근하도록 할 계획이다. 플롯 검수는 제작·출시·서비스 내 노출 등 세 단계에서 이뤄진다. 플롯의 소재와 글, 이미지를 살펴 이용 등급을 분류한다. 이를 위해 한국·일본·미국 등 주요 서비스 국가에 적용할 콘텐츠 정책과 검수 기준을 마련하고 플롯 검수에 특화된 자체 AI 모델을 개발한다. 이용자가 플롯을 골라 AI 캐릭터와 대화를 시작한 뒤에도 보호 장치를 적용한다. 스캐터랩은 부적절한 대화를 방지하는 자체 AI를 출시하고 AI 캐릭터가 이용자 연령에 맞게 답하도록 대화 기준도 마련한다. 제타를 이용하는 동안 대화 상대가 AI라는 사실을 주기적으로 알리는 기능도 마련한다. 자살·자해 관련 민감 콘텐츠가 감지되면 정해진 기준에 따라 이용자에게 안내하는 기능을 개발하고 검증할 예정이다. 스캐터랩은 이용자 신고와 이의제기를 처리하거나 콘텐츠 일부를 정기적으로 검수하는 과정에서 확인한 문제를 정책과 AI 모델에 반영한 뒤 다시 점검한다. 스캐터랩은 지식재산권과 청소년 보호를 놓고 규제 당국, 앱스토어 운영사, 콘텐츠 업계 등과도 논의를 이어갈 계획이다. 김종윤 스캐터랩 대표는 \"제타","category":"사회"},{"title":"한국원자력환경공단, 취약계층 지원·지역협력 성과… 최고등급 S등급 획득","link":"https://n.news.naver.com/mnews/article/022/0004175324","naverLink":"https://n.news.naver.com/mnews/article/022/0004175324","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"지역사회공헌 인정제서 최고등급인 S등급 획득 전국 신청 773개 기업·기관 중 197개 기관 승인 무료급식·발달장애인 고용 카페 판로 지원 등 추진 자립준비청년 멘토링·취약계층 농수산물 배송 활동 한국원자력환경공단이 보건복지부와 한국사회복지협의회가 공동 주관하는 '2026년 지역사회공헌 인정제'에서 최고등급인 S등급을 획득했다고 15일 밝혔다. 지역사회공헌 인정제는 비영리단체와 파트너십을 맺고 꾸준히 지역사회공헌 활동을 펼친 기업과 기관을 발굴해 그 공로를 인정하는 제도다. 한국원자력환경공단 청정누리봉사단이 취약계층 지원을 위한 김장봉사를 하고있다. 공단 제공 심사는 환경경영(E), 사회적책임경영(S), 투명경영(G) 등 ESG 3개 영역에서 환경경영, 추진체계, 문제인식, 네트워크, 프로그램, 성과영향, 투명경영 등 7개 분야 19개 지표를 종합적으로 평가한다. 공단은 지난해 처음으로 지역사회공헌 인정제에 참여해 A+등급을 받은 데 이어, 올해 한 단계 높은 S등급을 획득하며 지속적인 사회공헌 프로그램 발굴과 개선 노력을 인정받았다. S등급은 인증제 최고등급으로, 전국에서 인정을 신청한 773개 기업·기관 가운데 197개가 승인을 얻었다. 공단은 방폐장 유치지역 발전을 위해 리어카 무료급식소와 양남면 노인회관 식재료 지원 및 배식 봉사, 동경주사회적협동조합과 발달장애인 고용 카페의 판로 확대를 위한 협력사업 개발, 자립준비청년 멘토링 프로그램 등을 추진하고 있다. 한국원자력환경공단 청정누리봉사단이 리어카 무료급식소에서 배식봉사를 하고 있다.","category":"사회"},{"title":"한국세무사회 \"AI 차단한 실무교육 자체 평가 도입…부정행위자 세무사 활동 원천 봉쇄\"","link":"https://n.news.naver.com/mnews/article/660/0000121430","naverLink":"https://n.news.naver.com/mnews/article/660/0000121430","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"한국세무사회 \"AI 차단한 실무교육 자체 평가 도입…부정행위자 세무사 활동 원천 봉쇄\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"투자 상담은 현장으로…이천시, 반도체 기업에 산업단지·교육시설 안내","link":"https://n.news.naver.com/mnews/article/030/0003485809","naverLink":"https://n.news.naver.com/mnews/article/030/0003485809","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"투자 상담은 현장으로…이천시, 반도체 기업에 산업단지·교육시설 안내. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"스페인 카나리아 제도에 이주민 밀물…\"수용 역량 한계 도달\"","link":"https://n.news.naver.com/mnews/article/001/0016442848","naverLink":"https://n.news.naver.com/mnews/article/001/0016442848","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"스페인 카나리아 제도에 이주민 밀물…\"수용 역량 한계 도달\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/052/0002433194","naverLink":"https://n.news.naver.com/mnews/article/052/0002433194","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"동영상기사. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"서대문구, 신촌역 인근 바람산에 노을·야경정원 조성","link":"https://n.news.naver.com/mnews/article/011/0004682411","naverLink":"https://n.news.naver.com/mnews/article/011/0004682411","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"서대문구, 신촌역 인근 바람산에 노을·야경정원 조성. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"성동구, 청사 일회용품 줄이기 확대…내년 다회용기 지원","link":"https://n.news.naver.com/mnews/article/011/0004682409","naverLink":"https://n.news.naver.com/mnews/article/011/0004682409","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"유보화 성동구청장과 직원들이 ‘1회용품 ZERO’ 캠페인을 열고 개인 텀블러 사용을 독려하고 있다. 사진제공=성동구 서울 성동구가 청사 내 일회용품 사용을 줄이고 다회용품 이용을 확대하기 위해 회의·행사에서 일회용품 제공을 금지하고 내년부터 다회용기 지원 시범사업을 추진한다. 구는 12일 청사 출입구에서 유보화 구청장과 직원들이 참여한 ‘1회용품 ZERO’ 캠페인을 열고 개인 텀블러 사용을 독려했다. 청사 1층 카페에는 텀블러 세척기를 설치하고 텀블러 이용 시 할인 혜택도 제공하고 있다. 구는 각 부서 회의와 간담회에서 일회용품 구매·제공을 금지하고 방문객 응대에도 다회용 컵을 사용하도록 안내할 계획이다. 내년에는 각종 행사에 다회용기를 공급하고 수거·세척까지 지원하는 시범사업을 추진한다.","category":"사회"},{"title":"장동혁, 故진형구 전 고검장 빈소 조문…韓과 짧은대화","link":"https://n.news.naver.com/mnews/article/277/0005843532","naverLink":"https://n.news.naver.com/mnews/article/277/0005843532","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"장동혁 국민의힘 대표가 17일 한동훈 무소속 의원 장인인 고(故) 진형구 전 대구고등검찰청장의 빈소를 조문했다. '복당 내전(內戰)'이 치열한 가운데서다. 장 대표는 빈소에 약 7분간 머무른 뒤 별다른 메시지 없이 자리를 떴다. 연합뉴스 장 대표는 이날 오전 8시 30분께 신동욱 최고위원, 정희용 사무총장, 박준태 대표 비서실장 등 당 지도부와 함께 서울 서초구 서울성모병원 장례식장에 마련된 빈소를 찾았다. 장 대표는 분향소에서 헌화 및 묵념을 했다. 장 대표와 한 의원은 서로 미소를 머금은 채 인사를 나눴다. 이어 장 대표는 한 의원의 안내로 빈소 내 접객실로 이동해 약 4~5분간 짧은 대화를 나눈 뒤 이석했다. 한 의원은 조문한 의원들과 악수를 한 후 이들을 배웅했다. 복당 내전이 치열한 가운데 이뤄진 조문이지만 특별한 메시지는 없었다. 이날 오전 9시 20분 서울 종로구 청와대 앞에서 조작기소 특검법 저지를 위한 국민의힘 현장 의원총회가 예정된 만큼 참석자들은 서둘러 자리를 떴다. 한편 오세훈 서울시장 역시 전날 오후 4시 50분께 빈소를 찾아 조문했다. 오 시장 역시 한 의원 등과 인사를 나눈 뒤 약 7분 만에 별다른 메시지 없이 자리를 떴다. 오 시장은 보수통합과 관련한 취재진의 질문에 \"오늘은 드릴 말씀이 없다\"고 했다.","category":"사회"},{"title":"민주당 초선모임, '최민희 엄중 징계' 공동성명 추진","link":"https://n.news.naver.com/mnews/article/214/0001535869","naverLink":"https://n.news.naver.com/mnews/article/214/0001535869","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"더불어민주당 초선의원들이 최민희 최고위원에 대한 엄중 징계와 본인의 책임 있는 결단을 촉구하는 내용의 공동성명 추진에 나섰습니다. 민주당 초선의원 모임 '더민초'의 대표인 안태준 의원은 오늘 기자들에게 보낸 공지를 통해 \"초선 국회의원들은 최근 최 최고위원을 둘러싼 잇따른 논란과 이로 인한 당내 갈등 상황을 매우 엄중하게 인식하고 있다\"면서 이같이 밝혔습니다. 더민초는 운영위 차원에서 채택한 성명을 초선의원 전체 명의의 공동성명으로 발표하기 위해 오늘 자정까지 의견을 모은 뒤 내일 오전 공식 입장을 발표할 계획입니다. 더민초 운영위는 어제 오후 화상회의를 연 데 이어 오늘 낮 국회 의원회관에서 다시 회의를 열고 최 최고위원 논란과 당내 갈등에 대한 대응 방안을 논의했습니다. 김준혁 의원은 회의 직후 기자들과 만나 \"당의 안정적 발전을 위해 지도부와 윤리심판원이 당헌·당규에 따라 합리적으로 판단해야 한다는 의견이 오갔다\"고 전했습니다.","category":"사회"}],"생활·문화":[{"title":"\"원전 안전에 사회복지직 배치?\" 전경선 의원, 민형배 시장 인사 비판","link":"https://n.news.naver.com/mnews/article/660/0000121492","naverLink":"https://n.news.naver.com/mnews/article/660/0000121492","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"전 의원 \"전문성 외면한 인사, 시민 생명·혈세 위협\" ▲ 전경선 전남광주통합특별시의회 의원 [전남광주통합특별시의회] 전경선 전남광주통합특별시의회 의원이 16일 본회의 자유발언을 통해 시민 안전과 대형 건설사업을 총괄하는 핵심 보직의 전문성 부족을 강하게 질타했습니다. 전 의원은 민형배 시장이 지난 7월 간부회의와 취임 100일 기자회견 등을 통해 전문성·자율성·안정성을 최우선 가치로 삼고, 법과 원칙에 따라 적재적소에 인력을 배치하겠다고 약속했지만, 실제 인사는 달랐다며 포문을 열었습니다. 전 의원이 지적한 대표적인 사례는 재난대응국 인사로 원전안전팀장에 사회복지직, 자연재난대응팀장에는 수의직 공무원이 배치됐고, 사회재난과를 포함한 관련 팀원 4명 역시 방사능 방재와 재난 대응의 해당 분야 경험이 부족한 인력이 배치된 된 것입니다. 2조 원 규모의 건설사업을 총괄하는 종합건설본부장 인사도 도마 위에 올랐습니다. 설계·공정·안전·품질에 대한 전문적인 판단이 필요한 자리지만 직전까지 인공지능산업실장을 맡았던 행정전문가가 본부장을 맡고 있습니다. 전 의원은 현지조사와 행정사무감사 과정에서도 본부장이 사업 현황에 대해 기술직의 기초적인 질문에도 직접 답변하지 못하고 담당자에게 답변을 넘겼다고 비판했습니다. 전남과 광주 청사 간 인사교류의 불균형 문제도 제기했습니다. 전남 59명, 광주 51명을 교류했지만, 직렬과 직급을 살펴보면 실무 인력은 옛 전남에서 빠져나가고 간부 자리는 옛 광주에서 채워지는 구조라며, 이러한 인사 운영이 전남청사 직원들의 무력감으로 이어지고 있다고 지적했습니다. 전 의원은 \"사회복지직도, 보건직도, 수의직도 각자의 자리에서 반드시 필요한 전문 인력\"이라고 강조했습니다. 그는 \"안전부서와 대형 건설사업에서 전문성을 외면한 인사는 단순한 행정 착오로 끝나지 않는다\"며 \"그 대가는 시민의 생명과 혈세로 치르게 된다\"고 경고했습니다. 전 의원은 민 시장을 향해 \"전문성·자율성·안정성 그리고 법과 원칙, 적재적소는 시장 스스로 세운 기준\"이라며 \"말과 실제가 다르면 직원들은 신뢰를 잃고 시민들은 불안해진다\"고 비판했습니다. 이날 자유발언 말미에 민 시장이 전 의원을 향해 \"큰소리 치지 마세요\"라고 발언하자 전 의원은 의장에게 \"의원의 정당한 의정활동에 대한 부적절한 발언을 엄중히 지적해 달라\"고 요구하기도 했습니다.","category":"생활·문화"},{"title":"최적요금제 안내 연내 될까… 고지 주기 놓고 이견","link":"https://n.news.naver.com/mnews/article/014/0005604434","naverLink":"https://n.news.naver.com/mnews/article/014/0005604434","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"법 시행 한달 넘었지만 공회전 통신사 연장 요구에 정부 검토 \"연내 고지 할수있도록 준비 중\" 이동통신 3사가 가입자의 통신 이용량을 분석해 적합한 요금제를 안내하는 '최적요금제 고지 제도'가 법 시행 한 달이 넘도록 실제 고지로 이어지지 않고 있다. 고지 주기 등을 정할 하위법령 정비가 마무리되지 않으면서 첫 안내 시점이 불투명한 상황이다. 정부는 관련 절차를 조만간 마무리하고 늦어도 올해 안에는 첫 고지를 시작한다는 입장이다. 15일 과학기술정보통신부와 통신업계에 따르면 최적요금제 고지 의무를 담은 전기통신사업법이 지난달 1일 시행됐지만 실제 고지는 아직 이뤄지지 않았다. 가입 대상과 고지 방식·주기 등 세부 기준을 정하는 시행령과 고시가 확정되지 않으면서 첫 고지가 지연되고 있다. 최적요금제 고지 제도는 지난 3월 국회를 통과한 전기통신사업법 개정안에 근거를 두고 있다. 과기정통부가 마련한 고시 제정안에는 통신사가 가입자의 최근 6개월간 데이터·음성·문자 이용량 등을 분석해 적합한 요금제를 안내하도록 하는 내용이 담겼다. 현재 이용 중인 요금제와 추천 요금제의 월 이용료, 제공 조건 등을 문자메시지나 이메일 등으로 알리는 방식이다. 기존보다 비싸지 않은 요금제를 우선 추천하되, 결합할인이나 부가혜택 등을 고려한 다른 요금제도 추가로 안내할 수 있다. 핵심 쟁점은 고지 주기다. 앞서 과기정통부는 가입자의 통신 이용행태 변화를 반영하고 요금제 변경 기회를 제공하기 위해 6개월마다 고지하는 방안을 내놓았다. 반면 통신 3사는 가입자별 이용량 분석과 요금제 산정, 안내 메시지 발송 등에 따른 비용과 업무 부담을 이유로 고지 주기를 늘려달라고 요구해왔다. 잦은 고지가 이용자에게 불필요한 정보로 받아들여질 수 있고, 단기간의 이용량만으로는 실제 통신 이용행태를 정확히 반영하기 어렵다는 점도 근거로 제시했다. 한 업계 관계자는 \"가입자별 이용량을 분석하고 이를 정기적으로 안내하는 과정에서 업무 부담이 발생할 수밖에 없다\"며 \"이용자에게 실질적으로 도움이 되는 정보를 제공하면서도 안정적으로 제도를 운영할 수 있도록 적정한 고지 주기를 정할 필요가 있다\"고 말했다. 양측의 의견 차이가 좁혀지지 않자 고지 주기는 하위법령 마련 과정에서 주요 논의 대상이 됐다. 이 과정에서 기존 6개월 주기를 유지하는 방안과 최초 7개월 이후 1년마다 고지하는 방안 등이 검토된 것으로 전해졌다. 과기정통부는 최적요금제 관련 입법 절차가 사실","category":"생활·문화"},{"title":"칠곡군 지역사회보장협의체, 성과공유회 개최…복지안전망 강화","link":"https://n.news.naver.com/mnews/article/016/0002723700","naverLink":"https://n.news.naver.com/mnews/article/016/0002723700","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"[칠곡군 제공] [헤럴드경제(칠곡)=김병진 기자]경북 칠곡군 지역사회보장협의체는 지난 12일 교육문화회관 소공연장에서 협의체 위원 등 120여명이 참석한 가운데 ‘지역사회보장협의체 성과공유회’를 개최했다. 이번 행사는 한 해 동안 추진한 지역복지 활동과 성과를 공유하고 민관협력을 강화해 촘촘한 지역사회 복지안전망을 구축하기 위해 마련됐다. 이날 행사에서는 지역복지 발전에 기여한 유공자 7명에 대한 표창과 장학생 8명에 대한 장학증서 전달을 시작으로 군 및 읍·면 협의체의 활동성과 발표, 우수사례 심사와 시상 등이 진행됐다. 참석자들은 다양한 복지사업의 성과를 공유하고 복지 사각지대 해소와 지역사회 복지안전망 강화를 위한 협력 방안을 모색했다. 김종호 공동위원장은 “이번 성과공유회가 지역복지를 위해 노력한 위원들의 노고를 격려하고 우수사례를 나누는 뜻깊은 자리가 됐다”며 “앞으로도 민관협력을 바탕으로 군민이 체감하는 따뜻한 복지공동체를 만들어 나가겠다”고 말했다. 김재욱 칠곡군수는 “지역 곳곳에서 어려운 이웃을 위해 묵묵히 활동해 온 위원들의 노고에 감사드린다”며 “앞으로도 민관이 긴밀하게 협력해 복지 사각지대를 해소하고 지역 복지안전망을 강화하겠다”고 밝혔다.","category":"생활·문화"},{"title":"전국렌터카연합회Ｘ한국인플루언서콘텐츠협회, ‘2026 희망나눔 김치나눔’ 개최… 따뜻한 나눔 실천","link":"https://n.news.naver.com/mnews/article/144/0001149936","naverLink":"https://n.news.naver.com/mnews/article/144/0001149936","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"[스포츠경향 강석봉 기자] 사단법인 전국렌터카연합회(회장 박성호)와 문화체육관광부 산하 사단법인 한국인플루언서콘텐츠협회(대표 손지오)가 지역사회에 따뜻한 온정을 전하기 위해 ‘2026 희망나눔 김치나눔’ 행사를 공동으로 진행한다. 이번 행사는 오는 11월 18일 경기도 김포시에 위치한 신원라운지 앞에서 열리며, 한국인플루언서콘텐츠협회(KACIN) 소속 인플루언서와 연예인, 관계자 등이 함께 참여해 김장 나눔과 봉사활동을 펼칠 예정이다. 이번 나눔은 단순한 물품 전달을 넘어 기업과 문화예술계, 인플루언서들이 함께 사회적 책임을 실천하고 지역사회에 나눔의 가치를 확산하기 위해 마련됐다. 특히 박성호 회장은 서울특별시자동차대여사업조합 이사장을 겸임하고 있으며, 전국렌터카연합회와 한국인플루언서콘텐츠협회는 지난 업무협약(MOU)을 체결한 이후 다양한 공익사업과 사회공헌 활동을 함께 추진하며 협력 관계를 이어오고 있다. 평소 지역사회 봉사와 기부 등 사회공헌 활동에 꾸준히 관심을 기울여 온 박성호 회장은 이번 행사에서도 업계의 사회적 책임과 나눔의 중요성을 강조하고 있다. 박성호 회장은 “김장은 예로부터 이웃과 정을 나누는 우리 고유의 따뜻한 문화다. 정성껏 담근 김치 한 통이 누군가에게는 겨울을 이겨낼 수 있는 큰 힘이 될 수 있다”며 “앞으로도 전국렌터카연합회는 지역사회와 함께 호흡하며 도움이 필요한 이웃들에게 실질적인 온정을 전할 수 있도록 나눔 활동을 꾸준히 이어가겠다”고 밝혔다. 손지오 대표는 “이번 김치나눔은 카신 소속 인플루언서들이 콘텐츠를 통한 영향력을 넘어 직접 현장에서 봉사와 나눔을 실천한다는 점에서 의미가 크다”며 “선한 영향력을 가진 인플루언서들이 한자리에 모여 이웃을 위한 따뜻한 마음을 전하고, 사회에 긍정적인 변화를 만들어가는 계기가 되길 바란다”고 전했다. 한국인플루언서콘텐츠협회는 다양한 분야의 인플루언서들과 함께 사회공헌 및 문화예술 활동을 확대하고 있으며, 이번 행사를 계기로 나눔과 봉사가 일회성 행사에 그치지 않고 지속적인 공익 활동으로 이어질 수 있도록 노력할 계획이다. 한편, 양 기관은 앞으로도 상호 협력을 바탕으로 지역사회 발전과 소외계층 지원을 위한 다양한 사회공헌 사업을 공동으로 추진해 나갈 방침이다. 강석봉 기자 ksb@kyunghyang.com","category":"생활·문화"},{"title":"“한복 대신 해녀복”…외국인 관광객, 제주 바다서 요트 타고 해녀문화 체험","link":"https://n.news.naver.com/mnews/article/022/0004175325","naverLink":"https://n.news.naver.com/mnews/article/022/0004175325","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"무지개요트·도두동 어촌계, 해녀문화 관찰체험 운영 “해양관광·전통물질 결합…어민 소득 창출” 제주 바다에서 외국인 관광객들이 해녀복을 입고 해녀문화를 직접 체험·관찰하는 이색적인 해양관광 프로그램이 운영돼 눈길을 끈다. 15일 요트관광업을 하는 제주 무지개요트에 따르면 제주시 도두동 어촌계와 함께 ‘제주해녀문화 관찰체험 프로그램’을 운영해 외국인 관광객들로부터 호응을 얻고 있다. 이 프로그램은 외국인들이 제주 고유의 해녀복을 직접 입고 바다에서 해녀들의 물질문화를 관찰하는 이색적인 해양관광 콘텐츠다. 외국인 관광객들이 제주시 도두항을 출발한 요트 선상에서 제주 해녀복을 입고 해녀문화 관찰체험에 참여하고 있다. 무지개요트 제공 유네스코 인류무형문화유산으로 등재된 제주해녀문화를 관광 자원과 결합했다. 외국인 관광객에게 한국의 대표 전통문화인 한복을 넘어, 제주에서만 경험할 수 있는 독창적인 해녀복과 물질문화를 선보이며 차별화를 더했다. 프로그램 참가자들은 해녀복을 착용하고 요트에 승선해 바다를 삶의 터전으로 살아온 제주 해녀들의 고유한 생활방식과 공동체 문화를 가까이에서 체감하게 된다. 프로그램의 가장 큰 특징은 일방적인 관람형 관광을 넘어, 해양 요트 관광과 해녀 물질문화를 유기적으로 결합해 관광객의 체험이 해녀들의 실질적인 소득 증대로 이어지는 지속가능한 구조를 구축했다는 점이다.","category":"생활·문화"},{"title":"'2026 포항 해병대문화 축제' 12만 인파 운집 속 성료… 민·관·군 화합과 지역 상권 활기 견인","link":"https://n.news.naver.com/mnews/article/022/0004175327","naverLink":"https://n.news.naver.com/mnews/article/022/0004175327","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"14~15일 오천읍 서문사거리·해병대 제1사단 일원 개최… KAAV 탑승·해병 갓 탤런트 등 특화 콘텐츠 호응 거리 퍼레이드·서문 해병 감성포차 등 지역 상생 강화 및 220여 명 안전인력 배치로 단 한 건의 사고 없는 축제 실현 박용선 포항시장, \"부대 개방해 준 해병대와 불편 감수한 오천 주민께 감사… 세계적 군 문화 축제로 도약할 것\" 무적 해병대 제1사단, ‘포항 해병대 문화축제’ 성공적 지원 대한민국 해병대의 본향(本鄕)이자 '해병의 도시'인 경북 포항에서 민·관·군이 하나로 어우러지는 대한민국 대표 군(軍) 문화 축제인 '2026 포항 해병대문화 축제'가 이틀간 12만여 명의 구름 인파가 몰린 가운데 단 한 건의 안전사고 없이 성황리에 진행됐다. 포항시는 14~15일 양일간 남구 오천읍 서문사거리와 해병대 제1사단 일원에서 열린 '2026 포항 해병대문화 축제'가 전국 각지에서 찾아온 해병대 전우와 가족, 시민 및 관광객 등 12만여 명의 뜨거운 열기 속에 성공적으로 개최됐다고 밝혔다. 포항시는 14~15일 양일간 남구 오천읍 서문사거리와 해병대 제1사단 일원에서 열린 '2026 포항 해병대문화 축제'가 전국 각지에서 찾아온 해병대 전우와 가족, 시민 및 관광객 등 12만여 명의 뜨거운 열기 속에 성공적으로 개최한 가운데 기념촬영을 하고 있다. 해병대 제공 '위대한 포항, 무적의 해병! 시민과 함께 더 나은 내일로!'라는 슬로건 아래 개최된 올해 축제는 포항시와 해병대 제1사단을 비롯 미 해병대, 해병대전우회 경북연합회, (사)포항시해병대전우회가 공동으로 힘을 모았으며, 경찰과 소방 등 유관기관이 긴밀히 협력해 행사의 완성도를 한층 끌어올렸다. 축제의 포문을 연 첫날인 14일 해병대 의장대의 칼날 같은 절도 있는 축하 시범에 이어 펼쳐진 개막 축하공연 무대에는 트로트 스타 이찬원을 비롯 송민준, 이신주, 양혁 등 인기 가수들이 총출동해 열정적인 무대를 선사하며 가을밤 축제의 흥을 최고조로 끌어올렸다. 특히 이찬원 팬클럽 회원들은 40여 대의 버스를 이용해 축제장을 찾는 등 전국적인 관심을 모았다. 박용선 포항시장은 \"행사 기간 중 교통통제 등 여러 생활 불편을 기꺼이 감수하며 성숙한 시민의식으로 축제를 함께 빛내주신 오천읍 주민 여러분께도 각별한 감사의 말씀을 드린다\"고 전했다. 이어 \"이번 축제 현장에서 수렴한 시민과 전국 관광객들의 소중한 의견을 꼼꼼히 반영해, '포항 해병대문화 축제'가 명실상부","category":"생활·문화"},{"title":"경주 라원, 물 위에 하늘의 풍경을 담다…인생 사진 명소 기대","link":"https://n.news.naver.com/mnews/article/079/0004209942","naverLink":"https://n.news.naver.com/mnews/article/079/0004209942","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"잔잔한 수면에 하늘과 주변 경관 반영…몽환적인 분위기 연출 보는 위치와 촬영 각도에 따라 다채로운 사진 촬영 가능 경주시, SNS 관광 홍보와 방문객 체류 만족도 향상 기대 경주 라원 거울연못에서 방문객들이 수면에 비친 가을 풍경을 배경으로 사진을 찍으며 추억을 남기고 있다. 경주시 제공 경북 경주 보문관광단지에 있는 복합문화정원 '라원'에 하늘과 주변 풍경을 거울처럼 비춰내는 이색 포토존이 새롭게 만들어져 방문객들의 눈길을 끌고 있다. 잔잔한 수면에 자연 풍경과 인물이 어우러지는 독특한 공간으로, 경주의 새로운 사진 명소로 자리 잡고 있다. 경주시는 신라의 대표적인 정원 유적인 월지를 모티브로 라원에 '거울연못'을 조성하고 방문객들에게 색다른 볼거리와 촬영 공간을 제공하고 있다고 15일 밝혔다. 거울연못은 잔잔한 수면에 하늘과 주변 경관이 비치면서 몽환적이고 신비로운 분위기를 연출하는 공간이다. 실제 풍경과 물에 비친 모습이 대칭을 이루며, 관람객은 서 있는 위치와 촬영 각도에 따라 각기 다른 장면을 사진에 담을 수 있다. 경주 라원 거울연못에서 방문객들이 수면에 비친 가을 풍경을 배경으로 사진을 찍으며 추억을 남기고 있다. 경주시 제공","category":"생활·문화"},{"title":"서울 대학 기숙사 수용률 13% 그쳐…원룸 주거비는 월 71만원","link":"https://n.news.naver.com/mnews/article/011/0004682413","naverLink":"https://n.news.naver.com/mnews/article/011/0004682413","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"서울 기숙사 수용률 전국 평균보다 7.1%P 낮아 전국 수용률 4년 연속 하락…행복기숙사 확충 추진 자료=한국교육개발원 서울 지역 대학의 기숙사 수용률이 13.1%에 그친 것으로 나타났다. 대학생 100명 중 기숙사에 들어갈 수 있는 인원이 13명 수준으로 전국 평균 대비 크게 낮았다. 서울 주요 대학가의 원룸 주거비마저 월 71만 원에 육박하면서 대학생들의 주거 부담이 커지고 있다는 우려가 나온다. 15일 교육부와 한국교육개발원의 관련 자료에 따르면 올해 서울 지역 대학의 기숙사 수용률은 13.1%로 전국 평균(20.2%)보다 7.1%포인트 낮았다. 서울 지역의 기숙사 수용률은 2022년 13.5%에서 2024년 13.3%, 올해 13.1%로 꾸준히 하락했다. 올해 지방 대학의 수용률은 24.4%로 서울보다 11.3%포인트 높았으며 경기·인천 지역도 17.5%로 서울을 웃돌았다. 서울을 포함한 수도권에 전체 재학생의 44.9%가 몰려 있지만 기숙사 수용 인원은 전국의 33.6%에 그쳤다. 높은 땅값과 부지 부족, 인근 주민들의 민원 등이 수도권 대학의 기숙사 확충을 어렵게 하는 요인으로 꼽힌다. 전국적으로도 기숙사 수용 여건은 악화하는 추세다. 전국 대학의 기숙사 수용률은 2022년 21.9%를 기록한 후 4년 연속 하락해 올해 20.2%까지 떨어졌다. 같은 기간 재학생은 191만 7143명에서 198만 6263명으로 늘어난 반면 기숙사 수용 가능 인원은 42만 579명에서 40만 2095명으로 감소했다. 외국인 유학생 증가와 기존 3~4인실의 1~2인실 전환 등이 영향을 미친 것으로 분석됐다. 기숙사 수용 여건이 악화하는 가운데 대학가 월세까지 오르면서 학생들의 주거비 부담은 한층 커지고 있다. 부동산 정보 플랫폼 다방에 따르면 올해 7월 서울 주요 10개 대학 인근 원룸의 평균 월세는 62만 5000원으로 전년보다 7.6% 올랐다. 평균 관리비도 8만 4000원으로 12.0% 상승했다. 월세와 관리비를 합친 주거비는 월 70만 9000원으로 1년 새 5만 3000원 늘었다. 정부는 이 같은 부담을 완화하기 위해 공공기금을 활용한 행복기숙사 공급을 확대하고 있다. 올해 서울 지역 행복기숙사의 월평균 기숙사비는 사립형 28만 7800원, 연합형 33만 4400원으로 서울 대학가 원룸 평균 주거비의 절반 이하 수준이다. 교육부 관계자는 “2012년부터 사학진흥기금 1조 4328억 원을 지원해 총 77개 사업을","category":"생활·문화"},{"title":"성북구, 복지 담당 직원 100명 대상 힐링 교육","link":"https://n.news.naver.com/mnews/article/011/0004682408","naverLink":"https://n.news.naver.com/mnews/article/011/0004682408","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"성북구 보건복지 현장 직우너들이 도자기 핸드페인팅을 하고 있다. 사진제공=성북구 서울 성북구가 취약계층 발굴과 상담 업무를 맡는 복지 담당 직원들의 직무 스트레스를 줄이고 심리적 소진을 예방하기 위해 힐링 교육을 진행했다. 이달 5일과 10일, 12일 세 차례에 걸쳐 열린 교육에는 동주민센터 직원 67명과 구청 복지 부서 직원 33명 등 100명이 참여했다. 참가자들은 성북구 뉴시니어센터 ‘행복더함’에서 도자기 핸드페인팅을 체험하고 업무 고충을 나누는 간담회와 낙산 성곽길 산책 등을 통해 재충전의 시간을 가졌다. 교육 장소인 행복더함은 노후 경로당을 리모델링해 도자기 공방과 카페를 조성한 공간으로, 어르신 일자리 사업과 연계해 운영되고 있다.","category":"생활·문화"},{"title":"“반도체 허브·430만 교통 숨통 틔울 것”…용인시, 국가철도망 반영 총력","link":"https://n.news.naver.com/mnews/article/022/0004175329","naverLink":"https://n.news.naver.com/mnews/article/022/0004175329","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"이상일 시장, 대국민 의견수렴 행사서 홍지선 국토장관에 자료 전달 경기남부광역철도·경강선 연장·반도체선 등 3개 핵심 노선 건의 “정부 재정투자 100조원 이상 늘려야”…2030년까지 1조 기금 적립 경기 용인시가 지역 숙원인 3대 핵심 철도망의 ‘제5차 국가철도망 구축계획(2026~2035년)’ 반영을 위해 정부를 상대로 총력전에 나섰다. 반도체 국가산업단지 조성에 따른 광역 교통 수요에 선제 대응하고, 수도권 남부 430만 시민의 출퇴근 교통난을 해소하기 위해서다. 이상일 용인시장이 13일 서울 전문건설회관에서 열린 ‘제5차 국가철도망 구축계획 대국민 의견수렴 행사’에서 발언하고 있다. 용인시 제공 15일 용인시에 따르면 이상일 시장은 이달 13일 서울 동작구 전문건설회관에서 국토교통부 주최로 열린 ‘제5차 국가철도망 구축계획 대국민 의견수렴 행사’에 참석해 시 철도 구상의 당위성을 역설했다. 이 시장은 행사장에서 홍지선 국토교통부 장관을 만나 용인의 주요 철도 사업 필요성을 담은 자료를 전달하고 적극적인 검토를 요청했다. 이 시장은 “전국 지자체가 건의한 필수 철도 노선을 대거 수용하려면 국가철도망 구축 재정투자 규모를 100조원 이상으로 확대해야 한다”고 주장했다. 용인시가 이번 5차 계획 반영을 건의한 노선은 △경기남부광역철도 신설(약 50.7㎞) △경강선 연장(약 38㎞) △경기남부동서횡단선(반도체선·약 89.4㎞)의 3개다. 경기남부광역철도 노선안","category":"생활·문화"}],"세계":[{"title":"경주시 투자유치단, 美 한인 경제인에 세계한상대회 참여 요청","link":"https://n.news.naver.com/mnews/article/022/0004175323","naverLink":"https://n.news.naver.com/mnews/article/022/0004175323","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"앨라배마서 동포 경제인 간담회… 지역 산업·투자환경 소개 내년 경주 세계한상대회 초청… 해외 경제 네트워크 강화 추진 현대차 생산공정 살피고 관세·환율 등 통상환경 변화 논의 경북 경주시가 미국 동남부 지역 동포 경제인들과 만나 투자협력 방안을 논의하고, 내년 경주에서 열리는 세계한상대회 참여를 요청했다고 15일 밝혔다. 경주시 투자유치대표단은 현지시간 10일 미국 앨라배마주에서 한인 경제단체와 기업 관계자 등이 참석한 가운데 동포 경제인 간담회를 열었다. 주낙영 경주시장을 비롯한 경주시 투자유치대표단이 현지시간 10일 미국 현대자동차 앨라배마 생산법인을 방문해 관계자들과 기념촬영을 하고 있다. 경주시 제공 간담회에는 신동준 미국 동남부 상공회의소 연합회장과 김문규 이사장, 최연철 애틀랜타 상공회의소 회장, 조창원 앨라배마 상공회의소 회장, 이경철 애틀랜타 민주평통협의회장 등이 참석했다. 시는 지난해 APEC 정상회의 개최 성과와 지역 산업·투자환경, 역사문화 관광자원을 소개하고 경제협력 확대 방안을 논의했다. 특히 내년 세계한상대회를 계기로 경주를 방문해 줄 것도 요청했다. 대표단은 이날 몽고메리의 현대자동차 앨라배마 생산법인(HMMA)과 오번의 자동차부품기업 인팩(INFAC) 신규 공장도 방문했다. 현대차 공장에서는 주요 생산공정을 둘러보고 미국 자동차시장과 공급망 동향을 살폈다. 관세·환율 등 통상환경 변화가 자동차산업에 미치는 영향에 대해서도 의견을 나눴다. 주낙영 경주시장을 비롯한 경주시 투자유치대표단이 현지시간 10일 미국 현대자동차 앨라배마 공장에서 관계자의 설명을 듣고 있다.","category":"세계"},{"title":"관상동맥 정상인데 가슴엔 통증이 있다?","link":"https://n.news.naver.com/mnews/article/144/0001149937","naverLink":"https://n.news.naver.com/mnews/article/144/0001149937","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"관상동맥 정상인데 가슴엔 통증이 있다?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"미·중·러, 첫 3자 정상회담… 셈법 제각각 ‘제2 얄타’ 우려","link":"https://n.news.naver.com/mnews/article/005/0001885250","naverLink":"https://n.news.naver.com/mnews/article/005/0001885250","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"핵군축·우크라 전쟁 등 3국 속내 달라 선거 패배 레임덕 우려 트럼프 적극적 실질 성과 난망 강대국 간 거래 경계도 미국·중국·러시아가 참여하는 3자 정상회담이 오는 19일 중국 선전에서 개최된다. 제2차 세계대전 이후 갈등과 공조를 반복해 온 미·중·러의 역사상 첫 정상회담이다. 다만 핵무기 감축(핵군축), 우크라이나 전쟁 등을 둘러싼 세 나라의 셈법이 상충돼 실질적 성과에 대해선 회의적인 시각이 우세하다. 14일(현지시간) AP·로이터통신 등에 따르면 미국 백악관과 러시아 크렘린궁은 오는 17~19일 열리는 아시아태평양경제협력체(APEC) 정상회의를 계기로 미·중·러 3자 정상회담을 개최할 계획이라고 밝혔다. 구체적인 의제와 형식은 조율 중이라고 로이터는 복수 관계자를 통해 전했다. 회담에 임하는 각국의 속내는 다르다. 중간선거 패배로 조기 레임덕(권력 누수) 우려가 커진 도널드 트럼프 미국 대통령, 유리한 방향으로 우크라이나전을 끝내야 하는 블라디미르 푸틴 러시아 대통령, 4연임을 향하는 시진핑 중국 국가주석은 모두 외교적 성과를 노린다. 핵심 의제는 핵군축이다. 지난 2월 미·러 간 핵군축 조약인 신전략무기감축조약(New START·뉴스타트)이 만료돼 50여년 만에 양국의 핵무기 보유 제한이 사라졌다. 트럼프 대통령은 러시아의 연장 요청을 거부했고, 중국을 포함한 3자 구도를 만들어 성과를 내려 한다. 중국은 이에 비판적이다. 스톡홀름 국제평화연구소에 따르면 지난 1월 기준 중국의 핵탄두는 620기다. 미국(5042기) 러시아(5420기)와 격차가 큰 상황에서 동등한 수준의 감축 요구는 불합리하다는 것이 중국의 입장이다. 러시아는 중국의 입장을 이해하지만 영국과 프랑스가 보유한 핵무기도 여기에 포함해야 한다고 주장한다. 우크라이나전 이후 국제사회에서 입지가 좁아진 러시아는 3자 회담에 참여하는 것 자체가 초강대국 지위를 과시하는 일이다. 자국에 유리한 조건으로 종전 합의 방안을 찾는 것도 중요한 목표다. 미국과 중국의 입장은 러시아와 다르다. 미 고위 관계자는 “(이번 회담에서) 이란 전쟁은 논의할 수 있어도 우크라이나전은 별개”라고 선을 그었다. 중국도 우크라이나 문제에 개입하긴 껄끄러운 상황이다. 종전에서 러시아를 돕는 역할로 비치면 유럽과의 관계가 더 악화할 수 있고, 결렬 시 책임 부담에서 자유롭지 못하다. 그간 다자주의를 앞세워 온 중국으로선 이번 회담이 강대국 간 거래에 의해 세계 질서가 재편","category":"세계"},{"title":"India Hindu Festival","link":"https://n.news.naver.com/mnews/article/077/0007239002","naverLink":"https://n.news.naver.com/mnews/article/077/0007239002","pubDate":"2026-1 om/mnews/article/077/0007238999","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Denmark Women's World Championship Ice Hockey United States' Joy Dunne, left, is challenged by Finland's Nelli Laitinen, center, during the semifinal match between United States and Finland at the Women's Ice Hockey World Championship in Herning, Denmark, Sunday, Nov. 15, 2026. (AP Photo/Petr David Josek)","category":"세계"},{"title":"Patriots Lions Football","link":"https://n.news.naver.com/mnews/article/077/0007238998","naverLink":"https://n.news.naver.com/mnews/article/077/0007238998","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Patriots Lions Football New England Patriots running back Corey Kiner (9) is tackled by Detroit Lions linebacker Malcolm Rodriguez (44) during an NFL football game in Munich, Germany, Sunday, Nov. 15, 2026. (AP Photo/Lennart Preiss)","category":"세계"},{"title":"Italy ATP Finals Tennis","link":"https://n.news.naver.com/mnews/article/077/0007238997","naverLink":"https://n.news.naver.com/mnews/article/077/0007238997","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Italy ATP Finals Tennis Germany's Alexander Zverev serves a ball to Spain's Rafael Jodar during their tennis match of the ATP World Tour Finals, in Turin, Italy, Sunday, Nov. 15, 2026. (AP Photo/Luca Bruno)","category":"세계"}],"IT 과학":[{"title":"'수학 7등급'인데 AI 안경 썼더니…결과 충격적","link":"https://n.news.naver.com/mnews/article/422/0000926433","naverLink":"https://n.news.naver.com/mnews/article/422/0000926433","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"AI 스마트 안경으로 수능 문제 풀이하는 감스트 [감스트 유튜브 채널 캡처] 유튜버 감스트가 인공지능(AI)이 탑재된 스마트안경을 쓰고 수능 수학 문제를 풀어본 결과를 공유했습니다. 감스트는 지난 13일 2026학년도 대학수학능력시험 수학 영역 문제를 AI 안경으로 풀어보는 실험 영상을 자신의 유튜브 채널에 공개했습니다. 그는 고등학교 시절 수학이 7등급 수준이었다고 밝혔는데, 총 100분이 주어진 시험을 약 50분 만에 마쳤고, 채점 결과 30문항 중 5문항을 틀렸습니다. 그는 \"주관식 문제를 제외하면 보통 5초면 답이 나온다\"며 \"나처럼 수학을 모르는 사람도 5개만 틀릴 정도면 심각한 문제\"라고 말했습니다. 감스트가 착용한 AI 안경은 90만 원 상당으로, 일반 안경과 외관상 차이가 거의 없습니다. #감스트 #유튜버 #수능 #부정행위 #AI안경 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"IT 과학"},{"title":"[단독] 국가시험 ‘AI 커닝’ 작년에도 있었다… 챗GPT로 정답 확인 수법","link":"https://n.news.naver.com/mnews/article/005/0001885248","naverLink":"https://n.news.naver.com/mnews/article/005/0001885248","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"[단독] 국가시험 ‘AI 커닝’ 작년에도 있었다… 챗GPT로 정답 확인 수법. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"미국 캘리포니아, AI ‘허깅페이스 해킹’ 사건으로 오픈AI 제소","link":"https://n.news.naver.com/mnews/article/056/0012295194","naverLink":"https://n.news.naver.com/mnews/article/056/0012295194","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"미국 캘리포니아주(州) 검찰당국이 최근 벌어진 인공지능(AI)의 사이버 공격을 문제 삼으며 오픈AI를 상대로 소송을 제기했습니다. 로이터통신은 현지 시각 16일 롭 본타 캘리포니아주 법무장관이 샌프란시스코 소재 주 1심 법원에 오픈AI를 캘리포니아 불공정경쟁법 위반 및 공공 방해 행위 혐의로 제소했다고 보도했습니다. 오픈AI가 AI에 적절한 관리·감독을 하지 않고 잠재적으로 위험한 AI 모델을 테스트해 공공 안전을 무시했다는 것이 주 검찰당국의 주장입니다. 미국 주 정부가 AI모델의 사이버 공격 문제와 관련해 법적 책임을 묻고자 나선 것은 이번이 처음입니다. 지난 7월 오픈AI가 개발한 AI모델 GPT-5.6 솔 등은 관리자의 통제를 벗어나 외부 오픈소스 AI플랫폼인 ‘허깅페이스’ 시스템에 침투했고, 이는 인간이 AI를 통제하지 못하고 있다는 경종을 업계에 울렸습니다. 당시 AI 모델들은 AI의 성능을 평가하는 벤치마크 시험 문제를 풀고 있었는데, 답을 찾기 위해 테스트 환경에서 탈출하고 무단으로 ‘허깅페이스’ 시스템에 침투해 답안을 찾아낸 것으로 알려졌습니다. 본타 주 법무장관은 “허깅페이스 공격은 안전보다는 빠른 모델 개발을 우선시하는 오픈AI 내부 문화로 인해 예견된 결과였다”며 “이는 80개의 알려진 사고 중 하나에 불과하다”고 꼬집었습니다. 또 오픈AI가 주 정부에 상세한 정보를 제공하고 있지 않다고 언급하고 “대중을 위험에 빠뜨리는 행위”라며 “기업은 공공안전을 최우선에 둬야 할 법적·도덕적 책임이 있다”고 강조했습니다. 앞서 앤트로픽과 메타, 구글 등 여타 AI 기업도 자사 모델이 통제 불능 상태에 빠진 적이 있다고 공개한 바 있습니다. [사진 출처 : AFP=연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"IT 과학"},{"title":"美, 뒤늦게 中 AI칩 우회로 차단..엔비디아 4% 급락[이태규의 워싱턴 플레이북]","link":"https://n.news.naver.com/mnews/article/011/0004682915","naverLink":"https://n.news.naver.com/mnews/article/011/0004682915","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"◆이태규 특파원의 워싱턴 플레이북 상무부 산하 BIS “재무부·NSC 지시로 발표” 러트닉 우회해 새 규정 발표 시사 中에 컴퓨팅 파워 제공 DC, 美 허가 대상 싱가포르, 인니 등 5개국 수출 시 허락 받아야 젠슨 황 스캔들에 BIS ‘뒷북 대응’ 하워드 러트닉 미 상무장관의 모습. AFP연합뉴스 미국 상무부 산업보안국(BIS)가 중국이 동남아시아 등 제3국 데이터센터를 이용해 미국산 첨단 인공지능(AI) 칩에 접근하는 우회로를 차단하고 나섰다. 젠슨 황 엔비디아 전 최고경영자(CEO) 스캔들로 상무부의 늑장 대응에 대한 비난이 커지자 부랴부랴 대책을 내놓은 것으로 풀이된다. 이 여파로 엔비디아 주가는 4.1% 떨어지는 등 나스닥 종합지수는 2.49% 급락했다. 상무부 산하 BIS는 16일(현지 시간) 보도자료를 통해 “미국의 초고성능 AI 기술에 대한 원격 접근을 규율하는 규칙을 발표한다”며 “이는 재무부, 백악관 국가안보회의(NSC)의 지시에 따라 작성된 잠정 최종규정”이라고 설명했다. 미 온라인매체 폴리티코는 “재무부와 NSC의 지시에 따라 작성됐다는 언급은 이번 조치가 하워드 러트닉 상무장관을 우회해 발표됐다는 것을 시사한다”고 지적했다. 블룸버그 통신은 “상무부 외부 기관의 압력이 발표에 상당한 영향을 미쳤음을 시사한다”고 평가했다. AP통신에 따르면 이 규정은 즉시 발효됐다. 이번 조치의 핵심은 미국산 AI 반도체와 서버가 어디에 있든 중국 등 미국의 안보우려국 기업에 연산 성능을 제공하려면 미국의 허가를 받도록 한 것이다. 미국 허가 없이는 중국 기업 등에 컴퓨팅 파워를 제공하지 못하도록 하는 차단 조치에 나선 셈이다. 이전에 이와 같은 서비스를 제공해온 데이터센터도 90일 이내에 미국 정부의 허가를 받아야 하며, 이를 어기면 향후 수출 제한 조치를 받게 된다. BIS는 인도네시아, 말레이시아, 싱가포르, 태국, 브라질 등 5개국에 첨단 AI칩을 수출, 재수출하거나 국가 내에서 이전할 경우에도 허가를 받아야 한다고도 적시했다. 이들 국가로 엔비디아 등의 AI칩이 제한 없이 수출돼 결국 중국으로 밀반입되고 있다는 관측이 많았는데, 이를 뒤늦게 차단한 것으로 해석된다. 다만 상무부는 “미국에 본사가 있거나 최종 모회사가 있는 기업은 일정 보고 요건을 충족하면 허가 의무에서 제외된다”고 적었다. 구체적으로 거래 당사자 정보, 반도체의 최종 목적지, 반도체 제품 정보 등을 보고해야 한다. 블룸버그 통신은","category":"IT 과학"},{"title":"미국 증시, 기술주·반도체주 급락에 일제히 하락 마감…나스닥 2%대 밀려[서울데이터랩]","link":"https://n.news.naver.com/mnews/article/081/0003700081","naverLink":"https://n.news.naver.com/mnews/article/081/0003700081","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"16일(현지시간) 미국 뉴욕증시는 대형 기술주와 반도체주 전반의 약세 속에 주요 지수가 일제히 하락 마감했다. 특히 나스닥과 반도체 관련 종목들의 낙폭이 두드러지면서 투자심리가 크게 위축된 모습이었다. 이날 다우존스지수는 전장보다 739.38포인트(1.41%) 내린 51,608.17에 거래를 마쳤다. S＆P 500지수는 145.08포인트(1.92%) 하락한 7,416.59, 나스닥 종합지수는 626.52포인트(2.49%) 밀린 24,509.76에 장을 마감했다. 대형 기술주 중심의 나스닥100지수도 746.58포인트(2.67%) 떨어진 27,197.15를 기록했다. 반도체 업종의 약세는 특히 두드러졌다. 필라델피아 반도체지수는 535.67포인트(5.28%) 급락한 9,610.65로 마감해 시장 전반의 하락 압력을 키웠다. 반면 경기 흐름을 일부 반영하는 다우운송지수는 55.60포인트(0.27%) 오른 20,649.67로 소폭 상승했다. 시장의 불안 심리도 확대됐다. 변동성지수(VIX)는 4.59포인트(23.78%) 급등한 23.89를 기록했다. 장중에는 24.52까지 오르며 투자자들의 경계감이 높아졌음을 보여줬다. 나스닥 대형주 가운데서는 엔비디아가 4.12% 하락했고, 브로드컴은 3.92%, AMD는 5.58%, 마이크론 테크놀로지는 7.62%, 인텔은 7.02%, ASML 홀딩 ADR은 5.91%, 어플라이드 머티어리얼즈는 5.47% 내렸다. SK하이닉스 ADR도 7.29% 하락했다. 반도체 장비와 메모리, 설계 전반에 걸친 동반 약세가 지수 하락을 주도한 셈이다. 대형 기술주도 대부분 약세를 면치 못했다. 애플은 0.98%, 마이크로소프트는 1.12%, 아마존은 3.34%, 메타는 2.38%, 알파벳 클래스A는 4.07%, 알파벳 클래스C는 3.85%, 테슬라는 2.69% 각각 하락했다. 거래대금 상위권에서도 엔비디아가 513억달러로 가장 활발한 거래를 보였지만 주가는 큰 폭으로 밀렸다. 뉴욕증시 상위 종목 가운데서도 약세가 우세했다. TSMC ADR은 6.34% 하락했고 오라클은 5.03%, 제이피모간체이스는 2.31%, 뱅크오브아메리카는 1.84%, 엑슨모빌 홀딩스는 1.50%, 셰브론은 1.23% 내렸다. 방어적 성격의 종목 가운데서는 P＆G가 1.97%, 유나이티드헬스 그룹이 1.12%, 코카콜라가 0.23%, 비자가 0.16%, 마스터카드가 0.08% 상승하며 일부 버팀목 역할을 했다. 업종별로","category":"IT 과학"},{"title":"로봇고 졸업후 현대重 10년 근무 이력","link":"https://n.news.naver.com/mnews/article/009/0005764097","naverLink":"https://n.news.naver.com/mnews/article/009/0005764097","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"세무시험 부정행위 수석 누구 퇴사 후 차린 자영업 경영난 \"부모님께 자랑 되고 싶었다\" 올해 세무사 자격시험에서 인공지능(AI)을 이용해 부정행위를 저질렀다고 자백한 A씨는 대기업 퇴사 후 사업에 실패한 경험을 범행 동기로 털어놨다. 서울로봇고를 졸업하고 현대중공업에서 약 10년간 근무한 그는 회사를 그만두고 자영업을 시작했지만 경영난을 겪은 것으로 전해졌다. A씨는 \"러시아·우크라이나 전쟁 등으로 운영비가 올라 사업이 잘 되지 않았다\"며 \"좋은 직장을 그만두고 부모님께 실망스러운 모습을 보여드린 자신이 너무 싫었다\"고 밝혔다. A씨는 \"30대 초중반에 시험 준비를 시작하려니 너무 막막했다\"면서 \"수험 기간이 얼마나 길어질지 모른다는 공포감에 마음이 초조해졌다\"고 말했다. 이어 \"어리석게도 부정행위를 해서라도 합격이라는 결과로 부모님께 다시 한번 자랑이 되고 싶었다\"고 덧붙였다. A씨는 다른 수험생들에게 부정행위를 하지 말라고 당부했다. 그는 \"곧 있을 수능에서 혹시 저처럼 부정행위를 생각하시는 분들은 제가 수사기관에 모든 것을 이야기할 테니 '난 안 걸리겠지'라는 생각을 하지 않았으면 좋겠다\"고 말했다. [문재용 기자]","category":"IT 과학"},{"title":"세무사회 “AI 부정행위 합격자, 세무사 활동 못 하게 할 것”","link":"https://n.news.naver.com/mnews/article/666/0000132174","naverLink":"https://n.news.naver.com/mnews/article/666/0000132174","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"수습세무사 실무교육부터 AI 차단 평가시험 도입 국가전문자격시험 전수조사·한국산업인력공단 위탁관리 해지 촉구 경찰이 15일 제63회 세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자의 자수서를 접수하고 수사에 착수했다. 사진은 세무사 시험 수석 합격자 A씨. 유튜브 채널 ‘이돈호 변호사’ 갈무리 제63회 세무사 시험에서 인공지능(AI)을 활용한 부정행위를 저지른 수석 합격자에 대한 경찰 수사가 시작된 가운데, 한국세무사회는 부정행위로 합격한 이들이 세무사로 활동하지 못하도록 하겠다는 공식 입장을 내놨다. 한국세무사회는 15일 성명을 통해 “부정행위로 시험에 합격한 사실이 수사 과정에서 밝혀지지 않더라도 납세자의 권익을 책임지는 세무사로 활동할 수 없도록 하겠다”고 밝혔다. 이를 위해 조만간 진행하는 수습세무사 실무교육부터 AI를 사용할 수 없는 환경에서 교육생들의 실력을 검증하는 평가시험 체계를 도입하기로 했다. AI의 도움 없이 응시자 스스로 역량을 입증하도록 하겠다는 취지다. 세무사회는 이번 사건에 대해서도 강한 유감을 표했다. 세무사 시험이 전문자격사 시험 가운데 지원자와 응시자가 많은 시험인 만큼, 수석 합격자가 AI를 이용해 부정행위를 저질렀다는 사실에 회원들이 큰 충격을 받았다고 설명했다. 아울러 정부와 수사기관을 향해 시험 주관기관에 대한 철저한 진상조사와 부정행위 당사자 및 관련자에 대한 엄정한 수사를 촉구했다. 재발 방지를 위해 무관용 원칙에 따른 행정 제재와 처벌도 이뤄져야 한다고 강조했다. 이번 사건이 세무사 시험에만 국한된 문제가 아닐 수 있다는 점도 지적했다. 세무사회는 AI 기기를 이용한 부정행위가 다른 국가전문자격시험에서도 발생했을 가능성을 배제할 수 없다며 전체 시험 운영 실태를 전수조사하고 관리체계를 개선해야 한다고 요구했다. 시험 주관기관인 한국산업인력공단에 대한 위탁관리도 재검토해야 한다는 입장이다. 세무사회는 시험 관리의 취약성과 전문성 부족 등을 이유로 공단에 맡긴 세무사 시험 관리를 해지하고, 정부가 직접 시험을 주관하는 방안 등을 마련해야 한다고 촉구했다. 한국세무사회 홈페이지 갈무리","category":"IT 과학"},{"title":"SPAIN SOCCER","link":"https://n.news.naver.com/mnews/article/091/0010369729","naverLink":"https://n.news.naver.com/mnews/article/091/0010369729","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Tribute to late forward Jesus de Miguel ahead of CD Tenerife vs AD Ceuta match A fan stands in front of a mural depicting late CD Tenerife forward Jesus de Miguel at gate 9 of the Heliodoro Rodriguez Lopez stadium in Santa Cruz de Tenerife, Canary Islands, Spain, 15 November 2026. Tenerife returns to competition still grieving the death of their striker during their previous match against Andorra, hosting AD Ceuta in a LaLiga Hypermotion matchday 14 fixture. EPA/RAMON DE LA ROCHA","category":"IT 과학"},{"title":"SPAIN GENERAL ELECTION CAMPAIGN","link":"https://n.news.naver.com/mnews/article/091/0010369718","naverLink":"https://n.news.naver.com/mnews/article/091/0010369718","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Vox campaigns ahead of Spain's general election Spanish far-right party Vox leader Santiago Abascal takes part in an election campaign rally in Cornella de Llobregat, Spain, 15 November 2026. Spain's general election is scheduled for 29 November. EPA/ALBERTO ESTEVEZ","category":"IT 과학"},{"title":"SPAIN FREIGHT TRAIN DERAILMENT","link":"https://n.news.naver.com/mnews/article/091/0010369713","naverLink":"https://n.news.naver.com/mnews/article/091/0010369713","pubDate":"2026-11-15T12:00:00+09:00","author":"네이버뉴스","description":"Freight train derailment disrupts rail services near Madrid Workers operate at the scene of a freight train derailment between the Madrid towns of Robledo de Chavela and Zarzalejo, Spain, 15 November 2026. The derailment forced the closure of the Madrid-Avila rail line and left the train driver slightly injured. EPA/DANIEL GONZALEZ","category":"IT 과학"}]},"popular":[]}}}; // UPDATED_AUTOMATICALLY_BY_NEWS_WORKFLOW

function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}

function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));
  const part=k=>parts.find(p=>p.type===k)?.value||"";
  return part("year")+"-"+part("month")+"-"+part("day");
}

 const d=new Date(key+"T12:00:00+09:00");
 d.setDate(d.getDate()+offset);

}

  window.dailyDays=[data.days.today,data.days.yesterday,data.days.archive].filter(Boolean).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  drawDateTabs();
  items=window.dailyDays.flatMap(day=>Object.values(day.categories||{}).flat());
  render();
  const total=items.length;
  $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
