","author":"네이버뉴스","description":"재판소원·대법관 증원에…대법·헌재 내년 건물값만 최소 100억. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"복통에 구토·고열·혈변까지…응급실 찾아야 할 위험 신호","link":"https://n.news.naver.com/mnews/article/018/0006405446","naverLink":"https://n.news.naver.com/mnews/article/018/0006405446","pubDate":"2026-11-07T10:01:01.525164+09:00","author":"네이버뉴스","description":"소화불량부터 맹장염·담석·요로결석까지 원인 다양… 응급실 찾는 위험 신호 [이데일리 이순용 의학전문기자] 평소 건강했던 40대 직장인 A씨는 저녁 식사 후 갑자기 배가 아팠다. 과식 탓이라 생각해 소화제를 먹고 쉬었지만 통증은 가라앉지 않았고, 메스꺼움까지 겹치자 결국 응급실을 찾았다. 갑작스러운 복통이 생기면 대부분 소화불량부터 떠올린다. 실제로 과식이나 변비, 장염처럼 흔한 원인이 많지만 맹장염이나 담석, 요로결석처럼 서둘러 치료해야 하는 병의 신호일 수도 있다. 복통은 가볍게 시작했다가 빠르게 나빠지기도 하므로 참을 수 있느냐만으로 응급실 방문 여부를 판단해서는 안 된다. 급성 복통은 갑자기 생기거나 이전보다 뚜렷하게 심해지는 배의 통증이다. 위와 장뿐 아니라 쓸개, 췌장, 신장, 요로 등 여러 장기가 원인이 될 수 있다. 가장 흔한 원인은 소화불량과 위장염이지만 배가 심하게 부풀고 대변이나 방귀가 나오지 않는다면 장이 막히는 장폐색일 수 있어 확인이 필요하다. 또한 맹장염, 담석증, 요로결석도 흔한 원인이다. 맹장염은 배꼽 주변이나 가슴뼈 아래 오목한 명치에서 시작된 통증이 오른쪽 아랫배로 옮겨가는 것이 특징이다. 메스꺼움, 구토, 열이 함께 나타나며 치료가 늦어져 맹장이 터지면 배 속 전체에 염증이 퍼지는 복막염으로 이어질 수 있다. 담석증은 쓸개나 담도에 돌이 생기는 병으로 주로 명치나 오른쪽 윗배가 아프다. 기름진 음식을 먹은 뒤 통증이 생기거나 오른쪽 어깨와 등으로 퍼지기도 한다. 열과 오한에 더해 피부와 눈 흰자가 노랗게 변하는 황달까지 나타나면 염증이 생겼을 가능성이 있다. 요로결석은 옆구리에서 시작된 통증이 아랫배와 사타구니 쪽으로 이어지고 극심한 통증과 잠잠함이 반복된다. 소변에 피가 섞이기도 한다. 모든 복통에 응급실 진료가 필요한 것은 아니지만 다음과 같은 증상이 있다면 응급 상황일 수 있다. 참기 힘들 만큼 극심하거나 빠르게 심해지는 통증은 장기 염증이나 장에 구멍이 생기는 천공 등 긴급한 치료가 필요한 병일 수 있다. 피가 섞인 구토, 선홍색 혈변, 검고 끈적한 변은 소화기관 출혈의 신호이며, 어지럼증과 식은땀이 더해지면 더욱 위험하다. 구토가 반복되고 고열과 오한이 나타나거나 배가 부풀면서 대변과 방귀가 멈춘 경우에도 즉시 응급실에 가야 한다. 특히 기절, 의식 저하, 호흡곤란, 가슴 통증이 함께 나타나면 심장이나 혈관 등 다른 응급질환일 수 있다. 이때는 직접 운전하지 말고 11","category":"사건 사고"},{"title":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다","link":"https://n.news.naver.com/mnews/article/215/0001271980","naverLink":"https://n.news.naver.com/mnews/article/215/0001271980","pubDate":"2026-11-07T10:01:01.525160+09:00","author":"네이버뉴스","description":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"“사지 마” 입담에 인파 폭발… 경찰 출동한 ‘남대문 스카프’ 결국","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:01:01.525156+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:01:01.525140+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로","link":"https://n.news.naver.com/mnews/article/028/0002831127","naverLink":"https://n.news.naver.com/mnews/article/028/0002831127","pubDate":"2026-11-07T10:01:01.525138+09:00","author":"네이버뉴스","description":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:01:01.525134+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"김민석 사과하면 끝? '수사' 촉구하는 조선·중앙일보","link":"https://n.news.naver.com/mnews/article/006/0000138618","naverLink":"https://n.news.naver.com/mnews/article/006/0000138618","pubDate":"2026-11-07T10:01:01.525119+09:00","author":"네이버뉴스","description":"[AI 뉴스 브리핑] ▲김민석 더불어민주당 대표가 2026년 11월5일 당내 신천지 비밀연합 폭로를 두고 의총에서 증거가 없었다고 인정하고 비공개 사과한 것과 관련해 민티07에 출연해서도 당원여러분께 죄송하기도 하고 감사하기도 하다라고 사과하고 있다. 사진=민티07 영상 갈무리 김민석 더불어민주당 대표는 지난 8월 전당대회 때 경쟁 후보를 겨냥해 제기했던 신천지 관련 의혹에 증거가 없었다며 사과했다. 민주당은 자체 조사 보고서를 전면 공개하지 않고 당내 인사들이 제한적으로 열람하도록 했다. 보수언론에선 수사를 촉구했다. 6일 주요신문 사설을 정리했다. 민주당 신천지 의혹에 조사 결과 공개와 수사 요구 조선일보는 에서 김 대표의 의혹 제기와 조사 결과 비공개를 함께 문제 삼았다. \"김 대표가 전대 과정에서 신천지를 끼운 '3자 연합설'로 정치적 이득을 노렸다는 것은 부인하기 어렵다\"며 \"김 대표 스스로 허위사실을 공표했다고 자백한 셈인데 이런 식의 사과로 끝날 일인지 의문이다\"라고 했다. 이어 국민의힘 관련 신천지 의혹 수사와 비교했다. \"민주당 사정도 별반 다르지 않다는 소문이다. 전국동시지방선거가 있었던 2022년 이후 민주당에 입당한 신천지 신도가 적어도 2만~3만명이라고 한다\"고 전하면서 \"사실이라면 김 대표 말처럼 덮고 지나갈 일이 아니다\"라고 했다. 인용된 입당 규모는 사설에서 소문으로 제시한 수치다. 중앙일보도 에서 제한적 열람으로는 의혹을 해소하기 어렵다고 했다. \"조사 결과는 비공개로 묶은 채 관련 자료만 제한적으로 의원들에게 열람하게 하는 미봉책을 택했다\"며 \"뭔가 숨기는 게 있다는 의심만 짙어진다\"고 비판했다. 중앙일보는 국민의힘 관련 의혹에 검경 합동수사본부의 강제수사가 이뤄진 점을 들었다. \"민주당에도 같은 원칙과 잣대가 적용돼야 마땅하다\"며 \"민주당은 사안을 덮으려 하지 말고 수사기관에 정식 의뢰해 있는 그대로 진상을 밝혀야 한다\"고 촉구했다. 대통령 유튜브 방송에 소통 확대보다 경청 요구 이재명 대통령은 5일 개인 유튜브 채널을 통해 방송 '대통령의 Y'를 시작했다. 청와대는 2~3주 간격으로 방송을 이어가되 주요 현안이 생기면 횟수를 늘릴 수 있다고 밝혔다. 이 대통령은 첫 방송에서 사회관계망서비스(SNS) 등을 통한 직접 소통이 \"목숨줄 같은 존재\"라고 말했다. 세계일보는 에서 기존 SNS 활동에 유튜브 방송까지 더해지는 점을 우려했다. \"견제 없는 일방적 메시지 전달에 얼마나 많은","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:01:02.819038+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"젠슨 황에 접근한 중국 여성 기업인은 국가안전부 간첩","link":"https://n.news.naver.com/mnews/article/003/0014307502","naverLink":"https://n.news.naver.com/mnews/article/003/0014307502","pubDate":"2026-11-07T10:01:02.384306+09:00","author":"네이버뉴스","description":"엔비디아 첨단 반도체 중국 수출 유도에 역할? 국가안전부, 경제 지배 위해 기술 획득 전투 [베이징=뉴시스]중국 국가안전부.(사진=바이두 갈무리) *DB 및","category":"사회"},{"title":"헤그세스 美국방, 탄핵 압박에 반발…\"국방예산 475조 증액헤야\"","link":"https://n.news.naver.com/mnews/article/003/0014305667","naverLink":"https://n.news.naver.com/mnews/article/003/0014305667","pubDate":"2026-11-07T10:01:02.384202+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 트럼프 행정부의 인사 책임론과 고위 인사의 거취를 둘러싼 관측이 나왔다.\n정치권에서 여러 가능성이 거론되고 있지만 공식적으로 확정된 인사 변화와는 구분할 필요가 있다.\n행정부 내부의 후속 대응이 주목된다.","category":"사회"},{"title":"\"물린 거 탈출하게 해주세요\" 삼성전자 차트 앞에서 108배…폭락장에 뜬 온라인 '가즈아법당'","link":"https://n.news.naver.com/mnews/article/014/0005600746","naverLink":"https://n.news.naver.com/mnews/article/014/0005600746","pubDate":"2026-11-07T10:01:01.525194+09:00","author":"네이버뉴스","description":"코스피 서킷브레이커 발동한 6일 온라인서 확산 손절 작두·참회실·존버 동굴 등 투자자 심리 반영 가즈아법당 내 삼성전자 기도실 풍경. /사진=가즈아법당 캡처 [파이낸셜뉴스] 코스피가 장중 8% 넘게 급락한 가운데 불상 대신 주식 시세 차트를 걸어두고 주가 상승을 비는 온라인 법당이 개인투자자들 사이에서 확산하고 있다. 6일 온라인 커뮤니티와 사회관계망서비스(SNS)를 중심으로 '가즈아법당' 사이트가 인기를 끌고 있다. 이 사이트는 개발자 엄진섭씨가 지난달 30일 공개한 웹 서비스다. 투자자들이 쓰는 '가즈아'라는 표현에 법당을 결합했으며, 앞서 화제가 된 가상 사찰 서비스에서 착안해 만든 것으로 알려졌다. 이용자는 접속 후 동자승 캐릭터로 가상 법당을 돌아다닌다. 법당에는 삼성전자, SK하이닉스, 비트코인 등 종목별 기도실이 있고, 불상 자리에는 시세 차트가 걸려 있다. '상승기원 절하기'를 누르면 캐릭터가 빨간색 승복을, 하락을 기원하면 파란색 승복을 입고 절을 한다. '굿하기' 버튼과 투자 소망을 적는 소원등도 있다. 투자자 심리를 반영한 공간도 마련됐다. '손절 작두'는 팔고 싶은 종목명을 입력하면 작두가 이를 자르는 장면을 보여준다. '참회실'에서는 이용자가 손실 경험을 올리면 다른 이용자가 합장하거나 위로를 남길 수 있다. '존버 동굴'은 캐릭터를 앉혀두면 1분마다 수행 시간이 쌓인다. 이 밖에 수익과 손실을 영정에 올리는 '분향소', 추가 매수를 빗댄 '물타기 우물' 등이 있다. 사이트가 확산한 이날 증시는 개장과 동시에 급락했다. 한국거래소에 따르면 코스피는 개장 3분여 만에 5000선 아래로 내려갔고 1단계 서킷브레이커가 발동됐다. 발동 당시 지수는 전 거래일보다 8.52% 내린 4924.61이었다.","category":"사회"},{"title":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장","link":"https://n.news.naver.com/mnews/article/015/0005351350","naverLink":"https://n.news.naver.com/mnews/article/015/0005351350","pubDate":"2026-11-07T10:01:01.525192+09:00","author":"네이버뉴스","description":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"외국인, 2030 몰리며 경복궁이 다시 뜬다… ‘제2 성수’ 북촌·서촌","link":"https://n.news.naver.com/mnews/article/037/0000039107","naverLink":"https://n.news.naver.com/mnews/article/037/0000039107","pubDate":"2026-11-07T10:01:01.525189+09:00","author":"네이버뉴스","description":"외국인, 2030 몰리며 경복궁이 다시 뜬다… ‘제2 성수’ 북촌·서촌. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[르포]\"러시아어로 밥 먹고, 친구도 만나요\"…한국 속 또 다른 고향","link":"https://n.news.naver.com/mnews/article/008/0005437900","naverLink":"https://n.news.naver.com/mnews/article/008/0005437900","pubDate":"2026-11-07T10:01:01.525183+09:00","author":"네이버뉴스","description":"[르포]\"러시아어로 밥 먹고, 친구도 만나요\"…한국 속 또 다른 고향. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:01:01.525179+09:00","author":"네이버뉴스","description":"[김형자 과학칼럼니스트 sisa@sisajournal.com] 안경테에 내장된 카메라로 문제 촬영, AI가 분석해 렌즈에 정답 띄워 신종 부정행위 도구로 악용되는 스마트 기기…당국 '엄벌' 경고 속 대응 고심 시험지를 바라보는 수험생. 안경테에 숨겨진 카메라가 문제를 촬영하고, 인공지능(AI)이 순식간에 답을 찾아낸다. 정답은 안경을 쓴 사람만 볼 수 있는 작은 화면에 나타난다. 겉보기엔 평범한 안경이지만, 실제로는 AI가 대신 문제를 풀고 있는 셈이다. 11월19일 치러지는 2027학년도 대학수학능력시험(수능)을 앞두고 교육 현장에 비상이 걸렸다. 최근 연세대와 서울시립대 논술시험장에서 AI 스마트 안경(AI 안경)을 이용한 부정행위가 잇따라 적발된 데 이어 올해 국가자격시험에서도 5건의 부정행위가 확인됐기 때문이다. 첨단 기술이 가져온 편리함이 이제는 시험의 공정성을 흔드는 새로운 변수로 떠올랐다. ⓒChatGPT 생성이미지 일반 안경으로 위장한 'AI 기기' 식별법은 수능 출제기관인 한국교육과정평가원(평가원)과 교육부는 2027학년도 수능부터 AI 안경을 반입 금지 물품으로 지정하고 강력한 제재 방침을 내놨다. AI 안경을 이용해 부정행위를 한 수험생은 형사고발하거나 수사를 의뢰하는 등 엄정하게 대응한다는 계획이다. 시험 중 착용은 물론 가방 등에 소지하는 것만으로도 해당 시험이 무효 처리되고, 다음 해 응시 자격도 정지된다. 현재 1년인 응시 자격 정지 기간을 최대 3년으로 확대하는 방안도 추진 중이다. 나아가 논술·면접 등 대학별 고사에서도 강화된 제재 방침을 적용할 수 있도록 각 대학에 권고하기로 했다. 문제는 AI 스마트 안경이 일반 안경과 외형상 큰 차이가 없어 현장에서 쉽게 식별하기 어렵다는 점이다. 그렇다면 시험장에서는 과연 어떤 단서로 이 위험한 기기를 가려내야 할까. AI 안경은 일반 안경에 인공지능 기능을 결합한 웨어러블 기기다. 안경테 안에는 카메라와 마이크, 소형 스피커 등이 탑재돼 있고, 일부 제품은 렌즈에 작은 화면을 띄우는 디스플레이까지 갖추고 있다. 작동 방식은 크게 세 단계로 나뉜다. 먼저 안경에 달린 카메라가 사용자의 바라보는 풍경이나 사물을 촬영하고, 마이크는 사용자의 음성과 주변 소리를 수집한다. 이렇게 모아진 정보는 스마트폰이나 인터넷을 거쳐 AI에 전달된다. 그러면 마지막으로 AI가 이미지와 음성을 분석해 사물을 식별하거나 사용자의 질문에 답한다. 분석 결과는 소형","category":"사회"},{"title":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]","link":"https://n.news.naver.com/mnews/article/011/0004679681","naverLink":"https://n.news.naver.com/mnews/article/011/0004679681","pubDate":"2026-11-07T10:01:01.525173+09:00","author":"네이버뉴스","description":"“안녕, 또 봐”…27살 자폐 아들 두고 떠난 ‘피터팬 아빠’ 마지막 소원은 [김수호의 리캐스트]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"이용철 법무부 장관 후보자 \"검찰 개혁 차질없이 완수\"","link":"https://n.news.naver.com/mnews/article/214/0001534012","naverLink":"https://n.news.naver.com/mnews/article/214/0001534012","pubDate":"2026-11-07T10:01:01.525109+09:00","author":"네이버뉴스","description":"이용철 법무부 장관 후보자가 검찰 개혁을 차질 없이 추진하겠다는 입장을 밝혔다.\n후보자의 발언을 통해 향후 검찰 제도와 수사 체계 개편 방향이 다시 주목받고 있다.\n구체적인 정책은 인사청문과 후속 발표에서 확인될 전망이다.","category":"사회"}],"생활":[{"title":"“가을 어디 갔어?”…주말 아침 영하 6도, 칼바람까지 [날씨]","link":"https://n.news.naver.com/mnews/article/666/0000130976","naverLink":"https://n.news.naver.com/mnews/article/666/0000130976","pubDate":"2026-11-07T10:01:03.236428+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활"},{"title":"“목구멍까지 타는 통증”…의사들이 꼽은 ‘역류성 식도염’에 좋은 음식 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107010","naverLink":"https://n.news.naver.com/mnews/article/296/0000107010","pubDate":"2026-11-07T10:01:03.236417+09:00","author":"네이버뉴스","description":"오트밀은 위산으로 인한 통증을 줄이는 데 도움이 된다. 사진=게티이미지뱅크 식사 후 속이 쓰리거나 목구멍이 타는 듯한 통증을 한 번쯤 경험해 본 사람들이 많다. 이런 증상을 일으키는 위염이나 역류성 식도염은 방치될 경우 일상을 순식간에 무너뜨릴 수 있다. 위산이 식도를 타고 역류하면서 생기는 불편함은 몇 시간 동안 지속되고 만성화 되면 삶의 질을 크게 떨어뜨릴 수 있다. 루시아나 소아레스 미국 존슨앤웨일즈대 영양학과의 교수는 \"위산 역류를 겪는 사람에게는 저지방, 저산성, 고섬유질 식단이 기본\"이라며 \"과식은 위 내부 압력을 높여 증상을 악화시키므로 적은 양을 나누어 섭취하는 습관이 필요하다\"고 설명한다. 미국 매체 허프포스트(HuffPost)에 소개된 의료 전문가들의 조언을 바탕으로, 위산 역류를 완화하고 예방하는 데 도움을 주는 식품 6가지를 정리했다. 오트밀 소화기내과 전문의들이 위산 역류 예방식으로 가장 먼저 추천하는 식품은 가공을 최소화한 전통 방식의 오트밀이다. 엑타 굽타 메릴랜드대 의대 교수는 \"오트밀에 풍부한 수용성 섬유질은 기름진 식사나 빵류와 달리 소화기관에 부담을 주지 않고 부드럽게 소화된다\"고 말한다. 흔히 오트밀이 위산을 흡수한다는 속설이 있지만 이는 사실과 다르다. 굽타 교수는 \"식단의 목표는 산을 흡수하는 것이 아니라 애초에 과도한 산 분비를 유발하지 않는 데 있다\"며 \"섬유질이 원활한 배변을 도와 복압 상승으로 인한 역류를 방지해 주는 것이 핵심\"이라고 덧붙였다. 맑은 뼈 육수 뼈를 고아 낸 맑은 육수는 속을 편안하게 감싸면서도 영양을 채워주는 훌륭한 선택지다. 대릴 지오프레 영양학 박사는 \"따뜻한 육수는 과식하지 않아도 충분한 포만감과 영양을 제공해 소화기 부담을 던다\"고 전했다. 다만 지방이 과도하면 오히려 하부식도괄약근을 느슨하게 할 수 있으므로 기름기를 걷어낸 육수를 골라야 한다. 특히 뼈 육수에 풍부한 글리신, 프롤린, 글루타민 등 아미노산 성분은 자극받은 식도와 장 점막을 진정시키고 장벽을 강화하는 데 도움이 된다. 채소 위주의 녹즙 수분이 많고 산도가 낮은 잎채소로 만든 녹즙도 속쓰림 완화에 효과적이다. 오이, 셀러리, 시금치처럼 자극이 적은 채소를 착즙해 마시는 방식이 권장된다. 이들 채소에 풍부한 마그네슘은 소화기 전반의 근육과 신경이 정상적으로 기능하도록 돕고, 위 내용물이 위로 역류하지 않도록 조여주는 괄약근 유지에도 필수적이다. 단, 맛을 내기 위해 레몬, 라임","category":"생활"},{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T10:01:03.236405+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 운동 부족이 아니라 부모에게 물려받은 유전적 요인 때문일 수 있다. 문제는 별다른 증상 없이 지내다가 젊은 나이에 심근경색이나 뇌졸중 같은 심각한 질환을 겪을 수 있다는 점이다. 미국의사협회가 발행하는 국제학술지 《미국의사협회지(JAMA)》는 5일(현지시간) 공개한 '환자 교육자료'에서 가족성 고콜레스테롤혈증(Familial Hypercholesterolemia·FH)의 위험성을 소개하고 조기 진단과 치료의 중요성을 강조했다. 가족성 고콜레스테롤혈증은 혈액 속 콜레스테롤을 처리하는 유전자에 이상이 생겨 저밀도 지질단백질(LDL) 콜레스테롤 수치가 비정상적으로 높아지는 유전질환이다. LDL은 흔히 '나쁜 콜레스테롤'로 불리며, 혈관 벽에 쌓이면 동맥경화를 일으켜 심근경색이나 뇌졸중 위험을 높인다. 증상 없어도 위험⋯50세까지 남성 절반 관상동맥질환 JAMA에 따르면 부모 중 한쪽에서 관련 유전자 변이를 물려받는 이형접합 가족성 고콜레스테롤혈증은 전 세계적으로 약 250~350명 중 1명꼴로 발생한다. 부모 양쪽에서 변이를 물려받는 동형접합형은 16만~50만 명 중 1명꼴로 드물지만, LDL 콜레스테롤 수치가 400~1200mg/dL에 이를 정도로 심각한 경우가 많다. 가족성 고콜레스테롤혈증의 가장 큰 문제는 대부분 뚜렷한 증상이 없다는 것이다. 혈중 콜레스테롤 수치가 높아도 일상생활에서 특별한 이상을 느끼지 못해 질환을 발견하지 못하는 경우가 있다. 그러나 치료하지 않으면 심각한 심혈관질환으로 이어질 수 있다. JAMA는 치료받지 않은 이형접합 가족성 고콜레스테롤혈증 환자의 경우 남성은 50세까지 약 절반, 여성은 60세까지 약 3분의 1이 치명적이거나 비치명적인 관상동맥질환을 경험한다고 설명했다. 미국 질병통제예방센터(CDC) 역시 가족성 고콜레스테롤혈증을 조기에 발견하고 치료하면 관상동맥질환 위험을 약 80%까지 줄일 수 있다고 안내하고 있다. 미국 질병통제","category":"문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:01:03.236341+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"문화"},{"title":"사람이 미워져도, 몸이 쇠약해져도, 술이 계속 당겨도 ‘뛰어’ 넘어봐[책의 향기]","link":"https://n.news.naver.com/mnews/article/020/0003760742","naverLink":"https://n.news.naver.com/mnews/article/020/0003760742","pubDate":"2026-11-07T10:01:03.236335+09:00","author":"네이버뉴스","description":"미국 잡지 편집장 출신 저자 ‘알코올의존증’ 아버지 보며 다르게 살고싶어 러닝 택해 정신-신체적 한계 찾아와도, 버텨낼 수 있는 힘 길러줘 ◇브라보, 나의 달리기/니컬러스 톰프슨 지음/홍은택 옮김/340쪽·1만9800원·윌북 인간의 한계에 도전하는 마라톤은 다양한 사연을 가진 사람들이 자신의 한계를 극복하기 위해 뛰어드는 장이기도 하다. 저자는 달리기를 통해 나이 듦에 대한 공포를 길 위를 달리며 익힌 자기 확신으로 극복해 나갈 수 있었다고 말한다. 게티이미지뱅크·챗GPT","category":"문화"},{"title":"예술인 공제사업 시작…첫 상품 ‘예술현장 안심공제’ 출시","link":"https://n.news.naver.com/mnews/article/011/0004679663","naverLink":"https://n.news.naver.com/mnews/article/011/0004679663","pubDate":"2026-11-07T10:01:03.236325+09:00","author":"네이버뉴스","description":"예술인 공제사업 시작…첫 상품 ‘예술현장 안심공제’ 출시. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:01:03.236319+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"문화"},{"title":"영화 '호프' 속 외계어처럼 세상에 없던 언어…인공어의 세계","link":"https://n.news.naver.com/mnews/article/584/0000040037","naverLink":"https://n.news.naver.com/mnews/article/584/0000040037","pubDate":"2026-11-07T10:01:02.819001+09:00","author":"네이버뉴스","description":"인공어는 쉽게 말해 ‘자연어’가 아닌 언어다. 특정한 목적을 가지고 인위적으로 만든 언어가 바로 인공어이며, 대표적인 사례가 '에스페란토'다. 과학동아 제공 지난 7월, 예상을 뒤엎은 전개로 극장가를 흔든 영화 ‘호프’가 개봉됐다. 영화를 보면, 우리에게 친숙한 한국어가 나오다가 어느 순간 외계인의 입에서 처음 듣는 낯선 말이 흘러나온다. 그런데 이 말은 그저 괴상한 울음소리가 아니다. 세상에 없던, 영화를 위해 언어학자들이 새롭게 창조한 인공어다. ● 세상에 없던 언어, 영화관에서 울리다 “하스 너초스타사 세샬 에히레림 게르투야 리나미.” 나홍진 감독의 영화 ‘호프’에 나오는 외계어다. 영화 내내 한국어가 나오다가 외계어가 나오는 대목에서 관객들은 숨을 죽인 채 낯선 분위기를 느낀다. 그들이 쓰는 말은 세상에 없던 언어, 인공어다. 인공어는 쉽게 말해 ‘자연어’가 아닌 언어다. 각 나라 사람들이 쓰는 자연어는 오랜 기간에 걸쳐 사람들이 상호작용하면서 형성됐다. 반면 인공어는 특정한 목적을 가지고 인위적으로 만든 언어다. 대표적인 사례가 ‘에스페란토’다. 폴란드 안과 의사 루도비코 자멘호프는 특정 강대국의 언어가 아닌, 차별 없이 모두가 쉽게 배울 수 있는 ‘평등한’ 국제 공용어로서 1887년 에스페란토를 창안했다. 에스페란토는 문법에 예외를 두지 않고, 기본 단어 앞뒤로 접두사나 접미사를 붙여 단어를 파생시키므로 자연어에 비해 빠르게 습득할 수 있다. 예술 창작의 의도로 만들어진 인공어도 있다. 영문학자였던 J. R. R. 톨킨은 소설 ‘반지의 제왕’ 속 요정들이 쓰는 언어를 창조해 인공어 창작 분야를 활성화시켰다. 1954년 반지의 제왕 첫 권 발표 전 인공어는 소통이 목적이었다면, 이후로는 반지의 제왕 팬들이 세계관의 미학, 문화적 깊이를 위해 쓰며 ‘예술어’로서 크게 대중화됐다. 영화 ‘호프’에도 언어학자들이 창조한 인공어가 나왔다. “관객들이 들었을 때 느끼는 감정에 집중해 만든 인공어예요.” 9월 1일 만난 제임스 황, 정선우 서울대 언어학과 교수가 영화 ‘호프’에 나오는 외계인들의 인공어에 관해 설명했다. 황 교수와 정 교수는 함께 ‘호프’의 외계어를 설계했다. 외계어의 이름은 ‘네히네치’다. 지난 7월, 예상을 뒤엎은 전개로 극장가를 흔든 영화 ‘호프’가 개봉됐다. 영화를 보면, 우리에게 친숙한 한국어가 나오다가 어느 순간 외계인의 입에서 처음 듣는 낯선 말이 흘러나온다. 그런데 이 말은 그저 괴","category":"문화"},{"title":"밤새 AI와 씨름한 대학생들…24시간 만에 게임 뚝딱[가보니]","link":"https://n.news.naver.com/mnews/article/001/0016427632","naverLink":"https://n.news.naver.com/mnews/article/001/0016427632","pubDate":"2026-11-07T10:01:02.818970+09:00","author":"네이버뉴스","description":"게임인재원 AI 해커톤에 대학생 70여명 참가…무박 2일 개발 경쟁 생성형 AI로 3D 모델·애니메이션 제작…게임 개발 문턱 낮아져 게임인재원 AI 해커톤 [촬영 김주환] (성남=연합뉴스) 김주환 기자 = \"10분 후 제출입니다. 이제 작업을 마무리하고 최종 결과물을 천천히 업로드해 주세요\" 6일 오전, 국내 중소 게임·IT 업체들이 모인 판교창조경제밸리의 한 콘퍼런스룸 안에 모인 청년들이 분주하게 움직이기 시작했다. 한국콘텐츠진흥원 산하 개발자 양성 기관 게임인재원은 6일 경기 성남시 나인트리 바이 파르나스 서울 판교에서 무박2일 AI 해커톤(개발 경진대회)을 열었다. 낮 최고기온이 8∼9도까지 떨어진 서늘한 늦가을 날씨였지만, 해커톤이 열리는 행사장 안은 테이블마다 놓인 개발용 노트북과 옹기종기 모여 앉은 대학생들이 내뿜는 열기로 후끈 달아올랐다. 행사에 3∼4명씩 팀을 이뤄 참가한 국내 대학생 70여명은 지난 5일 정오부터 이날까지 주어진 24시간 동안 제작한 게임을 제출하고 심사위원단 앞에서 시연했다. 무박 2일로 게임을 개발한 학생들은 마감 기한을 앞두고 졸린 기색이 역력했다. 하지만 마지막 순간까지도 생성형 AI와 유니티(Unity)·고도(Godot) 같은 게임 엔진을 붙잡고 결과물을 개선하고자 머리를 맞댔다. 게임 주제는 '고정관념과 장벽 깨기'·'플레이의 문 넓히기'·'다른 시선 플레이하기'·'현실을 게임으로 풀기' 등 공익적인 내용으로 구성됐다. 게임인재원 AI 해커톤에 출품된 게임 [촬영 김주환]","category":"문화"},{"title":"머스크, 태극기 사진 올리며 \"테슬라 코리아\"…무슨 일이","link":"https://n.news.naver.com/mnews/article/015/0005351322","naverLink":"https://n.news.naver.com/mnews/article/015/0005351322","pubDate":"2026-11-07T10:01:02.384227+09:00","author":"네이버뉴스","description":"일론 머스크가 태극기 이미지를 공개해 게시 배경에 관심이 모였다.\n온라인에서는 한국과 관련한 메시지인지 여러 해석이 나왔지만, 게시 의도는 맥락을 확인할 필요가 있다.\n글로벌 유명 인사의 짧은 게시물이 국내에서도 화제가 된 사례다.","category":"문화"}],"세계":[{"title":"선거참패 1호 희생양?…'얼음아가씨' 백악관 첫 女비서실장 퇴장(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427624","naverLink":"https://n.news.naver.com/mnews/article/001/0016427624","pubDate":"2026-11-07T10:01:02.384317+09:00","author":"네이버뉴스","description":"선거참패 1호 희생양?…'얼음아가씨' 백악관 첫 女비서실장 퇴장(종합). 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다","link":"https://n.news.naver.com/mnews/article/011/0004679676","naverLink":"https://n.news.naver.com/mnews/article/011/0004679676","pubDate":"2026-11-07T10:01:02.384313+09:00","author":"네이버뉴스","description":"챗GPT로 가뿐하게 숙제 끝? “이젠 안 통해”…미국 교사들 ‘최후의 카드’ 꺼냈다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"참패 희생양 된 ‘얼음 아가씨’…트럼프, 비서실장에 강경파 밀러","link":"https://n.news.naver.com/mnews/article/025/0003563470","naverLink":"https://n.news.naver.com/mnews/article/025/0003563470","pubDate":"2026-11-07T10:01:02.384304+09:00","author":"네이버뉴스","description":"새 백악관 비서실장에 임명된 된 스티븐 밀러가 6일(현지시간) 워싱턴 DC 백악관 남쪽 잔디밭에서 나탈리 하프 백악관 보좌관과 함께 대통령 전용 헬기 ‘마린 원’에 탑승하기 위해 걸어가고 있다. AFP=연합뉴스 도널드 트럼프 미국 대통령이 중간선거 패배 사흘 만인 6일(현지시간) 새 백악관 비서실장에 스티븐 밀러(41) 부비서실장을 임명했다. 선거 패배 이후 백악관 내각 첫 교체 인사다. 트럼프 대통령은 이날 소셜미디어 트루스소셜을 통해 백악관 첫 여성 비서실장인 와일스 실장이 “트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라고 발표했다. 트럼프는 이후 백악관에서 기자들과 만나 “변화를 주고 싶었다”며 이번 인사가 중간선거 결과에 따른 인적 개편임을 시사했다. ‘얼음 아가씨’로 불리는 와일스는 대선 전부터 트럼프의 두터운 신임을 받아왔다. 하지만 트럼프 대통령은 선거 기간 와일스 실장의 교체설이 나돌자 “나는 전적으로 와일스를 신뢰한다”고 선을 그었으나, 예상보다 처참한 중간선거 성적표를 받아들고 와일스 실장을 희생양 삼아 사실상 경질한 것 아니냐는 분석이다. 밀러 실장은 이날 X를 통해 “지금 우리의 사명은 어느 때보다 분명하다”며 “온 마음을 다해 대통령을 지지하고 위대한 공화국을 지키기 위해 싸워야 한다”고 소감을 밝혔다. 그러면서 비서실장으로 임명된 것을 영광으로 생각한다고 했다. 그는 트럼프 대통령에 대해 “미 역사상 가장 획기적인 변화를 이끌어낸 정치 지도자”라며 “미국을 파괴하려는 세력들로부터 홀로 미국을 구해냈다”고 극찬했다. 지난 9월 22일(현지시간) 미국 뉴욕 유엔본부에서 열린 제81차 유엔총회 계기 도널드 트럼프 미국 대통령과 앤디 버넘 영국 총리의 양자 회담에 참석한 수지 와일스 백악관 비서실장(왼쪽)과 스티븐 밀러 백악관 부비서실장. AFP=연합뉴스","category":"세계"},{"title":"트럼프, 비서실장 전격 교체…‘강경 충성파’ 스티븐 밀러 임명","link":"https://n.news.naver.com/mnews/article/119/0003152405","naverLink":"https://n.news.naver.com/mnews/article/119/0003152405","pubDate":"2026-11-07T10:01:02.384302+09:00","author":"네이버뉴스","description":"트럼프, 비서실장 전격 교체…‘강경 충성파’ 스티븐 밀러 임명. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:01:02.384300+09:00","author":"네이버뉴스","description":"이란, 거부해 온 핵 활동 협상 검토 중. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"선거 참패로 ‘겨울왕국’ 된 백악관, ‘얼음 아가씨’도 떠난다 [이 사람@World]","link":"https://n.news.naver.com/mnews/article/022/0004173207","naverLink":"https://n.news.naver.com/mnews/article/022/0004173207","pubDate":"2026-11-07T10:01:02.384298+09:00","author":"네이버뉴스","description":"수지 와일스 백악관 비서실장 1호 ‘경질’ 2024년 트럼프 대선 승리 당시 1등 공신 與 중간선거 참패에 더는 못 버티고 퇴장 미국 11·3 중간선거에서 여당인 공화당이 기록적 패배를 당한 뒤 백악관은 ‘겨울왕국’처럼 썰렁해졌다. 냉철하고 치밀한 성품 때문에 도널드 트럼프 대통령으로부터 ‘얼음 아가씨’(ice baby)란 별명을 얻은 비서실장은 가장 먼저 짐을 싸 백악관을 떠나는 신세가 됐다. 수지 와일스 미국 대통령 비서실장이 11·3 중간선거 직전인 지난 10월 초 혼자 깊은 생각에 잠겨 백악관 경내를 걷고 있다. 도널드 트럼프 대통령은 6일(현지시간) 중간선거 패배 책임을 물어 와일스를 경질했다. AFP연합뉴스 트럼프는 6일(현지시간) 사회관계망서비스(SNS)를 통해 백악관 비서실장 교체를 알렸다. 현재 비서실의 ‘2인자’인 스티븐 밀러(41) 부실장이 오는 9일부터 비서실장을 맡고, 수지 와일스(69) 현 비서실장은 물러난다는 것이다. 와일스가 공화당의 중간선거 패배 후 책임을 지고 사의를 밝힌 만큼 경질 인사로 풀이된다. 다만 트럼프는 와일스를 최대한 배려하는 태도를 취했다. 그는 SNS 글에서 와일스를 향해 “비서실장으로서의 봉사에 감사드린다”며 “정말 훌륭한 일을 해주셨다”고 찬사를 바쳤다. 그러면서 와일스가 완전히 자신의 곁을 떠나는 것은 아니며 ‘트럼프 정치 조직’(Trump Political Operation)으로 옮길 예정이라고 설명했다. 이는 와일스가 트럼프 개인의 사조직 운영에 관여하게 될 것이란 의미로 해석된다. 트럼프는 향후 정치적 영향력 유지, 정치자금 모금, 이른바 ‘마가’(MAGA·미국을 더 위대하게) 메시지 관리 등을 담당할 사조직을 재정비하고 있는 것으로 알려졌다. 와일스는 2024년 11월 대선에서 트럼프가 현직 부통령인 민주당 카멀라 해리스 후보를 상대로 예상 밖의 압승을 거두며 비로소 세상에 이름을 알렸다. 선거 직후 승리를 자축하는 연설을 하던 트럼프가 갑자기 “수지. 이리 와요. 이리 오라고”라며 그를 연단으로 불러냈다. 대선 기간 와일스는 트럼프 선거 캠프의 공동 위원장을 맡았다. 트럼프는 와일스를 ‘얼음 아가씨’라고 부르며 “뒤에 있는 걸 좋아하는데, 뒤에 있을 사람은 아니다”라는 의미심장한 발언을 했다. 그로부터 얼마 뒤 와일스는 트럼프 2기 행정부의 첫 백악관 비서실장으로 전격 발탁됐다. 미국 역사상 백악관 비서실장에 여성이 임명된 사례는 와일스가 최초다.","category":"세계"},{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:01:02.384294+09:00","author":"네이버뉴스","description":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"미국에 공장 안 지으면 관세 300%\"...트럼프 선거 참패에도 고집","link":"https://n.news.naver.com/mnews/article/008/0005437536","naverLink":"https://n.news.naver.com/mnews/article/008/0005437536","pubDate":"2026-11-07T10:01:02.384234+09:00","author":"네이버뉴스","description":"\"미국에 공장 안 지으면 관세 300%\"...트럼프 선거 참패에도 고집. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, ‘마가 핵심’ 밀러로 비서실장 전격 교체…반이민 강경파","link":"https://n.news.naver.com/mnews/article/028/0002831120","naverLink":"https://n.news.naver.com/mnews/article/028/0002831120","pubDate":"2026-11-07T10:01:02.384224+09:00","author":"네이버뉴스","description":"트럼프, ‘마가 핵심’ 밀러로 비서실장 전격 교체…반이민 강경파. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:01:01.525125+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"[인터뷰] 부천 공장에 1조4000억원 투자한 美 온세미… 하산 엘 코우리 CEO “AI 시대 전력반도체 중요성 커져”","link":"https://n.news.naver.com/mnews/article/366/0001203195","naverLink":"https://n.news.naver.com/mnews/article/366/0001203195","pubDate":"2026-11-07T10:01:02.819050+09:00","author":"네이버뉴스","description":"“한국, 기술·제조·대규모 생산 갖춘 반도체 생태계” “부천 공장, SiC 공급 규모·품질·안정성 확보에 기여” “AI 데이터센터 전력 효율이 경쟁력… 모든 와트가 중요” “부천 공장은 온세미의 글로벌 실리콘카바이드(SiC) 전략에서 핵심적인 역할을 한다. 전력반도체 수요가 늘어나는 가운데 생산 규모와 품질, 안정적인 공급 능력을 갖추는 데 중요한 거점이다.” 하산 엘 코우리(Hassane El-Khoury) 온세미 회장 겸 최고경영자(CEO)는 지난달 11일 조선비즈와의 서면 인터뷰에서 이렇게 말했다. 미국 전력반도체 기업 온세미는 전기차와 산업용 설비 등에 쓰이는 전력반도체와 센싱 기술을 주력으로 한다. SiC는 높은 전압과 전력을 효율적으로 처리할 수 있는 차세대 전력반도체 소재다. 엘 코우리 CEO는 인공지능(AI) 데이터센터와 전기차 시장에서 전력 효율의 중요성이 커지면서 반도체 생산 능력과 안정적인 공급망이 기업의 경쟁력을 좌우할 것으로 내다봤다. 엘 코우리 CEO는 자동차 부품업체 콘티넨탈에서 엔지니어로 경력을 시작해 사이프러스반도체 CEO를 역임했으며, 2020년 12월 온세미 CEO로 취임했다. 하산 엘 코우리 온세미 회장 겸 최고경영자(CEO). /온세미 제공 부천 공장은 과거 삼성전자의 전력반도체 생산시설로, 1999년 페어차일드에 매각됐다가 2016년 온세미의 페어차일드 인수로 온세미 생산기지에 편입됐다. 온세미는 2018년부터 부천에서 SiC 전력반도체를 생산했으며, 2023년에는 약 1조4000억원을 투자한 SiC 생산시설 확충 사업을 완료했다. 당시 회사는 신규 생산라인이 완전 가동되면 연간 100만장 이상의 200㎜(8인치) SiC 웨이퍼를 생산할 수 있다고 밝혔다. 온세미는 1999년 모토로라의 반도체 사업부에서 분사해 설립됐다. 2016년 페어차일드반도체를 인수하며 사업을 확대했고, 2021년 기존 온세미컨덕터에서 온세미로 사명을 변경했다. 올해 2분기 매출은 16억400만달러(약 2조2000억원)로 전년 동기 대비 9% 증가했다. 영업이익률은 미국 일반회계기준(GAAP) 16.1%를 기록했다. 회사는 AI 데이터센터를 가장 빠르게 성장하는 사업으로 꼽으며 올해 관련 매출이 전년 대비 두 배 이상 늘어날 것으로 전망했다. 엘 코우리 CEO는 “한국은 기술력과 제조 능력, 대규모 생산 능력을 모두 갖춘 나라”라며 “이 세 가지를 동시에 갖춘 반도체 생태계는 세계적으로도 드물다”고","category":"IT 과학"},{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:01:02.819046+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:01:02.819044+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:01:02.819042+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:01:02.819040+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:01:02.819036+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"AI주 투매 하루 만에 반등한 나스닥…AI 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:01:02.819034+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:01:02.819030+09:00","author":"네이버뉴스","description":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:01:02.819020+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:01:02.819015+09:00","author":"네이버뉴스","description":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"}]},"popular":[{"title":"[����] �ƹ����� �� ��� \"�ؿܿ�\"������ �ֹε��� ��϶��","link":"https://n.news.naver.com/article/437/0000519573?ntype=RANKING","pubDate":"2026-11-07T10:01:04.019571+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"���� ���� ���길, Ʈ���� ��ǰ� �񼭽��� ��ü...���� ���Ͻ� ������ ��Ƽ�� �з�","link":"https://n.news.naver.com/article/437/0000519597?ntype=RANKING","pubDate":"2026-11-07T10:01:04.019595+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"[����ī�޶�] ����� ������ �� '��Ʈ'������ε��� ����?","link":"https://n.news.naver.com/article/437/0000519581?ntype=RANKING","pubDate":"2026-11-07T10:01:04.019603+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":3},{"title":"��������, �ݵ�ü�� �߽� ���� �ż��� �������� �ݵ������ 1.1%�ö�","link":"https://n.news.naver.c 으로 답했다. 월스트리트저널(WSJ)은 지난 2일 ‘영국은 종말에 대비하는데, 지도자들은 마스카라와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"“폭죽 테러 당했는데 경찰이 외면” 강릉 해변 ‘발칵’…20대男 주장 진실은","link":"https://n.news.naver.com/mnews/article/011/0004679679","naverLink":"https://n.news.naver.com/mnews/article/011/0004679679","pubDate":"2026-11-07T10:01:18.745754+09:00","author":"네이버뉴스","description":"강원 강릉 경포해변을 찾은 나들이객들이 피서를 즐기고 있다. 뉴스1 강원 강릉의 한 해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보가 경찰 조사 결과 거짓으로 밝혀졌다. 지난해 강원 양양에서도 성범죄와 마약 관련 허위 정보가 온라인에 퍼져 지역 상인들이 피해를 호소한 바 있다. 동해안 관광지를 겨냥한 가짜뉴스가 반복되면서 지역 이미지 훼손에 대한 우려가 커지고 있다. 폭죽 맞아 화상 입었다더니…사건 당시 강릉에도 없었다 6일 경찰 등에 따르면 강릉경찰서는 최근 강문해변에서 폭죽에 맞아 화상을 입었다는 온라인 제보와 관련해 사실관계를 확인한 결과 피해 주장과 경찰의 신고 묵살 의혹이 모두 허위인 것으로 파악했다. 거짓 제보를 퍼뜨린 인물은 인천에 거주하는 27세 남성 A씨로 확인됐다. A씨는 인터넷에서 확보한 폭죽 영상과 2도 화상 사진을 자신의 피해 증거인 것처럼 꾸며 방송사와 온라인 커뮤니티 등에 전달한 것으로 조사됐다. A씨가 주장한 사건 발생 시점은 지난달 20일 저녁이었다. 그는 당시 강릉 강문해변에서 일부 남성이 사람을 향해 폭죽을 발사해 화상을 입었다고 주장했다. 경찰에 신고했지만 가해자의 신원을 확인하기 어렵다는 이유로 제대로 된 조치를 받지 못했다고도 했다. 하지만 경찰이 당시 행적을 추적한 결과 A씨는 강릉이 아닌 인천에 머물고 있었다. 주장한 피해 내용과 일치하는 112신고 기록도 존재하지 않았다. 다만 강문해변에서 실제 폭죽놀이가 이뤄진 정황은 확인됐다. 경찰은 현장에서 폭죽을 사용한 것으로 추정되는 20대 남성 2명의 신원을 파악하고 해수욕장법 위반 여부를 검토했다. 그러나 이들의 폭죽놀이와 A씨가 주장한 화상 피해는 별개인 것으로 확인됐다. 경찰이 피해 신고를 묵살했다는 주장 역시 사실이 아니었다. 관련 온라인 게시물은 현재 삭제된 상태다. 경찰은 A씨가 허위 정보를 퍼뜨린 경위를 살펴보고 명예훼손 등 혐의를 적용할 수 있는지 검토할 방침이다. 지난해 양양군 현남면 인구해수욕장에 내걸렸던 현수막. 뉴스1","category":"사건 사고"},{"title":"재판소원·대법관 증원에…대법·헌재 내년 건물값만 최소 100억","link":"https://n.news.naver.com/mnews/article/003/0014307518","naverLink":"https://n.news.naver.com/mnews/article/003/0014307518","pubDate":"2026-11-07T10:01:18.745748+09:00","author":"네이버뉴스","description":"증원 대법관 집무실·법원행정처 이전 등 100억 대법, 외부 임차청사 아직 못 구해…지연 우려 헌재, 임차료·운영비만 31억…별관 신축도 추진 [서울=뉴시스] 지난 3월 여당 주도로 국회를 통과한 '사법 3법'의 일환인 대법관 증원과 재판소원 제도에 따라 두 최고 사법기관이 내년 국회에 제출한 건물 값만 최소 100억원을 웃도는 것으로 나타났다. (사진=뉴시스DB). 2026.11.07. photo@newsis.com [서울=뉴시스]김정현 기자 = 지난 3월 여당 주도로 국회를 통과한 '사법 3법'의 일환인 대법관 증원과 재판소원 제도에 따라 두 최고 사법기관이 내년 국회에 제출한 건물 값만 최소 100억원을 웃도는 것으로 나타났다. 단순히 건물을 신·증축하는 것만 아니라 준비 기간 동안 외부 건물을 빌려 쓰기로 계획돼 있어, 몇 년 동안은 막대한 임차료를 세금으로 부담해야 할 것으로 보인다. 국회에서도 추진 상황을 꼼꼼히 점검하고 재정 부담을 완화할 대책을 마련할 필요가 있다는 지적이 나왔다. 7일 대법원과 헌법재판소의 내년도 예산안에 대한 국회 법제사법위원회 전문위원 및 국회예산정책처의 검토 보고서를 종합하면, 대법원은 내년 대법관 증원을 준비하는 데에만 99억5600만원을 새로 편성했다. 따로 잡힌 대법관 집무실 신설을 위한 자산취득비(비품 등 구입) 1억4000만원을 합하면 100억원을 넘는다. 지난 3월 법원조직법이 개정되면서 대법관 수는 대법원장을 포함해 현행 14명에서 26명이 된다. 증원되는 12명은 2028년부터 2030년까지 매년 4명씩 늘어난다. 이에 대법원은 재판연구관들이 사용하던 서울 서초구 청사 본관 12~15층을 증원되는 대법관들의 업무 공간으로 활용하기로 가닥을 잡았다. 현재는 지상 16층 청사 중 7~10층을 층당 3명의 대법관들이 쓰고 있다. 우선 내년 9월부터 대법원 본관 12층에 3명, 13층에 1명의 대법관 집무실 공사를 시작해 다음 해 2월까지 공사를 마무리한다. 여기에만 22억5100만원이 들어간다. 증원되는 대법관 사무실 면적은 213㎡로, 기존(266㎡)보다 작은 방을 쓴다. 장관이나 국회의원 사무실(165㎡)보다는 넓은 수준이지만, 사건 서류와 이를 검토할 전속재판연구관 등이 일할 공간도 포함된 면적이다. [서울=뉴시스] 대법원은 2028년부터 2030년까지 대법관 12명이 증원됨에 따라 내년에만 99억5600만원을 편성해 대법관 집무실 신설과 부서 이전 사업을 추","category":"사건 사고"},{"title":"복통에 구토·고열·혈변까지…응급실 찾아야 할 위험 신호","link":"https://n.news.naver.com/mnews/article/018/0006405446","naverLink":"https://n.news.naver.com/mnews/article/018/0006405446","pubDate":"2026-11-07T10:01:18.745741+09:00","author":"네이버뉴스","description":"소화불량부터 맹장염·담석·요로결석까지 원인 다양… 응급실 찾는 위험 신호 [이데일리 이순용 의학전문기자] 평소 건강했던 40대 직장인 A씨는 저녁 식사 후 갑자기 배가 아팠다. 과식 탓이라 생각해 소화제를 먹고 쉬었지만 통증은 가라앉지 않았고, 메스꺼움까지 겹치자 결국 응급실을 찾았다. 갑작스러운 복통이 생기면 대부분 소화불량부터 떠올린다. 실제로 과식이나 변비, 장염처럼 흔한 원인이 많지만 맹장염이나 담석, 요로결석처럼 서둘러 치료해야 하는 병의 신호일 수도 있다. 복통은 가볍게 시작했다가 빠르게 나빠지기도 하므로 참을 수 있느냐만으로 응급실 방문 여부를 판단해서는 안 된다. 급성 복통은 갑자기 생기거나 이전보다 뚜렷하게 심해지는 배의 통증이다. 위와 장뿐 아니라 쓸개, 췌장, 신장, 요로 등 여러 장기가 원인이 될 수 있다. 가장 흔한 원인은 소화불량과 위장염이지만 배가 심하게 부풀고 대변이나 방귀가 나오지 않는다면 장이 막히는 장폐색일 수 있어 확인이 필요하다. 또한 맹장염, 담석증, 요로결석도 흔한 원인이다. 맹장염은 배꼽 주변이나 가슴뼈 아래 오목한 명치에서 시작된 통증이 오른쪽 아랫배로 옮겨가는 것이 특징이다. 메스꺼움, 구토, 열이 함께 나타나며 치료가 늦어져 맹장이 터지면 배 속 전체에 염증이 퍼지는 복막염으로 이어질 수 있다. 담석증은 쓸개나 담도에 돌이 생기는 병으로 주로 명치나 오른쪽 윗배가 아프다. 기름진 음식을 먹은 뒤 통증이 생기거나 오른쪽 어깨와 등으로 퍼지기도 한다. 열과 오한에 더해 피부와 눈 흰자가 노랗게 변하는 황달까지 나타나면 염증이 생겼을 가능성이 있다. 요로결석은 옆구리에서 시작된 통증이 아랫배와 사타구니 쪽으로 이어지고 극심한 통증과 잠잠함이 반복된다. 소변에 피가 섞이기도 한다. 모든 복통에 응급실 진료가 필요한 것은 아니지만 다음과 같은 증상이 있다면 응급 상황일 수 있다. 참기 힘들 만큼 극심하거나 빠르게 심해지는 통증은 장기 염증이나 장에 구멍이 생기는 천공 등 긴급한 치료가 필요한 병일 수 있다. 피가 섞인 구토, 선홍색 혈변, 검고 끈적한 변은 소화기관 출혈의 신호이며, 어지럼증과 식은땀이 더해지면 더욱 위험하다. 구토가 반복되고 고열과 오한이 나타나거나 배가 부풀면서 대변과 방귀가 멈춘 경우에도 즉시 응급실에 가야 한다. 특히 기절, 의식 저하, 호흡곤란, 가슴 통증이 함께 나타나면 심장이나 혈관 등 다른 응급질환일 수 있다. 이때는 직접 운전하지 말고 11","category":"사건 사고"},{"title":"엄마·외할머니 폭행하고 또…'접근금지' 소용없었다","link":"https://n.news.naver.com/mnews/article/215/0001271980","naverLink":"https://n.news.naver.com/mnews/article/215/0001271980","pubDate":"2026-11-07T10:01:18.745737+09:00","author":"네이버뉴스","description":"임시조치 닷새만에 베란다 창문으로 들어가 가족 접근 지인 집 도어락 부수고 금품 절도까지 사진=연합뉴스 어머니와 외할머니를 폭행해 법원으로부터 접근금지 명령을 받은 30대 남성이 불과 닷새 만에 베란다 창문을 통해 집에 들어갔다가 처벌받았다. 춘천지법 형사3단독 박동욱 판사는 가정폭력범죄의 처벌 등에 관한 특례법 위반 혐의 등으로 재판에 넘겨진 A(37)씨에게 징역 10개월에 집행유예 2년을 선고했다고 7일 밝혔다. 아울러 보호관찰과 사회봉사 120시간도 명령했다. 공소사실에 따르면 A씨는 지난 6월 어머니와 외할머니를 때려 법원으로부터 주거지 즉시 퇴거와 가족들에 대한 접근·연락을 금지하는 임시 조치를 받았다. 그러나 A씨는 법원의 결정을 무시하고 닷새 만에 베란다 창문을 통해 집 안으로 들어가 가족들에게 접근했다. 비슷한 시기 평소 알고 지내던 지인의 집에 침입해 금품을 훔치기도 했다. 그는 술자리에서 알게 돼 친분을 쌓은 B씨의 집 현관문 도어락을 소화기로 내리쳐 부순 뒤 집 안으로 침입한 뒤 거실에 놓여 있던 B씨의 가방에서 차량 스마트키와 6장을 훔친 것으로 드러났다. 박 판사는 \"범행을 모두 인정하며 반성하고 있으나 존속폭행으로 임시 조치 결정을 받았는데도 가족들에게 접근하고, B씨의 집에 침입해 절도 범행을 저질러 죄질이 좋지 않으며, 피해자들과 합의하지 못한 점 등을 종합해 형을 정했다\"고 판시했다.","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:0
