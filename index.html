"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"안일했던 스토킹 대응, 결국 참극…정말 `국민 위한` 수사기관 개편 맞나[사사건건]","link":"https://n.news.naver.com/mnews/article/018/0006405474","naverLink":"https://n.news.naver.com/mnews/article/018/0006405474","pubDate":"2026-11-07T11:20:17.677177+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"석궁형 슬링샷 모의총포 해당…경찰, 판매·구매자 12명 송치","link":"https://n.news.naver.com/mnews/article/031/0001072970","naverLink":"https://n.news.naver.com/mnews/article/031/0001072970","pubDate":"2026-11-07T11:20:17.677132+09:00","author":"네이버뉴스","description":"경찰이 석궁형 새총이 모의총포에 해당한다며 국내 온라인 쇼핑몰에서 석궁형 새총을 판매·구매한 사람들을 검거했다. 부산 수영경찰서는 총포·도검·화약류 등의 안전관리에 관한 법률 위반 등의 혐의로 12명을 검거해 불구속 송치했다고 6일 밝혔다. 이들은 지난 1월부터 7월 18일까지 중국에서 구매한 모의 총기류를 국내 온라인 쇼핑몰에서 판매하거나 사들인 혐의를 받고 있다. 경찰이 압수한 석궁형 슬링샷의 모습. [사진=부산 수영경찰서] 앞서 경찰은 지난 5월 부산 수영구 망미동의 한 빌라 창문 등이 쇠구슬에 맞아 파손된 사건을 수사하다 피의자 주거지에서 장총과 석궁형 슬링샷(새총) 등이 발견돼 유통 경로를 추적했다. 경찰은 국립과학수사연구원에 압수한 슬링샷을 감정 의뢰했고, 해당 슬링샷이 총포화약법 시행령상 모의총포 등에 해당한다는 감정 결과를 회신받았다. 국과수는 고무줄이나 스프링 등의 탄성을 이용한 발사 장치에 격발장치가 달려 있고, 발사체의 운동에너지(파괴력)가 기준을 초과한다고 판단했다. 경찰의 모의실험에서도 쇠구슬이 빠른 속도로 발사돼 근거리에 있는 사람이 맞을 경우 치명상을 입을 수 있는 수준인 것으로 나타났다. 경찰 관계자는 \"해당 모의 총기류는 온라인상에서 레저용으로 홍보가 되고 있어 구매자들은 판매·소지가 금지되는 불법 모의총포라는 점을 인지하지 못한 채 구매하는 사례가 늘어날 것으로 보인다\"며 \"해당 모의 총기류를 호기심에 구입하게 될 경우 본인도 모르는 사이에 범법자가 될 수 있으므로 각별한 주의가 필요하다\"고 당부했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T11:12:42.840684+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"사람 몰려 경찰 출동…‘남대문 스카프’ 아저씨, 경호원까지 고용했다","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:52:54.157241+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"20대 기간제 환경미화원 차량 발판 탑승 사고사…“청주시 책임져야”","link":"https://n.news.naver.com/mnews/article/028/0002831095","naverLink":"https://n.news.naver.com/mnews/article/028/0002831095","pubDate":"2026-11-07T10:52:54.157158+09:00","author":"네이버뉴스","description":"1시간 안전교육 받고 투입 한달 만에 사고 수거차 발판에 올라타 작업하다 추돌 사고 정부, 2018년 발판 탑승 작업 금지조처 시행 청주시 “발판 금지조처 알지만 현장엔 남아” 충북 청주에서 폐기물 수거를 하던 20대 기간제 환경미화원이 차량에 치여 숨졌다. 이 노동자는 수거 차량 뒤편 발판에 타고 있다가 사고를 당한 것으로 알려져 경찰과 노동당국 등이 사고 경위 등을 조사하고 있다. 게티이미지 코리아 충북 청주에서 폐기물 수거를 하던 20대 기간제 환경미화 노동자가 차량 추돌 사고로 숨졌다. 이 노동자는 지난달 기간제노동 계약을 하고 한 시간 정도 안전교육을 받은 뒤 배치돼 한 달 남짓 만에 사고를 당했다. 6일 청주시, 경찰, 소방당국 말을 종합하면, 5일 새벽 5시20분께 청주시 청원구 율량동 도로에서 폐기물 수거·운반차를 타고 일하던 ㄱ(26)씨가 ㄴ씨(60대)가 몰던 화물차에 치였다. ㄱ씨는 크게 다쳐 치료를 받았지만 이튿날 새벽 숨졌다. 사고 당시 ㄱ씨는 폐기물 수거·운반차 뒤쪽 발판 위에 타고 있었던 것으로 알려졌다. 경찰은 폐기물 차량 운전사, 화물차 운전사, 함께 작업한 환경미화원을 상대로 사고 경위 등을 조사 중이다. ㄱ씨는 지난달 2일 청주시와 환경미화원(환경공무직) 기간제노동자 근로계약을 맺고 청원구청 청소팀에 배치돼 일한 지 한 달 남짓 만에 사고를 당했다. 청원구 청소팀 관계자는 “당시 안전수칙 등 관련 교육을 1시간 정도 받았으며, 안전관리 교육 8시간 수료 등을 안내받은 뒤 계약한 날부터 배치돼 일한 것으로 안다. 온라인 교육 수료 여부는 확인되지 않았다”고 밝혔다. 민주노총 충북본부 등은 ㄱ씨가 사고 당시 폐기물 차량 뒤편 발판에 타고 작업했던 것에 주목한다. 2018년 정부는 ‘환경미화원 작업 안전 개선 대책’에서 청소차와 폐기물 수거·운반 차량 발판 탑승을 금지했다. 민주노총 공공운수노조 청주환경지회는 성명을 내어 “ㄱ씨는 차량 발판에서 일하다 숨졌다. 청주시가 이 죽음에 책임져야 한다. 청주시는 차량 발판 관련 안전 대책과 인력 충원 등 대책을 즉시 마련해야 한다. 동료를 잃은 슬픔을 잊지 않겠다”고 밝혔다. 김성영 민주노총 충북지역본부 국장은 “청주시는 환경미화 노동자를 직고용하거나 대행업체(용역)를 선정해 운영하는데, 대행업체는 2024년 7~8월께 문제가 된 발판을 제거했지만 ㄱ씨처럼 직고용한 직원 차량의 발판은 그대로인 것으로 안다. 작업 시간 등을 고려한 꼼수 조처가","category":"사건 사고"},{"title":"게임문화재단, 중국 대련서 게임리터러시 교육… 해외 현지 첫 운영","link":"https://n.news.naver.com/mnews/article/029/0003057528","naverLink":"https://n.news.naver.com/mnews/article/029/0003057528","pubDate":"2026-11-07T10:49:02.956224+09:00","author":"네이버뉴스","description":"대련한국국제학교 교원 대상 생성형 AI 활용 게임 제작 연수 진행 게임리터러시 교육 종료 후 학생들과 관계자들. (중국 대련한국국제학교 제공) 문화체육관광부(장관 최휘영)와 한국콘텐츠진흥원(원장 김윤지)이 주최하고 (재)게임문화재단(이사장 유병한, 이하 재단)이 주관하는 게임리터러시 교육이 중국 대련한국국제학교에서 진행됐다. 재단은 지난 10월 29일부터 30일까지 대련한국국제학교의 ‘2026 진로체험주간’과 연계해 교원 연수와 학생 대상 특강, 게임 제작 프로젝트 활동을 운영했다고 밝혔다. 그동안 국내를 중심으로 추진해 온 게임리터러시 교육을 해외 현지 학교로 확대한 첫 사례다. 10월 29일에는 가천대학교 정무식 교수가 ‘세상을 창조하는 사람들’을 주제로 게임업계 진로를 고민하는 학생들에게 게임·콘텐츠 산업의 발전 과정과 관련 직업을 소개했다. 정 교수는 게임 산업의 다양한 진로를 안내하고, 게임을 통해 새로운 아이디어를 구현하는 창의적 역량의 중요성을 설명했다. 같은 날 대련한국국제학교 교원 35명을 대상으로 ‘AI와 함께하는 교실 맞춤형 게임 제작’ 연수도 진행됐다. 정지원 성남여수초등학교 교사가 생성형 AI를 활용한 게임 기획 및 제작 실습을 맡았으며, 참여 교원들은 직접 게임을 제작하며 AI의 교육적 활용 가능성을 살펴보고 교과와 학급 특성에 맞는 게임 기반 교수·학습 방법을 탐색했다. 10월 30일에는 학생들이 직접 제작한 게임 프로젝트를 발표하고 정무식 교수의 피드백을 받는 시간이 마련됐다. 학생들은 자신의 아이디어를 구체적인 결과물로 구현하고 전문가의 의견을 바탕으로 개선 방향을 모색하며 게임과 AI 기술을 진로 및 미래 역량과 연결해 생각해 보는 기회를 가졌다. 이어 이재호 경인교육대학교 컴퓨터교육과 교수가 ‘AI 시대의 핵심 역량, 그리고 게임리터러시’를 주제로 특강을 진행했다. 이 교수는 인공지능 시대에 요구되는 미래 핵심 역량을 설명하고, 게임을 창의적 사고와 문제 해결을 위한 교육 자원으로 활용하는 게임리터러시의 가치와 게임을 이해하고 주도적으로 활용하는 역량의 중요성을 소개했다. 재단을 대표해 현장을 방문한 김현경 게임문화교육원장은 교육 운영 현황을 살펴보고 재외한국학교의 게임리터러시 교육 활성화와 교육 협력 방안을 논의했다. 김 원장은 “이번 대련한국국제학교 교육은 게임리터러시 교육 역량을 해외 학교 현장으로 확장한 첫 사례라는 점에서 뜻깊다”며 “앞으로도 다양한 교육환경에 적합한","category":"사건 사고"},{"title":"‘스카프 아저씨’ 결국 경호원까지 고용했다…인파 몰려 안전사고 우려","link":"https://n.news.naver.com/mnews/article/016/0002720169","naverLink":"https://n.news.naver.com/mnews/article/016/0002720169","pubDate":"2026-11-07T10:33:39.816918+09:00","author":"네이버뉴스","description":"‘스카프 아저씨’(좌)의 상점 앞에 몰린 인파[인스타그램] [헤럴드경제=김성훈 기자] 거침없는 입담으로 SNS 스타가 된 서울 남대문시장 ‘스카프 아저씨’가 민간 경호원까지 고용한 것으로 알려졌다. 너무 많은 인파가 몰려들어 안전관리가 필요한 상황이 됐기 때문이다. 6일 연합뉴스TV에 따르면, 남대문 시장에서 스카프를 판매하는 상인 A 씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 배치했다. 방문객이 너무 많이 몰려 발생할 수 있는 안전사고를 예방하고, 시장 내 질서를 유지하기 위해서다. 앞서 A 씨는 너무 많은 인파에 지난달 31일 임시 휴업을 선택했다. 며칠 간의 휴지기를 거쳐 지난 4일 다시 문을 열었지만 상황은 달라지지 않았고, 경찰이 출동하는 소동까지 벌어졌다. 결국 A 씨는 5일 다시 영업을 중단했다. 그는 자신의 SNS인 ‘남대문 다다구리’에 “요즘 생각지도 못한 너무 많은 관심과 사랑을 받고 있어서 솔직히 가슴 한구석에는 엄청난 부담감과 불안함이 있다”고 털어놨다. 구경 인파가 몰려들어 누군가 다치지 않을까 염려를 하면서 “앞으로 생길 일들에 살짝 두려운 마음이 드는 것도 사실이다”라고 했다. 남대문시장 상인회 차원에서도 사고 예방을 위해 촉각을 곤두세우고 있는 상황이다. 스카프 6장을 1만원에 판매하는 A 씨는 최근 온라인상에서 손님들에게 유쾌한 농담을 건네는 모습이 확산되면서 일약 SNS 스타가 됐다. 그는 손님들에게 “돈 쓰지 마. 이거 집에 가면 더 별로야”, “이걸로 땀이나 닦아, 하고 다니지 말고”라며 오히려 구매를 만류한다거나, 매대 가득한 스카프를 들추는 손님에게 “교양 있게 행동하지 마, 뒤집어야 나올 거 아니여~” 등의 입담으로 손님들의 웃음을 자아냈다. 이에 스카프를 사기보다 A 씨의 입담을 직접 듣거나 사진을 찍으려는 사람까지 늘면서 안전 문제와 타 업장 피해까지 발생하는 상황이 빚어지고 있다.","category":"사건 사고"},{"title":"[속보] 김종철 경찰청장 후보자 “막중한 책임 느껴”…경찰위 출석","link":"https://n.news.naver.com/mnews/article/025/0003563343","naverLink":"https://n.news.naver.com/mnews/article/025/0003563343","pubDate":"2026-11-07T10:08:37.041304+09:00","author":"네이버뉴스","description":"김종철 경찰청장 직무대행이 6일 이재명 대통령이 참석한 가운데 청와대에서 열린 한·동티모르 치안협력을 위한 기술약정서 체결식에 참석해 약정서 서명하기 위해 펜을 들고 있다. 청와대통신사진기자단 신임 경찰청장 후보자인 김종철 경찰청 차장은 6일 “엄중한 시기에 경찰청장 후보자로 지명된 것에 막중한 책임을 느낀다”고 밝혔다. 김 후보자는 이날 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하기 전 “경찰에 대한 국민의 기대가 어느 때보다 높고 또 그 이상 우려의 목소리가 크다는 걸 잘 알고 있다”며 이같이 말했다. 이어 “오늘 후보자로서 역량과 자질을 검증받는 만큼 책임 있는 자세로 성실히 임하겠다”고 했다. 경찰위는 이날 임시회의에서 김 후보자의 임명 제청 동의 여부를 심의한다. 경찰청장 인선은 대통령실의 후보자 추천, 경찰위 동의, 행정안전부 장관 제청, 국회 인사청문회, 대통령 임명 순으로 진행된다. 인사청문회를 거치되 국회의 임명 동의는 필요하지 않다. 김 후보자는 1970년 경남 함양에서 태어나 진주 명신고와 한국외국어대 영어과를 졸업했다. 1997년 경찰간부후보생 45기로 경위에 임관했다. 2019년 서울 서초경찰서장을 지냈으며, 2021년 경무관으로 승진해 부산경찰청 자치경찰부장을 맡았다. 같은 해 7월에는 문재인 정부 청와대 국정상황실에서 근무했다. 이후 대구·대전경찰청 공공안전부장, 서울경찰청 생활안전교통부장, 충남경찰청 공공안전부장, 강원경찰청 생활안전부장 등을 역임했다. 지난해 9월 치안감으로 승진해 경남경찰청장을 맡았고, 올해 8월 치안정감 승진자로 내정됐다. 이어 9월 경찰청 차장에 임명돼 청장 직무대행을 맡고 있다.","category":"사건 사고"},{"title":"세 번 만난 일본인 여성 왜 살해했나…30대 남성, 주식 실패에 처지 비관","link":"https://n.news.naver.com/mnews/article/008/0005437859","naverLink":"https://n.news.naver.com/mnews/article/008/0005437859","pubDate":"2026-11-07T00:26:25.047999+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T11:20:18.315370+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"‘얼음 아가씨’ 자리에 앉은 충성파 새 실장 “트럼프 위해 싸워야” …美우선주의 ‘마이웨이’ 고수 의지","link":"https://n.news.naver.com/mnews/article/021/0002831011","naverLink":"https://n.news.naver.com/mnews/article/021/0002831011","pubDate":"2026-11-07T11:20:17.677215+09:00","author":"네이버뉴스","description":"‘강경 이민정책 설계자’ 스티븐 밀러 부실장서 실장 승진 트럼프, 강경 충성파 기용하며 기존 정책기조 고수 의지 밀러 “힘이 국제질서 좌우” 제국주의적 세계관 밝혀와 신임 백악관 비서실장으로 임명된 스티븐 밀러(왼쪽). UPI=연합뉴스 자료사진. 스티븐 밀러(41) 미국 백악관 신임 비서실장은 6일(현지시간) 트럼프 대통령에 대해 “미 역사상 가장 획기적인 변화를 이끌어낸 정치 지도자”라고 극찬했다. 그는 이날 엑스(X)를 통해 “온 마음을 다해 대통령을 지지하고 위대한 공화국을 지키기 위해 싸워야 한다”라고 말했다. 도널드 트럼프 미국 대통령은 이날 백악관 첫 여성 비서실장으로 ‘얼음 아가씨’라는 닉네임으로 불렸던 수지 와일스(69)를 경질하고 ‘총리’라는 별칭으로 불려온 강경 충성파인 밀러 백악관 부비서실장을 그 자리에 앉혔다. 중간선거 패배 사흘 만에 밀러를 비서실장에 낙점한 것은 중간선거 참패에도 ‘마이웨이’를 고수하겠다는 의지를 뚜렷이 한 것으로 분석됐다. 밀러는 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 트럼프가 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것으로 보인다. 트럼프 측근들 사이에서 ‘총리’라는 별칭으로 불려온 밀러는 1기 행정부 때부터 선임고문으로 백악관을 지켰다. 2020년 트럼프 대통령의 대선 패배 이후에도 곁을 떠나지 않다 2기 행정부 들어 백악관 부비서실장으로 발탁된 측근 중의 측근으로 백악관에서 만난 아내 케이티 밀러와 함께 워싱턴 정가의 파워 커플로 불렸다.밀러는 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 ‘좌파 척결’에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 그가 임명되자마자 민주당 지도부가 맹폭을 퍼붓는 것은 그런 이유에서다. 당장 민주당 지도부는 이번 인선을 “최악의 선택”이라 비난하며 밀러 신임 실장에 대한 의회 차원의 조사를","category":"사회"},{"title":"차에서 폰 썼다고 “미친X”…초등생 머리 피범벅 만든 태권도 관장","link":"https://n.news.naver.com/mnews/article/025/0003563484","naverLink":"https://n.news.naver.com/mnews/article/025/0003563484","pubDate":"2026-11-07T11:20:17.677212+09:00","author":"네이버뉴스","description":"폭행 피해 아동의 머리 부위 상처 모습. 사진 스레드 캡처 차량 내에서 휴대전화를 사용했다는 이유로 초등학생 제자의 머리를 휴대전화로 내려쳐 다치게 한 40대 태권도장 관장이 경찰에 입건됐다. 진주경찰서는 아동복지법상 아동학대 혐의로 경남 진주시 한 태권도장 관장 40대 A씨를 조사 중이라고 지난 5일 밝혔다. A씨는 지난달 29일 오후 6시50분쯤 태권도장 차량을 운전해 원생들을 하원시키던 중 조수석에 탄 초등학교 4학년 원생 B군의 머리를 휴대전화로 10차례가량 때린 혐의를 받고 있다. A씨는 B군이 차량 내 휴대전화 사용 금지 규칙을 어겼다는 이유로 이 같은 행동을 한 것으로 전해졌다. 당시 차량 뒷좌석에는 중학교 2학년생인 B군 누나를 비롯한 다른 원생들도 함께 타고 있었던 것으로 확인됐다. 사건은 B군 누나가 휴대전화로 당시 상황을 촬영하고 소셜미디어(SNS)에 폭행 내용이 담긴 글과 영상이 올라오면서 알려졌다. 공개된 영상에서 A씨로 추정되는 남성은 B군을 향해 “미친X이네 이거”, “돌았어?”, “장난하는 것 같아?” 등 욕설과 폭언을 쏟아냈다. 이어 “손 내려라”, “뭘 잘했다고 울어”라고 소리친 뒤 “내일 반성문 10장 써와. A4용지에 빼곡하게”라고 요구했다. B군은 울먹이며 “아닙니다”라는 말을 반복했고 이 과정에서 무언가를 때리는 듯한 소리가 여러 차례 이어졌다. B군 어머니 C씨는 지난 6일 JTBC ‘사건반장’에 사건 당일 집 앞에 선 차량에서 아들이 머리를 부여잡고 내렸고 머리에서는 피가 흐르고 있었다고 설명했다. C씨가 경위를 묻자 누나는 “태권도 관장님이 동생을 때렸다”고 했고 C씨는 즉시 태권도장에 전화를 걸어 항의한 뒤 응급실로 이동했다. B군은 머리를 네 바늘 꿰매는 치료를 받았다. C씨는 ‘사건반장’에 “믿고 의지했던 학원에서 이런 일이 벌어져 너무나 충격이고 배신감이 든다”며 “아들이 원형탈모 치료를 받고 있는데 이번 일로 트라우마가 더 심해질까 걱정된다”고 호소했다. 논란이 커지자 A씨는 “아이를 지도하고 보호해야 할 어른으로서 감정을 다스리지 못하고 해서는 안 될 행동을 했다”며 “학생과 부모님께 진심으로 사과드린다”고 말한 것으로 전해졌다. 진주경찰서는 아동복지법상 아동학대 혐의로 A씨를 입건하고 정확한 사건 경위를 조사 중이라고 밝혔다.","category":"사회"},{"title":"\"어머니·할머니 때려놓고\"...베란다 창문으로 다시 들어온 30대","link":"https://n.news.naver.com/mnews/article/666/0000130988","naverLink":"https://n.news.naver.com/mnews/article/666/0000130988","pubDate":"2026-11-07T11:20:17.677203+09:00","author":"네이버뉴스","description":"접근 금지 조치에도 닷새 만에 무단 침입...지인 집 들어가 절도까지 법원, “범행 인정하고 반성 참작”...징역 10개월에 집행유예 2년 선고 법원 로고. 클립아트코리아 모친과 외조모를 때려 법원의 즉시 퇴거 및 접근금지 임시조치를 받고도 이를 비웃듯 닷새 만에 가족들에게 다시 접근한 30대가 징역형 집행유예를 선고받았다. 7일 연합뉴스에 따르면 춘천지법 형사3단독 박동욱 판사는 가종폭력범죄의 처벌 등에 관한 특례법 위반 혐의로 재판에 넘겨진 A씨(37)에게 최근 징역 10개월에 집행유예 2년을 선고했다. 박 판사는 또 보호관찰 8개월과 함께 120시간의 사회봉사 명령도 함께 판결했다. A씨는 지난 6월 자신의 어머니와 외할머니를 폭행한 혐의로 격리조치됐다. 당시 법원은 A씨에게 주거지에서 퇴거하고 일체의 접근 및 연락을 금지하는 임시조치 결정을 내렸다. 그러나 A씨는 법원 결정이 있은 지 닷새 만에 베란다 창문을 통해 집 안에 몰래 들어갔다. A씨의 범행은 가정폭력뿐안 아니었다. 그는 지난 6월 알고 지내던 B씨의 집 현관 잠금장치를 부순 뒤 내부로 무단 침입했다. 이어 거실에 있던 B씨의 가방에서 차량 스마트키와 신용카드 6장을 훔쳤다. 박 판사는 “존속폭행으로 임시조치 결정받았음에도 이를 위반해 가족들에게 접근했고, 지인의 주택에 침입해 물품을 훔치는 등 죄질이 매우 불량하다”며 “피해자들과 원만히 합의하지 못한 점도 불리한 정상”이라고 지적했다. 이어 “피고인이 자신의 범행을 모두 인정하고 반성하는 태도를 보이는 점 등을 종합적으로 고려해 형을 정했다”라고 덧붙였다.","category":"사회"},{"title":"코인 싸게 판다더니 1억 챙겨 도주…도박·유흥비로 탕진","link":"https://n.news.naver.com/mnews/article/021/0002831014","naverLink":"https://n.news.naver.com/mnews/article/021/0002831014","pubDate":"2026-11-07T11:20:17.677201+09:00","author":"네이버뉴스","description":"AI 생성 이미지 가상화폐를 시세보다 저렴하게 판매하겠다고 속여 구매자들로부터 현금 1억 원을 받아 달아난 20대 남성이 구속 상태로 검찰에 넘겨졌다. 이 남성은 가로챈 돈을 도박과 유흥비 등으로 모두 탕진한 것으로 조사됐다. 경기 일산동부경찰서는 사기 혐의로 20대 남성 A 씨를 구속 송치했다고 7일 밝혔다. 경찰에 따르면 A 씨는 지난달 7일 오후 5시쯤 경기 고양시의 한 카페에서 코인 직거래를 빌미로 피해자 2명에게 현금 1억 원을 받아 챙긴 뒤 도주한 혐의를 받는다. 그는 지인을 통해 알게 된 피해자들에게 자신이 특정 코인 관련 업무에 종사하고 있다며 현금으로 거래하면 코인을 시세보다 싸게 구매할 수 있다고 접근한 것으로 파악됐다. 다만 A 씨가 실제 해당 코인과 관련된 일을 했는지는 확인되지 않았다. 피해자 2명은 각각 현금 5000만 원을 마련해 A 씨와 약속한 카페에서 만났다. A 씨는 이들로부터 돈을 건네받은 뒤 음료를 주문하고는 주차를 하고 오겠다며 자리를 떠 그대로 달아난 것으로 조사됐다. 범행 이후 A 씨는 경찰의 추적을 피하기 위해 휴대전화까지 해지한 것으로 드러났다. 그는 경찰 조사에서 범행을 인정했으며, 피해자들로부터 가로챈 1억 원은 도박과 유흥비 등에 모두 사용한 것으로 전해졌다.","category":"사회"},{"title":"\"사지마\" 말리는데도 산다…요즘 SNS 뒤집어놓은 '이 가게' [권용훈의 트렌드워치]","link":"https://n.news.naver.com/mnews/article/015/0005351362","naverLink":"https://n.news.naver.com/mnews/article/015/0005351362","pubDate":"2026-11-07T11:20:17.677184+09:00","author":"네이버뉴스","description":"남대문 스카프리오가 보여준 '상인 팬덤' 인스타그램 캡처 물건을 더 사라고 권하는 대신 “돈 쓰지 마”라고 말하는 상인. 남대문시장 스카프 가게 앞에 손님들이 몰린 건 스카프보다 그 상인의 입담을 직접 보고 싶어서였다. 숏폼에서 시장 골목으로…상인을 보러 가는 손님들 서울 남대문시장에서 스카프를 파는 상인 A씨는 최근 SNS에서 ‘스카프 아저씨’ ‘스카프리오’로 불리며 화제가 됐다. 손님이 스카프를 고르면 “과소비야”, “집에 가면 안 쓸 거야”라며 구매를 말리는 영상이 퍼지면서다. 스카프 6장을 1만원에 파는 가게지만, 사람들은 물건만 사러 오지 않았다. 영상에서 본 상인의 말투와 손님과의 ‘티키타카(재치 있는 말 주고받기)’를 직접 경험하려고 남대문시장으로 향했다. 온라인에서 커진 관심은 곧 오프라인 인파로 이어졌다. 지난 4일 영업을 재개하자 가게 앞에는 수십 명에서 100명 안팎으로 추정되는 방문객이 몰렸다. 손님뿐 아니라 사진과 영상을 찍으려는 사람까지 뒤섞이며 주변 점포 앞과 통행로가 붐볐다. A씨는 안전 점검을 이유로 다음 날 다시 하루 휴업을 공지했다. 온라인에서 인기를 얻은 상인이 실제 시장의 ‘목적지’가 됐지만, 좁은 골목에 사람이 한꺼번에 몰리자 정상적인 장사와 통행이 어려워진 것이다. 이 현상은 상품보다 ‘사람과의 경험’을 소비하는 흐름을 보여준다. 숏폼에서는 짧고 분명한 캐릭터가 영상의 볼거리가 되고, 시청자는 그 장면을 현실에서 다시 만나려고 한다. 스카프를 사는 일이 상인과 대화를 나누고, 영상을 찍고, 주변 시장을 둘러보는 경험으로 확장된 셈이다. 백화점 팝업스토어가 브랜드가 기획한 공간으로 소비자를 부른다면, 이곳에서는 시장 상인의 일상적인 응대가 그 자체로 방문 이유가 됐다. 시장 전체로 번질까…화제와 매출은 다른 문제 남대문시장에서 젊은 층의 관심이 커진 건 스카프 가게만의 일은 아니다. 때타월과 목욕바구니, 옥반지, 비녀, 그릇 등 SNS에서 주목받은 상품을 찾는 젊은 손님도 늘고 있다. 신한카드 빅데이터연구소에 따르면 올해 1~8월 남대문 상권의 주말·공휴일 결제 건수는 2024년 같은 기간보다 20대 이하에서 44%, 30대에서 53% 증가했다. 서울시 집계로는 올해 1~9월 남대문시장 관광 관련 업종의 외국인 카드 소비액도 전년 동기보다 65.6% 늘었다. 다만 이 수치만으로 스카프리오의 인기가 시장 매출 증가를 이끌었다고 볼 수는 없다. 관건은 한 사람에게 쏠린 관심이","category":"사회"},{"title":"만 12세에 일본기업 강제동원…2심도 \"8천만원 배상해야\"","link":"https://n.news.naver.com/mnews/article/001/0016427672","naverLink":"https://n.news.naver.com/mnews/article/001/0016427672","pubDate":"2026-11-07T11:12:42.840687+09:00","author":"네이버뉴스","description":"피해자 유족, 후지코시 상대 손해배상 일부승소 울산 '일제강점기 강제징용 노동자상'. 기사와 직접 관련 없음. [연합뉴스 자료사진. 재판매 및 DB 금지] (서울=연합뉴스) 이영섭 기자 = 일제강점기 강제 동원 피해자에게 일본 기업이 손해를 배상해야 한다는 판결이 또 나왔다. 7일 법조계에 따르면 서울중앙지법 민사항소11-2부(곽형섭 전서영 양형권 부장판사)는 고(故) 서모 씨가 일본 기계 공구·부품 회사인 후지코시를 상대로 낸 손해배상 소송을 최근 1심과 같이 원고 일부승소로 판결했다. 후지코시는 서씨 측에 8천만원을 배상해야 한다. 서씨는 만 12세이던 1945년 3∼8월 후지코시에 강제 동원돼 조선여자근로정신대 소속으로 비행기 부속품을 만드는 일을 했다. 그는 2020년 손해배상 청구 소송을 냈다가 1심 선고가 나오기 전인 2024년 5월 사망했다. 소송은 자녀가 수계했다. 후지코시 측은 국내 법원에 이 사건에 대한 관할권이 없으며, 서씨의 손해배상 청구권은 1965년 한일청구권협정에 의해 소멸했다고 주장했다. 2024년 11월 1심은 이런 주장을 모두 배척하고 서씨 측 손을 들어줬다. 재판부는 후지코시가 일본 법인이긴 하지만 서씨가 대한민국 민법에 근거해 불법행위 책임을 묻는 점, 사안의 내용이 한국의 역사와 정치적 변동과 밀접한 관계가 있는 점 등을 종합하면 국내 법원에 재판관할권이 있다고 판단했다. 1965년 한일 청구권 협정이 강제 동원 등 불법적 관계에서 발생한 청구권까지 제한하진 않는다는 2018년 대법원 전원합의체 판결을 인용하며 서씨의 청구권도 인정했다. 1심은 \"망인은 어린 나이에 장차 일본에서 처하게 될 노동환경이나 하게 될 노동의 구체적 내용, 받게 될 처우 등에 관해 제대로 알지 못한 채 일본국 정부와 후지코시의 조직적 기망으로 근로정신대에 지원해 노동에 종사했다\"고 짚었다. 이어 \"후지코시는 망인의 자유를 현저히 억압한 채 강제노동에 종사하게 했고, 이는 당시 일본국 정부의 한반도와 한국인에 대한 불법적인 식민 지배 및 침략전쟁 수행과 직결된 반인도적 불법행위에 해당한다\"고 판단했다. 후지코시 측이 항소했지만 2심 재판부는 \"1심과 2심에서 제출된 증거들을 종합해 다시 살펴봐도 1심의 사실인정과 판단은 정당하다\"며 판결을 유지했다. younglee@yna.co.kr","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:58:33.438384+09:00","author":"네이버뉴스","description":"설악산 -9도, 홍천·파주 -6.6도까지 떨어져…서울도 곳곳 영하 낮 8∼13도 그쳐…당분간 추위, 내일 경기북동부와 강원내륙·산지 눈 가능성 찬바람 부는 서울의 아침 (서울=연합뉴스) 서대연 기자 = 서울 아침 최저기온이 3도까지 떨어지며 급격히 추워진 6일 서울 종로구 광화문네거리에서 외투 모자를 쓴 관광객과 시민들이 신호를 기다리고 있다. 2026.11.6 dwise@yna.co.kr (서울=연합뉴스) 이재영 기자 = 절기 입동(立冬)인 7일 내륙 대부분의 아침 기온이 영하로 내려가는 등 추위가 시작했다. 이날 오전 7시 기준 일최저기온 현황을 보면 설악산은 -9.0도, 횡성(둔내)은 -6.8도, 홍천(서석)과 파주(판문점)는 -6.6도까지 기온이 떨어졌다. 7일 오전 8시 20분 기준 일최저기온 분포도. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:58:33.438378+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:49:02.280921+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"}],"생활·문화":[{"title":"“육회 한 접시씩 다 주세요”…발달장애인 회식서 생긴 일 [영상]","link":"https://n.news.naver.com/mnews/article/005/0001883585","naverLink":"https://n.news.naver.com/mnews/article/005/0001883585","pubDate":"2026-11-07T11:20:18.596576+09:00","author":"네이버뉴스","description":"어수선했던 복지관 회식 중 이름 모를 손님이 건넨 뜻밖의 선물 아직 살만한 세상 만드는 [작은영웅] 인천 청라의 한 고깃집에서 27명의 단체 손님이 식사를 하고 있습니다. 그런데 어딘가 모르게 평범한 단체 회식과는 사뭇 다릅니다. 유독 어수선한 분위기가 흐릅니다. 그런 식사 풍경을 지켜보던 한 여성이 계산대로 다가가 식당 직원에게 무언가 말합니다. 그리고 그 이야기를 듣던 직원은 난감한 듯 결국 사장님을 불렀습니다. 이 여성은 대체 무슨 얘길 전했던 걸까요? 항의 들어올까 눈치 봤는데 ⋯ 돌아온 반전 이날 식당을 찾은 단체 손님은 제물포한마음종합사회복지관을 다니는 발달장애인들과 복지관 관계자들이었습니다. 이 복지관에서 7년째 활동하고 있는 자원봉사자 김관택(52)씨는 이날 식당에 함께 하면서도 사실 마음이 좀 불안했다고 합니다. 김관택(52·자원봉사자) “ 그날 저랑 같이 이용했던 이용인 분이 좀 컨디션이 많이 좋지는 않았어요 . 그래서 계속 울고 그래서 혹시 주변 사람한테 피해 갈까 봐 저는 오히려 더 걱정을 했었거든요 .” 장애인들을 보는 시선이 곱지만은 않은 현실을 누구보다 잘 알기에, 이렇게 단체로 식당에 온 자신들을 누군가 불편해하고 항의라도 할까봐 조마조마했던 거죠. 당시 함께 나온 사회복지사들은 복지사들대로 장애인들의 식사를 돕느라 동분서주하고 있었습니다.","category":"생활·문화"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T11:20:18.596548+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활·문화"},{"title":"게임이 악성코드 통로가 된다면[ET톡]","link":"https://n.news.naver.com/mnews/article/030/0003483159","naverLink":"https://n.news.naver.com/mnews/article/030/0003483159","pubDate":"2026-11-07T10:52:55.189405+09:00","author":"네이버뉴스","description":"최근 시프트업의 인기게임 '승리의 여신: 니케'에서 발생한 보안 사고는 글로벌 게임산업이 직면한 새로운 위험을 드러냈다. 게임서비스에 사용되는 콘텐츠전송네트워크(CDN)의 자바스크립트 파일이 제3자에 의해 변조되면서 공식 PC 런처를 통해 악성 프로그램이 유포됐다. 이용자가 믿고 실행한 게임이 PC 보안을 위협하는 통로가 됐다. 사고는 게임을 직접 공격하는 대신 연결된 외부 시스템의 취약점을 파고든 '공급망 공격'이라는 점에서 주목된다. 지난 9월 말 관련 도메인 탈취 이후 악성 프로그램 유포가 시작됐지만 운영사가 이를 확인하고 추가 유포를 차단하기까지 상당한 시간이 걸렸다. 게임산업의 국경은 허물어졌다. 국내 게임을 해외 퍼블리셔가 서비스하고 여러 국가에 흩어진 스튜디오가 프로젝트를 공동 수행한다. 개발부터 배급, 업데이트, 운영에 이르기까지 다양한 기업과 시스템이 연결돼 있다. 글로벌 진출 효율성을 높인 구조가 역설적으로 보안의 취약점이 될 수 있다는 의미다. 박정은 통신미디어부 기자 하나의 공급망에서 발생한 문제가 국경을 넘어 수많은 이용자에게 영향을 미칠 수 있다. 개인정보나 게임 데이터 유출을 넘어 악성 프로그램이 이용자 PC에 침투하면 게임 외부의 계정 정보와 금융 자산까지 위협받을 수 있다. 게임사 입장에서도 위험은 막대하다. 국가마다 개인정보 보호와 사이버보안 관련 법률, 제재와 피해 보상 기준이 다르다. 하나의 사고가 여러 국가 규제와 소송으로 이어질 수 있다. 자칫 기업의 존립까지 위협할 수 있다. 게임 보안의 범위를 다시 생각해야 한다. 개발사가 직접 작성한 코드뿐 아니라 외부 퍼블리셔의 배포 시스템, CDN, 업데이트 서버, 협력사 개발 도구까지 공급망 전반을 살펴야 한다. 사고 발생 시 국가와 기업의 경계를 넘어 신속하게 대응할 수 있는 협력체계가 필요하다. 게임은 이용자가 자발적으로 설치하는 콘텐츠다. 그런 게임이 악성코드를 퍼뜨리는 통로가 되는 일만큼은 막아야 한다. 이번 사고가 게임산업 전체에 공급망 보안의 중요성을 일깨우는 계기가 되기를 바란다.","category":"생활·문화"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:49:02.956213+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:33:40.778074+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"\"美민주, 캐나다 관세 철폐 추진…트럼프 무역정책 제동 첫발\"","link":"https://n.news.naver.com/mnews/article/001/0016427572","naverLink":"https://n.news.naver.com/mnews/article/001/0016427572","pubDate":"2026-11-07T10:26:05.519669+09:00","author":"네이버뉴스","description":"미시간·메인 등 선거 쟁점…공화당 이탈표 확보 전략 철강·차 등 관세는 당내 이견…무역법 전면 개정 난항 캐나다 윈저와 미국 디트로이트를 잇는 앰배서더 다리 [AFP=연합뉴스 자료사진. 재판매 및 DB 금지] (뉴욕=연합뉴스) 김연숙 특파원 = 미국 민주당이 도널드 트럼프 행정부의 대(對) 캐나다 관세 정책을 되돌리기 위한 입법을 추진하고 있다고 월스트리트저널(WSJ)이 6일(현지시간) 보도했다. 트럼프 대통령의 무역 정책 전반에 제동을 걸기 위한 첫 번째 조치로, 민주당은 관세에 반대하는 공화당 의원들의 협조를 얻어 입법까지 이어간다는 구상이다. 상원 재무위원회 민주당 간사인 론 와이든(오리건) 상원의원은 내년 1월 위원회 주도권을 넘겨받은 뒤 캐나다 관세를 철폐하는 법안을 추진하기 위해 동료 의원들과 논의하고 있다고 밝혔다. 와이든 의원은 \"캐나다산 제품에 대한 관세 폐지에 압도적인 지지가 있다\"고 말했다. 민주당의 이 같은 움직임은 이번 중간선거에서 관세가 주요 쟁점으로 부상한 지역의 유권자 반발을 동력으로 활용하려는 것으로 풀이된다. 미시간, 메인, 알래스카주 등에서는 캐나다와의 무역 갈등이 선거 쟁점이 됐다. 민주당뿐만 아니라 일부 공화당 후보들까지 관세에 반대하는 입장을 보였다. 민주당은 이들 지역의 공화당 의원들을 설득해 초당적 지지를 확보할 방침이다. 다만 법안이 실제 입법으로 이어지기까지는 상당한 정치적 장벽이 있다. 트럼프 대통령이 거부권을 행사할 경우 이를 무력화하려면 상·하원에서 각각 출석 투표 의원의 3분의 2 이상 찬성이 필요하다. 민주당은 이번 선거에서 현재까지 상원 54석, 하원 253석을 확보했지만, 거부권을 무력화할 수준의 의석에는 미치지 못해 공화당 의원들의 협조가 필요하다. 민주당은 캐나다 관세 철폐를 시작으로 대통령의 일방적인 관세 부과 권한을 제한하고 의회의 통제권을 강화하는 방향으로 무역 정책을 손보겠다는 구상이다. 의회 관계자들은 캐나다 관세의 근거가 된 1930년 관세법 제338조와, 무역적자 등에 대응해 대통령이 한시적으로 추가 관세를 부과할 수 있도록 한 1974년 무역법 제122조 등 대통령의 관세 부과 권한을 제한하는 방안도 검토 대상이 될 수 있다고 말했다. 다만 미국 무역법의 근본적인 개정으로 이어지기는 쉽지 않을 전망이다. 철강·알루미늄·자동차 등 특정 산업에 대한 관세의 근거가 되는 1962년 무역확장법 제232조와, 강제 노동 의혹을 근거로 60개국에","category":"생활·문화"},{"title":"NYT “뉴진스 계약, 이례적으로 공격적…미성년 보호조항 없어 불공정”","link":"https://n.news.naver.com/mnews/article/016/0002719622","naverLink":"https://n.news.naver.com/mnews/article/016/0002719622","pubDate":"2026-11-07T10:08:38.684046+09:00","author":"네이버뉴스","description":"그룹 뉴진스. [헤럴드POP(현 헤럴드뮤즈) 제공] [헤럴드경제=장연주 기자] 그룹 뉴진스의 멤버들이 미성년자 시절 소속사 어도어와 체결한 전속계약에 미성년자 보호 조항이 빠지는 등 불공정한 내용이 포함됐다고 뉴욕타임스(NYT)가 보도해 눈길을 끈다. NYT는 5일(현지 시간) 뉴진스 멤버 5명이 만 14~17세였던 2022년 체결한 전속계약서를 입수했다며 이 같이 밝혔다. NYT는 뉴진스와 어도어의 계약서를 입수해 분석한 결과, 미성년자 보호조항, 성형 비용 부담, 행동 제한, 위약벌 산정 방식, 계약 종료 이후 초상권 조항 등 멤버들의 권리를 침해하는 조항들이 다수 발견됐다고 보도했다. 이에 대해 NYT는 법률 전문가 5명의 검토를 거쳤는데, 이 중 한명인 서울의 엔터테인먼트 전문 노종언 변호사는 “이례적으로 공격적인 계약”이라고 평가했다고 덧붙였다. NYT는 먼저 뉴진스의 계약서에 대해 ‘아동 보호 관련 문구가 없다’고 지적했다. 뉴진스 멤버들은 12살이라는 어린 나이에 기숙사 생활을 시작했으며, 새벽 2시까지 리허설을 하는 것은 드문일이 아니었다고 익명을 요구한 관계자는 밝혔다. NYT에 따르면, 멤버들이 연습을 하는 구역에는 폐쇄회로(CC)TV가 설치돼 있었고, 멤버 5명 중 4명은 연습 도중 학교를 그만뒀다. 이에 대해 하이브 관계자는 “회사가 아동보호법을 철저히 준수하며, 출연진들이 안전한 환경에서 일하고 훈련받을 수 있도록 최선을 다하고 있다”고 밝혔다. 이어 “소속 아티스트들에게 학업을 중단하도록 강요하거나 휴식을 취하는 것에 대해 불이익을 주지 않는다”고 해명했다. 하지만 NYT는 입수한 이메일을 통해, 해당 계약 조건이 사실상 협상 불가능한 것이었다고 지적했다. 예컨데, 2022년 1월 한 멤버의 어머니가 계약서에 서명하기 전 여러가지 변경사항을 요청했는데, 어도어 측 부사장이 “만약 위에 언급된 사항들을 포함해 현재 계약 초안에 동의하지 않으신다면, 계약 자체를 재고해 보는 것이 최선일 수 있다”고 답변한 사실을 공개했다. 뉴진스의 계약서에는 피부 관리, 성형 수술, 체형 교정 등 미용 관련 비용도 멤버들이 부담한다는 조항도 있었다. 멤버들은 연습생 시절 성형수술 및 기타 미용 시술에 회사가 지출한 금액의 상당 부분을 상환해야 했다는 것. 이에 대해 하이브 측 관계자는 “개인의 의사에 반하는 성형수술이나 시술을 권유하지도 않는다”고 NYT에 말했다. 계약서에는 또 계약 종료 이후에도 멤버들","category":"생활·문화"},{"title":"'배달기사가 내 짜장면 먹었다' 논란에…배민 \"고객 음식 아냐\"","link":"https://n.news.naver.com/mnews/article/277/0005839318","naverLink":"https://n.news.naver.com/mnews/article/277/0005839318","pubDate":"2026-11-07T10:03:02.328201+09:00","author":"네이버뉴스","description":"배민 \"폐기 처리한 음식\" 배달 음식 섭취 시 강한 제재 '배달 기사가 고객이 주문한 음식을 몰래 먹고 있었다'는 의혹에 대해 배달의민족 측이 \"폐기 처리한 음식을 먹은 것\"이라고 해명했다. 배달의민족 배달기사의 음식 무단 취식 의혹이 제기된 당시 모습. 배민 측은 음식이 파손돼 처리하는 과정에서 발생한 오해라고 해명했다. 스레드 캡처. 지난 5일 배달의민족 물류 서비스를 전담하는 우아한청년들은 입장문을 내고 \"전날(4일) 사회관계망서비스(SNS)에 배달 기사가 고객 주문 음식을 먹었다는 취지의 게시물이 올라왔다\"며 \"해당 건을 접수해 경위를 확인했으며 확인 결과와 당사 입장을 공유한다\"고 밝혔다. 이어 \"확인 결과 음식은 라이더가 비용을 부담하는 것으로 처리된 상황(자부담)\"이라며 \"고객이 파손 처리를 하는 과정을 목격해 오해가 생겼다\"고 설명했다. 그 러면서 \"고객께는 재조리된 음식과 함께 소정의 보상을 제공했다\"고 덧붙였다. 그러면서 우아한청년들은 배달 기사가 주문 음식을 전달하지 않고 임의로 먹는 행위에 대해서는 엄격한 제재 기준을 적용하고 있다고 강조했다. 회사 측은 \"고객 주문 음식을 전달하지 않고 취식하는 등 부정행위가 확인될 경우 '배민 커넥트' 이용 제한까지 가능한 강도 높은 정책을 운용하고 있다\"고 했다. 앞서 SNS에는 용인에 거주 중인 A씨가 \"아이들과 먹으려고 중국집에서 짜장면과 탕수육 등 여러 음식을 주문했다\"며 \"예정 시간이 지나도록 음식이 도착하지 않아 앱을 통해 기사의 위치를 확인했다\"고 적었다. 이어 그는 \"배달 기사가 우리 집으로 와야 하는데 오지 않길래 위치를 확인했더니 창밖으로 보이더라\"며 \"창밖으로 보니 배달 기사가 집 건너편에서 주문한 음식을 먹고 있었다\"고 주장했다. 글을 쓴 A씨에 따르면 배달 기사는 주변에서 쉽게 발견하기 어려운 집 맞은편 다리 아래서 배달할 음식을 개봉해 먹고 있었다. A씨는 글과 함께 배 달 기사의 뒷모습이 담긴 사진을 함께 공개했다. 배달의민족 측이 입장을 낸 후 A씨는 \"오늘(5일) 갑자기 환불해준다고 전화를 해주더라\"며 \"일단 상황 전달을 저에게 충분히 주지 못했으나 플랫폼이 잘못했다고는 생각하지 않지만, 이런 상황이 재발하지 않길 바라는 마음에 게시글을 올린 것\"이라 고 강조했다. 아울러 \" 플랫폼에 악의적인 마음은 없다. 해당 기사가 그렇다고 하는데 뭐 어쩌겠는가\"라면서도 \" 기사가 손을 입으로 가져가며 오토바이 주변을 서성이는 모습을","category":"생활·문화"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활·문화"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활·문화"}],"세계":[{"title":"트럼프, '대선 공신' 와일스 경질... '강경파' 밀러 전면 배치","link":"https://n.news.naver.com/mnews/article/469/0000964178","naverLink":"https://n.news.naver.com/mnews/article/469/0000964178","pubDate":"2026-11-07T11:20:17.990287+09:00","author":"네이버뉴스","description":"의회 내주고도 타협 대신 돌파 反이민 설계자 앞세운 백악관 미 백악관 비서실장에 발탁된 스티븐 밀러(오른쪽). EPA 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거 참패 사흘 만인 6일(현지시간) 수지 와일스 백악관 비서실장을 경질하고, 후임에 강경파 최측근인 스티븐 밀러 백악관 부비서실장을 발탁했다. 선거 패배에 따른 정책 기조 수정 대신 정권 내 최고 강경론자를 전면에 내세워 정면 돌파를 선택했다는 평가가 나온다. 트럼프 대통령은 이날 자신의 사회관계망서비스(SNS)인 트루스소셜을 통해 \"오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다\"고 발표했다. 트럼프 대통령은 밀러를 향해 \"내가 가장 신뢰하는 참모 중 한 명\"이라고 치켜세웠다. 와일스 실장에 대해선 \"훌륭한 일을 해냈고 감사하다\"며 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 했다. 트럼프 대통령은 이후 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 중간선거 패배에 따른 문책성 인사라는 점을 암시했다. 대선 일등공신의 퇴장… 예견된 불화설 도널드 트럼프 2기 미국 행정부의 백악관 비서실장에서 경질된 수지 와일스. AP 연합뉴스","category":"세계"},{"title":"지드래곤 마음도 훔친 차였는데…테슬라 '사이버트럭' 3년 만에 단종 수순","link":"https://n.news.naver.com/mnews/article/030/0003483161","naverLink":"https://n.news.naver.com/mnews/article/030/0003483161","pubDate":"2026-11-07T11:20:17.990285+09:00","author":"네이버뉴스","description":"테슬라의 전기차 픽업트럭인 '사이버트럭'. 사진=AP연합뉴스 테슬라가 야심 차게 내놓은 전기 픽업트럭 사이버트럭의 생산을 단계적으로 축소한다. 당초 연간 50만대 판매를 목표로 내세웠지만 실제 판매량이 기대에 크게 못 미친 데다, 회사가 자율주행 사업에 생산 역량을 집중하면서다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 엑스(X)를 통해 내년 중반부터 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄일 계획이라고 밝혔다. 생산 공간은 차세대 자율주행 차량인 사이버캡 제조에 활용할 예정이다. 텍사스 오스틴 기가팩토리는 사이버트럭의 특수 부품을 생산하는 유일한 시설이다. 이에 따라 생산 축소는 사실상 모델 단종 수순으로 해석된다. 머스크 CEO 역시 관련 결정에 대해 '한 시대의 끝'이라고 언급했다. 2019년 11월 처음 공개된 사이버트럭은 스테인리스 스틸 외장과 파격적인 각진 디자인으로 자동차 업계의 주목을 받았다. 테슬라는 제너럴모터스(GM)와 포드가 주도해온 미국 픽업트럭 시장에 도전장을 내밀며 연간 판매량 50만대를 목표로 제시했다. 하지만 실제 시장 성과는 기대에 미치지 못했다. 복잡한 생산 공정과 부품 수급 문제 등으로 출시가 지연됐고, 2023년 말 고객 인도가 시작된 이후에도 판매 확대에 어려움을 겪었다. 자동차 데이터 업체 켈리 블루북에 따르면 지난해 사이버트럭 판매량은 2만237대에 그쳤다. 당초 제시한 연간 판매 목표의 4% 수준이다. 디자인에 대한 소비자 호불호와 높은 가격, 조립 품질 논란, 잇따른 리콜 등이 수요 확대의 걸림돌로 작용했다. 테슬라는 사이버트럭 생산 축소를 계기로 사업 전략의 무게중심을 전기차에서 인공지능(AI)과 자율주행으로 옮기고 있다. 사이버캡 양산을 확대하는 동시에 휴머노이드 로봇 옵티머스 개발과 생산에도 역량을 투입하는 모습이다. 앞서 테슬라는 캘리포니아 공장의 모델S와 모델X 생산을 중단하고 해당 공간을 옵티머스 생산시설로 전환하겠다는 계획도 공개했다. 이번 사이버트럭 생산 축소 역시 같은 맥락으로 풀이된다. 전기 픽업트럭 시장에서 기대했던 성과를 거두지 못하자 생산 자원을 자율주행과 로봇 등 차세대 사업으로 재배치하는 것이다. 사이버트럭은 테슬라가 전기차 시장의 외연을 넓히기 위해 내놓은 상징적인 모델이었다. 그러나 대량 생산과 대중적 수요 확보라는 과제를 해결하지 못한 채 생산 축소라는 결정을 맞게 됐다. 테슬라가 자동차 제조업체","category":"세계"},{"title":"트럼프, 백악관 비서실장 전격 교체…강경파 밀러 발탁","link":"https://n.news.naver.com/mnews/article/014/0005600755","naverLink":"https://n.news.naver.com/mnews/article/014/0005600755","pubDate":"2026-11-07T11:20:17.990284+09:00","author":"네이버뉴스","description":"중간선거 참패 사흘 만에 인적 쇄신…9일부터 업무 와일스는 정치조직으로 이동…추가 개각 가능성 주목 반이민 정책 주도한 최측근 기용에 강경노선 강화 전망 스티븐 밀러 백악관 부비서실장. 연합뉴스 [파이낸셜뉴스] 도널드 트럼프 미국 대통령이 중간선거에서 공화당이 패배한 지 사흘 만에 백악관 비서실장을 교체했다. 후임에는 강경 이민정책을 주도해온 최측근 스티븐 밀러(41) 백악관 부비서실장을 발탁했다. 이번 인사를 계기로 백악관과 행정부 전반에 걸친 인적 개편이 이어질지 관심이 쏠린다. 6일(현지시간) 트럼프 대통령은 자신의 사회관계망서비스(SNS) 트루스소셜을 통해 밀러 부비서실장을 신임 백악관 비서실장으로 임명한다고 밝혔다. 밀러는 오는 9일부터 공식 업무를 시작한다. 트럼프 대통령은 밀러를 자신이 가장 신뢰하는 참모 중 한 명이라고 소개했다. 기존 비서실장인 수지 와일스에 대해서는 그간의 헌신에 감사를 표하며 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 예정이라고 설명했다. 다만 해당 조직의 구체적인 성격이나 와일스가 맡을 직책은 공개하지 않았다. 밀러는 엑스(X·옛 트위터)를 통해 비서실장으로 임명된 데 대해 영광스럽다는 입장을 밝혔다. 와일스 역시 백악관에서 트럼프 대통령을 보좌한 경험을 평생의 영광으로 평가하며 \"내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것\"이라고 전했다. 이번 인사는 지난 3일 치러진 중간선거에서 공화당이 연방 상원과 하원 모두 민주당에 다수당 지위를 내준 직후 단행됐다. 트럼프 대통령은 이날 백악관에서 취재진에게 와일스의 업무 수행을 긍정적으로 평가하면서도 변화를 원했다고 밝혀 선거 결과가 인사 결정에 영향을 미쳤음을 시사했다. 와일스는 2024년 미국 대선에서 트럼프 대통령의 선거대책위원장을 맡아 승리에 기여한 인물이다. 미국 최초의 여성 백악관 비서실장으로 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 다만 최근 트럼프 대통령과 와일스의 관계가 예전 같지 않다는 관측이 제기됐다. 뉴욕타임스(NYT)는 백악관 사정에 밝은 관계자들을 인용해 트럼프 대통령이 와일스를 주요 인사 결정 과정에서 제외하는 일이 있었다고 보도했다. 특히 캐롤라인 레빗 전 백악관 대변인의 후임 인선을 와일스와 협의하지 않고 진행했으며, 이미 승인한 사안을 두고도 다른 참모들 앞에서 와일스를 질책한 것으로 전해졌다. 중간선거 이후에는 와일","category":"세계"},{"title":"잇단 리콜에 판매 3% 굴욕…‘GD 차’ 사이버트럭 결국 단종","link":"https://n.news.naver.com/mnews/article/025/0003563474","naverLink":"https://n.news.naver.com/mnews/article/025/0003563474","pubDate":"2026-11-07T11:20:17.990282+09:00","author":"네이버뉴스","description":"가수 지드래곤(GD)이 해외 일정을 위해 지난 2024년 11월 4일 인천국제공항 2터미널에 도착해 테슬라의 전기 픽업트럭 '사이버트럭(Cybertruck)'에서 하차하고 있다. 뉴스1 가수 지드래곤(GD)이 여러 공식 석상에 타고 등장해 화제가 되기도 했던 테슬라의 전기차 모델 사이버트럭이 단종되게 됐다. 테슬라가 픽업트럭 시장에 야심 차게 진출했지만 저조한 판매량을 이겨내기 못한 이유다. 로이터통신에 따르면 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 엑스(X)에서 “내년 중순께 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄여나갈 예정”이라며 “사이버캡 생산을 위한 공간을 확보하기 위한 결정”이라고 밝혔다. 텍사스 오스틴 기가팩토리는 사이버트럭 특수 부품을 제조할 수 있는 유일한 시설이다. 이에 사실상 사이버트럭의 단종을 의미하는 것으로 해석된다. 머스크도 X 이용자의 질문에 “(사이버트럭은) 테슬라가 지금까지 만든 최고의 차량”이라며 이번 결정에 대해“한 시대의 끝”이라고 아쉬움을 드러냈다. 지난 2019년 처음 공개된 사이버트럭은 2023년 공식 출시됐다. 당시 머스크는 사이버트럭이 미국에서 꾸준히 인기를 얻던 제너럴모터스(GM)와 포드의 픽업트럭과 경쟁할 것이라고 기대했다. 연간 판매량을 50만대로 예상하기도 했다. 머스크는 사이버트럭을 그 어떤 차량 모델보다 튼튼하다고 강조해 왔지만 호불호가 갈리는 각진 디자인과 반복되는 리콜 문제, 비싼 가격 등으로 인해 판매량은 저조했다. 또 지나치게 밝은 주차등, 강철 트림 부품 이탈, 인버터 결함, 글자 크기가 너무 작은 경고등 같은 문제로 잇달아 리콜이 이뤄졌다. 블룸버그 통신은 “테슬라의 사이버트럭이 출시 2년도 되지 않아 리콜 횟수로 두 자릿수를 기록했다”며 “시장에서 제대로 자리 잡지 못한 이 모델은 문제로 점철된 행보를 이어가고 있다”고 지적했다. 테슬라는 사이버트럭의 판매량을 밝히지 않고 있지만 지난 분기 모델 S·모델 X와 사이버트럭을 합친 글로벌 인도량은 테슬라 전체 인도량의 약 3%를 조금 넘는 수준에 그쳤다. 자동차 데이터 플랫폼 켈리 블루북에 따르면 지난해 사이버트럭 판매량은 2만237대에 불과했다. 그마저도 머스크가 이끄는 또 다른 회사인 스페이스X가 주로 사들인 것으로 나타났다. 한편 테슬라는 전기 자동차 판매에서 벗어나 점점 인공지능(AI) 자율주행 기능을 갖춘 로보택시와 휴머노이드 로봇 개발 및 생산에 집중하고 있","category":"세계"},{"title":"젤렌스키, \"전후 안보 지원 구체적 보장 원한다\"","link":"https://n.news.naver.com/mnews/article/003/0014307540","naverLink":"https://n.news.naver.com/mnews/article/003/0014307540","pubDate":"2026-11-07T11:20:17.990270+09:00","author":"네이버뉴스","description":"브뤼셀 동맹국 회의 뒤 강조 트럼프 종전 낙관 전망에 EU 대변인은 \"갈 길 멀다\" [브뤼셀=AP/뉴시스] 2026년 지난달 16일(현지시각0 볼로디미르 젤렌스키 우크라이나 대통령이 벨기에 브뤼셀에서 열린 유럽연합(EU) 정상회의 기자회견에서 발언하고 있다. 2026.11.7. [키이우=AP/뉴시스] 강영진 기자 = 볼로디미르 젤렌스키 우크라이나 대통령이 5일(현지시각) 5년 동안의 전쟁이 마침내 끝날 경우 전후 안보 지원이 어떤 방식으로 이뤄질지에 관해 서방 동맹국들로부터 구체적인 보장을 얻으려 하고 있다고 밝혔다. 이날 늦게 방송된 인터뷰에서 나온 젤렌스키의 발언은 전후 안보와 재건을 중점적으로 논의한 브뤼셀 동맹국 회의가 진행된 뒤 나왔다. 또 우크라이나와 러시아, 미국이 다음 주 아부다비에서 열 예정인 3자 회담을 앞두고 나온 발언이기도 하다. 이 회담은 지난 2월 이후 처음 열리는 3자 평화 협상이다. 브뤼셀에서 이틀간 열린 회의에서는 전후 재건과 2027년 자금 조달, 그리고 우크라이나 정부의 서방 동맹국들이 뒷받침하는 안보 보장이 논의됐다. 루스템 우메로우 우크라이나의 수석 협상대표는 온라인 게시물에서 미국과 영국, 프랑스, 독일, 유럽연합(EU) 당국자들과 세계은행(WB), 미국 투자회사 블랙록의 대표들이 회의에 참석했다고 밝혔다. 우메로우는 “러시아가 우크라이나와 유럽 전체에 가하는 위협, 그리고 이에 대응하기 위한 공동 조치도 별도로 논의했다”고 썼다. 젤렌스키는 인터뷰에서 실질적인 성과를 보고 싶다고 말했다. 젤렌스키는 우크라이나 민영 방송사 1+1과의 인터뷰에서 “중요한 것은 문서에 명확하게 명시되는 것”이라고 말했다. 그는 “수십 개의 항목이 중요한 게 아니라 결과에 대한 이해가 중요하다. 러시아가 다시 공격을 시작하면 어떤 일이 벌어지는가? 누가 무엇을, 어떤 수단으로, 언제 할 것인가?”라고 말했다. 젤렌스키는 미국에서 우크라이나를 지지하는 초당적 지원을 유지하는 것이 중요하다고 말했다. 그러나 이번 주 중간선거에서 민주당이 압승한 것이 미국의 지원에 긍정적인 영향을 미칠 수 있다고 인정했다. 그는 “미국으로부터 추가 지원을 받을 가능성이 이제 더 커질 수 있다고 생각한다”고 말했다. 한편 도널드 트럼프 미 대통령은 5일 워싱턴에서 키릴 드미트리예프 러시아 특사를 만났지만, 두 사람이 어떤 내용을 논의했는지는 구체적으로 밝히지 않았다. 트럼프는 “합의가 이뤄질 것이다. 그것은 큰 합의","category":"세계"},{"title":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T11:20:17.990268+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"트럼프 \"선거 후 증시 3조달러 증발\"...민주당 승리 탓?","link":"https://n.news.naver.com/mnews/article/014/0005600779","naverLink":"https://n.news.naver.com/mnews/article/014/0005600779","pubDate":"2026-11-07T11:20:17.990223+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령. 연합뉴스 [파이낸셜뉴스] 도널드 트럼프 미국 대통령이 중간선거 이후 미국 증시가 급락한 것을 두고 \"우리나라가 선거 때문에 3조달러(약 4070조원)를 잃었다\"고 말했다. 공화당 패배에 대해서는 \"나는 투표용지에 없었다\"며 책임론에 선을 그었다. 트럼프 대통령은 6일(현지시간) 플로리다주 케네디우주센터에서 열린 항공우주 기술 행사 '업 서밋(UP.Summit)' 연설에서 \"어제 3조 달러가 사라졌다\"며 \"만약 3조 달러를 벌었다면 더 불쾌했을 것\"이라고 말했다. 공화당이 선거에서 패배한 뒤 증시가 하락한 것을 민주당 승리에 대한 시장의 부정적 반응으로 해석한 것이다. 이어 \"혹시 궁금해할까 봐 말하는데, 나는 이번 선거에 출마하지 않았다. 내가 투표용지에 있었다면 이겼을 것\"이라고 덧붙였다. 중간선거가 민주당의 상하원 다수당 장악으로 마무리된 가운데 5일 뉴욕증시에서는 나스닥100 지수가 2020년 이후 하루 기준 최대 낙폭을 기록했다. 트럼프 대통령은 고용지표를 두고 자신의 경제 성과로 강조했다. 트럼프 대통령은 이날 발표된 10월 고용보고서를 두고 \"놀라운 고용 수치를 기록했다\"며 제조업 증가 폭에 대해서는 \"수십 년 만의 최대\"라고 주장했다. 미 노동부에 따르면 10월 비농업 일자리는 16만5000개 늘어 시장 예상치인 6만5000개 안팎을 크게 웃돌았다. 제조업 일자리도 1만9000개 증가했다. 인공지능(AI) 분야에서는 미국이 경쟁에서 앞서 있다고 강조했다. 그는 \"누가 이기든 초지능(superintelligence)을 차지하는 쪽이 이긴다\"며 \"트럼프 행정부에서 승자는 언제나 미국일 것이고 지금 우리가 앞서 있다\"고 말했다. 이어 \"3주 전 백악관에서 시진핑 중국 국가주석과 이 문제를 이야기했다\"며 \"그는 전력을 다하고 있고 우리가 잘하고 있다고 축하해줬다\"고 전했다. 이란에 대해서는 핵무기 보유를 허용하지 않겠다는 입장을 재확인했다. 그는 \"1년여 전 B-2 폭격기를 보내지 않았다면 이스라엘은 지구상에서 사라졌을 것\"이라며 \"이란은 절대 핵무기를 갖지 못할 것\"이라고 말했다. 트럼프 대통령은 이번 선거에서 승리한 공화당 인사들도 치켜세웠다. 그는 바이런 도널즈 하원의원의 플로리다 주지사 당선을 축하하며 \"그는 힘든 방식으로, 열심히 일해서 이겼다\"고 말했다. 이날 연설은 트럼프 대통령이 수지 와일스 백악관 비서실장 후임으로 스티븐 밀러 부비서실장을 기용한다고 발표한 지","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T11:20:17.677209+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"},{"title":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?","link":"https://n.news.naver.com/mnews/article/053/0000062883","naverLink":"https://n.news.naver.com/mnews/article/053/0000062883","pubDate":"2026-11-07T10:58:34.243482+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령이 지난 9월 17일(현지시간) 백악관 로즈가든에서 열린 만찬 중 연설하고 있다. photo AP·뉴시스 지난 11월 3일(현지시간) 치러진 미국 중간선거에서 민주당이 상·하원을 동시에 탈환했다. 민주당이 '여소야대'로 미 의회 주도권을 확보하면서 도널드 트럼프 행정부에 대한 견제가 강화될 것으로 보인다. '블루 웨이브'를 넘어 압승을 거둔 '블루 쓰나미'가 현실화하면서 미국의 통상정책을 둘러싼 우리나라의 셈법도 복잡해질 전망이다. 정치권에 따르면 정부는 이번 미 중간선거 결과를 두고 청와대를 비롯해 외교부와 국방부, 재정경제부와 산업통상부 등 관계 부처를 중심으로 국내 외교·안보 및 산업·통상 환경에 미칠 영향에 대한 분석에 착수했다. 관계 부처 합동대책회의를 열고 불확실성에 따른 대응 방안을 다각도로 검토해 철저한 리스크 관리에 돌입한다는 방침이다. 특히 양국 간 통상 환경 변화 등을 예단하지 않고 신중한 입장을 취하면서, 구체적 대미 전략투자 실행에 따른 경제안보 협력 증진에 집중할 계획이다. 청와대 관계자는 \"미 상·하원 의석 변화에 따른 대처 방안을 꾸준히 검토하고 있다\"며 \"그동안 한·미 관계가 간단치 않았기 때문에 청와대 모든 부서와 관계부처가 주시하고 있다\"고 전했다. 국회에선 여야가 함께하는 한미의원연맹이 오는 12월 중순 미국 방문 계획을 추진하고 있다. 중간선거 이후 새롭게 구성되는 미국 상·하원 의원뿐만 아니라 주요 부처 인사들과 만나 한·미 외교·통상 관련 현안을 논의한다는 방침이다. 이에 앞서 이달 10일 이사회와 총회를 열어 지도부 구성 등 협력 채널을 정비하고, 구체적 방미 일정과 대표단 구성 등을 논의할 예정이다. 조정식 국회의장 선출로 현재 공석인 민주당 측 공동회장에 대통령 평화외교특별보좌관인 6선 송영길 의원을 선출하는 절차가 이뤄지고 있다. 국민의힘 측 공동회장은 6선 조경태 의원이 맡고 있다. 한미의원연맹 여당 간사인 김영배 민주당 의원은 주간조선과 통화에서 \"12월 중순 방미해 대미 전략투자 1~3호 관련 사안을 점검하고 우리의 역할이 있는지 살펴볼 예정\"이라며 \"미 국무부, 상무부, 에너지부 등 정부 부처 인사들과 유관 상·하원 상임위원회 소속 의원들은 물론 다수당(민주당) 지도부도 직접 만날 것\"이라고 밝혔다. 그러면서 \"여소야대로 트럼프 행정부 자체 힘만으로는 잘 굴러갈 수 없겠지만, 미국의 통상 정책 등 국정 기조는 단기간에 달라지지 않을","category":"세계"},{"title":"트럼프 \"관세 없애면 韓·日 등서 제품 들어와\"…이란엔 공격 위협","link":"https://n.news.naver.com/mnews/article/421/0009273414","naverLink":"https://n.news.naver.com/mnews/article/421/0009273414","pubDate":"2026-11-07T10:58:34.243364+09:00","author":"네이버뉴스","description":"관세정책 고수…'국경 완화' 텍사스 새 주지사엔 \"안 하면 내가 한다\" 헤그세스 경질설엔 재차 선 그어…\"환상적으로 일하고 있다\" 도널드 트럼프 미국 대통령. 2026.11.4 ⓒ 로이터=뉴스1 (워싱턴=뉴스1) 이훈철 특파원 = 도널드 트럼프 대통령이 중간선거 참패 이틀 만에 관세를 유지하겠다는 뜻을 분명히 밝히면서 \"관세를 없애면 기업들이 한국 등에서 물건을 보낼 것\"이라고 말했다. 공화당 안에서 패배 원인으로 꼽힌 관세와 이란 전쟁을 거둬들이기는커녕, 이란에는 추가 공격 가능성까지 내비쳤다. 트럼프 대통령은 5일(현지시간) 백악관에서 각료회의를 마친 뒤 취재진과 만나 \"지금 관세를 없애면 미국에서 짓고 있는 공장들이 전부 즉시 공사를 멈출 것\"이라고 말했다. 이어 \"전국에 반쯤 지은 공장들만 남고, 기업들은 중국·일본·한국·필리핀 등에서 물건을 보낼 것\"이라고 했다. 그는 \"공장을 짓지 않고 미국에 물건을 팔면 50%, 100%, 150%, 250%, 심지어 300%의 관세를 내야 한다\"며 \"공장을 지어 문을 열면 관세를 내지 않는다\"고 설명했다. 또 미국이 \"역대 최고 수준인 22조 2000억 달러(약 2경 9795조 원)\"의 투자를 유치했고 3000개가 넘는 공장이 지어지고 있다고 주장했다. 그는 \"앞으로 1~2주 동안 많은 것을 보게 될 것\"이라며 \"물가도 크게 내려갈 것\"이라고 말했다. 이란에 대해서는 공세 수위를 끌어올렸다. 트럼프 대통령은 \"이제 더 나아가 다시는 (위협이) 일어나지 않도록 확실히 매듭지을지 결정할 것\"이라며 \"가능하면 나머지 지역까지 파괴하고 싶지 않지만, 어쩌면 그래야 할지도 모른다. 곧 알게 될 것\"이라고 말했다. 이란이 중재국들의 핵 협상안을 검토 중이라는 보도에는 \"그들은 우리 승인 없이 아무것도 하지 않는다\"며 \"이란은 절대 핵무기를 갖지 못할 것\"이라고 답했다. 국경 정책도 물러서지 않았다. 트럼프 대통령은 민주당의 지나 히노호사 텍사스 주지사 당선인이 국경 경비에 투입된 주 인력을 줄이려 한다는 질문에 \"그들이 내 정책을 이어가지 않으면 내가 하겠다\"며 연방 차원의 개입을 경고했다. 텍사스는 2021년부터 주방위군과 주 경찰을 국경에 배치하는 '론스타 작전(Operation Lone Star)'을 벌여 왔다. 텍사스는 이번 선거로 30여 년 만에 민주당 주지사가 나왔다. 히노호사 당선인은 선거운동 기간 \"주지사가 되면 국경 안보에 힘쓰되, 텍사스 주민의 돈을 정치","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T11:20:18.315378+09:00","author":"네이버뉴스","description":"[사진=오픈AI] [디지털데일리 이상일기자] 오픈AI(OpenAI)가 기업가치 1조2500억달러(약 1840조원)를 인정받는 투자 라운드의 첫 단계로 110억달러(약 16조원)를 조달했다. 당초 목표였던 300억달러 이상의 절반에도 못 미치는 규모다. 기업공개(IPO)를 미룬 데 이어 투자 유치 목표도 낮춘 것이다. 월스트리트저널(WSJ)은 6일(현지시간) 이 사안을 잘 아는 소식통을 인용해 이같이 보도했다. 소식통들은 11월6일 자금이 회사로 입금됐다고 전했다. 이번 라운드 총액은 최대 200억달러(약 29조원)까지 늘어날 수 있다. 나머지 자금은 몇 주 안에 들어올 전망이다. 오픈AI는 논평을 거부했다. 오픈AI는 IPO 계획을 연기한 뒤 한 달 넘게 투자 유치 협상을 벌여 왔다. 블룸버그는 9월12일 샘 올트먼 최고경영자(CEO)가 포천(Fortune)과 인터뷰에서 IPO가 2027년 전에는 이뤄지지 않을 것이라고 밝혔다고 전했다. 블룸버그는 9월29일 오픈AI가 기업가치 1조4000억달러 기준으로 300억달러 이상을 조달할 계획이라고 보도했다. 이후 공개 시장이 급락하자 오픈AI는 계획을 축소했다. 이번 기업가치는 당초 목표보다 1500억달러 낮다. 투자 라운드가 시작된 뒤 AI 시장 분위기도 바뀌었다. AI 물리 인프라에 대한 과도한 지출 우려가 커졌다. 미국 중간선거 이후 데이터센터 건설에 새로운 장애물이 생길 수 있다는 관측도 나온다. WSJ는 오픈AI의 조달 목표 축소를 AI 붐을 이끈 기업의 큰 방향 전환으로 평가했다. 오픈AI는 3월 투자 라운드에서 기업가치 8520억달러를 인정받아 1220억달러를 조달했다. 이번 평가액은 그보다 약 47% 높다. 다만 1차 조달액은 3월 조달액의 10분의 1에 못 미친다. 남은 최대 90억달러 유치 여부는 아직 확정되지 않았다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T11:20:18.315376+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T11:20:18.315374+09:00","author":"네이버뉴스","description":"데이터센터 가동 늦어지면 투자 회수 지연…차입·보증 부담 주목 메타 등급 전망·오라클 등급 하향…네이버는 수요 맞춘 투자로 차별화 MS 나델라, 과거 클라우드 투자 사례 제시…AI 에이전트 확산에 기대 [워싱턴=AP/뉴시스]도널드 트럼프 미국 대통령이 29일(현지 시간) 백악관에서 젠슨 황 엔비디아 최고경영자(CEO), 일론 머스크 테슬라 CEO, 마크 저커버그 메타 CEO 등 인공지능(AI) 관련 업계 수장들과 오찬 후 취재진에 발언하고 있다. 2026.09.30. [서울=뉴시스]오동현 기자 = 글로벌 빅테크 기업들이 인공지능(AI) 데이터센터와 반도체 확보에 천문학적인 자금을 쏟아붓고 있다. 하지만 막대한 투자금을 과연 언제, 얼마나 회수할 수 있을지를 두고 회의론이 커지면서 시험대에 올랐다. 미국 중간선거 이후 데이터센터 건설 규제가 강화될 수 있다는 시장 우려까지 더해지면서다. 다만 AI 에이전트가 기업 실무 현장에 본격적으로 쓰이기 시작한 만큼, 당장의 지출 부담만으로 AI 산업 전체를 위기로 단정하는 건 상당히 과장된 해석이라는 반론도 팽팽하다. 국내에서는 시장 수요에 발맞춰 투자 속도를 융통성 있게 조절하는 네이버의 사업 방식이 주목받고 있다. 시설 멈춰도 이자는 쌓인다…'양날의 검'이 된 인프라 투자 데이터센터 사업은 장비와 시설을 사들이는 데 먼저 대규모 자금을 쓰고, 고객에게 AI 연산 서비스를 팔며 투자금을 나중에 회수하는 구조다. 차입금(빚)으로 인프라를 확보한 기업은 데이터센터 가동이 뒤로 밀릴수록 금융비용 이자를 감당하며 버텨야 하는 기간이 길어진다. [텍사스=AP/뉴시스] 젠슨 황 엔비디아 최고경영자(CEO)가 지난 6월16일 텍사스 코히런트 제조시설 확장 착공식에 앞서 포즈를 취하고 있다. 2026.09.04. *재판매 및 DB 금지","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T11:20:18.315372+09:00","author":"네이버뉴스","description":"배경훈 부총리 \"투자 멈추면 안 돼\"…미국 데이터센터 대체 입지 한국의 조건 데이터센터 전경도 [사진=ESR] [디지털데일리 이상일기자, 이안나기자] 미국 중간선거에서 민주당이 연방 상·하원을 모두 장악하면서 데이터센터 규제 강화와 인공지능(AI) 투자 둔화 우려가 커지고 있다. 국내에서는 미국의 건설 지연이 한국에 새 투자 유치 기회가 될 수 있다는 기대가 나온다. 다만 미국에서 계획한 데이터센터 수요를 한국이 흡수하려면 두 가지 조건이 필요하다. 해외로 옮길 수 있는 연산 수요가 있어야 하고, 고객이 원하는 시점에 한국이 전력과 설비를 공급할 수 있어야 한다. 정부는 투자 기조를 유지하겠다는 입장이다. 배경훈 부총리 겸 과학기술정보통신부 장관은 6일 서울 중구 서울스퀘어에서 열린 국가인공지능전략위원회 제3차 전체회의 후 기자들과 만나 \"미국이 주춤거린다고 해도 중국이나 프랑스, 캐나다는 오히려 이를 기회로 삼고 있다\"며 \"한국이 지금의 분위기에 휩쓸려 투자를 멈추면 안 된다고 생각한다\"고 말했다. 배 부총리는 글로벌 빅테크가 AI 기반 새 산업과 서비스를 만들기 위한 투자를 이어갈 것으로 내다봤다. 그는 개인적 전망을 전제로 \"AI에 대한 기대 심리가 크다 보니 조금만 불안한 상황이 생겨도 시장이 출렁인다\"며 \"출렁이면서도 우상향하지 않을까 생각한다\"고 밝혔다. 이 같은 정책 방향이 국내 수주로 이어지려면 미국 규제가 실제로 어떤 사업을 얼마나 늦추는지부터 봐야 한다. 대표 사례인 텍사스의 데이터센터 허가 중단은 민주당 승리 전에 시작됐다. 공화당 소속 그레그 애벗 주지사는 9월21일 텍사스 전력망 운영기관 텍사스전기신뢰도위원회(ERCOT)의 감사가 끝날 때까지 환경품질위원회(TCEQ)가 데이터센터 관련 허가를 내주지 말라고 지시했다. 민주당 지나 이노호사 주지사 당선자는 주민 보호 법률이 마련될 때까지 중단이 필요하다는 입장이다. 규제 장기화 가능성이 제기되지만, 이를 미국 전역의 영구적인 건설 금지로 해석할 근거는 부족하다. 한국전력 지역별 데이터센터 전력공급 완료 현황(2026.2월말 기준) [디지털데일리 가공]","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T11:20:18.315368+09:00","author":"네이버뉴스","description":"은행 대출 조회부터 백화점 예약까지…외부 노출 서비스가 공격 통로 한일 공격서 AI 도구 아르텍스 흔적…동일 공격자 근거는 없어 한국도 일본도 뚫렸다…해커가 노린 '작은 문' [연합 AI 플랫폼 생성 이미지. 재판매 및 DB 금지] (서울=연합뉴스) 심재훈 기자 = 최근 한일 양국이 연이어 터지는 해킹에 의한 대규모 개인 정보 유출에 시달리고 있다. 한국에서는 시중은행의 대출모집인 전용 조회 서비스, 일본에서는 백화점 그룹의 예약 사이트가 개인정보 유출 통로가 됐다. 핵심 전산이 아닌 외부에 노출된 조회·예약 서비스 등을 통해 침입한 해커가 고객정보를 빼 간 것이다. 한일 양국의 잇따른 정보 유출 사건을 분석한 국내 보안업체는 보고서에서 외부에 공개된 업무용 웹페이지와 앱에 연결된 서버, 외부 업체에 맡긴 위탁 서비스를 공통된 취약 지점으로 꼽았다. 해커가 인공지능(AI)으로 취약점을 찾아 공격한 사실은 일본 침해사고 대응 기관의 조사에서 드러났으며, 한국과 일본을 겨냥한 공격에 같은 AI 침투 도구가 쓰인 정황도 나와 한국과 일본 모두 해킹 비상에 걸렸다. 은행 조회에서 백화점 예약까지…정보가 새는 연결 지점 안랩 보안 인텔리전스 센터(ASEC)는 최근 공개한 보고서에서 한국과 일본의 정보 유출 사건을 침입 경로별로 비교했다. 보고서에 따르면 국내 금융권 해킹의 경우 공격자가 파고든 곳은 예금과 이체를 처리하는 은행 핵심 시스템이 아니라 주요 서비스에 딸린 보조 시스템이었다. 금융권 해킹 사례로 대출모집인 전용 조회 서비스와 직원용 영업지원 시스템, 공제 관련 외부 웹페이지가 포함됐다. 사이버 공격을 받은 일본 정보기술(IT) 대기업 GMO 인터넷 그룹의 최고 경영자 [로이터 연합뉴스 자료사진. 재판매 및 DB 금지]","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T11:20:18.315367+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T11:20:18.315362+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T11:20:18.315353+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T11:20:18.315350+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T11:20:18.315339+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-06","weekday":"금요일","label":"보관 · 11월 6일 금요일","total":49,"categories":{"사건 사고":[{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/article/088/0001038903","pubDate":"2026-11-06T23:00:09+09:00","author":"매일신문","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/088/0001038903"},{"title":"“요양보호사가 80대 환자 밀쳐 중상” 가족이 고소···경찰, 수사 착수","link":"https://n.news.naver.com/article/032/0003481193","pubDate":"2026-11-06T22:29:00+09:00","author":"경향신문","description":"전남 나주경찰서. 연합뉴스요양보호사가 80대 환자를 밀쳐 중상을 입혔다는 고소장이 접수돼 경찰이 수사에 나섰다.6일 전남 나주경찰서에 따르면 80대 환자 A씨의 가족은 폭행치상 등 혐의로 나주 한 요양병원의 요양보호사 B씨를 수사해달라는 내용의 고소장을 제출했다.고소인들은 A 문의인 김태균 원장은 당뇨 예방 효과와 당뇨 환자의 혈당 변화, 심혈관질환 및 사망 위험 등을 기준으로 단백질 식품 7종을 비교했다. 그 결과, 콩류·대두 단백질이 1위, 유제품이 2위, 생선이 3위에 올랐다. 닭고기와 달걀은 중립에 가까웠고, 가공하지 않은 붉은 고기와 가공육은 하위권으로 분류됐다. 가장 높은 점수를 받은 콩류는 당뇨 예방과 혈당 관리, 사망 위험 측면에서 모두 좋은 결과를 보였다. 김 원장은 41건의 무작위 대조시험을 종합한 결과를 소개하며 \"콩을 먹었더니 공복 혈당과 공복 인슐린, 당화혈색소가 떨어졌다\"고 말했다. 그는 두부와 대두 단백질, 콩의 성분인 이소플라본도 당뇨 발병 위험을 낮추는 결과가 확인됐다고 설명했다. 유제품 중에서는 저지방 요거트가 당뇨 예방에 도움이 되는 식품으로 꼽혔다. 22개 관찰연구를 종합한 분석에 따르면 하루 80g의 요거트를 섭취한 사람은 그렇지 않은 사람보다 당뇨 발병 위험이 14% 낮았다. 김 원장은 유청 단백질을 탄수화물 식사 15~30분 전에 섭취하면 식후 혈당 상승 폭을 줄일 수 있다는 임상시험 결과도 소개했다. 생선은 단","category":"사건 사고","naverLink":"https://n.news.naver.com/article/003/0014306960"},{"title":"李대통령 \"동티모르와 초국가범죄대응 공조, 무상원조협정 추진\"","link":"https://n.news.naver.com/mnews/article/277/0005839167","naverLink":"https://n.news.naver.com/mnews/article/277/0005839167","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"李, 6일 하무스오르타 동티모르 대통령과 정상회담 양국 정부, 치안·지식재산 등 문건 3건 채택 이재명 대통령은 6일 조제 하무스오르타 동티모르 대통령과 정상회담을 갖고 \"초국가범죄 대응을 위한 공조를 강화하고 노동·교육 협력을 더욱 활성화하기로 했다\"고 밝혔다. 이 대통령은 한국을 공식 방문한 하무스오르타 동티모르 대통령과 이날 청와대에서 정상회담을 가진 뒤 공동언론발표를 통해 이같이 밝혔다. 이 대통령은 \"양국은 '치안협력 기술약정' 체결을 계기로 치안 당국 간 정보 공유를 확대하고 초국가범죄에 대한 공동 대응 역량을 강화해 나가기로 했다\"고 설명했다. 이재명 대통령이 6일 청와대에서 열린 한·동티모르 정상회담 뒤 조제 하무스 오르타 동티모르 대통령과 가진 공동언론발표에서 회담 결과를 발표하고 있다. 2026.11.6 연합뉴스 이와 관련해 우리 경찰청과 동티모르 국립경찰청은 이날 치안 협력을 위한 기술 약정에 서명했다. 두 기관은 초국가 범죄 공동 대응 체계를 구축하고 국외 도피 사범 수사 공조 및 '핫라인' 구축 등에 나선다. 청와대는 초국가 범죄 예방을 위한 공조망 구축과 우리 국민을 대상으로 한 사건·사고의 신속한 수사 협조체계가 기대된다고 부연했다. 또 이 대통령은 \"기후변화 대응 등 미래지향적인 분야에서 실질 협력을 확대하기로 했다\"며 \"양국은 지식재산 포괄협력 양해각서(MOU)를 토대로 지식재산 보호 제도와 경험을 공유하고 동티모르의 지식재산 보호 기반을 강화해 나가기로 했다\"고 강조했다. 이어 \"동티모르의 지속 가능한 경제·사회 발전을 지원하기 위한 개발협력을 강화하기로 했다\"면서 \"우리는 발전 경험을 동티모르와 적극 공유하고 동티모르 국민들이 체감할 수 있는 실질적인 성과로 이어질 수 있도록 함께 노력하기로 했다\"고 언급했다. 그러면서 \"이를 위해 무상원조 기본협정의 조속한 체결을 추진해 개발협력 사업을 보다 안정적이고 체계적으로 추진하기 위한 제도적 기반을 마련하기로 했다\"고 밝혔다. 이재명 대통령이 6일 청와대에서 한국을 공식 방문한 조제 하무스 오르타 동티모르 대통령을 영접하고 있다. 2026.11.6 연합뉴스","category":"사건 사고"},{"title":"무안 돈사서 화재, 돼지 500마리 피해…2시간 30여분 만에 완진","link":"https://n.news.naver.com/mnews/article/421/0009275494","naverLink":"https://n.news.naver.com/mnews/article/421/0009275494","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"(무안=뉴스1) 서충섭 기자 = 6일 오후 8시 29분쯤 전남광주 무안군 청계면 한 돈사에서 불이 났다. 소방당국은 장비 10대와 인원 30명을 투입해 오후 10시 51분 불을 완전히 껐다. 인명피해는 없지만 돼지 500마리가 피해를 입었다. 소방당국은 정확한 화재 원인을 조사 중이다.","category":"사건 사고"},{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/mnews/article/088/0001038903","naverLink":"https://n.news.naver.com/mnews/article/088/0001038903","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"“의사 선생님, 집도 드릴게요” 77억 들여 숙소까지 지은 농어촌…의사 구하기 얼마나 힘들길래","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"의료 인력을 구하기 어려운 농어촌 지역이 의사 유치를 위해 주거 지원책을 마련했다는 기사다.\n숙소 조성에 큰 예산을 투입해 근무 여건을 개선하려는 시도가 소개됐다.\n지역 의료 공백을 줄이는 데 실제로 도움이 될지가 과제로 남는다.","category":"사회"},{"title":"'당선 시 월 20만원 지급 약속' 송인헌 괴산군수 불송치","link":"https://n.news.naver.com/mnews/article/003/0014307397","naverLink":"https://n.news.naver.com/mnews/article/003/0014307397","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[괴산=뉴시스] 송인헌 국민의힘 충북 괴산군수 후보가 27일 괴산군청 브리핑룸에서 기자회견을 열고 11개 읍·면별 맞춤형 공약을 발표하고 있다. 2026.05.27. photo@newsis.com *재판매 및 DB 금지 [괴산=뉴시스] 서주영 기자 = 6·3 지방선거 당시 '군민 1인당 매달 20만원 지급'을 약속한 의혹으로 고발된 송인헌 충북 괴산군수가 불송치 처분을 받았다. 충북경찰청은 공직선거법 위반 혐의로 고발된 송인헌 군수에 대해 불송치 결정했다고 6일 밝혔다. 송 군수는 선거운동 과정에서 문자메시지 등을 통해 당선되면 군민 1인당 매달 20만원을 확정적으로 지급할 것처럼 알린 의혹으로 한 군민에게 고발당했다. 경찰은 송 군수가 해당 사업을 추진하겠다는 취지로 선거운동한 것으로 보고 혐의가 없다고 판단했다. 앞서 송 군수는 농어촌기본소득 사업 대상지로 선정되면 정부 지원금 15만원에 군비 5만원을 더해 주민 1인당 매달 20만원을 지급하겠다는 공약을 내건 바 있다.","category":"사회"},{"title":"강릉 왕산면 대기리서 산불…인력·장비 투입해 진화 중","link":"https://n.news.naver.com/mnews/article/421/0009275500","naverLink":"https://n.news.naver.com/mnews/article/421/0009275500","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"강원 강릉 왕산면 대기리 산불 현장.(강원도 제공. 재판매 및 DB 금지) (강릉=뉴스1) 한귀섭 기자 = 6일 오후 10시 36분쯤 강원 강릉 왕산면 대기리의 한 야산에서 불이 났다. 불이 나자 소방 당국 등은 인력 66명, 장비 24대를 투입해 진화 작업을 벌이고 있다. 이날 오후 11시 기준 현장에는 초속 2.3m의 남서풍이 불었고 습도는 37%였다. 소방 당국 등은 진화가 완료되는 대로 정확한 화재 원인과 피해 면적을 조사할 계획이다. 강원 강릉 왕산면 대기리 산불 현장.(강원도 제공. 재판매 및 DB 금지)","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/056/0012289197","naverLink":"https://n.news.naver.com/mnews/article/056/0012289197","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 내일 부산 광안리에선 가을 밤하늘을 수놓을 대규모 불꽃축제가 열립니다. 행사장 일대는 이미 축제 분위기인데요. 100만 명 넘게 몰릴 것으로 예상돼 인파 관리도 강화됩니다. 보도에 황현규 기자입니다. [리포트] 피고 지기를 반복하며 밤바다를 빛의 향연으로 물들이는 불꽃. 21회째를 맞는 부산불꽃축제가 내일 저녁 광안리 앞바다에서 펼쳐집니다. 올해 주제는 '부산의 꿈'. 지름이 400미터나 되는 초대형 불꽃부터 폭포수처럼 쏟아지는 '나이아가라 불꽃'까지 다채로운 볼거리가 준비됐습니다. 행사장 일대는 벌써 축제 분위기입니다. [윤정화/경기도 평택시 : \"유람선 타다가 불꽃 관광은 부산에서 한번 해봤는데 멋있더라고요. 아이 데리고 와 봤어요.\"] 축제 당일엔 100만 명 넘게 몰릴 것으로 예상돼 안전 관리도 강화됩니다. CCTV 15대가 인파 밀집도를 실시간 파악하고, 일정 인원이 넘으면 진입로를 통제하는 '인파 총량제'가 시행됩니다. [박영율/부산축제조직위원회 기획실장 : \"백사장 해변로에 20만 명 정도가 차게 되면 들어오는 진입 골목을 막아서 우회해서 안전한 곳에서 관람하실 수 있도록...\"] 축제 특수를 노리는 바가지요금은 가장 큰 걱정거립니다. 부산시가 숙박업소 150여 곳을 조사한 결과, 요금이 평소 주말보다 평균 94.5% 올랐습니다. 200% 넘게 올린 곳도 15곳에 달했습니다. 불법 상행위도 우려됩니다. 올해 유료 관람석은 역대 가장 많은 만 7천여 석. 경찰은 사복 경찰관 30여 명을 배치해 암표 거래와 불법 자릿세 징수를 집중 단속하기로 했습니다. KBS 뉴스 황현규입니다. 촬영기자:이한범/영상편집:최지혜 ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"어둠 속 덮친 화마…무안 돼지농장 불 나 500마리 '떼죽음'","link":"https://n.news.naver.com/mnews/article/014/0005600717","naverLink":"https://n.news.naver.com/mnews/article/014/0005600717","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"6일 저녁 8시29분께 전남광주 무안군 한 축사에서 불이 났다. /사진=전남광주소방본부 [파이낸셜뉴스] 전남 무안군의 한 돼지 농장에서 화재가 발생해 사육 중이던 돼지 500여 마리가 폐사하는 등 큰 재산 피해가 났다. 6일 소방당국에 따르면 이날 저녁 8시 29분께 전남 무안군 청계면의 한 돼지 축사(돈사)에서 불이 났다. 신고를 받고 출동한 소방당국은 펌프차 등 장비 12대와 소방대원 34명을 신속히 현장에 투입해 진화 작업에 나섰다. 불은 발생 1시간여 만에 초기 진화됐으며, 2시간 30여 분 만인 밤 10시 51분께 남은 불씨까지 모두 완전히 꺼졌다. 다행히 인명피해는 발생하지 않았으나, 이 불로 돈사 2개 동이 뼈대만 남고 모두 전소됐다. 또한 해당 축사에서 키우던 돼지 500여 마리가 미처 피하지 못하고 불에 타 죽거나 연기에 질식해 폐사한 것으로 추정된다. 경찰과 소방당국은 현장 잔불 정리가 완료됨에 따라 농장 관계자 등을 상대로 정확한 화재 원인과 재산 피해 규모를 집중적으로 조사할 방침이다.","category":"사회"},{"title":"경남도, 자율관리어업 한마음대회 … \"수산업 든든한 버팀목에 지원 강화\"","link":"https://n.news.naver.com/mnews/article/277/0005839353","naverLink":"https://n.news.naver.com/mnews/article/277/0005839353","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"경상남도가 6일 고성군 종합운동장에서 제12회 경남도 자율관리어업 한마음대회를 열고 자율관리어업 혁신을 다짐했다. 이번 대회는 '스스로 지키는 바다, 함께 여는 풍요로운 미래'를 주제로 개최됐다. 현장에는 도내 자율관리어업인과 그 가족, 수산업 관계자 등 3000여명이 참석했다. 박완수 도지사와 하학열 고성군수, 이경재 도의회 농해양수산위원장, 정영환 고성군의회 의장, 김산 한국자율관리어업 경남도연합회장 등 주요 내빈도 함께했다. 경남 고성군 종합운동장에서 제12회 경남도 자율관리어업 한마음대회가 열리고 있다. [사진제공=경남도] 박 도지사는 \"최근 기후변화와 수산자원 감소, 경영비 상승 등으로 수산업계가 많은 어려움을 겪고 있다\"면서 \"그런데도 꿋꿋하게 우리 바다를 지키고 자율관리어업을 이어온 여러분이 경남 수산업의 든든한 버팀목\"이라고 말했다. 이어 \"경남도에서도 어업인들의 복지와 수산자원 조성, 정주 여건 개선, 스마트양식 육성과 어업재해 예방 등을 위해 노력하겠다\"며 \"시일 내 시·군별 자율관리어업 회장들과 도의원, 관계 공무원이 함께하는 자리를 마련해 현장의 목소리를 직접 듣고 해결방안을 논의하겠다\"고 했다. 박완수 경남도지사(가운데)가 제12회 경남도 자율관리어업 한마음대회에서 도지사 표창을 받은 유공자들과 기념사진을 찍고 있다. [사진제공=경남도]","category":"사회"},{"title":"[당진소식]민생 살리려 점심시간대 불법 주정차 단속 유예 등","link":"https://n.news.naver.com/mnews/article/003/0014307399","naverLink":"https://n.news.naver.com/mnews/article/003/0014307399","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[당진소식]민생 살리려 점심시간대 불법 주정차 단속 유예 등. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"‘교회 헌금 대납 의혹’ 박완수 경남지사·유명현 산청군수 ‘불송치’…전 군의원만 송치","link":"https://n.news.naver.com/mnews/article/022/0004173160","naverLink":"https://n.news.naver.com/mnews/article/022/0004173160","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","descriptio
