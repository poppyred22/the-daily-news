23:59:48.487322+09:00","author":"네이버뉴스","description":"미국 중간선거 이후 AI 데이터센터 투자 위축 우려가 커지자 배경훈 부총리는 한국의 AI 인프라 투자를 늦춰서는 안 된다고 강조했다. 미국의 정책 변화가 오히려 다른 국가에는 기회가 될 수 있다는 판단으로, 국내 투자와 초거대 AI 개발을 계속 추진하겠다는 취지다.","category":"IT 과학"},{"title":"\"전력망 비용 다 내겠다\"는 오픈AI… 국내 AI 데이터센터는 고객 확보 관건","link":"https://n.news.naver.com/mnews/article/469/0000964112","naverLink":"https://n.news.naver.com/mnews/article/469/0000964112","pubDate":"2026-11-06T23:59:48.487318+09:00","author":"네이버뉴스","description":"오픈AI는 자체 AI 데이터센터의 전기요금과 전력 인프라 비용을 직접 부담하겠다고 밝혔다. 데이터센터 건설에 따른 지역 주민의 비용 부담과 정보 비공개 관행을 줄이겠다는 취지지만, 국내에서는 계획된 데이터센터 규모에 비해 실제 고객 수요가 충분한지가 과제로 꼽힌다.","category":"IT 과학"},{"title":"AI모델 구독 않고 골라쓰는 시대 열렸다","link":"https://n.news.naver.com/mnews/article/015/0005351238","naverLink":"https://n.news.naver.com/mnews/article/015/0005351238","pubDate":"2026-11-06T23:59:48.487316+09:00","author":"네이버뉴스","description":"KT의 기업용 플랫폼 토큰팩토리는 GPT와 클로드 등을 포함한 73개 AI 모델을 제공하고, 사용량에 따라 요금을 매기는 방식으로 출발했다. 여러 서비스를 월정액으로 구독하는 대신 작업에 맞는 모델을 골라 쓴 만큼 결제하는 방식이며, 향후 제공 모델을 500개 이상으로 늘릴 계획이다.","category":"IT 과학"},{"title":"美민주 'AI 중단' 압박에 증시 패닉셀","link":"https://n.news.naver.com/mnews/article/009/0005760237","naverLink":"https://n.news.naver.com/mnews/article/009/0005760237","pubDate":"2026-11-06T23:59:48.487306+09:00","author":"네이버뉴스","description":"미국 중간선거에서 민주당이 승리한 뒤 일부 정치인과 주정부 인사들이 AI 데이터센터 건설 중단과 규제 강화를 요구하면서 시장에 충격이 번졌다. 데이터센터 투자 위축 우려로 미국 반도체주와 한국 증시도 큰 폭으로 하락했고, 정부는 시장 변동성에 대응하기 위한 조치를 내놨다.","category":"IT 과학"},{"title":"빅테크 '보안 강화' AI 모델 잇따라 공개... 네이버·LG, SKT 모델은 언제","link":"https://n.news.naver.com/mnews/article/469/0000964118","naverLink":"https://n.news.naver.com/mnews/article/469/0000964118","pubDate":"2026-11-06T23:59:48.487304+09:00","author":"네이버뉴스","description":"글로벌 빅테크 기업들이 보안 기능을 강화한 AI 모델을 잇따라 공개하면서 AI 경쟁의 초점이 성능뿐 아니라 안전성과 정보 보호로 넓어지고 있다. 국내에서는 네이버·LG·SK텔레콤이 어떤 모델과 보안 기능으로 대응할지 관심이 모인다.","category":"IT 과학"},{"title":"“나 좀 일으켜 줘”…일부러 ‘덜 완벽하게’ 만든 로봇, 석 달 만에 월 매출 1억","link":"https://n.news.nav ws.naver.com/article/032/0003480989","pubDate":"2026-11-05T20:52:01+09:00","author":"경향신문","description":"우리들의 오줌권김지학 지음 | 원더박스 | 296쪽 | 2만원볼일이 급할 때 가까운 화장실을 찾아 해결하는 일. 다수에게는 일상적인 일이지만 장애인들에게는 고도의 계획이 필요한 일이다. 콜센터나 물류센터에서 일하는 노동자들은 바쁘다는 이유로 화장실행을 거절당하기도 한다. 누구든 제약 없이 화장실을 이용할 수 있게 하는 ‘오줌권’은 인권과 긴밀히 연결돼 있다···","category":"생활 문화","naverLink":"https://n.news.naver.com/article/032/0003480989"},{"title":"4살아이 버스에 3시간 갇혔는데 아무도 몰랐다…어쩌다","link":"https://n.news.naver.com/article/088/0001038745","pubDate":"2026-11-05T20:34:37+09:00","author":"매일신문","description":"4살 여자아이가 영어학원 통학버스에서 내리지 못한 채 약 3시간 동안 홀로 갇혀 있었던 사실이 드러났다. 경기남부경찰청은 아동복지법 위반 혐의로 학원 대표와 버스기사 등 4명에 대한 고소장을 접수해 수사하고 있다고 5일 밝혔다. 사건은 지난달 1일 발생했다. 당시 4살 A양은 오전 10시께 학원 통학버스를 타고 등원했지만, 안전벨트를 풀지 못해 차량에서 내리지 못한 것으로 전해졌다. 문제는 A양이 버스에 남아 있다는 사실을 아무도 알아채지 못했다는 점이다. 함께 탑승한 차량 도우미는 A양의 하차 여부를 확인하지 못했고, 버스는 아이 - 매일신문","category":"생활 문화","naverLink":"https://n.news.naver.com/article/088/0001038745"},{"title":"\"성형했다면 SNS 다 없애겠다\"…AI 말나온 국어강사, 악플에 결국","link":"https://n.news.naver.com/article/088/0001038738","pubDate":"2026-11-05T18:44:21+09:00","author":"매일신문","description":"안승연 국어 강사가 성형 의혹을 둘러싼 논란에 직접 입을 열었다. 인공지능(AI)으로 생성한 인물처럼 비현실적인 외모라는 반응을 얻으며 화제가 된 뒤 일부 누리꾼들이 안면윤곽 수술 등을 의심하자, 병원에서 직접 확인받겠다며 강하게 부인하고 나섰다. 안씨는 최근 자신의 소셜미디어(SNS)에 글을 올려 외모를 둘러싼 의혹과 악성 댓글에 대한 입장을 밝혔다. 그는 \"여러분 저도 사람이고 댓글 다 보는데 억울한 건 말을 할게요\"라며 \"제가 안면윤곽 수술이든 턱을 깎든 했다면 진짜 모든 SNS를 없애겠다. 진짜로 병원 가서 인증할 테니 무조 - 매일신문","category":"생활 문화","naverLink":"https://n.news.naver.com/article/088/0001038738"},{"title":"DGIST, 동물실험 없이 사람 근육 노화 연구하는 3D 조직 모델 개발","link":"https://n.news.naver.com/article/088/0001038731","pubDate":"2026-11-05T18:11:45+09:00","author":"매일신문","description":"대구경북과학기술원(DGIST) 연구진이 동물실험 없이 사람의 근육 노화 과정을 재현하고 근력 저하까지 측정할 수 있는 3차원(3D) 인공 근육 조직 모델을 개발했다. 향후 노인성 근감소증의 원인을 규명하고 치료제 후보물질의 효능을 검증하는 데 활용될 것으로 기대된다. DGIST는 뉴바이올로지학과 김민석 교수 연구팀이 포항공과대학교(POSTECH) 기계공학과 조동우 교수 연구팀과 공동으로 사람 골격근의 노화에 따른 변화와 근육 수축 기능을 동시에 평가할 수 있는 '생체모사 3차원 골격근 미세조직 모델'을 개발했다고 5일 밝혔다. 골 function compactDate(date){const d=new Date(date+"T12:00:00+09:00");const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short"}).formatToParts(d);const get=k=>p.find(x=>x.type===k)?.value||"";return get("month")+"/"+get("day")+" ("+get("weekday")+")";}

function seoulDateKey(value){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(value instanceof Date?value:new Date(value));

}

  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const when=x.pubDate?new Date(x.pubDate):null;
  const dateText=when&&!Number.isNaN(when.getTime())?(()=>{const p=new Intl.DateTimeFormat("ko-KR",{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(when);const g=k=>p.find(v=>v.type===k)?.value||"";return g("month")+"/"+g("day")+" ("+g("weekday")+") "+g("hour")+":"+g("minute")})():"";
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const author=esc(x.author||"뉴스");
  const categoryLabel=esc(x.category||"");
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">제목을 반복하지 않도록 요약을 생략했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><div class="storytop"><span class="source">'+author+'</span><span>'+dateText+'</span></div><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'<div class="storybottom"><span>'+categoryLabel+'</span><button class="save" type="button" data-save="'+i+'" aria-label="기사 저장">☆</button></div></article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활 문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?allDays[0]?.date:allDays[1]?.date));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===window.NEWS_DATA.date?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>나머지 기사</strong><span>최신순 '+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
