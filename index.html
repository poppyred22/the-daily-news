을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:52:54.157225+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:52:54.157217+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"안일했던 스토킹 대응, 결국 참극…정말 `국민 위한` 수사기관 개편 맞나[사사건건]","link":"https://n.news.naver.com/mnews/article/018/0006405474","naverLink":"https://n.news.naver.com/mnews/article/018/0006405474","pubDate":"2026-11-07T10:52:54.157183+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"20대 기간제 환경미화원 차량 발판 탑승 사고사…“청주시 책임져야”","link":"https://n.news.naver.com/mnews/article/028/0002831095","naverLink":"https://n.news.naver.com/mnews/article/028/0002831095","pubDate":"2026-11-07T10:52:54.157158+09:00","author":"네이버뉴스","description":"1시간 안전교육 받고 투입 한달 만에 사고 수거차 발판에 올라타 작업하다 추돌 사고 정부, 2018년 발판 탑승 작업 금지조처 시행 청주시 “발판 금지조처 알지만 현장엔 남아” 충북 청주에서 폐기물 수거를 하던 20대 기간제 환경미화원이 차량에 치여 숨졌다. 이 노동자는 수거 차량 뒤편 발판에 타고 있다가 사고를 당한 것으로 알려져 경찰과 노동당국 등이 사고 경위 등을 조사하고 있다. 게티이미지 코리아 충북 청주에서 폐기물 수거를 하던 20대 기간제 환경미화 노동자가 차량 추돌 사고로 숨졌다. 이 노동자는 지난달 기간제노동 계약을 하고 한 시간 정도 안전교육을 받은 뒤 배치돼 한 달 남짓 만에 사고를 당했다. 6일 청주시, 경찰, 소방당국 말을 종합하면, 5일 새벽 5시20분께 청주시 청원구 율량동 도로에서 폐기물 수거·운반차를 타고 일하던 ㄱ(26)씨가 ㄴ씨(60대)가 몰던 화물차에 치였다. ㄱ씨는 크게 다쳐 치료를 받았지만 이튿날 새벽 숨졌다. 사고 당시 ㄱ씨는 폐기물 수거·운반차 뒤쪽 발판 위에 타고 있었던 것으로 알려졌다. 경찰은 폐기물 차량 운전사, 화물차 운전사, 함께 작업한 환경미화원을 상대로 사고 경위 등을 조사 중이다. ㄱ씨는 지난달 2일 청주시와 환경미화원(환경공무직) 기간제노동자 근로계약을 맺고 청원구청 청소팀에 배치돼 일한 지 한 달 남짓 만에 사고를 당했다. 청원구 청소팀 관계자는 “당시 안전수칙 등 관련 교육을 1시간 정도 받았으며, 안전관리 교육 8시간 수료 등을 안내받은 뒤 계약한 날부터 배치돼 일한 것으로 안다. 온라인 교육 수료 여부는 확인되지 않았다”고 밝혔다. 민주노총 충북본부 등은 ㄱ씨가 사고 당시 폐기물 차량 뒤편 발판에 타고 작업했던 것에 주목한다. 2018년 정부는 ‘환경미화원 작업 안전 개선 대책’에서 청소차와 폐기물 수거·운반 차량 발판 탑승을 금지했다. 민주노총 공공운수노조 청주환경지회는 성명을 내어 “ㄱ씨는 차량 발판에서 일하다 숨졌다. 청주시가 이 죽음에 책임져야 한다. 청주시는 차량 발판 관련 안전 대책과 인력 충원 등 대책을 즉시 마련해야 한다. 동료를 잃은 슬픔을 잊지 않겠다”고 밝혔다. 김성영 민주노총 충북지역본부 국장은 “청주시는 환경미화 노동자를 직고용하거나 대행업체(용역)를 선정해 운영하는데, 대행업체는 2024년 7~8월께 문제가 된 발판을 제거했지만 ㄱ씨처럼 직고용한 직원 차량의 발판은 그대로인 것으로 안다. 작업 시간 등을 고려한 꼼수 조처가","category":"사건 사고"},{"title":"게임문화재단, 중국 대련서 게임리터러시 교육… 해외 현지 첫 운영","link":"https://n.news.naver.com/mnews/article/029/0003057528","naverLink":"https://n.news.naver.com/mnews/article/029/0003057528","pubDate":"2026-11-07T10:49:02.956224+09:00","author":"네이버뉴스","description":"대련한국국제학교 교원 대상 생성형 AI 활용 게임 제작 연수 진행 게임리터러시 교육 종료 후 학생들과 관계자들. (중국 대련한국국제학교 제공) 문화체육관광부(장관 최휘영)와 한국콘텐츠진흥원(원장 김윤지)이 주최하고 (재)게임문화재단(이사장 유병한, 이하 재단)이 주관하는 게임리터러시 교육이 중국 대련한국국제학교에서 진행됐다. 재단은 지난 10월 29일부터 30일까지 대련한국국제학교의 ‘2026 진로체험주간’과 연계해 교원 연수와 학생 대상 특강, 게임 제작 프로젝트 활동을 운영했다고 밝혔다. 그동안 국내를 중심으로 추진해 온 게임리터러시 교육을 해외 현지 학교로 확대한 첫 사례다. 10월 29일에는 가천대학교 정무식 교수가 ‘세상을 창조하는 사람들’을 주제로 게임업계 진로를 고민하는 학생들에게 게임·콘텐츠 산업의 발전 과정과 관련 직업을 소개했다. 정 교수는 게임 산업의 다양한 진로를 안내하고, 게임을 통해 새로운 아이디어를 구현하는 창의적 역량의 중요성을 설명했다. 같은 날 대련한국국제학교 교원 35명을 대상으로 ‘AI와 함께하는 교실 맞춤형 게임 제작’ 연수도 진행됐다. 정지원 성남여수초등학교 교사가 생성형 AI를 활용한 게임 기획 및 제작 실습을 맡았으며, 참여 교원들은 직접 게임을 제작하며 AI의 교육적 활용 가능성을 살펴보고 교과와 학급 특성에 맞는 게임 기반 교수·학습 방법을 탐색했다. 10월 30일에는 학생들이 직접 제작한 게임 프로젝트를 발표하고 정무식 교수의 피드백을 받는 시간이 마련됐다. 학생들은 자신의 아이디어를 구체적인 결과물로 구현하고 전문가의 의견을 바탕으로 개선 방향을 모색하며 게임과 AI 기술을 진로 및 미래 역량과 연결해 생각해 보는 기회를 가졌다. 이어 이재호 경인교육대학교 컴퓨터교육과 교수가 ‘AI 시대의 핵심 역량, 그리고 게임리터러시’를 주제로 특강을 진행했다. 이 교수는 인공지능 시대에 요구되는 미래 핵심 역량을 설명하고, 게임을 창의적 사고와 문제 해결을 위한 교육 자원으로 활용하는 게임리터러시의 가치와 게임을 이해하고 주도적으로 활용하는 역량의 중요성을 소개했다. 재단을 대표해 현장을 방문한 김현경 게임문화교육원장은 교육 운영 현황을 살펴보고 재외한국학교의 게임리터러시 교육 활성화와 교육 협력 방안을 논의했다. 김 원장은 “이번 대련한국국제학교 교육은 게임리터러시 교육 역량을 해외 학교 현장으로 확장한 첫 사례라는 점에서 뜻깊다”며 “앞으로도 다양한 교육환경에 적합한","category":"사건 사고"},{"title":"‘스카프 아저씨’ 결국 경호원까지 고용했다…인파 몰려 안전사고 우려","link":"https://n.news.naver.com/mnews/article/016/0002720169","naverLink":"https://n.news.naver.com/mnews/article/016/0002720169","pubDate":"2026-11-07T10:33:39.816918+09:00","author":"네이버뉴스","description":"‘스카프 아저씨’(좌)의 상점 앞에 몰린 인파[인스타그램] [헤럴드경제=김성훈 기자] 거침없는 입담으로 SNS 스타가 된 서울 남대문시장 ‘스카프 아저씨’가 민간 경호원까지 고용한 것으로 알려졌다. 너무 많은 인파가 몰려들어 안전관리가 필요한 상황이 됐기 때문이다. 6일 연합뉴스TV에 따르면, 남대문 시장에서 스카프를 판매하는 상인 A 씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 배치했다. 방문객이 너무 많이 몰려 발생할 수 있는 안전사고를 예방하고, 시장 내 질서를 유지하기 위해서다. 앞서 A 씨는 너무 많은 인파에 지난달 31일 임시 휴업을 선택했다. 며칠 간의 휴지기를 거쳐 지난 4일 다시 문을 열었지만 상황은 달라지지 않았고, 경찰이 출동하는 소동까지 벌어졌다. 결국 A 씨는 5일 다시 영업을 중단했다. 그는 자신의 SNS인 ‘남대문 다다구리’에 “요즘 생각지도 못한 너무 많은 관심과 사랑을 받고 있어서 솔직히 가슴 한구석에는 엄청난 부담감과 불안함이 있다”고 털어놨다. 구경 인파가 몰려들어 누군가 다치지 않을까 염려를 하면서 “앞으로 생길 일들에 살짝 두려운 마음이 드는 것도 사실이다”라고 했다. 남대문시장 상인회 차원에서도 사고 예방을 위해 촉각을 곤두세우고 있는 상황이다. 스카프 6장을 1만원에 판매하는 A 씨는 최근 온라인상에서 손님들에게 유쾌한 농담을 건네는 모습이 확산되면서 일약 SNS 스타가 됐다. 그는 손님들에게 “돈 쓰지 마. 이거 집에 가면 더 별로야”, “이걸로 땀이나 닦아, 하고 다니지 말고”라며 오히려 구매를 만류한다거나, 매대 가득한 스카프를 들추는 손님에게 “교양 있게 행동하지 마, 뒤집어야 나올 거 아니여~” 등의 입담으로 손님들의 웃음을 자아냈다. 이에 스카프를 사기보다 A 씨의 입담을 직접 듣거나 사진을 찍으려는 사람까지 늘면서 안전 문제와 타 업장 피해까지 발생하는 상황이 빚어지고 있다.","category":"사건 사고"},{"title":"[속보] 김종철 경찰청장 후보자 “막중한 책임 느껴”…경찰위 출석","link":"https://n.news.naver.com/mnews/article/025/0003563343","naverLink":"https://n.news.naver.com/mnews/article/025/0003563343","pubDate":"2026-11-07T10:08:37.041304+09:00","author":"네이버뉴스","description":"김종철 경찰청장 직무대행이 6일 이재명 대통령이 참석한 가운데 청와대에서 열린 한·동티모르 치안협력을 위한 기술약정서 체결식에 참석해 약정서 서명하기 위해 펜을 들고 있다. 청와대통신사진기자단 신임 경찰청장 후보자인 김종철 경찰청 차장은 6일 “엄중한 시기에 경찰청장 후보자로 지명된 것에 막중한 책임을 느낀다”고 밝혔다. 김 후보자는 이날 경찰청장 임명 제청 동의 안건을 심의하는 국가경찰위원회 임시회의에 참석하기 전 “경찰에 대한 국민의 기대가 어느 때보다 높고 또 그 이상 우려의 목소리가 크다는 걸 잘 알고 있다”며 이같이 말했다. 이어 “오늘 후보자로서 역량과 자질을 검증받는 만큼 책임 있는 자세로 성실히 임하겠다”고 했다. 경찰위는 이날 임시회의에서 김 후보자의 임명 제청 동의 여부를 심의한다. 경찰청장 인선은 대통령실의 후보자 추천, 경찰위 동의, 행정안전부 장관 제청, 국회 인사청문회, 대통령 임명 순으로 진행된다. 인사청문회를 거치되 국회의 임명 동의는 필요하지 않다. 김 후보자는 1970년 경남 함양에서 태어나 진주 명신고와 한국외국어대 영어과를 졸업했다. 1997년 경찰간부후보생 45기로 경위에 임관했다. 2019년 서울 서초경찰서장을 지냈으며, 2021년 경무관으로 승진해 부산경찰청 자치경찰부장을 맡았다. 같은 해 7월에는 문재인 정부 청와대 국정상황실에서 근무했다. 이후 대구·대전경찰청 공공안전부장, 서울경찰청 생활안전교통부장, 충남경찰청 공공안전부장, 강원경찰청 생활안전부장 등을 역임했다. 지난해 9월 치안감으로 승진해 경남경찰청장을 맡았고, 올해 8월 치안정감 승진자로 내정됐다. 이어 9월 경찰청 차장에 임명돼 청장 직무대행을 맡고 있다.","category":"사건 사고"},{"title":"세 번 만난 일본인 여성 왜 살해했나…30대 남성, 주식 실패에 처지 비관","link":"https://n.news.naver.com/mnews/article/008/0005437859","naverLink":"https://n.news.naver.com/mnews/article/008/0005437859","pubDate":"2026-11-07T00:26:25.047999+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"“암 말기” 구속 피하고 ‘스토킹 살인’ 60대… “대화 중 화나서” 혐의 인정","link":"https://n.news.naver.com/mnews/article/081/0003696787","naverLink":"https://n.news.naver.com/mnews/article/081/0003696787","pubDate":"2026-11-07T00:26:25.047980+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:52:55.189475+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"젠슨 황에 접근한 중국 여성 기업인은 국가안전부 간첩","link":"https://n.news.naver.com/mnews/article/003/0014307502","naverLink":"https://n.news.naver.com/mnews/article/003/0014307502","pubDate":"2026-11-07T10:52:54.680299+09:00","author":"네이버뉴스","description":"엔비디아 첨단 반도체 중국 수출 유도에 역할? 국가안전부, 경제 지배 위해 기술 획득 전투 [베이징=뉴시스]중국 국가안전부.(사진=바이두 갈무리) *DB 및","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/article/001/0016427663","naverLink":"https://n.news.naver.com/mnews/article/001/0016427663","pubDate":"2026-11-07T10:52:54.157239+09:00","author":"네이버뉴스","description":"설악산 -9도, 홍천·파주 -6.6도까지 떨어져…서울도 곳곳 영하 낮 8∼13도 그쳐…당분간 추위, 내일 경기북동부와 강원내륙·산지 눈 가능성 찬바람 부는 서울의 아침 (서울=연합뉴스) 서대연 기자 = 서울 아침 최저기온이 3도까지 떨어지며 급격히 추워진 6일 서울 종로구 광화문네거리에서 외투 모자를 쓴 관광객과 시민들이 신호를 기다리고 있다. 2026.11.6 dwise@yna.co.kr (서울=연합뉴스) 이재영 기자 = 절기 입동(立冬)인 7일 내륙 대부분의 아침 기온이 영하로 내려가는 등 추위가 시작했다. 이날 오전 7시 기준 일최저기온 현황을 보면 설악산은 -9.0도, 횡성(둔내)은 -6.8도, 홍천(서석)과 파주(판문점)는 -6.6도까지 기온이 떨어졌다. 7일 오전 8시 20분 기준 일최저기온 분포도. [기상청 제공. 재판매 및 DB 금지]","category":"사회"},{"title":"\"대본대로 했다\"…일반인 기절시킨 조폭 출신 유튜버, 합의해도 실형?","link":"https://n.news.naver.com/mnews/article/008/0005437919","naverLink":"https://n.news.naver.com/mnews/article/008/0005437919","pubDate":"2026-11-07T10:52:54.157233+09:00","author":"네이버뉴스","description":"유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. /사진=유튜브 캡처 유튜브 생방송 중 일반인 출연자의 목을 졸라 기절시키고 중상을 입힌 전직 조폭 출신 격투기 선수가 공소청에 넘겨진 가운데 현직 변호사가 주동자와 공범들의 예상 처벌 수위를 전망했다. 조기현 변호사(법무법인 대한중앙)는 지난 3일 유튜브 채널 '법무법인대한중앙TV'를 통해 이 사건의 수사 경과와 향후 처벌 수위에 대한 견해를 밝혔다. 지난 2일 인천 서부경찰서는 상해 혐의로 격투기 선수 출신 유튜버 A씨(36)를 불구속 송치했다. 범행을 방조한 유튜버 B씨 등 3명도 상해방조와 공동강요 혐의로 함께 불구속 송치됐다. A씨는 지난 9월 6일 오전 4시쯤 인천 서구 청라동의 한 오피스텔에서 유튜브 생방송을 진행하던 중 시청자인 20대 남성 C씨를 초대해 목을 졸라 기절시키는 등 다치게 한 혐의를 받는다. 당시 A씨는 C씨와 맨손 격투를 벌이다 목 조르기 기술을 사용했다. C씨가 손으로 A씨의 몸을 두드리며 그만하라는 의사를 표시했지만, A씨는 멈추지 않았다. 결국 C씨는 의식을 잃고 쓰러지면서 머리를 바닥에 강하게 부딪혔다. 이후 A씨는 C씨의 양쪽 뺨을 손으로 때리며 \"한숨 재워라\"라고 말한 뒤 다른 출연자들과 함께 C씨를 들어 스튜디오 한쪽으로 옮겼다. 조 변호사는 \"격투기 선수 출신 유튜버 A씨는 사건 이후 피해자와 합의를 진행했다\"며 \"법원은 피해자와 합의했고, 도주 우려가 없다는 이유로 구속영장을 기각했다. 경찰은 추가 수사를 마무리하고 최근 사건을 공소청에 송치했다\"고 설명했다. A씨와 B씨 등은 대본에 따라 연출된 촬영이었기 때문에 죄가 없다는 취지로 주장했으나, 경찰은 이를 받아들이지 않았다. 이에 대해 조 변호사는 \"당초 합의된 수준을 벗어나는 물리력이 행사됐고, 피해자가 촬영을 주저하며 안 하려 했는데 위세와 위력을 보여서 촬영을 강요해 12주의 중상을 입혔다\"고 지적했다. 이어 \"대본이 있었고, 사고 이후 피해자와 합의했다고 하더라도 그냥 넘길 수 있는 사안이 아니기 때문에 송치된 것\"이라고 설명했다. 조 변호사는 A씨와 B씨의 처벌 가능성에 대해서도 언급했다. 조 변호사는 \"B씨는 이 사건과 별개로 이미 지난달 통신매체이용음란 및 명예훼손죄로 징역 5개월의 실형을 선고받아 법정 구속된 상태\"라며","category":"사회"},{"title":"식탁 위에 방치했던 복권, '5억원'이었다","link":"https://n.news.naver.com/mnews/article/008/0005437920","naverLink":"https://n.news.naver.com/mnews/article/008/0005437920","pubDate":"2026-11-07T10:52:54.157231+09:00","author":"네이버뉴스","description":"스피또1000 110회차 1등 당첨 복권 사진과 당첨자 소감/사진=동행복권 가족에게 당첨 여부를 확인해 보라고 건넨 뒤 한동안 방치했던 복권이 5억원에 당첨된 사연이 소개됐다. 최근 동행복권에 따르면 서울 중랑구 면목로31길의 한 복권 판매점에서 판매된 스피또1000 110회차에서 1등 당첨의 주인공이 나왔다. 당첨자 A씨는 평소 매주 로또와 스피또를 1만원어치씩 구매했다. 어느 날 복권 판매점에 들러 스피또1000 5장을 구매해 집으로 돌아왔다. 복권을 본 가족들이 당첨 여부를 확인해 보고 싶다고해 A씨는 복권을 가족들에게 건네준 후 다른 볼일을 봤다. 이후 가족이 당첨된 것이 맞는지 확인해달라고 했지만, A씨는 소액에 당첨됐을 거라고 생각하고 하던 일을 계속했다. 얼마 후 A씨는 식탁 위에 복권이 올려져 있어 살펴봤는데 놀랍게도 '5억원'에 당첨돼 있었다. A씨는 \"전혀 예상하지 못한 큰 금액에 순간 너무 놀라 아무 말도 나오지 않았고, 한동안 얼떨떨한 기분이었다\"며 \"이런 큰 행운이 우리 가족에게 찾아왔다는 것이 너무 감사하고 행복한 마음\"이라고 말했다. 그는 \"당첨금은 전세 자금으로 보태쓰려고 한다\"고 덧붙였다. 스피또1000은 행운 숫자가 자신의 숫자 6개 가운데 하나와 일치하면 해당 당첨금을 받는 즉석 복권이다. 판매 가격은 1000원이다. 1등 당첨금은 5억원이다.","category":"사회"},{"title":"성일종, 30대 여성 민통선 침입 전말 공개…\"산나물 채취자로 보고 수색 종료\"","link":"https://n.news.naver.com/mnews/article/088/0001038911","naverLink":"https://n.news.naver.com/mnews/article/088/0001038911","pubDate":"2026-11-07T10:49:02.280921+09:00","author":"네이버뉴스","description":"GOP 경계 근무. 연합뉴스 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없습니다.\" 지난달 강원도 철원에서 30대 여성이 민간인출입통제선(민통선) 이북 지역으로 무단 진입했을 당시, 군이 이 여성의 신병을 확보하지 못하고도 '산나물을 채취하러 온 민간인으로 추정된다'며 수색을 종료했다고 성일종 국민의힘 의원이 밝혔다. 이튿날 이 여성이 재차 등장해 최전방 일반전초(GOP) 철책에 설치된 경계 장비인 '광망(光網)'을 훼손해 경보가 울렸을 때도 초반엔 '동물에 의한 절단'으로 판단했다고 한다. 성 의원은 이런 사실을 공개하면서 \"대한민국 안보가 이재명 정부 들어 얼마나 무너졌는지 보여주는 충격적인 사건\"이라고 했다. 국회 국방위원회 소속 성 의원은 6일 국회 소통관에서 기자회견을 열고 \"붙잡지도 못했고 신문 한 번 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내리는 게 지금 우리 군의 실상\"이라며 이같이 말했다. 앞서 지난달 24일 강원도 철원 지역에서 30대 여성 A씨가 민간인통제선을 넘어 최전방 일반전초(GOP) 철책 인근까지 접근하는 일이 벌어졌다. 당시 군은 A씨의 움직임을 포착하고도 신병을 확보하지 못했다. 이튿날엔 A씨가 니퍼와 가위 등을 이용해 철책에 설치된 경계용 광망을 절단하기까지 했고, 군은 그제서야 A씨 신병을 확보했다. 성 의원은 군이 A씨 신병을 확보하기까지 대응이 허술했다며 구체적인 판단 과정을 밝혔다. 성 의원에 따르면, 처음 GOP 접근이 포착됐을 당시 군은 A씨에 대해 '산나물을 채취하러 온 민간인으로 대공 혐의점이 없다'는 자체 판단을 내리고 수색 작전을 종료했다고 한다. 이후 A씨는 지난달 25일 오전 10시 55분쯤 다시 등장해 광망을 절단했고, 군 당국은 경보를 듣고도 감시 영상에서 사람의 모습이 확인되지 않는다는 이유로 '동물의 의한 절단'이라고 판단했다는 게 성 의원 설명이다. 군 당국이 A씨 신병 확보에 나선 건 정오가 지난 이후라고 한다. 성 의원은 \"10월 24일이면 전방에는 이미 낙엽이 다 지고 동절기를 준비하는 시간\"이라며 \"10월 말에 산나물이 나온다는 얘기를 어느 국민도 들어본 적 없다\"고 했다. 이어 \"붙잡지도 못했고 신문 한 번도 제대로 못 했는데 대공 혐의점이 없어 보인다고 결론을 내린다는게 지금 우리 군의 실상\"이라며 \"이런 지휘관이 전방을 담당하는 군단장 삼성장군이라고 하니 빈총 경계와 닮아도 너무 닮았다\"고 했다. 또 \"","category":"사회"},{"title":"이혼시 아파트 재산분할과 세금(12)[정보근 변호사의 부동산 법률을 부탁해]","link":"https://n.news.naver.com/mnews/article/011/0004679685","naverLink":"https://n.news.naver.com/mnews/article/011/0004679685","pubDate":"2026-11-07T10:33:39.816922+09:00","author":"네이버뉴스","description":"정보근 법무법인 리움 대표 변호사 정보근 변호사의 부동산법을 부탁해 얼마 전 오래전부터 알고 지낸 지인의 부탁으로 이혼소송을 진행한 적이 있다. 이들 부부는 10년 정도 결혼 생활을 유지하고 아이도 낳아 키우다가 불화 끝에 결국 헤어졌다. 전문직에 종사 중인 지인은 혼인 중 아파트를 포함해 예금, 자동차 등 상당한 재산을 취득했다. 이혼을 하며 재산을 분할하는 과정에서, 공동명의로 보유한 아파트는 일반적으로 한쪽이 아파트 소유권을 전부 취득하되, 다른 한쪽에 현금을 지급하는 형태로 정리된다. 이혼하는 마당에 공유지분을 유지할 수 없고, 공유지분 일부만 매각하면 제대로 된 값에 팔리지 않으니 손해가 크기 때문이다. 실제로 해당 사안에서도 남편은 아내가 보유한 공유지분을 이전받는 대신 재산분할로 현금 수억 원을 지급했다. 그런데 여기서 한 가지 의문이 생긴다. 이혼 시 재산분할 과정에서 지급받은 현금 수억 원에 대해 증여세가 부과될까. 결론부터 얘기하면 증여세가 부과되지 않는다. 이유는 재산분할은 혼인 중 공동으로 형성한 재산을 청산·분배하는 것이기 때문이다. 이혼 시 재산분할 과정에서 증여세 미과세의 경우와 비교해 배우자 사망 시 상속세가 부과되는 것은 형평성의 문제가 있다는 지적이 있다. 만약 부부가 백년해로하다 남편이 먼저 사망하는 경우 아내는 높은 상속세를 납부하는 반면, 오히려 이혼으로 재산분할을 하는 경우에는 증여세를 내지 않는다는 것이 불합리하다는 것이다. 부부간 상속세 폐지를 주장하는 논리 중 하나 또한 재산분할의 경우에도 증여세가 없다는 점이 근거로 제시되기도 한다. 동일한 아파트 한 채를 두고 배우자 간 이혼과 상속의 경우 전혀 다르게 취급할 본질적인 이유가 있는가. 이는 조세정책상의 결단 사항일 뿐 양자 사이에 본질적인 차이는 없는 것으로 보인다. 실제로 과거에는 이혼 재산분할이 상속세 배우자 공제액을 초과하면 그 초과분을 일률적으로 증여로 봐 과세하는 법률이 존재하기도 했다. 물론 이 법조항은 재산분할과 상속은 재산관계와 신분관계라는 점에서 본질적으로 다르다는 이유로 헌법재판소에서 위헌 결정이 났으나, 필자가 보기에 양자를 달리 취급하는 근거가 선뜻 이해가 되지 않는다. 실제로 상속세를 걱정해 ‘황혼 이혼’을 하는 사례도 심심치 않게 있다고 한다. 절세를 위해 황혼 이혼까지 고려되는 이유는 최근 아파트 가격 급등으로 인해 상속세 부과 대상인 사람이 급증했기 때문이다. 통계에 따르면 지난해 상속","category":"사회"},{"title":"이용철 법무장관 후보자 \"검찰개혁 차질 없이 완수\"","link":"https://n.news.naver.com/mnews/article/052/0002429398","naverLink":"https://n.news.naver.com/mnews/article/052/0002429398","pubDate":"2026-11-07T10:21:50.332120+09:00","author":"네이버뉴스","description":"이용철 법무부 장관 후보자가 검찰개혁을 차질 없이 완수하고 새로운 형사사법체계 안착에 힘쓰겠다고 지명 이후 첫 공식 입장을 밝혔습니다. 이 후보자는 오늘(6일) 형사사법체계가 크게 개편된 엄중한 시기에 법무행정을 책임지는 법무부 장관 후보자로 지명돼 막중한 책임감을 느낀다며 이같이 전했습니다. 이어 참여정부 청와대 법무 비서관으로 검경 수사권 조정 등 검찰개혁 업무를 수행했던 경험을 살려 검찰개혁을 완수하고 새 형사사법체계 안착에 역할을 해달라는 게 이재명 대통령이 자신을 지명한 이유로 생각된다고 설명했습니다. 이 후보자는 장관으로 임명된다면 검찰 개혁 완수와 새 형사사법체계의 빠른 안착에 힘쓰는 한편, 범죄 피해자 등 사회적 약자의 인권 보호에도 최선을 다하겠다고 강조했습니다. 그러면서 국민에게 능력과 자질을 엄중하게 검증받을 수 있도록 준비에 최선을 다하겠다고 덧붙였습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"안경 썼을 뿐인데 수능 정답이? 시험장 덮친 '첨단 커닝' [김형자의 세상은 지금]","link":"https://n.news.naver.com/mnews/article/586/0000141793","naverLink":"https://n.news.naver.com/mnews/article/586/0000141793","pubDate":"2026-11-07T10:16:02.704974+09:00","author":"네이버뉴스","description":"[김형자 과학칼럼니스트 sisa@sisajournal.com] 안경테에 내장된 카메라로 문제 촬영, AI가 분석해 렌즈에 정답 띄워 신종 부정행위 도구로 악용되는 스마트 기기…당국 '엄벌' 경고 속 대응 고심 시험지를 바라보는 수험생. 안경테에 숨겨진 카메라가 문제를 촬영하고, 인공지능(AI)이 순식간에 답을 찾아낸다. 정답은 안경을 쓴 사람만 볼 수 있는 작은 화면에 나타난다. 겉보기엔 평범한 안경이지만, 실제로는 AI가 대신 문제를 풀고 있는 셈이다. 11월19일 치러지는 2027학년도 대학수학능력시험(수능)을 앞두고 교육 현장에 비상이 걸렸다. 최근 연세대와 서울시립대 논술시험장에서 AI 스마트 안경(AI 안경)을 이용한 부정행위가 잇따라 적발된 데 이어 올해 국가자격시험에서도 5건의 부정행위가 확인됐기 때문이다. 첨단 기술이 가져온 편리함이 이제는 시험의 공정성을 흔드는 새로운 변수로 떠올랐다. ⓒChatGPT 생성이미지 일반 안경으로 위장한 'AI 기기' 식별법은 수능 출제기관인 한국교육과정평가원(평가원)과 교육부는 2027학년도 수능부터 AI 안경을 반입 금지 물품으로 지정하고 강력한 제재 방침을 내놨다. AI 안경을 이용해 부정행위를 한 수험생은 형사고발하거나 수사를 의뢰하는 등 엄정하게 대응한다는 계획이다. 시험 중 착용은 물론 가방 등에 소지하는 것만으로도 해당 시험이 무효 처리되고, 다음 해 응시 자격도 정지된다. 현재 1년인 응시 자격 정지 기간을 최대 3년으로 확대하는 방안도 추진 중이다. 나아가 논술·면접 등 대학별 고사에서도 강화된 제재 방침을 적용할 수 있도록 각 대학에 권고하기로 했다. 문제는 AI 스마트 안경이 일반 안경과 외형상 큰 차이가 없어 현장에서 쉽게 식별하기 어렵다는 점이다. 그렇다면 시험장에서는 과연 어떤 단서로 이 위험한 기기를 가려내야 할까. AI 안경은 일반 안경에 인공지능 기능을 결합한 웨어러블 기기다. 안경테 안에는 카메라와 마이크, 소형 스피커 등이 탑재돼 있고, 일부 제품은 렌즈에 작은 화면을 띄우는 디스플레이까지 갖추고 있다. 작동 방식은 크게 세 단계로 나뉜다. 먼저 안경에 달린 카메라가 사용자의 바라보는 풍경이나 사물을 촬영하고, 마이크는 사용자의 음성과 주변 소리를 수집한다. 이렇게 모아진 정보는 스마트폰이나 인터넷을 거쳐 AI에 전달된다. 그러면 마지막으로 AI가 이미지와 음성을 분석해 사물을 식별하거나 사용자의 질문에 답한다. 분석 결과는 소형","category":"사회"},{"title":"\"하겠단 사람 많아\"…70대 직원 겁줘 8천만원 뜯어낸 하청 팀장","link":"https://n.news.naver.com/mnews/article/015/0005351350","naverLink":"https://n.news.naver.com/mnews/article/015/0005351350","pubDate":"2026-11-07T10:03:02.328306+09:00","author":"네이버뉴스","description":"사진=생성형 AI 고용 불안을 무기로 70대 고령 노동자의 월급을 3년 넘게 뜯어낸 악덕 하청업체 팀장이 결국 철창신세를 지게 됐다. \"(원청의) 항의로 잘릴 수도 있다\"며 겁을 준 이 남성은 그렇게 갈취한 8000만 원 넘는 돈을 개인 빚을 갚고 도박판에 탕진한 것으로 드러났다. 7일 법조계에 따르면 수원지방법원 여주지원은 최근 공갈 혐의로 재판에 넘겨진 하청업체 현장 총괄팀장 A씨에게 징역 1년의 실형을 선고했다. 한국도로공사의 하청업체에서 현장 총괄팀장을 맡고 있던 A씨는 청소인부를 구하라는 회사 대표의 지시에 따라 2020년 73세의 고령인 D씨를 채용했다. D씨는 그해 2월 17일부터 고속도로 갓길과 졸음쉼터 등을 청소하는 업무에 종사했다. 그런데 A씨는 2020년 5월 피해자의 배우자가 운영하는 점포를 찾아가 \"청소 업무에 대해 도로공사에 항의가 들어오고 있으니 잘릴 수도 있다. 일하기 싫으면 그만둬라. 당신 말고도 청소 일 할 사람 많다\"고 협박성 발언을 쏟아냈다. 심지어 \"(상납금은) 나 혼자 먹는 거 아니다. 사장님한테 로비하는데 쓰는 거다\"라는 핑계를 댔다. 인사권을 쥔 팀장의 협박에 겁을 먹은 70대 노인은 그날 바로 현금 372만 원을 바쳤다. 이후 피해자는 2023년 12월까지 같은 방법으로 총 40회에 걸쳐 현금 및 피고인(또는 피고인 자녀) 명의의 계좌로 합계 8169만원을 갈취당했다. 제대로 일하고도 세금 낼 돈이 없어 타인에게 돈을 빌리고 세금을 체납해야 할 정도로 피해자의 삶은 망가져 갔다. 법정에서 A씨는 D씨가 처음 약 1년간은 성실하게 작업하다가 언제부터인가 늦게 출발하고 청소 현장이라고 거짓말을 하는 등 게으름을 피워 청소작업을 제대로 하라는 취지로 말한 것뿐이라고 주장했다. 하지만 재판부는 \"피해자는 상납금을 갈취당하고 있는 입장이므로 근로의욕이 저하돼 업무를 태만히 하게 될 수 있고, 상납금을 갈취하는 A가 업무 태만으로 주의를 주더라도 정당한 지적으로 들리기 어렵다\"고 지적했다. 이어 \"피고 A는 피해자가 업무를 태만히 했다면서도 피해자를 재추천해 2년 연장 계약을 하면서, 결국 고속도로 청소 업무의 수준이 저하되는 결과가 초래될 수 있다\"고 지적했다. 법원은 A씨가 선고기일 직전에 합의서를 제출했지만 '30개월에 걸쳐 나눠 갚겠다'는 조건 등을 내걸었고, D씨가 엄벌을 탄원한 점 등을 감안해 실형을 선고했다.","category":"사회"}],"생활·문화":[{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:52:55.653866+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"생활·문화"},{"title":"예술인 공제사업 시작…첫 상품 ‘예술현장 안심공제’ 출시","link":"https://n.news.naver.com/mnews/article/011/0004679663","naverLink":"https://n.news.naver.com/mnews/article/011/0004679663","pubDate":"2026-11-07T10:52:55.653849+09:00","author":"네이버뉴스","description":"문체부·예술인복지재단 “예술현장 특성 반영한 맞춤형” ‘예술사업자’부터…향후 문화시설·예술인까지 확대키로 문화예술인들이 안심하고 예술활동을 하도록 돕는 ‘예술인 공제사업’이 본격적으로 시작한다. 우선 예술사업자가 대상이며 앞으로 문화시설과 예술인으로 확대할 예정이다. 문화체육관광부는 산하 한국예술인복지재단을 통한 예술인 공제사업을 공식 출범하고, 공연·전시 현장의 각종 위험을 통합 보장하는 ‘예술현장 안심공제’ 상품을 출시한다고 밝혔다. ‘예술인 공제사업’은 단순히 정부 비용 지원에만 의존한 기존 예술인 복지제도의 사각지대를 보완하고, ‘공제’ 제도를 활용해 예술인이 안심하고 예술활동을 지속할 수 있도록 돕는 사업이다. 정부와 예술계가 함께 재원을 마련하고 위험을 나누는 상호부조를 바탕으로, 지속 가능한 복지 기반을 마련하는 데 목적이 있다는 설명이다. 그동안 개별 예술인의 부담과 정부의 기여를 둘러싸고 제도 도입 논란이 많았지만 일단 ‘스타트’를 끊겠다는 것이다. 이번에 정부는 출연금 50억 원을 배정했다. 기존 민간 보험으로는 충분히 대비하기 어려웠던 예술현장의 위험을 보장하는 상품을 개발해 선보이는 것은 이번이 처음이다. 실제로 예술활동 중 발생하는 사고와 손실은 경제적 부담을 넘어 공연·전시의 중단으로 이어질 수 있는 만큼, 사후 지원을 넘어 위험에 미리 대비할 수 있는 체계를 마련했다는 데 의미가 있다. 재단에 따르면 첫 번째 상품인 ‘예술현장 안심공제’는 공연·전시 등을 기획·운영하는 예술사업자를 가입 대상으로 한다. 출연진과 스태프의 상해·질병은 물론 관객 안전사고와 대물 배상책임까지 하나의 상품으로 통합 보장한다. 특히 본 공연·전시 기간뿐 아니라 준비와 연습 기간까지 보장 범위에 포함해 실제 예술현장 운영 과정에서 발생할 수 있는 다양한 위험에 대비할 수 있도록 했다. 문체부 관계자는 “향후 문화시설과 예술인까지 공제사업 대상을 단계적으로 확대해 예술생태계 전반을 아우르는 안전망을 구축할 계획”이라며 “아울러 공제사업 운영을 통해 발생한 수익은 예술인 복지 증진에 재투자해 예술계에 환원되는 선순환 구조를 만들어 나갈 예정”이라고 전했다.","category":"생활·문화"},{"title":"게임이 악성코드 통로가 된다면[ET톡]","link":"https://n.news.naver.com/mnews/article/030/0003483159","naverLink":"https://n.news.naver.com/mnews/article/030/0003483159","pubDate":"2026-11-07T10:52:55.189405+09:00","author":"네이버뉴스","description":"최근 시프트업의 인기게임 '승리의 여신: 니케'에서 발생한 보안 사고는 글로벌 게임산업이 직면한 새로운 위험을 드러냈다. 게임서비스에 사용되는 콘텐츠전송네트워크(CDN)의 자바스크립트 파일이 제3자에 의해 변조되면서 공식 PC 런처를 통해 악성 프로그램이 유포됐다. 이용자가 믿고 실행한 게임이 PC 보안을 위협하는 통로가 됐다. 사고는 게임을 직접 공격하는 대신 연결된 외부 시스템의 취약점을 파고든 '공급망 공격'이라는 점에서 주목된다. 지난 9월 말 관련 도메인 탈취 이후 악성 프로그램 유포가 시작됐지만 운영사가 이를 확인하고 추가 유포를 차단하기까지 상당한 시간이 걸렸다. 게임산업의 국경은 허물어졌다. 국내 게임을 해외 퍼블리셔가 서비스하고 여러 국가에 흩어진 스튜디오가 프로젝트를 공동 수행한다. 개발부터 배급, 업데이트, 운영에 이르기까지 다양한 기업과 시스템이 연결돼 있다. 글로벌 진출 효율성을 높인 구조가 역설적으로 보안의 취약점이 될 수 있다는 의미다. 박정은 통신미디어부 기자 하나의 공급망에서 발생한 문제가 국경을 넘어 수많은 이용자에게 영향을 미칠 수 있다. 개인정보나 게임 데이터 유출을 넘어 악성 프로그램이 이용자 PC에 침투하면 게임 외부의 계정 정보와 금융 자산까지 위협받을 수 있다. 게임사 입장에서도 위험은 막대하다. 국가마다 개인정보 보호와 사이버보안 관련 법률, 제재와 피해 보상 기준이 다르다. 하나의 사고가 여러 국가 규제와 소송으로 이어질 수 있다. 자칫 기업의 존립까지 위협할 수 있다. 게임 보안의 범위를 다시 생각해야 한다. 개발사가 직접 작성한 코드뿐 아니라 외부 퍼블리셔의 배포 시스템, CDN, 업데이트 서버, 협력사 개발 도구까지 공급망 전반을 살펴야 한다. 사고 발생 시 국가와 기업의 경계를 넘어 신속하게 대응할 수 있는 협력체계가 필요하다. 게임은 이용자가 자발적으로 설치하는 콘텐츠다. 그런 게임이 악성코드를 퍼뜨리는 통로가 되는 일만큼은 막아야 한다. 이번 사고가 게임산업 전체에 공급망 보안의 중요성을 일깨우는 계기가 되기를 바란다.","category":"생활·문화"},{"title":"화면 교체 하세월…아이폰 듀오 소비자 신뢰에도 금 가나","link":"https://n.news.naver.com/mnews/article/003/0014305393","naverLink":"https://n.news.naver.com/mnews/article/003/0014305393","pubDate":"2026-11-07T10:49:02.956213+09:00","author":"네이버뉴스","description":"수리 요청 증가에 익스프레스 교체 제한…일부 고객 내년 1월까지 대기 안내 애플케어+ 가입자도 교체 차질…제조 결함 추정 후 유상 수리 안내에 혼선 애플 \"소수 제품 문제 확인, 교체 지원\"…초기 품질 논란에 소비자 신뢰 시험대 [서울=뉴시스] 이영환 기자 = 27일 서울 시내의 한 휴대폰 대리점에 진열된 아이폰 듀오.이날 애플 공식 성명에 따르면 애플은 \"소수의 아이폰 듀오 제품에서 내부 디스플레이에 영향을 미치는 문제가 있음을 인지하고 있다\"고 밝혔다애플이 첫 폴더블 스마트폰 '아이폰 듀오'의 내부 화면 균열 논란과 관련해 일부 제품에 문제가 있다는 사실을 처음으로 공식 인정했다. 해외에 이어 국내에도 공식 입장을 전달하고 문제가 발생한 제품은 교체하도록 안내했다. 다만 파손 원인이나 힌지 설계·제조 결함 여부에 대해서는 설명하지 않았다. 2026.10.27. 20hwan@newsis.com [서울=뉴시스]윤현성 기자 = 애플의 첫 폴더블 스마트폰 '아이폰 듀오'가 출시 초기 디스플레이 균열과 힌지 이상 논란에 이어 사후서비스(AS) 문제까지 불거졌다. 화면 이상으로 교체를 요청한 고객이 수리 요청 증가를 이유로 서비스를 이용하지 못하거나 제조 결함으로 추정된 증상에 대해 유상 수리를 안내받는 사례가 알려지면서다. 애플은 앞서 일부 제품에서 발생한 화면 문제를 인정하고 교체 지원 방침을 밝혔지만, 실제 서비스 과정에서는 교체 기기 수급과 보증 적용을 둘러싼 혼선이 나타나고 있다. 수리 요청 몰리자 '선교체' 차질…애플케어+ 가입자도 불편 6일 폰아레나 등 외신에 따르면 아이폰 듀오의 수리 요청이 늘어나면서 일부 고객이 기기 교체에 어려움을 겪고 있는 것으로 나타났다. 아이폰 듀오 구매자가 애플 지원팀으로부터 수리 요청이 많아 교체 서비스를 제공하기 어렵다는 안내를 받았다는 것이다. 해당 소비자는 내부 디스플레이 하단에 돌출된 부분이 생기자 애플에 문의했다. 상담원은 증상을 확인한 뒤 제조상 결함으로 보인다며 교체가 가능하다고 안내했다. 그러나 고객이 '익스프레스 교체 서비스(ERS)'를 신청하자 수리 요청이 많아 이용이 어렵다는 답변이 돌아왔다. 익스프레스 교체는 애플케어+(플러스)의 주요 혜택으로, 고장 난 기기를 반납하기 전에 교체 제품부터 받아 사용하는 서비스다. 미국 기준 아이폰 듀오의 애플케어+ 가입 비용은 월 19.99달러 또는 연간 199.99달러다. 애플은 해당 소비자에게 기존 기기를 반납한","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:33:40.778074+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"\"美민주, 캐나다 관세 철폐 추진…트럼프 무역정책 제동 첫발\"","link":"https://n.news.naver.com/mnews/article/001/0016427572","naverLink":"https://n.news.naver.com/mnews/article/001/0016427572","pubDate":"2026-11-07T10:26:05.519669+09:00","author":"네이버뉴스","description":"미시간·메인 등 선거 쟁점…공화당 이탈표 확보 전략 철강·차 등 관세는 당내 이견…무역법 전면 개정 난항 캐나다 윈저와 미국 디트로이트를 잇는 앰배서더 다리 [AFP=연합뉴스 자료사진. 재판매 및 DB 금지] (뉴욕=연합뉴스) 김연숙 특파원 = 미국 민주당이 도널드 트럼프 행정부의 대(對) 캐나다 관세 정책을 되돌리기 위한 입법을 추진하고 있다고 월스트리트저널(WSJ)이 6일(현지시간) 보도했다. 트럼프 대통령의 무역 정책 전반에 제동을 걸기 위한 첫 번째 조치로, 민주당은 관세에 반대하는 공화당 의원들의 협조를 얻어 입법까지 이어간다는 구상이다. 상원 재무위원회 민주당 간사인 론 와이든(오리건) 상원의원은 내년 1월 위원회 주도권을 넘겨받은 뒤 캐나다 관세를 철폐하는 법안을 추진하기 위해 동료 의원들과 논의하고 있다고 밝혔다. 와이든 의원은 \"캐나다산 제품에 대한 관세 폐지에 압도적인 지지가 있다\"고 말했다. 민주당의 이 같은 움직임은 이번 중간선거에서 관세가 주요 쟁점으로 부상한 지역의 유권자 반발을 동력으로 활용하려는 것으로 풀이된다. 미시간, 메인, 알래스카주 등에서는 캐나다와의 무역 갈등이 선거 쟁점이 됐다. 민주당뿐만 아니라 일부 공화당 후보들까지 관세에 반대하는 입장을 보였다. 민주당은 이들 지역의 공화당 의원들을 설득해 초당적 지지를 확보할 방침이다. 다만 법안이 실제 입법으로 이어지기까지는 상당한 정치적 장벽이 있다. 트럼프 대통령이 거부권을 행사할 경우 이를 무력화하려면 상·하원에서 각각 출석 투표 의원의 3분의 2 이상 찬성이 필요하다. 민주당은 이번 선거에서 현재까지 상원 54석, 하원 253석을 확보했지만, 거부권을 무력화할 수준의 의석에는 미치지 못해 공화당 의원들의 협조가 필요하다. 민주당은 캐나다 관세 철폐를 시작으로 대통령의 일방적인 관세 부과 권한을 제한하고 의회의 통제권을 강화하는 방향으로 무역 정책을 손보겠다는 구상이다. 의회 관계자들은 캐나다 관세의 근거가 된 1930년 관세법 제338조와, 무역적자 등에 대응해 대통령이 한시적으로 추가 관세를 부과할 수 있도록 한 1974년 무역법 제122조 등 대통령의 관세 부과 권한을 제한하는 방안도 검토 대상이 될 수 있다고 말했다. 다만 미국 무역법의 근본적인 개정으로 이어지기는 쉽지 않을 전망이다. 철강·알루미늄·자동차 등 특정 산업에 대한 관세의 근거가 되는 1962년 무역확장법 제232조와, 강제 노동 의혹을 근거로 60개국에","category":"생활·문화"},{"title":"NYT “뉴진스 계약, 이례적으로 공격적…미성년 보호조항 없어 불공정”","link":"https://n.news.naver.com/mnews/article/016/0002719622","naverLink":"https://n.news.naver.com/mnews/article/016/0002719622","pubDate":"2026-11-07T10:08:38.684046+09:00","author":"네이버뉴스","description":"그룹 뉴진스. [헤럴드POP(현 헤럴드뮤즈) 제공] [헤럴드경제=장연주 기자] 그룹 뉴진스의 멤버들이 미성년자 시절 소속사 어도어와 체결한 전속계약에 미성년자 보호 조항이 빠지는 등 불공정한 내용이 포함됐다고 뉴욕타임스(NYT)가 보도해 눈길을 끈다. NYT는 5일(현지 시간) 뉴진스 멤버 5명이 만 14~17세였던 2022년 체결한 전속계약서를 입수했다며 이 같이 밝혔다. NYT는 뉴진스와 어도어의 계약서를 입수해 분석한 결과, 미성년자 보호조항, 성형 비용 부담, 행동 제한, 위약벌 산정 방식, 계약 종료 이후 초상권 조항 등 멤버들의 권리를 침해하는 조항들이 다수 발견됐다고 보도했다. 이에 대해 NYT는 법률 전문가 5명의 검토를 거쳤는데, 이 중 한명인 서울의 엔터테인먼트 전문 노종언 변호사는 “이례적으로 공격적인 계약”이라고 평가했다고 덧붙였다. NYT는 먼저 뉴진스의 계약서에 대해 ‘아동 보호 관련 문구가 없다’고 지적했다. 뉴진스 멤버들은 12살이라는 어린 나이에 기숙사 생활을 시작했으며, 새벽 2시까지 리허설을 하는 것은 드문일이 아니었다고 익명을 요구한 관계자는 밝혔다. NYT에 따르면, 멤버들이 연습을 하는 구역에는 폐쇄회로(CC)TV가 설치돼 있었고, 멤버 5명 중 4명은 연습 도중 학교를 그만뒀다. 이에 대해 하이브 관계자는 “회사가 아동보호법을 철저히 준수하며, 출연진들이 안전한 환경에서 일하고 훈련받을 수 있도록 최선을 다하고 있다”고 밝혔다. 이어 “소속 아티스트들에게 학업을 중단하도록 강요하거나 휴식을 취하는 것에 대해 불이익을 주지 않는다”고 해명했다. 하지만 NYT는 입수한 이메일을 통해, 해당 계약 조건이 사실상 협상 불가능한 것이었다고 지적했다. 예컨데, 2022년 1월 한 멤버의 어머니가 계약서에 서명하기 전 여러가지 변경사항을 요청했는데, 어도어 측 부사장이 “만약 위에 언급된 사항들을 포함해 현재 계약 초안에 동의하지 않으신다면, 계약 자체를 재고해 보는 것이 최선일 수 있다”고 답변한 사실을 공개했다. 뉴진스의 계약서에는 피부 관리, 성형 수술, 체형 교정 등 미용 관련 비용도 멤버들이 부담한다는 조항도 있었다. 멤버들은 연습생 시절 성형수술 및 기타 미용 시술에 회사가 지출한 금액의 상당 부분을 상환해야 했다는 것. 이에 대해 하이브 측 관계자는 “개인의 의사에 반하는 성형수술이나 시술을 권유하지도 않는다”고 NYT에 말했다. 계약서에는 또 계약 종료 이후에도 멤버들","category":"생활·문화"},{"title":"'배달기사가 내 짜장면 먹었다' 논란에…배민 \"고객 음식 아냐\"","link":"https://n.news.naver.com/mnews/article/277/0005839318","naverLink":"https://n.news.naver.com/mnews/article/277/0005839318","pubDate":"2026-11-07T10:03:02.328201+09:00","author":"네이버뉴스","description":"배민 \"폐기 처리한 음식\" 배달 음식 섭취 시 강한 제재 '배달 기사가 고객이 주문한 음식을 몰래 먹고 있었다'는 의혹에 대해 배달의민족 측이 \"폐기 처리한 음식을 먹은 것\"이라고 해명했다. 배달의민족 배달기사의 음식 무단 취식 의혹이 제기된 당시 모습. 배민 측은 음식이 파손돼 처리하는 과정에서 발생한 오해라고 해명했다. 스레드 캡처. 지난 5일 배달의민족 물류 서비스를 전담하는 우아한청년들은 입장문을 내고 \"전날(4일) 사회관계망서비스(SNS)에 배달 기사가 고객 주문 음식을 먹었다는 취지의 게시물이 올라왔다\"며 \"해당 건을 접수해 경위를 확인했으며 확인 결과와 당사 입장을 공유한다\"고 밝혔다. 이어 \"확인 결과 음식은 라이더가 비용을 부담하는 것으로 처리된 상황(자부담)\"이라며 \"고객이 파손 처리를 하는 과정을 목격해 오해가 생겼다\"고 설명했다. 그 러면서 \"고객께는 재조리된 음식과 함께 소정의 보상을 제공했다\"고 덧붙였다. 그러면서 우아한청년들은 배달 기사가 주문 음식을 전달하지 않고 임의로 먹는 행위에 대해서는 엄격한 제재 기준을 적용하고 있다고 강조했다. 회사 측은 \"고객 주문 음식을 전달하지 않고 취식하는 등 부정행위가 확인될 경우 '배민 커넥트' 이용 제한까지 가능한 강도 높은 정책을 운용하고 있다\"고 했다. 앞서 SNS에는 용인에 거주 중인 A씨가 \"아이들과 먹으려고 중국집에서 짜장면과 탕수육 등 여러 음식을 주문했다\"며 \"예정 시간이 지나도록 음식이 도착하지 않아 앱을 통해 기사의 위치를 확인했다\"고 적었다. 이어 그는 \"배달 기사가 우리 집으로 와야 하는데 오지 않길래 위치를 확인했더니 창밖으로 보이더라\"며 \"창밖으로 보니 배달 기사가 집 건너편에서 주문한 음식을 먹고 있었다\"고 주장했다. 글을 쓴 A씨에 따르면 배달 기사는 주변에서 쉽게 발견하기 어려운 집 맞은편 다리 아래서 배달할 음식을 개봉해 먹고 있었다. A씨는 글과 함께 배 달 기사의 뒷모습이 담긴 사진을 함께 공개했다. 배달의민족 측이 입장을 낸 후 A씨는 \"오늘(5일) 갑자기 환불해준다고 전화를 해주더라\"며 \"일단 상황 전달을 저에게 충분히 주지 못했으나 플랫폼이 잘못했다고는 생각하지 않지만, 이런 상황이 재발하지 않길 바라는 마음에 게시글을 올린 것\"이라 고 강조했다. 아울러 \" 플랫폼에 악의적인 마음은 없다. 해당 기사가 그렇다고 하는데 뭐 어쩌겠는가\"라면서도 \" 기사가 손을 입으로 가져가며 오토바이 주변을 서성이는 모습을","category":"생활·문화"},{"title":"\"배달기사가 음식 뜯어먹었다\" 발칵…알고 보니 '반전'","link":"https://n.news.naver.com/mnews/article/015/0005351218","naverLink":"https://n.news.naver.com/mnews/article/015/0005351218","pubDate":"2026-11-07T00:26:26.121652+09:00","author":"네이버뉴스","description":"배달 음식이 훼손됐다는 고객의 주장으로 논란이 일었지만, 확인 과정에서 처음 알려진 내용과 다른 정황이 드러나며 반전이 생겼다. 배달 과정의 영상과 사실관계를 확인하지 않은 채 한쪽 주장만 믿을 경우 오해가 커질 수 있다는 점을 보여준 사례다.","category":"생활·문화"},{"title":"“美 조지아 공장에 9조원대 투자”…아우디 발표에 독일서 ‘역외 투자’ 논란","link":"https://n.news.naver.com/mnews/article/009/0005760284","naverLink":"https://n.news.naver.com/mnews/article/009/0005760284","pubDate":"2026-11-07T00:25:30.007097+09:00","author":"네이버뉴스","description":"아우디.[EPA=연합뉴스] 독일 자동차업체 아우디가 미국 조지아주에 건설하는 신규 공장에 최대 9조원 이상의 투자를 추진한다. 미국의 자동차 관세 부담을 줄이기 위한 현지 생산 거점 확보에 나섰지만 독일 내 공장 폐쇄 가능성이 제기된 상황에서 대규모 자금을 미국에 투입하는 것을 두고 현지에서는 비판이 나오고 있다. 5일(현지시간) 로이터통신에 따르면 조지아 중부 공동개발청 문건에는 아우디가 조지아주 메이컨 공장 건설 2단계 사업에 2033년까지 30억달러(약 4조1000억원)를 투자한다는 계획이 담겼다. 앞서 도널드 트럼프 미국 대통령은 지난달 24일 조지아주 선거 유세에서 아우디가 42억달러(약 5조7000억원)를 들여 연간 20만대를 생산할 수 있는 공장을 건설한다고 발표했다. 두 단계 사업을 합친 투자 규모는 72억달러로, 한화 약 9조8000억원에 달한다. 아우디는 2031년 공장 가동을 시작해 스포츠유틸리티차(SUV)를 생산할 계획이다. 사업이 모두 마무리되면 기존 인력 4500명에 더해 2033년까지 현지 직원 3000명을 추가로 고용한다. 조지아주는 공장 부지 1500에이커(약 607만㎡)와 4억5900만유로 규모의 세제 혜택을 제공하기로 했다. 이번 투자는 미국의 자동차 관세에 대응하기 위한 조치로 풀이된다. BMW 등 경쟁사와 달리 미국 내 생산시설이 없는 아우디는 트럼프 행정부의 관세 정책으로 상대적으로 큰 부담을 안았다. 아우디는 공장 신설을 조건으로 유럽연합(EU)에서 미국으로 수출하는 자동차에 적용되는 관세를 15%에서 7.5%로 낮춰달라고 요구했지만, 미국 상무부와 10% 안팎의 세율에 합의할 가능성이 있다고 로이터는 전했다. 그러나 독일에서는 미국 투자를 둘러싼 반발이 커지고 있다. 모회사 폭스바겐그룹이 비용 절감을 위해 독일 네카르줄름의 아우디 공장 폐쇄를 논의하는 상황에서 해외에 대규모 생산시설을 짓는 것은 부적절하다는 지적이다. 게르노트 될너 아우디 최고경영자(CEO)가 트럼프 대통령의 중간선거 유세 무대에 함께 오른 것도 논란을 키웠다. 일부 정치권과 노동계 인사들은 될너 CEO가 트럼프 대통령의 선거 운동에 이용됐다며 사퇴를 요구했다. 익명의 아우디 임원은 당시 상황을 두고 “비현실적 장면이자 냉혹한 자본주의 자체였다”고 비판했다. 미국 공장 신설은 독일 니더작센주 정부와 노동자 대표가 참여하는 폭스바겐그룹 감독이사회의 승인을 받아야 한다. 노조 측인 다니엘라 카발로 사업장평","category":"생활·문화"}],"세계":[{"title":"트럼프, 비서실장에 '총리 별명' 충성파…美우선주의 마이웨이(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427650","naverLink":"https://n.news.naver.com/mnews/article/001/0016427650","pubDate":"2026-11-07T10:52:54.680374+09:00","author":"네이버뉴스","description":"'강경 이민정책 설계자' 스티븐 밀러 낙점…민주당 반발·여권도 우려 트럼프, 중간선거 패배 사흘만에 비서실장 교체하며 기존 정책기조 고수 천명 밀러 \"힘이 국제질서 좌우\" 제국주의적 세계관…공세적 대외정책 우려 커져 스티븐 밀러 신임 백악관 비서실장 [AFP=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 백나리 특파원 = 도널드 트럼프 미국 대통령이 중간선거 패배 사흘 만에 스티븐 밀러(41) 백악관 부비서실장을 비서실장에 낙점한 것은 중간선거 참패에도 '마이웨이'를 고수하겠다는 의지를 분명히 한 행보라는 평가다. '강경 이민정책의 설계자'이자 대외정책에 있어 제국주의적 시각을 보여온 최측근을 '최고위 호위무사'에 앉힘으로써 민심의 심판을 받은 핵심 정책을 내려놓지 않고 상·하원 권력을 접수한 민주당을 상대로 공세적 대응에 나서겠다는 뜻을 천명한 것으로 풀이된다. 트럼프 대통령이 6일(현지시간) 신임 백악관 비서실장으로 낙점해 발표한 밀러 부비서실장은 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프 대통령의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프 대통령의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것이라는 분석이다. 트럼프 행정부의 대표 정책이 정당했다는 주장을 고수하며 민주당과의 충돌을 불사하겠다는 의지나 다름없어서 당분간 미국 국내 정치에 큰 혼란이 예상된다. 밀러 신임 실장은 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 '좌파 척결'에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 당장 민주당 지도부는 이번 인선을 \"최악의 선택\"이라 맹폭하며 밀러 신임 실장에 대한 의회 차원의 조사를 예고했다. 밀러 신임 실장의 관여 속에 추진되는 행정부 정책에도 맞서 싸우겠다는 입장도 분명히 했다. 트럼프 대통령 지켜보는 밀러 신임 실장 [AFP=연합뉴스. 재판매 및 DB 금지]","category":"세계"},{"title":"트럼프, '대선 공신' 와일스 경질... '강경파' 밀러 전면 배치","link":"https://n.news.naver.com/mnews/article/469/0000964178","naverLink":"https://n.news.naver.com/mnews/article/469/0000964178","pubDate":"2026-11-07T10:52:54.680368+09:00","author":"네이버뉴스","description":"의회 내주고도 타협 대신 돌파 反이민 설계자 앞세운 백악관 미 백악관 비서실장에 발탁된 스티븐 밀러(오른쪽). EPA 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거 참패 사흘 만인 6일(현지시간) 수지 와일스 백악관 비서실장을 경질하고, 후임에 강경파 최측근인 스티븐 밀러 백악관 부비서실장을 발탁했다. 선거 패배에 따른 정책 기조 수정 대신 정권 내 최고 강경론자를 전면에 내세워 정면 돌파를 선택했다는 평가가 나온다. 트럼프 대통령은 이날 자신의 사회관계망서비스(SNS)인 트루스소셜을 통해 \"오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다\"고 발표했다. 트럼프 대통령은 밀러를 향해 \"내가 가장 신뢰하는 참모 중 한 명\"이라고 치켜세웠다. 와일스 실장에 대해선 \"훌륭한 일을 해냈고 감사하다\"며 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 했다. 트럼프 대통령은 이후 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 중간선거 패배에 따른 문책성 인사라는 점을 암시했다. 대선 일등공신의 퇴장… 예견된 불화설 도널드 트럼프 2기 미국 행정부의 백악관 비서실장에서 경질된 수지 와일스. AP 연합뉴스","category":"세계"},{"title":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:52:54.680347+09:00","author":"네이버뉴스","description":"신임 비서실장에 스티븐 밀러 부비서실장 임명 트럼프 강경파 측근, 반이민 정책 설계 도널드 트럼프 대통령. 게티이미지닷컴 [헤럴드경제=박병국 기자] 도널드 트럼프 미국 대통령이 6일 백악관 비서실장을 수지 와일스에서 스티븐 밀러(41) 부비서실장으로 교체한다고 밝혔다. 11·3 중간선거에서 공화당이 참패한 지 사흘 만이다. 트럼프 대통령은 이날 소셜미디어 트루스소셜에서 오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다고 발표했다고 연합뉴스가 전했다. 그러면서 밀러 신임 비서실장에 대해 “내가 가장 신뢰하는 참모 중 하나”라고 말했다. 밀러는 트럼프 대통령의 대표적인 강경파 측근으로 꼽힌다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지냈다.반이민 정책을 설계하고 추진해왔다. 2기 행정부에서는 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도해왔다. 백악관은 별도 자료를 내고 밀러 신임 비서실장에 대해 “폭력 범죄를 사상 최저 수준으로 낮추고, 국경 보안을 전례 없는 수준으로 강화하며, 대규모 사기 사건을 근절하는 등 현 행정부의 주요 성과 뒤에 숨은 원동력이 되어왔다”고 말했다. 민주당은 밀러에 대해 “가장 야만적이고 비인간적인 정책을 설계한 인물”(척 슈머 상원 원내대표), “위험한 외국인 혐오자”(하킴 제프리스 하원 원내대표)라고 비판했다. 트럼프 대통령은 물러나는 와일스 비서실장에 대해선 “훌륭한 일을 해온 수지 와일스는 트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것”이라며 “비서실장으로 헌신해준 데 대해 감사하다”고 밝혔다. 와일스는 트럼프 대통령의 2024년 대선 승리를 이끈 선거대책위원장 출신이다. 2기 행정부 출범부터 지금까지 백악관 운영을 총괄해온 핵심 참모다. 미 역사상 최초의 여성비서실장이다. 다만 트럼프 대통령은 ‘트럼프 정치조직’이 어떤 조직인지에 대해선, 언급하지 않았다. 밀러 신임 비서실장은 자신의 엑스(X)를 통해 비서실장으로 임명된 것을 “영광으로 생각한다”고 말했다. 와일스는 엑스에서 “백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광”이었다며 “내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것”이라고 썼다. 트럼프 대통령은 백악관에서 기자들과 만나 이번 인적 개편에 대해 와일스 비서","category":"세계"},{"title":"선거 진 트럼프, ‘反이민 강경파’ 비서실장 기용…더 세게 나간다","link":"https://n.news.naver.com/mnews/article/020/0003760770","naverLink":"https://n.news.naver.com/mnews/article/020/0003760770","pubDate":"2026-11-07T10:52:54.680304+09:00","author":"네이버뉴스","description":"‘대선 승리 일등공신’도 문책…트럼프, 참패 후 백악관 인적 쇄신 ‘와일스 패싱’에 정책 이견 누적…트럼프 신임 잃고 결국 퇴진 ‘反이민 설계자’ 밀러에 지휘봉…노선 수정 대신 대결 택해 도널드 트럼프 미국 대통령과 스티븐 밀러 신임 백악관 비서실장. 백악관 엑스 도널드 트럼프 미국 대통령이 중간선거 참패 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 전격 교체했다. 후임에는 강경한 반(反)이민 정책을 설계해 온 스티븐 밀러 백악관 부비서실장을 발탁했다. 공화당이 연방 상·하원 모두 민주당에 내준 가운데, 트럼프 대통령이 선거 참패의 책임을 핵심 참모에게 돌리면서도 정작 패배를 초래한 주요 정책에 대해선 수정 대신 강경 대응을 선택한 것으로 풀이된다. 민주당의 의회 장악으로 집권 후반기 국정 운영에 제동이 걸린 가운데, 온건파보다 충성파를 앞세워 정면 돌파에 나서려는 의도라는 분석도 나온다. ● 중간선거 참패 사흘 만에 ‘백악관 실세’ 교체 교체된 수지 와일스 백악관 비서실장. AP뉴시스","category":"세계"},{"title":"표차 2천표 미만…美미시시피 상원선거 ‘서약투표’ 공방","link":"https://n.news.naver.com/mnews/article/422/0000923699","naverLink":"https://n.news.naver.com/mnews/article/422/0000923699","pubDate":"2026-11-07T10:52:54.680288+09:00","author":"네이버뉴스","description":"미시시피주 개표 현장 [연합뉴스 제공] 미국 미시시피주 상원의원 선거가 개표 나흘째에도 승자를 가리기 어려운 초접전 양상을 보이는 가운데, 양당 후보가 ‘서약 투표지’ 처리를 두고 충돌하고 있습니다. 현지시간 6일 로이터통신 등에 따르면 민주당 스콧 콜롬 후보는 49.0%를 얻어 공화당 현역 신디 하이드-스미스 상원의원의 48.8%를 0.2%포인트 앞서고 있습니다. 개표율은 96%로 두 후보 간 표 차이는 2천표가 채 되지 않는 것으로 전해졌습니다. 쟁점은 아직 개표되지 않은 ‘서약 투표지’입니다. 서약 투표지는 신분증이 없거나 유권자 등록 기록이 일치하지 않아 투표소에서 자격을 즉시 확인하기 어려운 유권자가 서약서와 함께 제출하는 투표지입니다. 하이드-스미스 의원 측은 미시시피주 82개 카운티 선거 당국에 서한을 보내 서약 투표지를 일반·부재자 투표지와 분리해 보관해달라고 요구했습니다. 반면 콜롬 후보 측은 이런 조치가 특정 투표지를 차별적으로 다루는 불법 행위가 될 수 있다며 반발했습니다. 아직 개표되지 않은 서약 투표지는 약 1만2천~2만장으로 추산됩니다. 올해 미시시피에서는 유권자 명부 정리 과정에서 정보 불일치 사례가 늘면서 서약 투표가 증가했을 가능성도 제기되고 있습니다. 미시시피주는 미국 50개 주 가운데 유일하게 자동 재개표 관련 조항이 없는 만큼, 개표 결과를 둘러싼 이견이 커질 경우 법정 다툼으로 이어질 가능성도 있습니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"세계"},{"title":"젠슨 황, 중국 간첩 의혹 여성과 무슨 사이?…美의회 출석 요구","link":"https://n.news.naver.com/mnews/article/666/0000130980","naverLink":"https://n.news.naver.com/mnews/article/666/0000130980","pubDate":"2026-11-07T10:49:02.624910+09:00","author":"네이버뉴스","description":"美 공화당 핵심 위원장 3명, 18일 비공개 브리핑 참석 요청 엔비디아 정보 유출 의혹 부인…황 CEO 자산 하루 새 20조원 감소 중국 스파이로 지목받는 앨리스 황(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO)가 2024년 대만 타이베이의 술집에 나란히 앉아 있는 모습. 링크트인 갈무리 젠슨 황 엔비디아 최고경영자(CEO)가 중국 정보기관과 연계됐다는 의혹을 받는 여성 기업인과의 관계를 해명하라는 미국 의회의 요구를 받았다. 7일 미국 정치전문매체 악시오스와 로이터통신 등에 따르면 미 하원 주요 상임위원회 위원장 3명은 황 CEO에게 오는 18일 비공개 의회 브리핑에 참석해 관련 의혹을 설명해 달라는 공동 서한을 보냈다. 서한에는 공화당 소속 브라이언 매스트 하원 외교위원장과 존 물레나르 미중전략경쟁특별위원장, 릭 크로퍼드 정보위원장이 이름을 올렸다. 이들이 문제 삼은 인물은 싱가포르 데이터센터 기업 메가스피드의 전직 임원 앨리스 황이다. 중국계 여성인 앨리스 황은 미국 정보당국으로부터 중국 정부에 정보를 전달했다는 의혹을 받고 있다. 의원들은 황 CEO와 앨리스 황이 어떤 관계를 맺어왔는지, 엔비디아가 외국 정보기관의 산업기밀 탈취 시도에 대비해 어떤 보안 조치를 시행하고 있는지 설명할 것을 요구했다. 이들은 최근 언론 보도가 미국의 국가안보에 심각한 우려를 불러일으켰다며 “국가안보가 어느 정도 위험에 노출됐는지 파악해야 한다”고 강조했다. 의혹은 지난달 29일 뉴욕타임스(NYT) 보도에서 시작됐다. NYT는 미국 정보당국이 앨리스 황을 조사하는 과정에서 그가 황 CEO와 긴밀한 관계를 형성한 사실을 파악했다고 전했다. 앨리스 황이 엔비디아의 첨단 AI 반도체 사업과 관련한 정보를 중국 측에 전달했을 가능성도 제기했다. 메가스피드는 엔비디아의 AI 반도체를 구매하는 업체로, 미국의 대중국 반도체 수출 규제를 우회하는 데 관여했는지 당국의 조사를 받아왔다. 월스트리트저널(WSJ) 역시 복수 국가의 관계자들이 앨리스 황을 통한 민감한 기술정보 유출 가능성을 우려하고 있다고 보도했다. 특히 도널드 트럼프 미국 대통령이 약 1년 전 관련 정보당국의 보고를 받고도 별다른 조치를 취하지 않았다는 의혹까지 제기되면서 논란이 커졌다. 다만 현재까지 황 CEO가 중국의 정보 수집 활동에 가담했거나 국가안보 관련 기밀을 직접 유출했다는 사실이 확인된 것은 아니다. 엔비디아도 관련 의혹을 부인했다. 회사 측은 황 CEO가 매년","category":"세계"},{"title":"중간선거 참패 사흘 만에 칼 빼든 트럼프…백악관 비서실장에 강경파 밀러","link":"https://n.news.naver.com/mnews/article/654/0000209850","naverLink":"https://n.news.naver.com/mnews/article/654/0000209850","pubDate":"2026-11-07T10:49:02.624840+09:00","author":"네이버뉴스","description":"백악관·내각 추가 개편 주목 \"트럼프, 선거 패배 뒤 와일스에 불만\" 밀러 기용에 강경노선 강화되나 ▲ 도널드 트럼프 미국 대통령 [연합뉴스 자료사진] 도널드 트럼프 미국 대통령이 공화당의 중간선거 참패 이후 사흘 만에 백악관 비서실장을 전격 교체했다. 집권 2기 백악관 운영을 총괄해온 수지 와일스 비서실장 대신 강경 이민정책을 주도한 최측근 스티븐 밀러(41) 부비서실장을 기용하면서 행정부 전반의 추가 인적 쇄신으로 이어질지 주목된다. 연합뉴스에 따르면 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 밀러 부비서실장이 오는 9일부터 비서실장직을 맡는다고 발표했다. 트럼프 대통령은 밀러에 대해 \"내가 가장 신뢰하는 참모 중 하나\"라고 소개했다. 와일스 비서실장은 백악관을 떠나 트럼프 정치조직(Trump Political Operation)으로 자리를 옮긴다. 다만 트럼프 대통령은 해당 조직의 구체적인 역할이나 와일스의 새 보직에 대해서는 설명하지 않았다. 트럼프 대통령은 와일스에게 감사를 표하며 \"훌륭한 일을 해왔다\"고 평가했다. 다만 백악관에서 기자들과 만난 자리에서는 \"변화를 주고 싶었다\"고 말해 이번 인사가 중간선거 결과와 무관하지 않음을 시사했다. 와일스는 엑스(X)를 통해 백악관에서 트럼프 대통령을 보좌한 시간을 돌아봤다. 그는 \"백악관에서 트럼프 대통령을 보좌한 것은 평생의 영광\"이었다며 \"국경 강화와 세금 감면부터 경제 강화, 미국 우선주의 실현에 이르기까지 우리가 함께 이룬 성과에 기여한 것이 자랑스럽다\"고 밝혔다. 이어 \"내 역할은 바뀔 수 있지만 대통령과 사명에 대한 내 헌신은 결코 변하지 않을 것\"이라고 강조했다. 이번 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 직후 단행됐다. 트럼프 대통령이 집권 2기 출범부터 백악관을 관리해온 핵심 참모를 교체했다는 점에서 후속 인사에도 관심이 모인다. 앞서 월스트리트저널(WSJ) 등 미국 언론은 트럼프 대통령이 선거 패배 이후 백악관과 내각을 개편할 가능성이 있다고 보도했다. 비서실장 교체가 첫 조치인 만큼 다른 행정부 인사들의 거취에도 변화가 있을 수 있다는 관측이 제기된다. 미국 언론들은 와일스 비서실장과 트럼프 대통령 사이에 최근 갈등이 있었다고 전했다. 뉴욕타임스(NYT)는 백악관 내부 사정에 정통한 소식통들을 인용해 트럼프 대통령이 최근 주요 인사 결정 과정에서 와일스를 배제했다고 보도했","category":"세계"},{"title":"국제유가, 전날 8%대 폭락 후 반등…WTI 2.7%·브렌트 3.9%↑","link":"https://n.news.naver.com/mnews/article/001/0016425251","naverLink":"https://n.news.naver.com/mnews/article/001/0016425251","pubDate":"2026-11-07T10:49:02.624802+09:00","author":"네이버뉴스","description":"종전 기대 과도했다는 인식…중동 유조선 공격도 지속 미국 로스앤젤레스의 한 주유소 [EPA=연합뉴스 자료사진. 재판매 및 DB 금지] (뉴욕=연합뉴스) 임수정 특파원 = 국제유가가 5일(현지시간) 전날 8% 넘게 폭락한 데 따른 반발 매수세가 유입되면서 반등했다. 미국 중간선거 이후 이란 전쟁의 조기 종식에 대한 기대가 커졌지만, 중동 지역에서 유조선 공격이 이어지면서 원유 공급 차질에 대한 우려가 다시 부각됐다. 이날 뉴욕상업거래소에서 12월 인도분 서부텍사스산원유(WTI)는 전장보다 2.40달러(2.72%) 오른 배럴당 90.52달러에 거래를 마쳤다. 글로벌 원유 가격의 기준인 브렌트유 1월 인도분 선물 종가는 전장보다 3.67달러(3.88%) 상승한 배럴당 98.29달러를 기록했다. 국제유가는 전날 미국 중간선거에서 민주당이 상·하원을 모두 장악하면서 이란 전쟁이 조기에 끝날 수 있다는 기대에 8% 넘게 폭락했다. WTI와 브렌트유 모두 지난 8월 31일 이후 최저 수준으로 떨어졌지만, 이날은 중동 지역의 원유 공급 불확실성이 재부각되면서 상승세로 돌아섰다. 원유시장 분석업체 겔버앤드어소시에이츠는 이날 보고서에서 \"이날 유가 반등은 외교적 진전이 안정적인 원유 수송과 공급으로 이어지기도 전에 원유 흐름이 빠르게 정상화될 것으로 예상하는 데 대한 경계심을 반영한다\"고 분석했다. 중동 지역에서 유조선을 겨냥한 공격이 계속되는 점도 유가를 끌어올렸다. 영국 해사무역기구(UKMTO)에 따르면 지난 1일 이후 걸프 해역에서 최소 5척의 선박이 공격 등 사고를 보고했다. 미국과 이란 간 협상이 교착 상태를 벗어나지 못하면서 군사적 긴장이 장기화할 수 있다는 우려도 제기됐다. 정치위험 분석업체 유라시아그룹은 미국이 이란에 대한 군사공격을 재개할 가능성을 기존 65%에서 60%로 낮췄지만, 양측이 합의에 도달할 가능성도 20%에서 10%로 하향 조정했다. 반면 대치 상태가 지속될 가능성은 15%에서 30%로 높였다. 조반니 스타우노보 UBS 원자재 애널리스트는 \"중동 상황이 여전히 해결되지 않았으며, 이것이 현재 유가가 일부 반등하는 이유\"라고 설명했다. sj9974@yna.co.kr","category":"세계"},{"title":"이란, 핵개발 관련 중재국 제안 검토... 외교 물꼬 기대-NYT","link":"https://n.news.naver.com/mnews/article/014/0005600326","naverLink":"https://n.news.naver.com/mnews/article/014/0005600326","pubDate":"2026-11-07T10:43:52.516138+09:00","author":"네이버뉴스","description":"모흐센 레자이 이란 최고국가안보회의 사무총장.AP뉴시스 [파이낸셜뉴스] 미국과의 전쟁을 종식하기 위한 교착 상태의 외교적 노력으로 이란 전쟁에 돌파구가 마련될 조짐이 보이고 있다. 이란이 핵 프로그램의 미래를 다룬 중재국들의 제안을 검토 중인 것으로 확인됐다. 5일(현지시간) 뉴욕타임스(NYT)는 협상 관련 전현직 당국자들의 말을 인용해 몇 주간 강경 태도를 고수하던 이란이 핵 협상 재개 의사를 보였다며 전면전 재발을 막기 위해 카타르가 주도해 온 중재 노력이 결실을 보기 시작하고 있다고 보도했다. 이들 당국자는 이란이 검토 중인 조항들이 \"구체적인 제안\"이라고 설명했다. 카타르는 지난주 테헤란에서 두 차례 협상을 진행하고 자국 수도 도하에서 세 번째 회담을 주최하는 등 적극적인 외교전을 펼쳐왔다. 카타르 측은 아르메니아에서도 이란 당국자들과 만남을 가진 것으로 알려졌다. 미국 측에서는 JD 밴스 부통령이 군사적 충돌을 막기 위한 카타르 주도 외교를 적극 지지하고 있다. 밴스 부통령은 이번 주 중간선거에서 공화당이 대패한 원인으로 이란과의 전쟁을 지목하며 트럼프 대통령과 일정 부분 거리를 두는 모습을 보이기도 했다. 앞서 밴스 부통령은 지난달 모흐센 레자이 이란 최고국가안보회의 의장에게 이란의 핵 프로그램을 포함한 직통 평화 회담을 제안하는 서한을 보냈다. 레자이 의장은 이 서한에 대해 \"미국이 이란에 대한 태도를 바꾼 증거이자 이란 승리의 표식\"이라고 평가한 바 있다. 지난 2월 미국과 이스라엘이 이란을 공격하기 전에도 밴스 부통령은 도널드 트럼프 대통령의 측근 중 전면전에 가장 반대했던 인물로, 전쟁이 지역적 혼란과 막대한 인명 피해를 불러올 것이라고 경고했었다. 밴스는 최근 \"트럼프 대통령과 본인 모두 협상을 통한 타결 가능성에 긍정적\"이라며 진전이 있음을 내비쳤다. 이번 외교적 움직임은 트럼프 대통령과 이스라엘이 이란의 에너지 인프라 등 경제적 핵심 요충지를 겨냥한 대규모 공격을 검토 중인 가운데 이뤄졌다. 미국과 이란은 지난 6월 휴전에 합의하며 핵 문제 논의와 호르무즈 해협 재개방을 추진했으나, 협상이 결렬되면서 수개월간 교착 상태에 빠졌었다. 최근 양국 간 비난 수위가 높아지자 카타르 중재진이 막판 중재에 나선 것이다. 레자이 의장은 공개적으로는 동결 자산 해제, 석유 제재 및 봉쇄 해제 없이는 핵 협상이 없다고 밝혔으나, 비공개 자리에서는 아바스 아라그치 이란 외무장관, 모하마드 바케르 갈리바프","category":"세계"},{"title":"이란, 거부해 온 핵 활동 협상 검토 중","link":"https://n.news.naver.com/mnews/article/003/0014307510","naverLink":"https://n.news.naver.com/mnews/article/003/0014307510","pubDate":"2026-11-07T10:26:05.519731+09:00","author":"네이버뉴스","description":"카타르 등 중재국들 제안한 새 방안 2일 동안 신뢰구축 조치 뒤 핵 협상 [빈=AP/뉴시스] 이란과 미국의 국기. 오스트리아 빈 국제센터에서 지난 2015년 7월14일(현지시간) 열린 이란 핵 협상 테이블에 놓였던 것이다. 2026.11.7. [워싱턴=AP/뉴시스] 강영진 기자 = 이란이 핵 프로그램을 둘러싼 미국과의 이견을 해소하기 위해 핵심 중재국인 카타르가 제시한 제안들을 검토하고 있다고 중동 지역 정부 당국자 2명이 6일(현지시각) 밝혔다. 이 같은 움직임은 도널드 트럼프 미 대통령이 전쟁 종료를 위해 반드시 해결돼야 한다고 밝힌 핵문제를 두고 이란과 미국이 간접 협상에 조금씩 다가서고 있다는 기대를 높인다. 그러나 당국자 중 1명은 이란이 현재로서는 미국이 이란이 제시한 휴전 합의 조건에 동의하기 전에는 핵활동에 관한 협상에 나설 의사가 없다고 강조했다. 이란이 핵 협상에 나서기 전에 충족돼야 한다고 밝힌 핵심 요구 사항에는 미국의 이란 항구 봉쇄 해제, 제재 철폐, 동결 자산 해제, 전쟁 피해에 대한 배상, 레바논에서의 이스라엘 군사작전을 포함한 역내 전 지역의 적대 행위 종식이 포함된다. 이란 전쟁이 공화당의 선거 패배에 영향을 미친 뒤 협상에 대한 희망의 조짐이 나타나고 있다. 트럼프는 6일 기자들과 문답하는 과정에서 중재국들의 이란과의 논의가 계속되고 있다고 밝혔다. 트럼프는 “우리는 이란과 대화하고 있다. 이전부터 그래 왔다”고 말했다. 카타르와 이란은 핵 협상으로 나아가기 위한 가교 합의를 논의하고 있다. 역내 당국자들에 따르면 중재국들과 이란은 테헤란의 핵 프로그램에 관한 추가 협상의 길을 여는 데 도움이 될 잠정적 중간 단계 합의를 논의했다. 당국자들은 카타르가 최근 양측에 제시한 이 제안이 이틀에 걸쳐 신뢰 구축 조치를 이행하도록 하는 내용을 담고 있다고 말했다. 이 조치에는 미국의 봉쇄 해제와 이란의 핵 프로그램을 둘러싸고 이란을 고립시키려는 미국의 정책에 따라 수년 동안 압류해 동결한 이란 자금 수십억 달러 가운데 일부를 풀어 주는 방안이 포함된다. 그 대가로 이란은 미국과 이스라엘의 폭격을 받은 자국 시설에 국제원자력기구(IAEA) 사찰단이 들어오는 것을 허용하게 된다고 당국자들은 말했다. 당국자들에 따르면 둘째 날에는 이란이 호르무즈 해협을 다시 개방하게 된다. 이는 이란과 오만이 해당 해협을 놓고 합의했으나 미국의 승인을 받지 못한 수정 합의에 따른 것이다. 이러한 조치들이 이","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:52:55.189484+09:00","author":"네이버뉴스","description":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:52:55.189482+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:52:55.189479+09:00","author":"네이버뉴스","description":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:52:55.189477+09:00","author":"네이버뉴스","description":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:52:55.189473+09:00","author":"네이버뉴스","description":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:52:55.189471+09:00","author":"네이버뉴스","description":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:52:55.189466+09:00","author":"네이버뉴스","description":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:52:55.189456+09:00","author":"네이버뉴스","description":"최정달 솔리다임 부사장, FG 구조 경쟁력 강조 삼성·SK하이닉스, CTF 기반 고적층 경쟁 FG, 셀별 전하 저장 공간 분리…QLC 구현 강점 AI 추론 확산에 KV캐시 저장 수요 증가 SK하이닉스, CTF·FG 투트랙 전략 대응 ‘칩칩팹팹(Chip Chip Fab Fab)’​은 AI 시대를 움직이는 반도체 산업을 쉽고 깊이 있게 풀어내는 연재입니다. AI 혁명의 핵심인 ‘칩(Chip)’과 이를 만드는 ‘팹(Fab)’을 잇는 이름으로, ‘칙칙폭폭’ 달리는 기차처럼 반도체 산업의 쉼 없는 진보를 담은 표현이기도 합니다. 복잡한 기술은 쉽게, 뉴스 이면의 이야기와 산업의 흐름은 깊이 있게 전하며, AI 시대를 이끄는 반도체의 현재와 미래를 독자들과 함께 읽어갑니다. 솔리다임 미국 캘리포니아주 소재 본사 모습. [솔리다임 제공] [헤럴드경제=이정완 기자] “솔리다임은 낸드가 단순히 저장 용량을 추가하는 수단이 아니라 인공지능(AI)의 경제성을 구조적으로 뒷받침하는 역할을 하도록 노력하고 있다. 이를 위해 고밀도 낸드의 지속 가능한 확장, 비트당 원가 경쟁력 유지, 초대규모 AI 인프라의 경제성 확보에 집중하고 있다.”(최정달 솔리다임 낸드개발총괄 부사장) 7일 업계에 따르면 최정달 부사장은 최근 회사 공식 뉴스룸을 통해 AI 추론 시대에 솔리다임의 낸드 개발 방향성에 대해 언급했다. 눈길을 끄는 건 최 부사장이 플로팅 게이트(FG) 방식을 언급한 점이다. 그는 FG 방식이 AI 추론 과정에서 생성되는 중간 데이터인 KV(Key-Value)캐시 증가와 대규모 컨텍스트 저장에 부합한다고 강조했다. 최 부사장은 SK하이닉스에서 낸드 개발을 총괄하다가 2025년 솔리다임으로 이동했다. 삼성전자 출신인 낸드 개발 전문가인 그는 2016년 SK하이닉스로 이직해 낸드 기술력 강화를 이끌었다. 낸드 영역에서만 30년 넘는 개발 경력을 보유하고 있다. 최정달(왼쪽) 솔리다임 낸드개발총괄 부사장과 브라이언 클리어먼 낸드 개발 공정·통합 부문 총괄. [솔리다임 제공]","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:52:55.189452+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:52:55.189439+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[]},"archive":{"date":"2026-11-06","weekday":"금요일","label":"보관 · 11월 6일 금요일","total":49,"categories":{"사건 사고":[{"title":"\"분리 조치 이틀 만에\" 전 연인 둔기로 수십차례 때려 살해한 70대男…징역 15년","link":"https://n.news.naver.com/article/088/0001038903","pubDate":"2026-11-06T23:00:09+09:00","author":"매일신문","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고","naverLink":"https://n.news.naver.com/article/088/0001038903"},{"title":"“요양보호사가 80대 환자 밀쳐 중상” 가족이 고소···경찰, 수사 착수","link":"https://n.news.naver.com/article/032/0003481193","pubDate":"2026-11-06T22:29:00+09:00","author":"경향신문","description":"전남 나주경찰서. 연합뉴스요양보호사가 80대 환자를 밀쳐 중상을 입혔다는 고소장이 접수돼 경찰이 수사에 나섰다.6일 전남 나주경찰서에 따르면 80대 환자 A씨의 가족은 폭행치상 등 혐의로 나주 한 요양병원의 요양보호사 B씨를 수사해달라는 내용의 고소장을 제출했다.고소인들은 A씨가 B씨에게 밀려 넘어지면서 고관절 부위를 크게 다쳤다고 주장했다. 또 간호조무사···","category":"사건 사고","naverLink":"https://n.news.naver.com/article/032/0003481193"},{"title":"“100여차례 여탕 몰카”…아내가 찍고 남편이 팔아 4300만원 챙긴 日 부부","link":"https://n.news.naver.com/article/030/0003483150","pubDate":"2026-11-06T22:20:00+09:00","author":"전자신문","description":"일본에서 젊은 부부가 목욕탕에 몰래카메라를 설치하거나 휴대전화를 이용해 여성들의 모습을 불법 촬영한 뒤, 영상을 온라인으로 판매한 혐의로 경찰에 검거됐다. 아내가 현장에서 촬영을  지난 4일(현지시간) 바티칸 교황청 성 베드로 광장에서 레오 14세 교황을 만나 우리나라 최초 사제인 김대건 신부 성상을 건네고 있다. (사진=당진시 제공) 2026.11.06. photo@newsis.com *재판매 및 DB 금지 [당진=뉴시스]김덕진 기자 = 충남 당진시가 연말을 앞두고 민생살리기 100일 비상대책 중 하나로 점심 시간대 불법 주정차 단속을 유예한다. 6일 시는 오는 9일부터 내년 2월28일까지 111일 간 한시적으로 불법 주정차를 허용한다고 밝혔다. 시는 또 단속 유예시간 역시 기존 시간에서 전·후 30분씩 확대해 오전 11시부터 오후 2시30분까지 적용한다 다만 시는 이번 유예에 어린이보호구역과 주민신고제 구간 포함, 채운동 설악가든(1146번지), 금남철문(278의1번지), 한진근린공원(복운리 2의10번지) 세 지점은 제외한다. 여기에 시는 상습정체구역인 ▲농협사거리 ▲당진터미널 앞 ▲행동교 ▲베스트부동산 앞 일원도 이번 유예에서 제외할 방침이다. ◇김기재 시장 교황 레오 14세 알현…솔뫼성지 방문 요청 김기재 당진시장이 이탈리아 출장길 바티칸에 들러 레오14세 교황을 알현하고 2027년 천주교 서울세계청년대회를 위해 우리나라를 찾을 때 솔뫼성지 방문을 공식 요청했다. 6일 당진시에 따르면 김 시장은 지난 4일(현지시간) 바티칸 교황청 성 베드로 광장에서 레오 14세 교황을 만나 우리나라 최초 사제인 김대건 신부 탄생지 당진 솔뫼성지를 찾아달라는 뜻을 전달했다. 그는 1984년 방문한 요한바오로 2세 교황이 김대건 신부를 시성한 것과 2014년 프란치스코 교황이 솔뫼성지를 찾은 사실을 언급하며 상징성을 강조했다. 바티칸은 지난 2021년 탄생 200주년을 맞은 김 신부 성상을 2023년 교황청에 성상으로 세웠다.","category":"사회"},{"title":"���ǻ� ������, ���� �帱�Կ䡱 77�� �鿩 ���ұ��� ���� ����̡��ǻ� ���ϱ� �󸶳� ����淡","link":"https://n.news.naver.com/mnews/article/011/0004679647","naverLink":"https://n.news.naver.com/mnews/article/011/0004679647","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"클립아트코리아 농어촌 지역에서 의사 구하기가 하늘의 별 따기가 되자 지방자치단체가 숙소까지 지어 의료진 모시기에 나섰다. 전남광주통합특별시는 6일 강진의료원 의사 숙소 준공식을 열었다. 2023년부터 올해까지 4년간 77억3500만원을 들여 지은 숙소는 연면적 1508.25㎡, 지상 3층, 20세대 규모다. 의료진의 주거 부담을 덜어 농어촌 지역 의사를 확보하고, 지역 공공의료의 질을 높이려는 취지다. 강진의료원에는 현재 전문의와 공중보건의사, 시니어의사 등 의사 18명이 근무하고 있다. 전남광주시는 간호·복지인력 구인난을 덜기 위해 2022년부터 181억원을 들여 영암·진도·신안 등 3곳에 간호·복지인력 전용 기숙사도 짓고 있다. 윤난실 전남광주시 시민주권부시장은 “의료는 시민의 삶을 지키는 가장 기본적 안전망이자 생명선”이라며 “우수 의료진이 지역에 오래 머물도록 주거환경을 개선한 것은 전남광주시의 오랜 숙원이자 값진 결실”이라고 말했다. 전남광주특별시가 6일 오후 강진의료원 의사 숙소 준공식을 하고 있다. 전남광주시 제공","category":"사회"},{"title":"'�缱 �� �� 20���� ���� ���' ������ ���걺�� �Ҽ�ġ","link":"https://n.news.naver.com/mnews/article/003/0014307397","naverLink":"https://n.news.naver.com/mnews/article/003/0014307397","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[괴산=뉴시스] 송인헌 국민의힘 충북 괴산군수 후보가 27일 괴산군청 브리핑룸에서 기자회견을 열고 11개 읍·면별 맞춤형 공약을 발표하고 있다. 2026.05.27. photo@newsis.com *재판매 및 DB 금지 [괴산=뉴시스] 서주영 기자 = 6·3 지방선거 당시 '군민 1인당 매달 20만원 지급'을 약속한 의혹으로 고발된 송인헌 충북 괴산군수가 불송치 처분을 받았다. 충북경찰청은 공직선거법 위반 혐의로 고발된 송인헌 군수에 대해 불송치 결정했다고 6일 밝혔다. 송 군수는 선거운동 과정에서 문자메시지 등을 통해 당선되면 군민 1인당 매달 20만원을 확정적으로 지급할 것처럼 알린 의혹으로 한 군민에게 고발당했다. 경찰은 송 군수가 해당 사업을 추진하겠다는 취지로 선거운동한 것으로 보고 혐의가 없다고 판단했다. 앞서 송 군수는 농어촌기본소득 사업 대상지로 선정되면 정부 지원금 15만원에 군비 5만원을 더해 주민 1인당 매달 20만원을 지급하겠다는 공약을 내건 바 있다.","category":"사회"},{"title":"��������","link":"https://n.news.naver.com/mnews/article/056/0012289197","naverLink":"https://n.news.naver.com/mnews/article/056/0012289197","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 내일 부산 광안리에선 가을 밤하늘을 수놓을 대규모 불꽃축제가 열립니다. 행사장 일대는 이미 축제 분위기인데요. 100만 명 넘게 몰릴 것으로 예상돼 인파 관리도 강화됩니다. 보도에 황현규 기자입니다. [리포트] 피고 지기를 반복하며 밤바다를 빛의 향연으로 물들이는 불꽃. 21회째를 맞는 부산불꽃축제가 내일 저녁 광안리 앞바다에서 펼쳐집니다. 올해 주제는 '부산의 꿈'. 지름이 400미터나 되는 초대형 불꽃부터 폭포수처럼 쏟아지는 '나이아가라 불꽃'까지 다채로운 볼거리가 준비됐습니다. 행사장 일대는 벌써 축제 분위기입니다. [윤정화/경기도 평택시 : \"유람선 타다가 불꽃 관광은 부산에서 한번 해봤는데 멋있더라고요. 아이 데리고 와 봤어요.\"] 축제 당일엔 100만 명 넘게 몰릴 것으로 예상돼 안전 관리도 강화됩니다. CCTV 15대가 인파 밀집도를 실시간 파악하고, 일정 인원이 넘으면 진입로를 통제하는 '인파 총량제'가 시행됩니다. [박영율/부산축제조직위원회 기획실장 : \"백사장 해변로에 20만 명 정도가 차게 되면 들어오는 진입 골목을 막아서 우회해서 안전한 곳에서 관람하실 수 있도록...\"] 축제 특수를 노리는 바가지요금은 가장 큰 걱정거립니다. 부산시가 숙박업소 150여 곳을 조사한 결과, 요금이 평소 주말보다 평균 94.5% 올랐습니다. 200% 넘게 올린 곳도 15곳에 달했습니다. 불법 상행위도 우려됩니다. 올해 유료 관람석은 역대 가장 많은 만 7천여 석. 경찰은 사복 경찰관 30여 명을 배치해 암표 거래와 불법 자릿세 징수를 집중 단속하기로 했습니다. KBS 뉴스 황현규입니다. 촬영기자:이한범/영상편집:최지혜 ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"��������","link":"https://n.news.naver.com/mnews/article/056/0012289195","naverLink":"https://n.news.naver.com/mnews/article/056/0012289195","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 지난 8월, 한 임신부가 구급차 안에서 임신 31주 만에 아기를 출산했습니다. 아기가 숨을 쉬지 않는 위태로운 순간에도 구급대원들이 침착하게 응급처치를 한 덕분에 아기는 위기를 넘길 수 있었습니다. 김민정 기자가 보도합니다. [리포트] 구급차가 사이렌을 켜고 도로를 빠져나갑니다. 임신부가 갑작스러운 출혈이 발생하자 119에 도움을 요청해 병원으로 이송되고 있었습니다. [구급대원 : \"지금 진통 간격이 빨라지고 있거든요.\"] 이송 중에 진통이 심해지고 출산이 임박해진 상황. 구급대원들은 의사에게 의료 지도를 요청한 뒤 분만을 준비했고, 구급차 안에서 아기가 태어났습니다. 하지만 31주 만에 태어난 아기는 스스로 숨을 쉬지 못했습니다. [구급대원 : \"아가야 좀 살자.\"] 구급대원들은 즉시 심폐소생술에 나섰고, 차에서 내려 병원으로 옮기면서도 응급처치를 이어갔습니다. 의료진에게 인계하기 직전, 마침내 아기가 첫 울음을 터뜨렸습니다. [구급대원 : \"(아기울음부터) 운다 살았다 아기 울어요.\"] 구급대원들에게도 첫 분만이었지만, 응급상황을 대비해 훈련한 덕에 침착하게 대응할 수 있었습니다. [구급대원 : \"저희가 진심에서 우러나와서 산모와 아이가 살았으면 하는 마음에서...\"] 아기는 약 50일간 치료받은 뒤 부모의 품으로 건강히 돌아왔습니다. 보호자는 서울시 누리집에 구급대원들이 끝까지 상태를 살펴주고 안심할 수 있게 도와주셨다며 감사 인사를 남겼습니다. [아기 아빠 : \"아기 키우면서 잊지 않겠다는 말 좀 전해드리고 싶습니다.\"] 구급대원들은 당연히 해야 할 일을 했을 뿐이라며 앞으로도 시민 곁에서 역할을 다하겠다고 밝혔습니다. KBS 뉴스 김민정입니다. 촬영기자:하정현/화면제공:서울시·서울 중랑소방서/영상편집:고응용/그래픽:김현갑 ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"����ȸ ��� �볳 ��Ȥ�� �ڿϼ� �泲���硤������ ��û���� ���Ҽ�ġ������ ���ǿ��� ��ġ","link":"https://n.news.naver.com/mnews/article/022/0004173160","naverLink":"https://n.news.naver.com/mnews/article/022/0004173160","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"전직 산청군의원이 후보 동의 없이 독단적으로 이름 써 낸 것으로 확인 6·3 지방선거 과정에서 교회에 헌금을 전달했다는 의혹으로 고발된 박완수 경남지사와 유명현 산청군수가 경찰 조사 결과 최종 무혐의 처분을 받았다. 6일 경찰에 따르면 경남경찰청 광역범죄수사대는 공직선거법 위반(기부행위 제한) 혐의로 고발된 박 지사와 유 군수를 지난 9월 혐의없음으로 불송치했다. 두 사람은 지난 5월 말 산청군의 한 교회에 감사 헌금 명목으로 각각 20만원과 10만원을 낸 혐의를 받았다. 하지만 경찰 수사 결과 해당 헌금은 당시 후보 신분이었던 박 지사와 유 군수의 동의 없이 전직 산청군의원 A씨가 독단적으로 이들의 이름을 써서 낸 것으로 드러났다. 이에 경찰은 박 지사와 유 군수에게 실질적인 혐의가 없다고 판단해 불송치 결정을 내렸다. 대신 헌금을 임의로 대납한 A씨에 대해서는 공직선거법상 제3자 기부행위 제한 혐의를 적용해 공소청에 송치했다. A씨는 6·3 지방선거에 출마하지 않은 것으로 조사됐다. 이와 함께 경찰은 박 지사 선거캠프 측이 유권자에게 왜곡된 정보를 줄 수 있는 여론조사 결과 그래프 홍보물을 공유했다는 고발 사건(공직선거법 위반)에 대해서도 불송치 처분했다. 선거 당시 민주당 후보 측은 여론조사 결과를 과장해 홍보했다고 주장하며 캠프 관계자 2명을 고발했었다. 경찰은 또 박 지사 캠프의 관권선거 및 딥페이크 영상 제작 의혹, 유사 선거사무실 설치 인지·묵인 여부 등 수사에 대해서는 조만간 결론을 내릴 예정인 것으로 알려졌다.","category":"사회"},{"title":"���� ������ ��Ÿ��� �����ſ� �¿��� �浹��80�� ����","link":"https://n.news.naver.com/mnews/article/003/0014307396","naverLink":"https://n.news.naver.com/mnews/article/003/0014307396","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[논산=뉴시스] 119 구급대 출동 삽화. (사진=뉴시스 DB). photo@newsis.com *재판매 및 DB 금지 [논산=뉴시스]김덕진 기자 = 6일 오후 5시54분께 충남 논산 성동면 원남리의 한 삼거리에서 좌회전하던 자전거와 직진하던 승용차가 충돌했다. 논산소방서에 따르면 목격자가 \"차 밑에 사람이 깔려 있다\"고 신고했다. 구급대는 현장에서 심정지 상태의 자전거 운전자 A(80대)씨를 발견하고 병원으로 옮겼으나 끝내 숨졌다. 경찰은 70대 승용차 운전자를 상대로 정확한 사고 경위를 조사 중이다.","category":"사회"},{"title":"��������","link":"https://n.news.naver.com/mnews/article/056/0012289196","naverLink":"https://n.news.naver.com/mnews/article/056/0012289196","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"감소세를 보이던 인플루엔자 독감이 2주 연속 증가세를 보이고 있습니다. 질병관리청은 지난달 말 기준 독감 의심 환자가 외래환자 천 명당 22.8명으로 한 주 전보다 크게 늘었다고 밝혔습니다. 특히 7살에서 12살 사이가 천 명당 60.9명으로, 학령기 아동을 중심으로 유행이 빠르게 번지고 있습니다. 방역 당국은 현재 국가예방접종이 진행 중이라며 적극적인 백신 접종을 당부했습니다. ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"��������","link":"https://n.news.naver.com/mnews/article/052/0002429491","naverLink":"https://n.news.naver.com/mnews/article/052/0002429491","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"유네스코 평가기구가 이달 초 발표한 인류무형유산 '등재 권고' 목록입니다. '적격 판정'을 받은 각국의 유산 가운데 태권도가 북한의 '전통 무술'이라는 문구가 눈에 띕니다. 전례에 비춰볼 때 오는 30일부터 열리는 유네스코 무형유산위 회의에서 확정될 가능성이 큰데, 국내 태권도계에는 비상이 걸렸습니다. [최재춘 / 코리아태권도 유네스코 추진단장 : 외국에서 다 북한 태권도래. 유네스코에서 한국 태권도가 빠졌던데, 북한 태권도라고 하면 방법이 없어요.] 당장 올림픽 등 대회 운영엔 큰 문제가 없겠지만, 종주국으로서 입지엔 타격이 불가피하다는 겁니다. 특히, 지난 2018년 남북의 태권도 단체가 평양에서 '유네스코 공동 등재' 구상에 합의했던 만큼, 아쉬움은 더 클 수밖에 없습니다. [조정원 / 세계태권도연맹 총재 (2018년 10월 30일) : 이번에 세계태권도연맹이 국제태권도연맹의 초청으로 평양에 가서…] 실제로 남북 태권도계의 교감은 문재인 정부에서 윤석열 정부로 정권이 교체된 이후 사실상 동력을 잃었습니다. 급기야 북한은 지난 2024년 3월 유네스코에 태권도 '단독 등재'를 신청해, 우리의 허를 찔렀습니다. 정부는 2년이 지난 올해 3월에야 한국 태권도 등재 요청 서류를 냈는데, 현 정부는 지난 정부가 별다른 대응을 하지 않았다며, 책임을 돌렸습니다. 이재명 대통령이 취임한 뒤, 지난해부터 남북 공동 등재를 추진했지만, 여의치 않았다고 해명했습니다. [안 호 / 국가유산청 대변인 : (공동 등재는) 상대 국가와 어떤 교감이나 협의가 당연히 필요한 거지 않습니까? 그런데 그런 부분들은 현재 상황에서는 어려웠던 거로…] 그러나 태권도계에선 정부가 유네스코를 상대로 외교적인 노력을 더 적극 기울여야 한다며 날을 세우고 있습니다. [최재춘 / 코리아태권도 유네스코 추진단장 : 북한에서 해주기를 기다리지 말고, 북한에서는 절대 상부에서 지시를 안 해요. 그러니 유네스코 본부를 두드리라는 거예요.] 정부는 한국 태권도의 '단독 또는 확장 등재'를 추진하겠다는 입장이지만, 그 과정이 녹록지는 않을 거로 보입니다. '국기 태권도'의 위상과 직결된 사안인 만큼, 범정부 차원의 대책반을 꾸려 총력전을 펼쳐야 한다는 지적도 나옵니다. YTN 강진원입니다. 자막뉴스 | 김대천 ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"���� �ջ�� ��⸮�� ��ҡ��η¡���� ������ ��ȭ ��","link":"https://n.news.naver.com/mnews/article/421/0009275500","naverLink":"https://n.news.naver.com/mnews/article/421/0009275500","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"���� �ջ�� ��⸮�� ��ҡ��η¡���� ������ ��ȭ ��. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"“한 푼 한 푼 아끼며 살기 지쳤다”…거리로 나온 60만명에 장갑차 동원한 佛","link":"https://n.news.naver.com/article/009/0005760052","pubDate":"2026-11-06T23:48:33+09:00","author":"매일경제","description":"프랑스에서 생활비 부담 완화와 임금 인상, 공공서비스 개선을 요구하는 시위가 전국으로 확산했다. 노동자와 학생들이 함께 거리로 나서면서 학교 수업과 대중교통 운행에 차질이 생겼고,..","category":"생활·문화","naverLink":"https://n.news.naver.com/article/009/0005760052"},{"title":"중국 ‘서열 5위’ 차이치, 북한 김성남 만나 “교류·협력 확대”","link":"https://n.news.naver.com/article/032/0003481194","pubDate":"2026-11-06T22:59:00+09:00","author":"경향신문","description":"북한 조선중앙통신은 김성남 노동당 국제비서를 단장으로 하는 노동당 대표단이 중국을 공식 방문하기 위해 전날 평양에서 출발했다고 4일 보도했다. 조선중앙통신·연합뉴스중국 공산당 권력 서열 5위인 차이치 중앙정치국 상무위원 겸 중앙서기처 서기가 6일 베이징에서 김성남 북한 노동당 국제비서와 만나 양국 간 교류·협력 확대 의지를 밝혔다.중국 관영 신화통신에 따르···","category":"생활·문화","naverLink":"https://n.news.naver.com/article/032/0003481194"},{"title":"'신천지' 세 번째 사과…수습책에 반발 확산","link":"https://n.news.naver.com/article/055/0001401314","pubDate":"2026-11-06T21:57:56+09:00","author":"SBS","description":"민주당 김민석 대표가 신천지 전당대회 개입 의혹 제기에 대해 오늘 세 번째로 사과했습니다. 논란을 잠재우기 위해서 일주일간 의원들에게 자체 조사 결과를 공개하는 방안까지 내놨지만, 오히려 반발은 더 거세지고 있습니다.한성희 기자입니다.","category":"생활·문화","naverLink":"https://n.news.naver.com/article/055/0001401314"},{"title":"\"자전거 세워두고 본인은 임산부석에\"…출근길 지하철 무슨 민폐?","link":"https://n.news.naver.com/article/003/0014307298","pubDate":"2026-11-06T21:08:59+09:00","author":"뉴시스","description":"[서울=뉴시스]정지연 인턴 기자 = 출근 시간대 지하철에 서울시 공공자전거를 그대로 싣고 탄 승객의 모습이 공개돼 눈길을 끌었다. 평일에는 접이식 자전거를 제외한 일반 자전거의 지하철 휴대 탑승이 제한되는 만큼 이를 두고 부적절한 이용이라는 지적이 나왔다. 6일 소셜미디어(SNS) 스레드에는 지하철 객실 한가운데 자전가 한 대가 세워져 있는 사진이 올라왔다. 게시글 작성자는 \"출근 시간에 지하철 한가운데 따릉이를 세워두고 정작 본인은 저 멀리 임산부석에 앉아 있는 승객이 있다\"며 불편함을 드러냈다. 사진에는 지하철 객실 통로 한가운데 서울시 공공자전거 한 대가 세워져 있다. 자전거를 가져온 승객의 모습은 보이지 않는다. 게시글을 접한 네티즌들은 평일 지하철에 일반 자전거를 가지고 탔다는 점을 지적했다. 이들은 \"평일에는 접이식 자전거 외에는 지하철에 가지고 탈 수 없는 것으로 안다\", \"민원을 넣어야 하는 것 아니냐\", \"평일 출근길에 자전거를 가지고 탔다가 안내 방송을 듣고 결국 내린 경험이 있다\"며 관련 규정을 언급했다. 특히 공공자전거를 이용한 뒤 지하철에 그대로 싣고 탄 행동을 이해하기 어렵다는 반응도 나왔다. 네티즌들은 \"개인 자전거도 아니고 공공자전거인데 이용을 마친 뒤 반납하고 도착지에서 새로 빌리면 될 일\", \"자전거와 지하철 중 하나를 선택하면 될 텐데 굳이 두 가지를 함께 이용한 이유가 궁금하다\"고 했다. 이 밖에도","category":"생활·문화","naverLink":"https://n.news.naver.com/article/003/0014307298"},{"title":"배우·스태프 부상부터 관객 안전까지…‘예술현장 안심공제’ 첫선","link":"https://n.news.naver.com/article/032/0003481186","pubDate":"2026-11-06T20:08:00+09:00","author":"경향신문","description":"한국예술인복지재단 제공예술 현장의 사고부터 관객 안전사고까지 보장하는 예술인 맞춤형 공제상품이 처음으로 출시됐다.문화체육관광부 산하 한국예술인복지재단은 6일 예술인 공제사업을 공식 출범하고 첫 상품인 ‘예술현장 안심공제’를 출시했다고 밝혔다. 공연·전시 등을 기획·운영하는 예술사업자가 가입할 수 있으며, 출연진과 스태프의 상해·질병부터 관객 안전사고, 시설···","category":"생활·문화","naverLink":"https://n.news.naver.com/article/032/0003481186"},{"title":"홍콩, 이달 중 CCTV에 AI 안면 인식 기술 도입한다","link":"https://n.news.naver.com/article/009/0005759956","pubDate":"2026-11-06T19:33:00+09:00","author":"매일경제","description":"“실종자 및 용의자 추적 위한 것” 공공기관부터 쇼핑몰까지 확산 생성 데이터는 최대 180일 보관홍콩이 이달부터 CCTV를 활용한 스마트 감시 네트워크 전반에 인공지능(AI) 기반..","category":"생활·문화","naverLink":"https://n.news.naver.com/article/009/0005759956"},{"title":"서귀포 중문동 마트 기계실서 불…인명 피해 없어","link":"https://n.news.naver.com/article/003/0014306942","pubDate":"2026-11-06T17:48:05+09:00","author
