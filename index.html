window.NEWS_DATA = {"date":"2026-11-17","generatedAt":"2026-11-17T11:01:58.838628+09:00","total":150,"days":{"today":{"date":"2026-11-17","weekday":"화요일","label":"오늘 · 11월 17일 화요일","total":50,"categories":{"사건 사고":[{"title":"테슬라는 사고 싶고 중국차는 꺼리고…전기차 구입의향 온도차","link":"https://n.news.naver.com/mnews/article/092/0002445617","naverLink":"https://n.news.naver.com/mnews/article/092/0002445617","pubDate":"2026-11-17T11:00:08.460298+09:00","author":"네이버뉴스","description":"BYD·샤오미 높은 인지도에도 낮은 선호도…폴스타는 구매 긍정 36%로 선전 테슬라가 국내에 진출했거나 진출을 추진 중인 수입 전기차 브랜드 가운데 인지도와 구입의향, 이미지 개선도에서 모두 1위를 차지했다. 반면 중국 전기차 브랜드는 높은 인지도가 실제 구매 의향으로 이어지지 못한 것으로 나타났다. 자동차 리서치 전문기관 컨슈머인사이트는 자동차 보유자 8951명을 대상으로 수입 전기차 브랜드 인식을 조사한 결과 이같이 나타났다고 17일 밝혔다. 이번 조사는 컨슈머인사이트가 매년 7월 진행하는 '연례 자동차 기획조사'의 하나다. 국내에 진출했거나 진출 계획을 발표한 테슬라·BYD·샤오미·폴스타·지커·샤오펑 등 6개 브랜드의 인지 수준과 구입의향을 물었다. 최근 1년간 이미지가 좋아지거나 나빠진 브랜드에 대한 조사도 함께 진행했다. 컨슈머인사이트가 자동차 보유자 8951명을 대상으로 수입 전기차 브랜드 인식을 조사한 결과 (사진=챗GPT활용) 테슬라 인지율은 99%로 조사 대상 브랜드 중 가장 높았다. 응답자의 56%는 모델 상세 정보까지 안다고 답했고, 43%는 브랜드를 들어봤다고 응답했다. BYD와 샤오미 인지율은 각각 81%, 78%로 뒤를 이었다. 폴스타는 61%, 지커는 39%, 샤오펑은 33%였다. 모델 상세 정보까지 안다는 응답은 테슬라가 56%로, 2위인 폴스타 20%의 2배를 웃돌았다. 해당 브랜드를 알고 있는 응답자를 대상으로 한 구입의향 조사에서도 테슬라가 52%로 가장 높았다. 테슬라를 아는 소비자 2명 중 1명 이상이 구매에 긍정적인 반응을 보인 셈이다. '구입하고 싶지 않다'는 응답은 15%로 6개 브랜드 가운데 가장 낮았다. 폴스타는 인지율이 4위에 그쳤지만 구입의향은 36%로 테슬라에 이어 2위를 차지했다. 구입하고 싶지 않다는 응답도 25%로 비교적 낮았다. 중국 브랜드는 인지도와 구입의향 사이에 큰 차이를 보였다. BYD는 인지율이 81%에 달했지만 구입의향은 11%였다. 구입하고 싶지 않다는 응답은 65%로 구입의향 응답률의 약 6배였다. 샤오미는 인지율이 78%로 BYD와 비슷했으나 구입의향은 5%로 조사 대상 중 가장 낮았다. 구입하고 싶지 않다는 응답은 76%에 달했다. 지커와 샤오펑도 구매에 부정적인 응답이 각각 58%, 64%로 과반을 차지했다. 컨슈머인사이트가 조사한 수입 전기차 브랜드 이미지 (사진=챗GPT활용)","category":"사건 사고"},{"title":"유엔사·한국 정부, DMZ 지뢰 사고 대응 놓고 엇박자 있었나","link":"https://n.news.naver.com/mnews/article/079/0004210486","naverLink":"https://n.news.naver.com/mnews/article/079/0004210486","pubDate":"2026-11-17T11:00:07.637364+09:00","author":"네이버뉴스","description":"유엔사, 北과 사고 논의 위한 대면 추진…2019년 이후 처음 한국 정부의 대북 사과 요구 이후 회담 추진 중단 유엔사·국방부 모두 구체적인 조율 여부에 답변 거부 연합뉴스 유엔군사령부(UNC)가 지난 9월 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 북한군과 대화를 추진했으나, 한국 정부가 북한에 공개 사과를 요구한 이후 협의가 중단됐다는 보도가 나왔다. 북한 전문매체 NK뉴스는 16일(현지시간) 유엔사 군사정전위원회(군정위)가 지난 9월 21일 지뢰 폭발 사고 이후 북한군과 접촉했다고 보도했다. 양측은 지뢰 폭발 사고의 경위와 군사분계선(MDL) 표지물의 정확한 위치 등을 논의하기 위해 2019년 이후 처음으로 대면 회담을 여는 방안을 추진한 것으로 전해졌다. 그러나 한국 정부가 사고와 관련해 북한에 공개 사과를 요구한 이후 회담 추진이 중단됐다고 소식통들은 전했다. 이후 유엔사 군정위와 북한군이 회담 개최를 위한 협의를 재개했는지는 확인되지 않았다. 앞서 합동참모본부는 지난 9월 30일 \"군사분계선 이남에서 정상적인 수색작전을 수행하던 한국 장병들이 북한군 지뢰에 의해 심각한 부상을 당한 사건이 발생했다\"며 북한에 사과와 책임 있는 조치를 촉구했다. 유엔사는 지뢰 사고 이후 북한군과 접촉하거나 회담을 제안했는 지를 묻는 NK뉴스의 질의에 \"확립된 정전협정 체계를 통해 이 문제를 다루고 있다\"고 답했다. 한국 정부의 사과 요구로 북한과의 논의가 중단됐는지에 대해서는 논평을 거부했다. 유엔사는 앞서 한국군과의 합동 조사에서 군사분계선 남측 지역에서 북한제 대인지뢰 1발을 발견했다고 발표했다. 해당 지뢰의 발견은 정전협정 위반에 해당한다는 입장도 밝혔다. 다만 북한군이 지뢰를 고의로 매설했다는 한국군의 발표에 동의하는지를 묻는 질문에는 \"조사 결과는 적절한 경로를 통해 관련 당사자들에게 전달된다\"고 답했다. 국방부도 유엔사의 대북 접촉 사실을 알고 있었는지, 북한에 사과를 요구하는 과정에서 유엔사와 조율했는지를 묻는 질문에 논평을 거부했다고 NK뉴스는 전했다. 이번 보도는 DMZ 내 지뢰 폭발 사고를 둘러싼 남북 간 긴장뿐 아니라 정전협정 관리 주체인 유엔사의 대북 소통 방식과 한국 정부의 대응 과정에서 어떤 협의가 이뤄졌는지에도 관심을 모으고 있다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jeb","category":"사건 사고"},{"title":"전 美SEC위원장 \"AI 거품 붕괴로 2028년 대선 전 경기침체 온다\"","link":"https://n.news.naver.com/mnews/article/421/0009293058","naverLink":"https://n.news.naver.com/mnews/article/421/0009293058","pubDate":"2026-11-17T11:00:07.637348+09:00","author":"네이버뉴스","description":"겐슬러 \"AI 투자가 수익 창출 훨씬 앞질러…거품 호황 특징\" \"네오클라우드 업체 줄파산…닷컴버블 붕괴보다 강할 것\" 게리 겐슬러 전 미국 증권거래위원회(SEC) 위원장이 2021년 9월 14일 미국 워싱턴 국회의사당에서 열린 상원 은행, 주택 및 도시 문제 위원회 감독 청문회에서 증언하는 모습. ⓒ 로이터=뉴스1 (서울=뉴스1) 권영미 기자 = 조 바이든 행정부 시절 ‘가상화폐 저승사자’로 불렸던 게리 겐슬러 전 미국 증권거래위원회(SEC) 위원장이 인공지능(AI) 열풍이 이미 거품 상태이며, 2028년 미국 대통령 선거 이전에 거품이 붕괴하면서 경기침체를 초래할 가능성이 크다고 경고했다. 16일(현지시간) 미국 CNN방송에 따르면 겐슬러 전 위원장은 최근 CNN과의 인터뷰에서 “AI는 이미 거품”이라며 “역사를 돌이켜보면 신기술에 막대한 투자가 몰린 뒤에는 결국 정체기와 위축기가 찾아온다. 문제는 완만한 침체일지, 더 극적인 충격일지 여부뿐”이라고 말했다. 그의 발언은 중간선거 민주당 승리에 따른 데이터센터 규제 우려, 젠슨 황 엔비디아 최고경영자(CEO)의 갑작스러운 퇴진 충격, 앤트로픽의 대규모 기업공개(IPO) 강행 등 AI 업계가 연이은 악재 속에 중대 기로에 선 가운데 나왔다. 현재 매사추세츠공대(MIT) 교수로 재직 중인 겐슬러 전 위원장은 19세기 철도, 1920년대 전력, 1990년대 인터넷 붐 이후 찾아왔던 거품 붕괴 사례를 언급하며, 연간 최대 8000억 달러로 추산되는 천문학적인 AI 인프라 투자가 수익 창출 속도를 훨씬 앞지르고 있다고 지적했다. 특히 그는 빅테크 기업들이 3년 전보다 5배나 많은 자금을 쏟아붓고 있을 뿐 아니라, 순환 출자식 금융(circular financing)과 장부 외 금융 등 불투명한 방식으로 막대한 부채를 일으켜 위험 규모를 가늠하기 어렵게 만들고 있다고 꼬집었다. 겐슬러는 “왜 대출 기관들이 이렇게 많은 돈을 빌려주는지 의문이 들 수 있다”라며 “역사는 결국 대출 기관들이 너무 많은 돈을, 너무 빠르게 빌려주었다는 사실을 보여줄 것이다. 이것이 바로 거품 붕괴로 이어지는 호황의 본질”이라고 말했다. 거품 붕괴 시 첫 도미노가 무너질 곳으로는 AI 개발사에 컴퓨팅 자원을 빌려주는 중소형 전문 클라우드 업체인 ‘네오클라우드’를 지목했다. 겐슬러 전 위원장은 “대기업은 살아남겠지만, 막대한 빚으로 사업을 키운 네오클라우드 업계에서는 파산과 도산이 속출할 것”이라","category":"사건 사고"},{"title":"50대 아버지 면허증으로 택시 자격증 딴 10대…운행 첫날 사고로 들통","link":"https://n.news.naver.com/mnews/article/654/0000211704","naverLink":"https://n.news.naver.com/mnews/article/654/0000211704","pubDate":"2026-11-17T11:00:07.194602+09:00","author":"네이버뉴스","description":"자격시험에서 취업까지 신원 확인 허술 ▲ 일러스트/한규빛 아버지 명의로 택시 운전 자격시험에 응시해 자격증을 취득한 10대가 택시 운행 첫날 교통사고를 내면서 명의도용 사실이 드러났다. 경찰에 따르면 지난 16일 전남 여수경찰서는 공문서 부정행사와 위계에 의한 업무방해 혐의로 A(19)씨를 입건해 조사하고 있다고 밝혔다. A씨는 지난 7일 오전 11시 50분쯤 전남 여수시 문수동의 한 도로에서 손님을 태우고 택시를 운전하다 다른 승용차와 충돌했다. 택시 운전 자격을 취득하고 실제 운행에 나선 첫날 발생한 사고였다. A씨는 경찰 조사 과정에서 자신의 이름과 생년월일을 밝혔으나, 택시 운전 자격증에 기재된 인적 사항과 다른 사실이 확인되면서 명의도용이 드러났다. 조사 결과 A씨는 한국교통안전공단에서 아버지의 운전면허증을 이용해 자격시험을 치르고 자격증을 취득한 뒤 택시회사에 취업한 것으로 파악됐다. 택시 운전 자격시험은 만 18세 이상으로 운전면허를 보유하고 1년 이상의 운전경력을 갖춰야 응시할 수 있다. A씨는 면허를 취득했지만 운전경력이 부족해 아버지 명의로 시험을 치른 것으로 경찰은 보고 있다. 특히 10대인 A씨가 50대 아버지 행세를 했음에도 자격시험장과 택시회사 채용 과정에서 신원 확인 절차를 통과한 것으로 드러나 관리 부실 논란도 예상된다. 한국교통안전공단은 A씨의 택시 운전 자격을 취소하고 향후 시험 관리 절차를 강화하겠다는 입장을 밝혔다.","category":"사건 사고"},{"title":"유치원생 아들과 길 건너던 40대 어머니, 20대 BMW에 치여⋯모자 사망","link":"https://n.news.naver.com/mnews/article/031/0001075628","naverLink":"https://n.news.naver.com/mnews/article/031/0001075628","pubDate":"2026-11-17T11:00:07.194599+09:00","author":"네이버뉴스","description":"대구 한 횡단보도에서 길을 건너던 40대 여성과 그의 유치원생 아들이 차에 치여 사망했다. 17일 경찰 등에 따르면 대구 수성경찰서는 교통사고처리특례법 위반(치사) 혐의로 20대 운전자 A씨를 입건해 조사하고 있다. 대구 한 횡단보도에서 길을 건너던 40대 여성과 그의 유치원생 아들이 차에 치여 사망했다. 본 기사와 무관한 이미지. [사진=연합뉴스] A씨는 지난 15일 오후 2시 20분쯤 대구시 수성구 파동 한 신호등 없는 횡단보도에서 BMW 차량을 몰다 길을 건너던 40대 여성 B씨와 그의 유치원생 아들 C군을 들이받아 사망케 한 혐의를 받는다. 해당 도로는 왕복 4차로였으며 1차로에는 버스가 정차해 있었던 것으로 알려졌다. 이 같은 상황에서 A씨는 2차로로 차선을 변경해 주행하던 중 사고를 낸 것으로 파악됐다. 경찰 조사 결과, 사고 당시 A씨는 음주나 약물 복용 상태는 아니었던 것으로 조사됐다. 본 기사와 무관한 이미지. [사진=픽셀스]","category":"사건 사고"},{"title":"길 잃은 치매 남편, 숨진 채 발견된 아들…실종 모친은 모텔서 발견","link":"https://n.news.naver.com/mnews/article/057/0001978533","naverLink":"https://n.news.naver.com/mnews/article/057/0001978533","pubDate":"2026-11-17T11:00:07.194587+09:00","author":"네이버뉴스","description":"모텔 머물던 70대 모친 \"혼자 있고 싶었다\" 횡설수설 경찰 자료사진 / 사진=MBN 치매를 앓는 노부모와 함께 살던 40대 남성이 자택에서 숨진 채 발견돼 경찰이 수사 중입니다. 소재가 확인되지 않아 경찰이 행방을 추적하던 70대 어머니는 이튿날 오전 한 모텔에서 발견됐습니다. 오늘(17일) 경찰 등에 따르면 어제(16일) 오후 5시 30분께 경기 파주시 아동동의 한 아파트 경비실로부터 집에 들어가지 못하는 80대 남성 A 씨를 보호하고 있다는 신고가 접수됐습니다. 출동한 경찰은 A 씨의 주거지를 확인하고 귀가를 도우려 했으나 현관문 비밀번호를 알 수 없어 소방 당국에 협조를 요청했습니다. 소방대원들이 베란다를 통해 집 안으로 들어갔고 오후 8시께 내부에서 A씨의 아들인 40대 남성 B 씨가 숨진 채 발견됐습니다. 발견 당시 시신은 부패가 진행된 상태였습니다. 현장에서 유서는 발견되지 않았습니다. 현재까지 범죄 혐의점은 확인되지 않은 것으로 전해졌습니다. B 씨는 치매를 앓는 아버지 A 씨, 70대 어머니 C 씨와 함께 거주해온 것으로 파악됐습니다. C 씨는 휴대전화를 집에 두고 사라져 소재가 확인되지 않았고, 경찰 실종수사팀이 행방을 추적했습니다. 경찰은 지인 등을 통해 C 씨가 최근 병원 진료를 받은 사실을 확인하고 택시 이동 경로 등을 추적했습니다. 이어 파주시 인근의 숙박시설 밀집 지역을 탐문한 끝에 이날 오전 7시 55분께 한 모텔에서 홀로 머물던 C 씨를 발견했습니다. C 씨는 경찰에 \"혼자 있고 싶었다\"고 말하는 등 횡설수설한 것으로 전해졌습니다. 경찰 관계자는 \"국립과학수사연구원에 B 씨의 시신 부검을 의뢰해 정확한 사망 원인을 확인하고, 범죄 관련성 등 모든 가능성을 열어두고 사망 경위를 조사할 방침\"이라고 말했습니다.","category":"사건 사고"},{"title":"분유먹고 심정지 생후 6개월 아기…구급대 응급처치로 회복","link":"https://n.news.naver.com/mnews/article/001/0016445832","naverLink":"https://n.news.naver.com/mnews/article/001/0016445832","pubDate":"2026-11-17T11:00:07.194585+09:00","author":"네이버뉴스","description":"119 영상통화로 아빠에게 심폐소생술 지도…구급차서 의식 회복 엘리베이터에서 심폐소생술 하는 구급대원들 [부산소방재난본부 제공. 재판매 및 DB 금지] (부산=연합뉴스) 박성제 기자 = 부산에서 심정지 상태에 빠졌던 생후 6개월 된 아기가 소방당국의 적극적인 응급조치 덕분에 극적으로 목숨을 건졌다. 17일 부산 사하소방서에 따르면 지난달 19일 오전 11시 16분께 사하구 장림동에서 분유를 먹은 생후 6개월 된 아기가 엎드린 채 숨을 가쁘게 몰아쉬는 모습을 아빠가 발견했다. 아빠는 급히 아기를 안아 올렸지만, 아기의 몸은 축 처졌고 입술까지 파랗게 변했다. 놀란 아빠는 곧바로 119에 신고했고, 119상황실은 구급상황관리센터와 연결해 영상통화로 심폐소생술 방법을 안내했다. 아빠는 의료진의 지도를 받으며 떨리는 손으로 아기의 가슴을 압박하기 시작했다. 신고 7분 만에 현장에 도착한 신평 구급대는 아기의 의식과 호흡, 맥박이 없는 심정지 상태를 확인하고 즉시 심폐소생술과 인공호흡을 시행했다. 이어 도착한 하단 구급대와 교대로 가슴압박을 이어갔으며, 구급차로 옮긴 뒤 아기의 심실세동이 확인되자 전기충격을 가했다. 구급대원들의 응급처치 끝에 아기는 구급차 안에서 자발순환을 회복하며 다시 숨을 쉬기 시작하는 등 의식을 되찾았다. 현장에 출동한 신평119안전센터 박정환 소방사는 \"저 역시 생후 6개월 된 아이를 키우는 아빠라 아기를 꼭 살리고 싶다는 간절한 마음이 컸다\"며 \"작은 몸으로 힘겹게 버티는 아이를 보며 한순간도 긴장의 끈을 놓을 수 없었다\"고 회상했다. 병원으로 이송된 아기는 치료받은 뒤 지난 4일 건강하게 퇴원했다. 아기의 가족은 지난 8일 신평119안전센터를 찾아 구급대원들에게 감사의 마음을 전했다. 아기 엄마는 국민신문고 칭찬 민원에서 \"신고 이후에도 아기의 상태를 확인하기 위해 먼저 연락해 준 세심한 배려에 깊이 감동했다\"며 \"영상통화로 심폐소생술을 알려준 덕분에 아빠가 아기를 도울 수 있었고, 구급대원들의 신속하고 적극적인 대응으로 아이가 다시 숨을 쉴 수 있었다\"고 고마움을 전했다. psj19@yna.co.kr","category":"사건 사고"},{"title":"'AI 커닝' 세무사시험 수석 경찰 출석…'개조' 계산기도 사용(종합)","link":"https://n.news.naver.com/mnews/article/421/0009293147","naverLink":"https://n.news.naver.com/mnews/article/421/0009293147","pubDate":"2026-11-17T11:00:07.194568+09:00","author":"네이버뉴스","description":"첫 피의자 신분 조사…\"수험생께 죄송, 잘못 책임 지겠다\" 답 확인에 제3의 모니터 이용…경찰 \"계산기 화면은 아냐\" 세무사 시험 부정행위 자수자 한모 씨가 17일 오전 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에서 피의자 신분으로 조사를 받기 위해 출석하며 고개 숙여 사과하고 있다. 2026.11.17 ⓒ 뉴스1 오대일 기자 (서울=뉴스1) 권준언 기자 = 인공지능(AI)을 이용한 부정행위를 자수한 제63회 세무사 시험 수석 합격자 한 모 씨가 경찰에 출석해 \"잘못에 대한 책임을 지겠다\"고 했다. 경찰은 한 씨가 개조된 계산기를 활용해 범행한 것으로 보고 범행 수법과 공범 여부 등을 살펴볼 계획이다. 서울경찰청 광역수사단 공공범죄수사대는 17일 오전 한 씨를 피의자 신분으로 조사 중이다. 한 씨는 광수단 출석과 동시에 피의자 신분으로 전환했다. 한 씨는 9시 17분쯤 검은색 패딩 차림으로 마스크를 쓴 채 모습을 드러낸 뒤 곧바로 \"죄송합니다\"라고 고개를 숙였다. 그는 \"부정행위를 혼자 계획하고 실행했는지\"를 묻는 말에 \"시험을 준비해 오신 수험생분들과 관계자분들께 진심으로 죄송하다\"며 \"제가 한 일을 숨기지 않고 사실대로 수사기관에 말씀드리겠다\"고 했다. 이어 \"조사를 성실히 받고 잘못에 대한 책임을 지겠다. 죄송하다\"며 다시 한번 고개를 숙였다. 다만 '부정행위가 안 걸릴 줄 알았는가' '화면은 어떻게 준비한 것인가' '수험생들에게 할 말은 없는가' 등의 질문엔 답하지 않은 채 조사실로 향했다. 이 자리에는 한 씨의 법률대리인인 이돈호 변호사도 함께했다. 한 씨 측이 지난 15일 제출한 자수서에는 계산기를 개조해 부정행위에 사용했다는 내용이 담긴 것으로 알려졌다. 다만 경찰 관계자는 \"계산기 개조 사용 자체는 맞지만 해당 계산기 화면으로 답을 확인한 것은 아니다\"고 전했다. 이밖에 자수서에는 초소형 카메라로 시험 문제를 촬영한 뒤 AI에 전송하고, 스마트폰을 통해 답을 확인했다는 내용이 담긴 것으로 알려졌다. 이 과정에서 감독관의 눈을 피해 스마트폰이 아닌 일종의 '모니터' 역할을 하는 '제3의 화면'으로 답을 확인한 정황과 구체적인 사용 방법도 기재됐다고 한다. 이는 당초 의혹이 제기됐던 AI 스마트글래스나 온라인 커뮤니티 등에서 거론된 초소형 이어폰을 이용한 방식과는 다를 뿐 아니라 답을 확인하는 데 음성·진동 신호를 전달받은 것도 아닌 것으로 파악됐다. 한 씨는 지난 15일 이 변호사의 유튜브 영","category":"사건 사고"},{"title":"세무사 가짜 수석, 경찰에 '계산기' 증거 자료 제출…“부정행위 사용” 실토","link":"https://n.news.naver.com/mnews/article/437/0000521068","naverLink":"https://n.news.naver.com/mnews/article/437/0000521068","pubDate":"2026-11-17T11:00:07.194563+09:00","author":"네이버뉴스","description":"세무사 시험에서 AI 활용해 부정행위 저지른 한모씨 AI 부정행위로 올해 세무사시험에 수석 합격한 뒤 자수한 한모 씨가 경찰에 '계산기'를 증거자료로 제출한 것으로 확인됐습니다. 경찰은 한씨가 계산기를 개조해 사용한 것으로 보고 정확한 범행 경위를 조사할 방침입니다. 서울경찰청 광역수사단 공공범죄수사대는 오늘(17일) 오전 9시 반쯤 한씨를 소환했습니다. 검은색 상하의에 마스크를 쓰고 나타난 한씨는 취재진 앞에서 고개를 숙이며 \"시험을 준비해 오신 수험생들과 관계자들에게 진심으로 죄송하다\"고 말했습니다. 이어 부정행위가 걸리지 않을 거라 생각했는지, 초소형 카메라와 모니터를 어떻게 구했는지에 대한 질문에는 답변하지 않았습니다. 앞서 한씨 측이 초소형 카메라로 시험문제를 촬영한 뒤 AI로 전송해 모니터로 정답을 확인했다는 취지로 설명한 데 따라 경찰은 한씨가 이 과정에서 계산기를 어떻게 활용했는지 집중 조사할 것으로 보입니다. 다만 한씨가 개조한 계산기 화면으로 답을 확인한 것은 아닌 것으로 전해졌습니다. 한씨 측은 이날 조사에 앞서 부정행위의 구체적인 방법을 적은 경위서를 국세청과 한국산업인력공단, 금융감독원, 한국세무사회에도 각각 제출했다고 밝혔습니다.","category":"사건 사고"},{"title":"[속보] 세무사 수석 ‘세무냥이’ 경찰 출석 “잘못에 대한 책임질 것⋯시험 준비해 오신 수험생과 관계자분들께 진심으로 죄송”","link":"https://n.news.naver.com/mnews/article/087/0001231318","naverLink":"https://n.news.naver.com/mnews/article/087/0001231318","pubDate":"2026-11-17T11:00:07.194539+09:00","author":"네이버뉴스","description":"◇세무사 시험에서 인공지능(AI)을 이용해 부정행위를 저지른 수석 합격자 한모씨가 17일 서울 마포구 서울경찰청 광역수사단 공공범죄수사대에 피의자 신분으로 출석하고 있다. 2026.11.17 연합뉴스. 무단 전재","category":"사건 사고"}],"사회":[{"title":"스캐터랩, '제타' 안전장치 손본다…대표가 진두지휘","link":"https://n.news.naver.com/mnews/article/092/0002445623","naverLink":"https://n.news.naver.com/mnews/article/092/0002445623","pubDate":"2026-11-17T11:00:08.054165+09:00","author":"네이버뉴스","description":"대표 직속 안전 전담팀 신설…AI 개발 핵심 인력 절반 투입 스캐터랩이 인공지능(AI) 캐릭터 채팅 서비스 '제타' 이용자 보호 체계를 전면 재정비한다. 대표 직속 안전 전담 조직을 신설하고 AI 개발 주요 인력 절반을 콘텐츠·대화 검수 모델 개발에 투입하는 등 정책·기술·운영 전반에 걸쳐 안전성을 강화한다. 스캐터랩은 김종윤 대표가 직접 이끄는 안전 전담 조직 '트러스트&세이프티 팀(Trust&Safety Team)'을 신설했다고 17일 밝혔다. 신설 조직은 제타 콘텐츠 안전 정책 수립부터 자체 AI 모델 개발, 콘텐츠 검수 업무까지 통합 관리한다. 올해 말까지 콘텐츠 이용 등급 분류를 체계화하고 이용자 연령에 따른 보호 기능을 고도화할 계획이다. (이미지=스캐터랩) 제타 내 스토리 콘텐츠인 '플롯'은 창작자 제작 과정과 출시 시점, 서비스 내 노출 시점 등 3단계에 걸쳐 검수한다. 플롯 소재와 텍스트·이미지를 분석해 이용 등급을 분류하고 한국·일본·미국 등 주요 서비스 국가에 적용할 AI 콘텐츠 정책과 검수 기준도 마련한다. 스캐터랩은 거대언어모델(LLM)을 활용해 플롯 검수에 특화된 자체 AI 모델을 개발한다. 연령 확인 절차도 강화해 가입 초기부터 이용자 연령에 따라 접근 가능한 콘텐츠를 구분할 방침이다. AI 캐릭터와 대화하는 과정에서 보호 장치도 정비한다. 부적절한 대화를 방지하는 자체 AI를 출시하고 이용자 연령별 발화 기준을 수립해 AI 모델 응답에 반영할 계획이다. 이용자가 AI와 상호작용하고 있다는 사실을 주기적으로 알리는 안내 기능도 구현한다. 앞서 예고한 청소년 하루 이용 시간 3시간, 월 기본 결제 한도 10만원 제한은 국내에서 연내 도입할 예정이다. 자살·자해 관련 민감 콘텐츠가 감지되면 적절한 안내를 제공하는 기능도 구현·검증한다. 신고와 이의제기, 정기 표본 검수 과정에서 확인된 문제를 콘텐츠 정책과 AI 모델에 반영하고 재검증하는 등 운영 체계도 강화한다. 스캐터랩은 국내외 AI 관련 규제에 대응하는 한편 지식재산권(IP)과 청소년 보호를 중심으로 규제 당국, 앱스토어, 콘텐츠 업계 및 유사 서비스 운영사 등과 논의를 이어갈 방침이다. 김종윤 스캐터랩 대표는 \"제타는 이용자가 이야기 주인공이 돼 AI와 자신만의 이야기를 만드는 서비스인 만큼 창작 즐거움과 이용자 안전을 함께 고려해야 한다\"며 \"정책과 기술, 운영을 아우르는 보호 체계를 고도화하고 안심하고 사용할 AI 엔터테인먼트","category":"사회"},{"title":"'손님 남긴 마늘·부추 재사용' 식당…종로구청, '위반 적발' 행정처분","link":"https://n.news.naver.com/mnews/article/422/0000926906","naverLink":"https://n.news.naver.com/mnews/article/422/0000926906","pubDate":"2026-11-17T11:00:07.194603+09:00","author":"네이버뉴스","description":"손님들이 먹고 남긴 음식물을 재사용하는 식당 종업원의 모습 [사진=SNS 갈무리] 서울 종로구의 한 대형 식당에서 손님이 먹고 남긴 음식을 재사용했다는 의혹이 제기된 뒤 실시된 구청 점검에서 식품위생법 위반 사항이 적발됐습니다. 구청은 행정처분 절차에 들어갔습니다. 제보자 A씨는 국민신문고에 낸 민원에 대한 종로구청의 처리 결과를 연합뉴스TV에 이같이 공개했습니다. A씨가 공개한 답변에 따르면 종로구청은 지난 14일 해당 식당을 불시 점검했습니다. 구청은 \"제공된 동영상을 토대로 손님이 먹을 수 있도록 제공한 음식물인 다진 마늘을 재보관하는 행위와 비식품용 가위로 닭고기를 해체하는 행위 등 식품위생법 위반 사항을 적발했다\"고 밝혔습니다. 이어 \"관련 법에 따라 행정처분 절차를 진행할 예정\"이라고 설명했습니다. 앞서 A씨는 지난 13일 소셜미디어에 해당 식당에서 손님들이 먹고 남긴 음식물을 재사용하는 모습을 목격했다며 이를 찍은 사진을 공개했습니다. A씨는 식당 측이 손님들이 먹고 남긴 다진 마늘과 부추를 통에 다시 부어 보관하고, 이를 양념장 제조에 사용해 다른 손님에게 제공했다고 밝혔습니다. 닭고기를 손질할 때 음식용 가위 대신 원단 재단용 가위를 사용했다는 내용도 함께 전했습니다. 당시 A씨는 식당의 위생 상태에 문제를 제기하며 식사를 중단하고 자리를 떠났습니다. 이후 같은 날 국민신문고에 해당 식당을 신고했고, 민원은 종로구청으로 이관됐습니다. 현행 식품위생법과 같은 법 시행규칙에 따르면 식품접객업 영업자는 손님이 먹고 남긴 음식물을 다시 사용하거나 조리·보관해서는 안 되며 이를 위반하면 관련 규정에 따라 행정처분 및 형사처벌을 받을 수 있습니다. #식당 #식품 #위생 #재사용 #점검 #위반 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사회"},{"title":"'모든 부정행위 적발 어려워' '수능 연기 검토 안 해'…최교진 교육부 장관 피고발","link":"https://n.news.naver.com/mnews/article/119/0003156019","naverLink":"https://n.news.naver.com/mnews/article/119/0003156019","pubDate":"2026-11-17T11:00:07.194601+09:00","author":"네이버뉴스","description":"이종배 전 서울시의원, 직무유기 혐의로 최 장관 경찰에 고발 \"수능 연기해 실효성 있는 대책 실현하지 않아 수험생 등에 피해 야기\" 최교진 교육부 장관이 지난 16일 국회 교육위원회 전체회의에 출석한 모습. ⓒ데일리안 홍금표 기자 [데일리안 = 진현우 기자] 최근 AI를 활용한 시험 부정행위 사례가 잇달이 적발되면서 2027학년도 대학수학능력시험(수능) 연기를 요구하는 목소리가 일각에서 나오고 있는 가운데 '수능 연기가 어렵다'는 취지의 발언을 한 최교진 교육부 장관에 경찰에 고발됐다. 이종배 전 서울시의원은 17일 오전 직무유기 혐의로 최교진 교육부 장관을 서울경찰청에 고발했다고 밝혔다. 앞서 최 장관은 전날 국회 교육위원회 전체회의에 출석해 장관은 시험 부정행위를 완벽하게 적발할 수 있느냐는 질의에 '모든 부정행위를 적발하기 어렵다'는 취지로 답변했다. 이와 함께 일각에서 수능 연기 요구가 이어지고 있는 것과 관련해 \"지금 수능을 연기하는 것은 더 큰 혼란이 있을 수 있기 때문에 검토하기가 어렵다\"고 말했다. 이에 대해 이 전 시의원은 \"교육부 장관은 '고등교육법' 제34조 제3항에 따라 대학수학능력시험을 시행할 법적 권한과 책임이 있다\"며 \"'고등교육법 시행령' 제32조에 따라 천재지변 등 부득이한 사정이 발생할 경우 시험일정을 변경할 수 있는 권한을 행사할 수 있다\"고 강조했다. 이어 \"시험 감독관의 육안에 의존하는 기존 시험 감독 체계로는 신종 AI 기기를 이용한 부정행위를 적발하기 어렵고 이러한 부정행위가 발생할 가능성이 매우 높아 실효성 있는 대책이 없는 현 상황은 정상적인 시험 시행이 곤란한 '부득이한 사정이 발생한 경우'에 준하는 사유에 해당한다고 할 것\"이라고 지적했다. 그러면서 \"(최 장관이) 부정행위를 막을 수 없다면서도 수능을 연기해서 실효성 있는 대책을 실현하지 않은 것은 의식적으로 직무를 포기해 국가의 기능을 저해하고 수험생과 학부모에게 피해를 야기한 것\"이라고 고발 이유를 설명했다.","category":"사회"},{"title":"\"하늘에서 족발이 떨어졌다\"…앞유리 파손에 차주 '날벼락'","link":"https://n.news.naver.com/mnews/article/003/0014326495","naverLink":"https://n.news.naver.com/mnews/article/003/0014326495","pubDate":"2026-11-17T11:00:07.194597+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 하늘에서 떨어진 족발 한 덩어리가 주차된 차량 앞유리에 박힌 모습이 공개됐다. (사진 출처=JTBC '사건반장' 캡처) [서울=뉴시스]허준희 인턴 기자 = 하늘에서 족발 한 덩어리가 떨어져 주차된 차량의 앞유리가 파손되는 사연이 전해졌다. 지난 16일 JTBC '사건반장'에서는 차량 위로 족발이 떨어져 앞유리가 깨진 모습이 공개됐다. 방송에서 공개된 영상에는 까마귀 한 마리가 족발 한 덩어리를 발에 쥔 채 전선이 여러 겹으로 얽힌 상공을 날아가는 모습이 담겼다. 이후 까마귀가 들고 있던 족발이 차량 앞유리로 '쾅' 하는 소리를 내며 떨어졌다. 이어 공개된 사진에는 흰색 차량의 앞유리와 보닛이 맞닿는 부분에 족발이 끼어 있는 모습이 포착됐다. 특히 차량 앞유리 오른쪽에는 길게 금이 간 흔적이 선명하게 보인다. 하늘에서 떨어진 족발이 차량에 부딪히면서 유리까지 파손된 것으로 보인다. 제보자는 \"차 앞유리도 금이 갔다\"라고 전했다. 해당 사연을 접한 네티즌들은 \"족발이 하늘에서 떨어졌다는 게 믿기지 않는다\", \"차량 수리비는 누가 책임지느냐\", \"까마귀가 족발을 물고 가다 떨어뜨린 것 아니냐\", \"이런 일도 다 있네\" 등의 반응을 보였다.","category":"사회"},{"title":"아리바이오 \"치매약 3상 효과…美FDA 허가 추진\"","link":"https://n.news.naver.com/mnews/article/003/0014326497","naverLink":"https://n.news.naver.com/mnews/article/003/0014326497","pubDate":"2026-11-17T11:00:07.194596+09:00","author":"네이버뉴스","description":"'AR1001', 위약보다 임상적 악화 31% 더딘 것으로 나타나 전체 환자군에서는 통계적으로 유의한 효과 입증 못해 아리바이오 \"치료 선택지 제공…美FDA에 품목허가 나선다\" 업계, FDA 허가 미지수…추가 임상·데이터 요구 가능성 커 [서울=뉴시스] 스탠퍼드 대학교 기억장애 부문 책임자이자 AR1001 글로벌 임상시험 총괄책임자인 샤론 샤 (Sharon Sha, M.D., M.S.) 교수가 미국 보스턴에서 열린 알츠하이머병 임상시험 학회 ‘CTAD 2026’에서 AR1001의 글로벌 임상 3상 ‘POLARIS-AD’ 톱라인(주요지표) 결과를 발표하는 모습 (사진=아리바이오 제공) 2026.11.17. photo@newsis.com *재판매 및 DB 금지 [서울=뉴시스]황재희 기자 = 아리바이오의 알츠하이머병 치료제 ‘AR1001’이 글로벌 임상 3상에서 기존 치매 치료제를 복용하지 않은 환자군을 대상으로 통계적으로 유의미한 치료 효과를 보였다. 다만 전체 환자군에서는 통계적으로 유의한 효과를 입증하지 못했다. 아리바이오는 이번 결과를 토대로 미국 식품의약국(FDA) 허가 신청에 나선다는 입장이다. 아리바이오는 17일 오전 6시 5분 (한국시간) 미국 보스턴에서 열린 알츠하이머병 임상시험 학회 ‘CTAD 2026’에서 AR1001의 글로벌 임상 3상 ‘POLARIS-AD’ 톱라인(주요지표) 결과를 발표했다. 발표는 스탠퍼드 대학교 기억장애 부문 책임자이자 AR1001 글로벌 임상시험 총괄책임자인 샤론 샤 (Sharon Sha, M.D., M.S.) 교수가 맡아 전체 집단과 단독요법군의 유효성 및 안전성 결과를 설명했다. POLARIS-AD는 초기 알츠하이머병 환자 1535명을 대상으로 미국, 캐나다, 유럽, 한국, 중국 등 13개국 약 230개 임상센터에서 진행된 대규모 글로벌 임상 3상이다. 참여 환자들은 AR1001 30㎎ 또는 위약(가짜약)을 하루 한 알씩 52주간 복용하며 정기적으로 임상 평가를 받았다. 이번 임상은 AR1001의 효과를 전체 환자군과 단독요법군으로 나눠 평가하도록 설계됐다. 미국 식품의약국(FDA), 유럽의약품청(EMA) 등 규제기관과 협의를 거쳐 사전에 설정한 방식이라는게 회사 측 설명이다. 단독요법군은 임상 시작 시점에 아세틸콜린에스테라제 억제제나 메만틴 등 기존 알츠하이머병 치료제를 함께 복용하지 않은 환자들이다. 이 집단을 주요 분석 대상으로 정한 것은 앞선 임상 2상에서 확인","category":"사회"},{"title":"진돗개 목줄 걸려 자전거 타던 50대 두개골 골절…견주 벌금 500만원","link":"https://n.news.naver.com/mnews/article/421/0009293112","naverLink":"https://n.news.naver.com/mnews/article/421/0009293112","pubDate":"2026-11-17T11:00:07.194591+09:00","author":"네이버뉴스","description":"50대 여성 전치 8주 부상…광주지법, 벌금형 선고 광주지방법원. ⓒ 뉴스1 (전남광주=뉴스1) 이수민 기자 = 진돗개를 산책시키면서 목줄을 길게 늘어뜨려 자전거를 타고 지나던 50대 여성을 다치게 한 견주가 벌금형을 선고받았다. 광주지법 형사3단독(재판장 장유나)은 동물보호법 위반과 과실치상 혐의로 기소된 A 씨에게 벌금 500만 원을 선고했다고 17일 밝혔다. A 씨는 지난해 10월 31일 오후 전남광주 담양의 한 도로에서 생후 36개월 된 진돗개를 산책시키던 중 목줄을 제대로 관리하지 않아 자전거를 타던 B 씨(51·여)를 다치게 한 혐의로 재판에 넘겨졌다. 당시 A 씨는 도로 중앙선 부근에서 목줄을 길게 늘어뜨린 채 잡고 있었고, 진돗개는 도로 오른쪽 인도 부근을 걷고 있었다. 이곳을 자전거로 지나던 B 씨가 목줄에 걸려 넘어지면서 아스팔트 바닥에 머리를 부딪혀 외상성 뇌내출혈과 두개골 골절 등 전치 8주의 상해를 입었다. 법원은 산책하거나 자전거를 타는 사람이 많은 도로에서 A 씨가 목줄을 2m 이하로 유지하고 주변을 살펴 사고를 막아야 할 주의의무를 소홀히 했다고 판단했다. 재판부는 \"피해자가 입은 상해 정도가 가볍지 않고 피고인이 피해자로부터 용서받지 못했다\"며 \"다른 종류의 범죄로 두 차례 벌금형을 받은 것 외에 전과가 없고, 뒤늦게나마 범행을 인정한 점 등을 고려했다\"고 판시했다.","category":"사회"},{"title":"한 총리 \"수능 안경·시계 전수조사하고 소매·옷깃·단추도 검사\"","link":"https://n.news.naver.com/mnews/article/018/0006410972","naverLink":"https://n.news.naver.com/mnews/article/018/0006410972","pubDate":"2026-11-17T11:00:07.194590+09:00","author":"네이버뉴스","description":"범정부 긴급대응팀 가동해 스마트기기 반입 원천 봉쇄 안경·시계·옷 단추까지 전수 점검 한 총리 \"수능 대책 오늘 오후 직접 브리핑\" [세종=이데일리 송주오 기자] 한성숙 국무총리는 이틀 앞으로 다가온 2027학년도 대학수학능력시험(수능)에서 인공지능(AI)을 악용한 부정행위를 ‘사회악’으로 규정하고, 범정부 긴급대응팀을 가동해 발본색원하겠다고 밝혔다. 한성숙 국무총리가 17일 서울 종로구 정부서울청사에서 열린 국무회의에서 발언하고 있다.(사진=연합뉴스) 한 총리는 17일 오전 열린 국무회의 모두발언을 통해 최근 국가자격시험 등에서 불거진 AI 악용 부정행위에 대한 수험생과 학부모의 우려를 언급하며 강력한 수능 부정행위 방지 대책을 내놨다. 우선 시험장 내 스마트기기 반입 및 사용을 물리적으로 차단한다. 한 총리는 “스마트폰 등 모든 스마트기기는 전원 종료 후 수거하고 수험생이 착용한 안경과 시계를 전수 점검하는 한편, 옷깃과 소매, 단추 등도 꼼꼼하게 살피겠다”고 강조했다. 고의로 기기를 반납하지 않고 몰래 사용하는 행위를 적발하기 위한 환경 통제도 강화된다. 시험장 주변의 와이파이(Wi-Fi) 관리를 엄격히 통제하고, 수험생의 가방 등 소지품은 시험실 내부가 아닌 복도 등 외부에 별도로 보관토록 했다. 또한 시험 시간 중 외부 보관된 소지품에서 스마트기기 작동 신호가 있는지 수시로 점검을 진행할 계획이다. 부정행위에 대해서는 무관용 원칙을 적용한다. 감독관을 추가로 배치해 현장에서의 부정행위는 물론 온라인 등을 통한 사전 모의 정황에 대해서도 엄단하기로 했다. 의심 사례가 발생할 경우 끝까지 추적해 △시험 무효 처리 △응시자격 박탈 △고발 및 수사 의뢰 등 엄정 대응한다는 방침이다. 한 총리는 “교육부 등 관계기관은 직을 건다는 자세로 혼신의 힘을 다해주시기 바란다”고 주문하며 “수험생들이 그간 쌓아온 노력이 정당한 결실로 이어질 수 있도록 정부는 수능 관리에 끝까지 최선을 다하겠다”고 말했다. 한편, 한 총리는 “구체적인 내용은 오늘 오후 브리핑을 통해서 제가 직접 말씀드리겠다”며 범정부 차원의 세부 대책 발표를 예고했다.","category":"사회"},{"title":"신발 끈 묶는 척하더니…가게 앞 반려견 유아차 훔쳐 달아난 여성","link":"https://n.news.naver.com/mnews/article/421/0009293120","naverLink":"https://n.news.naver.com/mnews/article/421/0009293120","pubDate":"2026-11-17T11:00:07.194582+09:00","author":"네이버뉴스","description":"JTBC '사건반장' (서울=뉴스1) 김학진 기자 = 가게 앞에 세워둔 반려견용 유아차를 훔쳐 가는 여성의 모습이 CCTV에 포착됐다. 지난 16일 JTBC '사건반장'에서는 한 여성이 가게 앞에 놓인 반려견용 유아차를 가져가는 장면이 담긴 CCTV 영상이 공개됐다. 영상 속 여성은 가게 앞에 세워진 유아차를 발견하고 걸음을 멈췄다. 이어 유아차 위에 자 가방을 올려놓은 뒤 주변을 의식하듯 신발 끈을 묶는 척 몸을 숙였다. 이후 옆에 계단 등을 주시하며 사람이 있는지를 살피며 두리번거리더니 그대로 유아차를 끌고 자리를 벗어났다. 해당 유아차는 제보자 A 씨가 자신의 가게 앞에 세워둔 것이었다. 유기견을 입양해 돌보고 있는 A 씨는 반려견이 슬개골 탈구를 앓고 있어 오래 걸으면 다리에 무리가 가는 탓에 유아차를 이용해 왔다. A 씨는 현재 경찰에 신고한 상태이며, 관할 경찰서 확인한 결과 조만간 용의자가 특정될 것으로 보고 있다. A 씨는 \"해당 여성이 방송을 본다면 스스로 유아차를 돌려주길 바란다\"고 호소했다.","category":"사회"},{"title":"여학생 따귀·음주운전까지…교육부 장관 과거 재소환","link":"https://n.news.naver.com/mnews/article/015/0005354695","naverLink":"https://n.news.naver.com/mnews/article/015/0005354695","pubDate":"2026-11-17T11:00:07.194561+09:00","author":"네이버뉴스","description":"AI 부정행위 불안 속 교육장관 답변 논란 김민석도 \"해당 부분 빨리 정정했어야\" 학생 뺨 때린 일화·음주운전 전력 재조명 사진=뉴스1 인공지능(AI)을 활용한 시험 부정행위로 수험생들의 불안이 커지는 가운데 최교진 교육부 장관의 발언이 논란을 빚으면서 과거 언행과 이력까지 재조명되고 있다. 온라인에서는 전날 최 장관의 신중하지 못한 대응을 비판하며 수능 연기 등 대책을 촉구하는 한편, 학생의 뺨을 때렸다고 밝힌 과거 인터뷰와 음주운전 전력, 정치적 편향 논란을 부른 사회관계망서비스(SNS) 게시물까지 소환하고 있다. 17일 교육계에 따르면 최 장관은 전날 정근식 서울시교육감과 함께 서울 영등포여자고등학교를 방문해 2027학년도 대학수학능력시험 준비 상황을 점검했다. 이 자리에서 세무사 시험 부정행위 사건을 거론하며 \"솔직하게 말씀드려서 저로서는 이렇게까지 한다고?\"라고 반응하며 미소를 보였다. 최 장관은 부정한 방법으로 기계를 사용하는 상황에 우려를 나타내면서 부정행위자에 대한 무관용 대응 방침을 제시했다. 앞서 같은 날 국회 교육위원회에서는 부정행위를 적발할 자신이 있느냐는 질문에 내놓은 답변이 도마에 올랐다. 박정훈 국민의힘 의원이 초소형 카메라 등을 이용한 부정행위를 100% 잡아낼 자신이 있느냐고 묻자 최 장관은 \"전 못할 것 같다\"고 답했다. 박 의원이 교육부 수장으로서 부적절한 답변이라고 지적하자 최 장관은 \"제 나이가 있어서…개인은 그것을 하기가 어렵겠다는 말씀\"이라고 해명했다. 현장 감독관들이 적발할 수 있느냐는 추가 질의에는 \"관련 국장이 답변해 주면 좋겠다\"고 요청했다. 교육부는 이후 최 장관의 발언에 대해 \"초소형 카메라 등을 활용한 부정행위 관련 수능 현장 감독관들의 어려움에 공감을 표현한 것\"이라며 \"교육부 차원에서 부정행위 적발이 불가능하다거나 대응에 자신이 없다는 의미가 아니다\"라고 설명했다. 여당 대표도 최 장관의 답변을 지적했다. 김민석 더불어민주당 대표는 이날 오전 당 유튜브 방송 '민티07'에서 \"우려를 자아내는 장면이었다\"고 평가했다. 최 장관이 자신이 감독관이라면 적발할 수 있겠느냐는 질문으로 받아들였을 가능성을 거론하면서도 \"그렇다면 해당 부분을 빨리 정정했어야 한다\"고 짚었다. 온라인에서는 최 장관의 발언이 알려진 뒤 지난해 장관 후보자 인사 검증 당시 논란이 된 과거 언행까지 다시 소환하며 교육당국의 강력한 대응을 촉구하는 목소리가 터져 나오고 있다. 대표적인 사례는","category":"사회"},{"title":"충북도, 자율주행 셔틀 운행구간 확대…의료·생활시설 접근성 개선","link":"https://n.news.naver.com/mnews/article/030/0003486430","naverLink":"https://n.news.naver.com/mnews/article/030/0003486430","pubDate":"2026-11-17T11:00:07.194548+09:00","author":"네이버뉴스","description":"자율주행 셔틀버스 '모두타유' 충북도가 진천·음성 충북혁신도시 일원에서 실증 중인 자율주행 셔틀버스 '모두타유'의 운행 노선을 기존 6.8㎞에서 12.95㎞로 2배 가까이 확대했다. 충북도는 16일부터 기존 혁신도시 순환노선에 국립소방병원과 맹동면 소재지(쌍정리·맹동초 일대) 구간을 추가해 운행하고 있다고 17일 밝혔다. 이번 노선 확대로 혁신도시와 맹동면 생활권을 연결하면서 공공기관 직원의 출퇴근 편의와 주민들의 의료·생활시설 접근성이 개선될 전망이다. 셔틀버스는 음성에서 진천으로 향하는 A1 노선과 진천에서 음성으로 향하는 A2 노선으로 운영되며, 각 노선에서 16개 정류장에 정차한다. 운행 시간은 오전 7시부터 오후 4시까지다. 모두타유는 인공지능(AI)이 주행을 담당하고 운전자가 돌발상황에 대응하는 레벨3 자율주행 방식의 15인승 차량이다. 전국 최초로 지역 운수사인 진천여객과 음성교통이 운영을 맡고 있다. 충북혁신도시는 2023년 6월 자율주행자동차 시범운행지구로 지정됐으며, 같은 해 12월 셔틀버스 첫 운행을 시작했다. 현재까지 무사고 운행을 이어가고 있으며 누적 탑승객은 5285명이다. 충북도는 진천군·음성군 및 운수사와 협력해 도로공사 구간 우회와 생활권 연장 방안을 마련하고, 지난달 13일 국토교통부 시범운행지구 변경 고시 절차를 완료했다. 향후 이용 실적과 운행 데이터를 분석해 정류장과 시간표를 보완하는 등 자율주행 대중교통 실증 성과를 높일 계획이다. 변인순 충북도 AI과학인재국장은 “도로공사로 운행 여건이 바뀌는 상황에서도 관계기관 협력으로 노선을 새롭게 개편했다”며 “자율주행 셔틀버스가 실증을 넘어 혁신도시 출근길의 일상이 되도록 이용 편의를 지속 확대하겠다”고 말했다.","category":"사회"}],"생활·문화":[{"title":"[오늘날씨] 아침엔 다소 '포근'⋯오후부터는 전국적으로 비 쏟아진다","link":"https://n.news.naver.com/mnews/article/031/0001075587","naverLink":"https://n.news.naver.com/mnews/article/031/0001075587","pubDate":"2026-11-17T11:00:08.460340+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"'수능 D-1' 낮 기온 최대 6도 뚝…시속 55㎞ 강풍에 '쌀쌀'[내일 날씨]","link":"https://n.news.naver.com/mnews/article/421/0009292812","naverLink":"https://n.news.naver.com/mnews/article/421/0009292812","pubDate":"2026-11-17T11:00:08.460336+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"장 건강부터 혈당 관리까지…섬유질 풍부한 식품 6가지","link":"https://n.news.naver.com/mnews/article/296/0000107416","naverLink":"https://n.news.naver.com/mnews/article/296/0000107416","pubDate":"2026-11-17T11:00:08.460331+09:00","author":"네이버뉴스","description":"섬유질 섭취 부족하면 변비, 배변 불편 나타날 수 있어 견과류는 섬유질이 풍부해 장 건강과 혈당 조절 등에 도움이 되는 식품으로 꼽힌다. 사진=클립아트코리아 섬유질은 식물성 식품에 들어 있는 성분으로, 우리 몸의 소화 효소로는 완전히 분해하거나 소화하지 못하는 탄수화물의 일종이다. 식이 섬유라고도 부른다. 섬유질은 장 건강뿐만 아니라 혈당 조절, 콜레스테롤 관리, 체중 감량 등 다양한 건강 효과가 있어 건강한 식생활에 꼭 필요한 영양 성분이다. 전문가들은 \"섬유질은 배부른 느낌을 오래가게 해 당뇨병 치료에 도움이 될 수 있다\"면서 \"혈당을 조절하고 혈중 콜레스테롤 수치도 낮춰준다\"고 말한다. 섬유질의 영양상 장점을 활용하려면 하루에 20~25g 이상 섭취해야 한다. 대부분 권장량을 채우지 못한다. 우리가 먹는 식사에 섬유질이 풍부한 음식을 추가하면 쉽게 해결할 수 있다. 미국 인터넷 매체 '허프포스트(HuffPost)' 등의 자료를 토대로 섬유질이 풍부한 식품을 정리했다. 사과 =사과는 섬유질의 가장 기본적인 공급원이다. 섬유질이 3g 이상이면 좋은 음식인데, 사과는 4g 정도를 가지고 있다. 하루에 사과 하나를 먹는 것은 섬유질의 하루 권장량을 얻는 데 도움이 된다. 견과류 =전문가들은 \"사람들은 섬유질을 많이 가진 음식으로 항상 채소와 과일들만 생각하는데 견과류도 그에 못지않다\"고 말한다. 아몬드 4분의 1 컵에는 4g의 섬유질이 있다. 또한 견과류는 종류에 따라 각각 다른 영양분을 가지고 있으므로 한 가지만 고집하지 말고 여러 가지를 먹는 게 좋다고 한다. 완두콩 =완두콩은 사람들이 지나치기 쉬운 섬유질 저장고라고 할 수 있다. 삶은 완두콩 한 컵에는 4g의 섬유질이 들어있다. 양파 =중간 크기 양파에는 2g의 섬유질이 있다. 양은 많지 않아도 좋은 종류이다. 양파에 있는 다당류인 이눌린은 수용성 섬유질로 콜레스테롤 수치를 낮춰준다. 이눌린은 섬유질 보충제에 추가되지만 양파, 아스파라거스, 파 등에는 자연적으로 함유돼 있다. 키위 =키위 한 알에는 2g의 섬유질이 있다. 가방에 몇 개 넣고 다니면 오후 간식으로 훌륭하다. 하루에 필요한 섬유질의 양도 채울 수 있다. 딸기류도 비슷한데, 특히 라즈베리는 한 컵에 8g의 섬유질이 들어 있다. 치아시드 =치아시드(치아 씨앗)는 수용성과 불용성 섬유질을 함께 갖고 있어 섬유질의 훌륭한 공급원이다. 치아시드 1작은스푼에는 6g의 섬유질이 들어 있다. 치아시드를 아이","category":"생활·문화"},{"title":"“배달이 늦은건데 별점 테러 억울해”…배민, 음식·배달 평가 분리한다","link":"https://n.news.naver.com/mnews/article/009/0005764709","naverLink":"https://n.news.naver.com/mnews/article/009/0005764709","pubDate":"2026-11-17T11:00:08.460322+09:00","author":"네이버뉴스","description":"배민, 리뷰 서비스 개편안 리뷰 화면서 배달 별점 따로 맛·양 담은 칭찬리뷰 신설 리뷰 수는 전체 기간 누적 배달의민족 기존 리뷰 작성 화면(왼쪽)과 배달·음식 별점을 나눈 새 화면. 배민은 23일까지 일부 고객을 대상으로 새 화면을 시범 운영한 뒤 순차 확대한다. [사진 제공=우아한형제들] 배달의민족에서 음식을 시킨 뒤 남기는 별점이 ‘배달’과 ‘음식’으로 나뉜다. 배달이 늦거나 음식이 파손된 채 도착해도 가게 평균 별점에는 음식 별점만 반영된다. 점주가 직접 손쓰기 어려운 배달 과정 때문에 가게 평판이 깎인다는 불만을 받아들인 조치다. 배민 운영사 우아한형제들은 이런 내용을 담은 리뷰 서비스 개편안을 17일 내놨다. 새 리뷰 작성 화면은 오는 23일까지 일부 고객을 대상으로 시범 운영한 뒤 순차적으로 확대한다. 맛과 양 등을 구체적으로 적은 후기를 모아 보여주는 ‘칭찬리뷰’도 새로 만들고, 다음 달 1일부터는 가게 리뷰 수를 입점 이후 전체 기간 누적으로 보여준다. 지금까지는 리뷰를 쓰려면 두 단계를 거쳐야 했다. 첫 화면에서 배달에 대해 ‘좋아요’나 ‘아쉬워요’ 중 하나를 고르고, 다음 화면에서 음식 별점과 후기를 남기는 식이었다. 이 과정에서 배달에 대한 아쉬움이 음식 별점으로 옮겨 가 가게 별점을 끌어내리는 일도 있었다. 바뀐 화면에서는 한 화면 안에서 배달과 음식에 별점을 따로 매긴다. 음식 리뷰는 필수, 배달 평가는 선택이다. 배달 평가에서는 ‘매우 늦게 도착’, ‘요청사항 불이행’, ‘음식 파손’, ‘불친절’, ‘다른 주소에 도착’ 같은 항목으로 불편했던 점을 고를 수 있고, 이 의견은 익명으로 전달된다. 가게 평균 별점은 음식 별점으로만 계산한다. 배달 별점은 배달 서비스 개선에 쓰되 라이더 개인 평가나 배차, 보상에는 반영하지 않는다. 점주는 배달 평가에 별점이 흔들릴 걱정을 덜고, 고객도 가게를 고를 때 음식 평가만 놓고 판단할 수 있게 됐다. 리뷰 상세 화면에는 ‘이 가게의 칭찬리뷰’ 코너가 생긴다. 음식의 맛과 식감, 양 등을 생생하게 적은 후기를 골라 리뷰 목록 위에 따로 보여주는 방식이다. 점주는 가게 강점을 자연스럽게 알릴 수 있고, 고객은 실제 이용자의 구체적인 후기를 참고해 주문을 정할 수 있다. 리뷰 수 표시 기준도 바뀐다. 지금도 고객이 남긴 리뷰는 기간과 상관없이 모두 읽을 수 있지만, 가게 목록과 상세 화면에 뜨는 리뷰 수는 최근 6개월 치만 셌다. 다음 달부터는 입점 이","category":"생활·문화"},{"title":"원주 치악산 케이블카 멈추자 설악산 오색 수익성 논란 재점화","link":"https://n.news.naver.com/mnews/article/001/0016445612","naverLink":"https://n.news.naver.com/mnews/article/001/0016445612","pubDate":"2026-11-17T11:00:08.460317+09:00","author":"네이버뉴스","description":"치악산 수익성 지수 0.65∼0.68…비슷한 오색 재정 부담·사업성 쟁점 환경단체 \"양양군도 재검토해야\" vs 양양군 \"운영수지는 흑자\" 설악산 오색케이블카 상부정류장 조감도 [양양군 제공. 재판매 및 DB 금지] (원주 양양=연합뉴스) 임보연 류호준 기자 = 강원 원주시가 경제성 부족을 이유로 치악산 케이블카 추진을 보류하면서 설악산 오색케이블카의 사업성과 재정 부담을 둘러싼 논쟁이 다시 주목받고 있다. 두 사업은 수익성 지수(PI)가 0.6대로 비슷하지만, 사업 규모와 추진 여건, 지역사회의 판단은 서로 다르다. 17일 원주시에 따르면 치악산 3개 후보 노선의 PI는 0.65∼0.68로 기준치 1을 밑돌자 후속 사업 추진을 보류했다. 노선별 사업비는 750억∼785억원, 연간 이용객은 약 58만명으로 추산됐다. 운영수지는 흑자가 예상됐지만 장기 이용객 감소와 초기 투자비, 인허가 부담 등을 종합하면 사업성이 부족하다고 판단한다. 시는 이에 따라 대규모 시설 투자 대신 치악산 사계절 관광 주간 등 기존 관광자원을 활용하는 방안을 검토하고 있다. 반면 양양군은 오색케이블카의 PI가 0.65라는 이유만으로 사업 중단 여부를 판단해서는 안 된다는 견해이다. 초기 건설비를 회수하는 재무적 수익성과 개장 뒤 매년 발생하는 운영수지는 구분해 살펴야 한다는 것이다. 군은 운영 단계에서는 수입이 지출을 웃도는 흑자가 예상되는 만큼 장기적인 관광객 유입과 지역경제 파급효과도 함께 고려해야 한다고 보고 있다. 사업 여건이 달라지면서 총사업비는 2022년 말 기준 1천172억원에서 1천793억원으로 621억원 늘어날 것으로 추산됐다. 군은 변경 인허가 등에 필요한 기간을 반영해 2030년 준공, 2031년 상업 운행을 목표로 사업을 추진하고 있다. 지난달 30일에는 설명회를 열어 사업비 증가와 사업 기간 변경 등 추진 상황을 공개하고 향후 계획을 제시했다. 양양군이 밝힌 사업비와 사업 기간 변경 내용 [양양군 제공. 재판매 및 DB 금지]","category":"생활·문화"},{"title":"유한양행 유한재단 \"가족돌봄청소년·청년 자립 위해 6.6억 지원\"","link":"https://n.news.naver.com/mnews/article/015/0005354610","naverLink":"https://n.news.naver.com/mnews/article/015/0005354610","pubDate":"2026-11-17T11:00:08.460289+09:00","author":"네이버뉴스","description":"유한재단과 한국사회보장정보원이 복지사각지대에 놓인 가족돌봄청소년·청년의 일상 회복과 자립을 돕기 위해 총 6억6000만원 규모의 지원에 나선다고 17일 밝혔다. 이번 지원사업은 지난 3월 체결한 ‘가족돌봄청소년·청년 성장 지원을 위한 업무협약’의 후속 조치다. 양 기관은 이번 사업을 시작으로 공공과 민간의 강점을 결합한 ‘민·관 협력형 복지사각지대 지원 사업’을 본격적으로 추진한다고 밝혔다. 이번 사업을 통해 유한재단은 전국 15개 시·도, 68개 시·군·구에 거주하는 가족돌봄청소년·청년 276명에게 향후 1년간 매월 20만 원의 생활보조비를 지급한다고 밝혔다. 지원금은 학업, 주거, 교통, 식비 등 기본 생계비는 물론 돌봄 서비스 이용과 의료·심리치료 등 대상자 개개인의 생활 여건과 필요에 맞춰 폭넓게 사용할 수 있도록 설계됐다. 사보원이 빅데이터 등을 활용해 잠재적 위기가구를 발굴해 지자체에 안내하면, 지자체는 현장 조사를 통해 실제 가족돌봄 상황과 생활 여건을 확인하고 신청을 지원한다. 이후 유한재단이 최종 심사를 거쳐 대상자를 선정하고 생활보조비를 지원하는 구조다. 향후 유한재단은 이번 사업의 효과와 현장 수요를 면밀히 분석해 지원체계를 보완하고 확대할 계획이라고 설명했다. 원희목 유한재단 이사장은 “공공의 손길이 미치기 어려운 복지사각지대를 찾아내고, 그 빈틈을 민간재원이 신속하고 유연하게 보완하는 것이 이번 사업의 핵심”이라며 “이번에 내딛은 첫걸음이 현장에서 안정적인 협력체계로 자리 잡고, 나아가 더 많은 기업과 공익재단의 참여로 이어지기를 기대한다”고 말했다.","category":"생활·문화"},{"title":"전화번호도 속이는 피싱…삼성의 새 대응책[모닝폰]","link":"https://n.news.naver.com/mnews/article/018/0006410811","naverLink":"https://n.news.naver.com/mnews/article/018/0006410811","pubDate":"2026-11-17T11:00:08.054249+09:00","author":"네이버뉴스","description":"RCS 기술 활용…가짜 전화 의심되면 경고 원UI 9.5 적용 가능성…보이스피싱 예방 기대 [이데일리 신영빈 기자] 스마트폰에 ‘엄마’라고 저장된 번호로 전화가 걸려왔다. 화면에는 익숙한 이름이 표시되지만 실제 전화를 건 사람은 가족이 아닌 사기범일 수 있다. 삼성전자(005930)가 이처럼 지인의 전화번호를 도용한 사칭 전화를 가려내는 기능을 갤럭시 스마트폰에 도입할 것으로 보인다. 발신자가 ‘엄마’로 표시돼도 실제로는 번호를 사칭한 전화일 수 있음을 경고하는 모습 (사진=구글) 17일 해외 IT 전문매체 안드로이드어소리티에 따르면 삼성전자가 개발 중인 갤럭시 기본 전화 애플리케이션 코드에서 ‘발신 기기 확인’ 기능이 발견됐다. 연락처에 저장된 번호로 전화가 걸려오면 실제 해당 번호의 휴대전화에서 발신한 것인지 확인하는 기능이다. 발신번호 변작은 실제 전화를 거는 번호와 수신자 화면에 표시되는 번호를 다르게 만드는 수법이다. 범죄자가 가족이나 지인의 전화번호로 위장하면 수신자 화면에는 평소 저장해 둔 이름이 표시될 수 있다. 최근에는 AI로 가족 목소리까지 흉내 내는 딥페이크 기술이 악용되면서 상대방을 신뢰하기 더욱 어려워졌다. 삼성전자가 준비 중인 기능은 차세대 문자메시지(RCS)를 활용한다. 전화가 걸려오면 연락처에 저장된 상대방 기기와 확인 신호를 주고받아 실제 발신 여부를 판단한다. 상대방 기기를 확인하지 못하면 사칭 전화일 가능성을 경고한다. 앱 코드에는 전화 한 건을 확인하는 데 최대 48바이트 데이터를 사용한다는 설명도 포함됐다. 연락처 정보는 스마트폰 내부에서만 확인하며 연락처와 통화 내용이 외부 서버로 전송되지 않도록 설계됐다. 해당 기능은 연락처에 저장된 번호를 대상으로 작동하며 인터넷과 RCS 연결이 필요하다. 모르는 번호로 걸려오는 전화는 별도의 스팸 탐지 기능으로 대응해야 한다. 구글은 앞서 지난 6월 픽셀 스마트폰을 시작으로 유사한 ‘가짜 전화 감지’ 기능을 도입했다. 상대방 기기에서 확인 신호가 오지 않으면 실제 연락처에 등록된 기기로 재확인한다. 구글은 당시 RCS가 개방형 표준인 만큼 다른 제조사도 관련 기술을 도입할 수 있다고 설명했다. 삼성전자는 기존 갤럭시 전화 앱에서도 AI가 모르는 번호와의 통화 내용을 실시간 분석해 보이스피싱 의심 여부를 알려주는 기능을 제공하기도 했다. 신규 기능은 차기 갤럭시 소프트웨어인 ‘원UI 9.5’에 탑재될 가능성이 제기된다.","category":"생활·문화"},{"title":"의료급여 9000억 구멍…복지 확대에 병원·약국도 '속앓이'","link":"https://n.news.naver.com/mnews/article/421/0009292733","naverLink":"https://n.news.naver.com/mnews/article/421/0009292733","pubDate":"2026-11-17T11:00:08.054240+09:00","author":"네이버뉴스","description":"기준 중위소득 인상·제도 개선에 수급자 171만 명으로 증가 복지부 내년 예산안에 5829억 반영…나머지 국회 증액 추진 서울 시내 한 약국(사진은 기사 내용과 무관함) / ⓒ 뉴스1 김성진 기자 (서울=뉴스1) 강승지 기자 = 올해 병의원과 약국에 지급해야 할 의료급여 진료비 9000억 원이 부족한 것으로 나타났다. 수급자 증가 속도를 정부 예산이 따라가지 못하면서 의료기관과 약국의 자금 부담이 커질 수 있다고 우려한다. 17일 보건복지부에 따르면 지난달 말 기준 올해 의료급여 진료비 미지급 예상액은 국비 9000억 원이다. 의료급여는 저소득층의 의료비를 국가와 지자체가 지원하는 제도로, 의료기관과 약국은 진료·조제 후 심사를 거쳐 비용을 받는다. 올해 의료급여 예산은 본예산 9조 8400억 원에 추경 2828억 원을 더한 약 10조 1000억 원이었다. 전년보다 1조 3000억 원 늘렸지만, 예상보다 빠른 수급자 증가세를 따라잡기에는 역부족이었다. 실제로 의료급여 수급자는 2023년 152만 4000명에서 2024년 154만 5000명, 지난해 159만 5000명으로 늘었다. 지난달에는 171만 2000명까지 증가했다. 지난해 대비 11만 7000명 늘어난 규모다. 수급자 증가는 기준 중위소득 인상과 제도 개선의 영향으로 풀이된다. 올해부터 4인 가구 기준 중위소득이 6.5% 오르고 부양의무자 기준도 완화되면서 의료급여 대상 저소득층이 확대됐다. 수급자가 늘수록 정부의 진료비 부담도 커진다. 문제는 예산 부족이 의료현장의 자금난으로 이어질 수 있다는 점이다. 의료기관은 의료급여 환자를 진료한 뒤 비용을 청구하지만, 정부 재원이 제때 확보되지 않으면 지급이 늦어질 수밖에 없다. 특히 운영자금 여력이 상대적으로 부족한 중소 병의원은 인건비와 4대 보험료, 의약품 및 의료소모품 대금 결제에 부담을 겪을 수 있다. 약국 역시 의약품을 먼저 구매한 뒤 의료급여 조제료 등을 지급받는 구조여서 진료비 지급 지연이 장기화하면 자금 운용에 어려움이 생길 수 있다. 이에 따라 복지부는 미지급금 해소를 위해 내년도 의료급여 예산안에 12조 2973억 원을 편성했다. 올해 본예산보다 2조 4573억 원(25%) 늘어난 규모로, 올해 미지급금 해소분 5829억 원과 진료비 증가분 1조 7000억 원 등이 포함됐다. 복지부는 나머지 3171억 원을 국회 심의 과정에서 추가 확보하고 예비비 등도 관계 부처와 협의할 계획이다. 건보공단","category":"생활·문화"},{"title":"치매 부모 모시던 아들 숨진 채 발견…부친 배회, 모친 모텔 투숙","link":"https://n.news.naver.com/mnews/article/008/0005442179","naverLink":"https://n.news.naver.com/mnews/article/008/0005442179","pubDate":"2026-11-17T11:00:07.194578+09:00","author":"네이버뉴스","description":"치매를 앓는 노부모와 살던 40대 남성이 자택에서 숨진 채 발견돼 경찰이 수사에 나섰다. /사진=임종철 디자인기자 치매를 앓는 노부모와 살던 40대 남성이 자택에서 숨진 채 발견돼 경찰이 수사에 나섰다. 17일 뉴스1에 따르면 전날 오후 5시 30분께 파주시 아동동 한 아파트 경비실로부터 80대 남성 A씨가 집에 들어가지 못해 보호하고 있다는 내용의 신고가 접수됐다. 경찰은 A씨 인적 사항을 확인하고 주거지를 방문했다. 그러나 현관문 비밀번호를 알 수 없어 소방 당국에 협조를 요청했다. 출동한 소방대원들이 베란다를 통해 집 안으로 들어갔다. 내부에서는 A씨 아들 B씨가 숨진 채 발견됐다. 발견 당시 시신은 부패가 진행된 상태였다. 타살 등 범죄 혐의점은 없었다. B씨는 치매를 앓는 A씨와 70대 어머니 C씨와 함께 거주해 온 것으로 파악됐다. C씨의 행방도 묘연했다. 탐문에 나선 경찰은 CCTV 분석 등을 통해 이날 오전 7시 55분께 파주시 한 모텔에서 투숙하고 있던 C씨를 찾았다. 경찰은 국립수사연구원에 시신 부검을 의뢰하는 등 사건 경위를 조사 중이다.","category":"생활·문화"},{"title":"“AI 커닝 대책 없이 수능 강행”…최교진 교육부 장관 고발당해","link":"https://n.news.naver.com/mnews/article/666/0000132395","naverLink":"https://n.news.naver.com/mnews/article/666/0000132395","pubDate":"2026-11-17T11:00:07.194556+09:00","author":"네이버뉴스","description":"이종배 국민의힘 전 시의원, 최교진 장관 고발 \"전파차단기 도입 법령 개정 안 해…포항 지진 때처럼 연기해야\" 최교진 교육부 장관. 연합뉴스 인공지능(AI) 기기를 이용한 시험 부정행위 우려가 확산하는 가운데, 오는 19일로 예정된 대학수학능력시험(수능)을 연기하지 않았다는 이유로 최교진 교육부 장관이 경찰에 고발됐다. 이종배 국민의힘 전 서울시의원은 최 장관을 직무유기 혐의로 서울경찰청에 고발했다고 17일 밝혔다. 이 전 시의원은 고발 취지를 밝히며 “현행 시험 감독 체계로는 초소형 카메라와 AI 스마트안경 등 첨단 기기를 동원한 지능형 부정행위를 사실상 적발하기 어렵다”라며 “실효성 있는 방지 대책이 완벽히 마련될 때까지 수능 일정을 연기해야 한다”고 주장했다. 이어 “지난 2017년 포항 지진 발생 당시에도 수험생의 안전과 공정성을 위해 수능을 전격적으로 일주일 연기한 전례가 있다”라며 “시험장 내 전파차단기와 첨단 탐지기 등을 신속히 도입하기 위한 관련 법령 개정에 적극 나서지 않은 것은 교육 수장으로서 명백한 직무유기에 해당한다”고 지적했다. 최 장관은 전날 열린 국회 교육위원회 전체회의에 출석해 야권 일각에서 제기된 수능 연기론에 대해 “수능을 연기할 경우 입시 일정 전반에 걸쳐 훨씬 더 큰 사회적 혼란이 발생할 수 있다”며 일정 강행 입장을 분명히 한 바 있다. 또한 같은 자리에서 AI를 활용한 부정행위를 완벽하게 적발할 수 있느냐는 질문에 “전 나이가 있어서 못할 것 같다”는 취지로 답변했다가 교육부 수장으로서 책임 있는 답변이 부족하다는 질타를 받기도 했다. 앞서 지난 15일 AI를 활용한 부정행위 의혹을 받았던 세무사 수석 합격자 한모씨(34)가 자신의 부정행위 사실을 자백했다. 이후 온라인을 통해 비슷한 자백 글이 다수 올라오고, 교육 전문가들 사이에서 수능 부정행위에 대한 우려가 확산되자 파장이 커졌다. 한편 한씨는 이날 오전 피의자 신분으로 경찰에 출석에 조사받고 있다.","category":"생활·문화"}],"세계":[{"title":"트럼프 지지율 최저권 32% 정체…민주당 슈머도 당내 인기 하락","link":"https://n.news.naver.com/mnews/article/421/0009292934","naverLink":"https://n.news.naver.com/mnews/article/421/0009292934","pubDate":"2026-11-17T11:00:07.637385+09:00","author":"네이버뉴스","description":"로이터·입소스 여론조사…\"이란 전쟁 지지한다\" 31% 도널드 트럼프 미국 대통령. 2026.11.9 ⓒ AFP=뉴스1 (서울=뉴스1) 김경민 기자 = 도널드 트럼프 미국 대통령의 지지율이 재임 기간 중 최저 수준인 32%에 머물렀다고 로이터통신이 16일(현지시간) 보도했다. 로이터통신과 입소스가 미국 성인 1521명을 대상으로 13일부터 이날까지 온라인으로 실시한 여론조사에 따르면 32%가 트럼프 대통령의 국정 수행을 지지한다고 답변했다. 트럼프 대통령의 지지율은 취임 이후 최저치인 31%를 기록했던 지난 10월 중순 이후 네 차례 연속 로이터·입소스 여론조사에서 비슷한 수준을 유지하고 있다. 이란 전쟁을 지지한다는 답변은 31%에 불과했다. 올해 미국의 이란 전쟁으로 연료 가격이 급등하면서 가계 경제가 타격을 입자 트럼프 대통령의 인기도 하락했다. 경제적 충격으로 11·3 중간선거에서 트럼프 대통령이 속한 공화당은 다수당 지위를 잃게 됐다. 이번 여론조사에서 민주당 지지층 중 약 34%는 척 슈머 민주당 상원 원내대표를 긍정적으로 평가했다. 민주당 지지층의 43%는 슈머 원내대표를 부정적으로 평가했다. 22%는 슈머 원내대표에 대해 들어본 적이 없다고 응답했다. 지난 2월 실시된 로이터·입소스 여론조사에선 민주당 지지층의 38%가 슈머 원내대표를 긍정적으로, 37%가 부정적으로 평가한 바 있다. 민주당은 오는 12월 비공개 무기명 투표로 민주당 상원 원내대표 선거를 치른다. 2017년부터 민주당을 이끌고 있는 슈머 원내대표는 크리스 밴 홀런 상원의원과 차기 원내대표 자리를 놓고 경쟁하고 있다. 밴 홀런 의원은 이스라엘의 가자지구 전쟁을 강하게 비판했으며, 이스라엘에 대한 일부 무기 판매를 중단할 필요가 있다고 주장했다. 슈머 원내대표 역시 이스라엘의 가자지구 공격엔 밴 홀런 의원과 뜻을 같이했으나, 미국의 동맹국인 이스라엘에 대한 무기 판매 제한 법안엔 반대표를 던졌다. 하킴 제프리스 민주당 하원 원내대표는 민주당 지지층의 40%에서 긍정적인 평가를 받았다. 29%는 부정적으로 평가했으며, 29%는 제프리스 원내대표를 모른다고 답변했다. 민주당과 달리, 공화당 지지층은 지도부에 대해 더 높은 결속력을 보였다. 공화당 지지층의 75%는 트럼프 대통령을, 77%는 JD 밴스 부통령을 긍정적으로 평가했다.","category":"세계"},{"title":"\"호객꾼 따라간 술집, 긁힌 카드엔 8000만원\"…한국인 몰리는 신주쿠 바가지 '비상'","link":"https://n.news.naver.com/mnews/article/277/0005843561","naverLink":"https://n.news.naver.com/mnews/article/277/0005843561","pubDate":"2026-11-17T11:00:07.637382+09:00","author":"네이버뉴스","description":"외국인 피해 상담 1년 새 3배…올해만 240건 동의 없는 카드 결제로 약 8000만원 피해 사례도 한국인 관광객들에게 인기 높은 일본 도쿄의 유흥가 신주쿠 가부키초에서 외국인 관광객을 상대로 한 바가지요금 피해가 급증하고 있다. 사진은 기사의 특정 내용과 직접 관련 없음. 펙셀스 지난 12일 교도통신에 따르면 도쿄 경시청은 올해 1~10월 신주쿠경찰서에 접수된 외국인 관광객의 바가지요금 피해 상담이 약 240건으로 집계됐다고 밝혔다. 지난해 같은 기간보다 약 3배 늘어난 규모다. 외국인 관광객뿐 아니라 일본인 등 내국인 피해까지 포함하면 같은 기간 신주쿠경찰서에 접수된 바가지요금 피해 상담은 약 340건에 달했다. 전체 피해액은 약 3억9000만엔(약 32억6600만원)이다. 지난해 한 해 동안 접수된 피해액 약 1억 4000만엔(약 11억7300만원)의 두 배를 이미 넘어섰다. 피해 사례를 보면 호객꾼의 안내로 들어간 술집에서 결제할 때 손님의 동의 없이 신용카드로 거액을 청구하는 수법이 주를 이뤘다. 한 명이 무려 960만엔(약 8040만원)의 피해를 본 사례도 있었다. 이와 관련해 경찰은 가부키초에서 무허가로 유흥주점을 운영한 혐의로 업소 관리자인 나이지리아 국적의 62세 남성과 공범 1명을 체포했다. 해당 업소 역시 바가지요금 피해 문의가 접수된 곳으로 파악됐다. 경찰은 이들에게 무허가 영업 혐의를 적용하는 한편 부당 요금 청구 의혹에 대해서도 수사를 확대하고 있다.","category":"세계"},{"title":"'젠슨 황 스캔들' 시진핑 대미외교에 악재…3자회담 앞두고 부담","link":"https://n.news.naver.com/mnews/article/001/0016445595","naverLink":"https://n.news.naver.com/mnews/article/001/0016445595","pubDate":"2026-11-17T11:00:07.637377+09:00","author":"네이버뉴스","description":"美의회 대중 강경론 힘 받아…반도체 수출규제 강화 움직임 시진핑 중국 국가주석(좌측)과 도널드 트럼프 미국 대통령(우측) [AFP=연합뉴스 자료사진. 재판매 및 DB 금지] (서울=연합뉴스) 고일환 기자 = 젠슨 황 엔비디아 전 최고경영자(CEO)의 불륜 스캔들이 시진핑 중국 국가주석의 대미 외교에 돌발 악재가 됐다고 월스트리트저널(WSJ)이 16일(현지시간) 보도했다. 젠슨 황의 사퇴를 부른 불륜 상대 앨리스 황(본명 황러)이 중국 스파이라는 의혹이 미국과 중국 사이의 외교 문제로 부상했기 때문이다. 당장 미국 의회에서는 중국에 대한 반도체 수출 규제를 강화해야 한다는 목소리가 커지고 있다. 공화·민주 양당의 일부 중진 의원들은 이번 사건을 계기로 중국이 미국에 심각한 안보 위협을 제기하고 있다면서 첨단 반도체의 대중 수출 제한을 강화할 것을 요구하고 있다. 이에 따라 최근 안정세를 보인 미·중 관계가 다시 악화할 가능성도 제기된다. 중국은 세계 희토류 공급망에 대한 지배력을 바탕으로 도널드 트럼프 행정부의 관세 공세에 대응해왔지만, 이번 스캔들은 양국 관계에 새로운 변수로 떠올랐다는 분석이다. 스파이 의혹을 계기로 대중 강경론이 공화당뿐 아니라 민주당에서도 확산할 경우 중국은 트럼프 행정부를 넘어 미국 정치권 전반의 반발에 직면할 수 있기 때문이다. 미중관계전국위원회의 세라 베런 회장은 미 의회와 민주당의 반발 가능성을 언급하면서 \"장기적으로 중국에 더 큰 부담이 될 수 있다\"고 지적했다. 중국 선전에서 열리는 아시아태평양경제협력체(APEC) 정상회의에 맞춰 준비된 미중러 3자 정상회담도 당초 계획과는 다른 분위기 속에서 열리게 됐다. 중국은 이번 회담을 통해 미국, 러시아와 어깨를 나란히 하는 글로벌 강대국 이미지를 부각하려 했지만, 젠슨 황 스캔들이 외교 무대의 초점을 흐릴 가능성이 있다는 것이다. 전문가들은 미중러 3자 정상회담의 성공이 시 주석 입장에서 국내적으로 상당히 중요한 의미를 지니고 있다고 평가하고 있다. 트럼프 대통령과 블라디미르 푸틴 러시아 대통령을 동시에 안방으로 불러들이는 모습은 시 주석의 통치 기반을 더욱 확고하게 하는 재료가 될 수 있기 때문이다. 신미국안보센터(CNAS)의 제이컵 스톡스 선임연구원은 \"시진핑은 자신이 세계 정치의 최고위 테이블에 앉아 있는 인물로 보이기를 원한다\"고 말했다. 미중러 3자 정상회담 개최와 관련한 중국의 목표를 흔드는 것은 젠슨 황 스캔들뿐만이 아니다","category":"세계"},{"title":"테슬라, 4.4조 들여 獨공장 증설…사이버캡 100만대 생산 목표","link":"https://n.news.naver.com/mnews/article/421/0009292952","naverLink":"https://n.news.naver.com/mnews/article/421/0009292952","pubDate":"2026-11-17T11:00:07.637375+09:00","author":"네이버뉴스","description":"2027년 상반기 착공·2029년 생산 개시…수백명 신규 채용 추진 獨 \"의미있는 결정\" 환영…산림 훼손 등 논란 재점화 가능성 독일 그륀하이데 지역의 테슬라 베를린-브란덴부르크 기가팩토리 전경. 2023.07.19 ⓒ 로이터=뉴스1 (서울=뉴스1) 이창규 기자 = 테슬라가 16일(현지시간) 독일 공장 증설에 30억 유로(약 4조 4000억 원)를 투자해 연간 100만 대의 '사이버캡'(Cybercab) 생산능력을 갖출 계획이라고 밝혔다. AFP 통신에 따르면, 테슬라는 이날 투자 계획을 발표하는 자리에서 이같이 밝히며 \"이번 투자는 베를린 외곽 도시인 그륀하이데에 세계에서 기술적으로 가장 앞선 테슬라 공장을 구축하기 위한 토대가 될 것\"이라고 말했다. 테슬라는 2027년 상반기에 건설을 시작해 2029년부터 생산에 들어갈 예정이라고 설명했다. 테슬라의 생산공장인 '기가팩토리'는 2022년 그륀하이데에 문을 연 후 2024년 지방 당국으로부터 공장 증설 허가를 받았다. 테슬라가 2024년 10월 공개한 사이버캡은 운전대와 페달이 없는 2인승 차량으로 미국 일부 도시에서는 테슬라의 '로보택시'(Robotaxi) 서비스에 투입됐다. 테슬라는 이번 공장 증설로 다양한 분야에서 새로운 일자리가 창출될 것이라며 이미 공장의 생산능력 확대를 위해 수백 명의 신규 인력을 모집하고 있다고 밝혔다. 현재 그륀하이데 기가팩토리에는 약 1만 1000명이 근무하고 있다. 기가팩토리가 있는 브란덴부르크주의 디트마어 보이트케 주 총리는 \"경제적으로 매우 의미가 있는 결정\"이라며 테슬라의 공장 증설을 환영했다. 이어 \"경제적으로 어려운 시기에 이번 결정은 독일이 여전히 대규모 산업 투자에 매력적인 입지라는 강력한 신호\"라고 덧붙였다. 독일 금속노조인 IG 메탈의 얀 오토 지역 본부장도 이번 공장 증설은 좋은 소식이라며 \"더 많은 일자리를 창출하고 기존 일자리를 보호할 수 있을 것\"이라고 평가했다. 그러나 기가팩토리 증설 허가를 받을 당시에도 지역 주민들이 강하게 반대했던 만큼 이번에도 주민들의 반대가 만만치 않을 것으로 보인다. 당시 주민들은 대규모 산림 벌채와 지역 교통량 증가 등을 우려해 주민투표를 통해 증설 계획에 반대했고, 결국 테슬라는 산림 벌채 면적을 줄이는 방향으로 계획을 수정했다. 환경운동가들은 공장 증설을 저지하기 위해 공장 인근 숲에 오두막을 설치하고 여러 차례 시위를 벌이기도 했다. 지난 3월에는 극좌 단체의 방화 공","category":"세계"},{"title":"“젠슨 황 감싸던 이유 있었나”…트럼프, 엔비디아 주식 최대 830억원 보유[1일1트]","link":"https://n.news.naver.com/mnews/article/016/0002724357","naverLink":"https://n.news.naver.com/mnews/article/016/0002724357","pubDate":"2026-11-17T11:00:07.637374+09:00","author":"네이버뉴스","description":"2024년 말 최대 17억원서 급증…올해 1월에도 100만달러 매입 백악관 “독립 금융관리자가 운용”…민주당, 이해충돌 조사 예고 트럼프의 한마디에 세계 경제와 금융시장이 출렁이는 시대. 쏟아지는 트럼프 뉴스를 일일이 찾아보기 벅차다면 [1일1트]가 딱입니다. 새벽 5시부터 움직이는 헤럴드경제 국제부가 미국 증시 마감 시황부터 글로벌 자산시장에 영향을 미칠 트럼프의 핵심 뉴스까지 빠르게 골라, 1분 만에 ‘쓱’ 볼 수 있도록 배달합니다. 출근길에도, 혼밥할 때도, 잠들기 전에도 딱 1분. 구독자의 ‘성공시계’가 빨라집니다! https://1day1trump.stibee.com/ 도널드 트럼프 미국 대통령(왼쪽)과 젠슨 황 엔비디아 최고경영자(CEO). [AP] [헤럴드경제=서지연 기자] 도널드 트럼프 미국 대통령이 최대 830억원에 달하는 엔비디아 주식을 보유한 것으로 나타났다. 트럼프 대통령이 젠슨 황 전 엔비디아 최고경영자(CEO)를 두둔하고 중국에 대한 첨단 인공지능(AI) 반도체 수출 규제를 완화해온 가운데, 엔비디아 주가 상승으로 막대한 평가이익을 거둔 사실이 드러나면서 이해충돌 논란이 커지고 있다. 중간선거에서 승리한 민주당이 내년 의회를 장악하면 트럼프 대통령의 주식 거래와 행정부의 대중 반도체 정책에 대한 조사가 본격화할 것이라는 전망이 나온다. 16일(현지시간) 워싱턴포스트(WP)는 공개된 트럼프 대통령의 재무자료를 분석한 결과, 올해 8월 말 기준 엔비디아 주식 보유 가치가 1300만~6200만달러(약 174억~828억원)에 달한다고 보도했다. 이는 트럼프 대통령이 집권 2기 취임을 앞둔 2024년 말 보유했던 엔비디아 주식 가치 61만5000~130만달러(약 8억2000만~17억4000만원)와 비교해 크게 늘어난 규모다. WP는 올해 9~10월 재무자료가 아직 공개되지 않은 데다 이후 엔비디아 주가가 추가로 상승했다는 점에서 실제 보유 가치는 더 높을 수 있다고 분석했다. 특히 트럼프 대통령의 엔비디아 주식 매입 시점이 주목받고 있다. 트럼프 대통령은 지난해 12월 자신의 소셜미디어 트루스소셜을 통해 엔비디아의 고성능 AI 반도체 H200을 중국에 수출하도록 허용하겠다고 밝혔다. 이어 올해 1월 14일 관련 행정명령에 서명했다. 그런데 수출 허용 방침을 공개한 이후 행정명령이 나오기 전인 1월 6일 트럼프 대통령이 최대 100만달러 상당의 엔비디아 주식을 매입한 것으로 나타났다. 자신의 정책","category":"세계"},{"title":"트럼프, 엔비디아 주식 800억원 이상 담아…수출길 열어주며 젠슨 황 감싼 것 재주목","link":"https://n.news.naver.com/mnews/article/009/0005764718","naverLink":"https://n.news.naver.com/mnews/article/009/0005764718","pubDate":"2026-11-17T11:00:07.637369+09:00","author":"네이버뉴스","description":"도널드 트럼프 미국 대통령. [뉴시스] 도널드 트럼프 미국 대통령이 거액의 엔비디아 주식을 보유한 것으로 드러났다. 백악관은 독립적인 관리인이 운용하는 자산일 뿐 이해충돌은 없다는 입장이지만, 의회에서는 불륜 논란이 불거진 젠슨 황 전 엔비디아 최고경영자(CEO)를 두둔하고 중국에 반도체칩 수출을 허용하기 직전에 주식을 추가 매입한 정황이 있다며 대대적 조사가 필요하다는 목소리가 나온다. 16일(현지시간) 워싱턴포스트(WP)가 트럼프 대통령의 재무자료를 분석한 결과애 따르면 트럼프 대통령이 보유한 엔비디아 주식의 가치는 지난 8월 말 기준으로 1300만달러(약 174억원)에서 6200만달러(약 828억원)에 달한다. 이는 트럼프 대통령이 두 번째 취임을 앞뒀던 지난 2024년 12월 말 기준 엔비디아 주식 가치 61만5000달러(약 8억2000만원)~130만달러(약 17억4000만원)와 비교해 급격하게 불어난 규모다. WP는 지난 9월부터 10월까지의 재무 자료가 아직 공개되지 않았고, 그사이 엔비디아의 주가가 더욱 상승했다는 이유로 트럼프 대통령의 보유 주식 평가액이 늘어날 수 있다고 내다봤다. 트럼프 대통령은 지난해 12월 엔비디아의 고성능 인공지능(AI) 반도체 H200의 대중국 수출을 허용하겠다고 예고하고 지난 1월 14일 행정명령에 최종 서명했다. 트럼프 대통령의 투자 담당은 지난 1월 6일 100만달러 규모의 엔비디아 주식을 사들였다. [뉴스1]","category":"세계"},{"title":"미·중·러 정상 '동상삼몽'…핵군축·이란·北놓고 입장차(종합)","link":"https://n.news.naver.com/mnews/article/277/0005843627","naverLink":"https://n.news.naver.com/mnews/article/277/0005843627","pubDate":"2026-11-17T11:00:07.637338+09:00","author":"네이버뉴스","description":"트럼프 \"핵군축·이란 등 논의할 것\" 中 \"세계평화 유지와 안정증진 논의\" 러 \"우크라 종전 논의, 성명 나올수도\" UPI연합뉴스 미국과 중국, 러시아 간 역사적인 3자 회담이 오는 19일 개최를 앞둔 가운데 회담 주요 의제가 아직 합의되지 않은 것으로 알려졌다. 전 세계 안보 핵심 사안인 핵 군축·이란전쟁·북핵 문제 등을 둘러싸고 3국 간 이해관계가 얽혀 의제 설정 자체가 쉽지 않은 것으로 알려졌다. 이번 3자 회담 이후 진행할 실무회담의 마중물 역할을 하는 것에 그칠 수 있다는 전망이 나온다. 16일(현지시간) CNBC에 따르면 미·중·러 3자 회담에서 정상들이 논의할 핵심 의제가 아직 정해지지 않았다. 미국은 핵군축과 이란전쟁, 러시아는 우크라이나 전쟁을 핵심 의제로 삼고 싶어하지만 중국은 이 같은 의제 없이 가벼운 주제만 다루고 싶어하는 상황이다. 리서치 전문업체인 에버코어ISI의 네오 왕 중국수석전략가는 \"미국은 핵군축과 중동전쟁, 러시아는 우크라이나 문제를 다루고 싶어해 서로 관심사가 크게 다르다\"며 \"반면 중국은 국제적인 부담이 생길 어떤 구체적 논의도 원치않는 상황\"이라고 지적했다. 이날 도널드 트럼프 미국 대통령은 아시아 순방길에 오르기 전 백악관에서 가진 기자회견에서 \"우리는 비핵화에 관해 이야기할 것이다. 우리 중 누구도 핵무기를 없애겠다고 말하기 어려워 까다로운 주제\"라며 \"이란에 대해서도 조금 논의할 것이며, 내가 좋아하는 주제인 우크라이나 문제도 논의할 것\"이라고 밝혔다. 이어 \"김정은 북한 국무위원장과도 만날 가능성이 있다. 그가 올지 여부는 시진핑 중국 국가주석에게 달려 있다\"고 말했다. 그러나 중국 측은 구체적인 의제에 대한 설명 없이 세계평화 유지를 위한 회담이 될 것이라고 강조했다. 마오닝 중국 외교부 대변인은 전날 언론브리핑에서 \"정상들은 세계 평화 유지와 주요 국가 간 전략적 안정 증진에 대해 심도 있는 의견을 교환할 것\"이라며 \"이 자체가 획기적 의미를 지닌다\"고 설명했다. EPA연합뉴스","category":"세계"},{"title":"미·중·러 회담, 다극화 질서 신호탄?…한국 외교 셈법 복잡해질 듯","link":"https://n.news.naver.com/mnews/article/032/0003482999","naverLink":"https://n.news.naver.com/mnews/article/032/0003482999","pubDate":"2026-11-17T11:00:07.637322+09:00","author":"네이버뉴스","description":"왼쪽부터 도널드 트럼프 미국 대통령, 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령. AP연합뉴스 오는 19일 열리는 사상 첫 미·중·러 3자 정상회담은 미국 중심의 국제 질서가 약화하고 있음을 보여주는 상징적 장면이 될 것이라는 분석이 나온다. 미국이 자국의 패권에 도전하는 중국, 러시아와 경쟁하면서도 사안에 따라 협력할 수 있다는 뜻으로 해석할 수 있어서다. 한국으로선 중·러와의 관계를 관리하면서도 미국의 대중국 견제 요구에 대응해야 하는 난제를 안게 될 수 있다는 지적이 나온다. 중국 신화통신에 따르면 중국 외교부 대변인은 16일 시진핑 중국 국가주석이 선전에서 열리는 아시아·태평양경제협력체(APEC) 정상회의를 계기로 19일 도널드 트럼프 미국 대통령, 블라디미르 푸틴 러시아 대통령과 3자 정상회담을 개최한다고 밝혔다. 구체적인 논의 의제와 회담 형식은 공개하지 않았다. 미국 백악관은 지난 13일, 러시아 크렘린궁은 14일 각각 회담 개최를 발표했다. 국내 전문가들은 세계 3대 핵보유국인 미·중·러 정상이 머리를 맞대는 것만으로도 국제사회에 던지는 메시지가 작지 않다고 평가한다. 냉전 종식 이후 유일한 패권국이었던 미국이 국제 현안을 독자적으로 해결하기 어려워진 현실을 보여준다는 것이다. 제성훈 한국외대 국제지역대학원 교수는 “이번 3자 회담은 미국이 중·러와 협력하며 세계 질서를 이끌겠다는 선언으로 보인다”며 “중·러를 대화 상대로 인정하지 않고는 세계를 운영하기가 어렵다는 게 트럼프 대통령의 인식”이라고 말했다. 미·중·러 회담의 주요 의제로는 핵 군축 협상과 미국·이란 전쟁과 러시아·우크라이나 전쟁 종전 문제가 거론된다. 우크라이나 등에서는 이번 회담이 당사국을 배제한 채 강대국들이 자국의 이해관계에 따라 세력권을 분할하는 ‘제2의 얄타 회담’이 될 수 있다는 우려가 제기된다. 얄타회담은 1945년 2월 미국·영국·소련 정상이 한반도 신탁통치 등 제2차 세계대전 전후 처리를 논의한 회담이다. 한국에서도 북·미 정상회담을 추진하려는 트럼프 대통령이 북한의 우방국인 중·러와 협의하는 과정에서 북핵을 사실상 묵인할 수 있다는 우려가 나온다. 다만 각 현안을 둘러싼 3국의 이해관계가 엇갈려 이번 회담이 국제질서를 재편하는 실질적 합의를 도출하기는 어렵다는 게 대체적인 의견이다. 민정훈 국립외교원 미주연구부 교수는 “미국 주도의 국제질서가 다극화 질서로 변화하고 있다는 것은 보여주지만, 굵직한 현안을","category":"세계"},{"title":"트럼프, 악재 뒤로하고 아시아 순방길…외교로 존재감 과시 노려","link":"https://n.news.naver.com/mnews/article/001/0016445212","naverLink":"https://n.news.naver.com/mnews/article/001/0016445212","pubDate":"2026-11-17T11:00:07.637320+09:00","author":"네이버뉴스","description":"미중러 회담 열고 북미접촉 타진…정상외교로 \"대통령은 나\" 각인 시도 해외순방, 분위기 전환 단골 메뉴…선거 참패, 젠슨황 스캔들 여전히 부담 아시아 순방길 오른 트럼프 [AP=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 홍정규 특파원 = 도널드 트럼프 미국 대통령이 16일(현지시간) 떠난 아시아 순방길은 중간선거 참패 약 2주일 만에 정치적 반전을 시도하는 의미도 담겼다. 트럼프 대통령은 필리핀과 중국을 거쳐 돌아오는 이번 순방에서 동남아시아국가연합(ASEAN)과 아시아태평양경제협력체(APEC)의 다자무대, 그리고 중국·러시아 정상과의 만남으로 세계의 이목을 끌겠다는 계획이다. 백악관에 따르면 트럼프 대통령은 순방 기간 대미 투자를 포함한 상업적 거래, 태국과의 무역협정 서명 등 경제적 성과를 발표할 예정이다. 이어 중국·러시아와의 회담에선 핵 군축을 의제로 담판할 전망이다. 특히 출발 당일 \"김정은이 (중국에) 올 수 있다\"며 자신의 중국 방문을 계기로 북미 정상이 접촉할 가능성을 거듭 시사했다. 권위주의 국가들에 대한 영향력, 국제 사회에서의 존재감을 과시하려는 의도가 담긴 것으로 보인다. 트럼프 대통령의 이같은 외교 행보는 악재가 쌓여가는 국내 상황과 무관치 않다는 해석이 나온다. 그는 저조한 지지율 속에 집권당이 '역대급 참패'를 당해 상·하원을 모두 잃으면서 궁지에 몰렸다. 선거를 전후해 터진 젠슨 황 전 엔비디아 최고경영자(CEO)의 '간첩 불륜' 스캔들은 트럼프 대통령과 하워드 러트닉 상무장관 등 각료들을 논란의 중심에 끌어들이는 또 하나의 악재가 됐다. AP 통신은 \"트럼프 대통령은 지난주 금요일(13일) 전국적인 항공기 지상 운항 중단 조치로 수천 편의 항공편이 결항한 이후 항공사들이 승객들을 비행기에 태우는 데 어려움을 겪고 있는 가운데 출국한다\"고 지적했다. 트럼프 대통령 입장에선 하나하나 골치 아픈 현안들인데, 이런 그에게 화려한 의전과 격식이 있는 순방 외교는 \"상황을 바라보는 이야기를 바꾸기 시작하고, 사람들에게 대통령은 여전히 대통령이라는 사실을 상기시키는 방법\"이라고 에드가드 케이건 전 주말레이시아 미국 대사는 말했다. 선거 패배로 약해진 정치적 입지를 다시 강화하고, 국제 무대에서 관심을 크게 끌 만한 중대한 행보를 보이려는 것은 트럼프 대통령 전임자들도 즐겨 시도했던 '단골 메뉴'다. 그 원조는 1982년 중간선거 패배 후 중남미 순방을 떠났던 로널드 레이건 전 대통령","category":"세계"},{"title":"크렘린궁 “김정은, APEC 정상회의 참석한다면 푸틴과 회담 가능”","link":"https://n.news.naver.com/mnews/article/016/0002724268","naverLink":"https://n.news.naver.com/mnews/article/016/0002724268","pubDate":"2026-11-17T11:00:07.637316+09:00","author":"네이버뉴스","description":"블라디미르 푸틴 러시아 대통령과 김정은 북한 국무위원장 [AFP] [헤럴드경제=정목희 기자] 김정은 북한 국무위원장이 중국에서 열리는 아시아태평양경제협력체(APEC) 정상회의에 참석할 경우 블라디미르 푸틴 러시아 대통령과 회담할 수 있다고 드미트리 페스코프 크렘린궁 대변인이 16일(현지시간) 밝혔다. 러시아 관영 타스통신에 따르면 페스코프 대변인은 관련 질문에 “그(김 위원장)가 APEC 정상회의에 참석한다면 물론이다”라고 답했다. 이 같은 페스코프 대변인의 발언은 이날 푸틴 대통령이 모스크바에서 김 위원장의 최측근으로 알려진 조용원 북한 노동당 중앙위원회 비서를 만난 가운데 나왔다. 푸틴 대통령은 조용원을 만나 “김정은 동지에게 가장 좋은 인사를 전하고 싶다”며 “우리가 발전시켜온 실무적이고 우호적인 관계를 매우 소중하게 생각한다”고 강조했다. 중국 선전에서 열리는 APEC 정상회의를 계기로 오는 19일 푸틴 대통령과 트럼프 대통령, 시진핑 중국 국가주석은 사상 첫 미·중·러 3자 정상회담을 할 예정이다.","category":"세계"}],"IT 과학":[{"title":"AI가 부른 노래 멜론 첫 1위…흥행 대박에도 저작권료는 ‘0원’","link":"https://n.news.naver.com/mnews/article/277/0005843511","naverLink":"https://n.news.naver.com/mnews/article/277/0005843511","pubDate":"2026-11-17T11:00:08.460334+09:00","author":"네이버뉴스","description":"인간이 작사하고 AI가 작곡 30~40대 청취자 66% 어른의 불안 담은 가사에 공감 저작권 정산 기준 공백 인공지능(AI)이 작곡하고 노래한 곡이 국내 최대 음원 플랫폼 멜론에서 처음으로 정상에 올랐다. 30~40대 청취자들이 호응하며 아이돌 그룹의 신곡까지 제쳤다. 하지만 흥행의 주역인 창작자는 저작권료를 한 푼도 받지 못하고 있다. AI가 음악 시장의 판도를 바꾸고 있지만, 창작자의 권리를 보호할 제도는 기술 발전 속도를 따라가지 못하고 있다는 지적이 나온다. 17일 가요계에 따르면 AI 음악 프로젝트 '머무르(MEOMURU)'의 '꿈꾸던 어른이 되었나요?'는 이날 오전 9시 기준 멜론 톱100 차트 1위를 기록했다. 지난 13일 오후 5시 처음 정상에 오른 뒤 나흘째 선두를 지켰다. AI를 활용해 작곡과 가창을 구현한 음악이 멜론 톱100에서 1위에 오른 것은 이번이 처음이다. 지난 6월23일 발매된 이 곡은 어린 시절 꿈꿨던 어른의 모습과 성인이 된 뒤 마주한 현실의 간극을 그린 록 발라드다. 어른이 되면 모든 일이 나아질 것이라 믿었지만, 여전히 생계 부담과 미래에 대한 불안을 안고 살아가는 현실을 노래했다. 인스타그램 릴스와 유튜브 쇼츠 등 사회관계망서비스(SNS)에서 배경음악으로 확산한 뒤 주요 음원 차트 상위권에 진입했다. 대형 팬덤의 지원 없이 리센느와 아일릿 등 아이돌 그룹의 신곡을 제쳤다. 흥행을 이끈 것은 30~40대 청취자다. 멜론 청취자 연령별 비중은 30대가 36%로 가장 높았고 40대 30%, 20대 19%, 50대 11% 순이었다. 30~40대가 전체의 66%를 차지했다. '꿈꾸던 어른이 되었나요. 어릴 적 몰랐던 고민들이 하나둘씩 어깨에 조용히 내려앉아 나를 짓누르네요'라는 가사가 직장과 생계, 미래에 대한 고민을 안고 살아가는 세대의 공감을 얻은 것으로 풀이된다. 머무르는 실제 가수가 아닌 AI 음악 프로젝트다. 작곡가 겸 프로듀서 이용석(마틴 이스트)과 최성혁(비트자루)으로 구성된 프로듀싱팀 '글로리웨이브'가 기획했다. 두 사람은 황치열과 길구봉구, 김준수 등의 발라드 제작에 참여한 경력이 있다. 제작 과정에서는 인간과 AI가 역할을 나눴다. 글로리웨이브가 가사와 곡의 전반적인 방향을 정하고, 음악 생성 AI '수노(SUNO)'를 활용해 멜로디와 편곡, 보컬을 구현했다. AI가 생성한 여러 결과물을 비교한 뒤 음악 제작 프로그램 '큐베이스'에서 곡의 구성과 멜로디, 코드 진","category":"IT 과학"},{"title":"룬드벡, 에이프릴바이오 ‘APB-A1’ 개발 카드 유지…기술반환 우려 완화","link":"https://n.news.naver.com/mnews/article/018/0006410816","naverLink":"https://n.news.naver.com/mnews/article/018/0006410816","pubDate":"2026-11-17T11:00:08.054248+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월16일 07시40분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. [이데일리 김새미 기자] 덴마크 제약사 룬드벡이 에이프릴바이오(397030)로부터 기술도입한 신약후보물질 ‘APB-A1’(Lu AG22515)의 다중 적응증 확장 가능성을 재차 강조했다. 앞서 갑상선안병증(TED) 임상 이슈로 기술반환 우려가 제기됐지만 룬드벡이 3분기 기업설명(IR) 자료에서도 APB-A1을 개발 파이프라인에 유지하면서 우려가 완화되는 분위기다. 룬드벡이 올해 3분기에도 ‘APB-A1’(Lu AG22515)을 개발 파이프라인으로 유지하고 있다. (자료=룬드벡) TED 임상 중단 3개월…룬드벡 ‘APB-A1’ 파이프라인 유지 12일 바이오업계에 따르면 룬드벡은 지난 11일 3분기 실적 발표 IR 자료를 통해 APB-A1을 여전히 개발 파이프라인으로 유지하고 있다는 것을 드러냈다. 룬드벡은 APB-A1의 경쟁력으로 △차별화된 작용기전(Unique mode of action) △작용기전 확인(Confirmed proof of mechanism) △강력한 바이오마커(Strong biomarkers) △다중 적응증 확장 가능성(Multiple potential indications)을 제시했다. 특히 CD40리간드(CD40L) 차단 기전이 다양한 신경면역질환에 적용될 가능성에 주목했다. 다발성경화증(MS), 시신경척수염(NMO), 중증근무력증(MG) 등이 잠재적인 개발 영역으로 거론됐다. 이들 질환은 면역체계 이상으로 신경계에 손상이 발생하는 질환이다. 단 이번 자료는 지난 8월 공개한 2분기 IR 자료와 크게 차이나는 것은 아니며, 후속 적응증이나 임상개발 일정이 새롭게 확정된 것도 아니다. 그럼에도 TED 임상 결과 발표 이후 약 3개월이 지난 시점까지 APB-A1이 룬드벡의 공식 개발 파이프라인에 남아 있다는 점에서 의미가 있다는 평가다. 에이프릴바이오 관계자는 “후속 적응증이 아직 확정되지는 않았지만 만약 기술반환이 결정됐다면 해당 장표가 없어졌을 것”이라며 “적응증을 발표하지 않았더라도 아직 개발이 중단된 것은 아니라는 의미”라고 강조했다. TED 효능 기대 못 미쳤지만…새 적응증 탐색 중 APB-A1은 에이프릴바이오가 자체 개발한 지속형 바이오의약품 플랫폼 ‘사파’(SAFA)를 적용한 CD40L 차단제다. 에이프릴바이오는 2021년 룬드벡에 계약금 1600만달러(약 190억원)를 포함해 최대 4억","category":"IT 과학"},{"title":"연매출 10억 달러 찍은 퍼플렉시티의 비결...“좋은 AI 모델들 섞어 썼을 뿐”","link":"https://n.news.naver.com/mnews/article/009/0005764663","naverLink":"https://n.news.naver.com/mnews/article/009/0005764663","pubDate":"2026-11-17T11:00:08.054244+09:00","author":"네이버뉴스","description":"“앤스로픽의 5분의 1 비용으로 달성” 자체 AI로 검색 90% 처리…비용 절감 유료 이용자 매출총이익률 56% 기록 “젠슨 황은 위대한 창업자…복귀는 이사회 몫” 아라빈드 스리니바스 퍼플렉시티 최고경영자(CEO)는 16일(현지시간) 미국 캘리포니아주 멘로파크의 로즈우드 샌드힐에서 열린 세마포 주최 ‘실리콘밸리 앤드 더 월드’ 행사에서 인터뷰하고 있다. [사진=세마포] 인공지능(AI) 검색 기업 퍼플렉시티의 연 환산 매출이 10억달러를 돌파했다. 챗GPT 개발사 오픈AI와 앤스로픽처럼 대규모 데이터센터를 직접 구축하는 대신 여러 AI 모델을 활용하는 전략으로 비용을 줄인 결과다. 아라빈드 스리니바스 퍼플렉시티 최고경영자(CEO)는 16일(현지시간) 미국 캘리포니아주 멘로파크의 로즈우드 샌드힐에서 열린 세마포 주최 ‘실리콘밸리 앤드 더 월드’ 행사에서 “오늘 연 환산 매출이 10억달러를 넘어섰다”고 밝혔다. 연 환산 매출은 최근 매출 발생 속도가 1년간 유지된다고 가정해 계산한 수치다. 퍼플렉시티의 연 환산 매출은 올해 초 2억5000만달러 미만에서 지난 8월 7억5000만달러 이상으로 늘어난 데 이어 이번에 10억달러를 넘어섰다. AI 검색에서 복잡한 업무까지 수행하는 AI 에이전트로 사업을 확장한 것이 성장에 기여했다. 스리니바스 CEO는 특히 적은 자금으로 매출을 늘렸다는 점을 강조했다. 그는 “연 환산 매출 10억달러에 도달하기까지 소진한 현금이 이번 주 기업공개(IPO)를 앞둔 회사의 5분의 1 수준”이라고 말했다. 회사 이름을 직접 밝히지는 않았지만 이번 주 상장하는 앤스로픽을 가리킨 것으로 해석된다. 그는 “우리는 자본을 훨씬 효율적으로 활용하는 기업”이라며 “사용자들은 어떤 AI 모델을 쓰는지, 얼마나 많은 토큰을 처리하는지에 관심이 없다. 자신이 원하는 일이 실제로 처리됐는지가 중요하다”고 설명했다. 퍼플렉시티는 다른 AI 기업처럼 수조달러 규모의 컴퓨팅 자원 확보를 약속하지 않았다는 점도 강조했다. 스리니바스 CEO는 “우리도 상당한 규모의 GPU 클러스터를 보유하고 있지만 막대한 투자금을 회수해야 하는 부담은 없다”고 말했다. 자체 AI 모델과 외부 모델을 함께 사용하면서 필요한 연산 자원을 효율적으로 배분하는 전략이다. 비용 절감 효과도 구체적으로 공개했다. 스리니바스 CEO는 “현재 빠른 검색 트래픽의 80~90%를 자체 개발한 AI 모델로 처리한 news/article/015/0005354616","naverLink":"https://n.news.naver.com/mnews/article/015/0005354616","pubDate":"2026-11-17T11:00:08.054237+09:00","author":"네이버뉴스","description":"온코닉테라퓨틱스가 미국 워싱턴 D.C.에서 열린 미국 비만학회 연례학술대회 ‘ObesityWeek 2026’에서 세마글루타이드와 근육대사질환 신약후보물질로 개발 중인 ‘OCN-501’의 병용 비임상 연구결과를 구두발표했다고 17일 밝혔다. 특히 이번 연구는 최신 주요 연구성과를 소개하는 ‘Late-Breaking Abstract’에 채택돼 ‘Emerging Obesity Therapies and Clinical Outcomes’ 세션에서 발표됐다. ‘OCN-501’은 온코닉테라퓨틱스가 근육의 에너지 대사 항상성 유지와 근육 단백질 분해 신호 완화를 목표로 개발 중인 경구용 저분자 신약 후보물질이다. 이번 연구에서는 세마글루타이드 단독 투여와 유사한 체중감량 효과를 보이면서도 근육량·근력 개선과 지방조직의 추가 감소가 확인됐다는 게 온코닉테라퓨틱스의 설명이다. 연구진은 고지방식이(HFD) 비만 생쥐군을 대상으로 세마글루타이드 단독군(피하주사)과 세마글루타이드(피하주사)·OCN-501(경구 투여) 병용군을 비교했다. 연구 결과 체중감량률은 각각 13.1%, 15.3%로 병용군에서 수치적으로 높았으나 통계적으로 유의한 차이는 없었다. 먹이 섭취량 감소도 유사해 두 군에서 비슷한 수준의 체중감량 효과가 관찰됐다. 온코닉테라퓨틱스에 따르면 지방조직 분석에서는 피하지방에 해당하는 서혜부 백색지방조직(iWAT)과 내장지방의 실험적 지표인 부고환 백색지방조직(eWAT) 모두 병용군에서 세마글루타이드 단독군 대비 통계적으로 유의하게 감소했다. 근육량과 근력 평가에서도 병용 효과가 확인됐다. 세마글루타이드 단독군은 체중감량과 함께 종아리 골격근인 비복근(gastrocnemius) 질량이 감소했으나, OCN-501 병용군에서는 근육량이 개선됐다. 연구 결과, 근육 기능을 평가하는 악력(Grip Strength) 검사에서도 단독군은 근력이 감소한 반면, 병용군은 근력 저하가 유의하게 억제됐다. 병용군의 악력은 체중 보정 악력에서도 유사한 개선 양상이 확인됐다. 조직학적 분석에서도 근육보존 가능성이 확인됐다. 세마글루타이드 단독군에서 감소한 근섬유 면적률과 평균 근섬유 단면적(CSA)은 병용군에서 정상식이군 수준에 가깝게 개선되는 양상을 보였다. 온코닉테라퓨틱스는 \"실제 조직사진에서도 병용군의 근섬유 크기와 형태가 더 잘 유지돼 근섬유 위축 완화 및 골격근 구조 보존 가능성을 뒷받침했다\"고 설명했다. 위고비·마운자로 등 인크레틴 기반","category":"IT 과학"},{"title":"보이저 1호 ‘위대한 비행’… 49년간 259억㎞ 날아 ‘가장 먼 우주’로[10문10답]","link":"https://n.news.naver.com/mnews/article/021/0002833295","naverLink":"https://n.news.naver.com/mnews/article/021/0002833295","pubDate":"2026-11-17T11:00:08.054236+09:00","author":"네이버뉴스","description":"■ 10문10답 - 빛으로 하루 거리 ‘1광일 도달’ 대기록 지구-태양간 거리 173배 달해 전파 주고받기만 왕복 48시간 목성 고리·이오 활화산 확인 토성 위성 타이탄 대기 관측 현재 가동중인 과학장비 2종 2036년 전력고갈 통신 끊겨 골든 레코드 싣고 항해 계속 오늘 일몰후 ‘모스부호’ 행사 오는 18일(한국시간 오후 7시 16분 7초 예정) 나사(미 항공우주국) 제트추진연구소(JPL)가 관리하는 우주탐사선 보이저 1호가 인류사에 길이 남을 대기록을 작성한다. 눈에 보이지 않는 우주쇼라고도 할만한 이번 이벤트는 인류가 만든 피조물이 지구, 태양계로부터 가장 먼 곳에 도달하며 처음으로 ‘1광일’(빛이 24시간 동안 이동하는 거리)에 도달하는 것이다. 이미 발사 후 49년여를 홀로 우주에서 항해하고 있는 보이저 1호는 이번 대기록 이후 2030년대쯤 수명이 다해 모든 장비의 작동이 멈추더라도 현재의 속도를 유지하며 우주 밖으로 계속 이동해 외계를 향한 지구의 메신저 역할을 계속할 예정이다. 1. 보이저 1호, 발사 시기와 목적은? 보이저 1호의 개발 및 발사는 175년마다 한 번 찾아오는 행성들의 특수한 정렬 현상을 활용해 태양계 외행성들을 단 한 번의 비행으로 탐사하려던 ‘그랜드 투어’(Grand Tour) 계획에서 비롯됐다. 1970년대 후반은 목성·토성·천왕성·해왕성이 한쪽 방향으로 완만하게 일렬로 배열되는 희귀한 시기였기 때문에 태양계 내의 거대 행성들을 연달아 탐사할 수 있었다. 다만 나사는 4대의 탐사선으로 4개 외행성을 모두 도는 대규모 ‘그랜드 투어’를 구상했으나, 예산 삭감으로 인해 목성과 토성 탐사에 집중하는 2대 체제(초기 명칭 ‘매리너 목성-토성 탐사선’)로 계획을 수정하고 1977년 9월 5일 보이저 1호를 발사했다. 쌍둥이 탐사선인 보이저 2호는 1호에 앞서 같은 해 8월 20일 발사됐다. 2. 행성정렬에 맞춰 1977년 발사한 이유 행성이 완만하게 일렬로 배열되는 현상이 일어나면 이들 행성의 중력을 이용해 우주선의 속도를 높이고 궤도를 꺾는 ‘중력 도움’(스윙바이·Gravity Assist) 항법으로 연료를 획기적으로 아끼면서 거대 행성들을 연달아 탐사할 수 있었다. 로켓에 연료를 많이 실을수록 기체가 무거워져 더 많은 연료가 필요한 악순환(치올콥스키 로켓 방정식의 한계)이 발생하는데 중력 도움 항법으로 이를 극복할 수 있게 되는 것이다. 따라서 중력 도움을 쓰면 추진제를 획기적으로","category":"IT 과학"},{"title":"인공지능 생성 얼굴을 가려내는 6가지 기준","link":"https://n.news.naver.com/mnews/article/028/0002832525","naverLink":"https://n.news.naver.com/mnews/article/028/0002832525","pubDate":"2026-11-17T11:00:08.054235+09:00","author":"네이버뉴스","description":"곽노필의 미래창 대칭·비례·매력 좋지만 표정·개성·기억 낮아 훈련 뒤 정답 맞히는 비율 40→80% 껑충 인공지능 생성 얼굴과 실제 사람 얼굴을 판별하는 6가지 기준으로 훈련한 결과, 판별 정확도가 2배로 높아졌다. 사진은 실험에 쓰인 이미지의 일부다. PNAS 얼마 전까지만 해도 인공지능(AI)은 사람의 얼굴 특징을 학습하는 데 매진해야 했다. 방대한 얼굴 사진 자료 속에서 사람의 얼굴 특징을 찾아내기 위해서다. 이제는 입장이 정반대가 됐다. 인공지능이 만들어낸 얼굴을 사람이 가려내야 하는 처지가 됐다. 그 사이에 인공지능의 기술이 너무나 발전해서 아무리 눈썰미 좋은 사람이라도 실제 사람 얼굴 사진과 인공지능이 만든 이미지를 구분하기 어려워졌기 때문이다. 지난 7월 국제학술지 ‘저널 오브 비전’에 발표된 연구에 따르면 실험 참가자들은 실제 사람 얼굴보다 인공지능 생성 얼굴에 더 믿음이 간다는 반응을 보일 정도다. 실제 사람 사진과 구별하기 어려운 점을 악용한 범죄에 대한 우려가 높아질 수밖에 없는 이유다. 오스트레일리아국립대가 중심이 된 국제연구진이 인공지능이 만든 얼굴을 가려낼 수 있는 훈련 방법을 개발해 미국립과학원회보(PNAS)에 발표했다. 이전엔 '틀린 그림 찾기'와 비슷한 방식으로 인공지능 생성 얼굴을 가려내는 방법이 많이 쓰였다. 짝짝이 귀걸이, 어색한 귀, 눈동자가 둘인 눈처럼 얼굴 사진에서 ‘결함’을 찾아내는 식이다. 하지만 연구진이 살펴본 기존 연구들에서는 이 방법이 효과가 없거나 정답률이 약간 오르는 데 그쳤다. 출처=PNAS","category":"IT 과학"},{"title":"구글 \"AI가 사람없이 공격코드 개발\"…해킹시간 더 빨라진다","link":"https://n.news.naver.com/mnews/article/014/0005605332","naverLink":"https://n.news.naver.com/mnews/article/014/0005605332","pubDate":"2026-11-17T11:00:08.054231+09:00","author":"네이버뉴스","description":"중국 LLM재킹 광고 화면. 구글클라우드 제공 [파이낸셜뉴스] 인공지능(AI)이 사람의 개입 없이 소프트웨어의 보안 취약점을 찾아 공격 코드까지 제작하는 사례가 확인됐다. 해커가 AI에 명령을 내리는 수준을 넘어 AI 에이전트가 취약점 분석과 공격 준비를 자동으로 수행하는 단계로 진화한 것이다. 사이버 공격에 필요한 시간과 인력이 줄어들면서 기업들이 보안 취약점을 수정하고 공격에 대응할 수 있는 시간이 더 짧아질 것이란 우려가 나온다. 17일 구글 위협 인텔리전스 그룹(GTIG)이 발표한 최신 'AI 위협 추적 보고서'에 따르면 사이버 공격자들이 자율형 AI 에이전트를 활용해 취약점 탐색과 공격 코드 제작 등 기존에 사람이 수행하던 작업을 자동화하는 사례가 나타나고 있다. 특히 GTIG는 사람의 개입 없이 소프트웨어의 취약점을 분석하고 공격 코드를 개발하는 AI 프레임워크를 처음으로 확인했다. 이번에 발견된 'exploit_agent'는 여러 거대언어모델(LLM)을 활용하는 자동화 프레임워크다. 소프트웨어의 보안 패치 적용 전후 코드를 비교해 취약점을 식별하고, 이를 악용할 수 있는 공격 코드를 작성·실행하도록 설계됐다. 기존에는 해커가 보안 패치 내용을 분석해 취약점을 찾아내고 공격 코드를 직접 작성해야 했다. 하지만 AI 에이전트가 이 과정을 자동화하면서 공격 준비에 필요한 시간을 크게 단축할 수 있게 됐다. 구글은 특히 보안 패치가 이미 공개됐지만 기업이나 이용자가 아직 적용하지 않은 '엔데이(N-day)' 취약점이 주요 공격 대상이 될 수 있다고 경고했다. AI가 패치 전후의 코드 차이를 분석해 수정된 취약점을 찾아낼 수 있기 때문이다. 공격자들이 여러 AI 에이전트를 함께 활용하는 움직임도 포착됐다. GTIG는 '아르텍스(ARTEX)', '케언(CAIRN)', '사이버스트라이크AI(CyberStrikeAI)', '펜트AGI(PentAGI)' 등 자율형 공격 프레임워크가 실제 사이버 위협 활동에 활용되고 있다고 분석했다. 이들 도구는 취약점 탐색과 공격 코드 생성, 공격 결과 분석 등을 자동화해 여러 단계로 이뤄진 침투 작업을 빠르게 수행하도록 지원한다. 실제로 미국 항공우주 산업을 겨냥한 침투 활동에서는 케언을 활용한 사례가 확인됐다. 국가 연계 해킹 조직의 AI 활용도 고도화되고 있다. 구글에 따르면 중국 연계 사이버 첩보 조직들은 LLM을 활용해 표적을 조사하고 탈취한 데이터를 분석·가공해 정보 보","category":"IT 과학"},{"title":"오래 써도 성능 안 떨어지는 배터리, 어디 없소 [지금은 과학]","link":"https://n.news.naver.com/mnews/article/031/0001075614","naverLink":"https://n.news.naver.com/mnews/article/031/0001075614","pubDate":"2026-11-17T11:00:08.054216+09:00","author":"네이버뉴스","description":"KAIST 연구팀, 수명 줄이는 원인 찾고 대안 제시 배터리는 우리 일상에 늘 있다. 전기차가 확대되면서 더 그렇다. 재생에너지를 저장하는 ESS(에너지저장장치)도 마찬가지이다. 배터리가 기본이다. 배터리 성능을 높이기 위해 첨가제를 사용하는 게 상식이다. 첨가제 ‘궁합’이 맞지 않으면 오히려 수명을 줄일 수 있다는 분석 결과가 나왔다. ‘좋은 약+ 좋은 약’이 ‘최상의 약’은 아니라는 거다. 배터리를 오래 써도 충전 용량이 잘 유지되는 새로운 방법이 제시됐다. 한국과학기술원(KAIST) 연구팀이 첨가제를 함께 쓸 때 배터리 내부를 보호하는 막이 제대로 만들어지지 않는 원인을 알아냈다. 이를 개선할 새 첨가제도 제시했다. 오래 써도 충전 용량이 잘 유지되는 전기차 배터리 개발에 도움이 될 것으로 보인다. 국내 연구팀이 배터리 수명을 줄이는 원인을 찾아내고 대안을 제시했다. [사진=KAIST] KAIST(총장 배충식) 생명화학공학과 최남순 교수 연구팀이 신소재공학과 서동화 교수 연구팀과 공동으로 고에너지 리튬이온 배터리에서 기존 전해액 첨가제들이 일으키는 부작용을 규명하고 배터리의 수명과 안정성을 높이는 새로운 첨가제를 내놓았다. 전기차 배터리는 많은 에너지를 저장하는 것만큼 충전과 방전을 반복해도 성능을 오래 유지하는 게 중요하다. 처음에는 충분한 거리를 달리던 전기차도 배터리 용량이 줄어들면 한 번 충전으로 갈 수 있는 거리가 짧아진다. 높은 온도에서는 배터리 내부의 불필요한 화학 반응이 활발해져 성능이 떨어진다. 이를 줄이는 데 중요한 역할을 하는 것이 ‘전해액 첨가제’다. 전해액은 배터리 안에서 리튬이온이 양극과 음극 사이를 오가도록 돕는 물질이다. 양극과 음극은 배터리의 두 ‘전극’이다. 충전과 방전 과정에서 리튬이온을 주고받으며 에너지를 저장하고 꺼내 쓰는 역할을 한다. 전해액에 소량 넣는 첨가제는 이 전극 표면에 얇은 보호막을 만들어 불필요한 화학 반응을 줄인다. 이 보호막은 실리콘을 포함한 음극에서 특히 중요하다. 실리콘은 많은 리튬을 저장할 수 있는데 충전과 방전 과정에서 부피가 크게 변한다. 이때 표면의 보호막이 손상되면 전해액이 다시 분해되고, 보호막을 만드는 데 리튬이 계속 소모된다. 결국 충전에 쓸 수 있는 리튬이 줄어 배터리 용량이 감소한다. 부피 변화에도 보호 기능을 유지할 수 있는 안정적 막이 필요하다. 연구팀은 기존 배터리 첨가제인 ‘리튬 비스(옥살라토) 보레이트(LiBOB)’와 ‘","category":"IT 과학"}]},"popular":[{"title":"백두산 오른 김정은…흰색 패딩 주애는 스키 '씽씽'","link":"https://n.news.naver.com/article/057/0001978514?ntype=RANKING","pubDate":"2026-11-17T11:00:11.552622+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"\"저도 AI로 의대 갔습니다\"…경찰, '온라인 자백글' 추적","link":"https://n.news.naver.com/article/057/0001978413?ntype=RANKING","pubDate":"2026-11-17T11:00:11.552648+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"트럼프 \"앨리스 황, 아름다운 여인…중국 스파이 아닐 수도\"","link":"https://n.news.naver.com/article/057/0001978499?ntype=RANKING","pubDate":"2026-11-17T11:00:11.552654+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":3},{"title":"충남 부여 재배단지 덮친 '토마토 에이즈'…전국 확산 비상","link":"https://n.news.naver.com/article/057/0001978505?ntype=RANKING","pubDate":"2026-11-17T11:00:11.552658+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수  안전점검을 실시했다. 김태승 코레일 사장(가운데)이 고양 KTX차량기지에서 고속열차 유지보수 현장을 점검하고 있다.","category":"사건 사고"},{"title":"父 면허증으로 택시운전 자격증 취득한 10대…운행 첫날 사고로 '들통'","link":"https://n.news.naver.com/mnews/article/015/0005354536","naverLink":"https://n.news.naver.com/mnews/article/015/0005354536","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"사진=게티이미지뱅크 아버지 이름으로 택시 운전 자격을 취득한 10대가 운행 첫날 교통사고로 명의도용 사실이 들통났다. 16일 연합뉴스는 여수경찰서가 공문서 부정행사, 위계에 의한 업무방해 혐의로 A씨(19)를 입건해 조사 중이라고 보도했다. 보도에 따르면 A씨는 지난 7일 오전 11시 50분께 전남 여수시 문수동 도로에서 손님을 태우고 택시를 운전하다가 다른 승용차와 충돌했다. 택시운전 자격을 취득하고 택시를 운행한 첫날 발생한 사고였다. 경찰 조사과정에서 A씨는 자신의 이름과 생년월일을 댔다가 택시 운전 자격증과 인적 사항이 다른 사실이 발각됐고, 교통안전공단에서 아버지의 면허증을 이용해 시험을 치르고 자격증을 취득했으며 택시 회사에 취업까지 한 것으로 확인됐다. 택시 운전 자격시험은 만 18세 이상에 운전면허를 보유하고 운전경력 1년 이상인 경우 응시할 수 있다. 면허증은 취득했지만, 운전경력이 모자랐던 A씨는 아버지 명의로 자격시험을 치른 것으로 경찰은 보고 있다. 10대 아들이 50대 아버지 행세를 했는데도 자격 시험장에서는 물론 채용 때도 신원 확인 절차에서 걸러내지 못했다고 연합뉴스는 전했다. 교통안전공단은 연합뉴스에 \"A씨의 택시 운전 자격을 취소하고 시험 관리를 강화하겠다\"는 입장을 전했다.","category":"사건 사고"},{"title":"실탄 3발 쏘고 경찰차까지 충돌…경찰관 6명 다친 검거 작전","link":"https://n.news.naver.com/mnews/article/053/0000063097","naverLink":"https://n.news.naver.com/mnews/article/053/0000063097","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"미성년자 성폭행 혐의 20대, 경찰 포위 뚫고 7㎞ 도주 끝 검거 양주경찰서 전경. photo 경기북부경찰청 제공 미성년자 성폭행 혐의를 받는 20대 남성이 경찰의 검거를 피해 차량으로 약 7㎞를 도주하다 붙잡혔다. 경찰은 차량을 들이받아 멈춰 세운 뒤 추가 도주를 막기 위해 실탄 3발을 발사했다. 검거 과정에서 경찰관 6명이 다치고 경찰 차량도 파손됐다. 16일 경기 양주경찰서에 따르면 경찰은 지난 12일 미성년자 성폭행 혐의를 받는 20대 남성 A씨에 대한 신고를 접수하고 행방을 추적해왔다. 경찰은 이날 오후 3시 10분쯤 양주시 광적면 벨라시티 인근에서 잠복근무를 하던 중 A씨를 발견하고 검거에 나섰다. 형사들은 차량 2대로 A씨가 탄 승용차의 앞뒤를 막아섰지만, A씨는 하차 요구에 응하지 않고 인도 쪽으로 빠져나가 달아났다. 경찰은 즉시 추격에 나섰고, 지원 요청을 받은 인근 순찰차들도 합류했다. A씨는 광적면 벨라시티 인근에서 남면 농협 인근까지 약 7㎞를 도주한 것으로 전해졌다. 추격 끝에 경찰은 차량으로 A씨의 승용차를 정면에서 들이받아 멈춰 세웠다. 이 과정에서 경찰관 6명이 손과 얼굴 등을 다쳐 병원에서 치료를 받았으며, 경찰 차량도 파손됐다. 경찰은 차량이 멈춘 뒤에도 A씨가 다시 달아날 가능성이 있다고 판단해 승용차 뒷바퀴를 향해 실탄 3발을 발사했다. 경찰 관계자는 \"수사팀 차량이 피의자 차량 앞쪽을 막고 있었고, 또다시 도주할 우려가 있어 차량 뒷바퀴에 실탄 세 발을 발사했다\"고 설명했다. 경찰은 A씨를 상대로 성폭행 혐의와 도주 과정 등 구체적인 사건 경위를 조사하고 있다. ※주간조선 온라인 기사입니다.","category":"사건 사고"},{"title":"10대 아들, 50대 부친 면허증으로 택시운전 자격증 취득…교통사고로 들통","link":"https://n.news.naver.com/mnews/article/029/0003059489","naverLink":"https://n.news.naver.com/mnews/article/029/0003059489","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"50대 부친의 이름으로 택시운전 자격증을 취득한 10대 아들이 운행 첫날 교통사고를 내면서 명의 도용 사실이 들통났다. [AI가 생성한 이미지] 아버지의 이름으로 택시 운전 자격을 취득한 10대가 운행 첫날 교통사고로 명의도용 사실이 들통났다. 10대 아들이 50대 아버지 행세를 했는데도 자격 시험장에서도, 채용 과정에서도 이를 걸러내지 못한 것이다. 16일 연합뉴스에 따르면 여수경찰서는 지난 7일 오전 11시 50분쯤 전남광주 여수시 문수동 도로에서 손님을 태우고 택시를 운전하다 다른 승용차와 충돌한 A(19)씨를 공문서 부정행사, 위계에 의한 업무방해 혐의로 입건해 조사 중이다. 운전 자격을 취득한 A씨가 택시를 운행한 첫날 발생한 사고였는데, 경찰 조사과정에서 자신의 이름과 생년월일을 댔다가 택시 운전 자격증과 인적 사항이 다른 사실이 들통났다. 알고보니 A씨는 교통안전공단에서 아버지의 면허증을 이용해 시험을 치르고 자격증을 취득했으며, 택시 회사에 취업까지 한 사실이 드러난 것이다. 택시 운전 자격시험은 만 18세 이상에 운전면허를 보유하고 운전경력 1년 이상인 경우에 응시할 수 있다. A씨는 면허증을 취득했지만, 운전경력이 모자라 아버지 명의로 자격시험을 치른 것으로 경찰은 보고 있다. 교통안전공단은 A씨의 택시 운전 자격을 취소한다는 방침이다.","category":"사건 사고"},{"title":"치매 노인 집에 40대 아들 숨진 채 발견…70대 모친은 실종","link":"https://n.news.naver.com/mnews/article/001/0016445397","naverLink":"https://n.news.naver.com/mnews/article/001/0016445397","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"(파주=연합뉴스) 심민규 기자 = 치매를 앓는 노부모와 함께 살던 40대 남성이 자택에서 숨진 채 발견돼 경찰이 수사 중이다. 사건 현장·과학 수사 (PG) [제작 최자윤] 사진합성, 일러스트 17일 경찰 등에 따르면 16일 오후 5시 30분께 파주시 아동동의 한 아파트 경비실로부터 집에 들어가지 못하는 80대 남성 A씨를 보호하고 있다는 신고가 접수됐다. 출동한 경찰은 A씨의 주거지를 확인하고 귀가를 도우려 했으나 현관문 비밀번호를 알 수 없어 소방 당국에 협조를 요청했다. 소방대원들이 베란다를 통해 집 안으로 들어갔고 오후 8시께 내부에서 A씨의 아들 40대 남성 B씨가 숨진 채 발견됐다. 발견 당시 시신은 부패가 진행된 상태였다. B씨는 치매를 앓는 A씨와 70대 어머니 C씨와 함께 거주해온 것으로 전해졌다. 그러나 어머니 C씨는 집에 없었고 연락도 닿지 않아 현재 경찰 실종수사팀이 행방을 찾고 있다. 경찰은 모든 가능성을 열어두고 B씨의 사망 경위와 범죄 관련성 등을 조사하고 있다. wildboar@yna.co.kr","category":"사건 사고"},{"title":"안산 '알바생 성폭행' 사건 담당 경찰관 2명 직권경고‥징계는 피해","link":"https://n.news.naver.com/mnews/article/214/0001535966","naverLink":"https://n.news.naver.com/mnews/article/214/0001535966","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"업주의 성폭행 가해를 신고한 10대 여성이 경찰의 혐의없음 결정으로 스스로 목숨을 끊은 사건과 관련해, 당시 수사를 담당했던 경찰관 2명이 정식 징계가 아닌 '직권경고' 처분을 받은 것으로 나타났습니다. 경기남부경찰청은 오늘 해당 사건을 수사했던 당시 안산단원경찰서 수사팀장과 수사관 등 2명에게 직권경고 처분을 내렸다고 밝혔습니다. 직권경고는 징계위원회 심의·의결을 거치지 않고 시도경찰청장이 내리는 인사상 조치로, 정식 징계보다 수위가 낮습니다. 경찰 관계자는 \"여러 사정 등을 종합적으로 고려해 처분을 내렸다\"면서도 구체적인 사유에 대해선 말을 아꼈습니다. 앞서 안산단원경찰서는 지난해 12월, 자신이 일하던 주점의 40대 업주에게 성폭행당했다는 10대 아르바이트생의 고소장을 접수해 수사에 나섰으나 증거 불충분 등을 이유로 올해 2월 무혐의 처분을 내렸습니다. 피해자는 불송치 통보를 받은 지 사흘 뒤 억울함을 호소하며 스스로 목숨을 끊었습니다. 이후 검찰의 보완수사 요구로 지난 4월 재조사에 나선 경찰은 '피해 진술 조서 내용이 사실과 다른 것이 명백하다'는 이유 등을 들어 기존 판단과 같이 무혐의 결정을 내렸습니다. 반면 사건을 넘겨받은 공소청은 CCTV 영상 재분석과 휴대전화 포렌식, 의료 자문 등 보완수사를 거쳐 지난달 업주를 준강간 혐의로 재판에 넘겼습니다.","category":"사건 사고"},{"title":"거센 풍랑 속 삼척 앞바다서 화물선 표류…해경, 선원 16명 전원 구조","link":"https://n.news.naver.com/mnews/article/014/0005605175","naverLink":"https://n.news.naver.com/mnews/article/014/0005605175","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"16일 강원 삼척 덕산항 인근에서 기관 고장으로 표류중인 대형 화물선에 동해해경이 예인줄을 전달하기 위해 구명줄발사기를 사용하고 있다. /사진=동해해경 [파이낸셜뉴스] 풍랑주의보가 발효된 강원 삼척 앞바다에서 기관 고장으로 표류하던 대형 화물선의 선원 16명이 해양경찰에 의해 전원 무사히 구조됐다. 16일 동해해양경찰서에 따르면 이날 오전 10시 22분께 삼척시 덕산항 동쪽 약 3.7km 해상에서 4881t(톤)급 시멘트 운반선 A호가 기관 고장으로 해안 쪽으로 떠밀려 가고 있다는 신고가 동해해상관제센터를 통해 접수됐다. 사고 당시 동해 중부 앞바다에는 풍랑주의보가 내려진 가운데 최대 초속 16m의 강풍과 4m 높이의 거센 파도가 일고 있었다. 신고를 접수한 해경은 즉시 대형 경비함정 2척을 현장으로 급파했다. 기상 악화로 민간 예인선의 지원이 불가능한 상황에서 현장에 도착한 3018함은 강풍과 높은 파도를 뚫고 오전 11시 52분께 해안에서 불과 2.7km 떨어진 지점까지 밀려난 화물선에 직접 예인줄을 연결하는 데 성공했다. 이후 해경은 화물선을 동해항 인근 해상까지 예인한 뒤 같은 날 밤 9시15분께 민간 예인선에 인계해 동해항으로 안전하게 입항 조치했다. 예인 작업이 진행되는 동안 다른 대형 함정 1척은 인근에서 만일의 돌발 상황에 대비했다. 화물선에 타고 있던 선원 16명 모두 건강에 이상이 없는 것으로 확인됐으며, 우려됐던 해양 오염이나 물적 피해도 발생하지 않았다. 한동수 동해해양경찰서장은 \"기상 악화로 민간 예인선 지원이 불가한 상태에서 해경의 신속한 대응이 이뤄지지 않았다면 대규모 인명피해와 해안가 환경피해로 이어질 수 있는 위급한 상황이었다\"라며 \"해상관제센터와 현장 경비함정의 긴밀한 공조를 통해 인명과 재산을 안전하게 지켜낼 수 있었다\"라고 밝혔다.","category":"사건 사고"},{"title":"‘안산 성폭행 10대 사망’ 초기 수사 경찰관 2명에 ‘직권 경고’","link":"https://n.news.naver.com/mnews/article/666/0000132358","naverLink":"https://n.news.naver.com/mnews/article/666/0000132358","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"성폭행 고소 불송치 결정 후 숨진 채 발견 보완 수사 후 40대 가해자 준강간 혐의로 기소 경기남부경찰청 전경. 경기남부경찰청 제공 경찰의 불송치 결정에 억울함을 호소하면 숨진 10대 아르바이트생 사건을 초기에 수사한 경찰관 2명이 직권경고 처분을 받았다. 경기남부경찰청은 당시 사건 수사를 담당했던 안산단원경찰서 수사팀장 등 2명을 상대로 직권경고 처분했다고 16일 밝혔다. 직권경고는 징계위원회 절차 없이 시도경찰청장의 직권으로 할 수 있는 인사상 조치다. 앞서 피해자인 A씨는 지난해 12월28일 자신이 일하던 주점 업주인 40대 남성 B씨에게 성폭행당했다며 경찰에 고소장을 접수했다. 사건을 수사한 경찰은 올해 2월 증거 불충분을 이유로 불송치 결정했다. 경찰의 결정에 A씨는 억울함을 호소했으며 휴대전화에 이의신청서를 남긴 채 숨졌다. 사건을 넘겨받은 공소청은 주점 내 폐쇄회로(CC)TV 분석 등 보완수사를 거쳐 B씨를 준강간 혐의로 기소됐다. 한편 B씨는 이날 수원지법 안산지원 제1형사부(부장판사 정경희) 심리로 열린 첫 공판에서 혐의를 부인했다. ● 관련기사: “피해자 목소리 들어달라”…안산 청소년 성폭력 사건 첫 공판서 엄벌 촉구 https://www.kyeonggi.com/article/20261116580198 국선변호사 신청 11일 방치...‘억울함에 숨진 안산 10대 알바생’ 수사 도마 뒤 https://www.kyeonggi.com/article/20261021580604 경찰 '무혐의'에 눈감은 10대 알바생…공소청 보완수사 끝 40대 업주 기소 https://www.kyeonggi.com/article/20261008580128","category":"사건 사고"},{"title":"삼척 앞바다서 화물선 표류…풍랑주의보 속 선원 16명 전원 구조","link":"https://n.news.naver.com/mnews/article/437/0000521019","naverLink":"https://n.news.naver.com/mnews/article/437/0000521019","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"〈사진 = 동해해양경찰서〉 강원 삼척시 덕산항 인근 해상에서 기관 고장으로 표류하던 대형 화물선 선원 16명이 무사히 구조됐습니다. 강원 동해해양경찰서는 오늘(16일) 오전 10시 22분쯤 4881톤급 시멘트 운반선이 기관 고장으로 해안 방향으로 떠밀려 가고 있다는 신고를 접수했습니다. 해양경찰은 대형 경비함정 2척을 급파해 1시간 30분 뒤인 오전 11시 52분쯤 화물선에 예인줄을 연결했고, 밤 9시 15분쯤 동해항으로 입항 조치했습니다. 화물선 선원 16명의 건강 상태에는 이상이 없는 것으로 확인됐으며, 사고로 인한 해양오염이나 물적 피해도 없는 것으로 파악됐습니다. 동해해경은 \"구조 당시 바다에 초속 16m의 강한 바람과 함께 4m의 높은 파도가 치고 있어 대규모 인명피해로 이어질 수 있었다\"며 \"관제센터 등과의 긴밀한 공조로 안전하게 구조를 마쳤다\"고 밝혔습니다.","category":"사건 사고"},{"title":"50대 父 면허로 택시기사 취업한 10대…운행 첫날 사고로 덜미","link":"https://n.news.naver.com/mnews/article/014/0005605174","naverLink":"https://n.news.naver.com/mnews/article/014/0005605174","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"50대 아버지 신분증 도용해 자격시험 통과 및 택시회사 취업까지 '무사통과' 운행 첫날 전남광주 여수서 교통사고…보복운전 신고 후 출동한 경찰에 명의 도용 들통 \"부모님 실직해 가정형편 돕고자 범행\"…공단·회사 신원 확인 '허술' 도마 위 전남 여수경찰서 전경. /사진=뉴스1 [파이낸셜뉴스] 아버지의 운전면허증을 도용해 택시 운전 자격증을 취득하고 실제 영업에 나선 10대가 운행 첫날 교통사고를 내면서 경찰에 붙잡혔다. 특히 시험장과 채용 단계에서 30살가량의 나이 차이를 전혀 걸러내지 못한 허술한 신원 확인 시스템도 도마 위에 올랐다. 전남광주 여수경찰서는 공문서 부정행사와 위계에 의한 업무방해 등 혐의로 A씨(19)를 불구속 입건해 조사하고 있다고 16일 밝혔다. 경찰에 따르면 A씨는 지난 4일 한국교통안전공단이 시행하는 택시 운전 자격시험에 50대 아버지의 운전면허증을 도용해 응시 및 자격증을 발급받은 뒤, 전남광주 여수 지역의 한 택시회사에 기사로 위장 취업한 혐의를 받는다. 현행 택시 운전 자격시험은 만 18세 이상이면서 운전경력이 1년 이상이어야 응시할 수 있다. A씨는 나이 요건은 충족했으나 운전경력이 모자라 아버지 명의로 자격시험을 치른 것으로 파악됐다. A씨의 대담한 범행은 택시 운행 첫날 발생한 교통사고 처리 과정에서 꼬리를 밟혔다. 그는 지난 7일 오전 11시 50분께 전남광주 여수시 문수동의 한 도로에서 손님을 태우고 운행하던 중 다른 승용차와 충돌하는 사고가 나자 \"보복운전을 당했다\"며 직접 경찰에 신고했다. 그러나 현장에 출동한 경찰이 사고 경위와 신원을 파악하는 과정에서 택시 운전 자격증에 기재된 50대 명의자와 실제 운전자인 A씨의 연령대가 확연히 다른 점을 수상히 여겼다. 경찰의 거듭된 추궁에 결국 A씨가 자신의 실제 이름과 생년월일을 대면서 명의 도용 사실이 발각됐다. 경찰 조사에서 A씨는 \"아버지가 건강 문제로 실직하는 등 가정 형편이 어려워져 부모님을 돕기 위해 택시 운전을 하려 했다\"는 취지로 진술한 것으로 전해졌다. 이번 사건으로 10대 아들이 50대 아버지 행세를 했음에도 불구하고 공단 자격 시험장은 물론 택시회사 채용 과정에서 기본적인 신원 확인조차 제대로 이뤄지지 않은 사실이 드러났다. 한국교통안전공단은 A씨의 택시 운전 자격을 즉각 취소하고 향후 시험 관리를 강화하겠다는 입장을 밝혔다. 경찰은 A씨를 상대로 보다 정확한 사건 경위를 조사 중이다.","category":"사건 사고"}],"사회":[{"title":"\"AI 커닝 100% 잡겠나\"…교육장관 \"못할 것 같다, 나이가 있어서\"","link":"https://n.news.naver.com/mnews/article/053/0000063100","naverLink":"https://n.news.naver.com/mnews/article/053/0000063100","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"수능 사흘 앞두고 국회 교육위서 AI 부정행위 대응 능력 도마 위 야당 \"교육부 믿고 시험 봐도 되나\"…여당도 장관 답변 태도 질타 교육부 \"감독관 어려움에 공감한 취지\" 해명…17일 추가 대책 발표 최교진 교육부 장관이 16일 서울 여의도 국회에서 열린 교육위원회 전체회의에서 인공지능(AI)을 활용한 부정행위에 대한 의원 질의에 답변하고 있다. photo 뉴스1 2027학년도 대학수학능력시험(수능)을 사흘 앞두고 인공지능(AI) 기기를 활용한 부정행위 우려가 커지는 가운데 최교진 교육부 장관이 첨단 기기를 이용한 부정행위를 완벽하게 적발하기는 어렵다고 인정해 논란이 일고 있다. 최 장관은 부정행위를 100% 잡아낼 자신이 있느냐는 질문에 \"전 못 할 것 같다\"고 답한 데 이어 \"제 나이가 있어서\"라고 설명했다. 교육부가 수능 직전까지 추가 대책을 마련하는 상황에서 교육 수장의 발언이 수험생들의 불안을 키웠다는 지적이 나온다. 16일 국회 교육위원회 전체회의에서 박정훈 국민의힘 의원은 최근 세무사 시험에서 발생한 초소형 카메라와 이어폰을 이용한 부정행위 사례를 언급하며 교육부의 대응 능력을 추궁했다. 박 의원은 \"옷에 작은 카메라를 붙이고 귀에 소형 이어폰을 넣는 방식의 부정행위를 100% 잡아낼 자신이 있느냐\"고 물었다. 이에 최 장관은 \"전 못 할 것 같다\"고 답했다. 박 의원이 \"교육부 수장이 못 하겠다고 하면 정부 수준이 그것밖에 안 되는 것 아니냐\"고 지적하자 최 장관은 \"제 나이가 있어서 그런지 그건 못 할 것 같다\"고 말했다. 박 의원은 \"장관 연세 때문이 아니라 현장 감독관들이 적발할 자신이 있느냐는 뜻\"이라며 \"교육부를 믿고 시험을 봐도 되는 것이냐\"고 재차 따져 물었다. 최 장관은 자신의 개인적인 적발 능력을 말한 것이라고 해명하면서 \"관련 국장이 답변해 주면 좋겠다\"며 실무자에게 답변을 넘겼다. 최 장관의 답변 태도에 대한 지적도 나왔다. 김희정 국민의힘 의원은 \"국민들은 정부가 얼마나 심각하게 받아들이고 책임 있게 대처하는지 믿음을 갖고 싶어 한다\"며 \"그런데 대놓고 실무진에게 답변을 맡기고 있지 않느냐\"고 비판했다. 고민정 더불어민주당 의원도 \"오늘 상임위 모습만 보면 수험생 불안이 오히려 가중될까 봐 걱정스럽다\"고 말했다. 최 장관은 시중에 판매되는 스마트안경에 대해서는 \"충분히 적발할 수 있다\"고 밝혔다. 다만 아직 알려지지 않은 변종 기기까지 모두 걸러낼 수 있느냐는 질문에는 \"새로","category":"사회"},{"title":"아직도 못 돌아온 한국인 9명… 현지 주민들 여전히 피난 생활","link":"https://n.news.naver.com/mnews/article/005/0001885500","naverLink":"https://n.news.naver.com/mnews/article/005/0001885500","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"[네팔 대홍수 그 후] 실종자 가족 동의 수색 재개 않기로 두산에너빌리티, 캠프 수습 작업 진행 네팔, 1464명 사망 5285명 실종 발표 주택·학교·도로·의료시설 등 파괴 지난 8월 26일 네팔 대홍수가 발생한 지 두 달 반이 지났지만 누와코트 지역 트리슐리강 인근 주택들은 무너진 채 방치돼 있다. AP뉴시스 지난 8월 26일 네팔 대홍수로 한국인 9명이 실종된 지 두 달 반이 지났다. 그사이 생존자 수색은 종료되고 현장 수습 작업으로 전환돼 진행 중이다. 홍수로 삶의 터전을 잃은 현지 주민들은 임시 피난시설 생활을 이어가는 등 정상화까진 요원한 상황이다. 네팔 정부는 최근 개막한 제31차 유엔기후변화협약 당사국총회(COP31)를 계기로 국제사회에 기후위기 대응을 촉구했다. 韓 실종자 수색 중단, 수습에 총력 16일 한국남동발전 등에 따르면 남동발전은 지난달 10일 네팔 최대 명절 연휴를 앞두고 생존자 수색을 잠정 중단한 뒤 같은 달 25일 수색을 재개하지 않기로 결정했다. 남동발전 관계자는 “가족분들의 동의를 받아 생존자 수색은 종료했다”며 “주네팔 한국대사관과 연락체계를 유지하며 현지 당국이 수습한 시신의 DNA 분석 등 신원 확인 작업에 협조하고 있다”고 밝혔다. 남동발전은 그동안 실종자들이 사고 당시 산 쪽으로 대피했을 가능성을 염두에 두고 발전소 인근 산사면 등을 중심으로 육상 수색 인력 80여명과 드론·수색견 등을 투입해 수색을 벌였지만 소득이 없었다. 남동발전 현지 사업법인은 이달 네팔 정부에 피해 복구 관련 예비 보고서를 제출하고 내년 3월 네팔 정부 등과 협의해 발전소 공사 재개 여부를 논의할 계획이다. 두산에너빌리티는 매몰 지역을 중심으로 수습 작업을 진행 중이다. 사고 초기에는 50여명을 단계적으로 파견하고 헬기, 드론 등을 동원한 ‘비상대응체계’를 가동했지만 지금은 ‘현장운영체계’로 전환했다. 사고 현장에 대응인력 10명을 유지하며 두산 직원들이 머물던 메인 캠프(Main Camp) 일대에 쌓인 토사를 굴착기로 걷어내는 작업에 집중하고 있다. 두산에너빌리티 관계자는 “토사가 콘크리트처럼 딱딱하게 굳어 굴착기 등 중장비를 동원하고 있다”며 “발전소 캠프사이트 인근에서 차량이 이동하는 모습이 사고 당시 마지막으로 촬영된 영상에 담겨 해당 차량이 토사에 매몰됐을 가능성을 염두에 두고 인근 지역을 수습하고 있다”고 설명했다. 주민 피란생활 여전, 기후대응 촉구 홍수로 다리가 유실된 자리에 새로","category":"사회"},{"title":"트립닷컴, 장애 영유아 거주 시설 ‘디딤자리’ 아동과 가을 소풍 동행","link":"https://n.news.naver.com/mnews/article/144/0001150131","naverLink":"https://n.news.naver.com/mnews/article/144/0001150131","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"트립닷컴 [스포츠경향 손봉석 기자] 여행 플랫폼 트립닷컴이 장애 영유아 거주 시설 ‘디딤자리’ 아동들을 위한 가을 소풍을 지원하고, 임직원이 참여하는 나들이 봉사활동을 진행했다고 밝혔다. 지난 10일 진행된 이번 행사는 신체적 제약으로 장거리 이동이나 야외 활동의 기회가 적은 장애 영유아들이 가을의 정취를 느끼고 새로운 경험을 통해 특별한 추억을 쌓을 수 있는 기회를 제공하고자 마련됐다. 소풍에는 외부 활동이 가능한 디딤자리 아동들과 아동들의 안전한 이동 및 돌봄을 전담한 생활재활교사, 현장 지원에 나선 트립닷컴 임직원 봉사단 등 약 40여명이 함께했다. 특히 아동 한 명당 전담 생활재활교사가 1:1로 동행했으며, 트립닷컴 임직원들이 이동 보조와 야외 체험 활동을 밀착 지원해 안전하고 따뜻한 시간을 보냈다. 이번 소풍은 획일적인 단체 관람에서 벗어나, 아이들의 개별 성향과 신체 상태를 세심하게 고려한 조별 맞춤형 프로그램으로 운영됐다. 아이들이 원하는 것을 직접 선택하고 충분히 즐길 수 있도록 배려해, 조별로 놀이기구 탑승, 동물원 관람, 가을 정원 산책 등 다양한 코스를 자유롭게 체험하며 뜻깊은 하루를 보냈다. 전영미 디딤자리 원장 수녀는 “신체적 장애가 있는 영유아들의 경우 1:1 전담 돌봄 인력과 안전한 이동 수단이 확보되지 않으면 바깥 나들이를 떠나는 것 자체가 큰 도전”이라며, “아이들의 눈높이에 맞춰 세심하게 소풍을 준비해주고 따뜻한 온기로 함께 걸어준 트립닷컴 임직원 여러분께 진심으로 감사드린다”고 전했다. 봉사활동에 참여한 나상백 트립닷컴 매니저는 “자연 속에서 아이들이 환하게 웃으며 마음껏 뛰노는 모습을 보면서 오히려 더 큰 치유와 긍정적인 에너지를 얻었다”라며, “단순히 봉사나 지원을 넘어 아이들이 세상과 새로운 경험을 맺는 소중한 여정에 작은 보탬이 될 수 있어 매우 뜻깊었고, 앞으로도 온기를 나눌 수 있는 기회에 적극 동참하고 싶다”고 소감을 전했다. 트립닷컴은 가족의 달 나눔 행사 및 연말 취약계층 지원 등 지역사회와 상생하기 위한 다양한 사회공헌활동(CSR)을 지속적으로 전개해 오고 있다. 트립닷컴 그룹은 트립닷컴, 씨트립, 스카이스캐너, 취날로 구성된 글로벌 여행 서비스 제공 기업이다. 각 플랫폼을 통해 전 세계 여행자들이 여행 상품과 서비스를 보다 합리적이고 효율적으로 예약할 수 있도록 돕고 있다. 또한 풍부한 여행 콘텐츠와 리소스, 앱·웹사이트·24시간 고객센터로 이루어진 고도화된","category":"사회"},{"title":"전남광주서 우회전 차량이 40대 남성 들이받아…중상으로 병원 이송","link":"https://n.news.naver.com/mnews/article/055/0001403456","naverLink":"https://n.news.naver.com/mnews/article/055/0001403456","pubDate":"2026-11-16T12:00:00+09:00","author":"네이버뉴스","description":"전남광주서 우회전 차량이 40대 남성 들이받아…중상으로 병원 이송. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/
