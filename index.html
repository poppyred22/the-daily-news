window.NEWS_DATA = {"date":"2026-11-25","generatedAt":"2026-11-25T11:14:53.095182+09:00","total":145,"days":{"today":{"date":"2026-11-25","weekday":"수요일","label":"오늘 · 11월 25일 수요일","total":50,"categories":{"사건 사고":[{"title":"여름철 비타민D 부족하면 골절·사망 위험↑…검사 시기도 중요","link":"https://n.news.naver.com/mnews/article/022/0004177940","naverLink":"https://n.news.naver.com/mnews/article/022/0004177940","pubDate":"2026-11-25T11:13:12.498250+09:00","author":"네이버뉴스","description":"여름철 검사에서 혈중 비타민 D 수치가 낮게 나온 사람들은 수치가 높은 사람들보다 골절과 사망 위험이 훨씬 높지만, 겨울철에는 이런 연관성이 뚜렷하지 않다는 연구 결과가 나왔다. 게티이미지뱅크 여름철 혈중 비타민 D 수치가 낮은 사람은 수치가 높은 사람보다 사망과 골절 위험이 크게 높다는 연구 결과가 나왔다. 반면 겨울철 검사에서는 비타민 D 수치와 골절 위험 사이의 연관성이 뚜렷하게 나타나지 않았다. 비타민 D 부족 여부를 판단할 때 검사 시기도 고려해야 한다는 게 연구팀의 분석이다. 스웨덴 웁살라대 칼 미카엘손 교수팀은 25일 국제학술지 ‘PLOS 메디신(PLOS Medicine)’에서 스웨덴 노인 1만2000여명을 대상으로 혈중 비타민 D 농도와 사망·골절 위험의 관계를 분석해 이 같은 결과를 발표했다. ◆ 여름철 비타민D 낮으면 사망 위험 2.86배…고관절 골절도 2.82배 연구팀은 스웨덴 여성 5010명(평균 68세)으로 구성된 집단과 여성·남성 7291명(평균 75세)으로 구성된 집단 등 두 코호트에서 혈액을 채취해 비타민 D3 농도를 측정했다. 이후 전국 등록 자료를 활용해 평균 11년간 사망과 골절 발생 여부를 추적했다. 참가자들은 혈중 비타민 D 수치가 가장 낮은 집단(40nmol/L 미만)과 가장 높은 집단(80nmol/L 초과)으로 나눠 비교했다. 분석 과정에서는 나이와 성별, 체격, 신장·간 기능, 과거 골절 여부, 운동, 칼슘 섭취, 동반질환, 흡연 등 여러 요인을 보정했다. 추적 기간 사망자는 3573명, 골절은 3134건 발생했으며 이 가운데 고관절 골절은 886건이었다. 여름철 비타민 D 수치가 낮은 것은 사망과 골절 위험 증가와 강하게 연관돼 있었지만, 겨울철 수치는 골절 위험 증가가 통계적으로 유의하지 않았다는 게 연구팀의 설명이다. 게티이미지뱅크","category":"사건 사고"},{"title":"닛케이지수 장중 5만7천선 붕괴..美 반도체주 급락·관세 우려","link":"https://n.news.naver.com/mnews/article/014/0005609376","naverLink":"https://n.news.naver.com/mnews/article/014/0005609376","pubDate":"2026-11-25T11:13:11.562697+09:00","author":"네이버뉴스","description":"지난해 7월11일 일본 도쿄의 도쿄증권거래소 건물 앞을 한 시민이 지나가고 있는 모습. 사진=뉴시스 【파이낸셜뉴스 도쿄=서혜진 특파원】일본 닛케이225평균주가(닛케이지수)가 25일 장중 5만7000선 아래로 떨어졌다. 미국 증시에서 인공지능(AI)·반도체주가 급등 하루 만에 하락세로 돌아선 데다 미국의 추가 관세 우려까지 겹치며 투자심리가 위축됐다. 이날 오전 9시45분 기준 닛케이지수는 전 거래일보다 1541.79p(2.63%) 내린 5만7102.84를 기록했다. 장 초반에는 1600p 넘게 떨어져 5만6900대까지 밀렸다가 낙폭을 일부 줄였다. 최근 빠르게 반등했던 어드반테스트와 도쿄일렉트론 등 AI·반도체주에 매도세가 집중됐다. 간 밤 뉴욕 증시에서는 AI 관련주에 차익실현 매물이 쏟아졌다. 젠슨 황 최고경영자(CEO)의 복귀 소식에 직전 거래일 31.5% 폭등했던 엔비디아는 5.86% 하락했다. AMD와 마이크론도 각각 8.86%, 11.01% 떨어지면서 필라델피아반도체지수(SOX)는 7.88% 급락했다. 기술주 중심의 나스닥종합지수는 1.48% 내렸다. 황 CEO 복귀에 대한 기대만으로는 AI 인프라 투자의 지속 가능성과 수익성을 둘러싼 의구심을 해소하기 어렵다는 인식이 확산했다. AI 기업 앤트로픽도 6.54% 하락한 81.91달러에 마감해 상장 4거래일 만에 처음으로 공모가인 83달러를 밑돌았다. 미국의 '과잉생산 관세' 부과 움직임도 부담으로 작용했다. 폴리티코 등 미국 언론에 따르면 미 무역대표부(USTR)는 이르면 24일 저녁(현지시간) 중국과 일본, 한국, 유럽연합(EU) 등 16개 경제주체를 대상으로 진행한 무역법 301조 조사 결과를 발표할 것으로 예상됐다. 각국의 보조금과 산업지원 정책이 과잉생산을 유발해 미국 기업에 피해를 줬는지가 조사 대상이다. 다만 일본과 한국, EU에는 기존 합의를 반영해 앞서 부과한 '강제노동 관세'와 합산한 세율이 15%를 넘지 않을 것이라는 전망이 나온다. 관세 부과 수준과 조건이 확정되기 전까지 통상정책을 둘러싼 불확실성이 이어지는 모습이다. 도쿄시장에서는 이날 장 초반 토픽스(TOPIX)지수도 하락했다. 소프트뱅크그룹과 이비덴, 키옥시아가 약세를 보인 반면 유니클로 운영사 패스트리테일링과 주가이제약, 테루모는 상승했다.","category":"사건 사고"},{"title":"트럼프 이어 美 법무장관도 젠슨 황 엄호…\"범죄 증거 없어\"","link":"https://n.news.naver.com/mnews/article/003/0014343708","naverLink":"https://n.news.naver.com/mnews/article/003/0014343708","pubDate":"2026-11-25T11:13:11.562668+09:00","author":"네이버뉴스","description":"블랜치 \"엔비디아는 모범 기업\"…형사 기소 가능성 일축 美 검찰, H200 등 첨단 칩 中 밀반출 증거 확보 '불륜 상대' 앨리스 황 관련 수사도 계속…아직 미기소 [서울=뉴시스] 24일(현지 시간) 뉴욕타임스(NYT)에 따르면 블랜치 장관은 이날 기자회견에서 \"엔비디아가 모범적인 기업 시민이 아니라고 말할 이유가 없다\"며 미 연방수사국(FBI)이 황의 범죄 행위를 입증할 증거를 발견하지 못했다고 밝혔다. 사진은 젠슨 황 엔비디아 최고경영자(CEO)가 23일 캘리포니아주 산타클라라의 엔비디아 본사에 돌아온 뒤 직원들에게 인사하고 있다. (출처: 엔비디아 소셜미디어 X) 2026.11.25. *재판매 및 DB 금지 [서울=뉴시스]박미선 기자 = 토드 블랜치 미국 법무부 장관이 젠슨 황 엔비디아 최고경영자(CEO)의 범죄 혐의를 입증할 증거가 없다며 엔비디아를 공개적으로 두둔했다. 미 수사당국이 엔비디아 고객사들의 인공지능(AI) 반도체 중국 밀반출 증거를 확보한 가운데 나온 발언이다. 24일(현지 시간) 뉴욕타임스(NYT)에 따르면 블랜치 장관은 이날 기자회견에서 \"엔비디아가 모범적인 기업 시민이 아니라고 말할 이유가 없다\"며 미 연방수사국(FBI)이 황의 범죄 행위를 입증할 증거를 발견하지 못했다고 밝혔다. 이어 \"법무부가 그가 범죄를 저질렀다는 정보를 확보했고 그것이 사실이었다면 분명 대통령에게 보고했을 것\"이라고 말했다. 이는 도널드 트럼프 미국 대통령이 전날 황의 위법 행위를 입증할 증거가 없다고 밝힌 데 이어 나온 발언이다. 트럼프 대통령은 황이 국가안보에 위협이 되지 않는다는 점을 엔비디아 이사회에 설명하며 그의 복귀를 추진했다. 그러나 미 수사당국은 별개의 두 수사를 통해 다른 기업들이 엔비디아의 첨단 반도체를 중국으로 불법 반출한 증거를 확보한 것으로 전해졌다. 뉴욕 연방검찰은 미국의 수출 규제로 엔비디아 반도체를 직접 구매할 수 없는 중국 고객들에게 해당 반도체를 우회 공급하려 한 혐의로 이미 여러 명을 기소했다. 이 과정에서 황과 불륜 관계를 맺었던 싱가포르 데이터센터 업체 메가스피드의 임원 앨리스 황에게 불리한 증거도 일부 확보된 것으로 알려졌다. 다만 앨리스 황은 아직 해당 사건과 관련해 기소되지 않았다. 미국 정보당국은 앨리스 황을 중국 정보기관의 협력자로 보고 있다. 젠슨 황은 지난달 관련 의혹이 불거진 뒤 불륜 사실을 인정하고 CEO직에서 물러났다가 전날 복귀했다. 이와 별도로 캘리포니","category":"사건 사고"},{"title":"김성희 부산경찰청장 물러난다…후임에 김병기 경비국장 유력","link":"https://n.news.naver.com/mnews/article/079/0004213618","naverLink":"https://n.news.naver.com/mnews/article/079/0004213618","pubDate":"2026-11-25T11:13:11.214378+09:00","author":"네이버뉴스","description":"김병기·송영호 치안감, 24일 치안정감 승진 내정 오는 27일 신임 부산경찰청장 취임 전망 김성희 신임 부산경찰청장이 지난 4월 열린 취임간담회에서 발언하고 있다. 부산경찰청 제공 김성희 부산경찰청장이 자리에서 물러나고 김병기 경찰청 경비국장이 후임으로 부임할 전망이다. 25일 경찰 등에 따르면 김성희 부산경찰청장은 최근 퇴직 절차를 밟은 것으로 알려졌다. 김 청장은 이번 경찰청 고위직 인사에서 별도 보직을 받지 못하면서 자연스럽게 물러나게 된 것으로 파악됐다. 김 청장은 지난해 9월 치안정감 승진 대상자로 내정된 뒤 치안정감급 보직인 경찰대학장 직무대리를 지냈으며, 올해 4월 부산경찰청장으로 취임했다. 지난 24일 치안정감으로 승진 내정된 김병기 경찰청 경비국장. 경찰청 제공","category":"사건 사고"},{"title":"경찰 강당에 선 어머니 \"제 딸은 죽었지만... 대한민국의 딸들을 지켜주세요\"","link":"https://n.news.naver.com/mnews/article/047/0002537144","naverLink":"https://n.news.naver.com/mnews/article/047/0002537144","pubDate":"2026-11-25T11:13:11.214374+09:00","author":"네이버뉴스","description":"[생민국회 93-1편] 강경숙 의원 \"하루 빨리 친밀폭력특위 구성해야\"... 피해 유족들 공통된 바람에 답해야 편집자말 민생의 또 다른 뜻은 생민, 즉 살아있는 국민입니다. 남인순 국회부의장이 구성을 제안한 '친밀관계폭력대책 특별위원회'는, 그래서 민생특위입니다. 국회의원 93명이 뜻을 같이 했습니다. 살아있는 국민을 더 잘 지키자는 결의에 여야는 없습니다. 그 의미와 과제 그리고 진행 과정 등을 93회 연재합니다. ▲ 2022년 9월 20일, 서울 지하철 2호선 신당역 여성화장실 입구에 스토킹 살인사건으로 희생된 여성역무원을 추모하는 시민들이 붙여 놓은 메모지가 빼곡하게 붙어 있다. ⓒ 권우성 2024년 7월 17일, 인천 스토킹 살인 사건 항소심이 열린 날이었습니다. 출근길에 나선 전 연인을 무참하게 살해했던 사건, 가해자는 접근금지 명령을 받은 상태였습니다. 유족들은 선고 직후 눈물을 흘리며 이렇게 말했습니다. \"오늘 동생이 세상을 떠난 지 딱 1년이 됐습니다. 사건 이후 언론을 통해 다른 분들이 저와 같은 아픔을 겪지 않았으면 좋겠다고 말한 것이 기억납니다. 그런데도 여전히 교제 폭력과 사망 소식을 전해 듣고 있습니다. 제발 교제폭력 처벌법에 관심을 가져주세요. 다시는 이런 피해자가 나오지 않도록 국회가 시급하게 관련 법 통과를 논의해주세요.\" ▲ 2022년 9월 20일, 서울 2호선 신당역 지하철 화장실 앞과 신당역 10번 출구 앞에는 스토킹 살인 당한 20대 여성 역무원을 추모하는 글이 적힌 포스트잇 500여개가 붙어있다. ⓒ 이주연","category":"사건 사고"},{"title":"3살 딸 살해하고 6년간 숨긴 母…2심도 '징역 25년' 구형","link":"https://n.news.naver.com/mnews/article/003/0014343841","naverLink":"https://n.news.naver.com/mnews/article/003/0014343841","pubDate":"2026-11-25T11:13:11.214364+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"위장 전입해 전학 온 학생…학부모·중학교, 경찰 수사 받는다","link":"https://n.news.naver.com/mnews/article/421/0009308786","naverLink":"https://n.news.naver.com/mnews/article/421/0009308786","pubDate":"2026-11-25T11:13:11.214362+09:00","author":"네이버뉴스","description":"학벌없는 사회를 위한 시민모임 전남경찰청에 고발 \"학교 묵인 개연성 높아\"…위법 확인 시 조치 촉구 학벌없는사회를 위한 시민모임 로고 ⓒ 뉴스1 (나주=뉴스1) 안재영 기자 = 경찰이 전학생을 받는 과정에서 실거주 여부를 확인하지 않는 등 자격 심사를 부실하게 한 중학교와 '위장 전입' 의혹이 제기된 학부모에 대한 수사에 나선다. 25일 학벌없는사회를 위한 시민모임에 따르면 이 단체는 전남광주 나주 A 중학교에 자녀를 전학시키기 위해 실제 거주하지 않으면서 서류상 주소지만 이전한 학부모를 수사해 달라는 내용의 고발장을 전남경찰청에 제출했다. 또 A 중학교가 학부모의 위법 행위에 대해 공모한 정황이 확인될 경우 함께 수사해 달라고 요청했다. 뉴스1은 A 중학교가 올해 1학기 시작 전 타지역에서 전학을 희망한 학생에 대해 통학 구역 내 실거주 여부를 확인하지 않고 전학을 승인하는 등 '자격 심사' 부실 정황을 보도했다. 통학 구역 내에 주소지를 옮겼더라도 실제 거주하지 않았다면 전학 목적의 위장 전입으로 주민등록법 위반 소지가 있는데, 해당 학생은 전학 전에 원래 살았던 곳이 실거주 지역인 것으로 알려졌다. A 중학교 관계자는 \"서류상으론 아무런 문제가 없었는데, 현장 실사는 하지 않았다\"며 \"위장 전입 소지가 있는 부분에 대해선 제대로 파악하지 못했다\"고 밝힌 바 있다. 해당 학생이 전학 후 A 중학교의 미인가 기숙사에서 생활했다는 점에서 학교 측이 전학 요건을 충족하지 못한다는 점을 알고도 입학을 허가했다는 의혹도 제기된다. 학벌없는사회를 위한 시민모임 관계자는 \"통학구역 내 실거주자가 특별한 사유 없이 기숙사에 입소할 이유가 없다는 점을 볼 때, 학교 측이 전학 요건 미달 사실을 인지하고도 기숙사 입소를 전제로 학부모의 위장 전입을 묵인·방조했을 개연성이 높다\"고 지적했다. 이어 \"수사 기관은 이번 부정 전학의 전모와 학교 측 개입 여부를 명명백백히 밝혀야 한다\"며 \"위법 사실이 확인될 경우 전남광주교육청은 관련자 징계와 전학 조치 등 엄정한 행정처분에 나서야 한다\"고 강조했다.","category":"사건 사고"},{"title":"천안 11세 장애아동 학대치사 목사 징역 25년·외조모 20년 구형(1보)","link":"https://n.news.naver.com/mnews/article/421/0009308802","naverLink":"https://n.news.naver.com/mnews/article/421/0009308802","pubDate":"2026-11-25T11:13:11.214358+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"},{"title":"'유괴미수 전과' 40대男, 3년 뒤 또 9세 유인시도…법원 판결 보니?","link":"https://n.news.naver.com/mnews/article/079/0004213639","naverLink":"https://n.news.naver.com/mnews/article/079/0004213639","pubDate":"2026-11-25T11:13:11.214349+09:00","author":"네이버뉴스","description":"2023년에도 동종 전력 법원 \"비난 가능성 높아\" 부산지방법원 서부지원 전경. 부산지법 서부지원 제공 길을 걷던 9세 여자아이를 유인하려 한 40대 남성이 징역형 집행유예를 선고받았다. 부산지법 서부지원 형사2단독 이유섭 판사는 미성년자유인미수 혐의로 기소된 A(40대·남)씨에게 징역 1년 6개월에 집행유예 3년을 선고하고 보호관찰을 명령했다고 25일 밝혔다. A씨는 지난 7월 10일 오후 6시쯤 부산 사상구의 한 길거리에서 마주 걸어오던 B(9)양에게 \"같이 가자\"고 말하며 유인하려 한 혐의로 재판에 넘겨졌다. 당시 B양은 부모에게 전화하는 척하며 현장을 빠져나갔고 A씨의 범행은 미수에 그쳤다. A씨는 지난 2023년에도 동종 범죄로 징역형 집행유예를 선고받은 전력이 있는 것으로 드러났다. 이 판사는 \"동종 범죄로 처벌받고도 다시 범행해 비난 가능성이 높고, 피해 아동이 상당한 정신적 충격을 받았을 것으로 보인다\"면서도 \"다만 A씨의 정신질환이 범행에 상당한 영향을 미친 것으로 보이는 점과 사건 직후 병원에 입원해 치료받은 점, 가족이 지속적인 치료와 재발 방지를 다짐한 점 등을 참작했다\"고 양형이유를 밝혔다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"사건 사고"},{"title":"남해고속도로서 트레일러 전도 후 차량 5대 연쇄 추돌…3명 사망·3명 부상","link":"https://n.news.naver.com/mnews/article/022/0004177913","naverLink":"https://n.news.naver.com/mnews/article/022/0004177913","pubDate":"2026-11-25T11:13:11.214296+09:00","author":"네이버뉴스","description":"남해고속도로에서 단독사고로 넘어진 트레일러를 뒤따르던 차량 5대가 잇따라 충돌해 3명이 숨지고 3명이 다쳤다. 25일 경찰과 소방당국에 따르면 이날 오전 5시쯤 경남 김해시 진례면 남해고속도로 순천 방향 진례분기점 인근 진례천교 1차로에서 트레일러가 전도됐다. 이후 뒤따르던 승용차 5대가 넘어진 트레일러와 잇따라 충돌했다. 25일 오전 5시쯤 경남 김해시 진례면 남해고속도로 순천 방향 진례분기점 진례천교 지점 1차로에서 트레일러가 전도됐다. 국가교통정보센터 CCTV 화면 캡처 이 사고로 50대 트레일러 운전자 A씨와 60대 승용차 운전자 B씨 등 3명이 숨졌다. 나머지 승용차 운전자 3명 중 2명은 중상, 1명은 가벼운 부상을 입어 병원에서 치료를 받고 있다. 고속도로 순찰대는 사고 수습을 위해 사고 지점 4개 차로 가운데 3개 차로를 통제하고 전도된 트레일러를 세우는 등 현장을 정리했다. 김해시는 오전 6시16분쯤 사고에 따른 차량 정체가 예상된다며 우회도로 이용을 당부하는 안전 안내 문자를 발송했다. 한국도로공사 부산경남지역본부는 오전 7시 기준 남해고속도로 순천 방향 3㎞와 남해고속도로 제2지선 냉정분기점 일대 5㎞ 구간에서 차량 정체가 이어졌다고 밝혔다. 경찰은 대형 화물차와 승용차 2대가 먼저 추돌한 뒤 다른 승용차 2대가 추가로 충돌한 것으로 보고 정확한 사고 경위와 트레일러 전도 원인을 조사하고 있다.","category":"사건 사고"}],"사회":[{"title":"뉴로핏, 美 서틀메디컬과 공급 계약…“북미 의료 AI 시장 확대”","link":"https://n.news.naver.com/mnews/article/366/0001207166","naverLink":"https://n.news.naver.com/mnews/article/366/0001207166","pubDate":"2026-11-25T11:13:12.498228+09:00","author":"네이버뉴스","description":"뇌 영상 분석 소프트웨어 현지 플랫폼 연동 향후 제품 판매에 따른 수익 배분 방식 뇌 질환 진단·치료 인공지능(AI) 기업 뉴로핏은 미국 의료영상 AI 기업 서틀메디컬(Subtle Medical)과 제품 공급 및 플랫폼 연동 계약을 체결했다고 25일 밝혔다. 미국 캘리포니아주에 있는 서틀메디컬은 스탠퍼드대 연구진이 설립한 기업으로, AI를 활용해 자기공명영상(MRI)과 양전자방출단층촬영(PET) 등의 영상 품질을 개선하고 촬영 시간을 단축하는 소프트웨어를 개발한다. 현재 세계 1500대 이상의 의료영상 장비에 솔루션을 공급하고 있다. 뉴로핏은 서틀메디컬의 의료영상 AI 플랫폼에 뇌 영상 분석 소프트웨어 ‘뉴로핏 스케일 펫(Neurophet SCALE PET)’을 연동하기로 했다. 다만, 이번 계약은 공급 금액과 물량을 미리 확정하는 일반적인 제품 공급 계약과는 다르다. 계약 금액이 확정되지 않은 만큼 별도의 단일판매·공급계약 체결 공시도 하지 않았다. 회사 측은 “서틀메디컬의 플랫폼에 뉴로핏 제품을 연동해 현지 의료기관에 공급하고, 향후 발생하는 수익을 양사가 나누는 형태가 될 것”이라며 “현시점에서 구체적인 계약 규모를 밝히기는 어렵다”고 설명했다. 뉴로핏 스케일 펫은 PET 영상에서 뇌 영역별 방사성 추적자 축적량을 수치화하는 소프트웨어다. 알츠하이머병의 주요 발병 원인으로 꼽히는 베타아밀로이드 단백질의 뇌 내 축적 정도를 국제 표준 척도인 센틸로이드 스케일(Centiloid Scale)로 나타낸다. 알츠하이머병 치료제 레켐비와 키썬라의 처방 여부와 치료 효과를 판단하는 데 활용할 수 있다. 빈준길 뉴로핏 대표는 2024년 11월 21일 서울 중구 웨스틴 조선호텔 그랜드볼룸에서 열린 ‘헬스케어이노베이션포럼(HIF 2024)′에서 '알츠하이머 치료 격변 시대의 AI 뇌영상 기술'을 주제로 강연을 했다./조선비즈","category":"사회"},{"title":"수면장애 해결 실마리?…생체시계 늦추는 세포속 '불량 단백질'","link":"https://n.news.naver.com/mnews/article/584/0000040307","naverLink":"https://n.news.naver.com/mnews/article/584/0000040307","pubDate":"2026-11-25T11:13:11.963964+09:00","author":"네이버뉴스","description":"수면장애는 일상생활과 건강에 지장을 주는 다양한 수면 관련 질환으로 불면증 등을 포함한다. 게티이미지뱅크 제공 세포가 단백질을 만드는 도중 생긴 '불량품'을 제대로 처리하지 못하면 생체시계의 속도가 느려질 수 있다는 연구결과가 나왔다. 국내 연구진이 초파리에서 단백질 생산 과정의 품질관리가 핵심 '시계 단백질'의 축적 시점과 하루 활동 리듬을 조절한다는 사실을 규명했다. KAIST는 이종빈 줄기세포연구센터 연구교수와 임정훈 생명과학과 교수 연구팀이 울산과학기술원(UNIST) 연구진과 함께 이 같은 결과를 실험으로 확인했다고 25일 밝혔다. 연구결과는 19일(현지시간) 국제학술지 '미국 국립과학원회보(PNAS)'에 공개됐다. 생체시계는 수면과 각성, 호르몬 분비, 신진대사 등을 약 24시간 주기로 조절하는 몸속 시간 장치다. 초파리에서는 피리어드(PER) 등의 시계 단백질이 쌓이면 자신의 유전자 발현을 억제하고 시계 단백질들이 분해되면 다시 합성이 시작되는 과정이 반복되면서 생체리듬이 유지된다. 연구팀은 시계 단백질을 만드는 도중 발생하는 오류 처리 과정에 주목했다. 세포 속 리보솜은 유전정보를 읽어 단백질의 기본 단위인 아미노산을 이어 붙이는 단백질 생산 공장이다. 여러 리보솜이 같은 유전정보를 따라 움직이다 앞선 리보솜이 멈추면 뒤따르던 리보솜과 충돌할 수 있다. 이때 작동하는 것이 '리보솜 연관 품질관리(RQC)' 시스템이다. 멈춘 리보솜을 분리하고 만들다 만 단백질을 제거한다. 칼리반(CLBN)과 리스테린(LTN1)은 이 과정에서 불완전한 단백질이 제거되도록 돕는 인자다. 세포 속 단백질 품질 검사원 '칼리반'이 생체시계의 24시간 리듬을 유지하는 원리 개요. 생체시계의 핵심 단백질인 PER를 만드는 과정에서 리보솜이 멈추거나 충돌하면, 칼리반(Caliban)을 포함한 단백질 번역 품질관리 시스템(RQC)이 작동해 불완전하게 만들어진 단백질 합성 중간 산물을 제거한다. 정상적인 품질관리는 PER 단백질이 제때 축적되도록 도와 생체시계의 약 24시간 리듬을 유지하는 데 기여한다. 반면 칼리반의 기능이 저하되면 불완전한 PER 단백질이 증가하고 정상적인 PER 축적이 지연되어, 생체시계의 주기가 길어지고 활동 리듬이 약해진다. AI 생성 이미지. KAIST 제공","category":"사회"},{"title":"후원 이력 문제 삼은 김장겸에 \"후원자 마녀사냥\"","link":"https://n.news.naver.com/mnews/article/047/0002537146","naverLink":"https://n.news.naver.com/mnews/article/047/0002537146","pubDate":"2026-11-25T11:13:11.214370+09:00","author":"네이버뉴스","description":"KBS 사장 후보자 인사청문회에서 김 의원, 후원 이력 지적... 뉴스타파 정면 반박 ▲ 김 의원은 이날 질의에서 이 후보자가 2021년부터 2025년까지 5년 연속 다른 언론사에는 일절 기부하지 않고 에만 후원한 기부 명세서를 제시했다. 이를 두고 김 의원이 \"뉴스타파의 보도 방향과 이념이 맞아서 후원한 것이냐\"고 추궁하자 이 후보자는 \"지향성이 맞아서가 아니라 독립언론으로서 재정적인 어려움을 겪고 있어 후원한 것\"이라고 해명했다. ⓒ 오마이TV 24일 국회에서 열린 이태현 KBS 사장 후보자 인사청문회에서 김장겸 국민의힘 의원이 후보자의 뉴스타파 후원 이력을 정면으로 문제 삼은 것을 두고 가 공식 입장문을 내고 강하게 반발했다. 김장겸, 월 3만원 뉴스타파 후원 두고 \"이념 맞아서 그랬나\" 색깔론 김 의원은 이날 질의에서 이 후보자가 2021년부터 2025년까지 5년 연속 다른 언론사에는 일절 기부하지 않고 에만 후원한 기부 명세서를 제시했다. 이를 두고 김 의원이 \"뉴스타파의 보도 방향과 이념이 맞아서 후원한 것이냐\"고 추궁하자 이 후보자는 \"지향성이 맞아서가 아니라 독립언론으로서 재정적인 어려움을 겪고 있어 후원한 것\"이라고 해명했다. 이에 김 의원은 2022년 대선 직전 가 보도한 김만배씨 녹취록 사건을 거론하며 공세 수위를 높였다. 당시 윤석열 후보가 대장동 대출 브로커 수사를 덮어줬다는 취지의 보도가 나간 뒤, 김만배씨가 인터뷰를 진행한 신학림 전 언론노조위원장에게 책값 명목으로 1억 6천만 원을 건넨 사실이 드러나 현재 대표와 기자가 명예훼손 혐의로 1심 재판을 받고 있다는 점을 지적했다. 또한 해당 녹취록을 인용 보도했던 KBS가 2023년 11월 당시 사장이 공정성 훼손 사례로 대국민 사과한 사실을 상기시키며, 이 후보자가 보도가 나간 2022년은 물론 기소 이후인 2025년에도 후원을 멈추지 않은 이유를 따져 물었다. 이현태 KBS 사장 후보자 \"후원자로서 해당 언론사 보도·제작 논평하는 것 적절치 않아\" 이에 이 후보자는 \"후원 시작 당시 카드 자동결제를 걸어두었고 이후 민간 기업에서 바쁘게 지내며 후원이 계속되는 것을 제대로 인지하지 못했다\"며 \"후보자로서 개별 보도나 제작에 개입하지 않는 원칙을 밝힌 것처럼, 후원자로서도 해당 언론사의 보도와 제작에 논평하는 것은 적절치 않다\"고 답했다. 그러자 김 의원은 연말 소득신고 과정에서 후원 내역을 알 수 있었을 것이라며 \"국민들이 정당한 답변","category":"사회"},{"title":"특검, 추경호 ‘계엄해제 표결방해’ 1심 무죄에 항소","link":"https://n.news.naver.com/mnews/article/449/0000368620","naverLink":"https://n.news.naver.com/mnews/article/449/0000368620","pubDate":"2026-11-25T11:13:11.214351+09:00","author":"네이버뉴스","description":"추경호 대구시장(사진출처 뉴스1) 조은석 내란 특별검사가 추경호 대구시장 '계엄 해제 표결 방해 사건' 1심 무죄 판결에 불복해 항소했습니다. 특검팀은 어제(24일) 서울중앙지법 형사합의34부(한성진 부장판사)에 항소장을 제출했습니다. 1심 재판부는 지난 18일 12·3 비상계엄 당시, 국민의힘 의원들의 계엄 해제 표결을 방해한 혐의(내란 중요임무 종사)로 재판에 넘겨진 추 시장에게 무죄를 선고했습니다. 계엄 당시 국민의힘 원내대표였던 추 시장은 장소를 바꿔가며 비상 의원총회를 소집해 다른 의원들의 계엄 해제표결 참여를 방해한 혐의로 불구속 기소됐습니다. 특검팀은 추 시장이 윤석열 전 대통령으로부터 전화로 협조 요청을 받고 한 행동으로 판단했습니다. 하지만 1심 재판부는 윤 전 대통령이 추 시장에게 계엄 해제표결 저지를 요청했다고 보기 어렵다고 보고, 무죄를 선고했습니다.","category":"사회"},{"title":"[단독] 주진우 “이화영 재심, 석방 수단”… 李측 “입법부가 법원에 외압”","link":"https://n.news.naver.com/mnews/article/005/0001887317","naverLink":"https://n.news.naver.com/mnews/article/005/0001887317","pubDate":"2026-11-25T11:13:11.214340+09:00","author":"네이버뉴스","description":"주진우 이재명 대통령 재판취소 저지특위 위원장이 지난 16일 서울 여의도 국회에서 열린 이재명 대통령 재판취소 저지특위 전체회의에서 이화영 재심 및 형집행정지 반대 의견서를 들고 있다. 뉴시스 “법원에서 소송 중인 사건에 대한 외부적 압력에 해당한다.” 수원고법에 재심을 청구한 이화영 전 경기도 평화부지사 측 변호인단이 주진우 국민의힘 의원이 제출한 ‘재심 기각 요청’ 의견서에 대해 이같이 반박한 것으로 확인됐다. 입법부 소속인 주 의원이 사법부에 개입해 헌법이 보장하는 사법권의 독립을 침해하고 있다고 주장한 것이다. 다만 법조계 일각에서는 이 전 부지사 측의 이 같은 주장을 두고 ‘이중 잣대’라는 비판도 나온다. 여권 주도로 출범이 임박한 ‘조작기소 특검’은 쌍방울 대북송금 사건의 조작수사 의혹을 수사대상으로 삼고 있는데, 이 역시 같은 논리로 비판할 수 있다는 지적이다. 25일 국민일보 취재에 따르면 이 전 부지사 측은 전날 수원고법에 주 의원 측이 제출한 의견서를 반환해달라는 취지의 신청서를 제출한 것으로 파악됐다. 대북송금 사건으로 수감 중인 이 전 부지사 측은 앞서 외국환거래법 위반 혐의에 대한 대법원 확정판결에 불복해 재심을 청구했다. 이와 관련해 주 의원은 지난 16일 이 전 부지사 측의 재심청구와 형 집행정지 신청을 기각해달라는 내용의 의견서를 수원고법에 냈다. 주 의원은 이 전 부지사 측이 재심을 청구한 진정한 목적은 형사소송법 428조에 따른 형 집행정지 효과를 활용해 석방되는 데 있다고 주장했다. 이 조항은 관할 공소청 검사가 재심청구에 대한 재판이 있을 때까지 형의 집행을 정지할 수 있다는 내용이다. 이 전 부지사 측은 “재심청구인은 형 집행정지 신청을 한 사실이 없다”며 “(주 의원은) 존재하지도 않는 신청을 기각해달라는 것”이라고 반박했다. 변호인단은 “재심청구인은 관련 공소청 검사님께서 재심대상 판결에 의한 형의 집행을 정지해주길 바라고 있긴 하다”면서도 “형소법이 명시적으로 재심청구인에게 형 집행정지 신청권을 보장한 것으로 보이지 않아 이를 신청하지는 않았다”고 덧붙였다. 이 전 부지사 측은 주 의원이 의견서를 제출한 행위는 헌법상 권력분립 원칙과 사법권의 독립을 침해하는 것이라고 날을 세웠다. 변호인단은 “법원에 소송계속 중인 구체적 사건의 재판 내용 자체에 대한 외부적 압력”이라며 “국회의원이라는 공적 지위를 표시해 결론을 요구한 이상 ‘어떠한 외부적인 압력이나 간섭도 받지 않는","category":"사회"},{"title":"의대만 바라보던 최상위권 수험생들…올해는 달랐다","link":"https://n.news.naver.com/mnews/article/215/0001273887","naverLink":"https://n.news.naver.com/mnews/article/215/0001273887","pubDate":"2026-11-25T11:13:11.214329+09:00","author":"네이버뉴스","description":"의대만 바라보던 최상위권 수험생들…올해는 달랐다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"[단독] 공소청, '노태우 일가 비자금' 의혹 노재헌 대사 소환 통보","link":"https://n.news.naver.com/mnews/article/055/0001405667","naverLink":"https://n.news.naver.com/mnews/article/055/0001405667","pubDate":"2026-11-25T11:13:11.214327+09:00","author":"네이버뉴스","description":"▲ 노재헌 주중한국대사 노태우 전 대통령 일가의 비자금 은닉 의혹을 수사하는 공소청이 노 전 대통령의 아들 노재헌 주중한국대사에게 최근 피의자 신분으로 소환을 통보한 것으로 SBS 취재 결과 확인됐습니다. 서울중앙지방공소청 범죄수익환수부(소정수 부장검사)는 이달 초 범죄수익은닉규제법 위반 등 혐의로 입건된 노 대사에게 공소청에 출석해 조사를 받으라고 통보했습니다. 출석 시점은 이달 중순 중국에서 열렸던 아시아태평양경제협력체(APEC) 정상회의를 감안해 이달 하순 이후로 조율 중인데, 노 대사가 다음 달 초 서울에서 열리는 재외공관장 회의 참석차 귀국하는 만큼, 해당 기간 전후 조사하는 방안도 검토되는 걸로 알려졌습니다. 공소청은 노 전 대통령 일가의 불법 비자금 일부가 노 대사가 이사장으로 있는 동아시아문화재단과 노태우센터 등에 유입된 것으로 보고 수사를 진행해 왔습니다. 이번 사건은 최태원 SK그룹 회장과 노소영 아트센터 나비 관장의 이혼 소송 과정에서 노 전 대통령의 비자금으로 추정되는 메모가 드러나면서 시작됐는데, 이후 공소청은 5·18기념재단 등 시민단체로부터 김옥숙 여사와 노 대사, 노 관장 등 노 전 대통령 일가가 비자금을 은닉하고 세금을 포탈했다는 취지의 고발장을 접수했습니다. 공소청은 지난 8월 김 여사의 서울 서대문구 연희동 자택과 동아시아문화재단, 노태우센터 등을 압수수색하기도 했습니다. 공소청은 검사의 직접 수사권이 폐지된 뒤에도 개청일인 지난달 2일부터 90일간 일부 예외 사건에 대한 수사를 이어갈 수 있습니다. 이에 대해 노 대사 측은 SBS와의 통화에서 \"현재 수사가 진행 중인 상황이라 따로 드릴 말씀이 없다\"고 밝혔습니다. (사진=연합뉴스)","category":"사회"},{"title":"전광훈 \"은퇴 목사라 재정 관여 못해\"…102억 불법 정치자금 혐의 부인","link":"https://n.news.naver.com/mnews/article/014/0005609453","naverLink":"https://n.news.naver.com/mnews/article/014/0005609453","pubDate":"2026-11-25T11:13:11.214325+09:00","author":"네이버뉴스","description":"경찰, 지난 23일 정치자금법 위반 혐의 영장 신청 선관위, 교회 자금 102억원 사실상 정치자금 판단 정치자금법 위반 혐의를 받는 전광훈 목사가 25일 구속영장 청구 전 피의자 면담을 위해 서울북부지방공소청으로 출석하고 있다. 뉴시스 [파이낸셜뉴스] 100억원대 교회 자금을 자유통일당에 불법 정치자금으로 건넨 혐의를 받는 전광훈 사랑제일교회 원로목사가 공소청에 출석해 혐의를 부인했다. 전 목사는 자신이 은퇴 목사인 만큼 교회 재정에 관여할 수 없었다고 주장했다. 공소청은 전 목사를 직접 면담한 뒤 구속영장 청구 여부를 결정할 예정이다. 25일 법조계에 따르면 서울북부지방공소청은 이날 오전 10시께부터 전 목사를 상대로 구속영장 청구 전 피의자 면담을 진행하고 있다. 서울경찰청 광역수사단 반부패수사대가 지난 23일 정치자금법 위반 혐의로 전 목사의 구속영장을 신청한 데 따른 절차다. 전 목사는 오전 9시42분께 파란색 정장 차림으로 청사에 도착해 취재진에게 \"벌써 6년 전에 은퇴했다. 은퇴 목사는 재정과 행정에 관여하지 못하게 돼 있다\"고 말했다. 신도들의 기부금을 모아 정치자금으로 사용한 이유를 묻는 질문에는 \"남부구치소에 구속돼 있어서 정치자금을 준지도 몰랐다\"며 \"구속돼 있는데 그걸 어떻게 알겠느냐\"고 반문했다. 구속 가능성에 대해서는 \"검사 면담을 해보고 재판을 통해서 구속되든지 말든지 하는 것\"이라고 답했다. 구속영장 청구 전 피의자 면담은 공소청이 경찰의 구속영장 신청 사건을 검토하면서 피의자를 직접 만나 입장을 듣는 절차다. 공소청은 면담 내용과 수사기록 등을 종합해 구속 필요성과 혐의 소명 정도를 살핀 뒤 영장 청구 여부를 결정하게 된다. 이번 사건의 핵심은 사랑제일교회 자금 약 102억원이 자유통일당에 사실상 정치자금으로 제공됐는지와 이 과정에 전 목사가 관여했는지 여부다. 앞서 중앙선거관리위원회는 지난해 12월 전 목사 등 6명을 정치자금법 위반과 업무상 횡령·배임 혐의로 고발했다. 선관위에 따르면 자유통일당은 2020년부터 2025년 상반기까지 사랑제일교회로부터 31차례에 걸쳐 약 102억원을 금전대차계약 형식으로 빌렸다. 그러나 원금과 이자를 대부분 갚지 않았고, 선관위는 이를 사실상의 정치자금 기부에 해당한다고 판단했다. 현행 정치자금법 제31조는 국내외 법인이나 단체의 정치자금 기부를 금지하고 있다. 법인이나 단체와 관련된 자금으로 정치자금을 기부하는 행위 역시 허용하지 않는다. 경찰은","category":"사회"},{"title":"경인고속도로 부평IC 진입로서 크레인 넘어져…차량 정체","link":"https://n.news.naver.com/mnews/article/001/0016462215","naverLink":"https://n.news.naver.com/mnews/article/001/0016462215","pubDate":"2026-11-25T11:13:11.214323+09:00","author":"네이버뉴스","description":"넘어진 크레인 [인천소방본부 제공. 재판매 및 DB 금지] (인천=연합뉴스) 홍현기 기자 = 25일 오전 9시 40분께 인천시 계양구 작전동 경인고속도로 부평IC 진입 도로에서 크레인이 넘어졌다. 이 사고로 인명피해는 없었으나 크레인이 도로를 막아 고속도로 입구가 통제되면서 차량 정체가 빚어졌다. 경찰은 고속도로 전광판 관련 작업을 하던 중 크레인이 넘어진 것으로 보고 구체적인 경위를 조사하고 있다. 계양구와 부평구는 안전안내문자로 사고 소식을 알리면서 \"차량 통행에 어려움이 있으니 도로 이용에 참고해달라\"고 당부했다. 경찰 관계자는 \"견인차를 불렀으나 현장 조치를 하는데 3시간 정도가 걸릴 것으로 예상한다\"며 \"최대한 신속하게 조치할 계획\"이라고 말했다. hong@yna.co.kr","category":"사회"},{"title":"[단독] 대체 무슨 말인지... 교육부의 '교육교부금 개편' 엉터리 설명글","link":"https://n.news.naver.com/mnews/article/047/0002537150","naverLink":"https://n.news.naver.com/mnews/article/047/0002537150","pubDate":"2026-11-25T11:13:11.214308+09:00","author":"네이버뉴스","description":"문장 4개에 단어 오용 등만 11개, 환각 현상 AI가 작성?... 교육부 \"기획예산처 작성, 이후 비문 수정 공유 못 받아\" ▲ 교육부가 24일 페이스북 등에 올려놓은 홍보 글귀. 취재 뒤인 25일, 교육부는 해당 내용을 서둘러 지웠다. ⓒ 교육부 교육부가 논란이 된 지방교육재정교부금(교육교부금) 개편의 정당함을 홍보하면서 심각한 비문을 남발하는 엉터리 글귀를 사용한 것으로 확인됐다. \"학령인구 갈등율을 인물해 산정하는 내용 환영\"? 25일 가 확인해 보니, 교육부는 지난 24일 오후 부처 공식 페이스북 계정에 '교육교부금 산정 방식 이렇게 바뀝니다'란 제목의 카드뉴스를 올리면서 네 문장의 설명 글을 함께 적었다. 그런데 단어 오용 및 문법에 맞지 않는 사용이 최소 11개에 달하는 것으로 나타났다. 교육부 페이스북 계정의 팔로워는 현재 14만 명이다. 다음은 교육부가 올린 글 전체 내용이다. \"사업장과 학령인구 가능성을 함께 끌어들이는 지방교육재정교부금 산정 방식 개편을 확장합니다. 기존의 교부금은 내국세 변경에 따라 자동으로 존재하거나 설명하는 구조입니다. 이번 개편안은 경상성장률과 학령인구 갈등율을 인물해 교부금을 산정하는 내용을 환영합니다. 경제의 교육 환경의 입장을 함께 고려하는 지방교육재정교부금개편안, 자세한 내용은 카드뉴스를 통해 나라를 확인해 보세요!\" 이 글은 국가기관이 정상적인 검수를 거쳐 올렸다고 보기 어려운 수준이다. 4개 문장에서 말 뜻을 명확하게 전달하는 온전한 문장이 하나도 없기 때문이다. 이에 따라 일각에선 '환각을 일으킨 인공지능(AI)이 쓴 것을 그대로 공개한 것이 아니냐'란 의혹도 나온다. 오랜 기간 논술교육을 해온 여미애 교육교부금 개편 긴급행동 집행부(평등교육실현을위한전국학부모회 운영위원장)는 에 \"교육부 공식 게시물은 '경제성장'이 '사업장'으로, '변화율'이 '갈등율'로, '반영해'가 '인물해'로 바뀌어 있는 등 문제가 한둘이 아니다\"라면서 \"사람이 쓴 문장이라고 보기 어렵다. AI나 자동 변환 도구로 만든 글을 아무도 읽어 보지 않고 그대로 올린 것으로 보인다\"라고 짚었다. 이에 대해 교육부는 책임을 기획예산처로 돌리는 듯한 답변을 내놨다. 교육부 관계자는 에 \"관련 내용은 기획예산처가 문구를 작성하여 우리 부와 공동으로 활용하기로 한 것\"이라면서 \"인스타그램을 통해서 두 부처가 공동 게시하고, 나머지 페이스북, 블로그, X에 대해서는 미러링하여 탑재했다\"라고 설명했다","category":"사회"}],"생활·문화":[{"title":"\"뱃속에 거지가 들었나\" 편의점 라면먹고 아이스크림까지... 과음 후 '가짜 배고픔' [똑똑한웰니스]","link":"https://n.news.naver.com/mnews/article/014/0005609305","naverLink":"https://n.news.naver.com/mnews/article/014/0005609305","pubDate":"2026-11-25T11:13:12.498303+09:00","author":"네이버뉴스","description":"/사진=제미나이 [파이낸셜뉴스] 술자리가 잦아지는 연말, 술을 마시고 나면 유독 아이스크림이나 라면과 같은 탄수화물이 간절해질 때가 있다. 이는 단순한 주사나 식탐이 아니라 알코올이 간의 대사를 교란해 만든 '가짜 배고픔'이다. 술과 함께 단 음식이나 탄수화물을 다량 섭취할 경우 '혈당 스파이크'의 우려가 있는 만큼, 연말 술자리에서도 '섭취 공식'을 지키려는 노력이 필요하다. 술 마시면 탄수화물 처리는 뒷전... 단 음식이 당기는 이유 알코올이 체내로 들어오면 간은 알코올 분해를 최우선으로 처리한다. 알코올은 체내 저장 공간이 없는 데다, 분해 과정에서 생기는 '아세트알데하이드'가 세포와 DNA를 공격하는 독성 물질이기 때문이다. 그 결과 탄수화물이나 지방 연소 같은 영양소 대사는 뒷전이 된다. 탄수화물 대사가 뒤로 밀리면 탄수화물을 통해 혈당을 유지하는 과정인 '포도당 신생합성(gluconeogenesis)' 경로도 차단된다. 포도당 공급이 부족해지면 혈액 속 당 농도가 떨어지며 일시적 저혈당 상태가 찾아온다. 이렇게 되면 포도당을 유일한 연료로 쓰는 뇌가 혈당을 즉각 끌어올릴 수 있는 달콤한 음식이나 라면과 같이 탄수화물로 만들어진 음식을 찾게 되는 것이다. 이에 더해 알코올은 포만감에 관여하는 호르몬을 교란해 폭식을 유도한다. 포만감을 주는 호르몬 '렙틴' 분비는 줄이고, 식욕을 돋우는 '그렐린' 분비를 늘린다. 평소라면 피했을 야식, 폭식으로 이어지는 이유다. 과음으로 인해 충동을 억제하는 전두엽 기능까지 둔화되면 식욕 억제는 더욱 어려워진다. 혈당 스파이크 막으려면 '채소-단백질-탄수화물' 순서 지켜야 술자리 혈당 스파이크를 막기 위해서는 술자리에서 몇 가지 규칙을 지키는 것이 좋다. 첫 번 째 규칙은 안주를 먹을 때 '식이섬유-단백질-탄수화물' 순서를 지키는 것이다. 첫 잔을 들기 전 샐러드나 채소 스틱, 해조류 등 식이섬유를 먼저 섭취하면 장내에 일종의 그물망이 형성돼 당질과 알코올의 흡수 속도를 늦춘다. 이어 두부, 생선회, 달걀, 기름기 적은 살코기 등 단백질 안주를 곁들이면 간의 해독 효소 생성을 돕고 급격한 인슐린 분비를 막는데 도움이 될 수 있다. 라면, 볶음밥 등 탄수화물 위주의 안주는 최대한 뒤로 미루고 양을 조절해야 한다. 술 한 잔을 마실 때마다 같은 양의 미온수를 번갈아 마시면 혈중 알코올 농도를 희석하고 탈수로 인해 혈당이 급격히 농축되는 현상을 방어할 수 있다. 삶을 건강하고","category":"생활·문화"},{"title":"영하권 강추위 한풀 꺾인다…서울 아침 5도·낮 16도 [내일날씨]","link":"https://n.news.naver.com/mnews/article/421/0009308532","naverLink":"https://n.news.naver.com/mnews/article/421/0009308532","pubDate":"2026-11-25T11:13:12.498277+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"탈모치료제 건보 적용으로 약값 부담↓…‘치료 전 사진’ 없어 환자들 난감","link":"https://n.news.naver.com/mnews/article/022/0004177922","naverLink":"https://n.news.naver.com/mnews/article/022/0004177922","pubDate":"2026-11-25T11:13:12.498273+09:00","author":"네이버뉴스","description":"올루미언트 급여 적용 후 조선대병원 환자 20여명 어려움 겪어 심평원 “탈모 범위 확인할 객관적 자료 필요”…사진 제출 방침 유지 건강 보험을 적용받아 탈모 치료제를 복용하던 환자들이 치료 전 두피 사진이 없어 고가의 약값 전액을 부담해야 할 처지에 놓였다. 게티이미지뱅크 탈모 치료제에 건강보험이 적용되면서 환자들의 약값 부담이 줄었지만, 치료 전 두피 사진이 없다는 이유로 일부 환자가 보험 혜택을 받는 데 어려움을 겪고 있다. 치료 전 탈모 상태를 입증할 자료를 확보하지 못한 환자들은 급여 적용이 제한되거나 이미 받은 보험 혜택을 환수당할 가능성까지 우려하고 있다. 25일 조선대병원 등에 따르면 올루미언트를 복용하는 환자 20여명이 과거 두피 사진을 제출하지 못해 건강보험 적용에 어려움을 겪고 있다. 올루미언트는 2023년 3월 국내에서 성인 중증 원형탈모 치료제로 허가받은 약이다. 올해 7월부터 건강보험 급여가 적용되면서 기존 월 50여만원이던 약값은 10여만원 수준으로 줄었다. 문제는 건강보험심사평가원의 급여 심사 과정에서 불거졌다. 심평원은 의사 소견이나 진료 기록만으로는 투약 전 탈모 정도를 객관적으로 평가하기 어렵다며 치료 전 두피 상태를 확인할 수 있는 사진을 요구하고 있다. 급여 적용을 받으려면 머리카락의 50% 이상이 빠졌거나, 20~50%가 빠지면서 눈썹까지 탈모가 진행된 경우 등 급여 기준을 충족해야 한다. 스테로이드나 면역억제제 등 기존 약물로 3개월 이상 치료했음에도 호전되지 않았다는 요건도 갖춰야 한다. 그러나 건강보험 적용 전부터 비급여로 치료받은 환자들은 두피 사진을 별도로 촬영해두지 않은 경우가 많다. 탈모가 심한 모습을 남기는 것을 꺼려 사진을 찍지 않은 환자도 있다. 치료를 시작한 뒤 머리카락이 일부 자라난 경우에는 현재 사진만으로 과거 탈모 상태를 입증하기도 어렵다. 환자들은 다시 월 50여만원의 약값을 부담해야 할 가능성과 함께, 그동안 적용받은 건강보험 급여가 환수될 수 있다는 우려도 제기하고 있다. 병원별로는 환자 대응에 차이가 있었다. 전남대병원은 환자 접수 단계부터 두피 사진을 촬영하고 있어 사진 제출 문제로 급여 적용에 어려움을 겪는 사례는 없다고 전했다. 심평원은 급여 기준 충족 여부를 판단하려면 객관적인 자료가 필요하다는 입장이다. 이에 따라 치료 전 사진 제출을 요구하는 방침을 변경할 계획은 없다고 밝혔다. 심평원 관계자는 “보험 적용을 받으려면 탈모 범위를","category":"생활·문화"},{"title":"방송용 '반짝스타'였던 아기 호랑이… 목줄과 외로움에 맞서야 했다","link":"https://n.news.naver.com/mnews/article/469/0000967610","naverLink":"https://n.news.naver.com/mnews/article/469/0000967610","pubDate":"2026-11-25T11:13:12.498265+09:00","author":"네이버뉴스","description":"[이름 있는 동물들] 호랑이 크레인 ※'이름 있는 동물들'은 사람들에게 이름을 남긴 동물들의 생애를 되짚어봅니다. 그들의 삶을 통해 드러난 동물복지 문제와 이후의 변화를 살펴보고, 지금도 비슷한 처지에 놓인 동물들을 조명합니다. 목줄을 맨 어린 크레인(왼쪽)과 다 자란 뒤 서울대공원에서 지내던 크레인. 시네마달, 서울대공원 제공 목줄에 묶여 지냈던 아기호랑이 '크레인' \" 이상하게 생긴 호랑이 가 있긴 한데… 이름은 크레인 , 크레인 맞아요.\" 2012년 11월 12일, 강원 원주시 치악산 드림랜드 . 하루 입장객이 두 자릿수도 되지 않는 한적한 동물원에서 사육사는 ' 서울대공원에서 온 호랑이' 를 찾는 이들에게 말했다. 호랑이는 비쩍 마른 몸에 송곳니가 튀어나온 모습이었다. 호랑이 '크레인'의 어린 시절을 영화 '작별'에 담았던 황윤 다큐멘터리 감독 이 이름을 부르자 크레인은 킁킁 소리를 내며 철창에 다가왔다. 황 감독이 크레인을 마지막으로 본 지 6년 만이었다. 크레인은 2000년 서울대공원에서 태어난 뒤 지방 동물원으로 보내졌다가 그 동물원이 경영난에 처하자 서울대공원으로 돌아왔다. 이 여정엔 17년에 걸친 크레인의 기구한 삶과, 이를 알린 황 감독, 전채은 동물을위한행동 대표 , 시민들의 노력이 있었다. 이들의 기억과 당시 보도를 종합해 그 삶을 따라가 봤다. 튼튼하게 오래 살라고 붙여준 이름 '크레인' 아기 시절 크레인. 귀여운 외모로 큰 사랑을 받았지만 크레인은 큰 고통을 감내해야 했다. 시네마달 제공","category":"생활·문화"},{"title":"밤마다 '먹방'에 간식 찾아…10명 중 8명 \"미디어 콘텐츠, 건강에 영향\"","link":"https://n.news.naver.com/mnews/article/008/0005446054","naverLink":"https://n.news.naver.com/mnews/article/008/0005446054","pubDate":"2026-11-25T11:13:12.498254+09:00","author":"네이버뉴스","description":"서울대 건강문화사업단, 성인 1022명 '미디어·식습관 조사' 먹방 자주 볼수록 '당분' 높은 간식 섭취율 높아져 미디어 영향 체감할수록 설탕부담금 등 정책 지지 AI(인공지능) 생성 이미지. /사진=챗GPT '먹방'(먹는 방송)과 식품 광고가 자신의 식습관과 건강에 영향을 준다고 느끼는 성인이 10명 중 8명꼴인 것으로 나타났다. 특히 먹방을 자주 볼수록 당분이 높은 간식을 먹는 비율도 높아졌다. 서울대학교 건강문화사업단은 한국리서치에 의뢰해 전국 만 20세 이상 성인 1022명을 대상으로 미디어 접촉 및 건강 정책 인식을 조사한 결과 이같이 나타났다고 25일 밝혔다. 사업단은 건강 습관에 영향을 줄 수 있는 미디어 콘텐츠로 △식품 광고 △먹방 △주류 광고 △흡연 장면 네 가지를 골라 각각 콘텐츠가 건강 습관에 얼마나 영향을 주는지 물었다. /사진제공=서울대학교 건강문화사업단","category":"생활·문화"},{"title":"\"반주 1잔 정도는 괜찮겠지\" 했는데…10년 추적 결과 '충격' [건강!톡]","link":"https://n.news.naver.com/mnews/article/015/0005357934","naverLink":"https://n.news.naver.com/mnews/article/015/0005357934","pubDate":"2026-11-25T11:13:12.498241+09:00","author":"네이버뉴스","description":"과음군 10년 위험 43%↑ 소량 음주도 7%↑ \"같은 양이면 자주 마실수록 위험 더 높아\" 사진=게티이미지뱅크 같은 양의 술을 마셔도 자주 나눠 마시는 사람이 한 번에 몰아 마시는 사람보다 위암 위험이 높은 것으로 나타났다. 50~69세 국내 성인 600만여 명을 최대 10년간 추적한 연구 결과에서다. 술을 가장 많이 마신 집단은 마시지 않은 집단보다 10년 안에 위암이 생길 위험이 43% 컸다. 김충호·박보미 중앙대 의대 예방의학교실 연구팀과 국립암센터 등 공동 연구진은 2010~2011년 국가건강검진을 받은 50~69세 성인 600만7469명의 자료를 분석했다. 결과는 국제학술지 유럽역학저널(European Journal of Epidemiology)에 지난 8월 22일 온라인으로 먼저 실렸다. 연구진은 하루 알코올 섭취량(g)에 따라 대상자를 비음주·소량·중등도·고음주·과음 등 5단계로 나눴다. 위암 위험은 소량에서 과음으로 갈수록 단계적으로 커졌다. 비음주군과 비교한 과음군의 위험비는 5년 기준 1.46(95% 신뢰구간 1.41~1.51), 10년 기준 1.43(1.39~1.47)이다. 소량 음주군의 위험비도 5년 기준 1.08(95% 신뢰구간 1.05~1.11), 10년 기준 1.07(1.04~1.10)로 작지만 통계적으로 유의하게 높았다. 연구진은 하루 한 잔(순수 알코올 8g) 이상 마시면 위암 위험이 커지는 것과 관련이 있다며 음주를 줄이라는 권고와 맞아떨어지는 결과라고 설명했다. 술과 위암의 연관성은 여성보다 남성에게서 더 강했다. 연구진은 총 음주량과 별도로 음주 횟수, 한 번에 마시는 양을 따져 음주 패턴도 분석했다. 같은 음주량 구간 안에서는 자주 마신 사람의 위암 위험이 몰아 마시는 경향을 보인 사람보다 컸다. 다만 이것은 총량이 같을 때 두 패턴을 비교한 결과였다. 몰아 마시기가 안전하다는 뜻은 아니다. 연구진은 소량 음주와 위암의 연관성을 신중하게 해석해야 한다고 밝혔다. 추가 변수를 보정한 민감도 분석에서는 이 연관성이 약해졌기 때문이다. 술이 위암을 비롯한 여러 암의 위험을 높인다는 근거는 계속 쌓이고 있다. 국립암센터도 국민 암예방 수칙에서 '암 예방을 위해 하루 한두 잔의 소량 음주도 피하라'고 권했다. 이번 연구에서도 하루 한 잔 이상만 마셔도 위암 위험이 높아지는 경향이 나타났다. 같은 양이라면 자주 나눠 마시는 습관이 더 위험할 수 있다는 결과도 나왔다. 그렇다고 한 번","category":"생활·문화"},{"title":"LA 시청에 걸린 태극기…1942년 한인 독립운동 되살렸다","link":"https://n.news.naver.com/mnews/article/079/0004213646","naverLink":"https://n.news.naver.com/mnews/article/079/0004213646","pubDate":"2026-11-25T11:13:12.498239+09:00","author":"네이버뉴스","description":"'신한민보' 등 고신문 19권 2000장 복원 1942년 8·29 현기식 화보·영문판 기록 확인 '신한민보' 1942년 9월 3일자 '8·29 현기식' 화보(왼쪽)와 8월 27일자 영문판(오른쪽) 복원 후 모습. 국립중앙도서관 제공 116년 전 미국에서 창간돼 한인들의 독립운동을 기록했던 신문 '신한민보'가 복원됐다. 1942년 미국 로스앤젤레스 시청에 태극기를 게양한 모습부터 독립유공자가 수십 년간 신문을 모으며 남긴 손글씨까지 당시의 흔적이 되살아났다. 국립중앙도서관은 1909년 2월 10일 자 '신한민보' 창간호와 1945년 10월 5일 자 '자유신문' 창간호 등 고신문 귀중본 19권, 2000장을 복원했다고 25일 밝혔다. '신한민보'는 1909년 미국 샌프란시스코에서 국민회(이후 대한인국민회)의 기관지로 창간된 신문이다. 한글 지면과 함께 영문판 '더 뉴 코리아(The New Korea)'를 발행하며 미주 한인 사회의 소식과 독립운동 활동을 알렸다. 특히 1942년 9월 3일 자에는 국권을 빼앗긴 날인 8월 29일을 기억하기 위해 로스앤젤레스 시청에 태극기를 게양한 '8·29 현기식' 화보가 실려 있다. 일제강점기 해외 한인들이 독립 의지를 이어간 모습을 보여주는 기록이다. 이번에 복원한 '신한민보'는 독립유공자 양주은(1879~1981) 선생 부부가 수십 년간 수집해 직접 제본한 자료다. 1966년 국립중앙도서관에 기증한 9권 가운데 귀중본으로 지정된 8권이 복원됐다. 책 앞장에는 신문을 오려 내거나 훼손하지 말아 달라는 양 선생의 손글씨 당부도 남아 있다. 도서관은 표지 안쪽에 붙어 있던 사진과 메모까지 열화 방지 처리를 마쳤다. '신한민보' 복원 전후 모습(1909년 11월 10일 자 제158호 좌측·11월 3일 자 제157호 우측). 국립중앙도서관 제공","category":"생활·문화"},{"title":"큐로셀 ‘림카토’ 약가 책정에 上…HLB생명과학, 합병 재도전에도 16.8%↓[바이오 맥짚기]","link":"https://n.news.naver.com/mnews/article/018/0006415112","naverLink":"https://n.news.naver.com/mnews/article/018/0006415112","pubDate":"2026-11-25T11:13:11.964011+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월24일 08시15분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. [이데일리 김새미 기자] 미국발(發) 인공지능(AI)·반도체주 폭락 쇼크에 정부가 18년 만에 증권시장안정펀드(증안펀드) 카드를 내밀었지만 ‘블랙먼데이’를 막기엔 역부족이었다. 이런 상황에서도 큐로셀(372320)은 국산 1호 CAR-T 치료제 ‘림카토’의 건강보험 약가 책정 소식에 상한가를 기록했다. 반면 HLB생명과학(067630)은 합병 발표 이후 급등한 지 하루 만에 16% 넘게 하락했고 바이오니아(064550)는 공매도 금지에도 12%대 하락했다. 최근 큐로셀 주가 추이 (자료=KG제로인 엠피닥터) 큐로셀 ‘림카토’ 건보 약가 책정에 上…내달부터 매출 기대 이날 KG제로인 엠피닥터(MP DOCTOR)에 따르면 큐로셀은 전거래일 대비 6350원(29.95%) 오른 2만7550원에 거래를 마쳤다. 큐로셀이 국산 1호 키메라항원수용체 T세포(CAR-T) 치료제 ‘림카토’의 건강보험 약가 책정 소식에 시가부터 상한가에 도달한 뒤 장 마감까지 주가를 유지했다. 앞서 큐로셀은 지난 20일 림카토의 국민건강보험공단 약가 협상을 마쳤다고 밝혔다. 림카토의 1회 투여당 보험약가 상한금액은 약 2억8000만원으로 책정됐다. 회사는 보건복지부 건강보험정책심의위원회 심의와 관련 고시 절차를 거쳐 내달 1일부터 건강보험이 적용될 것으로 예상하고 있다. 림카토는 재발성·불응성 거대 B세포 림프종 환자를 대상으로 개발된 CAR-T 치료제다. 지난 4월 식품의약품안전처로부터 품목허가를 받았으며, 임상 2상에서 객관적 반응률(ORR) 75.3%, 완전관해율(CR) 67.1%를 기록했다. 림카토에 건강보험이 적용되면 고가의 치료비 부담이 줄어 환자 접근성이 개선될 것으로 기대된다. 큐로셀은 급여 적용 시점에 맞춰 주요 의료기관과 공급·투약 준비를 진행하고 있다. 큐로셀 관계자는 “건강보험 적용 외에 (상한가에 이를 만한) 다른 이유는 없는 것 같다”며 “12월 1일부터 건강보험이 적용돼 환자들이 치료받을 수 있게 되는 만큼 회사 입장에서는 매출이 발생한다는 점이 중요한 이벤트 중 하나”라고 말했다. 건강보험 급여 적용 이후 실제 환자 투여 건수와 제품 매출이 얼마나 빠르게 증가하는지가 향후 큐로셀의 실적을 가늠할 포인트가 될 전망이다. 아직 림카토의 구체적인 매출 전망치는 제시되지 않았다. 큐로셀은 내년 1~2분기 매출 추이를 살펴본 뒤","category":"생활·문화"},{"title":"\"기본소득으로 쏜다\", 돈 주는 정책 넘어 '살맛 나는 농어촌 기본사회'로","link":"https://n.news.naver.com/mnews/article/047/0002537143","naverLink":"https://n.news.naver.com/mnews/article/047/0002537143","pubDate":"2026-11-25T11:13:11.214376+09:00","author":"네이버뉴스","description":"대통령직속 기본사회위·옥천군 좌담회... 주민 돌봄·일자리 연결이 관건 ▲ 24일 오후 2시 충북 옥천군 안남면 다목적회관에서 열린 대통령직속 기본사회위원회 농어촌기본소득특별위원회·옥천군 공동 정책 좌담회가 열리고 있다. ⓒ 심규상 24일 오후 2시 충북 옥천군 안남면 다목적회관에서 열린 대통령직속 기본사회위원회 농어촌기본소득특별위원회·옥천군 공동 정책 좌담회에서 한인정 특위 위원은 농어촌 기본소득이 단순한 용돈·지역화폐 지원을 넘어 '농어촌 기본사회'로 나아가는 길목에 서 있다고 짚었다. 농어촌기본소득 시범사업은 2026년 10개 군에서 시작해 17개 군으로 늘었고, 정부는 2027년 대상을 35개 군 수준으로 넓히고 국비 부담률도 40%에서 50%로 높이는 방안을 추진 중이다. 전국 농어촌 지역이 주목할 수밖에 없는 변화라는 평가가 나온다. 실제 시범사업 지역인 옥천군의 성과도 제시됐다. 최영찬 옥천군 기획예산담당관에 따르면 옥천군은 신청일 직전 30일 이상 주민등록을 두고 실거주하는 군민에게 매월 15만 원을 '향수OK카드'로 지급하고 있다. 사용 기한은 읍 주민 90일, 면 주민 180일(미사용 시 자동 소멸)이다. 면 주민도 병원·약국·안경원·학원·영화관·문구점·군 생활체육시설 등 7개 업종은 옥천읍에서 쓸 수 있고, 편의점·주유소·면 하나로마트·택시는 합산 5만 원까지만 쓸 수 있도록 설계됐다. 매출보다 중요한 건 '동네 가게 진열대'의 변화 시행 뒤 옥천군 인구는 2025년 11월 말 4만 8409명에서 2026년 10월 말 5만 812명으로 2403명(4.96%) 늘어 '5만 인구'를 회복한 것으로 나타났다. 지급액 642억 4700만 원 중 618억 500만 원이 쓰여 사용률 96.2%(읍 98.5%, 면 92.8%)를 기록했고, 가맹점은 280곳 늘었다고 밝혔다. 한 위원은 이날 주제 발제에서 \"정책의 진짜 효과를 보려면 면 지역 동네 가게가 어떻게 달라졌는지부터 살펴야 한다\"고 강조했다. 시골 면 단위에서는 가까운 가게 한 곳이 어떤 물건을 갖춰 두느냐가 주민 일상을 크게 좌우한다는 것이다. 가맹점 수나 전체 매출만 따질 게 아니라, 기존 가게가 떼어 오는 물건과 재고, 파는 품목이 넓어졌는지를 봐야 한다는 설명이다. 실제 옥천 현장에서도 비슷한 변화가 나타났다고 짚었다. 한 위원은 \"군북면에서는 기존 편의점을 기본소득 맞춤형 소매점으로 바꾸고 거동이 불편한 대촌리 어르신들에게 마트 물품을","category":"생활·문화"},{"title":"경북교육청, 27일 교육공무직 총파업 대비…급식·돌봄 대책 마련","link":"https://n.news.naver.com/mnews/article/421/0009308623","naverLink":"https://n.news.naver.com/mnews/article/421/0009308623","pubDate":"2026-11-25T11:13:11.214298+09:00","author":"네이버뉴스","description":"급식 어려운 학교는 대체식·학사일정 조정 검토 경북교육청은 24일 인공지능(AI)과 스마트기기를 이용한 내신 부정행위를 막기 위해 2학기 두 번째 정기시험부터 적용할 예방 수칙을 마련한다. ⓒ 뉴스1 김대벽 기자 (안동=뉴스1) 김대벽 기자 = 경북교육청은 25일 전국학교비정규직연대회의가 27일 총파업을 예고함에 따라 학교 급식과 돌봄 대책을 마련했다고 밝혔다. 급식이 어려운 학교는 여건에 따라 대체식을 제공하거나 학사일정을 조정하는 방안을 검토한다. 돌봄·특수교육·유아교육에는 파업에 참여하지 않는 직원 등 학교 안에서 활용할 수 있는 인력을 배치할 계획이다. 교육청은 26일부터 파업 종료 때까지 상황실을 운영하고, 교육지원청과 학교를 통해 학교별 파업 참여 인원과 급식·돌봄 운영 상황을 파악한다. 연대회의는 지방교육재정교부금 개편 반대와 학교 비정규직 저임금 문제 해결을 요구하고 있다. 임종식 경북교육감은 “총파업으로 학생들의 교육활동과 급식·돌봄 등 필수 교육서비스에 차질이 발생하지 않도록 철저히 준비하겠다”고 말했다.","category":"생활·문화"}],"세계":[{"title":"中학자, 젠슨황 복귀에 \"못 믿을 美…오늘 풀고 내일 막을 수도\"","link":"https://n.news.naver.com/mnews/article/421/0009308502","naverLink":"https://n.news.naver.com/mnews/article/421/0009308502","pubDate":"2026-11-25T11:13:11.562716+09:00","author":"네이버뉴스","description":"中학자, 젠슨황 복귀에 \"못 믿을 美…오늘 풀고 내일 막을 수도\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"이달 국제유가 급락…이젠 중동긴장보다 공급증가가 우위","link":"https://n.news.naver.com/mnews/article/001/0016461918","naverLink":"https://n.news.naver.com/mnews/article/001/0016461918","pubDate":"2026-11-25T11:13:11.562702+09:00","author":"네이버뉴스","description":"벤치마크 브렌트유 23% ↓…잇단 유조선 피해 속에서도 하락 호르무즈 해협의 유조선 [AP=연합뉴스 자료사진. 재판매 및 DB 금지] (서울=연합뉴스) 황정우 기자 = 이달 들어 국제 유가 하락세가 지속되고 있다. 호르무즈 해협 주변에서 유조선과 화물선이 기뢰와 충돌하거나 발사체에 맞는 피해가 잇따르고 있음에도 호르무즈 해협을 통한 원유 공급 물량이 증가하는 조짐이 이러한 하락세를 이끄는 것으로 분석된다. 국제 유가 벤치마크인 브렌트유는 지난달 30일 이란 전쟁 확전 우려와 호르무즈 해협의 원유 수송 차질 가능성에 배럴당 118달러까지 치솟은 뒤 하락세로 돌아섰다. 24일(현지시간) ICE선물거래소에서 내년 1월 인도분 브렌트유 선물 종가는 배럴당 91.40달러로 전 거래일보다 2.27% 올랐다. 내년 1월 인도분 WTI 선물 종가는 2.35% 오른 배럴당 82.05달러로 마감했다. 이날 국제 유가는 장중에는 공급 과잉 우려에 약 3개월 만에 최저 수준으로 떨어졌다가 호르무즈 해협 인근에서 선박들이 공격받았다는 소식에 상승세로 돌아서는 흐름을 보였다. 이란 해군 공보실은 이날 오전 호르무즈 해협 동부 제한 구역에 진입한 유조선 2척이 기뢰와 충돌해 화재가 발생하고 기동력을 상실했다고 밝혔다. 이란은 자국의 요구가 받아들여질 때까지 호르무즈 해협에 대한 통제를 강화하겠다고도 위협했다고 이란 반관영 타스님 통신이 보도했다. 이날 브렌트유와 WTI 선물 종가는 지난달 30일 장중 고가 대비 각각 23%, 26% 급락한 수준이다. 도널드 트럼프 미국 대통령이 미국 중간선거 이후 이란에 대한 추가 공습을 보류한 가운데 페르시아만 지역의 원유 수출이 급증한 영향이다. 이번 4분기 원유 시장은 공급 과잉으로 돌아설 것이라는 게 국제에너지기구(IEA)의 전망이다. 미즈호시큐리티스 USA의 에너지 선물 부문 책임자인 로버트 야우거는 \"현 상황은 간헐적으로 충돌 상황이 일어나는, '전쟁이면서도 전쟁은 아닌' 상태에 가깝다\"고 블룸버그 통신에 말했다. 그는 이런 시나리오에서는 \"공급 과잉이 앞으로 몇 주 동안 시장의 주된 화두가 될 것\"이라고 덧붙였다. jungwoo@yna.co.kr","category":"세계"},{"title":"美, 이르면 오늘 '과잉생산' 관세 발표…韓 총관세율 15% 안 넘길듯(종합)","link":"https://n.news.naver.com/mnews/article/003/0014343590","naverLink":"https://n.news.naver.com/mnews/article/003/0014343590","pubDate":"2026-11-25T11:13:11.562700+09:00","author":"네이버뉴스","description":"한미 '15% 상한' 합의…현 '강제노동' 관세 12.5% 외신 \"신규 관세, 각국 旣체결 협정 반영해 적용\" '디지털 조사' 변수…공화 \"韓규제에 707조 손실\" [경주=뉴시스] 도널드 트럼프 미국 행정부가 무역법상 '과잉생산' 조사 결과에 따른 신규 관세율을 이르면 24일(현지 시간·한국 시간 25일 오전) 발표할 계획으로 알려졌다. 한국의 총 관세율은 양국간 합의된 상한선인 15%를 넘기지 않을 것이라는 전망이 나온다. 사진은 지난해 10월29일 경북 경주박물관에서 만난 이재명 대통령과 트럼프 대통령. (사진=대통령실 제공) 2026.11.25. *재판매 및 DB 금지 [서울=뉴시스] 김승민 기자 = 도널드 트럼프 미국 행정부가 무역법상 '과잉생산' 조사 결과에 따른 신규 관세율을 이르면 24일(현지 시간·한국 시간 25일 오전) 발표할 계획으로 알려졌다. 한국의 총 관세율은 양국간 합의된 상한선인 15%를 넘기지 않을 것이라는 전망이 나온다. 폴리티코, 액시오스 등에 따르면 미국무역대표부(USTR)는 이날 밤 한국·중국·일본·유럽연합(EU) 등 16개 교역 상대국에 대한 무역법 제301조 과잉생산 조사 결과 및 신규 관세율을 발표할 예정이다. 다만 시점은 늦춰질 수 있다. 앞서 월스트리트저널(WSJ)은 \"이번주 발표할 것\"이라고 보도했다. 트럼프 행정부가 지난해 4월 전 세계를 대상으로 발표했던 상호 관세가 연방대법원 위법 판결로 무효화되자, USTR은 대체 관세 부과를 위해 지난 3월 무역법 제301조에 따른 각국의 강제노동·과잉생산 문제 조사에 착수했다. 무역법 제301조는 미국 무역에 부담을 주거나 제한을 가하는 외국 정부의 부당·불합리·차별적 조치에 대해 관세 부과 또는 기타 수입 제한 등으로 대응할 수 있게 하는 규정이다. USTR은 지난 6월 강제노동 조사를 먼저 끝내고 한국 등 46개 경제권에 관세 12.5%를, EU 등 14개 경제권에 10% 부과를 권고했다. 한국은 7월24일부터 12.5% 관세가 적용되고 있다. 이후 4개월여 만에 과잉생산 관련 관세 발표가 임박한 가운데, 관건은 강제노동과 과잉생산 관세를 합친 대(對)한국 총 관세율이 한미 정상간 합의 사항인 15% 상한선을 넘길지 여부다. 한국은 지난해 11월 미국과 체결한 한미 무역 협정을 통해 미국에 3500억 달러(470조2250억원)를 투자하는 대신 미국의 대한국 관세 상한을 15%로 하기로 합의했는데, 과잉생산 관세가 2.5","category":"세계"},{"title":"군부 이어 ‘경제 수도’ 수장까지… 시진핑, 상하이 당서기 천지닝 숙청","link":"https://n.news.naver.com/mnews/article/366/0001207159","naverLink":"https://n.news.naver.com/mnews/article/366/0001207159","pubDate":"2026-11-25T11:13:11.562687+09:00","author":"네이버뉴스","description":"‘차기 지도자 후보’ 천지닝 낙마 中 첨단산업 거점 상하이 수장 공백 내년 당대회 앞두고 정치국 4명째 숙청 시진핑 4연임 앞두고 최고위층 물갈이 가속 중국 금융 중심지 상하이를 이끄는 천지닝(陳吉寧) 상하이시 당서기가 반(反)부패 당국 조사를 받게 됐다. 천 서기는 차기 국가 지도자나 부총리 후보로까지 거론되던 핵심 기술 관료였지만, 갑작스럽게 조사를 받으면서 중국 권력 핵심부에서 밀려났다. 중국 공산당 최고 지도부인 중앙정치국 위원 24명 가운데 네 번째 낙마 사례다. 전문가들은 내년 하반기 공산당 전국대표대회(당대회)에서 4연임을 노리는 시진핑 국가주석이 군부에 이어 민정(民政) 최고위층까지 겨냥해 문화대혁명 이후 최대 규모 숙청에 속도를 내고 있다고 분석했다. 천지닝 상하이 당 서기. /연합뉴스 24일(현지시각) 중국 관영 신화사는 천 서기가 “심각한 기율 및 법률 위반 혐의”로 중앙기율검사위원회와 국가감찰위원회 조사를 받고 있다고 발표했다. 중국에서 이 표현은 통상 부패 혐의를 뜻한다. 구체적 혐의 내용은 공개되지 않았다. 상하이시 당위원회 상무위원회는 발표 직후 회의를 열어 중앙 결정에 확고한 지지를 표명하며 “당에 대한 절대적 충성”을 강조했다. 상하이시 정부 공식 플랫폼에서도 천 서기 관련 게시물이 신속히 삭제됐다. 아직 공식 면직 절차는 끝나지 않았지만, 중국에서 최고 사정기관 조사 대상이 된 고위 관료가 공직에 복귀하는 사례는 극히 드물다. 천 서기는 2022년 출범한 현 24인 중앙정치국 체제에서 지난해 이후 네 번째로 낙마한 인물이다. 앞서 군부 최고위 인사인 장유샤와 허웨이둥 전 중앙군사위원회 부주석이 숙청됐고, 올해 7월에는 마싱루이 전 신장위구르자치구 당서기가 부패와 권력 남용 혐의로 출당됐다. 단일 임기 중 정치국 위원 4명이 낙마한 사태는 마오쩌둥 사망 직후였던 1976년 이른바 ‘사인방 숙청’ 이후 최대 규모다. 1989년 톈안먼 사태 직후 격변기보다도 낙마 폭이 크다. 군(軍) 통수기구인 중앙군사위원회도 정원 7명 가운데 시 주석을 포함해 단 2명만 남을 정도로 군부 지휘부가 크게 비었다. 2022년 시 주석 3기 출범 이후 조사나 해임 대상이 된 군 고위 장성은 약 100명에 달한다. 지난해 공산당 기율 당국은 전년보다 10.6% 늘어난 98만3000명을 징계해 역대 최대 기록을 세웠다. 올해 1월부터 9월까지도 성·장관급 이상 고위 관료 100여 명을 포함해 약 68만 명이","category":"세계"},{"title":"이번 달 국제 유가 하락세 지속…이유는?","link":"https://n.news.naver.com/mnews/article/055/0001405659","naverLink":"https://n.news.naver.com/mnews/article/055/0001405659","pubDate":"2026-11-25T11:13:11.562682+09:00","author":"네이버뉴스","description":"▲ 호르무즈 해협의 유조선 이달 들어 국제 유가 하락세가 지속되고 있습니다. 호르무즈 해협 주변에서 유조선과 화물선이 기뢰와 충돌하거나 발사체에 맞는 피해가 잇따르고 있음에도 호르무즈 해협을 통한 원유 공급 물량이 증가하는 조짐이 이러한 하락세를 이끄는 것으로 분석됩니다. 국제 유가 벤치마크인 브렌트유는 지난달 30일 이란 전쟁 확전 우려와 호르무즈 해협의 원유 수송 차질 가능성에 배럴당 118달러까지 치솟은 뒤 하락세로 돌아섰습니다. 현지시간 24일 ICE선물거래소에서 내년 1월 인도분 브렌트유 선물 종가는 배럴당 91.40달러로 전 거래일보다 2.27% 올랐습니다. 내년 1월 인도분 WTI 선물 종가는 2.35% 오른 배럴당 82.05달러로 마감했습니다. 이날 국제 유가는 장중에는 공급 과잉 우려에 약 3개월 만에 최저 수준으로 떨어졌다가 호르무즈 해협 인근에서 선박들이 공격받았다는 소식에 상승세로 돌아서는 흐름을 보였습니다. 이란 해군 공보실은 이날 오전 호르무즈 해협 동부 제한 구역에 진입한 유조선 2척이 기뢰와 충돌해 화재가 발생하고 기동력을 상실했다고 밝혔습니다. 이란은 자국의 요구가 받아들여질 때까지 호르무즈 해협에 대한 통제를 강화하겠다고도 위협했다고 이란 반관영 타스님 통신이 보도했습니다. 이날 브렌트유와 WTI 선물 종가는 지난달 30일 장중 고가 대비 각각 23%, 26% 급락한 수준입니다. 도널드 트럼프 미국 대통령이 미국 중간선거 이후 이란에 대한 추가 공습을 보류한 가운데 페르시아만 지역의 원유 수출이 급증한 영향입니다. 이번 4분기 원유 시장은 공급 과잉으로 돌아설 것이라는 게 국제에너지기구(IEA)의 전망입니다. 미즈호시큐리티스 USA의 에너지 선물 부문 책임자인 로버트 야우거는 \"현 상황은 간헐적으로 충돌 상황이 일어나는, '전쟁이면서도 전쟁은 아닌' 상태에 가깝다\"고 블룸버그 통신에 말했습니다. 그는 이런 시나리오에서는 \"공급 과잉이 앞으로 몇 주 동안 시장의 주된 화두가 될 것\"이라고 덧붙였습니다. (사진=AP, 연합뉴스)","category":"세계"},{"title":"트럼프 행정부, ‘젠슨 황 스캔들’ 와중 과잉생산 관세 발표 임박…韓 15% 관세율 지켜질 듯","link":"https://n.news.naver.com/mnews/article/005/0001887306","naverLink":"https://n.news.naver.com/mnews/article/005/0001887306","pubDate":"2026-11-25T11:13:11.562675+09:00","author":"네이버뉴스","description":"미국 무역대표부 제이미슨 그리어 대표가 지난 11일 중국 선전에서 열린 아시아태평양경제협력체(APEC·에이펙) 회의에 참석한 모습. 연합뉴스 도널드 트럼프 미국 행정부가 무역법 301조에 근거한 ‘과잉생산 관세’ 조사 결과를 곧 발표할 예정인 것으로 전해졌다. 한국과 합의한 관세 상한 15%는 준수될 것이라는 관측이 대체적이다. 트럼프 행정부가 곧 과잉생산 관세를 발표하는 배경에는 젠슨 황 엔비디아 최고경영자(CEO)의 스캔들을 둘러싼 논란에서 여론의 시선을 돌리기 위한 것이라는 해석도 나왔다. 로이터통신은 3명의 소식통을 인용해 미국 무역대표부(USTR)가 중국과 유럽연합(EU), 한국, 일본 등 16개 경제주체를 대상으로 한 과잉생산 조사 결과를 이르면 24일(현지시간) 오후 발표할 것으로 관측된다며 “광범위한 품목에 대한 새로운 수입관세가 부과될 것으로 보인다”고 보도했다. 앞서 월스트리트저널(WSJ)도 이번 주 중 조사 결과가 나올 것으로 예상된다고 전했다. 301조는 미국 대통령이 외국 정부의 차별적이고 불합리한 관행에 대응해 상한 없는 관세 부과, 수입 쿼터 등의 보복 조치를 할 수 있도록 한 조항이다. 트럼프 행정부는 지난 2월 연방대법원이 상호관세 무효 판결을 하자 대체 수단으로 301조 관세를 동원했다. 트럼프 행정부는 지난 3월 강제노동과 제조업 과잉생산 관행에 초점을 맞춘 301조 조사를 개시하겠다고 밝혔다. 이후 지난 6월 한국 등 60개국 경제주체를 상대로 한 강제노동 조사 결과를 발표했고, 한국에는 12.5%의 관세가 부과됐다. 이번에 과잉생산 조사 결과가 발표되면서 추가 관세가 부과될 경우, 이는 기존 강제노동 관세율에 더해질 예정이다. 미국과 일본 등 미국과 대미 투자합의를 맺은 국가들은 기존 합의한 관세 상한선을 넘지 않을 것으로 예상된다. 로이터통신은 “ 백악관은 미국과 체결된 최종 무역협정에 포함된 관세 상한선을 준수할 것으로 예상된다”며 “여기에는 EU, 일본, 한국산 제품에 대한 15% 관세 상한선이 포함된다”고 전했다. WSJ도 “ 최종 관세율은 아직 불분명하지만, 행정부 관리들은 대법원이 2026년 2월 트럼프 대통령의 첫 번째 관세 조치를 무효화하기 전인 2025년에 트럼프가 책정했던 것과 유사한 수준의 관세를 부과할 것이라고 밝혀왔다”며 “한국, 일본, EU는 (최종적으로) 15% 이하의 관세를 적용받을 가능성이 크다”고 내다봤다. 한국은 지난해 미국과 3500억 달","category":"세계"},{"title":"'이제는 공급과잉' 국제유가 고가대비 23%↓","link":"https://n.news.naver.com/mnews/article/374/0000545753","naverLink":"https://n.news.naver.com/mnews/article/374/0000545753","pubDate":"2026-11-25T11:13:11.562670+09:00","author":"네이버뉴스","description":"'이제는 공급과잉' 국제유가 고가대비 23%↓. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"美, 韓 외교·안보라인 교체에 \"한미동맹 긴밀한 협력 중요\"","link":"https://n.news.naver.com/mnews/article/448/0000653190","naverLink":"https://n.news.naver.com/mnews/article/448/0000653190","pubDate":"2026-11-25T11:13:11.562635+09:00","author":"네이버뉴스","description":"美, 韓 외교·안보라인 교체에 \"한미동맹 긴밀한 협력 중요\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"미, 한국·중국·일본·EU 등 관세 조사 결과 이르면 이번 주 발표","link":"https://n.news.naver.com/mnews/article/437/0000522293","naverLink":"https://n.news.naver.com/mnews/article/437/0000522293","pubDate":"2026-11-25T11:13:11.562630+09:00","author":"네이버뉴스","description":"제이미슨 그리어 USTR 대표 〈사진=EPA〉 미국이 이르면 이번 주 한국과 중국, 일본 등 16개 경제주체를 대상으로 진행해 온 과잉생산 관련 관세 조사 결과를 발표할 것이라고 미국 월스트리트저널이 보도했습니다. 미국은 각국 정부의 보조금 지원 등에 따른 과잉생산이 미국 기업에 불리한 무역 환경을 조성했다고 보고 있습니다. 한국의 경우 과잉생산을 이유로 관세가 부과되더라도 기존 강제노동 관련 관세 12.5%와 합쳐 15%를 넘지 않을 것이라는 전망이 많습니다. 미국이 이르면 이번 주 이른바 '과잉생산 관세'와 관련한 조사 결과를 발표할 것으로 보입니다. 각국 정부의 보조금 지원 등으로 제품이 필요 이상으로 생산되면서 미국 기업들이 불리한 경쟁 환경에 놓였다는 게 미국 측의 판단입니다. 우리나라에 적용될 관세율에도 관심이 쏠립니다. 미국 월스트리트저널은 현지시간 24일 미국 무역대표부가 이르면 이번 주 과잉생산 관련 관세 조사 결과를 발표할 것으로 예상된다고 보도했습니다. 조사 대상에는 한국과 중국, 일본, 유럽연합 등 16개 경제주체가 포함됐습니다. 미국은 각국 정부의 보조금 지원이 과잉생산으로 이어졌다고 보고 있습니다. 수요보다 많은 제품이 생산돼, 해외 시장에 싼값에 공급되면서 미국 기업들이 불리한 상황에 놓였다는 겁니다. 미국은 이런 과잉생산을 문제 삼아 지난 3월 무역법 301조에 따라 조사에 착수했습니다. 무역법 301조는 외국 정부의 불공정한 정책에 관세 부과 등으로 대응할 수 있다는 조항입니다. 월스트리트저널에 따르면 미국은 이번 주 관세 부과 계획을 공개할 것으로 보입니다. 이후 대상국의 반박 의견 등을 들은 뒤 관세를 확정할 전망입니다. 다만 발표 일정은 달라질 수 있습니다. 한국에 얼마나 높은 관세가 부과될지가 관심입니다. 미국은 앞서 강제노동으로 만들어진 제품을 다른 나라가 수입하는 것도 문제 삼았습니다. 가령, 강제노동으로 생산된 원자재를 다른 나라가 수입해 완제품을 만든 뒤 미국에 수출하는 경우입니다. 미국은 이런 제품을 수입하거나 수입을 제대로 막지 않는다는 이유로 지난 3월 한국 등 60개 경제주체에 대한 조사에 착수했습니다. 지난 6월 관세 부과 계획을 발표했고, 한 달 뒤 관세율을 확정했습니다. 한국에 적용된 관세율은 12.5%였습니다. 앞서 한국은 지난해 미국에 3500억 달러를 투자하기로 약속하고 관세율을 25%에서 15%로 낮추는 데 합의했습니다. 미국은 합의를 존중하겠다는","category":"세계"},{"title":"\"中 경제 심장 상하이 당서기도 조사받아\"…부패 연루 가능성","link":"https://n.news.naver.com/mnews/article/001/0016461513","naverLink":"https://n.news.naver.com/mnews/article/001/0016461513","pubDate":"2026-11-25T11:13:11.562569+09:00","author":"네이버뉴스","description":"CCTV \"엄중한 기율·법률 위반 혐의\" 천지닝 중국공산당 상하이 당서기 [풀 제공/로이터=연합뉴스. 재판매 및 DB 금지] (상하이=연합뉴스) 차병섭 특파원 = 중국 경제중심지인 상하이의 중국공산당 당서기가 당국의 조사를 받고 있다. 관영 중국중앙(CC)TV는 24일(현지시간) \"중앙정치국 위원이자 상하이시 당서기인 천지닝이 엄중한 기율·법률 위반 혐의로 현재 중앙기율위원회·국가감찰위원회의 심사·조사를 받고 있다\"고 보도했다. 당국이 구체적인 혐의를 밝히지는 않았지만, 통상적으로 기율·법률 위반은 부패와 관련 있는 것으로 받아들여진다. 천 당서기는 2022년 중국공산당 전국대표대회(당대회) 이후 출범한 20기 중앙정치국 위원 가운데 장유샤 전 중앙군사위 부주석, 허웨이둥 전 중앙군사위 부주석, 마싱루이 전 신장위구르자치구 당서기에 이어 4번째로 조사 대상에 올랐다. 앞서 중국공산당은 지난달 26∼29일 제20기 중앙위원회 제5차 전체 회의(20기 5중전회)를 열고 '전면적 종엄치당(전면적이고 엄격한 당 관리)'을 강조한 바 있다. 천 당서기는 올해 1월 이재명 대통령의 중국 방문 당시 만찬을 주최하기도 했다. bscha@yna.co.kr","category":"세계"}],"IT 과학":[{"title":"[그럭저럭 어른 행세] AI가 쓴 영어 소설에 빠진 중1, 영작 수업을 주 4회로 늘렸다","link":"https://n.news.naver.com/mnews/article/047/0002537148","naverLink":"https://n.news.naver.com/mnews/article/047/0002537148","pubDate":"2026-11-25T11:13:12.498243+09:00","author":"네이버뉴스","description":"학습 관리가 쉬워지니 부모의 욕심이 커졌다 【오마이뉴스의 모토는 '모든 시민은 기자다'입니다. 시민 개인의 일상을 소재로 한 '사는 이야기'도 뉴스로 싣고 있습니다. 당신의 살아가는 이야기가 오마이뉴스에 오면 뉴스가 됩니다. 당신의 이야기를 들려주세요.】 ▲ [미나 이야기] 8장 ‘파란 별의 도전’ 아이가 학습한 내용을 바탕으로 생성형 AI 서비스인 챗GPT가 제작한 복습용 영어 소설 ⓒ 임은희 오래된 도서관 문 앞에서 미나는 낡은 카드를 든 준을 만났다. 'Helping a friend is better than winning.' '친구를 돕는 것이 이기는 것보다 낫다.' 카드에 적힌 영어 문장은 아이가 영작 수업에서 배운 비교급을 활용해 AI가 만든 것이다. 아이의 영작 선생님은 생성형 AI다. 는 아이가 그날 연습한 문법을 넣어 챗GPT가 한 편씩 이어 쓰는 영어 소설이다. 아이는 이야기가 재미있다며 일주일에 세 번 하던 영작 수업을 네 번으로 늘렸다. 를 만들 때 입력한 요청 아이가 입력한 영어 문장의 문법과 중학교 교과서 수준의 어휘로 영어 연재 소설을 써줘. 한 편은 한 단락으로 하고, 사춘기 학생이 좋아할 만한 가벼운 로맨스와 학교 미스터리를 담아 12월 30일에 마지막 편이 나오도록 구성해 줘 . 각 문장을 두 번 이상 반복해서 읽고 들을 수 있도록 (1) 본문 전체를 먼저 보여주고 (2)영어 문장을 직독직해용으로 끊어 쓰고 번역을 붙여줘. 아이가 고른 문장으로 만든 영어 소설 아이가 학교 영작 수행평가에서 좋은 점수를 받고 싶다고 했다. 학원에는 다니고 싶지 않다기에 집에서 어떻게 연습할지 고민하다가, 학교에서 배운 문장을 활용하기로 했다. 아이가 고른 문장을 소리 내 읽어 녹음한 파일을 올리면, 챗GPT는 발음에서 고칠 부분을 짚어 준다. 그 문장에 쓰인 단어와 표현, 문법을 바탕으로 그날 연습할 내용도 짠다. 아이가 오디오로 들으며 수업을 따라갈 수 있도록, 설명은 강의 대본처럼 써 달라고 했다. 오디오 모드로 설명을 들은 아이가 영작 문제를 직접 풀면, AI는 그 답을 바탕으로 수업을 이어간다. 아이는 영작을 마친 뒤 소설의 다음 편을 듣고, 번역을 읽으며 잘못 해석한 부분을 고친다. 칭찬을 좋아하는 아이를 위해 수업이 끝나면 AI가 그날 배운 문법을 써서 영어로 칭찬하도록 설계했다. AI로 정리한 한 주의 공부 기록 학교에서 좋은 점수를 받고 싶다는 아이에게 복기 노트 쓰는 법을 가르쳤다","category":"IT 과학"},{"title":"AI 에이전트끼리 거래하는 시대…초소액 결제시장 열릴까","link":"https://n.news.naver.com/mnews/article/028/0002833822","naverLink":"https://n.news.naver.com/mnews/article/028/0002833822","pubDate":"2026-11-25T11:13:11.964019+09:00","author":"네이버뉴스","description":"일을 잘게 쪼개 처리하는 AI 에이전트 필요한 데이터만 한 건씩 결제 가능 “에이전트끼리 거래할 것” 전망 AI 에이전트. 게티이미지뱅크 “1센트(약 13원)짜리 물건을 살 때 신용카드를 쓸 수 있나요?” 미국의 인터넷 기업 클라우드플레어에서 에이전트 부문 결제 책임자인 윌 패퍼가 자주 던지는 질문이다. 특히 누군가 “인공지능(AI) 결제에 꼭 스테이블코인이 필요하냐”고 물으면 반드시 이렇게 되묻는다. 정답은 “현실적으로 쓸 수 없다”이다. 미국의 온라인 카드 결제에는 비율 수수료 말고도 건당 고정 수수료가 붙기 때문이다. 글로벌 결제대행사 스트라이프는 한 건에 결제액의 2.9%와 함께 30센트(약 400원)를 받는다. 1센트를 받으려면 30센트를 더 내야 하는 셈이다. 그런데 이 ‘10원짜리 결제’가 필요한 손님이 나타났다. 인간이 목표를 주면 스스로 일을 쪼개고 처리하는 에이아이 에이전트다. 이전에는 때때로 인간을 불러내기 위해 에이전트가 멈췄다. 인간이 “이 회사 투자해도 될지 알아봐”라고 하면, 에이전트는 주가 자료를 찾고, 재무제표를 읽고, 업계 동향을 읽는다. 무료 자료면 상관이 없지만, 유료 자료일 때 에이전트는 직접 회원 가입을 하거나 결제 정보를 입력하지 못했다. 게다가 특정 시점에 특정 자료를 요구하는 에이전트의 거래 방식에서 구독 모델은 맞지 않았다. 블록체인 분석기업 글래스노드도 원래는 월간·연간 이용료를 매기는 서비스였지만, 이제는 찾아오는 에이전트를 위한 가격표를 따로 만들었다. 자료 1건에 5센트, 그 자료에 대한 설명은 1센트를 받는다. 에이전트는 구독도 회원 가입도 필요 없다. 자료를 요청하면, 서버는 가격을 제시하고, 에이전트는 값을 치른 뒤 자료를 받아간다. 지난해 미국 코인 거래소 코인베이스가 내놓아 현재로서는 가장 널리 쓰이는 ‘엑스(x)402’라는 에이전트 결제 규격(프로토콜)의 방식이다. 기상 정보, 교통 정보 등 에이전트가 필요로 하는 이런 정보는 무수히 많다. 이때 에이전트가 값을 치르는 수단이 주로 암호화폐다. 전적으로 온라인에서 이뤄지고, 몇초 안에 1센트보다 훨씬 작은 금액도 보낼 수 있고, 수수료도 1센트보다 훨씬 적다. 벤처투자사 해시드의 김서준 대표는 지난 5월 “크립토 산업은 지난 10년 동안 인간 사용자를 확보하려 달려왔지만, 앞으로 가장 자연스러운 사용자는 에이아이 에이전트가 될 수 있다”고 말했다. 물론 에이전트에게 코인 지갑을 통째로 맡기는 방식은","category":"IT 과학"},{"title":"전류 잡음 최대 100분의 1로…UNIST, 저잡음 2차원 반도체 트랜지스터 개발","link":"https://n.news.naver.com/mnews/article/011/0004685859","naverLink":"https://n.news.naver.com/mnews/article/011/0004685859","pubDate":"2026-11-25T11:13:11.964002+09:00","author":"네이버뉴스","description":"김명수·윤희인 교수팀, 결함 적고 유전율 높은 절연체 적용 회로 시뮬레이션서 ADC 유효 분해능 최대 1.45비트 향상 정밀 센서·통신 회로 성능 개선 기대…국제학술지에 게재 결정질 희토류 절연체를 이용한 저잡음 2차원 반도체 트랜지스터의 구조와 성능. 연구그림=UNIST 2차원 반도체 트랜지스터의 고질적 문제인 전류 잡음을 크게 줄이는 기술이 나왔다. 절연막 소재를 바꿔 저주파 잡음을 기존 소자보다 최대 100분의 1 수준으로 낮췄다. 실리콘을 대체할 차세대 반도체 소재의 상용화를 앞당길 수 있을 것으로 보인다. 울산과학기술원(UNIST)은 전기전자공학과 김명수 교수팀이 윤희인 교수팀과 공동으로 희토류 산화염화물 절연막을 적용한 이황화몰리브덴(MoS2) 트랜지스터를 개발했다고 25일 밝혔다. 이황화몰리브덴은 대표적인 2차원 반도체 소재다. 원자 수준으로 얇아 실리콘보다 작고 전력을 적게 쓰는 트랜지스터를 만들 수 있다. 문제는 잡음이다. 반도체와 맞닿은 절연체에 결함이 있으면 전자가 붙잡혔다 풀려나기를 반복한다. 이 과정에서 전류가 미세하게 흔들린다. 이런 저주파 잡음은 작은 신호를 정밀하게 처리해야 하는 회로의 성능을 떨어뜨린다. 기존 절연체는 저마다 한계가 있었다. 산화알루미늄, 산화하프늄 같은 산화물 절연체는 유전율이 높아 전류 제어에 유리하다. 하지만 원자 배열이 불규칙해 결함이 많다. 육방정계 질화붕소(h-BN)는 결함이 적은 대신 유전율이 낮다. 유전율은 전압을 걸었을 때 절연체 내부 전하 분포가 얼마나 쉽게 바뀌는지 나타내는 값이다. 연구팀은 두 장점을 모두 갖춘 소재로 란타넘 산화염화물(LaOCl)과 가돌리늄 산화염화물(GdOCl)을 택했다. 이들 희토류 산화염화물은 원자가 층층이 규칙적으로 배열돼 있다. 표면의 염소 원자는 이미 주변 원자와 결합을 마친 상태다. 전자를 붙잡는 불완전한 결합이 그만큼 적다. 유전율은 LaOCl이 평균 11.14, GdOCl이 평균 15.21로 측정됐다. 성능은 수치로 확인됐다. 채널 면적을 보정해 비교한 결과 비정질 산화물 절연체를 쓴 소자보다 저주파 잡음이 10~100배 낮았다. 반도체와 절연체 계면의 유효 결함 밀도는 1.15×10¹⁰~1.94×10¹⁰cm⁻²eV⁻¹로 분석됐다. 결함이 적기로 알려진 h-BN 소자와 비슷한 수준이다. 전력 효율도 높았다. 전류를 10배 늘리는 데 필요한 게이트 전압은 LaOCl 소자가 65.7mV, GdOCl 소자가 63.2","category":"IT 과학"},{"title":"“AI 버블이요? 농담도”…분기매출 2배 찍자 실적전망 세번째 상향한 델","link":"https://n.news.naver.com/mnews/article/009/0005768532","naverLink":"https://n.news.naver.com/mnews/article/009/0005768532","pubDate":"2026-11-25T11:13:11.963994+09:00","author":"네이버뉴스","description":"AI 서버 수요에 어닝 서프라이즈 분기매출 전년比 2배 550억달러 연매출전망 1920억→2020억불 PC시장 성장둔화·메모리값 부담 델의 AI 서버. [델] 미국 컴퓨터·서버 제조업체 델테크놀로지스가 인공지능(AI) 서버 수요 급증에 힘입어 분기 매출을 1년 만에 두 배로 늘렸다. 사상 최대 실적을 바탕으로 연간 매출·이익 전망을 올해 세 번째 높이고, 250억달러 규모의 추가 자사주 매입도 승인했다. 델은 24일(현지시간) 2027회계연도 3분기 매출이 전년 동기 대비 103% 증가한 549억4000만달러를 기록했다고 발표했다. 금융정보업체 LSEG가 집계한 시장 예상치 493억2000만달러를 웃돌았다. 주식 보상 비용 등을 제외한 조정 주당순이익(EPS)은 9.45달러로 예상치 6.59달러를 크게 넘어섰다. 순이익은 56억7300만달러로 266% 늘었다. 성장을 이끈 것은 서버·저장장치 등을 판매하는 인프라솔루션그룹(ISG)이다. 매출은 419억7000만달러로 198% 늘어 전체 매출의 약 76%를 차지했다. 시장 예상치인 352억7000만달러도 뛰어넘었다. 이 가운데 AI 서버 매출은 220억달러로 291% 급증했다. AI 서버는 대규모 데이터를 학습시키거나 AI 서비스를 실행하는 데 쓰는 고성능 컴퓨터다. 델은 엔비디아와 AMD의 AI 반도체 등을 탑재한 서버를 기업과 클라우드 사업자에 공급한다. 내년 1월 끝나는 2027회계연도 연간 매출 전망은 기존 1920억달러에서 2020억달러로 올렸다. 전년보다 78% 늘어난 규모로, 시장 전망인 1944억8000만달러보다도 많다. 연간 AI 서버 매출 전망은 740억달러에서 780억달러로, 조정 EPS 전망은 25.50달러에서 29.68달러로 높였다. 4분기 매출과 조정 EPS도 각각 563억달러와 8.40달러로 제시해 시장 예상인 536억1000만달러와 7.50달러를 웃돌았다. 앞으로 공급해야 할 주문 물량도 쌓이고 있다. 델은 3분기에만 602억달러의 AI 서버 신규 주문을 받았다. 분기 말 수주잔고는 사상 최대인 1323억달러에 달했다. 서버와 저장장치, 네트워크, 소프트웨어를 묶어 기업의 AI 구축·운영을 돕는 ‘델 AI 팩토리’ 도입 고객도 7500곳을 넘었다.","category":"IT 과학"},{"title":"\"글로벌 AIDC 공급, 수요의 30% 수준…한국에 새로운 기회\"","link":"https://n.news.naver.com/mnews/article/014/0005609396","naverLink":"https://n.news.naver.com/mnews/article/014/0005609396","pubDate":"2026-11-25T11:13:11.963977+09:00","author":"네이버뉴스","description":"SKT AI정책연구원 \"AIDC 공급 병목, 단기간 해소 어려워\" 韓, 반도체·전력·통신 역량 기반 글로벌 AI 인프라 거점 가능성 스페인 바르셀로나에서 열린 MWC26에서 SKT 전시관 AI 데이터센터를 보고 있는 모습. SK텔레콤 제공 [파이낸셜뉴스] 글로벌 인공지능 데이터센터(AIDC) 확정 물량이 수요의 3분의 1에도 미치지 못한다는 지적이 제기됐다. 특히 미국 빅테크 기업들이 인공지능(AI) 인프라 거점을 해외로 확장할 가능성이 높아 한국이 글로벌 AI 인프라의 거점이 될 수 기회를 잡을 수 있다는 전망이 제기됐다. 송영웅 SK텔레콤 AI정책연구원은 \"폭증하는 수요에 비해 단기간에 확보할 수 있는 공급은 충분하지 않으며, 이에 따라 미국의 빅테크 기업들이 AI 인프라 거점을 미국 밖으로 확장할 가능성이 커지고 있다\"며 한국에 새로운 성장 기회가 될 수 있다고 분석했다. AI 연산 수요 급증…인프라 공급은 부족 송 연구원은 25일 SK텔레콤 뉴스룸을 통해 \"한국은 메모리 반도체, 데이터센터 시공, 초고압 전력 설비, 초고속 통신망 등 AIDC를 구축하는 데 필요한 탄탄한 역량과 노하우를 갖추고 있다\"고 밝혔다. 글로벌 AI 이용량을 보여주는 '토큰스 퍼 데이(Tokens Per Day)' 인덱스에 따르면 이달 기준 글로벌 토큰 소비량은 일평균 약 450조개로 추산된다. 지난 2024년 1월 2조2000억개에서 약 200배 증가한 수치다. 송 연구원은 AI 연산 수요가 급증하는 배경으로 멀티모달과 AI 에이전트의 확산, 학습에서 추론으로의 연산 수요 변화 등을 꼽았다. 텍스트를 넘어 이미지·영상 등으로 AI 활용 범위가 넓어진 데다 AI 에이전트가 하나의 업무를 처리하기 위해 여러 차례 추론과 데이터 호출을 반복하면서 연산 수요가 늘어나고 있다는 설명이다. 반면 데이터센터 공급은 수요 증가 속도를 따라가지 못하고 있다. 맥킨지는 오는 2030년 글로벌 데이터센터 용량 수요를 충족하려면 연평균 약 25GW 규모의 AI 데이터센터가 새로 구축돼야 한다고 전망했다. 그러나 AI 인프라 분석 전문매체 클러스터비드가 집계한 2026~2028년 글로벌 AI 데이터센터 개발 계획 물량 85.4GW 가운데 전력 확보와 인허가 등을 마친 확정 물량은 24.2GW에 불과하다. 연평균 약 8.1GW로, 필요 증설량의 3분의 1에도 미치지 못한다. 송 연구원은 \"GPU나 재원조달은 차치하고라도 송전망 및 전력 인입, 대규모 냉","category":"IT 과학"},{"title":"'칩' 넘어 '소프트웨어'까지…아마존, 데카르트 기술 인수 나선 이유","link":"https://n.news.naver.com/mnews/article/293/0000093783","naverLink":"https://n.news.naver.com/mnews/article/293/0000093783","pubDate":"2026-11-25T11:13:11.963975+09:00","author":"네이버뉴스","description":"/챗GPT의 도움을 받아 제작한 이미지입니다. 아마존이 자체 인공지능(AI) 반도체의 경쟁력을 높이기 위해 소프트웨어(SW) 기술 확보에 나섰다. 내년 말 자체 AI 반도체 '트레이니엄'의 외부 판매를 추진하는 가운데 AI 반도체의 연산 효율을 높이는 기술과 전문인력을 확보하기로 했다. 엔비디아가 반도체뿐 아니라 SW 생태계에서도 강력한 영향력을 행사하는 만큼 아마존 역시 하드웨어와 SW 양면에서 경쟁력을 높이려는 행보로 풀이된다. 데카르트 핵심 기술 인수…공동창업자 3명도 영입 아마존은 23일(현지시간) 이스라엘 AI 스타트업 데카르트의 '데카르트 최적화 스택(DOS)' 기반 독자 기술을 인수하는 계약을 체결했다고 발표했다. 데카르트 공동창업자 3명과 AI 연구진 및 엔지니어도 영입할 예정이다. 아마존은 구체적인 계약 금액을 공개하지 않았으나 파이낸셜타임스는 거래 규모가 75억달러(약 10조1000억원)에 달한다고 보도했다. 2023년 설립된 데카르트는 AI 모델 개발과 연산 최적화 기술을 전문으로 하는 기업이다. 이번 거래의 핵심인 DOS는 엔비디아·아마존·구글 등 서로 다른 기업이 개발한 AI 반도체에서도 AI 모델을 효율적으로 구동할 수 있도록 지원하는 SW다. 고성능 AI 반도체를 확보하더라도 연산 자원을 효율적으로 활용하지 못하면 AI 서비스의 운영비용은 높아질 수밖에 없다. 반대로 같은 반도체로 더 많은 연산을 처리할 수 있다면 AI 모델의 학습비용을 줄이고 이용자에게 응답하는 속도도 높일 수 있다. 아마존이 반도체 자체의 성능 개선과 별개로 SW 기술 확보에 나선 이유다. 아마존과 데카르트는 지난해부터 협력 관계를 이어왔다. 양사는 하드웨어와 SW를 함께 최적화하는 방식으로 트레이니엄의 성능을 개선해 왔다. 이번 거래가 마무리되면 아마존은 데카르트의 기술과 연구인력을 내부에 두고 자체 반도체 개발에 활용할 수 있게 된다. 거래 종결을 위해서는 규제당국의 승인 등 관련 절차가 남아 있다. 트레이니엄 외부 판매 추진 이번 거래에서 주목할 부분은 아마존의 자체 AI 반도체 사업 확장 시점이다. 아마존은 그동안 클라우드 사업을 담당하는 아마존웹서비스(AWS)를 통해 고객에게 트레이니엄 기반의 연산 자원을 제공해 왔다. 내년 말부터는 AWS 외부에서도 트레이니엄을 이용할 수 있도록 할 계획이다. /챗GPT의 도움을 받아 시각화하고 기자가 최종 검토·확인해 제작한 그래픽입니다. 그래픽에 포함된 데이터와 내용","category":"IT 과학"},{"title":"GTA6 해킹 파일로 AI '해적판' 제작 시도…3007곳 차단","link":"https://n.news.naver.com/mnews/article/421/0009308731","naverLink":"https://n.news.naver.com/mnews/article/421/0009308731","pubDate":"2026-11-25T11:13:11.963972+09:00","author":"네이버뉴스","description":"해킹한 사이버리크, 엑스박스용 실행 파일 공개…PC 실행 후 초기 설정까지 게임은 아직 불안정…운영사측, PC버전 발매 앞당길수도 GTA 6(Grand Theft Auto VI) (락스타게임즈 제공. 재판매 및 DB 금지) (서울=뉴스1) 유수연 기자 = 출시 하루 만에 5조 원의 판매고를 올린 락스타게임즈의 '그랜드 테프트 오토 6'(GTA 6)의 유출 파일로 비공식 PC판인 '해적판'을 제작하려는 시도가 나타나 논란이 일고 있다. 게임 유통사 테이크투 인터랙티브가 저작권 침해를 이유로 대응에 나서면서 해적판 제작을 시도한 개발자 그룹 '프로젝트 레오니다'의 활동이 중단됐다. 25일 외신 등에 따르면 테이크투는 레오니다 측이 해킹으로 유출된 GTA 6 엑스박스용 파일을 PC에서 구동하려 했다며 관련 코드의 삭제를 요청했다. 이에 깃허브는 레오니다의 원본 저장소와 이를 복제한 저장소 등 총 3007개를 차단했다. 참여자들이 소통하던 디스코드 서버도 폐쇄됐다. 깃허브가 공개한 삭제 요청서에서 테이크투 측은 \"레오니다의 깃허브 저장소와 이를 복제한 2900여 개 저장소가 테이크투의 저작권을 침해하고 락스타게임즈의 GTA 6에 대한 저작권 침해를 용이하게 한다\"고 지적했다. 앞서 지난 8월 익명의 해커 사이버리크(Cyberleek)는 락스타게임즈를 해킹해 GTA 6 개발 파일 전체를 유출하고 유출 파일과 플레이 영상을 공개하며 가상자산으로 후원을 받아왔다. 게임 구동에 필요한 엑스박스용 실행 파일은 공개를 미루다가 출시 후 일주일이 채 지나지 않은 시점에 공개했다. 레오니다는 이 파일을 내려받은 후 앤트로픽의 AI모델 클로드를 이용해 '해적판 PC버전 게임'으로 제작하려고 시도했다. 개발자 중 한 명은 PC에서 게임을 실행해 초기 설정을 마쳤지만, 게임에 진입하자 프로그램이 불안정해지며 화면이 검게 변한 것으로 알려졌다. 활동 중단 전 레오니다는 일주일 정도면 해적판 PC버전으로 게임을 플레이할 수 있을 것이라고 밝히기도 했다. 레오니다의 활동이 중단된 뒤에도 이미 유출된 파일을 PC에서 구동하려는 시도가 이어지고 있다. 미국 정보기술(IT) 매체 더버지에 따르면 '빅토리'(Victory) 등 다른 그룹도 엑스박스용 GTA 6를 PC로 옮기는 작업을 진행 중이다. GTA 6은 지난 19일 플레이스테이션5와 엑스박스 시리즈 X|S로 전 세계에 출시돼 하루 만에 3000만 장 넘게 팔렸다. 출시 첫날 약 5조 원의 매출","category":"IT 과학"},{"title":"[단독] \"식당 전화부터 KTX 예매까지 AI가 척척\"…‘피클’ 40일 만에 40만명 돌풍","link":"https://n.news.naver.com/mnews/article/018/0006415228","naverLink":"https://n.news.naver.com/mnews/article/018/0006415228","pubDate":"2026-11-25T11:13:11.963968+09:00","author":"네이버뉴스","description":"10만명 이후 19일 만에 40만명 미국 월 20~200달러…한국 기본 무료 의대 휴학한 창업가…엔지니어 3명의 도전 AI 안경 예약 440건 전액 환불…재발 방지 약속 500회 이상 공격 시도…\"정보 유출 없어\" 12월 ‘모두의 AI’ 시작…카카오·SKT·KT와 경쟁 [이데일리 김현아 기자] “내일 오후 1시에 명동 파스타집 예약해 줘.” 스마트폰에 대고 한마디 하면 인공지능(AI)이 식당에 직접 전화를 걸어 빈자리를 확인하고 예약한다. KTX 기차표를 예매하거나 네이버 쇼핑 후기를 대신 써준다. 질문에 답하는 것을 넘어 일상 업무를 대신하는 AI가 인기를 끌고 있다. 미국 실리콘밸리 스타트업 피클(Pickle, Inc.)의 개인용 AI 비서 ‘피클(Pickle)’이 국내 출시 40여일 만에 월간활성이용자(MAU) 약 40만명을 확보했다. 피클은 지난 23일 이데일리의 서면질의에 “현재 국내 월간활성이용자(MAU)는 약 40만 명”이라고 밝혔다. MAU는 최근 한 달간 서비스를 이용한 사람의 수를 뜻한다. 회사가 국내 이용자 규모를 40만명대로 언론에 공개한 것은 이번이 처음이다. 지난 10월 14일 초대장 기반의 아이폰(iOS) 비공개 베타 서비스를 시작한 피클은 11월 5일 이용자 10만명, 11일 20만명을 넘어섰다. 10만명 돌파 이후 불과 19일 만에 40만명 규모에 이르렀다. 2010년 카카오톡이 출시 닷새 만에 가입자 10만명을 확보했던 때와는 시장 환경과 집계 기준이 다르지만, 초대장과 지인 추천을 중심으로 단기간에 이용자를 확보했다는 점에서 주목된다. 친구를 초대하면 양쪽 모두에게 무료 사용 한도를 초기화할 수 있는 ‘티켓’을 제공하는 방식도 입소문 확산에 기여했다. 피클은 지난 10일 애플 앱스토어 생산성 부문 1위에 오른 데 이어 19일에는 전체 무료 앱 순위에서도 1위를 기록했다. 피클의 흥행은 오는 12월 15일 정부의 대국민 AI 서비스 사업인 ‘모두의 AI’ 시작을 앞두고 있다는 점에서도 관심을 끈다. 카카오·SK텔레콤·KT가 생활밀착형 AI 서비스를 준비하는 가운데 직원 6명의 실리콘밸리 한인 스타트업이 국내 AI 비서 시장의 새로운 경쟁자로 떠오르고 있다. 박채근(Daniel Park) 피클 대표. 사진=박채근 대표 스레드 박채근 대표(왼쪽)과 모로코 출신 개발자 라이언(Rayan). 박 대표는 스타트업이 하고 싶어 17살에 모로코에서 중국 심천으로 온 라이언. 이처럼 주어진 환","category":"IT 과학"},{"title":"아이 하교 일정 빼먹고 중복 결제 권유… 최고 성능 AI 비서도 10번 중 4번 ‘실패’","link":"https://n.news.naver.com/mnews/article/023/0004011616","naverLink":"https://n.news.naver.com/mnews/article/023/0004011616","pubDate":"2026-11-25T11:13:11.963962+09:00","author":"네이버뉴스","description":"한 번 성공해도 다음 성공 장담 못 해 3줄 요약 ㆍ 최고 성능 AI 모델도 일상 업무 37.5% 실패 ㆍ 자녀 하교 79.5% 누락·중복 결제 40.3% 권유 ㆍ 보안 취약점·AI 에이전트 업무 제한 권고 확산 인공지능(AI) 에이전트가 일정 관리와 결제, 전화 상담 등 일상적인 업무를 처리하는 과정에서 각종 오류를 일으키는 사례가 잇따르고 있다. /챗GPT 인간을 대신해 쇼핑과 여행 예약, 일정 관리 등을 수행하는 인공지능(AI) 에이전트(비서)가 빠르게 확산하고 있지만, 최고 성능 AI 모델조차 일상 업무 10건 중 4건가량을 제대로 처리하지 못한다는 연구 결과가 나왔다. 자녀의 하교 일정을 고려하지 않거나 이미 지불한 비용을 다시 결제하도록 권유하는 등 일상생활에 피해를 줄 수 있는 오류도 확인됐다. 24일(현지 시각) 미국 IT 전문 매체 테크크런치에 따르면 오픈클로 재단과 미국 UC버클리, 허깅페이스, 레드햇 등의 연구진은 AI 에이전트의 일상 업무 수행 능력을 평가하는 지표인 ‘셸벤치(ShellBench)’를 공개했다. 연구진은 익명화한 실제 AI 에이전트 이용 기록 1000만건 이상을 토대로 100가지 과제를 구성했다. 이메일과 영수증, 일정표, 메신저 대화 기록 등 여러 자료를 종합해 업무를 처리하도록 하는 방식이다. 총 12개 AI 모델을 대상으로 5만3100회에 걸쳐 평가를 진행했다. 가장 높은 성적을 거둔 오픈AI의 ‘GPT-6 아스트라’의 업무 성공률은 62.5%를 기록했다. 앤스로픽의 ‘클로드 페이블 5.2’(61.9%), 오픈AI의 ‘GPT-6.1 솔’(61.4%)이 뒤를 이었다. 평가 항목을 모두 충족해야 업무를 성공적으로 처리한 것으로 간주했다. 같은 조건에서 동일한 업무를 세 차례 반복 수행하도록 했을 때 GPT-6 아스트라가 세 번 모두 성공한 비율은 48.8%에 불과했다. 한 번 업무를 제대로 처리했다고 해서 다음에도 같은 결과를 낼 것이라고 장담하기 어렵다는 것이다. 안전성 문제도 드러났다. 전체 실험의 15.7%에서 AI가 최소 한 가지 이상의 안전 기준을 충족하지 못했다. 업무 자체를 정확하게 처리한 경우에도 9.9%에서 안전성 문제가 발생했다. 과제별로 보면 자녀를 학교에서 데려오는 일정을 제대로 고려하지 못한 비율은 79.5%에 달했다. 중복되거나 잘못된 청구서의 결제를 권유한 비율은 40.3%, 은행 관련 민감한 인증 정보를 식별하고 보호하지 못한 비율은 18.6%","category":"IT 과학"},{"title":"AI 수익성 의문에 ’30년 동지 이사회' 도마…젠슨 황 복귀 후폭풍","link":"https://n.news.naver.com/mnews/article/023/0004011621","naverLink":"https://n.news.naver.com/mnews/article/023/0004011621","pubDate":"2026-11-25T11:13:11.963958+09:00","author":"네이버뉴스","description":"엔비디아 6%·마이크론 11% 동반 급락 블라인드 재직자 글선 복귀 찬성 47% 복귀절차·이중 잣대 논란...이사회 교체론 젠슨 황 엔비디아 최고경영자(CEO) / 로이터 연합뉴스 젠슨 황의 엔비디아 최고경영자(CEO) 복귀에 환호했던 미국 반도체주가 하루 만에 급락했다. 엔비디아를 비롯해 메모리 반도체와 인공지능(AI) 클라우드 업체들까지 동반 하락했다. 황의 복귀로 경영 공백은 메웠지만, AI 투자 수익성에 대한 의문과 이사회의 독립성 논란은 이어지고 있다. 엔비디아 6%·마이크론 11%↓… 하루 만에 꺾인 반등 24일(현지 시각) 엔비디아는 전 거래일보다 5.9% 내린 155.38달러로 거래를 마쳤다. 전날 황의 복귀 발표로 31.5% 급등하며 시가총액이 약 9520억달러 늘었으나, 하루 만에 약 2330억달러가 줄어들었다. 메모리 반도체주 낙폭도 컸다. 마이크론은 11.0%, SK하이닉스 미국예탁증서(ADR)는 9.9% 하락했다. 필라델피아 반도체지수도 7.9% 떨어져 전날 상승 폭의 약 64%를 반납했다. 엔비디아 반도체를 확보해 AI 연산 서비스를 제공하는 코어위브와 네비우스, 아이렌도 10%대 낙폭을 기록했다. 반면 애플과 마이크로소프트는 각각 1.4%, 0.7% 올랐다. AI 반도체·인프라 기업에 매도세가 집중된 것이다. 시장에서는 전날 폭등에 따른 차익 실현에 관세 인상 우려와 황에 대한 조사 등이 겹쳤다는 분석이 나온다. 황의 복귀에도 AI 기업들의 막대한 투자 비용과 차입 부담, 투자금 회수에 대한 불확실성은 남아 있다. 복귀 찬성 47%… 일부 직원들 절차·이중 잣대 지적 사내에서도 복귀 결정에 대한 문제 제기가 이어지고 있다. 직장인 익명 커뮤니티 블라인드가 지난 23일 공개 채널에 글을 쓴 엔비디아 재직자 118명의 게시물을 AI로 분석한 결과, 복귀 찬성 의견은 47%, 반대는 27%, 중립은 26%였다. 반대 의견에서는 이사회의 의사 결정 절차를 문제 삼은 언급이 35%로 가장 많았다. 경영진과 일반 직원에게 다른 기준이 적용된다는 지적이 30%로 뒤를 이었다. 반면 찬성 의견에서는 황이 물러난 과정이 부당했다는 언급이 42%, 직원 대우를 긍정적으로 평가한 언급이 21%였다. 블라인드는 사퇴 전인 지난 6~11일에는 재직자 의견의 74%가 사퇴에 반대했고, 사임 직후 닷새 동안에는 56%가 복귀를 원 1월 24일 화요일","total":45,"categories":{"사건 사고":[{"title":"‘아침 공복’ 자랑하던 중년들 뜨끔…“첫 끼 늦으면 사망 위험 커져요”[헬스픽]","link":"https://n.news.naver.com/mnews/article/081/0003702799","naverLink":"https://n.news.naver.com/mnews/article/081/0003702799","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"아침을 거르거나 늦은 밤 야식을 먹는 습관은 건강을 해칠 수 있다. 아이클릭아트 하루의 첫 끼를 늦게 먹는 사람일수록 사망 위험이 커진다는 대규모 연구 결과가 나왔다. 건강을 지키려면 무엇을 먹느냐만큼 ‘언제’ 먹느냐도 함께 살펴야 한다는 의미다. 21일(현지시간) 과학 전문 매체 사이언스얼러트에 따르면 중국 화중과학기술대 연구팀은 40세 이상 미국 성인 3만 1044명의 식사 시간과 사망 기록을 분석해 이 같은 사실을 확인했다. 이번 연구 결과는 국제학술지 ‘유럽 임상영양학 저널’에 게재됐다. 그동안 아침을 거르거나 야식을 먹는 습관이 건강에 해롭다는 연구는 많았지만 구체적으로 몇 시에 먹을 때 위험이 얼마나 커지는지는 명확하지 않았다. 연구팀은 이를 밝히기 위해 1999년부터 2018년까지 진행된 미국 국민건강영양조사 참가자의 자료를 살폈다. 참가자들은 조사 전 24시간 동안 먹고 마신 모든 음식과 그 섭취 시각을 보고했다. 연구팀은 새벽 4시 이후 칼로리가 있는 음식이나 음료를 처음 먹은 시각을 ‘첫 식사’로 정의했다. 따라서 여기서 말하는 첫 식사가 꼭 식탁에 차려놓고 먹는 아침밥만을 뜻하지는 않는다. 하루 중 마지막으로 칼로리를 섭취한 시각은 ‘마지막 식사’로 봤으며, 첫 식사와 마지막 식사 사이의 구간은 ‘식사 시간대’로 규정했다. 대표 야식으로 꼽히는 라면. 123rf","category":"사건 사고"},{"title":"민주당, 연이은 해킹 사고에 '과기혁신특위 보안분과' 첫발","link":"https://n.news.naver.com/mnews/article/092/0002446767","naverLink":"https://n.news.naver.com/mnews/article/092/0002446767","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"학계 7명·연구기관 4명·산업계 8명 참여…원유재 충남대 교수 위원장 위촉 여당인 더불어민주당의 과학기술혁신특별위원회(과기혁신특위)가 연이은 대형 해킹사고에 대응해 보안분과를 발족하고 국가 사이버보안 정책 논의에 나섰다. 과기혁신특위는 24일 학계, 연구기관, 산업계 위원 19명이 참여한 가운데 보안분과 제1차 회의와 토론회를 열었다. 24일 더불어민주당의 과학기술혁신특별위원회 보안분과 제1차 회의 주요 참석자들이 기념 촬영을 하고 있다. (사진=황정아 의원실) 최근 통신, 유통 등 주요 산업 분야에서 대규모 개인정보 유출과 해킹사고가 잇따르고 있다. 인공지능(AI)을 악용한 사이버 공격까지 고도화되면서 사고 예방과 대응 역량은 물론 정보보호 기술 개발, 전문인력 양성, 보안산업 경쟁력 강화 정책이 시급하다는 목소리가 커졌다. 과기혁신특위는 보안분과 위원장에 한국정보보호학회장을 지낸 원유재 충남대학교 교수를 위촉했다. 위원은 학계 7명, 연구기관 4명, 산업계 8명이다. 행사는 오전 9시 국회 의원회관 제10간담회의실에서 열렸다. 구태언 법무법인 린 변호사는 'AI 시대, 국가 사이버보안 정책의 패러다임 전환'을 주제로 발표했다. 구 변호사는 사후 제재를 넘어 예방, 대응, 산업 경쟁력 강화 등 주요 정책과제를 제시했다. 이어 조학수 정보통신기획평가원(IITP) 정보보호 프로젝트매니저(PM)가 '2027년 정보보호 연구과제 추진 계획'을 발표하고 앞으로 정보보호 연구개발 방향을 공유했다. 특위 위원장인 황정아 국회 과학기술정보방송통신위원회 더불어민주당 의원(대전유성을)은 환영사에서 \"과기혁신특위는 과학기술 현장의 목소리를 정책에 반영하기 위해 노력해 왔다\"며 \"이번 보안분과 출범을 통해 국가 사이버보안의 중요성을 환기하고, 정보보호 분야의 현안과 정책과제를 폭넓게 논의하기를 기대한다\"고 말했다. 그는 이어 \"잇따른 해킹사고와 AI 기술의 발전으로 사이버보안은 국민의 안전과 기업의 경쟁력은 물론 국가의 생존과도 직결되는 핵심 과제가 됐다\"며 \"보안분과가 학계, 연구기관, 산업계 전문가들의 지혜를 모으는 협력의 장이 되고, 논의된 내용이 실효성 있는 정책으로 이어질 수 있도록 노력하겠다\"고 말했다. 보안분과는 국가 사이버보안 정책의 주요 현안을 지속적으로 검토하고, 정보보호 연구개발과 산업 육성에 필요한 입법과 정책과제를 발굴할 계획이다. 전문가 의견을 국회 입법과 정부 정책에 반영할 방안도 모색한다. 정보보호 분","category":"사건 사고"},{"title":"[속보] 범죄 액션게임 GTA 6, 해킹에 비공식 PC판 뚫렸다…AI로 파일 변조 중","link":"https://n.news.naver.com/mnews/article/029/0003060972","naverLink":"https://n.news.naver.com/mnews/article/029/0003060972","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"길거리의 한 전광판에 GTA 6 관련 광고가 표시되고 있는 모습. [연합뉴스] 출시 하루만에 3000만 장이 넘게 팔린 범죄 액션 게임 ‘그랜드 테프트 오토(GTA) 6’의 해킹 유출 파일이 익명의 해커에 의해 공개됐다. 조만간 비공식 PC 버전이 나올 것이란 예상이 나온다. 24일 영국 게임 매체 유로게이머에 따르면 지난 8월 락스타게임즈를 해킹해 게임 개발 파일 전체를 유출한 익명의 해커 사이버리크(Cyberleek)에 의해 최근 GTA 6의 엑스박스 버전 실행 파일이 공개됐다. 빼돌린 파일과 플레이 영상을 공개하며 가상화폐로 후원을 받아온 사이버리크는 게임을 구동하는 exe 파일을 의도적으로 공개하지 않고 있다가, 게임 발매 일주일이 채 안 된 시점에 외부에 공개한 것이다. 사이버리크가 공개한 파일을 내려받은 ‘프로젝트 레오니다’라는 이름의 개발자 집단은 클로드 AI의 도움으로 엑스박스 버전 파일을 PC에서 실행 가능하도록 변조, 이식하는 데 성공한 것으로 전해졌다. 유로게이머에 따르면 한 해커는 게임을 PC에서 초기 설정 화면까지 부팅하는 데 성공했으나, 실제 게임에 들어가자 프로그램이 불안정해지며 검은 화면으로 넘어갔다. 해당 빌드가 PC에서 플레이 가능한 상태에 도달하기까진 일주일 가량 걸릴 것으로 본다. GTA 6는 지난 19일 플레이스테이션5 및 엑스박스 시리즈 X|S 버전으로 전 세계에 발매됐다. 락스타게임즈는 콘솔 플랫폼에 게임을 먼저 출시한 뒤 1년가량 후 PC 버전을 공개해왔지만, 그러나 AI를 통한 비공식 포팅(이식) 우려로 PC 버전 발매를 내년 1분기로 앞당길 거란 관측도 나온다.","category":"사건 사고"},{"title":"中 연구진 데이터 조작으로 철회한 ‘루테인 근시 예방’ 논문…실제 효과 확인된 곳은","link":"https://n.news.naver.com/mnews/article/016/0002727953","naverLink":"https://n.news.naver.com/mnews/article/016/0002727953","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"中 연구팀 근시 예방 메타분석, 게재 두 달 만에 ‘데이터 조작’으로 철회 황반변성 환자는 진행 위험 낮춰 화면 많이 보는 청소년 임상서 주의력 개선 기사 이해를 돕기 위한 사진. 가상으로 제작. [AI 생성 이미지] [헤럴드경제=장윤우 기자] ‘하루 종일 스마트폰에 모니터까지, 눈이 침침한데 루테인이라도?’ 루테인은 대표적인 눈 영양제다. 시금치나 케일 같은 짙은 녹색 채소에 많은 노란 색소 성분으로 눈 안쪽 망막의 중심부인 황반에 모여 있다. 황반은 사물을 또렷하게 보는 데 핵심적인 역할을 하는 곳으로 이곳의 색소가 빛으로부터 눈을 보호하는 것으로 알려져 있다. 국내에서는 식품의약품안전처가 루테인을 하루 10~20㎎ 먹으면 ‘노화로 인해 감소될 수 있는 황반색소밀도를 유지하여 눈 건강에 도움을 줄 수 있다’는 기능성을 인정하고 있다. 그런데 최근 루테인을 둘러싼 연구들을 보면 효과가 확인된 곳과 기대가 앞선 곳이 뚜렷하게 갈린다. 청소년 근시를 막는다는 연구는 데이터 조작으로 철회됐다. 안경. 사진은 기사 내용과 관련 없음. [123RF]","category":"사건 사고"},{"title":"[오늘의 별자리 운세] 11월 25일 수요일","link":"https://n.news.naver.com/mnews/article/366/0001207080","naverLink":"https://n.news.naver.com/mnews/article/366/0001207080","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"그래픽=김다민 당신의 수호성이 속삭이는 오늘의 별자리 운세와 함께, 빛나는 하루를 위한 우주의 이정표를 찾아보세요. ♑️ 염소자리 (12.22 ~ 1.19): 현실적 목표를 향해 굳건히 나아가며 새로운 길을 개척하는 흐름이랍니다. 행운의 색: 딥그린 행운 아이템: 만년필 오늘의 감정: 결단력 새로운 도전에 대한 내면의 목소리에 귀 기울여 보세요. 망설였던 일에 용기를 내어 한 걸음 내딛는다면, 예상치 못한 좋은 결과를 만날 수 있겠습니다. 자신감을 가지고 전진하는 모습이 중요할 것입니다. ♒️ 물병자리 (1.20 ~ 2.18): 창의적 생각들이 자유롭게 발현되어 미래를 밝히는 때이로군요. 행운의 색: 스카이블루 행운 아이템: 아로마 디퓨저 오늘의 감정: 영감 겉으로 드러나지 않는 직관적인 통찰력이 빛을 발하는 때이로군요. 복잡한 상황 속에서도 핵심을 꿰뚫는 예리함으로 현명한 해결책을 찾아낼 수 있답니다. 내면의 소리에 집중하는 시간을 가져보시는 건 어떨까요. ♓️ 물고기자리 (2.19 ~ 3.20): 주변의 작은 행복에 감사하며 마음의 평화를 찾아가는 시점입니다. 행운의 색: 아쿠아마린 행운 아이템: 허브차 오늘의 감정: 평온함 잠시 바쁜 일상에서 벗어나 자신을 돌아보는 여유가 필요합니다. 주변 사람들의 작은 배려에 감사함을 표현하면 관계가 더욱 단단해질 수 있답니다. 고요한 마음으로 내면을 채우는 시간을 가져보시길 바랍니다. ♈️ 양자리 (3.21 ~ 4.19): 오해를 풀고 굳건한 신뢰를 바탕으로 관계를 돈독히 할 수 있습니다. 행운의 색: 루비레드 행운 아이템: 스포츠화 오늘의 감정: 화합 타인과의 소통에서 진심을 담아 이야기하는 것이 중요합니다. 혹시 모를 오해가 있다면 솔직한 대화로 풀어내고, 서로에게 깊은 신뢰를 쌓아가는 것이 필요하겠어요. 따뜻한 마음으로 관계를 회복하는 계기가 될 것입니다. ♉️ 황소자리 (4.20 ~ 5.20): 꾸준한 노력으로 안정된 목표에 몰입하여 성과를 이루어낼 겁니다. 행운의 색: 에메랄드그린 행운 아이템: 식물 화분 오늘의 감정: 몰입 한 가지 일에 깊이 몰두할 수 있는 좋은 환경이 조성됩니다. 주변의 방해 요소들을 잠시 내려놓고 자신이 가장 흥미를 느끼는 분야에 집중해 보시길 권합니다. 놀라운 성과를 거두며 만족감을 느끼게 될 것입니다. ♊️ 쌍둥이자리 (5.21 ~ 6.20): 민첩한 사고로 업무 효율을 높이며 긍정적인 평가를 얻을 수 있어요. 행운의 색: 옐로우오커","category":"사건 사고"}],"사회":[{"title":"경남 진주 4층 다가구주택서 불…60대 남성 중상·주민 6명 대피","link":"https://n.news.naver.com/mnews/article/014/0005609238","naverLink":"https://n.news.naver.com/mnews/article/014/0005609238","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"경남 진주시 다가구 주택 화재 현장. /사진=경남소방본부 [파이낸셜뉴스] 경남 진주시의 한 다가구 주택에서 불이 나 60대 남성이 크게 다치고 주민 6명이 대피하는 소동이 빚어졌다. 24일 소방당국에 따르면 이날 밤 9시 16분쯤 경남 진주시 상대동의 한 4층짜리 다가구 주택 3층에서 원인을 알 수 없는 불이 났다. 인근 주민의 신고를 받고 출동한 소방당국은 내부 수색 과정에서 3층 거주자인 60대 남성 1명을 발견해 구조했다. 이 남성은 연기를 흡입해 의식이 저하된 중상 상태로 인근 병원에 이송됐다. 건물에 거주하던 다른 주민 6명은 스스로 대피했다. 불은 출동한 소방대원에 의해 22분 만인 밤 9시 38분쯤 모두 꺼졌다. 경찰과 소방당국은 정확한 화재 원인과 재산 피해 규모를 조사하고 있다.","category":"사회"},{"title":"‘인공지능’이 바꿔버린 시험…교육현장 혼란 가중","link":"https://n.news.naver.com/mnews/article/056/0012300626","naverLink":"https://n.news.naver.com/mnews/article/056/0012300626","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"[KBS 대전] [앵커] 인공지능이나 첨단기기를 악용한 부정행위 우려가 커지면서 정부가 학교 내신시험에도 수능에 준하는 감독 기준을 적용하기로 했습니다. 교사들은 학교 현장 여건을 고려하지 않은 대책이라며 반발하고 나섰는데요. 시대변화에 맞춰 평가 방식 자체를 바꿔야 한다는 지적도 나오고 있습니다. 보도에 정재훈 기자입니다. [리포트] 스마트 안경을 포함해 전자기기를 악용한 부정행위 111건 적발된 2027학년도 수능. 올해 중·고등학교 내신시험에서도 스마트 안경을 이용한 부정행위 4건이 적발됐습니다. 우려가 현실이 되자 정부가 중고등학교의 내신시험 관리감독도 수능 수준으로 강화하기로 했습니다. 휴대전화 등 모든 전자기기가 금지되고 매시간 안경과 복장을 검사합니다. 단추가 없는 학교 체육복을 입어야 하고 필기구도 연필만 허용됩니다. 스마트기기를 소지만 해도 당일 모든 과목이 0점 처리되고 퇴학까지 당할 수 있습니다. 이같은 방침에 일선 교사들은 반응은 회의적입니다. 당장 기말고사를 앞두고 있는 상황에서 대책을 따를 여력이 없다는 겁니다. [이윤경/대전교사노조 위원장 : \"수능 같은 경우는 워낙 특수한 상황이고 또 많은 인력도 동원되고 있고 또 국가적으로 또 대응해 주었습니다. 그런데 각 학교에서는 과연 이런 기말고사 기간에 어떻게 대응해야 되는지….\"] 전문가들은 AI의 등장으로 기존 평가 방식이 한계에 직면했다고 지적합니다. 초중고 수업에서도 이미 인공지능이 대거 활용되는데 시험에서는 이를 통제하는 방식이 언제까지 유효할 지 의문이라는 겁니다. [박용한/충남대 교육학과 교수 : \"정답이 있는 객관식 형태의 평가가 가장 공정하다라는 그런 신화 같은 생각을 많이 했던 것 같습니다. 그런데 이번 이런 일들을 계기로 해서 그 신화가 많이 무너졌다고 생각하고 있고요.\"] 부정행위에 대한 단속 강화만큼이나 새로운 평가 방식에 대한 고민이 요구되고 있습니다. KBS 뉴스 정재훈입니다. 촬영기자:강욱현/그래픽:신이화","category":"사회"},{"title":"日에서 대만인이 한국인 여성 애타게 찾은 이유?…국경 넘은 '선의'","link":"https://n.news.naver.com/mnews/article/053/0000063322","naverLink":"https://n.news.naver.com/mnews/article/053/0000063322","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"대만인 여성 A씨는 지난 18일 습득한 여권의 주인을 찾기 위해 SNS에 게시물을 올렸다. photo 스레드 일본 여행 중 열차에 여권을 두고 내린 한국인 여성이 대만인 관광객의 도움으로 여권의 행방을 찾았다. 대만인 관광객이 여권 주인을 찾기 위해 한국어로 올린 게시물이 한국과 대만 네티즌들의 공유를 통해 확산하면서 분실 사실조차 몰랐던 여권 주인에게 전달됐다. 대만인 여성 A씨는 지난 19일 소셜미디어 스레드에 \"한국인 여성분이 도쿄 스카이라이너 열차 안에 여권을 두고 내리셨다\"는 내용의 글을 한국어로 올렸다. 남자친구와 함께 일본을 여행하던 A씨는 전날인 18일 오후 4시 13분 나리타공항에서 출발한 스카이라이너 열차 안에서 한국인 여성의 여권을 발견했다. 여권 주인은 도쿄 닛포리역에서 내렸으며, 여권을 발견했을 때는 이미 열차가 역을 떠난 뒤였다. A씨는 여권을 우에노역 스카이라이너 서비스센터에 맡긴 뒤 소셜미디어를 통해 주인 찾기에 나섰다. 그는 \"꼭 주인에게 이 글이 전달되기를 바란다\"며 \"많은 사람이 게시물을 공유해 주면 좋겠다\"고 요청했다. 게시물은 한국과 대만 네티즌들의 공유를 통해 빠르게 확산했다. 얼마 지나지 않아 해당 게시물에는 여권 주인인 한국인 여성 B씨가 직접 댓글을 남겼다. B씨는 \"내 여권인데 잃어버린 줄도 몰랐다\"며 \"친구의 친구가 공유해 줘서 내일 찾으러 가려고 한다. 정말 감사하다\"고 인사했다. A씨 역시 \"여권 주인이 이 글을 봤다고 한다\"며 게시물을 공유해 준 네티즌들에게 감사의 뜻을 전했다. 사연을 접한 네티즌들은 \"정말 친절하고 좋은 사람이다\" \"무사히 찾게 돼 다행이다\" \"SNS의 힘이 대단하다\" 등의 반응을 보였다. ※주간조선 온라인 기사입니다.","category":"사회"},{"title":"박수현 충남지사 \"2차 공공기관 이전, 기대 못 미칠 수도…'반값 생활비' 등 필요\"","link":"https://n.news.naver.com/mnews/article/079/0004213507","naverLink":"https://n.news.naver.com/mnews/article/079/0004213507","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"이상근 충남도의원 \"정말 준비된 도시인가 되돌아봐야\"…현안 대응 촉구 충남도의회 본회의 방송 캡처 박수현 충남도지사가 충남의 제2차 공공기관 유치 성과가 기대에 미치지 못할 가능성이 높다며 위기감을 공식 표명하고, 이전 기관 직원과 가족을 위한 '반값 생활비' 제공 등의 대책이 필요하다고 강조했다. 박수현 지사는 24일 충남도의회에서 열린 제372회 정례회 제2차 본회의 도정 질문에 대한 답변 중, \"충남이 제2차 공공기관 이전에서 기대치보다 미치지 못할 가능성도 높다라고 하는 불편한 진실을 이제 우리가 마주해야 한다\"며 이 같이 말했다. 박 지사는 \"정부 기조에 따라 수도권에서 먼 지역과 행정통합 지역에 공공기관을 우선 유치할 가능성이 있으며 중앙행정기관의 세종 이전도 미칠 영향이 있지 않을까 생각한다\"며, \"정부의 배분 방향과 의사결정 동향을 철저히 분석하고 가능한 모든 대응 전략을 다시 점검하겠다\"고 말했다. 이어 \"도와 이전 기관, 소상공인과 자영업자들이 서로 협력해 이주 직원 및 가족들에 대한 '반값 생활비 제공'과 같은 창의적이고 파격적인 대책이 필요하다\"고 박 지사는 제안했다. \"해양수산부의 부산 이전 당시 이주 수당과 주거 지원, 생활비 지원, 기관 임대료와 양육·출산 지원, 가족 정착금 등이 파격적으로 제시된 바 있다\"고 거론하기도 했다. 박 지사의 이 같은 답변에 앞서 이상근 충남도의회 의원(홍성1·국민의힘)은 \"이전 대상 기관의 직원과 가족들이 가장 먼저 살펴보는 것은 바로 그 도시에 살고 있는 사람들이 얼마나 행복하게 살고 있는가 하는 점\"이라며 한국과학기술원(KAIST) 부설 과학영재학교 설립과 홍성 미래 신산업 국가산업단지 조성 등 내포신도시 주요 현안 해결을 위한 박 지사의 적극적인 대응을 촉구했다. 이 의원은 \"충남혁신도시 공공기관 유치 전략 토론회에서 전문가들이 공통으로 짚은 것이 정주 여건, 그중에서도 교육이었다\"며 \"이 교육 인프라(기반)가 흔들리고 있는 지금 내포신도시가 정말 준비된 도시인가 다시 되돌아보고 다시 한번 카이스트 부설 과학영재학교 결정권자와 담판을 지어 달라\"고 말하기도 했다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"사회"},{"title":"종로학원, 62년 만에 간판 바꾼다","link":"https://n.news.naver.com/mnews/article/011/0004685778","naverLink":"https://n.news.naver.com/mnews/article/011/0004685778","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"새 브랜드 ‘더 종로’로 변경 2028학년도 대입 개편 대응 대형 강의서 소규모 맞춤형 수업 전환 종로학원이 창립 62년 만에 학원 브랜드를 ‘더 종로(The Jongro)’로 변경한다. 종로학원은 대학수학능력시험 선택과목 폐지와 수학·탐구 영역의 출제 범위 변경 등 입시 환경 변화에 대응하기 위해 학원 운영 체계를 전면 개편한다고 24일 밝혔다. 우선 소규모 학급 편성을 확대한다. 최상위권 학생을 대상으로 정원 8명의 ‘블랙반’을 운영하고 담임교사 외에 별도 조교를 배치해 학생별 학습 상황을 매일 점검한다. 주말 학습 관리 시스템도 도입한다. 개편된 수능 체제에 맞춰 신규 모의고사 프로그램인 ‘더 넥스트’도 선보인다. 수학과 사회·과학탐구 영역의 출제 범위 변화 등을 반영할 예정이다. 종로학원은 서울 강남·목동·송파·신촌·성북과 경기 평촌, 광주 등 지역별 학원에도 새 브랜드를 적용한다. 강남 대치동 학원은 기존 휘문고 정문 인근에서 한티역 인근 신관으로 이전했다. 임성호 종로학원 대표는 “대형 콘서트식 학원 강의 방식에서 전면 탈피해 소규모 학원식 관리를 위한 조교 시스템, 주말 케어 시스템 도입, 모의고사 프로그램 강화 등으로 프로그램을 전면 개편했다”고 말했다.","category":"사회"},{"title":"중3 때 학폭으로 수시 6곳 전부 탈락…父 \"이 정도 대가가 맞나\" 하소연에 '역풍'","link":"https://n.news.naver.com/mnews/article/053/0000063320","naverLink":"https://n.news.naver.com/mnews/article/053/0000063320","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"지난 5월 19일 서울 푸른나무재단에서 열린 '2026 학교폭력 실태조사 기자간담회'에 앞서 학교폭력 피해의 심각성을 알리는 퍼포먼스가 진행되고 있다. photo 연합뉴스 중학교 시절 학교폭력 전력이 있는 아들이 대학 수시모집에서 모두 불합격하자 한 아버지가 과거의 잘못에 비해 대가가 지나치게 크다는 취지의 글을 올려 논란이 되고 있다. 네티즌들은 피해 학생이 겪었을 고통과 가해 학생의 책임을 지적하며 냉담한 반응을 보였다. 지난 23일 온라인 커뮤니티 보배드림에는 '학폭 기록 때문에 수시 전부 떨어진 아들'이라는 제목의 글이 올라왔다. 금융권에 종사하는 49세 남성이라고 자신을 소개한 A씨는 \"고3 아들이 올해 수시 6곳에서 전부 떨어졌다. 성적은 나쁘지 않았다. 학교 선생님도 합격 가능성이 높다고 했던 곳들이었다\"며 고민을 털어놨다. A씨의 아들은 중학교 3학년 때 같은 반 친구를 단체 대화방에서 따돌려 학교폭력 조치를 받은 전력이 있다. 당시 A씨 부부는 피해 학생의 부모를 찾아가 사과했으며, 아들 역시 진심으로 반성했다고 A씨는 주장했다. 고등학교 진학 후 별다른 문제 없이 생활했지만, 수시모집에서 모두 불합격한 뒤 교사로부터 과거 학교폭력 기록이 영향을 미쳤을 가능성이 있다는 이야기를 들었다고 한다. 다만 실제 불합격 사유가 확인된 것은 아니다. A씨는 아들이 불합격 통보를 받은 뒤 방에서 거의 나오지 않고 식사도 제대로 하지 못하고 있다고 전했다. 정시모집 기회가 남아 있지만 아들은 \"이제 아무것도 하기 싫다\"고 말했다고 한다. A씨는 \"잘못한 건 맞다. 피해 친구가 얼마나 힘들었을지 생각하면 저도 아이를 감쌀 자격이 없다고 느낀다\"면서도 \"하지만 그때의 실수가 이렇게 오래 따라다니고 아이가 이렇게까지 무너지는 걸 보니 이 정도 대가가 맞는지 모르겠다\"고 토로했다. 2026학년도부터 대학입학전형에서 학교폭력 조치사항 반영이 의무화되면서 학폭 전력이 대학 진학에 상당한 영향을 미치는 것으로 나타났다. 대학들은 전형별 특성에 따라 감점이나 정성평가, 지원 자격 제한 등의 방식으로 학폭 조치사항을 반영하고 있다. 국회 교육위원회 소속 진선미 더불어민주당 의원실이 공개한 자료에 따르면 전국 4년제 대학 170곳의 2026학년도 수시모집에서 학폭 조치사항이 반영된 지원 사례는 총 3273건이었다. 이 가운데 2460건(75.2%)이 불합격 처리됐다. 서울대·연세대·고려대 등 주요 11개 대학에서는 학폭 조치사","category":"사회"},{"title":"마운자로 받으려다 한국행 배 놓쳤다…대마도 '스시자로' 열풍","link":"https://n.news.naver.com/mnews/article/053/0000063319","naverLink":"https://n.news.naver.com/mnews/article/053/0000063319","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"일본 대마도에서 비만치료제 마운자로를 수령하기 위해 기다리는 한국인들. photo 스레드 국내보다 저렴한 가격에 비만치료제 마운자로를 구매하려는 한국인들이 일본 대마도로 몰리고 있다. 현지 택배 영업소 앞에는 약을 받으려는 한국인들이 장사진을 이루고 있으며, 대기 시간이 길어져 귀국하는 배편을 놓쳤다는 사연까지 등장했다. 24일 소셜미디어와 온라인 커뮤니티에는 '대마도 마운자로 근황'이라는 제목의 사진이 잇따라 공유됐다. 사진에는 일본 대마도의 한 택배 영업소 앞에서 사람들이 도로를 따라 길게 줄을 선 모습이 담겼다. 사진을 공개한 네티즌은 \"대마도 야마토운수, 마운자로 대기 줄\"이라며 \"1시간은 기다려야 약을 받을 수 있을 것 같다\"고 현지 상황을 전했다. 약을 수령하려다 귀국하는 배편을 놓쳤다는 경험담도 올라왔다. 한 네티즌은 \"어쩐지 올 때 배에 승객이 많이 타서 거의 만석이었다\"며 택배 영업소 앞에 늘어선 긴 줄을 보고 놀랐다고 전했다. 그는 귀국 시간이 임박해 앞에 줄을 선 사람들에게 양해를 구했지만 \"자기들도 배 타야 돼서 급하다\"는 답변이 돌아왔다고 했다. 결국 택배를 받자마자 항구로 뛰어갔지만 배를 놓쳤다는 것이다. 최근 일본에서 비만치료제를 구매하는 한국인들이 늘면서 일본 음식인 스시(초밥)와 마운자로를 합친 '스시자로'라는 신조어까지 등장했다. 특히 부산에서 배를 타고 당일치기로 다녀올 수 있는 대마도가 원정 구매지로 떠오르고 있다. 일본 의료기관에서 비대면 진료를 통해 처방받은 약을 현지에서 수령하는 방식이다. 원정 구매 열풍의 가장 큰 배경은 국내외 약값 차이다. 국내에서 마운자로 2.5㎎ 4주분을 처방받으려면 30만원 이상의 비용이 들지만 일본에서는 절반에도 못 미치는 가격에 구매할 수 있는 것으로 알려졌다. 정부가 해외 의약품의 개인 휴대 반입 기준을 완화한 점도 영향을 미쳤다. 식품의약품안전처와 관세청은 지난 12일부터 해외에서 정상적으로 처방·구매한 자가 치료용 의약품을 용법상 최대 3개월분까지 국내에 직접 들여올 수 있도록 했다. 한국인들의 원정 구매 수요가 늘면서 일본 의료기관들도 발 빠르게 움직이고 있다. 한국어로 비만치료제 처방을 안내하는 병원이 등장하는가 하면 비만치료제 구매와 온천 관광 등을 결합한 여행 코스를 소개하는 인터넷 사이트도 생겨났다. 수요 증가에 따라 약값을 인상한 의료기관도 있는 것으로 전해졌다. 반면 비만치료제 원정 구매 열풍이 의약품 오남용으로 이어질 수","category":"사회"},{"title":"진주 상대동 4층 다가구주택서 불…1명 연기 흡입·6명 대피","link":"https://n.news.naver.com/mnews/article/022/0004177843","naverLink":"https://n.news.naver.com/mnews/article/022/0004177843","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"24일 오후 9시16분쯤 경남 진주시 상대동 4층 다가구 주택 3층에서 화재가 발생했다. 경남 진주시 다가구 주택 화재 현장. 경남소방본부 제공 화재는 인근 주민이 목격 후 119에 신고했고 출동한 소방당국에 의해 내부 수색 중 60대 남성 1명을 발견해 구조했다. 해당 남성은 연기를 흡입하고 의식이 저하된 중상자로 분류됐다. 다가구 주택에 거주하는 6명은 자력으로 대피했다. 출동한 소방대원에 의해 화재는 오후 9시38분쯤 모두 진화됐다. 소방당국은 정확한 화재원인을 조사중이다.","category":"사회"},{"title":"동영상기사","link":"https://n.news.naver.com/mnews/article/052/0002437575","naverLink":"https://n.news.naver.com/mnews/article/052/0002437575","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"[앵커] 서울 양천구에 있는 숙박업소에서 불이 나 50대 남성이 숨졌습니다. 경찰은 장기 투숙객인 이 남성이 직접 불을 질렀을 가능성을 열어두고 있습니다. 사건·사고 소식, 조경원 기자입니다. [기자] 건물 틈으로 희뿌연 연기가 끊임없이 피어오릅니다. 골목길로 소방차가 줄지어 들어서고 곧이어 경광등을 켠 경찰차도 도착합니다. 서울 신정동에 있는 숙박업소에서 불이 났다는 신고가 접수된 건 오전 9시 10분쯤입니다. [화재 목격자 : 막 연기가 나더라고요. 연기가 나고 소방관들은 작전을 짜고 계시더라고요.] 1시간 만에 불을 끈 소방 당국은 객실 안 침대에서 숨져 있는 50대 남성을 발견했습니다. 투숙객 5명은 대피하다 연기를 마셨고, 이 가운데 2명은 경상을 입었습니다. 불이 난 객실 창문 주위가 검게 그을렸고, 깨진 유리창 파편이 이렇게 한데 모여 있습니다. 사망자는 불이 난 숙박업소에 장기 투숙해온 것으로 파악됐습니다. 경찰은 숨진 남성이 불을 질렀을 가능성을 열어두고 부검과 현장 감식으로 정확한 화재 원인을 밝힐 계획입니다. 낮 1시쯤에는 경기 김포시 통진읍에 있는 7층짜리 건물에서 불이 나 30분 만에 꺼졌습니다. 이 불로 다친 사람은 없었고, 건물에 있던 18명이 대피했습니다. 이 건물에는 요양원도 입주하고 있어 하마터면 큰 사고로 이어질 뻔했습니다. 경찰과 소방은 맨 위층에 있는 골프 관련 업체 창고에서 불이 시작된 것으로 보고 정확한 원인과 피해 규모를 조사하고 있습니다. YTN 조경원입니다. 영상기자 : 신홍 화면제공 : 경기 김포소방서 ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"},{"title":"서울 광화문역 근처 택시에서 불...\"보닛에서 연기\"","link":"https://n.news.naver.com/mnews/article/052/0002437560","naverLink":"https://n.news.naver.com/mnews/article/052/0002437560","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"오늘(24일) 저녁 9시 20분쯤 서울 종로구 광화문역 근처 택시에서 불이 나 30분 만에 꺼졌습니다. 이 불로 다친 사람은 없었고, 운전자와 승객 1명이 대피했습니다. 소방은 택시 보닛에서 연기가 났다는 신고 등을 토대로 자세한 화재 원인을 조사하고 있습니다. ※ '당신의 제보가 뉴스가 됩니다' [카카오톡] YTN 검색해 채널 추가 [전화] 02-398-8585 [메일] social@ytn.co.kr","category":"사회"}],"생활·문화":[{"title":"국민연금 68세부터 받는다?…복지장관 직접 해명","link":"https://n.news.naver.com/mnews/article/374/0000545756","naverLink":"https://n.news.naver.com/mnews/article/374/0000545756","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"[정은경 보건복지부 장관 엑스(X) 게시글 캡처] 현행 65세인 국민연금 수급 개시 연령이 68세로 늦춰질 수 있다는 주장이 온라인 상에서 확산하고 있는 가운데 정은경 보건복지부 장관이 직접 반박에 나섰습니다. 정 장관은 25일 소셜미디어를 통해 \"정부는 현재 국민연금 수급개시연령 조정을 검토하고 있지 않다\"며 \"국민연금을 68세부터 받게 된다는 것은 사실이 아니다\"라고 밝혔습니다. 수급개시연령을 두고 이 같은 논란이 불거진 건 국민연금 재정 불안을 해소하기 위한 방안 가운데 수급개시연령 조정이 언급되고 있기 때문입니다. 지난 9월 국회에서 열린 정책토론회에서 국민연금 수급개시연령을 단계적으로 68세로 높이는 방안이 전문가 제안으로 나온 바 있습니다. 국민연금 수급개시연령은 태어난 해에 따라 다릅니다. 1961~1964년생은 63세부터 연금을 받을 수 있습니다. 1965~1968년생은 64세, 1969년 이후 출생자는 65세부터 연금을 받습니다. 정 장관은 \"부정확한 정보가 확산하지 않도록 주의를 기울여 달라\"고 당부했습니다. 당신의 제보가 뉴스로 만들어집니다. SBS Biz는 여러분의 제보를 기다리고 있습니다. 홈페이지 = https://url.kr/9pghjn","category":"생활·문화"},{"title":"서울 지하철 노사 최종교섭 난항…25일 첫차부터 총파업 돌입하나","link":"https://n.news.naver.com/mnews/article/660/0000122124","naverLink":"https://n.news.naver.com/mnews/article/660/0000122124","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"▲서울교통공사 올바른노조 임단협 최종교섭 개시 [연합뉴스] 서울 지하철 1~8호선을 운영하는 서울교통공사 노사가 총파업을 하루 앞두고 최종교섭에 나섰지만 인력 충원 문제 등을 놓고 합의점을 찾지 못하고 있습니다. 교섭이 끝내 결렬될 경우 공사 소속 3개 노동조합은 25일 첫차부터 무기한 총파업에 돌입할 예정입니다. 24일 서울교통공사에 따르면 공사와 3개 노조는 이날 서울 성동구 공사 본사에서 2026년 임금·단체협약 체결을 위한 최종교섭을 진행했습니다. 하지만 노조별 본교섭이 모두 시작 2~4분 만에 정회하면서 노사는 밤까지 실무협의를 이어가고 있습니다. 이날 오전 10시쯤 열린 민주노총 산하 서울교통공사노동조합(제1노조)과의 본교섭은 4분 만에 정회했습니다. 오전 11시쯤 시작된 올바른노동조합(제3노조)과의 교섭 역시 4분 만에 중단됐습니다. 오후 1시 30분쯤 진행된 한국노총 산하 서울교통공사통합노동조합(제2노조)과의 교섭은 불과 2분 만에 정회했습니다. 노사 간 핵심 쟁점은 현장 안전인력 충원 규모와 시기입니다. 제1노조는 서울시와 공사에 지난 2021년부터 올해까지 정원 2,212명을 줄이기로 한 인력 감축 계획을 철회하라고 요구하고 있습니다. 노조 측은 현재 정원보다 부족한 인원 311명과 장기 휴직자 443명, 정년퇴직을 앞둔 승무직 등을 고려하면 최소 785명을 신규 채용해야 한다고 주장하고 있습니다. 공사는 이날 오전 교섭에서 신규 채용 규모와 시기를 서울시와 협의하고 있다고 설명한 것으로 전해졌습니다. 제1·2노조는 앞서 지난 20일부터 안전인력 충원 등을 요구하며 준법투쟁을 이어오고 있습니다. 제3노조와의 교섭에서는 기존 노사 합의 이행 여부도 쟁점으로 떠올랐습니다. 올바른노조는 인력 채용 논의에는 일부 진전이 있었지만, 온라인 포털에서 지하철역 직통 전화번호를 삭제하기로 한 2024년 합의를 공사가 이행하지 않고 있다고 주장했습니다. 노사 간 막판 협상이 이어지는 가운데 서울시는 파업에 대비한 비상수송대책을 마련했습니다. 파업이 시작되더라도 첫 일주일 동안 출근시간대인 오전 7시부터 9시까지 지하철 1~8호선은 평소와 같은 횟수로 운행할 계획입니다. 퇴근시간대인 오후 6시부터 8시까지는 2호선과 5~8호선을 정상 운행하고, 1·3·4호선은 코레일 운행 열차를 포함해 평소의 88% 이상을 유지합니다. 지하철 이용객이 버스로 몰릴 것에 대비해 시내버스도 출퇴근시간대에 하루 총 3,519회 증편","category":"생활·문화"},{"title":"AI가 답하는 시대…기독교학교는 무엇을 가르쳐야 하나","link":"https://n.news.naver.com/mnews/article/079/0004213503","naverLink":"https://n.news.naver.com/mnews/article/079/0004213503","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"2026 사학미션콘퍼런스 AI 시대, 교육 목표와 배움의 과정 성찰 정답 경쟁 넘어 질문하고 판단하는 교육으로 AI 활용의 토대는 기초지식과 풍부한 경험 자연과 일상을 교실로…만남과 경험 강조 공동체·영성 교육 강화…교사는 '스승'으로 [앵커] 사학법인미션네트워크가 인공지능 전환, 이른바 'AX 시대' 기독교 교육의 방향을 모색했습니다. 최근 AI를 이용한 부정행위 논란 속에 기술 활용법을 넘어, 교육의 목표와 배움의 과정부터 돌아봐야 한다는 목소리가 나왔습니다. 오요셉 기자입니다. [기자] AI가 인간보다 더 뛰어난 답을 내놓는 시대, 기독교학교는 어떤 사람을 길러내야 할까. '2026 사학미션콘퍼런스'에서는 AI를 얼마나 잘 활용할 것인가에 앞서, 현행 교육이 추구해 온 목표부터 돌아봐야 한다는 지적이 나왔습니다. 한동대 손화철 교수는 최근 AI 부정행위 논란의 배경으로 시험 한 번의 성적이 삶을 좌우하는 교육 현실을 짚었습니다. 손 교수는 \"'하나님의 형상'을 고민하는 기독교학교라면 정답 경쟁을 넘어, 학생들이 배움의 즐거움 속에서 자유롭게 '왜'라고 묻고 스스로 판단하는 힘을 길러줘야 한다\"고 강조했습니다. [손화철 교수 / 한동대학교] \"지금까지 우리의 교육은 사람을 인공지능처럼 만드는 교육이었습니다. 그러니까 인공지능이 사람처럼 되는 게 문제가 아니고, 사람을 인공지능처럼 만들려고 하는 것이 문제입니다. 미리 정해진 답이 아닌 창의적 대안을 제출하며, 전체를 조망할 수 있는 인재를 키워야 합니다.\" 23일 대전 새로남교회에서 진행된 2026 사학미션콘퍼런스. 오요셉 기자 서울대 AI연구원장 이재욱 교수는 \"교수가 문제를 내고 AI가 답을 만드는 사이, 학생은 결과만 옮기는 '배달부'가 되어가고 있다\"고 경고했습니다. 그러면서 \"AI를 제대로 활용하려면 기초지식과 풍부한 경험이 뒷받침돼야 한다\"며 \"스스로 문제를 찾고 AI가 내놓은 답을 판단할 수 있어야 한다\"고 강조했습니다. [이재욱 교수 / 서울대학교 AI연구원장] \"우리가 알고 있는 기본적인 지식의 빌딩 블록(토대), 경험의 빌딩 블록들이 있는데, 원래는 연관 관계가 없었던 것을 새로운 연관 관계로 묶는 것에서 창의력이 나오는 거거든요. AI를 활용하는 능력도 어떤 풍부한 경험, 풍부한 지식, 기본적인 빌딩 블록을 갖고 있을 때 AI를 우리가 잘 활용할 수 있다…\" 배움의 공간을 교실 밖으로 넓혀야 한다는 제언도 나왔습니다. 건축학자인 유현준 교","category":"생활·문화"},{"title":"다음 달부터 ‘제8차 미세먼지 계절관리제’ 시행…초미세먼지 평균 농도 21.5→19㎍/㎥","link":"https://n.news.naver.com/mnews/article/092/0002446766","naverLink":"https://n.news.naver.com/mnews/article/092/0002446766","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"AI·이동측정차량 스마트 감시 전국 확대…전기차 구매지원 1.6조→2.1조 확대 정부가 다음 달부터 내년 3월까지 ‘제8차 미세먼지 계절관리제’를 시행한다. 계절관리 기간 초미세먼지 평균농도를 지난 제7차의 21.5㎍/㎥에서 19㎍/㎥로 개선하는 것을 목표로 잡았다. 이를 통해 초미세먼지와 생성물질은 13만 7000만톤 줄인다는 계획이다. 핵심 배출원 감축·관리를 위해 대기질 통합관제센터를 설치해 사업장 배출정보와 대기측정 자료를 통합 분석하고, 인공지능(AI)·이동측정차량을 활용한 스마트 감시·단속을 수도권에서 전국으로 확대한다. 또 다배출 사업장의 감축 이행을 기존 416곳에서 450곳으로 확대하는 한편, 영세사업장 맞춤형 기술지원은 중앙·지방정부가 함께 132곳에서 776곳으로 확대해 제공한다. 김진식 기후에너지환경부 대기환경국장이 24일 '제8차 미세먼지 계절관리제' 시행계획을 설명하고 있다. 공공석탄발전은 전력수급 여건을 고려해 최대 15기에서 18기까지 가동을 정지하고 최대 46기의 출력을 80% 수준으로 운전하는 상한제약을 추진한다. 공공·민간 석탄발전소 공히 저유황탄 사용과 방지시설 운영과리를 강화한다. 국민 생활공간 집중 관리를 위해 산불 위험지역 순찰·감시와 영농폐기물 불법소각 단속을 강화하고, 지하역사와 의료기관 등 다중이용시설의 실내공기질 특별점검을 5000곳에서 5500곳으로 10% 확대한다. 또 전기차 구매지원 규모를 1조 6000억원에서 2조 1000억원(2027년 정부안 기준)으로 확대하고 주택과 사회복지시설의 화석연료 난방설비를 히트펌프로 전환하도록 지원하는 등 생활 부문의 친환경 전환을 추진한다. 고농도 미세먼지에 신속하게 대응할 수 있도록 에어코리아 앱을 통해 고농도 예보와 주의보·경보를 자동 안내한다. 광화문과 북악산이 미세먼지로 덮여있다.","category":"생활·문화"},{"title":"결국 그 김치통은 열렸을까…26시간째 이어진 김치통과의 사투 온라인 화제","link":"https://n.news.naver.com/mnews/article/033/0000053620","naverLink":"https://n.news.naver.com/mnews/article/033/0000053620","pubDate":"2026-11-24T12:00:00+09:00","author":"네이버뉴스","description":"구조 요청에 조회수 28만 회·댓글 1200여 개…김치냉장고 제작사까지 소환한 스레드 이용자들 11월 24일 한 스레드 이용자가 김치냉장고에 2년가량 보관한 김치통이 전날 밤부터 열리지 않는다며 도움을 요청한 게시물. 칼과 찬물·뜨거운물, 인공지능이 제안한 방법까지 동원했지만 뚜껑이 열리지 않았다고 적었다. 스레드 캡처 11월 24일 소셜미디어 스레드에서 좀처럼 풀리지 않는 난제가 화제다. 김치통 뚜껑 열기다. 이날 오전 한 스레드 이용자는 김치통 사진 두 장과 함께 도움을 요청하는 글을 올렸다. 김치냉장고에 2년가량 보관했던 김치통의 뚜껑이 전날 밤부터 열리지 않는다는 것이다. 칼을 동원하고 찬물과 뜨거운 물을 번갈아 사용해 봤지만 실패했다. 인공지능(AI)이 알려준 방법도 통하지 않았다. 힘으로 열려다가 잠금장치 하나마저 떨어져 나갔다. “스치니들 제발 도와줘, 이거 멘사도 못 열 듯한데….” 스치니는 스레드 친구를 뜻하는 말이다. 게시자의 구조 요청에 스레드 이용자들이 팔을 걷어붙였다. 김치통 내부와 외부의 압력 차이 때
