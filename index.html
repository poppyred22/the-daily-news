이 올라왔다. 게시글 작성자는 \"출근 시간에 지하철 한가운데 따릉이를 세워두고 정작 본인은 저 멀리 임산부석에 앉아 있는 승객이 있다\"며 불편함을 드러냈다. 사진에는 지하철 객실 통로 한가운데 서울시 공공자전거 한 대가 세워져 있다. 자전거를 가져온 승객의 모습은 보이지 않는다. 게시글을 접한 네티즌들은 평일 지하철에 일반 자전거를 가지고 탔다는 점을 지적했다. 이들은 \"평일에는 접이식 자전거 외에는 지하철에 가지고 탈 수 없는 것으로 안다\", \"민원을 넣어야 하는 것 아니냐\", \"평일 출근길에 자전거를 가지고 탔다가 안내 방송을 듣고 결국 내린 경험이 있다\"며 관련 규정을 언급했다. 특히 공공자전거를 이용한 뒤 지하철에 그대로 싣고 탄 행동을 이해하기 어렵다는 반응도 나왔다. 네티즌들은 \"개인 자전거도 아니고 공공자전거인데 이용을 마친 뒤 반납하고 도착지에서 새로 빌리면 될 일\", \"자전거와 지하철 중 하나를 선택하면 될 텐데 굳이 두 가지를 함께 이용한 이유가 궁금하다\"고 했다. 이 밖에도","category":"생활·문화","naverLink":"https://n.news.naver.com/article/003/0014307298"},{"title":"배우·스태프 부상부터 관객 안전까지…‘예술현장 안심공제’ 첫선","link":"https://n.news.naver.com/article/032/0003481186","pubDate":"2026-11-06T20:08:00+09:00","author":"경향신문","description":"한국예술인복지재단 제공예술 현장의 사고부터 관객 안전사고까지 보장하는 예술인 맞춤형 공제상품이 처음으로 출시됐다.문화체육관광부 산하 한국예술인복지재단은 6일 예술인 공제사업을 공식 출범하고 첫 상품인 ‘예술현장 안심공제’를 출시했다고 밝혔다. 공연·전시 등을 기획·운영하는 예술사업자가 가입할 수 있으며, 출연진과 스태프의 상해·질병부터 관객 안전사고, 시설···","category":"생활·문화","naverLink":"https://n.news.naver.com/article/032/0003481186"},{"title":"홍콩, 이달 중 CCTV에 AI 안면 인식 기술 도입한다","link":"https://n.news.naver.com/article/009/0005759956","pubDate":"2026-11-06T19:33:00+09:00","author":"매일경제","description":"“실종자 및 용의자 추적 위한 것” 공공기관부터 쇼핑몰까지 확산 생성 데이터는 최대 180일 보관홍콩이 이달부터 CCTV를 활용한 스마트 감시 네트워크 전반에 인공지능(AI) 기반..","category":"생활·문화","naverLink":"https://n.news.naver.com/article/009/0005759956"},{"title":"서귀포 중문동 마트 기계실서 불…인명 피해 없어","link":"https://n.news.naver.com/article/003/0014306942","pubDate":"2026-11-06T17:48:05+09:00","author":"뉴시스","description":"[서귀포=뉴시스] 우장호 기자 = 6일 오후 4시18분께 제주 서귀포시 중문동의 한 마트 기계실에서 불이 났다. 신고를 받고 출동한 소방당국은 인력과 장비를 투입해 화재 발생 17분 만인 오후 4시35분께 불을 완전히 껐다. 화재 당시 현장에서는 검은 연기가 분출됐으나, 불이 난 기계실이 마트 본동과 분리된 별개 건물에 위치해 이용객 대피 등의 소동이나 인명 피해는 발생하지 않았다. 소방당국은 송풍기를 이용한 배연 작업을 마치는 대로 정확한 화재 원인과 재산 피해 규모를 조사할 예정이다. ◎공감언론 뉴시스 woo1223@newsis.com","category":"생활·문화","naverLink":"https://n.news.naver.com/article/003/0014306942"},{"title":"李사건 조작기소 여부 수사 특검을 李가 임명?…과거 특검 어땠나","link":"https://n.news.naver.com/article/003/0014306898","pubDate":"2026-11-06T17:41:46+09:00","author":"뉴시스","description":"[서울=뉴시스]권지원 기자 = '조작기소 특검법안'이 국회 본회의 문턱을 통과하면서 이재명 정부 7번째 특검이 출범하게 됐다. 특검 추천 방식의 중립성 논란부터 파견검사 수사권 문제까지 위헌 소지가 산적해 있다는 지적이 여전하다. 국회는 6일 오후 본회의를 열고 무제한 토론(필리버스터) 종결 표결을 거쳐 '윤석열 정권 검찰청, 국가정보원, 감사원 등 국가기관의 조작수사·조작기소 등 의혹 진상규명을 위한 특별검사 임명 등에 관한 법률안'(조작기소 특검법안)을 의결했다. 특검의 수사 대상에는 ▲대장동·위례신도시·백현동 개발 관련 배임 ▲대장동·백현동 관련 공직선거법 위반 ▲김진성 씨 위증교사 ▲쌍방울 대북송금 ▲성남FC 후원금 관련 제3자 뇌물 ▲법인카드 유용 의혹 등 현 대통령 관련 사건에 대한 검찰의 수사·기소가 포함됐다. 이재명 대통령 사건과 함께 문재인 전 정부 당시 제기된 ▲통계 조작 의혹 ▲서해 공무원 피격 및 탈북 어민 강제북송 사건 ▲문 전 대통령 전 사위 특혜 채용 관련 뇌물수수 의혹 ▲사드(THAAD·고고도미사일방어체계) 배치 관련 군사기밀 유출 의혹 ▲월성원전 1호기 경제성 조작 의혹 등도 수사 대상에 명시됐다. 특검팀은 특별검사보 8명, 파견검사 20명, 파견공무원 210명 등 총 309명 규모로 구성된다. 법안 공포 후 특검 추천과 임명 절차가 이어질 예정이다. 특검 후보는 교섭단체인 더불어민주당과 국민의힘, 비교","category":"생활·문화","naverLink":"https://n.news.naver.com/article/003/0014306898"},{"title":"\"왕처럼 즐기는 건강 미식, 지역도 몸도 살린다\" 7일 코엑스서 이색 토크쇼","link":"https://n.news.naver.com/mnews/article/008/0005437865","naverLink":"https://n.news.naver.com/mnews/article/008/0005437865","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"지역에서의 즐거운 체험과 함께 맛있는 음식을 먹으며 건강까지 챙길 수 있다면 사람의 발길이 몰려들기 마련이다. 맛있고 건강한 음식이 어떻게 사람을 지역으로 불러 모으는지 살펴보는 이색 토크쇼가 열려 주목된다. 코엑스가 주최하고 한양대 관광연구소와 웰니스 컨텐츠 전문기업 더블오랩스가 공동주관하는 '한 끼가 지역을 살린다 - 2026 미식관광 토크쇼'가 7일 오전 10시30분부터 오후 1시까지 서울 삼성동 코엑스 C홀 푸드위크 메인 세미나장에서 열린다. 인구 감소로 지역소멸 위기가 커진 가운데, 지역에 외부인을 오게 하고 오래 머물게 하는 수단으로 '현지 식재료로 만든 맛있고 신선한 음식'이 주목받는다. 이번 토크쇼는 기업과 지자체가 지역 먹거리를 상품·스토리·경험·변화로 풀어낸 사례를 한자리에서 소개하고, 음식을 통한 건강 증진과 지역관광 활성화, 생활인구 확대 방안을 함께 이야기한다. 첫 순서인 사례발표에선 네 곳이 무대에 오른다. 한국맥도날드 양형근 이사는 '맛있는 한 끼로 지역을 알린다'를 주제로 보성 녹돈, 창녕 마늘, 진도 대파 등 지역 농산물을 메뉴에 활용해 온 '한국의 맛' 사례를 소개한다. 회사 측에 따르면 이 과정에서 지역 농가로부터 사들인 국내산 식재료는 1100톤이 넘는다. 이어 세종시문화관광재단 김세은 주임은 왕처럼 하루 다섯 끼를 즐기는 1박2일 미식여행 '세종오식'을 발표한다. '세종'이라는 도시 이름에서 이야기를 찾아, 시민 추천과 전문가 인증으로 고른 세종사랑맛집과 전통시장, 청년양조장을 잇는 여행으로 2025~2026년 유료 9회가 모두 매진됐다. 당일형 체험 '세종의 식탁'은 최대 신청 경쟁률 14대 1을 기록했고, 올해부터는 참가비를 지역화폐 '여민전'으로 돌려줘 지역 소비로 이어지게 했다. 7일 코엑스에서 열리는 '한 끼가 지역을 살린다 - 2026 미식관광 토크쇼' 포스터 이미지. /자료=더블오랩스","category":"생활·문화"},{"title":"[정수윤의 길을 걸으며] [53] DNA에 새겨진 리듬","link":"https://n.news.naver.com/mnews/article/023/0004008227","naverLink":"https://n.news.naver.com/mnews/article/023/0004008227","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"전남 함평에 있는 '동창이 밝았느냐' 표지석. /정수윤 제공 신기한 일이다. 여행길에서 만난 노랫가락이 집에 와서도 머릿속에 맴돈다. 시골길 언덕 위에 내 키를 훌쩍 넘는 거대한 비석이 있었는데, 시조 한 수가 멋들어진 한글로 새겨 있었다. “동창이 밝았느냐 노고지리 우지진다/ 소 치는 아이는 상기 아니 일었느냐/ 재 너머 사래 긴 밭을 언제 갈려 하나니.” 동쪽 창으로 햇살 들고 종달새 우니 벌써 아침인데, 소몰이 아이는 까마득한 밭을 어느 세월에 갈려고 아직도 자나. 주변에 아무도 없어서 크게 소리 내어 읽어봤다. 진짜 지저귀는 새소리가 내 목소리 뒤로 깔렸다. 초장, 중장, 종장의 첫 3음절은 크고 또렷하게 읊어야 제맛이다. 아무래도 한국인 DNA에는 3장 6구 12음보라는 시조 음률이 흐르는 게 틀림없다. 조선시대 남구만 선생의 시조다. “구두를 새로 지어 딸에게 신겨주고/ 저만치 가는 양을 물끄러미 바라보다/ 한 생애 사무치던 일도 저리 쉽게 가것네.” 김상옥의 ‘어느 날’이다. 신나서 새 구두 신고 가는 딸의 뒷모습을 보며, 어여쁜 존재가 너무 빨리 달아날까 서운해하는 아버지 마음이 오롯이 담겼다. “내 뭐라 카더노 집에 있어라 안 카더나/ 니 바지 붙은 불도 감당하기 힘들낀데/ 속에 확 붙은 불길은 인자 우째 끌끼고.” 이런 시조도 재미있다. 정현숙의 ‘비슬산 참꽃’이다. 자기 사투리를 그대로 작품으로 가져오니 말맛이 산다. 가슴에 붙은 불을 어떻게 끌 거냐고 타박하는 이의 말투에 정이 가득하다. “아내와 조촐한 식사 설거지는 내가 한다/ 밥그릇 둘 국그릇 둘 숟가락 둘에 접시 두어 개/ 어느 날 숟가락 하나 누가 눈물 참고 씻나.” 부부의 정해진 이별을 밥상 하나로 노래한 게 놀랍다. 고성기의 ‘숟가락 두 개’다. 요즘 외국에서 한국을 찾아온 여행객들에게 한옥과 한복이 인기인데, 우리의 혼이 담긴 시조도 조금씩 읽고 지으며 그 멋을 이어가면 어떨까. 노래할 수 있는 고유의 문예가 있다는 건 무엇과도 바꿀 수 없이 소중하고 아름다운 일이다.","category":"생활·문화"},{"title":"국민의 목소리, 미래를 여는 입법으로… ‘2026 국회 입법박람회’ 성료","link":"https://n.news.naver.com/mnews/article/468/0001278830","naverLink":"https://n.news.naver.com/mnews/article/468/0001278830","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"88개 기업·기관·단체 참여, 국민 생활과 산업 현장의 입법·정책 과제 공유… 온·오프라인 국민 제안 총 618건 접수 수소경제·피지컬 AI·지역균형발전부터 민생·안전까지… 국민 참여형 입법 소통의 장 마련 입법 및 정책 제안대회 우수작 13건 시상… 국회, 우수 제안의 법률안 발의 및 제도개선 연계 추진 2026 국회 입법박람회 [스포츠서울 | 이상배 전문기자] 대한민국 국회(국회의장 조정식)는 지난 5일(목)부터 6일(금)까지 이틀간 국회 중앙잔디광장 등 국회 경내에서 개최한 ‘2026 국회 입법박람회’를 6일(금) 폐막식을 끝으로 성황리에 마무리했다. 이번 박람회는 국민의 다양한 목소리를 직접 듣고 이를 실질적인 입법과 정책으로 연결하는 국민참여형 소통의 장으로 마련됐다. 국회가 국민의 삶을 든든하게 지키는 ‘희망의 울타리’이자 혁신 기업이 새로운 기술과 아이디어를 바탕으로 도약할 수 있도록 지원하는 ‘혁신 기업의 날개’가 되겠다는 취지를 담았다. 특히 국회와 정부, 공공기관, 지방자치단체, 경제·산업계, 문화·예술계, 시민사회단체 및 미래세대 등 총 88개 기업·기관·단체가 참여해 국민 생활과 산업 현장에서 제기된 다양한 입법·정책 과제를 제안하고, 이를 전시와 체험 프로그램을 통해 국민과 공유했다. △ 산업 경쟁력 강화부터 민생 현안까지… 현장의 목소리 618건 접수 이번 박람회에서는 대한민국의 미래 성장동력 확보와 국민 삶의 질 향상을 위한 다양한 정책 과제가 제시됐다. 주요 기업과 산업계는 수소경제 생태계 조성과 피지컬 AI 국제표준 선점 등 미래 산업 육성과 기술 경쟁력 강화를 위한 정책 방향을 제안했다. 공공기관과 지방자치단체는 권역별 우주항공 복합도시 조성, 행정수도 완성, 안전한 디지털 이용환경 구축 등 지역균형발전과 공공서비스 혁신을 위한 과제를 제시했다. 시민·사회단체 등은 교권 회복과 아동 권리 보장, 지역사회 통합돌봄 체계 구축, 소상공인 지원 등 국민 생활과 밀접한 민생 현안에 대한 개선 방안을 전달했다. 국민 누구나 입법 과정에 참여할 수 있도록 운영한 ‘국민입법제안소’와 박람회 공식 홈페이지를 통한 온라인 제안 등을 통해 총 618건의 입법·정책 제안이 접수됐다. 이는 국민이 일상에서 체감하는 문제를 직접 제기하고, 더 나은 사회를 위한 제도 개선에 참여했다는 점에서 의미가 크다. △ 미래세대도 입법 주체로 참여… 청소년의 참신한 정책 아이디어 공유 미래세대의 입법 참여를 확대하","category":"생활·문화"}],"세계":[{"title":"선거 참패 이틀 만에…백악관 집무실·각료회의실 보존 서명한 트럼프","link":"https://n.news.naver.com/article/009/0005759936","pubDate":"2026-11-06T19:19:18+09:00","author":"매일경제","description":"도널드 트럼프 미국 대통령이 백악관 집무실과 각료회의실을 국가기념물로 지정하는 포고문에 서명했다. 공화당의 중간선거 패배 직후 연회장 공사 현장을 방문한 데 이어 백악관 공간을 보..","category":"세계","naverLink":"https://n.news.naver.com/article/009/0005759936"},{"title":"\"관세 300%\" 으름장‥참패하고도 '마이웨이'","link":"https://n.news.naver.com/mnews/article/214/0001534064","naverLink":"https://n.news.naver.com/mnews/article/214/0001534064","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"[뉴스25] ◀ 앵커 ▶ 미국 중간선거에서 참패한 트럼프 대통령이 기존의 관세 정책을 고수하겠단 입장을 밝혔습니다. 미국에 공장을 짓지 않으면 최대 300%의 관세를 물릴 수 있다고 엄포를 놨습니다. LA 신재웅 특파원이 보도합니다. ◀ 리포트 ▶ \"2년도 안 돼 주식시장 최고치만 91번. 여러분의 퇴직연금이 치솟고 있다.\" 중간선거 다음날 주가가 급등하자 트럼프 대통령이 자신의 치적이라며 올린 글입니다. 하루 만에 증시가 곤두박질치자 이번엔 \"주식 폭락은 민주당이 대승을 했기 때문\"이라면서 \"보기 딱하다, 스스로를 탓하라!\"고 비꼬았습니다. 누가 민주당을 뽑으랬냐는 말입니다. 선거 대참패에 여당은 쑥대밭이 되고 모두 자신을 원인으로 지목하고 있지만, 트럼프 대통령은 선거에서 심판당한 정책을 계속 밀어붙일 태세입니다. 우선 관세. 관세가 물가를 올린다는 비판 속에 선거에서 쓴맛을 봤지만, 도리어 쐐기를 박았습니다. [도널드 트럼프/미국 대통령 (현지시간 5일)] \"미국에 제품을 팔면서 공장을 짓지 않는다면 50%, 100%, 150%, 250%, 심지어 300%의 관세를 내야 할 겁니다.\" 관세를 없애면 기업들이 미국에 공장을 짓다 말고 다시 자기들 나라에서 물건을 수출할 거라며 한국을 언급했습니다. 유가를 치솟게 한 이란 전쟁도 마찬가지. 전쟁 때문에 졌다는 걸 곧바로 인정해 놓고도 녹음기를 틀어놓은 듯 똑같은 말만 반복합니다. [도널드 트럼프/미국 대통령 (현지시간 5일)] \"이란의 나머지 부분까지 파괴하고 싶지는 않지만 어쩌면 그렇게 해야 할지도 몰라요. 머지않아 알게 될 겁니다.\" 트럼프는 \"선거 때 분위기가 그랬던 것 같다\"며 \"이건 그냥 흘러가는 한 시점일 뿐이다, 그냥 그런 거\"라고 역사적 참패를 정리했습니다. 패배의 원인도 해법도 외면하고 있지만, 공화당의 오랜 전략가는 이번 결과가 트럼프에겐 엄청난 재앙이며 하루하루 지날 때마다 점점 더 레임덕이 되어갈 거라고 예견했습니다. 로스앤젤레스에서 MBC뉴스 신재웅입니다. MBC 뉴스는 24시간 여러분의 제보를 기다립니다. ▷ 전화 02-784-4000 ▷ 이메일 mbcjebo@mbc.co.kr ▷ 카카오톡 @mbc제보","category":"세계"},{"title":"NETHERLANDS GOVERNMENT","link":"https://n.news.naver.com/mnews/article/091/0010361234","naverLink":"https://n.news.naver.com/mnews/article/091/0010361234","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Weekly Council of Ministers meeting at the Ministry of General Affairs Eelco Heinen (L), Minister of Finance, arrives for the weekly Council of Ministers at the Ministry of General Affairs in The Hague, Netherlands, 06 November 2026. EPA/REMKO DE WAAL","category":"세계"},{"title":"\"이란, 카타르 핵 협상안 검토 중\"…美와 종전 협상 돌파구 기대","link":"https://n.news.naver.com/mnews/article/421/0009275501","naverLink":"https://n.news.naver.com/mnews/article/421/0009275501","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"블룸버그 통신 보도…\"핵 활동 투명성 약속 시 평화 협상 진전\" 트럼프·카타르 국왕 통화…美 중간선거 이후 외교 움직임 무함마드 빈 압둘라흐만 알사니 카타르 총리 겸 외무장관(왼쪽)이 아바스 아라그치 이란 외무장관(오른쪽). 2026.8.27. ⓒ 뉴스1 ⓒ AFP=뉴스1 (서울=뉴스1) 이창규 기자 = 이란이 그동안 논의 대상에서 제외했던 핵 프로그램 관련 협상에 나설 의향을 보이고 있다고 블룸버그 통신이 6일(현지시간) 협상에 정통한 외교관을 인용해 보도했다. 이 외교관에 따르면 이란은 핵 활동과 관련해 중재국인 카타르가 제시한 제안을 검토하고 있다. 카타르가 제시한 제안의 구체적인 내용은 알려지지 않았다. 이란은 앞서 카타르를 통해 미국에 핵 관련 제안서를 전달한 것으로 알려졌다. 이란은 제안서를 통해 △이란 해상 봉쇄 해제 △모든 전선에서의 전쟁 중단 △이란 동결 자산 해제 등 7가지 조건을 제안한 것으로 알려졌다. 도널드 트럼프 미국 대통령은 이란과의 전쟁 주요 목표가 이란의 핵무기 개발을 막는 데 있다고 주장해 왔다. 그러나 이란은 자국의 핵 활동이 철저히 비군사적 목적이라는 입장을 유지했다. 미국과의 전쟁 이후 이란의 핵 활동이 어느 정도 이뤄졌는지는 알려지지 않았으나 핵 활동의 투명성을 높이겠다고 약속하는 것만으로도 평화 협상이 진전될 수 있다고 통신은 전했다. 이번 보도는 트럼프 대통령과 타밈 빈 하마드 알사니 카타르 국왕 간 전화 통화 이후 나왔다. 타밈 국왕은 전화 통화에서 \"대화를 이어가고, 분쟁을 해결하고 추가 확전을 막기 위해 외교적 수단에 의지하는 것이 중요하다\"고 말했다. 지난 3일 열린 미국 중간선거에서 트럼프 대통령과 공화당이 민주당에 상·하원을 모두 내주는 대패를 당하면서 이란 전쟁에도 변화가 생길 것이라는 관측이 제기됐다. 이란 전쟁에 따른 유가 상승이 선거에서 패배한 주요 원인으로 평가되기 때문이다. 트럼프 대통령은 선거 이후 당장 이란에 대한 추가 공습을 감행할 계획은 없다고 밝히기도 했다. 이란도 카타르를 비롯해 중동 국가들과 접촉하는 등 외교적 노력을 이어가고 있다. 아바스 아라그치 이란 외무장관은 지난 5일 사우디아라비아와 카타르 외무장관과 전화 통화를 하고 역내 안정을 구축하기 위한 노력에 대해 논의했으며, 아랍에미리트(UAE), 튀르키예, 쿠웨이트, 키프로스, 요르단 외무장관과도 통화했다.","category":"세계"},{"title":"TANZANIA LISSU VERDICT","link":"https://n.news.naver.com/mnews/article/091/0010361228","naverLink":"https://n.news.naver.com/mnews/article/091/0010361228","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"High Court of Tanzania set to deliver verdict in Tundu Lissu treason trial in Dar es Salaam A police vehicle carrying Tanzania's main opposition party Chadema, Tundu Lissu, drives out of the High Court in Dar es Salam, Tanzania, 06 November 2026. Lissu has been found guilty of inciting unrest and sentenced to four years in jail. EPA/STRINGER","category":"세계"},{"title":"India Hindu Festival","link":"https://n.news.naver.com/mnews/article/077/0007229333","naverLink":"https://n.news.naver.com/mnews/article/077/0007229333","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"India Hindu Festival People crowd a market as they shop ahead of Diwali festival in Mumbai, India, Friday, Nov. 6, 2026. (AP Photo/Rafiq Maqbool)","category":"세계"},{"title":"FRANCE BUS CRASH","link":"https://n.news.naver.com/mnews/article/091/0010361236","naverLink":"https://n.news.naver.com/mnews/article/091/0010361236","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Bus carrying school children in eastern France crashes Police and firefighters work at the scene of an accident where a bus veered off the road between Bourg-en-Bresse and Lent, in Lent, eastern France, 06 November 2026. At least two people, one child and one young adult, are reported to have died, and many others were injured. EPA/MARTIAL TREZZINI","category":"세계"},{"title":"Emirates Abu Dhabi Championship Golf","link":"https://n.news.naver.com/mnews/article/077/0007229336","naverLink":"https://n.news.naver.com/mnews/article/077/0007229336","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Emirates Abu Dhabi Championship Golf Adrian Meronk of Poland hits his 2nd shot on the 18th hole during the second round of the Abu Dhabi Golf Championship in Abu Dhabi, United Arab Emirates, Friday, Nov. 6, 2026. (AP Photo/Altaf Qadri)","category":"세계"},{"title":"GERMANY TONGA DIPLOMACY","link":"https://n.news.naver.com/mnews/article/091/0010361232","naverLink":"https://n.news.naver.com/mnews/article/091/0010361232","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"Tonga's King Tupou VI visits Berlin German President Frank-Walter Steinmeier (2-L) welcomes Tonga's King Tupou VI (L) during a reception with military honors at the German Federal Ministry of Defense, in Berlin, Germany, 06 November 2026. King Tupou VI is on an official visit to Berlin, as Germany and the Kingdom of Tonga are marking 50 years of diplomatic relations, according to the German federal foreign office. EPA/CLEMENS BILAN","category":"세계"}],"IT 과학":[{"title":"태극기 한가운데 테슬라 로고…머스크, 韓시장 9개월 연속 1위 홍보","link":"https://n.news.naver.com/article/003/0014307387","pubDate":"2026-11-06T22:50:25+09:00","author":"뉴시스","description":"[서울=뉴시스]정지연 인턴 기자 = 일론 머스크 테슬라 최고경영자(CEO)가 한국 수입차 시장에서 테슬라의 9개월 연속 1위 소식을 전하며 태극 문양 한가운데 자사 로고를 넣은 합성 이미지를 공유했다. 머스크는 지난 5일(현지시간) 자신의 엑스(X·옛 트위터) 계정에 '테슬라 코리아'(Tesla Korea)라는 문구를 게시하고 국내 수입차 판매 실적을 다룬 다른 이용자의 게시물을 공유했다. 해당 게시물 작성자는 \"테슬라가 한국 수입차 시장에서 벤츠와 BMW를 제치고 1위를 차지했다\"며 \"지난 10월 등록 대수는 9165대로, 지난해 같은 기간보다 110.7％ 늘었다\"고 밝혔다. 함께 첨부된 이미지에는 바람에 펄럭이는 태극기가 담겼다. 태극기의 가운데 태극 문양에는 테슬라의 알파벳 'T' 모양 로고가 들어가 있었다. 한국수입자동차협회(KAIDA)가 발표한 10월 수입 승용차 등록 통계에 따르면 국내 신규 등록 대수는 총 3만1117대였다. 브랜드별로는 테슬라가 9165대를 기록해 가장 많았다. 전체 등록 대수에서 차지하는 비중은 29.5%였다. 이어 메르세데스-벤츠가 6744대로 2위에 올랐고 BMW는 5633대로 3위를 기록했다. 테슬라와 2위 브랜드의 등록 대수 차이는 2421대였다. 차종별 집계에서는 테슬라 모델 Y 프리미엄이 5501대로 1위를 차지했다. 테슬라의 10월 신규 등록 대수는 지난해 같은 달과 비교해 110.7％ 증","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014307387"},{"title":"\"주문 넘쳐서\"…셀트리온, 삼성·롯데와 CMO 손잡는다","link":"https://n.news.naver.com/article/003/0014306755","pubDate":"2026-11-06T16:34:22+09:00","author":"뉴시스","description":"[서울=뉴시스]황재희 기자 = 셀트리온이 삼성바이오로직스·롯데바이오로직스와 CMO(위탁생산) 협력을 모색 중인 것으로 나타났다. 늘어나는 파이프라인과 글로벌 의약품 수요에 대응하기 위해서다. 6일 관련 업계에 따르면, 셀트리온과 롯데바이오로직스가 CMO 협력을 모색하고 있는 것으로 나타났다. 서정진 셀트리온 회장이 롯데바이오와 위탁생산 관련 논의를 진행 중이라고 한 언론이 보도하면서다. 다만 셀트리온은 당장 확정된 사항은 없다는 입장이다. 셀트리온 관계자는 “당사는 늘어나는 파이프라인과 글로벌 의약품 수요에 대응하기 위해 자체 생산시설 가동률을 극대화하는 한편, 외부 CMO 활용을 포함한 다양한 생산 전략을 상시 검토하고 있다”며 “고품질 의약품의 적기 공급을 위한 일반적인 전략 모색 차원이며, 특정 기업과의 협력 여부 등 확정된 사항은 없다”고 밝혔다. 업계에서는 양사의 니즈가 맞아떨어진다면 실제 계약으로까지 성사될 수 있다고 보고 있다. 두 회사 모두 송도에 위치해 물류·운송비용을 절감할 수 있다는 것이 최대 장점이다. 12만 리터 규모의 롯데바이오로직스 송도 1공장은 오는 18일 준공식을 열고 가동에 나선다. 한편 셀트리온은 앞서 삼성바이오로직스와 CMO 계약을 맺은 것으로도 파악됐다. 삼성바이오로직스는 지난 3일 글로벌제약사와 4343억원의 계약을 체결했다고 공시했다. 업계에서는 이 계약이 셀트리온과 맺은 계약으로 봤다. ◎공","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014306755"},{"title":"AI가 API 쓰고 스테이블코인으로 결제…쿠콘·DSRV 맞손","link":"https://n.news.naver.com/article/003/0014306357","pubDate":"2026-11-06T14:34:09+09:00","author":"뉴시스","description":"[서울=뉴시스]오동현 기자 = 쿠콘이 블록체인 인프라 기업 DSRV와 손잡고 블록체인 기반 금융 데이터와 인공지능(AI) 에이전트 결제 사업에 나선다. 쿠콘은 DSRV와 온체인 금융 데이터 응용프로그래밍 인터페이스(API) 및 AI 에이전트 결제 분야 협력을 위한 업무협약(MOU)을 맺었다고 6일 밝혔다. 온체인 데이터는 블록체인 네트워크에 기록되는 거래 정보 등을 말한다. 두 회사가 먼저 검토하는 분야는 스테이블코인의 결제·수납·정산 정보를 제공하는 API다. 금융기관과 기업이 블록체인 네트워크를 직접 조회하지 않고도 기존 금융 API처럼 지갑 잔액과 거래내역 조회, 입금 감지, 거래 확정 여부 확인, 정산용 데이터 제공 등의 기능을 쓸 수 있게 하는 것이 핵심이다. 쿠콘은 온체인 데이터를 API 형태로 금융기관·핀테크·기업 고객에게 제공하는 방안을 구체화하고, DSRV는 여러 블록체인의 데이터를 모아 처리하는 인프라를 바탕으로 원천 데이터 수집·처리와 기술 연동을 맡는다. AI 에이전트 결제 분야에서도 협력한다. 쿠콘이 MCP(모델 컨텍스트 프로토콜)로 제공하는 데이터 API에 x402 결제 프로토콜을 적용하고, DSRV의 지갑 기술과 블록체인 인프라를 연결하는 방식이다. x402는 API를 호출할 때 스테이블코인으로 결제를 처리하는 개방형 규약이다. 이를 적용하면 AI 에이전트가 별도 가입이나 계약 없이 필요한 API를 찾아 쓰","category":"IT 과학","naverLink":"https://n.news.naver.com/article/003/0014306357"},{"title":"김영대 부산보훈병원장, 제55대 대한심장혈관흉부외과학회장에","link":"https://n.news.naver.com/mnews/article/296/0000107006","naverLink":"https://n.news.naver.com/mnews/article/296/0000107006","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"김영대 부산보훈병원장이 내년 1월부터 제55대 대한심장혈관흉부외과학회장을 맡는다. 사진=부산보훈병원 김영대 부산보훈병원장이 제55대 대한심장혈관흉부외과학회장에 선임됐다. 임기는 내년 1월부터 1년. 부산대 의대를 졸업한 심장혈관흉부외과 전문의다. 2007년부터 부산대병원 교수로 재직하며 폐암 등 폐·식도 질환의 진료와 연구에 힘써왔다. 2019년부터는 부산권역외상센터장을 맡아 지역 중증외상 진료체계 발전을 이끌었다. 특히 보건복지부 권역외상센터 평가에서 2021~2022년 2년 연속 전국 1위를 기록하고, 4년 연속 A등급을 받는 성과를 거뒀다. 대한외상학회장도 역임했으며 올해 6월 임기를 마쳤다. 지난 8월 제16대 부산보훈병원장에 취임한 데 이어 이번 학회장 선임으로 중증외상과 심장혈관흉부외과 등 필수의료 분야에서 학술 활동을 이어가게 됐다.","category":"IT 과학"},{"title":"민주당 규제론에… 트럼프 \"AI는 황금, 어리석은 지도자만 반대\"","link":"https://n.news.naver.com/mnews/article/469/0000964146","naverLink":"https://n.news.naver.com/mnews/article/469/0000964146","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"'선거 승리' 민주당 데이터센터 규제론 반박 \"난 100% 찬성, 부자되고 싶은 주와 협력\" 도널드 트럼프 미국 대통령이 5일 미국 워싱턴 백악관 집무실 책상에 '거부권(VETO)'이라는 문구가 적힌 모자를 놓은 채 발언하고 있다. 워싱턴=AP 뉴시스 도널드 트럼프 미국 대통령이 인공지능(AI)을 황금에 비유하며 \"어리석은 지도자만 그것이 가져다주는 부에 반대한다\"고 강조했다. 미국 중간선거에서 승리한 민주당 측 인사들이 'AI 데이터센터'에 대한 반대 입장을 잇따라 표명하고 뉴욕증시 하락으로까지 이어지자 대응에 나선 것으로 보인다. 트럼프 대통령은 6일(현지시간) 사회관계망서비스(SNS) 트루스소셜을 통해 \"대통령으로서 나는 초지능(SI·트럼프 대통령이 AI를 대체해 부르는 말)에 100% 찬성하며, 이를 유치해 부자가 되고 싶어 하는 미국의 많은 주들과 협력할 것\"이라고 적었다. 이어 \"그것은 금(GOLD)이다\"라며 \"어리석은 지도자(foolish leadership)만이 그것이 가져다주는 부에 '노(NO)'라고 말할 것\"이라고 덧붙였다. 게시물에서 민주당을 직접 언급하진 않았지만, 맥락상 'AI 데이터센터'에 반대 목소리를 내는 민주당 인사들을 겨냥한 것으로 읽힌다. 미국 중간선거에서 데이터센터 문제는 공화당과 민주당의 첨예한 쟁점이었다. 민주당이 상·하원 다수당이 되면서 데이터센터 신규 건설 중단과 유예 조치가 현실화할 것이라는 우려가 커지고 있다. 데이터센터 개발이 가장 활발한 텍사스의 지나 히노호사(민주당) 당선인은 전날 미 CNN방송 인터뷰에서 주민 보호를 위한 법적 장치가 마련될 때까지 데이터센터 관련 사업 추진을 중단해야 한다고 강조했다. 우려는 시장에도 반영되고 있다. 전날 나스닥 종합지수는 기술주 중심의 급락이 이어지며 전장보다 5.52% 하락한 채 마감했다. 스탠더드앤드푸어스(S&P) 500지수도 4.4% 떨어지며 2025년 4월 이후 최대폭으로 하락했다.","category":"IT 과학"},{"title":"삼성·젠틀몬스터 AI 글래스, 美서 12일 사전예약…호아킨 피닉스 앞세워","link":"https://n.news.naver.com/mnews/article/008/0005437864","naverLink":"https://n.news.naver.com/mnews/article/008/0005437864","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"삼성전자가 7월 22일 영국 런던 올드 빌링스게이트에서 갤럭시 언팩 2026 행사를 열고 인텔리전트 아이웨어의 주요 기능과 새로운 디자인 2종을 공개했다./사진 제공=삼성전자 삼성전자와 젠틀몬스터가 협업한 AI(인공지능) 글래스가 미국에서 12일 사전예약에 들어간다. 젠틀몬스터는 할리우드 배우 호아킨 피닉스가 출연한 티저 영상을 공개하며 신제품 출시를 예고했다. 젠틀몬스터는 6일 호아킨 피닉스와 영화감독 조나단 글레이저가 참여한 '인텔리전트 아이웨어' 캠페인 필름의 티저 영상을 선보였다. 전체 영상은 이달 중 공개할 예정이다. 이번 제품은 삼성전자와 구글, 퀄컴이 협력하는 AI 글래스 프로젝트와 관련된 제품이다. 젠틀몬스터는 디자인 분야에서 협업하고 있으며 미국 아이웨어 브랜드 워비파커도 참여하고 있다. 워비파커 역시 12일부터 사전예약을 시작할 예정이다. 캠페인 영상은 낯선 호텔에서 기묘한 경험을 마주하는 세일즈맨의 이야기를 담았다. 호아킨 피닉스가 연기한 주인공은 현실과 환상이 뒤섞인 공간에서 정체를 알 수 없는 존재들과 마주한다. 이후 AI 안경을 통해 이들의 언어를 이해하고 소통하기 시작한다. 연출은 영화 '언더 더 스킨', '존 오브 인터레스트' 등을 제작한 조나단 글레이저 감독이 맡았다. 젠틀몬스터는 제품 기능을 직접 설명하는 대신 초현실적인 이야기를 통해 AI 안경이 제공할 새로운 경험을 표현했다고 설명했다. 삼성전자와 구글, 퀄컴이 협력하는 AI 글래스는 음성 기반 AI 비서와 실시간 번역, 길 안내, 카메라를 활용한 정보 검색 등의 기능을 지원할 것으로 예상된다. 삼성전자와 구글은 젠틀몬스터, 워비파커 등 글로벌 아이웨어 브랜드와 협력해 일상에서 착용할 수 있는 디자인 개발에도 나섰다. 다만 구체적인 제품 사양과 가격 등은 공개되지 않았다. 젠틀몬스터는 13일부터 23일까지 미국 뉴욕에서 일반 소비자를 대상으로 한 공개 체험 행사도 진행한다. 국내 출시 및 사전예약 일정은 아직 발표되지 않았지만 업계에서는 12월 출시 가능성이 거론된다.","category":"IT 과학"},{"title":"477건 쏟아진 AI 법안…전략위, '기본법' 중심 교통정리","link":"https://n.news.naver.com/mnews/article/293/0000092865","naverLink":"https://n.news.naver.com/mnews/article/293/0000092865","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"하정우 국가인공지능(AI)전략위원회 상근 부위원장이 6일 서울 중구 서울스퀘어에서 제3차 전체회의를 주재하고 있다./사진 제공=국가AI전략위원회 국가 인공지능(AI) 전략을 총괄하는 국가AI전략위원회(AI전략위)가 출범 2년 차를 맞아 각 부처에 파편화된 AI 관련 법률 난립을 막기 위해 입법 가이드라인을 세우는 동시에 국민과 기업이 체감할 수 있는 현장 중심 성과를 내기 위해 거버넌스를 전면 재편한다. 특히 부처 간 데이터 칸막이를 허물어 848개 공공기관의 원천 데이터를 한곳에서 연계하는 범정부 파이프라인을 구축해 글로벌 AI 패권 경쟁 속 대한민국 AI 생태계의 실행력을 극대화한다는 전략이다. 신규 입법보다 기존 법체계 정비 우선 AI전략위는 6일 하정우 상근 부위원장 주재로 서울 중구 서울스퀘어에서 제3차 전체회의를 열었다. 이날 회의에는 이재명 정부의 AI 정책을 주도하는 하 부위원장, 배경훈 부총리 겸 과학기술정보통신부(과기정통부) 장관, 이해민 청와대 AI미래기획 수석을 포함해 정부·민간 위원, 관계 기관장 등 60여명이 참석했다. 이번 회의에서 AI전략위는 범정부 차원의 AI 입법 프레임워크를 마련하기로 했다. AI 기술이 의료·국방·제조·교육 등 산업 전반으로 확산하면서 관련 법률 제·개정 수요가 급증하자 정부 차원의 일관된 입법 원칙을 마련하기 위한 조치다. 22대 국회 개원 이후 약 29개월간 발의된 법률안 중 AI를 명시한 제·개정안은 477건으로 집계된다. 이는 21대 국회 4년간 발의된 170건과 비교하면 월평균 기준 약 4.7배 증가한 수치다. 업계 안팎에선 기술 진흥부터 딥페이크 오남용 방지, 산업별 AI 전환(AX)까지 부처별·의원별로 산발적으로 법안 발의가 이어지며 법안 간 충돌과 정책 피로도가 커졌다는 지적이 제기됐다. 범정부 차원 'AI 입법 프레임워크' 요약./사진 제공=국가인공지능(AI)전략위원회","category":"IT 과학"},{"title":"자체 엔진 기반 오픈월드 기술 공개… ‘붉은사막’ 개발진, 지스타 G-CON 강연","link":"https://n.news.naver.com/mnews/article/109/0005636046","naverLink":"https://n.news.naver.com/mnews/article/109/0005636046","pubDate":"2026-11-06T12:00:00+09:00","author":"네이버뉴스","description":"펄어비스 제공. [OSEN=고용준 기자] 글로벌 마켓에서 차세대 기술력 지표를 공인받은 국산 대작 타이틀이 국내 최대 규모의 개발자 콘퍼런스 전장에 출격해 고유의 엔진 아키텍처 노하우를 전면 공개한다. 오픈월드 액션 RPG ‘붉은사막’의 핵심 개발진들이 국내 대표 게임 개발자 콘퍼런스인 ‘G-CON 2026’ 메인 연사로 합류해 기술 상보를 공유한다. 지스타의 핵심 연계 행사이자 국내외 탑티어 개발자들이 전개하는 전술 교류의 장인 G-CON 2026은 오는 11월 19일 낮 12시 부산 벡스코 컨벤션홀 3층 특설 무대에서 개최된다. 이번 기술 세션에는 개발사 내부에서 전장의 그래픽과 공간 설계를 전담해 온 안근태 아트레벨 실장과 윤진호 게임엔진 그래픽스 실장이 전면 배치되어 국내 인프라 확장에 기여할 전망이다. 두 연사는 ‘붉은사막: 광활한 파이웰 대륙을 구현한 과정과 자체 엔진 기반 대규모 오픈월드 제작 기술’이라는 명확한 기술 팩트를 주제로 강연대에 오른다. 이번 콘퍼런스를 통해 공개될 세부 데이터는 외산 상용 엔진 의존도를 낮추고 독자 아키텍처 구축을 고심하는 국내외 개발사들에게 실질적인 가이드라인을 제공할 것으로 기대된다. 붉은사막의 메인 무대이자 사막, 설원, 초원 등 다채로운 기후 지표를 유기적으로 연동한 파이웰 대륙을 구현해 나간 실제 개발 공정 라인업이 세부적으로 다뤄진다. 특히 펄어비스가 다년간 공들여 빌딩해 온 차세대 개발 엔진 ‘블랙 스페이스 엔진(Black Space Engine)’을 활용한 대규모 오픈월드 렌더링 제작 기술 노하우가 베일을 벗는다. 개발진은 상용 엔진의 규격화된 한계를 극복하기 위해 자체 엔진 내부에서 빛의 물리적 산란을 시뮬레이션하는 그래픽스 파이프라인 개편 공정과 대규모 유저 트래픽 유입 시 발생할 수 있는 렌더링 병목 현상을 제어한 밸런싱 최적화 데이터를 공유할 방침이다. 아울러 개발자의 관점에서 해석한 게임 세계관의 물리적 공간 구성 과정과 플레이어의 실시간 전장 체류 및 몰입감 지표를 끌어올리기 위해 축적해 온 창작적·기술적 고민 데이터를 다채롭게 나눌 예정이다. 오픈월드 특유의 심리스 전장 환경에서 오브젝트와 캐릭터 간의 충돌 물리 매커니즘을 자연스럽게 구현하는 전술과, 단순한 비주얼 구현을 넘어 유저가 생태계와 상호작용하는 인지적 공간을 설계하는 빌드업 공정이 기획자들의 표심을 겨냥한다. 국내 세션에 앞서 글로벌 테크   $("#count").textContent=total+"개 · 오늘 기사 · "+(data.generatedAt||"").replace("T"," ").slice(0,16)+" 기준";
}
function makeEasySummary(raw){
  let text=String(raw||"").replace(/\[[^\]]{0,45}기자\s*=\s*/g,"").replace(/◎공감언론[\s\S]*$/g,"").replace(/\s+/g," ").trim();
  text=text.replace(/^.{0,45}기자\s*=\s*/,"");
  const parts=text.split(/(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>12);
  const selected=(parts.length?parts:[text]).slice(0,3);
  const endings=[
    [/밝혔다[.!]?$/,"밝힘"],[/설명했다[.!]?$/,"설명함"],[/전했다[.!]?$/,"전함"],[/발표했다[.!]?$/,"발표함"],[/말했다[.!]?$/,"말함"],[/주장했다[.!]?$/,"주장함"],[/촉구했다[.!]?$/,"촉구함"],[/요구했다[.!]?$/,"요구함"],[/나섰다[.!]?$/,"나섬"],[/이어졌다[.!]?$/,"이어짐"],[/됐다[.!]?$/,"됐음"],[/되었다[.!]?$/,"됐음"],[/했다[.!]?$/,"했음"],[/있었다[.!]?$/,"있었음"],[/없었다[.!]?$/,"없었음"],[/이다[.!]?$/,"임"],[/있다[.!]?$/,"있음"],[/없다[.!]?$/,"없음"],[/한다[.!]?$/,"함"],[/예정이다[.!]?$/,"예정"],[/것으로 보인다[.!]?$/,"것으로 보임"]
  ];
  return selected.map(s=>{
    let line=s.replace(/^[-•\s]+/,"").replace(/\s+/g," ").trim();
    for(const [pattern,replacement] of endings){if(pattern.test(line)){line=line.replace(pattern,replacement);break;}}
    return "· "+line;
  }).join("\n");
}
function naverNewsUrl(x){
  return String(x.naverLink||x.link||"");
}
function isHeadlineEcho(title,raw){
  const normalize=s=>String(s||"").toLowerCase().replace(/[^가-힣a-z0-9]/g,"");
  const t=normalize(title),d=normalize(raw);
  if(!t||!d) return false;
  if(d.startsWith(t)) return true;
  return t.length>=18&&d.includes(t);
}
function story(x,i,featured){
  const title=esc(x.title||"제목 없음");
  const rawDescription=String(x.description||"").trim();
  const repeated=isHeadlineEcho(x.title,rawDescription)||/기사에서 관련 배경과 주요 내용을 확인할 수 있습니다/.test(rawDescription);
  const description=repeated?"":esc(makeEasySummary(rawDescription));
  const href=attr(naverNewsUrl(x));
  const isOpen=window.openStoryLink===x.link;
  const summaryMarkup=description?'<p class="detail-summary">'+description+'</p>':'<p class="detail-summary">요약을 확보하지 못했어요. 원문에서 핵심 내용을 확인해 주세요.</p>';
  return '<article class="story"><button class="story-title" type="button" data-open="'+i+'" aria-expanded="'+(isOpen?'true':'false')+'">'+title+'</button>'+(isOpen?'<div class="story-detail">'+summaryMarkup+'<a class="original-link" href="'+href+'" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></div>':'')+'</article>';
}
function favoritePreferenceScore(x,category){
  if(!Array.isArray(saved)||!saved.length) return 0;
  const stop=new Set(["오늘","어제","이번","지난","관련","대한","통해","위해","경우","이후","당시","현재","최근","기자","밝혔다","전했다","설명했다","발표했다","말했다","한국","서울","정부","기업","사회","세계","사건","사고","문화","생활"]);
  const words=s=>String(s||"").toLowerCase().match(/[가-힣]{2,8}|[a-z]{3,}/g)||[];
  const counts={};
  for(const item of saved){
    for(const w of new Set(words((item.title||"")+" "+(item.description||"")))){
      if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
    }
  }
  const article=new Set(words((x.title||"")+" "+(x.description||"")));
  let score=0;
  for(const w of article) if(counts[w]) score+=Math.min(4,counts[w])*1.5;
  const sameCategory=saved.filter(s=>s.category===category).length;
  if(sameCategory) score+=Math.min(3,sameCategory)*0.8;
  return Math.min(8,score);
}
function pickScore(x,category){
  const t=((x.title||"")+" "+(x.description||"")).toLowerCase();
  const signals=[
    ["세계 최초|최초 공개|처음으로|이례적|전례 없는|기록 경신|신기록",5],
    ["기적|감동|재회|구조|구하다|살렸다|선행|나눔|헌신|가족",4],
    ["뜻밖|반전|놀라운|신기한|희귀|이색|화제|눈길|특별한|정체",3],
    ["발견|발명|새로운 종|미스터리|수수께끼|우주|심해|고대",3],
    ["논란|충격|분노|참사|사고|범죄|피해|속보|불공정|반발",2]
  ];
  let score=0;
  for(const [words,points] of signals) if(new RegExp(words,"i").test(t)) score+=points;
  if(x.priority) score+=8;
  if(category==="생활"||category==="생활·문화"){
    if(/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|쿠팡|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=6;
    if(/논란|불만|피해|차별|사기|안전|감동|선행|기부|나눔|새로|바뀐다|도입|시행/.test(t)) score+=3;
    if(/전시|공연|콘서트|신간|앨범|미술전|연주회/.test(t)) score-=2;
  }
  
  if((category==="생활"||category==="생활·문화")&&/물가|장바구니|월세|전세|집값|교통비|전기요금|가스요금|통신비|병원비|소비자|환불|수수료|노동|임금|돌봄|육아|교육비|연금|복지|배달|택배|개인정보|반려동물|가족|청년|노인/.test(t)) score+=5;
  if(category==="사회"&&/민생|노동|주거|교육|복지|청년|노인|장애|돌봄|의료|지역|주민|시민|불평등|안전|논란|반발|피해/.test(t)) score+=3;
  if(category==="사건 사고"&&/사고|화재|붕괴|추락|충돌|실종|구조|재난|참사|사망|부상|범죄|폭행|사기|수사|피해/.test(t)) score+=3;
  if((x.description||"").length>90) score+=1;
  return score;
}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  if(showPopular){
    const list=((window.NEWS_DATA||{}).days?.today?.popular||[]).filter(x=>!q||((x.title||"")+" "+(x.description||"")).toLowerCase().includes(q));
    $("#count").textContent=list.length+"개의 네이버 랭킹 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="sectionhead"><strong>네이버 언론사별 많이 본 뉴스</strong><span>수집 시점 기준</span></div><div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">오늘 네이버 랭킹 기사를 가져오지 못했어요. <a href="https://news.naver.com/main/ranking/popularDay.naver" target="_blank" rel="noopener noreferrer">네이버 랭킹뉴스에서 직접 보기 ↗</a></div>';
    return;
  }
  const matches=x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.author||"")).toLowerCase().includes(q);
  if(showSaved){
    const list=saved.filter(matches);
    $("#count").textContent=list.length+"개의 저장 기사";
    window.renderedStories=list;
    $("#feed").innerHTML=list.length?'<div class="restlist">'+list.map((x,i)=>story(x,i,false)).join("")+'</div>':'<div class="empty">저장한 기사가 없어요.</div>';
    return;
  }
  const allDays=window.dailyDays||[];
  const todayKey=seoulDateKey(new Date());
  const yesterdayKey=dateOffsetKey(todayKey,-1);
  const days=dayFilter==="all"?allDays:allDays.filter(d=>d.date===(dayFilter==="today"?todayKey:yesterdayKey));
  const categoryOrder=categories.filter(c=>c[1]).map(c=>c[1]);
  const rendered=[];
  let html="";
  let visibleCount=0;
  for(const day of days){
    const dayCategories=day.categories||{};
    html+='<section class="day-block"><div class="dayhead"><strong>'+(day.date===todayKey?'오늘 · ':'')+esc(compactDate(day.date))+'</strong><span>'+Object.values(dayCategories).reduce((n,rows)=>n+(rows||[]).length,0)+'개</span></div>';
    const names=category===""?categoryOrder:[category];
    for(const catName of names){
      const rows=(dayCategories[catName]||[]).filter(matches);
      if(!rows.length) continue;
      const ranked=rows.map(x=>({x,score:pickScore(x,catName)})).sort((a,b)=>b.score-a.score||new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const picks=ranked.slice(0,3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      const rest=ranked.slice(3).sort((a,b)=>category==="생활·문화"?b.score-a.score:new Date(b.x.pubDate)-new Date(a.x.pubDate));
      visibleCount+=rows.length;
      if(category===""){
        const label=categories.find(c=>c[1]===catName)?.[0]||catName;
        html+='<div class="categoryhead"><strong>'+esc(label)+'</strong><span>'+rows.length+'개</span></div>';
      }
      if(picks.length){
        html+='<div class="sectionhead"><strong>'+(day.date===todayKey?'오늘의 픽':'어제의 픽')+'</strong><span>'+picks.length+'개</span></div><div class="featured">';
        for(const p of picks){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,true);}
        html+='</div>';
      }
      if(rest.length){
        html+='<div class="sectionhead rest-heading"><strong>기사</strong><span>'+(catName==='생활·문화'?'생활밀접순 ':'최신순 ')+rest.length+'개</span></div><div class="restlist">';
        for(const p of rest){const idx=rendered.push(p.x)-1;html+=story(p.x,idx,false);}
        html+='</div>';
      }
    }
    html+='</section>';
  }
  window.renderedStories=rendered;
  $("#count").textContent=visibleCount+"개 · "+(dayFilter==="today"?"오늘":dayFilter==="yesterday"?"선택한 날짜":"전체 날짜")+" 기사";
  $("#feed").innerHTML=visibleCount?html:(dayFilter==="today"?"<div class=\"empty\">오전 10시 업데이트 대기중</div>":'<div class="empty">해당 날짜에 표시할 기사가 없어요.</div>');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s)}

$("#date-tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;dayFilter=b.dataset.day;showSaved=false;showPopular=false;drawTabs();drawDateTabs();render();});
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.saved){showSaved=!showSaved;showPopular=false;drawTabs();render();return}if(b.dataset.popular){showPopular=true;showSaved=false;drawTabs();render();return}category=b.dataset.q;showSaved=false;showPopular=false;drawTabs();load()});
$("#feed").addEventListener("click",e=>{let open=e.target.closest("[data-open]");if(open){let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(open.dataset.open)];if(!x)return;window.openStoryLink=window.openStoryLink===x.link?null:x.link;render();return;}let b=e.target.closest("[data-save]");if(!b)return;let list=showSaved?saved:(window.renderedStories||items);let x=list[Number(b.dataset.save)];if(!x)return;let exists=saved.some(s=>s.link===x.link);saved=exists?saved.filter(s=>s.link!==x.link):[x,...saved];try{localStorage.setItem("tdn_saved",JSON.stringify(saved));}catch(e){}render()});
$("#search").addEventListener("input",render);$("#refresh").addEventListener("click",load);drawTabs();load();
</script></body></html>
