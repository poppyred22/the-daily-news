window.NEWS_DATA = {"date":"2026-11-19","generatedAt":"2026-11-19T11:07:57.068477+09:00","total":148,"days":{"today":{"date":"2026-11-19","weekday":"목요일","label":"오늘 · 11월 19일 목요일","total":50,"categories":{"사건 사고":[{"title":"술 종류 따라 심장병 사망 위험 달랐다…위험 낮은 술은?","link":"https://n.news.naver.com/mnews/article/092/0002445952","naverLink":"https://n.news.naver.com/mnews/article/092/0002445952","pubDate":"2026-11-19T11:05:57.277555+09:00","author":"네이버뉴스","description":"와인 마시면 심혈관 질환 사망위험 20% 낮아 마시는 술 종류에 따라 심혈관 질환으로 사망할 위험이 크게 달라질 수 있다는 연구 결과가 나왔다. 과학매체 사이언스데일리는 중국 중남대학교 샹야2병원 잔링 천(Zhangling Chen) 교수 연구팀이 미국심장학회 연례 학술대회(ACC 2026)에서 적당량의 와인을 마시는 사람은 심혈관 질환으로 사망할 위험이 21% 낮다는 연구 결과를 발표했다고 최근 보도했다. 연구진은 음주 습관과 사망 위험의 연관성을 조사하기 위해 2006년부터 2022년까지 영국 바이오뱅크(UK Biobank)에 등록된 성인 34만 924명의 데이터를 분석했다. 참가자들의 건강 상태를 평균 13년 이상 추적 관찰하며 음주 패턴이 다양한 원인에 의한 사망 위험과 어떤 관련이 있는지 살펴봤다. 와인·맥주·증류주, 심장 건강에 미치는 영향 달라 적당량의 와인을 마시는 사람은 심혈관 질환으로 사망할 위험이 21% 낮다는 연구 결과가 나왔다. (사진=클립아트코리아) 가장 뚜렷한 결과는 과도한 음주와 관련해 나타났다. 술을 전혀 마시지 않거나 가끔 마시는 사람들과 비교했을 때 과음하는 사람은 전체 사망 위험이 24% 높았다. 암으로 사망할 위험은 36%, 심장 질환으로 사망할 위험은 14% 각각 높게 나타났다. 반면 알코올 섭취량이 적거나 중간 정도인 사람들의 경우 술 종류에 따라 사망 위험이 상당한 차이를 보였다. 와인을 적당량 마시는 사람은 사망 위험이 상대적으로 낮았지만, 맥주와 사과주, 증류주를 비슷한 수준으로 마시는 사람은 오히려 사망 위험이 높은 것으로 나타났다. 이런 차이는 특히 심혈관 질환에서 두드러졌다. 적당량의 와인을 마시는 사람은 술을 전혀 마시지 않거나 가끔 마시는 사람보다 심혈관 질환으로 사망할 위험이 21% 낮았다. 반면 맥주와 사과주, 증류주를 소량 섭취하는 사람은 심혈관 질환으로 사망할 위험이 오히려 9% 높았다. 다만 이 수치는 집단 간 상대적인 위험도 차이를 의미하며, 개인이 심혈관 질환으로 사망할 절대적인 확률을 나타내는 것은 아니다. 또한 이번 연구는 관찰 연구이기 때문에 특정 종류의 술을 마시는 행위가 사망 위험을 직접적으로 낮추거나 높인다는 인과관계를 입증한 것은 아니다. 이미지=클립아트코리아","category":"사건 사고"},{"title":"바이낸스, 65억 달러 자산동결 명령 확보…해킹 피해 회수 추진","link":"https://n.news.naver.com/mnews/article/092/0002445965","naverLink":"https://n.news.naver.com/mnews/article/092/0002445965","pubDate":"2026-11-19T11:05:57.277529+09:00","author":"네이버뉴스","description":"탈취 자산 이동 제한·반환 위한 법적 근거 마련 글로벌 가상자산 거래소 바이낸스가 지난달 발생한 대규모 해킹 사고와 관련해 법원으로부터 65억 달러 규모 자산동결 명령을 받았다. 이번 조치로 탈취 자산 이동을 법적으로 제한하고 회수할 수 있는 근거를 마련했다. 아랍에미리트(UAE) 아부다비글로벌마켓 법원은 바이낸스 해커를 대상으로 65억 달러 규모 전세계 자산동결 명령을 내렸다고 가상자산 전문 외신 코인텔레그래프가 19일(현지시간) 보도했다. 법원은 일부 탈취 자산 반환을 위한 별도 명령도 발부했다. 바이낸스 로고 이번 명령은 지난달 29일 발생한 바이낸스 해킹 사고에 대한 조치다. 당시 해커는 바이낸스에서 약 63억 4000만 달러 규모 가상자산을 탈취했다. 이번 법원 명령으로 바이낸스는 가상자산 발행사, 거래소 등과 협력해 탈취 자산 회수에 나설 수 있는 법적 근거를 확보했다. 일부 가상자산 발행사와 거래소는 동결한 자산을 원래 소유자에게 반환하기 위해 법원 명령 등 법적 근거를 요구한다. 바이낸스는 법원 명령을 근거로 발행사와 거래소 등에 자산 추가 이동 차단, 반환 등을 요구할 수 있다. 미국 법무부도 지난 12일 바이낸스 해킹 사고와 관련해 12억 달러 이상 가상자산을 압류하거나 처분을 제한할 수 있도록 법원 승인을 받았다고 발표했다. 당시 미국 당국과 민간 기업이 동결·차단한 자산은 총 27억 달러 이상으로 집계됐다. 향후 실제 자산 반환 여부도 주목된다. 일부 스테이블코인은 발행사가 특정 지갑 주소 토큰을 동결할 수 있지만, 비트코인과 이더리움은 중앙 발행사가 없어 같은 방식으로 동결하기 어렵기 때문이다. 한편 바이낸스는 자체 보유자금과 이용자보호기금(SAFU), 보험기금 등을 활용해 해킹 피해에 따른 이용자 자산 보전을 완료했다고 밝혔다.","category":"사건 사고"},{"title":"$TRUMP 홍보 만찬 최소 참가비 100분의 1 이하로 추락","link":"https://n.news.naver.com/mnews/article/003/0014331813","naverLink":"https://n.news.naver.com/mnews/article/003/0014331813","pubDate":"2026-11-19T11:05:56.801743+09:00","author":"네이버뉴스","description":"대통령 취임 직후 1차 만찬 때 7326만 원 세 번째로 열리는 22일 만찬은 69만 원 [서울=뉴시스] 도널드 트럼프 미국 대통령 당선인이 지난해 1월 대통령 취임을 앞두고 출시한 밈 코인 STRMP의 홍보 영상. 밈 코인 오는 22일 열리는 세번째 밈 코인 홍보 만찬 참가 비용이 지난해의 100분의 1 이하로 떨어졌다. (사진= 트럼프 엑스 캡처 ) 2026.11.19. photo@newsis.com *재판매 및 DB 금지 [서울=뉴시스] 강영진 기자 = 도널드 트럼프 미 대통령이 직접 참석하는 자신의 밈 코인 ‘$TRUMP’ 홍보 만찬의 최소 참가비용이 지난해 5만5000달러(약 7326만 원)의 100분의 1도 안 되는 518 달러(약 69만 원)라고 미 워싱턴포스트(WP)가 18일(현지시각) 보도했다. 트럼프는 오는 22일 버지니아주 북부의 트럼프 내셔널 골프클럽에서 밈 코인 ‘$TRUMP’를 위한 세 번째 만찬 행사에 참석할 예정이다. 초청 대상은 참석 의사를 밝힌 $TRUMP 보유자 가운데 보유량 기준 상위 185명이다. 지난해 5월 첫 번째 만찬 행사를 앞두고 트럼프의 코인 가격은 고공 행진을 하고 있었다. 일부 투자자들은 행사에 참석하기 위해 수백만 달러어치의 코인을 매입했고, 초청장을 받으려면 최소 5만5000 달러어치의 코인을 보유해야 했다. 그러나 단 518 달러어치의 코인만을 매수한 사람이 초청장을 얻은 것으로 드러났다. 이번 만찬 행사의 참가비용이 이처럼 저렴한 데에는 두 가지 이유가 있다. 첫째, 코인 가격이 점진적으로 하락하다가 이달 공화당이 중간선거에서 참패한 뒤 급락하면서 사상 최저치인 약 0.95 달러까지 떨어졌다. 둘째, $TRUMP를 보유한 상위 투자자 수천 명이 행사에 참석할 자격을 갖출 만큼 충분한 코인을 보유하고 있으면서도 참석 신청을 하지 않았다. $TRUMP 웹사이트에 게시된 초청 대상자들의 ‘순위표’를 $TRUMP 상위 보유자 명단과 대조해 분석한 결과 지난 16일 순위표가 마감되기 전에 초청장을 받을 수 있었던 투자자가 5000명 넘게 있었으나 대부분 신청하지 않았다. 지난해 5월 첫 번째 만찬에서 초청 자격을 간발의 차이로 얻지 못했던 코인 보유자 100명 가운데 이번 만찬에 신청한 사람은 단 3명 뿐이었다. 올해 ‘미셸’이라는 이름의 투자자는 행사가 발표된 뒤인 지난달과 이달에 518 달러어치의 $TRUMP를 매입해 이번 만찬 순위표에서 179위에 올랐다.","category":"사건 사고"},{"title":"국빈 대통령에 ‘패스트푸드’ 보냈다…외교참사인줄 알았더니 “판타스틱” 감탄","link":"https://n.news.naver.com/mnews/article/009/0005766044","naverLink":"https://n.news.naver.com/mnews/article/009/0005766044","pubDate":"2026-11-19T11:05:56.801693+09:00","author":"네이버뉴스","description":"필리핀 마르코스의 ‘치킨외교’ 화제 트럼프에 ‘졸리비’ 야식배달 선물해 트럼프는 “와우! 환상적이다” 화답 필리핀 마르코스 대통령은 트럼프 대통령에게 필리핀 대표 패스트푸드 브랜드 ‘졸리비(Jollibee)’ 음식을 야식으로 대접했다 [졸리비 공식 홈페이지] 도널드 트럼프 미국 대통령의 패스트푸드 취향을 고려한 필리핀의 이른바 ‘치킨 외교’가 화제다. 18일(현지시간) 사우스차이나모닝포스트(SCMP)에 따르면 마르코스 대통령은 이날 미국·필리핀 정상회담에서 전날 밤 트럼프 대통령에게 필리핀 대표 패스트푸드 브랜드 ‘졸리비(Jollibee)’의 음식을 야식으로 대접했다고 밝혔다. 마르코스 대통령은 트럼프 대통령에게 “바쁜 일정을 소화하는 트럼프 대통령을 위해 참모들에게 직접 배달을 지시했다”라며 “매우 열심히 일하고 계시니 앞으로 해야 할 일들을 위한 에너지 보충이라고 생각해 달라”고 말했다. 이어 졸리비가 필리핀에서 큰 인기를 누리는 브랜드라고 소개하면서 “대표 메뉴 중 하나가 프라이드치킨인데, 미국에서 인지도 면에서 KFC를 넘어섰다고 자부한다”고 강조했다. 이에 트럼프 대통령은 “오, 와우(Oh, wow)”, “환상적이다(Fantastic)”라고 화답했다. 트럼프 대통령은 평소 햄버거와 프라이드치킨 등 패스트푸드를 즐기는 것으로 알려져 있다. 첫 임기 당시에는 백악관에 초청한 대학 운동선수들에게 패스트푸드를 제공해 눈길을 끌기도 했다. 아세안 정상회의 기간 미디어센터에서 필리핀 전통 의상인 바롱을 입은 졸리비 마스코트가 사진 촬영을 위해 포즈를 취하고 있다. [로이터 연합뉴스]","category":"사건 사고"},{"title":"\"수능 때 AI 안경 쓰겠다\" 댓글 신고…경찰 확인 중","link":"https://n.news.naver.com/mnews/article/422/0000927746","naverLink":"https://n.news.naver.com/mnews/article/422/0000927746","pubDate":"2026-11-19T11:05:56.340218+09:00","author":"네이버뉴스","description":"책상 위에 놓인 안경과 전자기기 [연합뉴스 제공] 2027학년도 대학수학능력시험 당일인 오늘(19일) 경남 양산의 한 시험장에서 인공지능(AI) 안경을 쓰고 시험을 보겠다는 유튜브 댓글이 올라왔다는 신고가 접수돼 경찰이 사실관계를 확인하고 있습니다. 경찰에 따르면 이날 오전 8시 45분쯤 울산경찰청에 관련 신고가 들어왔습니다. 신고자는 유튜브에서 해당 댓글을 봤으며, 댓글에 시험 장소로 양산의 한 고등학교가 언급됐다고 전했습니다. 울산경찰청은 경남경찰청에 신고 내용을 전달하고 공조를 요청하고, 경찰은 해당 학교 시험감독관에게도 이 사실을 알렸습니다. 경남경찰청 관계자는 \"현재까지 특이사항은 없으며 유사시 사후 조치할 예정\"이라며 \"게시물에 대해선 진위를 확인 중\"이라고 밝혔습니다. 연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23","category":"사건 사고"},{"title":"'독감 사망' 유치원 교사 사직서 위조한 원장…징역 4개월 집유 1년","link":"https://n.news.naver.com/mnews/article/421/0009298428","naverLink":"https://n.news.naver.com/mnews/article/421/0009298428","pubDate":"2026-11-19T11:05:56.340214+09:00","author":"네이버뉴스","description":"숨지기 나흘 전인 2월 10일 사직한 것으로 서류 작성 숨진 어린이집 교사가 생전 부모와 나눈 대화/뉴스1 (부천=뉴스1) 이시명 기자 = 독감에 걸린 상태에서도 출근하다 숨진 20대 유치원 교사의 사직서를 위조해 교육 당국에 제출한 40대 유치원장이 징역형의 집행유예를 선고받았다. 위조된 사직서에 적힌 사직 날짜는 교사가 위독해 중환자실에 있던 시기였다. 인천지법 부천지원 형사7단독(황방모 판사)은 사문서위조 및 위조사문서행사 등 혐의로 불구속 기소된 경기 부천의 한 사립유치원 원장 A 씨(48·여)에게 징역 4개월에 집행유예 1년을 선고했다고 19일 밝혔다. 재판부는 \"범행 방법이나 경위 등에 비춰 봤을 때 죄질이 나쁘다\"면서도 \"범행으로 얻은 이익이 크지 않은 점 등을 종합했다\"고 양형 이유를 밝혔다. A 씨는 독감에 걸려 중환자실에서 치료받던 소속 교사 B 씨(24)의 사직서를 위조해 부천교육지원청에 제출한 혐의로 재판에 넘겨졌다. 해당 사직서에는 B 씨의 사직일이 지난 2월 10일로 기재돼 있었다. 당시 B 씨는 중환자실에서 치료받고 있어 사직서를 직접 작성할 수 없는 상태였던 것으로 조사됐다. B 씨는 지난 1월 27일 B형 독감 확진 판정을 받았지만, 같은 달 30일까지 출근한 것으로 파악됐다. 이후 증상이 악화해 병원에서 치료받다가 2월 14일 숨졌다. 유족 측은 교육 당국에 제출된 사직서의 위조 의혹을 제기했고, 부천교육지원청도 관련 정황을 확인해 경찰에 수사를 의뢰했다. 경찰은 유치원 압수수색 등을 통해 관련 자료를 확보한 뒤 A 씨를 사문서위조 및 행사 혐의로 송치했다. 한편 사립학교교직원연금공단은 지난 6월 B 씨의 사망을 직무상 재해로 인정했다. 경기도교육청도 지난 8월 징계위원회를 열고 A 씨에 대해 정직 2개월을 의결한 바 있다.","category":"사건 사고"},{"title":"“시속 182km 질주 용납 안 돼”…‘또 음주운전’ 남태현, 2심도 실형…법정 구속","link":"https://n.news.naver.com/mnews/article/009/0005766041","naverLink":"https://n.news.naver.com/mnews/article/009/0005766041","pubDate":"2026-11-19T11:05:56.340206+09:00","author":"네이버뉴스","description":"2심, 항소 기각…징역 1년·벌금 100만원 실형 유지 “죄질 가볍지 않아, 제3자에 피해 끼칠 중대 범죄” 남태현. 사진ㅣ스타투데이DB 가수 남태현(32)이 집행유예 기간 중 음주운전을 한 혐의로 항소심에서도 징역 1년을 선고받고 법정 구속됐다. 19일 서울서부지방법원 제2-2형사부(항소)(나)는 도로교통법 위반(음주운전) 등 혐의로 기소된 남태현의 항소심 선고기일을 진행했다. 이날 재판부는 “피고는 사건 내용이 가볍다고 주장하는데 피고인이 과속, 만취 운전을 하다가 피고인뿐만 아니라 제3자까지 상해, 사망에 이를 수 있다고 보여져 실형이 맞다고 판단된다”며 항소를 기각, 원심 판결을 유지해다. 이에 남태현은 법정 구속되며 “죄송합니다”라고 심경을 남겼다. 앞서 1심 재판부는 지난 4월 남태현에게 징역 1년과 벌금 100만원을 선고한 바 있다. 남태현. 사진ㅣ스타투데이DB","category":"사건 사고"},{"title":"'집유 중 음주운전' 남태현 2심도 징역 1년·법정구속…\"도주 우려\"","link":"https://n.news.naver.com/mnews/article/421/0009298433","naverLink":"https://n.news.naver.com/mnews/article/421/0009298433","pubDate":"2026-11-19T11:05:56.340204+09:00","author":"네이버뉴스","description":"시속 182㎞ 만취 운전…징역 1년·벌금 100만원 유지 가수 남태현. 2023.10.19 ⓒ 뉴스1 권현진 기자 (서울=뉴스1) 소봄이 권준언 기자 = 집행유예 기간에 음주운전 사고를 낸 혐의로 1심에서 징역 1년을 선고받은 그룹 위너 출신 가수 남태현 씨가 항소심에서도 실형을 선고받고 법정구속됐다. 서울서부지법 형사항소2-2부(부장판사 정성균·이현우·이동식)는 19일 도로교통법 위반 등 혐의로 기소된 남 씨의 항소심 선고 공판에서 남 씨의 항소를 기각하고 징역 1년과 벌금 100만 원을 선고한 원심을 유지했다. 재판부는 \"피고인이 상당한 속도로 과속하며 술에 만취한 상태로 운전해 피고인뿐 아니라 제3자의 상해나 사망으로까지 이어질 수 있었던 범행\"이라며 원심의 형량이 무겁지 않다고 판단했다. 재판부는 도주 우려가 있다고 판단해 남 씨를 법정구속했다. 남 씨는 재판부가 마지막으로 할 말이 있는지 묻자 \"죄송합니다\"라고 짧게 답했다. 남 씨는 지난해 4월 27일 오전 4시 10분쯤 술을 마신 상태로 서울 강변북로 일산 방향 동작대교 인근에서 제한속도 시속 80㎞를 초과한 시속 182㎞로 운전하다 중앙분리대를 들이받은 혐의로 기소됐다. 당시 남 씨의 혈중알코올농도는 면허취소 기준(0.08%)을 넘는 0.122%였으며 인명 피해는 발생하지 않았다. 1심 재판부는 남 씨가 음주운전으로 처벌받은 전력이 있고 마약 투약으로 인한 집행유예 기간에 재범한 점 등을 고려해 징역 1년과 벌금 100만 원을 선고했다. 다만 증거인멸이나 도망 우려가 없다고 판단해 법정구속하지는 않았다. 남 씨는 지난달 22일 열린 항소심 공판에서 \"어렵게 직장을 구해 맡은 역할을 다하고 있고 술은 완전히 끊었으며 대중교통을 이용하고 있다\"며 선처를 호소했다. 앞서 남 씨는 2023년 7월 음주운전으로 벌금 600만 원의 약식명령을 받았으며, 2024년 1월에는 필로폰 투약 혐의로 징역 1년에 집행유예 2년을 선고받았다.","category":"사건 사고"},{"title":"\"입실 25분 남았는데 시험장은 14㎞\"…광주경찰, 수험생 수송","link":"https://n.news.naver.com/mnews/article/079/0004211509","naverLink":"https://n.news.naver.com/mnews/article/079/0004211509","pubDate":"2026-11-19T11:05:56.340202+09:00","author":"네이버뉴스","description":"수능일 경찰관 등 318명 배치해 특별 교통관리 수험생 5명 수송·신분증 전달 1건 지원 19일 오전 8시 20분쯤 대학수학능력시험 전남광주통합특별시교육청 26지구 제20시험장인 전남광주 서구 광덕고등학교의 교문이 닫히고 있다. 한아름 기자 2027학년도 대학수학능력시험이 치러진 19일 광주에서 경찰이 도움을 요청한 수험생들을 순찰차로 시험장까지 데려다주는 등 수험생 편의를 지원했다. 광주경찰청과 광주자치경찰위원회는 이날 오전 6시부터 8시10분까지 교통·지역경찰과 기동대, 모범운전자 등 318명을 수험생 이동로와 시험장 주변에 배치해 특별 교통관리를 했다고 19일 밝혔다. 경찰은 이 시간 동안 수험생 도움 요청 6건을 받아 5명을 시험장까지 수송하고, 신분증을 두고 온 수험생 1명에게 편의를 제공했다. 오전 7시 40분쯤에는 동구 계림동에 사는 장애 여학생을 태운 택시기사가 112에 다급하게 도움을 요청했다. 이 학생은 교통약자 전용 택시 바우처로 택시를 불러 시험장인 광산구 성덕고로 가고 있었다. 하지만 시험장까지는 약 14㎞를 더 가야 했고, 입실 마감까지는 25분밖에 남지 않은 상황이었다. 경찰은 택시기사와 연락을 이어가며 광주청 교통관제센터에서 도로 상황을 지켜봤다. 인근 순찰차와 교통 싸이카가 나서 하남대로 등 주요 교차로의 차량 흐름을 정리했고, 학생은 무사히 성덕고에 도착했다. 신분증을 집에 두고 와 되돌아가던 수험생도 경찰의 도움을 받았다. 오전 7시 30분쯤 112 신고를 받은 경찰은 학생의 집으로 출동해 학생을 순찰차에 태운 뒤 시험장인 대성여고까지 데려다줬다. 시험장을 잘못 찾아간 수험생도 있었다. 오전 8시쯤 문성고에 있던 한 학생의 요청을 받은 경찰은 실제 시험장인 송원고까지 이 학생을 순찰차로 데려다줬다. 이 밖에 서구문화센터, 동구 소태역, 광산구 등에서 도움을 요청한 수험생들도 순찰차를 타고 각각 남구 송원여고, 남구 동아여고, 광산구 운남고로 이동했다. 도움을 받은 수험생들은 경찰 덕분에 무사히 시험을 치를 수 있게 됐다며 고마움을 전했다. 여러분의 제보가 CBS노컷뉴스의 시작입니다. 이메일 : jebo@cbs.co.kr 바로가기 : https://www.nocutnews.co.kr/jebo/write.aspx","category":"사건 사고"},{"title":"행방불명된 리트 만점자 신변 우려에 경찰, 광진구 일대 수색","link":"https://n.news.naver.com/mnews/article/658/0000161695","naverLink":"https://n.news.naver.com/mnews/article/658/0000161695","pubDate":"2026-11-19T11:05:56.340199+09:00","author":"네이버뉴스","description":"19일 법학적성시험(LEET·리트) 만점자 이진우 씨의 공개 검증 장소인 서울 강남구 한 스튜디오에 경찰이 현장조사를 위해 들어서고 있다. 연합뉴스 법학적성시험(LEET) 만점자 이진우(32) 씨가 행방불명 상태라 경찰이 추적 중이다. 연합뉴스 취재에 따르면 19일 오전 8시 42분께 이씨의 신변 안전이 우려된다는 신고가 경찰에 접수됐다. 이에 경찰과 소방 등이 함께 관악구 신림동의 자택을 찾았다가 이 씨의 부재를 확인한 뒤 철수했다. 이후 경찰은 이씨의 행적을 추적한 끝에 소재지를 광진구로 특정하고 일대를 수색하고 있다. 그는 전날 집을 나와 광진구의 한 숙박업소로 이동한 뒤, 이날 오전 그곳도 뜬 것으로 전해졌다. 경찰 관계자는 이씨의 소재 등에 대해 “개인적인 사안이라 확인해줄 수 없다. 어떤 상황인지 말해줄 수 없다”고 밝혔다. 확인된 그의 마지막 행적은 전날 공개된 한 언론사와 인터뷰다. 이 씨는 취재진에 19일 공개 검증으로 실력을 보여준 뒤 의혹을 털어내겠다고 말했으나 이날 오전 검증 장소에 나타나지 않았다. 검증을 주관하기로 했던 입시학원 측은 “이진우 씨의 휴대전화가 어제부터 꺼져 있는 상태다. 연락을 받지 않고 있다”고 말했다. 이 씨가 확언했던 검증을 스스로 무산시키면서 경찰 수사도 급물살을 타는 수순이다. 경찰은 전날 변호사들의 고발장을 받은 지 몇 시간 만에 해당 사건을 서울경찰청 광역수사단 금융범죄수사팀에 배당했다. 이 씨의 의혹이 다른 국가시험도 아닌 수능시험 부정행위 의혹으로 번지면서 사실관계를 확인하기 위해 신병 확보 등 강제수사가 불가피할 것으로 전망된다. 경찰은 앞서 자수한 세무사 시험 수석의 자택도 압수수색하고 출국금지했다.","category":"사건 사고"}],"사회":[{"title":"“이건 정말 싸도 너무 싸잖아” 일본 가서 이것 싹쓸이하는 한국인들…의료계 우려도","link":"https://n.news.naver.com/mnews/article/011/0004683857","naverLink":"https://n.news.naver.com/mnews/article/011/0004683857","pubDate":"2026-11-19T11:05:57.777496+09:00","author":"네이버뉴스","description":"클립아트코리아 이달 12일부터 해외에서 처방받아 구매한 비만치료제의 국내 휴대 반입이 허용됐다. 의료계에서는 의약품 오남용과 유통 과정에서의 변질, 사후 부작용 관리 공백 등에 대해 우려의 목소리가 터져 나오고 있다. 18일 업계에 따르면 식품의약품안전처와 관세청은 이달 12일부터 일본 등 해외에서 정상적으로 처방·구매한 자가 치료용 의약품의 국내 휴대 반입을 허용했다. 이에 따라 그동안 통관이 제한됐던 글루카곤 유사 펩타이드(GLP-1) 비만치료제 ‘마운자로’와 ‘위고비’도 해외에서 정식으로 처방을 받은 제품이라면 국내 반입이 가능하다. 원칙적으로 6병까지지만, 이를 초과하더라도 의약품 용법상 3개월 복용량까지 들여올 수 있다. 이번 조치 이후 한국보다 약값이 저렴한 일본으로 건너가 비만 치료제를 처방 받으려는 수요가 늘고 있다. 국내에서 한 달 기준 30만 원 안팎에 판매되는 비만치료제를 일본에서는 10만 원대에 구매할 수 있어서다. 온라인 커뮤니티 등에는 일본 내 비만치료제 처방이 가능한 의료기관의 위치와 가격 정보를 공유하는 ‘스시자로(스시+마운자로) 지도’까지 등장했다. 오남용 우려 목소리 커져 이런 가운데 대한내분비학회·대한당뇨병학회·대한비만학회는 비만치료제의 국내 반입 관리 방안 마련을 촉구하고 나섰다. 세 학회는 “우리 국민, 우리나라를 방문하거나 체류 중인 외국인의 불편을 줄이려는 정부의 취지에 공감한다”면서도 “해외에서 반입된 전문의약품이 국내에서 오남용되지 않고 안전하게 사용되기 위해서는 관리 방안을 함께 마련해야 한다”고 밝혔다. 그러면서 정부를 향해 “불법적인 반입을 예방하기 위해 처방·구매 사실을 확인할 실효성 있는 절차를 마련해달라”며 “반복 반입과 수량 산정 기준도 함께 명확히 해달라”고 요청했다. 이어 “불법적인 상업적 유통을 철저히 단속해야 한다”며 “개인의 치료 목적 반입은 존중하되 반복·대량 반입 등 재판매가 의심되는 경우를 점검해야 한다. 상시 모니터링과 신속한 수사 의뢰 체계를 강화해달라”고 당부했다. 또 의약품에 관한 안내와 이상 사례 대응을 강화해달라고 촉구하고, 가격 부담과 건강보험 급여 등에 관한 문제도 살펴야 한다고 밝혔다. 이들은 “비만치료제의 해외 원정 구매가 늘어난 배경에는 국내외 약값 차이와 비급여 부담이 있다”며 “마운자로의 2형 당뇨병 치료에 대한 급여 절차를 신속히 마무리해달라”고 했다. 환자들에게는 “처방받은 약을 다른 사람과 나누거나 판매하지 말라","category":"사회"},{"title":"美, 유엔 북한인권결의안 21년 만에 기권… ICC 회부 조항에 반발","link":"https://n.news.naver.com/mnews/article/366/0001205870","naverLink":"https://n.news.naver.com/mnews/article/366/0001205870","pubDate":"2026-11-19T11:05:56.801739+09:00","author":"네이버뉴스","description":"북한인권결의안 찬성 95표로 채택 美 표결 요구로 10년 만장일치 깨져 美, 2005년 이후 첫 대북 인권 결의 기권 미국이 유엔총회 위원회에서 북한인권결의안에 담긴 북한 인권 침해 책임자 국제형사재판소(ICC) 회부 검토 문구를 문제 삼아 21년 만에 기권표를 던졌다. 18일(현지시각) 유엔총회와 유럽연합(EU) 대외관계청(EEAS) 발표 등을 종합하면 이날 미국 뉴욕 유엔본부에서 열린 유엔총회 제3위원회(인권·사회·인도주의 담당) 전체회의에서 북한인권결의안(L.38)은 찬성 95표, 반대 14표, 기권 58표로 채택됐다. 한국과 일본, EU 회원국 등이 공동제안국으로 참여한 이번 결의안은 북한 내 정치범수용소 운영과 고문, 사형, 강제노동, 납치, 불법 핵·미사일 개발 자금 전용 등을 강력히 규탄하고 있다. 북한인권결의안은 2016년 이후 10년 동안 표결 없이 만장일치(컨센서스)로 통과됐지만, 올해는 미국 측 표결 요구로 만장일치가 깨졌다. 2019년 6월 30일, 비무장지대(DMZ) 내 판문점 공동경비구역(JSA)에서 도널드 트럼프 미국 대통령이 북한 김정은 국무위원장과 함께 남북 군사분계선 남측에 서서 발언하고 있다. /연합뉴스 미국은 이번 결의안을 두고 공동제안국에서 빠졌을 뿐 아니라, 2005년 이후 21년 만에 처음으로 기권을 택했다. 유엔이 ICC를 언급하면서 미국 측 반발이 심해진 것으로 추정된다. ICC는 집단학살과 반인도적 범죄 등을 다루는 상설 국제재판소로, 이번 결의안은 유엔 안전보장이사회가 북한 상황을 ICC에 회부하는 방안을 검토하도록 촉구했다. 그러나 미국은 해외 파견 미군이 정치적 이유로 기소될 수 있다며 ICC 가입을 거부해 왔다. 특히 도널드 트럼프 2기 행정부는 지난해부터 ICC 압박 수위를 높이고 있다. 댄 네그레아 주유엔 경제사회이사회(ECOSOC) 미국 대사는 이날 “우리는 ICC에 대한 모든 언급을 삭제할 것을 요청해 왔다”며 “앞으로도 그렇게 할 것”이라고 했다. 다만 미국은 이번 기권이 대북 인권 기조 후퇴는 아니라고 선을 그었다. 네그레아 대사는 “북한 인권 상황은 매우 심각하고, 이번 결의안에 대한 우리의 입장 변화가 북한 내 상황을 반영한 것은 아니다”라며 “북한 주민들의 인권 증진, 책임 규명, 독립적인 정보 접근 보장이라는 우리의 의지는 흔들림이 없다”고 했다. 반면 결의안을 주도한 EU는 표결 직후 성명을 내고 10년 만에 치러진 표결에 깊은 유감을 표","category":"사회"},{"title":"“고마워요, 부켈레”… 아이티 주민들, 갱단과 싸우는 엘살바도르군에 “더 머물러 달라”","link":"https://n.news.naver.com/mnews/article/023/0004010516","naverLink":"https://n.news.naver.com/mnews/article/023/0004010516","pubDate":"2026-11-19T11:05:56.801735+09:00","author":"네이버뉴스","description":"3줄 요약 ㆍ 엘살바도르 실종자 수색 위해 병력 2500명 파병 ㆍ 아이티 주민 주둔 연장 시위…정부 협정 승인 ㆍ 올해 4595명 사망…외국군 철수 이후 대비 숙제 18일(현지 시각) 아이티 수도 포르토프랭스에서 주민들이 무장 갱단에 맞서 병력을 보낸 나이브 부켈레 엘살바도르 대통령을 지지하며 거리 행진을 하고 있다. /AP 연합뉴스 “부켈레! 부켈레!” 17일(현지 시각) 아이티 수도 포르토프랭스 거리에서 주민 수천 명이 다른 나라 대통령의 이름을 연호했다. 손에 든 팻말에는 ‘고마워요, 부켈레’ ‘너무 많은 경찰이 죽었다’라고 적혀 있었다. 나이브 부켈레 엘살바도르 대통령이 보낸 병력이 아이티에 계속 머물며 갱단과 싸워 달라는 시위였다. 부켈레는 그날 저녁 소셜미디어에 아이티 크레올어로 “나도 여러분을 사랑합니다”라고 답했다. 18일(현지시간) 나이브 부켈레 엘살바도르 대통령이 X에 아이티 갱단 두목 제프 라로즈의 저택을 엘살바도르군이 공격하는 영상을 공개했다. 부켈레 대통령은 이를 아이티 국민에게 주는 선물이라고 밝혔다. /X","category":"사회"},{"title":"F-16 조종사 출신 이스라엘 새 국회의장, ‘네타냐후식’ 사법 개혁 제동 [이 사람@World]","link":"https://n.news.naver.com/mnews/article/022/0004176436","naverLink":"https://n.news.naver.com/mnews/article/022/0004176436","pubDate":"2026-11-19T11:05:56.801721+09:00","author":"네이버뉴스","description":"공군 중령 출신 50대 정치인 마탄 카하나 “내가 의장으로 있는 한 법원 판결 존중” 네타냐후 구상 ‘사법 개혁안’ 백지화 암시 지난 10·27 총선 결과 새롭게 구성된 이스라엘 의회(크네세트)가 정식으로 출범한 가운데 야당인 야샤르(Yashar)당 소속 의원이 신임 의장으로 뽑혔다. 베냐민 네타냐후(77) 현 총리가 지난 3, 4년간 야심차게 추진해 온 사법 개혁 입법에 제동이 걸릴 전망이다. 지난 17일(현지시간) 이스라엘 의회에서 선출된 마탄 카하나 신임 의장이 기념 촬영을 하고 있다. 카하나는 사실상 차기 총리 후보자인 가디 아이젠코트 의원이 이끄는 중도 성향 야샤르당 소속이다. 신화연합뉴스 앞서 이츠하크 헤르초그 대통령이 야샤르당 대표인 가디 아이젠코트(66) 의원을 사실상의 차기 총리 후보자로 내정한 데 이어 크네세트 의장마저 야샤르당이 배출하며 네타냐후 실각과 정권 교체가 임박한 모습이다. 19일(현지시간) 이스라엘 일간 ‘타임오브이스라엘’에 따르면 크네세트는 전날(17일) 표결을 통해 야샤르당 마탄 카하나(54) 의원을 의장으로 선출했다. 총 120명의 크네세트 의원 가운데 과반인 66명이 카하나에게 표를 던졌다. 네타냐후가 이끄는 집권 리쿠드(Likud)당의 오피르 카츠(46) 의원이 경쟁자로 나섰으나 52표를 얻는 데 그쳐 낙선의 고배를 마셨다. 카하나는 의장직 수락 연설에서 “깊은 경외심을 갖고 이제 크네세트 의장 역할을 맡겠다”는 말로 운을 뗐다. 이어 “크네세트는 종교, 인종, 성별에 관계없이 이스라엘 국가의 모든 시민이 모이는 곳”이라며 “나는 그들 모두를 위한 의장이 될 생각”이라고 덧붙였다. 그러면서 “새로 구성될 정부는 입법·사법·행정 3권 간의 견제와 균형 회복을 위해 노력할 것으로 기대한다”며 “내가 의장으로 있는 한 크네세트는 법원 판결을 무조건적으로 따를 것”이라고 강조했다. 이는 네타냐후 정부가 법원 판결에 자주 반발하고 사법부 전면 개편을 위한 입법을 강행하려 한 사실을 공개적으로 비판한 것이다. 부정부패 혐의로 총리 재직 중 기소돼 현재 1심 재판을 받고 있는 네타냐후는 ‘사법 개혁’이란 명목 아래 법원 권한 축소와 판사 임명 방식 변경을 추진했다. 대법원 확정 판결을 크세네트 의원 과반의 동의로 뒤집을 수 있도록 한 것, 법관 인사위원회에 정부·여당의 개입을 늘리는 것 등이 대표적이다. 이를 ‘사법 개악’으로 규정한 야권과 시민사회의 강한 반발로 아직도 정국 혼란이","category":"사회"},{"title":"한덕수 ‘내란 중요임무’ 오늘 대법 선고…비상계엄 716일만","link":"https://n.news.naver.com/mnews/article/658/0000161694","naverLink":"https://n.news.naver.com/mnews/article/658/0000161694","pubDate":"2026-11-19T11:05:56.340216+09:00","author":"네이버뉴스","description":"한덕수 전 국무총리. 연합뉴스 대법원이 한덕수 전 국무총리의 내란 중요임무 종사 혐의 사건 최종 판단을 내놓는다. 12·3 비상계엄 사태 716일 만이다. 대법원 전원합의체(주심 오경미 대법관)는 19일 오후 4시 한 전 총리의 내란 중요임무 종사 등 혐의 상고심 선고기일을 연다. 한 전 총리는 비상계엄의 절차적 정당성을 부여하기 위해 국무회의 소집을 건희하는 방식으로 내란에 가담하고 계엄 해제 이후 허위로 작성된 계엄선포문에 서명한 혐의 등으로 재판에 넘겨졌다. 한 전 총리는 내란 중요임무 종사, 허위공문서작성, 대통령기록물관리법 위반 등 혐의가 유죄로 인정돼 1심에서 징역 23년, 2심에서 징역 15년을 선고받았다. 1심은 한 전 총리가 국무회의 구성원에게 소집을 통지하고 실질적인 심의가 이뤄지게 노력해 계엄 선포를 저지했어야 할 직위 의무를 부담한다며 이를 다하지 않은 책임을 물었다. 반면 2심은 한 전 총리가 국무회의 전원을 소집하고 실질적인 심의로 계엄 선포 반대 의견을 전달했더라도 계엄을 막을 수 있었다고 단정할 수 없다며 부작위범이 성립하지 않는다고 봤다. 이날 선고에서는 비상계엄의 위헌·위법성에 대한 대법원의 첫 최종 판단이 나올 전망이다. 앞서 1·2심 재판부는 모두 비상계엄 사태를 내란으로 인정했다. 윤 전 대통령 등이 국헌문란 목적으로 폭동을 일으키고자 계엄을 선포했다고 판단한 것이다. 만약 한 전 총리의 유죄가 그대로 인정되면 윤석열 전 대통령에게도 유죄가 선고될 가능성이 크다. 이번 선고가 내란 사건의 가늠자가 되는 셈이다. 대법원이 2심 판단에 잘못이 없다고 보고 상고를 기각하면 징역 15년이 확정된다. 2심 판단에 잘못이 있다고 판단해 파기환송하면 서울고법에서 다시 2심 재판을 받는다.","category":"사회"},{"title":"\"2분 남았다\" 지각 위기 수험생 SOS...곳곳서 '긴급 수송 작전'","link":"https://n.news.naver.com/mnews/article/008/0005443433","naverLink":"https://n.news.naver.com/mnews/article/008/0005443433","pubDate":"2026-11-19T11:05:56.340196+09:00","author":"네이버뉴스","description":"[2027 수능] 서울 지역 곳곳 '수험생 수송 작전'…10㎞거리 고사장 착각한 수험생도 경찰·시민들, 수험생 목적지 반복해 외치며 내 일처럼 도와 19일 오전 7시42분 서울 서초구 서초역 사거리 앞에서 한 남학생이 수능 고사장인 휘문고로 이동하기 위해 급히 경찰 순찰차를 탑승하는 모습./사진=김서현 기자. \"지금 택시를 타고 있는데 입실이 늦어질 것 같아요.\" 2027학년도 대학수학능력시험(수능)이 치러지는 19일 오전 7시42분 서울 서초구 서초역 사거리에 택시 한대가 급하게 멈춰섰다. 택시에서 내린 한 남학생이 도로에 대기 중이던 순찰차로 뛰어갔다. 입실 마감까지 남은 시간은 28분. 경찰은 곧바로 학생을 태우고 시험장으로 향했다. 서초역 사거리에서 순찰차에 올라탄 수험생의 목적지는 약 5.4㎞ 떨어진 휘문고였다. 경찰은 오전 7시41분 학생의 다급한 신고를 접수한 직후 \"휘문고로 향한다\"는 무전을 반복하며 시험장으로 달렸다. 학생은 약 10분 뒤인 오전 7시51분 무사히 고사장에 도착했다. 이날 서울 곳곳에서는 입실 시간을 맞추기 위한 수험생들의 긴급 수송이 이어졌다. 길을 잘못 들거나 예상보다 심한 교통 정체에 발이 묶인 학생들을 위해 경찰과 자원봉사자들이 나섰다. 서울 서초경찰서는 이날 오전 7시20분부터 서초역과 교대역 사거리에 경찰관을 각각 2명씩 배치하고 긴급 수송과 교통 관리에 나섰다. 앞서 오전 7시28분에는 예술의전당 인근에서 한 여학생이 경찰관에게 도움을 요청했다. 이 학생은 \"내비게이션을 찍었는데 20분 넘게 걸려 늦을 것 같다\"며 다급하게 상황을 설명했다. 경찰은 학생을 순찰차에 태워 숙명여고로 향했고, 오전 7시41분 시험장에 도착했다. 서초역 사거리에서는 교통 정체를 줄이기 위한 신호 조정도 이뤄졌다. 현장 경찰관은 \"학교가 많이 위치한 강남 방면을 중심으로 신호를 연장해주고 있다\"고 설명했다. 19일 오전 8시6분 입실 시간을 4분쯤 남긴 시점, 한 여학생이 이화외고로 향하기 위해 서울 서대문구 서대문역 사거리에서 수송 지원 차량에 탑승하는 모습./사진=조유정 기자.","category":"사회"},{"title":"'김창민 감독 살인 사건' 피고인 2명에 징역 12년·3년 선고","link":"https://n.news.naver.com/mnews/article/082/0001407953","naverLink":"https://n.news.naver.com/mnews/article/082/0001407953","pubDate":"2026-11-19T11:05:56.340189+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사회"},{"title":"독감에도 출근하다 숨진 유치원 교사…사직서 위조한 원장 집유","link":"https://n.news.naver.com/mnews/article/654/0000212209","naverLink":"https://n.news.naver.com/mnews/article/654/0000212209","pubDate":"2026-11-19T11:05:56.340187+09:00","author":"네이버뉴스","description":"중환자실 치료 중 사직한 것처럼 서류 꾸며 교육지원청 제출 ▲ 숨진 유치원 교사가 생전 지인과 나눈 메시지 [전국교직원노동조합 제공] 독감에 걸린 뒤에도 출근하다 숨진 20대 유치원 교사가 사직서를 제출한 것처럼 서류를 위조한 유치원 원장에게 징역형의 집행유예가 선고됐다. 인천지법 부천지원 형사7단독 황방모 판사는 19일 사문서위조와 위조사문서행사 혐의로 기소된 유치원 원장 A(48)씨에게 징역 4개월에 집행유예 1년을 선고했다. 재판부는 \"범행 경위를 보면 죄질이 좋지 않다\"면서도 \"잘못을 인정하고 있고, 범행으로 얻은 이익이 크지 않은 점 등을 양형에 고려했다\"고 밝혔다. A씨는 독감으로 고열에 시달리면서도 출근을 이어가다 숨진 교사 B씨의 사직서를 위조해 부천교육지원청에 제출한 혐의로 재판에 넘겨졌다. B씨는 올해 1월 27일 B형 독감 판정을 받은 뒤에도 사흘간 출근했다. 이후 증상이 악화해 병원에서 치료를 받았지만 다음 달 14일 숨졌다. A씨는 B씨가 사망하기 전 사직서를 제출한 것처럼 서류를 위조했다. 당시 B씨는 중환자실에서 치료를 받고 있어 사직서를 작성할 수 없는 상태였던 것으로 조사됐다. 유족이 사직서 위조 의혹을 제기하면서 수사가 시작되자 A씨는 혐의를 인정했다.","category":"사회"},{"title":"'공신' 강성태 \"수능 혼란 더 커질 것…지적 능력보다 '인성'이 중요\"","link":"https://n.news.naver.com/mnews/article/448/0000652014","naverLink":"https://n.news.naver.com/mnews/article/448/0000652014","pubDate":"2026-11-19T11:05:56.340173+09:00","author":"네이버뉴스","description":"'뉴스퍼레이드'에 출연한 입시 교육 전문가 강성태 공신닷컴 대표 /TV조선 방송화면 캡처 입시 교육 전문가 강성태 공신닷컴 대표가 “이번 감독 강화로 수능 이후 혼란이 더 커질 것”이라며, \"지적 능력의 중요성이 떨어지는 시대에 갈수록 인성이 더 중요해질 것\"이라고 말했다. 강 대표는 이날 오전 TV조선 에 출연한 자리에서 \"시험장의 혼란을 조금이라도 줄이고자 2027년 수능 응시를 포기했다\"고 밝혔다. 그러면서 \"매년 수능이 끝나면 ‘감독관 발자국 소리 때문에 방해가 됐다, 부정행위 오해로 시간이 뺏겼다’는 등 공론화해달라는 제보가 100여건씩 온다\"며 \"확인 절차가 추가된 만큼, 오히려 지금 더 큰 문제가 터질 수 있다는 우려가 된다\"고 했다. 이어 \"시험장에서 1초가 아깝고, 집중이 한 번 깨지면 다시 돌아가기 쉽지 않다\"며 감독 강화와 재난 문자 발신 등 대책에 대해 우려를 표했다. 강 대표는 \"이미 2년 전 AI에 수능 시험지를 넣어가지고 풀게 해봤는데, 그때 이미 만점이었다\"면서 \"이제는 AI가 우리 신체로 들어온 것이나 마찬가지\"라고 했다. 이날 강 대표는 리트 만점자에 대한 국어 영역 검증에 관심이 쏠린 상황에 대해서도 \"(검증이) 일종의 쇼처럼 되어버렸다”며 \"왜 검증을 출제처가 아닌 유튜버가 하냐\"고 비판했다. 강 대표는 \"앞으로 지적 능력의 가치가 급속도로 떨어질 수 밖에 없다\"며 \"오히려 더 부각될 수 밖에 없는 것은 '인성'\"이라고 말했다.","category":"사회"},{"title":"수능 출제위 \"공교육만으로 변별력 확보…EBS 연계율 50%\"","link":"https://n.news.naver.com/mnews/article/310/0000141865","naverLink":"https://n.news.naver.com/mnews/article/310/0000141865","pubDate":"2026-11-19T11:05:56.340088+09:00","author":"네이버뉴스","description":"2027학년도 수능 시작...12월 11일 성적통지 2027학년도 대학수학능력시험이 치러진 19일 출제위원장인 오기영 한경국립대 교수가 정부세종청사 교육부에서 영역별 난이도 등 출제 방향에 대해 브리핑하고 있다. 왼쪽은 김문희 한국교육과정평가원장. ⓒ연합뉴스 2027학년도 대학수학능력시험(수능) 출제위원장인 오기영 한경국립대 교수는 19일 고등학교 공교육에서 다루는 내용만으로도 충분한 변별력을 확보할 수 있도록 출제했다고 밝혔다. 오 위원장은 이날 정부세종청사에서 연 출제 방향 브리핑에서 \"전 영역과 과목에 걸쳐 2015 개정 고등학교 교육과정의 내용과 수준을 충실히 반영하고, 대학 교육에 필요한 수학 능력을 측정할 수 있도록 출제했다\"고 말했다. 오 위원장은 \"교육과정의 핵심적이고 기본적인 내용을 중심으로 출제하였으며 교육과정의 핵심적인 내용일 경우 기존 시험에서 다루어졌더라도 필요하다면 질문의 형태와 문제 해결 방식을 바꾸어 출제했다\"고 덧붙였다. \"사교육에서 문제 풀이 기술을 익히고 반복적으로 훈련한 학생들에게 유리한 문항은 철저히 배제했으며 공교육 과정에서 다루는 내용만으로도 변별력을 충분히 확보할 수 있도록 출제했다\"고 오 위원장은 말했다. EBS 수능 교재 및 강의와의 연계율은 문항 수 기준 50% 수준으로 유지됐다. 수능 출제본부의 출제 방향 자료에 따르면 영역별 연계율은 국어 53.3%, 수학 50.0%, 영어 55.6%다. 한국사와 사회탐구, 과학탐구, 직업탐구, 제2외국어·한문은 모두 50.0%로 나타났다. 2027학년도 대학수학능력시험이 치러진 19일 오전 전남광주 남구 대성여자고등학교 한 수험장에서 수험생들이 시험 시작을 기다리고 있다. ⓒ연합뉴스","category":"사회"}],"생활·문화":[{"title":"할아버지 떠난 뒤 옆집 가족의 품으로… 글램핑장 ‘상주 직원’이 된 강아지","link":"https://n.news.naver.com/mnews/article/469/0000966466","naverLink":"https://n.news.naver.com/mnews/article/469/0000966466","pubDate":"2026-11-19T11:05:57.777539+09:00","author":"네이버뉴스","description":"알고 싶어, 너와 너의 멍냥이 동그람이 뉴스레터 꼬순다방 편집자주 반려생활 이야기, 트렌드, 동반 장소, 의학 정보 등을 담은 동그람이의 뉴스레터 에 공개된 내용을 소개한 콘텐츠입니다. 다음 편 혹은 전편이 궁금하다면 뉴스레터 구독 후 확인해 보세요! 뽀삐&미자 보호자 제공 part1 순둥이 뽀삐와 깨발랄 미자 해맑게 웃고 있는 뽀삐와 미자. 뽀삐&미자 보호자 제공","category":"생활·문화"},{"title":"극장 개봉 10년간 단 1편…‘최혜국대우’로 K-영화·드라마 다시 중국 간다 [한중 FTA 후속협상]","link":"https://n.news.naver.com/mnews/article/016/0002725480","naverLink":"https://n.news.naver.com/mnews/article/016/0002725480","pubDate":"2026-11-19T11:05:57.777531+09:00","author":"네이버뉴스","description":"한중 FTA 후속협상 실질 타결 영화·게임 사전심사 ‘비차별’ 공동제작은 드라마·예능 확대 영화 ‘암살’ [쇼박스] [헤럴드경제=고승희 기자] 2015년 9월 ‘암살’ 이후 중국 본토 극장에 정식으로 걸린 한국 영화는 2021년 12월 ‘오! 문희’ 한 편뿐이었다. 그사이 ‘베테랑’과 ‘써니’, ‘너의 결혼식’은 중국 배우의 얼굴을 입고 다시 만들어져 중국 극장에 걸렸다. 지난 10년 중국으로 건너간 것은 한국 영화 자체가 아니라 한국 영화의 ‘이야기’ 뿐이었다. 사드(THAAD, 고고도미사일방어체계) 갈등 이후 굳게 걸린 중국 시장의 빗장이 마침내 풀릴 수 있다는 기대가 커지고 있다. 한국과 중국은 18일 중국 선전에서 열린 정상회담을 계기로 한중 자유무역협정(FTA) 서비스·투자 후속협상의 실질 타결을 선언했기 때문이다. 2018년 3월 협상을 시작한 지 8년 8개월 만이다. 산업통상자원부에 따르면, 중국은 영화·게임 분야에서 한국을 제3국보다 불리하게 대우하지 않는 ‘최혜국대우’를, 온라인게임·영화 사전심사에는 ‘비차별 원칙’을 적용하기로 했다. 중국이 이런 내용을 통상협정에 담은 것은 처음이다. 양국은 영화에만 허용하던 공동제작 대상도 드라마·애니메이션·예능·다큐멘터리 등으로 범위를 넓혔다. 김정관 산업부 장관은 “후속협상 타결로 K-콘텐츠, 관광, 금융, 유통 등 우리 기업이 강점을 가진 분야에서 중국 시장에 진출할 수 있는 안정적인 제도적 기반이 마련됐다”고 말했다. 중국은 2016년 7월 주한미군 사드 배치 결정 이후 한국 드라마·영화·공연과 한국 연예인의 방송 출연을 사실상 막아왔다. 중국 정부는 이른바 ‘한한령(限韓令·한류 제한령)’의 존재를 공식적으로 인정한 적이 없다. 따라서 이번 협정은 한한령 해제를 요구할 수 있는 근거 조항이 될 수 있다는 게 문화계 안팎의 시각이다. 중국 측의 언어는 여전히 신중하다. 중국 외교부 발표에 따르면 시진핑 국가주석은 이날 회담에서 “양국 인적 왕래를 지속적으로 촉진하고, 순서에 따라 점진적으로 건강하고 유익한 문화교류를 펼쳐 나가길 원한다”고 피력했다. 협정문은 법률 검토와 정식 서명, 발효 절차 등을 거쳐야 하며 그 시점은 아직 정해지지 않았다. 한한령 10년","category":"생활·문화"},{"title":"연말 해외여행 계획땐 ‘주목’…“전세계 유행 ‘이 병’ 예방접종 챙겨야”","link":"https://n.news.naver.com/mnews/article/662/0000108816","naverLink":"https://n.news.naver.com/mnews/article/662/0000108816","pubDate":"2026-11-19T11:05:57.777529+09:00","author":"네이버뉴스","description":"국내 홍역환자, 올 상반기까지 1년6개월간 86명 모두 해외서 감염…홍역 검역관리지역 107개국 영아, 유행국 방문 자제…귀국 3주내 증상 땐 진료 질병관리청에 따르면 2025년부터 올해 상반기까지 국내에서 신고된 홍역 환자 86명은 모두 해외에서 비롯됐다. 61명은 해외에서 감염돼 들어왔고 25명은 이들에게서 옮았다. 질병청은 해외여행을 떠나기 전 방문할 나라의 홍역 유행 여부와 본인의 예방접종 기록을 확인해달라고 18일 당부했다. 게티이미지뱅크 해외 전파 없이 국내 단독 감염 환자는 없었다. 우리나라는 세계보건기구(WHO)로부터 13년 연속 홍역 퇴치국으로 인증받았다. 홍역 퇴치는 해외에서 환자가 들어와도 바이러스가 국내에 자리 잡아 계속 퍼지지 않는 상태를 말한다. ◆동남아·미주 환자 크게 늘어 =질병청이 인용한 WHO 발표에 따르면 미주·유럽·중동·아프리카·동남아시아·서태평양 등 전세계에서 홍역이 돌고 있다. 올해 환자는 약 34만명이다. 우리 국민이 자주 찾는 지역도 예외가 아니다. 지난해보다 동남아시아는 1만9851명에서 10만405명으로 5.1배, 미주는 1만4707명에서 5만6190명으로 3.8배 늘었다. 정부는 올해 4분기 기준 107개국을 홍역검역관리지역으로 지정해 관리하고 있다. 이 지역을 다녀온 뒤 의심 증상이 있으면 입국 때 신고해야 한다. 방문할 나라의 유행 상황은 질병청 ‘여행건강알림e’ 누리집에서 미리 확인할 수 있다. 질병관리청 ‘여행건강알림e’ 누리집의 해외여행 감염병 발생지도. 지도에서 나라를 누르면 검역관리지역인지와 주의해야 할 감염병을 확인할 수 있다. 18일 현재 캐나다도 홍역 검역관리지역으로 표시돼 있다. 여행건강알림e 누리집 해외여행 감염병 발생지도 캡처","category":"생활·문화"},{"title":"전인장 전 삼양식품 회장, 주식 470억어치 매각…\"벌금 납부 재원\"","link":"https://n.news.naver.com/mnews/article/277/0005844815","naverLink":"https://n.news.naver.com/mnews/article/277/0005844815","pubDate":"2026-11-19T11:05:57.777527+09:00","author":"네이버뉴스","description":"\"내달 18일부터 3만7000주 처분\" 전인장 전 삼양식품 회장이 대법원 확정 판결에 따른 벌금 191억원을 내기 위해 보유 중인 회사 주식 470억원어치를 매각한다. 19일 금융감독원 전자공시시스템에 따르면 전 전 회장은 전날 삼양식품 보통주 3만7000주를 시간 외 매매 방식으로 처분할 계획이라고 공시했다. 거래 개시일은 다음 달 18일이며 내년 1월 15일까지 진행된다. 전인장 전 삼양식품 회장 예상 처분 주식은 보통주 3만7000주다. 이를 지난 17일 종가(127만1000원) 기준으로 환산해 처분에 따른 취득 금액은 470억2700만원으로 제시했다. 실제 매각 금액은 향후 거래 시점의 주가에 따라 달라질 수 있다. 이번 처분으로 전 전 회장의 삼양식품 보유 주식은 기존 23만6000주(지분율 3.13%)에서 매각 후 19만9000주(2.64%)로 줄어든다. 전 전 회장은 이번 주식 처분 목적을 '대법원 판결에 따른 벌금 납부 재원 등'이라고 밝혔다. 앞서 대법원은 지난 9월 10일 특정범죄가중처벌법상 허위 세금계산서 교부 등 혐의로 기소된 전 전 회장에게 징역 3년에 집행유예 5년, 벌금 191억원을 선고한 원심을 확정했다. 전 전 회장은 2010년부터 2017년까지 자신이 운영하는 페이퍼컴퍼니 2곳을 통해 538억원 규모의 허위 계산서와 세금계산서를 발급한 혐의를 받았다. 전 전 회장은 고 전중윤 삼양식품 창업주의 아들이자 김정수 삼양식품 회장의 남편이며 전병우 전무의 부친이다.","category":"생활·문화"},{"title":"최저 -6도 아침 전국 영하권…전북남부 최대 '8㎝' 폭설[내일 날씨]","link":"https://n.news.naver.com/mnews/article/421/0009297884","naverLink":"https://n.news.naver.com/mnews/article/421/0009297884","pubDate":"2026-11-19T11:05:57.777523+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"태국 한국문화원 국유청사 마련…19일 재개원","link":"https://n.news.naver.com/mnews/article/277/0005844793","naverLink":"https://n.news.naver.com/mnews/article/277/0005844793","pubDate":"2026-11-19T11:05:57.777445+09:00","author":"네이버뉴스","description":"방콕 번화가에 지상 5층 규모 신청사 개원 140석 공연장·전시실·한식체험관 등 갖춰 태국 방콕의 한국문화원이 개원 13년 만에 국유청사를 마련하고 새롭게 문을 연다. 공연장과 전시실, 한식체험관 등을 갖춘 신청사를 기반으로 동남아시아 한류 확산과 양국 문화교류의 거점 역할을 강화한다. 문화체육관광부는 19일 오후 5시(현지시간) 방콕 수쿰윗대로에 마련한 주태국한국문화원 신청사에서 재개원식을 개최한다고 밝혔다. 2013년 개원한 주태국한국문화원은 그동안 임차 건물을 사용하면서 공연장과 강의실 부족 등으로 다양한 문화 프로그램을 운영하는 데 어려움을 겪었다. 이에 문체부는 2021년 태국 한국문화원을 14번째 국유화 대상 문화원으로 선정하고 방콕 시내 번화가에 있는 독립 건물을 매입했다. 이후 새 단장 공사를 거쳐 지난 6월 26일부터 임시 운영해 왔다. 주태국한국문화원 신청사. 문화체육관광부 신청사는 연면적 1906㎡, 지상 5층 규모다. 1층에는 전통문화실과 휴식 공간, 2층에는 한식체험관, 3층에는 무용실과 강의실, 4층에는 도서관, 5층에는 공연장과 전시실 등을 마련했다. 특히 140석 규모의 공연장에는 271인치 발광다이오드(LED) 스크린을 설치했으며, 한식ㆍ국악ㆍ무용ㆍ미술 등을 배울 수 있는 맞춤형 강의실 4개도 갖췄다. 재개원식에는 김재현 문체부 문화미디어산업실장과 박용민 주태국 한국대사, 태국 정부 관계자 등 100여 명이 참석한다. 소리꾼 유태평양을 비롯한 젊은 국악인들이 '비나리'와 창작 시나위 등을 공연한다. 태국의 인기 뮤지컬배우이자 전통 악기 라낫 연주자인 껀깐 수티꼬세와 함께 한국 민요 '아리랑'과 태국 전통 민요 '라호깜험'을 엮은 협연 무대도 마련한다. 재개원을 기념한 실감형 미디어아트 특별전 '바람의 풍경'도 열린다. 한국 전통문화와 문화유산을 디지털 기술로 재해석한 '어흥호랑이 - 용맹하게, 신통하게, 유쾌하게'와 '강산에 펼쳐진 풍요로운 세상, 강산무진도'를 태국에서 처음 공개한다. 1층에서는 전통 장신구와 한복을 소개하는 상설전 '치장, 삶의 의미를 장식하다'를 선보인다. 태국은 한국 문화콘텐츠에 대한 선호도가 높은 국가다. '2026 해외 한류 실태조사'에 따르면 태국의 한국 문화콘텐츠 호감도는 79.4%로 조사 대상 30개국 평균(69.7%)보다 9.7%포인트 높았다. 김재현 실장은 \"태국은 동남아시아에서 한국문화가 널리 사랑받는 국가인 동시에 풍부한 문화유산과 역동적인","category":"생활·문화"},{"title":"갤럭시 사진 전송, 이제 ‘톡’ 맞대면 끝[모닝폰]","link":"https://n.news.naver.com/mnews/article/018/0006412187","naverLink":"https://n.news.naver.com/mnews/article/018/0006412187","pubDate":"2026-11-19T11:05:57.277498+09:00","author":"네이버뉴스","description":"삼성 원UI 9.5 베타서 새 기능 확인 NFC 기술 활용…애플 에어드롭과 유사 [이데일리 신영빈 기자] 삼성전자(005930) 갤럭시 스마트폰끼리 서로 맞대기만 해도 사진이나 파일을 공유할 수 있는 기능이 새롭게 등장했다. 애플 에어드롭처럼 복잡한 조작 없이 스마트폰을 가까이 대는 것만으로 파일 전송을 시작할 수 있게 된다. 19일 정보기술(IT) 업계에 따르면 삼성전자가 전날 공개한 ‘원 UI 9.5’ 베타 버전에서 ‘탭 투 쉐어’ 기능이 새로 적용됐다. 갤럭시 스마트폰끼리 서로 맞대기만 해도 사진이나 파일을 공유할 수 있는 ‘탭 투 쉐어’ 기능 사용 예상도 (사진=챗GPT 생성) 탭 투 쉐어는 갤럭시 스마트폰의 파일 공유 기능인 ‘퀵쉐어’에 추가된 기능이다. 사진이나 동영상 등 공유할 파일을 선택한 뒤 상대방 스마트폰에 자신의 기기를 가까이 대면 파일 전송을 시작할 수 있다. 기존 퀵쉐어는 주변 기기를 검색하고 전송할 상대방을 선택하는 방식이다. 새로운 기능은 스마트폰을 서로 맞대는 동작으로 상대방을 지정할 수 있어 파일 공유 과정이 한층 간편해진다. 이를 위해 근거리무선통신(NFC) 기술을 활용한다. NFC는 스마트폰을 교통카드 단말기 등에 가까이 대면 정보를 주고받을 수 있도록 하는 기술이다. 탭 투 쉐어를 사용하려면 파일을 주고받는 두 스마트폰 모두 NFC를 지원해야 한다. 애플이 아이폰에 제공하는 에어드롭과도 유사하다. 애플은 아이폰 두 대를 가까이 대면 사진이나 파일을 공유할 수 있도록 지원한다. 연락처를 교환하는 ‘네임드롭’ 기능도 제공한다. 삼성전자는 18일부터 한국과 미국, 영국, 독일, 폴란드, 인도 등 6개국에서 갤럭시 S26 시리즈를 대상으로 원UI 9.5 베타 프로그램을 시작했다. 국내 이용자도 삼성 멤버스 앱을 통해 참여할 수 있다. 이번 업데이트에는 개별 앱을 생체인식이나 비밀번호로 보호하는 ‘앱 잠금’ 기능도 추가됐다. 잠긴 앱의 알림 내용과 위젯까지 숨길 수 있다. 카메라에서는 전문가용 사진·동영상 촬영 설정을 저장해 다시 불러오고 주요 설정을 한 화면에서 조절할 수 있도록 개선됐다. 삼성 헬스에는 감정과 생각을 기록하는 ‘마음 노트’ 기능이 추가됐으며 복약 관리 기능의 지원 국가도 확대됐다. 특정 앱을 실행하기 전 10초간 멈추도록 설정해 스마트폰 사용을 줄이는 기능과 워드·파워포인트 문서를 별도 앱 없이 열어보는 기능도 도입됐다.","category":"생활·문화"},{"title":"글로벌 게임사 모이고 AI 기업이 후원…‘지스타 2026’ 19일 개막","link":"https://n.news.naver.com/mnews/article/009/0005765568","naverLink":"https://n.news.naver.com/mnews/article/009/0005765568","pubDate":"2026-11-19T11:05:57.277491+09:00","author":"네이버뉴스","description":"국내 최대 게임전시회 ‘지스타 2026’이 19일 부산에서 개막한다. 올해 행사는 해외 대형 게임사, 국내외 인디게임 개발사의 참여를 대폭 확대한게 특징이다. 41개국 1237개 사가 참여하며, 전시 규모는 3445개 부스로 잠정 집계됐다. 조직위는 산업 간 협업과 글로벌 게임 쇼케이스, 인디 쇼케이스, 게임 콘퍼런스 ‘G-CON’ 등 등 자체 기획 프로그램 강화에 중점을 뒀다고 설명했다. 기존 신작 전시 중심에서 벗어나 인공지능(AI), 애니메이션, 영화, 모빌리티 등 다양한 산업과 결합해 외연을 확장한 것도 특징이다. AI 스토리 창작 플랫폼 ‘크랙’을 운영하는 뤼튼테크놀로지스가 메인 스폰서로 참여했다. 일반 관람객을 위한 BTC 전시관은 벡스코 제1전시장 전관과 제2전시장 1층에서 운영된다. 제1전시장에는 크래프톤, 호요버스, 구글플레이, 웹젠, 팀42, 뤼튼을 비롯한 6개 기업이 각각 100개 부스 이상 대형 전시 공간을 마련한다. 제2전시장 1층에는 올해 처음 선보이는 ‘지스타 글로벌 게임 쇼케이스’가 열린다. 세가, 코에이 테크모 게임스, 캡콤, 넷이즈게임즈, CD 프로젝트 레드를 비롯한 글로벌 게임사 5곳이 참가한다. BTB 전시관은 19~21일 벡스코 제2전시장 3층에서 운영된다. 조직위는 올해 네트워크 라운지 규모를 확대하고 스타트업과 소규모 개발사를 위한 라운지 부스를 신설했다. 네이버 스트리밍 플랫폼 ‘치지직’은 공식 미디어 파트너로 참여한다. 이날 열리는 온라인 쇼케이스 ‘지스타 프리미어’와 행사기간 진행되는 ‘지스타 TV’의 프로그램이 치지직에서 단독 중계된다. 글로벌 게임 유통 플랫폼 스팀에서는 지스타 특별 페이지를 운영한다. 참가사들의 게임 할인전과 출품 신작 정보를 제공할 예정이다. 올해도 지스타는 관람객 안전을 위해 입장권 100% 사전 예매제를 시행한다. 전시장 내 밀집도를 분산하고 안전 인력도 배치할 계획이다.","category":"생활·문화"},{"title":"고물가에 성난 북쪽 끝에서도 민주당 뽑았다…68년만에 美상원 최대의석","link":"https://n.news.naver.com/mnews/article/009/0005765892","naverLink":"https://n.news.naver.com/mnews/article/009/0005765892","pubDate":"2026-11-19T11:05:56.801674+09:00","author":"네이버뉴스","description":"중간선거 최종 결과 알래스카 이기며 9석 가져와 상원 ‘민주 56 vs 공화 44석’ 펠톨라, 가스개발 지원 공약 알래스카주 연방 상원의원에 당선된 민주당 메리 펠톨라 후보 [AFP연합뉴스] 미국 중간선거에서 마지막까지 승자가 가려지지 않았던 알래스카 상원 의석도 결국 민주당이 차지했다. 전 하원의원 메리 펠톨라 민주당 후보가 공화당 현역 댄 S 설리번 후보를 꺾으면서 차기 상원은 민주당 56석, 공화당 44석으로 정리됐다. 민주당은 공화당 자리 9개를 빼앗아 1958년 이후 중간선거에서 가장 큰 폭으로 상원 의석을 늘렸다. AP통신은 17일(현지시간) 펠톨라 후보의 당선이 확실하다고 판정했다. 알래스카 선거 당국의 이날 집계에서 펠톨라 후보는 14만4302표(50.12%)를 얻어 설리번 후보의 13만1844표(45.8%)를 앞섰다. 표차는 1만2458표다. 알래스카에서는 유권자가 후보들의 선호 순위를 적어 투표한다. 먼저 1순위로 지목된 표를 세고 과반 득표자가 없으면 최하위 후보를 탈락시킨 뒤 그 표에 적힌 다음 순위자에게 표를 넘긴다. 펠톨라 후보는 현재까지 집계된 1순위 표만으로도 과반을 차지했다. 알래스카에서는 선거일 이후 도착하는 우편투표도 일정 기간 인정하기 때문에 개표가 오래 걸린다. 유권자가 가장 선호하는 후보로 표시한 ‘1순위 표’ 역시 우편투표가 추가될 때마다 득표율이 달라진다. 펠톨라 후보는 16일까지 과반에 조금 못 미쳤지만 17일 추가 집계에서 50.12%를 확보했다. AP통신은 남은 표까지 고려해도 역전이 어렵다고 보고 당선이 확실하다고 판정했다. 민주당 측 56석에는 민주당에 협력하는 무소속 버니 샌더스·앵거스 킹 의원이 포함됐다. 민주당 소속은 54명이다. NBC뉴스에 따르면 민주당이 탈환한 9석 가운데 8석은 도널드 트럼프 대통령이 2024년 대선에서 승리한 주에 있다. 텍사스와 사우스캐롤라이나, 캔자스, 미시시피 등 보수 성향 주에서도 공화당이 의석을 내줬다. 펠톨라 후보는 하원의원 선거에서 낙선한 지 2년 만에 상원의원으로 연방 의회에 돌아오게 됐다. 알래스카 원주민 유픽족 출신인 그는 2022년 돈 영 하원의원의 사망으로 치러진 보궐선거에서 승리했다. 알래스카 원주민으로는 첫 연방의회 입성이었다. 그해 정기선거에서도 이겼지만 2024년 닉 베기치 공화당 후보에게 패했다. 이번에는 알래스카 원주민 최초의 연방 상원의원이 된다. 올해 53세인 펠톨라 후보는 앵커리지에서 태어나","category":"생활·문화"},{"title":"수험생 子에 도시락 배달하려다 교통사고…母, 경찰 도움으로 무사히 전달","link":"https://n.news.naver.com/mnews/article/119/0003157079","naverLink":"https://n.news.naver.com/mnews/article/119/0003157079","pubDate":"2026-11-19T11:05:56.340157+09:00","author":"네이버뉴스","description":"경찰, 남해고속도 진주분기점 인근서 해당 母 태워 30㎞ 달려 마감시간보다 50여분 앞서서 시험장 도착…도시락 건네 경찰 로고. ⓒ연합뉴스 [데일리안 = 진현우 기자] 2027학년도 대학수학능력시험(수능) 당일인 19일 아침 수험생 아들에 도시락을 주려다 다른 차와 부딪히는 사고를 당한 어머니가 경찰의 도움으로 무사히 아들에게 도시락을 건넸다. 19일 경남경찰청 등에 따르면 이날 오전 6시26분쯤 남해고속도로 진주분기점 인근에서 40대 여성 A씨가 몰던 그랜저 승용차가 차로를 변경하는 과정에서 다른 차와 부딪히는 사고가 났다. A씨는 이날 산청에서 수능을 치르는 아들에게 도시락을 전달하려고 아침 일찍 경남 사천 집을 나서던 중이었던 것으로 확인됐다. 경찰은 사고 수습과정에서 전후 사정을 듣고, 그랜저는 견인시킨 뒤 A씨를 순찰차에 태워 30㎞ 떨어진 산청 시험장까지 데려다줬다. A씨는 시험장 입실 마감시간보다 50여분 앞선 오전 7시15분쯤 시험장에 도착해 아들에게 도시락을 건넬 수 있었다. 다행히 별다른 부상을 당하지는 않은 A씨는 경찰에 감사의 뜻을 전한 것으로 알려졌다.","category":"생활·문화"}],"세계":[{"title":"미국인 51% \"오바마 가장 좋아\"…52%는 \"트럼프 가장 비호감\"","link":"https://n.news.naver.com/mnews/article/277/0005844819","naverLink":"https://n.news.naver.com/mnews/article/277/0005844819","pubDate":"2026-11-19T11:05:56.801766+09:00","author":"네이버뉴스","description":"폴리티코, 전·현직 대통령 4명 선호 조사 오바마 1위 51%…트럼프 4위 52% 트럼프 지지율 32%로 최저 수준 미국 성인 절반 이상이 최근 25년간 재직한 대통령 4명 가운데 버락 오바마 전 대통령을 가장 좋아한다고 답했다. 전·현직 대통령 4명 선호 순위…오바마 과반 1위 지난달 28일(현지시간) 미국 조지아주 모로에서 열리는 중간선거를 앞두고 버락 오바마 전 미국 대통령이 집회에 참석했다. 로이터연합뉴스 미국 정치전문매체 폴리티코는 17일(현지시간) \"여론조사업체 'PF 글로벌'에 의뢰해 이달 7~10일 미국 성인 2000명을 온라인으로 조사한 결과 응답자의 51%가 오바마 전 대통령을 1위로 꼽았다\"고 보도했다. 이번 조사는 조지 W. 부시(공화당·재임 2001~2009년), 오바마(민주당·2009~2017년), 도널드 트럼프(공화당·2017~2021년, 2025년~), 조 바이든(민주당·2021~2025년) 등 전·현직 대통령 4명을 좋아하는 순서대로 1~4위까지 매기는 방식으로 진행됐다. 오차범위는 ±2%P다. 민주당 지지층에서는 진보 성향의 83%, 중도 성향의 76%가 오바마 전 대통령을 1위로 선택했다. 그를 4위로 꼽은 응답자는 8%에 불과했다. 2024년 대선에서 트럼프 대통령에게 투표한 응답자 중에서도 16%가 오바마 전 대통령을 1위로 꼽았다. 민주당은 오바마 전 대통령의 높은 호감도를 활용해 이번 중간선거에서 그를 격전지 유세에 투입하기도 했다. 트럼프 대통령을 1위로 꼽은 응답자는 28%로 오바마 전 대통령 다음으로 많았다. 다만 4위로 꼽은 응답자도 52%로 4명 중 가장 많았다. 지난 대선 트럼프 투표자 가운데 자신을 '마가(MAGA·미국을 다시 위대하게)' 진영으로 분류한 응답자는 81%가 그를 1위로 꼽았고, 마가 진영이 아닌 응답자는 42%가 1위로 꼽았다. 바이든 전 대통령은 1위 5%로 4명 중 가장 낮았고, 4위는 34%로 트럼프 대통령 다음으로 높았다. 지난 대선에서 카멀라 해리스 전 부통령에게 투표한 응답자 중에서도 바이든 전 대통령을 1위로 꼽은 비율은 6%였다. 폴리티코는 바이든 전 대통령의 결과를 두고 \"미국 대중이 그에게 얼마나 실망했는지 보여준다\"고 평가했다. 부시 전 대통령은 1위 16%, 4위 7%였고 2위(40%)와 3위(38%)에 응답이 몰렸다. 지지율 32% 트럼프…\"오바마 매우 과대평가돼\" 최근 조사에서 트럼프 대통령의 국정 수행을 지지한다는","category":"세계"},{"title":"환영단 1명 없이 썰렁‥중국, 日 다카이치에 대놓고 '냉대'","link":"https://n.news.naver.com/mnews/article/214/0001536578","naverLink":"https://n.news.naver.com/mnews/article/214/0001536578","pubDate":"2026-11-19T11:05:56.801762+09:00","author":"네이버뉴스","description":"아시아태평양경제협력체(APEC) 정상회의가 열리고 있는 중국 광둥성 선전의 바오안 국제공항. 일장기를 단 정부 전용기의 문이 열리자 다카이치 사나에 일본 총리가 모습을 드러냈습니다. 그런데 계단 아래에 그녀를 맞이하는 중국 측 의전 인원은 그 숫자를 눈으로도 헤아릴 수 있을 정도로 극소수였습니다. 한 나라의 수장을 맞이하는 자리라고 하기엔 지나치게 휑하고, 쓸쓸한 기운마저 감도는 분위기 속 총리를 맞이한 중국 정부 측 여성 인사는 외교부의 의전 담당 대사로 알려졌습니다.","category":"세계"},{"title":"美정보수장 \"이란의 미국인 겨냥 위협 급증…본토·해외 모두 위험\"","link":"https://n.news.naver.com/mnews/article/421/0009297840","naverLink":"https://n.news.naver.com/mnews/article/421/0009297840","pubDate":"2026-11-19T11:05:56.801760+09:00","author":"네이버뉴스","description":"美정보수장 \"이란의 미국인 겨냥 위협 급증…본토·해외 모두 위험\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"60년 된 구리선이 부른 대재앙\"…절연 테이프로 버티다 최악의 '셧다운' [스프]","link":"https://n.news.naver.com/mnews/article/055/0001404151","naverLink":"https://n.news.naver.com/mnews/article/055/0001404151","pubDate":"2026-11-19T11:05:56.801753+09:00","author":"네이버뉴스","description":"⚡ 스프 핵심요약 9.11 이후 최장기 미 전역 지상 중지 명령: 현지시간 13일, 미국 연방항공청(FAA)이 관제센터 주파수 단절 현상으로 4시간 반 가까이 미국 전역 항공기 이륙을 전면 중단시키며 이틀간 1만 5,000편 이상의 항공편이 취소되었습니다. 60년 된 구리선 교체 중 발생한 시스템 과부하: 외주업체(L3 해리스)가 1960년대산 노후 구리선을 광케이블로 전환하던 중 라우터에서 과도한 접속 요청(4~5초당 1,000건 이상)이 폭주하며 항공기 통신 및 레이더 데이터 수신에 장애가 발생했습니다. 예고된 인재와 미 정치권의 책임 공방: 2023년 전문가 보고서와 회계감사원이 전환 과정의 통신 두절 위험을 수차례 경고했음에도 사태가 현실화되었으며, 트럼프 대통령의 전임 행정부 탓과 민주당의 예산 미집행 비판 등 정치적 공방으로 번지고 있습니다. 13일의 금요일, 미국 전역에서 항공기 운항이 4시간 넘게 전면 중단됐습니다. 2001년 9.11 테러 이후 가장 긴 하늘길 마비입니다. 스티븐 아로요 | 항공 안전 전문가 (전 유나이티드 항공 기장) 미국 전역에 항공기 운항 중단 명령이 내려졌다는 건 정말 이례적인 일이었습니다. 미국에서 이런 일이 있었던 건 사실상 9.11 테러 이후 처음이니까요. 수많은 여객기를 통제하는 미국 항공 시스템에 대체 무슨 일이 벌어진 걸까요? 01. 이륙하지 마세요! 현지시각 13일, 미국 연방항공청이 미국 전역의 공항에 4시간 반 가까이 지상 중지 명령을 내렸습니다. 이 여파로 사태 첫날에만 9천 편이 넘는 항공편이 취소됐고, 다음 날인 14일에도 6천 편 이상이 취소되는 등 항공 운항에 큰 차질이 빚어졌습니다. 브라이언 베드퍼드 미국 연방항공청 청장은 '미 전역 22개 항로 관제센터 가운데 최대 17곳에서 수신되는 특정 주파수 신호가 간헐적으로 끊겼다 다시 연결되는 현상이 무작위로 보고됐기 때문'이라고 설명했습니다. 02. 승객들은 발이 묶였다 비행기의 운항이 멈추자 승객들은 하염없이 기다려야 했습니다. 스테파니 | 관광객 저희는 일주일 동안 휴가를 보내고 돌아가는 길입니다. 오늘(13일) 아침 비행기가 2시간 지연됐다는 안내를 받았고 지금 이렇게 기다리고 있습니다. 벌써 2시간째 기다리고 있는데, 아무런 안내도 받지 못했습니다. 남편이 직접 물어봤더니 돌아온 대답은 '비행기가 지연됐다'는 말뿐이었습니다. 일부 승객들은 향후 일정에 차질을 빚었습니다. 미셸 알렉산더 스미스","category":"세계"},{"title":"아이티 모이즈대통령 암살범 플로리다 목사 사농, 미 법정서 유죄판결","link":"https://n.news.naver.com/mnews/article/003/0014331771","naverLink":"https://n.news.naver.com/mnews/article/003/0014331771","pubDate":"2026-11-19T11:05:56.801751+09:00","author":"네이버뉴스","description":"아이티 모이즈대통령 암살범 플로리다 목사 사농, 미 법정서 유죄판결. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"유화 제스처에서 돌변… 美, 다시 '北 완전한 비핵화' 못 박았다","link":"https://n.news.naver.com/mnews/article/469/0000966475","naverLink":"https://n.news.naver.com/mnews/article/469/0000966475","pubDate":"2026-11-19T11:05:56.801749+09:00","author":"네이버뉴스","description":"유화 제스처에서 돌변… 美, 다시 '北 완전한 비핵화' 못 박았다. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"\"한국엔 꽃 흔들더니 무례\"…다카이치 '썰렁의전'에 분개한 日 [도쿄나우]","link":"https://n.news.naver.com/mnews/article/015/0005355656","naverLink":"https://n.news.naver.com/mnews/article/015/0005355656","pubDate":"2026-11-19T11:05:56.801747+09:00","author":"네이버뉴스","description":"외무성 \"최소한의 예의도 없다\" 다카이치 시진핑과 짧게 악수 \"일본 입장엔 변화 없어\" “외교상 최소한의 예의도 없고 정말 무례하다” 다카이치 사나에 일본 총리가 아시아태평양경제협력체(APEC) 정상회의 참석차 18일 중국 선전에 도착할때 중국이 선보인 공항 의전 모습에 일본 내에서 비판의 목소리가 커지고 있다. 도널드 트럼프 미국 대통령은 시진핑 중국 국가주석이 직접 맞았고, 이재명 한국 대통령이 도착했을 때는 화동들이 나와 꽃을 흔들며 환호했다. 하지만 다카이치 총리의 전용기 앞에는 소수의 영접 인원만 나왔다. 일본 외무성 간부는 “외교상 최소한의 예의도 없고 정말 무례하다”고 반발했다. 아시아태평양경제협력체(APEC) 정상회의에 참석하는 이재명 대통령과 김혜경 여사가 지난 18일(현지시간) 중국 선전 바오안 국제공항에 도착한 공군 1호기에서 내려 이동하고 있다. 사진=뉴스1","category":"세계"},{"title":"머스크, 공화당에 중간선거 6000억 배팅 “어리석었다”","link":"https://n.news.naver.com/mnews/article/028/0002832944","naverLink":"https://n.news.naver.com/mnews/article/028/0002832944","pubDate":"2026-11-19T11:05:56.801712+09:00","author":"네이버뉴스","description":"세계 최고 부자의 ‘현타’…돈으로 선거 사려다 역풍 지난 9월29일(현지시각) 미국 워싱턴 백악관에서 열린 인공지능(AI) 관련 기술기업 최고경영자(CEO)들과의 회의 뒤 도널드 트럼프 미국 대통령이 취재진에게 발언하는 가운데 그 뒤에 서 있던 일론 머스크 테슬라·스페이스엑스(SpaceX) 최고경영자(CEO)가 머리를 쓸어올리고 있다. AFP 연합뉴스 일론 머스크 스페이스엑스(X) 최고경영자(CEO)가 지난 3일 치러진 미국 중간선거에서 사상 최대 규모의 공화당 지원용 선거자금을 지출한 것을 두고 “어리석었다”고 후회했다. 블룸버그는 머스크가 18일(현지시각) 뉴욕타임스 ‘딜북 서밋’에 나와 미 중간선거에서 자신의 선거 자금 지출에 일말의 후회를 내비쳤다고 보도했다. 머스크는 “그렇게 많은 돈을 쓰고도 별다른 성과를 보지 못해 꽤 어리석었다고 느낀다”며 “아마 시계를 되돌릴 수 있다면 돈을 덜 썼을 것”이라고 말했다. 머스크는 “이번 결과는 미국 선거가 단순히 돈만으로 되는 것이 아님을 분명히 보여준다”며 “선거에 막대한 돈을 쏟아붓고도 그 효과는 비교적 미미할 수 있다”고 덧붙였다. 공화당 후원자이자 도널드 트럼프 대통령의 우군인 그는 이번 선거 기간 동안 미국 정치 사상 최대 규모인 4억4500만달러(약 6000억원) 이상을 공화당 후보와 이들을 지원하는 슈퍼팩에 기부했다. 이 중 절반이 넘는 2억4000만달러(3200억원)를 자신의 거주지이자 사업 본거지인 텍사스에 쏟아부었지만, 상원과 주지사 모두 민주당에 넘겨주는 등 지원한 후보 대부분이 낙선했다. 오히려 민주당은 머스크의 기부를 두고 ‘선거를 돈으로 사려고 한다’며 역공 소재로 활용했고, 당선 뒤에는 그의 사업에 대한 규제와 조사를 벼르고 있다. 블룸버그는 “세계 최고 부자라도 ‘괜히 돈 썼다는 후회’(buyer’s remorse)를 할 수 있다”고 꼬집었다. 도널드 트럼프 미국 대통령이 지난달 8일(현지시각) 워싱턴의 미국 평화연구소(트럼프 행정부가 ‘도널드 J. 트럼프 평화연구소’로 개명)에서 열린 ‘새로운 황금기’ 서밋 도중 일론 머스크 테슬라·스페이스엑스 최고경영자(CEO)에게 국가과학메달을 수여하고 있다. 로이터 연합뉴스","category":"세계"},{"title":"중일 정상 '악수'했지만…다카이치 공항 홀대에 日측 \"외교 결례\"","link":"https://n.news.naver.com/mnews/article/003/0014332285","naverLink":"https://n.news.naver.com/mnews/article/003/0014332285","pubDate":"2026-11-19T11:05:56.801706+09:00","author":"네이버뉴스","description":"중일 정상 '악수'했지만…다카이치 공항 홀대에 日측 \"외교 결례\". 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프·카니, 中서 예정에 없던 회담…무역협정 논의","link":"https://n.news.naver.com/mnews/article/001/0016450391","naverLink":"https://n.news.naver.com/mnews/article/001/0016450391","pubDate":"2026-11-19T11:05:56.801686+09:00","author":"네이버뉴스","description":"카니 \"협상, 두 걸음 진전하면 한 걸음 후퇴하는 식\" 지난 6월 주요 7개국(G7) 정상회의에 참석한 도널드 트럼프 미국 대통령과 마크 카니 캐나다 총리 [로이터=연합뉴스 자료사진. 재판매 및 DB 금지] (뉴욕=연합뉴스) 김연숙 특파원 = 중국 선전에서 열린 아시아태평양경제협력체(APEC) 정상회의에 참석 중인 도널드 트럼프 미국 대통령과 마크 카니 캐나다 총리가 18일(현지시간) 만나 무역협정 등에 관해 논의했다. 캐나다 총리실은 성명에서 \"양국 정상은 상호 이익이 되는 무역 협정을 체결하기 위한 논의를 진행했다\"고 밝혔다. 총리실은 \"(이 협정은) 양질의 일자리를 창출하고 물가 부담을 완화하며 캐나다 언어와 문화, 주권을 온전히 존중하는 것\"이라고 설명했다. 블룸버그 통신에 따르면 미국 측에선 마코 루비오 국무장관, 하워드 러트닉 상무장관, 제이미슨 그리어 미국 무역대표부(USTR) 대표, 스티븐 밀러 신임 백악관 비서실장이 배석했다. 이는 예정에 없던 회담으로, 카니 총리가 이번 아시아 순방 중 중국, 필리핀과 무역 성과를 거둔 직후에 이뤄진 만남이라고 뉴욕타임스(NYT)는 짚었다. 전날까지만 해도 캐나다 총리실은 중국에서 트럼프 대통령과 회동은 없을 것이라고 밝혔다고 NYT는 전했다. 회담에 앞서 기자들과 만난 카니 총리는 무역 협정과 관련해 트럼프 행정부와 진전을 이루고 있다면서도, 협상 과정을 두고 \"두 걸음 진전하면 한걸음 후퇴하는 식\"이라고 말했다. 그는 \"우리는 오랫동안 캐나다와 미국 간에 상호 이익이 되는 합의가 가능하다고 말해왔고 믿어왔으며 지금도 그렇게 믿고 있다\"고 했다. 또 \"그 합의를 이루기 위해 필요한 모든 조치를 할 것이지만, 그 합의가 캐나다 국민의 이익에 부합하는 경우에만 그렇게 할 것\"이라고 덧붙였다. 앞서 캐나다와 미국은 관세 인하를 목표로 협상을 벌였으나 지난 8월 결렬된 바 있다. 트럼프 대통령이 캐나다산 제품에 신규 관세를 부과하자 캐나다도 보복 관세로 맞섰다. 트럼프 대통령은 이달 초 캐나다와의 합의가 매우 가까워졌다고 밝혔지만, 양국은 아직 공식 협상 단계로 복귀하지 않은 상태다. nomad@yna.co.kr","category":"세계"}],"IT 과학":[{"title":"\"전화·예약·결제까지 척척\"…구글 제미나이, AI 비서로 진화","link":"https://n.news.naver.com/mnews/article/018/0006412230","naverLink":"https://n.news.naver.com/mnews/article/018/0006412230","pubDate":"2026-11-19T11:05:57.277571+09:00","author":"네이버뉴스","description":"정비소 두 곳에 동시 전화…5분 만에 예약까지 완료 쇼핑·요금 분석·일정 관리…AI가 실제 업무 수행 한국 등 6개국 무료 도입…고급 기능은 미국 우선 The Google logo is displayed during a press conference in Berlin, Germany, November 11, 2025. REUTERS/Lisi Niesner [이데일리 한광범 기자] 자동차에 엔진 경고등이 켜지자 이용자가 인공지능(AI) 제미나이에게 가까운 정비소 두 곳에 전화해 금요일 아침으로 예약해 달라고 요청했다. 제미나이는 자동차 정보와 거주지를 바탕으로 정비소를 찾아 동시에 전화를 걸었고, 이용자의 일정을 확인해 5분도 채 걸리지 않아 예약을 마쳤다. 구글이 17일(현지시간) 공개한 제미나이의 새로운 업무 수행 기능을 보여주는 사례다. 질문에 답하거나 글을 작성하는 수준을 넘어 이용자를 대신해 전화를 걸고 예약을 잡거나 물건을 구매하는 개인 비서로 발전한 것이다. 구글은 제미나이에 실제 업무를 맡길 수 있는 ‘태스크(Task)’ 기능을 도입한다고 밝혔다. 새로운 AI 모델 ‘제미나이 4 하이드로젠(Gemini 4 Hydrogen)’을 기반으로 한국과 미국, 일본, 캐나다, 호주, 인도 등 6개국에서 무료로 순차 제공한다. 다만 전화 예약과 결제 등 일부 고급 기능은 미국에서 우선 출시된다. 이용자는 제미나이 첫 화면에서 기존 ‘채팅(Chat)’ 대신 ‘태스크’를 선택하고 원하는 작업을 설명하면 된다. 제미나이는 필요한 정보를 찾고 여러 서비스를 이용해 업무를 처리하며, 중요한 결정이 필요한 경우 이용자에게 확인을 요청한다. 정비소 예약부터 전기요금 분석·쇼핑 결제까지 구글이 소개한 정비 예약 사례에서 제미나이는 개인화 기능을 통해 이용자의 차량이 2019년식 혼다 오디세이라는 사실과 거주지를 파악했다. 구글 지도에서 가까운 정비소 두 곳을 찾은 뒤 동시에 전화를 걸어 예약 가능 여부를 확인했다. 이어 구글 캘린더에서 비어 있는 금요일 아침 시간을 찾아 예약을 등록했다. 전화 통화 과정에서는 상대방에게 자신이 AI라는 사실을 먼저 알린다. 업체는 AI의 전화 응대를 거부할 수 있으며, 이용자의 허락 없이 결제정보나 민감한 계정정보를 제공하지 않도록 설계됐다. 전기요금이 예상보다 많이 나왔을 때 원인을 찾는 일도 대신한다. 구글이 공개한 사례에서는 389달러의 전기요금이 청구되자 제미나이가 이용자 허가를 받아","category":"IT 과학"},{"title":"김용관 삼성전자 사장 “네오클라우드 비중 8%…AI 버블 우려 과도”","link":"https://n.news.naver.com/mnews/article/030/0003487347","naverLink":"https://n.news.naver.com/mnews/article/030/0003487347","pubDate":"2026-11-19T11:05:57.277567+09:00","author":"네이버뉴스","description":"김용관 삼성전자 DS부문 경영총괄 사장 네오클라우드 업체의 과도한 부채가 인공지능(AI) 거품을 키울 수 있다는 우려에 대해 김용관 삼성전자 DS부문 경영총괄 사장이 과도한 우려라며 선을 그었다고 로이터 통신이 18일(현지시간) 보도했다. 보도에 따르면 김 사장은 이날 싱가포르에서 열린 모건스탠리 콘퍼런스에서 “네오클라우드는 전체 시장에서 상대적으로 작고 제한적인 부분으로, 약 8%를 차지한다”고 말했다. 김 사장은 이어 “이런 우려가 더 광범위한 AI 성장 궤적에 중대한 위협이 될 것으로 예상하지 않는다”고 발혔다. 코어위브·네비우스 등 네오클라우드는 부채를 기반으로 확장한 데이터센터가 AI 수요 둔화 시 부담이 될 수 있다는 우려로 주가가 흔들린 바 있다. 젠슨 황 전 엔비디아 최고경영자(CEO) 퇴진으로 자금 조달 부담이 커질 수 있다고 로이터는 짚었다. 김 사장은 현재 AI 투자 열기는 순환적이 아니라 구조적이라고 진단했다. 반도체 업체와 고객 간 장기 계약으로 수요와 공급을 가늠하기 용이해졌다는 설명이다. 그는 투기성 투자가 결국 공급과잉으로 끝난 과거 사이클과 다르다며 “오늘날의 투자는 투기가 아니라 실제 유형의 수요에 따른 것”이라고 강조했다. 김 사장은 남은 주주환원을 현금배당과 “상당한 규모”의 자사주 매입·소각으로 이행하겠다는 기존 방침도 재확인했다.","category":"IT 과학"},{"title":"11년간 숨은 웹서버 'nginx' 보안 구멍…韓 AI가 찾았다","link":"https://n.news.naver.com/mnews/article/018/0006412251","naverLink":"https://n.news.naver.com/mnews/article/018/0006412251","pubDate":"2026-11-19T11:05:57.277561+09:00","author":"네이버뉴스","description":"인증 없이 원격 악성코드 실행 가능한 취약점 5건 확인 티오리 AI '진트' 4건 자율 발굴…90분 만에 탐지 F5·주요 클라우드사와 대응 조율…보안 업데이트 권고 [이데일리 한광범 기자] 전 세계 웹사이트 운영에 널리 쓰이는 웹 서버 소프트웨어 ‘엔진엑스(nginx)’에서 외부 공격자가 로그인하지 않고도 악성 코드를 실행할 수 있는 취약점 5건이 발견됐다. 이 중 4건은 국내 보안기업이 개발한 인공지능(AI)이 연구원의 개별 지시 없이 찾아냈다. AI 보안기업 티오리는 19일 연구 결과를 ‘nginx2Root’라는 이름으로 공개하고 관련 보안 업데이트를 신속히 적용하라고 권고했다. nginx는 웹사이트 이용자의 요청을 처리하고 다른 서버로 트래픽을 전달하는 프로그램이다. 전 세계 웹사이트의 약 3분의 1에서 사용되는 것으로 알려져 결함이 악용되면 여러 인터넷 서비스에 영향을 미칠 수 있다. 이번에 발견된 취약점 5건은 발생 원인은 다르지만, 공격자가 별도의 로그인이나 인증 없이 외부에서 서버에 악성 코드를 실행할 수 있다는 공통점이 있다. 특히 이 중 하나는 2015년부터 약 11년 동안 발견되지 않은 채 남아 있었다. 오랫동안 사용돼 온 핵심 인터넷 소프트웨어에도 심각한 보안 결함이 숨어 있었던 셈이다. 원격 코드 실행이 곧바로 서버의 최고 관리자 권한 탈취를 뜻하는 것은 아니다. 다만 티오리는 별도로 발견한 리눅스 커널 취약점과 연계하면 최고 관리자(root) 권한까지 얻어 서버 전체를 통제할 수 있다고 밝혔다. 실제 악용 가능성은 nginx 버전과 서버 설정, 외부 노출 조건 등에 따라 달라진다. AI, 5만줄 코드 분석해 1시간 30분 만에 탐지 이번 연구에서 주목할 대목은 취약점을 찾아낸 방식이다. 티오리는 nginx 소스코드 약 5만줄을 자율형 AI 보안 플랫폼 ‘진트(Xint)’로 분석했다. 진트는 약 1시간 30분 만에 주요 결함을 찾아냈고, 연구진은 AI가 제시한 재현 경로를 바탕으로 약 10분 만에 실제 공격 가능성을 입증하는 개념증명(PoC)을 완성했다. 최종 확인된 취약점 5건 가운데 4건은 진트가 사람의 개별적인 안내 없이 발굴했고, 나머지 1건은 연구원이 직접 찾아냈다. 약 6개월 전 진트가 리눅스 커널의 ‘카피페일(CopyFail)’ 취약점을 발견했을 당시에는 연구원의 지도가 필요했지만, 이번에는 AI가 스스로 분석과 탐색을 이어갔다. 티오리는 이러한 차이가 단순히 성능이 뛰어난 A","category":"IT 과학"},{"title":"AI안경 신호 쫓아 위치 추적…해외 시험장엔 ‘AI 감독관’","link":"https://n.news.naver.com/mnews/article/023/0004010510","naverLink":"https://n.news.naver.com/mnews/article/023/0004010510","pubDate":"2026-11-19T11:05:57.277557+09:00","author":"네이버뉴스","description":"3줄 요약 ㆍ 美 스타트업, AI 영상 분석으로 카메라 안경 실시간 감지 ㆍ 소리와 음성 분석으로 부정행위 감지도 ㆍ 중국·프랑스, 시험장 스마트 보안 검색대와 탐지기 배치 챗GPT 생성 이미지/GPT 카메라가 달린 스마트 안경을 끼고 한 건물 안으로 들어가면, 몇 초 뒤 보안팀의 화면에 안경의 위치가 뜬다. 건물 안 곳곳에 설치된 센서가 블루투스 등 무선 신호를 포착한 것이다. 오차 범위는 최대 3m 수준이다. 이는 미국 무선 보안 업체 바스티유 네트웍스가 지난 9월 공개한 기술이다. 스마트 안경뿐 아니라 스마트워치 같은 소형 전자기기도 추적 대상이다. 인공지능(AI)을 활용한 부정행위가 시험과 채용의 공정성을 위협하면서 이를 막는 기술도 진화하고 있다. 안경에 숨은 카메라로 문제를 촬영하거나 다른 기기에서 AI가 만들어준 답을 받아보는 행위를 찾아내기 위해 영상과 소리, 무선 신호까지 분석하는 것이다. 한국 수능이 수험생의 안경을 검사하고 카메라가 숨어 있을 수 있는 옷 단추에 스티커를 붙이는 식으로 대응하는 가운데, 해외 시험장에서는 전자기기를 가려내기 위한 첨단 기술을 동원한 검색과 감시가 강화되고 있다. AI 부정행위 잡는 ‘AI 감독관’ 미국 시험 운영 업체 ‘프로메트릭’은 이달 시험대마다 카메라 두 대를 활용하는 보안 시스템을 발표했다. 시험을 보는 책상 등에 카메라를 설치하면 AI가 실시간으로 영상을 분석해 카메라가 달린 안경이나 휴대전화를 찾아낸다. 이를 통해 현장 감독관이 시험 문제를 촬영하는 것으로 의심되는 행동을 제지할 수 있다. 소수의 사람 감독관이 여러 응시자의 행동을 동시에 살펴야 하는 부담을 덜기 위한 ‘AI 감독관’ 시스템이다. 프로메트릭은 “100여 국 응시자 좌석 1만3000곳 이상에 카메라 2만6000대 이상을 추가 설치할 계획”이라고 밝혔다. 미국 온라인 시험 감독 업체 ‘아너록’은 소리를 활용해 부정행위를 잡아낸다. 응시자가 시험을 치르는 컴퓨터 외에 다른 기기로 특정 부정행위 사이트에 접속하면, 그 기기에서 식별용 소리가 나오도록 하는 방식이다. 시험용 컴퓨터의 마이크가 이 소리를 포착하면 별도 기기로 해당 사이트를 이용했을 가능성을 찾아낼 수 있다. 채용 면접에서도 소리가 부정행위를 가려내는 단서가 된다. 중국 채용 기술 업체 ‘베이선’은 지원자가 화상 면접에서 답변하는 도중 키보드 소리가 나는지 감지할 수 있다. 질문에 대한 답을 검색하거나 입력하는 정황을 살피는 것","category":"IT 과학"},{"title":"\"웹 애플리케이션 보안으론 부족\"…자바 취약점 대응 '빨간불'","link":"https://n.news.naver.com/mnews/article/138/0002249139","naverLink":"https://n.news.naver.com/mnews/article/138/0002249139","pubDate":"2026-11-19T11:05:57.277553+09:00","author":"네이버뉴스","description":"엔키화이트햇, 내부 점검 스크립트·분석 보고서 배포 [사진=픽사베이] [디지털데일리 김보민기자] 프로그래밍 언어 자바(JAVA) 실행 환경에서 고위험 취약점이 발견된 가운데 국내 보안업계 경고가 이어지고 있다. 오펜시브 보안 전문기업 엔키화이트햇은 서버에서 취약 여부를 진단할 수 있는 '자바포셸(Java4Shell) 내부 점검 스크립트'를 배포했다고 19일 밝혔다. 이성권 엔키화이트햇 대표는 \"앞서 발생한 PHP 취약점(PHP2Shell)에 이어 이번 자바 사태까지 이제는 웹 애플리케이션 보안을 넘어 기반 실행 환경에 대한 취약점 관리까지 점검해야 하는 상황\"이라고 말했다. 자바포셸은 공통취약점평가시스템(CVSS) 기준 '치명적'(9.2점)에 해당하는 고위험 취약점이다. 자바 내부의 베이스(Base)64 디코딩 가속 기능에서 조작된 입력을 처리할 때 메모리 손상을 일으키며, 공격자가 별도 인증 없이 원격으로 악성코드를 실행해 서버 제어권을 탈취할 수 있다. 특히 자바가 공공·금융·대기업의 핵심 백엔드 시스템에 쓰이는 만큼, 자체 개발한 애플리케이션 코드가 안전하더라도 자바 실행 환경 자체에 결함이 있다면 공격 표적이 될 수 있다. 엔키화이트햇이 공개한 내부 점검 스크립트는 운영 서비스의 가용성 저하 없이 취약 여부를 진단하도록 설계됐다. 조작된 공격 입력을 보내는 기존 외부 스캐닝 방식은 취약한 프로세스를 중단시켜 서비스 장애를 유발할 수 있지만, 이번 도구는 공격용 입력을 보내지 않고 실행 파일의 아키텍처, 공급자·버전, AVX-512 지원 여부 등 내부 판단 근거만을 확인해 안전하게 위험도를 판별한다. 기업 보안 담당자는 전용 진단 웹페이지에서 스크립트를 내려받아 즉시 점검할 수 있다. 결과는 '취약 의심', '수정 버전 사용', '실행 조건 불충족'으로 제공된다. 함께 배포된 보고서에는 취약점의 근본 원인 분석을 비롯해 OpenJDK 17·21·25·27 계열 등 영향 받는 버전 정보, 즉시 적용 가능한 완화 조치 및 공식 패치 가이드 등 실무 대응 방안이 담겼다.","category":"IT 과학"},{"title":"\"번역기 돌릴 필요 없네\"…카톡, 외국어 오자마자 AI가 바로 번역","link":"https://n.news.naver.com/mnews/article/008/0005443355","naverLink":"https://n.news.naver.com/mnews/article/008/0005443355","pubDate":"2026-11-19T11:05:57.277542+09:00","author":"네이버뉴스","description":"카카오가 일상 속 대화 편의성을 높이기 위해 카카오톡 10차 정기 업데이트를 진행했다고 19일 밝혔다. 먼저 채팅방 게시판 '톡게시판'을 '톡보드'로 새롭게 개편했다. 마크다운을 지원해 제목, 체크박스 등을 활용한 문서를 작성하고 작성한 글은 프로젝트나 주제별 폴더로 분류해 관리할 수 있다. 공동 편집 기능도 추가해 편집 권한을 설정하면 여러 채팅방 멤버가 하나의 글을 실시간으로 수정할 수 있다. 채팅방 공지는 기존 1개에서 최대 10개까지 등록할 수 있도록 확대했다. 말풍선, 투표, 톡보드 글을 공지로 등록하면 모바일에서는 채팅방 상단에서 좌우로 넘겨 보고, PC에서는 목록을 펼치거나 접어 살펴볼 수 있다. 등록된 공지를 한 번에 모아보거나 해제한 공지도 지난 공지에서 다시 확인할 수 있어 대화에 늦게 참여한 이용자도 주요 안내 사항을 빠르게 파악할 수 있다. 외국어 메시지 원문 아래에 번역문을 표시하는 '자동 번역' 기능도 선보인다. 이용자가 자동 번역을 설정한 채팅방에서는 '카나나'가 외국어로 감지된 수신 메시지를 설정한 언어로 자동 번역해 실시간으로 대화를 이어갈 수 있다. 카카오톡 설정 내 '카나나 연구소'에서 기능을 활성화한 후 이용하려는 채팅방의 '채팅방 설정 > 자동 번역'을 켜면 된다. 이와 함께 톡디지털카드 인증 기반의 오픈채팅방을 도입한다. 채팅방 개설 시 톡디지털카드 인증을 참여 조건으로 설정하면 해당 조건에 맞는 톡학생증이나 톡사원증을 보유한 이용자만 참여할 수 있다. 학교의 경우 입학 연도나 학과 등 세부 조건도 설정할 수 있다. 기존 참여 코드를 입력하거나 방장의 개별 승인을 받아 입장해야 했던 번거로움을 줄여 대학교 동기나 직장 동료 간 커뮤니티를 보다 안전하고 편리하게 개설하고 운영할 수 있게 됐다. 향후 거주 지역을 인증하는 동네카드 등 다른 톡디지털카드로도 범위를 넓혀 다양한 인증 기반 커뮤니티를 활성화할 예정이다. 이 밖에도 한 번에 하나씩 등록할 수 있었던 리액션을 '여러 리액션 선택하기'를 통해 최대 6개까지 동시에 추가할 수 있도록 했다. 이번 업데이트에 포함된 신규 기능은 카카오톡 v26.10.0 이상 버전에서 이용할 수 있다. 카카오 관계자는 \"대화 중 필요한 정보를 함께 정리하고 중요한 내용을 쉽게 확인하는 등 일상 속 소통의 편의를 높이기 위해 여러 기능들을 추가했다\"며 \"앞으로도 다양한 대화 환경을 고려해 카카오톡 이용 경험을 지속 개선해 나갈 것\"이라고 말했다","category":"IT 과학"},{"title":"[AI는 지금] 앤트로픽, 스페이스X 넘었다…IPO 143조 조달 신기록","link":"https://n.news.naver.com/mnews/article/092/0002445971","naverLink":"https://n.news.naver.com/mnews/article/092/0002445971","pubDate":"2026-11-19T11:05:57.277520+09:00","author":"네이버뉴스","description":"공모가 83달러 확정·IPO 813억 달러 조달…사모투자 포함 총 1073억 달러 확보 앤트로픽이 스페이스X를 제치고 역대 최대 기업공개(IPO) 기록을 세웠다. 공모가를 희망 범위보다 높게 확정하고 사모투자를 포함해 총 1073억 달러(약 143조원)를 확보하면서 인공지능(AI) 모델 개발사로는 처음으로 미국 증시에 입성한다. 18일(현지시간) 블룸버그통신에 따르면 앤트로픽은 공모가를 주당 83달러로 확정했다. IPO 규모는 813억 달러로 스페이스X가 세운 종전 최대 기록인 750억 달러를 넘어섰다. 여기에 260억 달러 규모 사모투자를 합하면 전체 자금 조달 규모는 1073억 달러에 달한다. 앤트로픽은 이번 IPO에서 신주 9억 5640만주를 발행하고 공동창업자 7명은 보유 주식 2360만주를 매각한다. 당초 회사는 신주 8억 140만주를 발행하고 공모가를 70~78달러로 책정할 계획이었으나 투자 수요가 몰리면서 발행 규모와 가격을 모두 높였다. 확정 공모가를 적용한 완전희석 기준 기업가치는 약 1조 5000억 달러로 평가된다. 앤트로픽 AI 모델 '클로드' (이미지=미국 씨넷) 별도로 진행되는 사모투자에는 구글 모회사 알파벳과 AMD, 마이크로소프트(MS) 등이 참여한다. 엔비디아도 100억 달러 규모 앤트로픽 주식을 매입할 예정이다. 주요 AI 반도체·클라우드 기업이 투자에 참여하면서 앤트로픽은 모델 개발과 사업 확대에 필요한 자금을 확보하게 됐다. 공모주 청약 열기도 뜨거웠다. 블룸버그에 따르면 앤트로픽 IPO 청약 수요는 공급 물량의 약 7배에 달했다. 월가를 비롯해 런던과 도쿄 등 글로벌 투자자들이 참여했으며 일부 투자자는 희망 물량보다 적은 주식을 배정받을 것으로 알려졌다. 주관사들은 기존 투자자에게 주식이 우선 배정될 예정이라고 안내한 것으로 전해졌다. 이번 상장으로 앤트로픽은 시가총액 기준 세계 상장기업 상위 15위권에 진입할 전망이다. 기업가치는 테슬라와 비슷한 수준이며 미국 제약사 일라이릴리보다 높다. 다만 수개월 전 시장에서 거론됐던 2조 달러에는 못 미치지만 최근 기술주 매도세가 심화했을 당시 일부 월가 투자자가 제시한 1조 1000억 달러보다는 높은 수준이다. 다리오 아모데이 앤트로픽 최고경영자(CEO)가 20일 스위스 다보스에서 열린 세계경제포럼에서 발언하고 있다. 2026.1.20 (사진=로이터/뉴스1)","category":"IT 과학"},{"title":"메타 직원도 놀랐다…AI 비서 뮤즈, 개인 대화 읽고 무단 예약","link":"https://n.news.naver.com/mnews/article/092/0002445972","naverLink":"https://n.news.naver.com/mnews/article/092/0002445972","pubDate":"2026-11-19T11:05:57.277518+09:00","author":"네이버뉴스","description":"연결 안 한 메신저도 알림·화면으로 확인…메타 \"허용된 권한으로만 접근\" 메타 인공지능(AI) 비서 '뮤즈'가 이용자 대신 일을 처리하는 과정에서 사적인 대화를 읽고 허락 없이 예약을 진행했다는 보고가 나왔다. 뮤즈를 사용한 메타 직원조차 AI가 개인 대화를 어떻게 읽었는지 몰랐고 자신과 무관한 은행 잔액을 전달받아 개인정보 유출을 우려했다. 18일(현지시간) 로이터에 따르면 메타 직원들은 지난 9월 출시한 AI 비서 뮤즈가 개인 메시지를 읽거나 허락 없이 숙소를 예약했다고 사내 게시판에 알렸다. 로이터가 시그널·AI나우연구소 관계자들과 함께 시험한 결과 뮤즈는 휴대전화 알림이나 컴퓨터 화면에 뜬 메시지를 읽을 수 있었다. 뮤즈는 이메일 답장이나 온라인 구매를 대신하려면 이용자 기기와 앱에 접근해야 한다. 문제를 보고한 직원들은 이때 허용한 권한으로 AI가 개인 메신저 대화도 읽을 줄은 예상하지 못했다. 메타 AI 비서 '뮤즈'에서 개인 메시지 접근과 승인 없는 예약 사례가 보고됐다. 사진은 뮤즈가 일정 관리와 상품 구매를 처리하는 예시 화면. (사진=메타 블로그 캡처) 한 직원은 뮤즈로부터 시그널에 도착한 가족 메시지에 답장하라는 안내를 받았다. 시그널은 보낸 사람과 받는 사람만 대화를 읽도록 암호화하는 메신저다. 이 직원은 다른 앱 접근을 허용하거나 관련 질문을 받은 기억이 없다며 사생활 침해를 우려했다. 시험에서 뮤즈는 안드로이드 알림에 표시된 메시지를 읽었다. 맥에서는 장애인 등이 컴퓨터를 사용하도록 지원하는 접근성 기능과 화면 캡처 도구를 활용했다. 아이폰에서는 같은 요청이 차단됐다. 암호화한 메시지라도 이용자 기기에 도착해 화면에 표시되면 AI가 읽을 수 있었다. 뮤즈는 메신저를 따로 연결하는 절차 없이 초기 설정 때 받은 권한을 활용했다. 메타와 구글은 이런 접근에 이용자 허가가 필요하다고 강조했다. 뮤즈가 어디서 가져왔는지 알 수 없는 정보를 전달한 사례도 나왔다. 한 직원은 낚시 날씨와 물때를 안내받다가 갑자기 자신과 무관한 은행 두 곳 잔액을 전달받았다. 직원들은 다른 계정 정보가 섞였을 가능성을 제기했지만 로이터는 실제 유출 여부를 확인하지 못했다. 메타는 상당수가 AI가 사실과 다른 내용을 만들어내는 할루시네이션(환각)이며 이미 조치했다고 설명했다. 개발팀 관계자는 뮤즈가 이용자에게 먼저 말을 걸도록 하는 지시 때문에 이런 오류가 생긴 것으로 보인다며 AI 모델과 작업 실행 소프트웨어를 수","category":"IT 과학"},{"title":"\"강호동도, 송혜교도 가짜였다\"...AI 광고에 속지 않으려면","link":"https://n.news.naver.com/mnews/article/092/0002445977","naverLink":"https://n.news.naver.com/mnews/article/092/0002445977","pubDate":"2026-11-19T11:05:57.277515+09:00","author":"네이버뉴스","description":"[안전한 AI의 길을 묻다④] '유명인 무조건 신뢰' 금물…가족이 돈 요구 땐 아는 번호로 확인 생성형 인공지능(AI)이 일상 깊숙이 파고들면서 디지털 세상의 신뢰가 새로운 시험대에 올랐다. AI가 만든 가짜 이미지와 영상이 진짜처럼 유통되고, 허위정보와 사칭 범죄가 확산하면서 온라인에서 무엇을 믿어야 할지 판단하기 어려워지고 있다. 기술의 발전 속도에 비해 이용자 보호와 사회적 대응 체계는 여전히 부족하다는 지적도 나온다. 지디넷코리아는 ‘안전한 AI의 길을 묻다’ 기획을 통해 AI가 가져온 디지털 환경 변화와 그 이면의 문제를 짚어본다. 피해 실태와 제도적 한계, 플랫폼의 책임, 시민의 디지털 리터러시 등을 살펴보고 건강하고 신뢰할 수 있는 디지털 생태계를 만들기 위한 해법을 모색한다. [편집자주] 지난 2023년 A씨는 유튜브에서 한 투자 모임을 알게 됐다. 모임에선 배우 조인성과 송혜교가 출연한 광고 영상까지 보여줬다. 두 배우는 광고 영상에서 투자 모임을 응원하는 듯한 발언을 했다. 평소 조인성을 좋아하고 송혜교가 출연한 드라마도 즐겨 봤던 A씨는 광고 영상을 통해 두 배우가 투자 모임을 적극 지지하는 것으로 믿었다. 결국 A씨는 다섯 차례에 걸쳐 총 6300만원을 송금했다. 하지만 A씨를 현혹했던 광고 영상은 가짜로 판명됐다. 해당 영상 분석 업체에 따르면 A씨가 봤던 광고는 인공지능(AI) 기술을 활용해 두 배우의 얼굴과 입 모양, 음성을 조작한 것이었다. 조작된 영상을 진짜로 믿었던 A씨는 별다른 의심 없이 많은 돈을 송금했다. AI로 배우 송혜교가 직접 출연한 것처럼 조작해 사람들을 유인했던 주식투자 권유 광고의 한 장면. (사진=광고 영상 캡처) 지난 1월에도 유사한 피해가 발생했다. 한 이용자가 틱톡 라이트에서 유명인을 사칭한 합성 광고를 보고 투자 대화방에 참여했다. 이후 대화방에서 추천받은 가짜 증권사 앱을 설치했다가 7억원이 넘는 돈을 잃었다. 당시 경찰에는 틱톡 광고를 통해 투자 대화방에 들어갔다가 사기 피해를 봤다는 신고가 여러 건 접수됐다. 얼마 전엔 페이스북에 방송인 강호동을 사칭한 주식 투자 광고가 올라와 논란이 됐다. 광고 글에서 강호동은 \"존리 전 메리츠자산운용 대표에게 투자 방법을 배워 큰 수익을 올렸다\"고 주장했다. 아랫부분에는 강호동이 출연한 실제 방송 장면까지 첨부됐다. 광고는 '80%의 승률'을 보장한다며 투자 정보를 공유하는 대화방에 참여하도록 유도했다. 특히 이","category":"IT 과학"},{"title":"삼성전자, 에이전틱 AI 시대 메모리 해법으로 소캠2 제시","link":"https://n.news.naver.com/mnews/article/001/0016451360","naverLink":"https://n.news.naver.com/mnews/article/001/0016451360","pubDate":"2026-11-19T11:05:57.277511+09:00","author":"네이버뉴스","description":"고성능·저전력에 탈부착 구조 적용…CES 2027 혁신상 수상 삼성전자 LPDDR5X 기반 소캠2(SOCAMM2) [삼성전자 제공. 재판매 및 DB 금지] (서울=연합뉴스) 강태우 기자 = 삼성전자가 인공지능(AI)이 스스로 추론하고 작업을 수행하는 '에이전틱 AI' 시대의 서버용 메모리 해법으로 차세대 제품인 'SOCAMM2'(소캠2)를 제시했다. 삼성전자는 19일 반도체 테크블로그를 통해 에이전틱 AI 확산에 따라 시스템 메모리의 용량과 대역폭뿐 아니라 전력·공간 효율의 중요성이 커지고 있다며, LPDDR(저전력 D램) 기반 서버용 메모리 모듈 SOCAMM2가 이러한 요구에 대응할 수 있는 메모리 설루션이라고 소개했다. 삼성전자의 SOCAMM2는 LPDDR의 고성능·저전력 특성을 유지하면서 탈부착이 가능한 모듈 구조를 적용한 서버용 메모리다. 에이전틱 AI는 기존 생성형 AI와 달리 목표를 달성하기 위해 스스로 추론하고 계획을 세우며 여러 작업을 연속적으로 수행하는 기술이다. 이 과정에서 이전 대화와 작업 결과, 중간 데이터 등이 지속적으로 축적되며 여러 AI 에이전트가 역할을 나눠 작업하는 환경에서는 저장하고 공유해야 할 정보가 더욱 늘어난다. 이에 따라 AI 서버에서는 대용량 데이터를 빠르게 처리하면서도 전력 소비와 공간 활용을 최적화할 수 있는 시스템 메모리가 중요해지고 있다. 삼성전자에 따르면 기존의 납땜형 LPDDR은 메인보드에 직접 장착돼 서버 구축 이후 메모리 용량을 변경하거나 업그레이드하기 어렵다는 한계가 있었다. 이와 달리 SOCAMM2는 메인보드를 교체하지 않고도 메모리 모듈을 교체하거나 업그레이드할 수 있도록 해 이러한 한계를 해결했다. 또 수평형 구조를 적용해 서버 내부 공간을 효율적으로 활용할 수 있으며 히트싱크(방열판) 배치와 공기 흐름을 고려한 설계에도 유리하다. 이 같은 기술적 특징을 인정받아 삼성전자의 LPDDR5X 기반 SOCAMM2는 최근 CES 2027 혁신상을 수상했다. 삼성전자는 향후 LPDDR6 기반 SOCAMM2로 대역폭과 용량, 전력 효율을 한층 높여 차세대 AI 인프라의 다양한 메모리 수요에 대응한다는 구상이다. burning@yna.co.kr","category":"IT 과학"}]},"popular":[{"title":"당국 “리트 만점자, 신변우려 신고 접수…주거지에 없어”","link":"https://n.news.naver.com/article/011/0004683852?ntype=RANKING","pubDate":"2026-11-19T11:06:00.819848+09:00","author bDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"서울 강남에 있는 학원장이 채팅앱에서 만난 초등생을 숙박업소로 유인해 성폭행한 혐의로 경찰에 긴급체포됐다. [AI로 생성한 이미지] 서울 강남의 한 학원 학원장이 채팅 앱에서 만난 초등학생을 숙박업소로 불러내 술을 먹이고 성폭행한 혐의로 경찰에 긴급 체포됐다. 이 학원장은 자신의 혐의를 부인하고 있다. 18일 경찰에 따르면 서울 서초경찰서는 1주일 전 대화 앱으로 알게 된 초등생을 서초구의 한 공유숙박업체 숙소로 불러내 술을 먹이고, 성폭행한 혐의를 받는 30대 남성 A씨에 대해 이날 구속영장을 신청했다. 경찰은 피해 학생이 가출한 뒤, 연락이 되지 않는다는 부모의 실종 신고를 받고 위치를 추적해 숙소를 찾아갔다. A씨가 숙소 문을 열지 않자 강제로 문을 연 경찰이 현장에서 A씨를 붙잡은 뒤, 인근 파출소로 데려가 조사했다. 조사 결과 A씨가 직접 택시를 불러 피해 학생을 숙소로 오게 한 뒤 성범죄를 저지른 정황을 파악해 긴급 체포했다.","category":"사건 사고"},{"title":"신생아 자녀에게 신체적 학대 가한 혐의 현직 경찰관 부부 경찰 수사","link":"https://n.news.naver.com/mnews/article/087/0001231816","naverLink":"https://n.news.naver.com/mnews/article/087/0001231816","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"},{"title":"\"동물학대 제보했는데 일자리 잃을 판\"…군산유기동물센터 직원들, 고용승계 촉구","link":"https://n.news.naver.com/mnews/article/002/0002466557","naverLink":"https://n.news.naver.com/mnews/article/002/0002466557","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"},{"title":"초등생에 술 먹이고 성폭행 혐의…강남 학원 원장 긴급체포","link":"https://n.news.naver.com/mnews/article/053/0000063152","naverLink":"https://n.news.naver.com/mnews/article/053/0000063152","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"채팅앱서 접근해 숙박업소로 유인…실종 신고에 경찰 출동해 현장서 검거 서울 서초경찰서. photo 뉴시스 서울 강남의 한 학원 원장이 채팅 앱에서 알게 된 초등학생을 숙박업소로 유인해 술을 마시게 한 뒤 성폭행한 혐의로 경찰에 붙잡혔다. 18일 경찰에 따르면 서울 서초경찰서는 30대 남성 A씨를 간음목적유인, 미성년자 의제강간, 아동복지법상 성학대, 실종아동법 위반 혐의로 입건하고 구속영장을 신청했다. A씨는 지난 17일 서울 서초구의 한 숙박업소로 초등학생을 불러내 술을 마시게 하고 성폭행한 혐의를 받는다. 경찰 조사 결과 A씨는 범행 약 일주일 전 채팅 앱을 통해 피해 학생을 알게 된 뒤 지속적으로 연락을 주고받은 것으로 파악됐다. 범행 당일에는 직접 택시를 호출해 피해 학생을 숙박업소로 데려간 것으로 조사됐다. 사건은 피해 학생의 가족이 실종 신고를 하면서 드러났다. 신고를 접수한 경찰은 위치 추적을 통해 해당 숙박업소를 찾아갔으나 문이 열리지 않자 강제로 개방했다. 경찰은 객실 안에서 A씨와 피해 학생을 발견하고 A씨를 현장에서 긴급체포했다. A씨는 경찰 조사에서 가출한 피해 학생에게 잠자리를 제공했을 뿐이라는 취지로 혐의를 부인한 것으로 전해졌다. 경찰은 A씨를 상대로 정확한 범행 경위를 조사하고 있다. ※주간조선 온라인 기사입니다.","category":"사건 사고"},{"title":"초등생 유인해 술 먹이고 성폭행한 30대 강남 학원장…긴급체포","link":"https://n.news.naver.com/mnews/article/082/0001407914","naverLink":"https://n.news.naver.com/mnews/article/082/0001407914","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"일러스트 이지민 에디터 mingmini@busan.com 서울 강남구에서 학원을 운영하는 30대 남성이 채팅 앱으로 알게 된 초등학생을 유인해 술을 먹이고 성폭행한 혐의로 경찰에 붙잡혔다. 18일 SBS에 따르면 서울 서초경찰서는 간음목적유인, 미성년자 의제강간, 아동복지법 위반(성학대), 실종아동법 위반 등의 혐의를 받는 A 씨에 대해 구속영장을 신청했다고 밝혔다. 경찰에 따르면 A 씨는 일주일 전 채팅 앱을 통해 알게 된 초등학생을 17일 서울 서초구에 있는 한 숙박업소로 불러내 술을 마시게 하고 성폭행한 혐의를 받는다. 수사는 피해 학생의 부모가 자녀가 가출한 뒤 연락이 닿지 않는다며 실종 신고를 하면서 시작됐다. 신고를 접수한 경찰은 피해 학생의 위치를 추적해 숙박업소를 찾아갔으며, A 씨가 문을 열어주지 않자 강제로 문을 개방하고 현장에서 A 씨를 체포했다. 경찰 조사 결과 A 씨는 직접 택시를 호출해 피해 학생을 숙박업소로 이동시킨 것으로 파악됐다. A 씨는 현재 관련 혐의를 부인하고 있는 것으로 알려졌다. 경찰은 사건의 구체적인 경위와 추가 범죄 여부 등을 조사하는 한편, A 씨에 대한 구속영장을 신청했다.","category":"사건 사고"},{"title":"‘리트 만점자’ 부정행위 의혹, 서울청 광역수사단이 수사","link":"https://n.news.naver.com/mnews/article/366/0001205881","naverLink":"https://n.news.naver.com/mnews/article/366/0001205881","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"19일 법학적성시험(LEET·리트) 만점자 이진우 씨의 공개 검증 장소인 서울 강남구 한 스튜디오에 경찰이 현장조사를 위해 들어서고 있다. /연합뉴스 법학적성시험(LEET·리트) 만점자 이진우(32)씨의 시험 부정행위 의혹과 관련된 고발 사건을 서울경찰청 광역수사단 금융범죄수사팀이 수사한다. 지난 18일 서울청은 이씨를 상대로 접수된 고발 사건 2건을 광역수사단 금융범죄수사팀에 배당했다고 밝혔다. 같은 날 법무법인 민의 방민우 변호사는 ‘새로운 미래를 위한 청년변호사 모임’ 소속 변호사들을 대리해 이씨를 공무집행방해, 업무방해, 공문서 변조, 위조공문서행사죄 등 혐의로 서울 관악경찰서에 고발했다. 법률사무소 이유의 박은선 변호사도 이씨가 올해 만점 받은 LEET뿐 아니라 지난해 치른 2026학년도 수능 이력도 함께 수사해야 한다며 업무방해 등의 혐의로 서울청에 고발장을 냈다. 박 변호사는 이씨가 실제로 부정행위를 했다면 그의 학습법을 담은 저서 등도 사기 행위에 해당할 수 있다고 주장했다. 이씨는 19일 서울 강남구 소재 한 학원에서 실시간으로 2027학년도 대학수학능력시험 국어 문제를 풀겠다고 예고한 바 있다. 하지만 이씨는 이날 오전 8시 35분까지 검증장에 나타나지 않았다.","category":"사건 사고"},{"title":"아파트 헌옷수거함서 탯줄 달린 신생아 시신 발견…경찰 수사","link":"https://n.news.naver.com/mnews/article/053/0000063149","naverLink":"https://n.news.naver.com/mnews/article/053/0000063149","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"경기 하남경찰서 전경. photo 경기남부경찰청 경기 하남시의 한 아파트 헌옷수거함에서 탯줄이 달린 신생아 시신이 발견돼 경찰이 수사에 나섰다. 18일 하남경찰서에 따르면 이날 오후 3시 16분쯤 하남시 미사지구의 한 아파트 헌옷수거함 안에서 아기 시신이 발견됐다는 신고가 접수됐다. 발견된 아기는 남자 신생아로 추정되며, 탯줄이 붙어 있는 상태였던 것으로 파악됐다. 시신에서 육안으로 확인되는 뚜렷한 외상은 발견되지 않은 것으로 전해졌다. 신고를 받고 출동한 경찰은 시신을 수습하고 주변 폐쇄회로(CC)TV 영상을 확보해 분석하고 있다. 아기의 신원과 시신이 헌옷수거함에 놓이게 된 경위를 조사하는 한편, 범죄 가능성도 열어두고 있다. 경찰 관계자는 \"현장 주변 CCTV 영상을 확보해 분석하는 등 용의자를 추적하고 있다\"며 \"국립과학수사연구원에 부검을 의뢰해 정확한 사망 원인을 확인할 방침\"이라고 밝혔다. ※주간조선 온라인 기사입니다.","category":"사건 사고"},{"title":"리트 만점자 이진우씨 행방 묘연… 경찰, 소재 파악 중","link":"https://n.news.naver.com/mnews/article/023/0004010521","naverLink":"https://n.news.naver.com/mnews/article/023/0004010521","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"법학적성시험(LEET·리트) 만점자 이진우씨. /소셜미디어(SNS) 캡처 인공지능(AI)을 이용한 부정행위로 올해 법학적성시험(리트·LEET) 만점을 받았다는 의혹이 제기된 이진우(32)씨가 19일 잠적해 경찰이 수색에 나섰다. 경찰 등에 따르면 이씨는 서울 광진구에서 마지막으로 소재가 확인된 후 19일 오전 11시 현재까지 위치가 확인되지 않고 있다. 경찰 관계자는 “지인으로부터 실종 신고가 접수됐고, 현재 마지막으로 소재가 파악된 지역 일대를 수색 중”이라고 했다. 이씨는 최근 부정행위 의혹에 대해 이날 오전 서울 대치동의 한 학원에서 수능 국어 문제를 실시간으로 푸는 모습을 유튜브로 송출해 자신의 능력을 검증받겠다고 했었다. 그러나 이날 약속 시간인 오전 8시까지 검증장에 나타나지 않았고 휴대폰도 꺼져 있는 상태다. 주관사인 학원 측은 현장 검증을 취소했다. 서울 관악구 봉천동 이씨 자택에는 경찰이 출동한 상태다. 이씨 자택이 있는 건물 주인은 이씨가 지난 17일 저녁 집을 나가 이날까지 들어오지 않았다고 전했다. 그는 “(이씨가) 그저께 나가서 들어오지 않은 걸 CCTV로 확인했다”며 “세입자들도 불편하고 집에 있어 봤자 해결되는 것이 없으니 다른 곳에 가 있으라고 설득했었다”고 했다.","category":"사건 사고"},{"title":"\"환자가 자신 상태 설명 어려운 응급상황서 필요한 의료정보 전달\"","link":"https://n.news.naver.com/mnews/article/092/0002445933","naverLink":"https://n.news.naver.com/mnews/article/092/0002445933","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[라온시큐어 주관 2026 블록체인&AI해커톤 우수상 인터뷰/NIPA 원장상/블록체적화팀] 보안·인증 플랫폼 기업 라온시큐어(대표 이순형, 이정아)가 주관한 ‘2026 블록체인&AI 해커톤’이 지난 9월말 성황리에 막을 내렸다. 이 행사는 올해 두번째 열렸다. 글로벌디지털혁신네트워크(GDIN)가 공동 주관하고, 한국디지털인증협회가 주최, 행정안전부가 후원했다. 모바일 신분증을 기반으로 AI와 웹3(Web3) 기술을 결합한 창의적이고 실용적인 서비스 아이디어를 발굴해 국내 디지털 신원 생태계와 관련 산업 확장을 촉진하기 위해 마련했다. 올해 대회에는 총 318개팀이 참가했다. 지난해(211개팀)보다 약 51% 증가했다. 결선 진출권 10장을 놓고 약 32대 1의 경쟁률을 보였다. 서류심사와 대면평가를 거쳐 최종 선발된 10개팀이 결선에 진출, 경연을 펼쳤다. 그 결과, 블록체적화팀이 우수상(NIPA 원장상)을 받았다. 아래는 블록체적화팀과 인터뷰 일문일답. -블록체적화는 어떤 팀인가? 팀 구성원 등에 대해 말해달라 \"고려대학교 컴퓨터학과와 인공지능학과 학생 네 명으로 구성한 팀이다. 환자가 자신의 상태를 설명하기 어려운 응급상황에서도 필요한 의료정보를 전달할 수 있도록 돕는 서비스 ‘MediVC’를 개발했다. 팀장 김두호는 컴퓨터학과(25학번) 재학중이다. 전체적인 프로젝트 조율과 백엔드 개발을 담당했다. 2025년 2학기부터 고려대학교 개발동아리 GDGoC KU(Google Developers on Campus Korea University) 운영진으로 활동하며 교내외의 다양한 개발자들과의 커뮤니티 활동을 지원하고, 해커톤이나 중장기 프로젝트 행사를 기획했다. 팀원으로 참여한 신채민은 컴퓨터학과(24학번) 재학 중이다. 입상한 서비스 ‘MediVC’의 기획과 프론트엔드 개발을 담당했다. 현재 소속 단과대 학생회 홈페이지 개발, 공시구행사 플랫폼, 러닝 SNS 플랫폼의 프론트엔드 개발에 참여하며 다양한 서비스 개발 경험을 쌓았다. 팀원 여승민(25학번)은 인공지능 기술을 실제 문제 해결에 적용하는 것을 지향하는 실행형 개발자다. 인공지능학과 학생회장이기도 하다. 대학생을 위한 AI 기반 통합 학습관리 플랫폼 ‘Syllo’의 기획 및 개발을 주도하고 있다. 팀원 윤태희(25학번)는 AI가 사람 곁에서 실질적인 도움을 주는 서비스를 지향하는 개발자다. 인공지능학과에 재학 중이다. 할머니의 응급 상황 경험을 계기로 M","category":"사건 사고"},{"title":"“조류충돌 위험 등 검토했어야”…2심도 ‘새만금 공항 계획’ 취소 판결","link":"https://n.news.naver.com/mnews/article/032/0003483621","naverLink":"https://n.news.naver.com/mnews/article/032/0003483621","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"법원 “지역 발전도 안전을 전제” 정부가 수립한 ‘새만금 국제공항 기본계획’이 취소돼야 한다는 법원 판단이 2심에서도 유지됐다. 법원은 정부가 기본계획을 세우는 과정에서 항공운항 안전 문제와 환경 파괴 위험을 제대로 평가하지 않았다고 봤다. | 관련기사 6면 서울고법 행정4-2부(재판장 이광만)는 18일 새만금신공항백지화공동행동 소속 시민 3명이 국토교통부를 상대로 “새만금 국제공항 개발사업 기본계획을 취소해달라”며 낸 소송에서 1심과 같이 원고 승소로 판결했다. 재판부는 “국토부는 생명·신체의 안전과 환경 보전에 관한 공익을 그 중요성에 상응하는 정도로 검토하지 않은 상태에서 개발 편익에 우월한 비중을 부여했다”며 “위법한 계획이므로 취소돼야 한다”고 했다. 새만금 국제공항 개발사업은 2028년 준공을 목표로 전북특별자치도 새만금 지역 부지 340만㎡에 활주로와 계류장, 여객터미널 등을 짓는 사업이다. 공항이 들어설 부지인 수라갯벌은 저어새·도요새 등 멸종위기종 59종을 비롯한 철새 24만여마리가 서식하는 곳이라 환경단체 등의 반발이 컸다. 공동행동은 2022년 9월 개발계획을 취소해달라는 소송을 냈다. 재판부는 국토부가 공항을 세울 부지를 고를 때부터 조류충돌 위험을 전혀 고려하지 않았다고 봤다. 재판부는 “부지를 먼저 선정한 뒤 위험을 관리할 방안을 사후적으로 검토할 게 아니라, 입지의 선정 단계에서부터 조류충돌 위험을 회피하거나 충분히 저감할 수 있는지를 검토했어야 한다”며 “국토부가 이후에 제시한 저감 방안 역시 철새 이동경로에 위치하고 주변에 많은 철새의 월동지, 중간기착지 등이 분포한 이 사건 사업부지의 특수성을 충분히 고려했다고 보기 어렵다”고 했다. 국토부는 ‘지역균형발전을 위해 공항 건설이 필요하다’는 취지로도 주장했지만 받아들여지지 않았다. 재판부는 “전북권역의 경제활력을 제고할 필요성이 크고, 개발계획은 전북도민과 기업인들의 오랜 염원”이라면서도 “이런 공익은 공항을 안전하게 운영할 수 있음을 전제로 한다”고 짚었다. 국토부는 “법원의 판결을 존중하며, 판결문을 면밀히 살펴보고 향후 대응 방향을 결정할 예정”이라고 밝혔다.","category":"사건 사고"}],"사회":[{"title":"남양주시의회, 주민자치 성과 한자리에…16개 읍·면·동 활동 공유","link":"https://n.news.naver.com/mnews/article/382/0001305533","naverLink":"https://n.news.naver.com/mnews/article/382/0001305533","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"주민자치위원 등 600여 명 참석…우수사례 발표·시상 및 화합의 장 마련 김진희 의장이 18일 남양주체육문화센터에서 ‘2026년 주민자치 성과공유회’ 에서 인사말을 하고 있다. 남양주시의회(의장 김진희)는 18일 남양주체육문화센터에서 열린 ‘2026년 주민자치 성과공유회’에 참석해 16개 읍면동 주민자치위원들을 격려했다. 행사에는 김진희 의장과 시의원, 최현덕 시장, 주민자치위원 등 600여 명이 참석해 문화경연과 우수사례 발표, 작품 전시 등을 진행했다. 김 의장은 축사에서 주민자치위원들의 노고에 감사를 전하고, 내년 주민자치회 전환을 앞두고 제도 개선과 발전 방향을 함께 고민하겠다고 밝혔다. 남양주ㅣ고성철 스포츠동아 기자 localkb@donga.com","category":"사회"},{"title":"경남교육청, 2027년도 6조9790억원 예산 편성…전년比 3732억원↑","link":"https://n.news.naver.com/mnews/article/003/0014331361","naverLink":"https://n.news.naver.com/mnews/article/003/0014331361","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"경남교육청, 2027년도 6조9790억원 예산 편성…전년比 3732억원↑. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"},{"title":"경북전문대, 지역 중장년층 경력전환·재취업 지원 프로그램 운영","link":"https://n.news.naver.com/mnews/article/016/0002725391","naverLink":"https://n.news.naver.com/mnews/article/016/0002725391","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[경북전문대 제공] [헤럴드경제(영주)=김병진 기자]경북전문대 WE ANCHOR사업단은 지난 17~18일 이틀간 지역 중장년층 11명을 대상으로 ‘경력전환 훈련 프로그램’을 운영했다. 이번 프로그램은 ANCHOR 로컬이슈해결(추가공모) 지역현안 자율주제 사업의 일환으로, 중장년층의 기존 경력과 직무 경험을 활용해 새로운 진로를 설계하고 재취업 역량을 강화하기 위해 마련됐다. 교육은 생성형 AI를 활용한 경력 분석과 직무 탐색, 채용공고 분석, 자기소개서 작성 및 모의면접 실습 등 실무 중심으로 진행됐다. 개인별 취업역량 진단과 취업활동계획(IAP) 수립도 함께 이뤄졌다. 이중섭 WE ANCHOR사업단장은 “중장년층이 자신의 경력과 강점을 재발견하고 AI 기술을 활용해 새로운 취업 기회를 찾는 계기가 되길 바란다”며 “앞으로도 경제활동 참여와 안정적인 지역 정착을 지원하는 맞춤형 교육을 확대하겠다”고 말했다.","category":"사회"},{"title":"[속보] 김정은, 북미회담 주목 속 해군대학 등 함경남도 지역 시찰","link":"https://n.news.naver.com/mnews/article/009/0005765900","naverLink":"https://n.news.naver.com/mnews/article/009/0005765900","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"김정은 북한 국무위원장이 지난 15~16일 삼지연시 관광지구 건설현장을 방문해 삼지연비행장 개건 및 확장 공사장과 북포태산지구의 스키관광 휴양지 건설사업장 등을 둘러봤다. [연합뉴스] 김정은 국무위원장이 현장 시찰에 나섰다. 중국 선전에서 개최되는 아시아태평양경제협력체(APEC) 정상회의를 계기로 북미정상이 마주할 가능성에 관심이 쏠렸지만, 김 위원장은 북한과 중국의 접경지에서 떨어진 함경남도에서 군사·경제분야 현장점검 일정을 이어갔다. 19일 조선중앙통신에 따르면 지난 18일 김 위원장은 김정숙해군대학을 방문해 현지지도했다. 박정천 노동당 중앙군사위 부위원장이 동행했다. 김 위원장은 해군대학 혁명사적관, 군사종합연구실, 종합훈련실 등을 돌아보고 작전연구실과 모의훈련실에서 진행되는 훈련모습을 지켜봤다. 김 위원장은 “최고의 전문성을 보유한 해군 지휘관들을 키워내는 것을 본업으로 하는 해군대학의 전략적 의의는 비상히 증대되고 있다”라며 “해상 주권 수호의 중요성이 부각되고 있고 가장 간악한 적들과 항시적으로 대치하는 현실은 현대전에 능란하게 대응할 수 있는 유능한 해군전투체계 전문가들과 지휘관들을 더 많이 양성할 것을 절박하게 요구하고 있다”고 말했다. 그러면서 “변화된 환경과 날로 증강되는 도전은 강력한 해군건설을 제1의 전략적 임무로 내세울 것을 요구하고 있다”라며 “(해군대학을) 군사교육중심으로 만들어 모든 학생들을 야전형, 실력가형, 행동형의 지휘성원들로 키우는 것이 관건적인 문제”라고 강조했다.","category":"사회"},{"title":"2027학년도 수능 “사교육 훈련 유리 문항 배제…EBS 연계율 50%”","link":"https://n.news.naver.com/mnews/article/056/0012296998","naverLink":"https://n.news.naver.com/mnews/article/056/0012296998","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"오늘(19일) 치러진 2027학년도 대학수학능력시험의 출제 위원단이 고등학교 교육과정 내에서 변별력을 확보할 수 있도록 적정 난이도의 문항을 고르게 출제했다고 밝혔습니다. 오기영 2027학년도 대학수학능력시험 출제 위원장인 한경국립대 교수는 오늘(19일) 정부세종청사에서 연 출제 방향 브리핑에서 전 영역과 과목에 걸쳐 2015 개정 교육과정의 핵심적이고 기본적인 내용을 중심으로 출제해 학교 교육 정상화에 기여하고자 했다며 이같이 밝혔습니다. 특히 사교육에서 문제 풀이 기술을 익히고 반복 훈련한 학생들에게 유리한 문항은 철저히 배제했다고 강조했습니다. 오 위원장은 관련 질의에 “독립적으로 구성된 수능출제점검위원회에서 (문제를) 독립적으로 검증해서 확인한다”며 “사교육 연관성 문제, 이른바 ‘킬러문항’ 이런 것들을 철저히 배제해서 공정하게 출제했다”고 답했습니다. EBS 수능 교재 및 강의와의 연계율은 문항 수 기준 50% 수준이며, 영어 영역의 연계 문항은 모두 유사한 주제의 다른 지문을 활용하는 간접 연계 방식으로 출제됐습니다. 또 이미 출제됐던 핵심 개념이라도 문항의 형태와 발상, 접근 방식 등을 변화시켜 대학 교육에 필요한 사고력과 탐구 능력을 측정할 수 있도록 설계했습니다. 국어와 영어 영역은 출제 범위 안에서 다양한 소재의 지문과 자료를 활용했으며, 수학과 탐구 영역은 개별 교과 특성에 바탕을 둔 사고력 중심 평가를 지향했다고 설명했습니다. 필수 과목인 한국사 영역은 우리 역사에 대한 기본 소양을 평가하기 위해 핵심 내용을 중심으로 평이하게 출제됐습니다. 특히, 선택과목이 있는 영역에서는 과목별 난이도의 균형을 맞춰 과목 선택에 따른 유불리 가능성을 최소화했다고 덧붙였습니다. 또 “이번 수능이 선택과목 마지막이라서 난이도 조절을 하거나 하진 않았다”며 “정답률 구간을 촘촘하게 분포시키려고 노력했다”고 설명했습니다. 김문희 한국교육과정평가원장은 “범정부적으로 부정행위 방지를 위한 노력을 여러 조치들을 했다”며 “혹시 그런 일이, 수능 사후에도 벌어진 정황이 조금이라도 있다면 철저하게 저희는 대처할 계획”이라고 강조했습니다. [사진 출처 : 연합뉴스] ■ 제보하기 ▷ 전화 : 02-781-1234, 4444 ▷ 이메일 : kbs1234@kbs.co.kr ▷ 카카오톡 : 'KBS제보' 검색, 채널 추가 ▷ 유튜브, 다음에서도 KBS뉴스를 구독해주세요!","category":"사회"},{"title":"호산대, 경북도청 신도시 마라톤서 지역사회 의료봉사 펼쳐","link":"https://n.news.naver.com/mnews/article/016/0002725389","naverLink":"https://n.news.naver.com/mnews/article/016/0002725389","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[호산대 제공] [헤럴드경제(경산)=김병진 기자]호산대는 지난 8일 경북도청 천년숲 일원에서 열린 ‘2026 경북도청 신도시 마라톤 대회’에서 물리치료과 재학생들이 참여한 지역사회 의료봉사활동을 펼쳤다. 이번 활동은 대학의 지역성장 인재양성체계(앵커) 사업의 일환으로 학생들이 전공 지식을 현장에 적용하고 실무 역량을 키우기 위해 마련됐다. 이날 학생들은 마라톤 참가자들을 대상으로 경기 전 기초 건강 상태 확인과 스포츠 테이핑을 지원하고 경기 후에는 근육 이완 관리와 건강 상담을 진행해 호응을 얻었다. 특히 임성민 더 피지오랩 대표가 현장에 참여해 학생들에게 실무 지도와 기술 자문을 제공하며 산학협력의 의미를 더했다. 김재현 호산대 총장은 “학생들이 전공 지식을 지역사회 현장에서 직접 활용하며 실무 역량을 키우는 뜻깊은 기회가 됐길 바란다”고 말했다. 호산대 앵커사업단은 앞으로도 지역 기관과의 협력을 통해 전공 기반 봉사활동을 확대하고, 지역사회와 함께 성장하는 현장 실무형 인재 양성에 힘쓸 계획이다.","category":"사회"},{"title":"램리서치, 레고 에듀케이션과 STEM 교육 협력…4년간 1500만달러 지원","link":"https://n.news.naver.com/mnews/article/138/0002249127","naverLink":"https://n.news.naver.com/mnews/article/138/0002249127","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"램리서치 최고커뮤니케이션책임자(CCO) 겸 사회공헌 부문 총괄 스티브 파인(왼쪽)과 레고 에듀케이션 사장 빅터 사이즈(오른쪽)가 덴마크 빌룬 레고 그룹 본사에서 체험형 STEM 교육 기회 확대를 위한 파트너십을 체결하는 모습 [사진=램리서치] [디지털데일리 고성현기자] 램리서치가 레고 에듀케이션과 손잡고 아동·청소년 대상 과학·기술·공학·수학(STEM) 교육 지원을 확대한다. 향후 4년간 1500만달러(약 201억원)를 투입해 컴퓨터 과학과 인공지능(AI) 교육 기회를 넓힐 계획이다. 램리서치는 18일(현지시간) 덴마크 빌룬드 레고그룹 본사에서 레고 에듀케이션과 STEM 교육 확대를 위한 파트너십을 체결했다고 밝혔다. 이번 협력에 따라 램리서치의 사회공헌 재단인 램 파운데이션은 4년간 1500만달러를 지원한다. 지원 대상은 전 세계 5~16세 아동·청소년으로, 컴퓨터 과학과 AI 활용 역량을 높이기 위한 체험형 학습 키트와 교육 자료 등을 제공할 예정이다. 램리서치는 2027년 8월 출범 예정인 글로벌 체험형 STEM 교육 프로그램 '레고 리그(LEGO League)'의 창립 후원사로도 참여한다. 레고 리그는 학생들이 놀이와 협업을 통해 기술을 익히고 실제 문제를 해결하는 경험을 제공하는 프로그램이다. 이번 협력은 반도체와 컴퓨팅, 로보틱스 등 첨단 산업의 전문 인력 수요가 늘어나는 가운데 미래 기술 인재를 조기에 육성하기 위해 추진됐다. 양사는 어린 시절부터 STEM 분야를 접하고 체험할 수 있는 교육 환경을 확대하는 데 주력할 계획이다. 램리서치는 기존에도 반도체 산업 직무 교육과 공학 학위 취득 지원, 대학생 장학금, 전문 기술직 견습 프로그램 등을 운영해왔다. 이번 파트너십을 통해 교육 지원 대상을 아동·청소년까지 확대한다는 구상이다. 팀 아처 램리서치 회장 겸 최고경영자(CEO)는 \"레고 에듀케이션과의 파트너십을 통해 아이들이 일찍부터 기술에 대한 호기심을 키울 수 있도록 돕고, 다양한 학습 경험을 바탕으로 미래 혁신 인재로 성장하는 첫걸음을 내딛도록 지원하고자 한다\"고 말했다. 빅터 세이지 레고 에듀케이션 사장은 \"더 많은 아동·청소년이 체험형 학습을 통해 스스로 무엇을 만들고 이뤄낼 수 있는지 발견할 기회를 제공할 것\"이라고 밝혔다.","category":"사회"},{"title":"제21회 동곡상 시상식 개최…강원 발전 이끈 숨은 주역 4명 영예","link":"https://n.news.naver.com/mnews/article/079/0004211366","naverLink":"https://n.news.naver.com/mnews/article/079/0004211366","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"핵심요약 동곡사회복지재단, '제21회 동곡상 시상식' 세종호텔 컨벤션홀서 성황리 개최 지역발전 이금선, 문화예술 김영주, 교육학술 김풍기, 자랑스러운 출향 강원인 지형근 등 4인 수상 각 부문 수상자에게 상금 2천만 원 수여… 반평생 이어온 헌신과 향토애 기려 성악가 신문희 교수, 대표곡 '아름다운 나라' 등 특별 축하공연으로 감동 선사 '제21회 동곡상 시상식'이 18일 세종호텔에서 성황리에 열렸다. 강원일보 제공 강원 발전과 지역사회를 위해 묵묵히 헌신해 온 숨은 주역들을 발굴하고 기리는 '제21회 동곡상 시상식'이 18일 세종호텔에서 성황리에 열렸다. 동곡사회복지재단(이사장 박진오 강원일보 사장)과 강원일보가 주최한 이날 시상식에서는 △지역발전 이금선(73) 춘천지역범죄피해자지원센터 이사장 △교육학술 김풍기(64) 강원대 교수 △문화예술 김영주(72) 무용가 △자랑스러운 출향 강원인 지형근 (61) 삼성물산 건설부문 전략사업실장 부사장 등 총 4개 수상자에게 각각 상패와 상금 2천만원이 전달됐다. 손영주 아나운서의 사회로 진행된 시상식은 정재연(강원대 총장) 심사위원장의 심사경과 보고, 부문별 시상식, 공적 영상 시청, 수상소감 발표, 인사말, 축사 등의 순서로 진행됐다. 이날 시상식장에는 박진오 동곡사회복지재단 이사장(강원일보 사장)과 우상호 강원특별자치도지사, 박길선 강원특별자치도의회 의장, 강삼영 강원특별자치도 교육감, 허영 국회의원, 육동한 춘천시장, 이희자 춘천시의회 의장, 최선남 양양군의회 의장, 곽병우 강원특별자치도경찰청장, 정재연 강원대 총장(심사위원장), 김영철 동곡포럼 회장, 최연희 전 동곡재단 회장 등이 참석했다. '제21회 동곡상 시상식'이 18일 세종호텔에서 성황리에 열렸다. 강원일보 제공","category":"사회"},{"title":"건배하는 이재명 대통령과 김혜경 여사","link":"https://n.news.naver.com/mnews/article/001/0016450384","naverLink":"https://n.news.naver.com/mnews/article/001/0016450384","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"(선전=연합뉴스) 신준희 기자 = 이재명 대통령과 김혜경 여사가 18일(현지시간) 중국 선전국제교류센터에서 열린 아시아태평양경제협력체(APEC) 정상회의 환영만찬에 참석, 시진핑 중국 국가주석의 건배 제의에 도널드 트럼프 미국 대통령 등 각국 정상들과 건배를 하고 있다. 2026.11.18 [공동취재 제공. 재판매 및 DB금지] hama@yna.co.kr","category":"사회"},{"title":"APEC 환영만찬","link":"https://n.news.naver.com/mnews/article/001/0016450381","naverLink":"https://n.news.naver.com/mnews/article/001/0016450381","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"(선전=연합뉴스) 신준희 기자 = 이재명 대통령과 김혜경 여사가 18일(현지시간) 중국 선전국제교류센터에서 열린 아시아태평양경제협력체(APEC) 정상회의 환영만찬에 참석, 시진핑 중국 국가주석의 건배사를 듣고 있다. 2026.11.18 [공동취재 제공. 재판매 및 DB금지] hama@yna.co.kr","category":"사회"}],"생활·문화":[{"title":"[속보] 당국 “리트 만점자, 신변우려 신고 접수…주거지에 없어”","link":"https://n.news.naver.com/mnews/article/025/0003566357","naverLink":"https://n.news.naver.com/mnews/article/025/0003566357","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"올해 리트에서 만점을 받은 이진우씨가 17일 오후 자택 앞에서 취재진 질문에 답하고 있다. 이규림 기자 인공지능(AI) 부정행위 의혹이 제기된 법학적성시험(LEET·리트) 만점자 이진우(32)씨가 19일 공개 검증장에 나타나지 않은 가운데 그의 신변 안전이 우려된다는 신고가 경찰에 접수됐다. 이에 경찰과 소방 등은 이날 오전 관악구 신림동 소재 이씨의 자택을 찾았으나 이씨는 집 안에 없었던 것으로 파악됐다. 공개된 이씨의 마지막 행적은 전날 공개된 MBC와 인터뷰다. 이씨는 취재진에 19일 공개 검증으로 의혹을 털어내겠다고 밝혔으나 끝내 검증 장소에 나타나지 않았다. 검증을 주관한 입시학원 측은 “이씨의 휴대전화가 어제부터 꺼져 있는 상태다. 연락을 받지 않고 있다”고 말했다. 한편 경찰은 이씨를 업무방해, 공무집행방해, 사기 등 혐의로 고발한 사건을 서울경찰청 광역수사단 금융범죄수사팀에 배당했다. 이씨는 올해 치러진 리트뿐 아니라 앞선 2024년, 2026년 수능시험에서도 부정행위를 했다는 의혹에 휩싸인 상태다.","category":"생활·문화"},{"title":"홍의락 가스공사 사장 \"가스는 전기…미수금 내년 17조, 가스요금 올려야”","link":"https://n.news.naver.com/mnews/article/092/0002445931","naverLink":"https://n.news.naver.com/mnews/article/092/0002445931","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"\"가스와 석유 태생 같지만, 놀이터 달라…통폐합 반대하는 것 아니다” 홍의락 한국가스공사 사장은 18일 가장 중요한 일로 ‘가스요금 인상’을 들었다. 또 석유공사와의 통합 관련해서는 정부 방침이라 연구하고 있지만 방향이 잘 안 나오고 있다고 밝혔다. 홍 사장은 18일 정부세종청사 인근에서 열린 기자간담회에서 “올 연말에 (미수금이) 14조~15조원에 이르고 유가 등이 지금 추세로 가면 내년이 되면 17조로 늘어난다”며 “제일 중요한 것은 요금을 올리는 것”이라고 밝혔다. 홍 사장은 “예를 들어 한 1000~2000원 올리면 해결될 일인데 민간 가스요금을 너무 억제함으로써 일어날 수 있는 폐해들이 있다는 것을 정부에 말하고 싶다”며 이같이 말했다. 홍의락 한국가스공사 사장이 18일 기자간담회에서 질문에 답변하고 있다. 홍 사장은 “지금 전쟁도 있고 수급 문제도 있고 하니 국민이 이해하리라고 생각한다”며 “국민을 설득하려는 노력이 필요하다”고 덧붙였다. 홍 사장은 “1MJ당 1원을 올리면 연간 5000억원 정도 되기 때문에 미수금에 따른 연간 5000억원에 이르는 금융비용 부담을 덜 수 있을 것”이라고 설명했다. 홍 사장은 “(미수금을) 해결하는 데 여러 가지 방법이 있지만 다른 방법들은 해결하려고 해도 푼돈”이라며 “우선 가격을 올리는 게 지금 필요하다”고 거듭 강조했다. 홍 사장은 과거 가스공사가 관행적으로 진행해 온 가스도입 방식은 반성이 필요하다고 지적했다. 홍 사장은 “전력수급기본계획에 맞춰 가스 장기 수급계획을 마련했는데, 전기본이 가스 계획을 줄이면 장기 도입 계약을 줄이는 등 습관적으로 그렇게 해왔고, 정부도 그렇게 하도록 했다”며 “실제 오차가 최근 몇 년 동안 150% 이상”이라고 말했다. 홍의락 한국가스공사 사장.","category":"생활·문화"},{"title":"용인시, 해외출장 중 업무추진비 논란 반박…시의원 “규정부터 확인해야”","link":"https://n.news.naver.com/mnews/article/382/0001305535","naverLink":"https://n.news.naver.com/mnews/article/382/0001305535","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"직원 격려·방문객 기념품 등 7건 집행… “관련 규정 준수하고 사용 내역” 매달 공개 용인특례시청 전경 용인특례시가 이상일 시장의 국외출장 기간 국내 업무추진비 집행을 문제 삼은 “이상욱 시의원의 지적에 대해 규정에 따른 정상적인 집행이라며 반박했다.” 시는 18일 이상욱 시의원이 행정사무감사에서 제기한 업무추진비 논란과 관련해 직원 격려와 업무협의, 방문객 기념품 구입 등 모두 7건은 관련 규칙에 따른 적법한 지출이라고 설명했다. 특히 기념품은 장애인보호작업장과 지역자활센터에서 생산한 제품이며, 직원 격려 식사와 업무협의 비용도 집행 목적에 부합한다고 밝혔다. 시는 업무추진비 사용 내역을 매달 누리집에 공개하고 있다며, “시장의 해외출장 기간이라는 이유만으로 국내 업무추진비 집행을 문제 삼는 것은, 사실관계와 관련 규정을 충분히 살피지 않은 지적이라고 반박했다.” 시 관계자는 “업무추진비를 목적 외로 사용한 사실이 없으며 관련 규정에 따라 투명하게 집행했다”고 밝혔다. 용인ㅣ고성철 스포츠동아 기자 localkb@donga.com","category":"생활·문화"},{"title":"문체부, 2027년 열린관광지 조성사업 30곳 선정","link":"https://n.news.naver.com/mnews/article/029/0003060000","naverLink":"https://n.news.naver.com/mnews/article/029/0003060000","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"전국 누적 242곳 조성…“모두의 관광권 실현” 경북(경주·포항), 지자체 간 협업 최초 사례 문화체육관광부와 한국관광공사는 2027년 ‘열린 관광지 조성사업’ 대상지로 양평 용문산관광지와 강릉 경포해변 등 30곳을 선정했다. ‘무장애 관광연계성 강화 사업’ 대상지는 경북(경주·포항) 1곳으로 결정됐다. 문체부는 19일 사업대상지 공모를 지난 9월부터 실시해 각 지자체의 신청 및 서면평가, 전문가·수요자 등의 현장평가를 거쳐 이같이 선정했다고 밝혔다. ‘열린 관광지’와 ‘무장애 관광사업’은 유엔 장애인권리협약에 따라 유엔관광기구 등 국제적으로 강조되는 ‘모두를 위한 관광권’을 실현하는 사업이다. 우리나라는 초고령화 사회로 진입하면서 장애인과 고령자, 임산부 등 관광취약계층에 대한 관광복지가 더욱 설득력을 얻고 있다. 문체부는 대내외적 환경을 고려해 무장애 관광환경 조성사업을 △개별 관광지점의 물리적, 정보적 접근성을 개선하는 1년 단위 ‘열린 관광지 조성’ 사업 △3년간 단계별로 진행하는 ‘무장애 관광연계성 강화’ 사업으로 나눠 추진하고 있다. 무장애 사업의 경우, 1차연도 교통, 2차연도 관광기반, 3차연도 종합관광서비스 개선 등으로 이어지며 취약계층의 관광에서 필요한 교통-쇼핑-숙박-정보 접근-체험 등에 제약 없는 연계가 완성될 전망이다. 또 내년도 ‘열린 관광지’ 신규 대상지 30곳이 완공되면 해당 사업이 시작된 2015년부터 누적된 열린 관광지는 총 242곳으로 늘어난다. 장애인 화장실과 주차장, 보행로 등 무장애 기반시설을 갖춰, 영유아 등을 동반한 가족단위 관광객 등이 더욱 편리한 관광을 즐길 수 있다. 2027년 ‘무장애 관광연계성 강화’ 사업대상지로 선정된 경북은 지난 2022년부터 복수의 지자체가 ‘공동사업계획’을 수립해 사업을 수행한 최초 사례다. 강동진 문체부 관광정책국장은 “무장애 관광환경을 조성하는 일은 특정 계층만을 위한 사업이 아니라 생애주기별 모든 국민이 안전하고 쾌적하게 여행하는 차별 없는 관광기반을 구축하는 것”이라며 “선정된 대상지의 사업 기획 단계부터 중간 및 사후점검까지 맞춤형 상담과 홍보를 지원하겠다”고 말했다. 문체부는 19일 2027년 ‘열린 관광지 조성 사업’ 대상지 30곳을 선정했다고 밝혔다. 문체부 제공","category":"생활·문화"},{"title":"음식 내려놓더니 발로 '툭'…배달 기사 행동에 고객 분통","link":"https://n.news.naver.com/mnews/article/003/0014331359","naverLink":"https://n.news.naver.com/mnews/article/003/0014331359","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"[서울=뉴시스] 배달 기사가 음식을 발로 밀어 현관 앞에 놓는 모습이 담긴 영상이다. (사진출처=스레드 '@j_swwwwww' 캡처) *재판매 및 DB 금지 [서울=뉴시스]정지연 인턴 기자 = 배달 기사가 고객에게 전달할 음식을 손으로 옮기지 않고 발로 밀어 현관 앞에 놓는 모습이 공개돼 비판을 받고 있다. 지난 17일 소셜미디어(SNS) 스레드에는 배달 기사가 음식을 발로 밀어 문 앞까지 가져다 놓는 장면이 담긴 영상이 올라왔다. 영상에는 배달 기사가 음식을 바닥에 내려놓은 뒤 손으로 옮기지 않고 발로 툭 밀어 현관문 앞까지 가져다 놓는 모습이 담겼다. 게시글 작성자 A씨는 \"왜 음식을 발로 차시나. 본인이 드시라\"며 불쾌감을 드러냈다. 이어 \"배달 기사분들이 다 그러시는 건 아닌데 꼭 몇몇 때문에 다른 직업군까지 전체가 욕을 먹는다\"고 적었다. A씨는 배달 업체에 문의한 뒤 받은 답변도 공개했다. 업체 측은 음식물을 자체 폐기하라는 취지로 안내한 것으로 전해졌다. 이에 A씨는 \"나보고 자체 폐기하라고 하네\"라며 불만을 나타냈다. 이어 \"음식이 중요한 게 아니다. 기분이 나빠서 다른 곳에 다시 시켜서 먹었다\"고 설명했다. 그러면서 \"다음 기사님은 집 앞에 잘 두고 가셨다\"고 덧붙였다. 게시물을 접한 네티즌들은 \"한 발자국 더 움직이면 될 것을\", \"사람 먹는 음식인데 먹는 걸 발로 다루다니\" 등의 반응을 보였다. 엘리베이터가 없는 건물이라는 점을 언급한 댓글에는 \"엘리베이터 없는 집에 살면 잘못인 거냐\", \"어떤 세상을 살아오면 저런 생각을 하는 거냐\"며 반박하는 목소리도 나왔다. 자신이 겪은 비슷한 상황을 전한 네티즌도 있었다. 한 이용자는 \"문을 열고 나가는데 엘리베이터에서 택배를 던지려다 눈이 마주쳤다\"고 적었다. 배달 기사의 부주의한 음식 취급이 논란이 된 것은 이번이 처음이 아니다. 지난 8월에도 한 배달 기사가 케이크 상자를 현관 앞에 내려놓은 뒤 발로 여러 차례 걷어차는 모습이 CCTV에 포착돼 비판을 받았다. 배달 서비스 이용이 일상화된 가운데 고객에게 전달되는 음식의 위생과 취급 방식에 대한 주의가 필요하다는 지적도 나온다．","category":"생활·문화"},{"title":"대구·경북 대학가 '해킹 비상'…영남대·대구한의대·경일대 개인정보 유출 잇따라","link":"https://n.news.naver.com/mnews/article/014/0005606471","naverLink":"https://n.news.naver.com/mnews/article/014/0005606471","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"12일 경일대(3056건)→14일 대구한의대(1281건)→16일 영남대 잇따라 시스템 뚫려 학번·성명·연락처 등 유출…주민등록번호 등 고유식별정보 피해는 없는 것으로 파악 피해 대학들 외부망 차단 및 비밀번호 변경 의무화 등 후속 조치…인근 대학도 보안 강화 '초긴장' 전자문서시스템에 대한 외부의 불법적인 접근으로 개인정보 침해사고 및 유출 사실을 알리는 경일대 홈페이지. /사진=뉴스1 [파이낸셜뉴스] 최근 전국 대학을 겨냥한 해킹 공격이 이어지는 가운데 대구·경북권 대학에서도 전산 시스템이 연달아 뚫리며 개인정보 유출 사고가 발생해 지역 교육계에 비상이 걸렸다. 18일 지역 교육계에 따르면 지난 12일 경일대를 시작으로 14일 대구한의대, 16일 영남대가 잇따라 해킹 공격을 받아 교직원과 학생들의 개인정보가 유출된 것으로 확인됐다. 경일대는 지난 12일 오후 대학 전자문서시스템에 외부의 불법 접근이 발생해 16일 기준 3056건의 개인정보가 유출됐다. 유출 항목에는 성명, 사번, 부서명, 내선번호, 연락처, 이메일 주소, 집 주소 등이 포함됐다. 대구한의대는 14일 오전 산학협력단이 운영하는 연구행정통합시스템(RERP)이 해킹돼 개인정보 1281건이 유출됐다. 직번 또는 학번, 성명, 부서명, 가입일자 등이 유출됐으며 이 중 30건에는 생년월일도 포함된 것으로 파악됐다. 영남대 역시 16일 오전 10시~낮 12시경 도서관 전자책(e-book) 홈페이지와 취업 홈페이지가 해킹 공격을 받았다. 유출 항목은 학번(개인번호), 성명, 소속, 신분, 휴대전화 번호 등이며, 전자책 홈페이지의 경우 비밀번호까지 유출됐다. 대학 측은 현재 중복된 정보를 제외하고 정확한 피해 규모를 산정 중이다. 다만 이들 세 대학 모두 주민등록번호나 여권번호, 운전면허 번호, 외국인등록번호 등 민감한 고유식별정보는 직접적인 유출 항목에 포함되지 않은 것으로 파악됐다. 피해 대학들은 추가 피해를 막기 위해 신속한 방어 조치에 나섰다. 해킹 피해를 본 시스템을 외부망에서 즉각 격리(네트워크 차단)하고, 통합정보시스템 로그인의 2차 인증을 도입하거나 포털 이용자의 비밀번호 변경을 의무화했다. 아울러 구성원들에게 보이스피싱, 스미싱, 명의도용 등 2차 피해 예방을 위해 타 사이트의 비밀번호도 변경할 것을 권고하고, 도용 의심 시 즉시 신고해 줄 것을 당부했다. 영남대 측은 사과문을 통해 \"유사한 사고가 재발하지 않도록 개인정보 보호 체계를 근본적","category":"생활·문화"},{"title":"현직 변호사들 '리트 만점자' 고발‥책구매자 집단소송, 시대인재 '손절'","link":"https://n.news.naver.com/mnews/article/214/0001536505","naverLink":"https://n.news.naver.com/mnews/article/214/0001536505","pubDate":"2026-11-18T12:00:00+09:00","author":"네이버뉴스","description":"올해 법학적성시험, 리트 만점자인 이진우 씨가 리트는 물론 수능시험에서 인공지능으로 부정행위를 한 것이 아니냐는 의혹과 관련해, 경찰이 사건을 서울경찰청 광역수사단에 배당하고 수사에 착수했습니다.
