window.NEWS_DATA = {"date":"2026-11-08","generatedAt":"2026-11-07T10:54:36.398544+09:00","total":149,"days":{"today":{"date":"2026-11-08","weekday":"일요일","label":"오늘 · 11월 8일 일요일","total":50,"categories":{"사건 사고":[{"title":"장관들은 농담, 생존용품점은 특수…영국 뜻밖의 재난 대비 풍경","link":"https://n.news.naver.com/mnews/article/025/0003563473","naverLink":"https://n.news.naver.com/mnews/article/025/0003563473","pubDate":"2026-11-07T10:52:17.169547+09:00","author":"네이버뉴스","description":"\" “마스카라, 컨실러(잡티를 가리는 화장품), 소비뇽 블랑 와인 한 병.” \" 앤절라 레이너 영국 주택장관(왼쪽)이 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 앤디 번햄 총리 옆에서 발언하고 있다. 로이터=연합뉴스 앤절라 레이너 영국 주택장관이 지난 9월 한동안 버틸 수 있겠다며 농담처럼 꼽은 비상용품 목록이 약 한 달 뒤 다시 주목받았다. 영국 정부가 지난달 22일(현지시간) 국민에게 72시간을 버틸 비상물품을 갖추라는 ‘비 레디(Be Ready·대비하라)’ 캠페인을 시작하면서다. 이번에는 총리가 비상물품에 술을 넣어도 되느냐는 질문을 받고 술이 우선은 아니지만 한두 잔쯤은 괜찮다는 식으로 답했다. 월스트리트저널(WSJ)은 지난 2일 ‘영국은 종말에 대비하는데, 지도자들은 마스카라와 소비뇽 블랑을 비축한다’는 제목의 기사에서 이런 영국의 풍경을 전했다. 장관들의 농담이 정부의 진지한 경고와 동떨어져 보이지만 오히려 재난 대비에 관심을 끄는 데 도움이 될 수 있다는 분석이 나온다. 현장에선 비상식량과 정수용품을 찾는 손님이 늘었다고 한다. ━ 과자·커피·소스…영국 정치인들이 꼽은 ‘생존 필수품’ 앤디 번햄 총리는 캠페인 시작 다음 날인 지난달 23일 레이너 장관의 와인 얘기가 화두에 오르자 “국민에게 드리는 조언에서 그게 우선순위인지는 잘 모르겠다”며 “어려운 상황을 견디기 위해 한두 잔쯤은 마셔도 될 것”이라고 말했다. 통조림과 생수를 챙기라고 권하면서도 선호하는 간식도 언급했다. 막대 과자 ‘트위글렛’을 거론한 번햄 총리는 “그것 없이 얼마나 오래 버틸 수 있을지 모르겠다”고 말했다. 앤디 번햄 영국 총리가 지난달 23일(현지시간) 영국 에인트리에서 열린 산불 대비 회의에서 소방·구조대원들을 만나고 있다. 영국 정부는 전날 국민에게 사흘치 비상물품을 준비하라는 ‘비 레디’ 캠페인을 시작했다. 로이터=연합뉴스","category":"사건 사고"},{"title":"사람 몰려 경찰 출동…‘남대문 스카프’ 아저씨, 경호원까지 고용했다","link":"https://n.news.naver.com/mnews/article/025/0003563475","naverLink":"https://n.news.naver.com/mnews/article/025/0003563475","pubDate":"2026-11-07T10:52:16.443751+09:00","author":"네이버뉴스","description":"재치 있는 입담으로 화제가 된 ‘남대문 스카프 아저씨’(왼쪽)와 가게 앞에 손님들이 줄 서 있는 모습. 사진 인스타그램 캡처 재치 있는 입담으로 온라인에서 화제를 모은 ‘남대문 스카프 아저씨’가 몰려드는 방문객 때문에 민간 경호업체 인력을 고용한 것으로 전해졌다. 지난 6일 연합뉴스TV에 따르면 서울 남대문시장에서 스카프 매장을 운영하는 스카프 아저씨 A씨는 이날 오전 11시부터 가게 앞에 민간 경호업체 직원 3명을 뒀다. 방문객이 한꺼번에 몰리면서 발생할 수 있는 사고를 막고 시장 내 통행 질서를 유지하기 위해서다. 앞서 A씨는 지난달 31일 인파가 몰리자 임시 휴업을 결정했다. 이후 지난 4일 다시 문을 열었지만 가게 앞에 수많은 사람이 몰리면서 경찰까지 출동했다. 결국 A씨는 자신의 소셜미디어(SNS)를 통해 “너무 많은 분이 모이셔서 경찰분들까지 출동하시는 바람에 안전이 많이 걱정됐다”며 5일 하루 다시 영업을 중단했다. 남대문시장 상인회 관계자는 “해당 스카프 매장에서 직접 안전요원을 고용한 것”이라며 시장 차원에서도 사고 예방에 힘쓰고 있다고 밝혔다. 한편 A씨가 유명해진 건 손님에게 물건을 사지 말라고 말리는 독특한 호객 멘트 덕분이다. 특히 A씨가 스카프 6장은 1만원에 팔면서 “너네 지금 과소비야. 사가도 집 가면 안 써”라며 구매를 말리는 모습이 SNS에서 화제가 됐다. 외에도 손님에게 거침없이 농담을 건네는 등 A씨의 솔직한 입담이 담긴 영상이 인기를 끌면서 가게를 찾는 방문객도 급격히 늘었다. A씨는 지난달 31일 임시휴업을 결정할 당시 SNS를 통해 방문객들에게 무리하게 찾아오지 말아 달라고 요청했다. 그는 “너무 많은 분들이 한꺼번에 찾아와 주시다 보니 오신 분들과 제대로 인사 나누고 소통하기도 어렵고 주변 상인분들께도 본의 아니게 불편을 드리게 됐다”고 했다. 이어 “저 어디 안 가고 남대문시장에 늘 그대로 있으니까”라며 “너무 급하게 일부러 찾아오기보다는 언제든 시장 구경 오실 때 편안한 마음으로 들러주시면 감사하겠다”고 당부했다. 다른 영상에서도 A씨는 가게 주변에 몰린 방문객들의 안전을 우려하며 “저도 돈 벌고 싶지만 이건 아니다”라며 “물건은 많지만 안 팔 것”이라고 말했다.","category":"사건 사고"},{"title":"[단독]구룡마을 화재 열흘···이재민 30가구 마을로 돌아갔다","link":"https://n.news.naver.com/mnews/article/032/0003481217","naverLink":"https://n.news.naver.com/mnews/article/032/0003481217","pubDate":"2026-11-07T10:52:16.443735+09:00","author":"네이버뉴스","description":"SH, 재개발 기간 동안 살 임시주택 마련했지만 임시이주주택 신청 이재민 단 3가구 그쳐 주민 “텐트를 치더라도 구룡마을서 살겠다” 서울 강남구 개포동 구룡마을에서 발생한 화재가 밤샘 진화 끝에 꺼진 지난달 28일 이 마을에서 38년을 살았다는 한 주민이 화재 현장을 바라보고 있다. 이준헌 기자 서울 강남의 마지막 판자촌 구룡마을에 초대형 화재가 발생한 지 열흘이 지났지만 임시이주주택으로 이주하겠다는 의사를 밝힌 주민은 단 3명에 그친 것으로 6일 경향신문 취재 결과 확인됐다. 임시 대피소에 머물렀던 이재민 91가구 중 30가구는 전기와 수도가 복구된 직후 구룡마을로 돌아갔다. 앞서 서울주택도시개발공사(SH)는 지난달 27일 발생한 화재로 집이 전소된 61가구(단전·단수 사유 30가구 제외)에 긴급임시사용주택 이주를 독려했지만 단 16가구만 신청했다. 긴급임시사용주택은 화재나 홍수 등 재난이 발생했을 때 자치구에서 이재민에게 제공하는 공공임대주택으로, 소액의 임대료만 내면 6개월간 보증금 없이 거주할 수 있다. SH는 구룡마을 화재 피해 가구에 임대료의 60%를 감면하고, 나머지 임대료도 강남구가 서울시와 협의해 재해구호기금으로 지원할 예정이었다. 하지만 다수의 구룡마을 이재민들은 긴급임시사용주택 이주조차 거부하고 있다. SH가 마련한 임시이주주택 역시 신청이 저조하다. 당초 SH는 구룡마을 재개발 기간 중 주민들이 임시이주주택에 거주하면 재개발 완료 후 돌아와 살 수 있도록 통합공공임대주택 이주를 약속했지만 남아 있던 주민들은 분양전환 임대주택을 요구하며 버티고 있었다. 일부 이재민들은 통합공공임대주택에 책정된 임대료가 기존 주거지 임대료에 비해 지나치게 비싸 현실적으로 감당하기 어렵다는 입장도 내보이고 있다. 이강일 구룡마을 토지주민협의회 회장은 “SH가 마련한 임시주택으로 예전에 이주한 주민이나 이번 화재로 임시주택 이주를 신청한 사람들은 이미 기초생활수급자이거나 노인 등 임대료 감면 혜택을 받을 수 있는 사람들”이라며 “여기에 해당하지 않는 주민들은 다시 구룡마을로 돌아가 텐트라도 치고 살겠다는 입장”이라고 말했다. 이재민들은 이달 1일부터 호텔 등 민간 숙박 시설을 임시 거처로 이용하고 있다. 강남구는 피해 가구 중 거주지가 강남구가 아닌 1가구를 제외한 60가구에 이달 10일까지 숙박비와 식비를 지원할 예정이다. 화재 피해를 입지 않은 이재민 30가구는 전기와 수도가 복구되자 현재 구룡마을로 돌아간","category":"사건 사고"},{"title":"[단독] 학폭 가해자 ‘학급 교체’ 안 해줘…피해자, 쉬는 시간엔 준비물실로","link":"https://n.news.naver.com/mnews/article/028/0002831127","naverLink":"https://n.news.naver.com/mnews/article/028/0002831127","pubDate":"2026-11-07T10:52:16.443733+09:00","author":"네이버뉴스","description":"피해자가 요청한 ‘학급 교체’, 교육청 권고에도 학교장은 외면 사진은 기사 내용과 무관. 게티이미지뱅크 서울 시내 한 중학교에서 학교폭력을 겪은 피해자가 학교에 ‘학급 교체’를 지속해서 요청했지만, 거절당한 것으로 확인됐다. 사태 파악에 나선 서울특별시교육청 학생인권옹호관마저 학교에 ‘학급 교체 검토’를 제안했는데, 권한이 있는 교장은 ‘다른 사건과의 형평성’을 이유로 응하지 않고 있다. 학폭 신고했더니 돌아온 건 ‘맞학폭’ 서울 성북구 개운중학교에 다니는 ㄴ양은 2026년 5월부터 특정 무리한테 놀림을 당했다. 한겨레21이 입수한 학교폭력대책심의위원회(학폭위) 회의록을 보면, 학교폭력 가해자로 신고당한 개운중 동급생들은 ㄴ양과 눈이 마주치자, “코알라가 꼬나본다” “노무현, 코알라, 노숙자 중에 뭐로 불러줄까”라고 말하며 조롱했다. ‘코알라’는 극우 커뮤니티 등에서 노무현 전 대통령의 외모를 희화화하려고 쓰는 멸칭이자 혐오 표현이다. 이들은 ㄴ양의 귀에 대고 소리를 지르거나, 여럿이 모여 주변을 “펄쩍펄쩍” 뛰면서 돌고 6분가량 동물 소리를 지르고 얼굴을 “5㎝” 가까이 들이밀기도 했다. 동급생들의 괴롭힘을 견디지 못한 ㄴ양은 6월18일 가해 학생들을 신고했다. 그는 8월10일 열린 학폭위에 출석해 “다른 친구들과 관계가 좋았지만, 가해자들이 놀리기 시작하면서 친구들도 나를 피했다”고 호소했다. 가해 학생들의 부모는 사건 초기 서면 사과로 무마하려다 신고당하자, 되레 학폭으로 ㄴ양을 신고했다. ㄴ양 아버지는 “가해자나 가해자 학부모들은 전혀 반성하지 않고 사과의 진정성이 없다”며 “학생부 생활센터 지도 선생님들이 (가해) 아이들을 불러 야단쳤더니 오히려 학부모들이 ‘당신들이 뭔데 우리 애를 야단치고 가해자 몰이를 하느냐’며 화냈다고 들었다”고 말했다. 보호자와 함께 학폭위에 출석했던 가해 학생 중 일부는 조사관과의 진술마저 뒤집으며 학폭을 부인하기도 했다. 한 가해자의 어머니는 맞학폭을 신청한 이유를 묻는 말에 “ㄴ양을 향한 보복이라기보단 저희 아이의 억울한 상황을 조금 이야기해야겠다는 차원”이라고 설명했다. 교장 “학폭위 결정 없었으니…” 학폭위는 8월10일 ㄴ양의 신고 내용 대부분을 사실로 인정해 신고당한 같은 반 동급생 5명에게 징계를 내렸다. 이 중 3명은 ‘서면 사과’ 외에 ‘학교 봉사, 특별교육 이수, 보호자 특별교육 이수, 피해자 접촉·협박 및 보복행위 금지’ 처분을 받았다. ㄴ양 부모는 추가로","category":"사건 사고"},{"title":"생후 2개월 딸 때려 숨지자 홈캠 영상 지워…친부 재판행","link":"https://n.news.naver.com/mnews/article/421/0009275636","naverLink":"https://n.news.naver.com/mnews/article/421/0009275636","pubDate":"2026-11-07T10:52:16.443731+09:00","author":"네이버뉴스","description":"수원지방공소청. ⓒ 뉴스1 김영운 기자 (수원=뉴스1) 배수아 기자 = 잠을 안 자고 보챈다는 이유로 생후 2개월 된 딸을 때려 숨지게 한 친부가 재판에 넘겨졌다. 수원지방공소청은 6일 아동학대범죄의처벌등에관한특례법 위반(아동학대살해) 혐의로 40대 A 씨를 구속기소 했다고 7일 밝혔다. A 씨는 지난 10월 11일 새벽 경기 오산시 서동 소재 주거지에서 B 양의 얼굴 등 머리 부위를 10여 차례 때려 숨지게 한 혐의다. A 씨는 B 양이 잠을 안 자고 보채자 짜증 난다는 이유로 범행한 것으로 조사됐다. A 씨는 같은 날 오전 3시 47분께 경찰에 \"아이가 숨을 안 쉰다\"며 신고했다. 심정지 상태였던 B 양은 병원으로 옮겨졌지만 숨졌다. 경찰은 B 양의 몸에서 발견된 멍 자국, A 씨가 B 양의 사망 판정 후 휴대전화를 이용해 자택 홈캠 영상을 삭제한 정황 등을 근거로 A 씨를 긴급체포했다. 체포 후 A 씨는 폭행 사실은 인정하면서도 살해 의도는 없었다고 주장해 왔다. 경찰은 A 씨의 범행 과정과 이후의 행동을 근거로 살인의 고의성이 다분하다고 판단, 처음 적용했던 아동학대처벌법상 아동학대치사 혐의에서 형량이 중한 아동학대살해 혐의로 변경해 적용했다. 경찰은 디지털 포렌식을 통해 복원한 홈캠 영상에서 A 씨의 폭행으로 인한 B 양의 울음소리가 들린 것으로 판단했다. 또 국립과학수사연구원의 1차 부검 소견에서도 A 씨가 폭행한 부위와 B 양의 손상된 두부 부위가 일치하고, 폭행으로 인한 두부 손상이라는 의견 등이 나온 것으로 파악됐다. A 씨에 대한 재판은 수원지법에서 열릴 예정이다.","category":"사건 사고"},{"title":"'망치로 폭행·514차례 고문' 강서 연인 살인사건 20년 구형에 \"출소해도 40대\" 공분","link":"https://n.news.naver.com/mnews/article/119/0003152415","naverLink":"https://n.news.naver.com/mnews/article/119/0003152415","pubDate":"2026-11-07T10:52:16.443727+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"김민석 사과하면 끝? '수사' 촉구하는 조선·중앙일보","link":"https://n.news.naver.com/mnews/article/006/0000138618","naverLink":"https://n.news.naver.com/mnews/article/006/0000138618","pubDate":"2026-11-07T10:52:16.443708+09:00","author":"네이버뉴스","description":"[AI 뉴스 브리핑] ▲김민석 더불어민주당 대표가 2026년 11월5일 당내 신천지 비밀연합 폭로를 두고 의총에서 증거가 없었다고 인정하고 비공개 사과한 것과 관련해 민티07에 출연해서도 당원여러분께 죄송하기도 하고 감사하기도 하다라고 사과하고 있다. 사진=민티07 영상 갈무리 김민석 더불어민주당 대표는 지난 8월 전당대회 때 경쟁 후보를 겨냥해 제기했던 신천지 관련 의혹에 증거가 없었다며 사과했다. 민주당은 자체 조사 보고서를 전면 공개하지 않고 당내 인사들이 제한적으로 열람하도록 했다. 보수언론에선 수사를 촉구했다. 6일 주요신문 사설을 정리했다. 민주당 신천지 의혹에 조사 결과 공개와 수사 요구 조선일보는 에서 김 대표의 의혹 제기와 조사 결과 비공개를 함께 문제 삼았다. \"김 대표가 전대 과정에서 신천지를 끼운 '3자 연합설'로 정치적 이득을 노렸다는 것은 부인하기 어렵다\"며 \"김 대표 스스로 허위사실을 공표했다고 자백한 셈인데 이런 식의 사과로 끝날 일인지 의문이다\"라고 했다. 이어 국민의힘 관련 신천지 의혹 수사와 비교했다. \"민주당 사정도 별반 다르지 않다는 소문이다. 전국동시지방선거가 있었던 2022년 이후 민주당에 입당한 신천지 신도가 적어도 2만~3만명이라고 한다\"고 전하면서 \"사실이라면 김 대표 말처럼 덮고 지나갈 일이 아니다\"라고 했다. 인용된 입당 규모는 사설에서 소문으로 제시한 수치다. 중앙일보도 에서 제한적 열람으로는 의혹을 해소하기 어렵다고 했다. \"조사 결과는 비공개로 묶은 채 관련 자료만 제한적으로 의원들에게 열람하게 하는 미봉책을 택했다\"며 \"뭔가 숨기는 게 있다는 의심만 짙어진다\"고 비판했다. 중앙일보는 국민의힘 관련 의혹에 검경 합동수사본부의 강제수사가 이뤄진 점을 들었다. \"민주당에도 같은 원칙과 잣대가 적용돼야 마땅하다\"며 \"민주당은 사안을 덮으려 하지 말고 수사기관에 정식 의뢰해 있는 그대로 진상을 밝혀야 한다\"고 촉구했다. 대통령 유튜브 방송에 소통 확대보다 경청 요구 이재명 대통령은 5일 개인 유튜브 채널을 통해 방송 '대통령의 Y'를 시작했다. 청와대는 2~3주 간격으로 방송을 이어가되 주요 현안이 생기면 횟수를 늘릴 수 있다고 밝혔다. 이 대통령은 첫 방송에서 사회관계망서비스(SNS) 등을 통한 직접 소통이 \"목숨줄 같은 존재\"라고 말했다. 세계일보는 에서 기존 SNS 활동에 유튜브 방송까지 더해지는 점을 우려했다. \"견제 없는 일방적 메시지 전달에 얼마나 많은","category":"사건 사고"},{"title":"“‘검사 수사권 선택적 부활’은 위헌”…법조계, 조작기소 특검법에 거센 반발","link":"https://n.news.naver.com/mnews/article/022/0004173222","naverLink":"https://n.news.naver.com/mnews/article/022/0004173222","pubDate":"2026-11-07T10:52:16.443695+09:00","author":"네이버뉴스","description":"‘조작기소 특검법’이 더불어민주당 주도로 6일 여당 주도로 국회 본회의를 통과한 가운데 법조계 안팎에서 반발이 거세다. 지난달 2일 개정 형사소송법 시행과 함께 검사의 수사권이 폐지된 상황에서 조작기소 특검법이 파견검사의 수사권과 지휘권은 종전 형사소송법을 따라 부활시켰다는 점을 두고 “위헌 소지가 높다”는 비판이다. 7일 법조계에 따르면 법원행정처는 조작기소 특검법안 검토 의견서에서 “10월2일 형사사법절차 개편이 이뤄졌음에도 제정안은 수사·기소 분리와 관련된 사항이 반영돼 있지 않아 이를 반영할 필요가 있다”고 밝혔다. 이밖에도 △이의신청 규정의 부재 △공소유지 변호사 도입 △이례적인 영장재판의 전속관할(서울중앙지법)·영장전담법관 보임 △수사과정 언론브리핑에 따른 피의사실 공표 등이 위헌 요소가 될 여지가 있다는 지적이 담겼다. 6일 서울 여의도 국회에서 열린 제439회(정기회) 12차 본회의에서 윤석열 정권 검찰청, 국가정보원, 감사원 등 조작수사·조작기소 등 의혹의 진상규명을 위한 특별검사 임명 등에 관한 법률안이 더불어민주당 등 여권 주도로 통과되고 있다. 뉴시스 특히 이의신청 규정의 부재를 두고는 “수사대상이 된 자는 특별검사가 직무범위를 벗어난 수사 등을 하는 경우 법원에 이의신청을 할 수 있도록 규정하고 있는데, 이는 공정하고 객관적인 수사가 이뤄질 수 있도록 보완장치로 기능한다”는 헌법재판소의 결정례를 들었다. 이원석 전 검찰총장은 전날 입장문을 내고 “(정부 여당은) 수사하는 사람이 기소까지 하게 되면 확증편향에 빠져 수사 대상자의 인권을 침해한다면서 아예 검찰을 폐지했다”며 “그러나 ‘공소취소를 위한 특검’을 도입하면서 그 특검에는 수사와 기소 권한을 통째로 부여했다”고 비판했다. 또 “민주당이 수사 대상을 정하고 대통령이 임명하는 특검만은 민주당의 ‘수사-기소 원칙'의 예외”라며 “심지어 폐지된 형사소송법상 검사의 권한을 소급 적용하기까지 한다. 나에게, 우리 편에 유리한 형사사법 시스템을 창설한 것”이라고 했다. 그는 “특검법은 대통령과 그 측근들만 예외로 재판받지 않고 공소취소로 가는 길을 활짝 열어두고 있다”며 “이는 사회적 특수계급을 따로 만들고 인정하는 것으로 헌법상 평등의 원칙에 반한다. 누구도 자기 사건의 재판관이 될 수는 없다”고 강조했다. 이 전 총장은 아울러 “사법권은 독립된 사법부에 속한다”며 “행정권에 속하는 수사기관, 그것도 재판절차가 일시 중지된 대통령이 임명하는","category":"사건 사고"},{"title":"안일했던 스토킹 대응, 결국 참극…정말 `국민 위한` 수사기관 개편 맞나[사사건건]","link":"https://n.news.naver.com/mnews/article/018/0006405474","naverLink":"https://n.news.naver.com/mnews/article/018/0006405474","pubDate":"2026-11-07T10:52:16.443693+09:00","author":"네이버뉴스","description":"가정폭력·스토킹 등 강력 사건의 수사와 재판 경과를 다룬 기사다.\n피의자 진술과 사건 처리 과정, 피해자 보호 체계가 주요 쟁점으로 전해졌다.\n재발 방지와 피해자 안전을 위한 대응의 중요성을 짚는다.","category":"사건 사고"},{"title":"\"3~4세 의대반? 아동 학대로 구속해야\" 일타강사의 일침","link":"https://n.news.naver.com/mnews/article/079/0004207453","naverLink":"https://n.news.naver.com/mnews/article/079/0004207453","pubDate":"2026-11-07T10:52:16.443684+09:00","author":"네이버뉴스","description":"아동 보호와 돌봄 환경을 둘러싼 문제를 다룬 기사다.\n과거 사례를 되짚으며 주변 어른과 관련 기관의 대응이 적절했는지 살펴본다.\n아동의 안전을 위해 조기 발견과 보호 체계가 중요하다는 점을 전한다.","category":"사건 사고"}],"사회":[{"title":"14시간 통신장애에 고객정보 30만건 유출...日 도코모 ‘설상가상’","link":"https://n.news.naver.com/mnews/article/092/0002444300","naverLink":"https://n.news.naver.com/mnews/article/092/0002444300","pubDate":"2026-11-07T10:52:17.645842+09:00","author":"네이버뉴스","description":"교환기 장애 복구, 해킹 피해 사이트 재개 미정 일본 이동통신사 NTT도코모에서 전국 단위 통신장애와 해킹에 따른 고객정보 유출이 잇따라 발생했다. 5G 단독모드(SA) 가입자의 통화·데이터 장애는 약 14시간 만에 복구됐지만, 고객정보 최대 약 30만건이 유출된 온라인 서비스는 중단이 이어지고 있다. NTT도코모는 6일 공지를 통해 “5G SA 가입자를 수용하는 교환기 혼잡으로 장애가 발생했다”며 “현재까지 조사에서 장애 발생 전후를 포함해 불법접속 흔적이나 사이버공격을 나타내는 정황은 확인되지 않았다”고 밝혔다. 고객정보 유출은 온라인숍과 가입자 관리 서비스 ‘마이 도코모’에 대한 외부 불법접속으로 발생했다. 회사는 6일 오후 6시 기준 두 서비스의 긴급 점검을 계속하고 있으며, 재개 시점은 정해지지 않았다고 공지했다. NTT도코모 네트워크 운영센터, 사진_NTT도코모 14시간 이어진 5G SA 장애 통신장애는 5일 오전 11시18분께 시작돼 6일 오전 1시20분께 복구됐다. 약 14시간 동안 일본 전역의 5G SA 가입자가 음성통화와 데이터통신, 문자메시지(SMS)를 이용하는 데 어려움을 겪었다. 5G SA는 LTE 코어 설비와 연동하지 않고 5G 전용 설비로 통신하는 방식이다. 장애 영향은 해당 서비스 가입자에게 한정됐다. 다른 5G와 LTE 가입자와 도코모 회선을 사용하는 알뜰폰에는 영향이 없었으며, 긴급통화도 정상 제공됐다. 도코모는 장애 대응 과정에서 네트워크 설정을 LTE로 바꾸고 단말기를 재시작하거나 비행기 모드를 켰다 끄는 임시 조치를 안내했다. 복구 이후에는 LTE로 바꾼 네트워크 설정을 원래대로 되돌리도록 요청했다. 해킹으로 신분증 계좌정보 유출 통신장애에 앞서 도코모는 4일 온라인숍과 마이 도코모에 대한 외부 불법접속을 발견하고, 5일 오전 1시5분께부터 두 서비스의 각종 신청과 변경 업무를 중단했다. 이후 조사에서 서비스 차단 이전에 고객정보가 유출된 사실을 확인했다. 6일 추가 공지에서는 유출 정보의 세부 항목도 공개했는데 이름, 생년월일, 주소, 전화번호, 이메일뿐 아니라 본인확인 서류 번호, 휴대전화 계약 시작일 등 계약 내용이 포함됐다. 일부 고객은 금융기관명과 지점명, 계좌번호와 예금주 등 금융정보와 대리인 연락처, 직장 법인 정보도 유출됐다. 회사 측은 외부 접근을 차단한 뒤 추가 정보 유출은 확인되지 않았다고 설명했다. 침입 경로와 정확한 유출 범위 건수는 조사하고 있다.","category":"사회"},{"title":"“젠슨 황에 접근한 여성, 中 국가안전부 간첩으로 파악”-NYT","link":"https://n.news.naver.com/mnews/article/449/0000366707","naverLink":"https://n.news.naver.com/mnews/article/449/0000366707","pubDate":"2026-11-07T10:52:17.169463+09:00","author":"네이버뉴스","description":"젠슨 황 엔비디아 최고경영자(CEO)와 가까운 관계를 맺은 중국 국적 여성 엘리스 황이 중국 정부를 위해 정보를 수집했다는 의혹이 제기됐다. 사진=뉴시스(넷선더 링크드인 캡처) 미 정보 당국이 젠슨 황 엔비디아 회장과 가까웠던 중국인 여성 사업가 앨리스 황이 중국의 국가안전부 소속 간첩인 것으로 파악하고 있다고 미 뉴욕타임스(NYT)가 6일(현지시각) 보도했습니다. 앨리스 황은 국가안전부에 포섭돼 미국의 인공지능 반도체에 관한 정보를 수집하고, 엔비디아가 최첨단 반도체를 중국에 공급하도록 유도하기 위해 젠슨 황을 상대로 정보를 수집했습니다. 미 정보기관들은 앨리스 황이 젠슨 황에게 접근한 목적을 집중적으로 조사해왔으며 의회도 관심을 보이기 시작했습니다. 미 하원 위원회 3곳이 젠슨 황에게 이달 말 비공개 청문회에 출석할 것을 요청했습니다. 영어를 능숙하게 구사하는 앨리스 황은 젠슨 황과 엔비디아의 주요 슈퍼컴퓨터 조립업체 가운데 하나인 기가바이트의 경영진을 등 인공지능 반도체 업계 최고위층 경영진과 관계를 맺고 있으며 업계 회의와 비공개 경영진 만찬에도 참석했습니다. 앨리스 황이 운영하는 메가스피드가 지난 2024년 수십억 달러 규모의 첨단 인공지능 반도체 구매에 착수했으며 당시 업계의 많은 사람들이 메가스피드의 갑작스런 등장에 의아해했습니다. 앨리스 황은 상하이와 저장성 일대에 집중된 기업 및 투자자 네트워크와 연결돼 있었습니다. 이들은 상하이 현지 당국자들과의 관계를 활용해 모바일 비디오 게임 사업에서 데이터센터 사업으로 공격적으로 진출했습니다. 메가스피드는 동남아시아에 데이터센터를 건설한 뒤 중국의 거대 인터넷 기업 알리바바에 컴퓨팅 능력을 임대해 왔습니다. 이를 통해 중국은 첨단 엔비디아 반도체에 접근할 수 있는 우회 경로를 확보했습니다. 엔비디아는 미국의 규제로 해당 반도체를 중국에 직접 판매할 수 없습니다. 이 네트워크는 현지 인맥뿐 아니라 중국 군사기관과도 재정적으로 연결돼 있습니다. 중국의 국가안전부는 시진핑이 주석에 취임한 이래 크게 확대돼 현재 미 중앙정보국(CIA) 몇 배 규모가 됐습니다. 이 기관은 인간 정보원을 활용해 정보를 수집하고 전자통신을 가로채며 방첩 활동도 수행합니다. 전직 미국 중앙정보국 방첩 분석관은 중국 정보기관이 기술을 활동의 핵심 대상으로 삼아 왔다며, 기술을 “경제 세계에서 지배력을 확보하기 위한 핵심 전투”로 보고 있다고 말했습니다.","category":"사회"},{"title":"내륙 대부분 '영하의 아침'…서울·인천·대전 등 올가을 첫얼음","link":"https://n.news.naver.com/mnews/arti 가씨’ 자리에 앉은 충성파 새 실장 “트럼프 위해 싸워야” …美우선주의 ‘마이웨이’ 고수 의지","link":"https://n.news.naver.com/mnews/article/021/0002831011","naverLink":"https://n.news.naver.com/mnews/article/021/0002831011","pubDate":"2026-11-07T10:52:16.443725+09:00","author":"네이버뉴스","description":"‘강경 이민정책 설계자’ 스티븐 밀러 부실장서 실장 승진 트럼프, 강경 충성파 기용하며 기존 정책기조 고수 의지 밀러 “힘이 국제질서 좌우” 제국주의적 세계관 밝혀와 신임 백악관 비서실장으로 임명된 스티븐 밀러(왼쪽). UPI=연합뉴스 자료사진. 스티븐 밀러(41) 미국 백악관 신임 비서실장은 6일(현지시간) 트럼프 대통령에 대해 “미 역사상 가장 획기적인 변화를 이끌어낸 정치 지도자”라고 극찬했다. 그는 이날 엑스(X)를 통해 “온 마음을 다해 대통령을 지지하고 위대한 공화국을 지키기 위해 싸워야 한다”라고 말했다. 도널드 트럼프 미국 대통령은 이날 백악관 첫 여성 비서실장으로 ‘얼음 아가씨’라는 닉네임으로 불렸던 수지 와일스(69)를 경질하고 ‘총리’라는 별칭으로 불려온 강경 충성파인 밀러 백악관 부비서실장을 그 자리에 앉혔다. 중간선거 패배 사흘 만에 밀러를 비서실장에 낙점한 것은 중간선거 참패에도 ‘마이웨이’를 고수하겠다는 의지를 뚜렷이 한 것으로 분석됐다. 밀러는 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 트럼프가 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것으로 보인다. 트럼프 측근들 사이에서 ‘총리’라는 별칭으로 불려온 밀러는 1기 행정부 때부터 선임고문으로 백악관을 지켰다. 2020년 트럼프 대통령의 대선 패배 이후에도 곁을 떠나지 않다 2기 행정부 들어 백악관 부비서실장으로 발탁된 측근 중의 측근으로 백악관에서 만난 아내 케이티 밀러와 함께 워싱턴 정가의 파워 커플로 불렸다.밀러는 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 ‘좌파 척결’에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 그가 임명되자마자 민주당 지도부가 맹폭을 퍼붓는 것은 그런 이유에서다. 당장 민주당 지도부는 이번 인선을 “최악의 선택”이라 비난하며 밀러 신임 실장에 대한 의회 차원의 조사를","category":"사회"},{"title":"차에서 폰 썼다고 “미친X”…초등생 머리 피범벅 만든 태권도 관장","link":"https://n.news.naver.com/mnews/article/025/0003563484","naverLink":"https://n.news.naver.com/mnews/article/025/0003563484","pubDate":"2026-11-07T10:52:16.443723+09:00","author":"네이버뉴스","description":"차에서 폰 썼다고 “미친X”…초등생 머리 피범벅 만든 태권도 관장. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"사회"}],"생활·문화":[{"title":"\"최강 한파\" 아침 최저 -6도·일교차 최대 15도…'입동' 뜻과 챙겨 먹으면 좋은 음식 [오늘 날씨]","link":"https://n.news.naver.com/mnews/article/119/0003152402","naverLink":"https://n.news.naver.com/mnews/article/119/0003152402","pubDate":"2026-11-07T10:52:18.129296+09:00","author":"네이버뉴스","description":"입동을 전후해 기온이 크게 내려가며 초겨울 추위가 찾아온다는 예보다.\n아침 기온이 영하권으로 떨어지고 바람까지 강해 체감온도가 더 낮아질 수 있다.\n지역별 기온과 특보 여부를 확인하고 추위에 대비할 필요가 있다.","category":"생활·문화"},{"title":"검은콩·쌀뜨물·식초…미국 패션지가 주목한 ‘한국식 머리 감기’","link":"https://n.news.naver.com/mnews/article/032/0003481212","naverLink":"https://n.news.naver.com/mnews/article/032/0003481212","pubDate":"2026-11-07T10:52:18.129288+09:00","author":"네이버뉴스","description":"해외에서 주목하는 한국식 헤어케어의 핵심은 결국 특별한 비법보다 꾸준하고 세심한 관리에 있다. pexels 세안할 때는 클렌징 오일부터 토너, 세럼, 크림까지 꼼꼼하게 챙기면서 머리 감을 때는 샴푸 하나로 끝내지 않는가. 해외 뷰티업계가 주목하는 한국식 머리 감기는 이런 생각에서 출발한다. 미국 패션잡지 보그는 최근 ‘매끄럽고 윤기 나는 머릿결을 위한 한국식 머리 감기’라는 기사를 통해 K뷰티식 두피 관리법을 소개했다. 기사에 따르면 한국식 헤어케어는 두피를 건강한 모발의 바탕으로 보고, 문제가 생긴 뒤 치료하기보다 평소 관리하는 예방 중심의 접근법이 특징이다. 미국 뉴욕 유니언더마의 피부과 전문의 클레어 장도 한국 뷰티 문화가 두피 관리를 비듬이나 가려움증, 탈모가 생긴 뒤에야 신경 쓰는 영역이 아니라 일상적인 자기관리 일부로 만들었다고 전했다. 가장 먼저 눈에 띄는 것은 두피를 위한 성분이다. 보그는 한국식 헤어케어 제품에 살리실산, 나이아신아마이드, 병풀, 판테놀 등 스킨케어에서 익숙한 성분이 활용된다고 소개했다. 검은콩과 검은깨, 다시마, 쌀뜨물 등 전통적으로 모발 관리에 활용해 온 성분도 언급했다. 최근에는 PDRN과 엑소좀을 활용한 두피 앰플도 등장하고 있다. 물론 이런 성분이 실제 발모나 탈모 예방에 효과가 있는지는 제품별로 별도의 임상적 검증이 필요하다. 머리를 감는 순서에도 신경을 쓴다. 매번 할 필요는 없지만 샴푸 전 두피 스케일러나 각질 제거 제품을 사용해 과도한 피지와 각질, 스타일링 제품 잔여물을 제거하는 것이 첫 단계다. 두피 스케일러는 얼굴의 각질 제거제처럼 두피에 쌓인 묵은 각질과 과도한 피지, 스타일링 제품 잔여물을 씻어내는 전용 제품이다. 살리실산 등 각질 관리 성분을 활용한 제품부터 소금 알갱이가 들어간 스크럽 타입까지 종류가 다양하다. 매일 사용할 필요는 없으며, 지나친 각질 제거는 오히려 두피를 자극할 수 있다. 각질 및 피지 등을 제거한 후 미지근한 물로 두피와 모발을 충분히 적신 뒤 자신의 두피 상태에 맞는 샴푸를 선택한다. 지성 두피라면 과도한 피지와 노폐물 제거에 초점을 맞추고, 민감하거나 건조한 두피라면 자극이 적은 제품을 고르는 식이다. 샴푸할 때는 손톱 대신 손가락 끝으로 두피를 약 1분간 부드럽게 마사지한다. 실리콘 재질의 두피 브러시를 활용하기도 한다. 브러시를 강하게 문지르면 오히려 두피에 자극을 줄 수 있으니 주의한다. 미국피부과학회(AAD) 역시 샴푸는","category":"생활·문화"},{"title":"北 태권도 단독등재 수순에 '책임 공방'…쟁점 따져보니","link":"https://n.news.naver.com/mnews/article/079/0004207447","naverLink":"https://n.news.naver.com/mnews/article/079/0004207447","pubDate":"2026-11-07T10:52:18.129271+09:00","author":"네이버뉴스","description":"종주국 지위 상실? 독점권 없지만 시차는 분명히 존재 늑장대응 정부 탓? 남북관계·심사일정 등 난관 부딪혀 확장등재도 불투명…\"지금이라도 등재 위한 노력해야\" 서울 강남구 국기원 모습. 연합뉴스 북한의 태권도가 한국보다 먼저 유네스코 인류무형유산 등재 권고를 받자 그동안 정부가 손 놓고 있었다는 비판이 쏟아지고 있다. 국가유산청은 지난 정부 책임론까지 제기한 가운데, CBS노컷뉴스가 쟁점별로 북한의 태권도 단독 등재 논란을 둘러싼 비판과 정부 측 해명을 따져봤다. 쟁점① 태권도 종주국 뺏겼다? 유네스코 무형유산위원회 산하 평가기구는 지난 5일 북한이 단독 신청한 '조선민주주의인민공화국의 전통무술-태권도'에 대해 '등재 권고' 판정을 내렸다. 최종 결정은 오는 30일부터 다음 달 5일까지 중국 샤먼에서 열리는 정부간위원회에서 나온다. 유네스코 인류무형유산은 먼저 등재한 나라에 배타적 권리를 인정하는 제도는 아니다. 아리랑은 한국과 북한이 2012년과 2014년에 각각 등재했다. 김치도 한국의 '김치와 김장문화'와 북한의 '김치담그기'가 따로 등재돼 있다. 국가유산청 관계자는 CBS노컷뉴스와 통화에서 \"마치 태권도 종주국의 위치를 뺏겼다는 표현들이 자꾸 나온다\"며 \"잘못된 시그널이 계속 바이럴 되는 게 다소 우려스럽다\"고 말했다. 다만 남북의 등재 시점은 4년가량 벌어질 수 있다. 등재 종목이 많은 한국은 2년에 1건만 심사를 받는데, 2028년 심사대상은 인삼문화로 정해졌다. 공모에서 떨어진 종목들이 다시 신청하는 경우도 많아 한국의 태권도 심사는 이르면 2030년쯤에야 이뤄질 것이라는 전망이 나온다. 북한 태권도가 올해 등재되면 한국의 태권도 등재 전까지 유네스코 인류무형유산 목록에는 북한 태권도만 남게 된다. 배타적 권리는 없어도 국제 무대에서는 북한 태권도가 먼저 인류무형유산으로 소개되는 셈이다. 쟁점② 정부의 늑장대응? 연합뉴스","category":"생활·문화"},{"title":"환절기마다 기침…천식 의심을[톡톡 30초 건강학]","link":"https://n.news.naver.com/mnews/article/032/0003481220","naverLink":"https://n.news.naver.com/mnews/article/032/0003481220","pubDate":"2026-11-07T10:52:18.129269+09:00","author":"네이버뉴스","description":"| 김연희 순천향대서울병원 알레르기면역내과 교수 일교차가 커지는 환절기에는 기침을 호소하는 사람이 부쩍 늘어난다. 대부분 일시적인 목감기로 여기고 넘기지만, 환절기마다 기침이 반복되거나 감기가 다 나은 뒤에도 증상이 이어진다면 천식을 의심해 볼 필요가 있다. 천식은 기침만으로 나타나는 경우도 있어 일반적인 기침과 구분하기 어렵기 때문에 증상의 특징과 관리법을 정확히 알아두는 것이 중요하다. 환절기에는 일교차가 크고 공기가 차고 건조해지면서 기도가 쉽게 자극을 받는다. 여기에 감기, 꽃가루, 미세먼지까지 더해지면 기침이 악화될 수 있다. 특히 천식 환자는 기관지가 예민해 이러한 변화에 더욱 민감하게 반응한다. 천식은 만성적인 기도 염증으로 기도가 과민해지고 쉽게 좁아지는 질환이다. 기침뿐 아니라 숨참, 쌕쌕거림 등이 나타날 수 있으며, 밤이나 새벽에 증상이 나빠지고 찬 공기나 운동에 의해 악화되기도 한다. 증상이 좋아졌다 나빠지기를 반복하는 것도 특징이다. 다만 기침만 나타나는 천식도 있는 만큼 이러한 증상이 오래 지속되거나 반복된다면 검사를 받아보는 것이 바람직하다. 천식은 유전적 요인과 환경적 요인이 복합적으로 작용해 발생한다. 가족 중에 천식이나 알레르기 질환이 있거나, 본인이 아토피피부염이나 알레르기비염을 앓고 있다면 천식이 발생할 가능성이 더 높다. 집먼지진드기, 꽃가루, 곰팡이 같은 알레르기 유발 물질과 담배 연기, 대기오염 등도 영향을 미친다. 반려동물도 알레르기 반응을 통해 천식을 유발하거나 악화시킬 수 있다. 흔히 동물의 털이 원인으로 알려져 있으나, 실제로는 피부 각질이나 침 등에 포함된 단백질이 주요 알레르기 유발 물질이다. 그렇다고 무조건 반려동물과 이별해야 하는 것은 아니다. 먼저 알레르기 검사로 원인을 확인하고 알레르기 유발 물질에 대한 노출을 줄이는 것이 중요하다. 환자의 상태에 따라 면역치료 등을 고려할 수 있으며, 이러한 관리에도 천식이 잘 조절되지 않는다면 반려동물과의 분리도 신중하게 고려해야 한다. 천식은 잘 치료하면 증상이 조절되어 일상생활을 하는 데 지장이 없다. 치료의 핵심은 흡입 스테로이드로, 장기간 사용해도 안전한 것으로 알려져 있다. 치료에도 증상이 조절되지 않는 중증 천식의 경우에는 생물학적 제제를 사용할 수 있다. 증상이 좋아졌다고 해서 임의로 약물을 중단하지 말고 꾸준히 관리하는 것이 좋다. 또한 담배 연기나 미세먼지처럼 기관지를 자극하는 요인을 피하고, 집먼지진","category":"생활·문화"},{"title":"\"한국이 중국 속국이냐\"…반중 영화 상영 무산 논란에 CGV \"예매 저조 때문\"","link":"https://n.news.naver.com/mnews/article/448/0000649562","naverLink":"https://n.news.naver.com/mnews/article/448/0000649562","pubDate":"2026-11-07T10:52:18.129249+09:00","author":"네이버뉴스","description":"캐나다 미스터리 스릴러 ‘초한전’. /드림팩트엔터테인먼트 중국 정부의 코로나19 은폐 의혹을 소재로 한 캐나다 영화 ‘초한전’이 국내 멀티플렉스 CGV에서 개봉 직전 상영관 배정을 받지 못한 사실이 알려지면서 논란이 일고 있다. 영화 수입사 측은 중국을 비판하는 내용 때문에 상영이 무산된 것 아니냐는 의혹을 제기했지만, CGV는 예상 관객 수요와 예매 상황을 고려한 결정이라고 반박했다. 6일 영화계에 따르면 ‘초한전’은 중국 정부가 코로나 바이러스의 진실을 은폐하고 생화학 무기를 개발하려 한다는 설정을 바탕으로 한 미스터리 스릴러다. 중국계 캐나다인 얀 마 감독이 연출했으며 캐나다 배우 딜런 브루스가 진실을 밝히려는 미생물학자 짐을 연기했다. 한국계 캐나다 배우 우니 박은 중국 공산당 간부 첸 장군 역을 맡았다. 영화를 수입한 서울락스퍼국제영화제의 허은도 감독은 지난 5일 조선일보와의 통화에서 “CGV가 16개관 배정을 얘기하다가 개봉 예정일인 지난달 28일을 이틀 앞두고 갑자기 개봉을 못 하겠다고 통보했다”고 주장했다. 허 감독은 “중국을 비판한 영화라고 틀어주지 않는다면 문화 주권 침탈이 아니냐”고 했다. 영화의 상영관 배정이 무산됐다는 소식이 알려지자 일부 온라인 커뮤니티에서는 CGV가 중국의 눈치를 본 것 아니냐는 의혹이 제기됐다. 일부 네티즌은 “우리나라가 중국 속국이냐”며 반발했다. CGV는 정치적 이유로 상영을 거부했다는 의혹을 부인했다. CGV 관계자는 “16개관 배정은 영화사 측과 논의가 오가던 중에 언급된 규모”라며 “예상 수요와 예매 상황 등을 종합적으로 지켜본 결과 최종적으로 상영관 배정이 어렵다고 판단했다”고 밝혔다. 실제로 영화는 개봉 예정일이었던 지난달 28일 오후 1시 40분 CGV용산아이파크몰에서 한 차례 상영됐다. 194석 규모의 상영관에 입장한 유료 관객은 2명이었다. 따라서 영화가 CGV에서 전면 상영 금지됐다는 주장은 사실과 차이가 있다. 허 감독은 중국 인권 문제를 다룬 다큐멘터리 ‘국유장기’도 지난해 락스퍼영화제 당시 CGV에서 상영하려 했으나 거절당했다고 주장했다. ‘국유장기’는 중국 정부의 민간인 강제 장기 적출 의혹을 다룬 작품이다. 지난달 1일 쿠팡플레이 등 온라인동영상서비스(OTT)에 공개된 뒤 인기 순위 2위에 오르기도 했다. 허 감독은 “OTT에서 인기 있다는 것은 국민들이 보고 싶어 한다는 것인데 멀티플렉스에서 못 보게 한다니 말이 되느냐”며 “국회를 찾아","category":"생활·문화"},{"title":"한국예술인복지재단, 예술인 공제사업 출범","link":"https://n.news.naver.com/mnews/article/366/0001203076","naverLink":"https://n.news.naver.com/mnews/article/366/0001203076","pubDate":"2026-11-07T10:52:18.129196+09:00","author":"네이버뉴스","description":"첫 상품 ‘예술현장 안심공제’ 출시, 공연·전시 현장 맞춤형 보장 출연진·스태프 상해·질병 및 관객 사고에 따른 배상책임 통합 보장 예술사업자 대상 우선 출시, 향후 문화시설·예술인으로 확대 추진 한국예술인복지재단 제공 문화체육관광부(장관 최휘영) 산하 한국예술인복지재단(대표 정용욱)은 6일 예술인 공제사업을 출범하고, 공연·전시 현장에서 발생할 수 있는 위험을 통합 보장하는 ‘예술현장 안심공제’를 출시했다고 밝혔다. 예술인 공제사업은 공연·전시 현장의 특성을 반영한 공제상품으로 기존 예술인 복지제도의 사각지대를 보완하기 위한 사업이다. 정부와 예술계가 재원을 마련하고 위험을 분담하는 상호부조 방식으로 운영하며, 예술활동을 지속할 수 있는 복지 기반을 조성하는 것을 목표로 한다. 재단은 올해 정부의 첫 출연금 50억원을 바탕으로 사업의 재정 기반을 마련하고, 예술현장의 수요를 반영한 공제상품을 개발했다. 재단은 민간 보험으로 대비하기 어려운 예술현장의 위험을 보장하는 데 초점을 맞췄으며, 예술사업자의 현장 운영에 필요한 보장 항목을 상품에 담았다고 설명했다. 예술활동 중 발생하는 사고와 손실이 공연·전시 운영 중단으로 이어질 수 있다는 점에서, 사고 발생 이후의 지원뿐 아니라 사전에 위험에 대비하는 체계를 갖추겠다는 취지다. 첫 상품인 ‘예술현장 안심공제’는 공연·전시 등을 기획·운영하는 예술사업자와 단체를 가입 대상으로 한다. 출연진과 스태프의 상해·질병, 관객 등 제3자에 대한 법률상 배상책임과 대물 배상책임을 하나의 상품으로 보장한다. 보장 범위에는 본 공연·전시 기간뿐 아니라 준비와 연습 기간도 포함된다. 재단은 비영리 방식으로 공제사업을 운영해 사업비를 최소화하고 공제료 부담을 낮췄다고 설명했다. 민간 보험에서 개별적으로 가입하는 단체 상해와 행사주최자 배상책임을 통합했으며, 생년월일과 성별 등 기본 정보를 중심으로 가입 절차를 간소화했다. 재단은 첫 상품의 가입 대상을 예술사업자로 정하고, 향후 문화시설과 예술인까지 공제사업 대상을 단계적으로 확대할 계획이다. 공제사업 운영으로 발생하는 수익도 예술인 복지 증진에 재투자한다는 방침이다. 정용욱 재단 대표는 “예술인 공제사업은 예술현장의 특성을 반영한 맞춤형 안전망을 마련하고, 예술인 복지의 사각지대를 보완한다는 점에서 의미가 크다”며 “첫 출연금 50억원을 시작으로 향후 정부 출연금을 지속적으로 확보해 공제사업의 재정 기반을 확충하고, 예술인이 각종","category":"생활·문화"},{"title":"삼성 안방 다시 노리는 中 YMTC…한국서 소비자 SSD 판매 확대","link":"https://n.news.naver.com/mnews/article/031/0001073069","naverLink":"https://n.news.naver.com/mnews/article/031/0001073069","pubDate":"2026-11-07T10:52:17.645828+09:00","author":"네이버뉴스","description":"6월 재진출 이어 10월 보급형 추가…국내 사후서비스도 제공 대만·일본서도 판매…중국에선 공장 증설·장비 국산화 추진 중국 낸드플래시 업체 양쯔메모리테크놀로지(YMTC)가 자체 저장장치 브랜드 '지타이(ZHITAI)'로 한국 소비자 시장 공략을 확대하고 있다. 올해 6월 국내 시장에 재진출한 뒤 보급형 제품을 추가하고 사후서비스 체계를 갖췄다. 중국 내 생산능력을 키우는 동시에 해외 소비자에게 완제품을 판매하는 사업도 넓히고 있는 것이다. 양쯔메모리(YMTC)의 소비자용 SSD 브랜드 지타이의 'TiPro9000 SSD' [사진=YMTC] 노트북·게임용 PC 저장장치…보급형까지 제품 확대 7일 업계에 따르면 YMTC는 국내 유통기업 도우정보를 통해 지난달 보급형 솔리드스테이트드라이브(SSD) 'Ti600s'를 출시했다. 지난 6월 고성능 제품을 포함한 SSD 3종을 선보인 데 이어 국내 판매 제품군을 늘렸다. 소비자용 SSD는 노트북과 데스크톱에서 운영체제와 프로그램, 게임, 사진·동영상 등을 저장하는 부품이다. 하드디스크보다 데이터를 빠르게 읽고 쓸 수 있어 컴퓨터를 켜거나 게임을 실행하는 시간을 줄여준다. 새 PC를 조립하거나 기존 컴퓨터의 저장 공간을 늘릴 때 주로 구매하며, 낸드플래시는 SSD 안에서 데이터를 저장하는 핵심 반도체다. Ti600s는 일상 업무와 가벼운 게임 수요를 겨냥한 제품으로, 용량은 512기가바이트(GB)부터 4테라바이트(TB)까지다. 도우정보가 국내 유통과 사후서비스를 맡아 방문·택배 접수를 지원한다. 제품에는 5년 제한 보증을 제공한다. 지타이는 2022년 판매 부진으로 국내 유통을 중단했다가 올해 4년 만에 돌아왔다. 컴퓨존·아이코다 등 컴퓨터 전문 쇼핑몰을 통한 판매와 국내 사후서비스를 앞세워 소비자를 확보하고 있다. YMTC 공식 홈페이지도 중국어와 영어 외에 한국어를 지원한다. 한국 소비자들의 방문을 염두한 것으로 풀이된다. 대만 공식 유통·일본 매장 판매…아시아 소비자 공략 YMTC의 '엑스태킹(Xtacking)'은 데이터를 저장하는 메모리 셀과 이를 제어하는 회로를 각각 만든 뒤 접합해 저장 용량과 데이터 처리 속도를 높이는 기술이다. [사진=YMTC]","category":"생활·문화"},{"title":"게임이 악성코드 통로가 된다면[ET톡]","link":"https://n.news.naver.com/mnews/article/030/0003483159","naverLink":"https://n.news.naver.com/mnews/article/030/0003483159","pubDate":"2026-11-07T10:52:17.645774+09:00","author":"네이버뉴스","description":"최근 시프트업의 인기게임 '승리의 여신: 니케'에서 발생한 보안 사고는 글로벌 게임산업이 직면한 새로운 위험을 드러냈다. 게임서비스에 사용되는 콘텐츠전송네트워크(CDN)의 자바스크립트 파일이 제3자에 의해 변조되면서 공식 PC 런처를 통해 악성 프로그램이 유포됐다. 이용자가 믿고 실행한 게임이 PC 보안을 위협하는 통로가 됐다. 사고는 게임을 직접 공격하는 대신 연결된 외부 시스템의 취약점을 파고든 '공급망 공격'이라는 점에서 주목된다. 지난 9월 말 관련 도메인 탈취 이후 악성 프로그램 유포가 시작됐지만 운영사가 이를 확인하고 추가 유포를 차단하기까지 상당한 시간이 걸렸다. 게임산업의 국경은 허물어졌다. 국내 게임을 해외 퍼블리셔가 서비스하고 여러 국가에 흩어진 스튜디오가 프로젝트를 공동 수행한다. 개발부터 배급, 업데이트, 운영에 이르기까지 다양한 기업과 시스템이 연결돼 있다. 글로벌 진출 효율성을 높인 구조가 역설적으로 보안의 취약점이 될 수 있다는 의미다. 박정은 통신미디어부 기자 하나의 공급망에서 발생한 문제가 국경을 넘어 수많은 이용자에게 영향을 미칠 수 있다. 개인정보나 게임 데이터 유출을 넘어 악성 프로그램이 이용자 PC에 침투하면 게임 외부의 계정 정보와 금융 자산까지 위협받을 수 있다. 게임사 입장에서도 위험은 막대하다. 국가마다 개인정보 보호와 사이버보안 관련 법률, 제재와 피해 보상 기준이 다르다. 하나의 사고가 여러 국가 규제와 소송으로 이어질 수 있다. 자칫 기업의 존립까지 위협할 수 있다. 게임 보안의 범위를 다시 생각해야 한다. 개발사가 직접 작성한 코드뿐 아니라 외부 퍼블리셔의 배포 시스템, CDN, 업데이트 서버, 협력사 개발 도구까지 공급망 전반을 살펴야 한다. 사고 발생 시 국가와 기업의 경계를 넘어 신속하게 대응할 수 있는 협력체계가 필요하다. 게임은 이용자가 자발적으로 설치하는 콘텐츠다. 그런 게임이 악성코드를 퍼뜨리는 통로가 되는 일만큼은 막아야 한다. 이번 사고가 게임산업 전체에 공급망 보안의 중요성을 일깨우는 계기가 되기를 바란다.","category":"생활·문화"},{"title":"\"물가 공포 한숨 돌렸다\"…미 소비심리 깜짝 반등","link":"https://n.news.naver.com/mnews/article/008/0005437868","naverLink":"https://n.news.naver.com/mnews/article/008/0005437868","pubDate":"2026-11-07T10:52:17.169435+09:00","author":"네이버뉴스","description":"/사진=심재현 특파원 미국 소비자들의 경제 심리가 11월 들어 소폭 개선되면서 시장 예상을 웃돌았다. 고물가에 따른 생활비 부담은 여전하지만 향후 물가 상승에 대한 우려는 다소 완화된 것으로 나타났다. 6일(현지시간) 미국 미시간대에 따르면 11월 소비자심리지수 잠정치가 51.0으로 집계됐다. 전달(48.0) 대비 6% 상승한 수치로 다우존스가 집계한 전문가 예상치(47.5)도 웃돌았다. 세부 지표도 개선세를 보였다. 현재 경제상황에 대한 평가가 반영된 현재 경제 여건 지수는 10월 46.7에서 11월 51.0으로, 향후 전망을 나타내는 소비자 기대지수는 48.8에서 50.9로 상승했다. 물가 상승에 대한 소비자들의 불안감도 한걸음 물러섰다. 향후 1년 기대 인플레이션이 10월 4.7%에서 11월 4.3%로 하락하며 지난 8월 이후 가장 낮은 수준을 기록했다. 다만 이는 미국과 이란의 전쟁 발발 이전인 지난 2월(3.4%)과 비교하면 여전히 높은 수준이다. 장기 물가 전망을 보여주는 5년 기대 인플레이션 역시 전달 3.5%에서 3.4%로 소폭 내렸다. 조안 슈 미시간대 디렉터는 \"개인 재정 상태와 기업 경영 여건 전망 등 여러 부문에서 소폭의 개선이 확인됐다\"며 \"이번 개선세는 주로 무소속 성향의 소비자들 사이에서 집중적으로 나타났다\"고 설명했다. 자산 수준에 따른 온도 차가 감지됐다는 평가도 나온다. 하위 및 중위 자산 계층의 소비자 심리는 상승한 반면, 주식 보유액이 많은 상위 자산가들의 심리는 최근 증시의 변동성 확대 여파로 5% 하락했다. 인공지능(AI) 거품에 대한 불안감은 커지고 있지만 당장 체감하는 생활비 부담에 비하면 비중이 크지 않은 것으로 파악됐다. 응답자의 57%가 여전히 고물가로 생활 수준이 낮아졌다고 답해 지난 5월 이후 가장 높은 수치를 기록했다.","category":"생활·문화"},{"title":"“주차하고 올게요” 1억 챙겨 달아난 20대 코인 사기범","link":"https://n.news.naver.com/mnews/article/666/0000130986","naverLink":"https://n.news.naver.com/mnews/article/666/0000130986","pubDate":"2026-11-07T10:52:16.443721+09:00","author":"네이버뉴스","description":"“코인 싸게 팔겠다” 속인 뒤 2명에게서 5천만원씩 받아 챙겨 도박·유흥비로 탕진...일산동부경찰서, 사기 혐의로 구속 송치 일산동부경찰서 전경. 경기일보DB 코인을 시세보다 저렴하게 팔겠다고 속여 직거래에 나선 피해자 2명으로부터 현금 1억원을 가로챈 20대 남성이 구속 상태로 검찰에 넘겨졌다. 고양 일산동부경찰서는 사기 혐의로 20대 남성 A씨를 구속 송치했다고 7일 밝혔다. A씨는 지난달 7일 오후 5시께 고양시의 한 카페에서 코인을 거래하자며 피해자들을 속여 현금 1억원을 건네받은 뒤 달아난 혐의를 받는다. A씨는 지인을 통해 알게 된 피해자 2명에게 자신이 특정 코인 관련 업무를 하고 있다고 소개하며 현금으로 거래하면 해당 코인을 저렴하게 살 수 있다고 속인 것으로 전해진다. 피해자들은 각각 5천만원씩 총 1억원을 현금으로 준비해 A씨를 만났다. A씨는 카페에서 음료를 주문한 뒤 주차를 하고 오겠다며 자리를 비웠고, 피해자들로부터 받은 현금을 들고 그대로 달아난 것으로 조사됐다. 경찰은 A씨가 실제 해당 코인 관련 업무를 했는지는 확인되지 않았다고 밝혔다. 범행 이후 A씨는 경찰의 추적을 피하려 휴대전화까지 해지한 것으로 파악됐다. 그러나 경찰 수사 끝에 붙잡힌 A씨는 조사 과정에서 혐의를 인정했으며, 가로챈 돈 1억원은 도박과 유흥비 등으로 모두 탕진한 것으로 알려졌다.","category":"생활·문화"}],"세계":[{"title":"\"얼음아가씨\"도 못 피한 중간선거 후폭풍…트럼프 비서실장 전격교체","link":"https://n.news.naver.com/mnews/article/008/0005437906","naverLink":"https://n.news.naver.com/mnews/article/008/0005437906","pubDate":"2026-11-07T10:52:17.169552+09:00","author":"네이버뉴스","description":"[美 중간선거] 도널드 트럼프 미국 대통령(오른쪽)과 스티븐 밀러 백악관 신임 비서실장. /로이터=뉴스1 백악관 첫 여성 비서실장의 기록을 썼던 수지 와일스(69)가 공화당의 중간선거 참패 사흘 만에 자리에서 물러났다. 선거 패배 이후 백악과 내각에서 처음으로 이뤄진 인사 교체다. 신임 비서실장에는 도널드 트럼프 대통령의 강경파 최측근으로 꼽히는 스티븐 밀러 부비서실장(41)이 임명됐다. 민주당은 트럼프 대통령의 이 같은 인사가 선거 참패에도 '마이웨이'를 고수하겠다는 의지를 보인 것이라며 의회 차원의 조사를 예고했다. 트럼프 대통령은 6일(현지시간) 소셜미디어 트루스소셜을 통해 \"밀러 부비서실장이 백악관 비서실장을 맡게 된다\"며 \"내가 가장 신뢰하는 참모 중 하나\"라고 밝혔다. 와일스 실장에 대해선 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라며 \"비서실장으로 헌신해준 데 대해 감사하다\"고 발표했다. 트럼프 대통령은 '트럼프 정치조직'이 어떤 조직인지, 와일스가 어떤 역할을 맡게 될지는 구체적으로 언급하지 않았지만 이날 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 이번 인사가 중간선거 패배에 따른 인적 개편임을 시사했다. 이날 인사는 지난 3일 중간선거에서 공화당이 민주당에 연방 상·하원 다수당 지위를 모두 내준 지 사흘 만에 발표됐다. 밀러 신임 실장은 트럼프 대통령의 대표적인 강경파 측근으로 집권 1기부터 반(反)이민 정책을 설계하고 추진해온 핵심 참모다. 1985년생으로 2015년 시작된 트럼프 대통령의 첫 대선 캠페인 때부터 함께 일했고 트럼프 대통령의 첫 취임사 준비도 주도했다. 1기 트럼프 행정부에서 백악관 수석 정책고문을 지내다 2기 행정부 들어 정책 담당 부비서실장으로서 대규모 불법 이민자 추방 등 강경 이민 정책을 주도했다. 미 정가에선 트럼프 대통령이 비서실장 교체를 단행하면서 조만간 후속 내각 개편이 이어질 수 있다는 관측이 나온다. 수지 와일스 전 백악관 비서실장. /AP=뉴시스 /사진=이혜미","category":"세계"},{"title":"[아프리카인물열전](45) \"노예의 풍요보다 자유로운 빈곤을\"…투레 기니 대통령","link":"https://n.news.naver.com/mnews/article/001/0016427649","naverLink":"https://n.news.naver.com/mnews/article/001/0016427649","pubDate":"2026-11-07T10:52:17.169546+09:00","author":"네이버뉴스","description":"프랑스어권 아프리카 식민지 중 첫 독립 선포 '강골'…26년 철권통치 그림자도 1961년 유고슬라비아를 방문한 아흐메드 세쿠 투레 기니 초대 대통령 [위키피디아 제공. 재판매 및 DB 금지] (카이로=연합뉴스) 김상훈 특파원 = \"우리는 노예 상태에서 누리는 풍요보다 자유 속의 빈곤을 택하겠다.\" 1958년 프랑스의 샤를 드골 대통령 면전에 던진 이 단호한 선언은 서부 아프리카 독립운동의 거대한 불씨가 되었다. 프랑스의 제국주의에 정면으로 맞서 기니의 즉각적인 독립을 쟁취한 인물, 아흐메드 세쿠 투레(1922~1984) 기니 초대 대통령은 아프리카 민족주의 역사에서 가장 강렬한 족적을 남긴 지도자 중 한 명으로 꼽힌다. 1922년 기니 중부 파라나에서 태어난 세쿠 투레는 19세기 프랑스 식민 침략에 맞서 싸운 위대한 저항군 지도자 사모리 투레의 후손으로 알려져 있다. 그는 우체국 직원 등으로 일하며 노동조합 활동에 투신했다. 탁월한 연설 능력과 강력한 카리스마를 바탕으로 기니 노동운동과 민족주의 진영의 핵심 지도자로 부상했다. 세쿠 투레의 이름이 전 세계에 각인된 것은 1958년 프랑스가 제안한 신헌법 찬반 국민투표 때다. 당시 드골 프랑스 대통령은 아프리카 식민지국들에 완전 독립 대신 '프랑스 공동체' 내의 자치국으로 남을 것을 종용했다. 대부분의 프랑스어권 아프리카 지도자들이 경제적 지원 중단을 우려해 이를 수용했지만, 세쿠 투레는 단호히 거부했다. 그해 9월 28일 실시된 투표에서 기니 국민은 95%의 압도적인 반대표를 던졌고, 10월 2일 기니는 프랑스어권 아프리카 국가 중 최초로 완전 독립을 선포했다. 세쿠 투레의 반란에 분노한 프랑스의 보복은 집요하고 가혹했다. 기니에 주둔하던 프랑스 관리와 기술자들을 즉각 철수시키며 전화선과 발전소 등 기반 시설을 파괴했고, 심지어 관공서의 전구와 행정 서류, 의약품까지 모조리 파기하거나 챙겨서 떠났다. 신생 독립국 기니를 철저히 붕괴시켜 다른 식민지국에 본보기를 보여주겠다는 의도였다. 그러나 세쿠 투레는 굴복하지 않았다. 서방의 지원이 끊기자 그는 옛소련, 중국 등 공산권 국가들과 손을 잡고 위기를 돌파했다. 가나의 콰메 은크루마 등과 함께 범(凡)아프리카주의 운동을 주도하며 아프리카의 완전한 해방을 역설했다. 대륙 전체의 독립을 상징하는 영웅으로 추앙받았다. 냉전 시대 강경한 사회주의 및 비동맹 노선을 걸었던 탓에 한국과 직접적인 외교적 인연은 없었다. 대신 그","category":"세계"},{"title":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?","link":"https://n.news.naver.com/mnews/article/053/0000062883","naverLink":"https://n.news.naver.com/mnews/article/053/0000062883","pubDate":"2026-11-07T10:52:17.169544+09:00","author":"네이버뉴스","description":"美 휩쓴 '블루 쓰나미', 한미 통상 관계 여파 폭풍전야?. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 비서실장에 '총리 별명' 충성파…美우선주의 마이웨이(종합)","link":"https://n.news.naver.com/mnews/article/001/0016427650","naverLink":"https://n.news.naver.com/mnews/article/001/0016427650","pubDate":"2026-11-07T10:52:17.169541+09:00","author":"네이버뉴스","description":"'강경 이민정책 설계자' 스티븐 밀러 낙점…민주당 반발·여권도 우려 트럼프, 중간선거 패배 사흘만에 비서실장 교체하며 기존 정책기조 고수 천명 밀러 \"힘이 국제질서 좌우\" 제국주의적 세계관…공세적 대외정책 우려 커져 스티븐 밀러 신임 백악관 비서실장 [AFP=연합뉴스. 재판매 및 DB 금지] (워싱턴=연합뉴스) 백나리 특파원 = 도널드 트럼프 미국 대통령이 중간선거 패배 사흘 만에 스티븐 밀러(41) 백악관 부비서실장을 비서실장에 낙점한 것은 중간선거 참패에도 '마이웨이'를 고수하겠다는 의지를 분명히 한 행보라는 평가다. '강경 이민정책의 설계자'이자 대외정책에 있어 제국주의적 시각을 보여온 최측근을 '최고위 호위무사'에 앉힘으로써 민심의 심판을 받은 핵심 정책을 내려놓지 않고 상·하원 권력을 접수한 민주당을 상대로 공세적 대응에 나서겠다는 뜻을 천명한 것으로 풀이된다. 트럼프 대통령이 6일(현지시간) 신임 백악관 비서실장으로 낙점해 발표한 밀러 부비서실장은 트럼프 행정부의 대표 정책인 강경 이민 단속의 설계자로 불린다. 미등록 이민자들을 대대적으로 체포하고 난민을 대거 추방하는 한편 미국 입국 문턱을 급격히 높인 강경 이민정책은 트럼프 대통령의 핵심 지지층에서 열렬한 호응을 받았다. 그러나 강도 높은 단속 과정에서 미국 시민권자들까지 잇따라 목숨을 잃고 중소 사업체와 농장을 운영하는 이들에게 경제적으로 큰 타격을 입히면서 트럼프 대통령의 이민정책은 중간선거 참패의 주된 요인 중 하나로 작용했다. 그럼에도 불구하고 밀러 부비서실장을 백악관 비서실장으로 승격시킨 데는 선거 압승에 힘입은 민주당의 공세를 맞대응으로 정면 돌파하겠다는 의도가 깔린 것이라는 분석이다. 트럼프 행정부의 대표 정책이 정당했다는 주장을 고수하며 민주당과의 충돌을 불사하겠다는 의지나 다름없어서 당분간 미국 국내 정치에 큰 혼란이 예상된다. 밀러 신임 실장은 진보적 이념을 공산주의로 몰아붙이고 다양성 정책 폐기를 비롯해 '좌파 척결'에도 앞장서 온 인사라 행정부와 민주당 간 협력 여지가 더욱 좁아질 수밖에 없다. 당장 민주당 지도부는 이번 인선을 \"최악의 선택\"이라 맹폭하며 밀러 신임 실장에 대한 의회 차원의 조사를 예고했다. 밀러 신임 실장의 관여 속에 추진되는 행정부 정책에도 맞서 싸우겠다는 입장도 분명히 했다. 트럼프 대통령 지켜보는 밀러 신임 실장 [AFP=연합뉴스. 재판매 및 DB 금지]","category":"세계"},{"title":"머스크 \"한 시대의 끝\"…테슬라 사이버트럭 단종 예고 무슨 일?","link":"https://n.news.naver.com/mnews/article/008/0005437912","naverLink":"https://n.news.naver.com/mnews/article/008/0005437912","pubDate":"2026-11-07T10:52:17.169539+09:00","author":"네이버뉴스","description":"미국 뉴욕시 차이나타운에서 테슬라 사이버트럭이 주행하고 있다. /로이터=뉴스1 테슬라의 전기차 사이버트럭이 저조한 판매량을 이어간 끝에 단종된다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 X(옛 트위터)를 통해 \"내년 중순 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄여나갈 예정\"이라며 \"사이버캡 생산을 위한 공간을 확보하기 위한 결정\"이라고 밝혔다. 텍사스 오스틴의 기가팩토리는 사이버트럭의 특수부품을 제조하는 유일한 시설이라는 점에서 생산축소는 사실상 단종을 뜻하는 것으로 풀이된다. 머스크 CEO도 \"한 시대의 끝\"이라고 밝혔다. 사이버트럭은 2019년 11월 첫 공개 당시 미래지향적인 스테인리스 외장과 파격적인 디자인으로 수십만대의 사전 예약을 모으며 화제를 낳았다. 하지만 복잡한 외장 가공과 스테인리스 강판 제어 문제 등으로 출시가 거듭 연기된 끝에 2023년 말에야 고객 인도가 시작되는 등 차질을 빚었다. 판매량도 기대를 밑돌았다. 테슬라는 당초 연간 판매량을 50만대로 예상했지만 실제 판매량은 연 2만대 안팎에 그쳤다. 자동차 데이터플랫폼 켈리 블루북에 따르면 지난해 판매량은 2만237대였다. 시장에선 계절별 주행거리 저하, 조립 품질 문제, 리콜 반복 등의 문제가 이어지면서 사이버트럭이 대중적인 보급형 모델로 자리잡지 못했다는 평가가 나온다. 기가팩토리의 사이버트럭 전용 라인은 차세대 자율주행 전용 차량인 '사이버캡' 양산에 투입될 전망이다. 판매실적이 부진한 픽업 전기 트럭 사업의 생산 여력을 자율주행 신사업으로 전격 전환하겠다는 구상이다.","category":"세계"},{"title":"트럼프, '대선 공신' 와일스 경질... '강경파' 밀러 전면 배치","link":"https://n.news.naver.com/mnews/article/469/0000964178","naverLink":"https://n.news.naver.com/mnews/article/469/0000964178","pubDate":"2026-11-07T10:52:17.169535+09:00","author":"네이버뉴스","description":"의회 내주고도 타협 대신 돌파 反이민 설계자 앞세운 백악관 미 백악관 비서실장에 발탁된 스티븐 밀러(오른쪽). EPA 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거 참패 사흘 만인 6일(현지시간) 수지 와일스 백악관 비서실장을 경질하고, 후임에 강경파 최측근인 스티븐 밀러 백악관 부비서실장을 발탁했다. 선거 패배에 따른 정책 기조 수정 대신 정권 내 최고 강경론자를 전면에 내세워 정면 돌파를 선택했다는 평가가 나온다. 트럼프 대통령은 이날 자신의 사회관계망서비스(SNS)인 트루스소셜을 통해 \"오는 9일부터 밀러 부비서실장이 백악관 비서실장을 맡게 된다\"고 발표했다. 트럼프 대통령은 밀러를 향해 \"내가 가장 신뢰하는 참모 중 한 명\"이라고 치켜세웠다. 와일스 실장에 대해선 \"훌륭한 일을 해냈고 감사하다\"며 \"트럼프 정치조직(Trump Political Operation)으로 자리를 옮길 것\"이라고 했다. 트럼프 대통령은 이후 백악관에서 기자들과 만나 \"변화를 주고 싶었다\"며 중간선거 패배에 따른 문책성 인사라는 점을 암시했다. 대선 일등공신의 퇴장… 예견된 불화설 도널드 트럼프 2기 미국 행정부의 백악관 비서실장에서 경질된 수지 와일스. AP 연합뉴스","category":"세계"},{"title":"지드래곤 마음도 훔친 차였는데…테슬라 '사이버트럭' 3년 만에 단종 수순","link":"https://n.news.naver.com/mnews/article/030/0003483161","naverLink":"https://n.news.naver.com/mnews/article/030/0003483161","pubDate":"2026-11-07T10:52:17.169533+09:00","author":"네이버뉴스","description":"테슬라의 전기차 픽업트럭인 '사이버트럭'. 사진=AP연합뉴스 테슬라가 야심 차게 내놓은 전기 픽업트럭 사이버트럭의 생산을 단계적으로 축소한다. 당초 연간 50만대 판매를 목표로 내세웠지만 실제 판매량이 기대에 크게 못 미친 데다, 회사가 자율주행 사업에 생산 역량을 집중하면서다. 일론 머스크 테슬라 최고경영자(CEO)는 6일(현지시간) 소셜미디어 엑스(X)를 통해 내년 중반부터 텍사스 기가팩토리에서 사이버트럭 생산을 단계적으로 줄일 계획이라고 밝혔다. 생산 공간은 차세대 자율주행 차량인 사이버캡 제조에 활용할 예정이다. 텍사스 오스틴 기가팩토리는 사이버트럭의 특수 부품을 생산하는 유일한 시설이다. 이에 따라 생산 축소는 사실상 모델 단종 수순으로 해석된다. 머스크 CEO 역시 관련 결정에 대해 '한 시대의 끝'이라고 언급했다. 2019년 11월 처음 공개된 사이버트럭은 스테인리스 스틸 외장과 파격적인 각진 디자인으로 자동차 업계의 주목을 받았다. 테슬라는 제너럴모터스(GM)와 포드가 주도해온 미국 픽업트럭 시장에 도전장을 내밀며 연간 판매량 50만대를 목표로 제시했다. 하지만 실제 시장 성과는 기대에 미치지 못했다. 복잡한 생산 공정과 부품 수급 문제 등으로 출시가 지연됐고, 2023년 말 고객 인도가 시작된 이후에도 판매 확대에 어려움을 겪었다. 자동차 데이터 업체 켈리 블루북에 따르면 지난해 사이버트럭 판매량은 2만237대에 그쳤다. 당초 제시한 연간 판매 목표의 4% 수준이다. 디자인에 대한 소비자 호불호와 높은 가격, 조립 품질 논란, 잇따른 리콜 등이 수요 확대의 걸림돌로 작용했다. 테슬라는 사이버트럭 생산 축소를 계기로 사업 전략의 무게중심을 전기차에서 인공지능(AI)과 자율주행으로 옮기고 있다. 사이버캡 양산을 확대하는 동시에 휴머노이드 로봇 옵티머스 개발과 생산에도 역량을 투입하는 모습이다. 앞서 테슬라는 캘리포니아 공장의 모델S와 모델X 생산을 중단하고 해당 공간을 옵티머스 생산시설로 전환하겠다는 계획도 공개했다. 이번 사이버트럭 생산 축소 역시 같은 맥락으로 풀이된다. 전기 픽업트럭 시장에서 기대했던 성과를 거두지 못하자 생산 자원을 자율주행과 로봇 등 차세대 사업으로 재배치하는 것이다. 사이버트럭은 테슬라가 전기차 시장의 외연을 넓히기 위해 내놓은 상징적인 모델이었다. 그러나 대량 생산과 대중적 수요 확보라는 과제를 해결하지 못한 채 생산 축소라는 결정을 맞게 됐다. 테슬라가 자동차 제조업체","category":"세계"},{"title":"트럼프, 백악관 비서실장 전격 교체…강경파 밀러 발탁","link":"https://n.news.naver.com/mnews/article/014/0005600755","naverLink":"https://n.news.naver.com/mnews/article/014/0005600755","pubDate":"2026-11-07T10:52:17.169531+09:00","author":"네이버뉴스","description":"트럼프, 백악관 비서실장 전격 교체…강경파 밀러 발탁. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만","link":"https://n.news.naver.com/mnews/article/016/0002720179","naverLink":"https://n.news.naver.com/mnews/article/016/0002720179","pubDate":"2026-11-07T10:52:17.169514+09:00","author":"네이버뉴스","description":"트럼프, 백악관 비서실장 교체…중간선거 참패 사흘만. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"세계"},{"title":"트럼프, 중간선거 참패 사흘 만에 비서실장 교체…강경파 밀러 낙점","link":"https://n.news.naver.com/mnews/article/082/0001406063","naverLink":"https://n.news.naver.com/mnews/article/082/0001406063","pubDate":"2026-11-07T10:52:16.443719+09:00","author":"네이버뉴스","description":"‘마이웨이’ 고수 의지 분명히…민주당 \"최악의 선택\" 반발, 여권도 우려 6일 미국 워싱턴 DC 백악관 부비서실장 스티븐 밀러(왼쪽)가 백악관 남쪽 잔디밭을 가로질러 ‘마린 원(대통령 전용 헬기)’에 탑승하기 위해 걸어가며 손을 흔들고 있다. AP 연합뉴스 도널드 트럼프 미국 대통령이 11·3 중간선거에서 공화당이 참패한 지 사흘 만인 6일(현지 시간) 수지 와일스 백악관 비서실장을 스티븐 밀러(41) 부비서실장으로 교체한다고 발표했다. 밀러 신임 실장은 오는 9일부터 업무를 시작한다. 트럼프 대통령은 소셜미디어 트루스소셜에서 밀러를 “내가 가장 신뢰하는 참모 중 하나”라고 소개했다. 와일스는 ‘트럼프 정치조직’으로 자리를 옮긴다고 밝혔으나, 이 조직의 성격이나 와일스의 역할은 설명하지 않았다. 트럼프 대통령은 기자들에게 와일스가 훌륭하게 일해왔다면서도 “변화를 주고 싶었다”고 말해 이번 인사가 선거 패배에 따른 개편임을 시사했다. 와일스는 엑스(X)에 “평생의 영광”이었다며 대통령과 사명에 대한 헌신은 변하지 않을 것이라고 밝혔다. 와일스는 2024년 대선 승리를 이끈 선거대책위원장 출신으로, 미 역사상 첫 여성 백악관 비서실장으로서 2기 행정부 출범 이후 백악관 운영을 총괄해왔다. 그러나 뉴욕타임스(NYT)는 트럼프 대통령이 최근 와일스를 주요 인사 결정에서 배제했고, 캐롤라인 레빗 전 대변인의 후임도 상의 없이 정했으며, 다른 참모들 앞에서 와일스를 비판하기도 했다고 전했다. 와일스 측은 대통령이 사실상 주도한 선거 전략의 실패 책임을 떠넘기려는 것이라고 반박했다. 지난 3월 16일 미국 워싱턴 DC 백악관 이스트룸에서 도널드 트럼프 미국 대통령이 케네디 센터 이사회 구성원들과 오찬을 하던 중 수지 와일스 백악관 비서실장 옆에 앉아 발언하고 있다. 로이터 연합","category":"세계"}],"IT 과학":[{"title":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러","link":"https://n.news.naver.com/mnews/article/138/0002247632","naverLink":"https://n.news.naver.com/mnews/article/138/0002247632","pubDate":"2026-11-07T10:52:17.645851+09:00","author":"네이버뉴스","description":"오픈AI 투자 유치 목표 축소…300억달러→최대 200억달러. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"\"美 데이터센터 멈춰 설 때\"…韓 기회 잡을까[AI 블루쇼크②]","link":"https://n.news.naver.com/mnews/article/003/0014307477","naverLink":"https://n.news.naver.com/mnews/article/003/0014307477","pubDate":"2026-11-07T10:52:17.645849+09:00","author":"네이버뉴스","description":"美 AI 데이터센터 규제 불확실성 확대…글로벌 투자처 변화 가능성 SK·GS·네이버, 초대형 AI 인프라 구축 추진…반도체·전력 등 산업 기반 주목 日·말레이시아와 아시아 허브 경쟁…구축 속도·전력·주민 수용성 과제 [서울=뉴시스]생성형 AI 확산으로 대규모 연산을 처리하는 AI 데이터센터(AIDC)가 통신업계의 새로운 성장동력으로 떠오르고 있다. (사진=SKT 뉴스룸) *재판매 및 DB 금지 [서울=뉴시스]심지혜 기자 = 미국 중간 선거 이후 인공지능(AI) 데이터센터 건설을 둘러싼 규제 불확실성이 커지면서 글로벌 AI 인프라 투자 환경에 커다란 지각변동이 예상된다. 미국 현지의 데이터센터 인허가와 건설이 당분간 지연될 가능성이 커졌다. 이에 따라 안정적인 전력과 우수한 산업 기반을 갖춘 한국이 글로벌 AI 인프라의 새로운 대안 투자·수요처로 부상할 수 있다는 기대가 나온다. 6일 국회 과학기술정보통신방송위원회 전체회의에서 황정아 더불어민주당 의원도 \" 지금이 우리가 AI 분야에서 패권을 목표로 치고 나갈 수 있는 골든타임 \"이라고 정부의 발빠른 대응을 주문한 것도 이같은 맥락에서다. 美 데이터센터 건설 급제동…韓, 새로운 투자·수요처 부상할까 지난 3일(현지 시간) 치러진 미국 중간선거에서 민주당이 압승하면서 AI 데이터센터 투자에 제동이 걸릴 가능성이 커지고 있다. 특히 대규모 데이터센터가 집중된 텍사스에서는 신규 데이터센터 건설 승인 중단을 주장해 온 민주당의 지나 히노호사 후보가 주지사에 당선되면서 관련 사업의 인허가와 투자 일정에도 영향을 미칠 수 있다는 관측이 나온다. 법무법인 율촌이 발간한 최신 보고서에 따르면, 미국 민주당의 의회 장악으로 대규모 전력망 확충 비용 부담을 둘러싼 규제 입법 논의가 확대될 것으로 전망했다. 다만 트럼프 대통령의 거부권과 민주당의 의석수 등을 고려하면 연방 차원의 규제 강화가 곧바로 현실화되기는 어려울 것으로 내다봤다. 여기에 AI가 글로벌 경제의 핵심으로 자리 잡은 만큼, 미국이 일시적으로 투자 속도를 조절하더라도 결국 투자를 확대할 것이라는 시각이 지배적이다. 하지만 미국 내 잡음은 한국에 절호의 반사이익 기회가 될 수 있다. 현지 건설 지연과 비용 증가에 직면한 글로벌 빅테크 기업들이 안정적인 전력과 부지를 찾아 해외로 눈을 돌릴 가능성이 높아서다. 이 같은 미국의 정책 변화는 한국에 새로운 반사이익 기회가 될 수 있다. 글로벌 빅테크 기업들이 안정적인 전력과","category":"IT 과학"},{"title":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]","link":"https://n.news.naver.com/mnews/article/003/0014307480","naverLink":"https://n.news.naver.com/mnews/article/003/0014307480","pubDate":"2026-11-07T10:52:17.645846+09:00","author":"네이버뉴스","description":"\"돈만 쏟아붓고 회수 막막\" 빅테크 경고등…\"위기론 과장\" 반론도[AI 블루쇼크③]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량","link":"https://n.news.naver.com/mnews/article/138/0002247633","naverLink":"https://n.news.naver.com/mnews/article/138/0002247633","pubDate":"2026-11-07T10:52:17.645844+09:00","author":"네이버뉴스","description":"미국 데이터센터 규제 강화, 한국엔 기회일까?…관건은 전력·가동 시점·미계약 용량. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'","link":"https://n.news.naver.com/mnews/article/001/0016427598","naverLink":"https://n.news.naver.com/mnews/article/001/0016427598","pubDate":"2026-11-07T10:52:17.645840+09:00","author":"네이버뉴스","description":"[AI돋보기] 한국도 일본도 뚫렸다…고객정보 샌 '작은 문'. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"美 뉴욕증시, AI 투매 진정…나스닥 1%대 반등, 반도체·데이터센터주 저가 매수","link":"https://n.news.naver.com/mnews/article/138/0002247634","naverLink":"https://n.news.naver.com/mnews/article/138/0002247634","pubDate":"2026-11-07T10:52:17.645838+09:00","author":"네이버뉴스","description":"[사진=연합뉴스] [디지털데일리 이상일기자] 미국 뉴욕증시가 6일(현지시간) 인공지능(AI) 반도체와 데이터센터 관련주 반등에 힘입어 혼조세로 마감했다. 전날 5.52% 폭락했던 나스닥 종합지수는 1.1% 올랐다. 다만 4주 연속 주간 하락은 피하지 못했다. 국제유가는 한 주 동안 약 13% 떨어졌다. 이날 뉴욕증시에서 기술주 중심의 나스닥 종합지수는 전장보다 264.43포인트(1.09%) 오른 24,579.42를 기록했다. 스탠더드앤드푸어스(S&P)500 지수는 전장보다 23.13포인트(0.31%) 상승한 7,376.86을 나타냈다. 다우존스30 산업평균지수는 237.33포인트(0.46%) 내린 51,285.73을 기록했다. 전날 AI 산업에 대한 규제 강화 우려로 기술주가 폭락한 이후 반도체주를 중심으로 저가 매수세가 유입됐다. 엔비디아와 AMD, 마이크론 등 주요 반도체주가 일제히 오르면서 상승세를 주도했다. S&P500 구성 종목 가운데 하락 종목이 상승 종목보다 많았다. 반등 배경으로는 중간선거 이후 커진 데이터센터 규제 우려가 다소 진정된 점이 꼽힌다. 민주당이 상·하원을 장악했지만 도널드 트럼프 대통령이 거부권을 쥐고 있어 연방 차원의 규제 입법에는 제약이 있다는 분석이다. 다만 전력·물 사용과 주민 부담을 둘러싼 지역별 규제 가능성은 남아 있다. 엔비디아(Nvidia)는 전날 9.3% 급락한 뒤 약 2.8% 올랐다. AMD, 인텔(Intel), 마이크론(Micron), 샌디스크(SanDisk)도 상승했다. 데이터센터·AI 컴퓨팅 사업자 아이렌(IREN)은 시장 예상을 웃돈 분기 실적과 신규 계약 발표로 약 20% 급등했다. 반도체 장비 기업 램리서치(Lam Research)는 최대 250억달러(약 37조원) 규모 자사주 매입 계획을 내놓으며 약 8% 올랐다. 코어위브(CoreWeave)도 반등했다. 로이터는 반도체주 반등이 AI 인프라 투자 기대가 유지되고 있음을 보여준다고 평가했다. 하루 반등으로 조정이 끝났다고 보기 어렵다는 신중론도 나왔다. 클라우드플레어(Cloudflare)는 3분기 매출이 7억8250만달러(약 1조1500억원)로 1년 전보다 39% 늘었다고 발표했다. 조정 주당순이익(EPS)은 0.38달러로 시장 예상을 웃돌았다. 연간 매출 전망은 29억6300만~29억6400만달러로 높였다. 반면 아틀라시안(Atlassian)은 실적 발표 뒤 하락했다. 고용지표는 반등 폭을 제한했다.","category":"IT 과학"},{"title":"오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소","link":"https://n.news.naver.com/mnews/article/009/0005760310","naverLink":"https://n.news.naver.com/mnews/article/009/0005760310","pubDate":"2026-11-07T10:52:17.645834+09:00","author":"네이버뉴스","description":"애초 300억달러 조달 추진 최대 200억달러로 낮춰 기업가치도 1조2500억달러로 하향 AI 투자 부담·데이터센터 규제 우려 오픈AI, 110억달러 조달…AI 거품 우려에 목표 축소 챗GPT 개발사 오픈AI가 기업가치 1조2500억달러(약 1705조원)를 인정받으며 110억달러(약 15조원)의 신규 투자금을 확보했다. 애초 300억달러 이상을 조달하려던 계획을 최대 200억달러로 축소하고 기업가치 목표도 낮췄다. 인공지능(AI) 산업의 막대한 투자 비용과 수익성에 대한 우려가 커지면서 오픈AI의 자금조달 전략에도 변화가 나타난 것이다. 6일(현지시간) 블룸버그에 따르면 오픈AI는 최근 추진해온 투자 유치에서 약 110억달러의 자금 납입을 완료했다. 이번 자금은 기업가치 1조2500억달러를 기준으로 조달됐으며 투자금은 이날 오픈AI에 입금됐다. 블룸버그는 익명을 요구한 관계자들을 인용해 전체 투자 유치 규모가 최대 200억달러이며 나머지 자금은 앞으로 수주 내 확보될 것으로 예상된다고 전했다. 오픈AI는 당초 기업공개(IPO)를 추진했으나 상장 계획을 연기한 뒤 한 달 넘게 대규모 투자 유치를 진행해왔다. 초기에는 기업가치를 1조4000억달러로 평가받으며 300억달러 이상을 조달하는 방안을 추진했다. 그러나 최근 미국 증시에서 AI 관련 기업들의 주가가 급락하자 투자 유치 규모와 기업가치 목표를 모두 낮췄다. 애초 계획과 비교하면 기업가치 목표는 1500억달러, 약 10.7% 하향 조정됐다. 자금조달 목표도 최소 300억달러에서 최대 200억달러로 줄어들었다. 목표액을 기준으로 최소 3분의 1을 축소한 셈이다. 이번 투자 유치는 오픈AI가 지난 3월 대규모 자금조달에 성공한 지 약 8개월 만에 이뤄졌다. 당시 오픈AI는 기업가치 8520억달러를 인정받아 1220억달러를 유치했다. 이번 투자 유치에 적용된 기업가치는 당시보다 3980억달러, 약 46.7% 높다. 다만 이번에 새로 설정된 1조2500억달러의 기업가치는 오픈AI가 기대했던 수준에는 미치지 못했다. 자금조달 계획이 축소된 배경에는 AI 산업을 둘러싼 투자심리 변화가 자리 잡고 있다. 최근 미국 증시에서는 AI 기업들이 막대한 자금을 데이터센터와 반도체 등 인프라에 쏟아붓고 있지만, 이러한 투자가 실제 수익으로 이어질 수 있을지를 놓고 의문이 커지고 있다. 여기에 미국 중간선거 이후 데이터센터 건설에 대한 규제가 강화될 가능성도 새로운 위험 요인으로 떠","category":"IT 과학"},{"title":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]","link":"https://n.news.naver.com/mnews/article/016/0002720154","naverLink":"https://n.news.naver.com/mnews/article/016/0002720154","pubDate":"2026-11-07T10:52:17.645824+09:00","author":"네이버뉴스","description":"“삼성·SK는 갈아탔는데”…솔리다임 ‘쉰 살’ 낸드 기술 고집 이유는? [칩칩팹팹]. 기사에서 관련 배경과 주요 내용을 확인할 수 있습니다.","category":"IT 과학"},{"title":"오일환 리젠이노팜 대표 “국내 첫 miRNA 신약 임상…당뇨발 재생 도전”","link":"https://n.news.naver.com/mnews/article/018/0006405430","naverLink":"https://n.news.naver.com/mnews/article/018/0006405430","pubDate":"2026-11-07T10:52:17.645820+09:00","author":"네이버뉴스","description":"이 기사는 2026년11월06일 07시00분에 팜이데일리 프리미엄 콘텐츠 로 선공개 되었습니다. 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 인터뷰를 진행했다. (사진=김새미 기자) [이데일리 김새미 기자] “기존 당뇨병성 족부궤양 치료제가 손상된 부위를 섬유성 조직으로 메우는 ‘복구’(Repair)에 초점을 맞췄다면 ‘PU001’은 정상 조직을 되살리는 ‘재생’(Renewal)을 목표로 합니다. 기존 당뇨병성 족부궤양 치료제와는 개념부터 다른데 이러한 접근은 마이크로RNA(miRNA)를 통해 세포의 줄기세포성(Stemness)을 자극하지 않고서는 근본적으로 불가능하다고 봅니다.” 오일환 리젠이노팜 대표는 지난달 30일 서울 서초구 소재 사무실에서 이데일리와 만나 이같이 말했다. 리젠이노팜은 오 대표가 2019년 설립한 신약개발 기업이다. 줄기세포를 직접 이식하는 대신 체내 세포가 지닌 재생 능력을 활성화하는 방식의 치료제를 개발하고 있다. 최근에는 당뇨병성 족부궤양 치료제 후보물질 ‘PU001’의 식품의약품안전처 임상시험계획(IND) 승인을 받았다. 회사는 연내 임상 1상에 착수하고 늦어도 내년 1월 첫 투약에 나설 계획이다. 줄기세포 이식 없이 조직 재생…miRNA ‘let-7’ 표적 오 대표는 PU001의 임상시험계획(IND) 승인으로 국내 최초의 miRNA 표적 신약이 임상 단계에 진입했다는 점에 의미를 부여했다. 글로벌 제약·바이오업계에서도 miRNA 관련 신약 개발이 이어지고 있지만 아직 상용화에 성공한 치료제는 없다. 리젠이노팜에 따르면 2008년부터 올해까지 임상에 진입한 miRNA 관련 치료제는 누적 17개다. 프랑스 아비박스는 궤양성 대장염 치료제 ‘오베파지모드’(Obefazimod)의 임상 3상을 마치고 신약허가신청(NDA)을 준비 중이다. 노보 노디스크는 심부전 치료제 ‘CDR132L’의 임상 2상을 진행하고 있으며, 노바티스는 지난 3월 ‘파라부르센’(Farabursen)의 임상 1b상을 완료했다. 단 오베파지모드는 miRNA 발현을 간접적으로 조절하는 저분자화합물로, miRNA에 직접 결합하는 치료제와는 기전이 다르다. PU001은 miRNA의 일종인 ‘let-7’을 표적으로 하는 합성 펩타이드 치료제로, 궤양 부위에 직접 분사하는 스프레이 제형으로 개발 중이다. miRNA는 여러 유전자의 발현을 동시에 조절하며 세포의 증식과 분화 등에 관여한다.","category":"IT 과학"},{"title":"모델 경쟁 너머 데이터에 승부수…행동지식으로 피지컬 AI 깨운다","link":"https://n.news.naver.com/mnews/article/243/0000105329","naverLink":"https://n.news.naver.com/mnews/article/243/0000105329","pubDate":"2026-11-07T10:52:17.645808+09:00","author":"네이버뉴스","description":"[AI 3강 개척자들]⑫황인호 바운드포 대표 데이터 위탁생산 넘어 판단 근거 연결하는 ‘행동지식’ 구현 위험하고 반복적인 인지·육체노동 AI가 대신하는 세상 만든다 황인호 바운드포 대표가 2025년 열린 패스트마켓 행사에서 데이터 원자재 애널리스트에게 데이터 유통에 대해 설명하고 있다. [사진 바운드포] [이코노미스트 원태영 기자] 글로벌 빅테크들이 거대언어모델(LLM) 경쟁을 벌이는 사이, 인공지능(AI)의 현장 적용한 필요한 ‘데이터’와 ‘행동지식’에 승부를 건 기업이 있다. AI 데이터 파운드리 기업 바운드포(BOUND4)다. 1995년생인 황인호 대표는 언론사와 공공기관, AI 기업을 거치며 AI 도입의 핵심이 모델뿐 아니라 데이터에 있다고 판단했다. 황 대표는 세종대에서 신문방송학과 졸업하고 서강대 경영학 석사를 거쳐 한양대 법학(지식재산) 박사과정을 수료했다. 기자로 사회생활을 시작해 AI 기업 씨이랩에서 데이터 사업과 기업공개(IPO) 실무 등을 경험했다. 이 과정에서 AI 산업의 성장 가능성을 확인했다. 그가 선택한 분야는 데이터였다. 막대한 자본이 필요한 모델 개발보다 현장 경험과 전문성이 중요한 데이터 사업에서 기회를 찾았다. 제조업과 IT 기반을 갖춘 한국이 글로벌 데이터 시장에서 경쟁력을 확보할 수 있다고 봤다. 황 대표는 2022년 바운드포 최대주주 겸 대표에 올라 2019년 설립된 데이터 구축 회사를 로봇 데이터 기업으로 전환했다. 한국지능정보사회진흥원(NIA)의 배송로봇 비도로 운행 데이터 구축 컨소시엄에 참여하며 사업 기반을 다졌다. 데이터 위탁생산 넘어 행동지식 플랫폼 '드로파이'로 바운드포는 고객의 AI 모델에 맞춰 데이터를 설계·수집·정제·가공·검수하는 파운드리 서비스를 제공한다. 핵심 경쟁력은 데이터의 판단·수정 과정과 근거를 지식그래프로 연결하는 ‘행동지식’ 기술이다. 이를 구현한 플랫폼이 ‘드로파이’(Dropi)다. 로봇·피지컬 AI 데이터에 집중한 배경에는 자동화 수요 확대와 기술 진입장벽이 있다. 고령화와 인력 부족으로 무인 기술의 중요성이 커지는 가운데, 제조업 로봇 밀도 세계 1위(1만명당 1220대)인 한국을 기술 검증에 유리한 시장으로 판단했다. 바운드포는 2022년 로봇 데이터에 이어 2025년 에이전틱 AI 데이터로 사업을 확장했다. 황 대표는 향후 5년 내 드로파이 중심의 AI 인프라 기업으로 성장한다는 목표다. 미·중 중심의 AI 시장에서 신뢰성을 앞세워","category":"IT 과학"}]},"popular":[{"title":"[�Ӻ�] �̷��������ǵ� ��ŷ������ 3800���������� 3��5000�� ���� ����","link":"https://n.news.naver.com/article/448/0000649560?ntype=RANKING","pubDate":"2026-11-07T10:52:21.377196+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":1},{"title":"�ѱ� �� ���� \"���� �� ������ 300% ����\"��Ʈ���� 'ȭǮ��'�� ����� '���'","link":"https://n.news.naver.com/article/448/0000649533?ntype=RANKING","pubDate":"2026-11-07T10:52:21.377219+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별 많이 본 뉴스에서 수집한 인기 기사임. 순위와 노출은 조회 시점에 따라 달라질 수 있음.","category":"네이버 인기","rank":2},{"title":"[�ܵ�] ����ö ����, ���� ��鼭 ���� �簳�� ���� ���ԡ����� ��Ȥ","link":"https://n.news.naver.com/article/448/0000649524?ntype=RANKING","pubDate":"2026-11-07T10:52:21.377228+09:00","author":"네이버 랭킹","description":"네이버 뉴스의 언론사별
